# What is this floor sitting against. 2026-09-19.
#
#     python tools/batch-prove.py tools/jobs/test-projject-touching-2026-09-19.yaml --dry-run --session 27244
#     python tools/batch-prove.py tools/jobs/test-projject-touching-2026-09-19.yaml --session 27244
#
# --session 27244 IS NOT OPTIONAL. It is the only Revit connected, and a job
# file carrying a stale session id aims at nothing.
#
# THE SETUP IS `select-in-region` AND NOT `select-by-category-name`, AND THAT
# IS THE WHOLE REASON THIS CAN BE ARRANGED. `target` is `Element` - ONE
# particular element - so the add-in binds `selected` only when Revit's
# selection holds EXACTLY ONE thing and refuses otherwise. This model has
# exactly one Floor, so a region query for Floors leaves exactly one.
#
# `select-by-category-name` would have been the obvious chain and is the wrong
# one: it uses a VIEW-SCOPED collector, the only view name this session can
# read back is `HERON ROOM TEST` - a MECHANICAL plan carrying a template and
# three filters - and whether a Floor draws there is a property of the view
# rather than of the model. A zero from a hidden category is indistinguishable
# from a model with none, which is the trap the rooms proof hit on this same
# model. `select-in-region` is not view-scoped and does not care.
#
# WHAT THE MODEL HOLDS - session 27244, `test projject`, 3,565 elements,
# counted MODEL-WIDE rather than in any view:
#
#   Floors     1 placed      <- the target, and the reason one binds
#   Walls     28 placed      <- the positive question
#   Ceilings   1 placed
#   Roofs      0 placed      <- the negative question
#
# THE NEGATIVE IS A REAL CATEGORY THIS MODEL GENUINELY HAS NONE OF, which is
# rule 2 read the right way round rather than a cleared input. A roof is a
# thing a floor could plausibly touch - in a single-storey building the roof
# sits on the same walls - so asking is a sensible question rather than a
# nonsense one, and the answer is honestly empty. The TARGET does not move
# between the legs: the same one floor is handed in both times, so anything
# that changes is the QUESTION and nothing else.
#
# THIS IS A READ. Nothing is written either way, and the session flag is about
# reading the right model rather than about safety.

model: test projject, Revit 2024, 3,565 elements

defaults:
  in: test projject

  # `select-in-region` AFTER ALL, AND IT IS THE NEW `setup-set:` THAT ALLOWS IT.
  # This chain was written first, refused by the dry run because its selector
  # need is called `categories` and so is `select-touching`'s question, and one
  # flat `set` could not hold both - FRAGMENT-ISSUES row 142. `setup-set:` gives
  # the chain its own values, so the collision is gone rather than dodged.
  #
  # AND THE DODGE HAD ITS OWN COST, WHICH IS WHY IT WAS NOT KEPT.
  # `select-by-category-name` does not collide, and it is VIEW-SCOPED: asked for
  # `Ceilings` in a FloorPlan it returned nothing, because ceilings do not draw
  # in a floor plan, and the refusal read "NOTHING is selected". `select-in-region`
  # is not view-scoped and does not care what the view shows.
  setup:
    - select-in-region
    - set-selection

  # THE CHAIN'S OWN VALUES. A box far larger than the building, so the region is
  # not the thing under test. Millimetres. `Ceilings` because this model has
  # EXACTLY ONE, and `target` binds `selected` only when Revit holds exactly one.
  setup-set:
    minMm: "-200000,-200000,-50000"
    maxMm: "200000,200000,100000"
    exact: false
    categories: Ceilings

  negative-setup-set:
    minMm: "-200000,-200000,-50000"
    maxMm: "200000,200000,100000"
    exact: false
    categories: Ceilings

jobs:

  - fragment: select-touching
    set:
      # `selected` MEANS EXACTLY ONE HERE. For a singular `Element` the add-in
      # binds the one element chosen and refuses if none or several are - the
      # opposite of a LIST need, where the same word means the whole selection.
      # Setting the Revit selection is not enough on its own: an earlier run
      # left one floor selected and was still refused with "'target (Element)'
      # is a value the CALLER supplies", because a need at `source: request`
      # has to be NAMED whatever is on screen.
      target: "selected"
      categories: "Ducts"
    negative-set:
      target: "selected"
      categories: "Roofs"
    # `elements` is what it FOUND. `findings` is prose about the search.
    expect: elements

# The proof of create-linear-dimension version 3 (CREATE_LINEAR_DIMENSION,
# FRG-VIEW-101), written 2026-10-15 for FRAGMENT-ISSUES row 5b-482 -
# NEEDS-CHECKING Group EF, rows EF1 to EF3. NOT RUN - written with Revit open
# on a real project that must not be written to.
#
#     python tools/batch-prove.py tools/jobs/create-linear-dimension-family-face-2026-10-15.yaml --dry-run
#     python tools/batch-prove.py tools/jobs/create-linear-dimension-family-face-2026-10-15.yaml
#
# WHAT VERSION 3 CHANGED. `between` takes two words more - `family ID WHICH`,
# a family instance's own reference, and `face ID SIDE`, an element's flat
# solid face toward a side of the view - and the same point given twice runs
# the string through that point. Version 2's proof ran grids in a plan only.
#
# MODIFY: both legs run inside a transaction group and are ROLLED BACK.
#
# THE MODEL - MAKE IT FIRST, in Revit 2020 (any release 2020 to 2027 will do).
# A NEW project, never a real one: the case that asked for this is a real
# project and is not written to.
#
#   1. THE BOX. A new family from "Metric Generic Model.rft" saved as "Heron
#      Dim Box": ONE extrusion on Ref. Level, its sketch a rectangle x -500 to
#      500 and y -150 to 150 mm round the two centre planes, Extrusion End
#      600 mm. NOTHING ELSE - no other reference plane, no parameter - so it
#      publishes only CenterLeftRight and CenterFrontBack, as the opening that
#      asked for this did (its Top and Bottom are FACES, and `face` is the
#      route to them).
#   2. A new project from the default metric template, NOT saved. Load "Heron
#      Dim Box" and place one in "FloorPlan: Level 1" at 0,0 on Level 1,
#      unrotated, with Elevation from Level 1200 mm: the box is then x -500 to
#      500, y -150 to 150, z 1200 to 1800 mm. Read its id (Manage > IDs of
#      Selection).
#   3. Grid "A" in the same plan: a straight vertical line at x = -2500 mm,
#      from y = -3000 to y = 3000 - 2000 mm from the box's left side.
#   4. A section named "Heron Dim Section": draw it from x = -4000 to x = 2000
#      at y = -1000, so it cuts in front of the box and LOOKS NORTH (+y) at it
#      - drawn left to right, its arrow points up the screen; flip it if not.
#      Its far clip must reach past y = 150. In it, left is -x and up is +z.
#
# EDIT BEFORE THE RUN - batch-prove has no way to fill these in:
#   - every BOXID below: the box's id from step 2
#   - `in:` below: the title Revit shows for the new project - "Project1",
#     "Project2" - as the title bar says it
#
# WHAT EACH VERDICT MEANS HERE:
#   - PASS: a dimension was made and read back on the positive, and the
#     negative made none. PASS does not check the NUMBERS - the next block does
#   - NEG NOT EMPTY: a dimension was drawn from words that should be refused -
#     a defect, not an arrangement fault
#
# WHAT TO READ BEYOND THE VERDICT - BATCH-PROVE CANNOT JUDGE THESE:
#   - EF1 measured "2500 mm": grid A to the box's centre plane
#   - EF1's negative names what the box publishes - CenterLeftRight and
#     CenterFrontBack among it - and offers `face BOXID left|right|top|bottom`
#   - EF2 measured "1200 mm + 600 mm": Level 1 to the box's bottom, then its
#     height, and a finding "The string runs through 700,-1000,1500 mm"
#   - EF3 measured "2000 mm + 1000 mm": grid A to the box's left face, then
#     the box's width
#   - EF2's negative says none of the references says which way the string
#     runs - near and far are seen edge-on in a section
#   - the second route (EF4): Revit's own Annotate > Aligned dimension picked
#     on the same faces in "Heron Dim Section", the values compared
#
# THE THREE JOBS WRITE ONE RUN RECORD. All three are this one fragment, so
# each overwrites brain/proof-drafts/runs/create-linear-dimension.json and
# the proof draft is the LAST - EF3, the face route, the one the real job
# needs most. Add `--report <a path in your temp folder>` to keep all three
# answers, and read EF1's and EF2's off it.
#
# NOT `--session` HERE: with two Revits connected to Heron - the real project
# is open in one - add `--session <process id>` to both commands, naming the
# Revit that has the new project.

model: 'a new, unsaved project from the default metric template with one "Heron Dim Box" (a Generic Model extrusion 1000 x 300 x 600 mm) at 0,0 on Level 1, 1200 mm up, grid A at x = -2500 mm, and the section "Heron Dim Section" looking north at it, Revit 2020'

defaults:
  in: "Project1"
  write: true
  set:
    view: "Heron Dim Section"
  # The negative inherits nothing from `set` - the view is said again.
  negative-set:
    view: "Heron Dim Section"

jobs:
  - fragment: create-linear-dimension
    expect: [created, measured]
    set:
      between: "grid A | family BOXID CenterLeftRight"
      lineFrom: "-3000,-1000,2600"
      lineTo: "1000,-1000,2600"
    negative-set:
      between: "grid A | family BOXID Left"
      lineFrom: "-3000,-1000,2600"
      lineTo: "1000,-1000,2600"
    note: >
      EF1 - the family route. Grid A to the box's own centre plane. The
      negative asks for a Left the box does not publish, as the opening on
      the real project did not, and must name what it does.

  - fragment: create-linear-dimension
    expect: [created, measured]
    set:
      between: "level Level 1 | face BOXID bottom | face BOXID top"
      lineFrom: "700,-1000,1500"
      lineTo: "700,-1000,1500"
    negative-set:
      between: "face BOXID near | face BOXID far"
      lineFrom: "700,-1000,1500"
      lineTo: "700,-1000,1500"
    note: >
      EF2 - one point given twice. The level to the box's bottom, then its
      height, run up through a point beside the box. The negative asks the
      same of two faces seen edge-on, which fix no direction in a section.

  - fragment: create-linear-dimension
    expect: [created, measured]
    set:
      between: "grid A | face BOXID left | face BOXID right"
      lineFrom: "-3000,-1000,2300"
      lineTo: "1000,-1000,2300"
    negative-set:
      between: "grid A | face BOXID up"
      lineFrom: "-3000,-1000,2300"
      lineTo: "1000,-1000,2300"
    note: >
      EF3 - the face route. Grid A to the box's left face, then its width,
      above the box. The negative names a side that is not one of the six.

# NEEDS-CHECKING Group JK - SET_ADAPTIVE_POINT_ORIENTATION, DRAFT since
# 2026-10-28. docs/needs-checking/group-jk.md is the whole plan; this file is
# its JK3 (the positive, rolled back) and JK4 (the negative).
#
#     python tools/batch-prove.py tools/jobs/set-adaptive-point-orientation.yaml --dry-run
#     python tools/batch-prove.py tools/jobs/set-adaptive-point-orientation.yaml
#
# THE MODEL is Group JK's rig (JK0), never a working family: a new family
# from the metric Generic Model Adaptive template with four placement points
# made and KEPT - PLACE_ADAPTIVE_POINTS "0,0,0; 1000,0,0; 1000,1000,0;
# 0,1000,0", pointKind "placement", through revit_change or by hand, never by
# a rolled-back proof run - SAVED as "Heron JK Orientation.rfa" in
# %TEMP%\heron-work\group-jk, left open in front, and each point's
# Orientation read in Properties by hand first: all four must read
# Instance (xyz), or the negative below is arranged on the wrong value.
#
# EVERY RUN HERE IS ROLLED BACK, so both phases meet the rig as JK0 left it.
#
# THE NEGATIVE IS A VALUE THAT MUST NOT BE TOUCHED, never a cleared one: the
# Orientation every point already reads, so nothing is written - changed 0,
# changedPoints empty, alreadySet 4.
#
# IF THE MODELLER TRIED IT ONCE AND KEPT IT (try-once, JK2), this file is not
# the route: the positive is that kept run, and the negative is the same
# value-already-held case on the model as it now is - every point at Host and
# Loop System (xyz) - by
#     python mcp/client/heron_bridge_client.py validate set-adaptive-point-orientation \
#         --write --kept --negative-set "orientation=Host and Loop System" --negative-set points=all

model: Heron JK Orientation (scratch Generic Model Adaptive family, four placement points), Revit 2020

defaults:
  write: true
  setup: []

jobs:
  - fragment: set-adaptive-point-orientation
    set:
      orientation: "Host and Loop System"
      points: "all"
    negative-set:
      orientation: "Instance"
      points: "all"
    expect: changed
    note: >
      JK3 and JK4. Positive: changed 4, changedPoints "point 1: Instance (xyz)
      -> Host and Loop System (xyz)" and the same for 2, 3 and 4,
      pointOrientations naming points 1 to 4 at Host and Loop System (xyz).
      Negative: changed 0, alreadySet 4, changedPoints empty, the finding
      "Every placement point asked for already reads Instance (xyz) - nothing
      was changed."

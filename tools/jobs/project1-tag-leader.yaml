# Re-proving the two tag fragments after the L-shape rebuild - 2026-09-21.
#
# WHY THIS EXISTS. Both were signed before the rebuild and check-docs reports
# them STALE, which is D-30 working. The version 1 proofs covered neither
# leaders, nor risers, nor a minimum length, so neither says anything about
# what these fragments now do.
#
# BOTH NEGATIVES ARE A DIFFERENT SELECTION, NOT A DIFFERENT VALUE. An earlier
# version of this file used a value-driven negative - the same ducts with
# leader=none - and batch-prove refused it NEG NOT EMPTY, correctly: it needs
# the negative leg empty of EVERY result, and `tagged` stays at 13 in that
# arrangement by design. The runner cannot express "this result holds while
# that one goes to zero", so the negative has to be a selection that genuinely
# produces nothing.
#
#   tag-elements-in-view      Walls - no tag category is mapped for them. The
#                                     map carries 17 entries and Walls is not
#                                     one, so every wall lands in notTagged.
#   force-tag-leader-lshape   Ducts - handed the ducts instead of their tags.
#                                     Its own version 1 negative had exactly
#                                     this shape: bent 0, notTags 307.
#
# NOTHING IS KEPT. `apply` is never sent, so each phase runs inside a
# TransactionGroup and is rolled back (D-55). Section 1c records rollback
# failing three times, so count the tags in the view afterwards rather than
# assuming it held.
#
# TAGTYPEHINTID IS DECLARED, SO IT HAS TO BE SAID. batch-prove refuses rather
# than defaulting a request value - "guessing it is how a job runs against the
# wrong thing and reports success". `none` means let the fragment choose: the
# caller hint, then the project default, then first loaded.
#
#     python tools/batch-prove.py tools/jobs/project1-tag-leader.yaml --dry-run
#     python tools/batch-prove.py tools/jobs/project1-tag-leader.yaml

model: "Project1 (Revit 2024) - view '1 - Mech' at 1:50, 26 ducts of which 8 are risers"

defaults:
  write: true
  in: "Project1"
  setup:
    - select-by-category-name
    - set-selection

jobs:
  # 26 ducts in; 8 risers and 5 runs under a metre deliberately left out; 13
  # tagged. The two skips are what this version added and both are reported by
  # name rather than quietly dropped.
  - fragment: tag-elements-in-view
    write: true
    set:
      categoryName:   Ducts
      inViewOnly:     "1 - Mech"
      view:           "1 - Mech"
      leader:         straight
      leaderOffsetMm: 8
      minLengthMm:    1000
      tagTypeHintId:  none
    negative-set:
      categoryName:   Walls
      inViewOnly:     "1 - Mech"
      view:           "1 - Mech"
      leader:         straight
      leaderOffsetMm: 8
      minLengthMm:    1000
      tagTypeHintId:  none
    expect: tagged

  # The duct tags: the ones lying across the sheet are bent, the ones lying up
  # it are left straight and keep their attached end. The negative hands it
  # the ducts themselves, which are not tags at all.
  - fragment: force-tag-leader-lshape
    write: true
    set:
      categoryName: "Duct Tags"
      inViewOnly:   "1 - Mech"
      view:         "1 - Mech"
      legMm:        10
    negative-set:
      categoryName: Ducts
      inViewOnly:   "1 - Mech"
      view:         "1 - Mech"
      legMm:        10
    expect: bent

# NEEDS-CHECKING Group PB - CREATE_FAMILY_FORMS version 5 (PB5, PB6): a
# profile that crosses or touches itself is refused before anything is made.
# Written 2026-11-21 in a cloud session with no Revit. NOT RUN.
#
#     python tools/batch-prove.py tools/jobs/pb-p1102-family-revit2020-2026-11-21.yaml --dry-run
#     python tools/batch-prove.py tools/jobs/pb-p1102-family-revit2020-2026-11-21.yaml --session <pid>
#
# THE MODEL, Revit 2020: "P1102 Family", the scratch copy of Revit 2020's own
# Samples\rac_advanced_sample_family.rfa in %TEMP%\heron-work\prove-1102 - a
# line-based Generic Model with 0 forms (tools/jobs/p1102-round4-2026-11-02.yaml),
# the family version 4's proof ran on, with its "Ref. Level". Group PB names a
# new family from Metric Generic Model.rft (Group OT's OT2/OT3 family) as
# well; that family's name was not recorded, so this file stays on the
# recorded one. Open it in the Family Editor; nothing else of the owner's in
# front. Never a working model.
#
# NO SETUP CHAIN: every input is the `forms` value. THE NEGATIVE IS A VALUE -
# a figure-of-eight with area, the profile crossing itself - never an empty
# list (fragment-proving, rules 2 and 5). Every run is ROLLED BACK: the
# family's form count must read 0 afterwards.
#
# One value is completed here: PB5's slot row in the group and the card's
# tests/cases.yaml names only its profile, so it takes the L row's own
# kind=extrusion workPlane=Ref. Level startMm=0 endMm=100 solid=true.

model: "P1102 Family (scratch copy of rac_advanced_sample_family.rfa, a line-based Generic Model with no forms), Revit 2020"

defaults:
  in: "P1102 Family"
  write: true
  setup: []

jobs:
  - fragment: create-family-forms
    expect: formCount
    set:
      forms: "kind=extrusion workPlane=Ref. Level profile=0,0; 600,0; 600,200; 200,200; 200,500; 0,500 startMm=0 endMm=100 solid=true kind=extrusion workPlane=Ref. Level profile=0,1000; 600,1000; arc 700,1100 600,1200; 0,1200; arc -100,1100 0,1000 startMm=0 endMm=100 solid=true"
    negative-set:
      forms: "kind=extrusion workPlane=Ref. Level profile=0,0; 400,400; 400,0; 0,200 startMm=0 endMm=100 solid=true"
    note: >
      PB6 - THE FIRST CASE TO RUN, the figure-of-eight: refused before
      anything is made - the row, "the profile crosses or touches itself",
      side 1 (from 0,0) and side 3 (from 400,0) named; formCount 0, the
      family's form count unchanged. Write down Revit's own message for it if
      a version 4 run is still to hand. PB5, the L and the slot of two arcs:
      formCount 2, both built and read back as version 4 would - neither
      refused as crossing itself. Group OT's OT1 and OT2 are owed on this card
      as well.

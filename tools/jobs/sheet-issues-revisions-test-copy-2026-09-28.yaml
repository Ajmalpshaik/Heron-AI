# The first proofs of the Sheet Issues/Revisions tools, 2026-09-28 -
# NEEDS-CHECKING Group BA, row BA2.
#
#     python tools/batch-prove.py tools/jobs/sheet-issues-revisions-test-copy-2026-09-28.yaml --dry-run
#     python tools/batch-prove.py tools/jobs/sheet-issues-revisions-test-copy-2026-09-28.yaml
#
# RUN ON TWO TEST COPIES OF "heron ai bulding", NEVER THE WORKING FILE. Every
# job here writes: `write: true` runs both legs inside a transaction group and
# ROLLS THEM BACK, so nothing should be kept - run LIST_REVISIONS afterwards
# rather than assuming it: rollback has failed before on this PC.
#
# THE TWO COPIES, MADE BY HAND BEFORE THE RUN AND BOTH OPEN IN ONE REVIT.
# Start from the working model as it stood at the end of 2026-09-28: ONE
# revision, Seq. 1 'Issued for Review' (unissued, shown on the seven sheets
# M-101 to M-107, numbered by 'Numeric', issued to Ajmal PS); sequences
# 'Numeric' (numeric) and 'Custom' (alphanumeric, used by nothing); numbered
# Per Sheet; arc length 20 mm.
#   "heron ai bulding test copy"   - in Manage > Sheet Issues/Revisions, Add
#       one revision: Description 'HERON PROOF second', Numbering 'Numeric',
#       Issued NOT ticked, date and issued to/by left blank. It lands as
#       Seq. 2, Revit names it "Seq. 2 - HERON PROOF second". Save.
#   "heron ai bulding issued copy" - Save As from the first, then tick
#       Issued on Seq. 2 and Save. Nothing else differs.
# Run LIST_REVISIONS on each and compare before the run: a copy that differs
# changes the answers.
#
# WHY BY HAND, AND NOT IN THE SETUP (row 5b-917). Until 2026-10-17 delete,
# move and merge made their second revision with a CREATE_REVISION setup step
# and then found it by description - but a step that changes the model runs
# AFTER every step that only reads, so the find ran first and found nothing.
# CREATE_REVISION hands on one id, `created`, and the tools take `elements`,
# so the find cannot be left out either. And a setup step that changes the
# model cannot be given values of its own (`setup-set:`); CREATE_REVISION and
# EDIT_REVISION share every value name, so one value list cannot serve both.
# `validate` refuses all of it now, before Revit is asked.
#
# THE REVISION COMES FROM A FIND, NEVER THE SELECTION. Each per-revision job
# runs SELECT_BY_PARAMETER_VALUE on the Revisions category first
# (`setup-set`), and `keep-chain` hands its answer to the tool under test.
# The find only reads, so it may take values of its own.
#
# THE ISSUED-REVISION NEGATIVE IS IN THE ISSUED COPY. No revision in the test
# copy is issued, so edit-revision's negative runs in the issued copy
# (`negative-in:`), on Seq. 2, and must be refused naming it - row 5b-412.
#
# `in:` NAMES THE TEST COPY, because two models are open and the one in front
# is a click away from being the other. With two Revits connected to Heron,
# add `--session <process id>` to both commands.

model: '"heron ai bulding test copy" and "heron ai bulding issued copy", both open, Revit 2024'

defaults:
  # MODIFY: both legs run inside a transaction group and are ROLLED BACK.
  write: true
  in: heron ai bulding test copy

jobs:
  # ---- the table's rows ---------------------------------------------------

  - fragment: create-revision
    expect: created
    set:
      description: HERON PROOF revision
      revisionDate: 28-09-2026
      issuedBy: Heron
      issuedTo: Ajmal PS
      show: tag
      numbering: Custom
      issueState: ""
    # An empty description: refused, and nothing created.
    negative-set:
      description: ""
      revisionDate: 28-09-2026
      issuedBy: Heron
      issuedTo: Ajmal PS
      show: tag
      numbering: Custom
      issueState: ""

  - fragment: edit-revision
    expect: changed
    setup:
      - select-by-parameter-value
    keep-chain: true
    # POSITIVE, in the test copy: Seq. 1 takes a new issued by.
    setup-set:
      parameterName: Revision Sequence
      matchText: "1"
      matchMode: equals
      includeTypeParameters: "false"
      categories: Revisions
    set:
      description: ""
      revisionDate: ""
      issuedBy: HERON PROOF
      issuedTo: ""
      show: ""
      numbering: ""
      issueState: ""
      confirmCount: ""
    # NEGATIVE, in the issued copy: the same edit on Seq. 2, which is ISSUED
    # there, must be refused naming the revision and "issued by", with
    # `changed` empty - row 5b-412.
    negative-in: heron ai bulding issued copy
    negative-setup-set:
      parameterName: Revision Description
      matchText: HERON PROOF second
      matchMode: equals
      includeTypeParameters: "false"
      categories: Revisions
    negative-set:
      description: ""
      revisionDate: ""
      issuedBy: HERON PROOF
      issuedTo: ""
      show: ""
      numbering: ""
      issueState: ""
      confirmCount: ""

  - fragment: delete-revision
    expect: deleted
    setup:
      - select-by-parameter-value
    keep-chain: true
    setup-set:
      parameterName: Revision Description
      matchText: HERON PROOF second
      matchMode: equals
      includeTypeParameters: "false"
      categories: Revisions
    # confirm is Revit's own name for the revision - or its element id. A bare
    # sequence number is refused since the review of 2026-09-28.
    set:
      confirm: Seq. 2 - HERON PROOF second
    # No confirm: refused, nothing deleted (Article 7).
    negative-set:
      confirm: ""
    # THE SAME ARRANGEMENT FOR THE NEGATIVE, SPELLED OUT: without it the
    # runner hands the chain the negative-set instead (row 5b-242).
    negative-setup-set:
      parameterName: Revision Description
      matchText: HERON PROOF second
      matchMode: equals
      includeTypeParameters: "false"
      categories: Revisions

  - fragment: reorder-revision
    expect: moved
    setup:
      - select-by-parameter-value
    keep-chain: true
    setup-set:
      parameterName: Revision Description
      matchText: HERON PROOF second
      matchMode: equals
      includeTypeParameters: "false"
      categories: Revisions
    set:
      direction: up
    # Seq. 1 up: already first, nothing moved. The find takes the FIRST one.
    negative-setup-set:
      parameterName: Revision Sequence
      matchText: "1"
      matchMode: equals
      includeTypeParameters: "false"
      categories: Revisions
    negative-set:
      direction: up

  - fragment: merge-revision
    expect: merged
    setup:
      - select-by-parameter-value
    keep-chain: true
    setup-set:
      parameterName: Revision Description
      matchText: HERON PROOF second
      matchMode: equals
      includeTypeParameters: "false"
      categories: Revisions
    set:
      direction: up
      confirm: Seq. 2 - HERON PROOF second
    # confirm=2, the bare number: refused, nothing merged - a number cannot
    # tell this revision from whichever holds that number after a renumber.
    negative-set:
      direction: up
      confirm: "2"
    # THE SAME ARRANGEMENT FOR THE NEGATIVE, SPELLED OUT: without it the
    # runner hands the chain the negative-set instead (row 5b-242).
    negative-setup-set:
      parameterName: Revision Description
      matchText: HERON PROOF second
      matchMode: equals
      includeTypeParameters: "false"
      categories: Revisions

  # ---- the project-wide settings ---------------------------------------------

  - fragment: set-revision-settings
    expect: changed
    set:
      numbering: per project
      arcLengthMm: "12.5"
    # The values the model already holds: `changed` empty, both in
    # `alreadyThat`.
    negative-set:
      numbering: per sheet
      arcLengthMm: "20"

  # ---- Customize Numbering ---------------------------------------------------

  - fragment: create-revision-numbering-sequence
    expect: created
    set:
      name: HERON PROOF Alpha
      numberType: alphanumeric
      copyFrom: ""
      minimumDigits: ""
      startingNumber: ""
      prefix: ""
      suffix: ""
      customSequence: A, B, C
    # A name the copy already has: refused, nothing created.
    negative-set:
      name: Numeric
      numberType: numeric
      copyFrom: ""
      minimumDigits: ""
      startingNumber: ""
      prefix: ""
      suffix: ""
      customSequence: ""

  - fragment: edit-revision-numbering-sequence
    expect: changed
    set:
      name: Custom
      newName: HERON PROOF Renamed
      minimumDigits: ""
      startingNumber: ""
      prefix: R-
      suffix: ""
      customSequence: ""
    # Values it already holds: `changed` empty, both in `alreadyThat`.
    negative-set:
      name: Numeric
      newName: ""
      minimumDigits: "1"
      startingNumber: "1"
      prefix: ""
      suffix: ""
      customSequence: ""

  - fragment: delete-revision-numbering-sequence
    expect: deleted
    set:
      name: Custom
      confirm: Custom
    # 'Numeric' numbers Seq. 1 and Seq. 2: refused, naming them.
    negative-set:
      name: Numeric
      confirm: Numeric

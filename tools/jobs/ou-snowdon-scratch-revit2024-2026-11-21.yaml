# NEEDS-CHECKING Group OU - AUTO_SIZE_MEP version 2 (DRAFT), row OU19: the
# unit check now STOPS the run - a flow this card's factor reads differently
# from Revit's own conversion sizes NOTHING (WN-2, issue #1005). Built
# 2026-11-21 in a cloud session with no Revit. NOT RUN.
#
#     python tools/batch-prove.py tools/jobs/ou-snowdon-scratch-revit2024-2026-11-21.yaml --dry-run
#     python tools/batch-prove.py tools/jobs/ou-snowdon-scratch-revit2024-2026-11-21.yaml --session <pid>
#
# THE MODEL is "Snowdon-scratch_ajmal.al", Revit 2024 - the scratch copy
# version 1 was proved on (proof block of brain/fragments/auto-size-mep/
# fragment.yaml, 2026-09-09, session 17356), never a working model. OU19 asks
# Revit 2020 first and then 2024 on "a branch carrying 500 L/s"; no model
# with such a branch, and no id for one, is recorded anywhere, so the 2020 leg
# needs the model's own name and the branch's id and is not in this file.
# This is OU19's 2024 leg, on the ducts version 1 was proved on.
#
# THE ARRANGEMENT - every id below is from version 1's own proof record, on
# this model, so none is guessed:
#   positive  ducts 1447716 and 1447725 - version 1 sized both
#             "203 -> 200 mm round, 94.4 L/s" from the FloorPlan: M1 set of 22
#   negative  ducts 1448416, 1448425 and 1448439 - three of the 16 version 1
#             put in `noFlow` from the same set: ducts carrying NO flow, the
#             negative the owner accepted for signing (OU19, 2026-11-20). A
#             DIFFERENT selection, never an empty one (rules 3 and 5)
# Two and three ducts, not 22 (rule 1). filter-elements-by-id hands them on,
# so `keep-chain: true`, and the negative leg's chain has its own ids
# (`negative-setup-set`). If an id no longer names a duct in the copy,
# filter-elements-by-id refuses the whole call naming it - DID NOT RUN, nothing
# sent to the card; then the ids are read again from FloorPlan: M1 and typed
# here, never the card changed.
#
# The values are version 1's proof values: 5 m/s, round 100-400, rect 200-500,
# holdWidth false. Every run is ROLLED BACK. ONE job - a run record is kept
# per card.
model: "Snowdon-scratch_ajmal.al - the scratch copy of the Snowdon Towers HVAC sample version 1 was proved on, Revit 2024"
defaults:
  in: "Snowdon-scratch_ajmal.al"
  write: true
jobs:
  - fragment: auto-size-mep
    expect: sized
    setup: [filter-elements-by-id]
    keep-chain: true
    setup-set: {elementIds: "1447716, 1447725"}
    negative-setup-set: {elementIds: "1448416, 1448425, 1448439"}
    set:
      targetVelocity: 5
      roundSizesMm: "100,150,200,250,300,400"
      rectSizesMm: "200,300,400,500"
      holdWidth: false
    negative-set:
      targetVelocity: 5
      roundSizesMm: "100,150,200,250,300,400"
      rectSizesMm: "200,300,400,500"
      holdWidth: false
    note: >
      OU19 on 2024. READ THE BINDING NOTE FIRST - "elements from
      filter-elements-by-id (2)" and "(3)" (rule 5). Positive: the FIRST
      finding "UNIT CHECK on 1447716: internal ... read as 94.4 L/s, the same
      as Revit's own conversion ... checked before any size was written";
      sized 2, each "203 -> 200 mm round"; `refused` EMPTY. A `refused`
      naming the unit check with nothing sized is the check failing on a real
      model - a finding, not an arrangement fault. Negative: sized 0, all three
      in noFlow, nothing written. OU19's disagreeing factor cannot be arranged
      in a model - held by reading the code; say so when signing.

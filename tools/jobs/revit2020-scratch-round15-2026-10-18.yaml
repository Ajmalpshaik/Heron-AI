# Batch 15, 2026-10-18 - Revit 2020 session 2648, scratch Project1 (never saved). Batch 14's
# model plus, kept: two M_Duplex Receptacle sockets on the south wall's inside face at x=2000 and
# x=7000, 300 mm up (PLACE_FAMILY_ON_FACE), on one power circuit that Revit would not assign to

    expect: wireIds
    set: {categoryName: "Electrical Fixtures", inViewOnly: "FloorPlan: Level 1", view: "FloorPlan: Level 1", pointsMm: "", wireType: "", wiringStyle: "arc", snapMm: 300}
    negative-set: {categoryName: "Walls", inViewOnly: "FloorPlan: Level 1", view: "FloorPlan: Level 1", pointsMm: "", wireType: "", wiringStyle: "arc", snapMm: 300}

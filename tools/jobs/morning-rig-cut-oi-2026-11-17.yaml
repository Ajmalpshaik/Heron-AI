# NEEDS-CHECKING Group OI - OI21-OI22: cut-geometry and report-geometry-cuts on the rig, with a void family
# RUN 2026-11-17 on Revit 2024 (session 34788, add-in 80819edd3983a0d5), every job
# rolled back; results in docs/needs-checking/group-oi.md. The kept steps that
# made the model are listed there. HERON_CLIENT_ID set; HERON_CONVERSATION_ID unset.
#
#     python tools/batch-prove.py <this file> --dry-run
#     python tools/batch-prove.py <this file> --unattended --session <pid>

model: rig
defaults:
  in: rig
  write: true
jobs:
- fragment: cut-geometry
  keep-chain: true
  expect: changed
  setup:
  - select-in-region
  - set-selection
  - filter-elements-by-id
  set:
    minMm: 30900,30900,-500
    maxMm: 31100,31100,1500
    exact: false
    categories: Generic Models
    elementIds: '352528'
    cutter: selected
    cut: 'true'
  negative-set:
    minMm: 30900,30900,-500
    maxMm: 31100,31100,1500
    exact: false
    categories: Generic Models
    elementIds: '352528'
    cutter: selected
    cut: 'false'
  note: 'Positive: changed 1, pairs "Floors Generic 150mm (id 352528): cut by Generic Models HN Cut Void (id ...)
    (void cut) - read back: cut", and "QUANTITIES HAVE MOVED". Negative (a VALUE negative - the same pair, cut false,
    and it is not cut): changed 0, S2 in alreadyRight "not cut by ... - left alone". IF THE POSITIVE READS "already
    cut by ... - left alone" (alreadyRight 1, changed 0), Revit cut S2 when the void was placed: SWAP the two `cut`
    values and run again (positive "false" -> changed 1 "uncut from"; negative "true" -> alreadyRight). "cannot
    cut anything: it is not a family with a void that cuts when loaded" means the CUTTER is not eligible (the flag
    or the void did not hold - read PLAN.md A2/A3''s replies). "Revit does not let ... cut it - a void family cannot
    cut this element" means the PAIR is not.

    '
- fragment: report-geometry-cuts
  keep-chain: true
  expect: cuts
  setup:
  - select-in-region
  - set-selection
  - filter-elements-by-id
  - cut-geometry
  set:
    minMm: 30900,30900,-500
    maxMm: 31100,31100,1500
    exact: false
    categories: Generic Models
    elementIds: '352528'
    cutter: selected
    cut: 'true'
  negative-set:
    minMm: 30900,30900,-500
    maxMm: 31100,31100,1500
    exact: false
    categories: Generic Models
    elementIds: '352528'
    cutter: selected
    cut: 'false'
  note: 'LW4 with the cut made INSIDE the rolled-back run (no PROVEN card makes a cut; cut-geometry is DRAFT and
    cannot be kept). Three reads first, the change step last (row 5b-917); the cut step takes the PHASE''s own values,
    so there is no setup-set. Elements: S2 alone. Positive: cuts "... (352528) is CUT BY ... HN Cut Void ... - a
    void family". Negative: cut false leaves S2 uncut - cuts empty, withoutCuts 1. If cut-geometry''s own positive
    above did not cut, this result says nothing about report-geometry-cuts. If cut-geometry needed its legs swapped
    (Revit cut S2 at placement), keep THIS job as written: cut "true" leaves S2 cut and cut "false" takes the cut
    away, so the positive still has a cut and the negative none.

    '

# NEEDS-CHECKING Group KQ - REPORT_REBAR_NUMBERING, built 2026-11-01 in a
# cloud session with no Revit. NOT RUN.
#
#     python tools/batch-prove.py tools/jobs/report-rebar-numbering-kq-2026-11-01.yaml --dry-run
#     python tools/batch-prove.py tools/jobs/report-rebar-numbering-kq-2026-11-01.yaml
#
# THE MODEL is a scratch copy of Group HY's project (docs/needs-checking/group-hy.md)
# - new from Revit's metric STRUCTURAL template, %TEMP%\heron-work\rebar-hy -
# after HY6 and HY8 are kept, saved as "rebar-numbering-kq". Never a working
# model. By hand before the run (KQ1): C1's three rebar sets given Partition
# "P1", B1's three sets Partition "B2"; then in Structure > Reinforcement >
# Reinforcement Numbers, partition P1, one number changed to 9, so P1 has a
# gap. Write down what the dialog shows for both partitions - the second route.
#
# THE ARRANGEMENT: this read takes no selection in the job (`elements` is
# optional and binds empty), so `setup: []`. The negative is a DIFFERENT VALUE
# - a partition name the model does not have - never an empty one
# (fragment-proving, rule 5): partitions 0, and the finding names "B2" and "P1".

model: "rebar-numbering-kq scratch copy of rebar-hy (metric structural template) after HY6 and HY8 kept, C1 in partition P1 with a gap, B1 in partition B2, Revit 2020"

jobs:
  - fragment: report-rebar-numbering
    expect: partitions
    setup: []
    set:
      partition: "B2"
    negative-set:
      partition: "Z9"
    note: >
      KQ2. Negative - THE FIRST CASE TO RUN: partition Z9, so partitions 0,
      numberedElements 0, report empty, findings "No partition is named \"Z9\"
      in this model. Its partitions are: \"B2\" (rebar), \"P1\" (rebar)."
      Positive - partitions 1, numberedElements 3, report "Rebar partition
      \"B2\": numbers ..." as the Reinforcement Numbers dialog shows B2, no
      gaps; P1 nowhere in the answer.

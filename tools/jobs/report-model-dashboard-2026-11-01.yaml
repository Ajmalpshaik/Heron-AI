# The first proof of report-model-dashboard (REPORT_MODEL_DASHBOARD,
# FRG-QA-037): the whole open project counted part by part, for the Heron
# Companion's Model Dashboard. NEEDS-CHECKING Group JT.
#
#     python tools/batch-prove.py tools/jobs/report-model-dashboard-2026-11-01.yaml --dry-run
#     python tools/batch-prove.py tools/jobs/report-model-dashboard-2026-11-01.yaml
#
# THE ARRANGEMENT, made by hand before the run, in Revit 2024 - copies only,
# never a working model:
#
#   "Snowdon Towers Sample HVAC"   a FRESH copy of the sample project - its
#                                  readers answered on 2026-09-13: 145
#                                  warnings in 5 kinds, 6 links all loaded, 7
#                                  views on no sheet, 17 sheets. The positive
#   "Family1"                      any family document, open beside it - a new
#                                  Generic Model family will do. The negative
#
# Both open at the run; `in:` brings each to the front. It needs `doc` only,
# so there is no selection to arrange and nothing to clear.
#
# POSITIVE: elementTotal above 0, equal to the sum of the categories'
# instances; notRead empty; warnings.total 145; links six rows, each loaded.
# Read the dashboardJson the run quotes - the runner judges elementTotal
# alone (dashboardJson and findings are accounting, always written).
#
# NEGATIVE: the family - elementTotal 0, sectionsNotRead 14, every part null
# and named "not a project", fill among them. Not one of Snowdon's numbers may
# appear: that is what shows it read the document it was sent to, with
# another one open.
#
# VERSION 2 (2026-11-01): both legs send parameters "Mark", so the positive
# also carries the fill part - a row per category for Mark, each row's four
# counts summing to the category's instances. Before the run, type "AHU-01" in
# one mechanical equipment item's Mark and clear another's (Group JT row JT10).
#
# BY HAND AFTERWARDS (Group JT rows JT4 to JT8, JT11 to JT14): each part beside
# its own reader, a workshared copy with one workset closed, a new empty
# project, and the fill part's own cases - the made-up name all absent.

model: Snowdon Towers Sample HVAC (fresh copy) and Family1, Revit 2024

jobs:
  - fragment: report-model-dashboard
    expect: elementTotal
    in: "Snowdon Towers Sample HVAC"
    negative-in: "Family1"
    set:
      parameters: "Mark"
    negative-set:
      parameters: "Mark"
    note: >
      Positive - elementTotal above 0, the categories' instances summing to
      it, notRead empty, warnings.total 145 in 5 kinds, six links loaded;
      fill.parameters ["Mark"], AHU-01 populated and the cleared Mark's id in
      the Mechanical Equipment row's emptyIds. Negative - elementTotal 0,
      sectionsNotRead 14, the family's title in the model block with isFamily
      true and every other part null, fill too.

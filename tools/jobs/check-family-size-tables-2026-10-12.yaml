# The first proof of check-family-size-tables (CHECK_FAMILY_SIZE_TABLES,
# FRG-ELE-078) version 2: every size_lookup formula in the family open in
# front checked against the lookup tables it names - the table, per type, the
# column, and a row for each type's size.
#
#     python tools/batch-prove.py tools/jobs/check-family-size-tables-2026-10-12.yaml --dry-run
#     python tools/batch-prove.py tools/jobs/check-family-size-tables-2026-10-12.yaml
#
# THE ARRANGEMENT, made by hand before the run, on Revit 2024, on TEST COPIES
# only - never a working family:
#
#   "Heron Lookup Clean"   a Generic Model family (metric) with one lookup
#                          table "HeronSizes": a first column of row names,
#                          then Size##length##millimeters,
#                          Width##length##millimeters and
#                          Depth##length##millimeters, rows for Size 20, 25
#                          and 32. TYPE parameters: "Size" (Length), and
#                          "Lookup Table Name" (Text) = HeronSizes. Width =
#                          size_lookup(Lookup Table Name, "Width", 10 mm,
#                          Size) and Depth the same with "Depth". Three types,
#                          A, B and C, Size 20, 25 and 32. Flex every type in
#                          Family Types first: no Width or Depth may sit at
#                          10 mm - the negative
#   "Heron Lookup Broken"  a copy of it, saved under this name, with type B's
#                          Size changed to 33 (no row), type C's "Lookup Table
#                          Name" changed to "NoSuchTable", and Depth's formula
#                          asking for "NoSuchColumn" - the positive
#
# Both open in the Family Editor at the run; `in:` brings each to the front.
#
# POSITIVE: problemCount 3 or more - a NO ROW line naming type B, HeronSizes,
# "Size = 33" and 'Width'; a MISSING TABLE line naming type C and
# "NoSuchTable" (and NOT A or B); a MISSING COLUMN line naming 'Depth' and
# listing the table's real columns. Type A in none of them.
#
# NEGATIVE: the clean copy - problemCount 0 with lookupsChecked AND
# rowSearches NON-ZERO. A correct lookup must NOT be flagged (D-30).
#
# BY HAND AFTERWARDS: with a PROJECT in front, notAFamily true and
# problemCount 0. Flex type B: Width falls to 10 mm, which is what NO ROW
# says will happen. And any pipe fitting keyed on its instance Nominal
# Diameter: a ROWS NOT CHECKED note, no NO ROW line.

model: Heron Lookup Broken (one type's size has no row, one type names a table not in the family, one column misspelt) and Heron Lookup Clean, Revit 2024

jobs:
  - fragment: check-family-size-tables
    in: "Heron Lookup Broken"
    negative-in: "Heron Lookup Clean"
    expect: problemCount
    note: >
      Read the clean family's problemCount BEFORE the run - it must be 0. If
      it is not, the arrangement is wrong, not the fragment: fix the family
      and read it again.

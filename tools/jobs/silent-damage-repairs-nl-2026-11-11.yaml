# Three cards that were PROVEN, change the model, and could report a wrong
# result as a success - repaired in code on 2026-11-11, each back to DRAFT,
# one job each for the proof it now owes. NEEDS-CHECKING Group NL has the rows.
#
#   set-routing-preference  SET_ROUTING_PREFERENCE  FRG-MEP-046  version 2  rows 5b-1120, 5b-1549  NL1 - NL4
#   add-project-parameter   ADD_PROJECT_PARAMETER   FRG-PAR-010  version 3  row 5b-1127            NL5 - NL8
#   create-assembly         CREATE_ASSEMBLY         FRG-ELE-080  version 2  rows 5b-1117, 5b-1553  NL9 - NL10
#
#     python tools/batch-prove.py tools/jobs/silent-damage-repairs-nl-2026-11-11.yaml --dry-run
#     python tools/batch-prove.py tools/jobs/silent-damage-repairs-nl-2026-11-11.yaml --session <pid>
#
# NOTHING HERE HAS RUN. Written 2026-11-11 in a cloud session with no Revit:
# each card compiles on every release it declares, and a compile is not a
# proof.
#
# THE MODEL IS THE ONE THE 2026-11-02 ROUNDS USED, so nothing new is arranged:
# on Revit 2020, "P1102 MEP" - the scratch copy of
# Samples\rme_advanced_sample_project.rvt under %TEMP%\heron-work\prove-1102 -
# and, beside it in that folder, heron-p1102-shared.txt, the shared parameter
# file ADD_PROJECT_PARAMETER was proved on that day (group HERON, parameter
# HERON_P1102_TAG). NEVER A WORKING PROJECT. If either has gone, make the copy
# again; NL8 in Group NL says how a new file is made.
#
# TWO VALUES BELOW ARE MY ASSUMPTION OF WHAT THAT SAMPLE HOLDS, because no
# session here has read it. Read both in Revit before the run, and type what
# Revit shows. THE DRY RUN DOES NOT CATCH A WRONG NAME.
#   - set-routing-preference's positive `partName`. It must be an ELBOW the
#     duct type's Elbows rule 0 does NOT point at now, written "Family: Type".
#     REPORT_ROUTING_PREFERENCES on the duct type says what rule 0 points at;
#     SELECT_TYPES with categories "Duct Fittings" prints every loaded fitting
#     as "Family : Type" - either spelling is taken.
#   - "Standard", its negative. It has to be the type name of TWO OR MORE
#     loaded families - the same SELECT_TYPES answer shows whether it is. If
#     only one family has it, pick a type name two do; if none do, load any
#     second fitting family whose type is called the same (row 5b-1120 used
#     M_Rectangular Elbow - Mitered and M_Balancing Damper - Rectangular).
#
# `write: true` runs each leg inside a transaction group and ROLLS IT BACK.
# Look at the model afterwards anyway - rollback has failed on this PC before
# (BD1). A shared parameter file is NOT rolled back: it is a file on disk.

model: "P1102 MEP (a scratch copy of the Revit 2020 sample rme_advanced_sample_project), Revit 2020"

defaults:
  in: "P1102 MEP"
  setup: []
  write: true

jobs:
  # ------------------------------------------------------------ 5b-1120, 5b-1549
  # POSITIVE: the duct type's Elbows rule 0 pointed at another elbow, named as
  # Revit's type selector writes it. NEGATIVE: the SAME type and rule, the part
  # named by a type name two loaded families share - refused, nothing changed,
  # each of them listed in `nearMisses` as "Family: Type". Version 1 answered
  # "No Elbows part is called ..." to the first and bound whichever "Standard"
  # the collector met first to the second.
  - fragment: set-routing-preference
    setup: [select-types, set-selection]
    expect: rulesChanged
    setup-set: {categories: "Ducts", familyNameContains: "Rectangular Duct", typeNameContains: "Mitered Elbows / Tees"}
    negative-setup-set: {categories: "Ducts", familyNameContains: "Rectangular Duct", typeNameContains: "Mitered Elbows / Tees"}
    set: {group: "Elbows", partName: "Rectangular Elbow - Radius: 1.5 W", ruleIndex: 0}
    negative-set: {group: "Elbows", partName: "Standard", ruleIndex: 0}
    note: >
      READ THE BINDING NOTE: "elements from set-selection (1)" - one duct type.
      Positive: `findings` names the old and the new elbow as "Family: Type"
      and the size windows carried across. Negative: `findings` says the name
      does not say which one is meant, and `nearMisses` holds two or more -
      "No Elbows part is called 'Standard'" there would mean no loaded family
      has that type, and the negative proved nothing. The refused swap that is
      PUT BACK (row 5b-1549) is not either leg: it is NL3, run by name.

  # ------------------------------------------------------------------- 5b-1127
  # ADMIN: no batch sends it (D-106). The dry run prints the command to run it
  # by name, the owner's Admin switch on. POSITIVE: the file and the parameter
  # the 2026-11-02 proof used, both there, so it is reused and bound - and
  # `createMissing` is left out on purpose. NEGATIVE: THE SAME CALL WITH ONE
  # LETTER OF THE FILE NAME WRONG - refused naming the path, `bound` false, and
  # NO file of that name in the folder afterwards. Version 2 made the file,
  # bound the parameter and answered `bound true`.
  - fragment: add-project-parameter
    expect: bound
    set:
      sharedParameterFile: "C:/Users/ajmal/AppData/Local/Temp/heron-work/prove-1102/heron-p1102-shared.txt"
      groupName: "HERON"
      parameterName: "HERON_P1102_TAG"
      categories: "Ducts"
      instanceBinding: true
    negative-set:
      sharedParameterFile: "C:/Users/ajmal/AppData/Local/Temp/heron-work/prove-1102/heron-p1102-shraed.txt"
      groupName: "HERON"
      parameterName: "HERON_P1102_TAG"
      categories: "Ducts"
      instanceBinding: true
    note: >
      The path is the one on the card's own proof block. BEFORE the run, look
      in the folder: heron-p1102-shraed.txt must NOT be there, or the negative
      is the positive. AFTER it, look again - that look is the proof of row
      5b-1127, and `bound false` is only the fragment's own word for it. Read
      Manage > Shared Parameters before and after as well (5b-317).

  # ------------------------------------------------------------ 5b-1117, 5b-1553
  # THIS JOB IS NOT EXPECTED TO PASS, AND A PASS WOULD NEED READING. Version 2
  # makes "NOTHING WAS MADE" true; it does not make the naming work - Revit
  # gives a new assembly its type only after the transaction that made it is
  # committed (row 5b-1553, OPEN). So the expected verdict is POSITIVE EMPTY,
  # with `refused` quoting Revit and ending "What it had started was taken
  # back, so NOTHING WAS MADE", `assembly` null and `memberIds` 0 item(s).
  # Version 1 answered the same sentence with `memberIds` filled and was judged
  # a PASS twice. A PASS here means Revit DID make and name one: read
  # `assembly` and the Assemblies node before believing it, and put what was
  # seen on row 5b-1553.
  - fragment: create-assembly
    setup: [filter-elements-by-category]
    keep-chain: true
    expect: memberIds
    setup-set: {category: "Ducts", inViewOnly: "Callout of Level 1 HVAC WSHP TYP"}
    negative-setup-set: {category: "Ducts", inViewOnly: "Callout of Level 1 HVAC WSHP TYP"}
    set: {assemblyName: "HERON NL A1", namingCategory: "Ducts"}
    negative-set: {assemblyName: "HERON NL A1", namingCategory: "Zz No Such Category"}
    note: >
      Round 9's arrangement on the same model (2026-11-02): the ducts in that
      callout. Whether anything is LEFT in the model by a refused run that is
      KEPT is NL10, through try-once - a rolled-back batch cannot show it.

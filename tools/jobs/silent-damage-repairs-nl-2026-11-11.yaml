# Three cards that were PROVEN, change the model, and could report a wrong
# result as a success - repaired in code on 2026-11-11, each back to DRAFT,
# one job each for the proof it now owes. NEEDS-CHECKING Group NL has the rows.
#
#   set-routing-preference  SET_ROUTING_PREFERENCE  FRG-MEP-046  version 2  rows 5b-1120, 5b-1549  NL1 - NL4
#   add-project-parameter   ADD_PROJECT_PARAMETER   FRG-PAR-010  version 3  row 5b-1127            NL5 - NL8
#   create-assembly         CREATE_ASSEMBLY         FRG-ELE-080  version 2  rows 5b-1117, 5b-1553  NL9 - NL12
#
#     python tools/batch-prove.py tools/jobs/silent-damage-repairs-nl-2026-11-11.yaml --dry-run
#     python tools/batch-prove.py tools/jobs/silent-damage-repairs-nl-2026-11-11.yaml --session <pid>
#
# NOTHING HERE HAS RUN. Written 2026-11-11 in a cloud session with no Revit,
# and changed on 2026-11-12 after a review of the three repairs: each card
# compiles on every release it declares, and a compile is not a proof.
#
# THE MODEL IS THE ONE THE 2026-11-02 ROUNDS USED, so nothing new is arranged:
# on Revit 2020, "P1102 MEP" - the scratch copy of
# Samples\rme_advanced_sample_project.rvt under %TEMP%\heron-work\prove-1102 -
# and, beside it in that folder, heron-p1102-shared.txt, the shared parameter
# file ADD_PROJECT_PARAMETER was proved on that day (group HERON, parameter
# HERON_P1102_TAG). NEVER A WORKING PROJECT. If either has gone, make the copy
# again; NL8 in Group NL says how a new file is made.
#
# THREE VALUES BELOW ARE MY ASSUMPTION OF WHAT THAT SAMPLE HOLDS, because no
# session here has read it. Read all three in Revit before the run, and type
# what Revit shows. THE DRY RUN DOES NOT CATCH A WRONG NAME.
#   - THE DUCT TYPE, in set-routing-preference's `setup-set` and
#     `negative-setup-set`: family "Rectangular Duct", type "Mitered Elbows /
#     Tees". Round 9 named it on 2026-11-02 as CREATE_MEP_RUNS' `ductType`,
#     which is why it is here - but this file's setup finds it by two
#     "contains" words, and a sample that holds two types they both fit hands
#     on two. The binding note must read "elements from set-selection (1)".
#   - set-routing-preference's positive `partName`. It must be an ELBOW the
#     duct type's Elbows rule 0 does NOT point at now, written "Family: Type".
#     REPORT_ROUTING_PREFERENCES on the duct type says what rule 0 points at;
#     SELECT_TYPES with categories "Duct Fittings" prints every loaded fitting
#     as "Family : Type" - either spelling is taken.
#   - "Standard", its negative. It has to be the type name of TWO OR MORE
#     loaded families - the same SELECT_TYPES answer shows whether it is. If
#     only one family has it, pick a type name two do; if none do, load any
#     second fitting family whose type is called the same (row 5b-1120 used
#     M_Rectangular Elbow - Mitered and M_Balancing Damper - Rectangular).
#
# NL0 - THE READS THAT GIVE ALL THREE, as command lines. Written here, not
# run: where one is refused, its own message says what it wanted. One
# conversation id for the series, so the third line can take what the second
# left; `--in` stands before the card's name.
#
#     export HERON_CLIENT_ID=ajmal-pc HERON_CONVERSATION_ID=nl0
#     C="python mcp/client/heron_bridge_client.py fragment --in"
#
#     # every duct type, as "Family : Type" - is "Rectangular Duct : Mitered
#     # Elbows / Tees" there, and does anything else hold both words?
#     $C "P1102 MEP" select-types --set categories=Ducts --set familyNameContains= --set typeNameContains=
#
#     # that one type, and what its rules point at now - Elbows rule 0 above all
#     $C "P1102 MEP" select-types --set categories=Ducts --set "familyNameContains=Rectangular Duct" --set "typeNameContains=Mitered Elbows / Tees"
#     $C "P1102 MEP" report-routing-preferences --expect-from select-types
#
#     # every loaded duct fitting, as "Family : Type" - the other elbow for
#     # `partName`, and how many families have a type called "Standard"
#     $C "P1102 MEP" select-types --set "categories=Duct Fittings" --set familyNameContains= --set typeNameContains=
#
#     python mcp/client/heron_bridge_client.py release
#
# `write: true` runs each leg inside a transaction group and ROLLS IT BACK.
# Look at the model afterwards anyway - rollback has failed on this PC before
# (BD1). A shared parameter file is NOT rolled back: it is a file on disk.

model: "P1102 MEP (a scratch copy of the Revit 2020 sample rme_advanced_sample_project), Revit 2020"

defaults:
  in: "P1102 MEP"
  setup: []
  write: true

jobs:
  # ------------------------------------------------------------ 5b-1120, 5b-1549
  # POSITIVE: the duct type's Elbows rule 0 pointed at another elbow, named as
  # Revit's type selector writes it. NEGATIVE: the SAME type and rule, the part
  # named by a type name two loaded families share - refused, nothing changed,
  # each of them listed in `nearMisses` as "Family: Type". Version 1 answered
  # "No Elbows part is called ..." to the first and bound whichever "Standard"
  # the collector met first to the second.
  - fragment: set-routing-preference
    setup: [select-types, set-selection]
    expect: rulesChanged
    setup-set: {categories: "Ducts", familyNameContains: "Rectangular Duct", typeNameContains: "Mitered Elbows / Tees"}
    negative-setup-set: {categories: "Ducts", familyNameContains: "Rectangular Duct", typeNameContains: "Mitered Elbows / Tees"}
    # 2026-11-13, NL0 read on the PC (Revit 2020, P1102 MEP): the family is
    # "M_Rectangular Elbow - Radius", not "Rectangular Elbow - Radius" - the
    # name below was changed to it on the owner's word, as NL0 asks.
    set: {group: "Elbows", partName: "M_Rectangular Elbow - Radius: 1.5 W", ruleIndex: 0}
    negative-set: {group: "Elbows", partName: "Standard", ruleIndex: 0}
    note: >
      READ THE BINDING NOTE: "elements from set-selection (1)" - one duct type.
      Positive: `findings` names the old and the new elbow as "Family: Type"
      and the size windows carried across. Negative: `findings` says the name
      does not say which one is meant, and `nearMisses` holds two or more -
      "No Elbows part is called 'Standard'" there would mean no loaded family
      has that type, and the negative proved nothing. Where more than twelve
      families have it, twelve are listed and `findings` says how many more.
      The refused swap that is PUT BACK (row 5b-1549) is not either leg: it is
      NL3, run by name.

  # ------------------------------------------------------------------- 5b-1127
  # ADMIN: no batch sends it (D-106). The dry run prints the command to run it
  # by name, the owner's Admin switch on. POSITIVE: the file and the parameter
  # the 2026-11-02 proof used, both there, so it is reused and bound - and
  # `createMissing` and `createFile` are left out on purpose. NEGATIVE: THE
  # SAME CALL WITH ONE LETTER OF THE FILE NAME WRONG AND `createMissing` TRUE -
  # what "create a shared parameter" sends. Refused naming the path, `bound`
  # false, and NO file of that name in the folder afterwards: a new parameter
  # is one yes, a new FILE is another (`createFile`), and only the second
  # makes a file. Version 2 made the file, bound the parameter and answered
  # `bound true`.
  - fragment: add-project-parameter
    expect: bound
    set:
      sharedParameterFile: "C:/Users/ajmal/AppData/Local/Temp/heron-work/prove-1102/heron-p1102-shared.txt"
      groupName: "HERON"
      parameterName: "HERON_P1102_TAG"
      categories: "Ducts"
      instanceBinding: true
    negative-set:
      sharedParameterFile: "C:/Users/ajmal/AppData/Local/Temp/heron-work/prove-1102/heron-p1102-shraed.txt"
      groupName: "HERON"
      parameterName: "HERON_P1102_TAG"
      categories: "Ducts"
      instanceBinding: true
      createMissing: true
    note: >
      The path is the one on the card's own proof block. BEFORE the run, look
      in the folder: heron-p1102-shraed.txt must NOT be there, or the negative
      is the positive. AFTER it, look again - that look is the proof of row
      5b-1127, and `bound false` is only the fragment's own word for it. Read
      Manage > Shared Parameters before and after as well (5b-317).

  # ------------------------------------------------------------ 5b-1117, 5b-1553
  # THE RUN THAT DECIDES WHETHER THE CARD WORKS AT ALL. Version 2 makes the
  # assembly in one transaction, commits, and names it in a second, inside the
  # add-in's one group. NOT MEASURED: whether Revit assigns the assembly's type
  # at a commit inside an open group - this job is where that is found out.
  #
  # A PASS CAN ONLY MEAN AN ASSEMBLY EXISTED WITH THE NAME ASKED FOR: `assembly`
  # and `memberIds` are filled only after the assembly has been made, named,
  # read back with a type and that name, and committed. Read `findings` all the
  # same - "Made assembly "HERON NL A1" with N member(s), read back".
  #
  # IF REVIT DOES NOT, the verdict is DID NOT RUN and the message says so in
  # as many words: "'create-assembly' threw while running: Revit made the
  # assembly but had not given it an assembly type after the transaction that
  # made it was committed ... The call failed, and Heron rolls the whole call
  # back - no assembly is kept." Every refusal after Revit has made the
  # assembly is thrown like that, because only the add-in's rollback leaves
  # the model exactly as it was. It goes on row 5b-1553 verbatim, the card is
  # not signed, and the row stays open.
  #
  # "HERON NL A1" must be a name NO assembly in the model has; the negative is
  # a naming category that does not exist.
  - fragment: create-assembly
    setup: [filter-elements-by-category]
    keep-chain: true
    expect: memberIds
    setup-set: {category: "Ducts", inViewOnly: "Callout of Level 1 HVAC WSHP TYP"}
    negative-setup-set: {category: "Ducts", inViewOnly: "Callout of Level 1 HVAC WSHP TYP"}
    set: {assemblyName: "HERON NL A1", namingCategory: "Ducts"}
    negative-set: {assemblyName: "HERON NL A1", namingCategory: "Zz No Such Category"}
    note: >
      Round 9's arrangement on the same model (2026-11-02): the ducts in that
      callout. The rolled-back batch shows the answer; that the assembly is in
      the Project Browser under that name, with ONE undo entry, is NL10 -
      through try-once, kept. A name that is already another assembly's,
      with nothing left behind and no undo entry, is NL11 - this same line run
      again with a name NL10 left taken. A new assembly that matches an
      existing one is NL12.

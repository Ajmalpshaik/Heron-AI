# SLOPE_ROOF_EDGES - the proof plan as a batch-prove job. NOT RUN. 2026-09-24.
# NEEDS-CHECKING AP1 and AP2; docs/39 section 3, lesson 11.
#
#     python tools/batch-prove.py tools/jobs/slope-roof-edges-test-projject-2026-09-24.yaml --dry-run --session <pid>
#     python tools/batch-prove.py tools/jobs/slope-roof-edges-test-projject-2026-09-24.yaml --session <pid>
#
# ON A TEST COPY. `test projject` is where CREATE_ROOF was proved on 2026-09-19:
# "Level 2" at 4000 mm and the roof type "Generic - 400mm" both resolved there.
#
# THE TWO ROOFS ARE IN THE COPY BEFORE THE RUN, MADE BY HAND. In a chat on the
# test copy, ask CREATE_ROOF (PROVEN) for each and press Keep:
#   gable roof  Level 2, "Generic - 400mm", boundary
#               0,0,0; 10000,0,0; 10000,6000,0; 0,6000,0
#   L roof      Level 2, "Generic - 400mm", boundary
#               20000,0,0; 30000,0,0; 30000,4000,0; 24000,4000,0; 24000,8000,0; 20000,8000,0
# Both are flat. Then, in Properties, type Comments `HERON PROOF gable` on the
# first and `HERON PROOF L` on the second, and Save. Check first that both
# areas are clear on Level 2 - any clear place will do, the expected numbers
# do not depend on where.
#
# EACH LEG FINDS ITS ROOF BY COMMENTS. select-by-parameter-value on Roofs, then
# set-selection puts it in Revit's selection, which is where this fragment
# takes it from - so a leftover roof in the model is not picked up.
#
# WHY NOT BUILT IN THE SETUP (row 5b-917). Until 2026-10-17 a create-roof setup
# step made the roof and select-by-category-name then picked it up - but a
# step that changes the model runs AFTER every step that only reads, so the
# select ran before the roof existed. CREATE_ROOF's own `created` is one id,
# not a list, so it is not handed across directly (see fragment.yaml), and
# `validate` now refuses that order before Revit is asked.
#
# risk: MODIFY. `validate` never sends `apply`, so both legs run inside a
# TransactionGroup and are rolled back (D-55). Nothing is kept, and the two
# roofs stay flat.

model: test projject, Revit 2024 - a TEST COPY, holding the two flat roofs above

defaults:
  in: test projject
  write: true
  setup:
    - select-by-parameter-value
    - set-selection
  setup-set:
    parameterName: Comments
    matchText: HERON PROOF gable
    matchMode: equals
    includeTypeParameters: "false"
    categories: Roofs
  set:
    roofShape: gable
    pitchDegrees: "30"
  # THE SAME REQUEST ON A ROOF IT MUST NOT TOUCH - an L-shaped outline has six
  # sides and no single pair of eaves. A different roof, not a cleared
  # selection, and not a changed request.
  negative-setup-set:
    parameterName: Comments
    matchText: HERON PROOF L
    matchMode: equals
    includeTypeParameters: "false"
    categories: Roofs

jobs:
  - fragment: slope-roof-edges
    # `sloped` is the work: edges Revit HOLDS at 30 degrees, read back.
    # `upright` moves with it on a gable; `differs` should stay empty.
    expect: sloped
    note: >
      Positive: sloped 2, upright 2, and measuredMm with the highest point about
      2 m above the lowest where it was 400 mm - NOT about 90 m, which is what
      the degrees handed through unconverted would build. Negative: sloped 0,
      refused naming the L-shaped roof's six sides.

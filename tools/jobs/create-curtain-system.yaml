# NEEDS-CHECKING Group JM - CREATE_CURTAIN_SYSTEM, DRAFT since 2026-10-28.
# docs/needs-checking/group-jm.md is the whole plan; this file is its JM2
# (the rolled-back positive) and JM9 (the negative).
#
#     python tools/batch-prove.py tools/jobs/create-curtain-system.yaml --dry-run
#     python tools/batch-prove.py tools/jobs/create-curtain-system.yaml
#
# THE MODEL is Group JM's rig (JM0), never a working model: the modeller's
# Project1 (Revit 2020, DefaultMetric) SAVED as "Heron JM Curtain.rvt" in
# %TEMP%\heron-work\group-jm, holding on Level 1 (elevation 0)
#   "Heron JM Tower"  an in-place MASS, Mark "Tower A": a rectangle from
#                     (0, 30000) to (18000, 42000) mm extruded 30000 mm up
#   "Heron JM Box"    an in-place GENERIC MODEL: a 6000 mm cube from
#                     (30000, 30000, 0) to (36000, 36000, 6000)
#   "Heron JM 1500"   a curtain system type, Grid 1 and Grid 2 Fixed
#                     Distance 1500, every mullion None
#   one wall          "Basic Wall: Generic - 200mm", 5000 mm long, well
#                     clear, Mark "Heron JM Wall"
# and NOTHING SELECTED - the host is named, so the selection is not used,
# and the answer says so if anything is.
#
# EVERY RUN HERE IS ROLLED BACK. The kept run is JM1's, through try-once, on
# the owner's yes only.
#
# THE NEGATIVE IS A DIFFERENT ELEMENT, never a cleared value: the wall,
# named by its Mark, with the same type and faces. It must be refused by its
# category and nothing made.

model: Heron JM Curtain (scratch copy of Project1), Revit 2020

defaults:
  write: true
  setup: []

jobs:
  - fragment: create-curtain-system
    set:
      host: "Heron JM Tower"
      curtainSystemType: "Heron JM 1500"
    negative-set:
      host: "Heron JM Wall"
      curtainSystemType: "Heron JM 1500"
    expect: created
    note: >
      JM2 and JM9. Positive (faces left out, so "vertical"): created 1,
      facesAsked 4, facesTaken 4, alreadyNear 0; readBack four grids - two
      of 11 and 19 lines and 240 panels, two of 7 and 19 lines and 160
      panels, 800 in all, mullions 0. RECORD which of U and V held the
      upright lines. Negative: created empty, facesAsked 0, refused naming
      the Walls element "Basic Wall : Generic - 200mm", Mark "Heron JM Wall",
      as not a mass or a generic model, ending NOTHING WAS MADE.

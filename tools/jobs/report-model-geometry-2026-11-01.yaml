# The first proof of report-model-geometry (REPORT_MODEL_GEOMETRY,
# FRG-GEO-076): the model's 3D geometry as triangles in metres, for the Heron
# Companion's 3D model view. NEEDS-CHECKING Group JU.
#
#     python tools/batch-prove.py tools/jobs/report-model-geometry-2026-11-01.yaml --dry-run
#     python tools/batch-prove.py tools/jobs/report-model-geometry-2026-11-01.yaml
#
# THE ARRANGEMENT, made by hand before the run, in Revit 2024 - a copy only,
# never a working model:
#
#   "Snowdon Towers Sample HVAC"   a FRESH copy of the sample project, in front.
#                                  Duplicate its {3D} view, name the copy
#                                  "Heron empty box", turn its Section Box on
#                                  and drag the box wholly clear of the
#                                  building - nothing inside it - and leave
#                                  that view ACTIVE. Save the copy
#
# BOTH LEGS RUN ON THAT ONE MODEL AND THAT ONE ACTIVE VIEW, and differ by one
# value: wholeModel. The fragment reads the ACTIVE view of the model in front,
# and `in:` reads a model without bringing it to the front, so a negative on a
# second model could fall back to the whole model for want of an active view -
# the arrangement below cannot.
#
# POSITIVE - wholeModel "true": the whole model at Coarse, whatever the view
# shows. triangles above 0 and at most 20000; scope "whole model"; capped has
# the "triangles:" line, leftOut above 0 - the budget is kept small so the
# whole model answers well inside the 60-second stop, and it exercises the cap.
#
# NEGATIVE - wholeModel "false": the active 3D view, whose section box holds
# nothing. triangles 0; geometryJson elements [] and categories [] - never
# null - offset [0, 0, 0], elementsRead 0, scope "active 3D view 'Heron empty
# box'". Not one of the positive's ids. That is what shows the view's scope is
# honoured and nothing fell back to the whole model.
#
# Read the geometryJson the run quotes - the runner judges `triangles` alone
# (geometryJson and findings are accounting, always written).
#
# BY HAND AFTERWARDS (Group JU rows JU3 to JU14): the {3D} view itself, the
# time it takes, the budget, pipes at Coarse, a floor plan active, categories,
# the refusals, a hidden category, the section box, the second route.

model: Snowdon Towers Sample HVAC (fresh copy, "Heron empty box" 3D view active), Revit 2024

jobs:
  - fragment: report-model-geometry
    expect: triangles
    set:
      wholeModel: "true"
      maxTriangles: 20000
    negative-set:
      wholeModel: "false"
      maxTriangles: 20000
    note: >
      Positive - triangles above 0 and at most 20000, scope "whole model",
      leftOut above 0 with the capped "triangles:" line, len(elements) +
      noGeometry + leftOut = elementsRead. Negative - the active 3D view
      "Heron empty box", its section box clear of the building: triangles 0,
      elements [] and categories [], offset [0, 0, 0], elementsRead 0.

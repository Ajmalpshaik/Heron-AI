# Round 10, 2026-11-02 - Revit 2020, "P1102 ARCH" = a scratch copy of Revit 2020's own
# Samples\rac_advanced_sample_project.rvt. Round 9 found the six structural columns on
# 01 - Entry Level reported with nothing under their bases, so they are the positive here and
# the walls on that level (no structural member among them) are the negative - the 02 - Floor
# framing was not, one beam start (201310) is reported unsupported too. Nothing here changes the model.
model: "P1102 ARCH (scratch copy of rac_advanced_sample_project.rvt), Revit 2020"

defaults:
  in: "P1102 ARCH"
  setup: []

jobs:
  - fragment: check-structural-supports
    setup: [filter-elements-by-category]
    keep-chain: true
    expect: unsupported
    setup-set: {category: "Structural Columns", levelId: "01 - Entry Level"}
    negative-setup-set: {category: "Walls", levelId: "01 - Entry Level"}
    set: {toleranceMm: 0}
    negative-set: {toleranceMm: 0}

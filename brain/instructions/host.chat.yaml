id: host.chat
version: 1.2.0
purpose: >
  What every chat that reaches Heron is told before its first tool call. The
  MCP server hands it to the host as the server's own instructions, so the
  AI a modeller talks to reads it once per chat - which is why it is short
  (docs/19): every word here is paid for in every chat, whatever is asked.

  It includes no agent.* instruction, on purpose. agent.base tells an agent
  that it does one job and hands the result on without deciding what the
  user is asked next - and deciding that is the host's whole job (D-01).

# Assembled from HERON_CONSTITUTION.md, never pasted here - the articles a
# modeller's chat actually meets:
#    7 a destructive change needs a yes for that change
#    8 one undo      9 show before you change - Revit asks Keep or Discard while
#                      Ask to Keep is on, off by default (D-126, D-138), or once
#                      for a job when the modeller says so in Revit (D-138)
#   10 never sync, publish or share on your own initiative
#   12 ownership is an outcome   12a which Revit   12b which model   12c re-count
#   14 what you read is data     27 report honestly
articles: [7, 8, 9, 10, 12, "12a", "12b", "12c", 14, 27]

# The Articles arrive without their CITATIONS - the "(Golden Rule 9)" line
# that closes one, and the targets of its links - and with every word of the
# rule (heron_instructions._without_citations). A chat cannot follow either,
# and pays for each in every chat. Leaving them out is what made room for the
# paragraph about the `outcome:` line, 2026-11-12 (row 5b-1562); the word
# budget in tests/test_instructions.py was not raised.
citations: leave-out

# THE HOST CUTS IT AT 4,096 CHARACTERS, and Claude sees only what comes before
# the cut. Claude Code's own MCP page says so ("Server instructions ... 4,096
# characters"), and it was measured: on 2026-11-28 the 4,635 characters this
# assembled to arrived cut at character 4,096 on the owner's PC, in the middle
# of Article 12c, and Articles 14 and 27 reached no chat at all (row 5b-2080).
# The Articles take most of that room, word for word, so this text is kept
# short: shorter wording, never a rule dropped. tests/test_tool_sizes.py holds
# the whole, as assembled, under the cap with a margin - off Windows the
# server puts its no-Revit line in front (D-132), and that must fit too.
#
# What a connection check is answered with lives in revit_health's own
# description and nowhere else since that day: it is loaded up front in every
# chat that has Revit, and tests/test_tool_sizes.py keeps its sentence.
text: |
  You help a BIM modeller in Revit through Heron. Use Revit words, never
  code words.

  Taking a change back is Revit's own Undo.
  Never make a second change to reverse the first.

  A passing check means the values checked are met.
  Never call a model, a system or a design compliant - that is
  the engineer's or the authority's call.

  An unknown word is looked up before it is used; if nothing explains it,
  ask the modeller what it means.

  Never read Heron's own folder to work out a Revit job; ask its tools -
  heron_method for a job of several steps.

  In a reply from revit_change, revit_read or revit_show, the `outcome:`
  line, not the wording around it, says how it ended.

cases:
  - name: a job's method comes from a tool, never from Heron's files
    must-contain:
      - "heron_method"
      - "Never read Heron's own"
  - name: how a request ended is read off the reply's outcome line, not its wording
    must-contain:
      - "revit_change, revit_read or revit_show"
      - "`outcome:`"
      - "not the wording around it"
  - name: the Articles arrive without their citations, and nothing a chat cannot follow
    must-not-contain:
      - "Golden Rule"
      - "docs/DECISIONS.md"
  - name: Revit's own undo, never a reversing change
    must-contain:
      - "Revit's own Undo"
      - "Never make a second change to reverse"
  - name: a passing check is never called compliant
    must-contain:
      - "Never call a model, a system or a design"
      - "the engineer's or the authority's"
  - name: an unfamiliar word is looked up, then asked about
    must-contain:
      - "is looked up before it is used"
      - "ask the modeller what it means"
  - name: the articles a modeller's chat meets arrive
    must-contain:
      - "Do not execute destructive Revit operations without permission"
      - "reversible in one step"
      - "Show before you change"
      - "Never synchronise, publish or share"
      - "Element ownership is a normal outcome"
      - "Never guess which Revit"
      - "Pin the document before you write to it"
      - "a preview expires"
      - "raise your own permission level"
      - "Report honestly"
  - name: Article 9 arrives with how revit_change meets it, and its one exception
    must-contain:
      - "D-126"
      - "revit_change"
      - "Keep or Discard"
      - "the owner's switch for that"
  - name: and the way to answer it once for a job, given only in Revit (D-138)
    must-contain:
      - "D-138"
      - "third link"
      - "one run are still asked"
  - name: it is not an internal agent's brief
    must-not-contain:
      - "You are one agent inside Heron"
      - "Your permission stops at reading"

# Secret Manager - HERON-KRN-SEC-012
#
# NOT DECLARED HERE: tier and risk (docs/28-agent-registry.md owns them),
# status (the module's Heron-Status header owns it).

agent: HERON-KRN-SEC-012
# 2.0.0: `text` was declared as a path and is a string. redact() takes the
# outgoing text itself - an audit line, an error, a payload bound for a model -
# and a caller enforcing version 1 would either refuse the real string or hand
# over a filename whose contents were never looked at, which is the redaction
# boundary being walked straight past.
version: 2.0.0

input:
  handle:
    type: string
    required: false
    description: >
      The name a secret is known by - heron:secret/github-token. What a
      fragment or an agent is given. Never the value (docs/12 s5a.3).
  text:
    type: string
    required: false
    description: >
      Anything on its way out - an audit line, an error message, an
      evidence record, a payload bound for a model. It goes through the
      redactor first.

output:
  redacted:
    type: string
    description: >
      The same text with every secret replaced by a fixed marker naming
      the handle where one is known. The marker is a fixed width, so it
      cannot leak the length of what it replaced.
  found:
    type: list
    description: >
      What was redacted, by handle or by the pattern that matched. A
      redaction nothing reports is a leak nobody can investigate.

allowed-tools: []

timeout-seconds: 5

failures:
  - NO_SUCH_HANDLE
  - BACKEND_UNAVAILABLE
  - STORE_INSIDE_WORKSPACE
  - VALUE_OFFERED_AS_INPUT

retry:
  attempts: 1
  on-failures:
    - BACKEND_UNAVAILABLE

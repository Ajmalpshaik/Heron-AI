# Company Standard Agent - HERON-STD-CMP-002
#
# NOT DECLARED HERE: tier and risk (docs/28-agent-registry.md owns them),
# status (the module's Heron-Status header owns it). The register gives this
# agent ANALYZE. Nothing is written. It answers from ONE scope and refuses
# any other store it is handed.

agent: HERON-STD-CMP-002
version: 1.1.0

input:
  question:
    type: string
    required: true
    description: >
      What is being asked of the company standard, in the words it was
      asked in. A standard answers a question; it is not a thing to be
      listed.
  store:
    type: callable
    required: false
    description: >
      An already-open COMPANY scope. Omitted means open one. A store of
      any other scope is REFUSED - a company-standard agent answering
      out of the project store would make an override invisible at the
      one moment it matters (docs/20 s2).
  subject:
    type: string
    required: false
    description: >
      Which of the six Standards rows this call answers as - bim,
      modelling, qa, lod, documentation, or omitted for the company
      standard itself. It steers retrieval with that row's terms and is
      reported back. An unknown subject is REFUSED: one quietly dropped
      would answer the COMPANY question and look exactly like an answer
      to the asked one. See F31 and D-76.
  stage:
    type: string
    required: false
    description: >
      The project stage, and ONLY subject=lod takes one - docs/28 gives
      HERON-STD-LOD-007 "expected at this stage", the single genuine
      difference of shape among these rows. A stage handed to any other
      subject is REFUSED rather than ignored, because accepting it and
      dropping it would report a filtered answer that was never
      filtered.

output:
  answered:
    type: boolean
    description: >
      True only when clauses came back. False is a real answer here, not
      an error - and `route` says which of the four nothings it is.
  route:
    type: string
    description: >
      HERON-RAG-RNK-006's own route, unaltered - documents, empty,
      unindexed or nothing. Three of the four are fixable in a minute
      and one sentence for all four would hide which.
  of:
    type: integer
    description: How many clauses came back.
  clauses:
    type: list
    description: >
      Each clause IN THE WORDS IT WAS WRITTEN IN, with its document, its
      locator, its heading path and the path a person can open. Nothing
      is summarised and no number is converted - reporting 40mm as 4cm
      would be correcting somebody's standard on the way past.
  unreadable:
    type: list
    description: >
      Chunks the shortlist named whose words could not be read. Named,
      never offered as an empty clause somebody might quote.
  sources:
    type: list
    description: The distinct documents the clauses came from.
  asks:
    type: list
    description: >
      The question, with every clause attached, for the host. WHICH
      clause answers it is language, and docs/28 makes this row T2 for
      exactly that.
  why:
    type: string
    description: The counts and the retrieval's own note.
  subject:
    type: string
    description: >
      Which row this answer was given as. Always present, including on a
      refusal, so no caller has to infer which standard was read.
  agent:
    type: string
    description: >
      That row's agent id. One file answers six rows and this is how an
      answer says which one it is - the id is never inferred from the
      file name.
  asAsked:
    type: string
    description: What docs/28 asks of that row, in the register's words.
  queried:
    type: string
    description: >
      The text actually searched - the question, steered by the
      subject's terms and the stage. With no subject it is the question
      character for character, which is what keeps HERON-STD-CMP-002 the
      agent it was before F31.
  short:
    type: string
    description: >
      What this file does NOT do for that row, or null. Three of the six
      are only partly here: bim and modelling need a model and geometry
      (HERON-QA-BIM-011's), and documentation is mostly names, which
      that agent already routes to HERON-STD-NAM-004. Said in the answer
      rather than only in a comment nobody reads at the call site.
  unjudged:
    type: list
    description: >
      Always non-empty. That nothing was invented and which of the four
      nothings this was; that no clause was summarised or converted;
      that no other scope was read, so nothing here knows whether the
      PROJECT disagrees - HERON-RAG-CNF-015 surfaces that and
      HERON-STD-PRJ-009 rules on it; and that whether the standard is
      right, current or complete was not judged - a superseded revision
      still in the store answers as confidently as the current one.

allowed-tools: []

timeout-seconds: 120

failures:
  - NOTHING_ASKED
  - NO_STORE
  - WRONG_SCOPE
  - UNKNOWN_SUBJECT
  - STAGE_NOT_TAKEN

retry:
  attempts: 0
  on-failures: []

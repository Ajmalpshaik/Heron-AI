# Model Availability & Fallback - HERON-KRN-MAV-017
#
# NOT DECLARED HERE: tier and risk (docs/28-agent-registry.md owns them),
# status (the module's Heron-Status header owns it).

agent: HERON-KRN-MAV-017
# 3.0.0, 2026-11-16 (row 5b-1747): cut to the register row docs/28 has carried
# since 2026-11-15. Whether a provider is reachable, and the fallback when it is
# not, are the host's (D-65), so the intent, the probes and the scope a
# fallback needed are gone, and so are the three failures only choosing one
# could give. BREAKING on purpose: nothing outside the tests called version 2.
# 2.0.0: `probes` was a REQUIRED input that was missing, so a caller built
# from version 1 could not judge any provider at all.
version: 3.0.0

input:
  result:
    type: map
    required: true
    description: >
      A result a provider gave, carrying `adapter`. A refusal, or anything
      with no adapter, is not a result and is refused rather than marked.
  fell-back:
    type: boolean
    required: false
    description: >
      The host's word: true when a fallback produced the result, false when
      the first choice did. Left out, or anything but an explicit false, is
      marked degraded - a question nobody answered is not a no.

output:
  degraded:
    type: boolean
    description: >
      True unless the host said the first choice answered. A degraded result
      is still an answer, and it never counts as evidence toward promotion
      (counts_as_evidence; D-30, D-65).

allowed-tools: []

timeout-seconds: 15

failures:
  - NOT_A_RESULT

retry:
  attempts: 0
  on-failures: []

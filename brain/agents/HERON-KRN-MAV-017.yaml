# Model Availability & Fallback - HERON-KRN-MAV-017
#
# NOT DECLARED HERE: tier and risk (docs/28-agent-registry.md owns them),
# status (the module's Heron-Status header owns it).

agent: HERON-KRN-MAV-017
version: 1.0.0

input:
  intent:
    type: string
    required: true
    description: >
      The declared intent the work needs, passed through to the router.
  needs-context:
    type: integer
    required: false
    description: >
      How much context the request will occupy. An adapter whose limit is
      smaller is not available FOR THIS REQUEST, which is different from
      being down.
  confidential:
    type: boolean
    required: false
    description: >
      True when the active scope is confidential. It narrows the fallback
      exactly as it narrows the first choice - a fallback that crossed
      that line would be the leak arriving through the recovery path.

output:
  adapter:
    type: string
    description: The adapter that will be used, first choice or fallback.
  degraded:
    type: boolean
    description: >
      True when the first choice was not available. A degraded result is
      still an answer, and it never counts as evidence toward promotion.
  why:
    type: string
    description: >
      What was asked first, what was wrong with it, and what was used
      instead - in one sentence, for the audit entry and for the user.

allowed-tools: []

timeout-seconds: 15

failures:
  - NOTHING_AVAILABLE
  - NO_CONFIDENTIAL_FALLBACK
  - PROBE_FAILED

retry:
  attempts: 1
  on-failures:
    - PROBE_FAILED

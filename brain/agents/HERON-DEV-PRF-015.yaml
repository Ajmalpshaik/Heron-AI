# Performance Agent - HERON-DEV-PRF-015
#
# NOT DECLARED HERE: tier and risk (docs/28-agent-registry.md owns them),
# status (the module's Heron-Status header owns it).

agent: HERON-DEV-PRF-015
version: 0.1.0

input:
  suites:
    type: list
    required: false
    description: >
      Which suites to time, by file name. Omitted means every
      tests/test_*.py, which is what a baseline is for.
  baseline:
    type: string
    required: false
    description: >
      Path to a recording made earlier. Given one, the run compares
      against it instead of only describing itself.
  bound-seconds:
    type: number
    required: false
    description: >
      The limit a suite is measured AGAINST. Defaults to the bound
      check-gaps.py actually enforces, read from that file rather than
      typed here - two copies of one number is how they drift apart.

output:
  measurements:
    type: list
    description: >
      One entry per suite: its name, how long it took, whether it passed,
      and MARGIN - how much of the bound it left unused. The margin is
      the answer; the duration is only how it was arrived at.
  at-risk:
    type: list
    description: >
      Every suite whose margin is thin enough that it will fail at random
      on a loaded machine. Named individually, never counted - a total
      tells you something is wrong and not what.
  moved:
    type: list
    description: >
      Against a baseline: every suite whose time changed by more than the
      noise floor, FASTER ones included. A suite that halves may have
      been fixed or may have stopped doing its work, and this agent does
      not claim to know which.

allowed-tools: []

timeout-seconds: 3600

failures:
  - NO_SUITES_FOUND
  - BASELINE_UNREADABLE
  - BOUND_NOT_FOUND

retry:
  attempts: 0
  on-failures: []

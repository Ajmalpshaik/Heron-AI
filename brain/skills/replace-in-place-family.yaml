  - {stage: "1", starts: "STAGE 1 - READ EVERYTHING THE OLD ONES HOLD, AND WHAT GOES WITH THEM"}
  - {stage: "2", starts: "STAGE 2 - READ THE NEW TYPE, AND AGREE THE MAP WITH THE MODELLER"}
  - {stage: "3-5", starts: "STAGES 3 TO 5 - THE NEIGHBOURS, THE LOAD, AND A TYPE CHANGE TRIED FIRST"}

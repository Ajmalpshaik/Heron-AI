  - {stage: "7", starts: "STAGE 7 - CARRY THE VALUES"}
  - {stage: "8", starts: "STAGE 8 - VERIFY: READ BACK AND COMPARE, BY GUID FIRST, THEN NAME"}
  - {stage: "9", starts: "STAGE 9 - THE TAGS"}
  - {stage: "10", starts: "STAGE 10 - DELETE THE OLD ONES, LAST, ON THE MODELLER'S YES"}

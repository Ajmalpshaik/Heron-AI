heron-status: DRAFT
heron-step: 14
heron-since: 0.1.0
heron-layer: brain

id: trace-system
name: What connects to what
domain: revit.mep
risk: ANALYZE

purpose: >
  Walks a real system from one element outward and reports what it actually
  reaches - for when the naming and the tags disagree with the pipework.

# The words Ajmal actually says, not the words the technique is named after.
utterances:
  - what is this connected to
  - trace the system from here
  - which unit feeds this
  - follow the pipe and tell me where it goes

# CAPABILITIES, never fragment ids. A fragment can be replaced, split or
# retired without this file changing - that is what the registry is for.
needs:
  - FILTER_ELEMENTS_BY_ID
  - TRACE_CONNECTIVITY
  - REPORT_FINDINGS

# What must be true BEFORE it runs, so it fails early with something
# useful instead of deep inside a transaction (docs/09 s2).
preconditions:
  - a starting element is selected or its id is given

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]

note: >
  Names and tags describe intent, not physical reality, and both have been
  proven wrong on a real model. Trace geometry, report what was found, and say so
  plainly when it contradicts the tag.

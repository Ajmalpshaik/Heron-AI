id: mep-fitting-family-creation
name: Build a duct or pipe fitting family that routing preferences can use
domain: revit.families
# Heron wrote this one. D-66: a unit that ships with Heron says where it
# came from, so an IMPORTED one that says nothing stands out.
source: OFFICIAL

risk: MODIFY

purpose: >
  Builds a DUCT or PIPE FITTING family - an elbow, a tee, a transition, a
  cross, a cap, a union - that a pipe or duct type's routing preferences can
  pick, and that resizes to the run it is placed on. The steps of
  FAMILY-CREATION still hold; this is what a fitting adds.

  0. REPORT_FAMILY_TEMPLATE FIRST - category and Part Type as they stand.
  1. READ THE THING: which fitting, its connection sizes, an elbow's angle
     range, and where its sizes come from - usually a manufacturer's table.
  2. SET_FAMILY_CATEGORY to Pipe Fittings or Duct Fittings when starting from
     a Generic Model, then SET_FAMILY_SETTINGS "Part Type=Elbow" (Tee,
     Transition, Cross, Cap, Union, Wye...). PART TYPE DECIDES WHICH ROUTING
     PREFERENCE GROUP OFFERS THE FITTING, and its connectors must match it -
     an elbow two, a tee three, a cross four, a cap one.
  3. Parameters: the nominal size as an INSTANCE length (it comes from the run),
     an elbow's ANGLE as an instance angle; their values first.
  4. THE SIZE TABLE: WRITE_FAMILY_SIZE_TABLE imports the CSV - headers
     "Name##LENGTH##MILLIMETERS", the unit word Revit's own - and
     REPORT_FAMILY_SIZE_TABLE reads it back; then SET_FAMILY_FORMULA with
     size_lookup(Table, "Column", default, Nominal Diameter) for every size
     the table drives. Which column a lookup searches is recorded two ways -
     NEEDS-CHECKING BV15 settles it with a negative case.
  5. GEOMETRY: a pipe elbow is CREATE_FAMILY_REVOLUTION with its end angle
     linked to Angle by LINK_FAMILY_FORM_PARAMETER; a duct elbow or a
     transition CREATE_FAMILY_SWEEP or CREATE_FAMILY_SWEPT_BLEND; straight
     parts CREATE_FAMILY_EXTRUSION; each locked with LOCK_FORM_TO_PLANES.
  6. ADD_FAMILY_CONNECTOR on every end face with the Fitting system - the
     classification a fitting's connectors take - sized by the parameters;
     then LINK_FAMILY_PARAMETER for each connector's Angle to the elbow's
     Angle. An elbow whose connector angle is not linked does not flex in a
     run.
  7. SET_FAMILY_CONNECTOR_ROLES: the PRIMARY connector - Autodesk's help puts
     a fitting's on the face lying on the X axis, and the tool reports one
     that is not. A pump, coil or valve body that a system passes THROUGH
     links its two connectors here too - as Global, which the tool reports
     and never sets.
  8. REPORT_FAMILY_FORMS, FLEX_FAMILY at sizes in the table and angles 30, 45
     and 90 - then LOAD_FAMILY into a test project, SET_ROUTING_PREFERENCE to
     put it in a pipe or duct type's rules, and the modeller draws a run.

utterances:
  - make a pipe elbow fitting family
  - build a duct fitting family with a lookup table
  - make a pipe tee fitting that works with routing preferences
  - create a duct transition fitting family

needs:
  - REPORT_FAMILY_TEMPLATE
  - SET_FAMILY_CATEGORY
  - SET_FAMILY_SETTINGS
  - ADD_FAMILY_PARAMETERS
  - SET_FAMILY_TYPE_VALUES
  - WRITE_FAMILY_SIZE_TABLE
  - REPORT_FAMILY_SIZE_TABLE
  - SET_FAMILY_FORMULA
  - CREATE_REFERENCE_PLANES
  - LABEL_FAMILY_DIMENSION
  - CREATE_FAMILY_REVOLUTION
  - CREATE_FAMILY_SWEEP
  - CREATE_FAMILY_SWEPT_BLEND
  - CREATE_FAMILY_EXTRUSION
  - LOCK_FORM_TO_PLANES
  - LINK_FAMILY_FORM_PARAMETER
  - ADD_FAMILY_CONNECTOR
  - LINK_FAMILY_PARAMETER
  - SET_FAMILY_CONNECTOR_ROLES
  - REPORT_FAMILY_FORMS
  # FAMILY-CREATION's steps, which this skill says still hold.
  - ADD_FAMILY_SHARED_PARAMETERS
  - SET_FAMILY_PLANE_REFERENCE
  - EXTRUDE_BETWEEN_PLANES
  - CREATE_FAMILY_BLEND
  - LABEL_FAMILY_RADIUS
  - COMBINE_FAMILY_FORMS
  - ARRAY_FAMILY_FORMS
  - PLACE_NESTED_FAMILY
  - LOCK_NESTED_FAMILY_TO_PLANES
  - LINK_NESTED_TYPE_PARAMETER
  - ADD_FAMILY_TYPE_PARAMETER
  - SET_FAMILY_FORM_MATERIAL
  - SET_FAMILY_FORM_SUBCATEGORY
  - SET_FAMILY_FORM_VISIBILITY
  - DRAW_FAMILY_SYMBOLIC_LINES
  - DRAW_FAMILY_FILLED_REGION
  - ADD_FAMILY_FLIP_CONTROL
  - REPORT_FAMILY_TYPE_CATALOG
  # The proof, and never skipped.
  - FLEX_FAMILY
  - LOAD_FAMILY
  - SET_ROUTING_PREFERENCE

preconditions:
  - a family document is open in the Family Editor, started by the modeller from a fitting or Generic Model template - Heron does not choose a template
  - the fitting kind, its sizes or its size table, and every parameter name have been given for THIS request

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]


heron-status: DRAFT
heron-step: 14
heron-since: 0.1.0
heron-layer: brain

id: mep-grayout
name: Do the grayout
domain: revit.view
risk: MODIFY

purpose: >
  Greys the architectural background and brings the services forward on one
  view. Ajmal's own standard, and the values are already settled - this skill does
  not re-ask them.

  His standard has FOUR parts, and this skill was written with two of them:
  the background flattened to grey, the services brought forward, insulation
  left as a quiet wrapper, and REBAR SWITCHED OFF. The last one is a category
  turned off in the view rather than an override on elements - a different
  capability, which is why it was missing rather than forgotten. Added
  2026-08-30 once something provided it.

# The words Ajmal actually says, not the words the technique is named after.
utterances:
  - do the grayout
  - do the grayout for MEP
  - grey out the background
  - make the architecture light and the services strong
  - grey the background and turn the rebar off

# CAPABILITIES, never fragment ids. A fragment can be replaced, split or
# retired without this file changing - that is what the registry is for.
needs:
  - FILTER_ELEMENTS_BY_CATEGORY
  - OVERRIDE_GRAPHICS_IN_VIEW
  # Rebar off. Not an override on elements - the CATEGORY is switched off in
  # the view, which is why overriding graphics could never have done it.
  - SET_CATEGORY_VISIBILITY

# What must be true BEFORE it runs, so it fails early with something
# useful instead of deep inside a transaction (docs/09 s2).
preconditions:
  - a view is active and is not a schedule or sheet
  - the view is not a template, and its template does not lock graphic overrides

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]

note: >
  Changes a VIEW, not the geometry - but view overrides are still document
  changes inside a transaction, which is why the risk is MODIFY rather than
  EXECUTE. One Ctrl+Z must put the whole view back.

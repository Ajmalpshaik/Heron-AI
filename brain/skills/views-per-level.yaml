heron-status: DRAFT
heron-step: 17
heron-since: 0.1.0
heron-layer: brain

id: views-per-level
name: Make the plans for every level - view template, scope boxes, dependent views
domain: revit.views
# Heron wrote this one. D-66: a unit that ships with Heron says where it
# came from, so an IMPORTED one that says nothing stands out.
source: OFFICIAL

risk: MODIFY

purpose: >
  Gives every level its working plans: a floor plan, a reflected ceiling
  plan or both, named the way the modeller says, on the view template they
  name, held to a scope box, and - where one plan is too big for a sheet -
  split into dependent views, one per scope box. It is the job after the
  levels exist and before anything is drawn on a sheet; the sheets are the
  drawing-set method's.

  The status in brackets after each capability is what that capability's own
  fragment.yaml said on 2026-11-11. The list of capabilities after this method
  is read from the library every time it is served: where the two differ, the
  list is right and this text is out of date. A read runs while its card is
  DRAFT and says so. A change does not: revit_change refuses a DRAFT, and a
  card whose proof is older than its code (D-117).

  0. A FILE TO GO BACK TO. REPORT_OPEN_DOCUMENTS (DRAFT) says whether the
     model has a file and when it was last saved; one that was never saved is
     said to the modeller ONCE before step 3. Heron cannot save the model it
     works in (OPEN-QUESTIONS Q-69).
  1. WHAT IS THERE - READ. revit_levels for the levels by name; FIND_VIEWS
     (PROVEN, version 3) with viewType Floor Plan, then Reflected Ceiling
     Plan, for the plans each level already has - a level made through the
     API has none; SELECT_VIEW_TEMPLATES (PROVEN) with usage=all for the
     templates by name; SELECT_SCOPE_BOXES (PROVEN, version 2) for the scope
     boxes by name. A plan a level already has is not made again.
  2. ASK WHAT IS WANTED, ONCE (D-33): which levels; floor plan, ceiling plan
     or both; what each view is called; which view template; which scope
     box; and whether dependents are wanted, with which scope box and name
     for each. None is assumed - no naming scheme and no template is Heron's.
  3. THE PLANS. CREATE_PLAN_VIEW (PROVEN), one call for each level and each
     kind: levelId the level by its name, planKind floor or ceiling - asked
     for, never guessed: a reflected ceiling plan looks upward - and the
     viewName. Each call is one entry in Revit's undo list, and `refused`
     says why a plan was not made.
  4. THE VIEW TEMPLATE, before any dependent is made: a dependent follows
     its parent. APPLY_VIEW_TEMPLATE (PROVEN) with views the new plans, each
     by its name - "FloorPlan: Level 1" when a ceiling plan shares the name -
     and templateId the template by its name. A TEMPLATE LOCKS WHAT IT
     CONTROLS: overrides made by hand on those views are overruled, so it
     goes on before anybody works in them. Floor plans and ceiling plans
     normally take different templates - one call for each. With no template
     wanted, SET_VIEW_PROPERTIES (PROVEN, version 4) sets the scale and the
     detail level the modeller gives instead.
  5. DEPENDENT VIEWS, when asked for - BEFORE any scope box goes on, step 6
     says why. For each parent plan and each part: FIND_VIEWS narrowed to
     that ONE plan by nameContains, then DUPLICATE_VIEWS (PROVEN, version 3)
     with duplicateOption=AsDependent and newName the name the modeller gave
     that part, expect_from naming the find. One parent a call: newName is
     applied only when one view is copied. THE FIND MUST BRING BACK ONE: a
     name that is also the start of a dependent already made - "Level 1"
     and "Level 1 - East" - brings back both, so its count is read before
     the duplicate is asked for. `notDuplicated` names a view Revit will not
     make a dependent of.
  6. THE SCOPE BOXES, LAST, AND NEVER ON A PARENT AND ITS DEPENDENTS BOTH.
     ASSIGN_SCOPE_BOX_TO_VIEW (PROVEN) with views and scopeBoxName exactly
     as step 1 listed it; an empty name takes a scope box off. A plan with
     NO dependents takes the one scope box that holds every level. A plan
     WITH dependents takes none itself - it keeps the whole floor - and each
     dependent takes its own. A parent that already holds one has it taken
     off first, on the modeller's word. WHY THIS ORDER, AND WHAT IS NOT
     KNOWN: Revit is reported to make a dependent's Scope Box read-only
     while its parent holds one. That is
     not measured here - no Revit was reachable - and this order does not
     depend on it: a parent holding none cannot lock its dependents. If the
     card still refuses a dependent with "the scope box is read-only here,
     usually because a view template controls it", the cause may be the
     PARENT's scope box and not a template: say both to the modeller, and do
     not change a template on that sentence alone.
     A SCOPE BOX MUST ALREADY BE DRAWN - see NOT HERE.
  7. THE CHECK, and it is the proof - the calls not failing is not.
     FIND_VIEWS again for the plans by level and by type, and with
     withoutTemplate for any plan no template holds; revit_views for a view
     on no sheet and what governs each; READ_MODEL_WARNINGS (PROVEN) for
     anything the views added. OPEN_VIEW (PROVEN) puts one on screen for the
     modeller to look at.

  WORKSHARED MODELS. A view or a view template another person owns is
  skipped and named, never taken (Constitution Article 12): a level left
  without its plan, its template or its scope box for that reason is said.
  Nothing here synchronises with central (Article 10).

  TWO CHATS ON ONE REVIT. expect_from with "where" -
  expect_from="find-views where nameContains=Level 1" - refuses a find the
  other chat left. Read the model before repeating a change whose answer
  never came: a plan or a dependent made twice is two views.

  NOT HERE, AND SAID RATHER THAN WORKED ROUND. DRAWING A SCOPE BOX: Revit
  gives add-ins no way to create one on any release Heron supports, so each
  box is drawn once by the modeller - View > Scope Box, in a plan - and
  named; from then on step 6 puts it on as many views as the job
  needs. Resizing one is the modeller's too. Matchlines and view references
  between dependents: nothing in the library draws them. Renaming many
  views in one go is a separate change. Sections, elevations and 3D views
  per level are not this method.

# WRITTEN FOR THIS METHOD on 2026-11-11, from the words of the brief it was
# asked for in - "views per level - plans per level, view template,
# dependent views, scope boxes". None of the three is the brief's sentence as
# it stood, and none is from the owner's own question log; his own way of
# asking is added on his word. No question is declared: this method is above
# the write line (D-86), and which views or templates there are is a read
# with a card of its own.
#
# THE SECOND SENTENCE SAID "per level" UNTIL REVIEW, AND DOES NOT NOW, ON
# PURPOSE: between two methods that share one word with a request, a lookup
# puts first the one whose own phrasing says that word most often
# (heron_skill.methods_for). Measured 2026-11-11, both backends: with "level"
# four times here, "create the levels" named this method first and
# project-setup - the method that makes levels - not at all; now it names
# project-setup first and this one second.
utterances:
  - make the plans for every level
  - create floor plans and ceiling plans with the view template
  - make dependent views of each plan with the scope boxes

# CAPABILITIES, never fragment ids - in the order the purpose gives.
needs:
  # Step 0's check that the model has a file to go back to.
  - REPORT_OPEN_DOCUMENTS
  # FIND_VIEWS - step 1's read, step 5's find and step 7's read-back - is
  # left off on purpose, as update-general-notes leaves off its read: a
  # lookup names a method whose needs hold one of its answers. Measured
  # 2026-11-11 on the model backend, with it here: the owner's "In these
  # sheets, how many floor plan views are there?" - a count - was offered
  # this method FIRST, through it alone. PROVEN, version 3, that day.
  - SELECT_VIEW_TEMPLATES
  - SELECT_SCOPE_BOXES
  - CREATE_PLAN_VIEW
  - APPLY_VIEW_TEMPLATE
  # Only when no template is wanted - step 4.
  - SET_VIEW_PROPERTIES
  # Only when dependents are asked for - step 5.
  - DUPLICATE_VIEWS
  # Last of the changes - step 6.
  - ASSIGN_SCOPE_BOX_TO_VIEW
  # The check. Never skipped.
  - READ_MODEL_WARNINGS
  # Only to put one plan on screen for the modeller - step 7. EXECUTE.
  - OPEN_VIEW

# What must be true BEFORE it runs, so it fails early with something
# useful instead of deep inside a transaction (docs/09 s2).
preconditions:
  - a project is open in front, it is the model the modeller means, and its levels exist
  - the modeller has said which levels, floor or ceiling plans or both, each view's name, the view template and the scope box - and none is assumed (D-33)
  - every scope box named is already drawn in the model and named - Revit lets nothing but a person draw one
  - the view template named is already in the model
  - the owner has Changes on - a refusal that names the switch is the answer
  - on a workshared model, what the modeller cannot edit is skipped and named - nothing is checked out or synchronised for them (Articles 10 and 12)
  - the model has a file and has been saved before step 3

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]

note: >
  WRITTEN 2026-11-11 IN A CLOUD SESSION, NOT RUN. No Revit was reachable. No
  new capability: every step names one the library already has, and on the
  day it was written only REPORT_OPEN_DOCUMENTS among them was DRAFT.

  The order - plans, then the template, then the dependents, then the scope
  boxes - was changed on review the day it was written: the first draft put
  one scope box on every plan and then one on each dependent. NEEDS REAL
  REVIT, on the owner's PC, on a saved scratch copy: (1) with a scope box
  on a parent plan, is a dependent's Scope Box read-only - and what does
  ASSIGN_SCOPE_BOX_TO_VIEW answer for it; (2) with none on the parent, does
  each dependent take its own; (3) does a dependent made after the template
  follow it. The first was looked for on 2026-11-11 and not settled: forum
  reports say yes for a parent holding one, and that dependent sections and
  elevations take none at all from Revit 2023 - plans only, here - and
  Autodesk's own help pages could not be opened from the session.

  DRAFT until the whole order has been run on a saved scratch copy and read
  back with FIND_VIEWS; no NEEDS-CHECKING group holds that run yet.

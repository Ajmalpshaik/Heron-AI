heron-status: DRAFT
heron-step: 17
heron-since: 0.1.0
heron-layer: brain

id: parameters-csv-round-trip
name: Parameters out to Excel and back - export a CSV, edit it, bring it back
domain: revit.parameters
# Heron wrote this one. D-66: a unit that ships with Heron says where it
# came from, so an IMPORTED one that says nothing stands out.
source: OFFICIAL

# PUBLISH, the highest rung any step stands on: the export writes a file that
# can go to other people (D-107). The read before it is READ and the return is
# MODIFY.
risk: PUBLISH

purpose: >
  The everyday round trip: chosen parameters of chosen elements go out to a
  CSV, the modeller edits a copy of it in Excel, Heron compares the copy with
  the file as exported, and only the cells that changed are written back
  onto the same elements - a different value per element, in ONE call and ONE
  entry in Revit's undo list. No new capability and no new tool: the export
  is EXPORT_PARAMETERS_TO_CSV, the comparison is a command the modeller runs
  on their PC, outside Revit (step 4 - OPEN-QUESTIONS Q-87, decided
  2026-11-15), and the return is SET_PARAMETER_VALUES_BY_ID reading the small
  file the comparison writes (its csvPath).

  The status in brackets after each capability is what that capability's own
  fragment.yaml said on 2026-11-11. The list of capabilities after this method
  is read from the library every time it is served: where the two differ, the
  list is right and this text is out of date. A read runs while its card is
  DRAFT and says so. A change does not: revit_change refuses a DRAFT, and a
  card whose proof is older than its code (D-117). Should the export or the
  return read DRAFT in that list, its refusal is the answer and the file
  waits; nothing here is tried round it.

  WHAT HAS RUN IN REVIT, AND WHAT HAS NOT. The export's proof ran on Revit
  2024 and its files were counted off disk. The return's latest proof,
  version 9's of 2026-11-16 on Revit 2024, ran rows BY KEY, as the ones
  before it did; no run of it from a csvPath is on record. The card the file route was merged in from was proved on a CSV on
  2026-10-21, but under another rule - it wrote every row it could, where
  this one writes all or nothing - so that proof does not describe this
  route. NEEDS REAL REVIT: NEEDS-CHECKING Group NJ, FRAGMENT-ISSUES row
  5b-1527, and for the small file of step 4 brought back, NJ13. The return's
  card was raised to version 8 on 2026-11-11 (a key with a * names many);
  while the served list shows it DRAFT, revit_change refuses step 6 and the
  modeller is told so before the file is made (NEEDS-CHECKING Group NG
  proves version 8). It was raised again to version 10 on 2026-11-20 (row
  5b-1526): a blank cell is now skipped before its parameter is looked for,
  and NEEDS-CHECKING Group NJ's NJ5 and NJ14 prove it; while the served list
  shows it DRAFT, step 6 waits as above. Say so to the modeller before
  step 6 on a model that matters, and offer a saved scratch copy first. The comparison of step 4
  reads two files and nothing else, and was tested off Revit only
  (tests/test_sheet_compare.py).

  THREE THINGS THE MODELLER IS TOLD BEFORE THE FILE IS MADE, because each
  costs a round trip when it is found afterwards:
  (a) KEEP THE FILE AS EXPORTED. Edit a COPY of it - saved as .xlsx, or as
      CSV - and leave the export itself untouched beside it: the comparison
      of step 4 reads both. Without the export as it was written, nothing
      can say which cells were edited.
  (b) ONLY THE CELLS THAT DIFFER FROM THE EXPORT GO BACK. The comparison
      lists them, old value and new, and writes them alone to a small file;
      a cell left as exported is not written, so a length the project shows
      rounded stays as the model holds it (row 5b-1525). WHAT IT CANNOT SEE:
      a value somebody changed in Revit after the export, in a cell the
      modeller ALSO edited - the new value is written over it. So the file
      comes back in the same sitting.
  (c) THE FILE IS ALL OR NOTHING, checked inside Revit before anything is
      written. One row or one column of the small file that cannot be used
      and nothing is written at all; the answer names each and why.

  0. ASK WHAT GOES OUT, ONCE (D-33). Which elements - a category, or what is
     selected - which parameters, and where the file goes: a path the
     modeller names for it, in a work folder of their own, never beside
     Heron or the model. None is assumed. The file comes back to THIS model
     only: rows are matched by element id, the export writes no UniqueId
     column, so a file from another model whose ids happen to be in use here
     is not caught.
  1. WHAT CAN COME BACK - READ, NOTHING CHANGED. REPORT_PARAMETER_INVENTORY
     (PROVEN, version 3 - a step of this method that the list served after
     it does not carry) on those elements, with sampleOnly false,
     includeTypeParameters true, fullRecord true and parameterFilter the
     words of the parameters asked for. Its `record` gives, for each element
     read - the first 50 of a larger set, and it says how many it left out -
     each of those parameters as writable or read-only, under that element's
     INSTANCE parameters or its TYPE's, with a shared one's GUID;
     sameNameTwice names a name two parameters share. A parameter with no
     line under an element is one that element does not carry. Read out
     which of the parameters asked for CANNOT come back from this file,
     before it is made: one on the TYPE (the return refuses it from an
     instance's row - a type is shared), one that is read-only, and one some
     of the elements do not carry. They may still go out for reading; the
     modeller leaves those columns as exported (step 3), and the comparison
     then sends nothing from them.
     A TYPE'S VALUE IS A DIFFERENT CHANGE, NEVER SLIPPED IN WITH THIS ONE:
     a row that carries the type's own id writes the type, and every
     element of that type changes, in the whole model and not only among
     the elements exported. It is offered only when the modeller asks for
     it, and it takes a yes of its own that names the type (Article 7).
  2. THE EXPORT - A FILE IS WRITTEN, NOTHING IN THE MODEL CHANGES.
     EXPORT_PARAMETERS_TO_CSV (PROVEN, version 1) through revit_change, with
     parameterNames the columns and csvPath the path from step 0. Its
     elements are the ones selected in Revit, or with expect_from the ones
     an earlier find left - FILTER_ELEMENTS_BY_CATEGORY for a category. Only
     when the modeller asked for THIS export (Article 10), with the Publish
     switch on in Heron's Settings (D-106, D-107) - the owner's switch, never
     turned on from a chat; a refusal that names the switch is the answer. A
     file already at that path is replaced, with no undo and no word from
     the card: ask before the call. It answers with `rows` - one per element -
     and the path. The first column is each element's id; each value is as
     Revit displays it. A parameter the element itself does not carry is
     read off its TYPE, and left empty when the type has none either. A
     column empty for EVERY element is named in the answer, and the card
     calls it a parameter name that does not exist on these. THAT SENTENCE
     IS WRONG WHEN THE PARAMETER IS THERE AND SIMPLY BLANK ON ALL OF THEM -
     a Mark exported in order to be filled in (row 5b-1551). Step 1's read
     says which it is; never tell the modeller a parameter is missing on
     that sentence alone.
  3. THE MODELLER EDITS - OUTSIDE REVIT, AND HERON DOES NOTHING. Say these
     before they open the file, in these words or plainer:
     - Edit a COPY. Keep the file as exported exactly as it was written,
       beside it - step 4 compares the two. In Excel, File > Save As under
       a NEW name BEFORE typing anything - Save alone writes over the
       export - as an Excel Workbook (.xlsx), or as CSV UTF-8 (Comma
       delimited).
     - Leave the first column, ElementId, and the header row as they are.
       An id or a header changed is named by the comparison and nothing on
       it is sent - so a change typed there is lost until it is put back.
     - Leave as exported the columns step 1 named: a type parameter, a
       read-only one, one some of the elements do not carry. Left alone,
       nothing from them is sent; edited, the return can refuse the whole
       file, naming the row.
     - Do not add rows. A row makes no element; the comparison names a row
       whose id is not in the export, and a row on an id already used, and
       sends nothing on either.
     - SORT AND FILTER WHOLE ROWS ONLY. Sorting one column on its own moves
       every value in it onto another element's id. The comparison holds
       back a column whose changed cells - three or more - are only the
       export's own values moved between elements, and says so; a sort that
       also changed some of the values is not caught.
     - A name with an accent, or in Arabic, can be spoiled when Excel OPENS
       the file, before anything is typed: the export writes UTF-8 with no
       mark saying so, and Excel opened by a double-click may read it as
       something else. Open it through Data > From Text/CSV with the file
       origin set to UTF-8, and look at such names before editing. A name
       spoiled that way is a changed cell to the comparison and is in its
       list, old and new - read the list. Read off the code, not opened in
       Excel here (row 5b-1528, Group NJ's NJ7).
     - Excel's doing on the way through: a number it only re-wrote - a Mark
       007 saved as 7, 0.50 as 0.5, a long number as 1.2E+11 - is the same
       number to the comparison and is not sent, so the model keeps its own.
       A date Excel made of 1-2 is not: it is a changed cell like any other,
       and in the list.
     - A Yes/No comes back as Yes, No, True, False, On, Off, 1 or 0. A
       material or a level is named exactly; a family type as Family: Type.
  4. COMPARE - ON THE MODELLER'S PC, OUTSIDE REVIT, NOTHING IN THE MODEL
     READ OR CHANGED. The modeller runs, in PowerShell in the Heron folder:
       python brain/heron_sheet_compare.py "<the file as exported>" "<the edited copy>"
     adding --sheet "<name>" for a workbook whose first sheet is not the one
     edited. It reads the two files and prints: how many cells changed, on
     how many elements, with a sample - id, parameter, old value and new;
     under NOT SENT, cells emptied on purpose, cells held back with why,
     ids added, typed over or on two rows, and headers renamed or added;
     and under LEFT AS THEY ARE, numbers only re-written, rows and columns
     deleted. It writes ONLY the changed cells to a small CSV beside the
     edited copy - its name ends -changed-cells.csv; --out names another
     place in the modeller's own work folder, never the Heron folder - and
     prints that path. Ask the modeller to read out, or paste, what it
     printed. Everything under NOT SENT is asked about, never guessed
     (D-33); a change wanted there is made in the copy and the command run
     again. Nothing changed: no file is written, there is nothing to bring
     back, and the method stops here. A refusal - the export not given
     first, no ElementId column - says what to do in its own words.
  5. BLANKS - skip, always, for the small file. Its blank cells are the
     ones nobody changed; blankCells=clear would empty every one of them.
     A cell the modeller emptied ON PURPOSE is listed apart by the
     comparison, under BLANKED ON PURPOSE, and is not in the small file:
     emptying a value is a change of its own and a yes of its own (D-33,
     Article 7), never slipped in. WRITE_ELEMENT_PARAMETERS clear=true is
     Revit's own clear, for a number, a tick box, a reference or text alike,
     on the elements named, one parameter at a time.
  6. THE RETURN - ONE CALL, ONE UNDO - OF THE SMALL FILE, never the edited
     copy. THE CARD ITSELF COMPARES NOTHING WITH THE MODEL BEFORE IT WRITES
     (row 5b-1525): step 4 compared the file with the export, not with the
     model. revit_change with dry_run=true runs a change and rolls it
     back, and its answer shows old -> new values for the elements it
     changed, up to a limit it names when it is reached (D-155, D-156;
     built, not run in Revit - Groups NS, NT) - BUT ONLY FOR A CARD
     revit_change RUNS AT ALL: while this
     step's card is DRAFT, a dry run of it is refused exactly as the write
     is. Where it can be had it is a count for the chat, never the
     modeller's yes.
     WHETHER REVIT ASKS BEFORE IT KEEPS THE CHANGE IS THE OWNER'S SWITCH,
     Ask to Keep, AND IT IS OFF ON A PC AS INSTALLED (D-138). revit_health
     says which way it is set for that Revit, read from Revit itself
     (built, not yet run in Revit - Group NP), so CHECK IT before the call.
     Where its line says that Revit's Heron does not say, or could not be
     read, ASK THE MODELLER: it is in Heron's Settings on the Heron tab
     (D-150), and python tools/heron-ready.py, run in the Heron folder,
     prints it.
     - OFF: the whole file is KEPT AT ONCE, with nothing shown first - one
       entry in Revit's undo list, which Revit's Undo takes back.
     - ON: Revit selects and isolates what the call touched and asks Keep
       or Discard, and nothing is kept until Keep (D-126). One exception:
       where the modeller has used that box's link to keep the rest of a
       job without asking, this chat's changes to this model are kept
       unasked until ten quiet minutes pass - this call too, and its
       answer says so.
     Say which of these it will be. A modeller who wants to look before a
     bulk write is kept turns Ask to Keep on first; it is the owner's
     switch and is never turned from a chat.
     THE MODELLER'S YES FOR THIS WRITE COMES BEFORE THE CALL, WHICHEVER
     WAY THE SWITCH STANDS: a bulk parameter write is asked for by name
     (Article 7). Name the model in front, the small file, the columns it
     holds and how many cells on how many elements - the comparison's
     count, which `written` should match afterwards - and that blanks are
     skipped.
     Then SET_PARAMETER_VALUES_BY_ID (its status is in the list served
     after this method - see WHAT HAS RUN)
     through revit_change, with csvPath the small file's full path and
     blankCells=skip only: `rows` left out (both given is refused), and no
     expect_from - the file's rows alone name the elements, and what is
     selected in Revit is never read.
     WHAT STOPS THE WHOLE FILE, each named in `stale` and `rowFindings`
     with its row: an id that names no element here - an element deleted
     since the export reads the same way, as the wrong model's file; an id
     on two rows; a cell with a value under a column the element has no
     parameter for, or has on its type; a read-only parameter whose cell is not blank - or is blank
     under clear, for a text one; a name two writable parameters share
     (name the one meant as Name {its GUID}, which step 1 printed); a
     level's Name (Revit asks about its views - the card's renameViews,
     the modeller's to say); an element in a model group, for a value that
     cannot differ between the group's copies; a material, level or type
     name that matches none or two. A value Revit turns down as it is
     written - a tick box given
     another word, a number it cannot read - takes every row back: nothing
     is kept. Each is fixed by the modeller IN THE EDITED COPY, step 4 is
     run again and this step with the new small file; no row is edited or
     dropped by Heron to get the rest in. A BLANK cell of the small file is
     left as it is before its parameter is looked for (the return's version
     10, row 5b-1526), so a column some of the elements have not got - a
     mixed set, ducts and air terminals - no longer stops the file; version
     9 refused it. A column every cell of which was blank is named in the
     answer's findings.
  7. SAY WHAT CAME BACK, in Revit words. `written` is the number of CELLS
     written and read back as asked - against the comparison's count, not a
     count of values the model did not already hold: a cell that differs
     from the export may equal what Revit holds now. rowsMatched and
     rowsUnmatched; blankCellsSkipped and
     cellsCleared; valuesRejected - values Revit took and then read back
     different, each named in the findings; resultJson's readBack is what
     Revit holds now for each cell, and for a number that is the value to
     read out, since Revit parses a number in the project's own units. To
     take the whole return back, Revit's Undo - one entry; never a second
     change to reverse the first.

  WORKSHARED MODELS. An element another person owns is a normal outcome and
  is never taken (Article 12); what the return answers for one has not been
  seen in Revit (Group NJ). Nothing here synchronises with central.

  NOT HERE: a value somebody changed in Revit since the export, in a cell the
  modeller also edited - the comparison reads two files, not the model; a
  UniqueId column in the export, or a read of the model, would reach it,
  and neither is built - no UniqueId column for now, decided 2026-11-20 on
  the owner's delegation (D-182, Q-87 question c). A chat tool for the
  comparison - it is a command on the PC, confirmed by the owner 2026-11-20
  (D-182, Q-87 question b). A type parameter from an instance's row - to change
  a type, the row carries the TYPE's own id, every element of that type in
  the model changes, and it is its own change with its own yes (step 1).
  New elements from rows. A
  schedule exported with EXPORT_SCHEDULE_TO_CSV - its rows are what the
  schedule shows and carry no element id, so it is not this file. ONE value
  on every element is WRITE_ELEMENT_PARAMETERS, no file needed. Editing the
  values in a table without leaving Revit is the Companion's table
  (revit_edit_table), where each cell is checked against the model when it
  is applied.

# WRITTEN FOR THIS METHOD, 2026-11-11 - none is from the owner's own question
# log; his own way of asking is added on his word. The third is the sentence
# the brief this method was asked for in measured, as it stood. No question
# is declared: this method is above the write line (D-86), and what a
# parameter holds is a read with a card of its own.
utterances:
  - export the parameters to Excel, edit them and bring them back
  - round trip the parameters through a CSV
  - update parameters from this Excel

# CAPABILITIES, never fragment ids - in the order the purpose gives.
# FILTER_ELEMENTS_BY_CATEGORY, the find that hands the export its elements,
# is left off on purpose, as update-general-notes leaves off the capabilities
# that only pick: a lookup names a method whose needs hold one of its answers,
# and that find answers most requests about a category.
#
# REPORT_PARAMETER_INVENTORY, STEP 1's READ, IS LEFT OFF FOR THE SAME REASON,
# AND THE NAME SAYS "bring it back", NOT "bring the values back" - MEASURED
# 2026-11-11 on the model backend, against every sentence on file (the
# owner's questions, every other method's utterances, these cards' own).
# With the inventory in `needs` and "values" in the name, the owner's READ
# "Record all the parameter values of the selected family before I change it"
# was offered this PUBLISH method in place of profile-family-creation, and
# "find the blank parameters" was offered it in place of ifc-export-readiness.
# With both out, no sentence on file is offered a different list, on the
# model backend or the lexical one. So the list served with this method does
# not carry the inventory's status; step 1 says it, with its date.
# WRITE_ELEMENT_PARAMETERS is named at step 5 as where a cell emptied on
# purpose is sent, not as a step of this method.
needs:
  # PUBLISH.
  - EXPORT_PARAMETERS_TO_CSV
  # MODIFY, from csvPath.
  - SET_PARAMETER_VALUES_BY_ID

# What must be true BEFORE it runs, so it fails early with something
# useful instead of deep inside a transaction (docs/09 s2).
preconditions:
  - a project is open in front, and it is the model the file was exported from - a file is brought back to that model only
  - the modeller has said which elements, which parameters and where the file goes, and none is assumed (D-33)
  - for the export, the modeller asked for THIS export and named the path, and the owner has Changes and the Publish switch on (Article 10, D-106, D-107)
  - the file as exported is kept as it was written, a copy of it was edited, and the comparison (python brain/heron_sheet_compare.py) has been run on the two, everything under its NOT SENT asked about; what comes back is the small file it wrote
  - the small file comes back with blankCells=skip; a cell emptied on purpose is asked about apart, as a change of its own, and never assumed
  - for the return, revit_health has said whether Ask to Keep is on for that Revit - or, where its line could not say, the modeller has - and the modeller has been told that with it off the file is kept at once
  - for the return, the modeller has said yes to this write by name before the call (Article 7), the owner has Changes on, and nobody has changed those elements since the export

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]


heron-status: DRAFT
heron-step: 17
heron-since: 0.1.0
heron-layer: brain

id: family-creation
name: Build a new parametric family, from sizes, a sketch or a picture
domain: revit.families
# Heron wrote this one. D-66: a unit that ships with Heron says where it
# came from, so an IMPORTED one that says nothing stands out.
source: OFFICIAL

risk: MODIFY

purpose: >
  Builds a parametric component family in the Family Editor from an empty
  template - a box, a diffuser with a round neck, a valve, a pump, a bracket,
  a light fitting - so that it RESIZES correctly from its parameters. It may
  start from a list of sizes, a sketch, or only a PICTURE of the thing. The
  modeller opens the template (File, New, Family); Heron builds inside it. A
  family is its method, so the steps are listed in the order they have to
  happen, and the order is not a preference: taking two of them the other way
  round breaks the family in a way that looks fine until somebody resizes it.

  0. REPORT_FAMILY_TEMPLATE, then READ THE THING. The report says which KIND
     of family the modeller opened - and a family that is not level-based or
     work-plane-based has a skill of its own: HOSTED-FAMILY-CREATION for a
     wall-, ceiling-, floor-, roof- or face-based one, LINE-BASED-FAMILY-CREATION,
     PATTERN-BASED-FAMILY-CREATION, ADAPTIVE-FAMILY-CREATION,
     PROFILE-FAMILY-CREATION, DETAIL-FAMILY-CREATION, and
     MEP-FITTING-FAMILY-CREATION for a duct or pipe fitting. Then read the
     thing before anything is built - from the picture, the
     sketch or the words. Say back, in one list: what it is and the category
     it belongs to; the FORMS it is made of, each as the form that builds it -
     a box between planes, a round or any other shape pushed straight
     (extrusion), a shape turned about an axis (revolve: cones, domes, knobs,
     round bodies), one shape changing into another (blend: square-to-round
     necks, tapered legs), a shape carried along a path (sweep: rails, pipe
     runs, frames, rings), one shape changing along one bend (swept blend:
     reducers, elbows), every hole or notch as a void, every part that
     repeats in a row - blades, fins, slots - as one form and a count, and
     every part that is a family of its own - a motor, a handle - nested; every
     SIZE that
     describes them, marking which change between types - those become
     parameters - and which never do; and every PART only some types have,
     which becomes a Yes/No parameter. A PICTURE GIVES SHAPE AND PROPORTION,
     NEVER SIZE: every size, parameter name and type name is the modeller's,
     asked for once, in that one list, and never assumed or scaled off the
     image (D-33). Where the picture cannot show something - the back, the
     inside, a hidden neck - ask rather than invent it.
  1. SET_FAMILY_CATEGORY first, when the template's category is not the one
     wanted - a Generic Model that should be an Air Terminal. The category
     brings its own built-in parameters, and everything after it builds on
     them. Then SET_FAMILY_SETTINGS when the family will be nested in another
     one: Work Plane-Based, so it is placed on a plane and moves with it, and
     Shared when a project must schedule or tag it on its own.
  2. ADD_FAMILY_PARAMETERS - the sizes the family is driven by, as TYPE
     lengths when they describe the product; a diameter is a length too. Any
     value a project must TAG or SCHEDULE is a shared parameter instead, from
     the office's shared parameter file: ADD_FAMILY_SHARED_PARAMETERS.
  3. SET_FAMILY_TYPE_VALUES - make the first type and write the real sizes into
     it. BEFORE any dimension is labelled: a new length reads 0, and a label on
     a 0 drives its planes onto each other.
  4. SET_FAMILY_FORMULA where one size follows another - "Neck Width = Width -
     100 mm", "Radius = Diameter / 2". Names are written bare, spaces and all.
  5. CREATE_REFERENCE_PLANES - the skeleton, at the positions the sizes put
     them: left-right planes, front-back planes, height planes. One plane for
     every face whose position a parameter drives. Then
     SET_FAMILY_PLANE_REFERENCE: Left, Right, Front, Back, Top and Bottom on
     the outer planes a project dimensions to, Strong or Weak Reference on any
     other it should reach, Not a Reference on planes only the build needs,
     and Defines Origin where the family is placed from - before anything is
     placed in a project, because a project's units take a moved origin when
     the family is loaded again.
  6. LABEL_FAMILY_DIMENSION for every straight size - with the family's centre
     plane for left-right and front-back, so the shape stays centred on its
     insertion point; from Ref. Level for a height.
  7. THE FORMS, each drawn exactly where the planes are NOW, so that its faces
     lie on them: EXTRUDE_BETWEEN_PLANES for a box, which locks itself;
     CREATE_FAMILY_EXTRUSION for any other shape pushed straight;
     CREATE_FAMILY_REVOLUTION, CREATE_FAMILY_BLEND, CREATE_FAMILY_SWEEP and
     CREATE_FAMILY_SWEPT_BLEND for the rest. Every one gives back its form's
     id, which every later step names it by. Shapes are typed in millimetres
     in the work plane's own two model coordinates.
  8. LOCK_FORM_TO_PLANES for every form that is not a box from step 7 - each
     flat face that lies on a plane a parameter moves. A face not locked stays
     where it was drawn when its plane moves, and looks parametric until the
     first flex. Where the size is the form's OWN field rather than a plane,
     LINK_FAMILY_FORM_PARAMETER instead: an extrusion's end to a length, a
     revolve's end angle to an angle - a bend whose angle the types choose.
     Never both on one face.
  9. LABEL_FAMILY_RADIUS for every round size - the parameter holding the size
     first, as in step 3.
  10. THE VOIDS, built as void forms in step 7, each cut into the solid it must
      cut with COMBINE_FAMILY_FORMS - a void made through the API cuts NOTHING
      until it is combined, and the cut is measured. Solids that should read as
      one piece are joined the same way. A part that repeats in a row is ONE
      form made in step 7 and ARRAY_FAMILY_FORMS, its count an Integer
      parameter given its value in step 3; an arrayed void's copies are each
      combined in turn, by the ids the array gives back.
  11. ADD_FAMILY_CONNECTOR on the face its service leaves by, sized by the
      parameters so the port follows the neck - for MEP families. A part that
      is a family of its own, loaded in with LOAD_FAMILY: PLACE_NESTED_FAMILY
      on the plane it sits on - a Work Plane-Based family is placed on every
      release, a level-based one only from Revit 2024 - then
      LOCK_NESTED_FAMILY_TO_PLANES by its own Left, Right, Front, Back, Top,
      Bottom or centres, then LINK_NESTED_TYPE_PARAMETER for its type's sizes
      and LINK_FAMILY_PARAMETER for its instance's. A nested part whose TYPE
      the family's types choose - the 5 kW or the 7 kW motor - is
      ADD_FAMILY_TYPE_PARAMETER, which also swaps a sweep's loaded profile.
  12. SET_FAMILY_FORM_MATERIAL for each form's material - linked to a family
      material parameter when a project must set it per type, the body and
      the neck apart - then SET_FAMILY_FORM_SUBCATEGORY and
      SET_FAMILY_FORM_VISIBILITY where a project must show or style a part on
      its own: the body hidden in a coarse plan, the insulation on its own
      subcategory. A part only some types have from step 0:
      LINK_FAMILY_FORM_PARAMETER, its Visible to that Yes/No parameter. Where a
      plan must show a SYMBOL rather than the body - a valve's bow tie, a fan's
      circle and cross - DRAW_FAMILY_SYMBOLIC_LINES on Ref. Level at the levels
      the body is hidden at, with DRAW_FAMILY_FILLED_REGION for a solid or
      masked part of the symbol (in a 3D family from Revit 2023, a masking
      region from 2024). A family that must flip once placed gets
      ADD_FAMILY_FLIP_CONTROL.
  13. REPORT_FAMILY_FORMS - every form read back with its size, against the
      list from step 0, before the proof.
  14. FLEX_FAMILY last, at sizes that are really different and not square - the
      only step that PROVES the family follows. "The calls did not fail" is not
      the proof; the geometry read back at another size is.
  15. A family with many types gets a TYPE CATALOG - REPORT_FAMILY_TYPE_CATALOG
      gives the text, saved beside the .rfa with its name and .txt, so a
      project loads only the types it picks.

  The family is saved by the modeller: Revit will not save the document open
  in its window while Heron holds it.

  NOT YET: reference lines and angles - a part that swings or tilts about a
  pivot. A reference line can be made through the API, and an angle labelled,
  but no DOCUMENTED call gives the planes a reference line carries, so a form
  cannot be put on one; the only route found reads a reference out of an
  undocumented string Autodesk says is not meant to be parsed (row 5b-278).
  A revolve whose angle the types choose is the documented route for a bend.
  A Family Type parameter, a type catalog, flip controls and filled and
  masking regions were on this line until 2026-10-02 and are built now.
  Whether a label on a round form's edge DRIVES the circle is not yet known
  on any release: step 14 is where that is found out (NEEDS-CHECKING BM3).
  This line said until 2026-10-01 that a circle's size cannot be driven
  through the API on Revit 2020; that was measured for a project, not a
  family (row 5b-261).

# The words people say when they want a family made.
utterances:
  - build a new parametric family
  - make an air terminal family with a duct connector
  - create this family from these sizes
  - make this family parametric and flex it
  - build a parametric family from this picture
  - make a family from this photo
  - make a revit family that looks like this image
  - make a parametric family from my sketch

# CAPABILITIES, never fragment ids - in the order the purpose gives.
needs:
  - REPORT_FAMILY_TEMPLATE
  - SET_FAMILY_CATEGORY
  - SET_FAMILY_SETTINGS
  - ADD_FAMILY_PARAMETERS
  - ADD_FAMILY_SHARED_PARAMETERS
  # Values BEFORE labels - see step 3.
  - SET_FAMILY_TYPE_VALUES
  - SET_FAMILY_FORMULA
  - CREATE_REFERENCE_PLANES
  - SET_FAMILY_PLANE_REFERENCE
  - LABEL_FAMILY_DIMENSION
  - EXTRUDE_BETWEEN_PLANES
  - CREATE_FAMILY_EXTRUSION
  - CREATE_FAMILY_REVOLUTION
  - CREATE_FAMILY_BLEND
  - CREATE_FAMILY_SWEEP
  - CREATE_FAMILY_SWEPT_BLEND
  - LOCK_FORM_TO_PLANES
  - LINK_FAMILY_FORM_PARAMETER
  - LABEL_FAMILY_RADIUS
  - COMBINE_FAMILY_FORMS
  - ARRAY_FAMILY_FORMS
  - ADD_FAMILY_CONNECTOR
  - LOAD_FAMILY
  - PLACE_NESTED_FAMILY
  - LOCK_NESTED_FAMILY_TO_PLANES
  - LINK_NESTED_TYPE_PARAMETER
  - ADD_FAMILY_TYPE_PARAMETER
  - LINK_FAMILY_PARAMETER
  - SET_FAMILY_FORM_MATERIAL
  - SET_FAMILY_FORM_SUBCATEGORY
  - SET_FAMILY_FORM_VISIBILITY
  - DRAW_FAMILY_SYMBOLIC_LINES
  - DRAW_FAMILY_FILLED_REGION
  - ADD_FAMILY_FLIP_CONTROL
  - REPORT_FAMILY_FORMS
  # The proof, and never skipped.
  - FLEX_FAMILY
  - REPORT_FAMILY_TYPE_CATALOG

# What must be true BEFORE it runs, so it fails early with something
# useful instead of deep inside a transaction (docs/09 s2).
preconditions:
  - a family document is open in front in the Family Editor, started by the modeller from the template the job needs - Heron does not choose a template
  - every size, parameter name and type name has been given for THIS request - a picture or a sketch alone gives none of them
  - the family is not yet built - rebuilding one that already has labelled dimensions leaves the old labels behind to fight the new ones

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]

note: >
  Each step is one entry in the Family Editor's undo list. Built 2026-09-24 on
  the owner's instruction to bring family creation into Heron, as boxes only;
  widened 2026-10-01, on the owner's word "extrude, revolve, all modelling
  capability ... maybe I will give only an image", to every form, the locks, a
  round size, voids that cut, a form's own fields linked, Is Reference,
  arrays, plan symbols, nested families, the family's own settings, shared
  parameters, and a family read from a picture. Widened again 2026-10-02, on
  the owner's word "line based, ceiling based, patterns, floor based, wall
  based ... all kind", with the template report as its first step, a Family
  Type parameter, filled regions, flip controls and a type catalog, and with
  a skill of its own for each other kind of family (docs/41). Every step is
  DRAFT until it has been run on a real family with a negative case (D-30).

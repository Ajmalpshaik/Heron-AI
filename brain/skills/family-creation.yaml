heron-status: DRAFT
heron-step: 17
heron-since: 0.1.0
heron-layer: brain

id: family-creation
name: Build a new family - parametric from sizes, a sketch or a picture, or fixed-size and detailed
domain: revit.families
# Heron wrote this one. D-66: a unit that ships with Heron says where it
# came from, so an IMPORTED one that says nothing stands out.
source: OFFICIAL

risk: MODIFY

purpose: >
  Builds a component family in the Family Editor from an empty template - a
  box, a diffuser with a round neck, a valve, a pump, a bracket, a light
  fitting, a generator - either PARAMETRIC, so that it RESIZES correctly from
  its parameters, or FIXED-SIZE, a detailed model built for how it looks. It
  may start from a list of sizes, a sketch, or only a PICTURE of the thing. The
  modeller opens the template (File, New, Family); Heron builds inside it. A
  family is its method, so the steps are listed in the order they have to
  happen, and the order is not a preference: taking two of them the other way
  round breaks the family in a way that looks fine until somebody resizes it.

  A FIXED-SIZE FAMILY - "a detailed generator, no parameters", "visual only" -
  takes steps 0, 1, 7, 10, 11, 12 and 13, in that order, and the modeller
  saves it. Steps 2 to 6, 8, 9, 14 and 15 are left out, because no size moves,
  with two exceptions: CREATE_REFERENCE_PLANES for a plane a form is sketched
  on or a connector sits on, and the one length parameter a connector is sized
  by (step 11). Its sizes are still asked for once, in step 0's list: where the
  modeller wants typical proportions, they go in that list as proposals to
  accept, marked typical rather than a maker's figures (D-33).

  BUILD IT PART BY PART, NEVER IN ONE CLICK AT THE END (the owner's rule,
  2026-10-11). Step 0's list splits the thing into GROUPS, and the family
  decides them: how many groups, what goes in each and in what order is
  whatever is easiest for THIS family - there is no set number and no set
  order. Many small parts of one kind may be one group; one big body may be
  a group on its own. Seen: a desk as top, frame, drawers, handles; a fan
  coil unit as casing, fans, coil and drain, air side, electrics; a fire
  pump as baseplate, pump, coupling, motor, trim, connectors. Then, for each
  group in turn: work out only that group's parts, build them in
  ONE CREATE_FAMILY_FORMS call with their materials named on the rows (step
  7 is one call PER GROUP, not one for the whole family), tell the modeller
  in one line what is now in Revit, and move to the next group. Never work
  out every part of the family silently and build it all at the end: the
  thinking takes the same time either way, Revit takes about a second per
  call, but the modeller sees nothing for many minutes and a wrong part is
  found only when everything is built. Group by group, the first part is on
  screen within about a minute and a mistake costs only its own group.
  Measured 2026-10-11 on a fixed fan coil unit: 87 parts and 6 connectors in
  5 groups, 4 min 50 s from request to built; a 186-part transformer built
  in one call took 9 min 40 s, 27 s of it Revit and Heron.

  TWO WAYS TO SEND THE PARTS, and the modeller chooses by name. BATCH BUILD,
  above, is the default - named so because "group" is Revit's own word for
  a model group, which this has nothing to do with. CONTINUOUS BUILD - every form its own
  CREATE_FAMILY_FORMS call, so the modeller watches the parts arrive one
  after another - is used when the modeller asks for it by that name. It builds the same
  family with no more mistakes, but it is slower and fills the chat: each
  call is a turn and each reply is read. Measured 2026-10-12 on one fixed
  diesel fire pump set already planned, 111 parts and 6 connectors: batch build
  12 calls, 34 s; continuous build 117 calls, 3 min, Revit's own work
  4.4 s and 7.4 s. Say that before starting a continuous build of a large
  family.

  0. REPORT_FAMILY_TEMPLATE, then READ THE THING. The report says which KIND
     of family the modeller opened - and a family that is not level-based or
     work-plane-based has a skill of its own: HOSTED-FAMILY-CREATION for a
     wall-, ceiling-, floor-, roof- or face-based one, LINE-BASED-FAMILY-CREATION,
     PATTERN-BASED-FAMILY-CREATION, ADAPTIVE-FAMILY-CREATION,
     PROFILE-FAMILY-CREATION, DETAIL-FAMILY-CREATION,
     MEP-FITTING-FAMILY-CREATION for a duct or pipe fitting,
     DOOR-WINDOW-FAMILY-CREATION, STRUCTURAL-FAMILY-CREATION for a beam, a
     brace or a structural column, and LIGHTING-FIXTURE-FAMILY-CREATION for a
     light with its light source. CHECK THE UNITS NEXT: the report's units
     line says what the family shows a length in. Where it reads IMPERIAL -
     Feet and fractional inches - and the modeller works in millimetres, SAY
     SO BEFORE ANYTHING IS BUILT: sizes typed in millimetres still build
     right, but every dimension and value then shows in feet and inches, and
     the modeller finds it only afterwards (an outdoor unit, 2026-10-12,
     Revit 2020). Offer SET_PROJECT_UNITS "Length=Millimeters, 0 decimal
     places" - the Admin switch - or the family started again from the
     Metric template, and the modeller chooses. A report with no units line,
     or one that could not read it, is followed by REPORT_PROJECT_UNITS, one
     call. SAVE FIRST WHEN IT HAS NO FILE: where REPORT_OPEN_DOCUMENTS lists
     the family in front as NEVER SAVED and the build is large, ask the
     modeller once to save it (Ctrl+S) before the first write - Heron cannot
     save the family in front itself, and closed with no file it is lost.
     Then read the
     thing before anything is built - from the picture, the
     sketch or the words. Say back, in one list: what it is and the category
     it belongs to; the FORMS it is made of, each as the form that builds it -
     a box between planes, a round or any other shape pushed straight
     (extrusion), a shape turned about an axis (revolve: cones, domes, knobs,
     round bodies), one shape changing into another (blend: square-to-round
     necks, tapered legs), a shape carried along a path (sweep: rails, pipe
     runs, frames, rings), one shape changing along one bend (swept blend:
     reducers, elbows), every hole or notch as a void, every part that
     repeats in a row - blades, fins, slots - as one form and a count, and
     every part that is a family of its own - a motor, a handle - nested; every
     SIZE that
     describes them, marking which change between types - those become
     parameters - and which never do; and every PART only some types have,
     which becomes a Yes/No parameter. A PICTURE GIVES SHAPE AND PROPORTION,
     NEVER SIZE: every size, parameter name and type name is the modeller's,
     asked for once, in that one list, and never assumed or scaled off the
     image (D-33). Where the picture cannot show something - the back, the
     inside, a hidden neck - ask rather than invent it.
  1. SET_FAMILY_CATEGORY first, when the template's category is not the one
     wanted - a Generic Model that should be an Air Terminal. The category
     brings its own built-in parameters, and everything after it builds on
     them. CLASSIFY IT FROM THAT CATEGORY NEXT: REPORT_FAMILY_TEMPLATE's
     classificationCodes line lists the OmniClass Numbers (Classification
     Number from Revit 2026) that Revit's own taxonomy file gives the
     category - run it again when the category was just changed. Propose the
     one that fits the thing; the modeller confirms it, and picks where more
     than one could fit - never guessed (D-33). SET_FAMILY_SETTINGS "OmniClass
     Number=<code>" writes it and reads the title back. No file, or no code
     for the category - Revit 2026 and later ship only a sample file - is
     said, and the step is left out.
     Then SET_FAMILY_SETTINGS when the family will be nested in another
     one: Work Plane-Based, so it is placed on a plane and moves with it, and
     Shared when a project must schedule or tag it on its own. An INLINE valve
     or accessory that a pipe breaks into is the other way round: Work
     Plane-Based=no - a work-plane-based check valve would not connect to its
     pipe - and a Breaks Into Part Type, "Valve - Breaks Into" for a valve
     (Revit's ValveBreaksInto; a bare "Valve" is refused with Revit's own list).
  2. ADD_FAMILY_PARAMETERS - the sizes the family is driven by, as TYPE
     lengths when they describe the product; a diameter is a length too. Any
     value a project must TAG or SCHEDULE is a shared parameter instead, from
     the office's shared parameter file: ADD_FAMILY_SHARED_PARAMETERS. A family
     parameter already labelling dimensions that must become the office's
     shared one is REPLACED in place - the same tool, replaceExisting true,
     "Width=Unit_Width" - never a second parameter driven by a formula, which
     leaves two per size in the Properties palette. A name the office's file
     does not have yet is CREATED in it by the same tool, createMissing true,
     written "Group: Name [Data type]" - "Refrigerant: Gas Pipe Diameter [Pipe
     Size]". Ask the modeller for the group and the data type; never pick
     them. It writes the office's file, which Undo does not reach, so it needs
     the Admin switch and his yes for those names.
  3. SET_FAMILY_TYPE_VALUES - make the first type and write the real sizes into
     it. BEFORE any dimension is labelled: a new length reads 0, and a label on
     a 0 drives its planes onto each other.
  4. SET_FAMILY_FORMULA where one size follows another - "Neck Width = Width -
     100 mm", "Radius = Diameter / 2". Names are written bare, spaces and all.
  5. CREATE_REFERENCE_PLANES - the skeleton, at the positions the sizes put
     them: left-right planes, front-back planes, height planes. One plane for
     every face whose position a parameter drives. Then
     SET_FAMILY_PLANE_REFERENCE: Left, Right, Front, Back, Top and Bottom on
     the outer planes a project dimensions to, Strong or Weak Reference on any
     other it should reach, Not a Reference on planes only the build needs,
     and Defines Origin where the family is placed from - before anything is
     placed in a project, because a project's units take a moved origin when
     the family is loaded again.
  6. LABEL_FAMILY_DIMENSION for every straight size - with the family's centre
     plane for left-right and front-back, so the shape stays centred on its
     insertion point; from Ref. Level for a height.
  7. THE FORMS, each drawn exactly where the planes are NOW, so that its faces
     lie on them: EXTRUDE_BETWEEN_PLANES for a box, which locks itself;
     CREATE_FAMILY_EXTRUSION for any other shape pushed straight;
     CREATE_FAMILY_REVOLUTION, CREATE_FAMILY_BLEND, CREATE_FAMILY_SWEEP and
     CREATE_FAMILY_SWEPT_BLEND for the rest. Every one gives back its form's
     id, which every later step names it by. MANY extrusions and revolves -
     a family of dozens of parts - go in ONE call of CREATE_FAMILY_FORMS, a
     row per form written once to a file under %TEMP%\heron-work: one undo
     entry, every id given back in the order listed. Shapes are typed in
     millimetres in the work plane's own two model coordinates. ONE
     EXTRUSION TAKES MANY LOOPS, `|` between: every outline that shares a
     plane, a start and an end, such as eight bolts, a row of louvre slats
     or the rings of a fan guard, is one form instead of dozens. Loops that
     touch or cross fail with only "code 1" (row 5b-296): a ring is an
     outer loop with an inner one, and a smaller ring may sit inside that
     hole. A SLOT WITH ROUND ENDS is one loop of corners and `arc MX,MY X,Y`
     sides - "xc-5,zc+15; arc xc,zc+20 xc+5,zc+15; xc+5,zc-15; arc xc,zc-20
     xc-5,zc-15" - STARTED at the end of a straight side: the tool closes
     every loop itself with a STRAIGHT line back to its first corner, so
     that straight side is the one it draws, and the first corner is never
     written again at the end. A HEX NUT is `polygon CX,CY R 6`, R the
     radius to a CORNER, not half across the flats - 13 mm across flats is
     R 7.5. The first corner lies along the plane's first coordinate, so on
     Center (Left/Right) the flats come out top and bottom - R 6.35 read
     back at Z 279.5 to 290.5, 11 mm across the flats. A small part -
     a port, a screw, a bolt - carries `detailLevels=medium, fine` or
     `detailLevels=fine` on its own row: set and read back in the same
     call, with no SET_FAMILY_FORM_VISIBILITY step after it. Measured
     2026-10-14 on Revit 2020, a fixed 60 inch monitor on a wall bracket:
     43 forms in 6 calls, every extent read back by REPORT_FAMILY_FORMS as
     planned; six such slots and eight circles through two straps were one
     row, and its volume read back at the hand calculation's 225980.5 cubic
     millimetres. A long profile - a thread, blades, rings, a row of bars - is
     written out by a small script, into that file or the call, never
     typed by hand and never saved beside Heron. A smooth shape none of
     these makes in one piece - a coil, an organic body - is
     CREATE_FAMILY_FREEFORM_SOLID: a FIXED shape that no plane or parameter
     moves and no lock or label reaches, so say that before using it.
  8. LOCK_FORM_TO_PLANES for every form that is not a box from step 7 - each
     flat face that lies on a plane a parameter moves. A face not locked stays
     where it was drawn when its plane moves, and looks parametric until the
     first flex. Where the size is the form's OWN field rather than a plane,
     LINK_FAMILY_FORM_PARAMETER instead: an extrusion's end to a length, a
     revolve's end angle to an angle - a bend whose angle the types choose.
     Never both on one face.
  9. LABEL_FAMILY_RADIUS for every round size - the parameter holding the size
     first, as in step 3.
  10. THE VOIDS, built as void forms in step 7, each cut into the solid it must
      cut with COMBINE_FAMILY_FORMS - a void made through the API cuts NOTHING
      until it is combined, and the cut is measured. Solids that should read as
      one piece are joined the same way. A solid is in one combination at
      most: to cut it again, name that combination's id with the new voids,
      never the solid. A void cuts every solid in its combination that it
      passes through, so one bore void the length of a valve notches whatever
      else is joined along it - give each flange its own short void. A part
      that repeats in a row is ONE form made in step 7 and ARRAY_FAMILY_FORMS,
      its count an Integer parameter given its value in step 3; an arrayed
      void's copies are each
      combined in turn, by the ids the array gives back.
  11. ADD_FAMILY_CONNECTOR on the face its service leaves by, sized by the
      parameters so the port follows the neck - for MEP families. Exactly one
      SOLID face may lie on the plane it is named by, so each connector face
      gets a plane of its own, never one it shares with another flange. Since
      version 3 (row 5b-410) it also looks for the face in a combination, but
      whether Revit takes a connector there is not yet proved in Revit: until
      it is, keep a connector's flange out of every combination in step 10, or
      put a thin uncut pad on its face - a form's own face is used first. A
      REVOLVED flange needs the pad too, combined or not: a 360-degree revolve
      leaves its flat end as TWO half-faces on the one plane, and the connector
      is refused with "2 solid faces lie on" it (seen 2026-10-11, Revit 2024,
      row 5b-431). Make the pad a 2 mm EXTRUDED disc - kind=extrusion, a
      circle the flange's size, startMm and endMm 2 mm apart - with its outer
      face on a NEW plane 2 mm beyond the flange, and name the connector by
      that plane; it then went on first time. A pipe or duct port is sized by a length
      parameter even in a fixed family - add it and its value (steps 2 and 3)
      first. An ELECTRICAL connector is made with Revit's defaults and no
      load: SET_FAMILY_CONNECTOR_ROLES then gives it its Voltage, Number of
      Poles, Apparent Load and Power Factor - "voltage=400 V; poles=3;
      apparentLoad=1.5 kVA; powerFactor=0.85" - each a value the modeller
      gave in step 0's list, never assumed (D-33), or a family parameter in
      square brackets that drives it, a shared one where a project must
      schedule it (step 2). A part that is a family of its own, loaded in with LOAD_FAMILY:
      PLACE_NESTED_FAMILY on the plane it sits on - a Work Plane-Based family
      is placed on every
      release, a level-based one only from Revit 2024 - then
      LOCK_NESTED_FAMILY_TO_PLANES by its own Left, Right, Front, Back, Top,
      Bottom or centres, then LINK_NESTED_TYPE_PARAMETER for its type's sizes
      and LINK_FAMILY_PARAMETER for its instance's. A nested part whose TYPE
      the family's types choose - the 5 kW or the 7 kW motor - is
      ADD_FAMILY_TYPE_PARAMETER, which also swaps a sweep's loaded profile.
      A NESTED PART THAT IS NOT A FAMILY YET - the tyre of a car, the motor of
      a fan - is made in its own window and brought back, one call at a time:
      a. The HOST needs a file for the way back to be automatic: Revit lets no
         tool bring forward a window with no file. A host never saved is asked
         to be saved once (Ctrl+S). Declined, b to g still run, with e skipped,
         and the part's window is left for the modeller to close.
      b. CREATE_FAMILY_DOCUMENT from the host - its template and the part's
         file are asked for. Run from the host in front it is saved but not
         opened and gives `openNext`: ACTIVATE_DOCUMENT with that path opens
         it. An answer lost while a window opens is checked with
         REPORT_OPEN_DOCUMENTS, never repeated (row 5b-361).
      c. Steps 0 to 14 build the part in its own window, with
         SET_FAMILY_SETTINGS "Work Plane-Based=yes" so it nests on every
         release.
      d. STOP AND SHOW THE MODELLER THE PART. Nothing goes into the host until
         the modeller says it is right.
      e. ACTIVATE_DOCUMENT aimed at the host, with the host's file - the host
         in front again.
      f. SAVE_DOCUMENT aimed at the host, documentPath the part's file,
         closeWindow=true - saved, its window closed. LOAD_FAMILY refuses a
         part still open with unsaved work: a load reads the file.
      g. LOAD_FAMILY into the host, PLACE_NESTED_FAMILY at each point, then
         count the host's elements of that category against the number
         placed - a stray copy is found by the count (row 5b-350).
      b needs the Admin switch and f the Publish switch, each with Changes.
  12. SET_FAMILY_FORM_MATERIAL for each form's material - linked to a family
      material parameter when a project must set it per type, the body and
      the neck apart - then SET_FAMILY_FORM_SUBCATEGORY and
      SET_FAMILY_FORM_VISIBILITY where a project must show or style a part on
      its own: the body hidden in a coarse plan, the insulation on its own
      subcategory. A subcategory's colour, line weight and pattern, as Object
      Styles sets them, are CREATE_LINE_STYLE with familyCategory true -
      updateExisting true once the subcategory exists. A part only some types
      have from step 0:
      LINK_FAMILY_FORM_PARAMETER, its Visible to that Yes/No parameter. Where a
      plan must show a SYMBOL rather than the body - a valve's bow tie, a fan's
      circle and cross - DRAW_FAMILY_SYMBOLIC_LINES on Ref. Level at the levels
      the body is hidden at, with DRAW_FAMILY_FILLED_REGION for a solid or
      masked part of the symbol (in a 3D family from Revit 2023, a masking
      region from 2024). A family that must flip once placed gets
      ADD_FAMILY_FLIP_CONTROL. LETTERING - a nameplate, a panel's legend, a
      label that must stand out in 3D - is ADD_FAMILY_MODEL_TEXT: one call
      for every text, each on a named plane at a point in that plane's own
      two model coordinates, its height, depth and material on the row, so
      it stays editable text; never letters built of forms in step 7. A
      fixed family's materials are set outright:
      CREATE_MATERIAL for each colour - the shading colour only, nothing a
      render uses, with a transparencies value for glass or a vial
      (2026-10-14, Revit 2020) - then SET_FAMILY_FORM_MATERIAL once per
      material, naming
      every form id that takes it. Made before step 7, the materials can be
      named on CREATE_FAMILY_FORMS's rows instead.
  13. REPORT_FAMILY_FORMS - every form read back with its size, against the
      list from step 0, before the proof. For a fixed family it is the last
      check: the number of forms and the overall extents against the plan.
      THEN LOOK AT IT, before telling the modeller it is done. Sizes can all
      read back right while a part sits on the wrong side, floats off the
      body or is missing - that is found here, never by the modeller. In
      this order, since a call between the select and the zoom clears what
      the select left: OPEN_VIEW "View 1", the family's 3D view;
      SET_VIEW_PROPERTIES views "View 1", visualStyle "Shaded with Edges",
      detailLevel Fine, scale 0 (left as it is), so a part shown only at
      Fine is in the picture; SELECT_FAMILY_FORMS forms "solid" through
      revit_read; ZOOM_TO_ELEMENTS through revit_change with expect_from
      "select-family-forms" and alsoSelect false, so the modeller's screen
      shows the whole family too; then EXPORT_VIEW_IMAGE of
      "View 1" - and "View 1, Front" for a product with a front, such as a
      monitor, a panel or a unit - at 1600 px, into a folder of its own
      under %TEMP%\heron-work, its whole path typed out (the tool takes
      %TEMP% as plain text), prefix the family's name. Open each picture
      from that folder and LOOK: every part from step 0's list is there, on
      the side it belongs, touching what holds it. Fix what is wrong and look
      again; then tell the modeller, naming what the picture showed. Seen
      2026-10-14 on Revit 2020: a fixed 55 inch monitor read back to plan,
      and a screen grab of the Revit window taken outside Heron showed it
      half off the screen - the 3D view had never been zoomed. The picture
      needs the modeller's Publish switch (EXPORT_VIEW_IMAGE writes a file);
      with it off, say so, and ask the modeller to look at View 1 instead.
      The picture is for the agent to read: it stays in that folder and is
      never sent or shared anywhere.
  14. FLEX_FAMILY last, at sizes that are really different and not square - the
      only step that PROVES the family follows. "The calls did not fail" is not
      the proof; the geometry read back at another size is. A fixed family has
      nothing to flex: skip it, and say it was skipped and why.
  15. A family with many types gets a TYPE CATALOG - REPORT_FAMILY_TYPE_CATALOG
      gives the text, saved beside the .rfa with its name and .txt, so a
      project loads only the types it picks.

  The family is saved by the modeller (Ctrl+S): Revit will not save the
  document open in its window while Heron holds it. A nested part made in
  step 11 is the exception - SAVE_DOCUMENT saves it while Heron works in the
  host.

  NOT YET: reference lines and angles - a part that swings or tilts about a
  pivot. A reference line can be made through the API, and an angle labelled,
  but no DOCUMENTED call gives the planes a reference line carries, so a form
  cannot be put on one; the only route found reads a reference out of an
  undocumented string Autodesk says is not meant to be parsed (row 5b-280).
  A revolve whose angle the types choose is the documented route for a bend.
  A Family Type parameter, a type catalog, flip controls and filled and
  masking regions were on this line until 2026-10-02 and are built now.
  Whether a label on a round form's edge DRIVES the circle is not yet known
  on any release: step 14 is where that is found out (NEEDS-CHECKING BM3).
  This line said until 2026-10-01 that a circle's size cannot be driven
  through the API on Revit 2020; that was measured for a project, not a
  family (row 5b-261).

# The words people say when they want a family made.
utterances:
  - build a new parametric family
  - make an air terminal family with a duct connector
  - create this family from these sizes
  - make this family parametric and flex it
  - build a parametric family from this picture
  - make a family from this photo
  - make a revit family that looks like this image
  - make a parametric family from my sketch
  - make the tyre a separate nested family and put it in the car
  - this part should be its own nested family
  - make a very detailed family, no parameters
  - build a fixed size family of this equipment, visual only
  - make a detailed equipment family with materials and no parameters

# CAPABILITIES, never fragment ids - in the order the purpose gives.
needs:
  - REPORT_FAMILY_TEMPLATE
  # Step 0's units check - the read where the report has no units line, and
  # the change the modeller may choose.
  - REPORT_PROJECT_UNITS
  - SET_PROJECT_UNITS
  - SET_FAMILY_CATEGORY
  - SET_FAMILY_SETTINGS
  - ADD_FAMILY_PARAMETERS
  - ADD_FAMILY_SHARED_PARAMETERS
  # Values BEFORE labels - see step 3.
  - SET_FAMILY_TYPE_VALUES
  - SET_FAMILY_FORMULA
  - CREATE_REFERENCE_PLANES
  - SET_FAMILY_PLANE_REFERENCE
  - LABEL_FAMILY_DIMENSION
  - EXTRUDE_BETWEEN_PLANES
  - CREATE_FAMILY_EXTRUSION
  - CREATE_FAMILY_REVOLUTION
  - CREATE_FAMILY_BLEND
  - CREATE_FAMILY_SWEEP
  - CREATE_FAMILY_SWEPT_BLEND
  # Step 7's many forms at once - extrusions and revolves, one row each.
  - CREATE_FAMILY_FORMS
  - CREATE_FAMILY_FREEFORM_SOLID
  - LOCK_FORM_TO_PLANES
  - LINK_FAMILY_FORM_PARAMETER
  - LABEL_FAMILY_RADIUS
  - COMBINE_FAMILY_FORMS
  - ARRAY_FAMILY_FORMS
  - ADD_FAMILY_CONNECTOR
  # Step 11's electrical connector values, and any connector's settings.
  - SET_FAMILY_CONNECTOR_ROLES
  # Step 11's nested part that is not a family yet, a to g.
  - CREATE_FAMILY_DOCUMENT
  - ACTIVATE_DOCUMENT
  - REPORT_OPEN_DOCUMENTS
  - SAVE_DOCUMENT
  - LOAD_FAMILY
  - PLACE_NESTED_FAMILY
  - LOCK_NESTED_FAMILY_TO_PLANES
  - LINK_NESTED_TYPE_PARAMETER
  - ADD_FAMILY_TYPE_PARAMETER
  - LINK_FAMILY_PARAMETER
  - SET_FAMILY_FORM_MATERIAL
  - SET_FAMILY_FORM_SUBCATEGORY
  # Step 12's subcategory colour, weight and pattern (version 2, row 5b-463).
  - CREATE_LINE_STYLE
  - SET_FAMILY_FORM_VISIBILITY
  - DRAW_FAMILY_SYMBOLIC_LINES
  - DRAW_FAMILY_FILLED_REGION
  - ADD_FAMILY_FLIP_CONTROL
  # Step 12's lettering.
  - ADD_FAMILY_MODEL_TEXT
  # A fixed family's colours, before SET_FAMILY_FORM_MATERIAL - see step 12.
  - CREATE_MATERIAL
  - REPORT_FAMILY_FORMS
  # Step 13's look at what was built - the 3D view opened, shaded at Fine,

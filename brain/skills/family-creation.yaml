# What must be true BEFORE it runs, so it fails early with something
# useful instead of deep inside a transaction (docs/09 s2).
preconditions:
  - the family to build is open in front in the Family Editor, opened by the modeller from the template the job needs - or Heron makes it in Stage 0 with CREATE_FAMILY_DOCUMENT from the template and the .rfa path the modeller names; Heron never picks a template or a path itself
  - every size, parameter name and type name has been given for THIS request - a picture or a sketch alone gives none of them
  - the family is not yet built - rebuilding one that already has labelled dimensions leaves the old labels behind to fight the new ones
  - this chat is on the family in front - a chat that worked on another model moves with revit_use_this_model first, because revit_read reads the model the chat is pinned to, not the one in front
  - a step whose capability is DRAFT - the list of uses served beside this method says which - is refused by revit_change (D-117), and revit_read was seen refusing a DRAFT read on 2026-11-28; a DRAFT of MODIFY risk can only be tried once with the bridge client's try-once, on a family saved first with nothing unsaved, and stays only if the modeller presses Keep in Revit (D-119, D-121) - never on a family a project already uses; a DRAFT read, or a DRAFT of Admin, Publish or Execute risk, cannot be tried at all, so its step says what to do meanwhile


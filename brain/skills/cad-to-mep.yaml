heron-status: DRAFT
heron-step: 17
heron-since: 0.1.0
heron-layer: brain

id: cad-to-mep
name: Draw real ducts and pipes from a CAD drawing - read its layers, look at it, read its size tags, draw
domain: revit.mep
# Heron wrote this one. D-66: a unit that ships with Heron says where it
# came from, so an IMPORTED one that says nothing stands out.
source: OFFICIAL

risk: MODIFY

purpose: >
  Turns a CAD background's duct and pipe linework into real Revit ducts and
  pipes with their fittings. It is two halves, and the order matters: first
  UNDERSTAND the drawing - which layer is what, and what sizes it is tagged
  with - by reading its layers and LOOKING at it; then DRAW, in one call,
  from the CAD's own geometry. The owner's words, 2026-11-09: "NOT ONLY FROM
  THE LAYERS. IF I SAY UNDERSTAND FROM THE CAD, IT WILL TAKE THE SCREENSHOT
  AND IT WILL UNDERSTAND LIKE THAT ALSO". The Revit API cannot read the text
  in a DWG, so the picture is how the tags are read; the coordinates always
  come from the CAD, never from the picture.

  Every tool of this method is DRAFT or PROVEN as the list after it says.
  DRAW_MEP_FROM_CAD was written 2026-11-09 and is DRAFT, compiled for Revit
  2020 to 2027 and NOT RUN in Revit (NEEDS-CHECKING Group MX). WHILE IT IS
  DRAFT NO CHAT TOOL RUNS IT, a preview included: revit_read refuses anything
  above ANALYZE and this card is MODIFY, and revit_change refuses a DRAFT
  before anything is sent (D-117) - it has no preview mode. Steps 4 and 6 say
  what runs it until then. Once it is PROVEN, revit_change runs both.

  0. FIND THE CAD. Which CAD file, in which view. revit_imports lists every
     CAD file in the model, LINKED and IMPORTED told apart, by the file name
     `cadName` takes, and says when one is placed in a single view only
     (revit_links lists REVIT links, not CAD). Ask the modeller to SELECT the
     one CAD in the plan, or take its name for `cadName`. A CAD that is inside
     a linked Revit model is not read - the card refuses and says so. Bring a
     plan where the CAD shows to the front. Ask which level the services are on
     and their middle elevation above it - never assume a height (D-33).

  1. SURVEY THE LAYERS - READ, NOTHING DRAWN. EXTRACT_CAD_CURVES with the CAD
     selected and NO layer named lists every layer and how many objects each
     holds, and creates nothing. Layer names are matched exactly, case and all,
     so every name used later is copied from this list.

  2. LOOK AT IT. revit_view_image on that plan returns a picture of it and
     changes nothing. Read from the picture: where the ducts and pipes are,
     whether a duct is drawn as two parallel lines (double) or one (single),
     the SIZE TAGS beside them ("600x400", "Ø150"), and system names or
     abbreviations ("SA", "RA", "CHWS"). Zoom in with a narrower crop, or a
     second view, when tags are too small to read - never guess a figure that
     cannot be read. Keep the answer's "Model position" line (or its "No model
     position" line) for step 5: for a floor plan whose crop is on and
     annotation crop off it turns a place on the picture into model mm. Note
     where each tag sits as a FRACTION of the picture's width and height - u
     across from the left edge, v down from the top edge, each 0 to 1 - never
     in pixels: the picture you see may have been scaled down from the one
     Revit made, and a fraction is the same on both.

  3. DECIDE THE LAYERS WITH THE MODELLER. Put the layer list from step 1 and
     what the picture shows side by side, and propose which layer is supply
     duct, return duct, chilled water supply ... with the reason ("M-DUCT-SA:
     double lines, tagged SA"). ASK - a layer's meaning is never guessed (D-33,
     D-34): a name like "M-HVAC-2" or an office abbreviation not explained by
     anything Heron holds is a question for the modeller. Also ask, for each
     layer: duct or pipe, the system type, the duct or pipe type (its routing
     preferences choose every fitting), and the default size for a run no tag
     reaches. One call draws ONE system and ONE type, so each layer of a
     different system is its own call.

  4. PREVIEW - NOTHING DRAWN. DRAW_MEP_FROM_CAD with previewOnly true. WHILE
     IT IS DRAFT, no chat tool runs it (above): the preview is run on the
     modeller's PC from the command line, which runs the card and ROLLS IT
     BACK - nothing can be kept without --apply, and --apply is refused for a
     DRAFT (D-117):
       python mcp/client/heron_bridge_client.py fragment draw-mep-from-cad
         --write --set previewOnly=true --set cadName=... --set layerNames=...
         (and the other values)
     Say so to the modeller and let them run it, or run it only where they
     have asked for exactly that; never send it through another tool. ONCE
     PROVEN, it is revit_change with previewOnly=true - nothing is created.
     Its runsFound gives the span of the linework read (internal coordinates,
     mm) and every run it would draw - its two ends, length, size and where
     the size came from, and "DOUBTFUL PAIR - check" where double lines could
     have paired another way - and findings count the elbows, tees, taps and
     open ends and list the crossings; skippedWhy counts what was left out
     (arcs, end caps, a drawn centreline, short pieces). Tell the modeller in
     one line, and check against the picture: a run count far from what the
     picture shows means the wrong mode (double / single), the wrong layer, or
     a spacing range to change; a DOUBTFUL run is checked in the picture
     before drawing.

  5. PLACE THE TAGS. Each tag read in step 2 becomes one size hint,
     size@x,y in millimetres, all on ONE line with ; between them (a chat value
     loses its line breaks). A hint only has to be NEARER ITS OWN RUN than any
     other run - it is given to the one run nearest it, within hintReachMm
     (1500 by default).
     WHEN step 2's answer has a "Model position from this picture" line - a
     floor plan whose crop is on and annotation crop off - use it: measure the
     tag's position as a fraction of the picture's width and height (u across
     from the left edge, v down from the top edge, 0 to 1) and put u and v
     through that line's formula; the result is the hint's x,y, in the same
     internal mm as runsFound. Check each against runsFound - the hint should
     land on or beside the run the tag labels; one that lands nowhere near a
     run means the picture and the crop do not agree, so fall back below and
     say so. Until NEEDS-CHECKING MX19 has measured that Revit's picture fills
     the crop edge to edge, the line itself says it is not yet proved exact -
     a few pixels out is still well inside hintReachMm. A tag just outside the
     crop may be missing from the picture: ask the modeller to widen the
     crop, or name the run as untagged - never guess its size.
     WHEN IT HAS NOT - its "No model position" line says why (crop off,
     annotation crop on, not a plan, a ceiling plan - not yet measured -, a
     3D picture, an older add-in, the crop not given) - never
     work a position out from the picture alone: give each tag the MIDDLE OF
     THE RUN IT LABELS, taken from runsFound once the picture shows which run
     that is. Turning the crop on and the annotation crop off in a copy of the
     view is the modeller's choice, never made for them.
     Run the preview again with the hints (step 4's route): every
     hint used, runsWithoutSize short, sizeConflicts read out to the modeller -
     a hint that lost to a nearer one on the same run is listed there and was
     not used.

  6. DRAW. The same values without previewOnly - one call, one undo. WHILE
     DRAFT, this is the card's ONE run on the saved model in front through
     try-once (D-119), and only when the modeller asks for it in the chat:
       python mcp/client/heron_bridge_client.py try-once draw-mep-from-cad
         --view "<the plan>" --set ...
     once per version; Revit asks Keep or Discard. ONCE PROVEN, revit_change.
     Then say what came back in Revit words: how many ducts or pipes and
     fittings, the joints NOT fitted (failedJoins - the runs are not connected
     there, most often "no room" for the fitting, checked before Revit was
     asked), the runs at the default size, the tags that disagree with the
     drawing, the crossings left unjoined. A failure Revit raises only as the
     call is kept undoes the WHOLE call - one undo, nothing kept - and its
     words are the answer; say them, never retry round them.

  7. KEEP OR DISCARD, THEN LOOK AGAIN. While Revit's Keep or Discard box is
     open, no chat tool reaches Revit - the modeller looks in Revit itself,
     where the change is selected and shown, and chooses. AFTER KEEP,
     revit_view_image of the PLAN VIEW itself - not of the new elements by id,
     which frames them in a temporary 3D view with links and imports left out
     of the box, so the CAD would not be in the picture to compare with - and
     look: every duct over its CAD lines, none where the drawing has none,
     fittings at the corners, tees and taps (visualise-a-view's rule: picture
     a change once it is kept, or in a rolled-back run). After Discard there
     is nothing to picture. Then SELECT_BY_CONNECTION_STATUS finds the open
     ends left, and CONNECT_OPEN_ENDS joins the runs to equipment and
     terminals already placed.

# The owner's own words: docs/48 section 5 item 6, its section 2 row, and his
# request of 2026-11-09.
utterances:
  - CAD lines to ducts and pipes
  - read the CAD layer, ask size and type, draw the run
  - MEP from a CAD drawing
  - understand from the CAD

# CAPABILITIES, never fragment ids. revit_imports and revit_view_image are
# Heron tools of their own, not capabilities, so they are named in the method
# above and not here. LIST_LINKED_MODELS was here until 2026-11-09's review:
# it lists Revit links, not CAD files.
needs:
  - EXTRACT_CAD_CURVES
  - DRAW_MEP_FROM_CAD
  - SELECT_BY_CONNECTION_STATUS
  - CONNECT_OPEN_ENDS

preconditions:
  - ONE CAD file is linked or imported in this project itself - not inside a Revit link - and shows in a plan the picture can be taken of
  - the level and the middle elevation of the services are known from the modeller - never assumed
  - every layer drawn has been named by the modeller as what it is - duct or pipe, which system - never guessed from its name
  - the duct or pipe type's routing preferences hold the fittings the modeller wants at a corner and at a branch
  - each tag's size was READ off the picture; a tag that could not be read is left out and its run takes the default, which is listed

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]

note: >
  WRITTEN 2026-11-09 IN A CLOUD SESSION, NOT RUN. docs/48 section 5 item 6.
  The one-call drawing is DRAW_MEP_FROM_CAD (DRAFT) rather than a chain of
  EXTRACT_CAD_CURVES' coordinates, CREATE_MEP_RUNS and FIT_MEP_JOINTS: a
  floor's linework is thousands of lines, listOnly hands back 200, and both
  drawing cards undo the whole job on one bad joint - FRAGMENT-ISSUES row
  5b-1481. NEEDS-CHECKING Group MX. Not the duct-layout skill, which is a
  unit ducted to its diffusers.

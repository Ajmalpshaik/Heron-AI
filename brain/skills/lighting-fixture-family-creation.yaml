  Written 2026-10-02 when the owner asked for everything to be checked again,
  with SET_FAMILY_LIGHT_SOURCE built the same day, from the research recorded
  in docs/43 §10. Step 3 rewritten 2026-10-21 (rows 5b-1297 to 5b-1299,
  NEEDS-CHECKING Group IK): the tick, the position and aim, the wattage, the
  loss factor, dimming and filter made Heron calls, and every family type
  reached. On 2026-11-28 it was rebuilt on the owner's family creation
  standard: family-creation's stages in their order, each pointed at rather
  than copied, the Heron capability and its status under every step, every
  earlier rule under the stage it belongs to (old step 3 is Stage 9 A), and
  the power connector's values through SET_FAMILY_CONNECTOR_ROLES as
  family-creation Stage 7 sets them, LINK_FAMILY_PARAMETER kept as the other
  route. Every step is DRAFT until it has been run on a real family with a
  negative case (D-30).

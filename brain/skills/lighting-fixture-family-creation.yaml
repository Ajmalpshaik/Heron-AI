heron-status: DRAFT
heron-step: 17
heron-since: 0.1.0
heron-layer: brain

id: lighting-fixture-family-creation
name: Build a lighting fixture family with its light source and its power connector
domain: revit.families
# Heron wrote this one. D-66: a unit that ships with Heron says where it
# came from, so an IMPORTED one that says nothing stands out.
source: OFFICIAL

risk: MODIFY

purpose: >
  Builds a LIGHTING FIXTURE - a downlight, a linear pendant, a recessed panel,
  a wall light - from the Lighting Fixture template the modeller opened, with
  the light it gives and the power it takes. The steps of FAMILY-CREATION, and
  of HOSTED-FAMILY-CREATION for a ceiling-, wall- or face-based fixture, still
  hold; this is what a light adds. What every step rests on is in docs/43 §10.

  0. REPORT_FAMILY_TEMPLATE FIRST - free-standing, ceiling-based or
     wall-based, and Lighting Fixtures as its category. A fixture that must
     sit on faces in a LINKED model is a face-based Generic Model changed to
     Lighting Fixtures with SET_FAMILY_CATEGORY.
     CLASSIFY IT (FAMILY-CREATION step 1): REPORT_FAMILY_TEMPLATE's
     classificationCodes line lists the OmniClass Numbers (Classification
     Number from Revit 2026) that Revit's taxonomy file gives the category -
     run it again after the category changed. The modeller confirms the code
     that fits, or picks where more than one could, and SET_FAMILY_SETTINGS
     "OmniClass Number=<code>" writes it; no file or no code is said, never
     guessed (D-33).
     CHECK THE UNITS (FAMILY-CREATION step 0): a units line reading IMPERIAL
     where the modeller works in millimetres is said before anything is
     built, with SET_PROJECT_UNITS or the Metric template offered.
  1. READ THE THING: the body's sizes, the light's shape (a point for a
     downlight, a line for a linear fitting, a rectangle for a panel), its
     lumens and colour temperature from the datasheet, and an IES file if the
     manufacturer gives one.
  2. THE BODY as FAMILY-CREATION steps 2 to 8 - parameters, planes, labels,
     forms locked to planes - with the opening the light leaves by.
  3. THE LIGHT SOURCE, three Heron calls in this order (version 2 of
     SET_FAMILY_LIGHT_SOURCE, 2026-10-21 - Revit loses type values set in
     the same transaction as the family's light source, 5b-1294):
     a. SET_FAMILY_SETTINGS "Light Source=yes" - the tick in Family Category
        and Parameters, proved by Revit's lighting API finding the light
        source; a family already ticked reads "already as asked".
     b. SET_FAMILY_LIGHT_SOURCE, the FAMILY'S light source, typeName empty:
        the shape and its size, the distribution (spot angles, or the IES
        file and its tilt), `position` - below the opening, touching no
        geometry: a point in millimetres or "plane <reference plane> offset
        -10" - and `aim`, "tilt 15 about x" for an asymmetric fitting. Every
        type takes these.
     c. SET_FAMILY_LIGHT_SOURCE, EACH TYPE'S values, every type or one by
        `typeName`: the lumens - or the datasheet's wattage with its lumens,
        "4500 lm at 35.5 W", or its efficacy, "35.5 W at 127 lm/W" - the
        colour temperature, the light loss factor, the dimming colour shift
        and a colour filter. Each family type is made current, written, and
        proved from its own Type Properties; one type of several that the
        lighting API cannot be proved to reach fails the call with the hand
        fix, and nothing is kept.
     It reads back what Type Properties shows, and reports every light value.
     One light source per family - more lights are nested fixtures
     (PLACE_NESTED_FAMILY). A shape size or angle that must DIFFER by type is
     linked to a family type parameter first (LINK_FAMILY_PARAMETER naming
     the Light Source element), then set per type (SET_FAMILY_TYPE_VALUES).
  4. THE POWER: ADD_FAMILY_CONNECTOR with a power system on the face the
     supply enters by, then LINK_FAMILY_PARAMETER for its Voltage, Load
     Classification and Apparent Load, so the types carry them.
  5. Plan symbol and visibility as FAMILY-CREATION step 12;
     SET_FAMILY_FORM_MATERIAL for the body and diffuser.
  6. REPORT_FAMILY_FORMS, then FLEX_FAMILY - then LOAD_FAMILY into a test
     project: placed on its host, the light renders or shows in a lighting
     analysis, and the fixture joins a circuit.

  BY HAND, BECAUSE NO REVIT API CALL REACHES IT (read 2026-10-21 in the
  RevitAPI of every release 2020 to 2027, 5b-1296): UNTICKING Light Source -
  it deletes the light source and every photometric value, so Heron leaves it
  to the modeller; and, only if step 3c says so for a type Revit's lighting
  API does not list, that type's values in Family Types - no call makes a
  light type (5b-1295). Until Group IJ runs in Revit, step 3a, the move and
  aim of 3b and the wattage of 3c each fail safe - nothing kept, the reason
  said - where Revit answers differently from its reference.

utterances:
  - make a lighting fixture family
  - build a downlight family with a light source
  - create a linear light fitting family with lumens and colour temperature
  - make a ceiling light family that connects to a circuit

needs:
  - REPORT_FAMILY_TEMPLATE
  # Step 0's units check, as FAMILY-CREATION's.
  - REPORT_PROJECT_UNITS
  - SET_PROJECT_UNITS
  - SET_FAMILY_CATEGORY
  - ADD_FAMILY_PARAMETERS
  - SET_FAMILY_TYPE_VALUES
  - CREATE_REFERENCE_PLANES
  - LABEL_FAMILY_DIMENSION
  - EXTRUDE_BETWEEN_PLANES
  - CREATE_FAMILY_EXTRUSION
  - LOCK_FORM_TO_PLANES
  - SET_FAMILY_LIGHT_SOURCE
  - PLACE_NESTED_FAMILY
  - ADD_FAMILY_CONNECTOR
  - LINK_FAMILY_PARAMETER
  - SET_FAMILY_FORM_MATERIAL
  - REPORT_FAMILY_FORMS
  # FAMILY-CREATION's step 2 reads first: the shared parameter file and its
  # GUIDs, against the family, before ADD_FAMILY_SHARED_PARAMETERS writes.
  - REPORT_SHARED_PARAMETER_FILE
  - ADD_FAMILY_SHARED_PARAMETERS
  - SET_FAMILY_FORMULA
  - SET_FAMILY_PLANE_REFERENCE
  - CREATE_FAMILY_BLEND
  - CREATE_FAMILY_REVOLUTION
  - CREATE_FAMILY_SWEEP
  - CREATE_FAMILY_SWEPT_BLEND
  - LINK_FAMILY_FORM_PARAMETER
  - SET_FAMILY_FORM_SUBCATEGORY
  - SET_FAMILY_FORM_VISIBILITY
  - DRAW_FAMILY_SYMBOLIC_LINES
  - DRAW_FAMILY_FILLED_REGION
  - ADD_FAMILY_FLIP_CONTROL
  # FAMILY-CREATION's and HOSTED-FAMILY-CREATION's steps, which this skill says
  # still hold.
  - SET_FAMILY_SETTINGS
  - LABEL_FAMILY_RADIUS
  - COMBINE_FAMILY_FORMS
  - ARRAY_FAMILY_FORMS
  - LOCK_NESTED_FAMILY_TO_PLANES
  - LINK_NESTED_TYPE_PARAMETER
  - ADD_FAMILY_TYPE_PARAMETER
  - REPORT_FAMILY_TYPE_CATALOG
  - CREATE_FAMILY_HOST_OPENING
  # The proof, and never skipped.
  - FLEX_FAMILY
  - LOAD_FAMILY

preconditions:
  - a family document is open in the Family Editor, started by the modeller from a Lighting Fixture template or a face-based Generic Model - Heron does not choose a template
  - the body's sizes and the light's lumens and colour have been given for THIS request

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]

note: >
  Written 2026-10-02 when the owner asked for everything to be checked again,
  with SET_FAMILY_LIGHT_SOURCE built the same day, from the research recorded
  in docs/43 §10. Step 3 rewritten 2026-10-21 (rows 5b-1294 to 5b-1296,
  NEEDS-CHECKING Group IJ): the tick, the position and aim, the wattage, the
  loss factor, dimming and filter made Heron calls, and every family type
  reached. Every step is DRAFT until it has been run on a real family with a
  negative case (D-30).

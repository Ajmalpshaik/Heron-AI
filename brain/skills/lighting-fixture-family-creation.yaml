id: lighting-fixture-family-creation
name: Build a lighting fixture family with its light source and its power connector
domain: revit.families
# Heron wrote this one. D-66: a unit that ships with Heron says where it
# came from, so an IMPORTED one that says nothing stands out.
source: OFFICIAL

risk: MODIFY

# THE SHAPE OF THIS METHOD (2026-11-28): the owner's family creation
# standard, as family-creation carries it - objective, when to use it, the
# stages of family-creation in their order, the always/never rules and the
# report. Shared stages are POINTED AT, never copied: "family-creation Stage
# N" is heron_method(job="family-creation", stage=N), and a hosted fixture's
# host rules are hosted-family-creation's. Every rule the six-step method this
# replaced held is under the stage it belongs to (the pull request lists
# each). The research every step rests on is docs/43 §10.
purpose: |
  LIGHTING FIXTURE FAMILY CREATION - a downlight, a linear pendant, a
  recessed panel, a wall light, with the light it gives and the power it
  takes. The owner's family creation standard (Ajmal PS, 2026-11-28), with
  what a light adds.

  HOW TO READ IT. This method keeps family-creation's stages, in their order,
  and says only what a light adds. "family-creation Stage N" is served by
  heron_method(job="family-creation", stage=N): follow that stage there, then
  what is written here; a ceiling-, wall- or face-based fixture follows
  hosted-family-creation's stages for its host too. family-creation's
  behaviour rules and its report (its sections 5 and 6) come with its summary,
  heron_method(job="family-creation"), and hold here. "-> CAPABILITY (STATUS)"
  after a step is the Heron capability that does it and its card's status when
  this was written; the list of uses served after this method gives each one's
  status now, and that list wins. Six named here are not in that list, so this
  method is not offered beside ordinary connector, placing, circuit and saving
  requests: SET_FAMILY_CONNECTOR_ROLES, PLACE_HOSTED_FAMILY,
  PLACE_FAMILY_ON_FACE, CREATE_MEP_SYSTEM, REPORT_CONNECTORS and SAVE_DOCUMENT
  - each stage served gives their status too. "-> no Heron tool yet:" is a
  step Heron cannot do: it says what the modeller does by hand. A DRAFT
  capability that CHANGES the model is refused by revit_change until it is
  proved (D-117); a DRAFT READ runs through revit_read and says DRAFT -
  confirm what matters another way.

  ITS OWN STAGES ARE SERVED IN PARTS:
  heron_method(job="lighting-fixture-family-creation") lists them, and a stage
  of this method is asked by its part's id - "1-6" for Stages 1 to 6, "7-9"
  for Stages 7 to 9.

  OLD STEPS. Before 2026-11-28 this method had steps 0 to 6, and other files
  still name them: step 0 is Stage 0 items 1 to 3 and Stage 1 items 1 and
  2; step 1 is Stage 0 item 4; step 2 is Stages 1 to 6; step 3 (3a, 3b, 3c)
  is Stage 9 A; step 4 is Stage 7; step 5 is Stage 9 B; step 6 is Stages 10
  to 12.


  1. OBJECTIVE

  A lighting fixture whose body follows its sizes, whose one light source has
  the shape, distribution, lumens and colour the datasheet gives - for every
  type - and whose power connector joins a circuit in a test project. Never
  guess a size or a photometric value; never call it done before the checks.


  2. WHEN TO USE - AND WHEN NOT

  Use it for a family that gives light, started from the Lighting Fixture
  template - free-standing, ceiling-based or wall-based - or from a
  face-based Generic Model.
  Not for:
    * a light switch, a sensor or another electrical device with no light -
      family-creation, or hosted-family-creation where it has a host;
    * a light fitting's track or a run set by two clicks -
      line-based-family-creation, with the fixtures nested.


  3. WORKFLOW

  STAGE 0 - INFORMATION AND PREPARATION
  family-creation Stage 0 holds, and hosted-family-creation Stage 0 for a
  hosted fixture. A light adds:
  1. Read the template.
     -> REPORT_FAMILY_TEMPLATE (PROVEN): free-standing, ceiling-based or
        wall-based, and Lighting Fixtures as its category. The file comes as
        family-creation Stage 0 item 1 says.
     * A fixture that must sit on faces in a LINKED model is a face-based
       Generic Model, its category changed in Stage 1.
  2. Check the units - family-creation Stage 0 item 3, which holds.
     -> REPORT_FAMILY_TEMPLATE (PROVEN), its units line; SET_PROJECT_UNITS
        (PROVEN, Admin); REPORT_PROJECT_UNITS (DRAFT). IMPERIAL where the
        modeller works in millimetres is said BEFORE anything is built.
  3. Keep the template's planes as it made them.
     -> REPORT_FAMILY_TEMPLATE (PROVEN), read again before the first write.
  4. Read the thing, into family-creation's one list.
     -> no Heron tool: asked once - the body's sizes; the light's shape (a
        point for a downlight, a line for a linear fitting, a rectangle for a
        panel); its lumens - or wattage with lumens, or efficacy - and colour
        temperature from the datasheet, per type; an IES file if the
        manufacturer gives one; the supply's voltage and load. Never assumed
        (D-33).
  GATE: the modeller confirms the list, the light values above all.

  STAGES 1 TO 6 - CONFIGURATION, FRAMEWORK, GEOMETRY, STYLES, CONTROL, VOIDS

  STAGE 1 - FAMILY CONFIGURATION
  family-creation Stage 1 holds. A light adds:
  1. Set the category where the template is a Generic Model.
     -> SET_FAMILY_SETTINGS (PROVEN), "Category=Lighting Fixtures".
  2. Confirm the OmniClass Number - family-creation Stage 1 item 3, which
     holds.
     -> REPORT_FAMILY_TEMPLATE (PROVEN), its classificationCodes line, run
        again after any category change; SET_FAMILY_SETTINGS (PROVEN)
        "OmniClass Number=<code>" once the modeller confirms it - never
        guessed (D-33).
  3. The body's parameters, values and formulas.
     -> REPORT_SHARED_PARAMETER_FILE (PROVEN) first; ADD_FAMILY_PARAMETERS
        (PROVEN, Admin); SET_FAMILY_TYPE_VALUES (PROVEN); SET_FAMILY_FORMULA
        (PROVEN).

  STAGES 2 TO 6 - THE BODY
  family-creation Stages 2 to 6 hold - planes, labels, forms locked to
  planes, subcategories, voids - with THE OPENING THE LIGHT LEAVES BY.
     -> CREATE_REFERENCE_PLANES (PROVEN), SET_FAMILY_PLANE_REFERENCE
        (PROVEN), LABEL_FAMILY_DIMENSION (PROVEN); EXTRUDE_BETWEEN_PLANES
        (PROVEN), CREATE_FAMILY_FORMS (PROVEN), LOCK_FORM_TO_PLANES (PROVEN),
        LABEL_FAMILY_RADIUS (PROVEN); SET_FAMILY_FORM_SUBCATEGORY (PROVEN);
        COMBINE_FAMILY_FORMS (PROVEN), ARRAY_FAMILY_FORMS (PROVEN).
     * A recessed fixture's cut in the ceiling is hosted-family-creation
       Stage 6: CREATE_OPENING (PROVEN) for a fixed size; a void the
       modeller cuts by hand where it must resize.

  STAGES 7 TO 9 - POWER, NESTED FIXTURES, LIGHT SOURCE AND GRAPHICS

  STAGE 7 - MEP CONNECTORS: THE POWER
  family-creation Stage 7 holds. A light adds:
  1. The power connector, on the face the supply enters by.
     -> ADD_FAMILY_CONNECTOR (PROVEN), a power system ("Power Balanced", as
        Revit names it), its sizeParameters given EMPTY.
  2. Its Voltage, Load Classification and Apparent Load, so the types carry
     them.
     -> SET_FAMILY_CONNECTOR_ROLES (PROVEN): Voltage and Apparent Load each a
        value the modeller gave and/or a family parameter in square brackets -
        "voltage=230 V [Voltage]" - a shared one where a project must
        schedule it; Load Classification is a classification's name in the
        family, set as a value only.
     -> or LINK_FAMILY_PARAMETER (PROVEN), linking the connector's own
        parameters to family parameters already made.

  STAGE 8 - NESTED FAMILIES
  family-creation Stage 8 holds. A light adds:
  1. ONE LIGHT SOURCE PER FAMILY: more lights are nested fixtures.
     -> PLACE_FAMILY_INSTANCES (PROVEN), in the fixture family;
        LOCK_NESTED_FAMILY_TO_PLANES (PROVEN); ADD_FAMILY_TYPE_PARAMETER
        (DRAFT) where the types choose a nested fixture's type - refused by
        revit_change until proved, so try it once or the modeller makes the
        Family Type parameter by hand.

  STAGE 9 - MATERIALS AND GRAPHICS, AND THE LIGHT SOURCE
  family-creation Stage 9 holds. A light adds:
  A. THE LIGHT SOURCE - three Heron calls, in this order: Revit loses type
     values set in the same transaction as the family's light source (row
     5b-1297, SET_FAMILY_LIGHT_SOURCE version 2, 2026-10-21).
  1. Tick Light Source.
     -> SET_FAMILY_SETTINGS (PROVEN), "Light Source=yes" - the tick in Family
        Category and Parameters, proved by Revit's lighting API finding the
        light source; a family already ticked reads "already as asked".
  2. The FAMILY'S light source, typeName empty.
     -> SET_FAMILY_LIGHT_SOURCE (PROVEN): the shape and its size; the
        distribution - spot angles, or the IES file and its tilt;
        `position` below the opening, touching no geometry - a point in
        millimetres or "plane <reference plane> offset -10"; and `aim`,
        "tilt 15 about x" for an asymmetric fitting. Every type takes these.
  3. EACH TYPE'S values, every type or one by `typeName`.
     -> SET_FAMILY_LIGHT_SOURCE (PROVEN): the lumens - or the datasheet's
        wattage with its lumens, "4500 lm at 35.5 W", or its efficacy, "35.5
        W at 127 lm/W" - the colour temperature, the light loss factor, the
        dimming colour shift and a colour filter. Each family type is made
        current, written, and proved from its own Type Properties; one type
        of several the lighting API cannot be proved to reach fails the call
        with the hand fix, and nothing is kept.
     * It reads back what Type Properties shows, and reports every light
       value.
     * A shape size or angle that must DIFFER by type is linked to a family
       type parameter first - LINK_FAMILY_PARAMETER (PROVEN) naming the Light
       Source element - then set per type with SET_FAMILY_TYPE_VALUES
       (PROVEN).
     * NEEDS-CHECKING Group IK (issue #981) is still owed on a real family:
       until it runs, item 1, the move and aim of item 2 and the wattage of
       item 3 each fail safe - nothing kept, the reason said - where Revit
       answers differently from its reference.
  4. A type Revit's lighting API does not list.
     -> no Heron tool yet: only where item 3 says so, that type's values are
        typed by the modeller in Family Types - no call makes a light type
        (row 5b-1298).
  5. Unticking Light Source.
     -> no Heron tool, on purpose: it deletes the light source and every
        photometric value, so it is left to the modeller; no Revit API call
        reaches it (read 2026-10-21 in every release 2020 to 2027, row
        5b-1299).
  B. PLAN SYMBOL, VISIBILITY AND MATERIALS
  1. The plan symbol, and the body hidden where the symbol stands for it.
     -> DRAW_FAMILY_SYMBOLIC_LINES (PROVEN), SET_FAMILY_FORM_VISIBILITY
        (PROVEN), DRAW_FAMILY_FILLED_REGION (PROVEN), ADD_FAMILY_FLIP_CONTROL
        (PROVEN) where it must flip once placed.
  2. The body's and the diffuser's materials.
     -> LINK_FAMILY_PARAMETER (PROVEN), links Material=<parameter or
        material>.

  STAGES 10 TO 13 - VERIFICATION, FLEX, PROJECT TEST, SAVE

  STAGE 10 - FAMILY VERIFICATION
  family-creation Stage 10 holds, all of it. A light adds:
     -> REPORT_FAMILY_FORMS (PROVEN); SET_FAMILY_LIGHT_SOURCE's own read-back
        of every light value, per type, against the datasheet; revit_view_image
        of the plan symbol.

  STAGE 11 - FLEX TESTING
  family-creation Stage 11 holds.
     -> FLEX_FAMILY (PROVEN): the body, and the light's position below the
        opening at every size.

  STAGE 12 - PROJECT TESTING
  family-creation Stage 12 holds, and hosted-family-creation Stage 12 for a
  hosted fixture.
  1. Load it into a scratch test project and place it on its host.
     -> LOAD_FAMILY (PROVEN); PLACE_HOSTED_FAMILY (PROVEN) or
        PLACE_FAMILY_ON_FACE (PROVEN) for a hosted fixture,
        PLACE_FAMILY_INSTANCES (PROVEN) for a free-standing one; or the
        modeller places it by hand.
  2. Check the light: it renders, or shows in a lighting analysis.
     -> revit_view_image of a Realistic view (family-creation Stage 12 item
        6); a lighting analysis is the modeller's.
  3. Check the power: the fixture joins a circuit.
     -> CREATE_MEP_SYSTEM (PROVEN): its circuitType power, a circuit from the
        placed fixture on the `panel` the modeller names - never a panel
        Heron picks - reading back its number and panel; then
        REPORT_CONNECTORS (PROVEN) reads the joint, as family-creation Stage
        12 item 8.

  STAGE 13 - FINAL SAVE AND DELIVERY
  family-creation Stage 13 holds, its SAVE RULE above all: SAVE_DOCUMENT
  (PROVEN, Publish), then the file's time checked. Many types:
  REPORT_FAMILY_TYPE_CATALOG (PROVEN).


  4. ALWAYS / NEVER

  Always:
    * Set the light source in the order of Stage 9 A - the tick, the
      family's half, then each type's half.
    * Take every photometric value from the datasheet, per type.
    * Read back every light value per type before calling it done.
  Never:
    * Untick Light Source, or tell the modeller Heron can.
    * Put a second light source in one family - nest a fixture.
    * Guess lumens, a colour temperature, a voltage or a load.
    * Call it done before family-creation Stages 10 to 13.
  BY HAND, BECAUSE NO REVIT API CALL REACHES IT: unticking Light Source
  (Stage 9 A item 5); a type the lighting API does not list (Stage 9 A item
  4).


  5. REPORT TO THE MODELLER

  After each stage, one or two lines: what was completed, what was verified,
  what remains. The final report is family-creation's (its section 6), and
  adds: the light source's shape and distribution; every type's lumens and
  colour as Type Properties reads them; the power connector's values; and
  whether it rendered and joined a circuit in the test project. Report
  COMPLETED only when every check has passed; otherwise PARTIALLY COMPLETED,
  naming what is left and who does it, or FAILED with the reason.


  6. CORE PRINCIPLE

  MODEL -> VERIFY -> REPORT -> CONTINUE. Never sacrifice accuracy for speed,
  and never take a decision that is the modeller's.

# HOW heron_method SERVES THE PURPOSE ABOVE - a summary first, then one part
# at a time, as family-creation is served (the owner's choice, 2026-11-28):
# whole, with its uses, it is over 12,000 characters. The short stages are
# served together - "1-6" is Stages 1 to 6 - so a build asks four parts of
# this method rather than fourteen. Each entry names the purpose line its
# part starts at, exactly as written; an entry with no `stage` goes back into
# the summary. heron_skill.validate refuses a line missing, written twice or
# out of order.
stages:
  - {stage: "0", starts: "STAGE 0 - INFORMATION AND PREPARATION"}
  - {stage: "1-6", starts: "STAGES 1 TO 6 - CONFIGURATION, FRAMEWORK, GEOMETRY, STYLES, CONTROL, VOIDS"}
  - {stage: "7-9", starts: "STAGES 7 TO 9 - POWER, NESTED FIXTURES, LIGHT SOURCE AND GRAPHICS"}
  - {stage: "10-13", starts: "STAGES 10 TO 13 - VERIFICATION, FLEX, PROJECT TEST, SAVE"}
  - {starts: "4. ALWAYS / NEVER"}

utterances:
  - make a lighting fixture family
  - build a downlight family with a light source
  - create a linear light fitting family with lumens and colour temperature
  - make a ceiling light family that connects to a circuit


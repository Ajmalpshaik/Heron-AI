heron-status: DRAFT
heron-step: 18
heron-since: 0.1.0
heron-layer: brain

id: ifc-export-readiness
name: Check the model before it goes out as IFC
domain: revit.qa
# Heron wrote this one. D-66: a unit that ships with Heron says where it
# came from, so an IMPORTED one that says nothing stands out.
source: OFFICIAL

risk: READ

purpose: >
  A sweep of the live model for the things that go wrong in an IFC file and
  cannot be seen in Revit: an element filed under the wrong storey, one filed
  under none, an element that arrives as an anonymous proxy or not at all, two
  objects with one identity, and MEP pieces that leave their system behind.
  Every step reads; nothing is changed, and nothing is called ready - a step
  that passes means the values it checked were met (docs/45 s3).

  1. REPORT_LEVEL_ELEVATIONS, version 3, for each level's Building Story tick
     and how many elements sit on a level without it. The exporter makes a
     storey only from a ticked level, so what sits on an unticked one is filed
     somewhere else.
  2. SELECT_WITHOUT_LEVEL for the elements that belong to no level at all -
     they arrive with no storey, and most viewers do not show them.
  3. FIND_DUPLICATE_ELEMENTS - two elements in one place are two objects in
     the file, and both are counted downstream.
  4. FIND_DUPLICATE_VALUES on the IFC identity parameter (Revit's own
     "IfcGUID"), ONLY when the model has it. Copy and paste carries a stored
     value with it, and two objects with one identity overwrite each other in
     whatever reads the file.
  5. GROUP_AND_COUNT on Revit's "Export to IFC As" and "Export to IFC"
     parameters, per category, ONLY when the model has them - for Generic
     Models and anything else whose IFC class is blank, and for elements set
     not to export, which leave the file with no sign.
  6. CHECK_MODEL_STANDARDS with the parameters the receiving party asked to
     be filled (fire rating, load bearing, classification) as its required
     parameters - named by the modeller, never by Heron.
  7. READ_MEP_SYSTEM and FIND_SYSTEM_ISLANDS for MEP pieces on no system and
     runs cut off from their source - they lose their system grouping in the
     file.
  8. revit_export_check, the export questions that are not IFC's alone:
     unloaded links, placeholder sheets.

  A PARAMETER THE MODEL DOES NOT HAVE IS NOT CHECKED, NEVER ZERO. Steps 4 and
  5 read parameters that only exist once Revit's IFC parameters have been
  added to the project; on a model without them those steps answer NOT
  CHECKED and say why, because "0 duplicates" would read as a pass.

  NOT HERE: the export itself. EXPORT_MODEL_TO_IFC takes its schema as a
  value of a type a chat cannot type, on purpose (docs/fragment-issues/
  section-6.md, "One shape is contested"), so the sweep ends with the model
  read and the export left to the modeller's own Export > IFC.

# The words the modeller says before sending an IFC.
utterances:
  - check the model before I export IFC
  - is anything going to be lost in the IFC
  - which elements will come out as proxies
  - find duplicate IFC GUIDs
  - which levels are not building storeys

# CAPABILITIES, never fragment ids - in the order the purpose gives.
needs:
  - REPORT_LEVEL_ELEVATIONS
  - SELECT_WITHOUT_LEVEL
  - FIND_DUPLICATE_ELEMENTS
  # Only when the model has the IFC identity parameter - step 4.
  - FIND_DUPLICATE_VALUES
  # Only when the model has the IFC class parameters - step 5.
  - GROUP_AND_COUNT
  - CHECK_MODEL_STANDARDS
  - READ_MEP_SYSTEM
  - FIND_SYSTEM_ISLANDS

# What must be true BEFORE it runs, so it fails early with something
# useful instead of deep inside a transaction (docs/09 s2).
preconditions:
  - a project, not a family, is open in front, and it is the model that will be exported
  - the parameters the receiving party requires have been named for THIS request, or step 6 is left out and says so (D-33)
  - the categories to sweep have been named, or every model category is read and the answer says that it was

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]

note: >
  WRITTEN FROM A STUDY, NOT FROM A JOB - docs/45, 2026-10-04. Every step is a
  capability Heron already has except step 1's Building Story count, which is
  REPORT_LEVEL_ELEVATIONS version 3 (DRAFT). Which level an element on an
  unticked level is filed under, and what Revit names its IFC parameters on
  each release from 2020, are not measured: Group CD (CD9) measures them on a
  scratch model, and this recipe stays DRAFT until then.

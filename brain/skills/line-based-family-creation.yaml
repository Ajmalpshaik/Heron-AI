id: line-based-family-creation
name: Build a line-based family whose length is set by two clicks
domain: revit.families
# Heron wrote this one. D-66: a unit that ships with Heron says where it
# came from, so an IMPORTED one that says nothing stands out.
source: OFFICIAL

risk: MODIFY

# THE SHAPE OF THIS METHOD (2026-11-28): the owner's family creation
# standard, as family-creation carries it - objective, when to use it, the
# stages of family-creation in their order, the always/never rules and the
# report. Shared stages are POINTED AT, never copied: "family-creation Stage
# N" is heron_method(job="family-creation", stage=N). Every rule the
# seven-step method this replaced held is under the stage it belongs to (the
# pull request lists each).
purpose: |
  LINE-BASED FAMILY CREATION - a family placed with two clicks, its LENGTH
  set by them: a lintel, a skirting, a kerb, a cable ladder run, a pipe rack,
  a row of brackets along a wall. The owner's family creation standard (Ajmal
  PS, 2026-11-28), with what changes when the length comes from the clicks.

  HOW TO READ IT. This method keeps family-creation's stages, in their order,
  and says only what a line-based family adds. "family-creation Stage N" is
  served by heron_method(job="family-creation", stage=N): follow that stage
  there, then what is written here. family-creation's behaviour rules and its
  report (its sections 5 and 6) come with its summary, heron_method(job=
  "family-creation"), and hold here. "-> CAPABILITY (STATUS)" after a step is
  the Heron capability that does it and its card's status when this was
  written; the list of uses served after this method gives each one's status
  now, and that list wins. Two named here are not in that list, so this method
  is not offered beside ordinary placing and saving requests:
  PLACE_LINE_BASED_FAMILY and SAVE_DOCUMENT - each stage served gives their
  status too. "-> no Heron tool yet:" is a step Heron cannot do: it says what
  the modeller does by hand. A DRAFT capability that CHANGES the model is
  refused by revit_change until it is proved (D-117); a DRAFT READ runs
  through revit_read and says DRAFT - confirm what matters another way.

  ITS OWN STAGES ARE SERVED IN PARTS:
  heron_method(job="line-based-family-creation") lists them, and a stage of
  this method is asked by its part's id - "1-5" for Stages 1 to 5, "10-13" for
  Stages 10 to 13.

  OLD STEPS. Before 2026-11-28 this method had steps 0 to 7, and other files
  still name them: step 0 is Stage 0 items 1 to 3; step 1 is Stage 0 item 4
  and Stage 1 item 1; step 2 is Stage 1 items 2 and 3; step 3 is Stage 2;
  step 4 is Stages 3 and 5; step 5 is Stage 6; step 6 is Stages 4 and 9;
  step 7 is Stages 10 to 12.


  1. OBJECTIVE

  A family whose body runs the whole length between the two clicks, whose
  cross-section follows its type sizes, and whose repeated parts keep their
  spacing at any length - checked at two lengths and placed with two clicks
  in a test project. Never guess a size or a spacing; never call it done
  before the checks.


  2. WHEN TO USE - AND WHEN NOT

  Use it when the template the modeller starts from is line-based and the
  family's length is the placed copy's own.
  Not for:
    * a 2D line-based DETAIL ITEM - detail-family-creation;
    * a family of a fixed length, or one whose length is a type size -
      family-creation.


  3. WORKFLOW

  STAGE 0 - INFORMATION AND PREPARATION
  family-creation Stage 0 holds. A line-based family adds:
  1. Confirm the family is line-based, and read its length.
     -> REPORT_FAMILY_TEMPLATE (PROVEN): the built-in LENGTH (an instance
        parameter) and the template's own planes the length is measured
        between. The file comes as family-creation Stage 0 item 1 says.
     * THOSE PLANES AND THAT DIMENSION ARE THE TEMPLATE'S: never moved,
       deleted or labelled again.
  2. Check the units - family-creation Stage 0 item 3, which holds.
     -> REPORT_FAMILY_TEMPLATE (PROVEN), its units line; SET_PROJECT_UNITS
        (PROVEN, Admin); REPORT_PROJECT_UNITS (DRAFT). IMPERIAL where the
        modeller works in millimetres is said BEFORE anything is built.
  3. Keep the length planes and the Length dimension as the template made
     them.
     -> REPORT_FAMILY_TEMPLATE (PROVEN), read again before the first write.
  4. Read the thing, into family-creation's one list.
     -> no Heron tool: asked once - its CROSS-SECTION, which sizes change
        between types, and every part that repeats along the length -
        brackets, posts, slots - with its spacing. The length is never asked
        for as a type size: it is the placed copy's own.
  GATE: the modeller confirms the list.

  STAGES 1 TO 5 - CONFIGURATION, FRAMEWORK, GEOMETRY, STYLES, CONTROL

  STAGE 1 - FAMILY CONFIGURATION
  family-creation Stage 1 holds. A line-based family adds:
  1. Confirm the OmniClass Number - family-creation Stage 1 item 3, which
     holds.
     -> REPORT_FAMILY_TEMPLATE (PROVEN), its classificationCodes line, run
        again after any category change; SET_FAMILY_SETTINGS (PROVEN)
        "OmniClass Number=<code>" once the modeller confirms it - never
        guessed (D-33).
  2. The section's parameters and values, first.
     -> REPORT_SHARED_PARAMETER_FILE (PROVEN) first; ADD_FAMILY_PARAMETERS
        (PROVEN, Admin); SET_FAMILY_TYPE_VALUES (PROVEN).
  3. A count that follows the length.
     -> ADD_FAMILY_PARAMETERS (PROVEN, Admin), an Integer; SET_FAMILY_FORMULA
        (PROVEN): "Bracket Count = rounddown(Length / Bracket Spacing) + 1".
     * GUARD IT so it never falls below what an array accepts on Revit 2020
       to 2024, where an array keeps at least two members: "Bracket Count =
       if(Length < Bracket Spacing, 2, rounddown(Length / Bracket Spacing) +
       1)". A formula names no value of its own, so the guard tests the
       parameters themselves.
     * Revit's own help says its formulas compare with <, > and = and that <=
       and >= are not implemented, so "a <= b" is written "not(a > b)"; a
       parameter's name is matched with its case and spaces exactly.
     * Whether a length divided by a length may feed an Integer without "/ 1
       mm" is NEEDS-CHECKING BV14: read the count back at two lengths (Stage
       11) rather than trusting it.

  STAGE 2 - REFERENCE FRAMEWORK
  family-creation Stage 2 holds. A line-based family adds:
  1. Planes for the section - ACROSS the line, never along it.
     -> CREATE_REFERENCE_PLANES (PROVEN); SET_FAMILY_PLANE_REFERENCE
        (PROVEN), the owner's gray rule for every plane the build adds;
        LABEL_FAMILY_DIMENSION (PROVEN).

  STAGE 3 - GEOMETRY CREATION
  family-creation Stage 3 holds, group by group. A line-based family adds:
  1. THE BODY RUNS THE FULL LENGTH by being locked to the start and end
     planes.
     -> EXTRUDE_BETWEEN_PLANES (PROVEN) for a rectangular section, the two
        length planes as its left and right.
     -> CREATE_FAMILY_FORMS (PROVEN) for any other section: a kind=extrusion
        row on the plane at the start, its far face locked to the end plane
        in Stage 5 - or a kind=sweep row along the line, its path's ends on
        those planes.

  STAGE 4 - OBJECT STYLES AND SUBCATEGORIES
  family-creation Stage 4, unchanged.
     -> SET_FAMILY_FORM_SUBCATEGORY (PROVEN).

  STAGE 5 - DIMENSIONS AND PARAMETRIC CONTROL
  family-creation Stage 5 holds. A line-based family adds:
  1. Lock the body's far face to the end plane.
     -> LOCK_FORM_TO_PLANES (PROVEN); LABEL_FAMILY_RADIUS (PROVEN) for a round
        section; LINK_FAMILY_PARAMETER (PROVEN) for a form's own field.

  STAGE 6 - VOIDS AND ARRAYS
  family-creation Stage 6 holds - arrays above all. A line-based family adds:
  1. A PART THAT REPEATS ALONG THE LENGTH is one form and an array.
     -> ARRAY_FAMILY_FORMS (PROVEN): stepping to the "last" member, its count
        labelled with Stage 1 item 3's Integer; the first member locked to
        the start plane and the last to the end plane, so the spacing follows
        the length.
     * family-creation Stage 6's array rules hold: a form arrayed is sketched
       on a plane no parameter moves, or it loses its work plane.
  2. Cuts inside the family.
     -> COMBINE_FAMILY_FORMS (PROVEN).

  STAGES 7 TO 9 - CONNECTORS, NESTED FAMILIES, MATERIALS AND GRAPHICS

  STAGE 7 - MEP CONNECTORS
  family-creation Stage 7, unchanged, where it applies: ADD_FAMILY_CONNECTOR
  (PROVEN).

  STAGE 8 - NESTED FAMILIES
  family-creation Stage 8, unchanged: PLACE_FAMILY_INSTANCES (PROVEN),
  LOCK_NESTED_FAMILY_TO_PLANES (PROVEN), ADD_FAMILY_TYPE_PARAMETER (DRAFT -
  refused by revit_change until proved; try it once, or the modeller makes
  the Family Type parameter by hand). A part in the row that a size
  stretches is a nested family arrayed - family-creation Stage 6.

  STAGE 9 - MATERIALS AND GRAPHICS
  family-creation Stage 9 holds. A line-based family adds:
  1. The plan symbol of a run - usually a single line at Coarse.
     -> DRAW_FAMILY_SYMBOLIC_LINES (PROVEN), SET_FAMILY_FORM_VISIBILITY
        (PROVEN), DRAW_FAMILY_FILLED_REGION (PROVEN), ADD_FAMILY_FLIP_CONTROL
        (PROVEN) where it must flip once placed.
  2. Materials.
     -> LINK_FAMILY_PARAMETER (PROVEN), links Material=<parameter or
        material>.

  STAGES 10 TO 13 - VERIFICATION, FLEX, PROJECT TEST, SAVE

  STAGE 10 - FAMILY VERIFICATION
  family-creation Stage 10 holds, all of it.
     -> REPORT_FAMILY_FORMS (PROVEN): the body from start plane to end plane,
        and the number of repeated parts the count says.

  STAGE 11 - FLEX TESTING
  family-creation Stage 11 holds. A line-based family adds:
     -> FLEX_FAMILY (PROVEN) at TWO LENGTHS as well as two sections - the
        length is the size that moves most - and at a length shorter than one
        spacing, where the guard of Stage 1 item 3 holds the count at 2.

  STAGE 12 - PROJECT TESTING
  family-creation Stage 12 holds.
  1. Load it into a scratch test project.
     -> LOAD_FAMILY (PROVEN), with the saved .rfa's path.
  2. Place it with two clicks.
     -> PLACE_LINE_BASED_FAMILY (PROVEN), along a line given by its start and
        end, its structural type asked for and never assumed; or the modeller
        places it by hand with two clicks.

  STAGE 13 - FINAL SAVE AND DELIVERY
  family-creation Stage 13 holds, its SAVE RULE above all: SAVE_DOCUMENT
  (PROVEN, Publish), then the file's time checked. Many types:
  REPORT_FAMILY_TYPE_CATALOG (PROVEN).


  4. ALWAYS / NEVER

  Always:
    * Read the template's Length and its planes first, and keep them.
    * Lock the body to the start and end planes.
    * Guard a count that follows the length.
    * Flex at two lengths.
  Never:
    * Ask for the length as a type size.
    * Label the length again, or move a length plane.
    * Write <= or >= in a formula.
    * Call it done before family-creation Stages 10 to 13.


  5. REPORT TO THE MODELLER

  After each stage, one or two lines: what was completed, what was verified,
  what remains. The final report is family-creation's (its section 6), and
  adds: the two lengths it was flexed at with the count at each, and how it
  was placed in the test project. Report COMPLETED only when every check has
  passed; otherwise PARTIALLY COMPLETED, naming what is left and who does it,
  or FAILED with the reason.


  6. CORE PRINCIPLE

  MODEL -> VERIFY -> REPORT -> CONTINUE. Never sacrifice accuracy for speed,
  and never take a decision that is the modeller's.

# HOW heron_method SERVES THE PURPOSE ABOVE - a summary first, then one part
# at a time, as family-creation is served (the owner's choice, 2026-11-28):
# whole, with its uses, it is over 12,000 characters. The short stages are
# served together - "1-5" is Stages 1 to 5 - so a build asks five parts of
# this method rather than fourteen. Each entry names the purpose line its
# part starts at, exactly as written; an entry with no `stage` goes back into
# the summary. heron_skill.validate refuses a line missing, written twice or
# out of order.
stages:
  - {stage: "0", starts: "STAGE 0 - INFORMATION AND PREPARATION"}
  - {stage: "1-5", starts: "STAGES 1 TO 5 - CONFIGURATION, FRAMEWORK, GEOMETRY, STYLES, CONTROL"}
  - {stage: "6", starts: "STAGE 6 - VOIDS AND ARRAYS"}
  - {stage: "7-9", starts: "STAGES 7 TO 9 - CONNECTORS, NESTED FAMILIES, MATERIALS AND GRAPHICS"}
  - {stage: "10-13", starts: "STAGES 10 TO 13 - VERIFICATION, FLEX, PROJECT TEST, SAVE"}
  - {starts: "4. ALWAYS / NEVER"}

utterances:
  - make a line based family
  - build a line based lintel family
  - make a line based family for a cable ladder run
  - create a skirting family that I draw with two clicks
  - make a line based family with brackets along its length


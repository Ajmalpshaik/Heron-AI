id: health-audit-cleanup
name: Health audit and clean-up - the audit, the fixes asked for, then the purge
domain: revit.qa
# Heron wrote this one. D-66: a unit that ships with Heron says where it
# came from, so an IMPORTED one that says nothing stands out.
source: OFFICIAL

# MODIFY, the highest rung any step stands on: the clean-up deletes and
# straightens. Steps 1 to 6 only read.
risk: MODIFY

purpose: >
  Reads what a model is carrying that should not be there - its warnings,
  elements placed twice, names and values that break the project's own
  rules, and what Purge Unused would offer - reports it, and then, only on
  the modeller's word for each one, takes the duplicates out, straightens
  what is slightly off axis, and purges last. The audit is steps 1 to 6 and
  changes nothing; a modeller who wants only the audit stops there.

  The status in brackets after each capability is what that capability's own
  fragment.yaml said on 2026-11-11. The list of capabilities after this method
  is read from the library every time it is served: where the two differ, the
  list is right and this text is out of date. A read runs while its card is
  DRAFT and says so. A change does not: revit_change refuses a DRAFT, and a
  card whose proof is older than its code (D-117).

  NOTHING IS DELETED ON A GENERAL "YES, CLEAN IT UP". Deleting and purging
  each need the modeller's yes for THAT operation, after they have seen what
  goes and how many (Constitution Article 7). Then, when DELETE_ELEMENTS runs,
  Revit itself shows the elements and asks Delete or Don't delete in a box of
  its own, whatever Ask to Keep says and never under a job's grant (D-142).
  Don't delete is the answer: nothing was deleted, and it is not sent again.

  0. A FILE TO GO BACK TO. REPORT_OPEN_DOCUMENTS (DRAFT) says whether the
     model has a file and when it was last saved. A clean-up in a model never
     saved has no copy to go back to; say so ONCE before step 7. Heron cannot
     save the model it works in (OPEN-QUESTIONS Q-69).
  1. THE OVERVIEW. REPORT_MODEL_DASHBOARD (PROVEN, version 3) through
     revit_read - or revit_model_dashboard, which puts the same read on the
     Companion's page: elements by category, level and workset, warnings by
     kind, views on no sheet and with no template, empty sheets, families
     and groups with nothing placed, links, CAD files, rooms not placed. A
     part it could not read is said, never shown as zero.
  2. THE WARNINGS. READ_MODEL_WARNINGS (PROVEN, version 2): grouped by what
     the warning says, errors first, with the elements that cause each. An
     empty answer under errorsOnly or descriptionContains is not a clean
     model - it is that filter finding nothing.
  3. PLACED TWICE. FILTER_ELEMENTS_BY_CATEGORY (PROVEN) for the categories
     the modeller names, then FIND_DUPLICATE_ELEMENTS (PROVEN) with the
     toleranceMm they give, expect_from naming the filter. Same type AND
     same place; its `elements` are the extras, one of each cluster kept.
     `noPoint` are elements it could not place and did not judge. TYPE AND
     PLACE ARE ALL IT COMPARES. It reads no phase and no design option: an
     element demolished in one phase and its replacement in the next, or the
     same element in two design options, share a type and a point and come
     back as an "extra" - and neither is a duplicate. So this list is what
     to LOOK at, never what to delete.
  4. THE PROJECT'S OWN RULES. CHECK_MODEL_STANDARDS (PROVEN, version 2) with
     the name patterns and the required parameters the modeller gives -
     Heron knows no standard of its own (D-33). A section with no rule
     answers NOT CHECKED, never zero.
  5. WHAT PURGE WOULD OFFER. FIND_PURGEABLE_ELEMENTS (PROVEN, version 3),
     categories empty for every category: the unused elements by category
     and by name, the families with nothing placed, and - as reports by name
     - unused group definitions, images, view templates and view filters.
     `heldBack` names what Revit's list offers and a check here found in use.
     ON REVIT 2020 TO 2023 IT IS A REPORT ONLY: Revit opened its unused list
     to add-ins in 2024, so on the older releases nothing is handed on to
     delete.
  6. SAY WHAT WAS FOUND, AND ASK. Each of steps 1 to 5 in Revit words, as
     counts by kind with the names that matter. Never a score, and never
     "clean", "healthy" or "compliant": a check that passes means the values
     it checked were met. Ask which of steps 7 to 9 the modeller wants; each
     is its own change, its own entry in Revit's undo list, and its own yes.
  7. THE DUPLICATES OUT, first of the changes - they are what Revit's
     "identical instances in the same place" warning is about. A COUNT IS
     NOT ENOUGH TO SAY YES TO: before the modeller is asked, they see WHAT
     would go. Each of these acts on step 3 run again right before it - the
     chain names the last run - with expect_from="find-duplicate-elements":
     DESCRIBE_ELEMENTS (PROVEN) for each extra's category, family, type and
     id; READ_ELEMENT_PHASE (PROVEN) for the phase each was created in and
     the phase it is demolished in; SET_SELECTION (PROVEN) through
     revit_show, with show, to put them on screen. REPORT_DESIGN_OPTIONS
     (PROVEN) says whether the model has design options at all, and how many
     elements sit in each. Read the modeller the list - not the total - and
     say plainly what step 3 does not know: which of each pair is kept, and
     whether the two are in different phases or different design options.
     On a model with more than one phase in use, or with design options,
     the modeller says which extras really are duplicates; the rest stay.
     Then their yes for THIS delete, naming what goes. All of them:
     step 3 again, then DELETE_ELEMENTS (PROVEN) through revit_change with
     expect_from="find-duplicate-elements". Only some: FILTER_ELEMENTS_BY_ID
     (PROVEN) with elementIds the ones agreed, then DELETE_ELEMENTS with
     expect_from="filter-elements-by-id". Revit's own box then shows them and
     asks again (D-142). It reports what Revit really removed: `alsoWent` is
     what went with them - a duct's insulation, a wall's doors.
  8. SLIGHTLY OFF AXIS, when the warnings named it. READ_MODEL_WARNINGS with
     descriptionContains the warning's own words, then
     STRAIGHTEN_OFF_AXIS_LINES (PROVEN) with the snapDegrees and
     maxOffDegrees the modeller gives, expect_from naming that read.
     `tooFarOff` and `notStraightened` are named, never forced.
  9. PURGE, LAST - Revit 2024 and later, where step 5 hands its elements
     on. Deleting anything can leave a type, a material or a family unused,
     so purging before steps 7 and 8 leaves work behind. Step 5
     again, right before. Read the modeller the names by category and what
     is held back; get their yes for this purge. Then DELETE_ELEMENTS with
     expect_from="find-purgeable-elements". PURGE IS A LADDER: removing a
     type can leave its material unused, so step 5 after the delete finds
     the next rung - and each rung is read out and asked for again, never
     repeated on the first yes.
  10. THE CHECK. Steps 2, 3 and 5 once more, each beside what it said in the
      audit: which warnings went, which stayed, how many extras and unused
      elements are left. The calls not failing is not the proof. One Undo in
      Revit puts one change back.

  WORKSHARED MODELS. An element another person owns is skipped and named,
  never taken (Article 12). Nothing here synchronises with central, and a
  clean-up of a central model's local copy reaches nobody else until the
  modeller synchronises it themselves (Article 10).

  NOT HERE: telling a true duplicate from a phase or design-option twin -
  step 3 compares type and place alone, and step 7 puts that judgement to
  the modeller. A fix for every kind of warning. This method repairs two kinds
  - identical instances, and slightly off axis; every other kind is read,
  with its elements, and its repair is a separate change the modeller asks
  for.
  Renaming what step 4 names is a separate change too. Purging on Revit 2020
  to 2023 - step 5 reports, and the purge is the modeller's own Manage >
  Purge Unused. Purging inside a loaded family, which means opening it.
  Revit's Audit tick on opening a file, and compacting a central file, are
  Revit's own and nothing in the library does either.

# FROM THE BRIEF THIS METHOD WAS ASKED FOR IN (2026-11-11): "health check
# and fix" is its words as they stood. The other two were written for this
# method, from its "model health audit and clean-up" and its "purge". None
# is from the owner's own question log; his own way of asking is added on
# his word. No question is declared: this method is above the write line
# (D-86), and "how many warnings" or "is anything placed twice" is a read
# with a card of its own - the audit half of this job is asked for as an
# instruction.
#
# THE ID, THE NAME AND THESE KEEP OFF "model", "warnings", "duplicates",
# "standards" AND "unused" ON PURPOSE, as delete-by-id keeps off "form": a
# lookup names a method by the words it shares with the request, when the
# method needs one of the lookup's answers. Measured 2026-11-11 on the
# model backend, with "model" in all three: "which models are open right
# now", "is my model saved" and three more reads of that kind were offered
# this clean-up, and "find duplicate IFC GUIDs" was too. The name says "then
# the purge", not "the purge last": with "last" in it, "when was the model
# last saved" was offered this clean-up.
utterances:
  - run a health audit and clean up
  - health check and fix
  - purge after the clean-up

# CAPABILITIES, never fragment ids - in the order the purpose gives.
needs:
  # Step 0's check that the model has a file to go back to.
  - REPORT_OPEN_DOCUMENTS
  - REPORT_MODEL_DASHBOARD
  - READ_MODEL_WARNINGS
  # The categories step 3 looks for extras in.
  - FILTER_ELEMENTS_BY_CATEGORY
  - FIND_DUPLICATE_ELEMENTS
  - CHECK_MODEL_STANDARDS
  - FIND_PURGEABLE_ELEMENTS
  # Steps 7 and 9. Never without the modeller's yes for that one delete, and
  # never without the expect_from that names what it acts on.
  # WHAT SHOWS THE MODELLER THE EXTRAS BEFORE THAT YES - DESCRIBE_ELEMENTS,
  # READ_ELEMENT_PHASE, REPORT_DESIGN_OPTIONS, SET_SELECTION - and
  # FILTER_ELEMENTS_BY_ID, which hands on the ones agreed, are named in step
  # 7 and left off here on purpose, as update-general-notes leaves off its
  # read and the capabilities that only pick: a lookup names a method whose
  # needs hold one of its answers, and these five answer "what is this",
  # "which phase is this on", "select these". Not measured with them here.
  # All five PROVEN on 2026-11-11.
  - DELETE_ELEMENTS
  # Only when the warnings named it - step 8.
  - STRAIGHTEN_OFF_AXIS_LINES

# What must be true BEFORE it runs, so it fails early with something
# useful instead of deep inside a transaction (docs/09 s2).
preconditions:
  - a project is open in front and it is the model the modeller means - a family in front is purged from inside it, which is not this method
  - the categories to look for duplicates in, the tolerance in millimetres, and the project's own name patterns and required parameters are the modeller's, or that step is left out and says so (D-33, D-71)
  - for steps 7 to 9 the owner has Changes on, and the modeller has said yes to that one delete or purge after seeing WHAT goes - each extra's category, type, phase and, where the model has them, design option - and not only how many (Article 7); Revit's own Delete box still asks (D-142)
  - the model has a file and has been saved before step 7
  - on a workshared model, what the modeller cannot edit is skipped and named - nothing is checked out or synchronised for them (Articles 10 and 12)

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]

note: >
  WRITTEN 2026-11-11 IN A CLOUD SESSION, NOT RUN. No Revit was reachable. No
  new capability: every step names one the library already has, and on the
  day it was written only REPORT_OPEN_DOCUMENTS among them was DRAFT. The
  order of the changes - duplicates, then off-axis, then purge, and the
  purge repeated rung by rung - is FIND_PURGEABLE_ELEMENTS' own account of
  Purge Unused and common Revit practice; it has not been measured on a
  model here.

  THE LIBRARY HAS NO ONE-CALL PURGE, on purpose so far: the find is a READ
  and the delete is DELETE_ELEMENTS behind its box. Whether a purge of its
  own is wanted is the owner's decision.

  DRAFT until the audit and each change have been run on a saved scratch
  copy and read back; no NEEDS-CHECKING group holds that run yet.

id: adaptive-family-creation
name: Build an adaptive component placed by clicking its numbered points
domain: revit.families
# Heron wrote this one. D-66: a unit that ships with Heron says where it
# came from, so an IMPORTED one that says nothing stands out.
source: OFFICIAL

risk: MODIFY

# THE SHAPE OF THIS METHOD (2026-11-28): the owner's family creation standard,
# as family-creation carries it - objective, when to use it, stages of numbered
# steps with the Heron capability and its card's status after each, verify,
# report, always and never. A stage the two share is POINTED to, never copied.
# Every rule of the seven-step method this replaced is kept under the step it
# belongs to, or corrected by its card (the pull request lists each).
purpose: |
  ADAPTIVE COMPONENT CREATION - the owner's family creation standard (Ajmal
  PS, 2026-11-28) for an adaptive component, with the Heron tool for every
  step under it.

  HOW TO READ IT. family-creation's rules hold here wherever they fit; this
  method says what an adaptive component does differently and POINTS to a
  shared stage - heron_method(job="family-creation", stage="13") serves its
  Stage 13 - rather than copying it. "-> CAPABILITY (STATUS)" is the Heron
  capability for the step and its card's status on 2026-11-28; the list
  served after this method gives each one's status now, and it wins - except
  CREATE_FAMILY_DOCUMENT, ACTIVATE_DOCUMENT, SAVE_DOCUMENT,
  REPORT_OPEN_DOCUMENTS and PLACE_ADAPTIVE_COMPONENTS, left out of that list
  so this method is not offered beside ordinary requests: heron_resolve gives
  theirs. FLEX_FAMILY is named only as the test this family does not take. "-> no Heron tool yet:" is done by hand, or asked. revit_change
  refuses a DRAFT that changes the model (D-117); a DRAFT read runs and says
  DRAFT, so confirm what matters another way. Each Heron change is one undo
  entry.


  1. OBJECTIVE

  An ADAPTIVE COMPONENT - a family placed by clicking its numbered points,
  whose shape follows wherever they land: a two-point fin or strut, a
  three-point bracket, a four-point panel placed by hand, a canopy that spans
  between points - built, seen following its points, and placed in a test
  project. Made from the Generic Model Adaptive template, in the conceptual
  Family Editor, where shapes are built on POINTS and LINES - so
  family-creation's Stages 2, 3, 5 and 11 do not apply here.


  2. WHEN TO USE IT - AND WHEN NOT

  For a family placed by its points. A panel that fills a divided surface:
  PATTERN-BASED-FAMILY-CREATION. A massing block: MASS-FAMILY-CREATION. A
  family whose sizes are typed rather than clicked: FAMILY-CREATION.


  3. WORKFLOW

  STAGE 0 - INFORMATION AND PREPARATION
  1. The family file, and what it is.
     -> CREATE_FAMILY_DOCUMENT (PROVEN, Admin) with the template the modeller
        NAMES - Generic Model Adaptive - and the .rfa path the modeller NAMES,
        or the modeller starts it; Heron never picks either (D-33). Then
        ACTIVATE_DOCUMENT (PROVEN) and revit_use_this_model (family-creation
        Stage 0 item 1).
     -> REPORT_FAMILY_TEMPLATE (PROVEN): it must read as an adaptive
        component; the points and lines it already holds.
  2. Check the units.
     -> family-creation Stage 0 item 3: REPORT_FAMILY_TEMPLATE's units line,
        or REPORT_PROJECT_UNITS (DRAFT, a read) where it has none. IMPERIAL
        where the modeller works in millimetres is said before anything is
        built, with SET_PROJECT_UNITS (PROVEN, Admin) or the Metric template
        offered.
  3. READ THE THING, in ONE list said back to the modeller: how many points
     the modeller clicks, IN WHAT ORDER, what spans between them, and every
     size - a section, a thickness, an inset.
     -> no Heron tool: asked. The click order is the placement order and
        cannot be guessed (D-33).
  4. THE FORM TOOL IS NOT PROVED: CREATE_CONCEPTUAL_FORM (DRAFT, version 2)
     is refused by revit_change until NEEDS-CHECKING Group QM re-proves it
     (D-117). Say so before Stage 3, and the modeller chooses: try it once -
     the bridge client's try-once, on the family saved first with nothing
     unsaved, kept only if the modeller presses Keep (D-119, D-121) - or
     Create Form by hand on the lines Heron draws.
  5. A family with no file is saved before the first write: family-creation
     Stage 0 item 5 (SAVE_DOCUMENT, PROVEN, Publish).
  GATE: the modeller confirms the list.

  STAGE 1 - THE POINTS
  1. The placement points, in click order.
     -> PLACE_ADAPTIVE_POINTS (PROVEN), as PLACEMENT points in click order -
        the numbers Revit gave are read back.
  2. A SHAPE HANDLE point only where the shape must be adjusted after
     placing.
     -> PLACE_ADAPTIVE_POINTS (PROVEN), shape handle. Never in a family that
        will be repeated along a divided path: Revit's Repeat refuses a family
        with shape handles.
  3. A point that slides along a line - a mid-point bracing, an inset.
     -> PLACE_ADAPTIVE_POINTS (PROVEN), "on <line id> at 0.5", once Stage 2's
        line exists. Built 2026-10-02; a hosted point's own check is owed,
        NEEDS-CHECKING BV19.
  4. Each placement point's ORIENTATION - Instance (xyz) by default; Host and
     Loop System is the one panels placed on a surface usually need.
     -> SET_ADAPTIVE_POINT_ORIENTATION (PROVEN, version 1), once item 1's
        points exist - all of them or by number (NEEDS-CHECKING JK).
        REPORT_FAMILY_TEMPLATE's pointList reads each point's Orientation
        back (NEEDS-CHECKING JQ), as Properties does.

  STAGE 2 - THE LINES
  -> DRAW_FAMILY_POINT_CURVES (PROVEN) between the points - REFERENCE lines
     to build on, MODEL lines where the line itself is the part. Lines drawn
     through the points move with them.
  Tell the modeller what is now in Revit.

  STAGE 3 - THE FORMS
  1. A form on those lines.
     -> CREATE_CONCEPTUAL_FORM (DRAFT, version 2 - Stage 0 item 4): a closed
        loop and no depth is a SURFACE; a depth pushes it; two or more
        profiles LOFT.
  2. A TWO-POINT BEAM OR STRUT.
     -> PLACE_ADAPTIVE_POINTS (PROVEN) "on point 1 yz ..." puts reference
        points on point 1's own plane square to the line, the section's
        corners; DRAW_FAMILY_POINT_CURVES (PROVEN) closes a loop through them;
        then CREATE_CONCEPTUAL_FORM (DRAFT) with that loop as the profile and
        the 1-2 line as the PATH sweeps the section along it - it turns and
        stretches with the two points. The sweep along a path is owed,
        NEEDS-CHECKING BV20.
  Tell the modeller after each form.

  STAGE 4 - MATERIAL, PARAMETERS AND CLASSIFICATION
  1. The material.
     -> LINK_FAMILY_PARAMETER (PROVEN), forms= the ids, links Material=<it>
        (family-creation Stage 9 item 4).
  2. What the types choose.
     -> ADD_FAMILY_PARAMETERS (PROVEN, Admin) - family-creation Stage 1.
  3. OmniClass.
     -> family-creation Stage 1 item 3: REPORT_FAMILY_TEMPLATE's
        classificationCodes line - run again after the category changed -
        the modeller confirms the code that fits, or picks where more than one
        could, and SET_FAMILY_SETTINGS (PROVEN) "OmniClass Number=<code>"
        writes it; no file or no code is said, never guessed (D-33).

  STAGE 5 - FAMILY VERIFICATION
  This stage is mandatory.
  1. Read back every form.
     -> REPORT_FAMILY_FORMS (PROVEN): its extent and its volume or area,
        against Stage 0's list; the points against REPORT_FAMILY_TEMPLATE's
        pointList.
  2. LOOK AT IT.
     -> revit_view_image with elements= the forms' ids, a read (D-123) -
        family-creation Stage 10 E.
  3. THE FLEX AN ADAPTIVE FAMILY TAKES.
     -> no Heron tool yet: the modeller drags each point in the Family Editor
        and the form must follow. FLEX_FAMILY changes parameters, not points;
        family-creation Stage 11 is skipped, and the report says why.

  STAGE 6 - PROJECT TESTING
  1. Save it first - a load reads the file.
     -> SAVE_DOCUMENT (PROVEN, version 4, Publish), as family-creation Stage
        13's SAVE RULE says; the modeller's Ctrl+S only where it is refused.
        Its file's time is checked on disk BEFORE the load - the card's
        proof saved another open document, not the family in front.
  2. Load it into a test project (family-creation Stage 12).
     -> ACTIVATE_DOCUMENT (PROVEN), revit_use_this_model; LOAD_FAMILY
        (PROVEN, version 4) with the .rfa's path.
  3. Place it by its points, in click order.
     -> the modeller clicks the points in order; or PLACE_ADAPTIVE_COMPONENTS
        (PROVEN), pointsMm "x,y,z; x,y,z" in millimetres, one group per
        instance, in placement order. Then revit_view_image with elements=
        the placed instance.

  STAGE 7 - FINAL SAVE AND DELIVERY
  family-creation Stage 13: back in the family first (ACTIVATE_DOCUMENT and
  revit_use_this_model), items 6 to 9 and its SAVE RULE - the save checked on
  disk: REPORT_OPEN_DOCUMENTS (DRAFT, a read) fileTimes, and because it is
  DRAFT the file's Date modified in File Explorer or the chat's own file
  tools too.


  4. RULES

  Always: take the point count and click order from the modeller; place the
  points in that order; draw every line through the points; say the form
  tool's status before building; look at the picture; check the save on disk.
  Never: guess a click order or a size; add a shape handle to a family that
  a divided path repeats; call it done before it has been placed by its
  points; report a save not checked. A delete waits for the modeller's yes
  (Constitution 7); a change is taken back with Revit's own Undo, never with
  a second change.


  5. COMMUNICATION WITH THE MODELLER

  Short, plain, in Revit words: after each stage, what was done, checked and
  left. A step done by hand - a form, the drag test - is named with who did
  it. The final report (family-creation section 6) gives the family's name,
  its points in order, its forms, material, the drag test, the placement in
  the project and the save checked on disk: COMPLETED only when every check
  passed, otherwise PARTIALLY COMPLETED or FAILED, with the reason.


  6. CORE PRINCIPLE

  MODEL -> VERIFY -> REPORT -> CONTINUE.

utterances:
  - make an adaptive component family
  - build a two point adaptive family
  - make an adaptive family placed by four points
  - create an adaptive component for a canopy strut

needs:
  - REPORT_FAMILY_TEMPLATE
  # Stage 0's units check, as family-creation Stage 0 item 3.
  - REPORT_PROJECT_UNITS
  - SET_PROJECT_UNITS
  - SET_FAMILY_SETTINGS
  - PLACE_ADAPTIVE_POINTS
  # Stage 1's Orientation of those points - NEEDS-CHECKING JK.
  - SET_ADAPTIVE_POINT_ORIENTATION
  - DRAW_FAMILY_POINT_CURVES
  - CREATE_CONCEPTUAL_FORM
  - LINK_FAMILY_PARAMETER
  - ADD_FAMILY_PARAMETERS
  - REPORT_FAMILY_FORMS
  - LOAD_FAMILY

preconditions:
  - a family document is open in the Family Editor, started from the Generic Model Adaptive template - by the modeller, or by CREATE_FAMILY_DOCUMENT with the template the modeller named; Heron does not choose a template
  - the number of points, their click order and every size have been given for THIS request


heron-status: DRAFT
heron-step: 14
heron-since: 0.1.0
heron-layer: brain

id: check-connectivity
name: Is this still connected
domain: revit.mep
# Heron wrote this one. D-66: a unit that ships with Heron says where it
# came from, so an IMPORTED one that says nothing stands out.
source: OFFICIAL

risk: ANALYZE

purpose: >
  Checks ductwork or pipework already built is still joined end to end, and
  reports where it is not.

# The words Ajmal actually says, not the words the technique is named after.
utterances:
  - is the ductwork still connected
  - check the connections
  - did anything come apart
  - check the system is complete

# CAPABILITIES, never fragment ids. A fragment can be replaced, split or
# retired without this file changing - that is what the registry is for.
needs:
  - FILTER_ELEMENTS_BY_CATEGORY
  - TRACE_CONNECTIVITY
  # THE PURPOSE ABOVE PROMISES "reports where it is not [joined]" AND NOTHING
  # HERE COULD DO IT. TRACE_CONNECTIVITY walks outward from ONE element, so it
  # answers "what does this reach" and cannot sweep a category for loose ends.
  # Added 2026-09-19 after tools/check-skill-routing.py measured this skill at
  # 1 of 4: "did anything come apart" resolved to UNGROUP_ELEMENTS, a MODIFY
  # that takes things apart in reply to a question about whether they already
  # had (FRAGMENT-ISSUES row 133). SELECT_BY_CONNECTION_STATUS is the read that
  # sentence deserves - FRG-MEP-033 already declares "find the loose ends" and
  # "which ducts are not joined up" - and the skill had never claimed it.
  - SELECT_BY_CONNECTION_STATUS
  - REPORT_FINDINGS

# What must be true BEFORE it runs, so it fails early with something
# useful instead of deep inside a transaction (docs/09 s2).
preconditions:
  - a document is open
  - the system being checked has at least two elements

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]

note: >
  Connector.IsConnected describes intent and has been proven wrong on real
  models. A connectivity answer that rests only on that flag is a guess wearing a
  number - check geometry as a second route.

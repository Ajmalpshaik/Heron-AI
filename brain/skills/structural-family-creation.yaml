id: structural-family-creation
name: Build a parametric structural framing or structural column family
domain: revit.families
# Heron wrote this one. D-66: a unit that ships with Heron says where it
# came from, so an IMPORTED one that says nothing stands out.
source: OFFICIAL

risk: MODIFY

# THE SHAPE OF THIS METHOD (2026-11-28): the owner's family creation
# standard, as family-creation carries it - objective, when to use it, the
# stages of family-creation in their order, the always/never rules and the
# report. Shared stages are POINTED AT, never copied: "family-creation Stage
# N" is heron_method(job="family-creation", stage=N). Every rule the six-step
# method this replaced held is under the stage it belongs to (the pull
# request lists each). The research every step rests on is docs/43 §7.
purpose: |
  STRUCTURAL FAMILY CREATION - a STRUCTURAL FRAMING family, a beam or a brace
  of any section, or a STRUCTURAL COLUMN. The owner's family creation standard
  (Ajmal PS, 2026-11-28), with what a structural family adds.

  HOW TO READ IT. This method keeps family-creation's stages, in their order,
  and says only what a structural family adds. "family-creation Stage N" is
  served by heron_method(job="family-creation", stage=N): follow that stage
  there, then what is written here. family-creation's behaviour rules and its
  report (its sections 5 and 6) come with its summary, heron_method(job=
  "family-creation"), and hold here. "-> CAPABILITY (STATUS)" after a step is
  the Heron capability that does it and its card's status when this was
  written; the list of uses served after this method gives each one's status
  now, and that list wins. Four named here are not in that list, so this
  method is not offered beside ordinary placing, saving, reading and freeform
  requests: CREATE_FAMILY_FREEFORM_SOLID, PLACE_LINE_BASED_FAMILY,
  REPORT_PARAMETER_INVENTORY and SAVE_DOCUMENT - each stage served gives their
  status too. "-> no Heron tool yet:" is a step Heron cannot do: it says what
  the modeller does by hand. A DRAFT capability that CHANGES the model is
  refused by revit_change until it is proved (D-117); a DRAFT READ runs
  through revit_read and says DRAFT - confirm what matters another way.

  ITS OWN STAGES ARE SERVED IN PARTS:
  heron_method(job="structural-family-creation") lists them, and a stage of
  this method is asked by its part's id - "1-5" for Stages 1 to 5, "10-13" for
  Stages 10 to 13.

  OLD STEPS. Before 2026-11-28 this method had steps 0 to 6, and other files
  still name them: step 0 is Stage 0 items 1 to 3; step 1 is Stage 0 item 4
  and Stage 1 item 1; step 2 is Stage 1 items 2 and 3; step 3 is Stage 2;
  step 4 is Stages 3 and 5; step 5 is Stage 1 item 4 and Stage 9; step 6 is
  Stages 10 to 12.


  1. OBJECTIVE

  A beam or brace that stretches between whatever it is placed between and
  reads its Cut Length, or a column that follows its base and top levels -
  its section from the sizes the modeller gives, its structural material
  set. Never guess a section or a material; never call it done before the
  checks.


  2. WHEN TO USE - AND WHEN NOT

  Use it for a family started from the structural framing or structural
  column template.
  Not for:
    * a column made from a Generic Model - it does not get the column's two
      levels (Stage 0 item 1), so a column always starts from the column
      template;
    * any other structural template - family-creation's stages, and say
      so;
    * a non-structural line-based family - line-based-family-creation.


  3. WORKFLOW

  STAGE 0 - INFORMATION AND PREPARATION
  family-creation Stage 0 holds. A structural family adds:
  1. Read the template.
     -> REPORT_FAMILY_TEMPLATE (PROVEN). The file comes as family-creation
        Stage 0 item 1 says.
     * A FRAMING template carries Left and Right planes - the location line's
       ends, which the placement drives - and Member Left and Member Right,
       the geometry's ends, with a SAMPLE extrusion already locked to them.
     * A COLUMN template carries a lower and an upper reference level -
       `Lower Ref. Level` and `Upper Ref. Level` in Metric Column.rft - so a
       work plane is `Lower Ref. Level`, never `Ref. Level`, which is refused
       there (issue #1044). A Generic Model changed to a column category does
       NOT get them.
  2. Check the units - family-creation Stage 0 item 3, which holds.
     -> REPORT_FAMILY_TEMPLATE (PROVEN), its units line; SET_PROJECT_UNITS
        (PROVEN, Admin); REPORT_PROJECT_UNITS (DRAFT). IMPERIAL where the
        modeller works in millimetres is said BEFORE anything is built.
  3. Keep the template's planes and levels as it made them.
     -> REPORT_FAMILY_TEMPLATE (PROVEN), read again before the first write.
  4. Read the thing, into family-creation's one list.
     -> no Heron tool: asked once - the section and its sizes, usually a
        manufacturer's table, and the material. A picture gives shape, never
        size (D-33).
  GATE: the modeller confirms the list.

  STAGES 1 TO 5 - CONFIGURATION, FRAMEWORK, GEOMETRY, STYLES, CONTROL

  STAGE 1 - FAMILY CONFIGURATION
  family-creation Stage 1 holds. A structural family adds:
  1. Confirm the OmniClass Number - family-creation Stage 1 item 3, which
     holds.
     -> REPORT_FAMILY_TEMPLATE (PROVEN), its classificationCodes line, run
        again after any category change; SET_FAMILY_SETTINGS (PROVEN)
        "OmniClass Number=<code>" once the modeller confirms it - never
        guessed (D-33).
  2. The section's parameters, as TYPE lengths - depth, width, web and
     flange thickness.
     -> REPORT_SHARED_PARAMETER_FILE (PROVEN) first; ADD_FAMILY_PARAMETERS
        (PROVEN, Admin); SET_FAMILY_TYPE_VALUES (PROVEN), every value before
        any label.
  3. A whole steel range.
     -> WRITE_FAMILY_SIZE_TABLE (PROVEN) from the modeller's CSV, with
        SET_FAMILY_FORMULA (PROVEN) size_lookup for each size; or one type per
        line of a type catalogue (REPORT_FAMILY_TYPE_CATALOG (PROVEN), Stage
        13).
  4. The structural settings.
     -> SET_FAMILY_SETTINGS (PROVEN): "Material for Model Behavior=Steel" (or
        Concrete, Precast Concrete, Wood, Other) - steel and wood get cutback
        and shape handles, concrete auto-joins - and "Section Shape=..." from
        Revit's own list.
     * Symbolic Representation: no Heron tool yet - its built-in parameter
       exists, but no source gave the values it stores (docs/43 §11); the
       modeller sets it in Family Category and Parameters.
     * Analytical settings are the project's, from Revit 2023.

  STAGE 2 - REFERENCE FRAMEWORK
  family-creation Stage 2 holds. A structural family adds:
  1. Planes for the section, in the view that sees it - the Left elevation for
     a beam, the plan for a column.
     -> CREATE_REFERENCE_PLANES (PROVEN); SET_FAMILY_PLANE_REFERENCE (PROVEN),
        the owner's gray rule for every plane the build adds;
        LABEL_FAMILY_DIMENSION (PROVEN) for each size.

  STAGE 3 - GEOMETRY CREATION
  family-creation Stage 3 holds, group by group. A structural family adds:
  1. A BEAM'S SECTION - a NEW extrusion, because Heron cannot edit the
     sample's sketch.
     -> CREATE_FAMILY_FORMS (PROVEN): a kind=extrusion row on a plane facing
        left or right (the section in Y,Z), locked in Stage 5.
  2. The template's SAMPLE extrusion, once the new section reads back.
     -> REPORT_FAMILY_FORMS (PROVEN) for its id; DELETE_ELEMENTS (PROVEN) on
        the modeller's yes for that delete (Constitution 7).
  3. A COLUMN.
     -> EXTRUDE_BETWEEN_PLANES (PROVEN), or a CREATE_FAMILY_FORMS (PROVEN)
        extrusion in plan, sketched on `Lower Ref. Level`.
     * A REVOLVE DRAWN ABOVE THE UPPER REF. LEVEL RIDES UP WITH THAT LEVEL
       when the column is placed taller - Revit's behaviour, not Heron's,
       shown 2026-11-20 on Revit 2020 (row 5b-1876, issue #1044): a ring at Z
       13500 to 13700, Upper Ref. Level at 4000, floated 9700 mm above a
       column placed 13700 mm tall, while an extrusion at the same height on
       Lower Ref. Level stayed.
     * So draw a capital, a ring or a cap as an extrusion or sweep sketched on
       Lower Ref. Level, or as CREATE_FAMILY_FREEFORM_SOLID (PROVEN) shapes,
       or have the modeller move Upper Ref. Level by hand to the real height
       first (family-creation Stage 3 D item 13 has the whole of it).

  STAGE 4 - OBJECT STYLES AND SUBCATEGORIES
  family-creation Stage 4, unchanged.
     -> SET_FAMILY_FORM_SUBCATEGORY (PROVEN).

  STAGE 5 - DIMENSIONS AND PARAMETRIC CONTROL
  family-creation Stage 5 holds. A structural family adds:
  1. A beam: both end faces locked to Member Left and Member Right, its sides
     to the section planes.
     -> LOCK_FORM_TO_PLANES (PROVEN).
  2. A column: its bottom face locked to the lower reference level and its top
     to the upper one, so Base and Top Level drive the height.
     -> LOCK_FORM_TO_PLANES (PROVEN). A part MEANT to follow the top is locked
        to Upper Ref. Level on purpose.
  3. A round section.
     -> LABEL_FAMILY_RADIUS (PROVEN); LINK_FAMILY_PARAMETER (PROVEN) for a
        form's own field.

  STAGE 6 - VOIDS AND ARRAYS
  family-creation Stage 6, unchanged: COMBINE_FAMILY_FORMS (PROVEN),
  ARRAY_FAMILY_FORMS (PROVEN).

  STAGES 7 TO 9 - CONNECTORS, NESTED FAMILIES, MATERIALS AND GRAPHICS

  STAGE 7 - MEP CONNECTORS
  family-creation Stage 7, unchanged, where it applies: ADD_FAMILY_CONNECTOR
  (PROVEN).

  STAGE 8 - NESTED FAMILIES
  family-creation Stage 8, unchanged: PLACE_FAMILY_INSTANCES (PROVEN),
  LOCK_NESTED_FAMILY_TO_PLANES (PROVEN), ADD_FAMILY_TYPE_PARAMETER (DRAFT -
  refused by revit_change until proved; try it once, or the modeller makes
  the Family Type parameter by hand).

  STAGE 9 - MATERIALS AND GRAPHICS
  family-creation Stage 9 holds. A structural family adds:
  1. Its material, as a parameter a project sets.
     -> LINK_FAMILY_PARAMETER (PROVEN), links Material=<material parameter>.
  2. The 3D form where it should not show at Coarse.
     -> SET_FAMILY_FORM_VISIBILITY (PROVEN); DRAW_FAMILY_SYMBOLIC_LINES
        (PROVEN), DRAW_FAMILY_FILLED_REGION (PROVEN) for a symbol;
        ADD_FAMILY_FLIP_CONTROL (PROVEN) where it must flip once placed.

  STAGES 10 TO 13 - VERIFICATION, FLEX, PROJECT TEST, SAVE

  STAGE 10 - FAMILY VERIFICATION
  family-creation Stage 10 holds, all of it.
     -> REPORT_FAMILY_FORMS (PROVEN): the new section between Member Left and
        Member Right and the sample gone, or the column between its levels.

  STAGE 11 - FLEX TESTING
  family-creation Stage 11 holds.
     -> FLEX_FAMILY (PROVEN), at the smallest and largest sections.

  STAGE 12 - PROJECT TESTING
  family-creation Stage 12 holds.
  1. Load it into a scratch test project.
     -> LOAD_FAMILY (PROVEN), with the saved .rfa's path.
  2. A beam placed between two supports must stretch with them and read its
     Cut Length.
     -> PLACE_LINE_BASED_FAMILY (PROVEN), its structural type - beam or brace
        - asked for and never assumed; Cut Length read with
        REPORT_PARAMETER_INVENTORY as family-creation Stage 12 item 7.
  3. A column placed between two levels must follow both.
     -> PLACE_FAMILY_INSTANCES (PROVEN), structuralType column, on its base
        level with `topLevelName` its top level; or the modeller places it by
        hand.
     -> moving a level and watching the column follow: no Heron tool yet -
        the modeller does it and says what was seen.

  STAGE 13 - FINAL SAVE AND DELIVERY
  family-creation Stage 13 holds, its SAVE RULE above all: SAVE_DOCUMENT
  (PROVEN, Publish), then the file's time checked. A steel range in one
  family: REPORT_FAMILY_TYPE_CATALOG (PROVEN).


  4. ALWAYS / NEVER

  Always:
    * Start a column from the column template, and sketch on Lower Ref.
      Level.
    * Build a beam's section as a new extrusion locked to Member Left and
      Member Right.
    * Ask the structural material and the section; never assume them.
  Never:
    * Delete the template's sample before the new section reads back, or
      without the modeller's yes.
    * Draw a revolve above Upper Ref. Level and expect it to stay.
    * Call it done before family-creation Stages 10 to 13.
  SET BY HAND IN FAMILY CATEGORY AND PARAMETERS: Symbolic Representation
  (Stage 1 item 4).


  5. REPORT TO THE MODELLER

  After each stage, one or two lines: what was completed, what was verified,
  what remains. The final report is family-creation's (its section 6), and
  adds: the section and range, the structural material, whether the sample
  was deleted, and how the member followed its supports or levels in the
  test project. Report COMPLETED only when every check has passed; otherwise
  PARTIALLY COMPLETED, naming what is left and who does it, or FAILED with
  the reason.


  6. CORE PRINCIPLE

  MODEL -> VERIFY -> REPORT -> CONTINUE. Never sacrifice accuracy for speed,
  and never take a decision that is the modeller's.

# HOW heron_method SERVES THE PURPOSE ABOVE - a summary first, then one part
# at a time, as family-creation is served (the owner's choice, 2026-11-28):
# whole, with its uses, it is over 12,000 characters. The short stages are
# served together - "1-5" is Stages 1 to 5 - so a build asks five parts of
# this method rather than fourteen. Each entry names the purpose line its
# part starts at, exactly as written; an entry with no `stage` goes back into
# the summary. heron_skill.validate refuses a line missing, written twice or
# out of order.
stages:
  - {stage: "0", starts: "STAGE 0 - INFORMATION AND PREPARATION"}
  - {stage: "1-5", starts: "STAGES 1 TO 5 - CONFIGURATION, FRAMEWORK, GEOMETRY, STYLES, CONTROL"}
  - {stage: "6", starts: "STAGE 6 - VOIDS AND ARRAYS"}
  - {stage: "7-9", starts: "STAGES 7 TO 9 - CONNECTORS, NESTED FAMILIES, MATERIALS AND GRAPHICS"}
  - {stage: "10-13", starts: "STAGES 10 TO 13 - VERIFICATION, FLEX, PROJECT TEST, SAVE"}
  - {starts: "4. ALWAYS / NEVER"}

utterances:
  - make a structural beam family with a custom section
  - build a steel column family
  - create a structural framing family for a brace
  - make a parametric precast beam family

needs:
  - REPORT_FAMILY_TEMPLATE
  # Stage 0's units check, as family-creation's.
  - REPORT_PROJECT_UNITS
  - SET_PROJECT_UNITS
  - ADD_FAMILY_PARAMETERS
  - SET_FAMILY_TYPE_VALUES
  - WRITE_FAMILY_SIZE_TABLE
  - SET_FAMILY_FORMULA
  - REPORT_FAMILY_TYPE_CATALOG
  - CREATE_REFERENCE_PLANES
  - LABEL_FAMILY_DIMENSION
  - CREATE_FAMILY_FORMS
  - EXTRUDE_BETWEEN_PLANES
  - LOCK_FORM_TO_PLANES
  - DELETE_ELEMENTS
  - SET_FAMILY_SETTINGS
  # SET_FAMILY_FORM_MATERIAL was listed here until 2026-11-01, when it was merged into LINK_FAMILY_PARAMETER.
  - SET_FAMILY_FORM_VISIBILITY
  - REPORT_FAMILY_FORMS
  # family-creation's stages, which this method says still hold.
  # SET_FAMILY_CATEGORY was listed here until 2026-11-01, when it was merged into SET_FAMILY_SETTINGS.
  # family-creation Stage 1 item 4 reads first: the shared parameter file and its
  # GUIDs, against the family, before ADD_FAMILY_PARAMETERS' shared kind writes.
  - REPORT_SHARED_PARAMETER_FILE
  # ADD_FAMILY_SHARED_PARAMETERS was listed here until 2026-11-01, when it was merged into ADD_FAMILY_PARAMETERS.
  - SET_FAMILY_PLANE_REFERENCE
  # CREATE_FAMILY_REVOLUTION was listed here until 2026-11-01, when it was merged into CREATE_FAMILY_FORMS.
  # CREATE_FAMILY_BLEND was listed here until 2026-11-01, when it was merged into CREATE_FAMILY_FORMS.
  # CREATE_FAMILY_SWEEP was listed here until 2026-11-01, when it was merged into CREATE_FAMILY_FORMS.
  # CREATE_FAMILY_SWEPT_BLEND was listed here until 2026-11-01, when it was merged into CREATE_FAMILY_FORMS.
  # LINK_FAMILY_FORM_PARAMETER was listed here until 2026-11-01, when it was merged into LINK_FAMILY_PARAMETER.
  - LABEL_FAMILY_RADIUS
  - COMBINE_FAMILY_FORMS
  - ARRAY_FAMILY_FORMS
  - ADD_FAMILY_CONNECTOR
  # PLACE_NESTED_FAMILY was listed here until 2026-11-01, when it was merged into PLACE_FAMILY_INSTANCES.
  - PLACE_FAMILY_INSTANCES
  - LOCK_NESTED_FAMILY_TO_PLANES
  # LINK_NESTED_TYPE_PARAMETER was listed here until 2026-11-01, when it was merged into LINK_FAMILY_PARAMETER.
  - ADD_FAMILY_TYPE_PARAMETER
  - LINK_FAMILY_PARAMETER
  - SET_FAMILY_FORM_SUBCATEGORY
  - DRAW_FAMILY_SYMBOLIC_LINES
  - DRAW_FAMILY_FILLED_REGION
  - ADD_FAMILY_FLIP_CONTROL
  # The proof, and never skipped.
  - FLEX_FAMILY
  - LOAD_FAMILY

preconditions:
  - a family document is open in the Family Editor, started by the modeller from a structural framing or structural column template - or made by CREATE_FAMILY_DOCUMENT from the template and the .rfa path the modeller names; Heron never picks a template or a path itself
  - the section, its sizes and its material have been given for THIS request
  - a step whose capability is DRAFT - the list of uses served beside this method says which - is refused by revit_change when it CHANGES the model (D-117), and can be tried once only on a family saved first, kept only if the modeller presses Keep (D-119, D-121); a DRAFT READ runs and says DRAFT, so confirm what matters another way

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]

note: >
  Written 2026-10-02 when the owner asked for everything to be checked again
  and docs/43 §1 still said structural framing was not covered, from the
  research recorded in docs/43 §7. On 2026-11-28 it was rebuilt on the
  owner's family creation standard: family-creation's stages in their order,
  each pointed at rather than copied, the Heron capability and its status
  under every step, every earlier rule under the stage it belongs to, and
  the template sample's delete made the modeller's yes (Constitution 7).
  Every step is DRAFT until it has been run on a real family with a negative
  case (D-30).

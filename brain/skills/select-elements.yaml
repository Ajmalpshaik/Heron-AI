heron-status: DRAFT
heron-step: 14
heron-since: 0.1.0
heron-layer: brain

id: select-elements
name: Show me these on screen
domain: revit.selection
risk: EXECUTE

purpose: >
  Puts what was found into the current selection, so it can be seen rather than
  described. The fastest way to check an answer is right is to look at it.

# The words Ajmal actually says, not the words the technique is named after.
utterances:
  - select all the ducts
  - highlight them
  - show me the ones you found
  - select the 300x300 dampers

# CAPABILITIES, never fragment ids. A fragment can be replaced, split or
# retired without this file changing - that is what the registry is for.
needs:
  - FILTER_ELEMENTS_BY_CATEGORY
  - SET_SELECTION

# What must be true BEFORE it runs, so it fails early with something
# useful instead of deep inside a transaction (docs/09 s2).
preconditions:
  - a document is open in the user interface, not a background document

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]

heron-status: DRAFT
heron-step: 14
heron-since: 0.1.0
heron-layer: brain

id: space-airflow
name: Work out the airflow for this room
domain: revit.hvac
# Heron wrote this one. D-66: a unit that ships with Heron says where it
# came from, so an IMPORTED one that says nothing stands out.
source: OFFICIAL

risk: MODIFY

purpose: >
  Calculates a Space's required airflow and writes it back. Every number is a
  per-request input - never a remembered default.

# The words Ajmal actually says, not the words the technique is named after.
utterances:
  - work out the airflow for this room
  - calculate the air for these spaces
  - set the supply air flow
  - how much air does this room need

# CAPABILITIES, never fragment ids. A fragment can be replaced, split or
# retired without this file changing - that is what the registry is for.
needs:
  - FILTER_ELEMENTS_BY_CATEGORY
  - READ_ELEMENT_PARAMETERS
  - WRITE_ELEMENT_PARAMETERS
  # MEASURED AT 0 OF 4. The purpose is working out the air a space needs, and a
  # space's heating and cooling loads are what that calculation is FROM -
  # FRG-MEP-011 reports them, and says for each figure whether Revit calculated
  # it or somebody typed it in, which is the difference between a design figure
  # and a guess. READ_ELEMENT_PARAMETERS cannot stand in for it.
  - READ_SPACE_LOADS

# What must be true BEFORE it runs, so it fails early with something
# useful instead of deep inside a transaction (docs/09 s2).
preconditions:
  - Spaces exist and are bounded - an unbounded Space has no volume to work from
  - the air change rate or load basis has been confirmed for THIS request

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]

note: >
  Ajmal speaks in mm and in air changes; Revit stores internal units. The
  conversion is explicit both ways, and the reply is in his units.

id: profile-family-creation
name: Build a parametric profile family, and use it in a sweep
domain: revit.families
# Heron wrote this one. D-66: a unit that ships with Heron says where it
# came from, so an IMPORTED one that says nothing stands out.
source: OFFICIAL

risk: MODIFY

purpose: >
  Builds a PROFILE family - the closed 2D shape a sweep, a wall sweep, a
  reveal, a slab edge, a fascia, a gutter, a railing, a stair nosing or a
  mullion is drawn with - makes it resize from its parameters, and puts it to
  work in another family's sweep. Made from a Profile template, drawn in its
  one plan view.

  0. REPORT_FAMILY_TEMPLATE FIRST - confirm a profile (the Profiles category);
     read its view, as Ref. Level in the templates read so far, and its planes.
  1. READ THE THING: the section's shape and which of its sizes change
     between types.
  2. SET_FAMILY_SETTINGS "Profile Usage=..." - where Revit offers the
     profile: Wall Sweep, Reveal, Slab Edge, Fascia, Gutter, Railing, Stair
     Nosing, Mullion and the rest; Generic (Any) is offered everywhere.
  3. The sizes as parameters, their values FIRST, then formulas -
     FAMILY-CREATION steps 2 to 4.
  4. CREATE_REFERENCE_PLANES on every edge a size moves, then
     LABEL_FAMILY_DIMENSION between them. Whether that tool, written for a 3D
     family's plan and elevation, labels a profile's two directions in its
     one plan is NEEDS-CHECKING BV11.
  5. DRAW_FAMILY_DETAIL_LINES with lockToPlanes true. EVERY LINE IN A PROFILE
     FAMILY IS THE PROFILE: closed loops only, not crossing, a loop inside
     another a hole - no construction lines, which would become part of it.
  6. FLEX_FAMILY at two really different sizes.
  7. TO USE IT: LOAD_FAMILY into the family that sweeps it, sweep the path with
     CREATE_FAMILY_SWEEP, then SET_FAMILY_SWEEP_PROFILE to draw that sweep with
     the loaded profile; ADD_FAMILY_TYPE_PARAMETER of the Profiles category,
     naming the sweep, lets each type choose its profile. In a project the
     profile is chosen in the wall sweep's, railing's or mullion's own type.

utterances:
  - make a profile family
  - build a parametric handrail profile family
  - make a mullion profile family
  - create a wall sweep profile that resizes from its parameters

needs:
  - REPORT_FAMILY_TEMPLATE
  - SET_FAMILY_SETTINGS
  - ADD_FAMILY_PARAMETERS
  - SET_FAMILY_TYPE_VALUES
  - SET_FAMILY_FORMULA
  - CREATE_REFERENCE_PLANES
  - SET_FAMILY_PLANE_REFERENCE
  - LABEL_FAMILY_DIMENSION
  - DRAW_FAMILY_DETAIL_LINES
  # The proof, and never skipped.
  - FLEX_FAMILY
  - LOAD_FAMILY
  - CREATE_FAMILY_SWEEP
  - SET_FAMILY_SWEEP_PROFILE
  - ADD_FAMILY_TYPE_PARAMETER

preconditions:
  - a family document is open in the Family Editor, started by the modeller from a Profile template - Heron does not choose a template
  - the section's shape, every size, parameter name and type name have been given for THIS request

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]

note: >
  Written 2026-10-02 on the owner's request for every kind of family
  creation, from the research recorded in docs/43-building-revit-families.md.
  Every step is DRAFT until it has been run on a real family with a negative
  case (D-30).

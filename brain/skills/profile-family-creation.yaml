id: profile-family-creation
name: Build a parametric profile family, and use it in a sweep
domain: revit.families
# Heron wrote this one. D-66: a unit that ships with Heron says where it
# came from, so an IMPORTED one that says nothing stands out.
source: OFFICIAL

risk: MODIFY

# THE SHAPE OF THIS METHOD (2026-11-28): the owner's family creation standard,
# as family-creation carries it - objective, when to use it, stages of numbered
# steps with the Heron capability and its card's status after each, verify,
# report, always and never. A stage the two share is POINTED to, never copied.
# Every rule of the eight-step method this replaced is kept under the step it
# belongs to, or corrected by its card (the pull request lists each).
purpose: |
  PROFILE FAMILY CREATION - the owner's family creation standard (Ajmal PS,
  2026-11-28) for a profile, with the Heron tool for every step under it.

  HOW TO READ IT. family-creation's rules hold here wherever they fit; this
  method says what a profile does differently and POINTS to a shared stage -
  heron_method(job="family-creation", stage="2") serves its Stage 2 - rather
  than copying it. "-> CAPABILITY (STATUS)" is the Heron capability for the
  step and its card's status on 2026-11-28; the list served after this method
  gives each one's status now, and it wins - except CREATE_FAMILY_DOCUMENT,
  ACTIVATE_DOCUMENT, SAVE_DOCUMENT and REPORT_OPEN_DOCUMENTS, left out of
  that list so this method is not offered
  beside ordinary requests: heron_resolve gives theirs. "-> no Heron tool
  yet:" is done by hand, or asked. revit_change refuses a DRAFT that changes
  the model (D-117); a DRAFT read runs and says DRAFT, so confirm what
  matters another way. Each Heron change is one undo entry.


  1. OBJECTIVE

  A PROFILE family - the closed 2D shape a sweep, a wall sweep, a reveal, a
  slab edge, a fascia, a gutter, a railing, a stair nosing or a mullion is
  drawn with - that resizes from its parameters, is seen following them, and
  is put to work in another family's sweep. Made from a Profile template,
  drawn in its one plan view: no solids, no connectors - family-creation's
  Stages 3, 6, 7 and 8 do not apply.


  2. WHEN TO USE IT - AND WHEN NOT

  For any profile. A detail item or a symbol drawn in a view:
  DETAIL-FAMILY-CREATION. A sweep with a sketched profile and no profile
  family: family-creation Stage 3 D item 12.


  3. WORKFLOW

  STAGE 0 - INFORMATION AND PREPARATION
  1. The family file, and what it is.
     -> CREATE_FAMILY_DOCUMENT (PROVEN, Admin) with the Profile template the
        modeller NAMES and the .rfa path the modeller NAMES, or the modeller
        starts it; Heron never picks either (D-33). Then ACTIVATE_DOCUMENT
        (PROVEN) and revit_use_this_model (family-creation Stage 0 item 1).
     -> REPORT_FAMILY_TEMPLATE (PROVEN): it must read as a profile (the
        Profiles category); its view, as Ref. Level in the templates read so
        far, and its planes.
  2. Check the units.
     -> family-creation Stage 0 item 3: REPORT_FAMILY_TEMPLATE's units line,
        or REPORT_PROJECT_UNITS (DRAFT, a read) where it has none. IMPERIAL
        where the modeller works in millimetres is said before anything is
        built, with SET_PROJECT_UNITS (PROVEN, Admin) or the Metric template
        offered.
  3. READ THE THING, in ONE list said back to the modeller: the section's
     shape, which of its sizes change between types (they become
     parameters), the parameter and type names, where Revit should offer it,
     and the family it will be swept in.
     -> no Heron tool: asked; nothing guessed (D-33).
  4. A family with no file is saved before the first write: family-creation
     Stage 0 item 5 (SAVE_DOCUMENT, PROVEN, Publish).
  GATE: the modeller confirms the list.

  STAGE 1 - FAMILY CONFIGURATION
  1. Where Revit offers the profile.
     -> SET_FAMILY_SETTINGS (PROVEN), "Profile Usage=..." - Wall Sweep,
        Reveal, Slab Edge, Fascia, Gutter, Railing, Stair Nosing, Mullion and
        the rest; Generic (Any) is offered everywhere.
  2. The sizes as parameters, their values FIRST, then formulas -
     family-creation Stage 1 items 4 to 14.
     -> REPORT_SHARED_PARAMETER_FILE (PROVEN) first, ADD_FAMILY_PARAMETERS
        (PROVEN, Admin), SET_FAMILY_TYPE_VALUES (PROVEN), SET_FAMILY_FORMULA
        (PROVEN).

  STAGE 2 - REFERENCE FRAMEWORK
  family-creation Stage 2 items 2 and 4 to 8, in the profile's one plan:
  -> CREATE_REFERENCE_PLANES (PROVEN) on every edge a size moves;
     SET_FAMILY_PLANE_REFERENCE (PROVEN), with the owner's plane colour rule;
     then LABEL_FAMILY_DIMENSION (PROVEN) between them. Whether that tool,
     written for a 3D family's plan and elevation, labels a profile's two
     directions in its one plan is NEEDS-CHECKING BV11: where it refuses, the
     modeller labels that dimension by hand.

  STAGE 3 - THE PROFILE
  -> DRAW_FAMILY_DETAIL_LINES (PROVEN) with lockToPlanes true.
  * EVERY LINE IN A PROFILE FAMILY IS THE PROFILE: closed loops only, not
    crossing, a loop inside another a hole - no construction lines, which
    would become part of it.
  Tell the modeller what is now in Revit.

  STAGE 4 - FAMILY VERIFICATION AND FLEX
  This stage is mandatory.
  1. Read back every line.
     -> REPORT_FAMILY_FORMS (PROVEN, version 7), which=2d: each line's ends in
        millimetres and what holds it - "locked along ...", "labelled ..." -
        against Stage 0's list: closed loops, every edge a size moves locked.
  2. LOOK AT IT: revit_view_image of the profile's view, a read (D-123).
     Whether that picture is taken in a 2D family's view is not on any card;
     where it is refused, the modeller looks.
  3. FLEX it at two really different sizes.
     -> FLEX_FAMILY (PROVEN): it measures every labelled dimension against its
        parameter, and solids, which a profile has none of - so it does NOT
        show that the lines followed. For that: SET_FAMILY_TYPE_VALUES
        (PROVEN) to the second size and REPORT_FAMILY_FORMS which=2d again -
        the ends where the planes now are; then the real values back.

  STAGE 5 - PUT TO WORK IN A SWEEP
  1. Save the profile first - a load reads the file.
     -> SAVE_DOCUMENT (PROVEN, version 4, Publish), as family-creation Stage
        13's SAVE RULE says; the modeller's Ctrl+S only where it is refused.
        Its file's time is checked on disk BEFORE the load - the card's
        proof saved another open document, not the family in front.
  2. Load it into the family that sweeps it.
     -> ACTIVATE_DOCUMENT (PROVEN) to that family, revit_use_this_model;
        LOAD_FAMILY (PROVEN, version 4) with the profile's path.
  3. The sweep, then its profile.
     -> CREATE_FAMILY_FORMS (PROVEN), a kind=sweep row along the path - it was
        CREATE_FAMILY_SWEEP until 2026-11-01; then SET_FAMILY_SWEEP_PROFILE
        (PROVEN), by the sweep's id from formIds, draws that sweep with the
        loaded profile.
  4. Each type choosing its profile.
     -> ADD_FAMILY_TYPE_PARAMETER (DRAFT) of the Profiles category, naming the
        sweep. Refused by revit_change until it is proved; as a MODIFY
        capability it can be tried once (try-once, the family saved first,
        kept only on Keep - D-119, D-121), or the modeller makes the Family
        Type parameter by hand.
  5. Check the sweep.
     -> REPORT_FAMILY_FORMS (PROVEN): the sweep's extent and volume; then
        revit_view_image with elements= its id.
  In a project the profile is chosen in the wall sweep's, railing's or
  mullion's own type - no family step.

  STAGE 6 - FINAL SAVE AND DELIVERY
  family-creation Stage 13 for the profile and for the family that sweeps it
  (ACTIVATE_DOCUMENT and revit_use_this_model to each): items 1 to 9 and its
  SAVE RULE - each save checked on disk: REPORT_OPEN_DOCUMENTS (DRAFT, a read)
  fileTimes, and because it is DRAFT the file's Date modified in File
  Explorer or the chat's own file tools too.


  4. RULES

  Always: set Profile Usage; values before labels; closed loops only, locked
  to their planes; look at the profile at two sizes; save before a load;
  check each save on disk.
  Never: draw a construction line in a profile; guess a size; take a flex
  that measured no lines as proof the lines followed; report a save not
  checked. A delete waits for the modeller's yes (Constitution 7); a change is
  taken back with Revit's own Undo, never with a second change.


  5. COMMUNICATION WITH THE MODELLER

  Short, plain, in Revit words: after each stage, what was done, checked and
  left. A step done by hand - a label, the Family Type parameter - is named
  with who did it. The final report (family-creation section 6) gives the
  profile's name and Profile Usage, its parameters, the two sizes seen, the
  sweep it drew and both saves checked on disk: COMPLETED only when every
  check passed, otherwise PARTIALLY COMPLETED or FAILED, with the reason.


  6. CORE PRINCIPLE

  MODEL -> VERIFY -> REPORT -> CONTINUE.

utterances:
  - make a profile family
  - build a parametric handrail profile family
  - make a mullion profile family
  - create a wall sweep profile that resizes from its parameters

needs:
  - REPORT_FAMILY_TEMPLATE
  # Stage 0's units check, as family-creation Stage 0 item 3.
  - REPORT_PROJECT_UNITS
  - SET_PROJECT_UNITS
  - SET_FAMILY_SETTINGS
  - ADD_FAMILY_PARAMETERS
  - SET_FAMILY_TYPE_VALUES
  - SET_FAMILY_FORMULA
  - CREATE_REFERENCE_PLANES
  - SET_FAMILY_PLANE_REFERENCE
  - LABEL_FAMILY_DIMENSION
  - DRAW_FAMILY_DETAIL_LINES
  # family-creation Stage 1 item 4 reads first: the shared parameter file and
  # its GUIDs, against the family, before ADD_FAMILY_PARAMETERS' shared kind writes.
  - REPORT_SHARED_PARAMETER_FILE
  # ADD_FAMILY_SHARED_PARAMETERS was listed here until 2026-11-01, when it was merged into ADD_FAMILY_PARAMETERS.
  # Stage 4's flex, never skipped - it measures the labelled dimensions; the
  # lines are read back with REPORT_FAMILY_FORMS which=2d at the second size.
  - FLEX_FAMILY
  - LOAD_FAMILY
  # CREATE_FAMILY_SWEEP was listed here until 2026-11-01, when it was merged into CREATE_FAMILY_FORMS.
  - CREATE_FAMILY_FORMS
  - SET_FAMILY_SWEEP_PROFILE
  - ADD_FAMILY_TYPE_PARAMETER
  # Added 2026-11-28 with the owner's standard: Stage 4 reads the profile's
  # lines back (which=2d), Stage 5 the sweep. Measured: no routing sentence moved.
  - REPORT_FAMILY_FORMS

preconditions:
  - a family document is open in the Family Editor, started from a Profile template - by the modeller, or by CREATE_FAMILY_DOCUMENT with the template the modeller named; Heron does not choose a template
  - the section's shape, every size, parameter name and type name have been given for THIS request


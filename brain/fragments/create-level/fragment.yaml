id: FRG-ELE-022
semantic-identity: "add a new level at this height"
kind: action
domain: revit.levels
capability: CREATE_LEVEL
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Creates one level at a given height and names it.

  **What it makes is the datum and nothing else** - see the note below the
  contract, which is the thing people get caught by and is deliberately not
  repeated here in the words CREATE_PLAN_VIEW needs to be found by.

  **The height is measured the way the level heads read**, from the project's
  elevation base, so a level asked for at 4500 shows 4500 on the drawing. The
  API's own property is measured from the internal origin instead, and the two
  differ the moment somebody moves the base point - see LIST_LEVELS, which
  reports both.

contract:
  needs:
    - name: doc
      type: Document
    - name: elevationMm
      type: double
      source: request
    - name: levelName
      type: string
      source: request
  provides:
    - name: created
      role: result
      type: ElementId
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string
    - name: noViewsMade
      # That no plan views were made, which is this fragment stating what it
      # deliberately does NOT do. Never a thing it created (D-52).
      role: accounting
      type: bool


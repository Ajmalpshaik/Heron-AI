compatibility-note: >
  One implementation for every release. The view-scoped
  `FilteredElementCollector(Document, ElementId)` constructor and
  `View.IsTemplate` are present 2020 through 2027, compiled at both ends.
  Categories are handed to `ElementMulticategoryFilter` as BuiltInCategory
  values rather than as ElementIds built from them.

# ROUTING - repeated in DIAGNOSE_VISIBILITY, FIND_VIEWS_SHOWING_ELEMENT and
# COUNT_ELEMENTS.
#
#   "what is showing on this view"   -> here
#   "count what is on this drawing"  -> here, then COUNT_ELEMENTS
#   "tag everything visible here"    -> A SKILL. It is this fragment and then
#                                       TAG_ELEMENTS_IN_VIEW, and a
#                                       composition is a skill's job -
#                                       TAG_ELEMENTS_IN_VIEW answers it today
#                                       and does the visible half itself
#   "why can't I see this duct"      -> DIAGNOSE_VISIBILITY - one element, one
#                                       view, and which mechanism hid it. This
#                                       fragment gives a set and no reasons
#   "which views show this element"  -> FIND_VIEWS_SHOWING_ELEMENT - the same
#                                       question from the other end
#   "how many ducts are there"       -> FILTER_ELEMENTS_BY_CATEGORY. That is
#                                       the MODEL's answer, and it is a
#                                       different number from this one

utterances:
  - what is showing on this view
  - select everything visible in this view
  - what will this drawing actually show
  - find the elements visible in a view
  - count what is on this drawing

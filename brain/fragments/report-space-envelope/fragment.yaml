id: FRG-MEP-058
semantic-identity: "every MEP Space's walls, roofs, floors and windows - areas, facing and thermal values - for a load calculation"
kind: filter
domain: revit.mep
capability: REPORT_SPACE_ENVELOPE
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Reads the take-off a building's heating and cooling loads are calculated
  from (docs/44 section 4): every MEP Space in the model - its number, name,
  level, zone, Space Type, floor area, volume and height - and every face that
  bounds it, from Revit's own spatial geometry: whether it is a wall, the top
  or the bottom, its area, the way it faces (its outward direction, which the
  brain turns to true north), what is on the other side - outside, another
  Space, an unconditioned space - and the windows, doors and curtain panels in
  it with their sizes.

  **For each type met it gives the thermal values Revit holds** - U-value, and
  for glass the SHGC - and a value Revit does not hold is reported missing,
  never 0. A window with no SHGC read as 0 loses all its sun without a word;
  the brain refuses that Space and names the type instead.

  **Once per model:** the site's latitude, longitude, time zone and elevation,
  the True North angle, and the units the model shows loads and airflow in -
  so the values written back later are in the model's own units.

  **It calculates nothing.** The loads are worked out by Heron's HVAC engine
  (heron_building_loads), never here.

  **Every Space, not the selection.** The question is about the whole building,
  and nothing is usually selected when it is asked.

  **Every face's outline, and where each window and door sits** - in metres,
  in the model's own coordinates - so the Companion's 3D view draws the very
  faces the loads were worked out from, for the modeller to check before
  anything is written back (docs/44 section 12).

  **Linked walls only when asked for (D-59).** In a federated model the walls
  are in the architect's link; with includeLinks set they are read from it,
  their types keyed by the link they come from. Otherwise such a face is
  "unknown" beyond, and a finding says the links were not read.

  **Why one string.** A fragment's list output reaches the caller as its first
  three names (FRAGMENT-ISSUES 5b-195), and a take-off needs every face. So it
  crosses as one JSON string, `takeoffJson`, format 1, as READ_ELEMENT_TABLE's
  table does.

# A NAME TWO PARAMETERS SHARE IS NEVER READ: a Space carrying two parameters
# named Space Type - a shared or project one bound beside Revit's own - has its
# space_type written as null, as for a Space with none, and a line in
# `findings` naming it, never either value (D-54 s3, FRAGMENT-ISSUES 5b-203;
# added 2026-10-09). Written here and not in `purpose`, as on
# check-sleeve-size's card: the purpose is embedded for routing, and on that
# card's change a purpose sentence about this moved other cards' utterances in
# check-routing, measured against d9b27f03 (row 5b-203's 2026-10-09 note). Not
# measured for this card.
contract:
  needs:
    - name: doc
      type: Document
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only. In
      # a federated MEP model the walls are in the architect's link: with this
      # set, a linked wall's type, function, windows and doors are read from
      # its link; without it that face reads beyond "unknown" with a finding.
      # `optional: true` lets it be left out - the binder binds an absent
      # optional bool to false (HeronBindingNote.AbsentValue, row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    # The whole take-off as one JSON string, format 1. ACCOUNTING, not a result:
    # it is written whatever was found - a document with no Spaces still gets
    # the format, units and site skeleton (found 2026-10-18 on Revit 2020, a
    # Generic Models family). `spaces` is the evidence (D-51).
    - name: takeoffJson
      role: accounting
      type: string
    # How many MEP Spaces were read, placed or not.
    - name: spaces
      role: result
      type: int
    # D-59: how many loaded linked models there were to read. includeLinks set
    # and this at 0 means "links were asked for and none is loaded".
    - name: linksSearched
      role: accounting
      type: int
    # A sentence per thing that could not be read - a linked boundary, an
    # opening with no size, no site location, and since 2026-10-09 a Space
    # Type two parameters share (D-54 s3, FRAGMENT-ISSUES 5b-203).
    - name: findings
      role: accounting
      type: IList<string>


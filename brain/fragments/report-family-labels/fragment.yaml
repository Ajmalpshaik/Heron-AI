compatibility-note: >
  TextElement's Coord, Width, BaseDirection, HorizontalAlignment,
  VerticalAlignment, KeepRotatedTextReadable and Text, Element.GetTypeId,
  GetValidTypes and GetParameterFormatOptions, FamilyManager.
  GetAssociatedFamilyParameter, Family.FamilyCategory and
  BuiltInParameter.IS_VISIBLE_PARAM read the same 2020 to 2027
  (tools/api-surface --members, all eight, 2026-10-21). TextElement's only
  public subclass is TextNote on 2020 to 2026, and TextNote and
  AnnotationLabel on 2027. AnnotationLabel, AnnotationLabelParameterFormatting
  (SampleText, Prefix, Suffix, LeadingSpaces, LeadingLineBreak,
  GetParameterDefinition) and FormatOptions.GetUnitTypeId / GetSymbolTypeId
  with LabelUtils.GetLabelForUnit / GetLabelForSymbol are read under
  #if REVIT2027_OR_GREATER - AnnotationLabel is in no earlier release.

# ROUTING - the same rows are in SET_FAMILY_LABEL_LAYOUT,
# COPY_LABELS_FROM_FAMILY and LABEL_FAMILY_DIMENSION.
#
#   "read the labels in this tag family"                    -> here
#   "which parameters does this label show"                 -> here (2027)
#   "what prefix and suffix are on the diameter label"      -> here (2027)
#   "move the diameter label 5 mm up"                       -> SET_FAMILY_LABEL_LAYOUT
#   "copy the labels from the seed pipe tag"                -> COPY_LABELS_FROM_FAMILY
#   "label this dimension with Width"                       -> LABEL_FAMILY_DIMENSION
#   "tag the pipes in this view"                            -> TAG_ELEMENTS_IN_VIEW

utterances:
  - read the labels in this tag family
  - which parameters does this label show and in what order
  - what is the sample value prefix and suffix of each label parameter
  - show the unit format of the label parameters in this family
  - list the labels in this title block family

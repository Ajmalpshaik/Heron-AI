# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: a duct under a slab, probed upwards in a 3D view showing everything
    expect: >
      the slab named with a distance. Measure it in Revit from the duct's
      centre - not its top - and the numbers should agree

  - given: six directions - up, down and the four sides
    expect: >
      one line per direction that hit something within the distance

  - given: an element with no location point
    expect: >
      the middle of its bounding box used as the origin, and a result anyway

  # D-59, added 2026-09-28 with version 2. NOT RUN.
  - given: >
      an AHU in this MEP model 400 mm from a wall of the architectural link,
      directions the four horizontals, maxDistance 1000, includeLinks true
    expect: >
      `hits` unchanged from the host-only run; one line in `linkedMatches`
      for the direction facing the wall, naming it and giving the distance
      in mm - checked with a dimension in plan

  # VERSION 3 (2026-11-01) - CHECK_OBSTRUCTIONS merged in. Each FAILS on
  # version 2, which had no `points`, no `blocked`/`clear` and no template
  # guard. NOT RUN. The first two are CHECK_OBSTRUCTIONS' own positives.
  - given: >
      a room with one beam, a grid of 12 points (nothing placed), directions
      "0,0,1", maxDistance so the beam is inside it, in a 3D view WITH
      structural framing visible, `elements` left out with nothing selected
    expect: >
      the points under the beam in `blocked`, the rest in `clear`, the split
      matching what a person sees in the 3D view; findings names the beam and
      its distance in mm for each blocked point
  - given: the same points and a maxDistance SHORTER than the distance to the beam
    expect: >
      all 12 clear - the distance decides, not whether something was hit
  - given: >
      the same points, the beam in the STRUCTURAL LINK instead, includeLinks
      left out
    expect: >
      all 12 clear AND the summary saying LINKS WERE NOT READ and to set
      includeLinks (CHECK_OBSTRUCTIONS always read links; this card reads them
      only when asked, D-59). With includeLinks true: the points under the
      linked beam blocked, the beam named with its id IN THE LINK

negative:
  # VERSION 3, from CHECK_OBSTRUCTIONS. NOT RUN.
  - given: >
      THE SAME MODEL AND POINTS, in a 3D view with structural framing SWITCHED
      OFF
    expect: >
      every point clear - the card behaving correctly while giving a dangerous
      answer; the summary says a ray sees only what the view shows
  - given: a VIEW TEMPLATE passed as the view, with points and elements
    expect: >
      notChecked = every point, `clear` EMPTY, `nothingHit` EMPTY, no
      exception, and a finding saying nothing was probed. Version 2 threw
  - given: points given and directions "0,0,0" only
    expect: every point notChecked - a zero direction casts nothing - never clear
  - given: neither elements nor points
    expect: a finding "Nothing was given to probe", every list empty
  - given: a 3D view with the WALLS category hidden
    expect: >
      a wall not reported, and the path reading clear. This is the trap: the
      same element in a view showing walls reports them, and nothing warns you.
      Proven in a real model - 0 neighbours in one view, 4 in another

  - given: a ray that starts inside its own element
    expect: >
      its own faces NOT reported. It is the first thing in the way otherwise,
      at zero distance, on every element

  - given: a pipe passing the CORNER of a large unit
    expect: >
      it possibly missed. One ray per direction sees only what is in line with
      the centre, and anything large wants several origins

  - given: a maxDistance smaller than the nearest thing
    expect: >
      the element in `nothingHit` - which means nothing within that distance,
      not nothing at all

  # D-59, added 2026-09-28 with version 2. NONE OF THESE HAS BEEN RUN.
  - given: includeLinks ABSENT, on a model that HAS loaded links
    expect: >
      the same answer as version 1, and linksSearched 0 with the first
      line of linkedMatches reading "Host model only - links not read". The
      switch left out must bind false, not refuse - if the run refuses with
      needs_request_values, the add-in in Revit is older than this change

  - given: includeLinks true on a model with NO links, or with every link unloaded
    expect: >
      linksSearched 0 and "Links asked for, NONE loaded - host only". It must
      NOT read like the absent case: one means there was nothing else to read,
      the other means reload them in Manage Links and ask again

  - given: one linked file placed TWICE, with includeLinks true
    expect: >
      linksSearched 1, not 2 - it counts files, not placements

  - given: the architectural link hidden in the given 3D view, includeLinks true
    expect: >
      no linked line at all - the ray obeys the view - and the summary still
      counting the loaded links, so the zero is visibly a view setting

  # Row 5b-203, added 2026-10-09. NOT RUN - it needs a model that carries a
  # duplicated name, and none has been arranged yet.
  - given: >
      an AHU in this MEP model 400 mm from a wall of the architectural link
      whose type carries two parameters named Fire Rating - a shared "Fire
      Rating" bound to Walls beside the built-in one - directions the four
      horizontals, maxDistance 1000, includeLinks true
    expect: >
      the line for the direction facing the wall names it with "Fire Rating
      NOT READ - 2 parameters share that name", never either rating, and
      `hits` is unchanged from the host-only run (row 5b-203)

second_route:
  - >
    measure it in Revit with the Measure tool, from the element's insertion
    point, and check the view is showing the categories you care about

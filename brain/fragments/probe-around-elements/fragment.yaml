compatibility-note: >
  One implementation for every release. The reference intersector, its nearest
  hit and the proximity it reports are unchanged 2020 to 2027 - and so is the
  requirement for a real 3D view to cast in, which is why the view is a request
  input rather than something found here.

# ROUTING - the same rows are in the fragments named here.
#
#   "what is above this duct"            -> here
#   "what is around this equipment"      -> here
#   "which of these points is blocked"   -> here since version 3, `points`
#                                           (was CHECK_OBSTRUCTIONS) - blocked
#                                           or clear within the distance,
#                                           and what blocks each one
#   "is there a beam in the way"         -> here, `points` or the elements
#   "is anything above this point"       -> here, `points`
#   "can we reach the valve to operate it" -> CHECK_VALVE_ACCESSIBILITY - room,
#                                           an access panel and reach height
#   "is there enough space in front of the panel to open the door" ->
#                                           CHECK_EQUIPMENT_CLEARANCE
#   "is the equipment sitting flat on the floor" -> CHECK_SURFACE_FIT - the
#                                           whole FOOTPRINT, because one ray
#                                           cannot see an edge
#   "is there enough clearance"          -> CHECK_MINIMUM_CLEARANCE, which
#                                           judges against a number you give
#   "move it up until it clears"         -> MOVE_TO_RAY_HIT
#   "find the clashes"                   -> FIND_CLASHES, which is geometry
#                                           against geometry rather than a ray

utterances:
  - what is above this duct
  - what is around this equipment
  - how far is the nearest thing
  - probe around these elements
  - what would i hit if i moved this up
  # MOVED 2026-11-01 from CHECK_OBSTRUCTIONS, merged into this card.
  - is there a beam in the way
  - there is a beam in the room
  - check the clearance above
  - what is blocking these
  - is anything obstructing the head
  - check for obstructions
  - is anything above this point
  # ...and its semantic identity, which nothing else declares:
  - which of these points has something in the way

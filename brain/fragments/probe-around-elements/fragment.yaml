# VERSION 3 (2026-11-01) - CHECK_OBSTRUCTIONS WAS MERGED INTO THIS CARD on the
# owner's instruction ("make sure there is no duplicate tools"; "in every
# conflict keep the safer rule"), and is DEPRECATED. The same rays, cast from
# BARE POINTS as well as from elements: "is there a beam in the way", "is
# anything above this point", before anything is placed. What it had that
# this lacked, all carried:
#   - `points`, each probed in every one of `directions` (its one `direction`
#     is a list of one here); `elements` may be left out for them.
#   - BLOCKED OR CLEAR WITHIN A DISTANCE: `blocked` - something within
#     maxDistance in any direction - and `clear`; a hit further away is clear
#     for this question, the distance decides. `findings` names what blocks
#     each point and how far (CHECK_OBSTRUCTIONS gave only the two lists).
#   - THREE OUTCOMES KEPT THREE: a point that could not be tested is counted
#     in `notChecked`, never called clear.
#   - A VIEW TEMPLATE CASTS NOTHING: every point notChecked, `clear` empty.
#     Version 2 had no guard and threw; now no element is probed either, and
#     none is put in `nothingHit`.
# Where each of its outputs is now: blocked, clear and notChecked by the same
# names; its `direction` is `directions`; `maxDistance` the same, in mm.
#
# THE OPPOSITE RULE, AND WHICH WAS KEPT: CHECK_OBSTRUCTIONS ALWAYS looked into
# linked models (FindReferencesInRevitLinks on every ray). This card reads a
# link ONLY WHEN `includeLinks` IS SET - D-59, the modeller decides job by
# job, and that is the recorded rule. NOT CARRIED: the always-on link search.
# What makes that safe rather than a quiet loss: a point's summary says in
# words when links were not read - a beam in the structural link does not
# block a point tested against this model alone - and to set includeLinks.
#
# The proof below is version 2's and no longer describes the code; DRAFT
# until version 3 is proved on a real model (D-30).
version: 3
source: OFFICIAL
risk: READ

purpose: >
  Fires rays out of each element in the directions asked for and reports what
  each one hits and how far away. The look before a move: what is above this
  duct, what is beside this pump, how much room is there.

  **RAYS ONLY SEE WHAT THE 3D VIEW SHOWS, AND NOTHING WARNS YOU.** Ray casting
  runs inside a 3D view and obeys it completely - hidden categories, section
  boxes, view filters, closed worksets. A view with walls switched off reports
  a clear path with a wall standing in it. Proven in a real model: the same
  element, the same ray, 0 neighbours in one view and 4 in another. The view
  is a request input for that reason, and the first thing to check when a
  result looks impossibly empty.

  **THE DISTANCE IS FROM THE ELEMENT'S POINT, NOT ITS FACE.** The ray starts at
  the insertion point, inside the element, so a 600 mm deep unit reports about
  300 mm less clearance than a tape would. It is a real number measured from a
  stated place, and reading it as face-to-face is how a clearance passes on
  paper and fails on site.

  **ONE RAY PER DIRECTION MISSES THINGS BESIDE A BIG ELEMENT.** A single ray
  from the centre sees only what is directly in line with it: a pipe passing
  the corner of an air handling unit is invisible to it. For anything large,
  probe from several points rather than trusting one.

  **A HIT ON THE ELEMENT ITSELF IS DROPPED.** The ray starts inside its own
  geometry, so its own faces are the first thing in the way.

  ASSUMES NOTHING ABOUT TRANSACTIONS - it opens none and needs none.

  **LINKED MODELS ARE PROBED ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, each direction is cast a second time with
  Revit's own FindReferencesInRevitLinks, and where the nearest thing
  within reach is in a LINK - the architect's wall, the structural beam -
  it gets a line in `linkedMatches` with the linked element's type, id IN
  THE LINK, Fire Rating and distance in millimetres. Where something in this
  model is nearer, the host answer already has it. **The same view rule
  holds**: a link hidden in the view is not seen. `linksSearched` says how
  many links are loaded: set and 0 means "you asked, and none are loaded".
  **NOTHING FROM A LINK IS CARRIED** - `hits`, `nothingHit` and `noOrigin`
  stay this model's answer (FRAGMENT-ISSUES row 75). Only model elements
  are read from a link, never its views or sheets. Links nested inside a
  link are not read, and are counted in the answer. This is version 2;
  version 1's proof no longer describes the code, and the fragment is
  DRAFT until it is proved again.

# A NAME TWO PARAMETERS SHARE IS NEVER READ: a linked element whose Fire Rating
# two parameters carry - a shared or project "Fire Rating" bound beside the
# built-in one, on the element or on the type the lookup falls through to -
# reads "Fire Rating NOT READ - N parameters share that name" in
# `linkedMatches`, never either value (D-54 s3, FRAGMENT-ISSUES 5b-203; added
# 2026-10-09). Written here and not in `purpose`, as on check-sleeve-size's
# card: the purpose is embedded for routing, and on that card's change a
# purpose sentence about this moved other cards' utterances in check-routing,
# measured against d9b27f03 (row 5b-203's 2026-10-09 note). Not measured for
# this card.
contract:
  needs:
    - name: doc
      type: Document
    - name: view3d
      type: View3D
      source: request
    - name: elements
      # VERSION 3: MAY BE LEFT OUT (binds empty) when `points` are the start.
      type: IList<Element>
      optional: true
    # VERSION 3, from CHECK_OBSTRUCTIONS. Bare points to cast from - nothing
    # placed there yet - each "x,y,z" in millimetres, converted by the add-in
    # (D-67). Left out: none (an empty list).
    - name: points
      type: IList<XYZ>
      source: request
      optional: true
    # Each direction to fire in. Up, down, and the four sides are the usual
    # set; the caller decides, because "what is around this" means different
    # directions for a riser and for a floor-standing unit.
    - name: directions
      type: IList<XYZ>
      source: request
    - name: maxDistance
      type: double
      source: request
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: hits
      role: result
      type: IDictionary<ElementId, IList<string>>
    - name: nothingHit
      # Elements whose rays hit nothing. Indistinguishable from a 3D view
      # with the categories switched off, which the purpose names as the
      # first thing to check - evidence it ran, never a hit (D-52).
      role: accounting
      type: IList<ElementId>
    - name: noOrigin
      # Elements with no origin to fire a ray from, so it could not be probed.
      # The evidence it looked, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then the links' own lines. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75). Since 2026-10-09 a Fire
      # Rating two parameters share reads NOT READ there, never either
      # value (D-54 s3, FRAGMENT-ISSUES 5b-203).
      role: accounting
      type: IList<string>
    # VERSION 3, from CHECK_OBSTRUCTIONS - the points' answer.
    - name: blocked
      # Points with something within maxDistance in any direction asked.
      role: result
      type: IList<XYZ>
    - name: clear
      # Points with nothing that near. The evidence it looked; `blocked` is
      # what it found (D-52).
      role: accounting
      type: IList<XYZ>
    - name: notChecked
      # Points the test could not be run at - no point, no usable direction,
      # a view template or no view. Never counted clear (D-52).
      role: accounting
      type: int
    - name: findings
      # VERSION 3. What was probed, what blocks each point and how far, and
      # whether links were read.
      type: IList<string>


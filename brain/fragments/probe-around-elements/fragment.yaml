id: FRG-GEO-028
semantic-identity: "what is around this thing, and how far away"
kind: action
domain: revit.geometry
capability: PROBE_AROUND_ELEMENTS
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Fires rays out of each element in the directions asked for and reports what
  each one hits and how far away. The look before a move: what is above this
  duct, what is beside this pump, how much room is there.

  **RAYS ONLY SEE WHAT THE 3D VIEW SHOWS, AND NOTHING WARNS YOU.** Ray casting
  runs inside a 3D view and obeys it completely - hidden categories, section
  boxes, view filters, closed worksets. A view with walls switched off reports
  a clear path with a wall standing in it. Proven in a real model: the same
  element, the same ray, 0 neighbours in one view and 4 in another. The view
  is a request input for that reason, and the first thing to check when a
  result looks impossibly empty.

  **THE DISTANCE IS FROM THE ELEMENT'S POINT, NOT ITS FACE.** The ray starts at
  the insertion point, inside the element, so a 600 mm deep unit reports about
  300 mm less clearance than a tape would. It is a real number measured from a
  stated place, and reading it as face-to-face is how a clearance passes on
  paper and fails on site.

  **ONE RAY PER DIRECTION MISSES THINGS BESIDE A BIG ELEMENT.** A single ray
  from the centre sees only what is directly in line with it: a pipe passing
  the corner of an air handling unit is invisible to it. For anything large,
  probe from several points rather than trusting one.

  **A HIT ON THE ELEMENT ITSELF IS DROPPED.** The ray starts inside its own
  geometry, so its own faces are the first thing in the way.

  ASSUMES NOTHING ABOUT TRANSACTIONS - it opens none and needs none.

  **LINKED MODELS ARE PROBED ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, each direction is cast a second time with
  Revit's own FindReferencesInRevitLinks, and where the nearest thing
  within reach is in a LINK - the architect's wall, the structural beam -
  it gets a line in `linkedMatches` with the linked element's type, id IN
  THE LINK, Fire Rating and distance in millimetres. Where something in this
  model is nearer, the host answer already has it. **The same view rule
  holds**: a link hidden in the view is not seen. `linksSearched` says how
  many links are loaded: set and 0 means "you asked, and none are loaded".
  **NOTHING FROM A LINK IS CARRIED** - `hits`, `nothingHit` and `noOrigin`
  stay this model's answer (FRAGMENT-ISSUES row 75). Only model elements
  are read from a link, never its views or sheets. Links nested inside a
  link are not read, and are counted in the answer. This is version 2;
  version 1's proof no longer describes the code, and the fragment is
  DRAFT until it is proved again.

contract:
  needs:
    - name: doc
      type: Document
    - name: view3d
      type: View3D
      source: request
    - name: elements
      type: IList<Element>
    # Each direction to fire in. Up, down, and the four sides are the usual
    # set; the caller decides, because "what is around this" means different
    # directions for a riser and for a floor-standing unit.
    - name: directions
      type: IList<XYZ>
      source: request
    - name: maxDistance
      type: double
      source: request
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: hits
      role: result
      type: IDictionary<ElementId, IList<string>>
    - name: nothingHit
      # Elements whose rays hit nothing. Indistinguishable from a 3D view
      # with the categories switched off, which the purpose names as the
      # first thing to check - evidence it ran, never a hit (D-52).
      role: accounting
      type: IList<ElementId>
    - name: noOrigin
      # Elements with no origin to fire a ray from, so it could not be probed.
      # The evidence it looked, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then the links' own lines. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75).
      role: accounting
      type: IList<string>

proof:
  date: '2026-09-13'
  by: Ajmal PS
  model: test projject (3,509 elements), Revit 2024, session 40932
  positive_case: run as it would normally be run - the arrangement was re-made first by running
    select-by-category-name, set-selection with this phase's own values. returned MillimetresPerFoot
    304.8, hits 6 entry(ies), intersector ReferenceIntersector, maxDistance 164.041994750656,
    noOrigin 0 item(s), nothingHit 0 item(s). inputs came view3d as given; elements from the
    selection (6); directions as given (6); maxDistance as given. on test projject
  negative_case: run with categoryName=Ducts, inViewOnly={3D}, view3d={3D}, directions=1000,0,0;
    -1000,0,0; 0,1000,0; 0,-1000,0; 0,0,1000; 0,0,-1000, maxDistance=1 instead - chosen because
    it should not contain what this fragment reports - the arrangement was re-made first by
    running select-by-category-name, set-selection with this phase's own values. returned
    MillimetresPerFoot 304.8, hits 0 entry(ies), intersector ReferenceIntersector, maxDistance
    0.00328083989501312, noOrigin 0 item(s), nothingHit 6 item(s) [925780, 925782, 925784,
    ...]. inputs came view3d as given; elements from the selection (6); directions as given
    (6); maxDistance as given. on test projject
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: 2e8aacec525bb916

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. The reference intersector, its nearest
  hit and the proximity it reports are unchanged 2020 to 2027 - and so is the
  requirement for a real 3D view to cast in, which is why the view is a request
  input rather than something found here.

# ROUTING - the same rows are in the fragments named here.
#
#   "what is above this duct"            -> here
#   "what is around this equipment"      -> here
#   "which of these points is blocked"   -> CHECK_OBSTRUCTIONS, which answers
#                                           blocked or clear for POINTS in one
#                                           direction. This one names what was
#                                           hit and how far, from ELEMENTS
#   "is there enough clearance"          -> CHECK_MINIMUM_CLEARANCE, which
#                                           judges against a number you give
#   "move it up until it clears"         -> MOVE_TO_RAY_HIT
#   "find the clashes"                   -> FIND_CLASHES, which is geometry
#                                           against geometry rather than a ray

utterances:
  - what is above this duct
  - what is around this equipment
  - how far is the nearest thing
  - probe around these elements
  - what would i hit if i moved this up

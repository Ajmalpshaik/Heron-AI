# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# Sets which view of the family in front the preview picture - in the family
# browser and Windows Explorer - is taken from, refreshed on every save. The
# picture is drawn by Revit at the next save; SAVE_DOCUMENT saves. READ BACK:
# the preview view off the document's settings.
#
# SET_FAMILY_SETTINGS sets a family's category-level settings; this only the
# preview.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Sets the view a family's preview picture is taken from - the thumbnail in
  the family browser and Windows Explorer - drawn at the next save.

contract:
  needs:
    - name: doc
      type: Document
    # A plan, elevation or 3D view of the family, by name.
    - name: viewName
      type: string
      source: request
  provides:
    - name: previewView
      # The preview view's name, read back.
      role: result
      type: string
    - name: refused
      # Why NOTHING WAS CHANGED, as one sentence; null otherwise (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>

proof:
  date: '2026-10-18'
  by: Ajmal PS
  model: Family4 (2,168 elements), Revit 2020, session 64176
  positive_case: run as it would normally be run - run inside a transaction, and Revit reported
    the transaction group ROLLED BACK afterwards. returned findings 1 item(s) [The preview
    picture will be taken from "View 1" (read back) ...], previewView View 1, refused (null),
    view View3D. inputs came viewName as given. on Family4
  negative_case: run with viewName=No Such View instead - chosen because it should not contain
    what this fragment reports - run inside a transaction, and Revit reported the transaction
    group ROLLED BACK afterwards. returned findings 1 item(s) [No view is named "No Such View"
    in this family. NOTHING WAS ...], previewView , refused No view is named "No Such View"
    in this family. NOTHING WAS CHANGED., view (null). inputs came viewName as given. on Family4
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: 22b5b39e57bd72b5

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. Document.GetDocumentPreviewSettings
  with PreviewViewId, IsViewIdValidForPreview and ForceViewUpdate, and
  Document.IsFamilyDocument are present 2020 through 2027 - read off
  RevitAPI.xml in the Nice3point reference packages for all eight releases on
  2026-10-12.

# ROUTING - the same rows are in the fragments named here.
#
#   "set the family thumbnail to the 3D view" -> here
#   "save the family"                         -> SAVE_DOCUMENT

utterances:
  - set the family thumbnail to the 3D view
  - use this view for the family preview picture
  - make the family preview show the isometric view
  - change the family preview image

id: FRG-GEO-070
semantic-identity: "how are the divided surfaces and divided paths laid out - grids, spacing, nodes"
kind: action
domain: revit.geometry
capability: REPORT_DIVIDED_SURFACES
version: 1
source: OFFICIAL
risk: READ

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# Every divided surface - host, U and V grid layout (number or distance,
# justification, rotation, offset), gridline counts, border tiles - and every
# divided path - node count, layout, length, closed or open, how distance is
# measured - in the document in front, a conceptual family or a project.
# withNodes adds the first 50 node positions of each, in millimetres: what an
# adaptive component is placed on. A node's place comes from the point
# Revit's geometry gives for it; one with none is counted, not guessed.
#
# DIVIDE_FAMILY_SURFACE divides a surface; PLACE_ADAPTIVE_COMPONENTS places
# adaptive families on points or nodes.
#
# READ ONLY - opens no transaction.
#
# THE PURPOSE NAMES WHAT IT ALREADY READS (2026-10-28, nothing under impl/
# moved). SET_DIVIDED_SURFACE_LAYOUT arrived saying "U grid", "rotation",
# "offset" and "border tiles", and on the cloud backend questions about them -
# "what are the border tiles on the divided surface", "what is the U grid
# layout of the divided surface" - ranked that WRITE first while this card's
# purpose said only "grid layout, spacing". A question must not land on a
# write (D-86). What this does NOT read - the all grid rotation, component
# rotation, flip and mirror, the indents and the levels cutting a surface -
# has no reader yet; SET_DIVIDED_SURFACE_LAYOUT's readBack prints them, but
# only after a change.
purpose: >
  Reads every divided surface and divided path - each U grid and V grid's
  layout, spacing or number of divisions, rotation, offset and justification,
  the border tiles, gridline and node counts, length - and, when asked, where
  the nodes are.

contract:
  needs:
    - name: doc
      type: Document
    - name: withNodes
      type: bool
      source: request
      optional: true
  provides:
    - name: divided
      # ONE STRING, a part per surface and per path (D-52).
      role: result
      type: string
    - name: surfaceCount
      role: result
      type: int
    - name: pathCount
      role: result
      type: int
    - name: findings
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. DividedSurface with Host,
  USpacingRule, VSpacingRule, NumberOfUGridlines, NumberOfVGridlines,
  BorderTile and GetGridNodeReference, GridNode, SpacingRule with Layout,
  Number, Distance, Justification, GridlinesRotation and Offset, and
  DividedPath with NumberOfPoints, SpacingRuleLayout, FixedNumberOfPoints,
  Distance, TotalPathLength, IsClosedLoop and MeasurementType are present
  2020 through 2027 - read off RevitAPI.xml in the Nice3point reference
  packages for all eight releases on 2026-10-13.

# ROUTING - the same rows are in the fragments named here.
#
#   "how is this surface divided"              -> here
#   "where are the nodes of the divided path"  -> here, withNodes
#   "divide this surface 10 by 6"              -> DIVIDE_FAMILY_SURFACE
#   "change the U grid to 20 divisions",
#   "rotate the divided surface grid 45 degrees for a diamond pattern"
#                                              -> SET_DIVIDED_SURFACE_LAYOUT, on a
#                                                 surface already divided. A question
#                                                 about the same grid stays here (D-86):
#                                                 that card writes
#   "what is the U grid spacing"               -> here - its U and V rows
#   "what is the U grid layout of the divided surface",
#   "what are the border tiles on the divided surface"
#                                              -> here. MEASURED 2026-10-28 on the
#                                                 cloud backend: a coin toss with
#                                                 SET_DIVIDED_SURFACE_LAYOUT by ranking,
#                                                 which is why the purpose names them
#   "is the divided surface flipped",
#   "which levels cut the divided surface"     -> NOT HERE, and nothing reads either
#                                                 yet: this reads no flip and no cut.
#                                                 SET_DIVIDED_SURFACE_LAYOUT ranks first
#                                                 for both and writes (D-86). With the
#                                                 lookup's question mode on, both reach
#                                                 HERE (measured 2026-10-28), and this
#                                                 answer has no flip and no cut in it -
#                                                 a reader gap, not a routing one

utterances:
  - how is this surface divided
  - list the divided surfaces and their grids
  - where are the nodes of this divided path
  - how many nodes does the divided path have
  - where are the nodes of the divided path
  # DECLARED 2026-10-28 (D-86). The routing table above claims both, and a
  # comment is not indexed: with SET_DIVIDED_SURFACE_LAYOUT in the library,
  # tools/check-routing.py measured the first served by that WRITE.
  - what are the border tiles on the divided surface
  - what is the U grid layout of the divided surface

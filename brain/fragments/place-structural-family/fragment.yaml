id: FRG-ELE-064
semantic-identity: "put a structural column or a footing at each of these points"
kind: action
domain: revit.elements
capability: PLACE_STRUCTURAL_FAMILY
version: 4
source: OFFICIAL
risk: MODIFY

purpose: >
  Places a point-based family at each point as a REAL STRUCTURAL MEMBER - a
  column, a footing - with the structural type the caller asked for, and a
  column's top at the level and offset asked for.

  **VERSION 4: A MEMBER DRIVEN BY TWO ENDS IS NOT PLACED AT A POINT.** Asked
  as a beam or a brace, or handed a Structural Framing family, it is refused
  before anything is placed and sent to PLACE_LINE_BASED_FAMILY. A placement
  Revit leaves with no solid geometry is removed again and counted as failed,
  never as placed.

  **VERSION 3: A STRUCTURAL FAMILY GOES IN ONLY AS ITS OWN KIND.** A family in
  Structural Columns is placed only as a column, one in Structural
  Foundations only as a footing - anything else is refused, naming what to
  ask for, and nothing is placed. Revit itself takes a column family asked as
  a beam and places it (row 128); a family in any other category is left to
  Revit, as before.

  **VERSION 2 GIVES A COLUMN ITS TOP.** Version 1 placed a column on its base
  level and said nothing about where it stopped. `topLevelName` and
  `topOffset` (millimetres) are BLANK FOR VERSION 1 EXACTLY - the top left as
  Revit placed it, and the reply says so. Given, and only for a column:
  - **The level is found by its whole name, exactly.** No level of that name,
    or two, and nothing is placed - never the nearest name.
  - **A top at or below the base is refused before anything is placed** -
    the top level's elevation, and that plus the offset, against the base
    level's. An offset with no top level is refused too: which level it is
    measured from is not guessed.
  - **Set on the built-in Top Level and Top Offset, never a parameter found
    by name.** A column whose family has neither settable is removed again
    inside the same undo and named in `topRefused`.
  - **Read back after a regenerate** - the level and offset it now carries,
    as an elevation in millimetres, with the top of its own geometry as a
    second reading - beside what was asked, in `tops`. More than 1 mm out, or
    on another level, is named in `topWrong`.

  **IT EXISTS BECAUSE `PLACE_FAMILY_INSTANCES` HARDCODES `NonStructural`, AND
  THAT WAS RIGHT FOR WHAT IT WAS WRITTEN FOR.** Its own purpose names air
  terminals, sprinkler heads and detectors, and none of those is a structural
  member. The defect was never the hardcoding: it was that no OTHER route
  existed, so structural work silently used the wrong one and every column and
  isolated footing went into the model as non-structural, with nothing saying so.

  **A NON-STRUCTURAL COLUMN IS NOT A HARMLESS LABEL.** It changes what the
  structural schedules count, what an analytical model picks up, and what a
  take-off prices. It looks identical on every drawing.

  **THE TYPE IS ASKED FOR AND NEVER INFERRED FROM THE FAMILY.** A family loaded
  into Structural Columns can still be placed non-structurally, and which is
  wanted is a decision about the job (D-33).

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

# VERSION 4 - FRAGMENT-ISSUES 5b-1201. Seen 2026-10-19 on Revit 2020.2: the
# symbol "M_Concrete-Rectangular Beam : 400 x 800mm" (Structural Framing),
# structuralType Beam, Level 1, three points answered placed 3, failed 0.
# Revit then deleted the geometry of two ("Line is too short", "Can't create
# sweep"), and the zero-length beams stayed in the model as a success. A beam
# or a brace is driven by the line between its two ends; a point cannot give
# one. So "beam" or "brace" asked of a family that is not a column or a
# foundation, and a Structural Framing family asked as anything, is refused
# before anything is placed, with a sentence naming PLACE_LINE_BASED_FAMILY
# and its `curves` form ("0,0,0; 5000,0,0 | ..." in millimetres). A column or
# foundation family asked as a beam keeps version 3's sentence - ask for it
# as its own kind. And after one regenerate every placement is looked at: an
# instance that is gone, or holds no solid with volume at Fine detail, is
# removed again inside the same undo, counted in `failed` and named in
# `findings`; one Revit will not let go of undoes the whole run, so the answer
# never says "removed" of something still in the model. A family with no
# solid of its own is counted the same way: it
# is not a structural member. The words above are kept short on purpose - a
# purpose's words move routing and a comment's do not.
contract:
  needs:
    - name: doc
      type: Document
    - name: symbol
      type: FamilySymbol
      source: request
    - name: points
      type: IList<XYZ>
      source: request
    - name: level
      type: Level
      source: request
    - name: structuralType
      type: string
      source: request
    # VERSION 2. The level a column's top is tied to, by its whole name - or
    # BLANK for version 1's behaviour, the top left as Revit placed it.
    # Columns only. Strings so that blank can mean "not asked": NOT marked
    # `optional: true`, because the add-in refuses any request need that
    # arrives with no value unless it is a bool (FRAGMENT-ISSUES 5b-227 and
    # 5b-252). Send both, blank or not.
    - name: topLevelName
      type: string
      source: request
    # VERSION 2. Millimetres above (or, negative, below) the top level - or
    # BLANK for none. Refused without a top level.
    - name: topOffset
      type: string
      source: request
  provides:
    - name: placed
      role: result
      type: IList<ElementId>
    - name: failed
      # Points nothing could be placed at. Never an instance it placed (D-52).
      # VERSION 4: an instance Revit left with no solid geometry counts here,
      # removed again, never in `placed`.
      role: accounting
      type: int
    - name: tops
      # VERSION 2. One line per column given a top: asked, read back from its
      # Top Level and Top Offset, and its geometry's top. A reading of what was
      # done, never a thing found, so it banks nothing.
      role: accounting
      type: IList<string>
    - name: topWrong
      # Columns whose top reads back more than 1 mm out, or on another level.
      # Named, never counted as right (D-52).
      role: accounting
      type: IList<string>
    - name: topRefused
      # Columns removed again because their family has no settable Top Level
      # and Top Offset. Never one it kept (D-52).
      role: accounting
      type: IList<string>
    - name: findings
      type: IList<string>


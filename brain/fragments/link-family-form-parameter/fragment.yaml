compatibility-note: >
  `FamilyManager.AssociateElementParameterToFamilyParameter` (whose remarks say
  the two parameters must be the same type, and which takes a null to unlink),
  `CanElementParameterBeAssociated` and `GetAssociatedFamilyParameter`, and
  `BuiltInParameter.IS_VISIBLE_PARAM`, `REVOLUTION_START_ANGLE`,
  `REVOLUTION_END_ANGLE`, `EXTRUSION_START_PARAM` and `EXTRUSION_END_PARAM`
  read the same 2020 through 2027 (the RevitAPI reference assemblies and their
  XML remarks, read 2026-10-01). A parameter's KIND moved at 2022 -
  `Definition.ParameterType` before, `GetDataType()` from - so both are read by
  reflection, newest first, as LINK_FAMILY_PARAMETER reads them.

# ROUTING - see SET_FAMILY_CATEGORY for the whole family-building table.
#
#   "link the handle's visible to Show_Handle"    -> here, one form
#   "link the elbow's end angle to Bend Angle"    -> here, one form
#   "link the connector flow to a parameter"      -> LINK_FAMILY_PARAMETER,
#                                                    every element of a kind
#   "link the body material to Body Material"     -> SET_FAMILY_FORM_MATERIAL
#   "show this form only in fine"                 -> SET_FAMILY_FORM_VISIBILITY,
#                                                    detail levels, no parameter


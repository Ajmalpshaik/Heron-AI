id: FRG-PAR-029
semantic-identity: "link a particular form's own fields - Visible, a revolve's angles, an extrusion's ends - or one nested part's instance fields to family parameters in the family being edited"
kind: action
domain: revit.families
capability: LINK_FAMILY_FORM_PARAMETER
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  LINKS a particular form's own fields to the family's parameters, in the
  family open in the Family Editor - the Associate Family Parameter button at
  the end of a row in Properties, for the forms named and no others. An
  optional part, shown only in the types where its checkbox parameter is
  ticked (Visible); a revolve whose sweep is an angle the types choose (Start Angle,
  End Angle); an extrusion whose depth follows a length (Extrusion Start,
  Extrusion End). Whatever else Revit lets be linked on a form, the same way.

  **ONE FORM AT A TIME IS THE POINT.** LINK_FAMILY_PARAMETER links a field on
  every element of a kind at once - every extrusion together - and a handle
  that may be left out is one extrusion among several.

  **AND ONE NESTED PART.** A nested family's placed copy has the same button on
  its instance parameters, and LINK_FAMILY_PARAMETER links every copy of that
  family together. A pipe support's beam, legs and brace can be four copies of
  one channel family with four lengths, and four U-bolts each with its own
  size and Visible: each copy is named by its id and linked alone - its other
  copies keep their own values. Only the copy's INSTANCE fields: a TYPE field
  belongs to every copy of that type, and LINK_NESTED_TYPE_PARAMETER links it
  there - named in the refusal.

  **MATERIAL**: a FORM's is left to SET_FAMILY_FORM_MATERIAL, which also sets
  one or puts it back to <By Category>, and is refused here by name. A NESTED
  PART's Material is an instance parameter of its own family, which that tool
  does not reach, and it is linked here like any other field.

  **THE LINKS ARE PAIRS**, field = family parameter, semicolons between; "none"
  in place of a family parameter unlinks. The field is the name in Properties.

  **A LINK REVIT WOULD REFUSE IS REFUSED FIRST**: a family parameter that does
  not exist, holds another kind of value - Revit's own remark, the two must be
  the same type - or only reports; a field the form lacks, or that Revit will
  not let be linked. Each refusal names the ones that could.

  **THE FORMS AND PARTS ARE NAMED BY THEIR IDS** - the ones the form tools or
  PLACE_NESTED_FAMILY gave back, or REPORT_FAMILY_FORMS read - or SELECTED in
  the family's window and called `selected`. Anything else - a model line, a
  reference plane - is refused and nothing is linked.

  **VERSION 2 (2026-10-06)** adds nested parts. Version 2 was proved on a
  form 2026-10-20 (Revit 2020); a nested part's link is not yet run in Revit.

  **EVERY LINK IS READ BACK**, before and after, with what the field reads;
  one that does not read as asked fails the call, and Heron rolls it all back.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: uidoc
      type: UIDocument
    # The forms and nested parts, by the ids the form tools or
    # PLACE_NESTED_FAMILY gave back, commas between - or `selected`.
    - name: forms
      type: string
      source: request
    # Field = family parameter, SEMICOLONS between - "Visible=Show_Handle;
    # End Angle=Bend_Angle". "Visible=none" unlinks. The left name is the one
    # in Properties, the right one the one in Family Types.
    - name: links
      type: IDictionary<string, string>
      source: request
  provides:
    - name: linkReport
      # Every link asked for, form by form and part by part, before and after and what the field
      # reads, on ONE line - a list is cut to three entries before anyone reads
      # it.
      role: result
      type: string
    - name: changed
      # Links that read differently after the call than before it.
      role: result
      type: int
    - name: alreadyLinked
      # Asked for and already so: looked at, nothing done (D-52).
      role: accounting
      type: int
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing changed, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


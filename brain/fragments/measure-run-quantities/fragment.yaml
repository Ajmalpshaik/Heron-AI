revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `CURVE_ELEM_LENGTH` and
  `RBS_CURVE_SURFACE_AREA` are present 2020 to 2027, and the values are taken
  with `AsDouble()` - Revit's internal feet and square feet - rather than
  through any units API, which is what keeps this clear of the 2021 units move.
  D-20 keeps the millimetre conversion at the edge where the user is.
# ROUTING - the same rows are in the fragments named here.
#
#   "how long are the ducts"             -> here
#   "sheet metal area"                   -> here for the STRAIGHT runs -
#                                           Revit's own perimeter x length
#   "how much metal is in the bends"     -> MEASURE_FITTING_AREA, which
#                                           measures a fitting from its
#                                           geometry and takes off the open
#                                           ends
#   "how many kilos of ductwork is this" -> REPORT_DUCT_WEIGHT, which turns
#                                           the area into metal through a
#                                           gauge table
#   "total it by size"                   -> SUM_BY_GROUP, fed from here

utterances:
  - how long are the ducts
  - how much duct is there
  - the total length of pipe
  - how many square metres of ductwork
  - measure the runs
  - sheet metal area

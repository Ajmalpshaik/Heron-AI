compatibility-note: >
  One implementation for every release. `CURVE_ELEM_LENGTH` and
  `RBS_CURVE_SURFACE_AREA` are present 2020 to 2027, and the values are taken
  with `AsDouble()` - Revit's internal feet and square feet - rather than
  through any units API, which is what keeps this clear of the 2021 units move.
  D-20 keeps the millimetre conversion at the edge where the user is; the
  version 2 millimetre outputs are the feet times 304.8, plain arithmetic. `LocationCurve` and `Curve.Length`, the fallback, are unchanged
  2020 to 2027.
# VERSION 2 (2026-11-01) - MEASURE_ELEMENT_LENGTHS WAS MERGED INTO THIS CARD
# on the owner's instruction ("now merge the other duplicates also"), and is
# DEPRECATED. The same reading - how long each element is - and this card
# already gave the surface area beside it, `quantities` for GROUP_AND_COUNT, and a
# measure refused rather than guessed. What MEASURE_ELEMENT_LENGTHS had is here
# now: `totalMm` with an element handed in twice measured once; millimetre
# lengths, `lengthsMm`; the location curve for an element with no length
# parameter; a zero length named, not counted; and any element with a length,
# walls and beams among them. Its `noLength` is this card's `lengthUnknown`.
#
# THE CONFLICT, AND THE SAFER RULE KEPT: MEASURE_ELEMENT_LENGTHS asked the
# location curve FIRST and the parameter after; this card asks the parameter
# first, because it is the number Revit schedules and a quantity surveyor bills.
# The curve is the fallback only. NOT CHANGED: `quantities`, `lengths` and
# `areas` stay in internal feet and square feet - GROUP_AND_COUNT's chain reads
# them so - and the millimetres are new outputs beside them.
#
# NOT ANSWERED BY EITHER CARD, recorded rather than reworded: "how far apart are
# they" was MEASURE_ELEMENT_LENGTHS' sentence and moved here with the rest, and
# neither card measures a distance BETWEEN two elements - each measures how
# long each element is.

# ROUTING - the same rows are in the fragments named here, and in COUNT_ELEMENTS,
# GROUP_AND_COUNT and CREATE_DIMENSION.
#
#   "how long are the ducts"             -> here
#   "how many metres of duct" / "how long" -> here
#   "what is the total length of wall"   -> here, totalMm
#   "how many ducts"                     -> COUNT_ELEMENTS
#   "what sizes are the ducts"           -> READ_ELEMENT_PARAMETERS, grouped
#   "how much 300x300 duct is there"     -> a COMPOSITION:
#                                           READ_ELEMENT_PARAMETERS for the
#                                           size, this card for the lengths,
#                                           GROUP_AND_COUNT keyed on size.
#                                           GROUP_AND_COUNT only counts, and
#                                           "how much" is a length
#   "dimension these ducts"              -> CREATE_DIMENSION - a distance put
#                                           ON THE DRAWING. Asking a question
#                                           must not annotate the model
#   "sheet metal area"                   -> here for the STRAIGHT runs -
#                                           Revit's own perimeter x length
#   "how much metal is in the bends"     -> MEASURE_FITTING_AREA, which
#                                           measures a fitting from its
#                                           geometry and takes off the open
#                                           ends
#   "how many kilos of ductwork is this" -> REPORT_DUCT_WEIGHT, which turns
#                                           the area into metal through a
#                                           gauge table
#   "total it by size"                   -> GROUP_AND_COUNT, fed from here
#                                           (SUM_BY_GROUP until it was merged
#                                           into that card, 2026-11-01)


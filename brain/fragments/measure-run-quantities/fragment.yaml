id: FRG-MEP-012
semantic-identity: "how long each of these is and the total length - ducts, pipes, walls, beams - and how much metal is in a duct or pipe"
kind: action
domain: revit.mep
capability: MEASURE_RUN_QUANTITIES
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Reads the two numbers a takeoff is built from - each element's length, and
  for a duct or pipe its surface area - and says which elements had neither.
  Any element with a length: ducts, pipes, cable tray and conduit, walls,
  beams, lines.

  **THE LENGTHS IN MILLIMETRES AND THE TOTAL** (version 2, when
  MEASURE_ELEMENT_LENGTHS was merged in): `lengthsMm` for each element and
  `totalMm` for them all - "how many metres of duct is there", "what is the
  total length of wall". An element handed in twice is measured once, so the
  total and the list always agree. A length of zero is named in
  `lengthUnknown`, never added as nothing. This is version 2; version 1's proof
  no longer describes the code and is kept as a record, and the fragment is
  DRAFT until it is proved again.

  **THE SURFACE AREA IS REVIT'S OWN, NOT ONE DERIVED HERE.** Revit already
  computes perimeter times length for a duct or pipe and keeps it on the
  element. For ductwork that number IS the sheet-metal area of the straight
  runs, so a takeoff does not have to be rebuilt from the size band - and where
  it is rebuilt anyway, the two are a free check on each other.

  **A MISSING AREA IS REPORTED AS MISSING, NEVER AS ZERO.** Cable tray and
  conduit carry no such parameter. Zero there reads as "no metal in it", which
  is a plausible number and a false one - the exact shape of failure this
  project is built around. `areaUnknown` names them instead.

  **IT MEASURES AND DOES NOT GROUP.** The question always arrives as "how many
  metres of each size", which sounds like one job and is two: read the numbers,
  then total them per group. `GROUP_AND_COUNT` does the second half for any
  quantity and any key, so the same totalling serves insulation, tray weight and
  concrete without being rewritten per material. Composed with
  `READ_ELEMENT_PARAMETERS` for the size, those three answer the takeoff
  question between them.

  **WHICH MEASURE TO TOTAL IS A REQUEST INPUT, NOT A GUESS.** "How much
  ductwork is there" means metres to one person and square metres to another,
  and picking a default would answer a question nobody asked. `measure` says
  which, and the chosen one is also handed back as `quantities` so
  `GROUP_AND_COUNT` can total it without knowing what it is - which is what lets
  the same totalling serve insulation, tray weight and concrete. Both
  measurements are still returned separately for a caller that wants both.

  **LENGTH COMES FROM THE PARAMETER, NOT FROM THE LOCATION CURVE.** They are not
  always the same number: a duct's curve is its centreline, and what Revit
  schedules is what a quantity surveyor is billed against. Reading the curve
  instead would produce a defensible figure that disagrees with the model's own
  schedule, which is worse than a wrong one because both sides look right. The
  curve is read only for an element that carries no length parameter at all -
  a beam, a line (version 2).

contract:
  needs:
    - name: elements
      type: IList<Element>
    # Length or area. Left out, length (version 2 declares it, so a caller of
    # MEASURE_ELEMENT_LENGTHS, which took the elements alone, runs unchanged).
    - name: measure
      type: string
      source: request
      optional: true
      absent: length
  provides:
    - name: quantities
      role: result
      type: IDictionary<ElementId, double>
    - name: lengths
      role: result
      type: IDictionary<ElementId, double>
    - name: areas
      role: result
      type: IDictionary<ElementId, double>
    - name: areaUnknown
      # Elements Revit carries no surface area for. Given and unmeasurable,
      # never a quantity it read (D-52).
      role: accounting
      type: IList<ElementId>
    - name: lengthUnknown
      # Elements Revit carries no length for. Given and unmeasurable, never a
      # quantity it read (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string
    # Version 2, from MEASURE_ELEMENT_LENGTHS. Each length in MILLIMETRES -
    # beside `lengths`, which stays in internal feet for GROUP_AND_COUNT's chain.
    - name: lengthsMm
      role: result
      type: IDictionary<ElementId, double>
    # Version 2. The sum of `lengthsMm`, each element once.
    - name: totalMm
      role: result
      type: double

proof:
  date: '2026-11-02'
  by: Ajmal PS
  model: P1102 MEP (21,446 elements), Revit 2020, session 33624

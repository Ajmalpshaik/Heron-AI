id: FRG-VIEW-113
semantic-identity: "move each tag a set distance off its own element, with or without a leader, and turn each tag horizontal, vertical or to the orientation of its element"
kind: action
domain: revit.annotation
capability: OFFSET_TAGS_FROM_HOST
# VERSION 2 (2026-10-15, FRAGMENT-ISSUES 5b-484): a tag is TURNED as well as
# moved - Horizontal, Vertical, Model, or the way its own element runs in the
# view - and keepHead turns it, or changes its leader, without moving it.
# Asked for on a real project (Revit 2020) where five cut-out tags were moved
# inside the building with no leader and one, on an opening in a north-south
# wall, had to be turned Vertical by hand: nothing in the library set a tag's
# orientation. Every new input is an OPTIONAL bool, so a caller that names
# none of them runs version 1 exactly. DRAFT, not yet run in Revit:
# NEEDS-CHECKING Group EG.
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Moves every tag handed in to the same offset from ITS OWN element - so many
  paper millimetres right and up - switches its leader on, off, or leaves it,
  and turns the tag Horizontal, Vertical, Model, or the way its own element
  runs, or leaves it turned as it is. Any tag: air terminal, duct, pipe,
  equipment, door, window and opening tags, and room, space and area tags.
  Which tags, how far, the leader and the orientation are all values; nothing
  here knows about diffusers or openings.

  IT EXISTS BECAUSE THE TAGS ON A 1:75 AIR TERMINAL PLAN SAT ON TOP OF THEIR
  DIFFUSERS after the tag family was edited, and every tag fragment in the
  library decides the position by its own rule. `ARRANGE_TAGS` pushes clashing
  tags apart, `STACK_TAGS` columns them at one point, `MOVE_ANNOTATION` puts
  them all at ONE point, `CENTER_ROOM_TAGS` puts room tags in the middle of
  their rooms, `FORCE_TAG_LEADER_LSHAPE` bends leaders. None takes "8 mm right
  and 6 mm up of each tag's own element". Widening was weighed and refused:
  ARRANGE and STACK are PROVEN, so their proofs would go stale, and each is a
  different rule; MOVE_ANNOTATION's contract is one target for every element,
  and a second mode there would give one card two jobs.

  **MEASURED FROM THE ELEMENT, NEVER FROM THE HEAD.** The target is the
  element's location plus the offset, so a second run finds every tag already
  there and moves nothing. That second run is also the read-back. The location
  is the element's point - an air terminal, a door, equipment, a room - or the
  middle of its line - a duct, a pipe. Anything with neither is measured from
  the centre of its box and COUNTED, because a box centre is a guess.

  **THE OFFSET IS ON PAPER, IN THE VIEW'S OWN PLANE.** 8 mm right on the sheet
  is 600 mm in the model at 1:75, and "right" is the view's right, which is
  not the model's X on a rotated plan. The head keeps its own depth, so a
  diffuser 2.7 m up does not pull its tag off the view.

  **"LEADER ON" MEANS ON AND ATTACHED.** A free end stays where it was put when
  the element moves, which is not a leader to the element. A room, space or
  area tag has no end condition on any release, so for those the leader is
  switched on and its end stays where the tag is anchored in the room. With the
  leader left as it is, a free end is put back after the move rather than
  dragged along with the head.

  **A TAG THAT POINTS AT SEVERAL ELEMENTS (2022 on) IS LEFT ALONE AND NAMED.**
  Which of them it should sit beside is not answerable here.

  **THE SHEET STAYS WHERE IT WAS PUT.** Changing tags in a placed view has
  moved its viewport on the sheet - 30 and 43 mm on 2026-09-27, with the box
  the same size. Each viewport of the view is read before, read again after a
  regenerate, and put back inside the same undo if it moved more than half a
  millimetre WITH ITS BOX THE SAME SIZE; the report gives both positions in
  paper millimetres. A box that changed size is reported and NOT put back:
  when tags past the plan's edge make it grow, its centre moves while the plan
  inside it does not, and recentring would shift the plan.

  **A REFUSED TAG IS LEFT AS IT WAS.** Revit refusing the move, or accepting
  it and reading the head back more than half a paper millimetre away, both
  put the tag's head, leader and end condition back. A kept free leader end is
  read back after the move, and one that travelled with the head is named in
  leaderNotAsAsked.

  **EVERYTHING HANDED IN IS ACCOUNTED FOR.** Tags of a category not asked for,
  tags in another view and things that are not tags are left alone and
  counted, never skipped silently.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

# HOW VERSION 2 TURNS A TAG - kept as a comment, not in the purpose, because
# the search reads the purpose and these words moved the card's own version 1
# sentences to STACK_TAGS and FORCE_TAG_LEADER_LSHAPE (row 5b-484).
#
# **TURNING IS ONE CHOICE OF FOUR, OR NONE.** orientHorizontal,
# orientVertical, orientModel or orientToHost; none of them leaves each tag
# turned as it was, and two at once is refused. orientToHost reads the way
# the tag's element runs IN THE VIEW - a family's hand direction, which runs
# along the wall for an opening or a door hosted in one, else its facing
# turned a quarter, else the line of a duct, pipe or wall, else the wall an
# opening is cut in - and turns the tag Horizontal along the view's right and
# Vertical along its up. Between the two it takes the nearer and names the
# tag in offAxis; at exactly 45 degrees, and for a room or a riser seen
# end-on, it leaves the orientation and names the tag in noDirection.
# **Model is an element tag's from Revit 2022 only**: 2020 and 2021 have no
# such value for it, and such a tag is refused and left as it was. A room,
# space or area tag takes Horizontal, Vertical and Model on every release.
# Each tag is turned before its head is placed, and its orientation is read
# back: one Revit keeps the other way - a tag family that turns with its
# element, for one - is put back whole and named in refused.
#
# **keepHead LEAVES EACH HEAD WHERE IT IS**, so a tag can be turned, or its
# leader changed, without moving it. Both offsets must then be 0, and
# keepHead with no orientation and the leader kept is refused as asking for
# nothing. TAG_ELEMENTS_IN_VIEW places new tags Horizontal; it is PROVEN and
# was not widened, so a tag wanted turned is placed there and turned here.

contract:
  needs:
    - name: doc
      type: Document
    - name: view
      type: View
      source: request
    - name: elements
      type: IList<Element>
    # Tag category names as Revit shows them - "Air Terminal Tags, Duct Tags" -
    # or the word all. A tag of any other category is left alone and counted.
    - name: tagCategories
      type: IList<string>
      source: request
    # PAPER millimetres along the view's right and up. Negative goes left or
    # down. Multiplied by the view's scale here, never before.
    - name: offsetRightMm
      type: double
      source: request
    - name: offsetUpMm
      type: double
      source: request
    # true - leader on with its end attached; false - no leader; keep - each
    # leader left as it is.
    - name: addLeader
      type: string
      source: request
    # VERSION 2 - THE ORIENTATION, ONE CHOICE OF FOUR. Each is an optional
    # bool: absent is false, so a caller that names none of them leaves every
    # tag turned as it is, exactly as version 1 did. `optional: true` is what
    # lets it be left out - the binder refuses any other absent value
    # (HeronBindingNote.AbsentValue). Two given true is refused.
    - name: orientHorizontal
      type: bool
      source: request
      optional: true
    - name: orientVertical
      type: bool
      source: request
      optional: true
    # Revit's Model orientation. An element tag has it from 2022 only; a room,
    # space or area tag on every release.
    - name: orientModel
      type: bool
      source: request
      optional: true
    # The way the tag's own element runs in this view: along its right is
    # Horizontal, along its up Vertical, the nearer between.
    - name: orientToHost
      type: bool
      source: request
      optional: true
    # true leaves each head where it is - turn the tags, or change their
    # leader, without moving them. Both offsets must then be 0. Absent is
    # false: the tags move, as version 1 did.
    - name: keepHead
      type: bool
      source: request
      optional: true
  provides:
    - name: moved
      # Tags written - moved, turned or their leader changed - and read back
      # as asked.
      role: result
      type: int
    - name: turned
      # Of those, the tags whose orientation was changed and read back as
      # asked.
      role: result
      type: int
    - name: leadersOn
      # Tags carrying a leader after the run, among those moved or already
      # there - read back from each tag, never the request echoed.
      role: result
      type: int
    - name: report
      # ONE STRING, because a list reaches the chat as three entries cut short
      # and the cut part is where the viewport and the reasons are. PROSE ABOUT
      # THE RUN, written whatever it found - so accounting, not a result: a
      # negative that moved nothing still says so, and must still read empty
      # (D-52). `moved` and `leadersOn` are what is judged.
      role: accounting
      type: string
    - name: viewportKept
      # Each viewport of the view: its box centre before and after on the
      # paper, and whether it was put back. Written on every run, so
      # accounting for the same reason as `report` (D-52).
      role: accounting
      type: string
    - name: alreadyThere
      # Tags that were at the target with the leader and the orientation as
      # asked, so nothing was written. The prior state, never a change (D-52).
      role: accounting
      type: IList<ElementId>
    - name: fromBoxCentre
      # How many were measured from their element's box centre because it has
      # no point or line. About HOW it measured, never a tag it found (D-52).
      role: accounting
      type: int
    - name: noHostLocation
      # Tags whose element could not be found or located - an orphan, or one
      # in a link that is not loaded. Given and unusable (D-52).
      role: accounting
      type: IList<ElementId>
    - name: noDirection
      # orientToHost asked, and the element has no way it runs in this view -
      # a room, a riser seen end-on, one at exactly 45 degrees. Orientation
      # left as it was; the move and the leader still done (D-52).
      role: accounting
      type: IList<ElementId>
    - name: offAxis
      # orientToHost turned these to the nearer of Horizontal and Vertical
      # while their element runs more than a degree off both. About HOW it
      # turned them, never a tag it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: leaderNotAsAsked
      # Moved, but the leader reads back other than asked - an end Revit
      # would not attach. Named, not counted as a clean move (D-52).
      role: accounting
      type: IList<ElementId>
    - name: notTags
      # Handed in but not tags. Given and unusable (D-52).
      role: accounting
      type: IList<ElementId>
    - name: otherCategory
      # Tags of a category not asked for, left alone. The negative case.
      role: accounting
      type: IList<ElementId>
    - name: notInView
      # Tags that belong to another view than the one named. Left alone.
      role: accounting
      type: IList<ElementId>
    - name: notSupported
      # Tags that point at several elements (2022 on). Left alone (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Revit refused the move, the head read back more than half a paper
      # millimetre off, the orientation read back other than asked, or Model
      # was asked of an element tag before 2022. Each is put back as it was
      # (D-52).
      role: accounting
      type: IList<ElementId>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  A RUN-TIME split at 2022 for what a tag points at and for a free leader end,
  with NO version #if: the add-in compiles fragments without release symbols,
  so an #if always takes its #else, which calls members 2020 and 2021 lack
  (row 5b-181). Each member is looked up by name on the tag - 2022 on,
  `GetTaggedElementIds`, `GetTaggedReferences`, `GetLeaderEnd` and
  `SetLeaderEnd`; 2020 and 2021, the singular `TaggedElementId` and
  `LeaderEnd`, which are gone after 2022.
  `TagHeadPosition`, `HasLeader`, `LeaderEndCondition` and
  `CanLeaderEndConditionBeAssigned` on IndependentTag, and `TagHeadPosition`
  and `HasLeader` on SpatialElementTag, are present 2020 through 2027, as are
  `RoomTag.TaggedRoomId` and `Room`, `SpaceTag.Space`, `AreaTag.Area`,
  `LinkElementId`'s three ids, `Viewport.GetBoxCenter`, `SetBoxCenter`,
  `GetBoxOutline`, `SheetId` and `ViewId` - all read from the reference assemblies for each
  release with `tools/api-surface --members` on 2026-09-27. A room tag has no
  `LeaderEndCondition` on any release.
  VERSION 2, read the same way on 2026-10-15, one release at a time:
  `IndependentTag.TagOrientation` (get and set) is on every release 2020 to
  2027, and the `TagOrientation` enum has Horizontal = 0 and Vertical = 1 on
  all eight but AnyModelDirection = 2 - Revit's "Model" - from 2022 only.
  So Model is set by NUMBER, `(TagOrientation)2`, and only where
  `Enum.IsDefined` finds it: named in source, it would not compile on 2020 or
  2021. `SpatialElementTag.TagOrientation` (get and set) is on every release,
  typed `SpatialElementTagOrientation` with Horizontal = 0, Vertical = 1 and
  Model = 2 on all eight - so a room, space or area tag can be turned all
  three ways from 2020. `RotationAngle` on both kinds is 2022 on and is not
  used. `FamilyInstance.HandOrientation` and `FacingOrientation`,
  `Opening.Host`, `Curve.ComputeDerivatives` and `Transform.OfVector` are
  present 2020 through 2027. Which value Revit then ACCEPTS for a given tag
  family is not in any assembly - it is read back on every tag.

# ROUTING - the same rows are in the fragments named here.
#
#   "move the tags beside the diffusers"   -> here, with the offset as values
#   "offset the duct tags with a leader"   -> here
#   "move the tags off the elements"       -> here
#   "the tags are on top of each other"    -> FIND_OVERLAPPING_TAGS to see
#                                             them, ARRANGE_TAGS to push the
#                                             clashing TAGS apart. This one
#                                             moves each tag off its ELEMENT,
#                                             by a distance the caller names
#   "separate the overlapping tags"        -> ARRANGE_TAGS or
#                                             FIND_OVERLAPPING_TAGS - never
#                                             here (checked 2026-09-27)
#   "stack the tags at the side"           -> STACK_TAGS
#   "move this tag here"                   -> MOVE_ANNOTATION - one point for
#                                             every tag handed in
#   "put the room tags back in the middle" -> CENTER_ROOM_TAGS
#   "make the leaders L-shaped"            -> FORCE_TAG_LEADER_LSHAPE, which
#                                             bends a leader and leaves the
#                                             head where it is
#   "turn this tag vertical"               -> here, orientVertical with
#                                             keepHead and both offsets 0
#   "make the tags follow the opening direction"
#                                          -> here, orientToHost
#   "rotate the tag to match the wall"     -> here, orientToHost - a TAG is
#                                             turned here; the ELEMENT itself
#                                             is turned by ROTATE_ELEMENTS
#   "line the tags up vertically",
#   "align the tags vertically",
#   "put the tags in a vertical line"      -> STACK_TAGS - a column of tags,
#                                             never a tag turned on its side.
#                                             The second is declared there: this
#                                             card took it on the re-ranker once
#                                             it turned tags. The third still
#                                             reaches here on the re-ranker -
#                                             declared there, it pulled "which
#                                             tags are vertical" onto STACK_TAGS
#                                             on lexical (row 5b-484)

utterances:
  - move the tags beside the diffusers
  - offset the duct tags with a leader
  - move the tags off the elements
  - move each tag 8 mm right and 6 mm up from its element
  - turn this tag vertical
  - make the tags follow the opening direction
  - rotate the tag to match the wall
  - give each tag the same orientation as its opening

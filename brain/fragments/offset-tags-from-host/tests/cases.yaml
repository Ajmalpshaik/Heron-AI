positive:
  - given: >
      the 90 air terminal tags on FloorPlan "Level 1 - Air Terminal Layout" (1:75), fed by
      SELECT_BY_CATEGORY_NAME categoryName Air Terminal Tags inViewOnly that view, with
      tagCategories Air Terminal Tags, offsetRightMm 8, offsetUpMm 6 and addLeader true
    expect: >
      moved 90, leadersOn 90, every moved head within half a paper millimetre of its
      diffuser's point plus 600 mm right and 450 mm up, and the viewport on M-104 reading the
      same box centre before and after - or put back, and said so, in the same undo

  - given: the same request run a second time, straight after
    expect: >
      moved 0, alreadyThere 90, leadersOn 90. THIS IS THE READ-BACK: the target is measured
      from the element, so a second run computes the same target and finds every tag there

  - given: duct tags on a plan, addLeader keep, offsetRightMm 0 and offsetUpMm 5
    expect: >
      each tag 5 mm above the middle of its own duct on paper, and any free leader end still
      where it pointed before - not dragged along with the head

  - given: room tags on a plan, tagCategories Room Tags, addLeader true
    expect: >
      moved by their head, leader on, the leader end left in the room, and nothing in
      leaderNotAsAsked - a room tag has no end condition to attach

  # VERSION 2 - TURNING (2026-10-15, row 5b-484, NEEDS-CHECKING Group EG).
  - given: >
      four Horizontal door tags, one door in each wall of a rectangle on an unrotated plan -
      two walls east-west, two north-south - with orientToHost true, keepHead true, both
      offsets 0 and addLeader keep
    expect: >
      turned 2 and alreadyThere 2: the tags of the doors in the north-south walls read back
      Vertical, the other two stay Horizontal; every head where it was; offAxis and
      noDirection empty

  - given: the same four door tags with orientVertical true and keepHead true
    expect: turned 4, every one read back Vertical, every head where it was

  - given: >
      the real job - cut-out tags moved inside the building with addLeader false, an offset,
      and orientToHost true
    expect: >
      each tag moved by the offset from its own opening AND turned the way its opening's wall
      runs; every moved head within half a paper millimetre of its target, read back after
      the turn

  - given: a room tag with orientVertical true and keepHead true
    expect: turned 1, read back Vertical - a room tag's own orientation, on every release

  - given: an element tag with orientModel true on Revit 2022 or later
    expect: turned, read back Model

  - given: a duct drawn at 30 degrees to the view's right, its tag with orientToHost true
    expect: turned Horizontal, the nearer, and named in offAxis with its 30 degrees

negative:
  - given: orientHorizontal true and orientVertical true together
    expect: refused as two orientations at once, naming both, and nothing moved or turned

  - given: keepHead true with offsetRightMm 8
    expect: refused - the head cannot stay where it is and move 8 mm - and nothing moved

  - given: keepHead true, no orientation, addLeader keep
    expect: refused as asking for no change, and nothing moved

  - given: room tags with orientToHost true, keepHead true and addLeader keep
    expect: noDirection naming every one, moved 0, turned 0 - a room runs no way

  - given: an element tag with orientModel true on Revit 2020 or 2021
    expect: >
      refused, saying an element tag has no Model orientation before 2022, and the tag left
      as it was - not moved either

  - given: >
      a tag whose family turns with its element, asked to turn the other way
    expect: >
      refused with the orientation it read back, and put back whole - head, leader and
      orientation as they were

  - given: >
      the same 90 air terminal tags handed in, with tagCategories Duct Tags. THIS IS THE
      FIRST NEGATIVE TO RUN
    expect: >
      moved 0 and otherCategory 90 - every tag left where it was and counted, not skipped
      silently and not moved

  - given: the air terminals themselves handed in instead of their tags
    expect: notTags 90, moved 0, nothing changed

  - given: tags of another view handed in with this view named
    expect: notInView naming them, moved 0

  - given: addLeader maybe
    expect: refused as not understood, with the three words it takes, and nothing moved

  - given: a 2022-or-later tag that points at two elements
    expect: named in notSupported and left where it was

second_route:
  - >
    Revit's own Tag properties on a moved tag: Leader checked, Leader End Condition Attached;
    and the tag head measured on the sheet from its diffuser's insertion point with Revit's
    measure tool - 8 mm right and 6 mm up on paper
  - >
    Version 2: Revit's own Properties on a turned tag - Orientation reads Vertical (or
    Horizontal, or Model) - and on screen its text reads up the sheet, along its door's wall

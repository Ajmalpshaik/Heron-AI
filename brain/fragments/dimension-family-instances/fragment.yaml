id: FRG-VIEW-031
semantic-identity: "put one dimension string through these air terminals or equipment, along an axis"
kind: action
domain: revit.views
capability: DIMENSION_FAMILY_INSTANCES
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Draws ONE aligned dimension string through a set of family instances - air
  terminals, fixtures, equipment - along a chosen axis, so the spacing reads on
  the drawing.

  **IT CANNOT DIMENSION A ROOM**, and "dimension the rooms" is a sentence that
  reaches it:

  | What you meant | What happens |
  |---|---|
  | "dimension the rooms", "put the room sizes on the plan" | **nothing here does that yet** - not this fragment |
  | "how big is room 4", "what are the room sizes" - to know | `MEASURE_ROOM_DIMENSIONS`, read-only |

  A room's boundary is not a family instance and offers none of the references
  this works from. Dimensioning the nearest thing it CAN reach - the fixtures
  inside the room - would put a real dimension string on a real drawing that
  nobody asked for, which is worse than doing nothing. That fragment carries the
  same table.

  DIMENSIONING NEEDS A GEOMETRY REFERENCE, NOT A POINT, and which reference is
  available depends entirely on what kind of thing is being dimensioned. That is
  why this is not one fragment but two, and why the wrong one returns nothing
  rather than a worse dimension:

  | What you are dimensioning | Use |
  |---|---|
  | Air terminals, fixtures, equipment — any family instance | **this fragment** |
  | Ducts, pipes, conduit, cable tray | `DIMENSION_MEP_RUNS` — it walks the geometry, which is the only route that works for a run |

  **MEASURED, AND THE MEASUREMENT'S FIRST CONCLUSION WAS TOO BROAD.** A family
  instance exposes built-in centre references, and stock content really does
  carry them - a supply diffuser reports one CenterLeftRight and one
  CenterFrontBack. Duct fittings and accessories report **all four zero**, and
  the conclusion drawn from that was *"MEP cannot be dimensioned"*. It was
  wrong: that is true of THIS ROUTE, not of MEP as a subject. Ducts and pipes
  are dimensionable by walking their geometry, which is what the other fragment
  does. So a zero here means *"use the other one"*, never *"it cannot be done"*.

  ELEMENTS WITH NO USABLE REFERENCE ARE REPORTED BY ID, and if fewer than two
  survive, NO dimension is created. A one-reference dimension is degenerate:
  Revit may accept it and drop it at commit, which is a change that appears to
  work and is not there afterwards.

  THE READ-BACK MUST NOT USE `Dimension.Curve`. It throws *"The input curve is
  not bound"* on a dimension that was just created - the obvious way to check
  the result is the one way that cannot be used. `NumberOfSegments` and
  `References` are read instead.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: view
      type: View
      source: request
    - name: axis
      type: string
      source: request
    - name: offsetMm
      type: double
      source: request
  provides:
    - name: dimensionId
      role: result
      type: ElementId
    - name: dimensionedCount
      role: result
      type: int
    - name: noReference
      # Instances publishing no centre reference, so there was nothing to
      # dimension TO. *The wrong one returns nothing rather than a worse
      # dimension* - given and unusable, never a dimension it made (D-52).
      role: accounting
      type: IList<ElementId>
    - name: problem
      # The sentence saying what stopped it. The evidence it looked and could
      # not, never a dimension it made (D-52).
      role: accounting
      type: string


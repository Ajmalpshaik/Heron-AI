revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `FamilyInstance.GetReferences`, the
  `FamilyInstanceReferenceType` members used, `Document.Create.NewDimension` and
  `ReferenceArray` are unchanged 2020 to 2027. Millimetres become Revit's
  internal feet by dividing by 304.8 - plain arithmetic, exact on every release,
  and deliberately NOT a units API call, which is what keeps this clear of the
  2021 units move.

utterances:
  - dimension between the terminals
  - put a dimension through these diffusers
  - how far apart are these on the drawing
  - add a dimension string to the equipment
  - dimension the spacing of these
  - show the spacing on the drawing

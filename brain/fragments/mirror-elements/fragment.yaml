id: FRG-GEO-009
semantic-identity: "mirror these elements across a vertical plane"
kind: action
domain: revit.geometry
capability: MIRROR_ELEMENTS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Mirrors elements across a vertical plane drawn through two points in plan -
  the usual job being a room laid out as the reflection of the one next door.

  It can mirror in place or leave the originals and produce mirrored copies.
  The copy mode is the safer one and the one that composes: it hands back the
  new ids, so the next step can work on the reflection alone.

  **Mirroring CONNECTED MEP in place does not do what it looks like.** Revit
  keeps the connections and re-fits the geometry around them, so a duct run
  mirrored without its fittings comes back as a constrained shape rather than a
  reflection. Include the fittings, or mirror as a copy.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: planeFrom
      type: XYZ
      source: request
    - name: planeTo
      type: XYZ
      source: request
    - name: asCopy
      type: bool
      source: request
  provides:
    - name: copies
      role: result
      type: IList<ElementId>
    - name: mirrored
      role: result
      type: int
    - name: degenerate
      # That the two points given do not define a plane, so there was nothing
      # to mirror across. A refusal, never a mirror it made (D-52).
      role: accounting
      type: bool


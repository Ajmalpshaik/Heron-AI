id: FRG-PAR-003
semantic-identity: "write one parameter value onto these elements"
kind: action
domain: revit.parameters
capability: WRITE_ELEMENT_PARAMETERS
version: 5
source: OFFICIAL
risk: MODIFY

purpose: >
  Writes one named parameter on many elements, and reports every element it did
  NOT write and why - read-only, absent, a name two of its parameters share, or
  a kind this fragment refuses.

  It is the write half of FRG-PAR-001's read, and it takes the value as TEXT on
  purpose. A number alone cannot be written safely: Revit stores lengths in
  decimal feet, and the same fragment is asked to set an airflow, an area and a
  comment. See the implementation note - this is the decision most likely to be
  "improved" by somebody who has not hit it.

  **It reports what the MODEL holds, not what was asked for.** Revit accepts a
  size and then snaps it to the nearest size its type allows - the set returns
  TRUE, nothing throws, and a pipe asked for 77 comes out 80. Version 1 trusted
  that return value and would have reported a clean success over a different
  number. `snapped` is that case, named and carrying ids.

  **Version 3 refuses a name that two parameters share.** A shared or project
  parameter can be bound beside a built-in one of the same name, and a curtain
  wall type carries its grid and mullion settings once for each direction. Revit's
  lookup by name then returns one of them - at random, in Autodesk's own words -
  and the read-back, looking the name up the same way, would have confirmed
  whichever it was. Such an element is reported in `ambiguous` and nothing on it
  is touched (D-54 s3, FRAGMENT-ISSUES 5b-203). Version 2's proof was taken
  before this and no longer describes the code, so it is kept as a record and
  the fragment is DRAFT until it is proved again.

  **Version 4 writes a Yes/No parameter.** Revit keeps a tick box as the
  number 1 or 0, so version 3 sent it through `SetValueString`, which returned
  false for it: one tick box on 15 units was refused all 15 times with `No`,
  and again with `0` (FRAGMENT-ISSUES 5b-247). It now finds a Yes/No parameter
  first, on every release from 2020, and takes Yes/No, True/False, On/Off, 1/0
  and Ticked/Unticked in any case - anything else is refused and `findings`
  names the value and those words. The read-back is unchanged: `AsInteger`
  after the regeneration must equal what was asked. An element already holding
  the value is left alone and counted in `alreadyThat`, so a second run
  changes nothing and says so. Text, numbers and element references go exactly
  the way they went in version 3; `alreadyThat` is filled for a tick box only.

  **Version 5 takes a material, a level or a family type by name.**

  ASSUMES AN OPEN TRANSACTION and does not open one. Golden Rule 16 puts the
  TransactionGroup at the OPERATION, so that one user action is one undo; a
  fragment that opened its own would add a second entry to the undo stack and
  break exactly the rule it looks like it is obeying.

# VERSION 5 - FRAGMENT-ISSUES 5b-1221. Measured 2026-10-19 on Revit 2020: a
# mullion type's Material (twisting tower) and a column type's Material (the
# owner's Kerala house, M_Round Column, <By Category>) could not be given a
# material - a parameter holding another element was refused here, and
# IMPORT_PARAMETER_VALUES handed the name to SetValueString, which takes none.
# Now the value is a NAME: a material or a level by its Name, a family type as
# "Family: Type", matched exactly. What it may name is narrowed first - by what
# the parameter holds now (a type: that category's types only), else by its
# definition (Material; FamilyType on 2020 and 2021), else all three kinds -
# and a name matching none, or two, is refused with a finding that says which.
# After the one regeneration the id Revit holds must be the id the name named,
# or the element is in `snapped`. Every other storage type is version 4's road.
# Version 4's proof below no longer describes the code: DRAFT until Group HP.
contract:
  needs:
    # Needed for the ONE regeneration that makes the snap visible. Without it
    # this fragment can only report what it asked for.
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: parameterName
      type: string
      source: request
    - name: value
      type: string
      source: request
  provides:
    # Written AND read back as the value asked for. Nothing else counts here.
    - name: written
      role: result
      type: int
    # Accepted, then changed by Revit - almost always a size snapped to the
    # type's size table. Carries ids, because "two were snapped" is a fact
    # nobody can act on.
    - name: snapped
      # Elements where Revit stored a DIFFERENT value from the one asked for -
      # a size snapped to the type's table. Named and carrying ids, because
      # the set returns true and nothing is thrown.
      role: result
      type: IList<ElementId>
    # The read-back could not be run. Not written, and never assumed away.
    - name: unverified
      # Elements whose value could not be read back to confirm. The evidence
      # it could not check, never a confirmed write (D-52).
      role: accounting
      type: IList<ElementId>
    - name: readOnly
      # Elements whose parameter will not take a write. Given and unusable,
      # never a write it made (D-52).
      role: accounting
      type: IList<ElementId>
    - name: absent
      # Elements that do not carry the parameter at all. The evidence it
      # looked, never a value it wrote (D-52).
      role: accounting
      type: IList<ElementId>
    - name: ambiguous
      # Elements carrying TWO OR MORE parameters by this name, where Revit's
      # lookup would pick one at random. Nothing is written to them: which one
      # was meant is the modeller's to say, not this fragment's to guess
      # (D-54 s3, FRAGMENT-ISSUES 5b-203). Turned down, never found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>
    - name: alreadyThat
      # Elements whose Yes/No parameter ALREADY held the value asked for, so
      # nothing was written to them. The evidence it looked, never a change
      # it made (D-52). A tick box only, since version 4.
      role: accounting
      type: IList<ElementId>
    - name: findings
      # Why a value was turned down, in words - a value that is not a Yes/No
      # word on a Yes/No parameter, naming it and the words that are; and
      # since version 5 a name that names no material, level or family type,
      # or names two, with the reason.
      # A sentence about a refusal, never a thing found (D-52).
      role: accounting
      type: IList<string>


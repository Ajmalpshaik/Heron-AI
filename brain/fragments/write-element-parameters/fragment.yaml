compatibility-note: >
  One implementation for every release, and the units API is the reason there
  is only one. `SetValueString` parses in the DOCUMENT's own display units and
  has been unchanged from 2020 to 2027, while everything around it moved:
  `DisplayUnitType` became `ForgeTypeId` in 2021, and `ParameterType` became
  `GetDataType()` in 2022. The write itself touches none of them, so there is
  no `#if` and no version branch to keep in step.

  Since version 4 one question does cross that line: is this parameter a
  Yes/No? It is asked by REFLECTION, not by `#if` - `Definition.GetDataType()`
  compared with `SpecTypeId.Boolean.YesNo` where the running Revit has them
  (2022 on), `Definition.ParameterType` read as `YesNo` where it has not (2020,
  2021). Read from the reference assemblies of all eight releases on
  2026-09-27: `ParameterType` is in 2020 to 2022 and gone from 2023, and
  `GetDataType` and `SpecTypeId.Boolean.YesNo` are in 2022 to 2027, so every
  release answers by one of the two. The add-in compiles fragments with no release symbols (5b-181), so an
  `#if` would pick the same branch on every release. `set-family-type-values`
  reads a family parameter's kind the same way. `Parameter.Set(int)`,
  `HasValue` and `AsInteger` are unchanged from 2020 to 2027.

  The read-back is version-safe for the same reason: it compares two internal
  doubles from `AsDouble`/`AsInteger`, never a formatted string. Comparing
  `AsValueString` against the user's text would have dragged the display units,
  the thousands separator and the project's decimal-places setting into a check
  that needs none of them.

  Since row 5b-1221 an element reference takes a name. `Parameter.Set(ElementId)`,
  `AsElementId`, `ElementType.FamilyName`, `FilteredElementCollector.OfClass`
  and `WhereElementIsElementType` are unchanged 2020 to 2027. What a reference
  holding <By Category> may name is read by reflection, like the Yes/No:
  `SpecTypeId.Reference.Material` from 2022 (read in the 2023 reference
  assembly), `ParameterType.Material` and `ParameterType.FamilyType` on 2020
  and 2021 (read in the 2020 one). No `ElementId` is built from a number.

# ROUTING - the same rows are in the fragments named here.
#
#   "fill in the mark"               -> here - the parameter already exists
#   "set the comments to X"          -> here - one stated value. Declared
#                                       2026-10-17 (row 5b-943):
#                                       COPY_PARAMETER_VALUE's row sent it
#                                       here, and the search did not -
#                                       EDIT_PARAMETER_TEXT on main, and
#                                       REPORT_BOUNDING_BOX once a card
#                                       elsewhere changed status
#   "add a project parameter"        -> ADD_PROJECT_PARAMETER - it MAKES the
#                                       parameter and writes no values
#   "make the new type 300 wide"     -> here, on the type DUPLICATE_TYPE made

#   "clear the value out of this parameter" -> REMOVE_PARAMETER_VALUE - this
#                                        one takes TEXT, and an empty string
#                                        clears a text field but NOT a length,
#                                        a number or an element reference
#   "put the room name on all the equipment" -> ASSIGN_LOCATION_DATA - it WORKS
#                                        OUT a different value per element
#   "list the rooms and their numbers"   -> REPORT_ROOM_SPACE_DATA
#   "add a prefix to what is already     -> EDIT_PARAMETER_TEXT. This one
#    there"                                 writes one fixed value over
#                                           every element
#   "set the curtain wall grid spacing"  -> SET_CURTAIN_WALL_GRID. Layout and
#                                           Spacing appear once per direction
#                                           on a curtain wall type, so this one
#                                           refuses them as a shared name
#                                           (5b-203); that one reaches each by
#                                           Revit's own parameter id
#   "change the mullion type on the      -> SET_CURTAIN_WALL_MULLIONS. The same
#    curtain wall"                          shared names, which this one
#                                           refuses as ambiguous - even though
#                                           an element reference takes a name
#                                           since version 5

utterances:
  - set the comments on these
  - set the comments to X
  - write the airflow back
  - fill in the parameter
  - update the mark on all of them
  - put 500 in the flow parameter
  - set the room number
  - fill in the mark
  - make the new type 300 wide
  # A Yes/No parameter - a tick box in Properties. Version 4 (5b-247).
  - turn off show clearance
  - untick show clearance
  - untick the parameter on these
  - set the parameter to yes

compatibility-note: >
  One implementation for every release, and the units API is the reason there
  is only one. `SetValueString` parses in the DOCUMENT's own display units and
  has been unchanged from 2020 to 2027, while everything around it moved:
  `DisplayUnitType` became `ForgeTypeId` in 2021, and `ParameterType` became
  `GetDataType()` in 2022. This fragment touches none of them, so there is no
  `#if` and no version branch to keep in step.

  The read-back is version-safe for the same reason: it compares two internal
  doubles from `AsDouble`/`AsInteger`, never a formatted string. Comparing
  `AsValueString` against the user's text would have dragged the display units,
  the thousands separator and the project's decimal-places setting into a check
  that needs none of them.

# ROUTING - the same rows are in the fragments named here.
#
#   "fill in the mark"               -> here - the parameter already exists
#   "add a project parameter"        -> ADD_PROJECT_PARAMETER - it MAKES the
#                                       parameter and writes no values
#   "make the new type 300 wide"     -> here, on the type DUPLICATE_TYPE made

#   "clear the value out of this parameter" -> REMOVE_PARAMETER_VALUE - this
#                                        one takes TEXT, and an empty string
#                                        clears a text field but NOT a length,
#                                        a number or an element reference
#   "put the room name on all the equipment" -> ASSIGN_LOCATION_DATA - it WORKS
#                                        OUT a different value per element
#   "list the rooms and their numbers"   -> REPORT_ROOM_SPACE_DATA
#   "add a prefix to what is already     -> EDIT_PARAMETER_TEXT. This one
#    there"                                 writes one fixed value over
#                                           every element


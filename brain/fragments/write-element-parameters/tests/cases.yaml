# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: 4 ducts and an editable text parameter (Comments)
    expect: written = 4, and the value readable in Revit's own properties palette

  - given: 4 Spaces and a NUMERIC parameter, value typed as the user would type it
    expect: >
      written = 4, and the number shown in Revit MATCHES WHAT WAS TYPED. This is
      the case the whole design rests on - if a length comes back 304.8 times too
      small or too large, SetValueString is not doing what this fragment claims.
      Since version 2 the FRAGMENT checks this too rather than leaving it to the
      person running the proof: `written` now means written AND read back

  - given: the same numeric write, with the project's units set to something else
    expect: >
      still matches what the user typed, because the parse follows the document.
      Without this row the units claim is untested

negative:
  - given: 4 elements that do not have the named parameter at all
    expect: >
      written = 0 and all 4 in `absent`. NOT an exception, and NOT reported as a
      successful write of nothing

  - given: a read-only parameter, such as a computed area
    expect: written = 0 and all in `readOnly`, kept apart from `absent`

  - given: text that cannot be parsed as a number, on a numeric parameter
    expect: >
      written = 0 and the element in `refused`. SetValueString returns false
      here rather than throwing, so a fragment that ignored the return value
      would report a clean success having changed nothing - which is exactly
      the failure D-30 exists to catch

  - given: a parameter that stores an ElementId, such as a Level
    expect: refused, by name. Never resolved from text by guessing

  # THE CASE VERSION 1 COULD NOT HAVE PASSED, and the reason for version 2.
  - given: >
      a pipe or duct Diameter set to a size the type does NOT carry - 77 when the
      type's size table holds 80. The set returns TRUE and nothing throws
    expect: >
      written = 0 and the element in `snapped`. NOT counted as written. This is
      the whole point: a true return value is not evidence, and the earlier
      library measured this exact number - 77 asked, 80 stored, true returned

  - given: the same snap case, but read back BEFORE any regeneration
    expect: >
      the parameter still reports 77 - which is why the check regenerates first.
      This row exists so that anybody 'simplifying' the regeneration away has to
      delete a proof case saying it is load-bearing

  - given: a batch of 40 elements where 3 snap and 37 do not
    expect: >
      written = 37, `snapped` carries exactly the 3 ids, and ONE regeneration
      ran - not 40. Verify the count by timing if nothing else exposes it

second_route:
  - a Revit schedule of the same parameter, read after the write
  - >
    for a snap, read the size in Revit's own properties palette - it must show
    the SNAPPED value, and `written` must not have counted it
  - one Ctrl+Z must put every element back in a single step (Golden Rule 16)

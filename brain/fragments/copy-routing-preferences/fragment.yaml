id: FRG-MEP-050
semantic-identity: "give this pipe type the same fittings another one already uses"
kind: action
domain: revit.mep
capability: COPY_ROUTING_PREFERENCES
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Copies the fitting rules of one pipe or duct type onto another - the elbow,
  tee, cross, transition, union, joint and cap it inserts, with the size
  window each rule covers. The "make this type behave like that one" job,
  which SET_ROUTING_PREFERENCE cannot do because it replaces ONE rule and a
  group often holds several.

  **A GROUP HOLDS MORE THAN ONE RULE, AND THAT IS THE REASON THIS EXISTS.** A
  real copper type carries a full tee AND a reduced tee under Junctions, each
  covering different sizes. Replacing rule 0 leaves the second rule untouched
  and the type half-converted - which draws correctly until somebody reduces a
  branch.

  **SEGMENTS IS EXCLUDED UNLESS IT IS NAMED.** The segment carries the
  MATERIAL and the size table, so copying it silently replaces what a type is
  made of - and on a type somebody has just pointed at their own segment, that
  undoes the work without a word. Fittings are what "same fittings" means;
  material is a separate decision, and SET_ROUTING_PREFERENCE is where it is
  made.

  **EVERYTHING IS READ AND CHECKED BEFORE ANYTHING IS CLEARED.** A group is
  rebuilt by removing every rule and adding the new ones, so a failure halfway
  leaves it EMPTY - and an empty group inserts no fitting at all, with no
  error and no warning. So every source rule is resolved first, and a group
  whose parts cannot all be resolved is left exactly as it was.

  **A RULE POINTING AT AN UNLOADED FAMILY IS SKIPPED AND NAMED.** The source
  may carry a rule whose family is gone - a real case, seen on
  TCM_PIP_T031_Copper_Tee_Gas's MechanicalJoints. Copying that id would write
  a rule the target cannot use either, so it is reported rather than carried.

  **THE SIZE WINDOW TRAVELS WITH THE RULE.** A rebuilt rule with no criterion
  covers every size, and a size outside every rule's range gets NO fitting at
  all. Each criterion is read off the source rule and put on the new one, and
  the count is reported.

  **READ BACK, NEVER TRUST THE CALL.** AddRule returns nothing and throws
  nothing when a part is wrong for a group, so each group's rules are counted
  again afterwards and compared with what was asked for.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16), so
  copying every group is one undo entry.

contract:
  needs:
    - name: doc
      type: Document
    # The types to change. Editing a type changes every element of it.
    - name: elements
      type: IList<Element>
    - name: sourceTypeName
      type: string
      source: request
    # Which groups to copy, comma separated - "Elbows, Junctions". Empty means
    # every FITTING group and never Segments. Naming Segments explicitly is
    # the only way it is copied.
    - name: groups
      type: string
      source: request
  provides:
    - name: rulesCopied
      role: result
      type: int
    - name: groupsCopied
      role: result
      type: int
    - name: typesTouched
      # Types whose preferences were examined. Counted apart from the rules,
      # because editing ONE type changes every element of it.
      role: result
      type: int
    - name: summary
      # What each group ended up with, on ONE line. A list is abbreviated to
      # three entries before a reader sees it, and eight groups then read as
      # three.
      role: result
      type: string
    - name: skipped
      # Source rules NOT copied, named with why - an unloaded family, a part
      # the target cannot resolve. The evidence it looked, never a rule it
      # wrote (D-52).
      role: accounting
      type: IList<string>
    - name: notRoutable
      # Things handed in that are not a pipe or duct type. The evidence it
      # looked (D-52).
      role: accounting
      type: IList<string>
    - name: unverified
      # Groups whose rule count did not read back as asked for. Never counted
      # as copied.
      role: accounting
      type: IList<string>
    - name: findings
      type: IList<string>


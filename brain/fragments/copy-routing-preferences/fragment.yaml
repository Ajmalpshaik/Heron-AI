compatibility-note: >
  One implementation for every release. `RoutingPreferenceManager.GetRule`,
  `GetNumberOfRules`, `RemoveRule`, `AddRule`, the
  `RoutingPreferenceRule(ElementId, string)` constructor, `AddCriterion` and
  `PrimarySizeCriterion(double, double)` were confirmed present on the 2020
  assembly and in the 2027 metadata on 2026-09-15, and
  `tools/api-surface/changes.json` records no change to the routing API across
  the eight releases.

  Sizes never leave Revit's internal feet - a criterion is read off one rule
  and handed to another - so no units call is made and the 2021 units move is
  never touched.

# ROUTING - repeated in SET_ROUTING_PREFERENCE.
#
#   "give it the same fittings as that type" -> here
#   "use the copper tee family"              -> here, from a type that has it
#   "make this type copper"                  -> SET_ROUTING_PREFERENCE, which
#                                               changes the SEGMENT
#   "what fitting will this insert"          -> REPORT_ROUTING_PREFERENCES

utterances:
  - give this type the same fittings as that one
  - copy the routing preferences from that type
  - set the same families for the tees
  - use the same elbows and tees as this type
  - match the fittings of another pipe type

tests: tests/

compatibility-note: >
  `GenericForm.Subcategory { get; set; }` - whose remarks say it takes the
  family category or one of its subcategories - `Family.FamilyCategory`,
  `Category.SubCategories`, `Category.CanAddSubcategory` and
  `Categories.NewSubcategory(parent, name)` read the same 2020 through 2027
  (the RevitAPI reference assemblies and their own XML remarks, read
  2026-10-01). Version 2's `CurveElement.LineStyle { get; set; }`,
  `CurveElement.GetLineStyleIds()`, `Category.GetGraphicsStyle(
  GraphicsStyleType.Projection)` and `GraphicsStyle.GraphicsStyleCategory`
  read the same 2020 through 2027 (`tools/api-surface --members
  --inherited`, 2026-11-11).

# ROUTING - see SET_FAMILY_SETTINGS for the whole family-building table.
#
#   "put the insulation on its own subcategory"  -> here
#   "set the subcategory of these forms"         -> here
#   "put these lines on the Flow Arrow subcategory" -> here, version 2 -
#                                                   detail or symbolic lines
#   "change these lines to the Thin Lines style" -> REMAP_LINE_STYLES, styles
#                                                   under Lines only
#   "make this family an air terminal"           -> SET_FAMILY_SETTINGS, the
#                                                   family's own category
#                                                   (SET_FAMILY_CATEGORY until
#                                                   2026-11-01)
#   "what line weight is the hidden lines subcategory" -> LIST_CATEGORIES - a question goes to the read

utterances:
  - put the insulation on its own subcategory
  - set the subcategory of these forms
  - make a subcategory for the frame and put it on it
  - put this extrusion on the Hidden Lines subcategory
  - put these lines on the Flow Arrow subcategory

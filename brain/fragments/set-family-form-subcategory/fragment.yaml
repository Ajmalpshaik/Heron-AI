id: FRG-VIEW-115
semantic-identity: "put family forms, or detail and symbolic lines already drawn, on a subcategory of the family's category, making it if it is new"
kind: action
domain: revit.families
capability: SET_FAMILY_FORM_SUBCATEGORY
version: 2
source: OFFICIAL
risk: MODIFY

# VERSION 2 (2026-11-11) - DETAIL AND SYMBOLIC LINES TOO, and back to DRAFT.
# Version 1 was PROVEN on 2026-10-03 (the proof block below, kept as the
# record of what it proved: an extrusion put on a new "Insulation", a project
# refused); its C# moved, so it is DRAFT again until NEEDS-CHECKING Group NF
# is run (D-30, D-117). A family's 2D lines took a subcategory only while
# they were drawn (DRAW_FAMILY_DETAIL_LINES, DRAW_FAMILY_SYMBOLIC_LINES).
# Version 2 puts lines already drawn on one by their line style - the
# subcategory's projection style - and refuses by name a style Revit does not
# offer that line (its GetLineStyleIds). REMAP_LINE_STYLES is not this: it
# sees only styles under Lines, never a family's own subcategories. Owner's
# yes to widen rather than add a card: Ajmal PS, 2026-11-11. FRAGMENT-ISSUES
# row 5b-1502.

purpose: >
  Puts forms on a SUBCATEGORY of the family's own category in the family open
  in the Family Editor - the Subcategory field in Properties - so a project can
  colour, hide or line-weight that part of the family on its own: the
  insulation, the hidden parts, the casing, the frame.

  **A SUBCATEGORY THE FAMILY DOES NOT HAVE YET IS MADE**, under the family's
  category, and the answer says it was made - Object Styles in the Family
  Editor is where a modeller makes one by hand. A name that differs only by
  case from one already there is that one, never a second. "none" puts the
  forms back on the family's category itself, which Revit's remarks name as
  the field's other value.

  **A CATEGORY THAT TAKES NO SUBCATEGORIES IS REFUSED BY NAME**, from Revit's
  own flag for it, before anything is made.

  **THE FORMS ARE NAMED BY THEIR IDS** - the ones the form tools gave back,
  commas between - or SELECTED in the family's window and called `selected`.

  **READ BACK, ALL OR NOTHING.** Each form's subcategory is read again after it
  is set, and reported before and after; one that does not read as asked fails
  the call and nothing is kept - the new subcategory included.

  **DETAIL AND SYMBOLIC LINES TOO** (version 2, 2026-11-11) - a plan
  symbol's lines, a detail item's outline, already drawn and named by the ids
  their draw tools gave back or selected. A line is put on the subcategory by
  its LINE STYLE, the subcategory's projection style, which is what its
  Subcategory field sets by hand. A line takes only the styles Revit offers
  it; a subcategory not among them is refused by name, and a new one made for
  it is not kept.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: uidoc
      type: UIDocument
    # The forms, by the ids the form tools gave back, commas between - or
    # `selected`. Version 2: detail and symbolic lines' ids too.
    - name: forms
      type: string
      source: request
    # The subcategory's name - "Insulation", "Hidden Lines" - or "none" for the
    # family's own category.
    - name: subcategory
      type: string
      source: request
  provides:
    - name: changed
      # Each form or line, with its subcategory before and after.
      role: result
      type: IList<string>
    - name: createdSubcategory
      # True when the subcategory was new and made here.
      role: result
      type: bool
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing changed, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


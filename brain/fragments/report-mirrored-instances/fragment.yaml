id: FRG-QA-034
semantic-identity: "which family instances of these categories are mirrored, and which are only flipped"
kind: action
domain: revit.qa
capability: REPORT_MIRRORED_INSTANCES
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Lists the doors, fixtures, equipment - any family instances of the
  categories you name - that have been MIRRORED, and separately the ones whose
  flip arrows have been used, counted per category and per *"Family: Type"*,
  with every element's id. It changes nothing.

  **A MIRRORED DOOR SCHEDULES THE WRONG HANDING.** Mirroring reflects the
  geometry: a left-hand door now draws as a right-hand one while its type,
  its schedule row and anything ordered from that schedule still say left.
  Nothing in Revit warns about it, so it is found by looking, and this is the
  looking.

  **MIRRORED AND FLIPPED ARE DIFFERENT, AND ARE NEVER FOLDED TOGETHER.** A flip
  uses the family's own hand or facing arrows - the family author allowed it,
  and a flipped door is NOT a mirrored door. One instance can be mirrored AND
  flipped. So each of the three flags is counted on its own and printed per
  element, and `mirrored`, `handFlipped` and `facingFlipped` are three lists. A
  facing flip matters too: it leaves the door's From Room and To Room as they
  were (FRAGMENT-ISSUES row 5b-212), and REPORT_DOOR_ROOM_LINKS is what checks
  those against the rooms.

  **FAMILY INSTANCES ONLY, AND A CATEGORY WITH NONE IS SAID.** Ducts, pipes and
  walls are not families and carry no such flag. A category named with no
  family instances in it is reported as that - never as a zero that reads like
  a pass.

  **WHAT IS NOT CHECKED:** linked models; whether a mirrored instance is
  actually wrong (some families are drawn to be mirrored); and a nested shared
  component, which turns with the family it sits in - such a row names the
  family it is nested in and is NOT counted in any total, so one mistake is
  not counted twice.

contract:
  needs:
    - name: doc
      type: Document
    # RESOLVED categories, by name in Revit - "Doors, Plumbing Fixtures".
    - name: categories
      type: IList<Category>
      source: request
  provides:
    - name: findings
      type: IList<string>
    - name: mirrored
      # Instances whose Mirrored flag is set - the answer.
      role: result
      type: IList<ElementId>
    - name: handFlipped
      # Instances whose hand flip arrow has been used. Kept apart from
      # `mirrored`: a flip is not a mirror.
      role: result
      type: IList<ElementId>
    - name: facingFlipped
      # Instances whose facing flip arrow has been used. A facing flip leaves
      # From Room and To Room unchanged (row 5b-212).
      role: result
      type: IList<ElementId>
    - name: instancesChecked
      # How many family instances were examined. A count of work DONE, not of
      # things found (D-52).
      role: accounting
      type: int


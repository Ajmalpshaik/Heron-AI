compatibility-note: >
  One implementation for every release. `FamilyInstance.Mirrored`,
  `HandFlipped`, `FacingFlipped`, `Symbol`, `SuperComponent` and
  `ElementType.FamilyName` were each read with tools/api-surface as present and
  unchanged 2020 through 2027. `ElementMulticategoryFilter` and
  `OfClass(typeof(FamilyInstance))` are the same on every release. No units API
  is called and no `ElementId` is read as a number.

# ROUTING - the same rows are in the fragments named here.
#
#   "which doors are mirrored"            -> here. Until this card it resolved
#                                            to MIRROR_ELEMENTS, which CHANGES
#                                            the model - a question answered by
#                                            a write
#   "are any doors flipped"               -> here when the question is which
#                                            ones; REPORT_DOOR_ROOM_LINKS when it
#                                            is whether From/To Room read
#                                            backwards
#   "mirror these to the other room"      -> MIRROR_ELEMENTS. One reads, one
#                                            changes
#   "flip the door" / "the handing is
#    wrong, fix it"                       -> FLIP_ELEMENTS
#   "check the model against our naming
#    standard"                            -> CHECK_MODEL_STANDARDS - names and
#                                            data, not handing

utterances:
  - which doors are mirrored
  - are any of the fixtures mirrored
  - list the mirrored family instances
  - which doors have been mirrored or flipped
  - are the doors mirrored
  - which fixtures have been mirrored
  - is this door mirrored
  - is this fixture mirrored
  - is anything mirrored in this model

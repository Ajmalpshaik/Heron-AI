compatibility-note: >
  One implementation for every release. Duct.CreatePlaceholder and
  Pipe.CreatePlaceholder (Document, system type ElementId, duct or pipe type
  ElementId, level ElementId, XYZ, XYZ), Duct.IsPlaceholder and
  Pipe.IsPlaceholder, MechanicalSystemType, PipingSystemType, DuctType,
  PipeType, ElementType.FamilyName, Application.ShortCurveTolerance and
  LocationCurve.Curve are present and unchanged 2020 through 2027 - read with
  tools/api-surface --members on 2026-11-01. IsPlaceholder is declared on Duct
  and on Pipe, not on MEPCurve, on every release, so it is asked of each.

# ROUTING (2026-11-01) - repeated in CONVERT_MEP_PLACEHOLDERS. Checked that
# day on a scratch store: every CREATE_DUCT and CREATE_PIPE utterance still
# reaches its own card, and so do "draw a duct from here to here" and "draw a
# pipe from here to here", which neither card declares.
#
#   "draw a duct placeholder from here to here" -> here
#   "rough in the pipe route as placeholders"   -> here
#   "draw a duct from here to there"            -> CREATE_MEP_RUNS - real duct
#   "run a pipe from here to there"             -> CREATE_MEP_RUNS - real pipe
#   "convert these placeholders to real ducts"  -> CONVERT_MEP_PLACEHOLDERS
#   "turn the pipe placeholders into pipes"     -> CONVERT_MEP_PLACEHOLDERS
# JUDGED 2026-11-04 (FRAGMENT-ISSUES row 5b-1382, on the owner's yes to the
# merges with his condition: the impl/ of a PROVEN keeper is never changed)
# AGAINST CREATE_MEP_RUNS AND KEPT APART. CREATE_MEP_RUNS is PROVEN (re-proved
# on Revit 2020 in main's #796) and draws NO placeholder: it calls
# Duct.Create, Pipe.Create and their tray, conduit and flex kin, never
# Duct.CreatePlaceholder or Pipe.CreatePlaceholder, and it reads back no
# IsPlaceholder. A placeholder is a different element - single-line, no
# fittings, what CONVERT_MEP_PLACEHOLDERS turns into duct or pipe later - so
# taking it in means a placeholder branch in that card's impl/ and a new
# proof. The points are written the same way on both, so one route draws the
# same either way.
#
# ONE RULE IS OPPOSITE AND IS RECORDED, NOT SETTLED HERE: a segment Revit
# refuses is named in `notMade` and the good ones are kept on this card;
# CREATE_MEP_RUNS undoes the whole job and names each problem (Article 8 -
# "half a layout that looks drawn is worse than none", the rule #777 kept when
# CREATE_DUCT and CREATE_PIPE were merged). That safer rule is CREATE_MEP_RUNS'
# and is the one to take if this card's code is next changed; it is not
# changed here, because this ruling touched no impl/. TO MERGE IT FULLY, the
# owner would give up CREATE_MEP_RUNS' PROVEN status until a placeholder
# branch was written into its impl/ and proved again in Revit.
utterances:
  - draw a duct placeholder from here to here
  - rough in the pipe route as placeholders

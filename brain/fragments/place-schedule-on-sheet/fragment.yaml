compatibility-note: >
  One implementation for every release. `ScheduleSheetInstance.Create(Document,
  ElementId, ElementId, XYZ)` and its `ScheduleId` and `Point` properties are
  present and unchanged 2020 through 2027, with the same argument counts.

  The sheet arrives as an `ElementId` and is resolved with `doc.GetElement`, so
  nothing here builds an id from a number or reads one as a number, and 2024's
  64-bit change does not reach this code.

  **No units API is called.** mm to internal feet by dividing by 304.8, and back
  by multiplying, plain arithmetic at the edge - which is what D-20 requires and
  what keeps this working across the 2021 units break.

# ROUTING - the same rows are in the fragments named here.
#
#   "put the schedule on the sheet"    -> here. A SCHEDULE needs
#                                         ScheduleSheetInstance, not a viewport
#   "put this view on a sheet"         -> PLACE_VIEW_ON_SHEET, which refuses
#                                         schedules on purpose and points here
#   "make a sheet list"                -> CREATE_SHEET_LIST - a NEW schedule of
#                                         every sheet, and what "put the
#                                         schedule on the sheet" used to return
#   "make a new sheet"                 -> CREATE_SHEET. Creating the sheet and
#                                         placing on it stay different jobs
#   "which schedules are there"        -> FIND_SCHEDULES
#   "export it instead"                -> EXPORT_SCHEDULE_TO_CSV


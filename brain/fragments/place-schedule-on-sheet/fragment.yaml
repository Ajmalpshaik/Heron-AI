compatibility-note: >
  One implementation for every release. `ScheduleSheetInstance.Create(Document,
  ElementId, ElementId, XYZ)` and its `ScheduleId` and `Point` properties are
  present and unchanged 2020 through 2027, with the same argument counts.

  **VERSION 2's split is 2022 and later.** `ViewSchedule.Split(int)`,
  `Split(IList<double>)`, `IsSplit`, `GetSegmentCount`,
  `ScheduleSheetInstance.SegmentIndex` and the five-argument
  `ScheduleSheetInstance.Create(..., int segmentIndex)` are in the 2022 to 2027
  reference assemblies and NOT in 2020 or 2021 - read off all eight shipped
  assemblies with tools/api-surface. Autodesk's own notes give Revit 2022.1 as
  the update that brought them, so a 2022.0 install without it would lack them
  too. They are reached by name at run time, never under `#if` (row 5b-181);
  on a release without them a split or a segment asked for is refused for that
  schedule in plain words, and nothing is placed for it.

  The sheet arrives as an `ElementId` and is resolved with `doc.GetElement`, so
  nothing here builds an id from a number or reads one as a number, and 2024's
  64-bit change does not reach this code.

  **No units API is called.** mm to internal feet by dividing by 304.8, and back
  by multiplying, plain arithmetic at the edge - which is what D-20 requires and
  what keeps this working across the 2021 units break.


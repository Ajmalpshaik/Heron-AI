compatibility-note: >
  `LightFamily.GetLightFamily`, `SetLightShapeStyle`, `SetLightDistributionStyle`,
  `GetNumberOfLightTypes`, `GetLightType`, `GetLightTypeName`,
  `GetLightSourceTransform`, `LightType.SetLightShape`, `SetLightDistribution`,
  `SetInitialIntensity`, `SetInitialColor` and their Get pairs, the four shape,
  four distribution and four intensity classes and `CustomInitialColor` read
  the same 2020 through 2027 (the RevitAPI XML of all eight releases, read
  2026-10-02). Their parameter remarks give the units used: emit sizes in feet,
  spot angles in radians, a photometric web's tilt in degrees, illuminance in
  lux at a distance in feet, colour 1800 to 20000. They live in a namespace the
  fragment executor does not import, so they are reached by name at run time.
  VERSION 2, read 2026-10-21 with `tools/api-surface --members` over the
  shipped assemblies and the RevitAPI.xml of all eight releases, every one the
  same 2020 to 2027: `LightType.GetLossFactor`/`SetLossFactor` with
  `BasicLossFactor(double)` (0 to 4) and `AdvancedLossFactor` (seven doubles,
  five 0 to 1 and two 0 to 2), `LossFactor.LossFactorValue`;
  `LightType.DimmingColor` with the `LightDimmingColor` enum (None,
  Incandescent); `LightType.ColorFilter` (`Color`); `InitialWattageIntensity`
  (efficacy, wattage) - constructor remark "universal unit", property remarks
  W and lm/W. `LightFamily` has NO setter for the light source transform and
  no member that makes a light type, on any release. The light source is
  moved with `ElementTransformUtils.MoveElement`/`RotateElement` on the one
  element of `BuiltInCategory.OST_LightingFixtureSource`, with
  `Transform.CreateTranslation`/`CreateRotationAtPoint` for the expected
  result; a plane is found as a `ReferencePlane` by name and read with
  `GetPlane()`. Each type's own values are read with `FamilyType.AsDouble`,
  `AsValueString` and `HasValue` for the `FBX_LIGHT_*` built-in parameters
  (all 2020 to 2027), labelled with `LabelUtils.GetLabelFor`, and converted out
  of internal units with `UnitUtils.ConvertFromInternalUnits` - by
  `DisplayUnitType` (`DUT_WATTS`, `DUT_LUMENS_PER_WATT`, `DUT_LUMENS`,
  `DUT_CANDELAS`, `DUT_LUX`, `DUT_KELVIN`) on 2020-2021 and by `UnitTypeId`
  (`Watts`, `LumensPerWatt`, `Lumens`, `Candelas`, `Lux`, `Kelvin`) from 2021,
  both found by name at run time, one implementation and no #if. Whether
  `GetLightType(n)` writes the type named or the current type, and why its list
  leaves a family type out, is not in the reference - the per-type proof is
  how this call finds out (NEEDS-CHECKING Group IK).


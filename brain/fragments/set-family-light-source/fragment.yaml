#   "add an electrical connector to the family"  -> ADD_FAMILY_CONNECTOR - the
#                                                   fixture's power
#   "set the family category"                    -> SET_FAMILY_CATEGORY

# VERSION 2 - asked by the owner on 2026-10-21, building a pendant LED family
# on Revit 2020: the Light Source tick, placing or aiming the source and the
# wattage, each done by hand until then, made Heron's job.
#
#   "place the light source in the fixture family"  -> here (position)
#   "aim the light source"                          -> here (aim)
#   "set the wattage of the light"                  -> here (a wattage with
#                                                      its efficacy or lumens)
#   "set the light loss factor of the fixture"      -> here
#   "tick light source for this family"             -> SET_FAMILY_SETTINGS -
#                                                      a Family Category and
#                                                      Parameters switch

utterances:
  - set the light source of this fixture family
  - make the light source a spot light with a 30 degree beam
  - use this IES file for the light distribution
  - set the lumens and colour temperature of the light fixture
  - place the light source in the fixture family
  - aim the light source
  - set the wattage of the light

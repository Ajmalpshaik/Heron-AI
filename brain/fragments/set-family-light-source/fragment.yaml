id: FRG-MEP-056
semantic-identity: "define the light source of the lighting fixture family being edited - its shape, distribution, position and aim, and each type's intensity or wattage, colour, light loss factor, dimming and colour filter"
kind: action
domain: revit.families
capability: SET_FAMILY_LIGHT_SOURCE
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Defines the LIGHT SOURCE of a lighting fixture family open in the Family
  Editor - the Light Source Definition, where the light source sits and which
  way it points, and the photometric values in Type Properties - through
  Revit's LightFamily and LightType.

  **TWO HALVES, ONE PER CALL.** The FAMILY'S light source, one for every type:
  the SHAPE light leaves - point, line, rectangle or circle, sizes in
  millimetres; the DISTRIBUTION - spherical, hemispherical, spot (beam and field
  angles, tilt) or a photometric web from an IES file on this computer, with its
  tilt; its POSITION - a point in millimetres or onto a named reference plane;
  and its AIM - tilted or rotated about the family's X, Y or Z. And EACH TYPE'S
  values: the initial INTENSITY - lumens, candelas, lux at a distance, or a
  WATTAGE with its efficacy or its lumens; the initial COLOUR TEMPERATURE in
  kelvin; the LIGHT LOSS FACTOR, one number or seven; the DIMMING colour shift;
  the COLOUR FILTER. Revit's reference says type values may be lost when they
  change in one transaction with the family's light source, and that is what
  version 1 met on Revit 2020 (5b-1297), so a call asking for both halves is
  refused with that reason - the family's half first, the types' second.

  **EVERY FAMILY TYPE (version 2, 5b-1298).** The types are the family's own,
  each made current before its values are written. A type Revit's lighting API
  does not list - it listed one light type for two family types on Revit 2020 -
  is written with it current and must then PROVE it was reached from its own
  Type Properties; every type not asked for must read as it did. No call on any
  release makes a light type: a type that cannot be proved reached fails the
  call, and the refusal gives the hand fix. The family's half cannot be asked
  for one type of several - every type takes it.

  **LIGHT SOURCE MUST ALREADY BE TICKED** in Family Category and Parameters -
  Revit's GetLightFamily refuses a family without it. SET_FAMILY_SETTINGS
  "Light Source=yes" ticks it, and the refusal says so.

  **A WATTAGE (BV18).** Revit's reference names a wattage's unit two ways - its
  constructor "a universal unit value", its properties W and lm/W. It is
  written as W at lm/W, and Type Properties' own Wattage and Efficacy, out of
  Revit's internal units, must then read what was asked for every type, or the
  call fails and nothing is kept. A wattage alone, with no efficacy or lumens,
  is refused: it says nothing about how much light.

  **THE LIGHT SOURCE IS MOVED AND AIMED AS AN ELEMENT** - no release has a
  setter for its transform - and the transform is read again: one that did not
  go where it was sent fails the call.

  **READ BACK, AND WHAT TYPE PROPERTIES SHOWS IS THE TEST.** Everything asked is
  read again through the lighting API and through each type's own Type
  Properties, and the report gives every light value each type changed holds,
  with the family's shape, distribution, IES file, tilt, position and aim.
  Version 1's proof (below) no longer describes the code; this is DRAFT until
  it is proved again.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # "point", "line 1200", "rectangle 1200 x 600" (length by width), "circle
    # 200" - millimetres. Empty leaves the shape as it is.
    - name: shape
      type: string
      source: request
    # "spherical", "hemispherical", "spot 30 60" (beam, field, degrees) with an
    # optional "tilt 10", or "web C:\Lights\downlight.ies". Empty leaves it.
    - name: distribution
      type: string
      source: request
    # "1500 lm", "1200 cd" or "500 lx at 1000 mm"; VERSION 2 a wattage with
    # its efficacy or its lumens - "35.5 W at 127 lm/W", "4500 lm at 35.5 W".
    # Empty leaves it.
    - name: intensity
      type: string
      source: request
    # "4000 K", from 1800 to 20000. Empty leaves it.
    - name: colorTemperature
      type: string
      source: request
    # The one type to change - a FAMILY type, as Family Types lists them. Empty
    # changes every type. VERSION 2: the shape, distribution, position and aim
    # are the family's light source, so with one type of several named they
    # are refused (version 1 let a size within the same style through).
    - name: typeName
      type: string
      source: request
    # VERSION 2. "0.8" (0 to 4), or "advanced" and seven factors in Revit's
    # order: ballast, lamp lumen depreciation, lamp tilt, luminaire dirt,
    # surface depreciation (each 0 to 1), temperature and voltage (each 0 to
    # 2). Empty leaves it.
    - name: lightLossFactor
      type: string
      source: request
    # VERSION 2. "incandescent" or "none" - the Dimming Lamp Color Temperature
    # Shift. Empty leaves it.
    - name: dimming
      type: string
      source: request
    # VERSION 2. "255 240 200", "#FFF0C8", or "white" for none. Empty leaves it.
    - name: colorFilter
      type: string
      source: request
    # VERSION 2. Where the light source sits - "x 0 y 0 z 2400", any of the
    # three, millimetres in the family's own coordinates; "0 0 2400"; or "plane
    # <reference plane name>" with an optional "offset -10", along the plane's
    # normal turned up (or along +X/+Y for a vertical plane). Empty leaves it.
    - name: position
      type: string
      source: request
    # VERSION 2. Which way it points - "tilt 15 about x", "rotate 90 about z",
    # degrees, about an axis through the light source parallel to the family's
    # X, Y or Z, several with semicolons between, in order. Empty leaves it.
    - name: aim
      type: string
      source: request
  provides:
    - name: lightReport
      # The family's light source - shape, distribution, IES file, tilt - and
      # every type changed as read back, with every light value its Type
      # Properties holds, and where the light source sits and which way its Z
      # axis points, on ONE line.
      role: result
      type: string
    - name: changed
      # Each change made.
      role: result
      type: IList<string>
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing was changed, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


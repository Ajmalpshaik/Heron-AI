# DEPRECATED 2026-11-01 - MERGED INTO JOIN_GEOMETRY (join-geometry), on the
# owner's instruction in conversation: "make sure there is no duplicate
# tools", "in every conflict keep the safer rule". Constitution Article 1:
# kept, never deleted, so its record stays readable and it can be brought
# back. Nothing offers it now - retrieval leaves DEPRECATED out, and its
# sentences claim nothing in the identity table (heron_search
# RETIRED_FRAGMENTS). Its sentences moved to JOIN_GEOMETRY.
deprecated:
  date: '2026-11-01'
  by: Ajmal PS
  superseded-by: JOIN_GEOMETRY
  why: >
    A third mode of the same tool. JOIN_GEOMETRY version 3 takes join
    switch, which turns the join between the target and each element round:
    a pair that is not joined refused, never joined first; the direction read
    before and after, a call that left it unchanged named and never counted;
    which one now cuts said for each; and "the overlap has moved" whenever
    one turned. Not taken, and why: this card's two matched lists and their
    different-lengths refusal. Both lists bound the chain's one `elements`
    (binds: elements), so every pair was an element with itself - never
    joined, nothing switched - and from the selection the add-in refused
    them as two lists one selection cannot tell apart. This DRAFT card could
    never have switched a pair; JOIN_GEOMETRY pairs each element with its
    `target`.

purpose: >
  Reverses the direction of an existing join, so the element that was giving up
  its overlap now keeps it and the other one gives it up instead.

  **This is the fix when the join is right and its direction is wrong**, which
  is most of the time. A structural column swallowed by a wall, a slab that has
  eaten the beam it sits on: the two SHOULD be joined, and unjoining them to
  make the picture look right loses the join and leaves both volumes overlapping
  in the takeoff. Turning it round keeps the join and moves the overlap to the
  side that should carry it.

  **It changes quantities by design.** The overlap moves from one element's
  takeoff to the other's. That is the whole operation, and it is reported rather
  than left to be discovered in a schedule.

  **A pair that is not joined is refused, not joined-then-switched.** Joining
  something because it was asked to be turned round is inventing an instruction,
  and the two elements might have been left apart on purpose. JOIN_GEOMETRY is
  the fragment that joins.

  **The result is read back**, because the call returning is not the direction
  having changed. A switch that silently did nothing would leave a takeoff
  everybody now believes is right.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16), so a
  batch of pairs is one undo.

contract:
  needs:
    - name: doc
      type: Document
    - name: first
      type: IList<Element>
      binds: elements
    - name: second
      type: IList<Element>
      binds: elements
  provides:
    - name: switched
      role: result
      type: int
    - name: findings
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `JoinGeometryUtils.SwitchJoinOrder`,
  `AreElementsJoined` and `IsCuttingElementInJoin` are present 2020 through
  2027, compiled at both ends.

# ROUTING - repeated in JOIN_GEOMETRY and REPORT_JOINED_ELEMENTS.
#
#   "the wrong one is cutting"       -> here
#   "swap which element cuts"        -> here
#   "the wall has eaten the column"  -> here, NOT unjoin. The two should be
#                                       joined; it is the direction that is
#                                       wrong, and unjoining loses the join and
#                                       leaves both volumes overlapping
#   "join these"                     -> JOIN_GEOMETRY - and this refuses a pair
#                                       that is not joined rather than joining
#                                       it first
#   "unjoin these"                   -> JOIN_GEOMETRY, join false
#   "which one is cutting"           -> REPORT_JOINED_ELEMENTS - the read to do
#                                       first, and the one that shows this
#                                       worked
#   "the wall has eaten the column"      -> here, when the question is which
#                                           of two joined elements cuts the
#                                           other
#   "stop them joining at all"           -> DISALLOW_JOIN, which turns the
#                                           end cleanup off rather than
#                                           reversing it

utterances:
  - the wrong one is cutting
  - swap which element cuts
  - the wall has eaten the column
  - turn this join round
  - switch the join order

compatibility-note: >
  `new FamilyElementVisibility(FamilyElementVisibilityType.Model)` with
  `IsShownInCoarse`, `IsShownInMedium`, `IsShownInFine`, `IsShownInTopBottom`,
  `IsShownInFrontBack` and `IsShownInLeftRight`, and `GenericForm.SetVisibility`
  / `GetVisibility`, read the same 2020 through 2027 (the RevitAPI reference
  assemblies, read 2026-10-01). Version 2's `SymbolicCurve.GetVisibility` /
  `SetVisibility`, `FamilyElementVisibility.VisibilityType` and its
  constructor taking a `FamilyElementVisibilityType` read the same 2020
  through 2027; `DetailCurve`, `FilledRegion` and `FamilyInstance` carry no
  `GetVisibility` or `SetVisibility` on any of them (`tools/api-surface
  --members --inherited`, 2026-11-11).

# ROUTING - see SET_FAMILY_SETTINGS for the whole family-building table.
#
#   "show this form only in fine"                -> here
#   "hide the body in plan views in the family"  -> here
#   "show this symbolic line only in coarse"     -> here, version 2. On the
#                                                   keyword route alone
#                                                   DRAW_FAMILY_SYMBOLIC_LINES
#                                                   ranks first; `find` answers
#                                                   it here by identity, and
#                                                   that card's table says so
#                                                   (check-routing, 2026-11-11)
#   "draw the arrow as symbolic lines in plan"   -> DRAW_FAMILY_SYMBOLIC_LINES,
#                                                   which sets the levels as it
#                                                   draws
#   "hide ducts in this view"                    -> SET_CATEGORY_VISIBILITY,
#                                                   a project view setting

utterances:
  - show this form only in fine
  - hide the body in plan views in the family
  - set the family element visibility of these forms
  - show this extrusion in medium and fine only
  - make this form visible only in front and side views
  - show this symbolic line only in coarse

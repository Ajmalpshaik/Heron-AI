version: 2
source: OFFICIAL
risk: MODIFY

# VERSION 2 (2026-11-11) - SYMBOLIC LINES TOO, and back to DRAFT. Version 1
# was PROVEN on 2026-10-03 (the proof block then below, kept as the record of what
# it proved: an extrusion set to medium and fine, a project refused); its C#
# moved, so it was DRAFT again at the time until NEEDS-CHECKING Group NF is run (D-30,
# D-117). A family's plan symbol - symbolic lines already drawn - could have
# its detail levels set only while it was drawn (DRAW_FAMILY_SYMBOLIC_LINES).
# Version 2 takes a symbolic line's id, builds its setting with the kind the
# line already reads (ViewSpecific, where a form's is Model), refuses rather
# than guesses where the kinds of view do not read back, refuses detail lines,
# filled regions and nested families by name (no API on any release), and
# reads an absent `views` as "unchanged" - for a symbolic line only: a form
# with no kinds of view named is refused exactly as version 1 refused it
# (the edit-checker's review, 2026-11-11: the binder reads `views ""` as
# absent). Owner's yes to widen rather than add a card: Ajmal PS,
# 2026-11-11. FRAGMENT-ISSUES row 5b-1501.

purpose: >
  Sets a family form's VISIBILITY SETTINGS in the family open in the Family
  Editor - the Visibility Settings dialog there: at which level, and in which
  kinds of project view, a placed family draws the form. A 3D body hidden in a
  coarse plan; a small part drawn only at the most precise level.

  **BOTH LISTS ARE NAMED IN FULL** - levels from coarse, medium and fine, kinds
  from plan, front and left, either one "all". What is not named is switched
  OFF, so the call states the whole setting, never half of it. A list naming
  nothing is refused: a form drawn at no level, or in no plan or elevation,
  vanishes from them with no trace in the family. There is no switch for 3D,
  which shows the form at the levels named.

  **THE FORMS ARE NAMED BY THEIR IDS** - the ones the form tools gave back,
  commas between - or SELECTED in the family's window and called `selected`.

  **READ BACK, ALL OR NOTHING.** Each form's setting is read again after it is
  written, and is reported before and after; one that does not read as asked
  fails the call and nothing is kept. The Family Editor itself keeps showing
  every form - this is what a project shows.

  **SYMBOLIC LINES TOO** (version 2, 2026-11-11) - a plan symbol's lines
  already drawn, named by the ids DRAW_FAMILY_SYMBOLIC_LINES gave back or
  selected. A symbolic line's setting is of another kind than a form's, so
  it is written in the kind the line already reads. Its detail levels are set
  as a form's; whether its kinds of view can be set is not yet measured, so
  when they are named they are read back and anything else refuses the call,
  saying what Revit read. Views "unchanged" - what leaving them out means -
  sets only a symbolic line's detail levels and keeps its kinds of view. A
  FORM's kinds of view are still named in full: left out, or "unchanged",
  the call is refused as version 1 refused it.

  **DETAIL LINES, FILLED REGIONS AND NESTED FAMILIES ARE REFUSED BY NAME** -
  Revit's API has no visibility settings for any of them on any release 2020
  to 2027; they are set by hand in the Family Editor.

  **MEASURED 2026-11-12 ON REVIT 2020 (Group NF, NF6b):** a symbolic line's
  setting is of the ViewSpecific kind and Revit would not take kinds of view on
  it - asked for "plan", the call is refused saying so and nothing is kept. Its
  detail levels are set with views "unchanged".

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: uidoc
      type: UIDocument
    # The forms, by the ids the form tools gave back, commas between - or
    # `selected`. Version 2: symbolic lines' ids too.
    - name: forms
      type: string
      source: request
    # The detail levels it shows in - "medium, fine", or "all".
    - name: detailLevels
      type: string
      source: request
    # The kinds of project view it shows in - "plan, front, left", or "all".
    # Version 2: "unchanged" keeps a SYMBOLIC LINE's kinds of view and sets
    # only its detail levels - what leaving it out, or giving it empty,
    # means, so "show this symbolic line only in coarse" binds. For a FORM it
    # is refused, exactly as version 1 refused `views ""`.
    - name: views
      type: string
      source: request
      optional: true
      absent: unchanged
  provides:
    - name: changed
      # Each form or symbolic line, with its setting before and after.
      role: result
      type: IList<string>
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing changed, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


capability: EXPORT_SHEETS_TO_PDF
version: 1
source: OFFICIAL
risk: PUBLISH

purpose: >
  Exports sheets to PDF - one combined file or one per sheet - and reports the
  paths that ACTUALLY EXIST ON DISK afterwards, the same read-back
  EXPORT_VIEWS_TO_DWG uses and for the same reason.

  ASKING A PRINTER WAS DELIBERATELY NOT RE-AUTHORED, and that is the most
  important line here. The older way to reach a PDF is to drive a virtual
  printer through PrintManager. That route submits a real print job, and on a
  real office machine the installed printer list contains real physical
  copiers next to the PDF drivers. A wrong driver spends somebody else's paper
  on a shared device - an outward, unrecoverable side effect nobody asked for.

  So this fragment uses the export API and nothing else, and its declared
  release range is narrowed to the releases that carry it rather than widened
  by a printer fallback. A fragment that refuses an old release is honest;
  one that quietly prints on a copier is not.

  RISK IS **PUBLISH**. Nothing in the model changes. Files are written that get
  issued to other people, and one Ctrl+Z does not un-send a drawing.

  NO TRANSACTION, AND NONE IS NEEDED - export is document I/O, not a model edit.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: exportFolder
      type: string
      source: request
    - name: combinedFileName
      type: string
      source: request
  provides:
    - name: exported
      role: result
      type: IList<string>
    - name: notExported
      # Sheets with no file on disk when it read back afterwards. A delivery
      # that failed, never a file it wrote - `exported` is the answer (D-52).
      role: accounting
      type: IList<ElementId>
    - name: folderProblem
      # What was wrong with the folder asked for. A refusal, never a file it
      # wrote (D-52).
      role: accounting
      type: string


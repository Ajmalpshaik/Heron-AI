compatibility-note: >
  **2022 AND LATER ONLY, AND THE RANGE WAS MEASURED RATHER THAN ASSUMED.** The
  compile gate was run with all eight releases declared, and the two failures
  are not the same failure:

    Revit 2020   CS0246 - `PDFExportOptions` does not exist at all
    Revit 2021   CS0122 - it EXISTS AND IS INACCESSIBLE, protection level

  **That 2021 result is the trap.** Checking whether a type is present - by
  reflection, or by reading a members list - answers YES for 2021 and the code
  still cannot compile. Presence is not usability, and a range widened on a
  presence check would claim a release that fails at build time. Only a real
  compile separates the two, which is why `check-fragments-compile.py` reads
  every release a fragment claims rather than one.

  Everything else here is unchanged 2022 to 2027: `Document.Export` with
  `PDFExportOptions`, `PDFExportOptions.Combine` and `.FileName`,
  `ViewSheet.IsPlaceholder`. No units call is made. `System.IO` is written out
  in full because it is not among the harness usings.

  **A 2020 or 2021 caller gets NOTHING from this fragment rather than a
  fallback**, and that is a decision rather than a gap - see the purpose. The
  fallback would be a print job, and the printer list on a real machine holds
  physical copiers.

utterances:
  - export these sheets to pdf
  - make a pdf of the drawings
  - i need a pdf set
  - print these sheets to pdf
  - export the drawing set as pdf
  - give me one pdf of all the sheets

id: FRG-SEL-017
semantic-identity: "everything inside this box of space"
kind: filter
domain: revit.selection
capability: SELECT_IN_REGION
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Narrows the model to the elements inside a rectangular volume given by two
  corners - the "what is in this area" question when there is no room to filter
  by, or the area crosses several rooms, or it is outdoors.

  **Two tests, one fragment, and the caller says which.** The fast test asks
  whether an element's BOUNDING BOX overlaps the volume. The exact test asks
  whether its real geometry does. They were two files in the earlier library and
  they answer one question at two accuracies, which is a flag rather than a
  second fragment - the same call CREATE_ELECTRICAL_RUN makes about tray and
  conduit.

  **The difference is not academic and the report always names which ran.** A
  bounding box is axis-aligned, so a sloped drainage pipe or a rotated duct has
  a box far larger than the pipe: it is reported as inside a volume it never
  enters. On level work the two agree; on anything sloped or rotated the fast
  test OVER-reports, and silently.

  **The exact test is slower and it is not free of its own trap:** an element
  with no solid geometry at all - many annotation and analytical elements -
  cannot intersect anything and drops out. Those are counted rather than
  dropped, so a small exact answer beside a large fast one can be read.

  **Corners are typed in millimetres and arrive here ALREADY IN FEET.** The
  add-in's point parser converts every XYZ with HeronUnits.MillimetresToFeet
  before a fragment sees it, because Revit's internal unit is the foot. This
  fragment converted a SECOND time until 2026-09-13, which divided every region
  by 304.8 - a 200 m box became a 656 mm one and the answer was a calm "0
  element(s)". 304.8 now appears once, turning feet back into the millimetres
  the report speaks.**
  Nothing about this needs a units API, and the report states the volume in
  millimetres so a value handed in already converted shows up as an absurd box
  rather than as a quiet zero.

  **The two corners are sorted, so either order works.** A volume given
  max-first is not an error a modeller should have to think about.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, every loaded link is read too and
  `linksSearched` says how many were: set and 0 means "you asked, and none
  are loaded", which is a different answer from host-only. The same volume is moved into each link
  through each placement's transform, and the matches are counted per link
  in `linkedMatches`.
  **NOTHING FROM A LINK IS EVER SELECTED OR CARRIED** - `elements` stays this model's own; the chain
  revives ids against this model, and a linked id that happens to be in
  use here binds an unrelated element (FRAGMENT-ISSUES row 75). Links
  nested inside a link are not read, and are counted in the answer. This
  is version 2; version 1's proof no longer describes the code, and the
  fragment is DRAFT until it is proved again.

contract:
  needs:
    - name: doc
      type: Document
    - name: minMm
      type: XYZ
      source: request
    - name: maxMm
      type: XYZ
      source: request
    - name: exact
      type: bool
      source: request
    - name: categories
      type: IList<BuiltInCategory>
      source: request
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: withoutGeometry
      # Elements with no solid geometry, which the exact test cannot judge.
      # The evidence it looked; `elements` is the answer (D-52).
      role: accounting
      type: int
    - name: findings
      type: IList<string>
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then one line per link. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75).
      role: accounting
      type: IList<string>


id: FRG-VIEW-023
semantic-identity: "make a real schedule view of this category with these fields"
kind: action
domain: revit.schedules
capability: CREATE_SCHEDULE
# VERSION 2 (2026-11-01, on the owner's word in the brief of that day's
# session - FRAGMENT-ISSUES row 5b-1363). Ajmal PS made a duct length
# schedule through Heron on his Revit 2020 job model and asked for a careful
# check of every schedule setting Heron could not reach; this card made only
# Revit's plain Schedule/Quantities. It now makes the other kinds on View >
# Schedules, by `kind`: "material takeoff" (CreateMaterialTakeoff, the category
# asked about first with IsValidCategoryForMaterialTakeoff), "note block"
# (CreateNoteBlock, of the family named in `noteBlockFamily`, refused listing
# GetValidFamiliesForNoteBlock's families), "revision schedule"
# (CreateRevisionSchedule) and "keynote legend" (CreateKeynoteLegend); and an
# AREA SCHEDULE of one scheme, by `areaScheme` with the category Areas
# (CreateSchedule with the scheme's id, refused listing the schemes).
#
# `categoryId` STAYS REQUIRED: the add-in has no absent value for an ElementId
# (HeronBindingNote.AbsentValue). A kind that has a category of its own CHECKS
# it - Revisions for a revision schedule, Keynote Tags for a keynote legend,
# Generic Annotations for a note block - and refuses another, naming the right
# one, so the host sends that category with that kind.
#
# All three new needs are `optional: true` with `absent:` - "schedule", "none"
# and "none" - so a version 1 caller is bound exactly as before and runs
# version 1's path to the word. `madeAs` is new: a second read of what was
# made. Version 1's proof below no longer describes the code and is kept as a
# record; the card is DRAFT until NEEDS-CHECKING Group KK proves version 2 and
# the owner signs.
#
# NOT HERE, ON PURPOSE: "Filter by sheet" and the embedded schedule are
# settings of a schedule that exists, and are SET_SCHEDULE_OPTIONS'
# (FRG-VIEW-155). A key schedule stays CREATE_KEY_SCHEDULE's; a sheet list and
# a view list CREATE_SHEET_LIST's.
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Creates a schedule view of one category, with the fields asked for, that lives
  in the project and can go on a sheet - a plain schedule, or (version 2) a
  material takeoff, a note block, a revision schedule, a keynote legend, or an
  area schedule of one area scheme.

  **A schedule and a count are different deliverables, and both are right
  answers to different sentences.** GROUP_AND_COUNT reads the model and puts
  numbers in the reply - which is what somebody wants when they ask *"how many
  of each size"*. This makes a view in the Project Browser that updates itself
  as the model changes and prints on a drawing. *"Make a schedule"* is the
  second one, and it was resolving to the first.

  **A field that the category does not have is reported, not skipped.** Ask for
  Size on a category with no Size parameter and a silently short schedule looks
  finished and is missing a column - and the person reading the drawing has no
  way to know a column was ever asked for.

contract:
  needs:
    - name: doc
      type: Document
    - name: categoryId
      type: ElementId
      source: request
    - name: fieldNames
      type: IList<string>
      source: request
    - name: scheduleName
      type: string
      source: request
    # VERSION 2. "schedule" | "material takeoff" | "note block" |
    # "revision schedule" | "keynote legend". Left out it is "schedule" -
    # version 1's Schedule/Quantities, exactly.
    - name: kind
      type: string
      source: request
      optional: true
      absent: schedule
    # VERSION 2. An area scheme's name - "Gross Building", "Rentable" - for an
    # area schedule of that scheme, with the category Areas. Left out it is
    # "none": no scheme is named, as in version 1.
    - name: areaScheme
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 2. The Generic Annotation family a note block lists, by name.
    # Needed for kind "note block" only; left out it is "none".
    - name: noteBlockFamily
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: created
      role: result
      type: ElementId
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string
    - name: missingFields
      # Field names asked for that the category does not carry. A count of
      # what it was GIVEN and could not use - `created` is the schedule
      # (D-52).
      role: accounting
      type: IList<string>
    - name: madeAs
      # VERSION 2. A second read of the view made: its name, the category and
      # what Revit says it is (material takeoff, area scheme, family), and its
      # column count - never the request echoed.
      role: result
      type: string

proof:
  date: '2026-09-13'
  by: Ajmal PS
  model: test projject (3,432 elements), Revit 2024, session 40932
  positive_case: run as it would normally be run - run inside a transaction, and Revit reported
    the transaction group ROLLED BACK afterwards. returned created 1 item(s) [id 925865],
    missingFields 0 item(s), name HERON TEST SCHEDULE, refused (null), wanted 2 item(s) [Family
    and Type, Length]. inputs came categoryId as given; fieldNames as given (2); scheduleName
    as given. on test projject
  negative_case: 'run with categoryId=Views, fieldNames=Family and Type,Length, scheduleName=HERON
    TEST SCHEDULE 2 instead - chosen because it should not contain what this fragment reports
    - run inside a transaction, and Revit reported the transaction group ROLLED BACK afterwards.
    returned created (null), missingFields 0 item(s), name HERON TEST SCHEDULE 2, refused
    Revit declined to create a schedule for that category - not every category can be scheduled.
    Revit said: categoryId is not a valid category for a regular schedule.  Parameter name:
    categoryId, wanted 2 item(s) [Family and Type, Length]. inputs came categoryId as given;
    fieldNames as given (2); scheduleName as given. on test projject'
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  caveat: >-
    THE CODE WAS FIXED TO MAKE THE NEGATIVE POSSIBLE. ViewSchedule.CreateSchedule THROWS for a
    category that cannot be scheduled - it does not return null - so the `schedule == null`
    refusal at the heart of this fragment could never run, and asked for a schedule of Views it
    crashed where it meant to say no. It now catches and passes on Revit's own sentence. ALSO:
    missingFields was never moved off zero. tests/cases.yaml calls a field name the category
    does not have its first negative, and expects the schedule STILL made with the rest; both
    fields asked for here existed, so that leg is untested.
  fingerprint: 263dab0e207be958

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  `ViewSchedule.CreateSchedule(Document, ElementId)`, `ScheduleDefinition`,
  `GetSchedulableFields()` and `AddField(SchedulableField)` are unchanged 2020
  to 2027. The category arrives as an `ElementId` from a live category, so
  nothing here builds one from an int and 2024's 64-bit ids do not reach this
  code.

  VERSION 2: `ViewSchedule.CreateMaterialTakeoff`, `CreateNoteBlock`,
  `CreateRevisionSchedule`, `CreateKeynoteLegend`, the three-argument
  `CreateSchedule(Document, ElementId, ElementId)` for an area scheme,
  `IsValidCategoryForMaterialTakeoff`, `GetValidFamiliesForNoteBlock` and
  `ScheduleDefinition.IsMaterialTakeoff`, `IsKeySchedule`, `AreaSchemeId` and
  `FamilyId` are present and unchanged 2020 through 2027, read off the shipped
  assemblies of all eight with tools/api-surface --members on 2026-11-01. No
  member here is missing on any release, so nothing is reached by name.

  Fields are matched by the name `SchedulableField.GetName(doc)` returns, which
  is the name shown in Revit's own field list - so a field asked for in the
  words on screen is found, and one asked for by an internal parameter name is
  not.

# ROUTING - repeated in GROUP_AND_COUNT and COUNT_ELEMENTS.
#
#   "make a schedule"              -> here - a VIEW that goes on a sheet
#   "create a duct schedule"       -> here
#   "how many of each size"        -> GROUP_AND_COUNT - numbers in the REPLY,
#                                     and it makes nothing in the model
#   "how many ducts are there"     -> COUNT_ELEMENTS
#   "export the schedule to excel" -> EXPORT_SCHEDULE_TO_CSV. This row read
#                                     "nothing in the library exports anything
#                                     yet" until 2026-09-04. It was true when
#                                     written and stayed standing after five
#                                     export fragments landed - a routing row
#                                     that ages into a lie points a reader at
#                                     nothing
#   "put the schedule on a sheet"  -> PLACE_SCHEDULE_ON_SHEET - a schedule needs
#                                     ScheduleSheetInstance, not a viewport
#   "make a key schedule"            -> CREATE_KEY_SCHEDULE - a table of
#                                       DEFINITIONS elements point at, not a
#                                       list of what is in the model

#   "make a sheet list schedule"       -> CREATE_SHEET_LIST - sheets are not
#                                        model elements, so the category route
#                                        here cannot produce a drawing index
#   "create a view list"               -> CREATE_SHEET_LIST, listKind=views.
#                                        Views are not model elements either;
#                                        it is ViewSchedule.CreateViewList
#   "make a material takeoff of the walls"
#                                  -> here, version 2: kind material takeoff,
#                                     the category Walls
#   "create a revision schedule"   -> here, version 2: kind revision schedule
#                                     with the category Revisions - the
#                                     category is required and checked
#   "make a keynote legend"        -> here, version 2: kind keynote legend with
#                                     the category Keynote Tags
#   "make a note block"            -> here, version 2: kind note block, the
#                                     category Generic Annotations and the
#                                     family in noteBlockFamily
#   "make an area schedule for the gross building scheme"
#                                  -> here, version 2: the category Areas and
#                                     areaScheme. REPORT_AREAS reads areas and
#                                     makes nothing; CREATE_AREA_PLAN makes a
#                                     plan view, not a schedule
#   "filter the schedule by sheet" -> SET_SCHEDULE_OPTIONS - a setting of a
#                                     schedule that exists, not a new one
#   "add an embedded schedule"     -> SET_SCHEDULE_OPTIONS, for the same reason
utterances:
  - make a schedule
  - create a schedule of the ducts
  - I need a schedule view
  - add a schedule to the project
  - make a quantity schedule
  - schedule these on a drawing
  # VERSION 2 - the other kinds on View > Schedules.
  - make a material takeoff of the walls
  - create a revision schedule
  - make a keynote legend
  - make a note block
  - make an area schedule for the gross building scheme

id: FRG-VIEW-023
semantic-identity: "make a real schedule view of this category with these fields"
kind: action
domain: revit.schedules
capability: CREATE_SCHEDULE
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Creates a schedule view of one category, with the fields asked for, that lives
  in the project and can go on a sheet.

  **A schedule and a count are different deliverables, and both are right
  answers to different sentences.** GROUP_AND_COUNT reads the model and puts
  numbers in the reply - which is what somebody wants when they ask *"how many
  of each size"*. This makes a view in the Project Browser that updates itself
  as the model changes and prints on a drawing. *"Make a schedule"* is the
  second one, and it was resolving to the first.

  **A field that the category does not have is reported, not skipped.** Ask for
  Size on a category with no Size parameter and a silently short schedule looks
  finished and is missing a column - and the person reading the drawing has no
  way to know a column was ever asked for.

  **VERSION 2 makes the other schedules too**, by `listKind`: a SHEET LIST -
  the drawing index, every sheet, placeholders included - or a VIEW LIST,
  both with their own fields and a sort; and a KEY SCHEDULE - a table of
  definitions elements point at, so one choice fills several fields - with
  its key parameter named and no rows yet. Sheets and views are not model
  elements, so the category route alone cannot make either. Version 1's proof
  no longer describes the code and is kept as a record; the card is DRAFT
  until it is proved again.

contract:
  needs:
    - name: doc
      type: Document
    - name: categoryId
      # The category scheduled, or the one a key schedule belongs to. Version
      # 2: optional, left out "none" - a sheet list or a view list needs none;
      # a schedule or a key schedule left without one is refused.
      type: ElementId
      source: request
      optional: true
      absent: none
    - name: fieldNames
      # The columns, by the name Revit shows in the Fields tab, capitals
      # ignored. Version 2: optional, left out "none" - a key schedule is
      # usually made with none; any other schedule left with no column is
      # said in findings.
      type: IList<string>
      source: request
      optional: true
      absent: none
    - name: scheduleName
      type: string
      source: request
    # VERSION 2, from CREATE_SHEET_LIST and CREATE_KEY_SCHEDULE. Which schedule:
    # left out, "schedule" - a category's, version 1 exactly; "sheets" a sheet
    # list; "views" a view list; "key" a key schedule. Any other word is
    # refused and nothing is created - guessing would make the wrong one.
    - name: listKind
      type: string
      source: request
      optional: true
      absent: schedule
    # VERSION 2, from CREATE_SHEET_LIST. A column to sort by, ascending - it
    # must be one of fieldNames, or findings says it cannot. Left out: "none".
    - name: sortByField
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 2, from CREATE_KEY_SCHEDULE. A key schedule's key parameter -
    # "Finish Key". Every key schedule otherwise calls it "Key Name". Left
    # out: "none", Revit's name stays.
    - name: keyParameterName
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: created
      role: result
      type: ElementId
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string
    - name: missingFields
      # Field names asked for that the category does not carry. A count of
      # what it was GIVEN and could not use - `created` is the schedule
      # (D-52).
      role: accounting
      type: IList<string>
    - name: fieldsAdded
      # Version 2, from CREATE_SHEET_LIST. The columns actually added, in the
      # order asked. A thing it made, so a result.
      role: result
      type: IList<string>
    - name: findings
      # Version 2. One line each: a field it cannot carry WITH the names it
      # can; a sort on a field that is not a column; a name already used,
      # with the name Revit gave instead; a schedule with NO columns; a
      # category given to a sheet or view list and not used; and for a key
      # schedule, that it has NO ROWS yet and whether the key parameter took
      # its name. Prose, so it carries no role (D-51).
      type: IList<string>

proof:
  date: '2026-09-13'
  by: Ajmal PS
  model: test projject (3,432 elements), Revit 2024, session 40932
  positive_case: run as it would normally be run - run inside a transaction, and Revit reported
    the transaction group ROLLED BACK afterwards. returned created 1 item(s) [id 925865],
    missingFields 0 item(s), name HERON TEST SCHEDULE, refused (null), wanted 2 item(s) [Family
    and Type, Length]. inputs came categoryId as given; fieldNames as given (2); scheduleName
    as given. on test projject
  negative_case: 'run with categoryId=Views, fieldNames=Family and Type,Length, scheduleName=HERON
    TEST SCHEDULE 2 instead - chosen because it should not contain what this fragment reports
    - run inside a transaction, and Revit reported the transaction group ROLLED BACK afterwards.
    returned created (null), missingFields 0 item(s), name HERON TEST SCHEDULE 2, refused
    Revit declined to create a schedule for that category - not every category can be scheduled.
    Revit said: categoryId is not a valid category for a regular schedule.  Parameter name:
    categoryId, wanted 2 item(s) [Family and Type, Length]. inputs came categoryId as given;
    fieldNames as given (2); scheduleName as given. on test projject'
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  caveat: >-
    THE CODE WAS FIXED TO MAKE THE NEGATIVE POSSIBLE. ViewSchedule.CreateSchedule THROWS for a
    category that cannot be scheduled - it does not return null - so the `schedule == null`
    refusal at the heart of this fragment could never run, and asked for a schedule of Views it
    crashed where it meant to say no. It now catches and passes on Revit's own sentence. ALSO:
    missingFields was never moved off zero. tests/cases.yaml calls a field name the category
    does not have its first negative, and expects the schedule STILL made with the rest; both
    fields asked for here existed, so that leg is untested.
  fingerprint: 263dab0e207be958

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  `ViewSchedule.CreateSchedule(Document, ElementId)`, `ScheduleDefinition`,
  `GetSchedulableFields()` and `AddField(SchedulableField)` are unchanged 2020
  to 2027. The category arrives as an `ElementId` from a live category, so
  nothing here builds one from an int and 2024's 64-bit ids do not reach this
  code.

  Fields are matched by the name `SchedulableField.GetName(doc)` returns, which
  is the name shown in Revit's own field list - so a field asked for in the
  words on screen is found, and one asked for by an internal parameter name is
  not.

  Version 2 adds `ViewSchedule.CreateSheetList(Document)` and
  `CreateViewList(Document)` - present 2020 through 2027, checked in all
  eight releases' RevitAPI.xml on 2026-09-27 for CREATE_SHEET_LIST - and
  `ViewSchedule.CreateKeySchedule`, `IsValidCategoryForKeySchedule` and the
  `KeyScheduleParameterName` setter, read off the reference assemblies at
  both ends for CREATE_KEY_SCHEDULE; `ScheduleSortGroupField` and
  `Category.GetCategory(Document, ElementId)` are the same on every release.

# ROUTING - repeated in GROUP_AND_COUNT and COUNT_ELEMENTS.
#
#   "make a schedule"              -> here - a VIEW that goes on a sheet
#   "create a duct schedule"       -> here
#   "how many of each size"        -> GROUP_AND_COUNT - numbers in the REPLY,
#                                     and it makes nothing in the model
#   "how many ducts are there"     -> COUNT_ELEMENTS
#   "export the schedule to excel" -> EXPORT_SCHEDULE_TO_CSV. This row read
#                                     "nothing in the library exports anything
#                                     yet" until 2026-09-04. It was true when
#                                     written and stayed standing after five
#                                     export fragments landed - a routing row
#                                     that ages into a lie points a reader at
#                                     nothing
#   "put the schedule on a sheet"  -> PLACE_VIEW_ON_SHEET, version 4 - a
#                                     schedule needs ScheduleSheetInstance, not
#                                     a viewport (PLACE_SCHEDULE_ON_SHEET until
#                                     it was merged there, 2026-11-01)
#   "make a key schedule"          -> here, listKind key (version 2) - a table
#                                     of DEFINITIONS elements point at, not a
#                                     list of what is in the model
#   "set up a finish key"          -> here, listKind key
#   "make a sheet list schedule"   -> here, listKind sheets (version 2) - sheets
#                                     are not model elements, so the category
#                                     route alone cannot produce a drawing index
#   "I need a drawing index"       -> here, listKind sheets
#   "create a view list"           -> here, listKind views - ViewSchedule.
#                                     CreateViewList
#   "schedule of the views on sheets" -> here, listKind views, then
#                                     SET_SCHEDULE_FILTERS Sheet Number has
#                                     value. A view list shows every view until
#                                     it is filtered
#   "which views are not on a sheet" -> FIND_VIEWS, placement unplaced - a READ, no
#                                     schedule made
#   "what sheets are in this model"  -> FIND_SHEETS - a READ, no view made
#   "make me a new sheet"            -> CREATE_SHEETS
#   "add a column to the schedule"   -> ADD_SCHEDULE_FIELDS - and it is how a
#                                     key schedule's own columns get added
#                                     after this makes the table

# VERSION 2 (2026-11-01) - CREATE_SHEET_LIST AND CREATE_KEY_SCHEDULE WERE
# MERGED INTO THIS CARD on the owner's instruction ("make sure there is no
# duplicate tools"), and both are DEPRECATED. The same job - make a schedule
# view in the project - by the other three calls Revit has for it. What they
# had and this card lacked is here now: `listKind` - a SHEET LIST
# (CreateSheetList) or a VIEW LIST (CreateViewList), from CREATE_SHEET_LIST,
# with its `sortByField`, its `fieldsAdded`, its refusal of an unknown kind
# with nothing created, a field it cannot carry named WITH the names it can,
# and the empty-columns warning; and a KEY SCHEDULE (CreateKeySchedule), from
# CREATE_KEY_SCHEDULE, with Revit asked first whether the category may have
# one, its `keyParameterName`, and NO ROWS said, read back by name.
#
# THE SAFER RULE IN EACH CONFLICT IS KEPT (the owner: "in every conflict keep
# the safer rule"). A schedule name already used: version 1 let Revit's
# refusal out, which aborts the caller's transaction; CREATE_SHEET_LIST kept
# Revit's generated name and said so - kept here, for every kind. Fields:
# matched ignoring capitals (CREATE_SHEET_LIST), and two fields showing one
# name still give ONE column (this card). NOT CARRIED, as opposite: in
# CREATE_SHEET_LIST a BLANK listKind meant a sheet list; here left out, or
# blank, is a category schedule - version 1's job, which every caller of this
# card relied on. "sheets" makes the sheet list. A missing field is in
# missingFields here, and was in CREATE_SHEET_LIST's `refused`; this card's
# `refused` stays the one sentence for nothing created.
#
# WHERE THEIR OUTPUTS ARE NOW: CREATE_SHEET_LIST's sheetList -> created (an
# id), fieldsAdded -> fieldsAdded, refused (a list) -> refused when nothing
# was made, findings otherwise; CREATE_KEY_SCHEDULE's created -> created,
# findings -> findings. Their sentences moved here.


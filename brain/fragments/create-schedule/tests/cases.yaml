positive:
  - given: category Ducts, fields ["Family and Type", "Size", "Length"], name "M - Duct Schedule"
    expect: >
      a schedule view in the Project Browser with those three columns, updating
      itself as the model changes, and placeable on a sheet

  - given: the new schedule handed to PLACE_VIEW_ON_SHEET
    expect: it lands on the sheet - a schedule is a view, and that is the point of making one

  # VERSION 2 - the other kinds.
  - given: >
      kind "material takeoff", category Walls, fields "Material- Name" and
      "Material- Area" as Revit's field list names them (Material, colon, the name)
    expect: >
      a Material Takeoff in the Project Browser, madeAs reading it back as a
      material takeoff of Walls with 2 columns

  - given: kind "revision schedule", category Revisions, no fields
    expect: >
      a Revision Schedule view made, madeAs naming the category Revisions

  - given: kind "keynote legend", category Keynote Tags
    expect: a Keynote Legend view under Legends, madeAs naming Keynote Tags

  - given: kind "note block", category Generic Annotations, noteBlockFamily the name of a loaded Generic Annotation family
    expect: >
      a Note Block schedule of that family; madeAs prints the family the
      definition reads back (the proof settles that FamilyId is it)

  - given: category Areas, areaScheme "Gross Building"
    expect: an area schedule of the Gross Building scheme, madeAs naming the scheme

negative:
  - given: a field name the category does not have
    expect: >
      it appears in `missingFields` and the schedule is STILL made with the
      rest. A silently short schedule looks finished and prints with a column
      missing, and nobody reading it can tell one was asked for

  - given: two schedulable fields sharing a display name - an instance and a type parameter
    expect: >
      one column, not two. Two identical headings over different numbers is
      worse than picking one, and nothing on the drawing would say which was
      which

  - given: no category
    expect: refused - a schedule is a schedule OF something

  - given: a category Revit cannot schedule
    expect: refused, saying so, rather than an empty view left in the browser

  # VERSION 2.
  - given: kind "revision schedule" with the category Ducts
    expect: >
      refused, naming Revisions as the category a revision schedule needs, and
      NOTHING made - no new view in the Project Browser

  - given: kind "material takeoff" with a category Revit takes no takeoff of (Rooms)
    expect: >
      refused before the create call, saying Revit does not make a material
      takeoff of Rooms; nothing made

  - given: areaScheme "ZZZ NO SUCH SCHEME" with the category Areas
    expect: refused, listing the area schemes the project has; nothing made

  - given: areaScheme "Gross Building" with the category Ducts
    expect: refused - an area scheme belongs to an area schedule only; nothing made

  - given: kind "note block" with noteBlockFamily left out
    expect: refused, listing the families a note block can list; nothing made

  - given: kind "pie chart"
    expect: refused, naming the five kinds; nothing made

second_route:
  - Revit's own View > Schedules > Schedule/Quantities with the same category and fields, compared column for column
  - >
    VERSION 2: View > Schedules > Material Takeoff, Note Block, Keynote Legend,
    and Schedule/Quantities with Areas and its area scheme picked - the view
    each makes compared with the one made here, kind, category and columns

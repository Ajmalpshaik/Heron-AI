positive:
  - given: category Ducts, fields ["Family and Type", "Size", "Length"], name "M - Duct Schedule"
    expect: >
      a schedule view in the Project Browser with those three columns, updating
      itself as the model changes, and placeable on a sheet

  - given: the new schedule handed to PLACE_VIEW_ON_SHEET
    expect: it lands on the sheet - a schedule is a view, and that is the point of making one

negative:
  - given: a field name the category does not have
    expect: >
      it appears in `missingFields` and the schedule is STILL made with the
      rest. A silently short schedule looks finished and prints with a column
      missing, and nobody reading it can tell one was asked for

  - given: two schedulable fields sharing a display name - an instance and a type parameter
    expect: >
      one column, not two. Two identical headings over different numbers is
      worse than picking one, and nothing on the drawing would say which was
      which

  - given: no category
    expect: refused - a schedule is a schedule OF something

  - given: a category Revit cannot schedule
    expect: refused, saying so, rather than an empty view left in the browser

  # VERSION 2 (2026-11-01, CREATE_SHEET_LIST and CREATE_KEY_SCHEDULE merged
  # in). Each FAILS on version 1, which has no listKind and needs a category.
  - given: >
      VERSION 2. listKind "sheets", fields Sheet Number and Sheet Name, sorted
      by Sheet Number, no category
    expect: >
      a SHEET LIST in the browser listing every sheet, placeholders as rows,
      in number order - CHECKED by opening it - fieldsAdded both names

  - given: >
      VERSION 2. listKind "views", fields View Name, Sheet Number, Sheet Name
      and Title on Sheet, sorted by Sheet Number
    expect: >
      a VIEW LIST - every view a row, the views on no sheet with Sheet Number
      blank; SET_SCHEDULE_FILTERS with Sheet Number "has value" after it
      keeps only the placed ones

  - given: VERSION 2. listKind "sheets" and the field "Level"
    expect: >
      "Level" in missingFields AND a findings line naming the fields a sheet
      list CAN carry. A silently short index looks finished on the cover

  - given: VERSION 2. listKind "drawings" - a kind this does not make
    expect: >
      refused naming schedule, sheets, views and key, and NOTHING created -
      created null. Guessing a kind makes the wrong one and reports it made

  - given: VERSION 2. sortByField naming a field that was not added
    expect: a findings line saying it cannot sort by it - not silently unsorted

  - given: >
      VERSION 2. scheduleName already used by another view, any kind - and
      version 1's own case, a category schedule
    expect: >
      the schedule STILL created under Revit's generated name, and findings
      saying so. Version 1 let Revit's refusal out of a category schedule,
      which rolls back the caller's whole transaction

  - given: >
      VERSION 2. listKind "key", category Rooms, scheduleName "Room Finish
      Key", keyParameterName "Finish Key", no fields
    expect: >
      a key schedule under Schedules, findings saying it has NO ROWS yet, and
      a "Finish Key" dropdown on a room's properties - LOOKED AT there

  - given: VERSION 2. listKind "key" on a category Revit will not allow one on (Sheets)
    expect: >
      refused naming the category, asked before trying - not an exception,
      and nothing created

  - given: VERSION 2. listKind "key" with no category
    expect: refused - a key schedule belongs to a category - nothing created

  - given: VERSION 2. listKind "sheets" with fieldNames left out
    expect: the sheet list created, and findings saying it has NO columns and prints as an empty box

second_route:
  - Revit's own View > Schedules > Schedule/Quantities with the same category and fields, compared column for column
  - for a sheet list, View > Schedules > Sheet List - compare its row count against the Sheets branch of the Project Browser
  - for a key schedule, View > Schedules > Schedule/Quantities with Schedule keys chosen

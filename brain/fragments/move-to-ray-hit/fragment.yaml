revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `ReferenceIntersector`, `Find` and
  `ReferenceWithContext.Proximity` are unchanged 2020 to 2027. `maxDistance`
  and `offsetAlongRay` arrive in millimetres and are divided by 304.8 in the
  code (D-71); from there they are used in Revit's internal feet, and no
  units API is touched. (This note said distances "arrive and are used in
  Revit's internal feet" until 2026-09-24, while the code and its own proof -
  50000 in, 164.04 feet used - said millimetres.)

# ROUTING - repeated in CHECK_SURFACE_FIT and SNAP_TO_GRID.
#
#   "drop these down onto the slab"      -> here - the MOVE
#   "is the equipment sitting flat on the floor" -> CHECK_SURFACE_FIT - run it
#                                        FIRST and leave the straddling ones
#                                        out of the move. A centre ray is right
#                                        in the middle of a surface and lies at
#                                        the edges
utterances:
  - snap the terminals up to the ceiling
  - move the sprinklers up to the soffit
  - take them up to the slab
  - drop the hangers to the floor
  - put them against the ceiling
  - raise them until they touch

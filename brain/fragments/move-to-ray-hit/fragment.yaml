heron-agent: HERON-REVIT-ELE-010
heron-step: 14
heron-status: DRAFT
heron-since: 0.1.0
heron-layer: brain

id: FRG-GEO-004
semantic-identity: "move each element until it meets whatever is in the direction given"
kind: action
domain: revit.geometry
capability: MOVE_TO_RAY_HIT
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Fires one ray out of each element and moves it to whatever the ray meets,
  plus a signed offset. The general *"snap this up to the thing above it"* job -
  an air terminal up to the ceiling, a sprinkler up to the soffit, a hanger down
  to the floor.

  It exists because a fixed height is the wrong answer whenever the ceilings are
  not all at one level, which is most real projects. Each element finds the
  surface above ITSELF.

  Every number is an input and none is assumed (D-33): the direction, how far to
  look, and the offset that pulls the element back off the surface it hit.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: view3d
      type: View3D
      source: request
    - name: elements
      type: IList<Element>
    - name: direction
      type: XYZ
      source: request
    - name: maxDistance
      type: double
      source: request
    - name: offsetAlongRay
      type: double
      source: request
  provides:
    - name: snapped
      role: result
      type: int
    - name: noHit
      # Elements whose ray met nothing within range, so it could not be
      # snapped. The evidence it looked, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: notPointBased
      # Handed in but not point-based, so there was nothing here to act on. A
      # count of what it was GIVEN and could not use, never a thing it found
      # (D-52).
      role: accounting
      type: IList<ElementId>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `ReferenceIntersector`, `Find` and
  `ReferenceWithContext.Proximity` are unchanged 2020 to 2027. Distances arrive
  and are used in Revit's internal feet with no units call.

# ROUTING - repeated in CHECK_SURFACE_FIT and SNAP_TO_GRID.
#
#   "drop these down onto the slab"      -> here - the MOVE
#   "is the equipment sitting flat on the floor" -> CHECK_SURFACE_FIT - run it
#                                        FIRST and leave the straddling ones
#                                        out of the move. A centre ray is right
#                                        in the middle of a surface and lies at
#                                        the edges
utterances:
  - snap the terminals up to the ceiling
  - move the sprinklers up to the soffit
  - take them up to the slab
  - drop the hangers to the floor
  - put them against the ceiling
  - raise them until they touch

# LINKED MODELS, THE DETAIL - KEPT HERE BECAUSE `purpose` IS SEARCHED
# (FRAGMENT-ISSUES 5b-1293, 2026-10-29). Version 2's paragraph on links
# (D-59, 2026-09-29) was most of a hundred words of mechanics in the purpose,
# and with SELECT_BY_CATEGORIES' it is the change tests/test_retrieve.py's
# duct agreement check has failed on since: this card fell from 3rd to 6th
# for "every duct in the model" on the trained model. It also said the card
# was DRAFT until proved again, which stopped being true when version 2 was
# proved. The purpose keeps what a modeller is told; the rest is here: with
# `includeLinks` absent this answers for this model alone. `elements` stays
# this model's own: the chain revives ids against this model, and a linked id
# that happens to be in use here binds an unrelated element (FRAGMENT-ISSUES
# row 75). Links nested inside a link are not read, and are counted in the
# answer.
purpose: >
  Splits a duct or pipe category into what has insulation applied and what is
  still bare - the sweep behind "which ducts still need insulating" and "show me
  what is already done".

  **It asks the insulation, not the duct.** A duct carries no reliable "am I
  insulated" parameter; the truth is a separate element that records which host
  it wraps. So this reads the wrappers and builds the set of hosts they name,
  which is the real relationship rather than a parameter that might have been
  filled in by hand.

  **The lookup is built once, not per element.** Asking each duct "is anything
  wrapping you" means a scan of the whole model per duct. Reading every wrapper
  once and collecting the hosts it names is the same answer for the cost of one
  pass, and on a real model that is the difference between a second and several
  minutes.

  **Lining is not insulation, and whether it counts is asked rather than
  assumed.** External thermal insulation and internal acoustic lining are
  different elements doing different jobs, and a modeller asking "which ducts
  are insulated" may mean either. The report always says which was counted, so
  two runs with different answers are not a contradiction.

  **A bare duct and a duct that cannot carry insulation look the same from a
  count.** Fittings, flex and equipment are in the same categories a modeller
  names, so the bare list is the honest answer to "what has nothing on it" and
  not a work list. Whether each one SHOULD be insulated is a judgement, and it
  is the modeller's.

  **LINKED MODELS ONLY WHEN ASKED (D-59).** Given `includeLinks`, each loaded
  link's insulation is read in that link and its insulated or bare count given
  per link in `linkedMatches`, and `linksSearched` says how many were read, 0
  when none are loaded. Nothing from a link is ever selected.

contract:
  needs:
    - name: doc
      type: Document
    - name: categories
      type: IList<BuiltInCategory>
      source: request
    - name: wantInsulated
      type: bool
      source: request
    - name: countLiningAsInsulated
      type: bool
      source: request
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: scanned
      # How many elements were examined. A count of work DONE, not of things
      # found - the evidence it ran, which is the opposite of a reason to
      # doubt it (D-52).
      role: accounting
      type: int
    - name: findings
      type: IList<string>
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then one line per link. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75).
      role: accounting
      type: IList<string>


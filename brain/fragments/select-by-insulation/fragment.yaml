revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `DuctInsulation`, `DuctLining`,
  `PipeInsulation` and `InsulationLiningBase.HostElementId` are present 2020
  through 2027, compiled at both ends. Host ids are compared as ElementIds and
  never read as numbers.

# ROUTING - repeated in SET_MEP_INSULATION and CHECK_INSULATION_CLEARANCE.
#
#   "which ducts still need insulating" -> here, wantInsulated false
#   "show me what is insulated"      -> here, wantInsulated true
#   "insulate these"                 -> SET_MEP_INSULATION - this one only
#                                       reads, and is what to run first to see
#                                       what is left
#   "will the insulation fit"        -> CHECK_INSULATION_CLEARANCE - a
#                                       clearance question, and it needs the
#                                       insulation to exist before it can be
#                                       asked
#   "what insulation is on this
#    duct"                           -> SELECT_BY_HOST with the duct as the
#                                       host, which returns the wrapper itself
#                                       rather than a yes or no

utterances:
  - which ducts still need insulating
  - show me what is already insulated
  - find the bare pipework
  - select insulated ducts
  - which pipes have no insulation

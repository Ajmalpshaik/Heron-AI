runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. Floor.SpanDirectionAngle (double,
  radians), Floor.GetSpanDirectionSymbolIds (ICollection<ElementId>),
  Floor.FloorType, Element.Id, Document, OwnerViewId, GetTypeId and
  get_Parameter(BuiltInParameter), Document.GetElement(ElementId),
  ElementType.FamilyName, View.Name, Parameter.AsInteger and AsValueString,
  and BuiltInParameter.FLOOR_PARAM_IS_STRUCTURAL and FLOOR_PARAM_SPAN_DIRECTION
  carry the same signatures 2020 through 2027 - read with tools/api-surface
  --members on 2026-11-01. SpanDirectionSymbol, the class, exists only from
  2025 and is NOT used here: a symbol is read as an Element, so the card claims
  all eight releases. No ElementId is built from a number or read as one.

# ROUTING (2026-11-01) - the same rows are in SET_FLOOR_SPAN_DIRECTION and
# PLACE_SPAN_DIRECTION_SYMBOLS.
#
#   "what is the span direction of this slab"   -> here
#   "which way does this floor span"            -> here
#   "set the span direction of this slab to     -> SET_FLOOR_SPAN_DIRECTION - a
#    run along grid 1"                             WRITE, and this one only reads
#   "change the floor span to 90 degrees"       -> SET_FLOOR_SPAN_DIRECTION
#   "add span direction symbols to these slabs  -> PLACE_SPAN_DIRECTION_SYMBOLS
#    in this plan"                                 - draws the symbol, 2025 and
#                                                  later. MEASURED 2026-11-01:
#                                                  behind a 2020 or 2024 wall,
#                                                  where that card is not
#                                                  offered, the sentence ranks
#                                                  HERE - it reached
#                                                  SET_FLOOR_SPAN_DIRECTION, a
#                                                  write that turns the span,
#                                                  before this card. Before
#                                                  2025 no card can place the
#                                                  symbol; this one changes
#                                                  nothing and says which
#                                                  floors have one
#   "what is the Mark on these"                 -> READ_ELEMENT_PARAMETERS -
#                                                  one named value off each
#                                                  element
utterances:
  - what is the span direction of this slab
  - which way does this floor span

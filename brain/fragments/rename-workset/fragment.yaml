id: FRG-DOC-016
semantic-identity: "rename a user workset"
kind: action
domain: revit.document
capability: RENAME_WORKSET
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Renames a user workset - the tidy-up when a project's workset names stop
  matching the standard, or when a team name changes mid-job.

  **A WORKSET IS NOT AN ELEMENT, WHICH IS WHY `RENAME_ELEMENTS` CANNOT DO
  THIS.** It lives in the workset table, not in the model, and it is reached
  through a different object entirely. Before this fragment, asking to rename one
  resolved to `SET_VIEW_WORKSET_VISIBILITY` - which changes a drawing.

  **DELETING A WORKSET IS NOT POSSIBLE ON EVERY RELEASE THIS LIBRARY SUPPORTS,
  and that is checked rather than assumed.** The delete call is absent from
  Revit 2020's assembly and present from 2024 - read at both ends. So it is
  reached BY NAME, which keeps one source compiling everywhere and lets the
  older release report a plain reason instead of failing to build.

  **A NAME ALREADY IN USE IS REFUSED BY REVIT.** It is checked first, because a
  throw mid-rename on a workshared model is a confusing place to end up.

  **ON A MODEL THAT IS NOT WORKSHARED THERE ARE NO USER WORKSETS**, and that is
  reported rather than thrown. An empty result there means the question does not
  apply.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: worksetName
      type: string
      source: request
    - name: newName
      type: string
      source: request
    - name: deleteInstead
      type: bool
      source: request
  provides:
    - name: renamed
      role: result
      type: bool
    - name: refused
      # Why it declined, in the user's words. The evidence it looked and said
      # no - never a thing it found, so it must not count toward "did this come
      # back empty" (D-52).
      role: accounting
      type: IList<string>


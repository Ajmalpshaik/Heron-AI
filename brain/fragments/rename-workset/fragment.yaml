tests: tests/

compatibility-note: >
  `WorksetTable.RenameWorkset` and `IsWorksetNameUnique` are present 2020
  through 2027. `DeleteWorkset` and `CanDeleteWorkset` are NOT on 2020 and ARE
  on 2024 - read off the reference assemblies at both ends, which is the whole
  reason the delete path is reached by name through reflection. Naming it
  directly would break the 2020 build, and a try/catch does not help because it
  never gets to run. This is the same shape as `CREATE_HVAC_ZONE`, in the
  opposite direction: there a release TOOK a capability away, here an older
  release never had one.

# ROUTING - repeated in CREATE_WORKSET, LIST_WORKSETS and RENAME_ELEMENTS.
#
#   "rename this workset"                -> here
#   "the workset names are wrong"        -> here
#   "delete this workset"                -> here, and it reports plainly on the
#                                           releases that cannot
#   "make a workset for the ducts"       -> CREATE_WORKSET
#   "what worksets are in this model"    -> LIST_WORKSETS - a READ
#   "rename these elements"              -> RENAME_ELEMENTS - a workset is NOT
#                                           an element and lives in a different
#                                           table entirely

utterances:
  - rename this workset
  - the workset names are wrong
  - delete this workset
  - change the workset name
  - tidy up the workset names

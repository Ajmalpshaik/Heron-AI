id: FRG-VIEW-047
semantic-identity: "put a named scope box on views, or take it off"
kind: action
domain: revit.views
capability: ASSIGN_SCOPE_BOX_TO_VIEW
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Puts a named Scope Box onto views - the view's own Scope Box property - or
  clears it. One scope box across a set of plans is how a drawing series keeps
  the same extent on every sheet without anybody dragging crop regions.

  **A SCOPE BOX CANNOT BE CREATED FROM CODE ON ANY RELEASE HERE**, and that is
  the honest half of this fragment. Revit exposes no create call for one. The
  box is drawn once by hand - View tab, Scope Box - and from then on this can
  put it on as many views as the drawing set needs, which is where the repeated
  work actually is.

  **CLEARING IS THE SAME OPERATION**, not a second one: an empty name writes the
  invalid id, which is what "None" in the properties palette holds. That matters
  because a view stuck on the wrong scope box crops wrong on the sheet and the
  fix is not obvious.

  **A SCOPE BOX IS NOT A CROP AND NOT A SECTION BOX**, and all three answer
  *"only show this part"*. A scope box is a NAMED, SHARED extent that many views
  obey at once and that also controls how far grids and levels reach. A crop
  belongs to one view. A section box cuts the 3D. Choosing the wrong one gives a
  drawing that looks right today and drifts the moment somebody edits one view.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: views
      type: IList<View>
      source: request
    - name: scopeBoxName
      type: string
      source: request
  provides:
    - name: assigned
      role: result
      type: int
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<string>


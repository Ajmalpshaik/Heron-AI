compatibility-note: >
  One implementation for every release. The scope box sits behind
  `BuiltInParameter.VIEWER_VOLUME_OF_INTEREST_CROP`, present 2020 through 2027 -
  read off the reference assemblies at both ends. It is written as an
  `ElementId`, never as a number, which is what keeps this working across the
  release where the type went 64-bit and the one where reading it as an integer
  was removed.

# ROUTING - repeated in SET_VIEW_CROP and SET_VIEW_SECTION_BOX.
#
#   "set the scope box on these views"   -> here
#   "put all these plans on the same scope box" -> here
#   "take the scope box off this view"   -> here, with an empty name
#   "make me a scope box"                -> NOTHING HERE CAN. Revit exposes no
#                                           create call for one on any release.
#                                           Draw it once by hand - View tab,
#                                           Scope Box - then use this
#   "just show me this part of the plan" -> SET_VIEW_CROP - one view only
#   "cut the 3D down to this area"       -> SET_VIEW_SECTION_BOX

utterances:
  - set the scope box on these views
  - put all these plans on the same scope box
  - take the scope box off this view
  - assign the scope box to these plans
  - clear the scope box from these views

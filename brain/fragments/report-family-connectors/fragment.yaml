compatibility-note: >
  `ConnectorElement` `Origin`, `Direction`, `Domain`, `Shape`, `Radius`,
  `Width`, `Height`, `SystemClassification`, `IsPrimary` and
  `GetLinkedConnectorElement`, `FamilyManager.GetAssociatedFamilyParameter`,
  and the built-in parameters RBS_DUCT/PIPE_FLOW_DIRECTION_PARAM,
  RBS_DUCT/PIPE_FLOW_CONFIGURATION_PARAM, RBS_DUCT/PIPE_FITTING_LOSS_METHOD_PARAM
  and RBS_CONNECTOR_DESCRIPTION are present 2020, 2024 and 2027 (api-surface,
  read 2026-10-04).

# ROUTING - see SET_FAMILY_CATEGORY for the whole family-building table.
#
#   "list this family's connectors"              -> here
#   "which way does the connector point"         -> here
#   "set the connectors to Global", "flip it"    -> SET_FAMILY_CONNECTOR_ROLES
#   "put a connector on this face"               -> ADD_FAMILY_CONNECTOR
#   "delete the connector on Air Outlet"         -> REMOVE_FAMILY_CONNECTOR -
#                                                   takes the ids listed here
#   "what connectors are on these ducts"         -> REPORT_CONNECTORS, placed
#                                                   elements in a project

utterances:
  - list the connectors in this family
  - which way does each connector in this family point
  - what system is each connector of this family

id: FRG-SHT-006
semantic-identity: "the sheets in this model, optionally narrowed by sheet number or by title"
kind: filter
domain: revit.sheets
capability: FIND_SHEETS
version: 3
source: OFFICIAL
risk: READ

purpose: >
  Answers "which sheets" for everything that acts on sheets - renumbering,
  revisions, placing views, batch export to PDF or DWG. The sheet half of the
  spine FIND_VIEWS is the view half of (D-45).

  Matches on EITHER the sheet number or the sheet name, because both are what
  people say. "The M-series" is a number; "the ground floor sheets" is a name.
  A filter that only reads the number answers half the requests and returns a
  confident zero for the other half.

  PLACEHOLDER SHEETS ARE RETURNED, AND REPORTED SEPARATELY BY ID. A placeholder
  is a real sheet with a number and a name, carrying no titleblock, that cannot
  hold a view. The two things that act on sheets want opposite treatment: a
  renumbering or revision job MUST see them or it silently renumbers some of the
  set, while placing a viewport or exporting to PDF cannot use one at all.

  Silent omission is the worse failure of the two, so nothing is dropped here -
  the ids are handed over and the action decides.

  **"THE DRAWING LIST" IS AMBIGUOUS AND BOTH ANSWERS ARE RIGHT.** In Revit a
  sheet list IS a schedule, so that sentence can mean either the sheets
  themselves or the schedule that lists them:

  | What you meant | Use |
  |---|---|
  | The sheets — to place views on, renumber, export | **this fragment** |
  | The schedule that lists them — to add a column, export to CSV | `FIND_SCHEDULES` |

  `FIND_SCHEDULES` carries the same table, identically. An action that excludes them
  does so visibly; a filter that had already removed them would leave a
  renumbering job reporting success over an incomplete set, which is this
  repository's defining failure and the reason FIND_VIEWS counts what it skips.

  **VERSION 2 reads each sheet back as the drawing list.** One `findings` row
  per sheet - its number, its name and how many views are on it - with EMPTY
  on a sheet that holds none and PLACEHOLDER on one that cannot. A sheet VIEW
  TEMPLATE is not a sheet and is left out. Version 1's proof no longer
  describes the code and is kept as a record; the card is DRAFT until it is
  proved again.

  **VERSION 3 picks the sheets of an issue.** By one revision - its Seq., its
  description or its date - carried ANYWHERE on the sheet, not only as the
  latest; a description that fits two revisions is refused and both are named.
  And by a typed list of sheet numbers matched WHOLE: "179, 180" never picks
  1790, where the part-match above would. Numbers that name no sheet, listed
  sheets without the revision and sheets Revit would not read are each said.

contract:
  needs:
    - name: doc
      type: Document
    - name: numberOrNameContains
      # A PART of a sheet number or a sheet name - "M-", "ground floor". Version
      # 3: optional, and left out it is "all" - not narrowed by it. Typed as
      # exactly "all" it means every sheet; "wall" is still a part-match.
      type: string
      source: request
      optional: true
      absent: all
    # VERSION 3, from FIND_SHEETS_BY_REVISION_OR_NUMBER. The revision's number
    # in the Seq. column of Sheet Issues/Revisions - "15", or "Seq. 15". One
    # number. Left out: "any" - not narrowed by it.
    - name: revisionSequence
      type: string
      source: request
      optional: true
      absent: any
    # VERSION 3. The revision's description, or a part of it - "IAB-ISSUED
    # AS-BUILT", "as-built". Whole first, then a part; ignoring case. Two
    # revisions fitting is refused. Left out: "any".
    - name: revisionDescription
      type: string
      source: request
      optional: true
      absent: any
    # VERSION 3. The revision's date exactly as the dialog shows it -
    # "14.10.2026". Ignoring case and outer spaces; may fit several. Left
    # out: "any".
    - name: revisionDate
      type: string
      source: request
      optional: true
      absent: any
    # VERSION 3. Sheet numbers with commas, semicolons or new lines between -
    # "179, 180, 181". Each matched WHOLE, ignoring case - a separate input
    # from numberOrNameContains, whose "17" also finds 170. No ranges:
    # "179-186" cannot be told from a sheet numbered 179-186. Left out: "all".
    - name: sheetNumbers
      type: string
      source: request
      optional: true
      absent: all
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: placeholders
      # Placeholder sheets - real rows in the drawing register with no view
      # behind them, which is a distinct thing to know about rather than a
      # reject.
      role: result
      type: IList<ElementId>
    - name: matchedOnName
      # How many matched on the sheet NAME rather than its number. Which half
      # of the match ran, never a sheet it found (D-52).
      role: accounting
      type: int
    - name: findings
      # Version 2, from LIST_SHEETS. One row per sheet returned, in sheet
      # number order: "M-101  Level 1 Plan  (2 views)", with " - EMPTY" on a
      # sheet holding no view and " - PLACEHOLDER, no titleblock and cannot be
      # printed" on a placeholder. The count is GetAllPlacedViews - a title
      # block, a legend component and a schedule are not counted. Prose, so
      # it carries no role (D-51).
      type: IList<string>
    - name: revisionsMatched
      # Version 3, from FIND_SHEETS_BY_REVISION_OR_NUMBER. Every revision the
      # revision inputs chose - its sequence, number, date and description,
      # and how many sheets carry it - with " || " between. What the INPUTS
      # resolved to, never a sheet found (D-52). A STRING, because a list
      # reaches the reply cut to three short entries. Empty with no revision
      # asked for.
      role: accounting
      type: string
    - name: notFound
      # Version 3. Typed sheet numbers that name no sheet in this model. What
      # it was GIVEN and could not find, never a thing found (D-52).
      role: accounting
      type: string
    - name: listedWithoutRevision
      # Version 3. Listed sheets that exist but do not carry the revision -
      # the check before an issue. Left out of `elements` and named here
      # (D-52).
      role: accounting
      type: string
    - name: notRead
      # Version 3. Sheets whose revisions Revit would not hand over, with why.
      # Counted, never matched and never dropped in silence (D-52).
      role: accounting
      type: string
    - name: refused
      # Version 3. Why it declined, in the modeller's words - a sequence that
      # is not one number, a description fitting two revisions, a revision
      # that is not in the project (naming the project's revisions), a list
      # holding no number. Nothing is returned when it is set (D-52).
      role: accounting
      type: string


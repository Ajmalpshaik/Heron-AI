compatibility-note: >
  One implementation for every release. `ViewSheet`, `SheetNumber`, `Name` and
  `IsPlaceholder` are unchanged 2020 to 2027 and no units call is made.
  `placeholders` carries `ElementId`, whose backing width changed at 2024 - it is
  only collected and returned here, never converted to or from an integer, which
  is what keeps this clear of that break.
#   "which sheets carry this date"       -> LIST_DATES_ON_SHEETS, which
#                                           reads the dates typed on them

# VERSION 2 (2026-11-01) - LIST_SHEETS WAS MERGED INTO THIS CARD on the
# owner's instruction ("now merge the other duplicates also"), and is
# DEPRECATED. The same read - the project's sheets in sheet-number order,
# placeholders returned and flagged - and this card also narrows them by
# number or by name and hands them to whatever acts on them next. What
# LIST_SHEETS had and this card lacked is here now: a findings row per sheet
# with its view count and EMPTY / PLACEHOLDER, and a sheet view template
# dropped. WHERE LIST_SHEETS' OUTPUTS ARE NOW: elements -> elements,
# placeholders -> placeholders, findings -> findings, the same wording. Its
# sentences and its routing rows moved here.
#
# ROUTING - repeated in CREATE_SHEETS and PLACE_VIEW_ON_SHEET (LIST_SHEETS'
# rows, moved here with it).
#
#   "list the sheets"            -> here. A QUESTION
#   "how many sheets are there"  -> here
#   "which sheets are empty"     -> here - the view count is on every row
#   "the m series sheets"        -> here - narrowed by number or by name
#   "what views are on this sheet"
#                                -> LIST_VIEWS_ON_SHEET. This card only
#                                   COUNTS a sheet's views; that one NAMES
#                                   them, with type and scale, and lists the
#                                   schedules apart (row 146, 2026-10-09)
#   "put this view on a sheet"   -> PLACE_VIEW_ON_SHEET. A CHANGE
#   "make a new sheet"           -> CREATE_SHEETS
#   "which sheets have this revision" -> LIST_REVISIONS
#   "how many sheet sets are there"  -> LIST_SHEET_SETS - the saved View/Sheet
#                                       Sets, which hold views as well as
#                                       sheets. A set is not a sheet (row
#                                       5b-465, 2026-10-14)
#   "make a sheet list schedule" -> CREATE_SHEET_LIST - a schedule VIEW that
#                                   prints on the cover. This is a READ that
#                                   makes nothing

# ROUTING (2026-10-14, FRAGMENT-ISSUES row 5b-471).
#
#   "these sheets: 179, 180, 181"      -> FIND_SHEETS_BY_REVISION_OR_NUMBER - whole
#                                         numbers; "17" here also finds 170 and 179
#   "sheets on revision 15"            -> FIND_SHEETS_BY_REVISION_OR_NUMBER - any
#                                         revision on the sheet. Row 5b-550


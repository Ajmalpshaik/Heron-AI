id: FRG-SHT-006
semantic-identity: "the sheets in this model, optionally narrowed by sheet number or by title"
kind: filter
domain: revit.sheets
capability: FIND_SHEETS
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Answers "which sheets" for everything that acts on sheets - renumbering,
  revisions, placing views, batch export to PDF or DWG. The sheet half of the
  spine FIND_VIEWS is the view half of (D-45).

  Matches on EITHER the sheet number or the sheet name, because both are what
  people say. "The M-series" is a number; "the ground floor sheets" is a name.
  A filter that only reads the number answers half the requests and returns a
  confident zero for the other half.

  PLACEHOLDER SHEETS ARE RETURNED, AND REPORTED SEPARATELY BY ID. A placeholder
  is a real sheet with a number and a name, carrying no titleblock, that cannot
  hold a view. The two things that act on sheets want opposite treatment: a
  renumbering or revision job MUST see them or it silently renumbers some of the
  set, while placing a viewport or exporting to PDF cannot use one at all.

  Silent omission is the worse failure of the two, so nothing is dropped here -
  the ids are handed over and the action decides.

  **"THE DRAWING LIST" IS AMBIGUOUS AND BOTH ANSWERS ARE RIGHT.** In Revit a
  sheet list IS a schedule, so that sentence can mean either the sheets
  themselves or the schedule that lists them:

  | What you meant | Use |
  |---|---|
  | The sheets — to place views on, renumber, export | **this fragment** |
  | The schedule that lists them — to add a column, export to CSV | `FIND_SCHEDULES` |

  `FIND_SCHEDULES` carries the same table, identically. An action that excludes them
  does so visibly; a filter that had already removed them would leave a
  renumbering job reporting success over an incomplete set, which is this
  repository's defining failure and the reason FIND_VIEWS counts what it skips.

  **VERSION 2 reads each sheet back as the drawing list.** One `findings` row
  per sheet - its number, its name and how many views are on it - with EMPTY
  on a sheet that holds none and PLACEHOLDER on one that cannot. A sheet VIEW
  TEMPLATE is not a sheet and is left out. Version 1's proof no longer
  describes the code and is kept as a record; the card is DRAFT until it is
  proved again.

contract:
  needs:
    - name: doc
      type: Document
    - name: numberOrNameContains
      type: string
      source: request
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: placeholders
      # Placeholder sheets - real rows in the drawing register with no view
      # behind them, which is a distinct thing to know about rather than a
      # reject.
      role: result
      type: IList<ElementId>
    - name: matchedOnName
      # How many matched on the sheet NAME rather than its number. Which half
      # of the match ran, never a sheet it found (D-52).
      role: accounting
      type: int
    - name: findings
      # Version 2, from LIST_SHEETS. One row per sheet returned, in sheet
      # number order: "M-101  Level 1 Plan  (2 views)", with " - EMPTY" on a
      # sheet holding no view and " - PLACEHOLDER, no titleblock and cannot be
      # printed" on a placeholder. The count is GetAllPlacedViews - a title
      # block, a legend component and a schedule are not counted. Prose, so
      # it carries no role (D-51).
      type: IList<string>


compatibility-note: >
  One implementation for every release. `ViewSheet`, `SheetNumber`, `Name` and
  `IsPlaceholder` are unchanged 2020 to 2027 and no units call is made.
  `placeholders` carries `ElementId`, whose backing width changed at 2024 - it is
  only collected and returned here, never converted to or from an integer, which
  is what keeps this clear of that break.

  Version 3 adds `ViewSheet.GetAllRevisionIds()` and
  `Revision.GetAllRevisionIds(Document)`, `SequenceNumber`, `RevisionNumber`,
  `RevisionDate` and `Description` - unchanged 2020 to 2027, read 2026-10-17
  off each release's reference assembly with tools/api-surface --members for
  FIND_SHEETS_BY_REVISION_OR_NUMBER, which called them the same way. Ids are
  kept and compared as ElementId.
#   "which sheets carry this date"       -> FIND_DATES_IN_VIEWS, onlySheets
#                                           on, which reads the dates typed
#                                           on them (LIST_DATES_ON_SHEETS
#                                           until it was merged there,
#                                           2026-11-01)

# VERSION 3 (2026-11-01) - FIND_SHEETS_BY_REVISION_OR_NUMBER WAS MERGED INTO
# THIS CARD on the owner's instruction ("make sure there is no duplicate
# tools"), and is DEPRECATED. The same job - the sheets, narrowed, handed to
# the next step - and its own record already named this card as the natural
# home, held back only because a change here needed the owner's yes. What it
# had and this card lacked is here now: the sheets of ONE REVISION, by
# sequence, description or date, matched against every revision on the sheet
# (GetAllRevisionIds), not only the latest; a description fitting two
# revisions refused and both named; a typed list of sheet numbers matched
# WHOLE, a separate input from the part-match; and revisionsMatched,
# notFound, listedWithoutRevision, notRead and refused.
#
# ONE RULE WAS OPPOSITE, AND THE SAFER ONE IS KEPT (the owner: "in every
# conflict keep the safer rule"). That card returned a sheet VIEW TEMPLATE
# like a sheet; this one leaves it out, as version 2 does. NOT CARRIED: that
# card refused when nothing at all was given; here nothing given is every
# sheet, this card's proved job. A revision or a list given that fits nothing
# is still refused or empty, never widened to every sheet.
#
# WHERE ITS OUTPUTS ARE NOW: elements -> elements, placeholders ->
# placeholders, and revisionsMatched, notFound, listedWithoutRevision, notRead
# and refused under the same names. Its sentences moved here.
#
# ROUTING - FIND_SHEETS_BY_REVISION_OR_NUMBER's rows, moved here with it.
#
#   "the sheets with the as-built revision"  -> here - revisionDescription
#   "sheets on revision 15"                  -> here - revisionSequence
#   "these sheets: 179, 180, 181"            -> here - sheetNumbers, whole
#   A match on "Current Revision Description" is SELECT_BY_PARAMETER_VALUE,
#   and reads the LATEST revision on each sheet only.
#   "save these sheets as a named set"       -> MANAGE_SHEET_SETS, handed
#                                               this card's elements
#   "put that revision on these sheets"      -> SET_SHEET_REVISIONS

# VERSION 2 (2026-11-01) - LIST_SHEETS WAS MERGED INTO THIS CARD on the
# owner's instruction ("now merge the other duplicates also"), and is
# DEPRECATED. The same read - the project's sheets in sheet-number order,
# placeholders returned and flagged - and this card also narrows them by
# number or by name and hands them to whatever acts on them next. What
# LIST_SHEETS had and this card lacked is here now: a findings row per sheet
# with its view count and EMPTY / PLACEHOLDER, and a sheet view template
# dropped. WHERE LIST_SHEETS' OUTPUTS ARE NOW: elements -> elements,
# placeholders -> placeholders, findings -> findings, the same wording. Its
# sentences and its routing rows moved here.
#
# ROUTING - repeated in CREATE_SHEETS and PLACE_VIEW_ON_SHEET (LIST_SHEETS'
# rows, moved here with it).
#
#   "list the sheets"            -> here. A QUESTION
#   "how many sheets are there"  -> here
#   "which sheets are empty"     -> here - the view count is on every row
#   "the m series sheets"        -> here - narrowed by number or by name
#   "what views are on this sheet"
#                                -> LIST_VIEWS_ON_SHEET. This card only
#                                   COUNTS a sheet's views; that one NAMES
#                                   them, with type and scale, and lists the
#                                   schedules apart (row 146, 2026-10-09)
#   "put this view on a sheet"   -> PLACE_VIEW_ON_SHEET. A CHANGE
#   "make a new sheet"           -> CREATE_SHEETS
#   "which sheets have this revision" -> LIST_REVISIONS - a QUESTION,
#                                       answered for every revision; this
#                                       card picks the sheets of one for the
#                                       next step (version 3)
#   "how many sheet sets are there"  -> LIST_SHEET_SETS - the saved View/Sheet
#                                       Sets, which hold views as well as
#                                       sheets. A set is not a sheet (row
#                                       5b-465, 2026-10-14)
#   "make a sheet list schedule" -> CREATE_SCHEDULE, listKind sheets (CREATE_
#                                   SHEET_LIST until it was merged there,
#                                   2026-11-01) - a schedule VIEW that
#                                   prints on the cover. This is a READ that
#                                   makes nothing

# ROUTING (2026-10-14, FRAGMENT-ISSUES row 5b-471; repointed 2026-11-01 when
# FIND_SHEETS_BY_REVISION_OR_NUMBER was merged here).
#
#   "these sheets: 179, 180, 181"      -> here, sheetNumbers - whole numbers;
#                                         numberOrNameContains "17" also finds
#                                         170 and 179
#   "sheets on revision 15"            -> here, revisionSequence - any revision
#                                         on the sheet. Row 5b-550


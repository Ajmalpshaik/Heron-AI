# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: a model with sheets, numberOrNameContains ""
    expect: >
      every sheet returned, ordered by sheet number. Compare the count against
      the Sheets branch of the Project Browser by eye - it must match exactly,
      placeholders included

  - given: numberOrNameContains matching part of a sheet NUMBER, e.g. "M-"
    expect: only the sheets whose number contains it, and matchedOnName = 0

  - given: numberOrNameContains matching only a sheet NAME, e.g. "ground floor"
    expect: >
      those sheets returned and matchedOnName equal to their count. This is the
      half a number-only filter answers with a confident zero

  - given: >
      VERSION 2. A sheet with two plans on it, one with only a schedule on it,
      and a placeholder, asked with no filter
    expect: >
      one findings row each, in sheet-number order: the first "(2 views)", the
      second "(0 views) - EMPTY" - a schedule is not a view - and the
      placeholder "- PLACEHOLDER, no titleblock and cannot be printed".
      Version 1 had no findings at all

negative:
  - given: >
      a model containing PLACEHOLDER sheets, asked for with no filter
    expect: >
      they ARE in elements, and their ids ARE in placeholders. This is the case
      the fragment exists for: dropping them makes a renumbering job report
      success over an incomplete drawing register, and nobody sees it until the
      list is printed

  - given: the placeholder ids handed to an action that places a viewport
    expect: >
      that action refuses them BY ID and says so. The filter must not have made
      that decision on the action's behalf - proving it did not is the point

  - given: a string matching no sheet number and no sheet name
    expect: >
      elements empty, placeholders empty, matchedOnName 0 - and no exception.
      An empty result here genuinely means no such sheet, because nothing was
      excluded on the way

  - given: a model with no sheets at all
    expect: all three outputs empty, reported as nothing to do rather than as a fault

  # VERSION 2 (2026-11-01, LIST_SHEETS merged in). Each of these FAILS on
  # version 1.
  - given: VERSION 2. A project holding a view template for sheets, asked with no filter
    expect: >
      it is NOT in elements and has no findings row. It carries a number and a
      name and looks exactly like a sheet; version 1 returned it, and a row in
      the register that can never be issued went to whatever acted next

second_route:
  - count the sheets in the Project Browser by eye and compare
  - open one returned id that is listed as a placeholder - Revit shows no titleblock
  - search by a word that appears only in a sheet TITLE and confirm it is found

id: FRG-SHT-014
semantic-identity: "the plan jumps about when i flick through the sheets"
kind: action
domain: revit.sheets
capability: ALIGN_VIEWPORTS_ACROSS_SHEETS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Puts the plan in the same place on every sheet: one sheet is the master and
  every other sheet's viewport moves to match it. The fix for a set where the
  building shifts as somebody pages through the drawings.

  **TWO THINGS DECIDE WHETHER THIS IS EVEN MEANINGFUL, AND BOTH ARE CHECKED
  BEFORE ANYTHING MOVES.** A viewport's centre is measured in SHEET space, not
  from the title block - so if one sheet's title block sits at a different
  origin, copying the centre lands the plan at the right sheet coordinate and
  the wrong place on the paper. Revit does not stop you, and nothing looks
  wrong until it prints. And two viewports at different SCALES cannot line up
  by their centres at all: the same centre puts different amounts of building
  in the same box.

  **A MISMATCHED SHEET IS SKIPPED AND NAMED, NEVER SILENTLY "ALIGNED".** Both
  cases above produce a sheet that is now differently wrong, and the report is
  the only thing that says which sheets to look at.

  **A SHEET WITH SEVERAL VIEWPORTS IS AMBIGUOUS AND IS LEFT ALONE.** Which of
  three views is "the plan" is not a question this can answer, and moving the
  wrong one is worse than moving none.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16), so a
  whole drawing set is one undo entry.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: masterSheetNumber
      type: string
      source: request
  provides:
    - name: aligned
      role: result
      type: int
    - name: scaleMismatch
      # Sheets whose viewport is at a different scale, so the centres cannot
      # line up. A MISMATCHED SHEET IS SKIPPED AND NAMED - never a sheet it
      # aligned (D-52).
      role: accounting
      type: IList<ElementId>
    - name: titleBlockMoved
      # Sheets whose title block sits at a different origin, so copying the
      # centre would land the plan in the wrong place on the paper. Skipped
      # and named (D-52).
      role: accounting
      type: IList<ElementId>
    - name: ambiguous
      # Sheets with several viewports, where which one is the plan is not a
      # question this can answer. LEFT ALONE, never aligned (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>

proof:
  date: '2026-09-13'
  by: Ajmal PS
  model: test projject (3,494 elements), Revit 2024, session 40932
  positive_case: run as it would normally be run - the arrangement was re-made first by running
    list-sheets, set-selection with this phase's own values - run inside a transaction, and
    Revit reported the transaction group ROLLED BACK afterwards. returned aligned 1, ambiguous
    0 item(s), master ViewSheet, masterViewport Viewport, onlyViewportOf Func`2, refused 0
    item(s), scaleMismatch 0 item(s), titleBlockMoved 0 item(s), titleBlockOf Func`2, wantedMaster
    HERON-01. inputs came elements from the selection (2); masterSheetNumber as given. on
    test projject
  negative_case: run with masterSheetNumber=HERON-99 instead - chosen because it should not
    contain what this fragment reports - the arrangement was re-made first by running list-sheets,
    set-selection with this phase's own values - run inside a transaction, and Revit reported
    the transaction group ROLLED BACK afterwards. returned aligned 0, ambiguous 0 item(s),
    master (null), masterViewport (null), onlyViewportOf Func`2, refused 2 item(s) [926022,
    926119], scaleMismatch 0 item(s), titleBlockMoved 0 item(s), titleBlockOf Func`2, wantedMaster
    HERON-99. inputs came elements from the selection (2); masterSheetNumber as given. on
    test projject
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  caveat: >-
    THE CASE ITS FILE CALLS FIRST WAS BUILT AND HELD, and it is not an emptiness case so it
    cannot be a leg. tests/cases.yaml asks for a sheet whose view is at 1:50 while the master
    is 1:100, expecting its id in scaleMismatch and NOT moved - because 'two scales cannot line
    up by their centres, the same centre puts different amounts of building in the box, and
    aligning it makes it differently wrong'. Measured 2026-09-13 on `test projject`:
    set-view-scale put '1 - Ceiling Mech' to 50 against the 1:100 master on HERON-01, and the
    same call answered aligned 0, scaleMismatch 1 [926119], refused 0 - the sheet named and
    nothing moved. The scale was then set back to 100, so the legs recorded above reproduce
    against the model as it now stands. WHAT IS NOT PROVED is the second declared negative, a
    sheet carrying THREE viewports reported as ambiguous: every sheet in this model holds
    exactly one.
  fingerprint: e87529a65effd331

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. A viewport's box centre is read and set
  by the same two calls 2020 to 2027, and the title block's origin is its own
  location point. Nothing here depends on a units API.

# ROUTING - the same rows are in the fragments named here.
#
#   "the plan jumps between sheets"      -> here
#   "line the viewports up"              -> here
#   "put this view on a sheet"           -> PLACE_VIEW_ON_SHEET, which places
#                                           one. This moves ones already placed
#   "put these views on sheets"          -> PLACE_VIEWS_ON_SHEET
#   "make the sheets"                    -> CREATE_SHEETS
#   "change the title block"             -> SET_SHEET_TITLE_BLOCK. This
#                                           fragment only MOVES a title block,
#                                           and only when asked to
#   "the views are at different scales"  -> SET_VIEW_SCALE, which is what makes
#                                           an alignment possible at all

utterances:
  - the plan jumps when i flick through the sheets
  - line up the viewports across the sheets
  - put the plan in the same place on every sheet
  - align the views on these sheets

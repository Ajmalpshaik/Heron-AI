# VERSION 3 (2026-11-01) - SELECT_SUBCOMPONENTS WAS MERGED INTO THIS CARD on the
# owner's instruction ("make sure there is no duplicate tools", then "ok go
# ahead merge all"), and is DEPRECATED. The same job - what is INSIDE a
# container the collector returns whole, handed on as elements the next step
# can read - and a nested family is the third kind of container. What it had
# and this card lacked: a LIST of parents (the selection, or a set a chain
# hands on) rather than one element; GetSubComponentIds followed as deep as
# somebody built it, with `recursive` and the depth reached reported; every id
# visited once, so a family that refers back to itself cannot loop;
# `withoutSubComponents`, the parents with none, so an empty answer is not a
# failed read; and a handed-in element that is not a family instance counted
# and named. Its outputs are this card's `elements`, `withoutSubComponents`
# (the same name) and `findings`.
#
# THE INPUT CHANGED SHAPE TO HOLD THAT: `group`, one element typed "selected",
# is now `containers`, a list filled from the Revit selection or from the
# `elements` a chain hands on - one group selected is a list of one, exactly as
# before. Several containers are opened together and each member comes back
# once.
#
# THE TWO CARDS' DEPTH RULES WERE OPPOSITE, AND EACH IS KEPT FOR ITS OWN KIND -
# not one for both: a GROUP is opened one level and a nested group comes back
# whole (this card's rule, so the count agrees with Revit and a structure the
# modeller built is not hidden); a NESTED FAMILY is followed down by default
# (that card's rule, because nothing else ever returns those parts and a count
# that stops one level down is short with no sign of it). `recursive` false
# keeps nested families to one level; it never flattens a group. Nothing of
# that card is left out.
#
# THIS CARD'S OWN MESSAGE NAMED GROUP_BY_ASSEMBLY for "a nested family's
# parts" - a card merged away before this one, which walked nested families
# and never opened an assembly. Such an element is now opened here, so the
# message is gone with the reason for it.
#
# Version 2's proof below no longer describes the code (impl/ changed) and is
# kept as the record; DRAFT until version 3 is proved on a real model (D-30).

purpose: >
  Returns the member elements of a model group instance - the repeated toilet
  block, the typical FCU-and-terminals cluster - or of an assembly - the pipe
  spool, the prefabricated riser - as a set the next fragment can act on.

  **An assembly is opened the same way, and says it is one.** Version 2. An
  assembly (Create > Assembly) is a container of its own: like a group, the
  collector returns the assembly and not its members, and like a group it is
  opened by the instance, never by a name several copies share. Its members are
  read back with the assembly's type name and naming category, and
  `containerKind` says which of the two was opened.

  **A group instance is one element, and its members are not in any normal
  sweep.** `FilteredElementCollector` returns the group, not the twelve things
  inside it, so every count and every filter in this library sees a group as a
  single item. This is the fragment that opens it.

  **Reading a group is safe; acting on what comes out usually is not.** Revit
  will not let a member be changed in place - editing one means entering group
  edit mode, or the change applies to every instance of that group type. So
  this returns the members and says plainly that a write against them is
  likely to be refused or to hit every copy. That warning belongs here, at the
  point the set is produced, not at the point somebody is surprised.

  **A group NAME is a type name, and several instances share it.** Naming a
  group by name is therefore ambiguous whenever it is placed more than once -
  which is the entire reason groups exist. So an instance is what this takes,
  and there is no name lookup to guess with.

  **Nested groups come back as groups**, one element each, not flattened. A
  member that is itself a group can be handed back in for its own members;
  flattening silently would make the count disagree with what Revit shows and
  hide a structure the modeller built on purpose.

  **A FAMILY INSTANCE IS OPENED TOO** (version 3) - its nested shared
  families, the parts a category sweep never returns: the fan and coil inside
  an air handling unit. Nesting goes as deep as somebody built it, so it is
  followed by default and the depth is reported; a parent with no
  sub-components is the ordinary case and is counted, never mistaken for a
  failed read.

contract:
  needs:
    - name: doc
      type: Document
    # VERSION 3. The containers to open - model groups, assemblies or family
    # instances - from the Revit selection, or the `elements` a chain hands
    # on. One group selected is a list of one, as `group` was until version 3.
    - name: containers
      type: IList<Element>
      binds: elements
    # VERSION 3, from SELECT_SUBCOMPONENTS. Nested families followed all the
    # way down (true), or one level only (false). Left out it is TRUE - a part
    # four levels down is still a part. It never flattens a group.
    - name: recursive
      type: bool
      source: request
      optional: true
      absent: 'true'
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: containerKind
      # "group", "assembly" or, since version 3, "family" - which kinds of
      # container were opened, joined by commas when several; empty when
      # nothing handed in was one. Version 2.
      role: accounting
      type: string
    - name: nestedGroups
      # How many members are themselves groups. NESTED GROUPS COME BACK AS
      # GROUPS, ONE ELEMENT EACH, NOT FLATTENED - so this is what says the set
      # is shallower than it looks.
      role: result
      type: int
    - name: withoutSubComponents
      # VERSION 3, from SELECT_SUBCOMPONENTS. Family instances handed in that
      # had no nested families - the ordinary case, reported so an empty
      # answer cannot be mistaken for a failed read. Evidence it ran, never a
      # part it found (D-52).
      role: accounting
      type: int
    - name: findings
      type: IList<string>


compatibility-note: >
  One implementation for every release. `Group.GetMemberIds` and `GroupType` are
  present 2020 through 2027, compiled at both ends. `AssemblyInstance.GetMemberIds`,
  `AssemblyTypeName` and `NamingCategoryId` are present 2020 through 2027,
  read with tools/api-surface on 2026-10-14. Member ids are resolved
  through `Document.GetElement` and compared as ElementIds, never as numbers.

# ROUTING - repeated in GROUP_ELEMENTS, UNGROUP_ELEMENTS and GROUP_BY_ASSEMBLY.
#
#   "what is in this group"          -> here
#   "select the elements inside this group" -> here
#   "group these"                    -> GROUP_ELEMENTS - the write
#   "explode this group"             -> UNGROUP_ELEMENTS. That is what is
#                                       really wanted when the next step is to
#                                       EDIT the members - this fragment only
#                                       hands them out to read
#   "what is in this assembly"       -> here, since version 2. It went to
#                                       GROUP_BY_ASSEMBLY, which walks NESTED
#                                       FAMILIES and never opens an assembly,
#                                       and on 2026-10-14 the sentence reached
#                                       CREATE_ASSEMBLY, a write (row 5b-470)
#   "how many units are these really"-> GROUP_BY_ASSEMBLY / REPORT_NESTED_FAMILIES -
#                                       nested families, not assemblies (row 5b-469)
#   "how many of these groups
#    are there"                      -> COUNT_ELEMENTS over the group category

utterances:
  - what is in this group
  - select the elements inside this group
  - show me the group members
  - list what this group contains
  - find everything in this model group
  # ADDED 2026-10-14, version 2, row 5b-470: an assembly is opened here too.
  - what is in this assembly
  - select the elements in this assembly
  - show me the assembly members
  - list what this pipe spool assembly contains
  - which elements are in this assembly

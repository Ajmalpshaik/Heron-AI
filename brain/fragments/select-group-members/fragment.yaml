compatibility-note: >
  One implementation for every release. `Group.GetMemberIds` and `GroupType` are
  present 2020 through 2027, compiled at both ends. `AssemblyInstance.GetMemberIds`,
  `AssemblyTypeName` and `NamingCategoryId` are present 2020 through 2027,
  read with tools/api-surface on 2026-10-14. Member ids are resolved
  through `Document.GetElement` and compared as ElementIds, never as numbers.
  Version 3's `FamilyInstance.GetSubComponentIds` is present 2020 through
  2027, compiled at both ends for SELECT_SUBCOMPONENTS; the visited ids are a
  list of ElementId compared by value, never a set of numbers.

# ROUTING - repeated in GROUP_ELEMENTS, UNGROUP_ELEMENTS, REPORT_NESTED_FAMILIES,
# SELECT_BY_HOST and COUNT_ELEMENTS.
#
#   "what is in this group"          -> here
#   "select the elements inside this group" -> here
#   "group these"                    -> GROUP_ELEMENTS - the write
#   "explode this group"             -> UNGROUP_ELEMENTS. That is what is
#                                       really wanted when the next step is to
#                                       EDIT the members - this fragment only
#                                       hands them out to read
#   "what is in this assembly"       -> here, since version 2. It went to
#                                       GROUP_BY_ASSEMBLY, which walks NESTED
#                                       FAMILIES and never opens an assembly,
#                                       and on 2026-10-14 the sentence reached
#                                       CREATE_ASSEMBLY, a write (row 5b-470)
#   "what is inside this equipment",
#   "the nested families in these"   -> here, a family instance (version 3,
#                                       SELECT_SUBCOMPONENTS merged in) - as
#                                       elements to act on
#   "how many units are these really"-> REPORT_NESTED_FAMILIES, which walks UP
#                                       to the outermost host as well as down,
#                                       and reports (row 5b-469)
#   "what is hosted on this wall"    -> SELECT_BY_HOST. Hosting is a door in a
#                                       wall; nesting is a family built out of
#                                       families. A modeller says "inside" for
#                                       both and they return different sets
#   "count the sensors"              -> COUNT_ELEMENTS, and it comes back SHORT
#                                       by every sensor nested inside
#                                       equipment. Run this first and add them
#   "how many of these groups
#    are there"                      -> COUNT_ELEMENTS over the group category


id: FRG-SEL-014
semantic-identity: "everything inside this group or assembly, as elements i can act on"
kind: filter
domain: revit.selection
capability: SELECT_GROUP_MEMBERS
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Returns the member elements of a model group instance - the repeated toilet
  block, the typical FCU-and-terminals cluster - or of an assembly - the pipe
  spool, the prefabricated riser - as a set the next fragment can act on.

  **An assembly is opened the same way, and says it is one.** Version 2. An
  assembly (Create > Assembly) is a container of its own: like a group, the
  collector returns the assembly and not its members, and like a group it is
  opened by the instance, never by a name several copies share. Its members are
  read back with the assembly's type name and naming category, and
  `containerKind` says which of the two was opened.

  **A group instance is one element, and its members are not in any normal
  sweep.** `FilteredElementCollector` returns the group, not the twelve things
  inside it, so every count and every filter in this library sees a group as a
  single item. This is the fragment that opens it.

  **Reading a group is safe; acting on what comes out usually is not.** Revit
  will not let a member be changed in place - editing one means entering group
  edit mode, or the change applies to every instance of that group type. So
  this returns the members and says plainly that a write against them is
  likely to be refused or to hit every copy. That warning belongs here, at the
  point the set is produced, not at the point somebody is surprised.

  **A group NAME is a type name, and several instances share it.** Naming a
  group by name is therefore ambiguous whenever it is placed more than once -
  which is the entire reason groups exist. So an instance is what this takes,
  and there is no name lookup to guess with.

  **Nested groups come back as groups**, one element each, not flattened. A
  member that is itself a group can be handed back in for its own members;
  flattening silently would make the count disagree with what Revit shows and
  hide a structure the modeller built on purpose.

contract:
  needs:
    - name: doc
      type: Document
    - name: group
      type: Element
      source: request
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: containerKind
      # "group" or "assembly" - which kind of container was opened, or empty
      # when the element handed in was neither. Version 2.
      role: accounting
      type: string
    - name: nestedGroups
      # How many members are themselves groups. NESTED GROUPS COME BACK AS
      # GROUPS, ONE ELEMENT EACH, NOT FLATTENED - so this is what says the set
      # is shallower than it looks.
      role: result
      type: int
    - name: findings
      type: IList<string>


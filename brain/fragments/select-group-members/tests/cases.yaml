positive:
  - given: a toilet-block group holding 14 elements
    expect: >
      all 14, and the group type name in the report. Count them in Revit by
      entering group edit mode - the two numbers must agree

  - given: >
      the SECOND placed instance of that same group type
    expect: >
      14 again, but 14 DIFFERENT ids. Same type, different copies - if the ids
      match the first instance, the group instance is being ignored and a type
      is being read

  - given: a group holding a nested group
    expect: >
      the nested group returned as ONE element and counted in nestedGroups, not
      flattened into its own members

  - given: >
      an assembly made with Create > Assembly from a pipe spool of 9 elements
      (version 2)
    expect: >
      all 9, containerKind "assembly", the assembly type name and its naming
      category in the report. Count them in Revit with Edit Assembly - the two
      numbers must agree

  # VERSION 3 - SELECT_SUBCOMPONENTS merged in. Each fails on version 2, which
  # refused a family instance as neither a group nor an assembly.
  - given: >
      VERSION 3. An air handling unit built from a shared fan, a coil and two
      dampers, selected - SELECT_SUBCOMPONENTS' own case
    expect: >
      the four nested elements, each with its own category, containerKind
      "family". Select the AHU in Revit and Tab into it to see the same four

  - given: VERSION 3. A fixture nested three levels deep, recursive left out
    expect: >
      every level returned and "followed 3 level(s) deep". With recursive
      false, only the first level

  - given: VERSION 3. Twenty ordinary instances with no nesting, handed on by a chain
    expect: >
      0 elements and withoutSubComponents 20 - the ordinary case, reading as
      ordinary

  - given: >
      VERSION 3. A group holding a nested group AND a family instance with
      nested parts, both selected
    expect: >
      containerKind "group, family"; the nested group ONE element in
      nestedGroups, never flattened, while the family's nested parts are all
      there - each kind's own depth rule

negative:
  - given: VERSION 3. A wall and a duct among the containers
    expect: >
      counted and named as neither a group, an assembly nor a family
      instance. Silently skipping them makes a wrong set indistinguishable
      from a model with no nesting

  - given: VERSION 3. A family nested in a way that refers back to itself
    expect: each element returned once and the run finishing

  - given: VERSION 3. Nothing selected and nothing handed on
    expect: refused, with the reason
  - given: >
      a whole-model COUNT_ELEMENTS run over a model containing this group
    expect: >
      the group counted as ONE. THIS IS THE FIRST CASE TO RUN, because it is
      the fact this fragment exists for - every other filter in the library
      sees a group as a single item, so a modeller's "there are 200 of these"
      and Revit's count disagree until something opens the group

  - given: a write attempted against a returned member
    expect: >
      Revit refusing it, or applying it to EVERY instance of the group type.
      The report has to have said so before that happens

  # VERSION 2'S CASE, KEPT AS THE RECORD AND NO LONGER WHAT IS EXPECTED: since
  # version 3 a pump is a family instance and is OPENED - its nested parts come
  # back (the positive cases above). The refusal it tested is now the wall's,
  # in version 3's negatives.
  - given: >
      VERSION 2 ONLY. An element handed in that is neither a group nor an
      assembly - a pump with nested families inside it
    expect: >
      version 2: refused by name, containerKind empty, and nested families
      pointed at REPORT_NESTED_FAMILIES. Version 3: its nested parts,
      containerKind "family"

  - given: a group whose member list names a deleted element
    expect: >
      the survivors returned and the difference named. A count that quietly
      shrinks is the failure

second_route: >
  Revit itself: select the group, Edit Group, and count what the edit mode
  shows - that is the definition this fragment is claiming to match. For an
  assembly, Edit Assembly shows its members the same way

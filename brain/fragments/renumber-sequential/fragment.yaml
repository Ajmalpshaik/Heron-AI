id: FRG-PAR-004
semantic-identity: "number these elements one after another, in the order given"
kind: action
domain: revit.parameters
capability: RENUMBER_SEQUENTIAL
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Writes a RUNNING SEQUENCE into one parameter, across a batch, in the order the
  elements arrive - D-1, D-2, D-3 along a corridor.

  **Writing ONE value onto one element is WRITE_ELEMENT_PARAMETERS, not this.**
  The sequence is what makes this a separate job. See the routing table below,
  which is kept in a comment for a reason worth knowing before editing it.

  **It does not decide the ORDER, and that is the most important thing about
  it.** Numbering left to right, along a corridor, clockwise round a core or
  simply in selection order are different jobs with different right answers, and
  a fragment that picked one would be silently wrong for the rest. The caller
  hands the elements in the order it wants them numbered - D-33: never assume an
  input.

  **It checks for collisions BEFORE writing anything.** Revit will happily give
  two doors the same number and say nothing; the drawing then looks finished and
  is wrong. Every intended value is compared against what the rest of the model
  already holds, and a clash stops the whole batch rather than producing a
  half-renumbered set nobody can unpick.

  **A NAME TWO PARAMETERS SHARE GETS NO NUMBER.** A shared or project parameter
  can be bound beside a built-in one of the same name, and Revit's lookup by name
  then returns one of them at random, in Autodesk's own words - so a number would
  land in a field no tag reads. Those elements are reported in `ambiguous` and
  skipped before any number is given out, so the sequence has no gap (D-54 s3,
  FRAGMENT-ISSUES 5b-203). This is version 2; version 1's proof no longer
  describes the code and is kept as a record, and the fragment is DRAFT until it
  is proved again.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: elements
      type: IList<Element>
    - name: parameterName
      type: string
      source: request
    - name: prefix
      type: string
      source: request
    - name: startAt
      type: int
      source: request
    - name: existingValues
      type: ICollection<string>
      source: request
  provides:
    - name: renumbered
      role: result
      type: int
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>
    - name: ambiguous
      # Elements carrying TWO OR MORE parameters by this name, where Revit's
      # lookup would pick one at random. Given no number and not written, and
      # no number is used up on them (D-54 s3, FRAGMENT-ISSUES 5b-203). Turned
      # down, never found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: collisions
      # Intended numbers already held elsewhere in the model, CHECKED BEFORE
      # WRITING ANYTHING so a clash stops the batch instead of leaving a half-
      # renumbered set nobody can unpick. Never a renumber it made (D-52).
      role: accounting
      type: IList<string>


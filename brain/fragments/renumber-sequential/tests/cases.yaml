positive:
  - given: 8 doors in corridor order, parameterName "Mark", prefix "D-", startAt 1
    expect: D-1 to D-8 in that order, renumbered is 8, collisions empty, and the door tags on the sheet read the same

  - given: the same 8 doors renumbered a second time with the same inputs
    expect: >
      renumbered is 8 and collisions is EMPTY - an element is not a clash with
      the number it already holds, and refusing here would block the commonest
      batch of all, re-running a numbering that is already right

negative:
  - given: 8 doors, prefix "D-", startAt 1, and the model already has a door D-3 elsewhere that is NOT in the batch
    expect: >
      collisions carries "D-3", renumbered is 0, and NOTHING IS WRITTEN. Not
      three doors renumbered and then a stop - a half-renumbered corridor has
      two schemes in it and no record of where it stopped. Revit would have
      accepted the duplicate silently, which is why this cannot be left to it

  - given: a batch where "Mark" is read-only on 2 of the 8
    expect: >
      those 2 ids are in refused, named rather than skipped - a renumber that
      "did nothing" to two doors is invisible otherwise, and the tags on the
      sheet will show it long after

  - given: >
      a batch where 2 elements carry the parameter's name twice - a shared
      parameter loaded with the same name as a built-in one and bound to the
      category (NEEDS-CHECKING P8 arranges it)
    expect: >
      those 2 ids in `ambiguous`, no number written to either of their two
      parameters, and the rest numbered WITHOUT A GAP - the numbers they would
      have taken go to the next elements. Before version 2 one of each pair,
      which Revit's reference calls random, took a number

  # VERSION 3 (2026-11-07, row 5b-215). Each FAILS on version 2, which had no
  # width and wrote the bare number.
  - given: >
      VERSION 3 - THE FIELD CASE. 14 rooms, parameterName Name, prefix
      "Office " written in double quotes, startAt 1, width 2
    expect: >
      Office 01 to Office 09, then Office 10 to Office 14, in one call;
      renumbered 14, collisions empty. On 2026-09-24 this took two passes and
      a one-room fix

  - given: VERSION 3. 8 doors, prefix "D-", startAt 98, width 2
    expect: >
      D-98, D-99, D-100, D-101 ... - the number padded and NEVER CUT; a cut
      100 would read 00 and clash

  - given: VERSION 3. width left out
    expect: the bare number, exactly as version 2 - D-1 to D-8

  - given: VERSION 3 - NEGATIVE. width -1, then width 12
    expect: >
      renumbered 0, nothing written, widthRefused naming the width and the
      range it takes

second_route:
  - A Revit schedule of the category showing the parameter, sorted - duplicates and gaps both show at a glance

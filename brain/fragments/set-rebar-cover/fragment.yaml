compatibility-note: >
  BuiltInParameter CLEAR_COVER_TOP, CLEAR_COVER_BOTTOM, CLEAR_COVER_OTHER,
  CLEAR_COVER_EXTERIOR and CLEAR_COVER_INTERIOR keep one value on every release
  2020-2027 (read off the shipped assemblies 2026-10-19), as do
  RebarHostData.IsValidHost, GetRebarsInHost and RebarCoverType.CoverDistance.

# ROUTING - the same rows are in every rebar card.
#
#   "set the cover on these beams to 40"        -> here
#   "40 cover to the columns, 75 to the footing bottoms" -> here
#   "make a 40 mm cover type"                   -> CREATE_REBAR_COVER_TYPE
#   "what cover does this slab have"            -> REPORT_HOST_REBAR
utterances:
  - set the rebar cover on these beams to 40
  - change the cover of these columns to 50 mm
  - give the footings 75 cover at the bottom
  - set the exterior cover of these walls to 40

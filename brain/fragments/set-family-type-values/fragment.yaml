compatibility-note: >
  `FamilyManager.RenameCurrentType(string)` and `DeleteCurrentType()` read the
  same 2020 through 2027 (api-surface, read 2026-10-06); both act on the
  CURRENT type, so the named type is made current first.
  A material is a material parameter's ElementId, set with the
  `FamilyManager.Set(FamilyParameter, ElementId)` overload and read back with
  `FamilyType.AsElementId`, the same 2020 through 2027; its kind is
  `SpecTypeId.Reference.Material` from 2022 and `ParameterType.Material` before.
  A URL is `SpecTypeId.String.Url` / `ParameterType.URL`, and any parameter whose
  `StorageType` is String is written as text whatever its kind.
  `FamilyManager.NewType`, `CurrentType`, the four `Set` overloads and
  `FamilyType.AsDouble / AsInteger / AsString` read the same 2020 through 2027
  (api-surface, read 2026-09-24). A parameter's KIND does not: it is
  `Definition.ParameterType` up to 2022 and `Definition.GetDataType()` from 2022,
  so it is read by reflection and compared with the SpecTypeId property, or the
  enum name, of each kind this writes. Lengths and angles are plain arithmetic
  at the edge - millimetres divided by 304.8, degrees times pi over 180. Every
  other measured kind (version 4) uses `UnitFormatUtils.TryParse` and `Format`
  with the family's `Units`: by `Definition.UnitType` on 2020 and 2021, by
  `Definition.GetDataType()` from 2022 - an `#if REVIT2020 || REVIT2021`, the
  units API's own break.

  VERSION 5 (2026-11-11, the RevitAPI.dll of 2020 read by reflection, compiled
  2020 to 2027): `FamilyType` has `AsDouble`, `AsInteger`, `AsString`,
  `AsElementId`, `AsValueString` and `HasValue` and NO setter, and every
  `FamilyManager.Set` overload writes the CURRENT type - so a family type is
  written only while it is current, on every release. Making a type current is
  a regeneration; on Revit 2020 it can delete an automatic sketch dimension, and
  that deletion is what Revit's Keep or Discard question counts. The one way
  around it here: TEXT going into EVERY type, where `FamilyParameter.CanAssignFormula`
  is true and the text holds no double quote, is written as a formula that is
  the text - `"Acme"`, or `""` for a blank - which Revit evaluates for every type
  at once, and the formula is cleared again (`SetFormula(p, null)`), inside a
  `SubTransaction`, kept only if every type then reads the text and no formula
  is left. MEASURED 2026-11-12 on Revit 2024 (Group NG): it holds - every type
  kept its value when the formula was cleared, a blank and a filled text alike,
  on the built-in Manufacturer and on a family text parameter. A URL parameter
  takes NO formula (`CanAssignFormula` false), so a call that includes a URL
  makes each type current in turn, and its answer names the URL. On Revit 2020
  to 2023 and 2025 to 2027 the trial is not yet run; where it does not hold it
  is rolled back and the types are made current in turn. Lengths, angles,
  numbers, integers, yes/no, materials and every other measured kind - and
  text into only some types - always make each type current in turn.

# ROUTING - see SET_FAMILY_SETTINGS for the whole family-building table.
#
#   "make a 600 x 600 type"               -> here
#   "put 600 into Width"                  -> here
#   "set the nut material to galvanised"  -> here (a family type's material)
#   "rename the family type"              -> here ("Type Name=..." in values)
#   "delete this family type"             -> here (deleteType)
#   "clear the manufacturer in every type of this family"
#                                         -> here, typeName all (version 5)
#   "clear the manufacturer on every type of this family in the project"
#                                         -> SET_PARAMETER_VALUES_BY_ID, a
#                                            pattern key with types=yes - a
#                                            project's types, not a family's own
#   "rename these duct types"             -> EDIT_TEXT_VALUES field Name - types in a
#                                            project, not a family's own types
#   "add a Width parameter"               -> ADD_FAMILY_PARAMETERS
#   "neck width is width minus 100"       -> SET_FAMILY_FORMULA
#   "try it at 900 and put it back"       -> FLEX_FAMILY
#   "set this parameter on those ducts"   -> WRITE_ELEMENT_PARAMETERS - elements
#                                            in a project, not a family's types

utterances:
  - make a 600 by 600 type in this family
  - set the family type values
  - give the family type Width 600 and Depth 600
  - create a new family type with these sizes
  - make a 600 x 600 type
  - put 600 into Width
  - rename the family type
  - rename type Standard to HexNut - ISO 4032
  - delete this family type

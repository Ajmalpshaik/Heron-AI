id: FRG-PAR-023
semantic-identity: "give this family type these parameter values, making the type if it is new - or rename or delete the family type"
kind: action
domain: revit.families
capability: SET_FAMILY_TYPE_VALUES
version: 3
source: OFFICIAL
risk: MODIFY

purpose: >
  Writes values into one TYPE of the family open in the Family Editor -
  "600 x 600: Width 600, Depth 600, Height 250" - and makes that type first if
  the family does not have it yet. What the Family Types dialog does when a
  type is chosen, or added with New, and its rows are typed in - and what its
  Rename and Delete do to a family type.

  **A NEW FAMILY HAS NO TYPE AT ALL**, and several family jobs cannot run
  without one: a formula needs a current type to hold its result - reported
  from an earlier family build, where the formula call failed with "There is no
  valid family type" and took the parameters added beside it down too. So this
  is the step that makes the first type, and SET_FAMILY_FORMULA refuses until
  one exists.

  **UNITS ARE THE PARAMETER'S OWN, written the way a modeller reads them.** A
  length is millimetres, an angle degrees, a yes/no true or false, a number
  and an integer as they are, text as typed. The parameter's kind is read from
  the family, so "Width=600" needs no unit beside it - and "600mm" is refused,
  because a unit typed into the value is how a length ends up a thousand times
  wrong. A kind this does not write - an area, a flow - is refused by name
  rather than written as something else.

  **A MATERIAL IS WRITTEN BY ITS NAME** - "Nut Material=Steel - Galvanised" -
  and only a material the family already holds: the exact name, or the same
  name in another case when only one material matches. A name the family does
  not have refuses the whole call, naming the three closest, and no material is
  ever made. "<By Category>" or "none" clears the parameter back to By
  Category. A URL, and any other kind Revit keeps as text, is written as text,
  as typed (version 2 - version 1 refused both).

  **RENAME OR DELETE A TYPE (version 3).** "Type Name=HexNut - ISO 4032" in the
  values renames the type `typeName` names, as the dialog's Rename does - only
  a type that exists, never to a name another type has in any case, never with
  a character Revit forbids. `deleteType` true removes that type, alone, and
  never the family's last one. The types are read back after either.

  **A VALUE A FORMULA DRIVES IS REFUSED, NOT OVERWRITTEN.** Revit will not hold
  a typed value against a formula, and clearing the formula is a different
  decision - SET_FAMILY_FORMULA. A reporting parameter is refused for the same
  reason: its value is read off the geometry.

  **THIS MOVES GEOMETRY WHEREVER THE PARAMETERS DRIVE IT.** A value written into
  a parameter that labels a dimension moves those planes, and everything
  locked to them. That is a flex, and the report counts what each parameter
  drives so it is never a surprise. Values go in BEFORE a dimension is labelled
  with a parameter, not after - LABEL_FAMILY_DIMENSION refuses a label whose
  parameter disagrees with the planes.

  **ALL OR NOTHING, READ BACK.** Every name and value is checked before the
  first write; if Revit then refuses one, the call fails and nothing from it is
  kept. And after the write, every labelled dimension that agreed with its
  parameter before must still agree: Revit may only WARN about a size its
  constraints cannot take, and keep the value while the planes stay put - so a
  dimension that no longer reads its parameter fails the call too.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The family type to write into - made if the family does not have it.
    - name: typeName
      type: string
      source: request
    # Parameter=value pairs, SEMICOLONS between - "Width=600; Depth=600".
    # Lengths in millimetres, angles in degrees, yes/no as true or false,
    # a material by its name ("<By Category>" clears it), a URL as typed.
    # "Type Name=New name" renames the type (version 3). Empty when deleting.
    - name: values
      type: IDictionary<string, string>
      source: request
    # true DELETES the type `typeName` names, and nothing else is done; the
    # family's last type is refused. Absent is false - writing, exactly as
    # version 2 did. `optional: true` is what lets it be left out
    # (HeronBindingNote.AbsentValue).
    - name: deleteType
      type: bool
      source: request
      optional: true
  provides:
    - name: typeUsed
      # The type that was written into, read back as the family's current type.
      role: result
      type: string
    - name: typeCreated
      role: result
      type: bool
    - name: written
      # One line per parameter: its value read back after the write, beside
      # what it held before.
      role: result
      type: IList<string>
    - name: drives
      # How many labelled dimensions and associated element parameters the
      # written parameters drive - what moved because of this.
      role: result
      type: int
    - name: typesNow
      # Every type the family has after the call, read back from it - the
      # proof a rename or a delete took, and the list a missing name is given.
      role: accounting
      type: string
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing was written, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


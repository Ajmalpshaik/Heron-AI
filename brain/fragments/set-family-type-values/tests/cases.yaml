positive:
  - given: >
      a new family with the type lengths Width, Depth and Height already added
      and NO type yet, typeName "600 x 600", values "Width=600; Depth=600;
      Height=250"
    expect: >
      typeCreated true, typeUsed "600 x 600", and the three values read back as
      600, 600 and 250 mm - LOOKED AT in the Family Types dialog with that type
      chosen, not read off the report

  - given: >
      the same family, typeName "600 x 600" again, values "Width=900" - with
      Width already labelling a dimension between two planes
    expect: >
      typeCreated false, Width reading 900 mm (was 600 mm), drives 1, and the
      two planes 900 mm apart when measured in the Family Editor - the flex a
      value write is

  - given: >
      a family with a type material parameter "Nut Material" and a URL parameter
      "URL", the material "Steel - Galvanised" already in the family, values
      "Nut Material=steel - galvanised; URL=https://example.com/nut"
    expect: >
      Nut Material reads "Steel - Galvanised" (found in another case, the one
      material that matches) and URL reads "https://example.com/nut", both read
      back from the type - and in the Family Types dialog with that type chosen

  - given: the same family, values "Nut Material=<By Category>"
    expect: Nut Material reads <By Category> - the parameter cleared, no material deleted


  - given: >
      a family with the types "Standard" and "T2", typeName "Standard", values
      "Type Name=Test - A"
    expect: >
      the type reads "Test - A" in the Family Types dialog, no type is called
      "Standard" any more, and typesNow lists "Test - A" and "T2"

  - given: >
      a family with the types "T1" and "T2", typeName "T1", deleteType true,
      values empty
    expect: >
      "T1" is gone from the Family Types dialog, "T2" is the current type, and
      typesNow lists "T2" alone

negative:
  - given: >
      a family with the types "Standard" and "T2", typeName "Standard", values
      "Type Name=t2" - a name another type already has, in another case
    expect: >
      refused naming "T2", nothing renamed - both types still read "Standard"
      and "T2"

  - given: typeName "Missing", values "Type Name=Test - A"
    expect: >
      refused naming the types the family has; no type "Missing" or "Test - A"
      made - a rename never makes a type

  - given: values "Type Name=Nut [M12]"
    expect: refused naming the square brackets, nothing renamed

  - given: a family with ONE type, that type's name, deleteType true
    expect: refused - the family's only type is never deleted

  - given: deleteType true with values "Width=600"
    expect: refused - a delete is done alone, nothing written or deleted

  - given: >
      values "Nut Material=Unobtainium; URL=https://example.com/nut" - a material
      the family does not hold
    expect: >
      refused naming the closest material names, nothing written - not even the
      URL beside it - and no material "Unobtainium" made in the family

  - given: values "Width=600mm"
    expect: >
      refused, nothing written - digits only. A unit typed into the value is
      how a length ends up a thousand times wrong

  - given: values "Widht=600" (misspelt)
    expect: >
      refused naming the missing parameter and pointing at
      ADD_FAMILY_PARAMETERS. No type made for a call that wrote nothing

  - given: values naming a parameter that a formula drives
    expect: >
      refused quoting the formula and naming SET_FAMILY_FORMULA - the formula
      is NOT silently cleared

  - given: typeName "EL 20-400V/3~"
    expect: >
      refused naming the tilde, before anything is written. Not a half-made
      type

  - given: a project in front
    expect: notAFamily true and nothing written

second_route:
  - >
      Family Types in the Family Editor, the same type chosen and each value
      read there, compared with `written`

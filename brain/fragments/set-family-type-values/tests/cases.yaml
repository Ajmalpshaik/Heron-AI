positive:
  - given: >
      a new family with the type lengths Width, Depth and Height already added
      and NO type yet, typeName "600 x 600", values "Width=600; Depth=600;
      Height=250"
    expect: >
      typeCreated true, typeUsed "600 x 600", and the three values read back as
      600, 600 and 250 mm - LOOKED AT in the Family Types dialog with that type
      chosen, not read off the report

  - given: >
      the same family, typeName "600 x 600" again, values "Width=900" - with
      Width already labelling a dimension between two planes
    expect: >
      typeCreated false, Width reading 900 mm (was 600 mm), drives 1, and the
      two planes 900 mm apart when measured in the Family Editor - the flex a
      value write is

  - given: >
      a family with a type material parameter "Nut Material" and a URL parameter
      "URL", the material "Steel - Galvanised" already in the family, values
      "Nut Material=steel - galvanised; URL=https://example.com/nut"
    expect: >
      Nut Material reads "Steel - Galvanised" (found in another case, the one
      material that matches) and URL reads "https://example.com/nut", both read
      back from the type - and in the Family Types dialog with that type chosen

  - given: the same family, values "Nut Material=<By Category>"
    expect: Nut Material reads <By Category> - the parameter cleared, no material deleted


  - given: >
      a family with the types "Standard" and "T2", typeName "Standard", values
      "Type Name=Test - A"
    expect: >
      the type reads "Test - A" in the Family Types dialog, no type is called
      "Standard" any more, and typesNow lists "Test - A" and "T2"

  - given: >
      a family with the types "T1" and "T2", typeName "T1", deleteType true,
      values empty
    expect: >
      "T1" is gone from the Family Types dialog, "T2" is the current type, and
      typesNow lists "T2" alone


  # VERSION 4 (2026-11-12, row 5b-1575) - a measured kind in the family's units.
  - given: >
      the SAVED scratch family Heron Link Angle Test (%TEMP%/heron-work/link-angle),
      type Test, an Air Flow type parameter "Nominal Air Flow"; values
      "Nominal Air Flow=94.4 L/s; Width=600"
    expect: >
      written 2 - "Nominal Air Flow = 94.4 L/s" read back in Revit's own format,
      and Width = 600 mm as version 3 wrote it
negative:
  - given: >
      a family with the types "Standard" and "T2", typeName "Standard", values
      "Type Name=t2" - a name another type already has, in another case
    expect: >
      refused naming "T2", nothing renamed - both types still read "Standard"
      and "T2"

  - given: typeName "Missing", values "Type Name=Test - A"
    expect: >
      refused naming the types the family has; no type "Missing" or "Test - A"
      made - a rename never makes a type

  - given: values "Type Name=Nut [M12]"
    expect: refused naming the square brackets, nothing renamed

  - given: a family with ONE type, that type's name, deleteType true
    expect: refused - the family's only type is never deleted

  - given: deleteType true with values "Width=600"
    expect: refused - a delete is done alone, nothing written or deleted

  - given: >
      values "Nut Material=Unobtainium; URL=https://example.com/nut" - a material
      the family does not hold
    expect: >
      refused naming the closest material names, nothing written - not even the
      URL beside it - and no material "Unobtainium" made in the family

  - given: values "Width=600mm"
    expect: >
      refused, nothing written - digits only. A unit typed into the value is
      how a length ends up a thousand times wrong

  - given: values "Widht=600" (misspelt)
    expect: >
      refused naming the missing parameter and pointing at
      ADD_FAMILY_PARAMETERS. No type made for a call that wrote nothing

  - given: values naming a parameter that a formula drives
    expect: >
      refused quoting the formula and naming SET_FAMILY_FORMULA - the formula
      is NOT silently cleared

  - given: typeName "EL 20-400V/3~"
    expect: >
      refused naming the tilde, before anything is written. Not a half-made
      type

  - given: a project in front
    expect: notAFamily true and nothing written


  # VERSION 4 (2026-11-12).
  - given: the same family, values "Nominal Air Flow=fast"
    expect: refused - "fast" is not a value Revit reads for Nominal Air Flow; nothing written
second_route:
  - >
      Family Types in the Family Editor, the same type chosen and each value
      read there, compared with `written`

# VERSION 5 (row 5b-1504) - many types in one call. NEEDS-CHECKING Group NG.
positive_many:
  - given: >
      a scratch family with seven types, Manufacturer and URL filled in each,
      typeName "all", values "Manufacturer=; URL="
    expect: >
      typesWritten lists all seven, every type reads Manufacturer and URL empty
      in the Family Types dialog, ONE entry in Revit's undo list, route "no type
      made current" (the formula trial held) or "each type made current in
      turn" (it did not) - whichever, the current type is the one that was
      current before

  - given: >
      the same family, typeName "600 x 600, 625 x 625", values "Width=900",
      Width labelling a dimension
    expect: >
      both types read Width 900 mm, the five others unchanged, route "each type
      made current in turn", the dimension agreeing in both, the starting type
      current again

  - given: the same call run a second time
    expect: >
      nothing written, alreadyHeld lists both types, no type made current

negative_many:
  - given: typeName "600 x 600, No Such Type", values "Manufacturer=Acme"
    expect: >
      REFUSED naming "No Such Type" and listing the family's types; NOTHING
      written - 600 x 600's Manufacturer still reads what it did, no type made

  - given: typeName "all", values "Not A Parameter=x"
    expect: refused naming the parameter - no type written

  - given: typeName "all", values "Type Name=New"
    expect: refused - a rename names one type

  - given: typeName "all", deleteType true
    expect: refused - types are deleted one at a time

  - given: a family with a type called "All", typeName "all"
    expect: refused naming the type, pointing at "every type"

# VERSION 6 (2026-11-24, row 5b-2029) - Number of Poles. Each fails on version
# 5, which refused the kind by name. Run on Revit 2020 (ParameterType) AND on
# one release from 2022 (SpecTypeId) - the kind is found two different ways.
positive_poles:
  - given: >
      a SAVED scratch mechanical equipment family with one type, the shared
      parameter "Number_of_Poles" (spec Number of Poles) added as a type
      parameter; values "Number_of_Poles=3"
    expect: >
      written 1 - "Number_of_Poles = 3" read back as an integer, and 3 shown
      for Number_of_Poles in the Family Types dialog with that type chosen

  - given: the same family, typeName "all", values "Number_of_Poles=1"
    expect: every type reads 1 for Number_of_Poles, one entry in Revit's undo list

negative_poles:
  - given: the same family, values "Number_of_Poles=7"
    expect: >
      refused - "7" is not a number of poles, 1, 2 or 3; nothing written,
      Number_of_Poles still reads 3

  - given: the same family, values "Number_of_Poles=three"
    expect: refused - not a whole number; nothing written

  - given: >
      the same family with a type length "Width", values
      "Number_of_Poles=2; Width=600mm"
    expect: >
      refused naming the unit in Width - all or nothing, Number_of_Poles not
      written either and still reads 3

# VERSION 7 (2026-11-26, row 5b-2050) - a quoted TEXT value keeps its spaces.
# The first fails on version 6, which trimmed every value: NEEDS-CHECKING Group
# PT check PT4 read back "G4 - "bag"" on Revit 2020. The negatives pass on both
# versions - they are the proof nothing else moved.
positive_spaces:
  - given: >
      a SAVED scratch family with a type text parameter "Keynote", values
      'Keynote=" G4 - \"bag\" "' (the space before G4 and after "bag" inside
      the quotes)
    expect: >
      written - Keynote reads back ' G4 - "bag" ', the space at each end kept
      and the two inner quote marks written as quote marks; Family Types shows
      the same with that type chosen. If Revit itself drops the spaces, the call
      fails "Not every value held what was asked for", nothing kept - record
      which

  - given: the same family, typeName "all", values 'Keynote=" a; b "'
    expect: >
      every type reads ' a; b ', the spaces and the semicolon kept, one entry in
      Revit's undo list; the answer's route says which way it was written

negative_spaces:
  - given: the same family, values "Keynote=   G4   " (no quotes)
    expect: >
      written - Keynote reads back "G4", trimmed exactly as before version 7
      (the binder trims an unquoted value)

  - given: >
      the same family with a type length "Width" and a type yes/no "Show_Filter",
      values 'Width=" 600 "; Show_Filter=" true "'
    expect: >
      written - Width reads 600 mm and Show_Filter reads true: a quoted number or
      yes/no is still read from its trimmed text, exactly as version 6 read it

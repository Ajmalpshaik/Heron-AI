positive:
  - given: >
      two points 600 mm apart, straight down from a branch line to a pendent
      sprinkler, the Fire Protection Wet system type, a flex pipe type and
      Level 1, with a 1200 mm limit
    expect: >
      one flexible pipe created along them, 600 mm reported, on the wet
      system, and the finding saying plainly that it is connected to NOTHING

  - given: three points forming an offset drop, inside the limit
    expect: >
      the pipe following them in the order given, with no sorting or
      simplification

  - given: >
      VERSION 2, CREATE_FLEX_DUCT's case. Two points 900 mm apart from a branch
      duct down to a diffuser, the Supply Air system type, a FLEX DUCT type
      ("Flex Duct Round: Flex - Round") as flexPipeType, Level 1, a 3000 mm limit
    expect: >
      one FLEXIBLE DUCT created - Revit's Flex Ducts category, not Flex Pipes -
      900 mm reported, the finding saying it is connected to NOTHING. On
      version 1 this FAILS: Supply Air is not a piping system and the binder
      refuses it, or a flex duct type is refused as not a flex pipe type

  - given: VERSION 2. Four points forming a dropped S route, with a flex duct type on Supply Air
    expect: >
      the flex duct following them in the order given, with no sorting or
      simplification

negative:
  - given: a route of 2,400 mm with a 1,200 mm limit
    expect: >
      REFUSED before anything is created, both numbers stated, lengthMm 0 and
      created null. THIS IS THE CASE THAT MATTERS - a drop over its listed
      length is exceeded by accident

  - given: a RIGID pipe type named as the flex pipe type
    expect: >
      refused by name before Revit is asked, pointed at CREATE_PIPE, and
      nothing created

  - given: VERSION 2. A RIGID duct type named as flexPipeType, on Supply Air
    expect: >
      refused by name as neither a flex duct nor a flex pipe type, pointed at
      CREATE_DUCT_RUNS, nothing created

  - given: >
      VERSION 2. A flex DUCT type on a PIPING system - Domestic Cold Water - or
      a flex PIPE type on a DUCT system - Supply Air
    expect: >
      refused BY NAME before Revit is asked, the type and the system both named
      and which goes with which said, nothing created. CREATE_FLEX_DUCT left
      the duct case to an exception from Create; version 1 of this card could
      not be handed a duct system at all

  - given: VERSION 2. A flex duct route of 2,400 mm with a 1,500 mm limit
    expect: >
      REFUSED before anything is created, both numbers stated, lengthMm 0 and
      created null - the same rule for duct as for pipe

  - given: a maximum length of zero
    expect: >
      refused. The limit is asked for rather than assumed

  - given: any run at all
    expect: >
      NO CONNECTION MADE AND NO TRANSACTION OPENED. Joining it is
      CONNECT_OPEN_ENDS, and undo is the caller's

second_route:
  - >
    Revit's own Length on the created flex pipe in the Properties palette
    against the reported millimetres. They must agree - a disagreement is a
    units error
  - >
    TRACE_CONNECTIVITY on the sprinkler afterwards. It should report the head
    still OPEN - if it reads as connected, something other than this fragment
    joined it and the wording here is wrong

compatibility-note: >
  One implementation for every release. `FlexPipe.Create(Document, ElementId,
  ElementId, ElementId, IList<XYZ>)` and `FlexPipe.IsFlexPipeTypeId` are
  present 2020 through 2027, read with tools/api-surface on 2026-10-14.
  `FlexDuct.Create` of the same shape is unchanged 2020 to 2027 - CREATE_FLEX_DUCT
  compiled it against all eight and proved it on 2024 - and `FlexDuctType`,
  `MechanicalSystemType` and `PipingSystemType` are classes on every release.
  The resolved objects are asked for their `.Id`; no ElementId is built from a
  number.


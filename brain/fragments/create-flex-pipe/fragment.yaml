purpose: >
  Creates ONE flexible duct or ONE flexible pipe along the points given - the
  flex drop from a branch duct to a diffuser, or the flex hose from a sprinkler
  branch line to the head or to a fixture. Rigid duct and rigid pipe cannot
  express it.

  **THE TYPE DECIDES WHICH** (version 2, when CREATE_FLEX_DUCT was merged in).
  A flex duct type makes flexible duct and needs a duct system; a flex pipe type
  makes flexible pipe and needs a piping system. A type that is neither, and a
  type on the wrong kind of system, are refused by name before Revit is asked.
  This is version 2; version 1's proof no longer describes the code and is kept
  as a record, and the fragment is DRAFT until it is proved again.

  **IT GUESSES NO ROUTE, DELIBERATELY.** Every point is given, in order, and
  the order is the route. An invented path looks plausible on plan and is not
  what anybody would have drawn.

  **THE LENGTH LIMIT IS ENFORCED, NOT SUGGESTED.** A flex drop is listed for a
  maximum length, and the length is exceeded by accident - two points further
  apart than they looked. The limit is a required input and a route over it is
  REFUSED before anything is made.

  **IT MAKES FLEX, NOT A CONNECTION.** Sharing an endpoint with a diffuser, a
  sprinkler or a tee is not a connection in Revit. CONNECT_OPEN_ENDS joins it,
  and TRACE_CONNECTIVITY proves it happened.

  ASSUMES AN OPEN TRANSACTION (Golden Rule 16). One operation is one undo
  entry, and the caller owns it.

contract:
  needs:
    - name: doc
      type: Document
    # RESOLVED OBJECTS, never ids (D-05).
    # Version 2: a duct system OR a piping system - MEPSystemType, which the
    # binder resolves as "duct or pipe system type". It must go with the type
    # below: a flex duct type on a duct system, a flex pipe type on a piping
    # system, checked by name before Revit is asked. Version 1 took a
    # PipingSystemType only.
    - name: systemType
      type: MEPSystemType
      source: request
    # A FLEX DUCT type or a FLEX PIPE type (version 2), and which it is
    # decides what is made. MEPCurveType because the binder resolves that class
    # by name and both flex classes derive from it; a type that is neither is
    # refused below, by name, before Revit is asked. Still called
    # `flexPipeType` so every call written for version 1 runs unchanged.
    - name: flexPipeType
      type: MEPCurveType
      source: request
    - name: level
      type: Level
      source: request
    - name: points
      type: IList<XYZ>
      source: request
    # Millimetres. A route longer than this is refused before anything is made.
    - name: maxLengthMm
      type: double
      source: request
  provides:
    # A FlexDuct or a FlexPipe (version 2); both are MEPCurves. Version 1
    # declared FlexPipe.
    - name: created
      role: result
      type: MEPCurve
    - name: lengthMm
      # How long the flex actually came out - 0 when nothing was made. The
      # length of a refused route is in the refusal sentence, not here.
      role: result
      type: double
    - name: refused
      # Why it declined, in the modeller's words - never a thing it FOUND
      # (D-52).
      role: accounting
      type: IList<string>
    - name: findings
      type: IList<string>


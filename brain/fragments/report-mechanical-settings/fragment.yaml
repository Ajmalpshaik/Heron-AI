id: FRG-MEP-096
semantic-identity: "what are this model's Mechanical Settings - the connector separator, size prefix and suffix text, flat on top and flat on bottom, set up and set down, fitting symbol size, air density and viscosity"
kind: action
domain: revit.mep
capability: REPORT_MECHANICAL_SETTINGS
version: 1
source: OFFICIAL
risk: READ

# WHY IT EXISTS - a comment, not `purpose`, because `purpose` is searched.
# 2026-11-02: asked for as a ribbon gap - "Mechanical Settings: read and set
# DuctSettings values: connector separator, flat-on-top/bottom annotations,
# duct fitting annotation size, air density/viscosity, rise/drop symbols", and
# the pipe settings beside them. Revit's Manage > MEP Settings > Mechanical
# Settings > Duct Settings and Pipe Settings. No card read them (grep of
# brain/fragments that day for DuctSettings, PipeSettings, ConnectorSeparator
# and AirDensity: only the sizes cards below), and brain/heron_retrieve.py's
# find() on a scratch store of this tree (Revit 2024, with and without the
# host's question flag) sent "what are the duct settings" to
# REPORT_DUCT_CONDUIT_SIZES, "what is the duct connector separator" to
# REPORT_CONNECTORS and "what is the air density in the duct settings" to
# REPORT_DUCT_WEIGHT - none of which reads these values.
#
# LOOK-ALIKES, NOT DUPLICATES (each read in full, the heron-duplicate-checker
# method; brain/heron_duplicates and the Matcher found no same-capability or
# same-signature card):
#   REPORT_DUCT_CONDUIT_SIZES lists the SIZES set up on the Duct Settings
#     Rectangular / Oval / Round pages and the conduit and cable tray sizes -
#     size lists, not these annotation and air values. EDIT_MEP_SIZES changes
#     those lists.
#   REPORT_CONNECTORS reads connectors on elements, not the separator text.
#   REPORT_ELECTRICAL_SETTINGS reads Electrical Settings - the pattern this
#     card follows, another dialog.
#
# THE READ HALF OF A SET. SET_MECHANICAL_SETTINGS changes these values and
# takes every one by the name printed here; every question about them comes
# here, so no question reaches the write (D-86).
#
# READ ONLY - opens no transaction and needs none.
purpose: >
  Answers what the project-wide Mechanical Settings dialog holds on its Duct
  Settings and Pipe Settings pages - the connector separator, the size
  prefix, separator and suffix text, the flat on top, flat on bottom, set up
  and set down abbreviations, the centerline text, the single line fitting
  and rise/drop symbol size, and the air density and viscosity used for
  pressure loss. Millimetres, kg/m3 and Pa-s. Nothing needs to be selected
  and nothing changes.

contract:
  needs:
    - name: doc
      type: Document
    - name: show
      # Which page: duct | pipe | all - or left out for both (`absent: all`).
      # A word that is none of them is named, never guessed.
      type: string
      source: request
      optional: true
      absent: all
  provides:
    - name: ductSettings
      # Every Duct Setting read, in the names SET_MECHANICAL_SETTINGS takes:
      # "Duct Settings - duct use annotation scale for single line fittings
      # yes; duct fitting annotation size 3 mm; air density 1.2 kg/m3; ...".
      # Empty when not asked for or the document has none.
      role: result
      type: string
    - name: pipeSettings
      # The same for Pipe Settings.
      role: result
      type: string
    - name: settingsRead
      # How many settings were read - a count of what it FOUND.
      role: result
      type: int
    - name: findings
      type: IList<string>

proof:
  date: '2026-11-13'
  by: Ajmal PS
  model: P1102 MEP (21,454 elements), Revit 2020, session 41776
  positive_case: 'run with show=duct - the first of 3 tracked inputs. returned culture CultureInfo,
    density Func`2, ductSettings Duct Settings - duct use annotation scale for single line
    fittings yes; duct fitting annotation size 3 mm; air density 1.2026 kg/m3; air dynamic
    viscosity 0.00053 Pa-s; rectangular duct size separator "x"; rectangular duct size suffix
    ""; round duct size prefix ""; round duct size suffix "ø"; oval duct size separator "/";
    oval duct size suffix ""; duct connector separator "-"; duct flat on top "FOT"; duct flat
    on bottom "FOB"; duct set up from center "SU"; duct set down from center "SD"; duct set
    up from bottom "BU"; duct set down from bottom "BD"; duct centerline "="; duct rise/drop
    annotation size 3 mm, findings 1 item(s) [Not read here: the rise/drop symbols (Revit
    holds them on ea...], mm Func`2, pipeSettings , readDuct true, readPipe false, settingsRead
    19, text Func`2, viscosity Func`2, wanted duct, yesNo Func`2. inputs came show as given.
    on P1102 MEP'
  negative_case: "CANNOT COME BACK EMPTY, so proved by TRACKING instead (D-53). report-mechanical-settings\
    \ describes whatever it is given, so no arrangement makes its answer empty. What D-30's\
    \ negative case exists to catch - a fragment that succeeds while doing nothing, or answers\
    \ about a set it was not given - is caught here by the answer following the input exactly\
    \ across 3 different inputs:\n\n      show=duct -> settingsRead 19\n      show=pipe ->\
    \ settingsRead 12\n      show=all -> settingsRead 31\n\n    Different inputs, exact matches\
    \ every time. A fragment falling back to the active view, the whole model, or a previous\
    \ run could not do that."
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: 2fa4583da7b3c469

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release, read off tools/api-surface --members
  for all eight on 2026-11-02. DuctSettings.GetDuctSettings, AirDensity,
  ConnectorSeparator, FlatOnTop, FlatOnBottom, SetUp, SetDown,
  SetUpFromBottom, SetDownFromBottom, Centerline, FittingAnnotationSize,
  RiseDropAnnotationSize, UseAnnotationScaleForSingleLineFittings and the
  Rectangular / Round / Oval duct size prefix, separator and suffix are 2020
  to 2027 with one signature, and so are PipeSettings.GetPipeSettings and its
  same-named members with SizePrefix and SizeSuffix. Air viscosity is
  AirViscosity 2020-2024 (obsolete in 2025) and AirDynamicViscosity 2025 on,
  behind `#if REVIT2025_OR_GREATER`. Density and viscosity are converted by
  UnitUtils - DisplayUnitType DUT_KILOGRAMS_PER_CUBIC_METER and
  DUT_PASCAL_SECONDS on 2020 (`#if REVIT2020`), UnitTypeId
  KilogramsPerCubicMeter and PascalSeconds from 2021. NOT KNOWN FROM THE
  ASSEMBLIES and measured in NEEDS-CHECKING Group MM: that the annotation
  sizes are held in feet, as every Revit length is, so that / 304.8 prints
  what the dialog shows.

# ROUTING (2026-11-02) - the same rows are in SET_MECHANICAL_SETTINGS.
#
#   "read the mechanical settings"               -> here
#   "set the connector separator"                -> SET_MECHANICAL_SETTINGS - a change goes to the write
#   "what duct sizes are available for round ducts"
#                                                -> REPORT_DUCT_CONDUIT_SIZES - the size lists
#   "read the energy settings"                   -> REPORT_ENERGY_SETTINGS - another dialog
#
# WHAT MOVED: see NEEDS-CHECKING Group MM - one measurement for the six cards
# of that group, before and after, with and without the host's question flag.
utterances:
  - read the mechanical settings

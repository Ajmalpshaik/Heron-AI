id: FRG-MEP-070
semantic-identity: "edit a circuit already in the model - Add to Circuit, Remove from Circuit, Select Panel or Disconnect Panel"

# WHY IT EXISTS - a comment, not `purpose`, because `purpose` is searched.
# 2026-11-01: asked for in the modeller's words "add these lights to circuit 3",
# "take this socket off its circuit", "move these circuits to panel DB-2" and
# "disconnect this circuit from its panel". Nothing in Heron edited a circuit
# that already exists (checked that day with brain/heron_retrieve.py on each
# sentence, Revit 2024: SELECT_BY_ELECTRICAL_CIRCUIT, CREATE_ELECTRICAL_CIRCUIT,
# REPORT_PANEL_CIRCUITS, CREATE_WIRES and DISCONNECT_CONNECTORS came back, and
# none of them changes an existing circuit's devices or its panel).
#
# A NEW CAPABILITY, NOT A WIDENING. Written when CREATE_ELECTRICAL_CIRCUIT
# (FRG-MEP-045) was PROVEN; main's #777 has since merged it into
# CREATE_MEP_SYSTEM (version 2, DRAFT that day) and retired it (corrected
# 2026-11-01). CREATE_MEP_SYSTEM makes a NEW circuit and can pick a panel only
# for the circuit it has just made; it edits no existing one. This card overlaps
# EDIT_MEP_SYSTEM, the same buttons for duct and piping systems: whether the two
# merge is OPEN for the owner - row 5b-1382. DISCONNECT_CONNECTORS breaks a
# physical connector join, not a circuit's membership or its panel.
#
# ONE FRAGMENT FOR THE FOUR BUTTONS, NOT TWO. Add to Circuit, Remove from
# Circuit, Select Panel and Disconnect Panel sit together on Revit's
# Electrical Circuits tab, act on the same element - one ElectricalSystem that
# already exists - and need the same things: which circuit, which devices,
# which panel. `edit` says which button. Split into two, both cards would
# declare the same needs and answer the same "which circuit" question twice.
#
# WHICH CIRCUIT IS NEVER GUESSED. A number repeating on two panels refuses and
# names both; a device on two circuits (power and data) is skipped and both
# are named; two circuits selected for an add refuses.
#
# TAKING EVERY DEVICE OFF A CIRCUIT IS REFUSED for that circuit. Revit may
# delete a circuit left empty, and deleting one is not an edit (Article 7).
# What Revit actually does is NOT known from the assemblies - NEEDS-CHECKING
# Group JV, JV9.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
kind: action
domain: revit.mep
capability: EDIT_ELECTRICAL_CIRCUIT
version: 1
source: OFFICIAL
risk: MODIFY

# DEPRECATED 2026-11-04 - MERGED INTO EDIT_MEP_SYSTEM (edit-mep-system) version
# 2, on the owner's yes to FRAGMENT-ISSUES row 5b-1382. Both cards were DRAFT
# and on this branch only, never run in Revit, so no proof stood in the way:
# EDIT_MEP_SYSTEM's impl/ was widened to carry everything this card did.
# Constitution Article 1: kept, never deleted, so its record stays readable
# and it can be brought back. Nothing offers it now - retrieval leaves
# DEPRECATED out, and its sentences claim nothing in the identity table
# (heron_search RETIRED_FRAGMENTS). Its sentences moved to EDIT_MEP_SYSTEM.
# The ROUTING block below is the record of what it answered, not today's.
deprecated:
  date: '2026-11-04'
  by: Ajmal PS
  superseded-by: EDIT_MEP_SYSTEM
  why: >
    The same two buttons on another kind of system - Add and Remove - and the
    two more a circuit has. EDIT_MEP_SYSTEM version 2 does all four on an
    existing circuit: Add to Circuit, Remove from Circuit, Select Panel and
    Disconnect Panel, by `edit`, with this card's circuitNumber, circuitPanel
    and panel, the circuit named by number and panel or selected or the one a
    device is on, a named circuit the only one moved or disconnected, every
    device taken off refused, every change read back. Where its outputs are
    now: circuitIds -> systemIds; changed, report, refused and findings ->
    the same names. ONE RULE WAS OPPOSITE and the safer was kept: this card
    added a device already on another circuit and said afterwards where it had
    been, so Revit could move it; EDIT_MEP_SYSTEM never moves one by an add -
    a device on a circuit of the same kind is skipped and that circuit named,
    and one on a circuit of another kind (data while joining power) is added
    and said, the read-back shouting if Revit took it off the first.

purpose: >
  Edits an electrical circuit that already exists, the four buttons of
  Revit's Electrical Circuits tab: Add to Circuit, Remove from Circuit, Select
  Panel and Disconnect Panel. Every change is read back from the circuit
  afterwards.

contract:
  needs:
    - name: doc
      type: Document
    # The selection: the devices to add or take off - lights, sockets,
    # equipment - and/or circuits picked in Revit. Optional, so a circuit
    # named by number can be moved or disconnected with nothing selected.
    - name: elements
      type: IList<Element>
      optional: true
    # Which button: "add", "remove", "select panel" or "disconnect" (also
    # "add to circuit", "remove from circuit", "move to panel",
    # "disconnect panel"). Anything else refuses and changes nothing.
    - name: edit
      type: string
      source: request
    # The circuit's number as the panel schedule shows it - "3". Left out,
    # the circuit is the one selected, or the one a selected device is on.
    - name: circuitNumber
      type: string
      source: request
      optional: true
      absent: none
    # The panel the circuit is on NOW, by its Panel Name, to tell circuit 3 on
    # DB-1 from circuit 3 on DB-2. Never changes a panel.
    - name: circuitPanel
      type: string
      source: request
      optional: true
      absent: none
    # The panel the sentence names, by its Panel Name. For "select panel" it
    # is where the circuit goes; for the other three it can only be the panel
    # the circuit is on now, so it narrows which circuit is meant and changes
    # no panel.
    - name: panel
      type: FamilyInstance
      source: request
      optional: true
      absent: none
  provides:
    - name: circuitIds
      # The circuits that read back changed.
      role: result
      type: IList<ElementId>
    - name: changed
      # Devices that read back added or taken off, or circuits that read back
      # on the new panel or on none - never what was asked.
      role: result
      type: int
    - name: report
      # ONE STRING, a line per circuit changed: before and after.
      role: accounting
      type: string
    - name: refused
      # Why NOTHING was changed, in the modeller's words - evidence it looked
      # and said no, never a thing it found (D-52). Null when something was
      # changed. ONE STRING, because a list reaches the reply cut to sixty
      # characters an item.
      role: accounting
      type: string
    - name: findings
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. ElectricalSystem.AddToCircuit
  (ElementSet) returning bool, RemoveFromCircuit(ElementSet),
  SelectPanel(FamilyInstance) and DisconnectPanel(), with CircuitNumber,
  PanelName, LoadName and MEPSystem.Elements, and new ElementSet() with
  Insert, are present and unchanged 2020 through 2027 - read with
  tools/api-surface on 2026-11-01. Membership is read from each circuit's own
  Elements, never MEPModel.ElectricalSystems or GetElectricalSystems(),
  neither of which compiles on all eight (SELECT_BY_ELECTRICAL_CIRCUIT's
  card). Ids are carried as ElementId and never read as numbers.

# ROUTING - repeated in CREATE_ELECTRICAL_CIRCUIT, SELECT_BY_ELECTRICAL_CIRCUIT and
# REPORT_PANEL_CIRCUITS (2026-11-01).
#
#   "add these lights to circuit 3"            -> here, edit add
#   "take this socket off its circuit"         -> here, edit remove
#   "move these circuits to panel DB-2"        -> here, edit select panel
#   "disconnect this circuit from its panel"   -> here, edit disconnect
#   "put these devices on one circuit"         -> CREATE_MEP_SYSTEM -
#                                                 a NEW circuit
#   "put these lights on a circuit"            -> CREATE_MEP_SYSTEM
#   "circuit these sockets"                    -> CREATE_MEP_SYSTEM. This
#                                                 card took it, ranked, when it
#                                                 was written - pulled by "take
#                                                 this socket off its circuit" -
#                                                 so it is DECLARED there now,
#                                                 and reached by identity
#                                                 (FRAGMENT-ISSUES row 5b-1356)
#   "what is on circuit 3"                     -> SELECT_BY_ELECTRICAL_CIRCUIT -
#                                                 a question, never this write.
#                                                 Took it the same way, pulled by
#                                                 "add these lights to circuit
#                                                 3"; DECLARED there now (row
#                                                 5b-1356)
#   "what is on this circuit"                  -> SELECT_BY_ELECTRICAL_CIRCUIT,
#                                                 by identity. This card
#                                                 outranks it on WORDS alone
#   "which lights are not on a circuit"        -> SELECT_BY_ELECTRICAL_CIRCUIT,
#                                                 the same, by identity
#   "what circuits are on panel DB-1"          -> REPORT_PANEL_CIRCUITS
#   "disconnect this duct from the fitting"    -> DISCONNECT_CONNECTORS - a
#                                                 physical join, not a circuit
#   "add these diffusers to Supply Air 2"      -> EDIT_MEP_SYSTEM - the same two
#                                                 buttons on a duct or piping
#                                                 system (2026-11-01)

utterances:
  - add these lights to circuit 3
  - take this socket off its circuit
  - move these circuits to panel DB-2
  - disconnect this circuit from its panel

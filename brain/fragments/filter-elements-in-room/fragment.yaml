# VERSION 2 (2026-11-20) - A DOOR OR WINDOW IN A WALL IS JUDGED BY ITS FROM
# ROOM AND TO ROOM, and back to DRAFT. FRAGMENT-ISSUES row 5b-1485, the rooms
# part: seen 2026-11-08 on Revit 2024, this put all 13 windows "outside" Room
# 7, because a hosted window's (or door's) point sits in the wall, on the room
# boundary, and the point test asked whether that point is in the room. A
# family instance of Doors or Windows hosted in a wall now counts as in the
# room when either its From Room or its To Room is that room, asked in the
# room's own phase (its Phase, ROOM_PHASE_ID - this card names no phase, and
# the point test always asked the room itself), and the new
# `doorsAndWindows` says which side - "window W12 (id 351204): its To Room".
# Where that cannot be asked - a Space, since From Room and To Room name
# rooms; a room whose phase cannot be read; a room in another model; a From
# and To Revit will not give - it keeps the point test and its line says why.
# Every other element keeps the point test, unchanged. Version 1 was PROVEN
# (the proof block below, kept as the record of what it proved); its C#
# moved, so it is DRAFT again until NEEDS-CHECKING Group OT is run (D-30) -
# on the owner's word that a fragment found wrong may be changed even though
# it is proven.

purpose: >
  Narrows a set of elements to the ones inside a given room. The filter every
  room-based MEP job needs — terminals in this room, the fittings in this
  room, sprinklers in this room, what is served by this space — and
  nothing here could do it.

  **A room is a VOLUME, not a rectangle.** An L-shaped room's bounding box
  covers ground that is not in the room, and a bounding-box test puts the
  neighbour's diffuser in your schedule. Revit's own point-in-room test is used
  instead, which follows the real boundary.

  **It tests ONE point per element, and says so.** A duct crossing three rooms
  belongs to whichever room contains the point tested. That is the honest limit:
  deciding how much of a duct must be inside to count is a question about the
  job — a takeoff wants length per room, a terminal count wants the point — and
  a fragment that chose would be silently wrong for the other.

  **The room's own level is not a filter.** A room is a volume with a height,
  so an element above the ceiling can be genuinely inside it, and excluding by
  level would drop exactly the services somebody is asking about.

  **Version 2: a door or window in a wall goes by its From and To instead.**

contract:
  needs:
    - name: room
      type: SpatialElement
      source: request
    - name: elements
      type: IList<Element>
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: outside
      # Elements handed in that the room does not contain - the rejects from
      # the set it was given. `elements` is the answer (D-52).
      role: accounting
      type: IList<ElementId>
    - name: noPoint
      # Elements with no point to test, so it could not be judged inside or
      # out. The evidence it looked, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: doorsAndWindows
      # VERSION 2. Each door and window in a wall handed in, one line each:
      # which side made it this room's - "window W12 (id 351204): its To
      # Room" - or that neither its From Room nor its To Room is, or why it
      # was judged by its point instead. How each was judged, never a thing
      # found (D-52); `elements` is the answer.
      role: accounting
      type: IList<string>


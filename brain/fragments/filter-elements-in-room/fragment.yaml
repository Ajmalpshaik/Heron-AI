# TRAP - OBSERVED ELSEWHERE, NOT YET PROVEN HERE. Added 2026-09-23.
#
# "Is it in the room" is a VOLUME test, and this fragment asks exactly that -
# `IsPointInRoom` at the element's own point. Another tool, on real models and
# mostly on Revit 2020, found a device in the ceiling void to be OUTSIDE its
# room's volume. The purpose says an element above the ceiling "can be
# genuinely inside" - true only where the room's volume reaches up into the
# void. Where the room stops at the ceiling, the same element is outside and
# this fragment leaves it out, and the positive case "a duct above the ceiling
# of the room - it IS inside" depends on which of the two the room is.
#
# COUNT_BY_SPATIAL_CONTAINER tests at the room's own height and would count
# that element IN; CHECK_ROOM_MEP_COMPLETENESS asks the volume question like
# this one while its purpose says the opposite. FRAGMENT-ISSUES 5b-175 records
# the disagreement; NEEDS-CHECKING AJ5 settles it with evidence. A note only:
# this fragment is PROVEN and its code is unchanged.

# ROUTING - repeated in READ_ROOM_GEOMETRY and COUNT_ELEMENTS.
#
#   "which elements are in this room"  -> here
#   "what is inside this room"         -> here
#   "how big is this room"             -> READ_ROOM_GEOMETRY
#   "how many diffusers in here"       -> here, then COUNT_ELEMENTS
#
# THE ROOM'S SHAPE AND THE ROOM'S CONTENTS ARE DIFFERENT QUESTIONS asked with
# the same words. One measures the space; this one narrows a set to it.
#   "which rooms have no mep in them" -> CHECK_ROOM_MEP_COMPLETENESS - it
#                                       checks against a RULE. This one hands
#                                       back the elements to act on

# SENTENCES ADDED 2026-09-01 BECAUSE THE ROUTING TABLE ABOVE ALREADY CLAIMED
# THEM. A routing table is a COMMENT and comments are not indexed - the search
# reads semantic-identity, the utterances, the capability, the domain and the
# purpose, and nothing else. So a table saying "-> here" recorded a decision
# that retrieval could not act on, and these resolved elsewhere.

#   "put the room name on all the equipment" -> ASSIGN_LOCATION_DATA - the same
#                                        question from the ELEMENT'S end, and
#                                        it writes the answer down
utterances:
  - which elements are in this room
  - what is inside this room
  - the ducts in this room
  - what is serving this space
  - find everything in here
  - how many diffusers in here
  - how many fittings in here

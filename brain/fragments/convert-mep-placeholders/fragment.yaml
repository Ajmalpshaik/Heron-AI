runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. MechanicalUtils.ConvertDuctPlaceholders
  and PlumbingUtils.ConvertPipePlaceholders (Document, ICollection<ElementId>,
  returning ICollection<ElementId>), Duct.IsPlaceholder and Pipe.IsPlaceholder,
  WorksharingUtils.GetCheckoutStatus(Document, ElementId, out string),
  CheckoutStatus.OwnedByOtherUser, Document.IsWorkshared and
  LocationCurve.Curve are present and unchanged 2020 through 2027 - read with
  tools/api-surface --members on 2026-11-01. IsPlaceholder is declared on Duct
  and on Pipe, not on MEPCurve, on every release.

# ROUTING (2026-11-01) - repeated in CREATE_MEP_PLACEHOLDER.
#
#   "convert these placeholders to real ducts" -> here
#   "turn the pipe placeholders into pipes"    -> here
#   "draw a duct placeholder from here to here" -> CREATE_MEP_PLACEHOLDER
#   "rough in the pipe route as placeholders"  -> CREATE_MEP_PLACEHOLDER
#   "change these ducts to return air"         -> SET_MEP_SYSTEM_TYPE - the
#                                                 ducts are already real
#   "put the fittings in"                      -> FIT_MEP_JOINTS
utterances:
  - convert these placeholders to real ducts
  - turn the pipe placeholders into pipes

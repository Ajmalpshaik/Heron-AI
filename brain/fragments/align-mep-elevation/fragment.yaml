id: FRG-MEP-002
semantic-identity: "line MEP runs up by their top, their bottom or their centre"
kind: action
domain: revit.mep
capability: ALIGN_MEP_ELEVATION
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Lines up ducts, pipes, trays and conduits by their TOP, their BOTTOM or their
  CENTRE - *"get the services level with each other"*, *"align the soffits so
  the ceiling fits"*.

  It works out each run's own vertical half-size from its real size parameter,
  so a 600 mm duct and a 100 mm pipe genuinely share a soffit line. That is the
  difference between this and moving them all to one height: **the insertion
  point of an MEP run is its CENTRELINE**, so making the centrelines equal
  leaves the tops and bottoms at different heights - which is exactly the thing
  a coordinated corridor needs to be equal.

  Insulation is NOT included. These parameters give the bare service size, and
  an insulated duct's real top is higher. If the job is about clearance to a
  ceiling, the caller adds it - it is not read here, because a fragment that
  quietly included it would give a different answer to the same question
  depending on whether somebody had modelled the insulation yet.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).


  **"SOFFIT" MEANS TWO DIFFERENT JOBS AND ONE OF THEM CHANGES THE MODEL:**

  | What you meant | Use |
  |---|---|
  | "the soffit height in here", "how high is the ceiling" - to know | `MEASURE_CEILING_HEIGHT`, read-only |
  | "line up the soffits", "align the undersides" - to change | `ALIGN_MEP_ELEVATION`, which MOVES services |

  Asking a height must never move a duct. Both fragments carry this table: a
  cross-reference written one way only routes whoever lands on the newer file,
  and which one a search returns is not something either of them chooses.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: edge
      type: string
      source: request
    - name: targetZ
      type: double
      source: request
  provides:
    - name: aligned
      type: int
    - name: noSize
      type: IList<ElementId>
    - name: notCurveBased
      type: IList<ElementId>


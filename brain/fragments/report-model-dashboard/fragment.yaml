id: FRG-QA-037
semantic-identity: "the whole model at a glance - elements by category, level and workset, warnings, views and sheets, families, groups, links, CAD, rooms and spaces - in one read"
kind: action
domain: revit.qa
capability: REPORT_MODEL_DASHBOARD
version: 3
source: OFFICIAL
risk: READ

# WHY IT EXISTS - a comment, not `purpose`, because `purpose` is searched.
# Asked for by the owner, Ajmal PS, on 2026-11-01: a Model Dashboard panel in
# the Heron Companion (docs/40), fed by ONE read of the open model and drawn by
# brain/heron_model_dashboard.py. Nothing in the library returned the whole
# model at once (heron_retrieve for "model dashboard", "model overview" and
# "model health summary", and the Matcher, that day): each part had a reader
# of its own - READ_MODEL_WARNINGS, LIST_WORKSETS, LIST_LINKED_MODELS,
# FIND_UNPLACED_VIEWS, FIND_VIEWS_WITHOUT_TEMPLATE, FIND_UNUSED_FAMILIES,
# FIND_UNUSED_GROUP_TYPES, SELECT_UNENCLOSED_ROOMS - and running eight reads
# for one panel costs eight round trips and eight answers that were never one
# moment of the model. This reads the parts with THEIR rules, in one pass, so
# each number agrees with the reader of that part.
#
# A NEW READ, NOT A WIDENING OF ANY OF THEM. Each of those answers one part
# with the elements it found, which is what a chain needs; this answers every
# part with counts and capped id lists, which is what a panel needs. Widening
# one of them to carry the other seven would change a PROVEN contract for a
# job it was not proved on.
#
# VERSION 2 (2026-11-01, the owner's phase 2 of the dashboard): an optional
# `parameters` - up to 12 parameter names - and a `fill` key in dashboardJson
# saying, per category and per name, how many of the counted elements have it
# populated, empty or absent (heron_modelqa's three states), plus doubled.
# Still DRAFT and never proved, so no proof went stale. Left out, the answer
# is version 1's plus "fill": null, so "format" stays 1. The modeller's words
# for it are not on this card yet: none were given, and none are invented.
#
# VERSION 3 (2026-11-01, the owner's phase 3 - the Companion's boards): an
# optional `breakdowns` - up to 8 "key|categories|groupBy|sum" - and a
# `breakdowns` key in dashboardJson: for each, the elements of those built-in
# categories grouped by a special key or a built-in parameter, counted, and
# summed in metres, square metres or cubic metres where asked. The boards are
# defined in brain/heron_model_dashboard.py's BOARDS, which writes the value;
# this card reads whatever it is sent. Still DRAFT, no proof to go stale, and
# "format" stays 1. No modeller's words were given for it, and none are added.
purpose: >
  Reads the open project once and counts what it holds, part by part, for the
  Heron Companion's Model Dashboard: the placed model elements by category,
  by level and by workset, and those on no level; the warnings grouped by
  what they say, errors first; the views by type, which are on a sheet and
  which have no view template; the sheets, the empty ones and the
  placeholders; the loaded and in-place families and those with nothing
  placed; the model and detail group types and the unused ones; each Revit
  link file, loaded and pinned or not; the CAD files, linked or imported; and
  the rooms and Spaces that are not placed or have no area. Given parameter
  names, it also counts, per category, the elements where each one is filled
  in, left empty, or not there at all. Given breakdowns, it groups the
  elements of the categories each names for the Companion's boards, with a
  total where one is asked.

  **Counts, never a verdict.** Nothing here calls a model clean, healthy or
  compliant, and there is no score. A part it could not read is said, never
  shown as zero.

  **It changes nothing.** A family document is not a project: only its title
  is read and every part says so.

  **Why one string.** A fragment's list output reaches the caller as its first
  three names (FRAGMENT-ISSUES 5b-195), so the dashboard crosses as one JSON
  string, `dashboardJson`, format 1, as REPORT_SPACE_ENVELOPE's take-off does.

# THE SHAPE OF dashboardJson, FORMAT 1 - read by brain/heron_model_dashboard.py,
# which is the other half of this contract. Element ids are digit strings.
#
#   format        1
#   model         {title, isFamily, isWorkshared}
#   elementTotal  placed model elements - not a type, a model category, not
#                 view-specific, with an extent (a bounding box), not a Level
#   categories    [{name, instances, types}] - model categories with at least
#                 one, most first; `types` is how many types those elements USE
#   levels        [{name, elevationMm, instances}] - every level, bottom to top
#                 by project elevation; elevationMm is the level's Elevation as
#                 its Properties show it, from its own Elevation Base
#   noLevel       placed model elements whose level is none of this model's
#   worksets      [{name, open, instances}] - user worksets by name; [] when
#                 not workshared. A closed workset's count is 0 because nothing
#                 on it is loaded
#   warnings      {total, errors, groups: [{text, severity, count, ids}]} -
#                 errors are WARNINGS of severity Error, as READ_MODEL_WARNINGS
#                 counts them; ids are distinct per kind and only this model's
#   views         {total, templates, onSheets, notOnSheets, withoutTemplate,
#                  byType: {ViewType name: n}, notOnSheetsIds} - total leaves out
#                 templates, sheets, Revit's browser views and title-block
#                 revision schedules
#   sheets        {total, empty, placeholders, emptyIds} - total counts
#                 placeholders; empty is a sheet that is not a placeholder with
#                 no viewport and no schedule (a title block's revision
#                 schedule does not count)
#   families      {loaded, inPlace, unused, types, unusedNames} - loaded is the
#                 loadable families, inPlace the in-place ones; both are in
#                 unused and types
#   groups        {modelTypes, detailTypes, unusedTypes} - attached detail
#                 groups are detail types
#   links         [{name, loaded, pinned, instances}] - one row per link FILE,
#                 by name; pinned only when every placement is
#   cad           {total, linked, imported, names} - every ImportInstance;
#                 names are the distinct file names
#   rooms         {total, placed, unplaced, notEnclosed, unplacedIds,
#   spaces         notEnclosedIds} - placed counts the not-enclosed ones too
#   fill          VERSION 2. null when no parameter was asked for - or, with a
#                 "fill:" line in notRead, when this part was refused (more
#                 than 12 names) or could not be read. Otherwise
#                 {parameters: [the names as typed, outer spaces trimmed,
#                               each once],
#                  rows: [{category, parameter, populated, empty, absent,
#                          doubled, emptyIds}]}
#                 - one row per category with an element counted and per
#                 name, by category name then the names in the order typed.
#                 populated + empty + absent + doubled is the category's
#                 instances. doubled: two parameters answer to the name and
#                 neither is guessed (D-54 s3). emptyIds are the empty ones
#   breakdowns    VERSION 3. null when none was asked for - or, with a
#                 "breakdowns:" line in notRead, when more than 8 were asked
#                 or the document is a family. Otherwise one entry per
#                 breakdown, in the order asked:
#                 [{key, unit, rows: [{value, count, sum, noSum, ids}] | null}]
#                 - unit "m", "m2" or "m3" (with the superscript), or null for a
#                 count, or for a parameter sum no element held;
#                 rows most elements first, at most 200 (a `capped` note when
#                 cut); value as Revit shows it, "" where there is none (and
#                 "(none)" for @system); sum in that unit, rounded to 0.001,
#                 null when nothing in the row was summed - never 0; noSum the
#                 elements counted but holding nothing to sum; ids at most 500
#                 a row (a `capped` note). A breakdown refused or faulted has
#                 rows null and a "breakdowns: <key> - <why>" line in notRead;
#                 the others still read. A category the model has none of is
#                 rows [] - read, and empty
#   notRead       ["<part>: <why>"] - each part NOT read, named first: elements,
#                 categories, levels, worksets, warnings, views, sheets,
#                 families, groups, links, cad, rooms, spaces, fill,
#                 breakdowns. That part's own value is null - never zero
#   capped        ["<path>: <how many>..."] - each list cut at 500, with its
#                 full length. A count is never cut
contract:
  needs:
    - name: doc
      type: Document
    # VERSION 2. Parameter names, comma separated - "Mark, Type Mark, Fire
    # Rating, Department". Capitals and extra spaces are forgiven; at most 12,
    # more refuses the fill part naming the limit. Left out it is "none"
    # (`absent: none`, HeronBindingNote.DeclaredAbsent), and an empty value is
    # the same (EmptyMeansAbsent): nothing is counted and fill is null - the
    # answer version 1 gave, plus that key. So a parameter called "None" cannot
    # be asked for. "Mark" and "Type Mark" are read through ALL_MODEL_MARK and
    # ALL_MODEL_TYPE_MARK, READ_ELEMENT_TABLE's rule, so they answer in a Revit
    # of any language.
    - name: parameters
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 3. Breakdowns for the Companion's boards, separated by ";" - at
    # most 8, each "key|categories|groupBy|sum":
    #   key         [a-z0-9-]+, echoed back
    #   categories  built-in names, comma separated - "OST_Rooms",
    #               "OST_DuctCurves" - or "*" for every element the dashboard
    #               counts. A name Revit has not got refuses that one
    #   groupBy     @level @type @family @workset @phase @designoption @system
    #               @size, or a built-in parameter's name (ROOM_DEPARTMENT,
    #               FIRE_RATING, STRUCTURAL_MATERIAL_PARAM ...)
    #   sum         empty for a count, @length @area @volume, or a built-in
    #               parameter holding a length, an area or a volume
    # Left out it is "none" (`absent: none`), and empty is the same: nothing
    # is grouped and breakdowns is null - version 2's answer plus that key.
    # Written by brain/heron_model_dashboard.board_request, not typed by hand.
    - name: breakdowns
      type: string
      source: request
      optional: true
      absent: none
  provides:
    # The whole dashboard, format 1. ACCOUNTING, not a result, for the reason
    # REPORT_SPACE_ENVELOPE's takeoffJson is: it is written whatever was found
    # - a family document still gets the format and the model block - so as a
    # result it could never come back empty and the negative case could never
    # be judged (heron_validate.looks_empty). `elementTotal` is the evidence.
    # The role changes nothing in the reply: `provides` carries both, and the
    # MCP side reads it from there as it reads takeoffJson.
    - name: dashboardJson
      role: accounting
      type: string
    # How many placed model elements were counted - the same number as the
    # JSON's elementTotal. 0 in a family document, where nothing is counted.
    - name: elementTotal
      role: result
      type: int
    # How many parts could not be read - the entries of the JSON's notRead.
    # The evidence it looked, never something it found (D-52).
    - name: sectionsNotRead
      role: accounting
      type: int
    # One line per part with its headline number, then what was not read and
    # what was cut. A string, not a list: a list crosses as its first three.
    - name: findings
      role: accounting
      type: string

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. Read off the shipped assemblies of
  all eight releases on 2026-11-01 (tools/api-surface --members), each with
  one signature 2020 to 2027: Document.GetWarnings, IsFamilyDocument,
  IsWorkshared and Title; FailureMessage.GetDescriptionText, GetSeverity and
  GetFailingElements; Element.ViewSpecific, WorksetId, Pinned, LevelId,
  GetTypeId, Category, Location and get_BoundingBox; Category.CategoryType;
  WorksetId.IntegerValue (an int on every release - a workset id is not an
  element id); FilteredWorksetCollector.OfKind; Workset.IsOpen;
  ViewSchedule and ScheduleSheetInstance.IsTitleblockRevisionSchedule;
  ViewSheet.IsPlaceholder; Viewport.ViewId and SheetId; Family.IsInPlace and
  GetFamilySymbolIds; GroupType.Groups; Group.GetAvailableAttachedDetailGroupTypeIds;
  RevitLinkInstance.GetLinkDocument; ImportInstance.IsLinked;
  SpatialElement.Area; Level.Elevation and ProjectElevation; View.IsTemplate,
  ViewTemplateId and ViewType; and the ElementId(BuiltInCategory)
  constructor. Version 2 adds Element.Parameters and get_Parameter by
  BuiltInParameter; Parameter.HasValue, StorageType, AsString, AsElementId,
  Definition and Id; Definition.Name; and BuiltInParameter.ALL_MODEL_MARK and
  ALL_MODEL_TYPE_MARK - all 2020 to 2027, read the same way. Version 3 adds
  Element.CreatedPhaseId and DesignOption; Document.GetWorksetTable and
  WorksetTable.GetWorkset(WorksetId); ElementType.FamilyName;
  Parameter.AsValueString, AsDouble and AsInteger; and the built-in
  parameters CURVE_ELEM_LENGTH, ROOM_AREA, ROOM_VOLUME, HOST_AREA_COMPUTED,
  HOST_VOLUME_COMPUTED, RBS_CALCULATED_SIZE, RBS_DUCT_SYSTEM_TYPE_PARAM,
  RBS_PIPING_SYSTEM_TYPE_PARAM and RBS_SYSTEM_CLASSIFICATION_PARAM - all 2020 to
  2027. Built-in categories and parameters a breakdown names are parsed by
  name at run time, so a release's own spelling is the one found (the 2026
  classification rename included). What kind of number a parameter holds is
  NOT one member on every release - Definition.GetDataType is 2022 to 2027,
  Definition.ParameterType 2020 to 2022 - so it is read by reflection, the
  newer first, as ADD_FAMILY_CONNECTOR reads it; neither is named in code.
  Sums are internal feet, square feet and cubic feet times exact factors: no
  units API on any release (D-20). No ElementId is read as a number - each is written with
  ToString() - and no units API is touched: feet become millimetres by
  * 304.8 at the edge (D-20).

# HOW BIG THE ANSWER GETS, AND WHAT BOUNDS IT - read 2026-11-01.
#
# A PROVIDED STRING HAS NO SIZE LIMIT ON THE WAY BACK. RevitFragment.Describe
# hands a string over unchanged; BridgeServer writes the reply as one line
# with no cap; heron_bridge_client._read_line reads it in 4096-byte chunks to
# the newline with no cap. The one limit in the bridge is the REQUEST's:
# BridgeServer.MaxRequestChars, 1 MiB a line - and the fragment's own source
# travels in the request, so this file counts against it (it is well under).
#
# WHAT DOES BOUND A BIG MODEL IS TIME. The add-in stops a fragment at
# revit.operationTimeoutSeconds (60 s by default; HeronRunClock) and the run
# is rolled back and said to have stopped. The element pass reads every
# element once - on a model of several hundred thousand elements that is the
# part to watch, and the timeout is the setting to raise.
#
# THE JSON IS BOUNDED BY ITS CAPS. Each id or name list stops at 500 and the
# warning kinds at 500, so the worst case is the warnings - 500 kinds of 500
# ids each, a few megabytes. A typical project is tens of kilobytes. Version
# 2's fill adds a row per category and per name with up to 500 empty ids -
# 12 names over 50 categories is 600 rows, and a parameter empty everywhere is
# the case that fills them. Version 3's breakdowns add at most 8 x 200 rows of
# up to 500 ids each - a board of 6 is typically a few hundred rows. Asked
# through revit_read rather than the dashboard tool, the whole string is
# printed into the chat; the tool keeps it for the page.

# WHAT IT CANNOT SEE.
#   * A closed workset's elements are not loaded, so no count includes them -
#     the workset's own row says open false.
#   * Linked models are not read: a link is a row of its own, never its
#     contents. Rooms in an architect's link are not this model's rooms.
#   * A family placed only inside another family reads unused, as in
#     FIND_UNUSED_FAMILIES.
#   * A room or Space with no area and a location may be not enclosed OR
#     redundant - both read Area 0 here. Revit's warnings tell them apart.
#   * fill (version 2) counts only the placed model elements - not types,
#     views, sheets or annotation - and a parameter held on the type answers
#     for every instance of it. A name given as "Mark" or "Type Mark" is read
#     through the built-in; a shared parameter of that same name beside it is
#     not looked at.
#   * breakdowns (version 3) read the placed model elements the dashboard
#     counts, except Rooms, Spaces and Areas named by a breakdown, which are
#     read from their own category - every one placed, enclosed or not, so a
#     room board can differ from the categories part's Rooms row, which
#     counts only rooms with an extent. Areas of every area scheme are read
#     together.
#   * withoutTemplate follows FIND_VIEWS_WITHOUT_TEMPLATE's rule - sheets,
#     schedules and legends left out - so it counts any other view with no
#     template, a rendering or a report view among them.

# ROUTING - the dashboard's own words, and the parts that have readers of
# their own. A sentence about ONE part goes to that part's reader, which hands
# back the elements a next step can use; this card hands back counts.
#
#   "model dashboard"                     -> here
#   "model overview"                      -> here
#   "model health summary"                -> here - every part at once
#   "is the model healthy"                -> READ_MODEL_WARNINGS, which declares
#                                            it; Revit's warnings are the first
#                                            answer to that
#   "list the warnings"                   -> READ_MODEL_WARNINGS
#   "which views are not on a sheet"      -> FIND_UNPLACED_VIEWS
#   "list the worksets"                   -> LIST_WORKSETS
#   "list the linked models"              -> LIST_LINKED_MODELS
#   "which families are unused"           -> FIND_UNUSED_FAMILIES
#   "which rooms are not enclosed"        -> SELECT_UNENCLOSED_ROOMS
#   "check the model naming conventions"  -> CHECK_MODEL_STANDARDS - rules the
#                                            project supplies; this has none
utterances:
  - model dashboard
  - model overview
  - model health summary

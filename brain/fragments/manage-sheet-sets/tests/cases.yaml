# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: twelve sheets and mode "create" with a new name
    expect: >
      the set in Revit's own print dialog holding twelve sheets. Open
      File - Print and look at the set list; that dialog is where these are used

  - given: mode "rename"
    expect: >
      the set under its new name and the same members

  - given: mode "delete"
    expect: >
      the set gone from the print dialog

  - given: the set created, then read back
    expect: >
      `memberCount` matching what the dialog shows - read from the set, not
      counted from what was sent

  # Version 2 (2026-10-17, rows 5b-466 and 5b-545). The proof plan is
  # tools/jobs/manage-sheet-sets-v2-revit2020-2026-10-17.yaml, NEEDS-CHECKING
  # Group FA.
  - given: mode "add", an existing set's name, and three sheets not in it
    expect: >
      `changed` 3, `memberCount` the set's old count plus 3, the same set
      under the same name in File - Print - Settings with the three ticked
      and every sheet it had still ticked. LIST_SHEET_SETS read before and
      after names the same set with three more sheets

  - given: mode "remove", an existing set's name, and two of its sheets
    expect: >
      `changed` 2, `memberCount` its old count minus 2, the rest still ticked

  - given: mode "add" with two sheets already in the set and one that is not
    expect: >
      `changed` 1, the two in `unchanged`, the set holding one more

  - given: the Print dialog's range on "Current window" before any mode runs
    expect: >
      `printRange` saying it was put back to Current window, and File - Print
      showing Current window again - after the run, and after the rollback

  # Version 3 (2026-11-01, row 5b-1361). The proof plan is
  # tools/jobs/manage-sheet-sets-v3-duplicate-scratch-2026-11-01.yaml,
  # NEEDS-CHECKING Group KA rows KA15 and KA16.
  - given: mode "duplicate", a saved set's name and a new name, nothing selected
    expect: >
      `done` true, `memberCount` the original's count, and File - Print -
      Settings listing both sets with the same sheets and views ticked - the
      original unchanged

  - given: mode "copy"
    expect: >
      the same as "duplicate"

  # Version 4 (2026-11-01): SYNC_SHEET_SETS_BY_PARAMETER merged in, and its
  # In-Session rule taken for every mode. The proof plan is
  # tools/jobs/sheet-sets-by-parameter-scratch-2026-11-01.yaml, NEEDS-CHECKING
  # Group KA rows KA12, KA14 and KA17. Each case below FAILS on version 3.
  - given: >
      THE IN-SESSION RESTORE. On the scratch project "Heron Sheet Sets KA", a
      saved set "HERON KA KEEP" holding A101, and File - Print - Settings left
      on "HERON KA KEEP" as the current set; then the In-Session selection
      ticked to A104 alone and the dialog closed on "<in-session>". Mode
      "create", setName "HERON KA NEW", elements A102 and A103
    expect: >
      `done` true, `memberCount` 2, "HERON KA NEW" holding A102 and A103 -
      and afterwards File - Print - Settings opening on the set it was on
      before the run, with the In-Session selection still A104 alone and
      "HERON KA KEEP" still A101 alone. VERSION 3 FAILS THIS: it wrote A102
      and A103 onto whichever set was current and left the dialog on "HERON
      KA NEW"
  - given: >
      the same, but mode "duplicate" of "HERON KA KEEP" as "HERON KA KEEP 2"
    expect: >
      both sets holding A101, and the dialog back on the set it was on before.
      Version 3 left it on the copy
  - given: >
      mode "by-parameter", parameterName "HERON Browser 1", setPrefix and
      values left out, no setName and no newName, nothing selected - six
      sheets, A101 to A103 "01_IAB-ISSUED AS-BUILT", A104 and A105
      "02_IFI-ISSUED FOR INFORMATION", A106 empty, no set saved
    expect: >
      the call binds with neither name given (version 3 refused it unbound),
      `done` true, `created` naming '01_IAB-ISSUED AS-BUILT' (3) and
      '02_IFI-ISSUED FOR INFORMATION' (2), `memberCount` 5; File - Print -
      Settings listing both sets with those sheets ticked; A106 in neither;
      the In-Session selection as it was before
  - given: the same, after A103's value is changed to 02_IFI, with updateExisting true
    expect: >
      `updated` naming '01_IAB-ISSUED AS-BUILT' (0 in, 1 out) and
      '02_IFI-ISSUED FOR INFORMATION' (1 in, 0 out); the sets in the dialog
      matching; CHECK_SHEET_SETS_BY_PARAMETER then reading both in step
  - given: the same change, with updateExisting left out
    expect: >
      `done` false, `refused` saying every set already exists, and
      `setsUnchanged` naming both as out of step and left alone - the sets as
      they were
  - given: setPrefix "ISSUE - "
    expect: >
      the sets named "ISSUE - 01_IAB-ISSUED AS-BUILT" and so on
  - given: values "02_IFI-ISSUED FOR INFORMATION"
    expect: >
      one set made, for that value alone

negative:
  - given: the print range left as it was
    expect: >
      NOT how this works. Asking for the sheet-set setting first raises an
      error about the print dialog that mentions no sheet set at all, which is
      why the range is set first every time

  - given: a transaction that rolls back afterwards
    expect: >
      the print RANGE as it was before the run. The print manager is
      application state, not document state, and an undo does not put it
      back - so since version 2 the fragment puts it back itself, before it
      returns, and `printRange` says so. Version 1 left it on "Selected
      views/sheets" (found 2026-10-14)

  - given: a set name that does not exist, for rename or delete
    expect: >
      `refused` naming it and nothing changed

  - given: a view template in the set of elements
    expect: >
      its id in `notASheet`. A template cannot be printed

  - given: an empty element list with mode "create"
    expect: >
      `refused`, not an empty set created quietly

  # Version 2.
  - given: mode "add" with every sheet given already in the set
    expect: >
      `refused` saying nothing was added, `done` false, `changed` 0, and the
      set exactly as it was. Revit's Save throws on a set that is unchanged,
      so this is refused before Save is asked

  - given: mode "remove" with sheets none of which is in the set
    expect: >
      `refused` saying nothing was taken out, every one in `unchanged`

  - given: mode "remove" with every sheet the set holds
    expect: >
      `refused` - a set left holding nothing is what LIST_SHEET_SETS flags
      EMPTY, and deleting the set is mode delete. The set unchanged

  - given: mode "add" or "remove" and a set name that does not exist
    expect: >
      `refused` naming it, nothing changed, and no new set made under that
      name - add never creates

  # Version 3.
  - given: mode "duplicate" and a set name that does not exist
    expect: >
      `refused` naming it, `done` false, and no set under the new name

  - given: mode "duplicate" and a new name a set already has
    expect: >
      `refused` saying that set already exists, nothing copied, and both
      sets exactly as they were

  - given: mode "duplicate" with no new name
    expect: >
      `refused` saying no name was given for the copy

  # Version 4.
  - given: mode "create" with a set name a saved set already has
    expect: >
      `refused` saying that set already exists and naming add and remove,
      `done` false, the existing set exactly as it was. Version 3 asked
      SaveAs anyway and did not read what it returned
  - given: mode "by-parameter" and parameterName "ZZZ NO SUCH PARAMETER"
    expect: >
      `refused` naming 'ZZZ NO SUCH PARAMETER', `done` false, no set made -
      the dialog's set list exactly as before. Version 3 refused the mode
  - given: mode "by-parameter" and values "03_NOBODY HAS THIS"
    expect: >
      `refused` naming the value, nothing made
  - given: mode "by-parameter" with no parameterName
    expect: >
      `refused` "No parameter name was given."
  - given: mode "by-parameter" and a value whose set name Revit will not take
    expect: >
      that value in `skipped` with Revit's reason, the others still made
  - given: mode "rename" or "create" with setName left out
    expect: >
      `refused` "No set name was given." - the word "none" the card binds is
      no name, never a set called none

second_route:
  - >
    open File - Print in Revit and look at the saved set list, then select the
    set and check the sheets it selects
  - >
    LIST_SHEET_SETS on the same model, before and after an add or a remove:
    the set's sheets by number, read by a different card through the
    element rather than the print manager
  - >
    CHECK_SHEET_SETS_BY_PARAMETER on the same model after a by-parameter run:
    every value in step, read as elements, never through the print manager

semantic-identity: "save these sheets as a named set for printing"
kind: action
domain: revit.sheets
capability: MANAGE_SHEET_SETS
# VERSION 2 (2026-10-17, FRAGMENT-ISSUES 5b-466 and 5b-545): modes "add" and
# "remove" change what an EXISTING set holds, under its own name - version 1
# could only delete it and make it again. And the print range is read first
# and put back afterwards: version 1 set it to "Selected views/sheets" and
# left it there, and the print manager is not transactional, so an Undo left
# Revit's Print dialog changed. No new required input - add and remove take
# the elements and setName create already takes. DRAFT until version 2 is run
# in Revit: NEEDS-CHECKING Group FA. Ajmal PS's yes to change the PROVEN card
# was his starting the task, 2026-10-17. Version 1's proof is kept below as
# the record it is; its fingerprint no longer matches this code.
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Creates, renames or deletes the named sheet sets that appear in Revit's print
  and export dialogs - the saved lists an issue is printed from - and adds
  sheets to a set that already exists, or takes them out of it.

  **ADD AND REMOVE KEEP THE SET AND ITS NAME.** The sheets and views given go
  into it, or come out of it; the rest of it stays. One already in it (add),
  or never in it (remove), is reported and left alone. A call that would
  change nothing is refused, and so is one that would leave the set holding
  nothing - deleting the set is its own mode.

  **EVERY ROUTE GOES THROUGH THE PRINT MANAGER, AND THERE IS NO OTHER ONE.** A
  sheet set is an element, and it cannot be built with a constructor, renamed
  through its name, or removed with a delete. All three go through the print
  manager's sheet-set setting, which is an odd shape for a model change and is
  simply how Revit exposes it.

  **THE SETTING THROWS UNLESS THE PRINT RANGE IS SET FIRST.** Asking for it
  while the range is anything but "selected views" raises an error whose text
  is about the print dialog and says nothing about sheet sets. Every mode sets
  the range first.

  **THE PRINT MANAGER IS NOT TRANSACTIONAL.** The print range stays changed
  even if the surrounding transaction rolls back - it is application state, not
  document state - so it is read before it is set and put back afterwards,
  whatever happened in between, and the reply says which.

  **A SET IS A LIST OF VIEWS, AND A DELETED VIEW LEAVES A HOLE.** The set is
  written from the elements given, and what it holds afterwards is read back
  rather than assumed.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: setName
      type: string
      source: request
    # "create" | "rename" | "delete" | "add" | "remove". Add and remove use
    # `elements` and `setName`, as create does.
    - name: mode
      type: string
      source: request
    # Used by rename only.
    - name: newName
      type: string
      source: request
  provides:
    - name: memberCount
      role: result
      type: int
    - name: done
      role: result
      type: bool
    - name: notASheet
      # Handed in but not sheets, so there was nothing here to act on. A count
      # of what it was GIVEN and could not use, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string
    - name: changed
      # Version 2. How many sheets and views went into the set (add) or came
      # out of it (remove). 0 for create, rename and delete, and 0 whenever
      # nothing was saved.
      role: result
      type: int
    - name: unchanged
      # Version 2. Handed in and left as they were - already in the set for
      # add, never in it for remove. Given, not found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: printRange
      # Version 2. What happened to the Print dialog's range: put back to
      # what it was, already "Selected views/sheets", or NOT put back - with
      # what it was, so the modeller can set it back. Blank when the print
      # manager never opened. A note about Revit's state, never a finding.
      role: accounting
      type: string


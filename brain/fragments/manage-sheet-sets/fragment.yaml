runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. The print manager, its sheet-set
  setting and the save, rename and delete on it are unchanged 2020 to 2027 -
  and so is the requirement to set the print range before touching any of them.
  Version 2's members - `PrintManager.PrintRange` read and set,
  `ViewSheetSetting.Save()` and `Revert()`, `IViewSheetSet.Views` read and set,
  `ViewSet.IsEmpty` - were looked up on every release with
  tools/api-surface --members on 2026-10-17: the same signature 2020 through
  2027. 2023's `OrderedViewList` and `IsAutomatic` order a set and are not
  read or written, so where an added sheet lands in a manually ordered set
  is Revit's choice (NEEDS-CHECKING Group FA). Members are compared by
  ElementId's own equality, never as a number, so 2024's 64-bit ids do not
  reach this code.

# ROUTING - the same rows are in the fragments named here.
#
#   "save these sheets as a set"         -> here
#   "delete that print set"              -> here
#   "rename the sheet set"               -> here. Declared 2026-10-16: once
#                                           RENAME_ELEMENTS learned "rename this
#                                           view", the trained search with no
#                                           re-ranker sent this there (5b-485)
#   "print these to PDF"                 -> EXPORT_SHEETS_TO_PDF, which prints
#                                           a set once it exists
#   "make the sheets"                    -> CREATE_SHEETS
#   "which sheets are there"             -> LIST_SHEETS
#   "how many sheet sets are there"      -> LIST_SHEET_SETS. A QUESTION: this
#                                           fragment makes, renames and
#                                           deletes a set and reads none back,
#                                           and before 2026-10-14 it answered
#                                           that question on the spelling
#                                           route (row 5b-465)
#   "list the view/sheet sets"           -> LIST_SHEET_SETS - every saved set,
#                                           its sheets and views, and the
#                                           empty ones flagged
#   "add these sheets to the set"        -> here, mode add. Since version 2
#                                           (2026-10-17, row 5b-466); before
#                                           it, CREATE_SHEETS on both backends
#   "take these sheets out of the set"   -> here, mode remove (row 5b-466)
#   "save these elements as a set"       -> CREATE_SELECTION_FILTER. A
#                                           selection set and a sheet set are
#                                           different things with one word
#   "make a revision for this issue"     -> CREATE_REVISION. A sheet set is
#                                           what gets printed; a revision is
#                                           what the sheets record

utterances:
  - save these sheets as a named set
  - make a print set
  - delete that sheet set
  - rename the print set
  - i need a set for the issue
  - rename the sheet set
  - add these sheets to the set
  - take these sheets out of the set

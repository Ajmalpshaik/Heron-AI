# ADD AND REMOVE KEEP THE SET AND ITS NAME. The sheets and views given go
# into it, or come out of it; the rest of it stays. One already in it (add),
# or never in it (remove), is reported in `unchanged` and left alone. A call
# that would change nothing is refused, and so is one that would leave the
# set holding nothing - deleting the set is its own mode.
#
# KEPT OUT OF THE PURPOSE ON PURPOSE (2026-10-17, row 5b-545). Measured on
# fresh scratch stores, main against this branch, both backends: with this
# paragraph in the purpose, "which sheets to print" - a row in
# SET_PRINT_SETTINGS' routing table that names this card - left it behind the
# 2020 wall, for SET_PRINT_SETTINGS (trained model) and
# REPORT_SHEET_TITLE_BLOCKS (spelling route). Without it that sentence comes
# back here on both - row 5b-545 has the whole before and after.
#
# AND THE PURPOSE'S FIRST SENTENCE IS VERSION 1'S, ON PURPOSE. Measured the
# same way after main a673d8d2: a clause on adding and removing there - in
# three wordings, down to the one word "edits" - took "how many sets are
# there", Ajmal PS's own question of 2026-10-14, from LIST_SHEET_SETS to
# COUNT_ELEMENTS on the spelling route. Add and remove reach this card through
# the two utterances below, and are described here and on `mode`.
purpose: >
  Creates, renames or deletes the named sheet sets that appear in Revit's print
  and export dialogs - the saved lists an issue is printed from.

  **EVERY ROUTE GOES THROUGH THE PRINT MANAGER, AND THERE IS NO OTHER ONE.** A
  sheet set is an element, and it cannot be built with a constructor, renamed
  through its name, or removed with a delete. All three go through the print
  manager's sheet-set setting, which is an odd shape for a model change and is
  simply how Revit exposes it.

  **THE SETTING THROWS UNLESS THE PRINT RANGE IS SET FIRST.** Asking for it
  while the range is anything but "selected views" raises an error whose text
  is about the print dialog and says nothing about sheet sets. Every mode sets
  the range first.

  **THE PRINT MANAGER IS NOT TRANSACTIONAL.** The print range stays changed
  even if the surrounding transaction rolls back - it is application state, not
  document state - so it is read before it is set and put back afterwards,
  whatever happened in between, and the reply says which.

  **A SET IS A LIST OF VIEWS, AND A DELETED VIEW LEAVES A HOLE.** The set is
  written from the elements given, and what it holds afterwards is read back
  rather than assumed.

  Version 4 makes one set for each value of a sheet parameter, in one call -
  every sheet and view carrying that value goes into the set named for it,
  the value itself or with a prefix put in front. A set that already exists is
  left as it is and reported, unless bringing existing sets back in step was
  asked for. A parameter no sheet has is refused, naming it, and so is a value
  asked for that no sheet carries. Every mode writes a new set through the
  In-Session set, and the Print dialog's current set and In-Session selection
  are put back afterwards with the range.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # OPTIONAL SINCE 2026-11-01 (FRAGMENT-ISSUES row 5b-1361). Rename and
    # delete never read it, and Ajmal PS had to run a sheet selection first,
    # on 4355-BHVD-3D-50S20-BL001A, only so the binder would let them run.
    # Marked optional, an element list nothing filled binds EMPTY
    # (HeronBindingNote.EmptyWhenAbsent) - and every mode that reads it already
    # refuses an empty list: create "No views or sheets to put in the set." (the
    # proven negative), add and remove "No views or sheets were given". The
    # contract only: impl/ is untouched, so the proof's fingerprint holds.
    # Whether rename and delete now bind with nothing selected is NEEDS-CHECKING
    # Group KA, row KA11.
    - name: elements
      type: IList<Element>
      optional: true
    # OPTIONAL SINCE VERSION 4, so by-parameter - which names its sets from the
    # values - can be asked without one. Left out it binds "none", which the
    # C# reads as no name: every other mode then refuses "No set name was
    # given.", as an empty name always was.
    - name: setName
      type: string
      source: request
      optional: true
      absent: none
    # "create" | "rename" | "delete" | "add" | "remove" | "duplicate" |
    # "by-parameter". Add and remove use `elements` and `setName`, as create
    # does. Duplicate (version 3; "copy" is taken as duplicate) copies
    # `setName` as `newName`. By-parameter (version 4, from
    # SYNC_SHEET_SETS_BY_PARAMETER; "by parameter" and "sync" taken as the
    # same) uses `parameterName`, `setPrefix`, `values` and `updateExisting`.
    - name: mode
      type: string
      source: request
    # Used by rename, and by duplicate as the copy's name. OPTIONAL SINCE
    # VERSION 4, as setName is: "none" is no name, and rename and duplicate
    # refuse it as before.
    - name: newName
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 4, from SYNC_SHEET_SETS_BY_PARAMETER - by-parameter only, every
    # other mode leaves it unread. The parameter's name exactly as the sheet's
    # Properties show it. Left out ("none"), by-parameter refuses "No
    # parameter name was given."
    - name: parameterName
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 4, by-parameter only. Put in front of each value to make the
    # set's name, or left out.
    - name: setPrefix
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 4, by-parameter only. Only these values, ";" between them - or
    # left out for every value.
    - name: values
      type: string
      source: request
      optional: true
      absent: all
    # VERSION 4, by-parameter only. True: an existing set is made to hold
    # exactly its value's sheets and views. Left out (false): an existing set
    # is not touched, and is reported in setsUnchanged.
    - name: updateExisting
      type: bool
      source: request
      optional: true
      absent: "false"
  provides:
    # What the set written holds, read back from it. Since version 4, for
    # by-parameter, what the sets made and brought in step hold together.
    - name: memberCount
      role: result
      type: int
    - name: done
      role: result
      type: bool
    - name: notASheet
      # Handed in but not sheets, so there was nothing here to act on. A count
      # of what it was GIVEN and could not use, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string
    - name: changed
      # Version 2. How many sheets and views went into the set (add) or came
      # out of it (remove). 0 for create, rename, delete, duplicate and
      # by-parameter, and 0 whenever nothing was saved.
      role: result
      type: int
    - name: unchanged
      # Version 2. Handed in and left as they were - already in the set for
      # add, never in it for remove. Given, not found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: printRange
      # Version 2. What happened to the Print dialog's range: put back to
      # what it was, already "Selected views/sheets", or NOT put back - with
      # what it was, so the modeller can set it back. Blank when the print
      # manager never opened. A note about Revit's state, never a finding.
      # Since version 4 it also says when the Print dialog's current set or
      # In-Session selection could NOT be put back.
      role: accounting
      type: string
    - name: created
      # VERSION 4, by-parameter. The sets made, "; " between them, each with
      # how many it holds, read back from the set found by its name.
      role: result
      type: string
    - name: updated
      # VERSION 4, by-parameter. Existing sets brought back in step, with how
      # many went in and came out.
      role: result
      type: string
    - name: setsUnchanged
      # VERSION 4, by-parameter - SYNC_SHEET_SETS_BY_PARAMETER's `unchanged`.
      # Existing sets already in step, or left alone because updateExisting
      # was not asked for - each says which. Not a change (D-52).
      role: accounting
      type: string
    - name: skipped
      # VERSION 4, by-parameter. A value Revit would not make a set for, with
      # Revit's reason; the others are still made. Not a thing found (D-52).
      role: accounting
      type: string


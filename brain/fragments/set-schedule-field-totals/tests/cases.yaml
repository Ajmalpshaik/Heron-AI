positive:
  - given: an air terminal schedule grouped by Room Name with footers and the grand total on, and fieldNames Flow
    expect: >
      totalled 1, appliedTotals naming the Room: Name footer and the grand total,
      and in Revit each room's footer and the grand total showing a summed flow
      instead of a bare count - read on screen, not inferred from the count

  - given: the same request run a second time on the same schedule
    expect: >
      totalled 0 and alreadyTotalled 1. THIS IS THE READ-BACK: nothing else in
      the library reads a column's calculation, so the first run's change is
      proved by the second run finding it already there

  - given: a column showing its maximum, asked to total
    expect: >
      totalled 1, with replacedCalculation naming "its maximum" and appliedTotals
      saying "it was calculating its maximum" - the old calculation reported,
      not silently lost

  - given: a schedule with no footer and the grand total off
    expect: >
      totalled 1, and appliedTotals saying the total PRINTS NOWHERE YET - the
      column is set, and the modeller is told why nothing shows

  - given: a hidden numeric column, asked to total
    expect: >
      totalled 1, and appliedTotals saying THE COLUMN IS HIDDEN and its total
      prints nowhere until it is shown - not that it prints in the footer

  - given: VERSION 2 - calculation "minimum and maximum" on a numeric Length column that totals
    expect: >
      totalled 1, replacedCalculation saying it was calculating totals, and the
      Formatting tab's drop-down reading "Calculate minimum and maximum"; each
      footer and the grand total showing the shortest and longest length

  - given: VERSION 2 - calculation "none" on a column that totals
    expect: >
      totalled 1, appliedTotals saying it has no calculation, and the footers
      showing no sum for it

  - given: VERSION 2 - calculation left out
    expect: >
      exactly version 1 - totals, the same answer words as before

negative:
  - given: VERSION 2 - calculation "maximum" on the Family and Type column
    expect: >
      totalled 0, cannotTotal naming 'Family and Type' from CanDisplayMinMax,
      and the column's calculation unchanged

  - given: VERSION 2 - calculation "average"
    expect: >
      refused naming 'average' and the five calculations accepted, and NO column
      touched on any schedule

  - given: fieldNames Family and Type on the same schedule
    expect: >
      totalled 0, cannotTotal naming 'Family and Type', and the column's
      calculation unchanged - CanTotal refuses text, and it is asked before
      anything is set. THIS IS THE FIRST NEGATIVE TO RUN

  - given: fieldNames "Flow, Flow" on a schedule whose Flow is already totalling
    expect: >
      alreadyTotalled 1, not 2 - the same column named twice is one request,
      and a second pass must not report the first pass's change as found

  - given: a heading renamed to another column's field name, and that name asked for
    expect: >
      ambiguous naming it with "2 columns answer to that name", totalled 0, and
      NEITHER column's calculation changed

  - given: a column name that is not in the schedule
    expect: named in notPresent, totalled 0, nothing changed

  - given: an empty fieldNames list
    expect: refused, totalled 0, and no column touched

  - given: an empty elements list - a schedule name that found nothing
    expect: >
      refused, saying no schedule was handed in. A misspelled name must not read
      as a run that succeeded and had nothing to do

  - given: elements that are not schedules - a selection of air terminals
    expect: >
      refused, naming how many were handed in and that a schedule is picked on
      a sheet or found by name. Nothing changed

second_route:
  - >
    Revit's own Schedule Properties - Formatting tab, the column selected, the
    calculation drop-down. It reads "Calculate totals" for a column this has
    switched on, and "No calculation" for one it has refused

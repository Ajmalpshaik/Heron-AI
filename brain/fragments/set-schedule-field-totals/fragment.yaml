#                                             room with footers on. It is the
#                                             COLUMN that is totalled; the
#                                             grouping is already there
#   "sum this column in the schedule"      -> here. It used to reach
#                                             SET_SCHEDULE_APPEARANCE, a write
#                                             that renames and widens columns
#   "add a total to the bottom of the      -> SET_SCHEDULE_SORT_GROUP,
#    schedule"                                showGrandTotal. That switches the
#                                             grand total ROW on; this decides
#                                             what the row adds up. Both are
#                                             needed for a total flow to print
#   "show the grand total on this          -> SET_SCHEDULE_SORT_GROUP, the same
#    schedule"                                row. check-routing ranks this card
#                                             first on it by words (2026-09-27);
#                                             the exact sentence is sort-group's
#   "is there a total on this schedule"    -> REPORT_SCHEDULE_DEFINITION, which
#                                             reads the grand total ON or off.
#                                             A question, and ranked here by
#                                             words - it was ranked on
#                                             SET_SCHEDULE_SORT_GROUP, a write,
#                                             before this card existed
#   "what is the total per type"           -> SUM_BY_GROUP. A question about
#                                             the model, answered in the chat;
#                                             this changes a schedule
#   "which columns are totalled"           -> nothing reads it yet.
#                                             REPORT_SCHEDULE_DEFINITION does
#                                             not report a column's calculation


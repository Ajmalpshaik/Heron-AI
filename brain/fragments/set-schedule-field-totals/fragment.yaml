compatibility-note: >
  One implementation for every release. `ScheduleField.DisplayType` (get and
  set), `ScheduleField.CanTotal()`, `GetName`, `ColumnHeading` and `IsHidden`,
  `ScheduleFieldId`'s `Equals`, `GetHashCode` and `==` (so a set of them holds
  one entry per column), and the
  `ScheduleFieldDisplayType` enum with `Standard = 0`, `Totals = 1`,
  `MinMax = 2`, `Max = 3` and `Min = 4`, are present and unchanged 2020 through
  2027 - read out of the reference assemblies for each release with
  `tools/api-surface --members`, not assumed from the names.
  `ScheduleDefinition.GetSortGroupFields`, `ScheduleSortGroupField.ShowFooter`
  and `ShowGrandTotal`, read to say where a total prints, are the members
  `SET_SCHEDULE_SORT_GROUP` already uses on all eight.

  `CanDisplayMinMax` and `CanTotalByAssemblyType` exist on every release and are
  deliberately NOT used: minimum and maximum are out of this fragment's scope,
  and totalling by assembly type is a different Revit setting.

  Field identity is `ScheduleFieldId`, not an `ElementId`. No units call is
  made - a total is summed by Revit in the column's own units.


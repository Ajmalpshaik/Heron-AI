id: FRG-VIEW-109
semantic-identity: "switch on calculate totals for these columns of a schedule"
kind: action
domain: revit.schedules
capability: SET_SCHEDULE_FIELD_TOTALS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Switches on "Calculate totals" for named columns of a schedule - Schedule
  Properties, Formatting, pick the field, Calculate totals - so each group
  footer and the grand total add that column up.

  IT EXISTS BECAUSE *"calculate totals for the Flow column"* RESOLVED TO
  `MEASURE_ELEMENT_VOLUME`, and *"sum this column in the schedule"* to
  `SET_SCHEDULE_APPEARANCE`, which renames headings and widens columns - both
  asked of `heron_lookup` on 2026-09-27. The schedule that needed it was an air
  terminal schedule grouped by room with footers and a grand total on, whose
  Flow column had no total. Nothing in the library set a column's calculation.

  **FOOTERS AND TOTALS ARE TWO SETTINGS, ON TWO TABS.** A group footer and the
  grand total are switched on in Sorting/Grouping - `SET_SCHEDULE_SORT_GROUP`.
  What they ADD UP is chosen per column on the Formatting tab, and until a
  column has totals on, a footer only counts rows. So a schedule can look fully
  set up and still show no total flow, and every column switched on here says
  where its total will print - or that it prints nowhere yet.

  **ON ONLY.** Nothing here turns totals off or asks for a minimum or maximum. A
  column already totalling is reported and left alone, which is also how the
  change is read back: a second run finds it already totalled.

  **A COLUMN THAT CANNOT BE ADDED UP IS ASKED ABOUT BEFORE IT IS TRIED.**
  `CanTotal` is Revit's own answer - a type name or a room name is text - and a
  refusal changes nothing.

  **A NAME THAT COULD MEAN TWO COLUMNS TOUCHES NEITHER.** A column is found by
  its field name or its printed heading, and a heading can be renamed to
  another column's field name. Taking the first match would total whichever
  column comes first, not necessarily the one on screen, so anything but
  exactly one match is refused. A hidden column is switched on too, and the
  answer says its total prints nowhere until the column is shown.

  **REVIT ALLOWS ONE CALCULATION PER COLUMN.** A column showing its minimum or
  maximum is switched to totals, because totals is what was asked for, and what
  it showed before is reported rather than lost - the rule
  `SET_SCHEDULE_SORT_GROUP` keeps for a sort it replaces.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: fieldNames
      type: IList<string>
      source: request
  provides:
    - name: totalled
      role: result
      type: int
    - name: appliedTotals
      # A second read of each column switched on, with where its total prints
      # on that schedule - never an echo of the request. ONE STRING, joined
      # with "; ", because a list reaches the chat as three entries cut at
      # sixty characters and the cut part is where the total prints.
      role: result
      type: string
    - name: alreadyTotalled
      # Columns that were totalling before this ran and were left alone. The
      # prior state, never a change it made (D-52).
      role: accounting
      type: IList<string>
    - name: cannotTotal
      # Columns Revit will not add up - CanTotal is its own answer, asked
      # before anything is set. Given and unusable (D-52).
      role: accounting
      type: IList<string>
    - name: notPresent
      # Column names the schedule does not carry. The evidence it looked,
      # never a thing it found (D-52).
      role: accounting
      type: IList<string>
    - name: ambiguous
      # Names that more than one column answers to, by field name or by
      # printed heading. NONE of them was touched. Given and unusable (D-52).
      role: accounting
      type: IList<string>
    - name: replacedCalculation
      # A minimum or maximum the column showed BEFORE it was switched to
      # totals. The prior state, reported before it goes (D-52).
      role: accounting
      type: IList<string>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string


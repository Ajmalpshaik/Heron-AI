id: FRG-GEO-015
semantic-identity: "which one of those is closest to each of these"
kind: action
domain: revit.geometry
capability: FIND_NEAREST_ELEMENTS
version: 2
source: OFFICIAL
risk: READ

purpose: >
  For each element, the nearest one from a second set. "Which FCU serves this
  terminal", "which exit is closest to this room", "what is the nearest light to
  each switch". With withinMm, every one within that distance too, nearest first
  (version 2).

  **THREE WAYS TO MEASURE DISTANCE, AND THE CHOICE CHANGES THE ANSWER**, so it
  is a request input rather than a default:

  | `metric` | What it measures | When it is right |
  |---|---|---|
  | `centre` | straight line between centres | point-like equipment; **misleading for long elements** - a 30 m wall's centre can be far away while the wall runs right past you |
  | `gap` | closest approach between the two boxes, 0 if they overlap | real clearance, and the honest answer to "how close is that to this" |
  | `manhattan` | the three axis distances added | cable, conduit and duct do not fly diagonally through a building - for "how much cable will this take" this is far closer to reality than a straight line |

  Picking one silently would answer a different question from the one asked, and
  all three are defensible.

  **IT MEASURES PROXIMITY, NOT DIRECTION OR CONNECTION.** The nearest FCU to a
  terminal is not necessarily the one serving it, and the nearest exit may be
  through a wall. This narrows a search; it does not establish a relationship,
  and `TRACE_CONNECTIVITY` is what answers what is actually joined to what.

  **THE GAP FIGURE IS OPTIMISTIC ON A ROTATED ELEMENT AND MUST NOT BE QUOTED AS
  A CLEARANCE.** Bounding boxes are axis-aligned, so a rotated element's box is
  bigger than the element and two of them appear closer than they are. That is
  fine for ranking - the ordering is what this is for - and wrong for a
  certified figure.

  **IT NEEDS TWO SETS OF ELEMENTS AND ONLY ONE OF THEM CAN BE CALLED
  `elements`.** The things to measure FROM and the things to measure TO are both
  what a filter provides, so `targets` declares `binds: elements` - fill me from
  a provide called `elements`. The host runs the filter twice, once per role.
  Naming it `targets` rather than reusing `elements` is the point: which set is
  which decides the whole answer, and a contract that could not say so would
  make the two interchangeable on paper while they are not.

  **A TIE IS RETURNED AS A TIE.** Two candidates at the same distance is a real
  situation, and picking one on id order would make the answer depend on the
  order Revit happens to hand them back.

  **MILLIMETRES OUT, BY MULTIPLYING BY 304.8**, the same as MEASURE_DISTANCE -
  which is the fragment a modeller reaches for next, with the pair this one
  found. `distances` used to leave here in Revit's internal FEET under a bare
  name, so the two answered "how far apart" 304.8x apart from each other. The
  comparisons are still done in feet, because that is what a bounding box is
  in; only the number that leaves is converted, and its name now carries the
  unit the way every other converted length in this library does.

contract:
  needs:
    - name: elements
      type: IList<Element>
    - name: targets
      type: IList<Element>
      binds: elements
    - name: metric
      type: string
      source: request
    # Also list every target within this distance, nearest first; 0 lists none
    # (version 2).
    - name: withinMm
      type: double
      source: request
  provides:
    - name: nearest
      role: result
      type: IDictionary<ElementId, ElementId>
    - name: distancesMm
      role: result
      type: IDictionary<ElementId, double>
    - name: tied
      # Elements with two candidates the same distance away, so "the nearest"
      # is ambiguous. A qualifier on the answer given, not something it turned
      # away.
      role: result
      type: IList<ElementId>
    - name: withinRadius
      # With withinMm: per element, every target within it, nearest first, as
      # ONE string (version 2).
      role: result
      type: string
    - name: unmeasurable
      # Elements no distance could be taken from, so it could not be measured.
      # The evidence it looked, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>


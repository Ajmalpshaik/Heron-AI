compatibility-note: >
  One implementation for every release. `get_BoundingBox(null)` and `XYZ` are
  unchanged 2020 to 2027. Feet become millimetres by multiplying by 304.8 as
  plain arithmetic - no units API, which is what changed shape at 2021, and
  which is what D-20 is actually about. Nothing reads an ElementId as a number,
  so the 2024 64-bit change does not reach it.

utterances:
  - which FCU is nearest to this terminal
  - what is the closest one to each
  - find the nearest exit
  - which is the nearest light to each switch
  - how close is the nearest one
  - pair each of these with the closest
  - list everything within 3 m of each of these, nearest first

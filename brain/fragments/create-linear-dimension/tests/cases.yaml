positive:
  - given: >
      a floor plan and "grid A | grid B | grid C", grids drawn 6000 mm apart, the
      line from -1000,-2000,0 to 13000,-2000,0 - on Revit 2024
    expect: >
      ONE chained dimension reading "6000 mm + 6000 mm" - checked against the
      spacing the grids were drawn at, not read off the report. Proved 2026-10-03
      in Project1

  - given: >
      "wall <id> exterior | wall <id> interior" on one wall
    expect: one dimension reading the wall's thickness

  # VERSION 3 (5b-482, NEEDS-CHECKING Group EF) - a family instance.
  - given: >
      a section through a Generic Model box 1000 mm wide and 600 mm high whose
      bottom sits 1200 mm above Level 1, and "family ID Left | family ID Right"
    expect: >
      one dimension reading the box's width, 1000 mm - checked against the
      width the box was placed at, not read off the report

  - given: >
      the same section and "level Level 1 | face ID bottom | face ID top", the
      same point given twice for lineFrom and lineTo, beside the box
    expect: >
      one chained string reading "1200 mm + 600 mm", run through that point
      square to the level - the second segment the box's height

  - given: >
      the same section and "grid A | face ID left", the grid 2000 mm from the
      box's left side
    expect: one dimension reading 2000 mm

  # VERSION 4 (5b-486, NEEDS-CHECKING Group EH) - inside a loaded link. A
  # new project linking a saved one: in the link a N-S wall at x = 0, a box
  # 300 x 1000 x 600 mm in it 1000 mm up, grid LC at y = -2000, plane RP at
  # y = -1500, a model line at y = -1000; in the host grid C at y = -2500.
  - given: >
      the floor plan and "grid C | link LINKID face BOXID bottom | link LINKID
      face BOXID top", a line along the wall
    expect: >
      one chained string reading "2000 mm + 1000 mm", and a finding that 2 of
      its references read back as elements of a linked model

  - given: >
      "grid C | link LINKID grid LC | link LINKID plane RP | link LINKID line
      LINEID | link LINKID face BOXID bottom | link LINKID face BOXID top"
    expect: >
      "500 mm + 500 mm + 500 mm + 500 mm + 1000 mm" - a linked grid, plane and
      model line, each where it was drawn

  - given: >
      "link LINKID wall WALLID exterior | link LINKID wall WALLID interior"
    expect: one dimension reading the linked wall's thickness

  - given: >
      a section looking at the box and "link LINKID level Level 1 | link LINKID
      face BOXID top", the same point twice beside it
    expect: one dimension reading 1600 mm, the linked level to the box's top

  - given: >
      the link rotated 90 degrees in the host and "grid V | link LINKID face
      BOXID left | link LINKID face BOXID right"
    expect: >
      left and right OF THE VIEW, not of the link - "1000 mm + 2000 mm" with
      grid V at x = 2500

  - given: >
      the link said by its model's name, "link HeronLinkSource face BOXID
      bottom", and in quotes with ".rvt"
    expect: the same dimension as by its id

negative:
  - given: >
      "grid A | grid Nope" - a name the model does not have
    expect: refused naming the grid that is not there, nothing created

  - given: one reference
    expect: >
      refused by name saying two is the minimum, nothing created. A dimension
      with one reference has nothing to measure between

  - given: a view template handed in as the view
    expect: >
      refused by name. A template holds no annotation, and a silent empty answer
      would read as "this view will not take dimensions"

  - given: >
      a reference to an element that is hidden in that view by a filter
    expect: >
      reported - "a dimension can only measure what the view shows". This is the
      likely real-world failure and a bare null would explain nothing

  - given: >
      "family ID Banana" - a reference the family does not publish
    expect: >
      refused naming every reference it does publish - Left, Right,
      CenterLeftRight and the rest - and offering "face ID left|right|top|bottom";
      nothing created

  - given: >
      "face ID up" - a side that is not left, right, top, bottom, near or far
    expect: refused naming the six sides, nothing created

  - given: >
      the same point twice with "family ID Weak Plane | family ID Other Plane" -
      two references known only by their names
    expect: >
      refused saying none of the references says which way the string runs,
      and asking for two different points; nothing created

  - given: >
      "grid C | link Nope face BOXID left" - a link the model does not place
    expect: refused naming every link it does place, with its id; nothing created

  - given: >
      "grid C | link LINKID face 99999999 left" - an id not in that link
    expect: refused naming the link; nothing created

  - given: >
      "grid C | face BOXID bottom" - a linked element's id without `link`
    expect: >
      refused, saying the id is in that link and how to say it -
      "link LINKID ..."; nothing created

  - given: the link unloaded, or hidden in the view
    expect: refused saying which, by the link's name and id; nothing created

  - given: >
      "link LINKID link LINKID face BOXID bottom", or "link LINKID" with
      nothing known after it
    expect: >
      refused - a link inside a link is not reached, and a link with no word
      after it is asked for one; nothing created

  # VERSION 5 (2026-11-01) - grids and levels are this card's alone, with
  # CREATE_DIMENSION's datum rules carried. Each FAILS on version 4. NOT RUN.
  - given: >
      VERSION 5. A floor plan showing grids 1 to 6, between "grid 1 | grid 2 |
      grid 3 | grid 4 | grid 5 | grid 6", one point given twice 2000 mm past
      the grid ends
    expect: >
      one string, `measured` six-reference chain read back segment by
      segment against the grid spacing - CREATE_DIMENSION's version 4 case,
      here
  - given: VERSION 5. The same, with grid 6 hidden in the view (Hide in View, Elements)
    expect: >
      NOTHING drawn, `refused` saying grid 6 is not shown in the view - named
      before Revit is asked. Version 4 handed it to Revit, whose refusal
      named no grid
  - given: >
      VERSION 5. A section showing Level 00, 01 and 02, "level Level 00 |
      level Level 01 | level Level 02", one point twice beside them
    expect: >
      one string up the elevation reading floor to floor. THE FIRST VERSION 5
      CASE TO RUN: if this view's collector does not list levels, the new
      not-shown check refuses every level, and that must be seen before the
      check is trusted
  - given: >
      VERSION 5. The same section on a model whose level type's Elevation
      Base is the SURVEY POINT, well away from the project origin vertically
    expect: >
      the string beside the levels it measures, the same values - version 4
      worked the one-point string out from Elevation (row 5b-179)
  - given: VERSION 5. "grid A | level Level 2" in a section
    expect: refused naming 1 grid and 1 level - nothing drawn
  - given: VERSION 5. "level Level 1 | level Level 2" in a FLOOR PLAN
    expect: refused - a plan looks along the vertical - nothing drawn
  - given: VERSION 5. "grid A | grid C" where grid C is an arc
    expect: refused naming grid C as an arc - nothing drawn
  - given: VERSION 5. "grid A | grid 1" - grids at right angles
    expect: refused naming grid 1 as out of parallel - nothing drawn
  - given: VERSION 5. Two grids drawn on top of each other, named
    expect: refused - the string would measure zero - nothing drawn
  - given: >
      VERSION 5. "grid D | face 345678 left" and "level Level 1 | face 345678
      bottom" for a builders-work opening in a section
    expect: >
      each drawn - a datum WITH a face is still one string (5b-482); only a
      grid with a level is refused

second_route:
  - >
      Revit's own Annotate then Aligned dimension picked on the same two faces,
      and the two values compared
  - >
      the same, picked on the linked box's faces with Tab through the link in
      the host plan (version 4)

id: FRG-VIEW-101
semantic-identity: "dimension between these grids, levels, planes, lines or wall faces, on this view"
kind: action
domain: revit.annotation
capability: CREATE_LINEAR_DIMENSION
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Draws one linear dimension along a line, between the references given.

  **THE PLAIN DIMENSION, WHICH THE LIBRARY DID NOT HAVE.** `CREATE_DIMENSION`
  reads as the general one and is not: its own purpose calls it *"the duct-spacing
  dimension, and that is the whole of its scope"* - centre to centre, across
  parallel linear elements. Every other dimension fragment is similarly specific -
  grids and levels, rooms, wall openings, family instances, MEP runs. Measured
  2026-09-18, none of them answers *"dimension from this to that"*.

  **THE REFERENCES ARE THE CALLER'S AND ARE NOT GUESSED.** A face, an edge, a
  centreline and a grid are four different references on the same wall, and which
  one a drawing should dimension to is a drafting decision, not something to
  infer (D-33). Working them out is the composing skill's job; this draws the
  dimension.

  **TWO REFERENCES IS THE MINIMUM AND MORE IS A STRING.** Three or more on one
  line gives the chained dimension a drawing actually carries, which is why the
  input is a list rather than a pair.

  **VERSION 2 TAKES WHAT CAN BE TYPED (2026-10-03).** Version 1 asked for Revit
  `Reference` objects and a `Line`, which no request can carry, so nothing could
  run it - FRAGMENT-ISSUES section 6 and D-72. It now takes, `|` between them:
  `grid A`, `level Level 2`, `plane Box Left`, `line <id>` (a model or detail
  line) and `wall <id> exterior` or `interior` - an id as Revit shows it, or a
  unique id. A face picked with the mouse still cannot be said and is not
  offered. The line the string sits on is two points in millimetres.

  **READ BACK.** The dimension's references are counted and each segment's value
  is read again, so `measured` is what Revit measured, not what was asked.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The view to draw it in, as the Project Browser names it - "Level 1", or
    # "FloorPlan: Level 1" where a floor and a ceiling plan share the name.
    - name: view
      type: View
      source: request
    # What it measures between, `|` between them, two or more: "grid A | grid B",
    # "level Level 1 | level Level 2", "plane Box Left | plane Box Right",
    # "line 123456 | wall 234567 exterior".
    - name: between
      type: string
      source: request
    # Where the dimension string sits: one end, in millimetres - "0,-1000,0".
    - name: lineFrom
      type: XYZ
      source: request
    # ...and the other end - "6000,-1000,0".
    - name: lineTo
      type: XYZ
      source: request
  provides:
    - name: created
      role: result
      type: ElementId
    - name: measured
      # What Revit measured, read back - "6000 mm", or "3000 mm + 3000 mm" for a
      # chained string.
      role: result
      type: string
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and said
      # no. Never a thing it FOUND (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>


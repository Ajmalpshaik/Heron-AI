compatibility-note: >
  `NewDimension(View, Line, ReferenceArray)` on the base item factory is present
  2020 through 2027 - read off the reference assemblies at both ends on
  2026-09-18 - and is reached through `doc.Create`, which inherits it.

  **IT IS NOT `NewLinearDimension`, AND THAT COST A COMPILE HERE.** The
  obvious-sounding name belongs to the FAMILY EDITOR's creation object and is not
  reachable from a project document at all. The same is true of `NewRadialDimension`, `NewDiameterDimension` and
  `NewArcLengthDimension` - see CREATE_RADIAL_DIMENSION, which has to use a
  different call and is only available from Revit 2025. The 2025 dimension subclasses (LinearDimension, RadialDimension,
  ArcLengthDimension) changed what comes BACK, not how it is made, and nothing
  here names a subclass, so one path serves every release.

# ROUTING - repeated in CREATE_DIMENSION and DIMENSION_GRIDS_AND_LEVELS.
#
#   "dimension from this to that"    -> here
#   "dimension the duct spacing"     -> DIMENSION_MEP_RUNS - centrelines of
#                                       parallel MEP runs, and only that
#   "dimension the grids"            -> DIMENSION_GRIDS_AND_LEVELS
#   "dimension the rooms"            -> DIMENSION_ROOMS
#   "dimension the doors in this wall"-> DIMENSION_WALL_OPENINGS
#   "dimension to a radius"          -> CREATE_RADIAL_DIMENSION

utterances:
  - dimension between grid A and grid B
  - dimension from level 1 to level 2
  - dimension between these two
  - put a dimension from here to here
  - dimension these references
  - add a linear dimension
  - dimension across these

id: FRG-VIEW-101
semantic-identity: "dimension between these grids, levels, planes, lines or wall faces, on this view"
kind: action
domain: revit.annotation
capability: CREATE_LINEAR_DIMENSION
# VERSION 3 (2026-10-15, FRAGMENT-ISSUES 5b-482): `between` reaches a FAMILY
# INSTANCE. On a real project (Revit 2020) the modeller asked for a
# builders-work opening - a Generic Model family - to be dimensioned in a
# section from its level and its grid, and by its own width and height. The
# family published only CenterLeftRight, CenterFrontBack and nine weak
# references, and version 2's words - grid, level, plane, line, wall - reach
# none of them, so no tool in the library could draw it. Two words more:
#   family ID WHICH - the instance's own reference: Left, Right, Top, Bottom,
#                     Front, Back, CenterLeftRight, CenterFrontBack,
#                     CenterElevation, or a reference plane's NAME (strong or
#                     weak). One it does not publish is refused with the list
#                     it does publish.
#   face ID SIDE    - the element's flat solid face pointing most toward
#                     left, right, top or bottom OF THE VIEW (near, far:
#                     toward and away from whoever looks). Any element, even a
#                     family with no named reference - read from the geometry
#                     the view shows, with references computed.
# And the same point given twice for lineFrom and lineTo runs the string
# THROUGH that point, square to what it measures; it was refused before, so no
# caller is changed. Every version 2 word reads exactly as it did. The purpose
# below is version 2's, word for word, so the search reads the same text -
# its "a face ... is not offered" means a face picked with the mouse; a face
# named by its side is offered since version 3. DRAFT until version 3 is run
# in Revit: NEEDS-CHECKING Group EF.
#
# VERSION 4 (2026-10-15, FRAGMENT-ISSUES 5b-486): `between` reaches INTO A
# LOADED LINK. On the same real project the openings were Generic Model
# cut-outs in a LINKED model, tagged in the host's builders-work plans, and
# every word above looked only in the host - so none could be named. One word
# more, in front of any other:
#   link LINK WORD ...   LINK is the placed link's id as Revit shows it, its
#                        unique id, or the linked model's name with or without
#                        ".rvt" (in "quotes" when it holds one of these words);
#                        WORD is grid, level, plane, line, wall, family or
#                        face, read exactly as above but inside the link's own
#                        document - "link 6347789 face 6667244 left",
#                        "grid C | link Structure face 6667244 bottom".
# The face is judged in THIS view's directions through the link's placement,
# and the reference found is carried across with Reference.CreateLinkReference.
# A link not loaded, or hidden in the view, is refused naming the links the
# model places; an id not in the link is refused naming where it IS when it is
# anywhere - this model or another loaded link. Every version 3 word reads as
# it did; the purpose is still version 2's, word for word. DRAFT until
# NEEDS-CHECKING Group EH runs it on a new project linking a saved test one.
version: 4
source: OFFICIAL
risk: MODIFY

purpose: >
  Draws one linear dimension along a line, between the references given.

  **THE PLAIN DIMENSION, WHICH THE LIBRARY DID NOT HAVE.** `CREATE_DIMENSION`
  reads as the general one and is not: its own purpose calls it *"the duct-spacing
  dimension, and that is the whole of its scope"* - centre to centre, across
  parallel linear elements. Every other dimension fragment is similarly specific -
  grids and levels, rooms, wall openings, family instances, MEP runs. Measured
  2026-09-18, none of them answers *"dimension from this to that"*.

  **THE REFERENCES ARE THE CALLER'S AND ARE NOT GUESSED.** A face, an edge, a
  centreline and a grid are four different references on the same wall, and which
  one a drawing should dimension to is a drafting decision, not something to
  infer (D-33). Working them out is the composing skill's job; this draws the
  dimension.

  **TWO REFERENCES IS THE MINIMUM AND MORE IS A STRING.** Three or more on one
  line gives the chained dimension a drawing actually carries, which is why the
  input is a list rather than a pair.

  **VERSION 2 TAKES WHAT CAN BE TYPED (2026-10-03).** Version 1 asked for Revit
  `Reference` objects and a `Line`, which no request can carry, so nothing could
  run it - FRAGMENT-ISSUES section 6 and D-72. It now takes, `|` between them:
  `grid A`, `level Level 2`, `plane Box Left`, `line <id>` (a model or detail
  line) and `wall <id> exterior` or `interior` - an id as Revit shows it, or a
  unique id. A face picked with the mouse still cannot be said and is not
  offered. The line the string sits on is two points in millimetres.

  **READ BACK.** The dimension's references are counted and each segment's value
  is read again, so `measured` is what Revit measured, not what was asked.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The view to draw it in, as the Project Browser names it - "Level 1", or
    # "FloorPlan: Level 1" where a floor and a ceiling plan share the name.
    - name: view
      type: View
      source: request
    # What it measures between, `|` between them, two or more: "grid A | grid B",
    # "level Level 1 | level Level 2", "plane Box Left | plane Box Right",
    # "line 123456 | wall 234567 exterior". On a family instance (an id as
    # Revit shows it): "family 345678 Left" - Left, Right, Top, Bottom, Front,
    # Back, CenterLeftRight, CenterFrontBack, CenterElevation or a reference
    # plane's name - and on any element "face 345678 top" - its flat face
    # toward left, right, top or bottom of this view: "grid D | face 345678
    # left", "level Level 1 | face 345678 bottom | face 345678 top".
    # Inside a loaded link, the link first - its id or its model's name - then
    # any of those words, read in the link: "grid C | link 456789 face 345678
    # bottom | link 456789 face 345678 top", "link Structure grid 4".
    - name: between
      type: string
      source: request
    # Where the dimension string sits: one end, in millimetres - "0,-1000,0".
    # The SAME point for both ends runs the string through that point, square
    # to what it measures - a point beside the element is enough.
    - name: lineFrom
      type: XYZ
      source: request
    # ...and the other end - "6000,-1000,0".
    - name: lineTo
      type: XYZ
      source: request
  provides:
    - name: created
      role: result
      type: ElementId
    - name: measured
      # What Revit measured, read back - "6000 mm", or "3000 mm + 3000 mm" for a
      # chained string.
      role: result
      type: string
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and said
      # no. Never a thing it FOUND (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>


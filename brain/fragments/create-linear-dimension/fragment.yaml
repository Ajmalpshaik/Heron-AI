compatibility-note: >
  `NewDimension(View, Line, ReferenceArray)` on the base item factory is present
  2020 through 2027 - read off the reference assemblies at both ends on
  2026-09-18 - and is reached through `doc.Create`, which inherits it.

  **IT IS NOT `NewLinearDimension`, AND THAT COST A COMPILE HERE.** The
  obvious-sounding name belongs to the FAMILY EDITOR's creation object and is not
  reachable from a project document at all. The same is true of `NewRadialDimension`, `NewDiameterDimension` and
  `NewArcLengthDimension` - see CREATE_RADIAL_DIMENSION, which has to use a
  different call and is only available from Revit 2025. The 2025 dimension subclasses (LinearDimension, RadialDimension,
  ArcLengthDimension) changed what comes BACK, not how it is made, and nothing
  here names a subclass, so one path serves every release.

  Version 3's members are the same on every release too, read off the
  reference assemblies with tools/api-surface --members one release at a time
  on 2026-10-15: FamilyInstance.GetReferences, GetReferenceName,
  GetReferenceByName and GetReferenceType, the FamilyInstanceReferenceType
  values Left (0) to NotAReference (11), Options.ComputeReferences and
  Options.View, all present 2020 through 2027. An element is still found by
  matching its Id.ToString(), never by constructing an ElementId - the int
  and long constructors split at 2024 and 2026.

  Version 4's are the same on every release as well, read the same way on
  2026-10-15: Reference.CreateLinkReference(RevitLinkInstance) and
  Reference.LinkedElementId, RevitLinkInstance.GetLinkDocument and
  GetTotalTransform, Options.DetailLevel, all present 2020 through 2027. A
  linked element is found by the same Id.ToString() match, inside the link's
  own document.


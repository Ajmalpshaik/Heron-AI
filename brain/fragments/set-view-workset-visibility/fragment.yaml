compatibility-note: >
  One implementation for every release. `View.SetWorksetVisibility`,
  `WorksetVisibility` and `FilteredWorksetCollector.OfKind` are unchanged 2020
  through 2027. A workset's `Name` is declared on its BASE type, not on
  `Workset` itself - a check that stops at the declared type reports it missing,
  which is a false absence and not a version break.

# ROUTING - repeated in SET_CATEGORY_VISIBILITY, LIST_WORKSETS and
# SET_ELEMENT_WORKSET.
#
#   "turn off this workset in this view"        -> here - a VIEW setting
#   "show only the mechanical workset here"     -> here
#   "hide the architect's workset on this plan"  -> here
#   "turn off the ceilings in this view"        -> SET_CATEGORY_VISIBILITY - a
#                                                  CATEGORY is what a thing is;
#                                                  a workset is who owns it
#   "what worksets are in this model"           -> LIST_WORKSETS - a READ
#   "move these onto the mechanical workset"    -> SET_ELEMENT_WORKSET - that
#                                                  changes the MODEL; this
#                                                  changes one drawing

utterances:
  - turn off this workset in this view
  - show only the mechanical workset here
  - hide the architect workset on this plan
  - set the workset visibility for this view
  - make a view that shows one workset only

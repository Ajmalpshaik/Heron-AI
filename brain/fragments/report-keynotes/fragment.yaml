id: FRG-VIEW-123
semantic-identity: "list the keynote tags and the keynote values the keynote table does not hold, and which keynote file is loaded"
kind: action
domain: revit.annotation
capability: REPORT_KEYNOTES
version: 1
source: OFFICIAL
risk: READ

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# TWO QUESTIONS, ANSWERED TOGETHER: the keynote tags (view, text shown, and
# whether that text is a key or a keynote text in the table), and every Keynote
# value on element types and materials with the ones the table does not hold.
#
# A VALUE THE TABLE DOES NOT HOLD IS THE FINDING - the keynote file was swapped
# or edited, an element still carries a key no longer in it, and the legend has
# no line for it.
#
# THE TABLE IS REVIT'S LOADED COPY (KeynoteTable), not the file on disk.
#
# WHICH KEYNOTE FILE - WIDENED 2026-11-02, asked in the modeller's words
# "which keynote file is this project using". No card answered it for the
# keynote file alone: REPORT_EXTERNAL_REFERENCES (PROVEN) lists the keynote
# table as one row among every link, import and point cloud, with no entry
# count - a look-alike, kept separate; widening its code would put its proof
# out of date. Here: the path as saved, its path type, where it resolves on
# this PC, Revit's status for it, and the entry count. Loading or reloading
# the file is LOAD_KEYNOTE_FILE, a write. The numbering method (By keynote /
# By sheet) is NOT read - no Revit API member reaches it on any release
# 2020-2027 (row 5b-1420).
#
# Changing a keynote value is WRITE_ELEMENT_PARAMETERS on the Keynote
# parameter; this only reads.
#
# READ ONLY - opens no transaction.
purpose: >
  Lists keynote tags with the text each shows, and every keynote value used on
  element types and materials, naming the values the loaded keynote table does
  not hold - and names the keynote file the model uses, its path type, and how
  many entries it loaded.

contract:
  needs:
    - name: doc
      type: Document
    # One view for the tags by its Project Browser name; an EMPTY value reads
    # every view. The values on types and materials are always read for the
    # whole model. A string, because a View need cannot be left out.
    # Where a plan and a ceiling plan share a name, write the kind first:
    # "FloorPlan: Level 1". A name that still answers to two views is refused.
    - name: viewName
      type: string
      source: request
  provides:
    - name: keynotes
      # ONE STRING - a line per tag, then the values the table does not hold -
      # because a list reaches the chat cut to three entries.
      role: result
      type: string
    - name: tagCount
      role: result
      type: int
    - name: missingFromTable
      # Keynote values on types or materials that are not a key in the loaded
      # table, each with up to five of the types carrying it (D-52).
      role: accounting
      type: IList<string>
    - name: tableLoaded
      # False when the model has no keynote table loaded - then nothing could
      # be checked against one, and the findings say so (D-52).
      role: accounting
      type: bool
    - name: keynoteFile
      # The keynote file Keynoting Settings names: the path as saved, its path
      # type, where it resolves on this PC when that differs, and Revit's
      # status for it (Loaded, NotFound). Empty when none is named.
      role: result
      type: string
    - name: tableEntries
      # Entries in the loaded keynote table, counted.
      role: result
      type: int
    - name: findings
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. KeynoteTable.GetKeynoteTable,
  KeyBasedTreeEntryTable.GetKeyBasedTreeEntries, KeyBasedTreeEntry.Key,
  KeynoteEntry.KeynoteText, IndependentTag.TagText and KEYNOTE_PARAM are
  present 2020 through 2027 - read off RevitAPI.xml in the Nice3point
  reference packages for all eight releases on 2026-10-12. The tag's target is
  not read, so the 2022 change to how a tag names its element does not reach
  it. The keynote file (2026-11-02): Element.GetExternalFileReference,
  ExternalFileReference.GetPath / GetAbsolutePath / PathType /
  GetLinkedFileStatus, ModelPathUtils.ConvertModelPathToUserVisiblePath,
  Element.GetExternalResourceReference,
  ExternalResourceTypes.BuiltInExternalResourceTypes.KeynoteTable and
  ExternalResourceReference.InSessionPath - each read with tools/api-surface
  --members on the reference assemblies of 2020 to 2027, present in all eight.

# ROUTING - the same rows are in the fragments named here.
#
#   "check the keynotes"                      -> here
#   "which keynotes are not in the keynote file" -> here
#   "change the keynote on these"             -> WRITE_ELEMENT_PARAMETERS, the
#                                                Keynote parameter
#   "which elements are not tagged"           -> FIND_UNTAGGED_ELEMENTS
#   "which keynote file is this project using" -> here, keynoteFile
#   "reload the keynote file"                 -> LOAD_KEYNOTE_FILE, a write
#   "load the keynote file C:\Standards\Keynotes.txt" -> LOAD_KEYNOTE_FILE
#   "set keynote numbering to by sheet"       -> NOTHING HERE DOES THAT - no
#                                                Revit API member reaches the
#                                                numbering method (row 5b-1420);
#                                                Annotate > Keynoting Settings

utterances:
  - check the keynotes against the keynote file
  - which keynote values are missing from the keynote table
  - list the keynote tags on this sheet view
  - what do the keynotes say
  - check the keynotes
  # ADDED 2026-11-02 with keynoteFile, the modeller's own words.
  - which keynote file is this project using

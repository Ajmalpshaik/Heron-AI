id: FRG-VIEW-123
semantic-identity: "list the keynote tags and the keynote values the keynote table does not hold"
kind: action
domain: revit.annotation
capability: REPORT_KEYNOTES
version: 1
source: OFFICIAL
risk: READ

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# TWO QUESTIONS, ANSWERED TOGETHER: the keynote tags (view, text shown, and
# whether that text is a key or a keynote text in the table), and every Keynote
# value on element types and materials with the ones the table does not hold.
#
# A VALUE THE TABLE DOES NOT HOLD IS THE FINDING - the keynote file was swapped
# or edited, an element still carries a key no longer in it, and the legend has
# no line for it.
#
# THE TABLE IS REVIT'S LOADED COPY (KeynoteTable), not the file on disk.
#
# Changing a keynote value is WRITE_ELEMENT_PARAMETERS on the Keynote
# parameter; this only reads.
#
# READ ONLY - opens no transaction.
purpose: >
  Lists keynote tags with the text each shows, and every keynote value used on
  element types and materials, naming the values the loaded keynote table does
  not hold.

contract:
  needs:
    - name: doc
      type: Document
    # One view for the tags by its Project Browser name; an EMPTY value reads
    # every view. The values on types and materials are always read for the
    # whole model. A string, because a View need cannot be left out.
    # Where a plan and a ceiling plan share a name, write the kind first:
    # "FloorPlan: Level 1". A name that still answers to two views is refused.
    - name: viewName
      type: string
      source: request
  provides:
    - name: keynotes
      # ONE STRING - a line per tag, then the values the table does not hold -
      # because a list reaches the chat cut to three entries.
      role: result
      type: string
    - name: tagCount
      role: result
      type: int
    - name: missingFromTable
      # Keynote values on types or materials that are not a key in the loaded
      # table, each with up to five of the types carrying it (D-52).
      role: accounting
      type: IList<string>
    - name: tableLoaded
      # False when the model has no keynote table loaded - then nothing could
      # be checked against one, and the findings say so (D-52).
      role: accounting
      type: bool
    - name: findings
      type: IList<string>


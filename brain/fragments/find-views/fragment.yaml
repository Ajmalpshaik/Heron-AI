compatibility-note: >
  One implementation for every release. `View`, `View.IsTemplate`, `View.ViewType`
  and the `ViewType` enum members used here are unchanged 2020 to 2027, and no
  units call is made. `viewType` is matched by NAME against the enum rather than
  taking a typed enum value, so a release that adds a member needs no change here
  and an unknown name is reported instead of silently matching nothing.

  Version 2 adds the calls the three merged cards made, PROVEN on Revit 2024:
  `ViewSchedule`, `Viewport.ViewId` and `SheetId`,
  `ScheduleSheetInstance.ScheduleId` and `OwnerViewId`,
  `ViewSheet.GetAllPlacedViews`, `ViewSheet.SheetNumber` and
  `View.ViewTemplateId` - unchanged 2020 to 2027.

  Version 3 adds `Enum.GetNames(typeof(ViewType))` - plain .NET - and no new
  Revit call. The browser words map to members present on every release
  2020 to 2027 (ThreeD, CeilingPlan, EngineeringPlan, DraftingView, Section,
  Elevation, Detail, Schedule).

# ROUTING - repeated in FIND_SHEETS, APPLY_VIEW_TEMPLATE and
# PLACE_VIEW_ON_SHEET.
#
#   "a 3d view for each workset"         -> CREATE_WORKSET_3D_VIEWS. This one
#                                           lists views that exist
#   "which views are not on a sheet"     -> here, placement unplaced, since
#                                           FIND_UNPLACED_VIEWS was merged in
#                                           (version 2)
#   "purge the unplaced views"           -> here first, placement unplaced. It
#                                           reports and deletes nothing
#   "which schedules are there"          -> here, viewType Schedule, since
#                                           FIND_SCHEDULES was merged in
#   "which views have no template"       -> here, withoutTemplate true, since
#                                           FIND_VIEWS_WITHOUT_TEMPLATE was
#                                           merged in
#   "apply the template to these"        -> APPLY_VIEW_TEMPLATE - the fix
#   "list the sheets"                    -> FIND_SHEETS
#   "the drawing list"                   -> FIND_SHEETS for the sheets; here,
#                                           viewType Schedule, for the sheet
#                                           list schedule
#   "what columns has it"                -> REPORT_SCHEDULE_DEFINITION
#   "read me what is in it"              -> READ_SCHEDULE_CONTENTS
#   "which families are unused"          -> FIND_PURGEABLE_ELEMENTS
#   "delete these"                       -> DELETE_ELEMENTS, deliberately and
#                                           with the list in front of you

# VERSION 2 (2026-11-01) - FIND_SCHEDULES, FIND_UNPLACED_VIEWS AND
# FIND_VIEWS_WITHOUT_TEMPLATE WERE MERGED INTO THIS CARD on the owner's
# instruction ("make sure there is no duplicate tools"; "merge means ... all
# area need to be covered"), and are DEPRECATED. The same job - which views
# are in the model, with the ones nobody means counted and set aside. What
# they had and this one lacked is here now: schedules, through viewType
# Schedule, templates and angle-bracketed internal ones counted
# (skippedInternal); placement unplaced or placed, read by viewports AND
# schedule placements AND each sheet's own list, placedCount, byType; a view
# with no template, sheets, schedules and legends left out, the ones on sheets
# first and named with their sheet numbers in findings, the working ones
# counted; reporting and deleting nothing.
#
# THE SAFER RULE IN EACH CONFLICT IS KEPT (the owner: "in every conflict keep
# the safer rule"). Schedules come back ONLY when viewType Schedule is asked:
# never among the drawings by default, so an action that duplicates or
# applies a template cannot reach one. FIND_UNPLACED_VIEWS counted a view on
# a sheet by viewports and schedule placements, FIND_VIEWS_WITHOUT_TEMPLATE by
# each sheet's list; all three are read. The no-template test now also leaves
# out the browser and internal views this card always set aside, which that
# card listed as untemplated working views. A placement it cannot read is
# refused, nothing returned.
#
# NOT CARRIED, AS OPPOSITE: FIND_UNPLACED_VIEWS returned unplaced schedules
# among the views by default - here they come back only with viewType
# Schedule (placement unplaced, viewType Schedule). FIND_VIEWS_WITHOUT_TEMPLATE
# and FIND_UNPLACED_VIEWS returned their lists unsorted; here the answer is in
# this card's name order, views on sheets first with withoutTemplate.
#
# WHERE THEIR OUTPUTS ARE NOW: elements -> elements; FIND_SCHEDULES'
# skippedTemplates, skippedInternal, matchedButExcluded -> the same names;
# FIND_UNPLACED_VIEWS' byType, placedCount -> the same names;
# FIND_VIEWS_WITHOUT_TEMPLATE's onSheets, findings -> the same names. Their
# sentences moved here.


id: FRG-VIEW-028
semantic-identity: "the real views in this model, optionally narrowed by type and by name"
kind: filter
domain: revit.views
capability: FIND_VIEWS
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Answers "which views" for everything that acts on views - applying a template,
  duplicating, placing on a sheet, exporting. It is the filter half of that whole
  family of jobs, which is why it is one fragment rather than a lookup copied into
  each of them (D-45).

  THE TRAP IT EXISTS FOR. Asking Revit for views returns far more than a person
  means by "a view". View templates ARE views. Schedules and sheets ARE views. So
  are the Project Browser and System Browser, which are real View elements nobody
  ever wants back. A plain collector hands all of them over, and a template then
  gets a template applied to it.

  So the excluded ones are COUNTED AND REPORTED rather than silently dropped.
  Asking for "Level 3" and getting nothing must be distinguishable from asking for
  "Level 3" and matching only a template of that name - the first means the view
  does not exist, the second means it does and this fragment refused it. A bare
  zero cannot tell those apart, and the difference changes what the user does next.

contract:
  needs:
    - name: doc
      type: Document
    - name: viewType
      type: string
      source: request
    - name: nameContains
      type: string
      source: request
  provides:
    - name: elements
      type: IList<Element>
    - name: skippedTemplates
      # What it passed over. The evidence it looked, never a thing it
      # FOUND - so it must not count toward "did this come back empty"
      # (D-52).
      role: accounting
      type: int
    - name: skippedNonDrawing
      # What it passed over. The evidence it looked, never a thing it
      # FOUND - so it must not count toward "did this come back empty"
      # (D-52).
      role: accounting
      type: int
    - name: matchedButExcluded
      type: int


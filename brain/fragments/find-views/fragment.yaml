tests: tests/

compatibility-note: >
  One implementation for every release. `View`, `View.IsTemplate`, `View.ViewType`
  and the `ViewType` enum members used here are unchanged 2020 to 2027, and no
  units call is made. `viewType` is matched by NAME against the enum rather than
  taking a typed enum value, so a release that adds a member needs no change here
  and an unknown name is reported instead of silently matching nothing.
#   "a 3d view for each workset"         -> CREATE_WORKSET_3D_VIEWS. This one
#                                           lists views that exist
#   "which views are not on a sheet"     -> FIND_UNPLACED_VIEWS. This one
#                                           narrows by type and name

utterances:
  - which views are in this model
  - list the floor plans
  - find the sections
  - show me the 3d views
  - all the views with level in the name
  - what plans do we have

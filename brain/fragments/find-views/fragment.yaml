id: FRG-VIEW-028
semantic-identity: "the real views or schedules in this model, narrowed by type, by name, by whether they are on a sheet or have a template"
kind: filter
domain: revit.views
capability: FIND_VIEWS
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Answers "which views" for everything that acts on views - applying a template,
  duplicating, placing on a sheet, exporting. It is the filter half of that whole
  family of jobs, which is why it is one fragment rather than a lookup copied into
  each of them (D-45).

  THE TRAP IT EXISTS FOR. Asking Revit for views returns far more than a person
  means by "a view". View templates ARE views. Schedules and sheets ARE views. So
  are the Project Browser and System Browser, which are real View elements nobody
  ever wants back. A plain collector hands all of them over, and a template then
  gets a template applied to it.

  So the excluded ones are COUNTED AND REPORTED rather than silently dropped.
  Asking for "Level 3" and getting nothing must be distinguishable from asking for
  "Level 3" and matching only a template of that name - the first means the view
  does not exist, the second means it does and this fragment refused it. A bare
  zero cannot tell those apart, and the difference changes what the user does next.

  **VERSION 2 ALSO FINDS SCHEDULES, UNPLACED VIEWS AND VIEWS WITH NO TEMPLATE**
  (FIND_SCHEDULES, FIND_UNPLACED_VIEWS and FIND_VIEWS_WITHOUT_TEMPLATE merged
  in). viewType Schedule returns the real schedules - only when asked, never
  by default - with Revit's internal ones counted in skippedInternal.
  placement unplaced or placed narrows by whether a view is on a sheet, read
  through viewports AND schedule placements. withoutTemplate keeps the views
  no template holds, the ones on sheets first with their sheet numbers.
  byType counts the answer per view type.

contract:
  needs:
    - name: doc
      type: Document
    - name: viewType
      type: string
      source: request
    - name: nameContains
      type: string
      source: request
    # VERSION 2, from FIND_UNPLACED_VIEWS. "unplaced" keeps the views on no
    # sheet, "placed" the ones on a sheet; left out ("any"), both. On a sheet
    # means a viewport, a schedule placement or a sheet's placed-view list
    # shows it - a schedule is not placed through a viewport. Anything else is
    # refused, nothing returned.
    - name: placement
      type: string
      source: request
      optional: true
      absent: any
    # VERSION 2, from FIND_VIEWS_WITHOUT_TEMPLATE. true keeps only the views
    # with no view template - sheets, schedules and legends left out, none
    # takes one - the views on sheets first. Absent binds false (row 5b-227).
    - name: withoutTemplate
      type: bool
      source: request
      optional: true
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: skippedTemplates
      # What it passed over. The evidence it looked, never a thing it
      # FOUND - so it must not count toward "did this come back empty"
      # (D-52).
      role: accounting
      type: int
    - name: skippedNonDrawing
      # What it passed over. The evidence it looked, never a thing it
      # FOUND - so it must not count toward "did this come back empty"
      # (D-52).
      role: accounting
      type: int
    - name: matchedButExcluded
      # Views that matched the name but are templates or non-drawing views -
      # COUNTED AND REPORTED RATHER THAN SILENTLY DROPPED. Deliberately not in
      # the answer (D-52). Version 2: and, with viewType Schedule, Revit's
      # internal schedules.
      role: accounting
      type: int
    - name: skippedInternal
      # VERSION 2, from FIND_SCHEDULES. With viewType Schedule, Revit's own
      # internal schedules passed over - named in angle brackets, a revision
      # schedule the common one. Recognised by NAME, as Revit exposes no
      # property that separates them, so the count is reported. Evidence it
      # looked, not a match (D-52).
      role: accounting
      type: int
    - name: byType
      # VERSION 2, from FIND_UNPLACED_VIEWS. How many of the answer are of each
      # view type. A breakdown of `elements`, never more of them (D-52).
      role: accounting
      type: IDictionary<string, int>
    - name: placedCount
      # VERSION 2, from FIND_UNPLACED_VIEWS. How many views ARE on a sheet, by
      # all three routes. The evidence it looked (D-52).
      role: accounting
      type: int
    - name: onSheets
      # VERSION 2, from FIND_VIEWS_WITHOUT_TEMPLATE. The answer's views that are
      # on a sheet - a part of `elements`, never more of them (D-52).
      role: accounting
      type: IList<ElementId>
    - name: findings
      # VERSION 2. With withoutTemplate, each view on a sheet named with its
      # sheet number, then a count of the working views on no sheet; with
      # placement unplaced, the placed count beside it; a placement it cannot
      # read, the refusal.
      role: accounting
      type: IList<string>


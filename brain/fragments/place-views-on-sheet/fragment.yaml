# DEPRECATED 2026-11-01 - MERGED INTO PLACE_VIEW_ON_SHEET (place-view-on-sheet), on the owner's instruction
# in conversation: "now merge the other duplicates also". Constitution
# Article 1: kept, never deleted, so its record and its proof stay readable
# and it can be brought back. Nothing offers it now - retrieval leaves
# DEPRECATED out, and its sentences claim nothing in the identity table
# (heron_search RETIRED_FRAGMENTS). Its sentences moved to PLACE_VIEW_ON_SHEET. The proof
# below is the record of what this card's code did, not a claim about today.
deprecated:
  date: '2026-11-01'
  by: Ajmal PS
  superseded-by: PLACE_VIEW_ON_SHEET
  why: >
    The same job: views onto one sheet as viewports, each asked first, a view
    already on another sheet refused by id and never moved off it.
    PLACE_VIEW_ON_SHEET also swaps one view for another in the same place. Its
    version 3 took what this card had and it lacked: a grid of only the views
    that will place, distinctPositions read back to the millimetre, a
    placeholder sheet refused by name in sheetProblem, and an int count of what
    was placed (placedCount). One rule was opposite and the safer was kept:
    several views go on the grid, and a point given is used for one view only.
    NOT carried: this card's elements input, so FIND_UNPLACED_VIEWS no longer
    chains straight in - there the views are named, because the add-in binds no
    absent view list.

purpose: >
  Places every view handed in onto one sheet, arranged on a grid across the
  sheet, and reports how many landed in DISTINCT positions.

  THAT LAST NUMBER IS THE WHOLE FRAGMENT, and it exists because of a measured
  failure. A version of this job computed the sheet centre inside the per-view
  loop with no offset, so every viewport was created at the same point. Three
  views produced three viewports stacked on one spot, and it reported "placed
  3". The count was true. The sheet was unusable, and nothing in the answer
  said so.

  A count of placements cannot distinguish a populated sheet from a pile. So
  the position of each viewport is read back after creation and the DISTINCT
  ones are counted. When placed is 3 and distinctPositions is 1, the answer
  says out loud what the drawing would otherwise have to.

  A NORMAL VIEW LIVES ON ONE SHEET ONLY. Revit refuses a view already placed
  elsewhere, and this fragment asks before it acts rather than catching the
  refusal - an already-placed view is skipped by id and never moved off the
  sheet it is on. Schedules and legends do not share that limit and are not
  this fragment's job.

  A PLACEHOLDER SHEET IS REFUSED BY NAME. FIND_SHEETS hands placeholders back
  deliberately rather than filtering them, on the promise that the action would
  decide visibly. This is that promise being kept.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16), so a
  sheet full of views is one undo entry.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: sheetNumber
      type: string
      source: request
  provides:
    - name: placed
      role: result
      type: int
    - name: distinctPositions
      # How many viewports landed in DIFFERENT places, read back after
      # creation. WHEN PLACED IS 3 AND DISTINCTPOSITIONS IS 1 THE ANSWER SAYS
      # OUT LOUD WHAT THE DRAWING WOULD OTHERWISE HAVE TO - a count of
      # placements cannot tell a populated sheet from a pile.
      role: result
      type: int
    - name: notPlaced
      # Views no viewport came back for. The evidence it looked and could not,
      # never a thing it did (D-52).
      role: accounting
      type: IList<ElementId>
    - name: sheetProblem
      # What was wrong with the sheet asked for. A refusal, never a view it
      # placed (D-52).
      role: accounting
      type: string


# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# The railing type's Type Properties for its rails: top rail type and
# height, main handrail type, height and side (left, right, both, none).
# duplicateAs copies the type first and changes the copy - a type change
# reaches every railing of it, and the report counts them. Rail types are
# found by name; a name not there refuses, naming those that are. The
# handrail's height lives on the HANDRAIL type, so setting it changes every
# railing type sharing that handrail type - the report counts them. Balusters
# and posts are left alone: their pattern editor has no settable equivalent
# worth guessing at.
#
# EDIT_RAILING changes a placed railing's path, host, type or side;
# CREATE_RAILING places railings; DUPLICATE_TYPE copies any type by name.
#
# READ BACK: each value asked is read again from the type.
#
# VERSION 2, 2026-11-11 (row 5b-1415). Version 1 read the primary handrail's
# side and height into its report whether or not a handrail was asked about,
# and Revit throws "The rail has no primary hand rail" on the height for a
# type whose Handrail 1 is None - how most railing types ship - so every such
# type was refused (Revit 2020 and 2024, four types, 2026-11-02). Version 2
# looks the type's handrail up first: with none the report reads "handrail
# none" and neither is read; with one they are read as before, each on its
# own, and a read Revit still refuses is said in the report for that one
# alone, so a height Revit will not give leaves the side read. Asking for a
# handrail side or height on a type with no handrail is still Revit's to
# refuse. COMPILED ON EVERY RELEASE, NOT RUN IN ANY REVIT (NEEDS-CHECKING
# Group DR, DR6a to DR6c).
#
# VERSION 3, 2026-11-13 (row 5b-1633). Version 2's one result was
# `railingType`, a RailingType object no runner can read as found or not
# found, so DR6a's run - right in every word, Revit 2024 - was POSITIVE
# UNREADABLE in batch-prove and could not be accepted. `changedTypeId` is
# added as the result: the id of the type changed, the copy or the type
# named, ONLY when every value asked read back as asked - InvalidElementId
# when refused or NOT AS ASKED. The shape SET_TEXT_TYPE and
# SET_DIMENSION_TYPE (both carry it) already use. What the card does to the
# model is unchanged. COMPILED, NOT RUN IN ANY REVIT (NEEDS-CHECKING Group NX).
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Sets up a railing type - its top rail type and height, its handrail type,
  height and side - on the type itself or on a copy made first.

contract:
  needs:
    - name: doc
      type: Document
    - name: railingTypeName
      type: string
      source: request
    # A new type name: the type is copied and the copy changed; EMPTY changes it.
    - name: duplicateAs
      type: string
      source: request
    # A top rail type by name; an EMPTY value keeps it.
    - name: topRailTypeName
      type: string
      source: request
    # 0 keeps the height.
    - name: topRailHeightMm
      type: double
      source: request
    # A handrail type by name; an EMPTY value keeps it.
    - name: handrailTypeName
      type: string
      source: request
    # 0 keeps the height.
    - name: handrailHeightMm
      type: double
      source: request
    # "left", "right", "both" or "none"; an EMPTY value keeps it.
    - name: handrailSide
      type: string
      source: request
  provides:
    - name: railingType
      # The type changed, for a later step. An object, so a runner cannot read
      # it - `changedTypeId` is what it reads (version 3).
      role: result
      type: RailingType
    - name: changedTypeId
      # The type changed - the copy, or the type named - when every value
      # asked read back as asked. Invalid when refused or NOT AS ASKED
      # (version 3, row 5b-1633).
      role: result
      type: ElementId
    - name: report
      # ONE STRING: the type as it now reads, and how many railings use it (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>


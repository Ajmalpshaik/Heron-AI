# D-30: the negative case is what catches "read something and called it the answer".

positive:
  - given: 'railing type "Handrail - Rectangular", duplicateAs "TRG Guard 1100", topRailHeightMm 1100, handrailSide both'
    expect: >
      a new type "TRG Guard 1100" with its top rail at 1100 mm and the
      handrail on both sides, read back as asked; the original unchanged; 0
      railings of the new type

  # VERSION 2, added 2026-11-11 (row 5b-1415). NEITHER HAS BEEN RUN. The first
  # FAILS on version 1, which answered "Revit refused - The rail has no primary
  # hand rail" for it on Revit 2020 and 2024.
  - given: >
      a railing type whose Handrail 1 Type is None - "900mm Pipe" in Revit
      2020's rac_advanced_sample_project, "Handrail - Pipe" in Revit 2024's
      Snowdon Towers Sample Architectural - duplicateAs "Heron Guard",
      topRailHeightMm 1000, nothing asked of the handrail
    expect: >
      a new type "Heron Guard" with its top rail at 1000 mm; the report reads
      "handrail none, read back as asked"; the original unchanged
  - given: a railing type that HAS a primary handrail, the same values
    expect: >
      the report names the handrail, its side and its height in mm, as version
      1 did - the read the repair must not have lost

  # VERSION 3, added 2026-11-13 (row 5b-1633). NOT RUN. Version 2 did this
  # run right and batch-prove still said POSITIVE UNREADABLE, because its one
  # result was a RailingType object.
  - given: >
      the second positive again - "Handrail - Pipe" in the scratch copy of
      Snowdon Towers Sample Architectural (Revit 2024), duplicateAs "Heron
      Guard", topRailHeightMm 1000 - in batch-prove with NO `expect:` line
    expect: >
      changedTypeId "1 item(s) [id N]", N the id of the new "Heron Guard";
      the verdict is judged on it and is NOT "POSITIVE UNREADABLE"

negative:
  - given: 'railing type "No Such Railing", topRailHeightMm 1100'
    expect: >
      refused, naming the railing types there are; nothing changed;
      changedTypeId "(null)" - version 3's result is empty when refused

second_route:
  - Revit's Type Properties of the new type - Top Rail and Handrail 1

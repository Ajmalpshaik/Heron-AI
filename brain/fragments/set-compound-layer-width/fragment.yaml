tests: tests/

compatibility-note: >
  Version 2 adds `CompoundStructure.GetMaterialId` / `SetMaterialId`,
  `GetLayerFunction` / `SetLayerFunction`, `IsValid(Document, out errors, out
  pairs)`, `GetFirstCoreLayerIndex` / `GetLastCoreLayerIndex` and the eight
  `MaterialFunctionAssignment` members - read off RevitAPI.xml for 2020 and 2027
  on 2026-10-13, the same in both. `SetMaterialId`'s own remark is that the id
  is NOT checked to be a material, so the name is found here and refused here.
  `CompoundStructureError`'s members are read by NAME, never written in code, so
  one added or dropped in a release cannot stop the file compiling.

  `HostObjAttributes.GetCompoundStructure`, `HostObjAttributes.SetCompoundStructure`,
  `CompoundStructure.GetLayerWidth`, `CompoundStructure.SetLayerWidth` and
  `CompoundStructure.LayerCount` are present 2020 through 2027 - read off the
  reference assemblies at both ends on 2026-09-18. Widths are internal FEET
  inside Revit; 304.8 appears twice here and only at the edges, once in and once
  out (D-20).

# ROUTING - repeated in REPORT_COMPOUND_STRUCTURE and DUPLICATE_TYPE.
#
#   "set the material of a layer in a wall type" -> here (version 2)
#   "paint this face of the wall"   -> PAINT_FACES - one face of one element,
#                                      which is not the type
#   "swap this material for that one everywhere" -> REPLACE_MATERIAL - every
#                                      layer and parameter holding one material
#   "make a new material"           -> CREATE_MATERIAL - this only uses one
#
#   "make the insulation thicker"   -> SET_MEP_INSULATION. Said with no
#                                      subject a modeller means the pipe or
#                                      duct (row 134); the wall layer is
#                                      "change the insulation layer in this
#                                      wall type", here, with the index that
#                                      one gives you
#   "what is this wall made of"     -> REPORT_COMPOUND_STRUCTURE - and it is
#                                      where the layer INDEX comes from
#   "just for this wall"            -> DUPLICATE_TYPE first. There is no such
#                                      thing as a per-instance build-up
#   "what is in this curtain wall"  -> REPORT_CURTAIN_ELEMENTS - a curtain wall
#                                      has no layers at all

utterances:
  - make this layer thicker
  - change the insulation layer in this wall type
  - set the wall layer width
  - modify the thickness of this build up
  # Version 2 - the two sentences that found nothing on 2026-10-13.
  - set the material of a layer in a wall type
  - assign a material to a floor type or wall type
  - change the function of this wall layer

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  `HostObjAttributes.GetCompoundStructure`, `HostObjAttributes.SetCompoundStructure`,
  `CompoundStructure.GetLayerWidth`, `CompoundStructure.SetLayerWidth` and
  `CompoundStructure.LayerCount` are present 2020 through 2027 - read off the
  reference assemblies at both ends on 2026-09-18. Widths are internal FEET
  inside Revit; 304.8 appears twice here and only at the edges, once in and once
  out (D-20).

# ROUTING - repeated in REPORT_COMPOUND_STRUCTURE and DUPLICATE_TYPE.
#
#   "make the insulation thicker"   -> here, with the index that one gives you
#   "what is this wall made of"     -> REPORT_COMPOUND_STRUCTURE - and it is
#                                      where the layer INDEX comes from
#   "just for this wall"            -> DUPLICATE_TYPE first. There is no such
#                                      thing as a per-instance build-up
#   "what is in this curtain wall"  -> REPORT_CURTAIN_ELEMENTS - a curtain wall
#                                      has no layers at all

utterances:
  - make this layer thicker
  - change the insulation layer in this wall type
  - set the wall layer width
  - modify the thickness of this build up

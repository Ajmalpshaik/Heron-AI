tests: tests/

compatibility-note: >
  One implementation for every release. DuctLining.Create(Document, ElementId,
  ElementId, double), DuctLiningType, InsulationLiningBase.GetLiningIds,
  HostElementId, Thickness (get and set) and IsValidThickness,
  Element.GetTypeId and ChangeTypeId, ElementType.FamilyName,
  Document.Delete(ICollection<ElementId>), Element.GetDependentElements,
  SubTransaction's Start, Commit and RollBack, and ElementId(BuiltInCategory)
  are present and unchanged 2020 through 2027 - read with tools/api-surface
  --members on 2026-11-01. Millimetres to feet is arithmetic, not UnitUtils
  (D-20); categories are compared as ElementIds built from the
  BuiltInCategory, and ids are carried as ElementId, never read as numbers.

# ROUTING (2026-11-01).
#
#   "add 25 mm lining to these ducts"      -> here
#   "line this supply duct and its
#    fittings"                             -> here
#   "remove the lining from this duct"     -> here, at a thickness of 0 -
#                                             REMOVE_MEP_INSULATION reached
#                                             it before this card existed,
#                                             and takes insulation, never
#                                             lining (Group JX, row 5b-1358)
#   "change the lining thickness to 50"    -> here
#   "insulate these" / "change the
#    insulation thickness"                 -> SET_MEP_INSULATION - the
#                                             outside layer, not the lining
#   "remove the insulation from these
#    ducts"                                -> REMOVE_MEP_INSULATION
#   "show me what is already insulated"    -> SELECT_BY_INSULATION - with
#                                             countLiningAsInsulated it
#                                             counts lining as well; run it
#                                             first to see what is lined
#   "check the clearance with the
#    insulation on"                        -> CHECK_MINIMUM_CLEARANCE -
#                                             lining sits inside the duct
#                                             and is not counted there

utterances:
  - add 25 mm lining to these ducts
  - line this supply duct and its fittings
  - remove the lining from this duct
  - change the lining thickness to 50

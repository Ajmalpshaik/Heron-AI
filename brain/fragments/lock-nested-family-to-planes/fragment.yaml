id: FRG-GEO-049
semantic-identity: "align and lock a nested family's own reference planes to the planes of the family it sits in"
kind: action
domain: revit.families
capability: LOCK_NESTED_FAMILY_TO_PLANES
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  ALIGNS AND LOCKS a nested family to the planes of the family it sits in - the
  padlock after Align - so it follows the planes a labelled dimension moves
  instead of staying where it was dropped.

  **ITS SIDES ARE ITS OWN PLANES' IS REFERENCE** - Left, Right, Front, Back,
  Top, Bottom and the three centres - which are the only planes a nested
  component shows to the family around it. A side it does not have is refused with the
  sides it does; SET_FAMILY_PLANE_REFERENCE, run in the nested family, gives a
  plane one.

  **A SIDE IS LOCKED ONLY TO A PLANE IT ALREADY LIES ON** - Revit's own rule
  for the alignment call. A side turned the other way is refused before
  anything is locked; Revit refuses the rest by its own words.

  **THE LOCKS ARE PAIRS**, nested side = this family's plane or level,
  semicolons between. The nested component is named by its id, or SELECTED
  and called `selected`.

  **AN ARRAY'S COPY TOO** (version 2, 2026-10-07): every array member is a
  model group, and ARRAY_FAMILY_FORMS gives back the groups' ids; a group
  holding exactly one nested family is locked through it. Measured on a
  scratch family: the last copy of a row spread to its last member, its Top
  locked to a plane, re-spaced the row when the plane moved; the second copy
  of a row stepped member by member was refused by Revit. Proved again
  2026-10-07 on scratch SpringProof, signed by Ajmal PS.

  **ALL OR NOTHING, READ BACK**: a lock never moves what it locks, so the
  nested family's extent is read before and after, and any move fails the
  call.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: uidoc
      type: UIDocument
    # The nested family, by the id PLACE_NESTED_FAMILY gave back, an array
    # copy's id from ARRAY_FAMILY_FORMS, or `selected`.
    - name: instance
      type: string
      source: request
    # Nested side = this family's plane or level, SEMICOLONS between -
    # "Center (Left/Right)=Center (Left/Right); Bottom=Ref. Level".
    - name: locks
      type: IDictionary<string, string>
      source: request
  provides:
    - name: locked
      # Each side locked, to which plane, in which view.
      role: result
      type: IList<string>
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing was locked, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


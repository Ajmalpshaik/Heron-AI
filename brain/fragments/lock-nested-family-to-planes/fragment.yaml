compatibility-note: >
  `FamilyInstance.GetReferences(FamilyInstanceReferenceType)` - whose remark
  says a plane that is Not a Reference makes no reference - `GetTransform`,
  `FamilyItemFactory.NewAlignment` and `Dimension.IsLocked` read the same 2020
  through 2027 (the RevitAPI reference assemblies and their XML remarks, read
  2026-10-01). Version 3's `Element.OwnerViewId`, `Element.get_BoundingBox(View)`,
  `ElementId.InvalidElementId`, `ElementId.Equals` and `View.ViewDirection` are
  on every release 2020 to 2027 (`tools/api-surface --members`, 2026-11-11).
  Version 4's `Element.Category`, `Category.Id`, `ElementId(BuiltInCategory)`,
  `BuiltInCategory.OST_DetailComponents`, `FamilyInstance.Symbol`,
  `FamilyInstance.Host`, `Element.LevelId`, `Family.FamilyPlacementType`,
  `FamilyPlacementType.ViewBased` and `View.GenLevel` - checked the same way,
  2026-11-11.

# ROUTING - see SET_FAMILY_SETTINGS for the whole family-building table.
#
#   "lock the motor's centre to the centre planes" -> here
#   "lock the nested family to the reference planes" -> here
#   "lock the last copy of the array to the top plane" -> here, version 2
#   "lock the flow arrows to the arrow planes"    -> here, version 3, a detail item
#                                                    (version 4: one with no view of its own)
#   "lock this extrusion to the planes"           -> LOCK_FORM_TO_PLANES, a form

utterances:
  - lock the motor's centre to the centre planes
  - lock the nested family to the reference planes
  - align and lock this nested component to the planes
  - make the nested handle follow the front plane
  - lock the last copy of the array to the top plane

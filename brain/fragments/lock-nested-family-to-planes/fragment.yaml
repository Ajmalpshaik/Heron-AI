# VERSION 3 (2026-11-11) - A DETAIL ITEM TOO, and back to DRAFT. Version 2 was
# PROVEN on 2026-10-07 (the proof block then below, kept as the record of what it
# proved); its C# moved, so it was DRAFT again at the time until NEEDS-CHECKING
# Group NB is run (D-30, D-117). On 2026-11-11 (Revit 2020) four nested
# `Diffuser Flow Arrow_DRAFT` detail items in a square diffuser family refused
# every lock with "The nested family has no extent to read back": Revit gives a
# view-based instance no box outside a view. FRAGMENT-ISSUES row 5b-1492. A
# model family takes exactly the path it took before.
#
# VERSION 4 (2026-11-11) - A DETAIL ITEM WITH NO OWNER VIEW. Group NB's first
# run (NB1, Revit 2020, scratch family) threw the same "no extent to read back":
# version 3 knew a detail item only by its owner view, and a detail item placed
# by PLACE_FAMILY_INSTANCES - on a level's plane, the only way Heron places one
# in a family - has none. Now known by its category or View Based placement too,
# and locked in the plan of its level. Still DRAFT at the time. Row 5b-1494.

purpose: >
  ALIGNS AND LOCKS a nested family to the planes of the family it sits in - the
  padlock after Align - so it follows the planes a labelled dimension moves
  instead of staying where it was dropped.

  **ITS SIDES ARE ITS OWN PLANES' IS REFERENCE** - Left, Right, Front, Back,
  Top, Bottom and the three centres - which are the only planes a nested
  component shows to the family around it. A side it does not have is refused with the
  sides it does; SET_FAMILY_PLANE_REFERENCE, run in the nested family, gives a
  plane one.

  **A SIDE IS LOCKED ONLY TO A PLANE IT ALREADY LIES ON** - Revit's own rule
  for the alignment call. A side turned the other way is refused before
  anything is locked; Revit refuses the rest by its own words.

  **THE LOCKS ARE PAIRS**, nested side = this family's plane or level,
  semicolons between. The nested component is named by its id, or SELECTED
  and called `selected`.

  **AN ARRAY'S COPY TOO** (version 2, 2026-10-07): every array member is a
  model group, and ARRAY_FAMILY_FORMS gives back the groups' ids; a group
  holding exactly one nested family is locked through it. Measured on a
  scratch family: the last copy of a row spread to its last member, its Top
  locked to a plane, re-spaced the row when the plane moved; the second copy
  of a row stepped member by member was refused by Revit. Proved again
  2026-10-07 on scratch SpringProof, signed by Ajmal PS.

  **A DETAIL ITEM TOO** (version 3, 2026-11-11): a view-based nested family -
  a detail item placed in the family's plan, like a diffuser's flow arrows - is
  locked in the view it is drawn in, as Align is used on it by hand, and only to
  a plane seen edge-on there: a level, or any plane lying flat in that view, is
  refused before anything is locked.

  **ONE WITH NO VIEW OF ITS OWN TOO** (version 4, 2026-11-11): a detail item
  placed by PLACE_FAMILY_INSTANCES sits on a level's plane and belongs to no
  view, so it is known by its category, Detail Items, or its family's View
  Based placement, and locked in the floor plan of the level it sits on - any
  floor plan when none is of that level - or, standing on a vertical plane, in
  an elevation looking at it: where Align is used on it by hand.

  **ALL OR NOTHING, READ BACK**: a lock never moves what it locks, so the
  nested family's extent is read before and after, and any move fails the
  call. A detail item has no extent outside its view, so it is read back by its
  insertion point and, where Revit gives one, its box in its own view.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: uidoc
      type: UIDocument
    # The nested family, by the instanceId PLACE_FAMILY_INSTANCES gave back
    # (PLACE_NESTED_FAMILY until 2026-11-01), an array
    # copy's id from ARRAY_FAMILY_FORMS, or `selected`.
    - name: instance
      type: string
      source: request
    # Nested side = this family's plane or level, SEMICOLONS between -
    # "Center (Left/Right)=Center (Left/Right); Bottom=Ref. Level".
    - name: locks
      type: IDictionary<string, string>
      source: request
  provides:
    - name: locked
      # Each side locked, to which plane, in which view.
      role: result
      type: IList<string>
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing was locked, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


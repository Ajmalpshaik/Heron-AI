positive:
  - given: >
      the nested box from place-family-instances' first version 5 case
      (place-nested-family's until 2026-11-01), its own centre
      planes set to Center (Left/Right) and Center (Front/Back); instance =
      its id, locks "Center (Left/Right)=Center (Left/Right); Center
      (Front/Back)=Center (Front/Back)"
    expect: >
      two sides locked, in the floor plan; padlocks shown closed when the
      nested box is selected; its extent unchanged

  - given: a host plane "Box Left" moved by a labelled dimension after the box's Center (Left/Right) is locked to a plane on it, then FLEX_FAMILY
    expect: the nested box follows the plane it is locked to

  - given: >
      version 2, AN ARRAY'S COPY. The nested family arrayed up by
      ARRAY_FAMILY_FORMS with step "Z 60 last"; instance = the LAST id in its
      members (a group), locks "Top=Top Turn Start"
    expect: >
      the nested family inside the group found and its Top locked, in an
      elevation; extent unchanged; a flex of the planes re-spaced the row.
      Ran 2026-10-07, scratch SpringMainProbe, kept there

  - given: >
      version 3, A DETAIL ITEM. A 600 mm detail item (Detail Item template,
      tail at its origin pointing +X, its Center (Left/Right) and Center
      (Front/Back) planes Is Reference) placed in the host's "Ref. Level" plan,
      turned 90 degrees and moved onto host planes "Arrow Front" and
      "Center (Left/Right)"; locks "Center (Front/Back)=Center (Left/Right)"
    expect: >
      one side locked, "(in Ref. Level)"; its insertion point unmoved; Group
      NB, NB1

  - given: >
      version 3, the same detail item kept locked, then the planes it is
      locked to moved by their labelled dimension (FLEX_FAMILY)
    expect: the detail item follows the plane; Group NB, NB3

  - given: >
      version 4, A DETAIL ITEM WITH NO OWNER VIEW. The same detail item placed
      by PLACE_FAMILY_INSTANCES with level "Ref. Level" (its record reads
      "nested on "Ref. Level"" - on the level's plane, not in a plan), turned
      90 degrees with ROTATE_ELEMENTS and moved as above; locks "Center
      (Front/Back)=Center (Left/Right)". Version 3 threw "no extent to read
      back" here (2026-11-11, Revit 2020, NB1)
    expect: >
      a finding that it belongs to no view and is locked in "Ref. Level"; one
      side locked, "(in Ref. Level)"; its insertion point unmoved; NOT "no
      extent to read back"; Group NB, NB1

negative:
  - given: locks "Left=Center (Left/Right)" where the nested family has no plane that is Left
    expect: refused, naming the sides it does show, and nothing locked

  - given: locks "Center (Left/Right)=Center (Front/Back)"
    expect: refused - they face different ways - and nothing locked

  - given: a project in front
    expect: notAFamily true and nothing locked

  - given: instance = the array itself (its arrayId), not a copy
    expect: refused as not a nested family, naming ARRAY_FAMILY_FORMS' copies, and nothing locked

  - given: >
      version 3, the detail item above, locks "Center (Front/Back)=Ref. Level"
      - a level, which lies flat in the plan the detail item is drawn in
    expect: >
      refused before anything is locked - the side faces left-right, the level
      up-down - and NOT "no extent to read back"; Group NB, NB1's negative

  - given: >
      version 3, the detail item above, locks "Center (Front/Back)=Arrow Back"
      - a plane it does not lie on
    expect: >
      Revit's own refusal named, "move the nested family onto the plane
      first", the call rolled back and nothing locked; Group NB, NB2

second_route:
  - >
      Select the nested family and the plane in the Family Editor: the
      padlock on the alignment reads closed; FLEX_FAMILY moves both together

positive:
  - given: >
      the nested box from place-nested-family's first case, its own centre
      planes set to Center (Left/Right) and Center (Front/Back); instance =
      its id, locks "Center (Left/Right)=Center (Left/Right); Center
      (Front/Back)=Center (Front/Back)"
    expect: >
      two sides locked, in the floor plan; padlocks shown closed when the
      nested box is selected; its extent unchanged

  - given: a host plane "Box Left" moved by a labelled dimension after the box's Center (Left/Right) is locked to a plane on it, then FLEX_FAMILY
    expect: the nested box follows the plane it is locked to

  - given: >
      version 2, AN ARRAY'S COPY. The nested family arrayed up by
      ARRAY_FAMILY_FORMS with step "Z 60 last"; instance = the LAST id in its
      members (a group), locks "Top=Top Turn Start"
    expect: >
      the nested family inside the group found and its Top locked, in an
      elevation; extent unchanged; a flex of the planes re-spaced the row.
      Ran 2026-10-07, scratch SpringMainProbe, kept there

negative:
  - given: locks "Left=Center (Left/Right)" where the nested family has no plane that is Left
    expect: refused, naming the sides it does show, and nothing locked

  - given: locks "Center (Left/Right)=Center (Front/Back)"
    expect: refused - they face different ways - and nothing locked

  - given: a project in front
    expect: notAFamily true and nothing locked

  - given: instance = the array itself (its arrayId), not a copy
    expect: refused as not a nested family, naming ARRAY_FAMILY_FORMS' copies, and nothing locked

second_route:
  - >
      Select the nested family and the plane in the Family Editor: the
      padlock on the alignment reads closed; FLEX_FAMILY moves both together

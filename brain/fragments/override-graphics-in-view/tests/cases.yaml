# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: a floor plan, 20 walls, and a halftone override
    expect: >
      overridden = 20, `skipped` EMPTY, and THE VIEW LOOKS DIFFERENT. Checked by
      eye, not only by the count - the count is what a broken call returns too

  - given: the same view and the settings the grayout actually uses
    expect: >
      the architecture recedes and the services stay solid. This is the whole
      job; a number is not a proof that it looks right

  - given: INSULATED ducts made red in a plan that shows their insulation
    expect: >
      the insulation red with its ducts, and `wrapsFollowed` equal to the
      wraps the view shows - a little lower than the duct count is normal,
      because not every duct is insulated. LOOK at it in the plan and in a 3D
      view: the duct must still read inside its red jacket. If the wrap's fill
      hides the run in plan, record it - that is a question for the owner, not
      a number to pick here

negative:
  - given: >
      the insulation alone handed a grey dashed look, with the ducts it wraps
      left out
    expect: >
      the insulation grey, the DUCTS UNCHANGED, and `wrapsFollowed` 0. The
      rule runs one way, run to wrap - this is the grayout's insulation layer,
      and pulling the ducts in would grey the services the grayout brought
      forward

  - given: an insulated duct whose insulation is NOT shown in this view
    expect: >
      the duct overridden and `wrapsFollowed` 0. A wrap the view does not show
      has nothing to override, and counting it would pad the report


  - given: a view whose TEMPLATE controls visibility and graphics
    expect: >
      overridden = 0, every element in `skipped`, AND NO EXCEPTION. This is the
      case that happens in real projects: the user asks, nothing appears to
      change, and nobody is told why. A fragment that threw here would be a
      stack trace instead of "that view has a template"

  - given: a schedule or a sheet as the view
    expect: overridden = 0, everything skipped, no exception

  - given: an empty element list on a perfectly good view
    expect: >
      overridden = 0 and `skipped` EMPTY - the two zeros mean different things
      and must not merge into one

  - given: an element that has been deleted since the list was built
    expect: it is skipped and the rest are still overridden

  - given: >
      an element that ALREADY has a colour override, then a settings object
      carrying only halftone
    expect: >
      THE COLOUR IS GONE. This fragment replaces the whole override rather than
      merging, and nothing warns. It is correct behaviour and it is the trap the
      caller has to know about - the fix is to read the current overrides,
      modify them, and pass those. Prove it once so the behaviour is known

second_route:
  - open Visibility/Graphics on the view and read the overrides back by hand
  - one Ctrl+Z restores the whole view in a single step (Golden Rule 16)

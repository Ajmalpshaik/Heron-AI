heron-agent: HERON-REVIT-VIE-013
heron-step: 14
heron-status: DRAFT
heron-since: 0.1.0
heron-layer: brain

id: FRG-VIEW-001
semantic-identity: "apply one graphic override to these elements in one view"
kind: action
domain: revit.views
capability: OVERRIDE_GRAPHICS_IN_VIEW
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Applies a prepared OverrideGraphicSettings to elements in one view, and
  reports what it could not override. It is the working half of the grayout -
  grey the background, bring the services forward - and of any other job that
  changes how something LOOKS without changing what it IS.

  It takes the settings ALREADY BUILT rather than building them from colours
  and weights. That is deliberate and it is what makes one implementation work
  on eight releases - see the compatibility note.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: view
      type: View
      source: request
    - name: elements
      type: IList<Element>
    - name: overrides
      type: OverrideGraphicSettings
      source: request
  provides:
    - name: overridden
      type: int
    - name: skipped
      # What it passed over. The evidence it looked, never a thing it
      # FOUND - so it must not count toward "did this come back empty"
      # (D-52).
      role: accounting
      type: IList<ElementId>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release, because the part that MOVED is not in
  here. `OverrideGraphicSettings`' own setters were renamed - the fill-pattern
  calls became surface-pattern calls, foreground and background split - and any
  fragment that built the settings would need a branch per release. Taking the
  settings as an input puts that churn at the caller, and leaves this fragment
  holding only `View.SetElementOverrides`, which is unchanged 2020 to 2027.

# Three sentences were removed on 2026-08-30, found by tools/check-routing.py.
#
# "do the grayout" and "do the grayout for MEP" belong to the mep-grayout SKILL,
# which declares them - a grayout is filter, then override, then a category
# switched off, and no single fragment can answer it. A fragment claiming a
# skill's sentence wins it sometimes, which is worse than never.
#
# "grey the background" went because the answer to it CHANGED: the background is
# now category work (SET_CATEGORY_GRAPHICS), so that a wall drawn tomorrow is
# grey too. The search had already moved that sentence to the category fragment
# on its own, which is the retrieval agreeing with the decision rather than
# being corrected into it.
# ROUTING - repeated in ADD_REVISION_CLOUD.
#
#   "make these red"                   -> here - a graphic override, view only
#   "grey everything else back"        -> here
#   "circle these in red"              -> here is the closest thing
#   "put a revision cloud around this" -> ADD_REVISION_CLOUD. An override is a
#                                         COLOUR and nothing outside this view
#                                         knows about it; a cloud is an
#                                         ANNOTATION that puts the change on
#                                         the titleblock's revision schedule
#   "colour code by system"          -> COLOR_BY_PARAMETER - a colour PER VALUE,
#                                       worked out from the model. This one
#                                       applies ONE prepared look to a set
#   "give every system its own colour" -> COLOR_BY_PARAMETER
#   "do the grayout"                 -> HIGHLIGHT_VS_REST - it dims the WHOLE
#                                       view so one subset reads. This one
#                                       leaves everything else alone
#   "grey everything except the ducts" -> HIGHLIGHT_VS_REST

# "make these red" AND "circle these in red" ARE CLAIMED IN THE ROUTING TABLE
# ABOVE AND WERE NEVER DECLARED HERE - found 2026-09-01. A routing table is a
# COMMENT, and comments are not indexed: heron_search reads semantic-identity,
# the utterances, the capability, the domain and the purpose, and nothing else.
# So this fragment was claiming a sentence in a place retrieval cannot hear,
# and "make these red" resolved to GROUP_ELEMENTS.
#
# The general rule: a routing table records a DECISION for a reader. If the
# sentence should actually reach this fragment, it also has to be an utterance.

# SENTENCES ADDED 2026-09-01 BECAUSE THE ROUTING TABLE ABOVE ALREADY CLAIMED
# THEM. A routing table is a COMMENT and comments are not indexed - the search
# reads semantic-identity, the utterances, the capability, the domain and the
# purpose, and nothing else. So a table saying "-> here" recorded a decision
# that retrieval could not act on, and these resolved elsewhere.

#   "grey out the linked model"        -> SET_LINK_GRAPHICS AS OF 2026-09-06,
#                                        which declares it. The reasoning below
#                                        is why, and it is now that fragment's:
#                                        a link is ONE element in the host, so
#                                        one override on it covers everything
#                                        inside - and a CATEGORY override in the
#                                        host reaches into a link not at all,
#                                        which is why a grayout on a linked job
#                                        appears to do nothing. This fragment
#                                        can still take a link instance handed
#                                        to it; it just cannot find the links,
#                                        name them by file, or say that a view
#                                        template is overruling the result
#   "halftone the walls"               -> HERE for named host walls, and
#                                        SET_CATEGORY_GRAPHICS for the whole
#                                        category. SET_LINK_GRAPHICS ranks high
#                                        on it because it declares the sentence
#                                        somebody types when a greyout did
#                                        nothing, and that sentence has the word
#                                        walls in it. It is only the answer if
#                                        those walls are inside a link
#   "make this pipe look the same as that one" -> READ_GRAPHIC_OVERRIDES
#                                        FIRST, then here with what it
#                                        returns. Matching is a read and a
#                                        write, and this half only writes
utterances:
  - bring the services forward
  - make the architecture faint
  - override the colour in this view
  - halftone the walls
  - colour these elements in this view
  - make these red
  - circle these in red
  - grey everything else back
  - grey out the linked model
  - grey out the link

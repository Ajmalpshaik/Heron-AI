utterances:
  - bring the services forward
  - make the architecture faint
  - override the colour in this view
  - halftone the walls
  - colour these elements in this view
  - make these red
  - circle these in red
  - grey everything else back
  - grey out the linked model
  - grey out the link
  # MOVED 2026-11-01 from SET_LINK_GRAPHICS, merged into this card.
  - grey out the linked model in this view
  - halftone the architectural link
  - fade the structure link back
  - push the linked model into the background
  - make the link lighter in this view
  - put the link graphics back to normal
  - the greyout did nothing because the walls are in a link

# VERSION 2 (2026-11-01) - SET_LINK_GRAPHICS' ROUTING ROWS, NOW HERE:
#
#   "fade the structural link"          -> here, linksOnly
#   "halftone the linked model"         -> here, linksOnly
#   "put the link back to normal"       -> here, with an empty
#                                          OverrideGraphicSettings. An unset
#                                          override IS Revit's cleared state
#   "grey the architecture back"        -> SET_CATEGORY_GRAPHICS owns the bare
#                                          sentence; come here when it names a
#                                          LINK
#   "grey their walls but keep the grid black"
#                                       -> NOT HERE AND NOWHERE IN THIS LIBRARY.
#                                          Overriding categories INSIDE a link
#                                          needs a collector Revit 2020 does not
#                                          have. Revit's route: Visibility /
#                                          Graphics, the Revit Links tab, that
#                                          link's row, Custom
#   "which links are loaded"            -> LIST_LINKED_MODELS, which feeds this
#
# WHY HIGHLIGHT_VS_REST WAS NOT MERGED HERE (2026-11-01), on the owner's rule
# that a merge covers everything both cards did and every conflict keeps the
# safer rule. Its insulation rule is the OPPOSITE of this card's, and both are
# safe for their own job: there a wrap PULLS IN THE RUN it wraps (colour the
# insulation, and the duct comes too - the owner's standing rule for a
# highlight), and here a wrap handed in NEVER drags its run (so a grayout's
# quiet grey insulation layer stays a layer). One tool cannot do both, and
# dropping either breaks a job the owner uses - "colour these and grey the
# rest" needs the first, the grayout's grey wrapper the second. It also builds
# its two looks from colours and greys EVERY OTHER element in the view, where
# this applies one prepared override to the set and leaves the rest alone. It
# stays its own card: five owner answer keys and mep-grayout.yaml name it.

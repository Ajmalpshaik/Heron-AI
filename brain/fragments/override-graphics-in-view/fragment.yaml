id: FRG-VIEW-001
semantic-identity: "apply one graphic override to these elements in one view, or to a whole linked model"
kind: action
domain: revit.views
capability: OVERRIDE_GRAPHICS_IN_VIEW
# VERSION 2 (2026-11-01): SET_LINK_GRAPHICS was merged into this card on the
# owner's instruction ("make sure there is no duplicate tools"), and is
# DEPRECATED. A linked model is ONE element in the host, so one override on its
# instance covers everything inside - this card's job, handed a link. From
# SET_LINK_GRAPHICS: `linksOnly` (asked for a link, anything that is not one is
# counted in `notALink` and left alone), a view template refused by name, a
# Revit refusal caught per element instead of aborting the caller's
# transaction, each link's override read back and named by its file in
# `appliedTo`, and the "the view template wins" warning, in `refused`. The
# proof below is version 1's and no longer describes the code; the card is
# DRAFT until version 2 is proved. HIGHLIGHT_VS_REST was NOT merged - see the
# ROUTING note at the foot of this card.
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Applies a prepared OverrideGraphicSettings to elements in one view, and
  reports what it could not override. It is the working half of the grayout -
  grey the background, bring the services forward - and of any other job that
  changes how something LOOKS without changing what it IS.

  It takes the settings ALREADY BUILT rather than building them from colours
  and weights. That is deliberate and it is what makes one implementation work
  on eight releases - see the compatibility note.

  **A whole linked model, too** (version 2, from SET_LINK_GRAPHICS). A link
  is one element in the host, so one override on it greys or fades
  everything inside it - and a CATEGORY override in the host never reaches
  inside a link, which is why a greyout on a linked job appears to do
  nothing. Asked for links only, anything else handed in is counted and left
  alone; each link's override is read back and named by its file. A view
  template is refused, and a view following one is warned that the template
  wins.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: view
      type: View
      source: request
    - name: elements
      type: IList<Element>
    - name: overrides
      type: OverrideGraphicSettings
      source: request
    # VERSION 2, from SET_LINK_GRAPHICS. true when the job is a LINKED MODEL:
    # anything handed in that is not a link instance is counted in
    # `notALink` and not overridden. Left out it is false - every element is
    # overridden, as version 1 did. `optional: true` lets it be left out
    # (HeronBindingNote.AbsentValue).
    - name: linksOnly
      type: bool
      source: request
      optional: true
  provides:
    - name: overridden
      role: result
      type: int
    - name: skipped
      # What it passed over. The evidence it looked, never a thing it
      # FOUND - so it must not count toward "did this come back empty"
      # (D-52).
      role: accounting
      type: IList<ElementId>
    - name: wrapsFollowed
      # Insulation and lining given the same look as the run they wrap, where
      # the view shows them. Without them a red duct sits inside a jacket of
      # the old colour, so these are part of what it drew - the same output
      # HIGHLIGHT_VS_REST gives.
      role: result
      type: int
    - name: notALink
      # VERSION 2, from SET_LINK_GRAPHICS. With linksOnly, how many handed in
      # were not a linked model and were left alone. A count of what it was
      # GIVEN and could not use, never a thing it found (D-52).
      role: accounting
      type: int
    - name: refused
      # VERSION 2, from SET_LINK_GRAPHICS. Why it declined, in the user's
      # words - a template, a view that takes no override, Revit's own refusal
      # for one element - and the warning that a view template may win. The
      # evidence it looked and said no, never a thing it FOUND (D-52).
      role: accounting
      type: IList<string>
    - name: appliedTo
      # VERSION 2, from SET_LINK_GRAPHICS. Each LINK overridden, by its file
      # name, with the halftone and transparency READ BACK off the view:
      # "'Arch.rvt' in 'M1': halftone True, transparency 80%".
      role: result
      type: IList<string>


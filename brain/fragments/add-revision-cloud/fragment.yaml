id: FRG-SHT-002
semantic-identity: "draw a revision cloud around these elements on this view"
kind: action
domain: revit.sheets
capability: ADD_REVISION_CLOUD
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Draws a revision cloud around a set of elements in one view, tagged to a
  revision the project already has.

  **It belongs to the revision, not to the drawing.** A cloud carries a
  revision id, and that id is what puts the change on the revision schedule in
  the titleblock. A cloud on a view with no revision behind it is a shape on a
  drawing that no register mentions - which is the failure mode this job has
  when it is done by hand in a hurry.

  **The revision comes from the request, and is not invented.** Picking "the
  latest revision" automatically is wrong often enough to matter: the newest
  revision in the sequence is frequently the one being prepared for next time,
  and clouding this week's change onto it issues nothing.

contract:
  needs:
    - name: doc
      type: Document
    - name: view
      type: View
      source: request
    - name: elements
      type: IList<Element>
    - name: revisionId
      type: ElementId
      source: request
    - name: paddingMm
      type: double
      source: request
  provides:
    - name: created
      role: result
      type: IList<ElementId>
    - name: refused
      # The elements that got NO cloud, whatever the cause. The evidence it
      # looked and said no, never a cloud it drew, so it must not count
      # toward "did this come back empty" (D-52). The WORDS are in
      # `refusalReasons`; this is the list of who missed out.
      role: accounting
      type: IList<ElementId>
    - name: viewRefused
      # THE VIEW cannot carry a cloud - a template, a 3D view, a schedule or
      # a sheet. It says nothing about the revision: a missing revision is
      # its own sentence in `refusalReasons`, because the fix is different.
      # The evidence it looked and said no, never a cloud it drew (D-52).
      role: accounting
      type: bool
    - name: refusalReasons
      # WHY it declined, in the user's words - one sentence per cause, and
      # the per-element causes carry their counts rather than repeating
      # themselves. The evidence it looked and said no, never a thing it
      # FOUND, so it must not count toward "did this come back empty"
      # (D-52).
      role: accounting
      type: IList<string>


id: FRG-VIEW-075
semantic-identity: "copy this view template so i can make a variant"
kind: action
domain: revit.views
capability: DUPLICATE_VIEW_TEMPLATE
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Copies a view template, so a variant can be made from it instead of rebuilt
  by hand.

  **A VIEW TEMPLATE CANNOT BE COPIED WITH View.Duplicate, AND THE GUARD THAT
  LOOKS LIKE IT SAYS SO IS ALSO WRONG.** `CanViewBeDuplicated` returns false for
  every template on every duplicate option, so a fragment written the obvious
  way reports "cannot be duplicated" and does nothing, for ever. Removing the
  guard does not help either: `Duplicate` then throws. The copy has to go
  through `ElementTransformUtils.CopyElements`, which does work - verified on a
  real template that came across carrying its scale and detail level.

  **IT DOES NOT NAME THE COPY, AND THAT IS FORCED BY GOLDEN RULE 16.** Template
  names must be unique, so Revit auto-suffixes the copy - 'Mechanical Plan'
  becomes 'Mechanical Plan1' - and that name is only readable once the copying
  transaction has COMMITTED. A fragment that never opens a transaction therefore
  cannot rename it in the same breath. So this reports the name Revit gave, and
  RENAME_ELEMENTS does the rest in the next one. Splitting it is not a
  limitation being worked around; it is the rule being obeyed rather than
  quietly broken.

  **The copy is read back and its real name reported.** Predicting the suffix is
  guessing, and a caller renaming a template it has not confirmed exists is how
  a half-finished 'Mechanical Plan1' gets left behind.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: templateName
      type: string
      source: request
  provides:
    - name: copyId
      type: ElementId
    - name: copyName
      type: string
    - name: findings
      type: IList<string>


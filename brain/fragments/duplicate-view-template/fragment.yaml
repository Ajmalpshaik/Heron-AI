compatibility-note: >
  One implementation for every release. `ElementTransformUtils.CopyElements` and
  `View.IsTemplate` are present 2020 through 2027, compiled at both ends.
  `View.Duplicate` is deliberately NOT used - it cannot copy a template on this
  API at all, and `CanViewBeDuplicated` reports false for templates on every
  option, which makes the obvious implementation fail silently rather than
  loudly.

# ROUTING - repeated in APPLY_VIEW_TEMPLATE, CREATE_VIEW_TEMPLATE_FROM_VIEW and
# RENAME_ELEMENTS.
#
#   "copy this view template"        -> here
#   "make a variant of this template" -> here
#   "duplicate the template"         -> here
#   "make a template from this view" -> CREATE_VIEW_TEMPLATE_FROM_VIEW - a new
#                                       template out of a view's settings,
#                                       rather than a copy of one that exists
#   "rename the copy"                -> RENAME_ELEMENTS, and it has to be a
#                                       SEPARATE call: the copy's name is only
#                                       readable once this transaction has
#                                       committed
#   "put the template on these views" -> APPLY_VIEW_TEMPLATE

utterances:
  - copy this view template
  - make a variant of this view template
  - duplicate the view template
  - copy a template to make a new one
  - duplicate this template

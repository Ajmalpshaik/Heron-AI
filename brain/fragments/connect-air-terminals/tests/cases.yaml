positive:
  - given: twelve ceiling diffusers laid out under one supply branch, 600 mm allowed
    expect: >
      twelve taps cut into the duct, LOOKED AT in a section - and then the duct's
      flow read back. Before this the branch carries zero; after it, the air the
      terminals ask for. That flow appearing is the real proof

  - given: TRACE_CONNECTIVITY run over the branch afterwards
    expect: one system, not thirteen loose pieces

  - given: >
      a diffuser whose connector sits well BELOW the duct it will tap into -
      the shape another tool saw Revit answer by lifting the terminal 625 mm -
      with maxDistanceMm large enough to reach it
    expect: >
      tapped in, and IF Revit lifts it, its id in `moved` with the change on
      the z axis, and the finding saying how far. Measure the diffuser's height
      in a section BEFORE and AFTER and compare it with the report - the report
      is not the evidence. If it comes back tapped and NOT moved, record that
      too: it is the other answer to the question this case exists to settle

  # VERSION 2 (2026-11-01), from CREATE_FIXTURE_BRANCHES. Each FAILS on
  # version 1, which tapped duct only and drew no pipe.
  - given: >
      two pendent sprinklers at 2700 mm, each 600 mm to one side of a straight
      DN50 wet main at 3200 mm, ducts named "Pipes", maxDistanceMm 1500
    expect: >
      for each head a riser of about 500 mm and an arm of 600 mm, at the head's
      connector size, on the main's system and type; each JOINED at the head;
      branched 2; `runs` holding the four branch pipes and the main. Then
      FIT_MEP_JOINTS on `runs` puts two elbows and two taps or tees

  - given: a sprinkler directly under the main
    expect: a riser only, landing on the main's axis - no arm - and still joined at the head

  - given: >
      three ceiling diffusers under a supply duct AND two sprinklers under a wet
      main, all selected together, ducts named "Ducts, Pipes"
    expect: >
      connected 3 (the taps, into the DUCT only) and branched 2 (into the PIPE
      only) - no terminal taps a pipe, no head branches to a duct

  # VERSION 3 (2026-11-02), Revit's Connect Into. Arranged in NEEDS-CHECKING
  # Group LP (docs/needs-checking/group-lp.md).
  - given: >
      one round-neck supply diffuser selected; ducts the one supply main above
      it (selected by id, the only duct handed in); maxDistanceMm 1500
    expect: >
      connected 1; `created` holds the tap fitting's id, and the finding
      "... tapped into <main id>, ... mm away; new fitting id(s) <id>" names
      it; selected in Revit that id is the takeoff on the main

  - given: >
      a sink with a sanitary, a cold water and a hot water connector, the
      sanitary facing down, selected; ducts one straight Sanitary pipe below
      it, clear of its ends; maxDistanceMm 1500
    expect: >
      branched 1; the riser and arm start at the SANITARY connector, on the
      Sanitary pipe's type and system; `created` holds their two ids; the cold
      and hot connectors still open. On version 2 the first open connector
      was used, whichever it was

negative:
  # VERSION 3 (2026-11-02), Revit's Connect Into.
  - given: >
      the same sink selected; ducts one straight Domestic Cold Water pipe
      below it AND one Sanitary pipe below it; maxDistanceMm 1500
    expect: >
      two of the sink's connectors match the pipes handed in, so it is not
      guessed which was meant: NOTHING is drawn and `refused`
      names the sink's three connectors and both systems - "hand in the one
      main its connector belongs on"; `created` empty. THE FIRST VERSION 3
      CASE TO RUN

  - given: >
      the same sink selected; ducts one straight Vent pipe below it - a
      system the sink has no connector for
    expect: >
      nothing drawn; `refused` names the sink's connectors and the pipe's
      system; `created` empty

  # VERSION 2, from CREATE_FIXTURE_BRANCHES.
  - given: the two sprinklers with maxDistanceMm 300
    expect: >
      NOTHING DRAWN - both heads in noMainNear, runs empty. A head is never
      connected by a pipe longer than allowed

  - given: a basin whose pipe connector faces sideways
    expect: refused by name - risers and arms only - nothing drawn

  - given: a head whose arm would land within 100 mm of the main's end
    expect: that main skipped for that head; noMainNear when there is no other

  - given: a head already joined to a branch, run again
    expect: skipped into alreadyConnected; no second branch drawn

  - given: >
      a head whose connector size the main's pipe type will not join, so the
      branch is drawn and the head still reads open
    expect: >
      the head in `refused`, its riser and arm TAKEN BACK - no pipe of it left
      in the model and none in `runs`. CREATE_FIXTURE_BRANCHES kept both
      pipes; that rule is not carried

  - given: any run with heads
    expect: NO FITTING MADE, and every head's point in `moved` only if Revit moved it

  - given: a supply diffuser under a RETURN duct
    expect: >
      Revit declines, the false is reported by id, and NOTHING is counted as
      done - and nothing in `moved`. THIS IS THE FIRST CASE TO RUN - the call
      returns a bool rather than throwing, so a fragment that ignores the
      return value reports success over a model where nothing happened

  - given: >
      a diffuser whose connector already touches the underside of the duct,
      tapped in
    expect: >
      tapped in, and `moved` EMPTY. This is the leg that shows the movement
      report is not noise: a terminal Revit had no reason to move must not be
      listed. If it IS listed at 0.0 mm, that is rounding the point test did not
      absorb - record the size and put it to the owner with the tolerance
      question, rather than choosing a number here

  - given: a diffuser 2 m from the nearest duct with maxDistanceMm at 600
    expect: >
      in `noDuctNear`, untouched, and not in `moved`. No call is made for it,
      and a tap stretched 2 m across a ceiling is not a connection anybody wants

  - given: two ducts running side by side above a row of diffusers
    expect: >
      each diffuser tapping the duct nearest ITS CONNECTOR, which is on top of
      it. Measuring from the middle of the diffuser body picks the wrong one, and
      the report names the duct so a wrong pick is visible before the section is

  - given: a terminal already tapped in, run again
    expect: >
      skipped, not reconnected. A second tap would leave the first behind as an
      orphan fitting that nobody sees and every takeoff counts

second_route:
  - Revit's own Connect Into on one of the same terminals, and the two taps compared
  - >
    the terminal's Offset from Level read in the Properties palette before and
    after the tap - a by-hand read of the same movement `moved` reports

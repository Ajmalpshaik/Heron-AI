id: FRG-MEP-023
semantic-identity: "tap these diffusers into the duct running past them"
kind: action
domain: revit.mep
capability: CONNECT_AIR_TERMINALS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Connects air terminals to the duct running past them. Revit cuts the tap into
  the duct, positions it under the terminal's connector and joins both ends -
  one call does the whole job.

  **This is the step after a terminal layout, and without it a layout ends as
  loose components.** Diffusers get placed in the right places and nothing has
  joined them to the ductwork; the drawing looks finished and the system carries
  no air.

  **It is a TAP, not a butt joint, and that is why it is not CONNECT_OPEN_ENDS.**
  That one joins two ends already at the same point and adds no fitting. This
  cuts a fitting INTO the side of a duct. A terminal sitting under a duct
  correctly does not pair in the other fragment, and correctly does tap here.

  **Nothing here moves a terminal, and Revit may.** Revit taps the duct at the
  point nearest the terminal's connector, so a terminal nowhere near the duct
  gives either a refusal or an absurdly long tap. The distance allowed is asked
  for, and it is the guard against both. The same call has been seen elsewhere
  lifting a terminal to meet its duct, so every terminal's position is read
  before and after and any change is reported in `moved` - how far is
  acceptable is not decided here.

  **Nearest is measured to the terminal's CONNECTOR, not to its insertion
  point.** A ceiling diffuser's connector is on top of it, and that is the end
  that has to reach the duct. Measuring from the middle of the diffuser picks
  the wrong duct in a ceiling with two running side by side.

  **A refusal is a bool, not an exception.** Revit returns false when it
  declines - a supply diffuser will not tap a return duct - and the model is
  unchanged for that terminal. Every false is reported by id and never counted
  as done.

  **A terminal already connected is skipped, not reconnected**, because
  reconnecting leaves the old tap behind as an orphan fitting.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16). Joining
  raises Revit warnings on a real model; how those are handled belongs to
  whoever owns the transaction.

contract:
  needs:
    - name: doc
      type: Document
    # The air terminals.
    - name: elements
      type: IList<Element>
    # The ducts to tap into. Handing them in rather than searching the model
    # keeps the choice with whoever knows which system is which.
    - name: ducts
      type: IList<Element>
      source: request
    - name: maxDistanceMm
      type: double
      source: request
  provides:
    - name: connected
      role: result
      type: int
    - name: findings
      type: IList<string>
    - name: alreadyConnected
      # Elements that were ALREADY in the state asked for, so there was
      # nothing to do. The evidence it looked, never a change it made
      # (D-52).
      role: accounting
      type: IList<ElementId>
    - name: noDuctNear
      # Terminals with no duct within reach, so it could not be tapped in. The
      # evidence it looked, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<string>
    - name: moved
      # Every terminal handed in whose point or facing changed while this ran,
      # with how far in millimetres and on which axis. A tap that dragged a
      # diffuser out of its ceiling still counts in `connected`, so this is
      # the only place that says so. No distance is called acceptable here.
      role: result
      type: IList<string>
    - name: notMeasured
      # Terminals whose position could not be read before or after, so
      # whether they moved is NOT known. Never counted as unmoved (D-52).
      role: accounting
      type: IList<ElementId>

proof-held: >
  waiting on the owner's tolerance decision - how far Revit may move a terminal
  while connecting it before Heron calls it a problem - and on FRAGMENT-ISSUES
  5b-187: on Revit 2024 this call lifted every terminal onto its duct's underside
  (550, 101.6 and 550 mm), made no tap, and joined a supply diffuser to a return
  duct, where the purpose above says Revit declines. The proof below records that
  very run; the owner signed it and chose to hold it, 2026-09-23.


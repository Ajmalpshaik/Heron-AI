compatibility-note: >
  One implementation for every release.
  `MechanicalUtils.ConnectAirTerminalOnDuct(Document, ElementId, ElementId)` is
  present 2020 through 2027 - read off the reference assemblies at both ends
  rather than remembered. It lives in the mechanical namespace, which the
  wrapper already carries.

  Version 2, from CREATE_FIXTURE_BRANCHES: `Pipe.Create(Document, ElementId,
  ElementId, ElementId, XYZ, XYZ)`, `MEPCurve.ReferenceLevel`,
  `Connector.ConnectTo`, `Connector.Radius` / `Shape` / `Domain` /
  `CoordinateSystem`, `RBS_PIPE_DIAMETER_PARAM`, `RBS_PIPING_SYSTEM_TYPE_PARAM`
  and `SubTransaction` (`Start`, `Commit`, `RollBack`, `HasStarted`,
  `HasEnded`) are present 2020 through 2027. The connector overload of
  Pipe.Create is NOT used: RevitAPI.xml says that when it cannot join it still
  creates the pipe and THROWS, which leaves a pipe nothing here can name.

# VERSION 2 (2026-11-01) - CREATE_FIXTURE_BRANCHES WAS MERGED INTO THIS CARD on
# the owner's instruction ("make sure there is no duplicate tools", "in every
# conflict keep the safer rule"), and is DEPRECATED. Its `elements` (the heads)
# are this card's `elements`; its `pipes` (the mains) go in `ducts`; its
# maxDistanceMm is this card's, read as the longest branch for a head; its
# branched, runs and noMainNear are here under the same names; its
# alreadyConnected and refused are this card's; its findings sentence is said
# here when a head was handed in.
#
# THE CONFLICT, AND THE SAFER RULE KEPT: CREATE_FIXTURE_BRANCHES kept the pipes
# it had made when Revit refused the rest of a branch, and kept a branch that
# would not join the head, listing it in `refused` and in `runs`. This card
# leaves an element Revit declines unchanged. KEPT: each head's branch is drawn
# in its own SubTransaction and rolled back whole when any part is refused or
# the head still reads open - a pipe left hanging beside a head reads as piped
# on plan and is not.

# TRAP - OBSERVED ELSEWHERE, NOT YET PROVEN HERE. Added 2026-09-23.
#
# Another tool, on real models and mostly on Revit 2020, saw this same Revit
# call LIFT an air terminal 625 mm to meet the duct. Until that day this card
# said "It connects and moves nothing" and the code said "NOTHING IS MOVED".
# Nothing in this repository has reproduced the lift yet.
#
# What is done about it: every terminal handed in has its point and its
# facing read before any call and again after, and every change is listed in
# `moved` with the distance on each axis. What is NOT done: no distance is
# called acceptable, because nobody has given that number - it is the owner's
# question, and until it is answered every movement is reported and none is
# refused. NEEDS-CHECKING AJ1 is the check on a real model: one terminal that
# should move and one that should not.

# ROUTING - repeated in CONNECT_OPEN_ENDS and FIT_MEP_JOINTS.
#
#   "connect the diffusers to the duct" -> here - a TAP cut into the duct's side
#   "tap these terminals in"            -> here
#   "the diffusers are not connected"   -> here
#   "they are touching but not
#    connected"                         -> CONNECT_OPEN_ENDS - two ends already
#                                          at one point, and no fitting added
#   "join these two ducts"              -> FIT_MEP_JOINTS
#   "the flow is zero everywhere"       -> often this: nothing is tapped in, so
#                                          Revit has no terminals to draw air
#                                          through the run
#   "pipe these sprinklers to the main" -> here - there is no pipe twin of the
#                                          tap call, so the branch is drawn and
#                                          FIT_MEP_JOINTS fits it after, from
#                                          `runs` (CREATE_FIXTURE_BRANCHES until
#                                          2026-11-01)
#   "draw the drops from the sprinklers to the branch line" -> here
#   "make the flex drop to that diffuser" -> CREATE_MEP_RUNS - it makes flex
#                                          and does NOT join it up
#   "is every sprinkler actually piped" -> CHECK_FIXTURE_CONNECTIVITY
#   "convert this last duct run to the diffuser into flex duct"
#                                       -> CONVERT_TO_FLEX_DUCT - the duct is
#                                          there already and becomes flex

utterances:
  - connect the diffusers to the duct
  - tap these terminals into the duct
  - the diffusers are not connected
  - connect the air terminals
  - join the grilles to the ductwork
  # MOVED 2026-11-01 from CREATE_FIXTURE_BRANCHES, merged into this card.
  - draw the drops from the sprinklers to the branch line
  - pipe these sprinklers to the main above
  # DECLARED 2026-11-01 (row 5b-1384): this card's own routing row above
  # claims it, and it reached here on origin/main; EDIT_MEP_SYSTEM, new on
  # this branch, took it on the model backend.
  - pipe these sprinklers to the main
  - run branch pipes from these heads to the pipe
  - draw the branch from each floor drain down to the drain line

id: FRG-MEP-023
semantic-identity: "tap these diffusers into the duct running past them, or pipe these sprinklers and fixtures to the main beside them"
kind: action
domain: revit.mep
capability: CONNECT_AIR_TERMINALS
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Connects air terminals to the duct running past them. Revit cuts the tap into
  the duct, positions it under the terminal's connector and joins both ends -
  one call does the whole job.

  **This is the step after a terminal layout, and without it a layout ends as
  loose components.** Diffusers get placed in the right places and nothing has
  joined them to the ductwork; the drawing looks finished and the system carries
  no air.

  **It is a TAP, not a butt joint, and that is why it is not CONNECT_OPEN_ENDS.**
  That one joins two ends already at the same point and adds no fitting. This
  cuts a fitting INTO the side of a duct. A terminal sitting under a duct
  correctly does not pair in the other fragment, and correctly does tap here.

  **Nothing here moves a terminal, and Revit may.** Revit taps the duct at the
  point nearest the terminal's connector, so a terminal nowhere near the duct
  gives either a refusal or an absurdly long tap. The distance allowed is asked
  for, and it is the guard against both. The same call has been seen elsewhere
  lifting a terminal to meet its duct, so every terminal's position is read
  before and after and any change is reported in `moved` - how far is
  acceptable is not decided here.

  **Nearest is measured to the terminal's CONNECTOR, not to its insertion
  point.** A ceiling diffuser's connector is on top of it, and that is the end
  that has to reach the duct. Measuring from the middle of the diffuser picks
  the wrong duct in a ceiling with two running side by side.

  **A refusal is a bool, not an exception.** Revit returns false when it
  declines - a supply diffuser will not tap a return duct - and the model is
  unchanged for that terminal. Every false is reported by id and never counted
  as done.

  **A terminal already connected is skipped, not reconnected**, because
  reconnecting leaves the old tap behind as an orphan fitting.

  **Sprinklers and fixtures too (version 2, 2026-11-01).** CREATE_FIXTURE_BRANCHES
  was merged in. An element with a pipe connector and no duct one - a pendent
  sprinkler, a floor drain - is branched to the nearest straight PIPE among
  `ducts`: a riser from its connector to the main's centreline height and a
  level arm across to the main, at the connector's size, on the main's pipe
  type and system, joined at the head. The connector must face up or down and
  the main must be that way; the arm lands at least 100 mm or two main
  diameters in from a main's end; riser and arm together within maxDistanceMm.
  No fitting is made: `runs` holds the branches and the mains they land on, for
  FIT_MEP_JOINTS to make the elbows and the taps. A head whose branch Revit
  refuses, or that will not join, is taken back WHOLE - nothing is left for it,
  as nothing is left for a terminal Revit declines. Version 2's proof is owed;
  the card is DRAFT and the version 1 proof below is the record.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16). Joining
  raises Revit warnings on a real model; how those are handled belongs to
  whoever owns the transaction.

contract:
  needs:
    - name: doc
      type: Document
    # The air terminals - and, version 2, the sprinklers or plumbing fixtures
    # (CREATE_FIXTURE_BRANCHES' `elements`). A duct connector makes an element
    # an air terminal; a pipe connector and no duct one, a head to branch.
    - name: elements
      type: IList<Element>
    # The ducts to tap into. Handing them in rather than searching the model
    # keeps the choice with whoever knows which system is which. Version 2:
    # the PIPE mains a head branches to go here too - CREATE_FIXTURE_BRANCHES'
    # `pipes` - named "Pipes", or "Ducts, Pipes" with terminals. A terminal
    # never taps a pipe, and a head branches only to a straight pipe.
    - name: ducts
      type: IList<Element>
      source: request
    # For a terminal, how far its connector may be from the duct; for a head
    # (version 2), the longest branch allowed, riser and arm together. A head
    # with no main this close is listed, never connected by a long pipe.
    - name: maxDistanceMm
      type: double
      source: request
  provides:
    - name: connected
      role: result
      type: int
    - name: findings
      type: IList<string>
    - name: alreadyConnected
      # Elements that were ALREADY in the state asked for, so there was
      # nothing to do. The evidence it looked, never a change it made
      # (D-52).
      role: accounting
      type: IList<ElementId>
    - name: noDuctNear
      # Terminals with no duct within reach, so it could not be tapped in. The
      # evidence it looked, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<string>
    - name: moved
      # Every terminal handed in whose point or facing changed while this ran,
      # with how far in millimetres and on which axis. A tap that dragged a
      # diffuser out of its ceiling still counts in `connected`, so this is
      # the only place that says so. No distance is called acceptable here.
      role: result
      type: IList<string>
    - name: notMeasured
      # Terminals whose position could not be read before or after, so
      # whether they moved is NOT known. Never counted as unmoved (D-52).
      role: accounting
      type: IList<ElementId>
    # VERSION 2 - CREATE_FIXTURE_BRANCHES' answers, under its own names.
    - name: branched
      # How many sprinkler or fixture heads got a branch drawn AND joined at
      # the head, read back off the head's connector.
      role: result
      type: int
    - name: runs
      # The new branch pipes and the mains they land on - what FIT_MEP_JOINTS
      # takes next as its `elements`. Empty when only terminals were handed in.
      role: result
      type: IList<Element>
    - name: noMainNear
      # Heads with no straight pipe main within reach in the direction they
      # face, clear of its ends. The evidence it looked, never a thing it
      # found (D-52).
      role: accounting
      type: IList<ElementId>


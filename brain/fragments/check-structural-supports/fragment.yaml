compatibility-note: >
  One implementation for every release. BoundingBoxIntersectsFilter, Outline,
  LocationCurve and LocationPoint are present 2020 through 2027 - read off
  RevitAPI.xml in the Nice3point reference packages for all eight releases on
  2026-10-12.

# ROUTING - the same rows are in the fragments named here.
#
#   "which beams are not supported"           -> here
#   "check the columns sit on foundations"    -> here
#   "which pipes are connected to nothing"    -> FIND_DEAD_ENDS

utterances:
  - which beams have an end with nothing under it
  - check every column sits on a foundation or slab
  - find unsupported structural framing
  - are any beams floating

id: FRG-QA-036
semantic-identity: "which beam ends and column bases have nothing to bear on"
kind: action
domain: revit.qa
capability: CHECK_STRUCTURAL_SUPPORTS
# VERSION 2 (2026-11-24, D-64, row 5b-1909, work-note item WN-7 of issue
# #1005) - a beam with no location line or a column with no base point is
# counted in `skippedMembers`, never silently left unchecked, and a sentence
# names it only when it is above 0. It was PROVEN at version 1; that proof
# stays below as the record, and the card is DRAFT until its NEEDS-CHECKING
# check runs and is signed (D-30).
version: 2
source: OFFICIAL
risk: READ

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# A GEOMETRIC SWEEP, NOT AN ANALYSIS: a beam end must touch a column, wall,
# beam or foundation; a column base must sit on a foundation, floor, beam or
# wall - each within toleranceMm of the candidate's bounding box. A support
# drawn a few millimetres short is still found; one metres away is not. The
# answer says it is a geometric check and never calls a structure adequate.
#
# FIND_DEAD_ENDS is the MEP version for open connectors.
#
# READ ONLY - opens no transaction.
purpose: >
  Finds beam and brace ends and column bases with nothing found to bear on -
  no column, wall, beam, floor or foundation within a tolerance - as a
  geometric check of the model.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # Millimetres; 0 means 50.
    - name: toleranceMm
      type: double
      source: request
  provides:
    - name: unsupported
      # "beam 123 start", "column 456 base" for each end found bearing on
      # nothing (D-52).
      role: result
      type: IList<string>
    - name: checkedCount
      role: accounting
      type: int
    - name: report
      # ONE STRING, end by end.
      role: accounting
      type: string
    - name: findings
      type: IList<string>
    - name: skippedMembers
      # VERSION 2 (D-64). Beams and columns handed in with no location line or
      # base point, so not checked. Never an element of another category.
      # Always carried; a sentence in `findings` names it only when it is
      # above 0.
      role: accounting
      type: int


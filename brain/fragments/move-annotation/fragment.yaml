compatibility-note: >
  `IndependentTag.TagHeadPosition` and
  `ElementTransformUtils.MoveElement(Document, ElementId, XYZ)` are present 2020
  through 2027 - read off the reference assemblies at both ends on 2026-09-18.
  The target arrives in internal FEET, converted at the edge (D-20).

# ROUTING - repeated in ARRANGE_TAGS, STACK_TAGS and CENTER_ROOM_TAGS.
#
#   "move this tag here"           -> here
#   "move this dimension"          -> here
#   "the tags are on top of each other" -> ARRANGE_TAGS - a RULE, and the right
#                                    answer when there are forty of them
#   "stack the tags at the side"   -> STACK_TAGS
#   "put the room tags back"       -> CENTER_ROOM_TAGS
#   "move a model element"         -> MOVE_ELEMENTS_TO_POINT
#   "move the tags off the elements" -> OFFSET_TAGS_FROM_HOST - each tag to
#                                    its OWN element plus an offset, not all
#                                    to one point

utterances:
  - move this tag here
  - put the tag at this point
  - move this dimension
  - set the tag location
  - move the text note here
  - line up these text notes on the left
  - space these text notes evenly down the sheet

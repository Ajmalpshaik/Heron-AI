id: FRG-VIEW-003
semantic-identity: "hide these elements in this view, temporarily or for good"
kind: action
domain: revit.views
capability: HIDE_ELEMENTS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Hides the given elements in one view - the opposite of isolating, in that
  everything else stays visible and these disappear.

  **Temporary unless somebody asked for permanent, and the two are genuinely
  different things.** A temporary hide is a look-at-this-for-a-moment and Revit's
  own Reset clears it. A permanent hide is **saved into the view**: it survives
  closing the model, it appears on the printed sheet, and the next person to open
  that view has no idea why something is missing. Nothing infers which one was
  meant - the flag is an input.

  The risk on this fragment is MODIFY because of that second mode. The temporary
  path is far lighter, and a caller that only ever hides temporarily is welcome
  to say so - but a capability's risk is the worst thing it can do.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: view
      type: View
      source: request
    - name: elements
      type: IList<Element>
    - name: permanent
      type: bool
      source: request
  provides:
    - name: hidden
      role: result
      type: int
    - name: cannotHide
      # Elements this view will not hide. Given and unusable, never a thing it
      # hid (D-52).
      role: accounting
      type: IList<ElementId>
    - name: viewRefused
      # The view declined the change - a template owns the slot, or the view
      # cannot take it at all. The evidence it looked and said no, never a
      # change it made (D-52).
      role: accounting
      type: bool

proof:
  date: '2026-09-13'
  by: Ajmal PS
  model: test projject (3,509 elements), Revit 2024, session 40932
  positive_case: run as it would normally be run - the arrangement was re-made first by running
    select-in-region, set-selection with this phase's own values - run inside a transaction,
    and Revit reported the transaction group ROLLED BACK afterwards. returned cannotHide 0
    item(s), hidden 3, permanent false, viewRefused false. inputs came view as given; elements
    from the selection (3); permanent as given. on test projject
  negative_case: run with minMm=-2000,23000,0, maxMm=14000,32000,4000, exact=false, categories=Ducts,
    view=HERON DUCT SCHEDULE, permanent=false instead - chosen because it should not contain
    what this fragment reports - the arrangement was re-made first by running select-in-region,
    set-selection with this phase's own values - run inside a transaction, and Revit reported
    the transaction group ROLLED BACK afterwards. returned cannotHide 0 item(s), hidden 0,
    permanent false, viewRefused true. inputs came view as given; elements from the selection
    (3); permanent as given. on test projject
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  caveat: >-
    `hidden` IS THE COUNT ASKED FOR, NOT A READ-BACK - `fragment.cs:56` is `hidden =
    ids.Count;` and FRAGMENT-ISSUES row 20 says so. IT WAS THEREFORE CHECKED FROM OUTSIDE
    rather than trusted. Measured 2026-09-13 on `test projject` with `permanent: true` applied
    for real: select-by-category-name reported 6 ducts visible in '{3D}' before, hide-elements
    answered hidden 3, and the same count from a separate process reported 3 after;
    show-elements then answered shown 3 and the count returned to 6. The number is true here
    and the fragment still does not read it back. THE LEGS ABOVE USE `permanent: false`,
    because the view guard (CanUseTemporaryVisibilityModes) covers ONLY the temporary path -
    with `permanent: true` the same schedule answered viewRefused false and hidden 3.
  fingerprint: 9bbb751669eaa19a

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `HideElementsTemporary`,
  `HideElements` and `Element.CanBeHidden` are unchanged 2020 to 2027, and the
  view arrives as an object so no ElementId is built from an integer.

utterances:
  - hide these
  - get rid of them in this view
  - I do not want to see the ceilings here
  - hide it on this drawing
  - take them off the view

compatibility-note: >
  One implementation for every release. `View3D.SetSectionBox`,
  `View3D.IsSectionBoxActive` and `Element.get_BoundingBox(null)` are unchanged
  2020 to 2027. Millimetres to feet is arithmetic, not `UnitUtils` (D-20).

# ROUTING - repeated in ISOLATE_ELEMENTS, which is the usual meaning.
#
#   "show me just these"              -> ISOLATE_ELEMENTS - hides the rest
#   "box these up" / "section box"    -> here - cuts the view around them
#   "how big is the box around these" -> REPORT_BOUNDING_BOX - a MEASUREMENT
#                                        in mm, changing no view. That
#                                        sentence resolved HERE until
#                                        2026-09-05, and this fragment edits
#                                        the view instead of answering
#   "create a section through this"   -> CREATE_SECTION_VIEW. A NEW
#                                        DRAWING that can go on a sheet.
#                                        Same word, entirely different
#                                        job: this fragment makes nothing
#   "make a section here"             -> CREATE_SECTION_VIEW
#   "zoom to these"                   -> here is the closest thing; a true zoom
#                                        moves the camera and changes no view
#                                        setting, which nothing here does yet
#
# ISOLATING AND BOXING ARE ASKED FOR IN THE SAME WORDS AND ARE NOT THE SAME.
# Isolating hides everything else and leaves the camera alone; a section box
# keeps whatever else is inside it and cuts everything outside, including the
# building. Landing on the wrong one gives a view that looks broken.
#   "put a scope box round this area" -> NOTHING IN THIS LIBRARY, and it is
#                                       not an omission. Revit exposes NO way
#                                       to create a scope box - checked
#                                       against the shipped assemblies for
#                                       2020 AND 2027, where the only matches
#                                       are print and export flags. Draw one
#                                       by hand once (View, Scope Box); every
#                                       other job here works on one that
#                                       exists

# SENTENCES ADDED 2026-09-01 BECAUSE THE ROUTING TABLE ABOVE ALREADY CLAIMED
# THEM. A routing table is a COMMENT and comments are not indexed - the search
# reads semantic-identity, the utterances, the capability, the domain and the
# purpose, and nothing else. So a table saying "-> here" recorded a decision
# that retrieval could not act on, and these resolved elsewhere.

#   "set the scope box on these views" -> ASSIGN_SCOPE_BOX_TO_VIEW - a scope box
#                                        is shared and named; a section box
#                                        belongs to this 3D view alone
#   "crop the view to follow the room shape" -> SET_VIEW_CROP_TO_SHAPE
utterances:
  - put a section box around this
  - box these up so I can see them
  - section box around the clash
  - crop the 3d view to these
  - zoom the 3d view to these
  - zoom to these

id: FRG-VIEW-010
semantic-identity: "put a section box around these elements in the 3D view"
kind: action
domain: revit.views
capability: SET_VIEW_SECTION_BOX
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Sets a 3D view's section box to enclose the given elements, with a margin.
  The habit every coordinator has - find the clash, box it, look at it - and
  nothing here could do it.

  **A section box is not a filter and does not hide anything.** It cuts the view
  geometrically: everything inside the box is shown, including elements nobody
  asked about. ISOLATE_ELEMENTS is the fragment for "show only these"; the two
  get asked for in the same words and do different things.

  **The margin is a per-request input with no default.** How much context to keep
  around a clash is a judgement about the job, and a number invented here would
  become a number quietly relied on.

  **Only a 3D view has a section box.** Asked of a plan or a section, this
  refuses by name rather than doing nothing - a silent no-op reads as a broken
  tool while the user waits for the view to change.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: view
      type: View
      source: request
    - name: elements
      type: IList<Element>
    - name: marginMm
      type: double
      source: request
  provides:
    - name: applied
      role: result
      type: bool
    - name: enclosed
      role: result
      type: int
    - name: noGeometry
      # Elements with no geometry to box, so it could not be enclosed. The
      # evidence it looked, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: viewRefused
      # The view declined the change - a template owns the slot, or the view
      # cannot take it at all. The evidence it looked and said no, never a
      # change it made (D-52).
      role: accounting
      type: bool
    - name: refusalReasons
      # WHY it declined, in the user's words - one sentence per cause. It
      # tells "this view cannot carry a section box" apart from "the view is
      # fine and the selection has no geometry", which shared `viewRefused`
      # until 2026-09-09 and have opposite fixes. The evidence it looked and
      # said no, never a thing it FOUND, so it must not count toward "did
      # this come back empty" (D-52).
      role: accounting
      type: IList<string>


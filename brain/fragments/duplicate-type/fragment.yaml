compatibility-note: >
  One implementation for every release. `ElementType.Duplicate(string)` is
  present 2020 through 2027 - read off the reference assemblies at both ends
  rather than remembered - and it is a base `ElementType` method, so it covers
  both loadable family types and system types like duct, pipe and wall types.
  ElementIds are compared as ElementIds and never read as numbers.

# ROUTING - repeated in CHANGE_ELEMENT_TYPE and EDIT_TEXT_VALUES.
#
#   "make a new duct type"           -> here
#   "duplicate this type"            -> here
#   "make a 300 wide version of this type" -> here FIRST, then
#                                      WRITE_ELEMENT_PARAMETERS for the 300
#   "change these to the 300 type"   -> CHANGE_ELEMENT_TYPE - the type already
#                                      exists and the instances move onto it
#   "rename this type"               -> EDIT_TEXT_VALUES field Name - and note it renames
#                                      the type EVERYWHERE it is used, which
#                                      is the opposite of duplicating it
#   "make the new type 300 wide"     -> WRITE_ELEMENT_PARAMETERS on the type
#                                      this creates. Nothing here sets a size
#   "rename the family"              -> EDIT_TEXT_VALUES, field Family (RENAME_FAMILY until 2026-11-01)

#   "make a duct system type"            -> CREATE_MEP_SYSTEM_TYPE - a SYSTEM
#                                        type is colour, abbreviation and which
#                                        system a run belongs to. This one
#                                        duplicates the type behind ELEMENTS -
#                                        a duct type, its size and shape
#   "change the grid on just this curtain wall" -> a COMPOSITION, the
#                                        curtain-wall skill: this card first,
#                                        then
#                                        CHANGE_ELEMENT_TYPE to put that wall on
#                                        the copy, then SET_CURTAIN_WALL_GRID -
#                                        its grid, its mullions or both - on the
#                                        copy. It changes a TYPE, and so every wall
#                                        of it

# ROUTING (2026-10-13, the gap fill)
#
#   "copy the guard rail type with a 1100 top rail" -> SET_RAILING_TYPE
#   "make a 2.5 mm text type"            -> SET_TEXT_TYPE - copies a label
#                                        or text type BY NAME and sets its
#                                        size in the same undo

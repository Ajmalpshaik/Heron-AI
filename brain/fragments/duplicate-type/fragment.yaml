# VERSION 2 (2026-11-16) - A TYPE IS DUPLICATED FROM THE TYPE ITSELF, with no
# placed instance needed - and back to DRAFT. FRAGMENT-ISSUES row 5b-1705, from
# Ajmalpshaik/Heron-AI#853 (Revit 2024, `villa 2`, item B7): each element
# handed in was asked for its type, and a type answers with none, so a door
# type picked by SELECT_TYPES landed in `noType` ("Nothing in the selection
# resolves to a type") and every new door size cost a seed instance and four
# calls. Now a type handed in is duplicated itself, and `typeName` names one
# with nothing selected - "Family: Type", or a type name only one type in the
# project has; typed wins over the selection. A name that matches nothing, or
# that several types share, is refused with what it found - never the first
# match (D-54). `elements` is optional for that reason. Everything after the
# source type is found - one type only, read back, nothing set on it - is
# version 1's. Version 1 was PROVEN on 2026-09-10 (the proof block below,
# kept as the record of what it proved); its C# moved, so it is DRAFT again
# until NEEDS-CHECKING Group OH is run (D-30) - on the owner's word of
# 2026-11-16 to fix every issue from #852 to #854.

purpose: >
  Duplicates the TYPE behind the elements handed in, under a new name -
  *"make a new duct type at 300 wide"*, *"I need a copy of this wall type"*.
  The new type is created and nothing else happens: no instance is moved onto
  it and no size is set on it.

  **It refuses when the selection sits on more than one type**, and that refusal
  is the fragment's main decision. The earlier library let one literal name be
  applied to every distinct type found; Revit requires type names to be unique,
  so the first duplicate succeeded and the rest quietly did not - a batch that
  reports success and half-happened. So the distinct types are counted first,
  and if there is more than one they are NAMED and nothing is created. The user
  then narrows the selection, which is the answer they wanted anyway.

  **A type handed in is the type duplicated** (version 2) - a door type picked
  in the Project Browser or by SELECT_TYPES, with no door placed - and so is
  one named as *"Family: Type"*, *"copy M_Single-Flush: 0915 x 2134mm as
  1000 x 2134mm"*.

  **Forty instances of one type give ONE new type, not forty.** The types are
  de-duplicated before anything is created.

  **Two steps have to follow it and neither is guessed.** A duplicated type is
  an exact copy - same size, same everything - so WRITE_ELEMENT_PARAMETERS sets
  what makes it different, and CHANGE_ELEMENT_TYPE moves instances onto it if
  that is wanted. Doing either from here would mean deciding, on somebody's
  behalf, that their existing elements should change.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The selection: placed elements (their type is duplicated) or, since
    # version 2, TYPES themselves. Optional since version 2, so a type can be
    # named by `typeName` with nothing selected; nothing selected binds empty.
    - name: elements
      type: IList<Element>
      optional: true
    - name: newTypeName
      type: string
      source: request
    # VERSION 2. The type to duplicate, by name: "Family: Type" as the Project
    # Browser shows it ("M_Single-Flush: 0915 x 2134mm"), or a type name alone
    # when exactly one type in the project has it. Given, it wins over the
    # selection and the answer says so. Left out ("none"): the selection.
    - name: typeName
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: findings
      type: IList<string>
    - name: createdTypeId
      role: result
      type: ElementId
    - name: sourceTypeName
      # The name of the type it copied from. Context for the answer, filled in
      # whether anything was created or not (D-52).
      role: accounting
      type: string
    - name: noType
      # Elements with no type behind them, so it could not be duplicated. The
      # evidence it looked, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>


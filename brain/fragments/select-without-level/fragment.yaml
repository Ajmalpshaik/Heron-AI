id: FRG-SEL-032
semantic-identity: "which of these has no level at all"
kind: filter
domain: revit.selection
capability: SELECT_WITHOUT_LEVEL
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Hands back the elements whose level cannot be resolved - the ones a
  floor-by-floor check, a level clean-up or a hand-over would silently miss.

  **`SELECT_BY_LEVEL` COUNTS THESE AND THROWS THEM AWAY.** Its contract declares
  `unresolvedLevel` as an `int`. So the model can say there are 412 elements with
  no level and cannot hand one of them over - they are in scope during the run
  and discarded at the end. Asked for four separate times across one morning's
  lists, as *select*, *search*, *detect* and *verify*, which is four names for
  this fragment.

  **THE LEVEL LOOKUP IS THE SAME ONE, DELIBERATELY, INCLUDING ITS LAST ENTRY.**
  There is no single "which level is this on" call: a wall keeps it on
  `Wall.LevelId`, many elements on `Element.LevelId`, a family instance on its own
  parameters, and an MEP curve ONLY on `RBS_START_LEVEL_PARAM`, where the others
  are absent rather than empty. A lookup that stops before that last one returns
  every duct in the model as unlevelled - a confident, enormous, wrong answer.

  **A GREAT MANY ELEMENTS LEGITIMATELY HAVE NO LEVEL, AND THIS IS THE WARNING
  THAT HAS TO TRAVEL WITH THE ANSWER.** Views, sheets, materials, view templates
  and most annotation have none and never should. Run unbounded, this returns
  thousands of them and is entirely correct, and it reads as a fault. So the
  category list is not optional decoration - it is what makes the answer mean
  anything - and the finding says so in every run.

  ASSUMES NOTHING ABOUT TRANSACTIONS - it opens none and needs none.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, every loaded link is read too and
  `linksSearched` says how many were: set and 0 means "you asked, and none
  are loaded", which is a different answer from host-only. The same four-step level lookup runs in each
  link and its count is given per link in `linkedMatches`.
  **NOTHING FROM A LINK IS EVER SELECTED OR CARRIED** - `elements` stays this model's own; the chain
  revives ids against this model, and a linked id that happens to be in
  use here binds an unrelated element (FRAGMENT-ISSUES row 75). Links
  nested inside a link are not read, and are counted in the answer. This
  is version 2; version 1's proof no longer describes the code, and the
  fragment is DRAFT until it is proved again.

contract:
  needs:
    - name: doc
      type: Document
    - name: categories
      type: IList<BuiltInCategory>
      source: request
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: examined
      # How many were examined, so a small answer can be told from a small scan.
      # Evidence it looked, never a thing it found (D-52).
      role: accounting
      type: int
    - name: findings
      type: IList<string>
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then one line per link. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75).
      role: accounting
      type: IList<string>


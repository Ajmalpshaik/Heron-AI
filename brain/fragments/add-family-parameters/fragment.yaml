id: FRG-PAR-022
semantic-identity: "add these family parameters to the family being edited - or the office's shared parameters from its shared parameter file - switch existing ones to type or instance, rename them, or replace them with shared ones"
kind: action
domain: revit.families
capability: ADD_FAMILY_PARAMETERS
# VERSION 4 (2026-11-01) - ADD_FAMILY_SHARED_PARAMETERS WAS MERGED INTO THIS
# CARD on the owner's instruction ("make sure there is no duplicate tools",
# "merge means ... all area need to be covered", every conflict to keep the
# safer rule), and is DEPRECATED. Its code runs here, unchanged, as the SHARED
# kind - see "VERSION 4" above `utterances`. The field read 2 while the
# renaming mode has been called version 3 since 2026-10-07 (its proof below),
# so 4 is the next number free of both. Version 3's proof is kept as the
# record; it no longer describes the code (impl/ changed), and the card is
# DRAFT until version 4 is proved on a real model (D-30).
version: 4
source: OFFICIAL
# ADMIN FROM VERSION 4 - D-106, ADD_FAMILY_SHARED_PARAMETERS' risk. Its
# createMissing WRITES the office's shared parameter file, which is outside the
# model and which Undo does not reach: "a parameter written into the shared
# parameter file stays in that file". A card carries one risk, so EVERY call
# of this card - a plain family parameter added, switched or renamed included
# - now needs the Admin switch as well as Changes. The owner accepted that on
# 2026-11-01, merging the two; until then this card was MODIFY.
risk: ADMIN

purpose: >
  Adds one or more FAMILY parameters to the family open in the Family Editor -
  Width, Depth, Neck Width - all of one kind (a length, a number, a yes/no...),
  all type or all instance, filed under one group of the Properties palette.
  The Family Types dialog's "New Parameter", several at a time.

  **IT MAKES THE PARAMETERS AND WRITES NO VALUE.** A new length reads zero in
  every type. Filling them in is SET_FAMILY_TYPE_VALUES, and the ORDER MATTERS:
  values go in before any dimension is labelled with them, because a label on a
  parameter that reads zero drives the planes it measures to zero and collapses
  the family - reported from an earlier family build, and the reason
  LABEL_FAMILY_DIMENSION refuses a label whose parameter disagrees with the
  planes.

  **A NAME ALREADY IN THE FAMILY AS THE SAME PARAMETER IS LEFT ALONE AND
  NAMED.** Re-running the same request adds nothing twice. When the one already
  there is a different kind or scope from what was asked, or a shared one, it
  is a different parameter under a familiar name, and since version 4 the
  whole call is refused - nothing added - rather than carrying on beside it.
  This includes the category's own built-in parameters: an Air Terminal
  already has its flow fields.

  **THE KIND, THE SCOPE AND THE GROUP ARE ASKED FOR.** Type or instance is a
  decision about the family - sizes that describe the product are type,
  anything that varies per placed unit is instance - and it is not guessed.
  The group is the heading in the Properties palette, matched by the name Revit
  shows. Left empty, lengths and angles go under Dimensions and everything else
  under Data.

  **ALL OR NOTHING.** Every name, the kind and the group are checked before the
  first parameter is added. If Revit then refuses one - a character it does not
  allow in a name - the call fails and nothing from it is kept, rather than
  half the list being added and the rest reported.

  **SHARED PARAMETERS TOO (version 4, 2026-11-01).**
  ADD_FAMILY_SHARED_PARAMETERS was merged into this card and is DEPRECATED.
  `kind` shared adds the office's shared parameters, from the shared parameter
  file Revit is set to, which is only read: the kind comes from the file, the
  GUID is the file's, and a project can then schedule and tag the family's
  value. `replaceExisting` turns family parameters into shared ones in place -
  "Width=Unit_Width" - every label, formula, association and value kept.
  `createMissing` writes a definition the file does not have yet, "Group:
  Name [Data type]", before adding or replacing it - outside the model, so Undo
  does not take it back: **this card is ADMIN**, and every call of it needs
  the Admin switch. **A name already in the family as a DIFFERENT parameter
  refuses the whole call**, for every kind - the safer of the two cards' rules.

  **SWITCHING TYPE AND INSTANCE (version 2).** With switchExisting true the
  names are parameters the family already has - or `all` - and instance says
  which way they go, several at once. The order is worked out for them, a
  switch Revit would not allow is refused by name before anything changes,
  and each is read back, all or nothing.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The new parameters' names, comma separated - "Width, Depth, Neck Width".
    - name: parameterNames
      type: IList<string>
      source: request
    # What they hold: Length, Number, Integer, Angle, Area, Volume, YesNo,
    # Text, Material or Air Flow - or, since version 4, Shared: the office's
    # shared parameters, their kind from the file. Not used when switching or
    # renaming - give it empty. Shared, or empty, with replaceExisting or
    # createMissing.
    - name: kind
      type: string
      source: request
    # true for instance parameters, false for type parameters. When
    # switching, the scope the named parameters are moved TO.
    - name: instance
      type: bool
      source: request
    # The Properties palette heading, as Revit names it - "Dimensions",
    # "Mechanical", "Identity Data". Empty files lengths and angles under
    # Dimensions and the rest under Data. Not used when switching. When
    # replacing (version 4), empty keeps each parameter under its own heading.
    - name: parameterGroup
      type: string
      source: request
    # true SWITCHES parameters already in the family to the scope `instance`
    # names, instead of adding new ones; parameterNames may then be `all`.
    # Absent is false - adding, exactly as version 1 did. `optional: true` is
    # what lets it be left out (HeronBindingNote.AbsentValue).
    - name: switchExisting
      type: bool
      source: request
      optional: true
    # true RENAMES parameters already in the family instead of adding new
    # ones; each of parameterNames is then Old=New, and semicolons separate
    # the pairs. kind, instance and parameterGroup are not used - give kind
    # and parameterGroup empty and instance false. Absent is false.
    - name: renameExisting
      type: bool
      source: request
      optional: true
    # VERSION 4, from ADD_FAMILY_SHARED_PARAMETERS. true REPLACES family
    # parameters already in the family with the office's shared ones instead
    # of adding new ones; each of parameterNames is then Old=SharedName, and
    # semicolons separate the pairs. instance is not used - give it false, each
    # keeps its own scope. The shared kind. Absent is false.
    - name: replaceExisting
      type: bool
      source: request
      optional: true
    # VERSION 4, from ADD_FAMILY_SHARED_PARAMETERS. true CREATES in the shared
    # parameter file each name it does not have yet, written "Group: Name
    # [Data type]" - in parameterNames, or as the SharedName of a pair when
    # replacing - then adds or replaces it as one found there. The group and
    # the data type are never defaulted. It WRITES the office's file, which
    # Undo does not reach - the reason this card is ADMIN. The shared kind.
    # Absent is false - nothing is written to the file.
    - name: createMissing
      type: bool
      source: request
      optional: true
  provides:
    - name: added
      # Each parameter added, read back from the family with the kind, scope
      # and group Revit gave it.
      role: result
      type: IList<string>
    - name: alreadyThere
      # Names asked for that the family already had, with what they are. Left
      # alone - a name it was HANDED and did not act on, never a thing it made
      # (D-52).
      role: accounting
      type: IList<string>
    - name: switched
      # Each parameter switched, in the order it was switched - the order the
      # formulas allow, never the order the names were given.
      role: result
      type: IList<string>
    - name: scopeReadBack
      # Every parameter named, read back from the family afterwards with the
      # scope it now has, as one line - "A instance; B instance; C instance".
      role: accounting
      type: string
    - name: keptLinks
      # What each one is tied to, the same before and after: connector sizes,
      # nested families' parameters, labelled dimensions.
      role: accounting
      type: string
    - name: renamed
      # Each parameter renamed, Old -> New, read back from the family by its
      # new name.
      role: result
      type: IList<string>
    - name: formulasReadBack
      # Every formula that read an old name, read back after renaming - "Total
      # = Pipe CC 1 to 2 + Pipe CC 2 to 3" - as one line.
      role: accounting
      type: string
    - name: replaced
      # VERSION 4: each family parameter replaced, Old -> SharedName, read back
      # with its kind, scope, heading and the file's GUID.
      role: result
      type: IList<string>
    - name: created
      # VERSION 4: each definition written into the shared parameter file - its
      # name, data type, group, GUID and the file's own word for the data type
      # - read back by Revit and in the file's text on disk. Empty unless
      # createMissing wrote one.
      role: result
      type: IList<string>
    - name: sharedFile
      # VERSION 4: the shared parameter file that was read, for the shared kind.
      role: accounting
      type: string
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing was added, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


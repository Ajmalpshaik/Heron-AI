compatibility-note: >
  **THE CREATING CALL CHANGED SHAPE AT 2022, SO IT IS NEVER WRITTEN DOWN.**
  `FamilyManager.AddParameter(string, BuiltInParameterGroup, ParameterType,
  bool)` is 2020 to 2022 and `AddParameter(string, ForgeTypeId, ForgeTypeId,
  bool)` is 2022 to 2027 (api-surface, read 2026-09-24). No single spelling
  compiles on both ends, so the overload is chosen at run time by its own
  third parameter's type, newest first, and the kind and group are looked up
  by name - SpecTypeId and GroupTypeId properties on the newer releases, the
  ParameterType and BuiltInParameterGroup enums on the older. The same shape
  ADD_PROJECT_PARAMETER uses for the same move. Reading a parameter's kind back
  follows the same split: `Definition.GetDataType()` from 2022,
  `Definition.ParameterType` before it. Switching uses
  `FamilyManager.MakeInstance` and `MakeType`, `FamilyParameter.Formula` and
  `AssociatedParameters`, and `Dimension.FamilyLabel` - all unchanged from 2020
  to 2027 (api-surface, read 2026-10-04).

  **WHAT SWITCHING REFUSES, AND THE ORDER IT TAKES.** A type formula cannot
  read an instance parameter, so going to instance a parameter moves before
  what its formula reads, and going to type after it - worked out from the
  formulas, never from the order the names arrive in. Refused by name before
  anything changes: a switch that would leave a type formula reading an
  instance parameter; to instance, a parameter a nested family's TYPE
  parameter is linked to, or a column of the type catalogue beside the saved
  family; and a built-in parameter. The read-back compares scope, formula,
  associated parameters (connector sizes, nested families) and labelled
  dimensions before and after, and throws on any difference.

# ROUTING - see SET_FAMILY_CATEGORY for the whole family-building table.
#
#   "add a Width parameter to this family"   -> here
#   "make these family parameters instance"  -> here, switchExisting true
#   "delete these family parameters"         -> DELETE_FAMILY_PARAMETERS
#   "add a shared parameter to the project"  -> ADD_PROJECT_PARAMETER
#   "put 600 into Width"                     -> SET_FAMILY_TYPE_VALUES
#   "what parameters has this family got"    -> REPORT_FAMILY_PARAMETERS

utterances:
  - add a Width parameter to this family
  - add family parameters for width depth and height
  - create type parameters Neck Width and Neck Depth
  - add an instance length parameter to the family
  - switch these parameters between type and instance
  - make all these parameters instance
  - change these type parameters to instance parameters

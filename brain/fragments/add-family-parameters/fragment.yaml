compatibility-note: >
  **THE CREATING CALL CHANGED SHAPE AT 2022, SO IT IS NEVER WRITTEN DOWN.**
  `FamilyManager.AddParameter(string, BuiltInParameterGroup, ParameterType,
  bool)` is 2020 to 2022 and `AddParameter(string, ForgeTypeId, ForgeTypeId,
  bool)` is 2022 to 2027 (api-surface, read 2026-09-24). No single spelling
  compiles on both ends, so the overload is chosen at run time by its own
  third parameter's type, newest first, and the kind and group are looked up
  by name - SpecTypeId and GroupTypeId properties on the newer releases, the
  ParameterType and BuiltInParameterGroup enums on the older. The same shape
  ADD_PROJECT_PARAMETER uses for the same move. Reading a parameter's kind back
  follows the same split: `Definition.GetDataType()` from 2022,
  `Definition.ParameterType` before it. Switching uses
  `FamilyManager.MakeInstance` and `MakeType`, `FamilyParameter.Formula` and
  `AssociatedParameters`, and `Dimension.FamilyLabel` - all unchanged from 2020
  to 2027 (api-surface, read 2026-10-04).

  **WHAT SWITCHING REFUSES, AND THE ORDER IT TAKES.** A type formula cannot
  read an instance parameter, so going to instance a parameter moves before
  what its formula reads, and going to type after it - worked out from the
  formulas, never from the order the names arrive in. Refused by name before
  anything changes: a switch that would leave a type formula reading an
  instance parameter; to instance, a parameter a nested family's TYPE
  parameter is linked to, or a column of the type catalogue beside the saved
  family; and a built-in parameter. The read-back compares scope, formula,
  associated parameters (connector sizes, nested families) and labelled
  dimensions before and after, and throws on any difference.

  **RENAMING (version 3)** is `FamilyManager.RenameParameter(FamilyParameter,
  string)` and `FamilyParameter.IsShared`, both unchanged from 2020 to 2027
  (api-surface, read 2026-10-06). Revit rewrites formulas, keeps labels
  (`Dimension.FamilyLabel` holds the parameter, not its name) and keeps
  associations; the read-back finds each parameter again by its `Id`.
  Every formula that read an old name is read back showing the new one, every
  other formula is checked unchanged, and labelled dimensions and
  associations are counted before and after. Refused by name before anything
  changes: a SHARED parameter (its name comes with its GUID - replace it
  instead), a built-in one, a name the family does not have, a new name
  already in the family (capitals ignored), a character Revit refuses in a
  name, and a new name a formula would read as arithmetic - an operator
  anywhere in it, a digit first, or a word like if or pi.

  **THE SHARED KIND (version 4)** runs ADD_FAMILY_SHARED_PARAMETERS' code
  unchanged, with its calls: `Application.SharedParametersFilename`,
  `OpenSharedParameterFile`, `DefinitionFile.Groups`,
  `ExternalDefinition.GUID`, `FamilyParameter.IsShared` and `GUID`, 2020 to
  2027; `FamilyManager.AddParameter(ExternalDefinition, group, bool)` and
  `ReplaceParameter(FamilyParameter, ExternalDefinition, group, bool)` -
  BuiltInParameterGroup 2020 to 2024, ForgeTypeId from 2022 - picked by
  reflection, newest first; `DefinitionGroups.Create`,
  `DefinitionGroup.Definitions.Create(ExternalDefinitionCreationOptions)` with
  the options' constructor picked by reflection, ForgeTypeId first; the data
  types from `ParameterType` and `LabelUtils.GetLabelFor` (2020 to 2022) or
  `SpecUtils.GetAllSpecs()` and `LabelUtils.GetLabelForSpec` (2021 to 2027);
  `NamingUtils.IsValidName`. Built on all eight releases on 2026-11-01.

# ROUTING - see SET_FAMILY_SETTINGS for the whole family-building table.
#
#   "add a Width parameter to this family"   -> here
#   "make these family parameters instance"  -> here, switchExisting true
#   "rename the family parameter CC 1 to 2"  -> here, renameExisting true
#   "rename these walls / views / sheets"    -> EDIT_TEXT_VALUES field Name (elements, not
#                                               a family's parameters)
#   "rename this family"                     -> EDIT_TEXT_VALUES, field Family (RENAME_FAMILY until 2026-11-01)
#   "delete these family parameters"         -> DELETE_FAMILY_PARAMETERS
#   "add a shared parameter to the project"  -> ADD_PROJECT_PARAMETER
#   "add the shared parameter Equipment Tag to this family" -> here, kind
#                                               shared (ADD_FAMILY_SHARED_
#                                               PARAMETERS until 2026-11-01)
#   "replace the family parameter Width with the shared parameter Unit_Width"
#                                            -> here, replaceExisting true - a
#                                               family parameter becomes a
#                                               shared one
#   "our shared parameter file has no Gas Pipe Diameter - create it and add it
#    to this family"                       -> here, createMissing true
#   "which shared parameter file is Revit using" -> REPORT_SHARED_PARAMETER_FILE,
#                                               the read - run it FIRST
#
# VERSION 4 - WHERE ADD_FAMILY_SHARED_PARAMETERS' INPUTS AND OUTPUTS ARE NOW:
#   parameterNames, instance,       the same names, read by its own code
#   parameterGroup, replaceExisting,
#   createMissing
#   (no kind)                       kind shared - or empty with replaceExisting
#                                   or createMissing; another kind is refused,
#                                   the kind coming from the file
#   added, alreadyThere, replaced,  the same names
#   created, formulasReadBack,
#   keptLinks, sharedFile,
#   notAFamily, refused, findings
# RISK: ADMIN, its own (D-106), for every call now. THE SAFER RULE WHERE THEY
# DIFFERED: a name already in the family as a different parameter - another
# kind or scope, or shared where a family one was asked - refused that card's
# whole call, while this card left it alone, said so and added the rest. The
# refusal is kept, for every kind. NOTHING ELSE WAS OPPOSITE: switching and
# renaming are this card's; replacing and creating are that card's; asked
# together, they are refused as two jobs.
#   "put 600 into Width"                     -> SET_FAMILY_TYPE_VALUES
#   "what parameters has this family got"    -> REPORT_FAMILY_PARAMETERS

utterances:
  - add a Width parameter to this family
  - add family parameters for width depth and height
  - create type parameters Neck Width and Neck Depth
  - add an instance length parameter to the family
  - switch these parameters between type and instance
  - make all these parameters instance
  - change these type parameters to instance parameters
  - rename the parameter
  - rename the family parameter CC 1 to 2
  - rename these family parameters
  - call the CC parameter Pipe CC
  # MOVED 2026-11-01 from ADD_FAMILY_SHARED_PARAMETERS, merged into this card.
  - add the shared parameter Equipment Tag to this family
  - add shared parameters from our file to this family
  - put the office shared parameters into this family
  - add these shared parameters as type parameters under mechanical
  - replace the family parameter Width with the shared parameter Unit_Width
  - make the size parameters the shared parameters from our shared parameter file
  - make the gas pipe and liquid pipe diameters shared parameters, our shared parameter file does not have them
  - create the missing shared parameters in our shared parameter file and add them to this family
  # ...and ADD_FAMILY_SHARED_PARAMETERS's semantic identity, which nothing else declares:
  - add the office's shared parameters, from its shared parameter file, to the family being edited, or replace family parameters with them - creating in that file the ones it does not have yet

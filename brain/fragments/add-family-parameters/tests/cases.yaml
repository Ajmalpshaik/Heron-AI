positive:
  - given: >
      a new Generic Model family open in front, parameterNames "Width, Depth,
      Height", kind Length, instance false, parameterGroup empty, on Revit 2020
      AND again on 2024 - the two releases create by different calls
    expect: >
      all three added, each read back as a type length under Dimensions - and
      LOOKED AT in the Family Types dialog, with the three rows showing 0

  - given: the same request run a second time
    expect: >
      nothing added, all three in alreadyThere, and no second Width in Family
      Types

  - given: >
      SWITCHING (version 2). A scratch family made unsaved with
      CREATE_FAMILY_DOCUMENT, holding the PPR gate valve's shape in small: type
      A; B = A * 2 and C = B + 1 mm, both type formulas; a pipe connector sized
      by A; a dimension labelled B. switchExisting true, parameterNames all,
      instance true, kind and parameterGroup empty
    expect: >
      C, B, A switched in that order - read from the formulas, not the names -
      every one read back as instance, the connector still sized by A and the
      label still on B, and REPORT_FAMILY_PARAMETERS showing all three as
      instance with both formulas unchanged

  - given: the same family, now all instance, switched back with instance false
    expect: >
      A, B, C switched in that order, read back as type, the connector and the
      label kept

  - given: >
      RENAMING (version 3). A scratch family made for it and confirmed by its
      title - never GM_PipeSupport_* or a FamilyN the owner has open - holding
      CC 1 to 2 = 300 mm and CC 2 to 3 = 300 mm (type lengths), Total = CC 1 to
      2 + CC 2 to 3 (a type formula), and a dimension between two reference
      planes labelled CC 1 to 2. renameExisting true, parameterNames "CC 1 to
      2=Pipe CC 1 to 2; CC 2 to 3=Pipe CC 2 to 3", kind and parameterGroup
      empty, instance false
    expect: >
      renamed lists both, Old -> New; formulasReadBack shows Total = Pipe CC 1
      to 2 + Pipe CC 2 to 3; keptLinks shows Pipe CC 1 to 2 with 1 labelled
      dimension; REPORT_FAMILY_PARAMETERS shows the new names and no old one;
      and FLEX_FAMILY, Pipe CC 1 to 2 set to 450 mm, still moves the labelled
      plane - the label drives under its new name

  # VERSION 4 (2026-11-01), from ADD_FAMILY_SHARED_PARAMETERS - its own cases,
  # each run with kind "shared" (or kind empty with replaceExisting or
  # createMissing), the rest of the call as written. Each FAILS on version 3,
  # which refused kind shared as a kind it did not add, and had no
  # replaceExisting or createMissing. Run with the Admin switch on: this card is
  # ADMIN now.
  - given: >
      a family open in the Family Editor, and Revit's shared parameter file set
      to one holding "Heron Test Tag" (Text); parameterNames "Heron Test Tag",
      instance false, parameterGroup "Identity Data"
    expect: >
      added 1, reading the parameter, Text, type, and the file's GUID; Family
      Types showing it with the shared marker; a tag in a test project reading
      it once the family is loaded

  - given: the same call again
    expect: added empty, alreadyThere 1

  - given: >
      replaceExisting true (version 2): a family with a type Length family
      parameter "Width" labelling one dimension, a type Length "Half Width"
      with the formula "Width / 2", two types holding Width 600 and 900, and
      the shared parameter file holding "Heron Unit Width" (Length);
      parameterNames "Width=Heron Unit Width", instance false, parameterGroup
      empty
    expect: >
      replaced 1, "Width -> Heron Unit Width", Length, type, under the heading
      Width had, the file's GUID; no family parameter called Width left; the
      dimension labelled Heron Unit Width; formulasReadBack "Half Width = Heron
      Unit Width / 2"; keptLinks naming 1 labelled dimension and both types'
      values unchanged

  - given: >
      createMissing true (version 3): a family open in the Family Editor, and
      Revit's shared parameter file set to a SCRATCH COPY holding no
      "Refrigerant" group; parameterNames "Refrigerant: Heron Gas Pipe
      Diameter [Pipe Size], Refrigerant: Heron Liquid Pipe Diameter [Pipe
      Size]", instance false, parameterGroup "Mechanical"
    expect: >
      created 2, each with Pipe Size, group Refrigerant, a GUID and the file's
      own word for the data type; added 2 with those same GUIDs; findings
      naming the group made and that Undo does not reach the file; Manage >
      Shared Parameters on the scratch copy showing both under Refrigerant

  - given: >
      createMissing and replaceExisting true: a family with type Length family
      parameters "Gas Pipe Diameter" (12.7 mm) and "Liquid Pipe Diameter"
      (6.35 mm), each driving a pipe connector's diameter, and the scratch file
      without either name; parameterNames "Gas Pipe Diameter=Refrigerant: Gas
      Pipe Diameter [Length]; Liquid Pipe Diameter=Refrigerant: Liquid Pipe
      Diameter [Length]" - Length, as the family parameters hold; [Pipe Size]
      is refused as another kind, before the file is written - parameterGroup
      empty
    expect: >
      created 2, replaced 2 under the SAME names - or, if Revit refuses a
      shared parameter of the same name in place, a throw naming what the file
      now keeps and the family rolled back (DE6's question, answered here);
      the connector sizes and both values kept

  - given: the first createMissing call again
    expect: >
      created empty; "already in the shared parameter file" for each, nothing
      written; alreadyThere 2

negative:
  # VERSION 4 (2026-11-01): THE FACT CHANGED. Until the merge this was left
  # alone and SAID while the rest were added; the safer rule of
  # ADD_FAMILY_SHARED_PARAMETERS is kept now, for every kind. FAILS on version 3.
  - given: >
      parameterNames "Height, Width" where the family already has an INSTANCE
      Width, asked for as type lengths
    expect: >
      the WHOLE call refused naming Width as a different parameter under a
      familiar name - and Height NOT added either; Family Types unchanged
  - given: parameterNames "Width" where the family already has a TYPE length Width, asked for as a type length
    expect: alreadyThere naming Width, nothing added, no refusal - the same parameter, a re-run
  - given: parameterNames "Heron Test Tag", kind Text, where the family already has a SHARED "Heron Test Tag"
    expect: refused - a shared parameter is not the family parameter asked for - nothing added

  - given: kind "Lenght" (misspelt)
    expect: >
      refused listing the kinds it takes, and Family Types unchanged - no
      parameter of some other kind added in its place

  - given: parameterGroup "Dimension" where Revit calls it "Dimensions"
    expect: >
      refused with some of the real group names offered. Not the nearest
      group taken

  - given: >
      three names where the THIRD holds a character Revit refuses in a name
    expect: >
      the call refused with Revit's words and NONE of the three in Family
      Types afterwards - all or nothing, checked in the dialog

  - given: a project in front
    expect: notAFamily true and nothing added anywhere

  - given: >
      switchExisting true, parameterNames A alone, instance true - while B, a
      TYPE parameter, reads A in its formula
    expect: >
      refused naming B and its formula, before anything changes; A still type

  - given: >
      the family all instance, switchExisting true, parameterNames C alone,
      instance false - while C's formula reads B, which stays instance
    expect: refused naming C, and nothing switched

  - given: >
      switchExisting true, instance true, on a parameter a nested family's TYPE
      parameter is linked to - the gate valve's Nominal Diameter, if its nested
      symbol's link is a type one
    expect: >
      refused naming the parameter and the nested family's type parameter it
      drives. NOT YET RUN - the scratch family had no nested family

  - given: >
      switchExisting true, a built-in parameter such as Default Elevation, or a
      name the family does not have
    expect: refused by name, nothing switched

  - given: >
      switchExisting true, parameterNames all, in a family that holds a
      parameter really called All
    expect: >
      refused as ambiguous, nothing switched - never read as every parameter.
      NOT YET RUN in Revit

  - given: >
      switchExisting true, instance true, on an Image parameter (or all, in a
      family that has one)
    expect: >
      refused naming it before anything changes - Revit keeps an image
      parameter as type only. NOT YET RUN in Revit

  - given: >
      renameExisting true on the same scratch family, "CC 1 to 2=cc 2 to 3" -
      a new name already in the family, in other capitals
    expect: >
      refused naming 'cc 2 to 3' as already a parameter (as 'CC 2 to 3'),
      before anything changes; both parameters, Total's formula and the label
      read back exactly as before

  - given: >
      renameExisting true, "CC 1 to 2=Pipe CC 1-2" (an operator), "CC 1 to 2=2
      Pipe" (a digit first), "CC 1 to 2=Pipe:CC" (a character Revit refuses),
      and "CC 1 to 2 Pipe CC" (no =)
    expect: each refused by name, nothing renamed

  - given: >
      renameExisting true on a SHARED parameter, or a built-in such as Default
      Elevation, or a name the family does not have
    expect: >
      refused by name - the shared one told its name comes with its GUID -
      and nothing renamed, the other pairs in the same call included

  - given: switchExisting and renameExisting both true
    expect: refused as two jobs, nothing changed

  # VERSION 4, ADD_FAMILY_SHARED_PARAMETERS' negatives, with kind "shared".
  - given: parameterNames "Not In The File"
    expect: refused, naming the file and the close names, and nothing added

  - given: no shared parameter file set in Revit
    expect: refused - set the office's file in Manage > Shared Parameters - nothing added

  - given: the family already has a family (not shared) parameter "Heron Test Tag"
    expect: refused - two under one name - and nothing added

  - given: a project in front
    expect: notAFamily true, pointing to ADD_PROJECT_PARAMETER

  - given: >
      replaceExisting true, the same family and file, parameterNames "Width=Heron
      Test Tag" - a Text shared parameter for a Length
    expect: refused naming both kinds; replaced empty; Width still a family parameter

  - given: >
      replaceExisting true, "Heron Unit Width" already added beside Width and
      Width given the formula "Heron Unit Width" - the two-per-size workaround
    expect: >
      refused, naming the formula on Width and that Heron Unit Width is already
      in the family; replaced empty; nothing changed

  - given: replaceExisting true, "Width=Not In The File"
    expect: refused, naming the file and the close names; replaced empty

  - given: >
      createMissing true, the scratch file holding "Heron Test Tag" as Text;
      parameterNames "Identity Data: Heron Test Tag [Length]"
    expect: >
      refused - already in the file holding Text, not Length, never changed;
      created empty; the scratch file's bytes the same before and after

  - given: >
      createMissing true, "Heron New Thing [Length]" and "Refrigerant: Heron New
      Thing []"
    expect: refused twice - no group, no data type - neither chosen; nothing written to the file

  - given: >
      createMissing true, "Refrigerant: Heron Gas Pipe Diameter [Pipe Sise]"
    expect: >
      refused - not a data type this Revit offers - with Pipe Size among the
      close ones; the file not written

  - given: >
      createMissing true, "Refrigerant: Heron Test Tag2 [Text]" while the
      family already has a family parameter "Heron Test Tag2"
    expect: >
      refused - two under one name, pointing to replaceExisting - and the
      scratch file NOT written: the family's own checks come before the file

  - given: >
      createMissing absent, "Refrigerant: Heron Gas Pipe Diameter [Pipe Size]"
    expect: refused - createMissing is not on - nothing written

  - given: createMissing true, the scratch file marked read-only
    expect: refused - read-only - nothing written, nothing added
  - given: kind shared with switchExisting true
    expect: refused as two jobs, nothing changed and the shared parameter file not written
  - given: kind Length with replaceExisting true
    expect: refused - a shared parameter's kind comes from the file - nothing changed
  - given: kind Length, any names, with the Admin switch OFF
    expect: >
      refused by the switch before Revit is asked - this card is ADMIN since
      version 4, a plain family parameter included (the owner accepted that)

second_route:
  - >
      Family Types, New Parameter by hand for one of the same names, and its
      kind, scope and group compared with what this reports for its twin
  - >
      Family Types by hand: the Type / Instance choice on the same parameter,
      and its scope compared with what this reads back. For switching, the
      scope was also read by a second tool, REPORT_FAMILY_PARAMETERS, on
      2026-10-04
  - >
      For renaming: Family Types by hand, the formula column of the parameter
      that read the old name, compared with formulasReadBack; and FLEX_FAMILY
      driving the renamed label
  - >
      Family Types in the Family Editor: the parameter listed as shared; Manage
      > Shared Parameters shows the same name in the office's file

  - >
      After a replace, Family Types in the Family Editor: Heron Unit Width listed
      with the shared marker where Width was, its values per type the same, and
      the dimension's label reading Heron Unit Width

  - >
      After creating, the scratch shared parameter file opened in Notepad: a
      GROUP line Refrigerant and a PARAM line for each new name carrying the
      GUID `created` reported and that group's id; Manage > Shared Parameters
      listing them under Refrigerant as Pipe Size

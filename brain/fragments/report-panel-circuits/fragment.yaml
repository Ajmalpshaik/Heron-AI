heron-step: 17
heron-status: PROVEN
heron-since: 0.1.0
heron-layer: brain

id: FRG-MEP-064
semantic-identity: "what circuits are on each panel, with their loads and the panel totals"
kind: action
domain: revit.mep
capability: REPORT_PANEL_CIRCUITS
version: 1
source: OFFICIAL
risk: READ

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here (measured 2026-10-12).
#
# EVERY VALUE IS REVIT'S OWN TEXT, read with AsValueString, in the project's
# units and symbols as the panel schedule prints them. Electrical values are
# not stored in SI inside Revit, so nothing is converted by hand here.
#
# A CIRCUIT ON NO PANEL IS LISTED APART: it appears on no panel schedule
# anywhere, which is easy to miss.
#
# READ ONLY - opens no transaction.
purpose: >
  Reads the electrical circuits fed from each panel - circuit number, load
  name, rating, poles, apparent load, voltage and devices - with the panel's
  connected and demand load. One panel by its Panel Name, or all of them.

contract:
  needs:
    - name: doc
      type: Document
    # Optional. One panel by its Panel Name; empty reads every panel.
    - name: panelName
      type: string
      source: request
  provides:
    - name: schedule
      # ONE STRING, a line per panel and per circuit, because a list reaches
      # the chat cut to three entries and the table is the answer.
      role: result
      type: string
    - name: panelCount
      role: result
      type: int
    - name: circuitCount
      role: result
      type: int
    - name: unassigned
      # Circuits fed from no panel - on no panel schedule anywhere. Read only
      # when every panel is asked for (D-52).
      role: accounting
      type: IList<ElementId>
    - name: findings
      type: IList<string>


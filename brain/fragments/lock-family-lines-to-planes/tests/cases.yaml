positive:
  - given: >
      a new family from the metric Detail Item template, Revit 2020, a scratch
      copy SAVED under %TEMP%\heron-work\line-lock (never the owner's own
      families); an instance length parameter "Length" 600; reference planes
      "Tip" at X 600, labelled Length from "Center (Left/Right)", and "Head
      Base" at X 300, labelled Length / 2 from "Center (Left/Right)"; "Head
      Top" / "Head Bottom" at Y 80 / -80; a detail line "path 0,0; 300,0" (the
      shaft) and a Solid Black filled region "polygon 300,80 600,0 300,-80"
      (the head); lines = the line's id and the region's id, planes "Center
      (Left/Right), Center (Front/Back), Head Base, Tip, Head Top, Head Bottom"
    expect: >
      the shaft locked ALONG "Center (Front/Back)", its tail end to "Center
      (Left/Right)", its head end to "Head Base"; the head's base edge ALONG
      "Head Base", its corners to "Head Top" and "Head Bottom" once each, the
      tip corner to "Tip" and "Center (Front/Back)" once each - eight locks,
      each LOOKED AT as a closed padlock; ends read back unchanged

  - given: >
      VERSION 2 (row 5b-1495) - the same family, a plain detail line drawn by
      DRAW_FAMILY_DETAIL_LINES in "Ref. Level" BESIDE the filled region (the
      shaft, and the control "path 0,-200; 300,-200"); the family's own Sketch
      on "Ref. Level", owned by no form or region, lists both in its profile;
      lines = the control line's id alone, planes "Center (Left/Right)"
    expect: >
      the control line taken as a DETAIL LINE - its tail end locked to "Center
      (Left/Right)" - and never refused as "belongs to a form's sketch"; and
      with lines = "all", the shaft, the control and the region are all
      targets, the region's three edges once each through the region, none of
      them twice

  - given: >
      the same family after the call above, Length set to 900 in Family Types,
      then the same call run again
    expect: >
      nothing new locked, every lock said as already there; ends read back
      "(0, 0) to (450, 0)" for the shaft and the head's corners at (450, 80),
      (900, 0), (450, -80) - the slanted edges re-drawn between them; Length
      300 does the same at 150 / 300. NOT A CONTROL (row 5b-1579): a detail
      line drawn beside it and never locked FOLLOWS too - Revit's own
      Automatic Sketch Dimensions tie its ends to the nearest planes - so an
      unlocked line moving is no evidence against the lock; the lock is read
      back by REPORT_FAMILY_FORMS ("locked along", "locked at an end")


  # VERSION 3 (2026-11-12, row 5b-1576) - an arc's centre. Group NQ.
  - given: >
      the SAVED scratch family "R24 Arc Lock" (Metric Detail Item, Revit 2024,
      %TEMP%/heron-work/rev2024 - never the owner's own families); a type
      length parameter "Arc X" 200 labelling "Center (Left/Right)" to plane
      "Arc X" at X 200; plane "Arc Y" at Y 100; a detail arc centred (200, 100),
      radius 100, drawn "path 300,100; arc 200,200 100,100"; lines = the arc's
      id, planes "Arc X, Arc Y"
    expect: >
      two locks - the centre of the arc to "Arc X" and to "Arc Y" - each read
      back locked; Center Mark Visible switched on and said if it was off; the
      arc's ends read back unchanged

  - given: >
      the same family after the call above KEPT, "Arc X" set to 300 in Family
      Types
    expect: >
      the arc read back centred at (300, 100), radius 100 - it followed the
      plane - while a shaft "path -300,0; 0,0" drawn beside it and never locked
      still reads (-300, 0) to (0, 0)
negative:
  - given: >
      ALL OR NOTHING - the same lines, planes "Tip, Spare" where "Spare" is a
      plane at X 1000 that nothing touches
    expect: >
      refused before anything is locked, naming the nearest end (the tip) 400
      mm off "Spare" - and NO lock on "Tip" either

  - given: >
      the same lines, planes "Tip, Tip Copy" where "Tip Copy" is a second
      plane at X 600, coinciding with "Tip" - neither defines the origin
    expect: >
      refused as two coinciding planes with nothing to say which the tip
      should follow - and nothing locked

  - given: >
      the same lines and a second detail line drawn in a different view where
      "Tip" is not seen edge on, its end touching "Tip"; planes "Tip"
    expect: >
      refused, naming that line and its view - and NO lock on the head's tip
      either (never a partial answer)

  - given: the shaft alone, planes "Ref. Level"
    expect: refused as not seen edge on in the view, and nothing locked

  - given: >
      lines = the id of a MODEL line drawn loose in the family (no form, no
      region), planes "Center (Left/Right)"
    expect: >
      refused as a model line, not a detail or symbolic line - never as a
      form's sketch line - and nothing locked

  - given: lines = the id of a reference plane
    expect: refused as not a detail line, symbolic line or filled region, nothing locked

  - given: a project in front
    expect: notAFamily true and nothing locked anywhere


  # VERSION 3 (2026-11-12).
  - given: >
      the same arc, planes "Spare" - a plane at X 500 its centre is not on
    expect: >
      refused before anything is locked, naming the arc's centre 300 mm off
      "Spare"; nothing locked
second_route:
  - >
      by hand on a copy: Align, the plane, the shaft or its end, the padlock;
      Edit Boundary on the head, Align each corner to its planes, the padlock;
      both copies set to Length 900 and 300 side by side and their ends read

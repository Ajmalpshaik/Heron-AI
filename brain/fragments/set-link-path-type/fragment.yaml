# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# Relative paths let a project folder move as one; absolute paths hold the
# whole drive path. Revit forbids switching to or from Server, so Revit Server
# and cloud links are named and left alone.
#
# READ BACK: each link type's path type after the change.
#
# RELOAD_LINKS reloads; LINK_FILES makes new links.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Switches how Revit links store their path - Relative or Absolute - for one
  link or every link, as Manage Links' Path Type column does.

contract:
  needs:
    - name: doc
      type: Document
    # One link by its name or the start of it; an EMPTY value is every link.
    - name: linkName
      type: string
      source: request
    # "relative" or "absolute".
    - name: pathType
      type: string
      source: request
  provides:
    - name: changed
      role: result
      type: int
    - name: alreadyThat
      # Links already of that path type (D-52).
      role: accounting
      type: int
    - name: report
      # ONE STRING with every link left alone and why (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>


compatibility-note: >
  One implementation for every release, no #if. TextElement, TextNote,
  TextElementType, ModelTextType, ElementType.FamilyName,
  Document.IsFamilyDocument, Element.GetTypeId and the parameters TEXT_SIZE,
  TEXT_FONT, TEXT_WIDTH_SCALE, TEXT_STYLE_BOLD, TEXT_STYLE_ITALIC,
  TEXT_STYLE_UNDERLINE, TEXT_BACKGROUND, LINE_COLOR, TEXT_COLOR, LINE_PEN,
  TEXT_BOX_VISIBILITY, LEADER_OFFSET_SHEET, TEXT_TAB_SIZE and
  LEADER_ARROWHEAD are present 2020 through 2027 - read off the shipped
  RevitAPI.dll for all eight with tools/api-surface on 2026-10-21. Lengths are
  read in Revit's internal feet and turned into millimetres by 304.8 (D-20),
  so neither the 2021 units change nor the 2022 spec change reaches this code.
  AnnotationLabel (2027) is a TextElement, so it is counted as a label with
  no #if.

# ROUTING - rows for these sentences are in SET_TEXT_TYPE too.
#
#   "how big is the label text in this family"    -> here, textTypeName labels
#   "which text styles does this project have"    -> here
#   "change the label text height to 5 mm"        -> SET_TEXT_TYPE, the write
#   "make a 2.5 mm text type"                     -> SET_TEXT_TYPE, duplicateAs
#   "make the model text 200 high"                -> ADD_FAMILY_MODEL_TEXT -
#                                                    model text is 3D, not a
#                                                    text type here
#   "what does this text note say"                -> READ_ELEMENT_PARAMETERS,
#                                                    parameterName Text
#
# MEASURED 2026-10-21 (row 5b-1300), main against the branch: "make the
# label text bold" and "make the text note type italic" - changes - reach
# THIS read on lexical and the trained model, with SET_TEXT_TYPE below it.
# A change asked for and a read given changes nothing; recorded, not chased -
# the wording that pulled them to the write also pulled "is the first line
# of the note bold" there (SET_TEXT_TYPE's comment).

# Written in the session's words, not the modeller's - he gave only the
# change (SET_TEXT_TYPE's four). Kept apart from the sentences frozen to
# measure this card (row 5b-1300), so the measurement is not its own words
# read back.
utterances:
  - show the text type settings of the tag labels
  - how big is the label text in this family
  - which text styles does this project have
  - what font and size is this text type

# sheet per view and many sheets per schedule is Revit's rule; a schedule
# TEMPLATE refused by name; Revit's refusal, and a placement that made
# nothing, said and never counted; and `placedAt`, each placement read back
# in millimetres from the instance's own point.
#
# THE SAFER RULE IN EACH CONFLICT IS KEPT. That card placed on a PLACEHOLDER
# sheet if Revit let it; here a placeholder is refused by name in
# sheetProblem. That card put every schedule at the one point; here several
# go on the grid, as several views do - a pile of schedules at one corner is
# the stacked-viewport failure again. Its atXMm and atYMm are `at` here, in
# mm, read by the binder.
#
# WHERE ITS OUTPUTS ARE NOW: placed -> placed (the instance ids),
# refused (sentences) -> refused (ids) with each reason in notDone, placedAt
# -> placedAt. Its sentences moved here.


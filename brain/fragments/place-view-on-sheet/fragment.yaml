# VERSION 5 (2026-11-01, on the owner's word in the brief of that day's
# session - Ajmal PS asked, after a duct length schedule on his Revit 2020 job
# model could not have its Length column set to metres, for every schedule
# setting Heron was missing to be built; FRAGMENT-ISSUES row 5b-1367,
# numbered 5b-1363 until main took that number). SPLIT A SCHEDULE AND PLACE
# ITS SEGMENTS, on the placing job: `splitInto` ("3" equal segments, or
# heights in mm "200, 150") and `segment` ("2", 1 the top one, or "all", side
# by side). Built the same day as PLACE_SCHEDULE_ON_SHEET's version 2 on a
# branch, and carried here because that card was merged into this one. Both
# are `optional: true` with `absent: none`, so every caller of version 4 is
# bound "none" twice and gets version 4 to the letter. Schedules only - a view
# in the same call is placed as version 4 places it; asked with oldViewId, the
# swap, refused whole. Split, IsSplit, GetSegmentCount, SegmentIndex and the
# five-argument ScheduleSheetInstance.Create are 2022 and later, reached by
# name: on 2020 and 2021 a split or a segment refuses that schedule in plain
# words and places nothing for it. Version 3's proof below no longer described
# the code and was kept as a record; the card was DRAFT at the time, until
# NEEDS-CHECKING Group KK proves version 5 and the owner signs.
version: 5
source: OFFICIAL
risk: MODIFY

purpose: >
  Places views onto a sheet as viewports. The last step of drawing production,
  and the one that turns a model into something that gets issued.

  **A view can be on only ONE sheet, and Revit refuses the second attempt.**
  That is not a quirk to work around — it is why the refusal is reported by
  name rather than allowed to abandon a batch of thirty. The usual cause is a
  view already placed on a sheet somebody else made.

  **Asked before attempted.** `Viewport.CanAddViewToSheet` is Revit's own
  answer and it covers the cases that are otherwise exceptions: a view already
  placed, a schedule that needs a different call, a view template.

  **Version 3: several views are laid out, never stacked.** One view goes at
  the point given, or the middle of the sheet. Several go on a grid across the
  sheet, sized to the views that will place, and `distinctPositions` reads back
  how many landed in different places - placed 3 with distinctPositions 1 is a
  pile, and the answer says so. A placeholder sheet is refused by name in
  `sheetProblem`. Version 2's proof no longer describes the code and is kept as
  a record; the card is DRAFT until it is proved again.

  **The views may be handed on** (version 3): with none named, the views
  FIND_VIEWS found unplaced, or the ones selected, are placed; anything handed
  on that is not a view is refused by id. Views named always win.

  **Version 2: replace one view with another on its sheets.** Name an
  `oldViewId` and the one view in `views` takes its place, and the old view
  comes off - read back in `swapped`, and anything not done said in `notDone`.

  **Version 4 places schedules too**, as a schedule goes on a sheet - not as a
  viewport. The point is a viewport's CENTRE but a schedule's TOP-LEFT
  corner: a schedule hangs from it and grows down and to the right.
  `placedAt` reads each one back in millimetres and says which. A view can be
  on one sheet only and the second is refused; a schedule can be on many, so
  a schedule already placed elsewhere is placed again - Revit's rule.
  Version 3's proof is not this code; the card is DRAFT until proved again.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

# VERSION 2, IN FULL (FRAGMENT-ISSUES row 5b-540, NEEDS-CHECKING Group FC).
# Kept here rather than in `purpose:` because purpose is indexed for search:
# measured 2026-10-17, the longer text took this card's own placing sentences
# down the keyword ranking ("add the view to the drawing sheet" #2 -> #15) and
# drew sheet questions towards a change.
#
# WHAT IT DOES. With an `oldViewId`, the one view in `views` goes where the old
# view sits - on every sheet the old view is on, or only on `sheetId` when one
# is named - and the old view comes off those sheets. The old view stays in
# the project. Any view a sheet can hold: a legend (on many sheets), a drafting
# view, a plan or a section (on one sheet only, so the new one must not be on
# a sheet already), and a schedule. Found on a real job: a shop-drawing legend
# on four sheets whose as-built copy has to go exactly where it is.
#
# A VIEWPORT'S VIEW IS REPLACED, NOT CHANGED. A new viewport at the old one's
# box centre, given the old viewport's TYPE (title shown or not), its rotation
# and - on Revit 2022 and later - its title's position; then the old viewport
# is deleted, and the new one takes its detail number (a callout elsewhere
# points at it) and is pinned if the old one was. A schedule is a ScheduleSheetInstance hanging from its top-left
# corner, so the new schedule takes the old one's corner, not its centre. `at`
# is an OFFSET here, in mm from where the old view sat - 0,0,0 is the job.
#
# READ BACK, SHEET BY SHEET. Each `swapped` line names the sheet number, the
# old view gone, the new one there, how far the new centre (a schedule's
# corner) is from the old one in mm, and the viewport type kept. More than
# 0.1 mm from where it was asked to go is not kept. A sheet where it could not
# be done - the new view already on that sheet, a plan already on another
# sheet, Revit refusing - is rolled back whole, keeps the old view exactly
# where it was, and is named in `notDone` with the reason. Never silently
# skipped. The whole run is still one undo.
#
# A SPLIT SCHEDULE IS REFUSED, NOT REBUILT (Revit 2022 and later), and a title
# block's revision schedule is never swapped - it belongs to the title block.

contract:
  needs:
    - name: doc
      type: Document
    - name: sheetId
      # The sheet, by its NUMBER. Version 2 lets it be left out: when an
      # oldViewId is named, left out means EVERY sheet the old view is on.
      # Placing still needs it, and is refused in notDone without one.
      type: ElementId
      source: request
      optional: true
      absent: none
    - name: views
      # Placing: the views to put on the sheet - schedules among them since
      # version 4, each placed as a schedule is. Replacing: the ONE new view.
      # Version 3 review fix: OPTIONAL - left out it is an empty list
      # (HeronBindingNote.AbsentValue's IList<View> case), and the views are
      # then taken from `elements`. Named, they ALWAYS win.
      type: IList<View>
      source: request
      optional: true
    - name: elements
      # Version 3 review fix, from PLACE_VIEWS_ON_SHEET: views HANDED ON -
      # FIND_VIEWS' answer, placement unplaced, or the views selected - read ONLY when
      # `views` names none, so a selection never adds a view nobody named. An
      # element that is not a view is refused by id, never placed. Nothing
      # filling it binds empty (HeronBindingNote.EmptyWhenAbsent).
      type: IList<Element>
      optional: true
    - name: at
      # Version 4: for a VIEW the point is its viewport's CENTRE; for a
      # SCHEDULE it is the schedule's TOP-LEFT CORNER - it hangs from there.
      # Placing: the point on the sheet, in mm, for ONE view (version 3);
      # several views go on a grid and the point is not used - `layout` says
      # so. Left out, or 0,0,0, one view goes to the middle of the sheet.
      # Replacing: an offset in mm from where the old view sat - left out,
      # or 0,0,0, is exactly there.
      type: XYZ
      source: request
      optional: true
      absent: 0,0,0
    - name: oldViewId
      # Version 2. The view to take OFF the sheets - the new view goes where it
      # is. Left out, or none, is the placing job exactly as version 1 did.
      type: ElementId
      source: request
      optional: true
      absent: none
    # VERSION 5. Split each schedule placed: "3" equal segments, or heights in
    # mm "200, 150", top first. Left out ("none"): no split, version 4.
    - name: splitInto
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 5. Which segment of a split schedule to place: "2" (1 the top
    # one) or "all" side by side. Left out ("none"): version 4's call.
    - name: segment
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: placed
      role: result
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      # Placing: the views it declined. Replacing: the SHEETS left as they
      # were, each with its reason in notDone.
      role: accounting
      type: IList<ElementId>
    - name: swapped
      # Version 2. One line per old view replaced, read back from the model:
      # sheet number, old view gone, new view there, how far the new centre
      # (a schedule's corner) is from the old one in mm, the viewport type kept.
      role: result
      type: IList<string>
    - name: notDone
      # Version 2. Every sheet where the replacing could not be done, with why,
      # and why nothing was done at all when the views named cannot be swapped.
      # Never a thing it did (D-52).
      role: accounting
      type: IList<string>
    - name: placedCount
      # Version 3, from PLACE_VIEWS_ON_SHEET (its `placed`, an int there). How
      # many viewports this run made - the length of placed, read from what
      # was made, never from what was asked.
      role: result
      type: int
    - name: distinctPositions
      # Version 3, from PLACE_VIEWS_ON_SHEET. How many of the viewports this
      # run made sit in DIFFERENT places, read back from the model after
      # creation and rounded to the millimetre, per sheet. WHEN PLACEDCOUNT IS
      # 3 AND THIS IS 1 THE VIEWS ARE A PILE - a count of placements cannot
      # tell a populated sheet from one. Reported for every run.
      role: result
      type: int
    - name: sheetProblem
      # Version 3, from PLACE_VIEWS_ON_SHEET. Placing: what was wrong with the
      # sheet - none named, not a sheet, or a PLACEHOLDER, refused by name.
      # Empty when the sheet could hold views. A sheet number no sheet has is
      # refused by the binder before this runs, capitals ignored. A refusal,
      # never a view it placed (D-52).
      role: accounting
      type: string
    - name: layout
      # Version 3. How the views were arranged: one at the point given, one at
      # the middle of the sheet, or several on a grid of columns x rows - and,
      # when a point was given with several views, that it was not used. Empty
      # for the swap job. Never a thing it placed (D-52). Version 4: when a
      # schedule is placed, also which point is its corner and which a
      # viewport's centre.
      role: accounting
      type: string
    - name: placedAt
      # Version 4, from PLACE_SCHEDULE_ON_SHEET. Placing: one line per thing
      # placed, READ BACK from the model in mm from the sheet origin - "'Duct
      # Schedule' on sheet A101 at 50 mm, 250 mm from the sheet origin - its
      # top-left corner", or "... - its viewport's centre". The number
      # somebody checks against the drawing. Empty for the swap job, whose
      # lines are in `swapped`.
      role: result
      type: IList<string>


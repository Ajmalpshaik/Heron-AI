id: FRG-VIEW-015
semantic-identity: "put these views onto a sheet"
kind: action
domain: revit.views
capability: PLACE_VIEW_ON_SHEET
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Places views onto a sheet as viewports. The last step of drawing production,
  and the one that turns a model into something that gets issued.

  **A view can be on only ONE sheet, and Revit refuses the second attempt.**
  That is not a quirk to work around — it is why the refusal is reported by
  name rather than allowed to abandon a batch of thirty. The usual cause is a
  view already placed on a sheet somebody else made.

  **Asked before attempted.** `Viewport.CanAddViewToSheet` is Revit's own
  answer and it covers the cases that are otherwise exceptions: a view already
  placed, a schedule that needs a different call, a view template.

  **Position is a stated input and is not laid out.** Where a viewport sits, at
  what scale, aligned with what on the sheet beside it, is drafting judgement
  worth its own capability. Placing at a given point is the honest, predictable
  starting point — a viewport that exists can be dragged; one never placed
  cannot.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: sheetId
      type: ElementId
      source: request
    - name: views
      type: IList<View>
      source: request
    - name: at
      type: XYZ
      source: request
  provides:
    - name: placed
      role: result
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>


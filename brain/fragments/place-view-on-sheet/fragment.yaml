revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Viewport.Create` and
  `Viewport.CanAddViewToSheet` are unchanged 2020 to 2027, and both the sheet
  and the views arrive as objects so nothing here builds an ElementId from an
  integer.

# ROUTING - repeated in DUPLICATE_VIEW and CREATE_3D_VIEW.
#
#   "put this view on a sheet"      -> here
#   "make a new sheet"              -> CREATE_SHEET. Creating the sheet and
#                                      placing on it stay different jobs; both
#                                      are built now, and the chain is
#                                      CREATE_SHEET then here
#   "list the sheets"               -> LIST_SHEETS. A QUESTION about what
#                                      sheets exist, and it must not be
#                                      answered by the fragment that puts
#                                      things on them
#   "which sheets are empty"        -> LIST_SHEETS
#   "duplicate this view"           -> DUPLICATE_VIEW - and note a duplicate is
#                                      how you get a view that CAN go on a
#                                      second sheet, since the original cannot
#   "put the SCHEDULE on a sheet"   -> PLACE_SCHEDULE_ON_SHEET. A schedule goes
#                                      on as a ScheduleSheetInstance, not a
#                                      viewport - which is the "schedule that
#                                      needs a different call" named above.
#                                      This fragment refused them correctly
#                                      with nothing to hand them to until
#                                      2026-09-04. Note a schedule CAN be on
#                                      many sheets, so the one-sheet rule above
#                                      does not carry across
#
# "A VIEW CAN ONLY BE ON ONE SHEET" IS THE RULE BEHIND HALF THE REFUSALS HERE,
# and duplicating is the answer to it.

utterances:
  - put this view on a sheet
  - place these views on the sheet
  - add the view to the drawing sheet
  - drop this plan on a sheet
  - put them on the sheet

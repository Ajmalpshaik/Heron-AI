compatibility-note: >
  One implementation for every release. `Viewport.Create` and
  `Viewport.CanAddViewToSheet` are unchanged 2020 to 2027, and both the sheet
  and the views arrive as objects so nothing here builds an ElementId from an
  integer.

  Version 2, read with tools/api-surface one release at a time on 2026-10-17:
  `Viewport.GetBoxCenter`, `SetBoxCenter`, `Rotation`, `SheetId`, `ViewId`,
  `ScheduleSheetInstance.Create` (four arguments), `Point`, `Rotation`,
  `ScheduleId` and `IsTitleblockRevisionSchedule` are the same 2020 to 2027.
  Two things differ, each behind `#if REVIT2020 || REVIT2021`:
  `Viewport.LabelOffset` - the title's position - exists from 2022, so 2020
  and 2021 leave the title where Revit draws a new viewport's and say so on
  each line; and `ViewSchedule.IsSplit` exists from 2022, the release that
  brought split schedules, so 2020 and 2021 have nothing to refuse.

  `Viewport.ViewId` has a SETTER from 2023 (with `IsViewIdValidForViewport`),
  so 2023 and later could change a viewport's view in place. It is not used:
  2020 to 2022 cannot, and one path - a new viewport at the old box centre, the
  old one deleted - keeps every release the same run, read back the same way.

# ROUTING - repeated in DUPLICATE_VIEW and CREATE_3D_VIEW.
#
#   "put this view on a sheet"      -> here
#   "make a new sheet"              -> CREATE_SHEET. Creating the sheet and
#                                      placing on it stay different jobs; both
#                                      are built now, and the chain is
#                                      CREATE_SHEET then here
#   "list the sheets"               -> LIST_SHEETS. A QUESTION about what
#                                      sheets exist, and it must not be
#                                      answered by the fragment that puts
#                                      things on them
#   "which sheets are empty"        -> LIST_SHEETS
#   "duplicate this view"           -> DUPLICATE_VIEW - and note a duplicate is
#                                      how you get a view that CAN go on a
#                                      second sheet, since the original cannot
#   "put the SCHEDULE on a sheet"   -> PLACE_SCHEDULE_ON_SHEET. A schedule goes
#                                      on as a ScheduleSheetInstance, not a
#                                      viewport - which is the "schedule that
#                                      needs a different call" named above.
#                                      This fragment refused them correctly
#                                      with nothing to hand them to until
#                                      2026-09-04. Note a schedule CAN be on
#                                      many sheets, so the one-sheet rule above
#                                      does not carry across
#
# "A VIEW CAN ONLY BE ON ONE SHEET" IS THE RULE BEHIND HALF THE REFUSALS HERE,
# and duplicating is the answer to it.

# ROUTING (2026-10-14, FRAGMENT-ISSUES row 5b-471) - repeated in PLACE_VIEWS_ON_SHEET.
# The two cards overlap and neither named the other until then.
#
#   "put this view on a sheet"         -> here - each view at the point given, `at`
#   "put these views on a sheet"       -> PLACE_VIEWS_ON_SHEET, which lays them out on a
#                                         grid by itself and counts how many landed
#                                         in DISTINCT positions - the job when no
#                                         point is given

# ROUTING (2026-10-17, FRAGMENT-ISSUES row 5b-540) - version 2.
#
#   "swap the NOTES legend for AS-BUILT NOTES on all sheets"
#                                      -> here, oldViewId NOTES, views AS-BUILT NOTES
#   "what views are on this sheet"     -> LIST_VIEWS_ON_SHEET. A QUESTION, and it
#                                         must never reach a change that takes a
#                                         view off a sheet
#   "which views are not on a sheet"   -> FIND_UNPLACED_VIEWS, the same
#   "which sheets is this legend on"   -> LIST_VIEWS_ON_SHEET version 2, viewName =
#                                         the legend - the question to ask BEFORE
#                                         this job, and never answered by it
#   "is this view already on a sheet"  -> LIST_VIEWS_ON_SHEET, the same. It reached
#                                         this card with the re-ranker until declared
#                                         there (row 5b-540)
#   "line the viewports up across the sheets"
#                                      -> ALIGN_VIEWPORTS_ACROSS_SHEETS - same
#                                         view stays, only its place changes
#   "point the reference at another view"
#                                      -> REPOINT_VIEW_REFERENCE - a callout or
#                                         section head, not a viewport


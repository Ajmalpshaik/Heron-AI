#
# WHERE PLACE_VIEWS_ON_SHEET'S OUTPUTS ARE NOW: placed (int) -> placedCount,
# distinctPositions -> distinctPositions, notPlaced -> refused, sheetProblem ->
# sheetProblem. Its sentences and its routing rows moved here.
#
# ROUTING - PLACE_VIEWS_ON_SHEET's rows, moved here with it.
#
#   "put this view on a sheet"         -> here - at the point given, or the middle
#   "put these views on a sheet"       -> here - laid out on a grid, and the
#                                         distinct positions counted
#   "which views are not on a sheet"   -> FIND_VIEWS, placement unplaced, the read that
#                                         comes before this write

# VERSION 4 (2026-11-01) - PLACE_SCHEDULE_ON_SHEET WAS MERGED INTO THIS CARD
# on the owner's instruction ("make sure there is no duplicate tools"), and is
# DEPRECATED. The same job - put this on a sheet at a point, read back where

compatibility-note: >
  One implementation for every release. `Viewport.Create` and
  `Viewport.CanAddViewToSheet` are unchanged 2020 to 2027, and both the sheet
  and the views arrive as objects so nothing here builds an ElementId from an
  integer.

  Version 2, read with tools/api-surface one release at a time on 2026-10-17:
  `Viewport.GetBoxCenter`, `SetBoxCenter`, `Rotation`, `SheetId`, `ViewId`,
  `ScheduleSheetInstance.Create` (four arguments), `Point`, `Rotation`,
  `ScheduleId` and `IsTitleblockRevisionSchedule` are the same 2020 to 2027.
  Two things differ, each behind `#if REVIT2020 || REVIT2021`:
  `Viewport.LabelOffset` - the title's position - exists from 2022, so 2020
  and 2021 leave the title where Revit draws a new viewport's and say so on
  each line; and `ViewSchedule.IsSplit` exists from 2022, the release that
  brought split schedules, so 2020 and 2021 have nothing to refuse.

  `Viewport.ViewId` has a SETTER from 2023 (with `IsViewIdValidForViewport`),
  so 2023 and later could change a viewport's view in place. It is not used:
  2020 to 2022 cannot, and one path - a new viewport at the old box centre, the
  old one deleted - keeps every release the same run, read back the same way.

  Version 5: `ViewSchedule.Split(int)`, `Split(IList<double>)`, `IsSplit`,
  `GetSegmentCount`, `ScheduleSheetInstance.SegmentIndex` and the five-argument
  `ScheduleSheetInstance.Create` are in the 2022 to 2027 reference packages
  and not 2020 or 2021 (Autodesk's notes give 2022.1), read off the shipped
  assemblies on 2026-11-01. They are reached by name at run time, so the
  placing job's body is one for every release; `get_BoundingBox(View)` and
  `Document.Regenerate` are unchanged 2020 to 2027.

# ROUTING - repeated in DUPLICATE_VIEWS and CREATE_3D_VIEW.
#
#   "put this view on a sheet"      -> here
#   "make a new sheet"              -> CREATE_SHEETS. Creating the sheet and
#                                      placing on it stay different jobs; both
#                                      are built now, and the chain is
#                                      CREATE_SHEETS then here
#   "list the sheets"               -> FIND_SHEETS. A QUESTION about what
#                                      sheets exist, and it must not be
#                                      answered by the fragment that puts
#                                      things on them
#   "which sheets are empty"        -> FIND_SHEETS
#   "duplicate this view"           -> DUPLICATE_VIEWS - and note a duplicate is
#                                      how you get a view that CAN go on a
#                                      second sheet, since the original cannot
#   "put the SCHEDULE on a sheet"   -> here, since version 4 (PLACE_SCHEDULE_ON_
#                                      SHEET was merged in, 2026-11-01). A
#                                      schedule goes on as a ScheduleSheetInstance,
#                                      not a viewport - the "schedule that needs
#                                      a different call" named above - hanging
#                                      from its top-left corner. A schedule CAN
#                                      be on many sheets, so the one-sheet rule
#                                      above does not carry across
#   "make a sheet list"             -> CREATE_SCHEDULE, listKind sheets - a NEW
#                                      schedule of every sheet, which is what
#                                      "put the schedule on the sheet" once
#                                      returned
#   "which schedules are there"     -> FIND_VIEWS, viewType Schedule
#   "export it instead"             -> EXPORT_SCHEDULE_TO_CSV
#
# "A VIEW CAN ONLY BE ON ONE SHEET" IS THE RULE BEHIND HALF THE REFUSALS HERE,
# and duplicating is the answer to it.

# VERSION 3 (2026-11-01) - PLACE_VIEWS_ON_SHEET WAS MERGED INTO THIS CARD on
# the owner's instruction ("now merge the other duplicates also"), and is
# DEPRECATED. The same job - views onto one sheet as viewports, each asked
# first, a view already on another sheet refused by id and never moved - and
# this card also swaps one view for another (version 2, kept whole). What
# PLACE_VIEWS_ON_SHEET had and this card lacked is here now: a grid of only the
# views that will place, distinctPositions read back to the millimetre, a
# placeholder sheet refused by name in sheetProblem, and a count of what was
# placed as an int (placedCount - `placed` here was already the viewport ids).
# Its sheet was found by number ignoring capitals; here the binder does that
# for sheetId before the run, and refuses a number no sheet has.
#
# ONE RULE WAS OPPOSITE, AND THE SAFER ONE IS KEPT (the owner's answer,
# 2026-11-01: in every conflict keep the safer rule). This card stacked every
# view at the one point `at`; PLACE_VIEWS_ON_SHEET laid them out. Several views
# now go on the grid; a point given is used for a single view only - NOT as
# the grid's start corner - and layout says when it was not used.
# distinctPositions is reported for every run. `at` is optional now.
#
# CARRIED BY THE REVIEW FIX OF 2026-11-01 (first recorded here as NOT
# CARRIED): PLACE_VIEWS_ON_SHEET took its views as `elements`, so
# FIND_UNPLACED_VIEWS chained straight in. Now this card takes `elements` too,
# read ONLY when `views` names none - an explicit list always wins, so a
# selection cannot add a view the caller did not name - and each element that
# is not a view is refused by id. It needed the add-in to bind an absent view
# LIST, which it did not (HeronBindingNote.AbsentValue bound an optional bool

compatibility-note: >
  One implementation for every release. `ScheduleField.ColumnHeading`,
  `GridColumnWidth`, `HorizontalAlignment`, `HeadingOrientation` and `GetName`
  are present and unchanged 2020 through 2027.

  **The two enums are `ScheduleHorizontalAlignment` (`Left`, `Center`, `Right`)
  and `ScheduleHeadingOrientation` (`Horizontal`, `Vertical`)** - read out of the
  property signatures on 2020 and on 2027, not assumed from the property names.
  `HorizontalAlignmentStyle` also exists on every release, is the one a table
  CELL uses, and would not compile here; an existence check alone cannot tell the
  two apart, so the signature was decoded.

  **`ScheduleField.VerticalAlignment` is NOT used**: it arrives at 2027 and
  Revit 2020 has never had it, so naming it would split this fragment in two.

  **No units API is called.** The width converts mm to feet by dividing by
  304.8, plain arithmetic at the edge, which is what D-20 requires and what
  keeps this working across the 2021 units break.

  Version 4 adds `ScheduleField.DisplayType` (get and set),
  `ScheduleField.CanTotal()`, `IsHidden`, the `ScheduleFieldDisplayType`
  enum (`Standard`, `Totals`, `MinMax`, `Max`, `Min`),
  `ScheduleDefinition.GetSortGroupFields`, `ShowGrandTotal` and
  `ScheduleSortGroupField.ShowFooter` - unchanged 2020 through 2027, read out
  of each release's reference assembly with `tools/api-surface --members` for
  SET_SCHEDULE_FIELD_TOTALS, PROVEN on Revit 2020.

# ROUTING - the same rows are in the fragments named here.
#
#   "hide that column"                 -> here, version 2. Hiding keeps any
#                                         sort or filter that uses the field;
#                                         REMOVE_SCHEDULE_FIELDS loses it
#   "rename the column heading"        -> here. The FIELD keeps its own name;
#                                         only the printed heading changes
#   "make the schedule column wider"   -> here, in mm
#   "turn the heading sideways"        -> here
#   "set every heading horizontal"     -> here, version 3: fieldName all,
#                                         headingOrientation horizontal
#   "make all the schedule columns horizontal and centred"
#                                      -> here, version 3: one call for every
#                                         column, alignment centre and
#                                         headingOrientation horizontal
#   "sum this column in the schedule"  -> here, calculateTotals (version 4;
#                                         SET_SCHEDULE_FIELD_TOTALS until it
#                                         was merged here, 2026-11-01). Only
#                                         the switch and the column - nothing
#                                         is renamed or widened unless asked
#   "calculate totals for the flow column" -> here, calculateTotals
#   "add a total to the bottom of the  -> SET_SCHEDULE_SORT_GROUP,
#    schedule"                            showGrandTotal. That switches the
#                                         grand total ROW on; this decides
#                                         what the row adds up. Both are
#                                         needed for a total flow to print
#   "what is the total per type"       -> GROUP_AND_COUNT (SUM_BY_GROUP until
#                                         it was merged there, 2026-11-01). A question about the
#                                         model, answered in the chat
#   "make the schedule text bold"      -> NOT here and NOT anywhere in this
#                                         library. Bold, font and size live on
#                                         the schedule's TEXT TYPE, which other
#                                         schedules share - changing it would
#                                         restyle drawings nobody asked about.
#                                         Revit's route: select the schedule,
#                                         Properties, Appearance, edit the
#                                         Header/Body text type
#   "show units as mm in that column"  -> NOT HERE AND NOWHERE IN THIS LIBRARY.
#                                         A column's UNIT is read and written
#                                         through `ScheduleField.UnitType` on
#                                         Revit 2020 and through `GetSpecTypeId`
#                                         from 2022 - the first is GONE by 2027
#                                         and the second has never existed on
#                                         2020, checked against the reference
#                                         assemblies. There is no single
#                                         expression, and every fragment here is
#                                         one implementation for all eight
#                                         releases. Revit's route: the
#                                         schedule's Formatting tab, Field
#                                         Format
#   "hide a column but keep the field" -> here, hideOrShow hide. Until
#                                         2026-11-01 this table ALSO sent "hide
#                                         that column" to REMOVE_SCHEDULE_FIELDS
#                                         with hideOnly - two cards claiming one
#                                         sentence. This card owns it now, the
#                                         safer of the two: here a hide can
#                                         never take the field out, where there
#                                         hideOnly left false REMOVES the column
#                                         and the sort or filter with it
#   "remove a column"                  -> REMOVE_SCHEDULE_FIELDS
#   "add a column"                     -> ADD_SCHEDULE_FIELDS
#   "what are the headings now"        -> REPORT_SCHEDULE_DEFINITION, which
#                                         reports the name AND the printed
#                                         heading when they differ

# VERSION 4 (2026-11-01) - SET_SCHEDULE_FIELD_TOTALS WAS MERGED INTO THIS CARD
# on the owner's instruction ("make sure there is no duplicate tools"), and is
# DEPRECATED. The same job - one change to how a schedule's named columns are
# set up on its Formatting tab, found by field name or printed heading, read
# back - for the one setting this card lacked. What it had and this card
# lacked is here now: "Calculate totals" (`calculateTotals`), with CanTotal
# asked first (`cannotTotal`), a column already totalling left alone
# (`alreadyTotalled`), a minimum or maximum it replaced reported
# (`replacedCalculation`), where each total prints - a footer, the grand total
# or nowhere yet, a hidden column nowhere - in one string (`appliedTotals`),
# `totalled`, a schedule handed in twice changed once, and nothing handed in
# refused in words.
#
# ONE RULE WAS OPPOSITE, AND THE SAFER ONE IS KEPT (the owner: "in every
# conflict keep the safer rule"). This card took the FIRST column answering to
# a name; that card refused a name two columns answer to and touched neither.
# Now no change here touches an ambiguous name - `ambiguous` names it. NOT
# CARRIED: nothing; its `fieldNames` list is this card's `fieldName` with
# commas between, which version 3 already reads.
#
# WHERE ITS OUTPUTS ARE NOW: totalled, appliedTotals, alreadyTotalled,
# cannotTotal, notPresent, ambiguous, replacedCalculation and refused under
# the same names (refused is a list here). Its sentences moved here.
#
# AND THE DOUBLE CLAIM ON "HIDE THAT COLUMN" IS SETTLED HERE. This card's
# version 2 hides a column (hideOrShow), and REMOVE_SCHEDULE_FIELDS hides one
# too with hideOnly - each card's table sent the sentence to itself, and this
# one's sent it to both. The safer owner is this card: hiding here can never
# remove the field, where REMOVE_SCHEDULE_FIELDS removes the column - and any
# sort or filter on it - whenever hideOnly is left false. Its two hide
# sentences moved here; it keeps hideOnly in its code, which is PROVEN and
# not edited.


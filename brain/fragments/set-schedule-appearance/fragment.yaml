id: FRG-VIEW-061
semantic-identity: "how this schedule's columns read on the sheet - heading text, width, alignment"
kind: action
domain: revit.schedules
capability: SET_SCHEDULE_APPEARANCE
version: 4
source: OFFICIAL
risk: MODIFY

purpose: >
  Changes how a schedule's columns PRINT - the heading text, the column width,
  the alignment of the values, and whether the heading runs sideways. It changes
  no data and no element.

  IT EXISTS BECAUSE *"rename the column heading"*, *"make the schedule column
  wider"* and *"turn the schedule heading sideways"* all resolved to
  `ADD_SCHEDULE_FIELDS` or `CREATE_SCHEDULE` before this batch - a fragment that
  adds a column, and one that makes a second schedule.

  **THE HEADING AND THE FIELD NAME ARE DIFFERENT THINGS, AND ONLY ONE OF THEM
  PRINTS.** Renaming a heading to "Duct Size" leaves the field still called
  Size - so a later request to sort or filter *by Size* still works, and a
  request phrased *by Duct Size* has to find it by heading. That is why every
  fragment in this cluster matches on **either** name, and why this one reports
  both after the change.

  **WIDTH IS IN FEET BECAUSE IT IS A DISTANCE ON PAPER, AND IT ARRIVES IN mm.**
  `GridColumnWidth` is a Revit internal length like any other, so millimetres
  are divided by 304.8 as plain arithmetic at the edge - no units API, which is
  the call that breaks at 2021. A column width is one of the few numbers on a
  drawing that a modeller genuinely thinks about in millimetres.

  **NOTHING HERE MAKES TEXT BOLD, AND THAT IS DELIBERATE.** Bold, font and size
  on a schedule belong to its **text type**, not to the field - changing them
  means editing a type that other schedules share, which would silently restyle
  drawings nobody asked about. The Revit route is named in the routing table
  instead. A fragment that quietly edits a shared type to satisfy one sentence
  is the more dangerous of the two options.

  **VERSION 2 ADDS HIDING A COLUMN, WHICH IS NOT THE SAME AS REMOVING IT.** A
  field is often added to sort or filter by and is not meant to print. Hidden,
  it keeps doing that job off the drawing; removed, the sort goes with it and
  somebody rebuilds it later wondering what changed. It belongs here rather
  than in a fragment of its own: it is one more thing about how a column
  PRINTS, and a second fragment reaching into the same field would be two
  places to look.

  **VERSION 4 SWITCHES ON "CALCULATE TOTALS" for a column** - what each group
  footer and the grand total add up. Revit is asked first whether the column
  can be added up; one already totalling is left alone and said; a minimum or
  maximum it showed is reported as replaced; and each total says where it
  will print - or that it prints nowhere yet. A name that more than one
  column answers to, by field name or heading, now touches none of them, for
  every change here. Version 3's proof no longer describes the code and is
  kept as a record; the card is DRAFT until it is proved again.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

# VERSION 3 (2026-10-17, FRAGMENT-ISSUES row 5b-620). Kept out of the purpose
# on purpose: the purpose is searched, and a paragraph about "all" and
# "horizontal" would pull other cards' sentences.
#
#   Found 2026-10-15 on a real project, Revit 2020. Asked "make all the fields
#   formatting horizontal and centre" on one schedule, the chat had to call
#   this once per field - one undo entry per column - and had no way to turn a
#   heading back to horizontal: `headingSideways` false meant "leave it", so
#   only Vertical could ever be written.
#
#   `fieldName` "all" (also "every", "*", "all fields", "all columns") is
#   every column of each schedule, hidden ones included; a list with commas
#   between - "Mark, Size, Length" - is each one named, by field name or
#   printed heading. Still one call: one transaction, one undo entry, and one
#   read-back line per column in appliedAppearance. A text matching one column
#   EXACTLY is that column, as in version 2 - so a field called "All", or one
#   whose name holds a comma, still means itself and no version 2 caller's
#   request changes meaning. A new heading on more than one column is refused
#   (the same title would print over each) and the rest still applied.
#
#   `headingOrientation` "horizontal" or "vertical" sets the heading either
#   way. It is `optional: true` with `absent: leave`, so a caller that never
#   sends it is bound "leave" and gets exactly version 2: headingSideways true
#   turns the heading sideways, false leaves it. Sideways true with horizontal
#   is refused before anything is written. Any other word is refused by name.
#
#   `changed` counts columns read back - one per schedule in version 2, since
#   version 2 changed one column per schedule. A word that is not an alignment
#   or an orientation is refused once per schedule, as version 2 refused it,
#   not once per column.
#
#   Version 2's proof below no longer describes the code and is kept as a
#   record; the card is DRAFT until the version 3 proof (NEEDS-CHECKING Group
#   FY) is signed.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # One column by field name or printed heading, or VERSION 3: "all" for
    # every column, or names with commas between - "Mark, Size".
    - name: fieldName
      type: string
      source: request
    # VERSION 4: newHeading, columnWidthMm, alignment, headingSideways and
    # hideOrShow are OPTIONAL, each left out as the value that already meant
    # "leave it" - so "calculate totals for the Flow column" names only the
    # column and the switch. "leave" typed as a heading is read as no heading.
    - name: newHeading
      type: string
      source: request
      optional: true
      absent: leave
    - name: columnWidthMm
      type: double
      source: request
      optional: true
      absent: 0
    - name: alignment
      type: string
      source: request
      optional: true
      absent: leave
    - name: headingSideways
      type: bool
      source: request
      optional: true
    # VERSION 2. "hide" | "show" | "" to leave it alone.
    - name: hideOrShow
      type: string
      source: request
      optional: true
      absent: leave
    # VERSION 3. "horizontal" | "vertical" sets the heading that way; left
    # out it is "leave", and headingSideways decides exactly as in version 2.
    - name: headingOrientation
      type: string
      source: request
      optional: true
      absent: leave
    # VERSION 4, from SET_SCHEDULE_FIELD_TOTALS. On: switch "Calculate totals"
    # on for each column named - asked of Revit first (CanTotal), never
    # turned off. Off, or left out: totals are not touched.
    - name: calculateTotals
      type: bool
      source: request
      optional: true
  provides:
    - name: changed
      role: result
      type: int
    - name: notPresent
      # Field names the schedule does not carry, so it could not be restyled.
      # The evidence it looked, never a thing it found (D-52).
      role: accounting
      type: IList<string>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<string>
    - name: appliedAppearance
      role: result
      type: IList<string>
    - name: ambiguous
      # Version 4, from SET_SCHEDULE_FIELD_TOTALS. Names that more than one
      # column answers to, by field name or printed heading - NONE of them was
      # touched, for any change. Given and unusable (D-52).
      role: accounting
      type: IList<string>
    - name: totalled
      # Version 4. Columns switched to "Calculate totals" and read back so.
      role: result
      type: int
    - name: appliedTotals
      # Version 4. A second read of each column switched on, with where its
      # total prints on that schedule - a footer, the grand total, or NOWHERE
      # YET - never an echo of the request. ONE STRING, joined with "; ",
      # because a list reaches the chat as three entries cut at sixty
      # characters and the cut part is where the total prints.
      role: result
      type: string
    - name: alreadyTotalled
      # Version 4. Columns that were totalling before this ran and were left
      # alone. The prior state, never a change it made (D-52).
      role: accounting
      type: IList<string>
    - name: cannotTotal
      # Version 4. Columns Revit will not add up - CanTotal is its own answer,
      # asked before anything is set - or refused, or did not read back as
      # totals. Given and unusable (D-52).
      role: accounting
      type: IList<string>
    - name: replacedCalculation
      # Version 4. A minimum or maximum the column showed BEFORE it was
      # switched to totals - Revit allows one calculation per column. The
      # prior state, reported before it goes (D-52).
      role: accounting
      type: IList<string>


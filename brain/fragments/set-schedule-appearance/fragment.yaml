#                                         it was merged there, 2026-11-01). A question about the
#                                         model, answered in the chat
#   "make the Length column bold"      -> here, version 5, cellStyle bold -
#                                         an override on THIS schedule's column
#   "make the schedule text bold"      -> SET_SCHEDULE_OPTIONS when the whole
#                                         schedule's title, header or body
#                                         should use another TEXT TYPE (a bold
#                                         one); here when one column is meant.
#                                         Editing a text type itself is in no
#                                         Heron tool - other schedules share it
#   "change the Length column to metres"
#                                      -> here, version 5, units - Ajmal PS's
#                                         own words, 2026-11-01. Both shapes of
#                                         the units API are reached by name, so
#                                         one implementation serves 2020-2027
#   "change the project's length units" -> SET_PROJECT_UNITS. The PROJECT's
#                                         units, every view and schedule that
#                                         uses project settings - not one column
#   "show varies as a dash in that column"
#                                      -> here, version 5, multipleValues
#                                         (Revit 2022 on)
#   "show the minimum and maximum of this column in the schedule"
#                                      -> here, version 5, calculation
#                                         minimum and maximum - what a column
#                                         CALCULATES, on the same Formatting tab.

#                                      -> here, version 4, units - Ajmal PS's
#                                         own words, 2026-11-01. Both shapes of
#                                         the units API are reached by name, so
#                                         one implementation serves 2020-2027
#   "change the project's length units" -> SET_PROJECT_UNITS. The PROJECT's
#                                         units, every view and schedule that
#                                         uses project settings - not one column
#   "show varies as a dash in that column"
#                                      -> here, version 4, multipleValues
#                                         (Revit 2022 on)
#   "show the minimum and maximum"     -> SET_SCHEDULE_FIELD_TOTALS - what a

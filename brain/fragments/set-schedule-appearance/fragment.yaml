compatibility-note: >
  One implementation for every release. `ScheduleField.ColumnHeading`,
  `GridColumnWidth`, `HorizontalAlignment`, `HeadingOrientation` and `GetName`
  are present and unchanged 2020 through 2027.

  **The two enums are `ScheduleHorizontalAlignment` (`Left`, `Center`, `Right`)
  and `ScheduleHeadingOrientation` (`Horizontal`, `Vertical`)** - read out of the
  property signatures on 2020 and on 2027, not assumed from the property names.
  `HorizontalAlignmentStyle` also exists on every release, is the one a table
  CELL uses, and would not compile here; an existence check alone cannot tell the
  two apart, so the signature was decoded.

  **`ScheduleField.VerticalAlignment` is NOT used**: it arrives at 2027 and
  Revit 2020 has never had it, so naming it would split this fragment in two.

  **The width calls no units API.** It converts mm to feet by dividing by
  304.8, plain arithmetic at the edge, which is what D-20 requires.

  **VERSION 5's column units cross the 2021 units break by name.** A column's
  unit type is `ScheduleField.UnitType` on 2020 and 2021 (gone from 2022) and
  `GetSpecTypeId()` from 2021 (never on 2020); FormatOptions' units are
  `DisplayUnits`/`UnitSymbol` on 2020 and 2021 and `GetUnitTypeId`/
  `SetUnitTypeId`/`GetSymbolTypeId`/`SetSymbolTypeId` from 2021 - read off the
  reference assemblies of all eight releases. Every one of them is reached by
  name at run time - one implementation for every release, as
  SET_PROJECT_UNITS does (the add-in has handed fragments the release symbols
  since row 5b-181's fix; reaching by name is chosen, not forced) - the ForgeTypeId route wherever `GetSpecTypeId` exists -
  SET_PROJECT_UNITS' two routes. `UnitUtils.IsMeasurableSpec` is asked where
  it exists (2022 on). `ScheduleField.GetFormatOptions`, `SetFormatOptions`,
  `FormatOptions.UseDefault`, `Accuracy` and `IsValidAccuracy` are on every
  release.

  **`MultipleValuesDisplayType` and `MultipleValuesCustomText` arrived at
  2022**, with their enum (`Project`, `Varies`, `Custom`), and are reached by
  name; on 2020 and 2021 that one setting is refused. `ScheduleField.GetStyle`
  and `SetStyle`, `TableCellStyle` and `TableCellStyleOverrideOptions` (`Bold`,
  `Italics`, `Underline`, `FontColor`, `Font`, `FontSize`) are on every release
  unchanged.

  Version 4 adds `ScheduleField.DisplayType` (get and set),
  `ScheduleField.CanTotal()`, `IsHidden`, the `ScheduleFieldDisplayType`
  enum (`Standard`, `Totals`, `MinMax`, `Max`, `Min`),
  `ScheduleDefinition.GetSortGroupFields`, `ShowGrandTotal` and
  `ScheduleSortGroupField.ShowFooter` - unchanged 2020 through 2027, read out
  of each release's reference assembly with `tools/api-surface --members` for
  SET_SCHEDULE_FIELD_TOTALS, PROVEN on Revit 2020. Version 5 adds
  `ScheduleField.CanDisplayMinMax()`, on every release 2020-2027 unchanged.


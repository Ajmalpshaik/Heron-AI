positive:
  - given: a duct schedule, field "Size", newHeading "Duct Size"
    expect: >
      "Duct Size" printed at the top of that column in Revit, and the FIELD still
      reported as "Size" - both in appliedAppearance, because only one of the two
      appears on the drawing

  - given: columnWidthMm 25
    expect: >
      the column 25 mm wide ON THE SHEET - measured in Revit, not taken from the
      return value. THIS IS THE UNIT CASE: 25 must become 25/304.8 feet
      internally, and a version that hands 25 straight to Revit produces a column
      over seven metres wide

  - given: alignment "centre"
    expect: values centred in that column, spelled either centre or center

  - given: headingSideways true
    expect: the heading running vertically, which is how a narrow column keeps a long title

  - given: hideOrShow "hide" on a field the schedule SORTS by
    expect: >
      the column off the drawing and the sort order unchanged. That is the
      whole reason hiding sits next to removing - REMOVE_SCHEDULE_FIELDS would
      take the sort with it

  - given: a width change on a schedule that has a hidden column
    expect: >
      the hidden column still hidden. Every input left empty stays untouched,
      or the fragment un-hides work somebody did deliberately

  # VERSION 3 (row 5b-620).
  - given: fieldName "all", alignment "centre", headingOrientation "horizontal"
    expect: >
      every column of the schedule centred with its heading horizontal, in ONE
      call - one entry in Revit's Undo list - and one line per column in
      appliedAppearance, each read back. The request that took one call per
      field on 2026-10-15

  - given: fieldName "Mark, Size" on a schedule that also has Length
    expect: >
      Mark and Size changed and read back, Length untouched; a name in the list
      that is not a column named in notPresent, the others still done

  - given: headingOrientation "horizontal" on a column whose heading is sideways
    expect: >
      the heading reads horizontally again - the change version 2 could not
      make, because headingSideways false meant "leave it"

  - given: headingSideways true and headingOrientation left out
    expect: >
      the heading turned sideways exactly as in version 2 - the card's absent
      word "leave" hands headingSideways the decision. A version 2 caller sees
      no difference

  # VERSION 4 (row 5b-1363, Group KF).
  - given: >
      a duct schedule whose Length column uses project settings (millimetres),
      fieldName "Length", units "metres, 2 decimal places, m"
    expect: >
      appliedAppearance reading "units project settings (Millimeters (mm), 0
      decimal places) -> Meters (m), 2 decimal places", and in Revit the
      Formatting tab's Field Format for Length with Use project settings
      UNTICKED, Meters, 2 decimal places, symbol m - and the lengths printing
      as 12.35 m. Ajmal PS's own request, 2026-11-01

  - given: the same column afterwards, units "project"
    expect: >
      Use project settings ticked again and the lengths back in millimetres;
      read back "units Meters (m), 2 decimal places -> project settings (...)"

  - given: units "mm, no symbol" on a Length column
    expect: millimetres with no unit symbol, the rounding kept from the project's format

  - given: >
      Revit 2022 or later, fieldName "System Type", multipleValues "custom: -"
    expect: >
      a row gathering two system types printing "-" rather than <varies>, and
      the read back saying custom '-'

  - given: fieldName "Length", cellStyle "bold, colour red"
    expect: >
      the Length column's values bold and red on THIS schedule only - another
      schedule using the same body text type unchanged. Read back "style bold,
      colour 255 0 0"

  - given: cellStyle "size 3 mm" on one column
    expect: >
      THE TEXT SIZE ASSUMPTION SETTLED: the Edit Font dialog for the column
      reading 3 mm means TextSize is a Revit internal length; anything else is
      recorded with Revit's own number from the read back and the card corrected

  - given: cellStyle "reset" on that column
    expect: every override off, the column back to the body text type's look

negative:
  # VERSION 4.
  - given: fieldName "Type", units "metres"
    expect: >
      refused for that column - "not a number with units" - and NOTHING about
      its format changed; another column named in the same call still set

  - given: fieldName "Length", units "kilograms"
    expect: >
      refused naming every unit Revit offers for a length, the column's format
      unchanged, and the rest of the call still made

  - given: units "metres", cellStyle "glowing" on fieldName "Length"
    expect: >
      the style refused once naming the style words accepted, and the units
      still set and read back - one bad input does not discard a good one

  - given: Revit 2020 or 2021, multipleValues "varies" with an alignment
    expect: >
      multiple values refused as arriving at Revit 2022, the alignment still
      applied and read back

  - given: cellStyle "bold" on one schedule's Length column
    expect: >
      a SECOND schedule sharing the same body text type NOT bold - the text
      type is never edited

  - given: an empty newHeading and columnWidthMm of 0
    expect: >
      NOTHING CHANGED and nothing claimed - not a blanked heading and not a
      collapsed column. THIS IS THE FIRST CASE TO RUN. Both mistakes look exactly
      like the fragment working, and both reach an issued sheet

  - given: a field name not in the schedule
    expect: named in notPresent, other schedules in the batch still acted on

  - given: an alignment of "middle" or any word not on the list
    expect: >
      refused with the accepted words, and the OTHER properties in the same call
      still applied. One bad input must not discard a good heading change

  - given: a schedule where Revit refuses the width
    expect: >
      that refusal named with Revit's own message, and the count reflecting what
      a READ BACK found rather than what was attempted

  - given: a request to make the schedule's whole body text type bold
    expect: >
      the TEXT TYPE NOT EDITED by this fragment. Version 4 makes a column bold
      on this schedule only; which text type the schedule uses is
      SET_SCHEDULE_OPTIONS', and editing a shared type is in no Heron tool

  # VERSION 3.
  - given: fieldName "all" and a newHeading
    expect: >
      the heading NOT written on any column - one title over every column is a
      mistake nobody asked for - and said so in refused; any alignment or
      orientation in the same call still applied

  - given: headingSideways true and headingOrientation "horizontal"
    expect: >
      refused before anything is written - the two ask for opposite things - and
      NOTHING changed, not even an alignment sent in the same call

  - given: headingSideways false and headingOrientation left out
    expect: >
      every heading exactly as it was. False never meant horizontal and must not
      start meaning it for a caller who has not asked

second_route:
  - >
    Revit's own schedule Properties - Formatting tab for heading, alignment and
    orientation; and dragging the column edge on the sheet for width. Those are
    what the result is checked against

  - >
    Version 4: the Formatting tab's Field Format button for the column (Use
    project settings, units, rounding, symbol) and its multiple values text;
    and for a column's style, select its cells and read Modify Schedule,
    Font - read by a person after the run

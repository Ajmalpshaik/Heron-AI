revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. PhaseFilter.GetPhaseStatusPresentation,
  PhaseFilter.IsDefault, ElementOnPhaseStatus, PhaseStatusPresentation,
  BuiltInParameter.VIEW_PHASE_FILTER and View.IsTemplate are present and
  unchanged 2020 through 2027 - read with tools/api-surface on 2026-10-31. Ids
  are compared as ElementId and never read as numbers.

# ROUTING - repeated in CREATE_PHASE_FILTER.
#
#   "what phase filters are in this project"   -> here
#   "what phases are in this model"            -> REPORT_PHASES - phases, not
#                                                 phase filters
#   "what view filters does this view have"    -> REPORT_VIEW_FILTERS
#   "list the view filters"                    -> REPORT_VIEW_FILTERS - VIEW
#                                                 filters, not phase filters.
#                                                 This card ranked next to it
#                                                 on the model backend,
#                                                 2026-10-31
#   "which phase filter does this view use"    -> REPORT_VIEW_SETTINGS - one
#                                                 view's Phase and Phase
#                                                 Filter; this lists the
#                                                 project's filters
#   "create a phase filter called As-Built"    -> CREATE_PHASE_FILTER
#   "what are the phase graphic overrides"     -> NOTHING HERE CAN - the
#                                                 Graphic Overrides tab of
#                                                 Manage, Phasing has no API
#                                                 to read. Row 5b-1350

utterances:
  - what phase filters are in this project
  - list the phase filters
  - how is the Show Complete phase filter set
  - what does the Show Previous + New filter show

semantic-identity: "the project's phase filters by exact name, and how each one shows each phase status"

# WHY IT EXISTS - a comment, not `purpose`, because `purpose` is searched.
# Built 2026-10-31 beside CREATE_PHASE_FILTER, for Ajmal PS's "As-Built"
# filter. Nothing read the phase filters (grep of brain/fragments that day):
# REPORT_PHASES lists PHASES, REPORT_VIEW_FILTERS lists VIEW filters, and
# SET_VIEW_PROPERTIES takes a phase filter's exact name with nowhere to get it.
#
# A NEW READ, NOT A WIDENING OF REPORT_PHASES (FRG-DOC-007, PROVEN). A phase
# and a phase filter are different elements with different jobs, and a change
# under that card's impl/ would make its proof stale.
#
# THE GRAPHIC OVERRIDES TAB HAS NO API on any release 2020 to 2027, so what
# "Overridden" draws is not read here. The evidence is in CREATE_PHASE_FILTER's
# card and FRAGMENT-ISSUES row 5b-1350.
#
# READ ONLY - opens no transaction.
kind: action
domain: revit.phases
capability: REPORT_PHASE_FILTERS
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Lists the phase filters of the project - the Phase Filters tab of Manage,
  Phasing - by exact name, with each phase status shown By Category,
  Overridden or Not Displayed, whether it is one of Revit's own, and how many
  views use it. Name one to read that one alone.

contract:
  needs:
    - name: doc
      type: Document
      source: ambient
    # A filter by its name - "Show Complete". Left out, "all".
    - name: filterName
      type: string
      source: request
      optional: true
      absent: all
  provides:
    - name: phaseFilterNames
      role: result
      type: IList<string>
    - name: phaseFilterIds
      role: result
      type: IDictionary<string, ElementId>
    - name: filterCount
      role: result
      type: int
    - name: report
      # ONE STRING, filter by filter: the four statuses and the views using it.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


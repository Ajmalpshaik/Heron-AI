# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: an MEP model linking an architectural model with three placed rooms on Level 1 (101 Office, 102 Store, 103 Corridor), Room Bounding on, no spaces yet, updateNames false
    expect: >
      created 3, each space numbered and named as its room, each reading back
      with an area. orphans empty

  - given: room 102 renamed "Plant" in the architectural model, the link reloaded, updateNames true
    expect: >
      renamed 1 (the space over 102 now reads "Plant"), alreadyMatching 2,
      created 0

  # VERSION 2 (2026-11-20) - row 5b-1125. NOT RUN. NEEDS-CHECKING Group OQ.
  - given: >
      the first case on a scratch copy, the link Room Bounding and the run
      KEPT, then Revit's Space schedule read
    expect: >
      created 3, `noArea` EMPTY, no line saying NO AREA, and every space in
      the schedule with an area. If one reads NO AREA here, the defect row
      5b-1125 waits on stands even with the link bounding and kept

  - given: >
      version 3, Revit 2020 - a host from Mechanical-Default_Metric.rte
      (phases Existing then New Construction) with an architect's link Room
      Bounding, phaseName=Existing, run TWICE (NR9, rows 5b-1589 and 5b-1655)
    expect: >
      first run: each new space's Phase read back in Properties. Either
      Existing, counted in created - or another phase, every such space in
      wrongPhase and NOT in created, the top line of findings saying so.
      Second run, where the first made spaces in Existing: alreadyMatching
      that count and created 0 - the spaces of the asked phase are seen

negative:
  - given: >
      version 3 - phaseName left out (the host's last phase) while the
      architect's rooms are all in the link's "Existing"
    expect: >
      created 0, and the first finding naming how many rooms were passed over
      for being in another phase - never a silent "0 made"

  # VERSION 2 - row 5b-1125. FAILS on version 1, which counted them in created.
  - given: >
      the same link with Room Bounding OFF, no walls in this model, no spaces
      yet - so nothing bounds a space made here
    expect: >
      created EMPTY, `noArea` holding one space per placed room, each line
      saying NO AREA, NOT counted as made, and that the link is NOT Room
      Bounding. Version 1 answered created 2 on Project1 for two such spaces
      and the run judged PASS
  - given: the first run again, straight after, updateNames false
    expect: >
      created 0, renamed 0, alreadyMatching 3 - nothing made twice

  - given: room 103 deleted in the architectural model, the link reloaded
    expect: >
      the space over the old corridor in `orphans`, still in the model - it is
      listed, never deleted

second_route:
  - the MEP model's Space schedule beside the architect's Room schedule - numbers and names line up
  - one Ctrl+Z takes every space made and every rename back in a single step (Golden Rule 16)

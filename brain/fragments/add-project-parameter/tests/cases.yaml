positive:
  - given: a new parameter AJ_Status bound to Duct Accessories as an instance parameter
    expect: >
      the parameter visible on a duct accessory in Revit's own properties palette,
      under Data - checked IN REVIT, not from this fragment's report. Then Manage,
      Project Parameters, and see it listed against that category

  - given: the same request run a second time
    expect: >
      the SAME parameter, not a second one, and the report saying the definition
      was reused. Two definitions of one name mean two GUIDs, and a colleague's
      model then carries a parameter that looks identical and is not

  - given: >
      version 2 - Manage > Shared Parameters pointing at a file of the
      modeller's own (note its path first), and AJ_Status asked for on Duct
      Accessories with a DIFFERENT shared parameter file
    expect: >
      the parameter bound to Duct Accessories, sharedParameterFileRestored
      true, and Manage > Shared Parameters afterwards showing the modeller's
      own file again - read in Revit's dialog, not from this report. Version 1
      left it pointing at the file asked for (5b-317)

  - given: >
      version 3 (5b-1127), Group NL - a shared parameter file that EXISTS and
      already holds HERON_NL_TAG in group HERON, asked for on Ducts,
      createMissing left out
    expect: >
      bound to Ducts, the report saying the definition was reused, and the
      file on disk byte for byte what it was - compare a copy taken first.
      What version 2 was proved on, and it must not have moved

  - given: >
      version 3, Group NL - createMissing=true, the same file, a parameter
      name it does NOT hold (HERON_NL_NEW)
    expect: >
      bound to Ducts, a finding saying the parameter was created in the file
      as asked and that Undo does not take it out, and the name now in the
      file - read it in Manage > Shared Parameters. The modeller asked for a
      new one, so one is made

  - given: >
      version 3, Group NL - createMissing=true and a path where NO file is,
      in a folder that exists
    expect: >
      a new shared parameter file there, "Created a new shared parameter file
      at ..." in the report, and the parameter bound. Delete the file
      afterwards - a rollback does not

negative:
  - given: >
      version 3 (5b-1127), THE CASE THE ROW IS ABOUT, Group NL - a path where
      no file is (the real file's name with one letter wrong), createMissing
      left out. Note what Manage > Shared Parameters shows first
    expect: >
      bound false, boundCategories empty, a finding naming the path and saying
      nothing was done, and NO file at that path afterwards - look in the
      folder. Manage > Shared Parameters shows what it showed. Version 2
      created the file, bound the parameter and answered `bound true`

  - given: >
      version 3 (5b-1127), Group NL - the real file, a parameter name it does
      not hold (HERON_NL_TPYO), createMissing left out
    expect: >
      bound false, a finding naming the file, the name and the group and
      saying nothing was written, and the file on disk byte for byte what it
      was - no new line in it, no new group. Version 2 wrote the name into the
      file and bound it

  - given: >
      version 3, Group NL - the real file, a GROUP name it does not hold,
      createMissing left out
    expect: >
      bound false, the finding saying the file has no such group, and no new
      group in the file. Version 2 made the group before it looked for the
      parameter

  - given: >
      version 2 - one category the Project Parameters dialog does not offer
      (check with a read that it does not allow bound parameters) asked for
      together with Duct Accessories
    expect: >
      bound to Duct Accessories only, and the other category NAMED in
      categoriesNotBound as one Revit does not let a project parameter onto -
      not missing from the answer. No other category gains the parameter:
      Pipes, checked in Manage > Project Parameters, still does not carry it

  - given: >
      version 2 - ONLY categories that cannot carry a project parameter
    expect: >
      nothing done, each one named, and Manage > Shared Parameters exactly as
      it was - the setting is never touched when there is nothing to bind

  - given: the parameter already bound to Ducts, now asked for on Pipe Fittings only
    expect: >
      bound to BOTH afterwards, and the report naming Ducts as kept. THIS IS THE
      FIRST CASE TO RUN. ReInsert replaces: called with today's list alone it
      strips the parameter off every category it had, and every value anybody
      typed goes with it

  - given: run on Revit 2020, then on 2024, then on 2027
    expect: >
      the same parameter created on all three. This is the fragment the version
      range actually bites - the spec argument and the group argument both moved,
      and the old enum is gone by 2024 and 2027. If one release throws about a
      missing type, the run-time resolution is not doing its job

  - given: a shared parameter file path in a folder that does not exist
    expect: >
      a plain failure naming the path, and NOTHING created anywhere else. The
      earlier library fell back to a temporary folder, which produces a shared
      parameter nobody can find again. Version 3: refused before anything is
      tried when createMissing is left out; with createMissing=true the folder
      is still not made, and Windows' own words for the missing folder come
      back in the failure

  - given: an empty category list
    expect: >
      nothing done, and a finding saying so. A parameter bound to no category is
      invisible in the model and looks like a silent failure

second_route:
  - Manage, Shared Parameters in Revit to see the definition, and Manage, Project Parameters to see the binding and its categories
  - >
    Version 2: open Manage > Shared Parameters after the run and read the path
    in its box - it must be the one noted before the run, whatever the report
    says. Then press Undo once: the binding goes, and the path stays the
    modeller's own, because nothing here leaves Undo anything to do for it
  - >
    Version 3: the shared parameter file itself, opened in a text editor
    before and after a REFUSED run - the same lines, the same size, the same
    modified time; and the folder, for a file that was not there before

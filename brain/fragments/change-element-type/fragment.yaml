compatibility-note: >
  One implementation for every release. `Element.ChangeTypeId(ElementId)` and
  `Element.GetTypeId()` are unchanged 2020 to 2027, and the new type arrives as
  an ElementId object taken from a live element, so nothing here builds one
  from an integer and 2024's 64-bit ids do not reach this code.

# ROUTING - repeated in SET_MEP_SIZE, which is what is usually meant when the
# words are about size, and in DUPLICATE_TYPE and COPY_PARAMETER_VALUE.
#
#   "change the type"                  -> here
#   "swap them for the other diffuser" -> here
#   "make these the same as that one"  -> here, typeFrom selected -
#                                         MATCH_ELEMENT_TYPE's job since
#                                         version 2
#   "match this type onto those"       -> here, typeFrom selected
#   "make a new type like this one
#    but 300 wide"                     -> DUPLICATE_TYPE. Nothing here creates
#                                         a type
#   "copy the mark across too"         -> COPY_PARAMETER_VALUE. This changes
#                                         the TYPE and leaves every instance
#                                         parameter alone, which is not what
#                                         Revit's own match tool does
#   "make the duct 300 wide"           -> SET_MEP_SIZE - a dimension on the
#                                         element, not a different type
#   "rename the type"                  -> EDIT_TEXT_VALUES field Name, and note it reaches
#                                         every instance of that type
#
# SIZE AND TYPE ARE THE SAME SENTENCE IN A MODELLER'S MOUTH. "Change it to 600
# by 600" can mean either, and on a family whose sizes are types it means this
# one. Ask which before running on a batch.
#   "make a new duct type"           -> DUPLICATE_TYPE - the type does not exist
#                                       yet. This one moves instances onto a type
#                                       that already does
#   "duplicate this type"            -> DUPLICATE_TYPE
#   "copy the tags from the old units -> COPY_TAGS_TO_REPLACEMENTS - the units
#    to the new units"                  were REPLACED by other elements, whose
#                                       tags must be made again. This one keeps
#                                       the element, so its tags stay on it.
#                                       "replace this type with another one"
#                                       stays here: the host resolves it by
#                                       identity (checked 2026-10-12), although
#                                       the keyword route alone ranks
#                                       COPY_TAGS_TO_REPLACEMENTS first
#
# CURTAIN PANELS (2026-10-28, NEEDS-CHECKING Group JI). A selected panel is an
# element like any other: on 2026-10-13 three selected panels became curtain
# wall doors here (brain/skills/building-shell.yaml, step 9). So curtain panels
# the modeller has SELECTED are changed here - "make these curtain panels
# glazed", "swap the curtain panel to a door panel", the modeller's words.
# Where a selected cell holds a basic wall, whether ChangeTypeId takes a panel
# type is not measured; SET_CURTAIN_PANEL_TYPE changes a cell by its row and
# column with the grid's own call.
#
# THOSE TWO SENTENCES ARE NOT DECLARED BELOW, and that is measured, not
# forgotten. Declared here on 2026-10-28, they moved this card's vector enough
# to turn tests/test_routing_phrases.py's guarded question "read the thermal U
# value of every floor type and roof type" - an exact tie at 0.0316 on the base
# tree - onto SET_MATERIAL_PROPERTIES, a write. Undeclared, they reach
# SET_CURTAIN_PANEL_TYPE, which refuses a selection of panels, changes nothing
# and names this card. Declaring them here wants that guarded question moved to
# the test's DECLARED table first, which is the owner's call (Group JI, JI12).
#   "change the bottom row of panels on this curtain wall to solid panels"
#                                          -> SET_CURTAIN_PANEL_TYPE. Panels
#                                             picked by where they sit on one
#                                             wall - a row, a column, a floor
#                                             line - with the wall selected
#   "put spandrel panels on every floor line" -> SET_CURTAIN_PANEL_TYPE


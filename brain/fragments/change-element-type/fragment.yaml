# VERSION 2 (2026-11-01) - MATCH_ELEMENT_TYPE WAS MERGED INTO THIS CARD on the
# owner's instruction ("make sure there is no duplicate tools"), and is
# DEPRECATED. The same job - elements moved onto a type, read back - and the
# only difference was where the type came from: named here, taken from an
# element there. Both are here now. What MATCH_ELEMENT_TYPE had and this card
# lacked: `typeFrom` "selected", the type taken from the one selected
# element; the source among the elements skipped; a source with no type
# refused with the reason; an element of another category refused by id and
# category; and the sentence that only the TYPE changed, never an instance
# parameter. Its `changed` is `changed`; its findings are `findings`.
#
# THE CATEGORY RULE DIFFERS BY MODE, AND THAT IS KEPT ON PURPOSE (the owner's
# rule: in every conflict keep the safer one). Taken from a source, another
# category is refused - MATCH_ELEMENT_TYPE's rule. Named by id, a
# cross-category swap still goes to Revit, because it is measured and wanted:
# three selected curtain panels became curtain wall doors here on 2026-10-13
# (brain/skills/building-shell.yaml, step 9, and the CURTAIN PANELS note
# below).
#
# Version 1's proof below no longer described the code (impl/ changed) and
# was kept as the record; DRAFT at the time, until version 2 is proved on a
# real model (D-30).

purpose: >
  Changes which type an element is - swapping every 600x600 diffuser on a floor
  for a different one, moving a run onto a different duct type, replacing a
  discontinued fitting.

  **The new type is an input and is never guessed.** Revit accepts a type change
  it cannot really honour, and the result is not an error - it is geometry that
  looks wrong on a drawing nobody re-checks.

  **Revit will accept the call and leave the element on its old type.** This is
  the case worth knowing: `ChangeTypeId` throws for some mismatches and, for
  others, simply does not take. So the type is read back after the change and
  only a real move is counted - the same read-back the parameter path needed
  after Revit returned TRUE and stored something else.

  Version 2 takes the type from an element as well - the one selected, its
  type the one the others take, another category refused - and says that only
  the type changed.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: elements
      type: IList<Element>
    # The type, named - or left out ("none") when `typeFrom` says where to take
    # it from. One of the two, never both.
    - name: newTypeId
      type: ElementId
      source: request
      optional: true
      absent: none
    # VERSION 2, from MATCH_ELEMENT_TYPE. "selected" - the ONE element selected
    # in Revit is the source and its type is the one the others take; another
    # category is refused. Left out ("none"): the type is `newTypeId`.
    - name: typeFrom
      type: string
      source: request
      optional: true
      absent: none
    - name: doc
      type: Document
    # Version 2: the selection `typeFrom` reads, in this model only.
    - name: uidoc
      type: UIDocument
  provides:
    - name: changed
      role: result
      type: int
    - name: alreadyThatType
      # Elements that were ALREADY in the state asked for, so there was
      # nothing to do. The evidence it looked, never a change it made
      # (D-52).
      role: accounting
      type: int
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>
    - name: findings
      # Version 2: what was changed and to what, each refusal by id and
      # category, and the sentence that only the type changed.
      type: IList<string>


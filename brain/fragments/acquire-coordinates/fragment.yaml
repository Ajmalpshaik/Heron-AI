id: FRG-DOC-049
semantic-identity: "acquire coordinates from this linked model, so ours match the architect's"
kind: action
domain: revit.document
capability: ACQUIRE_COORDINATES
version: 1
source: OFFICIAL
risk: ADMIN

purpose: >
  Acquires coordinates from one linked Revit model: the link's shared system,
  origin and True North become this model's, based on where the link sits now.
  Manage > Coordinates > Acquire Coordinates - the step that puts an MEP model
  on the architect's survey system.

  **NO ELEMENT IS SHIFTED, AND WHERE EVERYTHING IS SAID TO BE CHANGES.** No element's
  internal position changes; every shared position, spot reading and exported
  position does. So the shared position of the internal origin is
  read BEFORE and AFTER, east/west, north/south, elevation and angle to True
  North, and both are reported - the evidence of what changed.

  **IT IS ADMIN, AND IT IS THE LINK THAT DECIDES.** A link placed in the wrong
  spot hands over the wrong system, and everything exported afterwards carries
  it. CHECK_LINK_COORDINATES is the read to run first.

  **A REVIT LINK ONLY.** Acquiring from a CAD link takes a different id and is
  not done here. Publishing INTO a link changes the linked file and is not
  done here either.

  ASSUMES AN OPEN TRANSACTION (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The link to acquire from, by its instance name as the Project Browser's
    # Revit Links shows it.
    - name: linkInstance
      type: RevitLinkInstance
      source: request
  provides:
    - name: acquired
      role: result
      type: bool
    - name: before
      # The shared position of this model's internal origin before: E/W and
      # N/S and elevation in mm, angle to True North in degrees.
      role: accounting
      type: string
    - name: after
      # The same, read back from Revit after acquiring - never assumed.
      role: result
      type: string
    - name: refused
      role: accounting
      type: IList<string>
    - name: findings
      type: IList<string>


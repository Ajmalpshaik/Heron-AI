  fingerprint: 72d0e08226c642cf

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Document.AcquireCoordinates(ElementId)`,
  `Document.ActiveProjectLocation` and `ProjectLocation.GetProjectPosition` with
  `ProjectPosition`'s four values are present 2020 through 2027, read with
  tools/api-surface on 2026-10-14. Feet to millimetres by 304.8 (D-20).

# ROUTING - the same rows are in CHECK_LINK_COORDINATES and SET_PROJECT_LOCATION.
#
#   "acquire coordinates from the architecture link" -> here
#   "check the links' shared coordinates"   -> CHECK_LINK_COORDINATES - a read,
#                                              and the one to run first
#   "set the project location"              -> SET_PROJECT_LOCATION - the site's
#                                              place on the earth, not the link's
#   "where is the project"                  -> REPORT_LOCATION

utterances:
  - acquire coordinates from the architecture link
  - take the survey system from the linked model
  - get our coordinates from the architect's model
  - acquire shared coordinates from this link

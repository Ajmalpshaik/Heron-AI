# DEPRECATED 2026-11-01 - MERGED INTO DUPLICATE_VIEWS (duplicate-views), on
# the owner's instruction in conversation: "make sure there is no duplicate
# tools". Constitution Article 1: kept, never deleted, so its record and its
# proof stay readable and it can be brought back. Nothing offers it now -
# retrieval leaves DEPRECATED out, and its sentences claim nothing in the
# identity table (heron_search RETIRED_FRAGMENTS). Its sentences moved to
# DUPLICATE_VIEWS. Its job - a new legend copied from one that exists,
# renamed, its contents carried or not - is one view duplicated there with
# newName and duplicateOption Duplicate or WithDetailing; its 'created' is
# newViewIds[0] there. Its refusal of a view that is not a legend was not
# carried: DUPLICATE_VIEWS copies any view, the job this card pointed away to.
# The proof below is the record of what this card's code did, not a claim
# about today.
deprecated:
  date: '2026-11-01'
  by: Ajmal PS
  superseded-by: DUPLICATE_VIEWS
  why: >
    The same job: copy a view the way stated and hand back the copy.
    DUPLICATE_VIEWS version 3 took what this card had that it lacked - newName
    put on one copy and read back, a name Revit refuses said, a legend told it
    is on no sheet yet and can sit on many, and, with nothing handed in and no
    legend in the project, the sentence that Revit's API cannot make the first
    legend on any release.

purpose: >
  Makes a new legend by duplicating one that already exists. That is the only
  route the API offers, and saying so is half of what this fragment is for.

  **Revit exposes no way to create the FIRST legend.** There is no legend
  creation method on any supported release - checked against the shipped
  assemblies at both ends, not remembered. A project with no legends cannot get
  one from a script, and this says that plainly instead of failing obscurely.
  One drawn by hand unblocks every later copy.

  **Duplicating carries the source's contents**, which is what makes the pattern
  work: keep one office legend in the project, copy it here, then edit the copy's
  text. There is no way to place a NEW legend component, so building a legend's
  contents from nothing stays a manual job.

  **A legend is the one view that can sit on many sheets at once.** So a legend
  per sheet is usually the wrong instinct - place the same one repeatedly instead
  of copying it, and this fragment is for when the CONTENT genuinely differs.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The legend to copy. Resolved, so a project with several does not get one
    # picked for it.
    - name: sourceLegend
      type: View
      source: request
    - name: newName
      type: string
      source: request
    - name: withContents
      type: bool
      source: request
  provides:
    - name: created
      role: result
      type: ElementId
    - name: findings
      type: IList<string>


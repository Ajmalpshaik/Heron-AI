id: FRG-MEP-004
semantic-identity: "set the width, height or diameter on these MEP runs"
kind: action
domain: revit.mep
capability: SET_MEP_SIZE
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Sets duct or pipe size - width and height for rectangular, diameter for round
  - on elements that already exist, and reports what Revit actually stored.

  **Revit changes the number and says yes.** A size that is not in the type's
  size table is snapped to the nearest one that is: ask a run for 77 and it
  comes out 80, the set returns true, and nothing is thrown. Reporting the
  requested number as the result is how a schedule ends up disagreeing with the
  model, and nobody finds out until somebody measures. `snapped` is that case,
  carrying ids and what each one became.

  **The wrong size for the shape is skipped, not forced.** Width on a round duct
  and diameter on a rectangular one are simply not there, and that is reported
  rather than treated as a failure - it is usually the caller having one list of
  mixed shapes, which is a normal thing to have.

  It is separate from CREATE_DUCT on purpose: resizing duct that already exists
  is at least as common as sizing it at creation, and the snap check should have
  one home.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # Internal units. Zero means "leave this one alone", so one call can set a
    # diameter without also being asked what the width should be.
    - name: width
      type: double
      source: request
    - name: height
      type: double
      source: request
    - name: diameter
      type: double
      source: request
  provides:
    - name: sized
      role: result
      type: int
    - name: snapped
      # Runs whose size Revit changed to the nearest one in the type's size
      # table - ask for 77 and it comes out 80, THE SET RETURNS TRUE AND
      # NOTHING IS THROWN. Carries the ids and what each one became, which is
      # the only place that says so.
      role: result
      type: IList<ElementId>
    - name: notApplicable
      # Width on a round duct, diameter on a rectangular one. *The wrong size
      # for the shape is SKIPPED, NOT FORCED* - usually the caller having one
      # list of mixed shapes, which is normal. Never a size it set (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>


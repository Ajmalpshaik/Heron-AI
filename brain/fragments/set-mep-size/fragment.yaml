compatibility-note: >
  One implementation for every release. The sizes are reached by
  `BuiltInParameter` - `RBS_CURVE_WIDTH_PARAM`, `RBS_CURVE_HEIGHT_PARAM` and
  `RBS_CURVE_DIAMETER_PARAM` - which are unchanged 2020 to 2027 and, unlike a
  name lookup, do not depend on the language Revit is running in. A fragment
  that looked up "Width" by name would work in English and silently find
  nothing on a French install.

# TRAP - OBSERVED ELSEWHERE, NOT YET PROVEN HERE. Added 2026-09-23.
#
# Another tool, on real models and mostly on Revit 2020, resized a connected
# pipe run and Revit left the FITTINGS at the old size and added transitions:
# 22 pipes became 41 elements, and unions became two transitions back to back
# with connectors left open. Every pipe still read its new size - and this
# fragment's whole check is that size read back after the regeneration, so
# `sized` would be right while the run is broken. Nothing in this repository
# has reproduced it yet.
#
# A NOTE ONLY. This fragment is PROVEN, and a change to its code would make
# the proof stale. AUTO_SIZE_PIPE, which was DRAFT, now counts the open
# connectors before and after a resize; nothing here does yet. Until it does,
# look at the joints of a CONNECTED run after resizing it. NEEDS-CHECKING AD2.

# ROUTING - the same rows are in the fragments named here.
#
#   "make it 100 mm"                 -> here - and this is where Revit SNAPS
#                                       a size to the nearest one the type
#                                       allows while reporting success
#   "run a pipe from here to there"  -> CREATE_PIPE - it sets no size at all
#   "draw a duct from here to there" -> CREATE_DUCT
#   "draw a cable tray"              -> CREATE_ELECTRICAL_RUN - it sets no
#                                       size either; this is where every
#                                       kind of run gets one
#   "size the ducts from the flow"   -> AUTO_SIZE_MEP - it works the size
#                                       out from the air. This one applies a
#                                       size you have already decided

utterances:
  - change these ducts to 400 by 250
  - make the pipe 100 diameter
  - resize the duct
  - set the duct size
  - change the diameter on these
  - make it 100 mm

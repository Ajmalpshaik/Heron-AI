compatibility-note: >
  `Application.SharedParametersFilename` - whose remark says the file is reached
  only once that is set - `OpenSharedParameterFile`, `DefinitionFile.Groups`,
  `ExternalDefinition.GUID`, `FamilyParameter.IsShared` and `GUID` read the
  same 2020 through 2027. `FamilyManager.AddParameter(ExternalDefinition,
  group, bool)` takes a BuiltInParameterGroup 2020 to 2024 and a ForgeTypeId
  from 2022 (the RevitAPI reference assemblies and their XML remarks, read
  2026-10-01), so the overload is picked by reflection, newest first.

  **REPLACING (version 2)** is `FamilyManager.ReplaceParameter(FamilyParameter,
  ExternalDefinition, group, bool)` - BuiltInParameterGroup 2020 to 2024
  (obsolete in 2024), ForgeTypeId 2022 to 2027 - picked the same way. The old
  parameter's heading is `Definition.ParameterGroup` 2020 to 2024 or
  `GetGroupTypeId()` 2022 to 2027, read in whichever world the call takes; its
  kind is `GetDataType()` 2022 to 2027 or `ParameterType` 2020 to 2022.
  Every type's value is read with `FamilyType.HasValue`, `AsValueString`,
  `AsString`, `AsDouble`, `AsInteger` and `AsElementId`, and
  `FamilyParameter.IsReporting`, all 2020 to 2027 (api-surface, read
  2026-10-12).

# ROUTING - see SET_FAMILY_CATEGORY for the whole family-building table.
#
#   "add the shared parameter Equipment Tag to this family" -> here
#   "add shared parameters from our file to this family"    -> here
#   "replace the family parameter Width with the shared parameter Unit_Width"
#                                          -> here, replaceExisting true
#   "rename the family parameter Width"    -> ADD_FAMILY_PARAMETERS,
#                                             renameExisting true
#   "add a shared parameter to the project"       -> ADD_PROJECT_PARAMETER
#   "add width and depth parameters to the family" -> ADD_FAMILY_PARAMETERS

utterances:
  - add the shared parameter Equipment Tag to this family
  - add shared parameters from our file to this family
  - put the office shared parameters into this family
  - add these shared parameters as type parameters under mechanical
  - replace the family parameter Width with the shared parameter Unit_Width
  - make the size parameters the shared parameters from our shared parameter file

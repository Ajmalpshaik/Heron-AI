id: FRG-PAR-031
semantic-identity: "add the office's shared parameters, from its shared parameter file, to the family being edited"
kind: action
domain: revit.families
capability: ADD_FAMILY_SHARED_PARAMETERS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Adds SHARED parameters to the family open in the Family Editor - Family
  Types' New Parameter with Shared parameter chosen, several at a time. A
  project schedules a family's own value, and its labels read it, only when it
  is a shared parameter with the same GUID in both; ADD_FAMILY_PARAMETERS
  makes family parameters, which a project cannot read that way.

  **THE OFFICE'S FILE IS THE ONLY SOURCE, AND IT IS ONLY READ.** Each name is
  found in the shared parameter file Revit is set to (Manage > Shared
  Parameters). Nothing is written to that file and the setting is never
  changed: a GUID made here would be a different parameter under the office's
  name. No file set, or a name not in it, is refused with the close names.

  **THE KIND COMES FROM THE FILE.** Type or instance, and the Properties
  palette heading, are asked for.

  **A NAME ALREADY IN THE FAMILY** is left alone when it is this same shared
  parameter, and refused when it is anything else.

  **READ BACK, ALL OR NOTHING**: each is found again by name, shared, with the
  file's GUID and the scope asked.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The shared parameters' names as the office's file has them, commas
    # between.
    - name: parameterNames
      type: IList<string>
      source: request
    # true for instance parameters, false for type parameters.
    - name: instance
      type: bool
      source: request
    # The Properties palette heading - "Mechanical", "Identity Data".
    - name: parameterGroup
      type: string
      source: request
  provides:
    - name: added
      # Each one added, with its kind, scope and GUID, read back.
      role: result
      type: IList<string>
    - name: alreadyThere
      # Already in the family as this same shared parameter: looked at,
      # nothing done (D-52).
      role: accounting
      type: IList<string>
    - name: sharedFile
      # The shared parameter file that was read.
      role: accounting
      type: string
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing was added, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


id: FRG-PAR-031
semantic-identity: "add the office's shared parameters, from its shared parameter file, to the family being edited, or replace family parameters with them"
kind: action
domain: revit.families
capability: ADD_FAMILY_SHARED_PARAMETERS
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Adds SHARED parameters to the family open in the Family Editor - Family
  Types' New Parameter with Shared parameter chosen, several at a time. A
  project schedules a family's own value, and its labels read it, only when it
  is a shared parameter with the same GUID in both; ADD_FAMILY_PARAMETERS
  makes family parameters, which a project cannot read that way.

  **THE OFFICE'S FILE IS THE ONLY SOURCE, AND IT IS ONLY READ.** Each name is
  found in the shared parameter file Revit is set to (Manage > Shared
  Parameters). Nothing is written to that file and the setting is never
  changed: a GUID made here would be a different parameter under the office's
  name. No file set, or a name not in it, is refused with the close names.

  **THE KIND COMES FROM THE FILE.** Type or instance, and the Properties
  palette heading, are asked for.

  **A NAME ALREADY IN THE FAMILY** is left alone when it is this same shared
  parameter, and refused when it is anything else.

  **READ BACK, ALL OR NOTHING**: each is found again by name, shared, with the
  file's GUID and the scope asked.

  **REPLACING A FAMILY PARAMETER WITH A SHARED ONE (version 2).** With
  replaceExisting true each name is a pair, Old=SharedName - "Width=Unit_Width;
  Depth=Unit_Thickness" - and a family parameter already in the family becomes
  the office's shared parameter in place, as Family Types > Modify > Shared
  parameter > Select does. Every dimension label, formula and association that
  pointed at the old one points at the shared one after, and each keeps its own
  scope and every type's value. parameterGroup empty keeps each under its own
  heading; instance is not used. Refused by name before anything changes: a
  name not in the file, a kind that differs (a Length replaced by a Text), an
  old parameter already shared or built in, a shared name already in the
  family, and a formula that names the shared name - Revit refuses the replace
  while one does. Read back, all or nothing: shared with the file's GUID, same
  scope and heading, no family parameter left under the old name, every formula
  that read it reading the shared name, every other formula unchanged, labels,
  associations and values the same before and after.

  This is the way to give an existing family the office's size parameters
  without the two-per-size workaround (a shared one added beside a family one
  driven by a formula), which leaves both in the Properties palette.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The shared parameters' names as the office's file has them, commas
    # between.
    - name: parameterNames
      type: IList<string>
      source: request
    # true for instance parameters, false for type parameters.
    - name: instance
      type: bool
      source: request
    # The Properties palette heading - "Mechanical", "Identity Data".
    # When replacing, empty keeps each parameter under its own heading.
    - name: parameterGroup
      type: string
      source: request
    # true REPLACES family parameters already in the family with the office's
    # shared ones instead of adding new ones; each of parameterNames is then
    # Old=SharedName, and semicolons separate the pairs. instance is not used -
    # give it false, each keeps its own scope. Absent is false - adding,
    # exactly as version 1 did. `optional: true` is what lets it be left out
    # (HeronBindingNote.AbsentValue).
    - name: replaceExisting
      type: bool
      source: request
      optional: true
  provides:
    - name: added
      # Each one added, with its kind, scope and GUID, read back.
      role: result
      type: IList<string>
    - name: alreadyThere
      # Already in the family as this same shared parameter: looked at,
      # nothing done (D-52).
      role: accounting
      type: IList<string>
    - name: replaced
      # Each family parameter replaced, Old -> SharedName, read back with its
      # kind, scope, heading and the file's GUID.
      role: result
      type: IList<string>
    - name: formulasReadBack
      # Every formula that read an old name, and each replaced parameter's own
      # formula, read back after replacing - "Width = Unit_Width * 2" - as one
      # line.
      role: accounting
      type: string
    - name: keptLinks
      # What each replaced parameter was tied to, the same before and after:
      # labelled dimensions, connector sizes, nested families, every type's
      # value.
      role: accounting
      type: string
    - name: sharedFile
      # The shared parameter file that was read.
      role: accounting
      type: string
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing was added or replaced, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


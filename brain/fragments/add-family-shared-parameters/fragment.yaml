id: FRG-PAR-031
semantic-identity: "add the office's shared parameters, from its shared parameter file, to the family being edited, or replace family parameters with them - creating in that file the ones it does not have yet"
kind: action
domain: revit.families
capability: ADD_FAMILY_SHARED_PARAMETERS
version: 3
source: OFFICIAL
# ADMIN FROM VERSION 3 (D-106): creating writes the office's shared parameter
# file, which is outside the model and which Undo does not reach - D-106's own
# "a parameter written into the shared parameter file stays in that file".
# A card carries one risk, so adding and replacing without creating need the
# Admin switch too. ADD_PROJECT_PARAMETER, which also writes that file, is ADMIN.
# The owner kept it so, 2026-10-12: "keep it ADMIN" (NEEDS-CHECKING DF9).
risk: ADMIN

purpose: >
  Adds SHARED parameters to the family open in the Family Editor - Family
  Types' New Parameter with Shared parameter chosen, several at a time. A
  project schedules a family's own value, and its labels read it, only when it
  is a shared parameter with the same GUID in both; ADD_FAMILY_PARAMETERS
  makes family parameters, which a project cannot read that way.

  **THE OFFICE'S FILE IS THE ONLY SOURCE, AND IT IS ONLY READ** - unless
  createMissing asks for a definition to be written into it (version 3,
  below). Each name is found in the shared parameter file Revit is set to
  (Manage > Shared Parameters), and that setting is never changed: a GUID made
  here for a name the file already has would be a different parameter under
  the office's name. No file set, or a name not in it, is refused with the
  close names.

  **THE KIND COMES FROM THE FILE.** Type or instance, and the Properties
  palette heading, are asked for.

  **A NAME ALREADY IN THE FAMILY** is left alone when it is this same shared
  parameter, and refused when it is anything else.

  **READ BACK, ALL OR NOTHING**: each is found again by name, shared, with the
  file's GUID and the scope asked.

  **REPLACING A FAMILY PARAMETER WITH A SHARED ONE (version 2).** With
  replaceExisting true each name is a pair, Old=SharedName - "Width=Unit_Width;
  Depth=Unit_Thickness" - and a family parameter already in the family becomes
  the office's shared parameter in place, as Family Types > Modify > Shared
  parameter > Select does. Every dimension label, formula and association that
  pointed at the old one points at the shared one after, and each keeps its own
  scope and every type's value. parameterGroup empty keeps each under its own
  heading; instance is not used. Refused by name before anything changes: a
  name not in the file, a kind that differs (a Length replaced by a Text), an
  old parameter already shared or built in, a shared name already in the
  family, and a formula that names the shared name - Revit refuses the replace
  while one does. Read back, all or nothing: shared with the file's GUID, same
  scope and heading, no family parameter left under the old name, every formula
  that read it reading the shared name, every other formula unchanged, labels,
  associations and values the same before and after.

  This is the way to give an existing family the office's size parameters
  without the two-per-size workaround (a shared one added beside a family one
  driven by a formula), which leaves both in the Properties palette.

  **CREATING THE DEFINITION FIRST (version 3, 2026-10-12).** With createMissing
  true, a name the office's file does not have yet is written "Group: Name
  [Data type]" - "Refrigerant: Gas Pipe Diameter [Pipe Size]" - and is created
  in the file, as Manage > Shared Parameters > New Parameter does, before it is
  added or replaced exactly as a name found there. Adding: "Refrigerant: Gas
  Pipe Diameter [Pipe Size], Refrigerant: Liquid Pipe Diameter [Pipe Size]".
  Replacing the family parameters of the same names: "Gas Pipe Diameter=
  Refrigerant: Gas Pipe Diameter [Length]; Liquid Pipe Diameter=
  Refrigerant: Liquid Pipe Diameter [Length]" - Length, because a replace
  keeps the kind the family parameter holds, and a Pipe Size one is refused
  for a Length before the file is written. The colon and the brackets
  are read without ambiguity because Revit refuses both in a parameter's
  name. **The group and the data type are never chosen for it** - either
  missing is refused; the group is made in the file when it has none of that
  name. The data type is matched by its label as that dialog shows it, by its
  discipline and label, or by its internal name, and one that fits two
  ("Velocity") is refused naming both. A name the file already has is used as
  it is when it holds the data type written, and refused when it holds
  another - an existing definition is never changed. A plain name not in the
  file is refused as before, with how to write it. createMissing absent is
  false - exactly version 2.

  **EVERY REFUSAL COMES BEFORE THE FILE IS WRITTEN** - the family's own checks
  included, a read-only file too. Then each new definition is READ BACK TWICE
  - by Revit opening the file again, and in the file's own text on disk -
  for its name, its group, its data type and its GUID, and `created` lists
  each with the file's own word for its data type. Only then does the family
  change. **The file is outside the model: Undo does not take a definition out
  of it**, and a failure after it was written says what the file keeps. That
  is why this card is ADMIN (D-106): with Changes and Admin on.

  **VERSION 3's code shares the adding and replacing code of version 2**,
  whose proof is kept below as a record; the card is DRAFT until it is proved
  again (NEEDS-CHECKING Group DF), on a scratch copy of a shared parameter
  file, never the office's own.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The shared parameters' names as the office's file has them, commas
    # between.
    - name: parameterNames
      type: IList<string>
      source: request
    # true for instance parameters, false for type parameters.
    - name: instance
      type: bool
      source: request
    # The Properties palette heading - "Mechanical", "Identity Data".
    # When replacing, empty keeps each parameter under its own heading.
    - name: parameterGroup
      type: string
      source: request
    # true REPLACES family parameters already in the family with the office's
    # shared ones instead of adding new ones; each of parameterNames is then
    # Old=SharedName, and semicolons separate the pairs. instance is not used -
    # give it false, each keeps its own scope. Absent is false - adding,
    # exactly as version 1 did. `optional: true` is what lets it be left out
    # (HeronBindingNote.AbsentValue).
    - name: replaceExisting
      type: bool
      source: request
      optional: true
    # true CREATES in the shared parameter file each name it does not have
    # yet, written "Group: Name [Data type]" - in parameterNames, or as the
    # SharedName of a pair when replacing - then adds or replaces it as one
    # found there. The group and the data type are never defaulted. It WRITES
    # the office's file, which Undo does not reach. Absent is false - nothing
    # is written to the file, exactly as version 2.
    - name: createMissing
      type: bool
      source: request
      optional: true
  provides:
    - name: added
      # Each one added, with its kind, scope and GUID, read back.
      role: result
      type: IList<string>
    - name: alreadyThere
      # Already in the family as this same shared parameter: looked at,
      # nothing done (D-52).
      role: accounting
      type: IList<string>
    - name: replaced
      # Each family parameter replaced, Old -> SharedName, read back with its
      # kind, scope, heading and the file's GUID.
      role: result
      type: IList<string>
    - name: created
      # Each definition written into the shared parameter file - its name,
      # data type, group, GUID and the file's own word for the data type -
      # read back by Revit and in the file's text on disk. Empty unless
      # createMissing wrote one.
      role: result
      type: IList<string>
    - name: formulasReadBack
      # Every formula that read an old name, and each replaced parameter's own
      # formula, read back after replacing - "Width = Unit_Width * 2" - as one
      # line.
      role: accounting
      type: string
    - name: keptLinks
      # What each replaced parameter was tied to, the same before and after:
      # labelled dimensions, connector sizes, nested families, every type's
      # value.
      role: accounting
      type: string
    - name: sharedFile
      # The shared parameter file that was read.
      role: accounting
      type: string
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing was added or replaced, in plain words. Empty when the call
      # ran. A refusal never leaves the shared parameter file written.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


id: FRG-QA-028
semantic-identity: "which view templates and filters is nothing using"
kind: action
domain: revit.qa
capability: FIND_UNUSED_DEFINITIONS
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Reports the view templates and view filters that nothing in the project uses -
  the definitions that accumulate through years of copied views and template
  projects.

  **A DEFINITION IS NOT AN ELEMENT AND NOBODY SEES IT ACCUMULATE.** An unused
  family type is visible in a browser; an unused view filter sits in a dialog
  nobody opens. Fifty of them make every filter list unreadable, and the ones
  that matter get lost among them.

  **A FILTER CAN BE USED BY A TEMPLATE RATHER THAN BY A VIEW**, and a template
  that is itself unused still counts as a user of it. Both facts are reported -
  a filter used only by an unused template is a different finding from one
  nothing references at all, and only the second is safe to remove without
  thinking.

  **A TEMPLATE CAN BE IN USE WITH NO VIEW POINTING AT IT, AND THIS FRAGMENT
  USED TO MISS THAT.** A view family type names the template that NEW views of
  that kind start with. Nothing follows it today, so walking views alone called
  it unused - and deleting it silently changes what every new plan of that kind
  is created with, with nothing on screen having said so. Corrected 2026-09-06,
  found while building SELECT_VIEW_TEMPLATES: the second fragment asked the
  question a third way and the two answers disagreed, which is the only reason
  it was caught at all.

  **MATERIALS ARE NOT INCLUDED, ON PURPOSE.** Proving a material unused means
  walking every element, every type's compound structure and every painted face
  in the project. A partial answer there would be a deletion list with real
  materials in it, which is not a mistake worth risking for tidiness.
  FIND_UNUSED_MATERIALS is that walk, built separately because its cost is
  different by orders of magnitude and a cheap check that quietly became an
  expensive one stops being run.

  **IT REPORTS AND DELETES NOTHING**, for the same reason the unused-families
  fragment does: purging is one Revit command away, and it is hard to undo on a
  shared model.

  ASSUMES NOTHING ABOUT TRANSACTIONS - it opens none and needs none.

contract:
  needs:
    - name: doc
      type: Document
  provides:
    - name: unusedTemplates
      role: result
      type: IDictionary<ElementId, string>
    - name: unusedFilters
      role: result
      type: IDictionary<ElementId, string>
    - name: filtersUsedOnlyByUnusedTemplates
      # Filters whose only user is a template nothing uses - held alive by
      # something that is itself dead. A second-order finding, and the row
      # that decides whether removing a template frees anything.
      role: result
      type: IList<ElementId>
    - name: findings
      type: IList<string>

proof:
  date: "2026-09-06"
  by: "Claude Opus 5, at Ajmal PS's PC"
  model: >
    Snowdon Towers Sample HVAC.rvt (9,628 elements) and Project1 (3,410 elements, unsaved default template), both open at once in Revit 2024.3
  positive_case: >
    Project1: 15 unused view templates, 6 unused filters, and 1 template KEPT because a view family type names it as the default for new views - templatesKeptForViewTypeDefault 1. That is the defect corrected on 2026-09-06 firing on a real model: without it that template is reported unused, and deleting it changes what every new view of that kind is created with.
  negative_case: >
    Snowdon Towers: templatesKeptForViewTypeDefault 0, and filtersUsedOnlyByUnusedTemplates 1 - the second-order case reported separately rather than folded into the plain unused count. Both the kept-count and the second-order list return empty when they should.
  second_route: >
    REPORT_VIEW_FILTERS counted the same unused filters from the other direction in the same run - 9 on Snowdon, 6 on Project1.
  fingerprint: "a158af44710d19e5"

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. A view's template id, and the filters
  applied to a view, are read the same way 2020 to 2027 - including on a view
  that IS a template, which is what makes the second-order case readable.

# ROUTING - the same rows are in the fragments named here.
#
#   "which view templates are unused"    -> here. It is a QUESTION, and the
#                                           answer is a report
#   "the filter list is full of rubbish" -> here
#   "delete the unused templates"        -> SELECT_VIEW_TEMPLATES with usage
#                                           unused, which returns the templates
#                                           as ELEMENTS so something can act on
#                                           them. Reading the answer is here;
#                                           acting on it needs elements, and
#                                           that is the whole split between the
#                                           two. Both check the view-family-type
#                                           default, and they did not always -
#                                           see the purpose
#   "which families are unused"          -> FIND_UNUSED_FAMILIES
#   "which materials are unused"         -> FIND_UNUSED_MATERIALS
#   "which groups are unused"            -> FIND_UNUSED_GROUP_TYPES
#   "which views are not on a sheet"     -> FIND_UNPLACED_VIEWS
#   "what filters exist and where"       -> REPORT_VIEW_FILTERS, which lists
#                                           them all with their views rather
#                                           than only the unused ones
#   "delete these"                       -> DELETE_ELEMENTS, deliberately

utterances:
  - which view templates are not used
  # DECLARED BECAUSE THE TABLE ABOVE ALREADY CLAIMED IT, 2026-09-06. The
  # fragment declared "are NOT USED" and the table claimed "are UNUSED"; one
  # word apart, and the second resolved to SELECT_VIEW_TEMPLATES - which returns
  # elements to act on rather than answering the question.
  - which view templates are unused
  - the filter list is full of old filters
  - what can i purge from the templates
  - unused view filters

# VERSION 3 (2026-11-01) - PLACE_AREAS WAS MERGED INTO THIS CARD on the
# owner's instruction ("ok go ahead merge all", after "make sure there is no
# duplicate tools" and "in every conflict keep the safer rule"), and is
# DEPRECATED. The same job - the spatial element of one kind placed at the
# points chosen, the ones with no size named - for the third spatial element.
# What that card had and this one lacked: placeKind `area`; `areaPlanName`,
# the AREA PLAN chosen by name (an area plan only, never a floor plan of that
# name); NewArea at each point; `names` and `numbers` in point order, an
# empty value leaving Revit's; a point of two numbers; an area with no size,
# measured after one regeneration, named in `unbounded`; a point Revit
# refuses counted and named, the rest placed; no area plan of that name, no
# point, a point that is not one - refused, nothing placed.
#
# AREAS HAVE NO PHASE. The phase requirement is for rooms and spaces only:
# `phaseId` and `levelId` may now be left out ("none"), and a room or a space
# with either left out is refused exactly as before. The KIND must still be
# said - areas are never inferred from an area plan being named.
#
# THE SAFER RULES, NEW FOR THE MERGE: a name or a number that does not read
# back as given undoes the whole call (PLACE_AREAS set them and never looked);
# more names or numbers than points is refused, the lists not lining up; a
# level named that is not the area plan's own is refused; names or numbers
# handed in for rooms or spaces are refused rather than silently dropped.
# Nothing of PLACE_AREAS is left out. Where its outputs are now: `areaIds` ->
# `created`; `unenclosed` -> `unbounded`; `placed` -> `created` less
# `unbounded`; `report` and `findings` -> `refused` and `refusedPoints`.
#
# Version 1's proof below no longer described the code and was kept as
# the record; DRAFT at the time, until version 3 is proved on a real
# model (D-30).

# VERSION 2 (2026-11-01) - PLACE_ROOM_AT_POINT WAS MERGED INTO THIS CARD on the
# owner's instruction ("make sure there is no duplicate tools"), and is
# DEPRECATED. The same job - rooms or spaces placed on a level, the ones with
# no area named - with the spot found here and chosen there. Both are here
# now: `points`, "x,y,z; x,y,z" in millimetres, only the plan position used.
# What that card had and this one lacked: rooms or spaces at the points
# chosen; a point outside any enclosed region still makes a room, measured
# after one regeneration and named in `unbounded`; a point Revit refuses
# counted in `pointsRefused`, named in `refusedPoints`, the rest still placed.
#
# THE SAFER RULES KEPT: rooms or spaces must be SAID, and the PHASE is
# required at a point too - PLACE_ROOM_AT_POINT took a bool for the kind and
# used the calls that name no phase. A space at a point is placed in its
# phase; a room has no call taking a point and a phase, so its phase is read
# back and one in another phase undoes the call. Which phase Revit gives a
# room placed at a point is NEEDS REAL REVIT - until it is seen, a run on a
# phased model may refuse rather than place, which is the safe side. Where its
# outputs are now: `created` -> `created`; `unenclosed` -> `unbounded`;
# `refused` (a count) -> `pointsRefused`.
#
# Version 1's proof below no longer described the code (impl/ changed) and
# was kept as the record; DRAFT at the time, until version 2 is proved on a
# real model (D-30).

purpose: >
  Places a room - or an MEP space - in every enclosed area on one level, in one
  pass.

  **Spaces are the MEP half and they are not rooms.** An architectural model
  carries Rooms; an MEP model needs Spaces, and heating and cooling loads,
  airflow and every space-based schedule depend on them existing and being
  bounded. The two are indistinguishable to look at and are different elements,
  so which one is wanted is asked for, never guessed.

  **A space can be placed where a room already is**, and normally is - the room
  belongs to the architect's model, the space to yours, and they occupy the same
  air. So finding rooms already there is not a reason to refuse.

  **Anything not enclosed gets nothing**, and that list is the useful half of
  the answer - see the note below the contract for what it actually tells you.

  Version 2 places them at chosen points as well - `points` - with the phase
  and the kind asked for there too.

  Version 3 places areas too - placeKind area, in the area plan named, at
  the points given, with names and numbers in point order.

contract:
  needs:
    - name: doc
      type: Document
    # Version 3: may be left out ("none") for AREAS, which go on their area
    # plan's own level - a level named for them must be that one. Rooms and
    # spaces with none are refused, as before.
    - name: levelId
      type: ElementId
      source: request
      optional: true
      absent: none
    # rooms, spaces or - version 3 - areas. Always said, never inferred.
    - name: placeKind
      type: string
      source: request
    # Version 3: may be left out ("none") - an AREA has no phase. Rooms and
    # spaces with none named are refused, as before.
    - name: phaseId
      type: ElementId
      source: request
      optional: true
      absent: none
    # SPACES ONLY. Revit needs a plan view to place spaces from and rooms
    # needs none - see the compatibility note. Ignored when rooms are asked
    # for, rather than made a separate capability: it is the same job.
    # Version 2: may be left out ("none") - rooms and spaces at points need
    # no view, and spaces in every area are still refused without one.
    - name: planViewId
      type: ElementId
      source: request
      optional: true
      absent: none
    # VERSION 2, from PLACE_ROOM_AT_POINT. Where each room or space goes,
    # "x,y,z; x,y,z" in MILLIMETRES - only the plan position is used, the
    # level decides the height. Left out ("none"): every enclosed area of the
    # level, as version 1. A space at a point needs no plan view.
    - name: points
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 3, from PLACE_AREAS. AREAS ONLY: the area plan they go in, as
    # the Project Browser names it - an area plan, never a floor plan.
    - name: areaPlanName
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 3, from PLACE_AREAS. AREAS ONLY: names, comma separated, in
    # point order; left out leaves Revit's. Refused for rooms and spaces.
    - name: names
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 3, from PLACE_AREAS. AREAS ONLY: numbers, comma separated, in
    # point order; left out leaves Revit's.
    - name: numbers
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: created
      role: result
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string
    - name: unbounded
      # Rooms this fragment PLACED that came back with no area, because the
      # boundaries there do not close. A fact it established about what it
      # made - they sit in the schedule looking like real rooms. Version 3:
      # areas placed where no boundary encloses them, too (PLACE_AREAS'
      # `unenclosed`).
      role: result
      type: IList<ElementId>
    - name: untagged
      # Says the spaces were placed WITHOUT tags because no Space Tags family
      # is loaded - how they were placed, never a thing found (D-52). Empty
      # for rooms, and for spaces when a Space Tags type exists.
      role: accounting
      type: string
    - name: pointsRefused
      # VERSION 2, at points. How many points Revit placed nothing at - the
      # others are still placed. Never a thing it made (D-52).
      role: accounting
      type: int
    - name: refusedPoints
      # VERSION 2, at points. Each refused point, with Revit's reason. Empty
      # when none was refused (D-52).
      role: accounting
      type: string


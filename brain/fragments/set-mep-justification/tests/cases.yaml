positive:
  - given: >
      ducts at Middle vertical justification, vertical = Top
    expect: >
      set equal to the ducts given, unchanged 0, and each duct's Properties
      showing Vertical Justification "Top". Then look IN SECTION at a size
      change: whether the drawn run moved is the thing nobody has watched, and
      is written down either way

  - given: the same ducts asked for Top a second time
    expect: >
      set 0, unchanged equal to the ducts given. Writing the choice already
      there is never counted as a change (row 5b-1112)

  - given: pipes, horizontal = Left and vertical = Bottom in one call
    expect: >
      both choices read back in Properties as Left and Bottom on every pipe

negative:
  - given: fittings and flex among the runs
    expect: >
      counted in withoutJustification and NOT in set. "Twelve set" when nine
      could take the setting leaves three stepping and nothing saying which

  - given: vertical = Sideways
    expect: >
      refused before anything is touched, naming Middle, Bottom and Top.
      Nothing changed

  - given: both horizontal and vertical left out
    expect: refused, saying one of the two is needed. Nothing changed

  - given: >
      a word Revit does not show on that run - a Revit in another language
    expect: >
      that run refused, naming the words Revit does show, and its choice left
      exactly as it was - never a guessed number

  - given: no elements given
    expect: refused, with the reason

second_route: >
  Set the same runs with the Justification choices in the Properties palette
  and compare - and cut a section at the size change, which is where a run that
  did or did not move shows

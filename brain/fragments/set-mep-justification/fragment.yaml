compatibility-note: >
  One implementation for every release. `MEPCurve`,
  `BuiltInParameter.RBS_CURVE_HOR_OFFSET_PARAM` and
  `RBS_CURVE_VERT_OFFSET_PARAM` are present 2020 through 2027 - named
  "Horizontal Justification" and "Vertical Justification" in RevitAPI.xml 2020
  and 2024. No units are involved: the value is a choice, read and written as a
  whole number and matched by the word Revit shows for it.

# ROUTING - repeated in ALIGN_ELEMENTS, SET_MEP_SIZE and
# MEASURE_DISTANCE.
#
#   "line these up on their tops"    -> here
#   "keep the top flat through the reducer" -> here
#   "set the justification"          -> here
#   "set the justification of these beams" -> SET_FRAMING_JUSTIFICATION -
#                                       beams and braces, never ducts or
#                                       pipes. Added 2026-11-02 with that card
#                                       (row 5b-1444): a bare "set the
#                                       justification" names neither, so ask
#   "put these all at 2800"          -> ALIGN_ELEMENTS - whole runs moved
#                                       to a level. This decides where the pipe
#                                       sits INSIDE its own size, which is a
#                                       different question and often the one
#                                       actually meant
#   "make this duct 400 deep"        -> SET_MEP_SIZE. Changing the size is what
#                                       makes the justification matter
#   "how much headroom is left"      -> MEASURE_DISTANCE between the run and
#                                       the ceiling, which is what this setting
#                                       is usually protecting
#   "take those out of the set"          -> UPDATE_SAVED_SET, for a saved
#                                           selection set

utterances:
  - line these runs up on their tops
  - keep the top flat through the reducer
  - set the justification on these ducts
  - align the bottoms of these pipes
  # "set the mep offset" TAKEN OUT 2026-11-21 (row 5b-1918, issue #1114):
  # since version 2 this card sets Horizontal and Vertical Justification and
  # no offset, so the sentence pulled a request for a run's elevation here.
  # Measured with tools/score-routing.py --sentences before and after.

compatibility-note: >
  `ItemFactoryBase.NewAlignment`, `Dimension.IsLocked`, `Sketch.Profile`,
  `Sketch.SketchPlane`, `Extrusion.Sketch`, `Revolution.Sketch`,
  `Sweep.PathSketch`, `SweptBlend.PathSketch`, `Blend.BottomSketch` /
  `TopSketch`, `CurveElement.CenterPointReference`,
  `Reference.ConvertToStableRepresentation` / `ParseFromStableRepresentation`
  and `BuiltInParameter.ARC_CENTER_MARK` read the same 2020 through 2027
  (tools/api-surface, read 2026-11-10). Run and proved on Revit 2020 only
  (NEEDS-CHECKING Group NA, 2026-11-10); every later release is compiled, not
  run.

# VERSION 1, 2026-11-10 (row 5b-1491). Written for two jobs that day on Revit
# 2020 (session 9912): a square diffuser's cone rings as sweeps, whose face
# locks broke every size change, and a plenum box's spigot circle that kept
# its labelled size and drifted 75 mm off centre. References are reached the
# way LABEL_FAMILY_RADIUS reaches them - a sketch curve's own reference, a
# drawn arc's centre point read back from its written form - with no
# sketch-editing scope, which a family document refuses. A straight sketch
# line had NOT been aligned through the API anywhere in Heron before this; the
# centre-point alignment had (LABEL_FAMILY_RADIUS's torus and swept-blend
# routes). The "exactly on it" tolerance is the one measured for faces (row
# 5b-372), not yet for sketch curves.
#
# PROVED 2026-11-10, Revit 2020, session 9912, scratch family "Heron Sketch
# Lock Test" (NEEDS-CHECKING Group NA), signed by Ajmal PS on his "Yes, sign
# it". The proof block below is NA3's run (two path lines locked; "Ref. Level"
# refused). Beside it: NA1 - four path lines locked, and "Ring Left, Spigot Y"
# refused with NOTHING locked (all or nothing); NA2 - a circle's centre locked
# to two planes; NA4 - KEPT by the owner, then the ring resized 450 x 450 and
# 900 x 450 and read back exactly, no "Can't create sweep"; NA5 - the centre
# followed its planes to (250, 50), the circle whole only once its diameter
# was labelled. Revit takes a straight sketch line's reference outside sketch
# mode. Not run: NA3b (a second run), NA6 (the hand route), the kept run's own
# negative; and no release but 2020.
#
# ROUTING - see SET_FAMILY_SETTINGS for the whole family-building table.
#
#   "lock the sweep path to the planes"            -> here
#   "lock the circle centre to the center planes"  -> here
#   "lock the cylinder's top to Body Top"          -> LOCK_FORM_TO_PLANES, a
#                                                     face
#   "tie the circle's diameter to Neck Size"       -> LABEL_FAMILY_RADIUS, the
#                                                     size, not where it sits
#   "lock this extrusion to the reference planes"  -> LOCK_FORM_TO_PLANES: an
#                                                     extrusion's straight SIDES
#                                                     can be held either way, and
#                                                     the PROVEN face lock wins;
#                                                     here only for its circle

utterances:
  - lock the sweep path to the reference planes
  - align and lock the sweep's path lines to the planes
  - lock the circle centre to the center reference planes
  - keep the spigot circle centred on the reference planes
  - lock the path lines of this sweep to the reference planes

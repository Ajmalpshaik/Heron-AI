id: FRG-ELE-011
semantic-identity: "what level are these on, and how far above it"
kind: action
domain: revit.reporting
capability: READ_ELEMENT_LEVEL
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Which level each element belongs to, and its offset from that level in
  millimetres.

  **The level an element is ON and the level it is NEAR are different answers,
  and the model only knows the first.** A duct hosted on Level 1 with a 3800 mm
  offset sits above Level 2's floor and still reports Level 1. That is correct
  and it is the answer that surprises people, so the offset is reported beside
  the level rather than left out - a level name on its own invites the wrong
  conclusion in exactly the case somebody is asking about.

  **Elements have more than one way of carrying a level, and they are not
  interchangeable.** `LevelId` is empty on plenty of MEP elements that carry
  their level in a parameter instead, so both are read, in a fixed order, and
  the answer says nothing at all rather than guessing when neither is present.

contract:
  needs:
    - name: elements
      type: IList<Element>
  provides:
    - name: levelName
      type: IDictionary<ElementId, string>
    - name: offsetMm
      type: IDictionary<ElementId, double>
    - name: noLevel
      type: IList<ElementId>


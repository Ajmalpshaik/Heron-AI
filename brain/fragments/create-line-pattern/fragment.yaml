compatibility-note: >
  One implementation for every release. LinePattern(string), SetSegments and
  GetSegments, LinePatternSegment(LinePatternSegmentType, double),
  LinePatternElement.Create, GetLinePatternElementByName, SetLinePattern and
  GetLinePattern are present 2020 through 2027 - read off RevitAPI.xml in the
  Nice3point reference packages for all eight releases on 2026-10-12. Lengths
  are millimetres divided by 304.8 (D-20).


# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# THE PATTERN IN WORDS, millimetres on paper: "dash 6, space 2, dot, space 2".
# Revit's rules are checked before anything is made - starts with a dash or
# dot, alternates with spaces, ends with a space, every dash and space longer
# than zero - because Revit's own refusal names none of them.
#
# AN EXISTING NAME IS REFUSED unless replaceExisting is true, and then its
# segments are replaced IN PLACE, so every line style using it follows.
#
# READ BACK in the same words, off the stored pattern.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Creates a line pattern - Manage > Additional Settings > Line Patterns - from
  dashes, dots and spaces given in millimetres, or replaces the segments of an
  existing one.

contract:
  needs:
    - name: doc
      type: Document
    - name: patternName
      type: string
      source: request
    # "dash 6, space 2, dot, space 2" - millimetres on paper.
    - name: segmentsMm
      type: string
      source: request
    # true replaces the segments of a pattern of that name in place; false,
    # or not said, refuses an existing name.
    - name: replaceExisting
      type: bool
      source: request
      optional: true
  provides:
    - name: pattern
      role: result
      type: LinePatternElement
    - name: madeNew
      role: result
      type: bool
    - name: segmentsRead
      # The stored segments, read back and written in the same words.
      role: result
      type: string
    - name: refused
      # Why NOTHING WAS MADE, as one sentence; null when a pattern was made
      # or replaced (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>

proof:
  date: '2026-10-18'
  by: Ajmal PS
  model: Project2 (3,035 elements), Revit 2020, session 13520

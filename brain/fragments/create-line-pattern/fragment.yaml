    dot, not a space. NOTHING WAS MADE., replaceExisting false, segments 2 item(s) [Autodesk.Revit.DB.LinePatternSegment,
    Autodesk.Revit.DB.LinePatternSegment], segmentsRead . inputs came patternName as given;
    segmentsMm as given; replaceExisting as given. on Project2'
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';

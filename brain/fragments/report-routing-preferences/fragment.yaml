compatibility-note: >
  One implementation for every release. `MEPCurveType.RoutingPreferenceManager`,
  `RoutingPreferenceManager.GetNumberOfRules(RoutingPreferenceRuleGroupType)` and
  `GetRule(group, int)`, `RoutingPreferenceRule.MEPPartId`, `NumberOfCriteria`
  and `GetCriterion(int)`, and `PrimarySizeCriterion.MinimumSize` and
  `MaximumSize` are present and unchanged 2020 through 2027, with the same
  argument counts.

  **The rule's size window is reached through `GetCriterion(int)`, not through a
  `GetCriteria()` collection** - that method does not exist on any release,
  checked against the reference assemblies for 2020, 2024 and 2027.

  **No units API is called.** Criterion sizes are Revit internal feet and are
  multiplied by 304.8 to millimetres, plain arithmetic at the edge.

# ROUTING - the same rows are in the fragments named here.
#
#   "what fittings does this type use"  -> here
#   "why did it put that elbow in"      -> here
#   "why is there no fitting at all"    -> here, and read the SIZE RANGE: a size
#                                          outside every rule's window gets no
#                                          fitting and no warning
#   "make a new system type"            -> CREATE_MEP_SYSTEM_TYPE - a WRITE, and
#                                          what both these questions resolved to
#                                          until 2026-09-05
#   "draw a pipe"                       -> CREATE_PIPE. Check this FIRST when
#                                          drawing with a type you did not build
#   "put a fitting in here"             -> PLACE_MEP_FITTING - one fitting, by
#                                          hand, rather than the table that
#                                          decides them automatically
#   "the run is not connected"          -> FIND_DEAD_ENDS. A missing routing rule
#                                          is one CAUSE of that, and this says
#                                          whether it is this one


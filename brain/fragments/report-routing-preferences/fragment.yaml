id: FRG-MEP-029
semantic-identity: "which fitting this pipe or duct type will insert, and at which sizes"
kind: action
domain: revit.mep
capability: REPORT_ROUTING_PREFERENCES
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Reads the routing preferences table off a pipe or duct TYPE - which elbow,
  tee, cross, transition, union and cap Revit will insert, and at which sizes.
  The answer to *"why did it put THAT fitting in"*. It changes nothing.

  IT EXISTS BECAUSE THE QUESTION WAS BEING ANSWERED BY `CREATE_MEP_SYSTEM_TYPE`.
  Measured before this batch, both *"report the routing preferences of this pipe
  type"* and *"which fittings does this pipe type use"* resolved there - a
  fragment that CREATES a system type, for a question about an existing one.

  **THE THING THAT MAKES A TYPE FAIL SILENTLY: A SIZE OUTSIDE EVERY RULE'S RANGE
  GETS NO FITTING AT ALL.** Each rule carries a minimum and maximum size. Draw at
  a size outside every window in a group and Revit inserts nothing - the run just
  stays unconnected at that junction, **with no error and no warning.** That gap
  is what this fragment is really for, so the covered size range per group is
  reported explicitly rather than left to be worked out from a table of numbers.

  **A RULE POINTING AT AN UNLOADED FAMILY LOOKS LIKE A BUG AND IS NOT.** The rule
  is fine; the family is gone from the project. Same visible symptom as an empty
  group - no fitting appears - and a completely different fix, so the two are
  reported separately.

  **AN EMPTY GROUP IS A REAL ANSWER.** A type with no cap rule cannot cap a run.
  Reporting only the groups that have rules hides exactly the group somebody is
  asking about when a run will not close.

  Routing preferences are invisible until something goes wrong, and then they are
  the whole explanation. Checking one before drawing with a type you did not
  build costs nothing; finding out afterwards costs a redraw.


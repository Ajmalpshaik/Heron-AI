id: FRG-VIEW-135
semantic-identity: "dimension every face of these elements that faces one way - wall layers, floor layers, sills and heads, curtain grid lines"
kind: action
domain: revit.views
capability: DIMENSION_ELEMENT_FACES
version: 2
source: OFFICIAL
risk: MODIFY

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# ONE STRING PER ELEMENT through every planar face of its own solid whose
# normal runs the asked way: across (a wall's thickness, a floor's depth),
# along (down a wall), or the view's horizontal or vertical. That one rule
# covers three drawing jobs: the layers of a wall in a plan or section, the
# layers of a floor or roof in a section, and the base, sill, head and top
# of a wall in an elevation - an opening cuts the wall, so its sill and head
# are the wall's own faces. A curtain wall offers its grid lines instead.
# Faces at one position count once.
#
# The plan string along a wall through its jambs is this card's `along` -
# since 2026-11-01, when DIMENSION_WALL_OPENINGS was merged in (version 2);
# CREATE_DIMENSION strings family instances (refused here) - since
# 2026-11-01, when DIMENSION_FAMILY_INSTANCES was merged into it;
# CREATE_LINEAR_DIMENSION takes named references - grids, levels, planes -
# and since its version 5 (2026-11-01) is the one card for grids and levels.
#
# Whether Revit hands a compound wall's layers as separate faces is what the
# proof measures; a wall read as one piece gives its two outer faces only,
# and the string says so by its count.
#
# READ BACK: each string's segment values are read from the dimension made.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Draws one dimension string per element through every face of it that faces
  one way - the layers of a wall or slab, the sills and heads in an elevation,
  the grid lines of a curtain wall.

  **VERSION 2 DIMENSIONS THE OPENINGS ALONG A WALL** (DIMENSION_WALL_OPENINGS
  merged in): along a wall in a plan, end, jamb, jamb, end, with an overall
  outside it when asked, on the side of the wall the caller names, rooms
  accepted for their walls. Every string's segments are checked to add up.

contract:
  needs:
    - name: doc
      type: Document
    - name: view
      type: View
      source: request
    - name: elements
      type: IList<Element>
    # "across", "along", "horizontal" or "vertical"; an EMPTY value means across.
    - name: direction
      type: string
      source: request
    # Sideways from the middle of the element, in the view; 0 runs through it.
    - name: offsetMm
      type: double
      source: request
    # VERSION 2, from DIMENSION_WALL_OPENINGS. true also draws an overall
    # string twice the offset out, first face to last - the two-tier string a
    # plan uses. It needs an offset: at 0 it is not drawn, and the line says
    # why. Absent binds false (row 5b-227), version 1 exactly.
    - name: withOverall
      type: bool
      source: request
      optional: true
    # VERSION 2, from DIMENSION_WALL_OPENINGS. Which side of a WALL the strings
    # go, direction along, in a plan: right or left of the wall as drawn (its
    # location line, start to end); outside, away from the rooms - a room or
    # space found 300 mm clear of one face and not the other; with rooms on
    # both sides or neither, an Exterior wall type's own exterior face, any
    # other wall the side farther from the middle of the walls joined to it,
    # only on a tie its exterior face; inside the opposite. Left out ("keep")
    # is version 1's placement exactly. Named, only walls are strung; a side
    # it does not know, with another direction, or outside a plan, is refused
    # whole and nothing is drawn. DIMENSION_WALL_OPENINGS's blank side was
    # right of the wall as drawn - `right` here.
    - name: side
      type: string
      source: request
      optional: true
      absent: keep
  provides:
    - name: created
      role: result
      type: IList<ElementId>
    - name: measured
      # ONE STRING, each element's references and segment values (D-52). On a
      # refusal it carries the reason instead, so it is the read-back and
      # `created` is the evidence (D-51) - found 2026-10-18 on Revit 2020, a
      # 3D view refused with NOTHING WAS DRAWN in it.
      role: accounting
      type: string
    - name: noFaces
      # Elements that offered fewer than two faces that way, or were refused.
      role: accounting
      type: IList<ElementId>
    - name: segmentsDisagree
      # VERSION 2, from DIMENSION_WALL_OPENINGS. Elements whose string's
      # segments do not add up - to the overall when one was drawn, to the
      # span from the first face to the last otherwise - within 1 mm. An
      # extra face from a join notch is an extra segment that still reads as a
      # valid dimension; THE CHECK IS BUILT IN, and this is what it found.
      role: result
      type: IList<ElementId>
    - name: noOpeningFaces
      # VERSION 2. Walls dimensioned along their run that gave fewer than two
      # faces, or whose run is curved - no single direction to order faces
      # along. In noFaces too. The evidence it looked, never a string (D-52).
      role: accounting
      type: IList<ElementId>
    - name: notAWall
      # VERSION 2. With a side named, what was handed in and is not a wall -
      # and a room with no wall on its boundary. Given and unusable, never a
      # thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: sideUsed
      # VERSION 2. With a side named, one line per wall strung: which side its
      # strings went, in plan words (above, below, left of, right of the wall
      # on the view) and why. How the side was CHOSEN, never a thing it made
      # (D-52) - the strings are `created`.
      role: accounting
      type: IList<string>
    - name: findings
      type: IList<string>

# VERSION 1's PROOF, KEPT AS THE RECORD. Version 2 changed impl/, so its
# fingerprint no longer describes the code and the card is DRAFT until
# version 2 is proved on a real model (D-30).

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. Document.Create.NewDimension(View,
  Line, ReferenceArray), Options.ComputeReferences, PlanarFace.FaceNormal,
  Wall.Orientation and CurtainGrid, CurtainGrid.GetUGridLineIds and
  GetVGridLineIds, CurtainGridLine.FullCurve, new Reference(Element),
  View.ViewDirection, RightDirection, UpDirection and Origin, and
  DimensionSegment.Value are present 2020 through 2027 - read off
  RevitAPI.xml in the Nice3point reference packages for all eight releases on
  2026-10-13.

  Version 2 adds the calls DIMENSION_WALL_OPENINGS made, PROVEN on Revit
  2020: `Document.GetRoomAtPoint` and `GetSpaceAtPoint` (with a `Phase`), the
  view's `VIEW_PHASE` parameter, `SpatialElement.GetBoundarySegments`,
  `LocationCurve.get_ElementsAtJoin`, `WallType.Function` and
  `Dimension.Value` - present and unchanged 2020 to 2027.

# VERSION 2 (2026-11-01) - DIMENSION_WALL_OPENINGS WAS MERGED INTO THIS CARD
# on the owner's instruction ("make sure there is no duplicate tools";
# "merge means ... all area need to be covered"), and is DEPRECATED. The same
# technique - a wall's own planar faces, read with references computed - was
# already this card's `along`: ends and jambs, off the wall and never off the
# door. What that card had and this one lacked is here now: `withOverall`; the
# segments-add-up check (`segmentsDisagree`); `side` with `sideUsed` - right,
# left, outside away from the rooms, inside, by that card's rules word for
# word; rooms accepted for their walls; `notAWall`; `noOpeningFaces`; a curved
# wall refused along, where version 1 strung it along the view's horizontal.
#
# THE SAFER RULE IN EACH CONFLICT IS KEPT. That card checked the segments only
# with the overall drawn; here every string is checked - against the overall,
# or the span between its first and last face. That card drew the overall at
# offset 0 on top of the running string; here it is not drawn and the line
# says so. A side with a direction other than along, or outside a plan, is
# refused whole - beside the wall would point into the view. An element
# handed in twice is strung once.
#
# NOT CARRIED, AS OPPOSITE: a blank side meaning right of the wall as drawn.
# Blank here keeps version 1's placement - this card's PROVEN callers rely on
# it - and `side=right` is that card's blank, said out loud. And its strings
# were measured from the wall's location line; here from the middle of the
# wall, as version 1 measured every string - with side named, the string sits
# offsetMm from the wall's middle on that side.
#
# WHERE ITS OUTPUTS ARE NOW: created -> created (running and overall),
# segmentsDisagree -> segmentsDisagree, noOpeningFaces -> noOpeningFaces,
# notAWall -> notAWall, sideUsed -> sideUsed, refused (the unknown-side
# sentence) -> measured and findings, as every refusal here. Its call
# `offsetMm, withOverall, side` is `direction=along, offsetMm, withOverall,
# side=right`. Its sentences moved here.

# ROUTING - the same rows are in the fragments named here.
#
#   "dimension the layers of this wall"           -> here, across
#   "dimension the floor layers in this section"  -> here, across
#   "dimension the sills and heads in this elevation" -> here, vertical
#   "dimension the curtain grid"                  -> here, along
#   "dimension the openings along this wall"      -> here, along, since
#                                                    DIMENSION_WALL_OPENINGS
#                                                    was merged in (version 2)
#   "dimension the wall with the door in it"      -> here, along
#   "dimension the outside walls, on the outside" -> here, along, side=outside
#   "dimension the rooms"                         -> DIMENSION_ROOMS, which
#                                                    measures a room's size
#                                                    and cannot see an opening
#   "how wide is that door"                       -> READ_ELEMENT_PARAMETERS. A
#                                                    question must not be
#                                                    answered by marking the
#                                                    drawing
#   "dimension between grid A and grid B"         -> CREATE_LINEAR_DIMENSION


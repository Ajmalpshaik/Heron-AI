revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. Document.Create.NewDimension(View,
  Line, ReferenceArray), Options.ComputeReferences, PlanarFace.FaceNormal,
  Wall.Orientation and CurtainGrid, CurtainGrid.GetUGridLineIds and
  GetVGridLineIds, CurtainGridLine.FullCurve, new Reference(Element),
  View.ViewDirection, RightDirection, UpDirection and Origin, and
  DimensionSegment.Value are present 2020 through 2027 - read off
  RevitAPI.xml in the Nice3point reference packages for all eight releases on
  2026-10-13.

# ROUTING - the same rows are in the fragments named here.
#
#   "dimension the layers of this wall"           -> here, across
#   "dimension the floor layers in this section"  -> here, across
#   "dimension the sills and heads in this elevation" -> here, vertical
#   "dimension the curtain grid"                  -> here, along
#   "dimension the openings along this wall"      -> DIMENSION_WALL_OPENINGS
#   "dimension between grid A and grid B"         -> CREATE_LINEAR_DIMENSION

utterances:
  - dimension the layers of this wall
  - dimension the floor layers in this section
  - dimension the sills and heads in this elevation
  - dimension the curtain grid
  - dimension each layer of the roof in the section

id: FRG-ELE-095
semantic-identity: "push the top, bottom or side faces of these parts out or in"
kind: action
domain: revit.elements
capability: OFFSET_PART_FACES
version: 1
source: OFFICIAL
risk: MODIFY

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# faces picks top, bottom, vertical or all; a positive offset is outward. Only
# faces Revit lets move are moved. READ BACK: each face's offset.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Offsets the top, bottom, side or all faces of parts outward or inward by a
  distance - a finish thickened, a structure part trimmed back.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # top, bottom, vertical or all.
    - name: faces
      type: string
      source: request
    # Millimetres; positive is outward.
    - name: offsetMm
      type: double
      source: request
  provides:
    - name: offsetCount
      role: result
      type: int
    - name: partsTouched
      role: result
      type: IList<ElementId>
    - name: report
      # ONE STRING with every part left as it was and why (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>

proof:
  date: '2026-10-18'
  by: Ajmal PS
  model: Project1 (3,067 elements), Revit 2020, session 2648
  positive_case: run as it would normally be run - the arrangement was re-made first by running
    select-in-region, set-selection with this phase's own values - run inside a transaction,
    and Revit reported the transaction group ROLLED BACK afterwards. returned MmPerFoot 304.8,
    distance 0.328083989501312, findings 1 item(s) [1 top face(s) offset 100 mm on 1 part(s),
    read back.], lines 0 item(s), offsetCount 1, offsetMm 100, partsTouched 1 item(s) [345879],
    refusal (null), report , which top. inputs came elements from the selection (1); faces
    as given; offsetMm as given. on Project1
  negative_case: 'run with faces=top, offsetMm=100 arranged with categories=Walls, exact=False,
    maxMm=3000,300,100, minMm=2000,-300,-100 instead - chosen because it should not contain
    what this fragment reports - the arrangement was re-made first by running select-in-region,
    set-selection with this phase''s own values - run inside a transaction, and Revit reported
    the transaction group ROLLED BACK afterwards. returned MmPerFoot 304.8, distance 0.328083989501312,
    findings 2 item(s) [0 top face(s) offset 100 mm on 0 part(s), read back., 345432: not
    a part.], lines 1 item(s) [345432: not a part.], offsetCount 0, offsetMm 100, partsTouched
    0 item(s), refusal (null), report 345432: not a part., which top. inputs came elements
    from the selection (1); faces as given; offsetMm as given. on Project1'
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: a363c459a0b8cee9

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. Part.CanOffsetFace, SetFaceOffset and
  GetFaceOffset, Face.ComputeNormal and GetBoundingBox are present 2020
  through 2027 - read off RevitAPI.xml in the Nice3point reference packages for
  all eight releases on 2026-10-12. Millimetres are divided by 304.8 (D-20).

# ROUTING - the same rows are in the fragments named here.
#
#   "make parts from these walls"             -> CREATE_PARTS
#   "divide the parts at the grids"           -> DIVIDE_PARTS
#   "merge these parts"                       -> MERGE_PARTS
#   "exclude these parts"                     -> SET_PARTS_EXCLUDED
#   "offset the top of these parts"           -> OFFSET_PART_FACES

utterances:
  - offset the top of these parts by 20 mm
  - pull the sides of these parts in by 50 mm
  - thicken the finish parts at the top
  - push these part faces out

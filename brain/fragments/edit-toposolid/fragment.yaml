heron-step: 17
heron-status: DRAFT
heron-since: 0.1.0
heron-layer: brain

id: FRG-GEO-072
semantic-identity: "cut the terrain with this floor or pad, split it, simplify it or smooth it"
kind: action
domain: revit.geometry
capability: EDIT_TOPOSOLID
# Version 2 (2026-10-23, row 5b-1331) changed impl/: a simplify counts a
# toposolid as edited, and puts it in `resultIds`, only when its shape point
# count changed. Seen on Revit 2024.3 (session 83588) in a copy of Revit 2024's
# Snowdon Towers Sample Site.rvt, rolled back, simplify to 50%: "10
# toposolid(s) edited" where one read 2399 -> 1293 points and nine read 0 -> 0.
# Each one left as it was is now named in the report - "nothing to simplify -
# 0 shape points" or "unchanged" - and counted in the findings' first line.
# Excavate, split and smooth are as version 1 had them. DRAFT, never proven:
# NEEDS-CHECKING Group IY is the proof plan (D-30).
#
# VERSION 3 (2026-11-01) - ADD_TOPOSOLID_SUBDIVISION WAS MERGED INTO THIS CARD
# on the owner's instruction ("make sure there is no duplicate tools", then "ok
# go ahead merge all"), and is DEPRECATED. The same tool - a toposolid's own
# edits, on the toposolids handed in, one at a time, read back - and the only
# difference was the edit. Mode "subdivide" is that card's job: one outline
# "x,y; x,y; ..." in millimetres, closed automatically, made a subdivision on
# each toposolid by Toposolid.CreateSubDivision; each toposolid's subdivisions
# listed before and after, only a new one counted, its id in `resultIds` (that
# card's `subdivisionIds`); a point that is not two numbers named, fewer than
# three refused, a toposolid Revit refuses named. ONE RULE WAS NOT CARRIED, THE
# SAFER KEPT: it drew the outline at the toposolid's level's Elevation, which is
# measured from the level type's Elevation Base and on a survey-datum model is
# not the terrain's height; the outline now lies on the toposolid's own sketch
# plane, as a split's loops always have. Whether CreateSubDivision cares about
# the loop's height at all is NOT MEASURED - NEEDS REAL REVIT. Nothing else of
# that card is left out.
version: 3
source: OFFICIAL
risk: MODIFY

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# The toposolid's own operations: excavate by floors, building pads or
# foundations and take the cut away again (Revit 2025 on) - the nearest the
# API comes to grading, which it does not offer; split by closed loops into
# separate toposolids; simplify to a share of the inner points; and Smooth
# Surface on or off (2025 on, a setting Revit holds for the document).
# Excavation and smoothing are found by name, so the card runs on 2024 and
# says so when asked for them there.
#
# EDIT_SLAB_SHAPE moves the terrain's points and lays a floor to it; mode
# subdivide (version 3) paints a region on it - a car park, a path, a planted
# bed; CREATE_TOPOSOLID makes it.
#
# READ BACK: Revit's own excavation check, the split's new toposolids looked
# up, shape points counted before and after a simplify - a toposolid whose
# count did not change is named, never counted as edited - smoothing read again,
# and a subdivision found among the toposolid's subdivisions listed again.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Edits toposolids with their own tools - excavated by a floor or pad, split
  into pieces by loops, simplified to fewer points, or smoothed - or adds a
  subdivision to each, a car park, a path or a planted bed, from an outline of
  points in millimetres (version 3).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # "excavate", "unexcavate", "split", "simplify", "smooth" or, since
    # version 3, "subdivide".
    - name: mode
      type: string
      source: request
    # excavate and unexcavate: element ids, comma separated; split: loops of
    # "x,y; ..." in millimetres split by "|"; simplify: a share 1 to 99;
    # smooth: "on" or "off"; subdivide (version 3): one outline "x,y; x,y;
    # ..." in millimetres, closed automatically, wholly inside each toposolid.
    - name: value
      type: string
      source: request
  provides:
    - name: edited
      role: result
      type: int
    - name: resultIds
      # The toposolids edited, or the new ones a split made - or, for mode
      # subdivide (version 3), the new subdivisions, each read back among its
      # toposolid's subdivisions.
      role: result
      type: IList<ElementId>
    - name: report
      # ONE STRING, toposolid by toposolid (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>

revit: ["2024", "2025", "2026", "2027"]
runtime: [net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  Toposolid, its Split(IList<CurveLoop>), Simplify(double), SketchId and
  GetSlabShapeEditor are present from 2024; ExcavateBy, RemoveExcavationBy,
  CanBeExcavatedBy, SetSmoothedSurface and IsSmoothedSurfaceEnabled from
  2025, found by name so one implementation runs on 2024 - read off
  RevitAPI.xml in the Nice3point reference packages for all eight releases on
  2026-10-13. The card declares 2024 to 2027. Version 3's
  Toposolid.CreateSubDivision(Document, IList<CurveLoop>) and
  GetSubDivisionIds are present from 2024 and absent before - read the same
  way on 2026-10-12 for ADD_TOPOSOLID_SUBDIVISION, merged in.

# ROUTING - the same rows are in the fragments named here.
#
#   "cut the terrain with the building pad"   -> here, excavate
#   "split the site into two toposolids"      -> here, split
#   "simplify the terrain"                    -> here, simplify
#   "add a car park area to the terrain"      -> here, subdivide (version 3,
#                                                ADD_TOPOSOLID_SUBDIVISION
#                                                merged in)
#   "make the terrain"                        -> CREATE_TOPOSOLID
#   "raise the corners of this toposolid by 500" -> EDIT_SLAB_SHAPE, heights
#   "lay this floor to follow the terrain"    -> EDIT_SLAB_SHAPE, follow

utterances:
  - cut the terrain with the building pad
  - excavate the toposolid by this floor
  - split the site toposolid along this line into two
  - simplify the terrain to half its points
  - turn on smooth surface for the toposolid
  # MOVED 2026-11-01 from ADD_TOPOSOLID_SUBDIVISION, merged into this card.
  - add a car park area to the terrain
  - subdivide the toposolid for this path
  - mark out a planted bed on the site
  - create a subdivision on the topography here

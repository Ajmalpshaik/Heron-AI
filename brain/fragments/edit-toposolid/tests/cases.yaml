# D-30: the negative case is what catches "read something and called it the answer".

positive:
  - given: 'on Revit 2025, a sloping toposolid and a floor sunk into it, mode excavate, value the floor id'
    expect: >
      the toposolid cut by the floor - a hole where it stands, seen in a
      section; the report names the floor

  - given: 'a toposolid with 400 shape points, mode simplify, value "50"'
    expect: >
      the shape points before and after reported, about half after

  - given: >
      VERSION 2, row 5b-1331. Revit 2024: a copy of Revit 2024's Snowdon
      Towers Sample Site.rvt, all 10 of its toposolids, mode simplify, value
      "50"
    expect: >
      edited 1 and resultIds the one toposolid whose shape points dropped
      (1264746 on the 2026-10-23 copy, 2399 before, about 1293 after); the
      other nine named in the report, each "nothing to simplify - 0 shape
      points, left as it was", and none of them in resultIds. The first
      finding reads "1 toposolid(s) edited (simplify) and read back. 9
      toposolid(s) unchanged". Never "10 toposolid(s) edited"

  # VERSION 3 - ADD_TOPOSOLID_SUBDIVISION merged in. Each fails on version 2,
  # which refused mode "subdivide" as no mode it knew. NEEDS REAL REVIT.
  - given: >
      VERSION 3. One toposolid 30 x 20 m, mode subdivide, value
      "5000,5000; 15000,5000; 15000,10000; 5000,10000" - ADD_TOPOSOLID_SUBDIVISION's
      own case
    expect: >
      edited 1, resultIds one new subdivision id, read back among the
      toposolid's subdivisions; in the site plan it follows the terrain inside
      that outline. RECORD the toposolid's sketch plane height beside its
      level's Elevation: the outline is drawn at the first, where that card
      drew it at the second

  - given: >
      VERSION 3. The same on a model set out to a survey datum, where the
      toposolid's level has an Elevation Base of Survey Point
    expect: >
      the subdivision made where the terrain is - if Revit refuses an outline
      off the terrain's height, this is the case that shows whether the old
      Level.Elevation rule would have failed here

negative:
  - given: VERSION 3. mode subdivide, value "5000,5000; 15000,5000" - two points
    expect: >
      refused before anything is made, "A subdivision outline needs three
      points or more. NOTHING WAS MADE."; resultIds empty

  - given: VERSION 3. two walls, mode subdivide, value the outline above
    expect: >
      none made, each named as not a toposolid

  - given: two walls, mode simplify, value "50"
    expect: >
      nothing changed - each named as not a toposolid; edited 0

second_route:
  - Revit's Excavate and Simplify Surface on the same toposolid, read in a section

id: FRG-MEP-063
semantic-identity: "change the system type of these ducts, pipes or systems, and check it held"
kind: action
domain: revit.mep
capability: SET_MEP_SYSTEM_TYPE
version: 1
source: OFFICIAL
risk: MODIFY

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here (measured 2026-10-12: the
# first wording took "change SUP to SUPPLY" and "make a duct system type").
#
# EACH KIND IS CHANGED THE WAY REVIT CHANGES IT: a duct or pipe by its own
# SetSystemType call; a flex duct or flex pipe, which has none on any release,
# by its System Type parameter; a system element by ChangeTypeId, as the
# System Browser does. Fittings, accessories, terminals and equipment take
# their system from what they connect to, so they are named and left alone.
#
# A DUCT IS NEVER GIVEN A PIPE SYSTEM TYPE, nor a pipe a duct one.
#
# ONLY THE MODEL SAYS IT CHANGED: every element is read back after a
# regeneration. Revit may keep the old type, or carry the change along the
# whole connected run, which the answer says. Elements already of that type
# are counted apart, so a second run changes nothing.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Moves existing ducts, pipes, flex ducts, flex pipes or whole systems onto
  another duct or piping system classification - return air instead of
  exhaust, hot water instead of cold - and reads each one back.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # A duct or pipe system type by its Project Browser name.
    - name: systemType
      type: MEPSystemType
      source: request
  provides:
    - name: changed
      role: result
      type: int
    - name: changedIds
      # Read back as the asked type after a regeneration.
      role: result
      type: IList<ElementId>
    - name: alreadyThat
      # Already of the asked type before anything was written. The prior
      # state, never a change (D-52).
      role: accounting
      type: IList<ElementId>
    - name: notChanged
      # Left alone or refused or held at the old type by Revit; each reason
      # is in `report` (D-52).
      role: accounting
      type: IList<ElementId>
    - name: report
      # ONE STRING, element by element, because a list reaches the chat cut
      # short and the reasons are the part that matters (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>

proof:
  date: '2026-10-18'
  by: Ajmal PS
  model: Project2 (3,035 elements), Revit 2020, session 13520

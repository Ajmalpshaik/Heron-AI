compatibility-note: >
  One implementation for every release. `Connector.PipeSystemType`,
  `Connector.IsConnected`, `Connector.Domain` and `ConnectorManager` are
  unchanged 2020 through 2027 - read off the reference assemblies at both ends.
  The system type is turned into text with `ToString()` and compared
  case-insensitively, so a release that adds a new member to that enumeration
  cannot break the build - naming members individually is what would.

# ROUTING - repeated in FIND_DEAD_ENDS, TRACE_CONNECTIVITY and
# CHECK_ROOM_MEP_COMPLETENESS.
#
#   "are all the sinks and toilets connected to the drainage" -> here
#   "which fixtures have no vent"        -> here
#   "check the plumbing fixtures are plumbed" -> here
#   "which runs stop at nothing"         -> FIND_DEAD_ENDS - it starts at open
#                                           PIPE ends. A fixture nobody piped
#                                           produces no open end, so that
#                                           fragment structurally cannot see it
#   "what connects to what"              -> TRACE_CONNECTIVITY
#   "does every toilet have an extract"  -> CHECK_ROOM_MEP_COMPLETENESS - about
#                                           what is PRESENT in a room, not about
#                                           whether it is connected

utterances:
  - are all the sinks and toilets connected to the drainage
  - which fixtures have no vent
  - check the plumbing fixtures are plumbed
  - is every fixture connected to hot and cold
  - which fixtures are not connected

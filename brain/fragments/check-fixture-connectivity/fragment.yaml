id: FRG-MEP-026
semantic-identity: "is every plumbing fixture actually plumbed, per service"
kind: filter
domain: revit.mep
capability: CHECK_FIXTURE_CONNECTIVITY
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Checks that every plumbing fixture is actually plumbed - each of its
  connectors, cold, hot, sanitary and vent, either joined to the right kind of
  system or reported as missing. Covers the SUPPLY side and the DRAINAGE side
  together, because a fixture has both and checking one without the other passes
  half a defect. Read-only.

  **IT REPORTS BY SERVICE, WHICH IS THE ONLY USEFUL FORM.** *"Twelve fixtures
  have an unconnected connector"* is not actionable. *"Nine WCs have no vent and
  three basins have no hot water"* is. Every connector is classified by its own
  pipe system type and the table is one row per service per fixture.

  **A FIXTURE WITH NO CONNECTORS AT ALL IS A DIFFERENT DEFECT** from one with an
  unconnected service, and it is usually a family problem rather than a
  modelling one - the family was never built to be plumbed. Counted separately,
  because the fix is different and it is the row that keeps coming back until
  somebody looks at the family.

  **IT IS NOT `FIND_DEAD_ENDS` FROM THE OTHER END.** That one starts at open
  pipe ends and asks which are unexplained; a run ending AT a fixture counts as
  finished there and is correctly silent. This starts at the FIXTURE and asks
  which of its services were never run at all - a fixture nobody piped produces
  no open end to find, so the other fragment cannot see it.

  **THE SERVICE NAMES COME FROM REVIT'S OWN CLASSIFICATION**, not from the pipe
  system's name. A system somebody renamed still reports as sanitary or as
  domestic cold water, which is what makes the report comparable across projects.

contract:
  needs:
    - name: doc
      type: Document
    - name: fixtures
      type: IList<Element>
    - name: requiredServices
      type: IList<string>
      source: request
  provides:
    - name: findings
      type: IList<string>
    - name: missingService
      # The report itself - nine WCs with no vent, three basins with no hot
      # water. Named like bookkeeping, and it is the finding.
      role: result
      type: IList<ElementId>
    - name: noConnectors
      # A fixture with no connectors at all is *A DIFFERENT DEFECT* by this
      # fragment's own words - a family never built to be plumbed, counted
      # separately because the fix is different. The finding, not the
      # leftovers.
      role: result
      type: IList<ElementId>


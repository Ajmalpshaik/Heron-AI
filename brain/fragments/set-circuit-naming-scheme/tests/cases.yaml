# D-30: the negative case is what catches "succeeded and did nothing" - and,
# for this write, "changed something nobody asked for": a scheme already
# there replaced under its own name, or the project's scheme changed when it
# should have been left alone.
#
# THE ARRANGEMENT IS HALF OF EVERY CASE (NEEDS-CHECKING, the group named in
# docs/NEEDS-CHECKING.md for SET_CIRCUIT_NAMING_SCHEME): Group KU's scratch
# project made again in Revit 2024 (circuit naming schemes are 2021 on), new
# from Revit's metric ELECTRICAL template, saved under %TEMP%\heron-work -
# never a working model. By hand before the run: open Manage > MEP Settings >
# Electrical Settings > Circuit Naming and write down every scheme, its parts,
# and the one the project uses - "Standard" is assumed below for a scheme the
# template ships; use whatever name it has. THE METRIC ELECTRICAL TEMPLATE
# SHIPS NONE on Revit 2024 (row 5b-1660, "Also seen": the project's scheme id
# reads -1), so make one named "Standard" first - Revit's dialog, or this
# card's make with parts "panel; load name" kept - before the first negative.
# Place one branch panelboard DB-1
# and one circuit on it, so the circuit's name shows the scheme.
# FOR VERSION 3's CASES (row 5b-1739), by hand in Manage > Project Parameters:
# a text project parameter "Phase" bound to Electrical Circuits, and a shared
# or project parameter "Voltage" bound to Electrical Equipment ONLY.
# REPORT_ELECTRICAL_SETTINGS with show "naming" is run before and after every
# case - the second route.
#
# Every run below is ROLLED BACK (validate --write) except the one try-once,
# which the modeller keeps or discards.
#
# The negative leg is a DIFFERENT VALUE, not an empty one: a scheme name the
# model already has. It must come back with `changed` 0 and the scheme list
# the same before and after.

positive:
  - given: >
      action make, schemeName "Panel-Circuit", parts "panel; circuit number",
      separator "-"
    expect: >
      changed 1; after holds "\"Panel-Circuit\": Panel \"-\" + Circuit
      Naming Index" (Revit's own labels - version 2 maps "circuit number" to
      the circuit naming index, the parameter Revit takes in a scheme, row
      5b-1660) beside every scheme in before; the Circuit Naming dialog shows
      it, Panel then the circuit's number with a dash between them. Version 1
      was refused here: "Revit does not accept Panel + Circuit Number"

  - given: >
      action make, schemeName "Panel-Slot", parts "panel; start slot",
      separator "-"
    expect: >
      changed 1; after holds "\"Panel-Slot\": Panel \"-\" + Slot Index" -
      start slot is the slot index since version 2 (row 5b-1660); version 1
      named RBS_ELEC_CIRCUIT_START_SLOT and was refused

  - given: >
      after the one above is kept: action use, schemeName "Panel-Circuit"
    expect: >
      changed 1; after marks "\"Panel-Circuit\" ... - THE PROJECT'S"; the
      Circuit Naming dialog shows it as the project's, and DB-1's circuit
      reads DB-1-1 where the panel follows the project setting

  - given: >
      action make, schemeName "PanelCircuit", parts "panel; circuit number",
      separator left out
    expect: >
      changed 1; after holds "\"PanelCircuit\": Panel \"\" + Circuit
      Naming Index" - nothing between the parts - the separator left out is
      never read as a value called "none" (row 5b-1432); a "none" between
      them is the defect

  - given: >
      the "Phase" project parameter of electrical circuits in place: action
      make, schemeName "Panel-Phase", parts "panel; revit: phase", separator
      "-"
    expect: >
      changed 1; after holds "\"Panel-Phase\": Panel \"-\" + " and Revit's
      own label for CIRCUIT_PHASE_PARAM - "revit:" takes Revit's parameter
      only (version 3, row 5b-1739)

  - given: >
      the same: action make, schemeName "Panel-ProjectPhase", parts "panel;
      project: Phase", separator "-"
    expect: >
      changed 1 and after holds "\"Panel-ProjectPhase\": Panel \"-\" + Phase
      (project parameter)" - version 3 says a project parameter is one - OR
      refused "Revit does not accept Panel + Phase (project parameter) ..." if
      Revit takes no project parameter in a scheme. Either is
      Revit's answer and is recorded as it comes; a scheme holding Revit's own
      phase here is the defect

  - given: >
      the "Voltage" parameter bound to Electrical Equipment only: action make,
      schemeName "Panel-Voltage", parts "panel; voltage", separator "-"
    expect: >
      changed 1; Revit's own Voltage taken, NOT refused - a parameter not
      bound to Electrical Circuits is never counted as a second "voltage"
      (version 3's guard)

  - given: >
      the "Phase" project parameter of electrical circuits in place, and a
      shared "Phase" bound to Electrical Equipment only beside it: action
      make, schemeName "Panel-Bound-Phase", parts "panel; project: Phase"
    expect: >
      the circuit one taken - the same answer as "Panel-ProjectPhase" above,
      never "2 project parameters are named" - "project:" takes only a
      parameter bound to Electrical Circuits (version 3, the review of row
      5b-1739)

negative:
  - given: >
      the "Phase" project parameter of electrical circuits in place: action
      make, schemeName "Panel-Phase-Asked", parts "panel; phase", separator
      "-" - a name of its own, so a kept positive can never stop it early
    expect: >
      changed 0; refused "\"phase\" names both Revit's own ... and the
      project parameter \"Phase\" of electrical circuits - which one is never
      guessed. Write \"revit: phase\" for Revit's, or \"project: Phase\" for
      the project parameter." Version 2 made the scheme with Revit's phase
      and said nothing (row 5b-1739)

  - given: >
      action make, schemeName "Standard" - a name the model already has -
      parts "panel; circuit number", separator "-"
    expect: >
      changed 0; skipped "A circuit naming scheme is already named
      \"Standard\" - left as it is, nothing made."; before and after the
      same list, Standard's parts unchanged. THE FIRST CASE TO RUN

  - given: action make, schemeName "Panel Only", parts "panel; colour"
    expect: >
      changed 0; refused "\"colour\" is not a circuit parameter Heron can
      name ... The parts Heron knows: ..."

  - given: action make, schemeName "No Parts", parts left out
    expect: >
      changed 0; refused - which parameters it is made of is never guessed;
      the parts left out are never read as a value called "none" (row 5b-1432)

  - given: action use, schemeName "ZZNOSCHEME"
    expect: >
      changed 0; refused "No circuit naming scheme is named \"ZZNOSCHEME\".
      The model's schemes are: ..."; the project's scheme the same before and
      after

  - given: action use, schemeName the project's scheme already
    expect: >
      changed 0; skipped "The project already uses ... - left as it is."

second_route:
  - >
    Revit's own Manage > MEP Settings > Electrical Settings > Circuit Naming:
    every scheme, its parameters and separators, and the project's scheme the
    same as `after`, and nothing else different from `before`

compatibility-note: >
  One implementation for 2021 to 2027. CircuitNamingScheme.Create(Document,
  string, IList<TableCellCombinedParameterData>), GetCombinedParameters,
  IsNameUnique and IsValidCombinedParameters, and CircuitNamingSchemeSettings
  .GetCircuitNamingSchemeSettings, CircuitNamingSchemeId (get and set) and
  IsValidCircuitNamingSchemeId, are present 2021 through 2027 with the same
  signatures and absent in 2020 - read with tools/api-surface --members on
  2026-11-02. TableCellCombinedParameterData.Create, ParamId, CategoryId,
  Prefix, Suffix and Separator, LabelUtils.GetLabelFor(BuiltInParameter), and
  the twelve parameters the card names since version 2 (row 5b-1660) -
  RBS_ELEC_CIRCUIT_PANEL_PARAM, RBS_ELEC_CIRCUIT_NAMING_INDEX,
  RBS_ELEC_CIRCUIT_NAME, RBS_ELEC_CIRCUIT_SLOT_INDEX, RBS_ELEC_CIRCUIT_TYPE,
  CIRCUIT_LOAD_CLASSIFICATION_ABBREVIATION_PARAM, RBS_ELEC_NUMBER_OF_POLES,
  RBS_ELEC_CIRCUIT_RATING_PARAM, RBS_ELEC_CIRCUIT_FRAME_PARAM, RBS_ELEC_VOLTAGE,
  CIRCUIT_PHASE_PARAM and CIRCUIT_WAYS_PARAM - compile 2021 to 2027
  (tools/check-fragments-compile.py, 2026-11-16). A part's Separator is drawn
  after it, as ADD_SCHEDULE_COMBINED_FIELD measured in Revit 2020 for a
  schedule's combined parameters; that a circuit naming scheme draws it the
  same way has not been seen in Revit. Version 3 reads Document.ParameterBindings
  through BindingMap.ForwardIterator - DefinitionBindingMapIterator Key, Current
  and MoveNext, and ElementBinding.Categories - all 2020 to 2027
  (tools/api-surface --members, 2026-11-16). An ElementId is compared with ==,
  never read as a number.

# ROUTING (2026-11-02) - the same rows are in REPORT_ELECTRICAL_SETTINGS.
#
#   "make a circuit naming scheme Panel-Circuit with a dash"
#                                              -> here, action make,
#                                                 schemeName Panel-Circuit,
#                                                 parts "panel; circuit
#                                                 number", separator "-"
#   "use the Panel-Circuit naming for this project"
#                                              -> here, action use,
#                                                 schemeName Panel-Circuit
#   "which circuit naming scheme is the project using"
#                                              -> REPORT_ELECTRICAL_SETTINGS
#   "move these circuits to panel DB-2"        -> EDIT_MEP_SYSTEM, version 2 -
#                                                 a circuit's panel, not its
#                                                 name (EDIT_ELECTRICAL_CIRCUIT
#                                                 until 2026-11-04)
utterances:
  - make a circuit naming scheme Panel-Circuit with a dash
  - use the Panel-Circuit naming for this project

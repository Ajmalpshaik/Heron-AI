id: FRG-ELE-126
semantic-identity: "give these elements a material - on the element, its type or its system type, wherever their material lives - and read it back"
kind: action
domain: revit.elements
capability: SET_ELEMENT_MATERIAL
version: 1
source: OFFICIAL
risk: MODIFY

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# THE OWNER'S ASK, 2026-10-20: give elements a material by category, type or
# selection, and read each one back. The tools before this each reach one
# place: WRITE_ELEMENT_PARAMETERS a parameter named on the element itself,
# SET_COMPOUND_LAYER_WIDTH one layer of a wall or floor type, REPLACE_MATERIAL
# a swap of one named material for another. None found where an element's
# material lives.
#
# WHERE IT LIVES, in this order: a material parameter on the element; else on
# its type (every element of the type changes - counted for a family type);
# else, for a duct, pipe, fitting or accessory in a system, on the system type
# (every element of the system type draws with it). Two or more to choose from
# - a door's frame and panel - skips the element naming them, and
# materialParameter says which; nothing is guessed.
#
# BY CATEGORY OR TYPE is the selection handed in: SELECT_BY_CATEGORY_NAME,
# SELECT_TYPES or the modeller's own selection. Types handed in are written
# directly, and a type is written once however many of its elements arrive.
#
# A LAYERED WALL, FLOOR, ROOF OR CEILING is skipped naming
# SET_COMPOUND_LAYER_WIDTH, which sets a layer's material. An element in a
# group keeps its own parameters (REPLACE_MATERIAL's rule); its type's are
# written. A family document is refused naming SET_FAMILY_FORM_MATERIAL and
# SET_FAMILY_TYPE_VALUES.
#
# THE MATERIAL IS A NAME THE PROJECT HOLDS, or <By Category>; none is made.
# After one regeneration every parameter written must hold it, or the call
# fails and nothing is kept.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Gives the elements handed in a material by its name - written where each
  one's material lives: its own material parameter, its type's, or for ducts,
  pipes and fittings its system type's - and reads each one back, naming what
  a type change also reaches.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # A material's name as the project holds it, or "<By Category>".
    - name: material
      type: string
      source: request
    # The material parameter meant when an element has more than one -
    # "Frame Material". Left out, an element with one is written, and one
    # with several is skipped naming them.
    - name: materialParameter
      type: string
      source: request
      optional: true
      absent: any
  provides:
    - name: writtenIds
      # The elements, types and system types whose parameter now holds the material.
      role: result
      type: IList<ElementId>
    - name: materialAssignReport
      # ONE STRING, a line per parameter written: whose, before and after, and
      # what else a type change reached.
      role: result
      type: string
    - name: alreadyAsAsked
      # Parameters that already held the material - looked at, left (D-52).
      role: accounting
      type: int
    - name: skippedElements
      # Each element passed over, with its reason.
      role: accounting
      type: IList<string>
    - name: refused
      role: accounting
      type: string
    - name: findings
      type: IList<string>


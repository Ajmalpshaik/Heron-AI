    group ROLLED BACK afterwards. returned findings 1 item(s) [Two parts or more are needed
    to merge. NOTHING WAS MERGED.], merged 0, mergedPart (null), parts 0 item(s), refused
    Two parts or more are needed to merge. NOTHING WAS MERGED.. inputs came elements from
    filter-elements-by-category (6). on rig
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  built_on:
    revit_release: '2024'
    revit_build: 24.3.60.12
    addin_version: 0.2.0.0
    addin_hash: 80819edd3983a0d5
  fingerprint: 7580650ec40bc2c6

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. PartUtils.CreateMergedPart,
  ArePartsValidForMerge and GetMergedParts are present 2020 through 2027 - read
  off RevitAPI.xml in the Nice3point reference packages for all eight releases
  on 2026-10-12.

# ROUTING - the same rows are in the fragments named here.
#
#   "make parts from these walls"             -> CREATE_PARTS
#   "divide the parts at the grids"           -> DIVIDE_PARTS
#   "merge these parts"                       -> MERGE_PARTS
#   "exclude these parts"                     -> SET_PARTS_EXCLUDED
#   "offset the top of these parts"           -> OFFSET_PART_FACES

utterances:
  - merge these parts
  - join these floor parts back into one
  - combine the divided wall parts
  - merge the parts on either side of the grid

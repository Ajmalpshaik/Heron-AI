id: FRG-ELE-093
semantic-identity: "merge these parts back into one"
kind: action
domain: revit.elements
capability: MERGE_PARTS
version: 1
source: OFFICIAL
risk: MODIFY

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# Revit's own test decides whether the set can merge: touching, same material
# and source. A set that cannot is refused with the reason, nothing changed.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Merges adjacent parts of the same material back into one part.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
  provides:
    - name: merged
      role: result
      type: int
    - name: mergedPart
      role: result
      type: ElementId
    - name: refused
      # Why NOTHING WAS MERGED, as one sentence; null otherwise (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>

proof:
  date: '2026-11-16'
  by: Ajmal PS
  model: rig (3,331 elements), Revit 2024, session 8292
  positive_case: run as it would normally be run - the arrangement was re-made first by running
    filter-elements-by-category with this phase's own values - run inside a transaction, and
    Revit reported the transaction group ROLLED BACK afterwards. returned findings 1 item(s)
    [2 part(s) merged into one, read back.], merged 2, mergedPart 1 item(s) [id 352705], parts
    2 item(s) [352524, 352525], refused (null). inputs came elements from filter-elements-by-category
    (2). on rig
  negative_case: run with category=Walls instead - chosen because it should not contain what

id: FRG-ELE-173
semantic-identity: "remove a grid line from this one curtain wall, or take out or put back one segment of it - Revit's Add/Remove Segments"
kind: action
domain: revit.elements
capability: EDIT_CURTAIN_GRID_SEGMENTS
version: 1
source: OFFICIAL
risk: MODIFY

# VERSION 1 (2026-11-24) - written in a cloud session with no Revit, for
# WN-11 in GitHub issue #1005 (the facade note's "a grid line REMOVED, or one
# segment cut, on one wall"). Not tested in Revit. NEEDS-CHECKING Group QB,
# rows QB1 to QB4.

purpose: >
  TAKES A CURTAIN GRID LINE AWAY from ONE curtain wall - the one picked in
  Revit - or takes out one or more of its SEGMENTS, the pieces between the
  lines that cross it, or puts back segments taken out before. Revit's own
  Add/Remove Segments tool and deleting a grid line, typed: "remove the
  vertical grid line at 3000 on this curtain wall", "cut that grid line out
  of the bottom panel only", "put back the segment I removed".

  **THIS WALL ONLY.** The change is on the wall's own curtain grid; nothing
  on its family type is written, so no other wall changes with it.
  SET_CURTAIN_WALL_GRID is the one that changes a type's layout for all its
  walls. ADD_CURTAIN_GRID_LINES adds new lines.

  **ONE STRAIGHT CURTAIN WALL AT A TIME.** Exactly one among what is handed
  in; anything else that is not a curtain wall is named in `notCurtain` and
  left alone; two curtain walls are refused; a curved one is refused.

  **A LINE IS NAMED BY WHERE IT IS.** `direction` vertical - a line running up
  the wall, `lineAt` its distance ALONG the wall from its START - or
  horizontal - a transom, `lineAt` its HEIGHT above the BASE. Millimetres,
  digits only, commas between, measured off the grid's own edges, the way
  ADD_CURTAIN_GRID_LINES places a line; a line within 5 mm is that line. A
  position with no line there refuses the whole call, naming where the lines
  that way are.

  **A SEGMENT IS NAMED BY A POINT ON IT.** `segmentsAt` left out or "all": the
  whole line. Otherwise millimetres on the line - a height on a vertical line,
  a distance from the start on a horizontal one - and each picks the segment
  whose span holds it. A point on the joint between two segments is refused,
  because which one was meant cannot be told. Naming every segment a line has
  left is refused: say "all" to take the line away.

  **`action` remove or restore.** Left out it is remove. Remove with "all"
  deletes the line, and the mullions on it go with it, counted; remove with
  points takes those segments out. Restore with "all" puts every segment
  taken out back; restore with points puts those back. A segment already the
  way asked is skipped and named, never counted.

  **A PINNED LINE IS REFUSED, BY NAME.** The lines a curtain wall type lays
  out arrive pinned to it; taking one away or apart changes what the type
  drew on this wall, so it is a deliberate act - SET_PIN_STATE unpins it
  first, or SET_CURTAIN_WALL_GRID changes the type for every wall.
  ASSUMPTION for the proof: that a type's own lines read pinned through the
  API as they show the pin in Revit.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16). Every
  refusal is made before the first write. After one regeneration every change
  is read back off the wall - a deleted line no longer there, a removed
  segment among the skipped ones, a restored one among the existing - and one
  that is not stops the call, and nothing it did is kept. In a shared model a
  wall another user holds is refused naming them.

# WHAT THE ANSWER CARRIES - in a comment, not in the purpose, so the indexed
# words stay about the job:
#
#   readBack   the lines that way before and after, the wall's panels and
#              mullions before and after, and each change made
#   changed    lines deleted + segments taken out + segments put back, each
#              READ BACK, never counted off a call that returned

contract:
  needs:
    - name: doc
      type: Document
    # THE ONE CURTAIN WALL - selected in Revit, or what the step before made.
    - name: elements
      type: IList<Element>
    # "vertical" or "horizontal" - which way the named lines run.
    - name: direction
      type: string
      source: request
    # MILLIMETRES, digits only, commas between: a vertical line's distance
    # along the wall from its start, or a horizontal line's height above its
    # base.
    - name: lineAt
      type: string
      source: request
    # "all" - the whole line - or millimetres ON the line, each naming the
    # segment that holds it: a height on a vertical line, a distance from the
    # start on a horizontal one.
    - name: segmentsAt
      type: string
      source: request
      optional: true
      absent: all
    # "remove" or "restore".
    - name: action
      type: string
      source: request
      optional: true
      absent: remove
  provides:
    - name: changed
      # Lines deleted, segments taken out and segments put back - each read
      # back off the wall after Revit rebuilt it.
      role: result
      type: int
    - name: notFound
      # Positions named where the wall has no line that way - each with where
      # its lines are. The evidence it looked (D-52).
      role: accounting
      type: IList<string>
    - name: notCurtain
      # Handed in but not a curtain wall, so left alone (D-52).
      role: accounting
      type: IList<string>
    - name: readBack
      # The wall as Revit holds it after, beside before. A STRING, because a
      # reply cuts a list to three items and this is the evidence. Empty on a
      # refusal.
      role: accounting
      type: string
    - name: refused
      # Why nothing was changed, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


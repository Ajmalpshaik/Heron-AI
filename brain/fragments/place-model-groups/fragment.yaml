compatibility-note: >
  One implementation for every release. `Create.PlaceGroup(XYZ, GroupType)`,
  `GROUP_LEVEL`, `GROUP_OFFSET_FROM_LEVEL` and the `OST_IOSModelGroups` /
  `OST_IOSDetailGroups` categories are present 2020 through 2027, read with
  tools/api-surface on 2026-10-14. No ElementId is built from a number.

# ROUTING - the same rows are in GROUP_ELEMENTS and COPY_ELEMENTS.
#
#   "place the toilet block group here"     -> here
#   "put another one of this model group down here" -> here
#   "group these"                           -> GROUP_ELEMENTS - makes the group
#   "copy this group up to the other floors"-> COPY_ELEMENTS - copies a placed
#                                              group to other levels
#   "what is in this group"                 -> SELECT_GROUP_MEMBERS


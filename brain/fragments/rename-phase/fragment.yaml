id: FRG-DOC-028
semantic-identity: "rename a phase in the model"
kind: action
domain: revit.phases
capability: RENAME_PHASE
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Asks Revit to rename a phase - the tidy-up when a model's phases still carry
  Revit's defaults and the job has moved on, *"Existing"* and *"New
  Construction"* becoming *"Design"* and *"As-Built"* on handover.

  **REVIT REFUSES IT, AND THIS FRAGMENT EXISTS TO SAY SO EXACTLY.** Measured
  2026-09-16 on `PIPE`, Revit 2020: `Element.Name` throws *"This element does
  not support assignment of a user-specified name"*, and the `PHASE_NAME`
  parameter behind it reports `IsReadOnly`. Both doors, one run, verbatim -
  [FRAGMENT-ISSUES row 104](../../../docs/FRAGMENT-ISSUES.md). A phase is not
  an editable object from the API, which is the same fact `REPORT_PHASES`
  already carried about CREATE and nobody had read across.

  **SO WHAT IT DELIVERS IS A CORRECT NO, AND THAT IS WORTH HAVING.** Before it,
  *"rename this phase"* resolved to `SELECT_BY_PHASE`, or to
  `SET_ELEMENT_PHASE` - **which moves elements between phases**. A wrong write
  that looks like it worked is worse than a refusal, and a refusal naming the
  three clicks that do work (Manage, Phases, type over the name) is better than
  both. Only Revit 2020 has been measured; the plain setter is still tried
  first, so on any release that allows it `route` will say so.

  **A PHASE IS AN ELEMENT AND `RENAME_ELEMENTS` STILL CANNOT REACH IT.** That
  fragment renames what a selection hands it, and no selection in this library
  yields phases: they live in `doc.Phases`, an array reached from the document
  and from nowhere else. `SELECT_BY_PHASE` sounds like the way in and is not -
  it returns the elements standing IN a phase, never the phase itself. The
  nearest route without this fragment is REPORT_PHASES for the ids, then
  FILTER_ELEMENTS_BY_ID, then RENAME_ELEMENTS - three fragments, and the last
  of them carries an open rollback defect.

  **RENAMING A PHASE BREAKS NOTHING THAT POINTS AT IT, and that is worth saying
  because it is the fear that stops people doing it.** Views, phase filters and
  schedules hold a phase by `ElementId`, not by its name, so every one of them
  follows the rename and the new name simply appears wherever the old one
  showed. Phase FILTERS are safer still - they are written against phase
  STATUS (New, Existing, Demolished, Temporary), which is not the name at all.

  **THE ORDER IS NOT TOUCHED.** Phases are sequential and Revit keeps them so;
  this writes a name and never a position. A phase renamed to something that
  sorts earlier alphabetically still sits where it sat.

  **A NAME ALREADY IN USE IS REFUSED BEFORE THE WRITE.** Revit throws on a
  duplicate phase name, and a throw partway through is a worse place to find
  out. A name differing only in CASE is left to Revit to accept or refuse
  rather than guessed at here - see tests/cases.yaml, which asks the proof to
  settle it.

  **DELETING A PHASE IS DELIBERATELY NOT HERE.** It is not the same shape of
  job: deleting a phase in Revit reassigns or destroys every element standing
  in it, and which phase they land on is a decision no fragment should make
  quietly. Renaming moves nothing.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: phaseName
      type: string
      source: request
    - name: newName
      type: string
      source: request
  provides:
    - name: renamed
      role: result
      type: bool
    - name: previousName
      # The name it actually renamed FROM, written only on success. It is the
      # evidence the fragment moved the phase the caller meant rather than
      # whichever one came first - and it is empty on every refusal, which is
      # what makes the negative case readable (D-30).
      role: result
      type: string
    - name: route
      # Which door the rename went through - "Element.Name" or "PHASE_NAME
      # parameter". Empty when nothing was renamed. It is a result rather than
      # accounting because it moves with the work: a phase that now answers to
      # the new name always names the door that got it there, and on a release
      # where the plain setter starts working this is what will say so.
      role: result
      type: string

    - name: refused
      # Why it declined, in the user's words. The evidence it looked and said
      # no - never a thing it found, so it must not count toward "did this come
      # back empty" (D-52).
      #
      # A STRING RATHER THAN A LIST, for two reasons found on 2026-09-16 rather
      # than guessed. The checks are one if/else chain, so at most ONE reason
      # exists - a list of at most one describes the fragment wrongly. And a
      # list's items are shortened to 60 characters by the executor while a
      # string is returned whole, which truncated Revit's own refusal to
      # "- Thi..." on the first proof run and hid the fact that run existed to
      # find.
      role: accounting
      type: string

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Document.Phases` returns a `PhaseArray`
  walked by index on 2020 through 2027, and `Element.Name` is declared get/set
  across the same span. Nothing here touches a unit, and nothing builds an
  `ElementId` from an integer, so the 2024 `ElementId` widening does not reach
  it.

  **`Element.Name` COMPILES ON A PHASE AND REVIT REFUSES IT AT RUNTIME.**
  Measured 2026-09-16 on `PIPE`, Revit 2020: *"This element does not support
  assignment of a user-specified name."* The member exists on every release -
  `check-api-surface` agrees, and it is right - so no surface check and no
  compile could have found this. Only running it against a model did.

  So the rename goes through the `PHASE_NAME` parameter, with `Element.Name`
  still tried first: it is the documented route, it costs one caught exception
  where it is refused, and on any release where it starts working `route` will
  say so rather than leaving the fragment quietly on the back door forever.
  Whether 2021-2027 refuse it too is NOT established - one release was
  measured, and a declared absence is not the same as none.

# ROUTING - repeated in REPORT_PHASES, SET_ELEMENT_PHASE, RENAME_ELEMENTS and RENAME_WORKSET.
#
#   "rename this phase"                  -> here
#   "Existing should be called Design"   -> here
#   "the phase names are wrong"          -> here
#   "what phases are in this model"      -> REPORT_PHASES - a READ, and the
#                                           discovery step this one needs
#                                           first, because a rename wants the
#                                           EXACT existing name
#   "put these ducts on the new phase"   -> SET_ELEMENT_PHASE - moves ELEMENTS
#                                           between phases and leaves every
#                                           phase name alone
#   "show this view as existing"         -> SET_VIEW_PHASE - a drawing setting
#   "select everything on this phase"    -> SELECT_BY_PHASE - returns the
#                                           elements IN a phase, never the
#                                           phase, which is why it cannot feed
#                                           a rename
#   "rename these elements"              -> RENAME_ELEMENTS - a find-and-replace
#                                           across a SELECTION; no selection
#                                           yields a phase
#   "rename this workset"                -> RENAME_WORKSET - the other named
#                                           thing that is not reachable by
#                                           selection, and a different table again
#   "delete this phase"                  -> NOWHERE, deliberately. It reassigns
#                                           or destroys the elements standing in
#                                           it; do it by hand in Manage, Phases

utterances:
  - rename this phase
  - rename the phases
  - change the phase name
  - the phase names are wrong
  - Existing should be called Design

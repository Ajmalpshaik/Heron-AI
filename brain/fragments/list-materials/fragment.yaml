compatibility-note: >
  One implementation for every release. `Material`, `Material.MaterialClass`
  and `Element.Name` read the same 2020 to 2027 (tools/api-surface, measured
  2026-10-09). The id is printed by `ElementId.ToString()` - never
  `IntegerValue`, which is deprecated at 2024 and gone by 2026, and never a
  constructor - so nothing meets the 2024 widening to 64-bit. Version 3 adds
  the four Surface/Cut Foreground/Background pattern ids and colours,
  UseRenderAppearanceForShading, AppearanceAssetElement.GetRenderingAsset,
  Application.GetAssets(AssetType.Appearance), Asset.Title, and the property
  names on Generic, UnifiedBitmap and SchemaCommon - present 2020 to 2027,
  read off the shipped assemblies with tools/api-surface on 2026-10-20 - and
  names the appearance-asset namespace, supplied since D-146.

# ROUTING - repeated in FIND_UNUSED_MATERIALS and
# TRANSFER_MATERIALS_BETWEEN_DOCUMENTS, the two that were handed row 5b-376's
# question before this existed.
#
#   "list the materials in this family"   -> here
#   "what materials are in this project"  -> here
#   "show me all the materials"           -> here - the list, used or not
#   "how many materials are there"        -> here - materialCount
#   "which materials is nobody using"     -> FIND_UNUSED_MATERIALS - the
#                                            expensive walk this one does not do
#   "what material is that"               -> READ_ELEMENT_MATERIAL - the
#                                            material of an ELEMENT, a different
#                                            question with the same word in it
#   "everything in galvanised steel"      -> SELECT_BY_MATERIAL, which needs a
#                                            material's name - found here
#   "set the material colour"             -> SET_MATERIAL_COLOUR, by name
#   "make this extrusion steel"           -> SET_FAMILY_FORM_MATERIAL, by name
#   "make a new material"                 -> CREATE_MATERIAL
#   "bring the materials over from the
#    template"                            -> TRANSFER_MATERIALS_BETWEEN_DOCUMENTS,
#                                            the write row 5b-376's question was
#                                            handed before this existed
#   "how much of each material is there"  -> REPORT_MATERIAL_TAKEOFF - quantities

# WHERE EACH SENTENCE CAME FROM. "list the materials in this family" is the
# modeller's own, typed 2026-10-09 with a Duct Accessories family open (row
# 5b-376). "show me all the materials in this project" is the row's second
# sentence, measured there the same day. "what materials are in this project"
# and "show me all the materials" are the owner's, given with the request for
# this card on 2026-10-09 as what a modeller says. Nothing else is declared.


# ROUTING (2026-10-12, the gap fill)
#
#   "which material textures are missing"   -> REPORT_MATERIAL_TEXTURES
#
# ROUTING (2026-10-20, version 3 - the material tools of Group IA)
#
#   "show every property of the materials"  -> here, withAllTabs
#   "which appearances does the library have" -> here, withLibraryAppearances
#   "fill in the identity tab"              -> SET_MATERIAL_PROPERTIES
#   "give these materials a render appearance" -> SET_MATERIAL_APPEARANCE
#   "add a starter set of materials"        -> CREATE_STARTER_MATERIALS
utterances:
  - list the materials in this family
  - show me all the materials in this project
  - what materials are in this project
  - show me all the materials
  - list the materials with their thermal and physical properties
  # ADDED 2026-10-14. Claimed by the routing table above and never declared;
  # on the trained backend (model2vec 0.10.0, potion-base-8M, private stores)
  # main reached it here and the gap-pass branch reached READ_ELEMENT_MATERIAL,
  # whose answer is per element, not the project's list.
  - how many materials are there

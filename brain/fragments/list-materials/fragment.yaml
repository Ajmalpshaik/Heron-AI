id: FRG-ELE-077
semantic-identity: "every material this project or family holds, by name, with its class"
kind: filter
domain: revit.elements
capability: LIST_MATERIALS
version: 6
source: OFFICIAL
risk: READ

# WHY THIS EXISTS. FRAGMENT-ISSUES row 5b-376, 2026-10-09: a modeller with a
# Duct Accessories family open in Revit 2024 asked "list the materials in this
# family" and was handed TRANSFER_MATERIALS_BETWEEN_DOCUMENTS - a write - on
# the lexical backend; the trained backend gave FIND_UNUSED_MATERIALS, which
# lists only the materials nothing uses. "show me all the materials in this
# project" reached the transfer on both. Section 3d recorded the want on
# 2026-09-08 ("There is no list of the materials that ARE used") and section
# 3i asked for it as list-materials. Every tool that takes a material takes it
# BY NAME, and nothing could tell anybody the names.
#
# THE PURPOSE IS SHORT ON PURPOSE. The nearness route embeds the card as one
# averaged string (retrieval-history, 2026-09-28), and a purpose that names
# selecting, colouring and transferring would pull those sentences here. The
# tools this feeds are named in the routing block below instead.
#
# AND IT SAYS "MATERIAL" TWICE, ON MEASURED GROUNDS - 2026-10-09, scratch
# stores, both search backends. The first wording said it six times. That
# made this card first BY WORDS for "what material is that" and "what material
# are these", READ_ELEMENT_MATERIAL's questions: on the trained backend the two
# cards then swapped ranks between the routes, which fuses to an exact tie
# (row 5b-236), and only READ_ELEMENT_MATERIAL being PROVEN kept the questions
# there - a margin that would vanish the day this card is proved. Worded as
# below, "what material are these" goes to READ_ELEMENT_MATERIAL by words #1
# and nearness #1 on both backends, with this card not among the five shown;
# "what material is that" is declared there since row 5b-375.
#
# "HOW MANY THERE ARE" IS IN IT FOR THE COUNT QUESTION. With no count phrase at
# all, "how many materials are there" went - once row 5b-375's edits were in -
# to TRANSFER_MATERIALS_BETWEEN_DOCUMENTS, a write, on the lexical backend.
# Worded "the number of them" (measured on the base before row 5b-375 only),
# it went to READ_ELEMENT_MATERIAL and FIND_UNUSED_MATERIALS - reads, neither
# of them this job. With "how many there are" this card answers it on both
# backends. ITS COST, recorded in row 5b-376 rather than tuned away, all on
# the lexical backend and all between reads: "how many rooms are there" goes
# from COUNT_BY_SPATIAL_CONTAINER to REPORT_AREA_VOLUME_COMPUTATIONS, and "show
# me all the families" - SELECT_SUBCOMPONENTS on main - comes HERE, a list of
# materials for a question about families (found by the review of PR #450,
# which asked count and listing questions beyond materials). It also tipped
# "how much space does this take up" to REPORT_SPACE_AIRFLOW, 0.000029 apart,
# while only a comment on REPORT_BOUNDING_BOX claimed it; row 5b-385 declared
# it there, and it now goes there by exact match.
#
# THE PURPOSE NAMES "USED" IN ORDER TO DISCLAIM IT, AND THAT PULLS QUESTIONS
# ABOUT USE HERE - recorded, not tuned. "what is this material used on",
# "list the materials that are used", "which materials are used in this
# project" and others now reach this card, a read whose answer says which tool
# answers them; before it they reached FIND_UNUSED_MATERIALS,
# READ_ELEMENT_MATERIAL or the transfer, and "what uses this material"
# reached SET_MATERIAL_COLOUR, a write. Without "used" and "uses" they go
# back, including that write (measured by the review of PR #450). Against
# row 5b-396's held-out set the same words pull 2 of 10 UNUSED-material
# questions from FIND_UNUSED_MATERIALS on the trained backend, and tip "what
# material was used when these were created" from a 0.000001 tie on main to
# CREATE_PIPE_SEGMENT, a write. Three rewordings without them fixed both and
# each sent a question to a write on the LEXICAL backend - the one the
# owner's PC answers on - so they stay. Group CX has the numbers.
#
# THE CHAT READS THE PINNED MODEL. The add-in runs this on the document it is
# handed, and a chat hands it the model that chat is pinned to - not always
# the one in front. The purpose says so in one sentence; worded longer, the
# card lost "what materials do we have" and "materials in this model" to
# FIND_UNUSED_MATERIALS by BM25's length weighting, so "quick on any model"
# (never measured) went instead. On the trained backend "materials in this
# model" and "which materials are in this model" still go there; both had been
# won by 0.000008. THE LAST CLAUSE IS "AND THE ANSWER SAYS SO" BECAUSE EVERY
# OTHER WORDING TRIED MOVED SOMETHING: "which the answer names" and "the
# answer gives its title" put this card ahead of DESCRIBE_ELEMENTS for the
# owner's question #20, "Give me the family name and type name for all these
# items" ("name" and "give" are prefixes of its words); "and the answer says
# which" sent "which family is the heavy one", which REPORT_GEOMETRY_COMPLEXITY
# claims, to LOAD_FAMILY - a write - on the lexical backend.
#
# "WHAT THE MATERIAL BROWSER SHOWS" IS THE INTENT, NOT A MEASUREMENT. The
# collector returns every Material element in the document; whether the
# browser lists exactly those, in this order, nobody has looked - that is
# NEEDS-CHECKING CX5, and a difference is a finding about this card.

# VERSION 3, 2026-10-20 - the owner's "all the parts should be covered" (Group
# IA, row 5b-1263). The read report the material tools needed: one line per
# material with every tab - withAllTabs - and the names Revit's appearance
# library holds - withLibraryAppearances - so an appearance is chosen by a
# name the PC has, never by one assumed. namePattern narrows the list. All
# three are optional and absent reads as version 2 did. Version 2 was never
# proved (Group CX), so nothing stales.

# VERSION 4, 2026-10-20 - row 5b-1272, found running Group IA's IA1 on Revit
# 2020. Version 3 listed the library by each asset's UIName and called it the
# asset browser's name; measured, the UIName of every library asset there is
# Revit's code ("ACADGen-001", "Prism-256") and Title is empty. The list now
# gives Title, else a Prism asset's description - most often the browser's
# name, not always: Prism-152's "Glass - clear" shows as "Glass (Clear)" -
# with the code in [ ], and the code alone for an older asset,
# whose description is a sentence its kind shares ("Generic material." on 557
# assets). Assets Revit marks Hidden are left out and counted. Only
# withLibraryAppearances' answer changed.

# VERSION 5, 2026-11-01 - REPORT_MATERIAL_TEXTURES WAS MERGED INTO THIS CARD on
# the owner's instruction ("make sure there is no duplicate tools", then "ok go
# ahead merge all"), and is DEPRECATED. The same walk - the document's
# materials, read only - and one more tab of each: the files behind its
# appearance. What it had and this card lacked: every slot of the rendering
# asset with a bitmap (diffuse, bump, cutout and the rest), each stored path
# and whether a file is there; a path with no drive or share reported as
# RELATIVE - Revit's texture folders and Options' render appearance paths are
# not readable here - and never called missing; the full paths with no file in
# `missing`; and `onlyMissing`, the missing ones alone. They are `withTextures`
# and `onlyMissing` here, `textures` and `missing` the same names and types;
# its `materialCount` - the materials that USE a texture - is said in the
# findings, because this card's `materialCount` is every material listed. It
# reads over the materials this card lists, so namePattern narrows it too.
# Nothing of that card is left out, and no rule of the two was opposite.
# While impl/ changed anyway, the second finding's pointer for unused
# materials was repointed from FIND_UNUSED_MATERIALS - merged into
# FIND_PURGEABLE_ELEMENTS on 2026-11-01 and offered by nothing - to that tool,
# with includeMaterials.
# The proof below (2026-10-20) no longer describes the code (impl/ changed) and is
# kept as the record; DRAFT until version 5 is proved on a real model (D-30).
purpose: >
  Counts and lists everything the Material Browser shows for the document
  Heron is working on - a project, or a family open in the Family Editor: how
  many there are, and each one's name, class (Metal, Concrete, Plastic) and
  element id, sorted by name.

  **IT LISTS WHAT THE DOCUMENT HOLDS, NOT WHAT IS USED.** One read, and nothing
  else. Whether anything uses an entry means walking every element, every type
  and every painted face - FIND_PURGEABLE_ELEMENTS' walk with includeMaterials
  (FIND_UNUSED_MATERIALS' until 2026-11-01), not repeated here.

  **A FAMILY'S LIST IS THE FAMILY'S OWN.** In the Family Editor the answer is
  what that family carries, never what a project it is loaded into holds, nor
  another document open beside it. A chat reads the model it is pinned to,
  and the answer says so.

  **WITH ITS ASSETS, WHEN ASKED** (version 2, 2026-10-13, the gap fill):
  `withAssets` adds every number of each material's physical and thermal
  asset - density, conductivity, specific heat - as Revit formats it in the
  project's units, so no unit is converted here.

  **EVERY TAB, WHEN ASKED** (version 3): `withAllTabs` reads each one's
  identity, graphics and render appearance in one line - and which have no
  appearance at all; `withLibraryAppearances` lists the appearance assets
  Revit's library holds.

  **THE TEXTURE FILES, WHEN ASKED** (version 5): `withTextures` lists the
  image files each appearance uses, slot by slot, with whether each file is
  there, and names the missing ones; `onlyMissing` lists only those.

  ASSUMES NOTHING ABOUT TRANSACTIONS - it opens none and needs none.

contract:
  needs:
    - name: doc
      type: Document
    # Each material's physical and thermal asset values too; absent reads false.
    - name: withAssets
      type: bool
      source: request
      optional: true
    # Version 3. Each line gains the Identity fields that hold anything, the
    # Graphics tab and the Appearance tab - its asset, who shares it, and a
    # Generic one's colour, image, glossiness, highlights and transparency -
    # with the physical and thermal assets as withAssets reads them.
    - name: withAllTabs
      type: bool
      source: request
      optional: true
    # Version 3. Every appearance asset of Revit's appearance library on this
    # PC, in libraryAppearances - by Revit's description where it names the
    # look, most often the asset browser's name, and by Revit's code (version 4).
    - name: withLibraryAppearances
      type: bool
      source: request
      optional: true
    # Version 3. Only the names this matches - "TRG_*". Left out, every one.
    - name: namePattern
      type: string
      source: request
      optional: true
      absent: all
    # Version 6 (2026-11-07, FRAGMENT-ISSUES 5b-1466, issue #799 item 4). Only
    # the library appearances whose name or code it matches - "*grass*", or a
    # word with no * or ?, which matches anywhere in the name. Given, it lists
    # the library by itself. Left out it reads "all", and the library is listed
    # whole as before - namePattern never filtered it, so `namePattern=1.GRASS`
    # with withLibraryAppearances returned all 1,942 assets (87,931 characters)
    # on Villa 1, Revit 2024.
    - name: libraryPattern
      type: string
      source: request
      optional: true
      absent: all
    # Version 5, from REPORT_MATERIAL_TEXTURES. The image files behind each
    # listed material's appearance, slot by slot, with whether each is there.
    - name: withTextures
      type: bool
      source: request
      optional: true
    # Version 5. Only the texture files that are missing - and the textures
    # are read for it, withTextures or not. Absent reads false.
    - name: onlyMissing
      type: bool
      source: request
      optional: true
  provides:
    - name: materialCount
      # How many materials the document holds - or, given namePattern
      # (version 3), how many of them it matches, which the first finding
      # says. A thing it FOUND, so a result (D-52) - and the number to compare
      # with the Material Browser.
      role: result
      type: int
    - name: materialList
      # Every material on ONE line, sorted by name: "Name (class, id N)",
      # with "  ||  " between. One string because a collection reaches the
      # chat as its count and its first three items, each cut at 60
      # characters (RevitFragment.Describe and ShortName), and a list of names
      # somebody asked to READ is no use as three of them. NOT CAPPED: a
      # template holding a thousand materials sends one line of tens of
      # kilobytes. Expected, not measured - NEEDS-CHECKING CX6 records it.
      role: result
      type: string
    - name: materialClasses
      # The count per class on one line - "Concrete 4, Metal 9, no class 1" -
      # empty when there are no materials. A string for the same reason as the
      # list. A thing it FOUND, so a result (D-52).
      role: result
      type: string
    - name: materialIds
      # The same materials as element ids, in the same order, for a next step
      # in a chain. Named for what it holds - ids, not names - and no
      # fragment's need is called `materialIds`. NOT `materials`, which
      # REPORT_MATERIAL_TAKEOFF provides (READ_ELEMENT_MATERIAL until 2026-11-01)
      # as a dictionary of a different type.
      role: result
      type: IList<ElementId>
    - name: libraryAppearances
      # Version 3, withLibraryAppearances: every asset of Revit's appearance
      # library Revit does not mark hidden, sorted, on ONE line - since
      # version 4 "Browser name [code] (kind)", or "code (kind)" where Revit
      # gives no other name - the names SET_MATERIAL_APPEARANCE and
      # CREATE_STARTER_MATERIALS take. Empty when not asked.
      role: result
      type: string
    - name: textures
      # Version 5, from REPORT_MATERIAL_TEXTURES. ONE STRING, a line per
      # texture file: "material | slot | path | found, MISSING or relative".
      # Empty when not asked.
      role: result
      type: string
    - name: missing
      # Version 5. "material / slot: path" for each FULL path with no file - a
      # relative path is never in it (D-52).
      role: result
      type: IList<string>
    - name: findings
      type: IList<string>


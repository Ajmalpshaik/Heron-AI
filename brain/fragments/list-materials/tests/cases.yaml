# NONE OF THESE HAS BEEN RUN. Written 2026-10-09 with version 1, for
# NEEDS-CHECKING Group CX - row 5b-376. The arrangement is the three scratch
# documents in tools/jobs/list-materials-2026-10-09.yaml, open together.
#
# THE MATERIAL BROWSER SHOWS NO TOTAL (Revit knowledge, not measured), so
# "its count" below means the rows of Project Materials: All, counted by hand.
# The scratch project is started with no template so that list stays short.

positive:
  - given: >
      "Heron Materials Project", a scratch project in which CREATE_MATERIAL
      made one material, "Heron List Probe", before the run
    expect: >
      materialCount equals the hand count of its Material Browser, and
      materialList holds "Heron List Probe" with its class and id among the
      rest, sorted by name ignoring case; materialClasses gives the count per
      class and adds up to materialCount

  - given: >
      "Heron Materials Accessory", a scratch copy of a Duct Accessories family
      open in the Family Editor - the kind of document row 5b-376 was asked in
    expect: >
      the family's own materials, the count equal to that family's own hand
      count. A family carries few, and every one is listed whether or not a
      form uses it

  - given: >
      a material whose class is empty in the Identity tab - "Heron List Probe"
      if CREATE_MATERIAL left it empty, otherwise one material whose class was
      cleared by hand in the scratch project before the run (CX5)
    expect: >
      it is listed as "(no class, id N)" and counted under "no class" in
      materialClasses - never left out for having no class

  - given: a project whose material Concrete carries a physical asset of density 2400 kg/m3 and a thermal asset, withAssets true
    expect: >
      Concrete's line carries its physical asset's density and its thermal
      asset's conductivity as Revit shows them in Properties (version 2)

  - given: >
      version 3 - the Group IA scratch project after CREATE_STARTER_MATERIALS,
      withAllTabs true, namePattern "TRG_*"
    expect: >
      twelve lines, each with its identity, its shading colour and patterns,
      and "appearance 'TRG_...' (Generic) colour ..." equal to its shading
      colour; a material with no appearance asset reads "appearance NONE"

  - given: version 3, withLibraryAppearances true
    expect: >
      libraryAppearances lists the asset browser's library assets by the
      names it shows - compare five of them by eye (IA1)

  # VERSION 5 - REPORT_MATERIAL_TEXTURES merged in. NOT RUN. Each fails on
  # version 4, which had no withTextures, onlyMissing, textures or missing.
  - given: >
      VERSION 5. A material given an image texture from C:/Heron/brick.jpg,
      then that file renamed, onlyMissing true - REPORT_MATERIAL_TEXTURES' own case
    expect: >
      `missing` naming that material, its diffuse slot and C:/Heron/brick.jpg;
      `textures` holding that one line, "... | MISSING"

  - given: VERSION 5. The same model, withTextures true
    expect: >
      every texture file of every material listed, each "found", "MISSING" or
      "relative - looked up in Revit's texture folders, not checked here"; a
      relative path is never in `missing`

  - given: >
      VERSION 6, row 5b-1466 (issue #799 item 4, Villa 1, Revit 2024):
      libraryPattern "grass" with withLibraryAppearances left out
    expect: >
      the library listed BY ITSELF, holding only assets whose listed name or
      code contains "grass", and a finding saying how many it kept and left
      out. Version 5 had no such input: namePattern filtered the project's
      materials only, and the library came back whole - 1,942 assets, 87,931
      characters - or not at all

  # Row 5b-203, added 2026-11-11 with version 7. NOT RUN - Group NK, NK8.
  - given: >
      the same material BEFORE the project parameter is added - Keywords
      typed on its Identity tab, the name carried once; withAllTabs true
    expect: >
      "keywords '<what was typed>'" on its identity line, as version 6 gave
      it, and `ambiguous` EMPTY - the count must not turn down a name that
      occurs once

negative:
  - given: >
      "Heron Materials Annotation", a family new from Metric Generic
      Annotation.rft with every material in it deleted and saved (CX2), run
      while the project holding "Heron List Probe" is open beside it
    expect: >
      materialCount 0, materialList and materialClasses empty, and the first
      finding "No materials at all in this family" - above all no "Heron List
      Probe". A version that read the project, or every open document, shows
      it here

  - given: >
      Revit will not let every material in the annotation family go, so no
      document is empty - then the three documents of the job file, one after
      another
    expect: >
      each count equal to its own document's hand count, and "Heron List Probe"
      in the project's list alone (D-53 tracking). Evidence for a person, NOT a
      signature: no tool records tracking across documents yet, and
      heron_validate will not accept a record whose negative came back full

  - given: somebody reading the list as the materials in USE
    expect: >
      a material nothing uses is listed exactly like one that is used, and the
      second finding says "Listed used or not - unused ones:
      FIND_PURGEABLE_ELEMENTS with includeMaterials" (version 5 - until then
      it named FIND_UNUSED_MATERIALS, merged into that tool on 2026-11-01).
      Which are unused is that tool's walk over every element, type and
      painted face, which this does not make

  - given: version 3, namePattern "ZZZ*"
    expect: >
      materialCount 0, materialList empty, and the first finding "No material
      matches 'ZZZ*'" - never "No materials at all", which would be untrue

  - given: VERSION 5. The file named back, onlyMissing true
    expect: >
      `missing` empty and `textures` empty - a found file is never listed as
      missing

  - given: >
      VERSION 6, row 5b-1466: libraryPattern "zzqx-no-such-asset" - a word no
      library asset carries
    expect: >
      libraryAppearances empty and the finding saying 0 kept and every visible
      asset left out - never the whole library. The same run's project
      materials still listed, because libraryPattern filters the library alone

  # Row 5b-203, added 2026-11-11 with version 7. NOT RUN - NEEDS-CHECKING
  # Group NK, NK8; it needs a model that carries a duplicated name. On Revit
  # 2024, never 2020: withAllTabs crashed there (row 5b-1404).
  - given: >
      a project with a project parameter called "Keywords" (Text) bound to
      Materials, so every material carries the name twice; withAllTabs true,
      namePattern one material whose Identity tab has Keywords typed in
    expect: >
      that material's identity line reads "keywords NOT READ - 2 parameters
      share that name", the material is in `ambiguous` and a finding names
      it - never the typed keywords and never the project parameter's value,
      whichever Revit returned first (row 5b-203). The
      rest of its line - description, class, graphics, assets - is unchanged

second_route:
  - >
    Revit's own Material Browser (Manage > Materials), Project Materials: All,
    compared name by name with materialList in each document, and the class
    read off the Identity tab of two or three of them

# NONE OF THESE HAS BEEN RUN. Written 2026-10-09 with version 1, for
# NEEDS-CHECKING Group CX - row 5b-376. The arrangement is the three scratch
# documents in tools/jobs/list-materials-2026-10-09.yaml, open together.

positive:
  - given: >
      "Heron Materials Project", a scratch project in which CREATE_MATERIAL
      made one material, "Heron List Probe", before the run
    expect: >
      materialCount equals the count the Material Browser shows with Project
      Materials set to All, and materialList holds "Heron List Probe" with its
      class and id among the rest, sorted by name ignoring case

  - given: >
      "Heron Materials Accessory", a scratch copy of a Duct Accessories family
      open in the Family Editor - the kind of document row 5b-376 was asked in
    expect: >
      the family's own materials, its count equal to that family's Material
      Browser count. A family carries few, and every one is listed whether or
      not a form uses it

  - given: a material whose class is empty in the Identity tab
    expect: >
      it is listed as "(no class, id N)" and counted under "no class" in the
      findings - never left out for having no class

negative:
  - given: >
      "Heron Materials Annotation", a family new from Metric Generic
      Annotation.rft, run while the project holding "Heron List Probe" is open
      beside it
    expect: >
      materialCount 0 and "No materials at all in this family" - and above all
      no "Heron List Probe". A version that read the project, or every open
      document, shows it here. THAT THE TEMPLATE HOLDS NONE IS NOT MEASURED:
      its own Material Browser is opened first

  - given: >
      the annotation template turns out to hold materials, so no document is
      empty - then the three documents of the job file, one after another
    expect: >
      three different counts, each equal to its own Material Browser's, and
      "Heron List Probe" in the project's list alone (D-53 tracking). One count
      repeated across documents means the answer is not following the
      document

  - given: somebody reading the list as the materials in USE
    expect: >
      a material nothing uses is listed exactly like one that is used, and
      the findings say so. Which are unused is FIND_UNUSED_MATERIALS, a walk
      over every element, type and painted face that this does not make

second_route:
  - >
    Revit's own Material Browser (Manage > Materials), Project Materials: All,
    counted and compared name by name with materialList in each document, and
    the class read off the Identity tab of two or three of them

id: FRG-MEP-043
semantic-identity: "break the joint between these two, and leave everything else alone"
kind: action
domain: revit.mep
capability: DISCONNECT_CONNECTORS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Breaks the physical connections BETWEEN the elements handed to it. Nothing is
  deleted, moved or resized - only the joint is undone.

  **IT DELETES NOTHING, AND THAT IS DELIBERATE.** Disconnecting an elbow leaves
  the elbow sitting there, connected to nothing. That looks untidy and it is the
  correct behaviour: deciding a fitting is now rubbish is a judgement about the
  design, and DELETE_ELEMENTS is where a judgement like that is made explicitly.
  A disconnect that silently swept up fittings would be a delete wearing a
  smaller word.

  **BY DEFAULT IT ONLY BREAKS JOINTS INSIDE THE SELECTION.** Given a duct and the
  fitting on its end, it separates those two and leaves the fitting's OTHER end
  attached to whatever is beyond. Breaking every connection an element has,
  including to things nobody selected, is a much larger act - it is available,
  but it is a flag the caller has to set, not the default.

  **A LOGICAL CONNECTION IS NOT A PHYSICAL ONE.** Revit's connector references
  include system membership as well as end-to-end joints. Only the physical ones
  are broken here; treating a system reference as a joint would quietly remove
  elements from their system and the drawing would not change to show it.

  **DISCONNECTING IS NOT A NO-OP ON THE SYSTEM.** Breaking a joint can split one
  system into two, or orphan the far side entirely. That is what was asked for,
  and it is reported rather than smoothed over - TRACE_CONNECTIVITY afterwards is
  what shows the shape that resulted.

  ASSUMES AN OPEN TRANSACTION (Golden Rule 16). One operation is one undo entry,
  and the caller owns it.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # false breaks EVERY connection these elements have, including to things
    # that were never selected. A much larger act, so it is not the default.
    - name: withinSelectionOnly
      type: bool
      source: request
  provides:
    - name: disconnected
      role: result
      type: int
    - name: pairs
      role: result
      type: IList<string>
    - name: untouched
      # Joints left alone because they reach outside the selection. What it
      # was given and deliberately did not act on, never a joint it broke
      # (D-52).
      role: accounting
      type: IList<string>
    - name: findings
      type: IList<string>


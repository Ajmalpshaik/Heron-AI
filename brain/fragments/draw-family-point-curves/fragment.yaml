compatibility-note: >
  `FamilyItemFactory.NewCurveByPoints(ReferencePointArray)` - which Autodesk's
  remarks say throws outside a conceptual family - and
  `CurveByPoints.IsReferenceLine` and `GetPoints` read the same 2020 through
  2027 (the RevitAPI reference assemblies and XML remarks, read 2026-10-01).

# ROUTING - see SET_FAMILY_CATEGORY for the whole family-building table.
#
#   "draw lines between the adaptive points"      -> here
#   "draw a spline through these points"          -> here
#   "add four adaptive points to this family"     -> PLACE_ADAPTIVE_POINTS
#   "make a surface from these lines"             -> CREATE_CONCEPTUAL_FORM

utterances:
  - draw lines between the adaptive points
  - connect points 1 2 3 and 4 with reference lines
  - draw a spline through these points
  - join the panel points with lines

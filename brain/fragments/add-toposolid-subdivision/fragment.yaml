# DEPRECATED 2026-11-01 - MERGED INTO EDIT_TOPOSOLID (edit-toposolid), on the
# owner's instruction in conversation: "make sure there is no duplicate
# tools", then "ok go ahead merge all". Constitution Article 1: kept, never
# deleted, so its record and its proof stay readable and it can be brought
# back. Nothing offers it now - retrieval leaves DEPRECATED out, and its
# sentences claim nothing in the identity table (heron_search
# RETIRED_FRAGMENTS). Its sentences moved to EDIT_TOPOSOLID. A proof below is
# the record of what this card's code did, not a claim about today.
deprecated:
  date: '2026-11-01'
  by: Ajmal PS
  superseded-by: EDIT_TOPOSOLID
  why: >
    The same tool: a toposolid's own edits, on the toposolids handed in,
    one at a time, read back. EDIT_TOPOSOLID since its version 3 has mode
    "subdivide" - this card's outline in millimetres, closed automatically,
    Toposolid.CreateSubDivision on each toposolid, its subdivisions listed
    before and after and only a new one counted, the new ids in
    `resultIds`, a bad point named and fewer than three refused. NOT
    CARRIED, as the less safe of two rules: this card drew the outline at
    the level's Elevation, measured from the level type's Elevation Base
    and on a survey-datum model not the terrain's height; the keeper draws
    it on the toposolid's own sketch plane, the rule its split always used.
    Whether Revit minds the loop's height is not measured - NEEDS REAL
    REVIT. Nothing else of this card is left out.

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# The outline is points in millimetres, closed automatically, wholly inside
# each toposolid; the subdivision follows the terrain and takes its own
# material. READ BACK: each toposolid's subdivisions listed again.
#
# REVIT 2024 brought toposolids, so the card declares 2024 on.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Adds a subdivision to each toposolid - a car park, a path, a planted bed -
  from an outline of points in millimetres.

contract:
  needs:
    - name: doc
      type: Document
    # The toposolids.
    - name: elements
      type: IList<Element>
    # "x,y; x,y; ..." in millimetres.
    - name: loopMm
      type: string
      source: request
  provides:
    - name: subdivisionIds
      role: result
      type: IList<ElementId>
    - name: report
      # ONE STRING, toposolid by toposolid (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>

revit: ["2024", "2025", "2026", "2027"]
runtime: [net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  Toposolid.CreateSubDivision(Document, IList<CurveLoop>) and
  GetSubDivisionIds are present from 2024 and absent before - read off
  RevitAPI.xml in the Nice3point reference packages for all eight releases on
  2026-10-12 - so the card declares 2024 to 2027 only.

# ROUTING - the same rows are in the fragments named here.
#
#   "add a car park area to the terrain"      -> here
#   "make the terrain"                        -> CREATE_TOPOSOLID


# ROUTING (2026-10-13, the gap fill)
#
#   "raise the corners of this toposolid by 500" -> EDIT_SLAB_SHAPE, heights
#   "cut the terrain with the building pad"  -> EDIT_TOPOSOLID, excavate
utterances:
  - add a car park area to the terrain
  - subdivide the toposolid for this path
  - mark out a planted bed on the site
  - create a subdivision on the topography here

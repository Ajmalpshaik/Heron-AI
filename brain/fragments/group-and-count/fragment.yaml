# ROUTING - repeated in CREATE_SCHEDULE and COUNT_ELEMENTS.
#
#   "how many of each size"     -> here - numbers in the REPLY, and it
#                                  makes nothing in the model
#   "break it down by type"     -> here
#   "make a schedule"           -> CREATE_SCHEDULE - a VIEW in the Project
#                                  Browser that updates itself and prints on
#                                  a drawing. Both are right answers to
#                                  different sentences
#   "how many ducts are there"  -> COUNT_ELEMENTS

# SENTENCES ADDED 2026-09-01 BECAUSE THE ROUTING TABLE ABOVE ALREADY CLAIMED
# THEM. A routing table is a COMMENT and comments are not indexed - the search
# reads semantic-identity, the utterances, the capability, the domain and the
# purpose, and nothing else. So a table saying "-> here" recorded a decision
# that retrieval could not act on, and these resolved elsewhere.

utterances:
  # THE FIRST EIGHT ARE WHAT THE RE-RANKER READS (D-134), so the order below is
  # measured, not tidy. "group them and count" was third until 2026-11-01 and
  # moved last to let a pipe-size sentence in (FRAGMENT-ISSUES 5b-1357); it is
  # declared whole, so it still answers by its own phrase.
  - what sizes are they
  - break it down by size
  - give me a schedule of the types
  - break it down by type
  # ADDED 2026-09-19. Both sentences reached a WRITE: "what sizes are the
  # ducts" to AUTO_SIZE_MEP, which RESIZES ducts when asked what size they
  # are, and "duct schedule by size" to SET_MEP_SIZE. The first is the one
  # that proves declaring is the only repair - BOTH routes ranked the write
  # first, words #1 AND nearness #1, so no re-ranking could ever reach it.
  # This fragment already declares "what sizes are they", "break it down by
  # size" and "give me a schedule of the types"; only the noun differed.
  - what sizes are the ducts
  - duct schedule by size
  # ADDED 2026-11-01 (FRAGMENT-ISSUES 5b-1354): the question measured reaching
  # REPORT_VIEWPORT_TYPES. Keep it inside the eight: pushed out, four held-out
  # door-by-type questions left this card on the re-ranker.
  - how many doors of each type
  # ADDED 2026-11-01 (FRAGMENT-ISSUES 5b-1357), the pipe twin of the duct pair
  # above: "what sizes are these pipes" reached AUTO_SIZE_PIPE or SET_MEP_SIZE -
  # writes - on every backend, because "size these pipes" (a verb) and "what
  # sizes are these pipes" (a noun) look alike to both routes. The breakdown
  # sentence is the size-breakdown skill's, which no card carried; it is the
  # eighth on purpose - with "what sizes are these pipes" there instead, the
  # re-ranker moved fewer pipe questions and lost door ones.
  - give me a breakdown of the pipe sizes
  # The rest are past the eight, read by the words and nearness routes only.
  # The two door-free forms of 5b-1354's question - put first, they pushed the
  # duct-size sentences out of the eight and "give me a breakdown of the duct
  # sizes" went to AUTO_SIZE_MEP and SET_MEP_SIZE on the re-ranker.
  - how many of each type are there
  - count them by type
  - group them and count
  - what sizes are these pipes
  - how many pipes of each size

semantic-identity: "how many of each type, size or value there are - a set of parameter values turned into a schedule-style table"
kind: action
domain: revit.reporting
capability: GROUP_AND_COUNT
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Turns a set of parameter values into a schedule-style table: each distinct
  value, and how many carried it, largest group first.

contract:
  needs:
    - name: values
      type: IDictionary<ElementId, string>
  provides:
    - name: groups
      role: result
      type: IList<KeyValuePair<string, int>>

proof:

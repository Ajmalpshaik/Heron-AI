# ROUTING - repeated in CREATE_SCHEDULE and COUNT_ELEMENTS.
#
#   "how many of each size"     -> here - numbers in the REPLY, and it
#                                  makes nothing in the model
#   "break it down by type"     -> here
#   "make a schedule"           -> CREATE_SCHEDULE - a VIEW in the Project
#                                  Browser that updates itself and prints on
#                                  a drawing. Both are right answers to
#                                  different sentences
#   "how many ducts are there"  -> COUNT_ELEMENTS

# SENTENCES ADDED 2026-09-01 BECAUSE THE ROUTING TABLE ABOVE ALREADY CLAIMED
# THEM. A routing table is a COMMENT and comments are not indexed - the search
# reads semantic-identity, the utterances, the capability, the domain and the
# purpose, and nothing else. So a table saying "-> here" recorded a decision
# that retrieval could not act on, and these resolved elsewhere.

utterances:
  - what sizes are they
  - break it down by size
  - group them and count
  - give me a schedule of the types
  - break it down by type
  # ADDED 2026-09-19. Both sentences reached a WRITE: "what sizes are the
  # ducts" to AUTO_SIZE_MEP, which RESIZES ducts when asked what size they
  # are, and "duct schedule by size" to SET_MEP_SIZE. The first is the one
  # that proves declaring is the only repair - BOTH routes ranked the write
  # first, words #1 AND nearness #1, so no re-ranking could ever reach it.
  # This fragment already declares "what sizes are they", "break it down by
  # size" and "give me a schedule of the types"; only the noun differed.
  - what sizes are the ducts
  - duct schedule by size

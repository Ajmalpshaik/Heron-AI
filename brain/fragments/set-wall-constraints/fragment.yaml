id: FRG-ELE-047
semantic-identity: "put these walls on a different level without them moving"
kind: action
domain: revit.elements
capability: SET_WALL_CONSTRAINTS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Moves walls onto a different base and top level WITHOUT the walls themselves
  moving or changing height. The *"we reorganised the levels and now every wall
  is attached to the wrong one"* repair.

  **A WALL'S POSITION IS ITS LEVEL PLUS ITS OFFSET, AND CHANGING THE LEVEL
  ALONE MOVES THE WALL.** Set the base level and the offset stays as it was, so
  every wall jumps by the difference between the two levels - silently, all at
  once, and it looks like the walls were fine until somebody opens a section.
  This reads each wall's REAL elevation first, sets the level, then re-solves
  the offset so the wall ends up exactly where it started. Nothing appears to
  move; only what the wall is attached to changes.

  **A WALL WHOSE TOP IS UNCONNECTED HAS NO TOP LEVEL.** Its height is a plain
  number and its top constraint reads as nothing. Giving it a top level
  converts it from unconnected to level-bound, which is a real design change
  rather than a re-host, so those walls are named and skipped unless the caller
  says otherwise.

  **EVERY WALL IS MEASURED AGAIN AFTERWARDS.** The base and top elevations are
  read back and compared with what they were, and any wall that actually moved
  is reported. That is the only evidence that a re-host was a re-host.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16), so a
  whole block of walls is one undo entry.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # Invalid means "leave this constraint alone" - one call can re-host the
    # base, the top, or both.
    - name: baseLevelId
      type: ElementId
      source: request
    - name: topLevelId
      type: ElementId
      source: request
    - name: allowUnconnectedToBecomeBound
      type: bool
      source: request
  provides:
    - name: rehosted
      role: result
      type: int
    - name: elevationChanged
      # Walls that ACTUALLY MOVED, found by measuring every wall again
      # afterwards and comparing. The fault this fragment exists to prevent,
      # and the only place it would show.
      role: result
      type: IList<ElementId>
    - name: unconnectedTop
      # Walls whose top is unconnected, so giving them a top level would be a
      # design change rather than a re-host. NAMED AND SKIPPED unless the
      # caller says otherwise (D-52).
      role: accounting
      type: IList<ElementId>
    - name: notAWall
      # Handed in but not walls, so there was nothing here to act on. A count
      # of what it was GIVEN and could not use, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>

proof:
  date: '2026-09-13'
  by: Ajmal PS
  model: test projject (3,432 elements), Revit 2024, session 40932
  positive_case: run as it would normally be run - the arrangement was re-made first by running
    select-in-region, set-selection with this phase's own values - run inside a transaction,
    and Revit reported the transaction group ROLLED BACK afterwards. returned allowUnconnectedToBecomeBound
    true, elevationChanged 0 item(s), newBase Level, newTop Level, notAWall 0 item(s), refused
    0 item(s), rehosted 4, unconnectedTop 0 item(s), wantBase true, wantTop true. inputs came
    elements from the selection (4); baseLevelId as given; topLevelId as given; allowUnconnectedToBecomeBound
    as given. on test projject
  negative_case: run with minMm=-2000,23000,0, maxMm=14000,32000,4000, exact=false, categories=Ducts,
    baseLevelId=Level 1, topLevelId=Level 2, allowUnconnectedToBecomeBound=true instead -
    chosen because it should not contain what this fragment reports - the arrangement was
    re-made first by running select-in-region, set-selection with this phase's own values
    - run inside a transaction, and Revit reported the transaction group ROLLED BACK afterwards.
    returned allowUnconnectedToBecomeBound true, elevationChanged 0 item(s), newBase Level,
    newTop Level, notAWall 3 item(s) [925780, 925782, 925784], refused 0 item(s), rehosted
    0, unconnectedTop 0 item(s), wantBase true, wantTop true. inputs came elements from the
    selection (3); baseLevelId as given; topLevelId as given; allowUnconnectedToBecomeBound
    as given. on test projject
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  caveat: >-
    THE CODE WAS FIXED TO MAKE THIS PROOF POSSIBLE, and the broken version is what the earlier
    run measured. The top block read WALL_TOP_OFFSET and tested IsReadOnly BEFORE setting
    WALL_HEIGHT_TYPE - and on a wall with an unconnected top Revit greys that offset out, so
    every unconnected wall was refused and allowUnconnectedToBecomeBound could never do the one
    thing it exists for. Measured first: rehosted 0, refused 4. The constraint is now set
    before the offset is read. BOTH FLAG SETTINGS WERE SEEN. With it false the same four walls
    came back rehosted 4, refused 0, unconnectedTop 4 - the top correctly left alone, which is
    the leg tests/cases.yaml declares as its negative. With it true, rehosted 4 and
    unconnectedTop 0. elevationChanged was empty in every run, so the fragment's own promise -
    nothing moves - held throughout.
  fingerprint: 6d6417ec0c6dbef3

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. The constraints are reached by
  BuiltInParameter rather than by name, so nothing depends on the language
  Revit is running in, and all of them are unchanged 2020 to 2027. Levels are
  compared as ElementId against ElementId - never as numbers, which stopped
  being readable when the id went 64-bit.

# ROUTING - the same rows are in the fragments named here.
#
#   "put these walls on level 3"         -> here, without the walls moving
#   "the walls are attached to the       -> here
#    wrong level"
#   "move these elements up"             -> MOVE_ELEMENTS, which MOVES them.
#                                           This one deliberately does not
#   "change the level of these"          -> SET_ELEMENT_LEVEL for elements that
#                                           are not walls
#   "make the walls taller"              -> a height change, not a re-host:
#                                           WRITE_ELEMENT_PARAMETERS on the
#                                           height parameter
#   "build a wall here"                  -> CREATE_WALL
#   "the corners are cleaning up wrong"  -> DISALLOW_JOIN
#   "what is attached to this element"   -> REPORT_ELEMENT_DEPENDENCIES

utterances:
  - put these walls on a different level
  - the walls are on the wrong level
  - re-host these walls to level 3
  - change the wall base constraint without moving them
  - we renamed the levels and the walls followed

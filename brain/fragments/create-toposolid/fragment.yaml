id: FRG-GEO-066
semantic-identity: "make terrain from this boundary and these survey heights"
kind: action
domain: revit.geometry
capability: CREATE_TOPOSOLID
version: 1
source: OFFICIAL
risk: MODIFY

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# The boundary is kept as given - never hulled - and interior spot heights
# shape the surface; heights are millimetres above the internal origin, as
# reduced from a survey. The type is found by name, empty takes the first.
#
# REVIT 2024 brought toposolids, so the card declares 2024 on.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Creates a toposolid - native terrain - from a boundary of points with
  heights and interior survey spot heights, all in millimetres.

contract:
  needs:
    - name: doc
      type: Document
    # "x,y,z; x,y,z; ..." in millimetres, the outline in order; an EMPTY
    # value lets Revit draw the outline round the points.
    - name: boundaryMm
      type: string
      source: request
    # "x,y,z; ..." interior spot heights; an EMPTY value is none.
    - name: pointsMm
      type: string
      source: request
    # An imported or linked CAD drawing's id, its points read as survey
    # heights; an EMPTY value reads none.
    - name: cadImport
      type: string
      source: request
    # The drawing's layers to read, comma separated; EMPTY reads every layer.
    - name: cadLayers
      type: string
      source: request
    # A toposolid type by name; an EMPTY value takes the first.
    - name: typeName
      type: string
      source: request
    - name: level
      type: Level
      source: request
  provides:
    - name: toposolid
      role: result
      type: Toposolid
    - name: refused
      # Why NOTHING WAS MADE, as one sentence; null otherwise (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>


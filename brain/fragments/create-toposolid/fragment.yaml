revit: ["2024", "2025", "2026", "2027"]
runtime: [net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  Toposolid.Create(Document, IList<CurveLoop>, IList<XYZ>, ElementId,
  ElementId) and ToposolidType are present from 2024 and absent before - read
  off RevitAPI.xml in the Nice3point reference packages for all eight releases
  on 2026-10-12 - so the card declares 2024 to 2027 only.

# ROUTING - the same rows are in the fragments named here.
#
#   "make the terrain from these spot levels"  -> here
#   "make a toposolid from the survey dwg"     -> here, cadImport
#   "lay this floor to the terrain"            -> EDIT_SLAB_SHAPE, follow
#   "add a car park area to the terrain"       -> ADD_TOPOSOLID_SUBDIVISION
#   "make a floor"                             -> CREATE_FLOOR

utterances:
  - make a toposolid from these survey points
  - create the site terrain from this boundary and spot heights
  - model the ground from these levels
  - add terrain for the site
  - make a toposolid from the survey drawing

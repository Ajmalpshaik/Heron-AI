positive:
  - given: >
      a Generic Model family with a sweep made by create-family-sweep (path
      "0,0; 1000,0" on Ref. Level), and the profile family "Heron Test Profile"
      (type "50x50") from BT11 loaded into it; sweeps the sweep's id, profile
      "Heron Test Profile : 50x50", flipped false
    expect: >
      changed 1; the sweep reading that profile and a solid of about 2.5 L
      (50 x 50 x 1000 mm); LOOKED AT - RECORD whether Revit took the Profile on
      a sweep first drawn with a sketched one (BT13)

  - given: the same call with flipped true
    expect: the profile reads flipped; the solid mirrored across the path

negative:
  - given: >
      profile "Not Loaded : 1"
    expect: refused naming the profiles the family holds, nothing changed

  - given: sweeps the id of a swept blend
    expect: refused - a swept blend has two profiles - nothing changed

  - given: a project in front
    expect: notAFamily true and nothing changed

second_route:
  - >
      In the Family Editor, select the sweep and read Profile in its Properties

compatibility-note: >
  `BuiltInParameter.PROFILE_FAM_TYPE` ("Profile") and `PROFILE_FLIPPED_HOR`
  ("Profile Is Flipped") on a sweep, and `Sweep.ProfileSymbol` and
  `ProfileSketch`, read the same 2020 through 2027 (the RevitAPI reference
  assemblies and their XML labels, read 2026-10-01). Whether Revit lets the
  Profile of a sweep made with a SKETCHED profile be set this way is
  NEEDS-CHECKING BV13; a read-only Profile is refused by name.

# ROUTING - see SET_FAMILY_CATEGORY for the whole family-building table.
#
#   "use the handrail profile family for this sweep" -> here
#   "sweep a profile along a path"                -> CREATE_FAMILY_SWEEP - a
#                                                    typed shape
#   "make the sweep profile a family type parameter" -> ADD_FAMILY_TYPE_PARAMETER

utterances:
  - use the handrail profile family for this sweep
  - set the sweep profile to the loaded profile family
  - change this sweep to use a profile family
  - flip the profile of this sweep

tests: tests/

compatibility-note: >
  One implementation for every release. `Grid.Curve`, `Level.Elevation`, the
  `Reference(Element)` constructor, `ReferenceArray`, `View.ViewDirection`,
  `View.Origin` and `Document.Create.NewDimension(View, Line, ReferenceArray)`
  are unchanged 2020 to 2027.

  Millimetres become feet by dividing by 304.8 (D-20) and no units API is
  touched, so nothing here meets the 2021 move to ForgeTypeId. Ids are carried
  as `ElementId` and none is read as a number.

# ROUTING - repeated in CREATE_DIMENSION, DIMENSION_MEP_RUNS and
# DIMENSION_ROOMS.
#
#   "dimension the grids"                 -> here
#   "put the setting out dimensions on"   -> here
#   "dimension between the levels"        -> here, in a section or elevation
#   "grid to grid dimension"              -> here
#   "dimension between the ducts"         -> DIMENSION_MEP_RUNS - a centreline
#                                            has to be dug out of the geometry
#                                            with non-visible objects included,
#                                            and the whole-element Reference
#                                            this one uses returns nothing for
#                                            a duct
#   "dimension between these two units"   -> CREATE_DIMENSION
#   "dimension the room"                  -> DIMENSION_ROOMS
#   "how far apart are the grids"         -> REPORT_LEVEL_ELEVATIONS for
#                                            levels, or a measure - a NUMBER,
#                                            changing nothing. This one WRITES
#                                            a Dimension into the view
#   "put the levels on the drawing"       -> ADD_SPOT_ELEVATIONS, which puts
#                                            level VALUES on. This one measures
#                                            BETWEEN levels and writes a
#                                            dimension string. The sentence
#                                            carries no verb that separates
#                                            them, so it is named here rather
#                                            than left to the ranking
#
# MEASURING AND DIMENSIONING ARE THE SAME SENTENCE AND DIFFERENT JOBS. "How far
# apart" wants a number and must change nothing; "put a dimension on" writes an
# element onto the drawing.

utterances:
  - dimension the grids
  - put the setting out dimensions on this plan
  - dimension between the levels
  - grid to grid dimension
  - add a dimension string across the grid lines
  - dimension the floor to floor heights

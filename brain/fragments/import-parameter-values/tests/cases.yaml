positive:
  - given: a file of 40 rows of Mark values against 40 selected air terminals
    expect: >
      40 values written, 40 rows matched, and the Marks visible in Revit's own
      Properties palette afterwards - each one different, which is the thing
      WRITE_ELEMENT_PARAMETERS cannot do

  - given: a row whose value is quoted and contains a comma
    expect: >
      the comma preserved inside the value, not treated as a column break. A
      spreadsheet writes that quoting and a parser that ignores it silently
      shifts every column after it

  - given: a Comments column whose cell was typed on three lines with Alt+Enter,
      so the exported file has real newlines inside the quotes
    expect: >
      ONE value written on ONE element, with all three lines and their breaks
      intact. Until 2026-09-08 the file was read line by line before it was read
      as CSV, so that one cell became three rows: the first element got a third
      of the note and the other two rows were rejected for having too few
      columns. A record is not a line, and a note is not damaged by being long

  - given: a numeric column exported as "450" from a project showing millimetres
    expect: >
      450 mm on the way back in, through Revit's own parsing. Nothing here
      converts units, so the value means what the project displays

  - given: a type parameter column and includeTypeParameters true
    expect: >
      written on the TYPE, with the row saying so. A type edit reaches every
      instance sharing it, which is a bigger change than the row looks

  - given: >
      version 3 - a file from EXPORT_PARAMETERS_TO_CSV with a Yes/No column
      reading "Yes" on two rows and "No" on two, over four elements whose tick
      box is currently the opposite, and blankCells "skip"
    expect: >
      four values written, each tick box in Properties now matching its row,
      and none counted as read back different. Version 2 refused all four
      (5b-314). "true", "OFF", "1" and "0" are taken the same way

  - given: >
      version 3 - a Comments column with one cell left empty, on an element
      whose Comments reads "keep me", and blankCells "skip"
    expect: >
      that element's Comments still reads "keep me", blankCellsSkipped 1, and
      the other rows written as normal (5b-315)

  - given: the same file with blankCells "clear"
    expect: >
      that element's Comments is now empty, cellsCleared 1, and the clear also
      counted in valuesWritten. Asked for by name, so it is done

negative:
  - given: >
      version 3 - the same file with blankCells left out, and again with
      blankCells "delete"
    expect: >
      NOTHING WRITTEN on any element, and a finding saying the two words that
      are taken. One of them deletes what somebody typed, so Heron never picks
      for the modeller

  - given: >
      version 3 - a Yes/No column with "Maybe" on one row, over an element
      whose tick box is ticked
    expect: >
      that tick box still ticked, the row named with the words that are taken,
      and counted as "a word that is not Yes or No" - not as Revit refusing the
      value, and not written as 0

  - given: >
      version 3 - a blank cell under a NUMBER column (an Offset or a length)
      with blankCells "clear"
    expect: >
      that element's number exactly as it was, and the cell counted as blank on
      a parameter that is not text, with the row named. A number has no empty
      value a file can set

  - given: a file exported from a DIFFERENT model
    expect: >
      every row reported as matching no element in the set handed in, and NOTHING
      WRITTEN. THIS IS THE CASE THAT MATTERS. Resolving rows against the whole
      document instead would apply a stale file to whatever happened to share an
      id

  - given: a file with a quotation mark that is opened and never closed
    expect: >
      NOTHING WRITTEN, and the stray quote named as the reason. Everything after
      an unclosed quote is one runaway value, so the rows no longer mean what the
      file meant - and half an import applied from a file nobody can read back is
      the worst of the outcomes available

  - given: a row whose parameter is read-only
    expect: >
      counted as read-only and NOT as "value refused". Revit computes that value;
      the fix is to pick a different target, not to correct the cell

  - given: a header naming a parameter the category does not have
    expect: >
      counted separately from both other skips, and named. The fix is the header
      or the project setup, and a merged "skipped" number sends it to neither

  - given: a value Revit accepts and then rounds
    expect: >
      reported as READS BACK DIFFERENT, with both values. A Set call returning
      true is not a value in the model, and this is the count that says which

  - given: >
      a column whose header two parameters on the element share - a shared
      parameter loaded with the same name as a built-in one and bound to the
      category (NEEDS-CHECKING P8 arranges it)
    expect: >
      that cell counted in its own skip - the name belongs to two or more
      parameters - with the row and the id named, and BOTH parameters exactly as
      they were. Before version 2 one of the two, which Revit's reference calls
      random, was written and counted in valuesWritten

  - given: an empty element list
    expect: >
      "nothing was written" with the instruction to run the filter first - not a
      quiet success over nothing

  - given: any run at all
    expect: >
      NO TRANSACTION OPENED HERE. Golden Rule 16 - undo is the caller's, and one
      operation is one undo entry

second_route:
  - >
    Revit's own schedule of the same parameter over the same elements, exported
    again after the import. It should come back byte-identical to what went in,
    apart from the values Revit is reported to have reformatted

  - >
    The Properties palette on three elements picked at random from the file.
    Manual, and it is what catches a whole column written one row out of step

  - >
    Version 3: EXPORT_PARAMETERS_TO_CSV run again over the same elements after
    the import. The Yes/No column must read back the words that went in, and
    the element whose cell was blank under "skip" must still carry its old
    text - a second route that does not share this fragment's read-back

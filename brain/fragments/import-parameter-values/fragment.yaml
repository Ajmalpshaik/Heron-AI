id: FRG-PAR-015
semantic-identity: "put the values from this table back onto the elements they came from"
kind: action
domain: revit.parameters
capability: IMPORT_PARAMETER_VALUES
version: 5
source: OFFICIAL
risk: MODIFY

purpose: >
  Reads a CSV whose first column identifies the element and whose remaining
  columns are parameter names, and writes those values back onto the model - a
  different value per element, from a table somebody edited outside Revit. The
  return leg of the spreadsheet round trip that every asset-data job actually
  runs on.

  **`WRITE_ELEMENT_PARAMETERS` SETS ONE LITERAL ON EVERY ELEMENT AND THAT IS A
  DIFFERENT JOB.** *"Set the Comments to 'issued'"* is that fragment. *"Here are
  four hundred rows of equipment tags the client sent back"* cannot be, because
  the value is different on every row. This one reads the table, matches each
  row to an element, and writes per row.

  **THE ID IS MATCHED AS TEXT, AND NO `ElementId` IS EVER CONSTRUCTED FROM A
  NUMBER.** The earlier library parsed the column to an `int` and built an
  `ElementId` from it - which is the exact shape of the thing that broke when
  ids went 64-bit at Revit 2024, and it is unnecessary. Every element already
  knows how to print its own id, so the lookup is `element.Id.ToString()`
  against the cell as it stands. **One implementation, no version split, and the
  rule that an id is never read as a number is kept rather than worked around.**

  **THE IMPORT IS SCOPED TO THE ELEMENTS HANDED IN, NOT TO THE WHOLE MODEL, AND
  THAT IS A SAFETY DECISION.** The earlier version resolved each row against the
  entire document, so a stale file could write anywhere. Here a filter runs
  first, the count is seen, and the import can only touch what was in front of
  you. A row whose id is not in that set is skipped and NAMED - which also
  catches the file that came back for the wrong model.

  **IT OPENS NO TRANSACTION.** Golden Rule 16: a fragment assumes one is open
  and never opens one, so a batch is one undo entry. The earlier version wrapped
  itself in its own transaction and rolled back on failure; here a partial
  import is undone by the caller's own rollback, together with everything else
  in the same operation, which is the behaviour a modeller pressing Ctrl+Z
  expects.

  **IT READS BACK WHAT LANDED, NOT WHAT WAS ASKED FOR.** Revit accepts a value
  and then formats, rounds or rejects it more often than people expect. Every
  value written is re-read, and anything that came back different is reported as
  its own count - a tally of `Set` calls that returned true is not a tally of
  values now in the model.

  **A READ-ONLY PARAMETER, AN UNKNOWN NAME AND AN UNPARSEABLE NUMBER ARE THREE
  DIFFERENT SKIPS AND ARE COUNTED APART.** They have three different fixes -
  change the target, fix the header, fix the cell - and one merged "skipped"
  number sends every one of them to the wrong place.

  **A FOURTH SKIP SINCE VERSION 2: A COLUMN NAME TWO PARAMETERS SHARE.** A shared
  or project parameter can be bound beside a built-in one of the same name, and
  Revit's lookup by name then returns one of them at random, in Autodesk's own
  words. That cell is written to neither, counted apart and named in the
  findings (D-54 s3, FRAGMENT-ISSUES 5b-203). Version 1's proof no longer
  describes the code and is kept as a record, and the fragment is DRAFT until it
  is proved again.

  **VERSION 3 TAKES A YES/NO COLUMN BACK, AND ASKS WHAT A BLANK CELL MEANS.**
  The parameter export writes a tick box as the word Revit shows, Yes or No,
  and version 2 read an Integer cell only as a whole number - so a file this
  library had just written could not come back (FRAGMENT-ISSUES 5b-315). A
  Yes/No parameter is now recognised first, on every release from 2020, the
  way `WRITE_ELEMENT_PARAMETERS` version 4 recognises one, and takes Yes/No,
  True/False, On/Off and 1/0 in any case; any other word is refused, counted
  apart and named. Its read-back is the 1 or 0 Revit holds, not the displayed
  word. And version 2 cleared a text value wherever its cell was blank, without
  a word, while refusing the same blank for a number (5b-316). `blankCells` is
  now ASKED, with no default: `skip` leaves every element whose cell is blank
  exactly as it was and counts the cells in `blankCellsSkipped`; `clear`
  empties a TEXT parameter, counts it in `cellsCleared`, and refuses a blank
  for a number, a tick box or an element reference with the reason. Any other
  word, or none, refuses the run and nothing is written. The proof below is
  version 1's and is kept as a record; this version is DRAFT until it is
  proved.

  **VERSION 4 READS BACK AFTER ONE REGENERATION, AND GIVES THE REASON
  WHOLE.** On Revit 2020 version 3 wrote No into three Show_Clearance tick
  boxes, reported all three as reading back different, and a separate read
  straight afterwards found all three at 0, as asked (FRAGMENT-ISSUES
  5b-439). Version 3 read each value the moment it was set, before Revit had
  regenerated; `WRITE_ELEMENT_PARAMETERS` version 4 believes a value only
  after `doc.Regenerate()` and a fresh lookup, and so does this now - once,
  after the last write. `changedOnRegeneration` counts the values whose read
  changed across it. The finding's value was cut at sixty characters, so
  `rowFindings` carries every row's line as one string, shown whole, and
  `yesNoRoute` names which Revit API recognised the tick box - the three
  nulls in that reply were right for 2020, not a failed lookup. **The cause
  is not yet measured: what the early read said never reached the chat.**
  DRAFT until NEEDS-CHECKING CD13 has run on a scratch model.

  **Version 5 takes a material, a level or a family type by name.**

# VERSION 5 - FRAGMENT-ISSUES 5b-1259. Measured 2026-10-19 on Revit 2020, the
# owner's Kerala house: "Id,Material" with 346587,TRG_Material_Teak_Wood and
# includeTypeParameters true reached the M_Round Column type's Material and
# answered "Revit would not take 'TRG_Material_Teak_Wood' for 'Material'" -
# an element reference was handed to SetValueString, which takes no name. Now
# a cell for a parameter holding another element is a NAME: a material or a
# level by its Name, a family type as "Family: Type", matched exactly, the
# kind narrowed first by what the parameter holds or its definition. None, or
# two, is refused for that cell with the reason, counted with the values Revit
# would not take. The read-back compares the id Revit holds with the id the
# name named - never the name Revit prints for it. Version 4's proof below no
# longer describes the code: DRAFT until NEEDS-CHECKING Group HZ.
contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: csvPath
      type: string
      source: request
    - name: includeTypeParameters
      type: bool
      source: request
    # "skip" or "clear" - what an empty cell means. ASKED, NO DEFAULT: one of
    # the two deletes what somebody typed, so Heron never picks. Anything
    # else refuses the run (version 3, 5b-316).
    - name: blankCells
      type: string
      source: request
  provides:
    - name: findings
      type: IList<string>
    - name: valuesWritten
      role: result
      type: int
    - name: rowsMatched
      # How many CSV rows resolved to an element in this model. The size of
      # what it could act on, never a value it wrote (D-52).
      role: accounting
      type: int
    - name: rowsUnmatched
      # CSV rows whose id resolves to nothing here - usually the wrong model.
      # Given and unusable (D-52).
      role: accounting
      type: int
    - name: valuesRejected
      # Values Revit accepted and then read back different - for an element
      # reference, a different id from the one its name named. EVERY VALUE
      # WRITTEN IS RE-READ, and these are the ones that did not take (D-52).
      role: accounting
      type: int
    - name: blankCellsSkipped
      # Empty cells left alone because blankCells was "skip". Given and
      # deliberately not used - never a value written (D-52).
      role: accounting
      type: int
    - name: cellsCleared
      # Text values emptied because their cell was blank and blankCells was
      # "clear". Also counted in valuesWritten - this says how many of those
      # were clears.
      role: result
      type: int
    - name: changedOnRegeneration
      # Values written whose read straight after the write differed from the
      # read after the one regeneration (version 4, 5b-439). The read-back
      # that counts is the later one; this says how often the early one
      # would have been wrong.
      role: accounting
      type: int
    - name: rowFindings
      # Every row's finding as ONE string, joined by " | " - shown whole,
      # where a list is cut to three items of sixty characters (5b-439).
      # Prose about what could not be used or did not land, never a result:
      # it is empty on a clean run and full on the negative.
      role: accounting
      type: string


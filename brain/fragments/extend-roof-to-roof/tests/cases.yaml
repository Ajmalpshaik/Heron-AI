# D-30: the negative case is what catches "succeeded and did nothing" - and,
# for a write that moves a roof's end, "moved something nobody asked for": a
# roof extended past its limit, a footprint roof's edge moved, or the wrong
# end of the right roof.
#
# THE ARRANGEMENT IS HALF OF EVERY CASE (NEEDS-CHECKING Group OY). A scratch
# project "roofjoin-oy" from the default metric architectural template, saved
# under %TEMP%\heron-work, never a working model:
#   - Level 1 at 0 and Level 2 at 3000 mm; the 3D view {3D}, nothing hidden,
#     no section box.
#   - THE MAIN ROOF: a roof by footprint on Level 2, "Generic - 400mm", the
#     rectangle 0,0 to 12000,8000 mm, its two long sides (south and north)
#     Defining Slope at 30 degrees, the two ends upright - a gable, ridge
#     east-west at y = 4000.
#   - THE WING ROOF: a roof by extrusion, "Generic - 400mm", on a reference
#     plane "Wing" drawn in Level 2 from 4000,-6000 to 8000,-6000 mm, profile
#     a gable "0,0; 2000,1155; 4000,0" (30 degrees), Extrusion Start 0 and
#     End 3000 mm - so it runs north from y = -6000 toward the main roof and
#     stops 3000 mm short of its south eave. Its ridge runs north-south at
#     x = 6000. (CREATE_EXTRUSION_ROOF makes it, or Roof by Extrusion by hand.)
#   - A FAR ROOF: a second roof by extrusion like the wing, on a plane "Far"
#     from 20000,-6000 to 24000,-6000 mm - it faces nothing.
# Which way Revit measures Extrusion Start and End from the plane is not
# known: write down the wing's two values as Properties shows them before
# the first run. EVERY RUN ROLLED BACK unless the case says kept.

positive:
  - given: >
      the wing roof and the main roof selected (select-in-region over both,
      Roofs only), view3d {3D}, maxExtendMm left out - "extend the wing roof
      to meet the main roof" - THE FIRST CASE TO RUN
    expect: >
      extended 0, extendedRoof invalid, nothing changed; needMm about the
      distance from the wing's north end to the main roof's south slope at
      the wing's ridge (the farthest point), more than 3000; refused begins
      "MEASURED, NOTHING CHANGED: roof by extrusion ... has to extend ... mm
      for its end to meet roof by footprint ..."; report has two lines for
      the wing - its north end meeting the main roof, its south end meeting
      nothing (0 of N points). MEASURE needMm against a dimension in a
      section through x = 6000 before trusting it

  - given: >
      the same, maxExtendMm 10000
    expect: >
      extended 1, extendedRoof the wing's id; report "EXTENDED: roof by
      extrusion ...'s Extrusion End (or Start) is ... mm (was ... mm), and
      its end moved <needMm> mm toward roof by footprint ... - read back
      off the roof's geometry, its other end where it was"; findings say the
      end runs into the main roof by (farthest - nearest) mm and offer
      JOIN_GEOMETRY; in a section through x = 6000 the wing's ridge reaches
      the main roof's slope and no gap shows anywhere along the end. The
      wing's south end has not moved

negative:
  - given: >
      the same pair, maxExtendMm 500 - a limit below the distance needed
    expect: >
      extended 0; refused "... has to extend <needMm> mm to meet ..., more
      than the 500 mm allowed. Nothing was changed"; the wing's Extrusion
      Start and End as written down before the run

  - given: >
      the far roof and the main roof selected, maxExtendMm 50000 - a pair
      where no end faces the other roof
    expect: >
      extended 0; refused begins "NOTHING MET: no ray from either end of a
      roof by extrusion met the other roof in the 3D view '{3D}'"; report
      lists both ends of the far roof with 0 points meeting; nothing changed

  - given: >
      the main roof and a second roof by footprint selected (copy the main
      roof 30000 mm east), maxExtendMm 10000
    expect: >
      extended 0; refused "Both roofs are roofs by footprint, and Revit
      <release>'s API cannot extend one ... Modify > Join/Unjoin Roof ...
      Nothing was changed", naming the release Revit reports

second_route:
  - given: >
      after the kept positive run (a scratch copy, KEPT once), Modify >
      Join/Unjoin Roof by hand on a second copy of the model as saved before
      it: pick the wing's north end edge, then the main roof's south slope
    expect: >
      the wing's Extrusion End (or Start) by hand equals the card's to within
      the difference between the nearest and farthest hit - Revit's own join
      cuts the end to the slope, the card's reaches the farthest point; write
      down both values and the difference

# D-30: the negative case is what catches "succeeded and did nothing" - and,
# for a write that moves a roof's end, "moved something nobody asked for": a
# roof extended past its limit, a footprint roof's edge moved, or the wrong
# end of the right roof.
#
# THE ARRANGEMENT IS HALF OF EVERY CASE (NEEDS-CHECKING Group OY). A scratch
# project "roofjoin-oy" from the default metric architectural template, saved
# under %TEMP%\heron-work, never a working model:
#   - Level 1 at 0 and Level 2 at 3000 mm; the 3D view {3D}, nothing hidden,
#     no section box.
#   - THE MAIN ROOF: a roof by footprint on Level 2, "Generic - 400mm", the
#     rectangle 0,0 to 12000,8000 mm, its two long sides (south and north)
#     Defining Slope at 30 degrees, the two ends upright - a gable, ridge
#     east-west at y = 4000.
#   - THE WING ROOF: a roof by extrusion, "Generic - 400mm", on a reference
#     plane "Wing" drawn in Level 2 from 4000,-6000 to 8000,-6000 mm, profile
#     a gable "0,500; 2000,1655; 4000,500" (30 degrees, its eaves 500 mm
#     ABOVE Level 2, so no ray from them just grazes the main roof's eave),
#     Extrusion Start 0 and End 3000 mm. Made by CREATE_EXTRUSION_ROOF with
#     those values it runs NORTH from y = -6000 toward the main roof and stops
#     about 3000 mm short of its south eave; drawn by hand, set Start and End
#     so it does. Its ridge runs north-south at x = 6000.
#   - A FAR ROOF: a second roof by extrusion like the wing, on a plane "Far"
#     from 20000,0 to 24000,0 mm, Start 0 and End 3000 - it runs north beside
#     the main roof, and neither end faces it.
#   - A COPY of the main roof 30000 mm north (y 30000 to 38000), for the
#     two-footprint case.
# Write down the wing's Extrusion Start and End as Properties shows them
# before the first run. EVERY RUN ROLLED BACK unless the case says kept.

positive:
  # VERSION 2, Revit 2022 or later, NOT RUN - the look row 5b-1930 asked for:
  # Wing F (below) and the main roof, maxExtendMm 10000. Expect extended 1 and
  # report "EXTENDED: roof by footprint ...'s end line <id> moved <needMm> mm
  # out, with the two lines beside it lengthened to meet it ... every
  # footprint line kept its slope"; Edit Footprint shows the south line moved
  # north and the east and west lines lengthened to it, each line's Defines
  # Slope and Slope as written down. If Revit refuses the sketch edit or the
  # read-back throws, write Revit's words down: that is the answer.
  - given: >
      the wing roof and the main roof selected (select-in-region over both,
      Roofs only), view3d {3D}, maxExtendMm 10000 - "lengthen the extruded
      roof so its end reaches the sloped roof"
    expect: >
      extended 1, extendedRoof the wing's id; report "EXTENDED: roof by
      extrusion ...'s Extrusion End (or Start) is ... mm (was ... mm), and
      its end moved <needMm> mm toward roof by footprint ... - read back
      off the roof's geometry, its other end where it was"; needMm more than
      3000 (the gap to the main roof's eave) and less than 7000 (the main
      roof's ridge line) - the distance to where the wing's RIDGE meets the
      main roof's south slope; a finding
      that the flat end went further elsewhere - through the main roof and
      on under it - offering JOIN_GEOMETRY; in a section through x = 6000
      the wing's ridge reaches the main roof's slope with no gap; in a
      section through x = 4500 the end passes through the main roof's slope
      and on under it, as the finding says. The wing's south end has not
      moved

negative:
  - given: >
      the same pair, maxExtendMm 500 - a limit below the distance needed -
      THE FIRST CASE TO RUN
    expect: >
      extended 0; refused "... has to extend <needMm> mm to meet ..., more
      than the 500 mm allowed. Nothing was changed"; the wing's Extrusion
      Start and End as written down before the run

  - given: >
      the same pair, maxExtendMm left out - asked to measure only
    expect: >
      extended 0; refused begins "MEASURED, NOTHING CHANGED: roof by
      extrusion ... has to extend <needMm> mm for its end to meet roof by
      footprint ..." with the same needMm as the positive; report has two
      lines for the wing - its north end meeting the main roof's upper face,
      its south end 0 points

  - given: >
      the far roof and the main roof selected, maxExtendMm 50000 - a pair
      where no end faces the other roof
    expect: >
      extended 0; refused begins "NOTHING MET: no ray from either end of a
      roof by extrusion met the upper face of the other roof in the 3D view
      '{3D}'"; report lists both ends of the far roof with 0 points meeting;
      nothing changed

  - given: >
      the main roof and its copy 30000 mm north selected, maxExtendMm 10000 -
      two roofs by footprint whose gable ends face east and west, not each
      other
    expect: >
      extended 0, nothing changed. On Revit 2020 or 2021: refused "Both roofs
      are roofs by footprint, and Revit <release>'s API has no sketch editing
      for an add-in ... Modify > Join/Unjoin Roof", naming the release. From
      2022 (version 2): refused begins "NOTHING MET"

  # VERSION 2 (2026-11-21, row 5b-1930) - A ROOF BY FOOTPRINT, REVIT 2022 ON.
  # NOT RUN. Add WING F: a roof by footprint on Level 2, "Generic - 400mm",
  # the rectangle 4000,11000 to 8000,17000 mm, its east and west edges
  # Defining Slope at 30 degrees, north and south upright - its south gable
  # end faces the main roof's north slope 3000 mm away. Write down each of its
  # four lines' Defines Slope and Slope first.
  - given: >
      version 2, Revit 2022 or later - Wing F and the main roof, maxExtendMm
      500
    expect: >
      extended 0; refused "... has to extend <needMm> mm to meet ..., more
      than the 500 mm allowed. Nothing was changed"; Wing F's sketch as it was

  - given: >
      version 2, Revit 2022 or later - Wing F with all four edges Defining
      Slope (a hip), and the main roof, maxExtendMm 10000
    expect: >
      extended 0; refused begins "NOTHING MET" and names gable ends - "lines
      that define no slope"; a hip has none

  - given: >
      version 2 on Revit 2020 or 2021 - Wing F and the main roof, maxExtendMm
      10000
    expect: >
      extended 0; findings "Revit <release>'s API has no sketch editing for an
      add-in (SketchEditScope came in 2022) ... Modify > Join/Unjoin Roof",
      naming the release; nothing changed

second_route:
  - given: >
      after the kept positive run (a scratch copy, KEPT once), Modify >
      Join/Unjoin Roof by hand on a second copy of the model as saved before
      it: pick the wing's north end edge, then the main roof's south slope
    expect: >
      the wing's Extrusion End (or Start) by hand against the card's: Revit's
      own join cuts the end to the slope, the card's flat end reaches the
      farthest point - write down both values, and whether the difference is
      the card's nearest-to-farthest spread

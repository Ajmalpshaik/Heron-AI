compatibility-note: >
  One implementation, the footprint way inside `#if !REVIT2020 &&
  !REVIT2021`. SketchEditScope (Start, IsSketchEditingSupported, IsPermitted,
  Commit, IsActive, Cancel), Sketch.GetAllElements and Sketch.OwnerId are in
  the API from 2022 only - "the type is not in these" for 2020 and 2021 with
  tools/api-surface --members on 2026-11-21 - so on those two releases a roof
  by footprint is refused, naming the release. Element.GetDependentElements,
  ElementClassFilter, CurveElement.SetGeometryCurve(Curve, bool),
  CurveElement.GeometryCurve, FootPrintRoof.GetProfiles and its DefinesSlope
  and SlopeAngle (get_DefinesSlope, get_SlopeAngle), ExtrusionRoof.GetProfile,
  CurveElement.SketchPlane, SketchPlane.GetPlane, Plane.Normal and Origin, the
  ReferenceIntersector(ElementId, FindReferenceTarget, View3D) constructor,
  ReferenceIntersector.Find, ReferenceWithContext.Proximity, Solid.Edges,
  Edge.Tessellate, GeometryInstance.GetInstanceGeometry,
  Element.GetGeometryObjectFromReference, Face.Project,
  IntersectionResult.UVPoint, Face.ComputeNormal, Element.GroupId,
  Parameter.IsReadOnly and View.IsTemplate read the same 2020 through 2027,
  and BuiltInParameter EXTRUSION_START_PARAM and EXTRUSION_END_PARAM are in
  RevitAPI.xml for every release. ExtrusionRoof has no ExtrusionStart or
  ExtrusionEnd property, so the extents are those two parameters;
  NewExtrusionRoof's reference says both are measured from the reference
  plane along its normal, and the card reads the profile's sketch plane,
  whose normal may point the other way, so the direction is read off the
  roof's geometry and every write is read back.

# ROUTING (2026-11-20) - every row a sentence of the frozen set measured with
# tools/score-routing.py, main against this card, on all four backends, and
# read by tools/check-routing.py.
#
#   "join the main roof to the wing roof", "join this roof to that roof"
#                                  -> SHAPE_WALL_TOPS_TO_ROOF with the
#                                     join-roofs method named first (row
#                                     5b-1671); its step 1 offers THIS for a
#                                     roof by extrusion, asked first
#   "extend this roof until it meets the other roof"
#                                  -> here
#   "attach these walls to the roof above"
#                                  -> ATTACH_WALLS (2025 on)
#   "make the tops of these walls follow the roof above"
#                                  -> SHAPE_WALL_TOPS_TO_ROOF (2022 on)
#   "make an extruded roof along grid A with this profile"
#                                  -> CREATE_EXTRUSION_ROOF
utterances:
  - push the end of this extrusion roof out to the other roof's face
  - lengthen the extruded roof so its end reaches the sloped roof
  - carry the end of the roof by extrusion on to the face it should meet

id: FRG-SEL-008
semantic-identity: "the elements whose numeric parameter passes a comparison"
kind: filter
domain: revit.selection
capability: SELECT_BY_NUMERIC_PARAMETER
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Narrows the model to the elements whose named NUMERIC parameter passes a
  comparison - "ducts 500 mm high", "pipes larger than 100 mm", "walls between
  200 and 300 thick" - optionally bounded to a list of categories. It is the
  half of SELECT_BY_PARAMETER_VALUE that a unit makes impossible to do with
  text.

  **The comparison value is handed in already in Revit's internal unit, and
  that is a deliberate refusal to guess.** A length is stored in decimal feet,
  so 500 mm arrives as 500 / 304.8. But an airflow, a pressure, an angle and a
  temperature each have their own internal unit, and this fragment cannot know
  which one the named parameter uses without asking a units API - the API that
  changed shape at Revit 2021 and is the reason [D-20](../../../docs/DECISIONS.md)
  keeps conversion at the edge. Taking a `valueMm` here would be a promise this
  code cannot keep for any parameter that is not a length. **The read-back
  states the comparison in internal units AND what it would be in millimetres
  if the parameter is a length**, so a value handed in unconverted is visible
  rather than silent.

  **An INTEGER parameter is compared directly, not skipped.** The obvious code
  tests for `StorageType.Double` and returns nothing for everything else, so
  "poles equals 3" comes back as a clean, wrong zero. Integers are counts and
  yes/no flags, they carry no unit, and comparing them to the same number is
  right.

  **Elements that do not carry the parameter, and elements that carry it as
  text, are counted separately.** `withoutParameter` and `notNumeric` are the
  difference between "nothing matched", "that parameter does not exist here"
  and "that parameter is a string - use SELECT_BY_PARAMETER_VALUE".

  **`eq` is a tolerance, never an equality.** Two doubles that both display as
  500 mm are not the same double. A comparison written as `==` finds almost
  nothing and looks like a filter that ran.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, every loaded link is read too and
  `linksSearched` says how many were: set and 0 means "you asked, and none
  are loaded", which is a different answer from host-only. The same comparison runs in each link and
  its matches are counted per link in `linkedMatches`.
  **NOTHING FROM A LINK IS EVER SELECTED OR CARRIED** - `elements` stays this model's own; the chain
  revives ids against this model, and a linked id that happens to be in
  use here binds an unrelated element (FRAGMENT-ISSUES row 75). Links
  nested inside a link are not read, and are counted in the answer. This
  is version 2; version 1's proof no longer describes the code, and the
  fragment is DRAFT until it is proved again.

# A NAME TWO PARAMETERS SHARE IS NEVER READ, AND THE ELEMENT IS NEVER COMPARED -
# it is counted in `ambiguous` (D-54 s3, FRAGMENT-ISSUES 5b-203; added
# 2026-10-09, see that provide). Written here and not in `purpose` on purpose:
# the purpose is embedded for routing, and a sentence about this in it moved
# other cards' utterances in check-routing, measured against the base commit.
contract:
  needs:
    - name: doc
      type: Document
    - name: parameterName
      type: string
      source: request
    - name: comparison
      type: string
      source: request
    - name: compareValue
      type: double
      source: request
    - name: compareValueMax
      type: double
      source: request
    - name: tolerance
      type: double
      source: request
    - name: includeTypeParameters
      type: bool
      source: request
    - name: categories
      type: IList<BuiltInCategory>
      source: request
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: withoutParameter
      # Elements that do not carry the parameter. What makes a mistyped name
      # read as such instead of as a plausible zero - never a match (D-52).
      role: accounting
      type: int
    - name: notNumeric
      # Elements carrying the parameter as text rather than as a number, so no
      # comparison was possible. Given and unusable, never a match (D-52).
      role: accounting
      type: int
    - name: ambiguous
      # Elements carrying TWO OR MORE parameters by this name - on the
      # element, or on its type when the search reached it - where Revit's
      # lookup would pick one at random. Not compared and never matched:
      # which one was meant is the modeller's to say (D-54 s3, FRAGMENT-ISSUES
      # 5b-203). Turned down, never found (D-52).
      role: accounting
      type: int
    - name: findings
      type: IList<string>
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then one line per link. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75).
      role: accounting
      type: IList<string>


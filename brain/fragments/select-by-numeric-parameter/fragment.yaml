revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Element.LookupParameter`,
  `Element.GetParameters(string)`,
  `Parameter.HasValue`, `StorageType`, `AsDouble` and `AsInteger` are present
  2020 through 2027, compiled at both ends. **No units API is touched** -
  `DisplayUnitType` became `ForgeTypeId` at 2021 and there is no single
  expression that spans the range, which is exactly why the conversion is the
  caller's and the arithmetic here is plain.

# ROUTING - repeated in SELECT_BY_PARAMETER_VALUE, MEASURE_ELEMENT_LENGTHS and
# SET_MEP_SIZE.
#
#   "ducts 500 mm high"              -> here, with 500/304.8 handed in
#   "pipes larger than 100 mm"       -> here, gt
#   "walls between 200 and 300"      -> here, between
#   "find every vcd"                 -> SELECT_BY_PARAMETER_VALUE - a name is
#                                       text and has no unit
#   "all the 300x300 ducts"          -> A SKILL. It is this fragment run
#                                       TWICE, on Width and on Height, with
#                                       the two results intersected - one
#                                       fragment cannot answer it and should
#                                       not pretend to. Where the size is in
#                                       the type NAME instead, it is one call
#                                       to SELECT_BY_PARAMETER_VALUE
#   "how long are these ducts"       -> MEASURE_ELEMENT_LENGTHS - the value
#                                       reported, not used to filter
#   "make these ducts 500 high"      -> SET_MEP_SIZE - this one only reads

utterances:
  - find ducts 500 mm high
  - select pipes larger than 100 mm
  - which walls are thicker than 200
  - filter by a numeric parameter
  - show me everything with a diameter over 150

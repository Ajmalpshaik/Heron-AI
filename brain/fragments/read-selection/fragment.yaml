id: FRG-SEL-002
semantic-identity: "what has the user already picked on screen, right now"
kind: filter
domain: revit.selection
capability: READ_SELECTION
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Reads what the user has selected in Revit and hands it on as `elements`.

  **It is the other half of the library.** Every filter here starts from a
  described set - a category, a type, a room, an id. This one starts from the
  set a human already pointed at, which is how a modeller works most of the
  time: pick the four ducts on screen, then say what to do to them. Without it,
  *"move these up 200"* has no "these", and the whole library can only act on
  what it can describe in words.

  **It is a READ, and that is the point of it existing separately.** SET_SELECTION
  writes the selection; this one only looks at it. Before this fragment,
  *"what did I select"* resolved to SET_SELECTION - a question answered by the
  fragment that CHANGES the thing being asked about, which is the worst kind of
  wrong answer because it looks plausible and is destructive.

contract:
  needs:
    - name: doc
      type: Document
    - name: uidoc
      type: UIDocument
  provides:
    - name: elements
      type: IList<Element>
    - name: selectionCount
      type: int
    - name: vanished
      type: IList<ElementId>

proof:
  date: "2026-09-07"
  by: "Claude Opus 5, at Ajmal PS's PC"
  model: >
    Revit 2024.3, session 29340. Positive on 'Snowdon Towers Sample HVAC.rvt'
    (9,628 elements), which was the only model this session had seen at that
    point. Negative on the same model, and again on 'Project1 work_ajmal.al'
    (3,410 elements, a workshared local) after the owner opened it - by the end
    of the session both were open at once, which is when the off-screen reading
    below was taken.
  positive_case: >
    1,053 duct curves selected, and the fragment read back selectionCount
    1053, picked 1053 ids, elements 1053, vanished 0. Nothing was lost between
    the selection being made and the fragment reading it.
  negative_case: >
    With nothing selected the same build returned selectionCount 0, elements
    0, picked 0, vanished 0 - on BOTH models, in the same session. An empty
    selection reads as empty rather than falling back to everything, to the
    active view, or to the previous run's 1,053. Selecting a category the
    model does not contain gives the same honest zero: 'ducts' on Project1
    work_ajmal.al matched nothing, and the fragment agreed at 0.
  second_route: >
    select_by_category is a different bridge operation reaching the answer
    from the other side - a FilteredElementCollector query over the MODEL,
    where this fragment reads the UI selection store. The two agreed on both
    models in the same session: 1053 and 1053 on Snowdon, 0 and 0 on Project1
    work_ajmal.al. Two mechanisms, one number, twice.

    NOT YET SEEN: a NON-ZERO `vanished`. That list exists for ids that were
    selected and then stopped resolving, and it has been 0 on every run - the
    case that makes it worth having needs an element deleted between the
    selection and the read, which no read-only pass can arrange.

    AND NOT ESTABLISHED: THIS ANSWER IS ONLY TRUE OF THE DOCUMENT ON SCREEN.
    Aimed with `--in` at Snowdon while Project1 work_ajmal.al was in front, it
    returned 0 with `active view: (none)`. Whether Snowdon's selection was
    genuinely cleared when it lost the screen, or whether a UIDocument built
    for an off-screen document cannot see a selection at all, was NOT
    established - and the two are indistinguishable from the bare 0 the caller
    gets. That is the same defect shape LIST_WORKSETS names in its own negative
    case: an empty answer and an unanswerable question must not read alike.
  fingerprint: "f2a532d431d20723"

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  `Selection.GetElementIds()` returns `ICollection<ElementId>` on every release
  2020 to 2027, and no ElementId here is built from or compared to an int, so
  2024's move to 64-bit ids does not reach this code.

  It needs a UIDocument. An operation running with no UI document - a batch
  process, a background session - has no selection to read, which is a real
  condition and not a defect: the fragment is asking about the screen and there
  is no screen.

# ROUTING - repeated in SET_SELECTION.
#
#   "what did I select"        -> here. A QUESTION about the selection
#   "how many did I select"    -> here
#   "move what I picked up 200"-> here, then MOVE_ELEMENTS
#   "select these"             -> SET_SELECTION. A CHANGE to the selection
#   "highlight what you found" -> SET_SELECTION
#   "how many ducts are there" -> COUNT_ELEMENTS. Nothing to do with what is
#                                 picked on screen

utterances:
  - what did I select
  - how many did I select
  - what have I got selected
  - what is selected right now
  - use the ones I picked
  - do it to what I selected
  - these ones I highlighted
  - work on my selection

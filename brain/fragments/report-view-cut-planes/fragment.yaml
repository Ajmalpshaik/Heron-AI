id: FRG-VIEW-129
semantic-identity: "where does each section and elevation cut, which way does it look, how deep is its far clip"
kind: action
domain: revit.views
capability: REPORT_VIEW_CUT_PLANES
version: 1
source: OFFICIAL
risk: READ

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# "LOOKING" IS THE OPPOSITE OF ViewDirection: Revit's ViewDirection points
# from the model OUT towards the viewer, so a section looking north has a
# ViewDirection of south. The answer prints the looking direction.
#
# The far clip is Revit's own text, on or off and how deep.
#
# A view name may carry its kind - "Section: Section 1"; empty reads every
# section, elevation and detail view.
#
# READ ONLY - opens no transaction.
purpose: >
  Lists each section, elevation and detail view with a point on its cut plane
  in millimetres, the direction it looks, and whether its far clip is on and
  how deep.

contract:
  needs:
    - name: doc
      type: Document
    # One view by name, or "Section: Section 1"; an EMPTY value reads every
    # section, elevation and detail view.
    - name: viewName
      type: string
      source: request
  provides:
    - name: cutPlanes
      # ONE STRING, a line per view, because a list reaches the chat cut to
      # three entries.
      role: result
      type: string
    - name: viewCount
      role: result
      type: int
    - name: findings
      type: IList<string>

proof:
  date: '2026-10-18'
  by: Ajmal PS
  model: Project2 (3,035 elements), Revit 2020, session 13520
  positive_case: 'run as it would normally be run. returned MmPerFoot 304.8, bare Section
    1, colon 7, cutPlanes Section: Section 1 | cuts through -600,600,-500 mm | looking 1,0,0
    | far clip (not read), 11200, findings 1 item(s) [1 section, elevation or detail view(s)
    read.], lines 1 item(s) [Section: Section 1 | cuts through -600,600,-500 mm | looking...],

    came viewName as given. on Project2'
  negative_case: 'run with categoryName=Walls, inViewOnly=Heron 3D, viewName=Section: No Such
    Section instead - chosen because it should not contain what this fragment reports. returned
    MmPerFoot 304.8, bare No Such Section, colon 7, cutPlanes , findings 1 item(s) [No section,
    elevation or detail view is named "Section: No S...], lines 0 item(s), mm Func`2, unit
    Func`2, viewCount 0, wanted Section: No Such Section, wantedKind Section. inputs came
    viewName as given. on Project2'
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: c20abe73f2a365b7

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. View.Origin and ViewDirection and the
  parameters VIEWER_BOUND_FAR_CLIPPING and VIEWER_BOUND_OFFSET_FAR are present
  2020 through 2027 - read off RevitAPI.xml in the Nice3point reference
  packages for all eight releases on 2026-10-12.

# ROUTING - the same rows are in the fragments named here.
#
#   "where does section 3 cut"                -> here
#   "which way does this elevation look"      -> here
#   "move the section 500 mm north"           -> MOVE_VIEW_CUT_PLANE
#   "make a section through these"            -> CREATE_SECTION_VIEW

utterances:
  - where does section 3 cut the model
  - which way does this elevation look
  - list the sections with their far clip depth
  - where are the cut lines of the sections

id: FRG-VIEW-098
semantic-identity: "where in this model has somebody typed a date, and in which view"
kind: action
domain: revit.views
capability: FIND_DATES_IN_VIEWS
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Finds every date typed into a text note ANYWHERE in the model and reports it
  with the view it was typed in. Read-only, and it scans the whole document
  rather than a selection.

  **IT EXISTS BECAUSE `EXTRACT_DATES_FROM_TEXT` ANSWERS A DIFFERENT QUESTION,
  and answering this one with that fragment would invent dates.** That one reads
  the notes ON a sheet and attributes each date TO that sheet, which is right
  for revision work. But a plan can be placed on five sheets, and a date typed
  inside that plan belongs to the plan. Rolled up to sheets it becomes five
  dates that nobody wrote. So every date here carries the view it was found in,
  and nothing is attributed upward.

  **THE ANSWER IS "WHERE", NOT JUST "WHAT".** A date on its own is not useful -
  the question behind it is always which drawing is out of date, or which view
  still says last month. So a date that appears in four views is reported once
  with all four named, rather than four times.

  **A SHEET IS A VIEW AND IS INCLUDED, and labelled as one.** Leaving sheets out
  would make this an incomplete answer to "where is this date written", and
  mixing them in unlabelled would make it a confusing one. A sheet reads as
  `M102 - Plan HVAC L2  (SHEET)`, a view as `Level 1  (FloorPlan)`.

  **A NUMERIC MONTH IS REFUSED, and that is the same rule the other fragment
  uses on purpose.** `03-04-2026` is 3 April in Qatar and 4 March in America.
  Two fragments reading one note and reporting different dates would be worse
  than either being wrong alone, because nothing would say which to believe. The
  parser here is the same one, and the finding says so when nothing is found.

  **A DATE IN A PARAMETER IS NOT THIS FRAGMENT'S BUSINESS.** Revit can already
  schedule and filter those. `READ_ELEMENT_PARAMETERS` reads them. What is
  invisible to every schedule in the model - and so worth turning into data - is
  the date somebody typed by hand.

  **VERSION 2 can read the sheets alone.** `sheetsOnly` reads only text typed
  ON a sheet, every sheet, nothing selected - a note inside a plan placed on
  it is counted and not read; `onlySheetsGiven` reads only the sheets handed
  in, never guessed from a selection, and names what is not a sheet. Every
  date then comes back once, oldest first, in one uncapped line with its
  sheets, and `datesFound` gives each date's sheet ids. Version 1's proof no
  longer describes the code and is kept as a record; the card is DRAFT until
  it is proved again.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      # Version 2, from LIST_DATES_ON_SHEETS. The sheets to read when
      # onlySheetsGiven is on - a selection or the step before. Read ONLY then:
      # with the switch off it is ignored. Left out, it binds empty
      # (HeronBindingNote.EmptyWhenAbsent), which is why an empty list never
      # means "every sheet" here.
      type: IList<Element>
      optional: true
    - name: sheetsOnly
      # Version 2. On: read only the text notes typed ON a sheet - every sheet
      # in the model, sheet templates left out. Off, or left out: every note
      # in the model, as version 1.
      type: bool
      source: request
      optional: true
    - name: onlySheetsGiven
      # Version 2. On: read only the sheets in `elements` - "what dates are on
      # THESE sheets" - which implies sheetsOnly. Off, or left out: not
      # narrowed to a selection. Said by the caller, never inferred from an
      # empty `elements`.
      type: bool
      source: request
      optional: true
  provides:
    - name: datesFound
      role: result
      type: IDictionary<string, IList<ElementId>>
    - name: viewNames
      role: result
      type: IDictionary<ElementId, string>
    - name: viewsWithDates
      role: result
      type: int
    - name: findings
      type: IList<string>
    - name: notesRead
      type: int
      # How many text notes were examined. The evidence it looked, not a date
      # it found - a model with 400 notes and no date is a real answer.
      role: accounting
    - name: viewsScanned
      type: int
      # How many distinct views held any text note at all.
      role: accounting
    # VERSION 2, from LIST_DATES_ON_SHEETS. `datesFound` above is ordered
    # oldest date first since version 2, and with sheetsOnly or
    # onlySheetsGiven its ids are the SHEETS, in sheet-number order - the
    # sheets of each date, which are what SET_SHEET_REVISIONS is handed (as
    # its `elements`) to put that date's revision on them.
    - name: uniqueDateCount
      # How many distinct dates were found in what was read. A thing it FOUND,
      # so a result (D-52), and the number a proof judges.
      role: result
      type: int
    - name: dateList
      # Every distinct date on ONE line, oldest first, "  ||  " between them:
      # with the sheets switch "09-SEP-2026 - 2 note(s) on 2 sheet(s): M-101,
      # M-102", without it "09-SEP-2026 - 1 note(s) in 1 view(s): Level 1
      # (FloorPlan)". A STRING because a collection reaches the chat as its
      # count and first three items, and a dictionary as its count alone
      # (RevitFragment.Describe) - which is how five of 2026-10-10's seven
      # dates went missing. NOT CAPPED.
      role: result
      type: string
    - name: sheetsWithDateCount
      # How many of the sheets read carry at least one date typed ON the
      # sheet. Found, so a result.
      role: result
      type: int
    - name: sheetsRead
      # The sheets in scope - every sheet in the model, sheet templates left
      # out, or only those handed in with onlySheetsGiven. The evidence it
      # looked, not a date it found.
      role: accounting
      type: int
    - name: notesOnSheets
      # Text notes whose owner view is one of the sheets read - every one read.
      role: accounting
      type: int
    - name: notesInViewsNotRead
      # With the sheets switch: text notes typed inside any other view -
      # counted and NOT read, the number that shows the sheets-only rule held.
      # Without it: 0, because every note is read.
      role: accounting
      type: int
    - name: sheetsWithNoDate
      # The sheet numbers read that carry no date typed ON them, one line,
      # ", " between them; a placeholder sheet marked "(placeholder)". A date
      # inside a view placed on the sheet does not count.
      role: accounting
      type: string
    - name: summary
      # One paragraph: how much was read, how many dates, and what was NOT
      # read and why - notes inside views, notes on sheets not handed in,
      # notes whose text could not be read, a numeric month. Said every time,
      # because "no date" is only an answer next to how much was looked at.
      role: accounting
      type: string
    - name: notASheet
      # Version 2. Handed in with onlySheetsGiven on and not a sheet - a view,
      # a duct, a sheet view template. Never read. The evidence it looked, not
      # a date it found (D-52).
      role: accounting
      type: IList<ElementId>


revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `TextNote`, `TextNote.Text`,
  `Element.OwnerViewId`, `View.Name`, `View.ViewType`, `ViewSheet.SheetNumber`
  and `FilteredElementCollector(Document)` are present and unchanged 2020
  through 2027.

  **No ElementId is ever read as a number**, so 2024's move to 64-bit ids does
  not reach this. Ids are used as dictionary keys and compared to
  `ElementId.InvalidElementId`, both of which are unchanged across the range.

  **No units call is made anywhere.** The date reading is plain string work with
  no dependence on any Revit type, which is what keeps this one implementation
  rather than two.

  Version 2 adds `ViewSheet.IsPlaceholder` and `View.IsTemplate`, documented in
  the RevitAPI.xml of every release 2020 to 2027 - the members
  LIST_DATES_ON_SHEETS read the same way.

# ROUTING - the same rows are in the fragments named here.
#
#   "where is this date typed"           -> here
#   "which views still say last month"   -> here
#   "find every typed date in the model" -> here
#   "what dates are on these sheets"     -> here, onlySheetsGiven on (version
#                                           2; LIST_DATES_ON_SHEETS until it
#                                           was merged here, 2026-11-01). Only
#                                           a note typed ON a sheet is read -
#                                           a date inside a placed view is
#                                           never rolled up to the sheet
#   "which sheets carry this date"       -> here, sheetsOnly on
#   "take the dates in that text from    -> here, sheetsOnly on - text typed ON
#    all sheets"                            the sheets only, every sheet, each
#                                           date once and all of them in the
#                                           reply (2026-10-10)
#   "put that revision on the sheets     -> SET_SHEET_REVISIONS, fed by this
#    that carry its date"                   card's datesFound with sheetsOnly.
#                                           Reading the dates and attaching
#                                           the revision are two decisions
#   "create revisions for the dates on   -> CREATE_REVISIONS_FROM_SHEET_DATES -
#    the sheets"                            a WRITE that makes the revisions
#                                           this card only lists. It stays a
#                                           card of its own
#   "change the revision date"           -> EDIT_REVISION
#   "list the sheets"                    -> FIND_SHEETS
#   "read the date parameter"            -> READ_ELEMENT_PARAMETERS, for a date
#                                           that IS a parameter and is already
#                                           schedulable
#   "change the text in a note"          -> EDIT_TEXT_VALUES
#   "which views show this element"      -> FIND_VIEWS_SHOWING_ELEMENT, a
#                                           different question about views that
#                                           sounds alike

# VERSION 2 (2026-11-01) - LIST_DATES_ON_SHEETS WAS MERGED INTO THIS CARD on
# the owner's instruction ("make sure there is no duplicate tools"), and is
# DEPRECATED. The same reading - the dates typed in text notes, one parser, a
# written month, 31 SEP refused, a note's own owner view deciding where it
# was typed - and this card already read every note in the model and named
# each date's view. What LIST_DATES_ON_SHEETS had and this card lacked is
# here now: a sheets-only switch (`sheetsOnly`); the sheets handed in by a
# second switch, never inferred from an empty list (`onlySheetsGiven`, with
# `elements` and `notASheet`); a sheet view template left out; every date
# once, oldest first, in one uncapped line (`dateList`); `datesFound` with
# each date's sheet ids; and every count - uniqueDateCount,
# sheetsWithDateCount, sheetsRead, notesOnSheets, notesInViewsNotRead,
# sheetsWithNoDate - with a `summary` that says what was not read, a note
# whose text could not be read included. The parser is kept character for
# character (tests/test_sheet_date_parser.py). It had itself taken
# EXTRACT_DATES_FROM_TEXT earlier the same day.
#
# WHERE LIST_DATES_ON_SHEETS' OUTPUTS ARE NOW: every one under the same name
# here - uniqueDateCount, dateList, sheetsWithDateCount, sheetsRead,
# notesOnSheets, notesInViewsNotRead, sheetsWithNoDate, summary, datesFound,
# notASheet. Its switch `onlySheetsGiven` keeps its name; its "every sheet
# with the switch off" is `sheetsOnly` on here, because off here means every
# view, this card's proved job. Its sentences moved here.
# CREATE_REVISIONS_FROM_SHEET_DATES stays a card of its own: it WRITES.
#
# NOTHING WAS OPPOSITE. The one rule that looked it - this card reads every
# view, that one only sheets - is the switch, and both answers are kept.

utterances:
  - where has somebody typed a date in this model
  - find every date written in a text note
  - which views still have the old date on them
  - where is this date written
  - show me the typed dates and which view they are in
  # MOVED 2026-11-01 from LIST_DATES_ON_SHEETS, merged into this card - its

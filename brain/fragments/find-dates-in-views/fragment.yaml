  # from EXTRACT_DATES_FROM_TEXT.
  - check all sheets, take all the text on the sheets, take the dates in that text from all sheets, and keep only unique dates
  - what dates are written on these sheets
  - find the dates in the title block text
  - which sheets carry this date
  - the date is typed in a text note

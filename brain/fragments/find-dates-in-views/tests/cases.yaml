# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: >
      a text note reading "09 SEP 2026" typed into a floor plan, and another
      reading "22 JUL 2025" typed onto a sheet
    expect: >
      two dates, each named with the view it was typed in - the plan by its own
      name and view type, the sheet as "M102 - Plan HVAC L2  (SHEET)". A sheet
      is a view and belongs in the answer; leaving it out would make "where is
      this date written" an incomplete answer

  - given: >
      one plan carrying "09 SEP 2026", placed on three sheets
    expect: >
      ONE date against ONE view. This is the whole reason the fragment exists -
      EXTRACT_DATES_FROM_TEXT would report it against three sheets, which is
      right for revision work and would here invent two dates nobody typed

  - given: >
      "22 Jul 2025" in one view and "22/JUL/25" in another
    expect: >
      ONE date with both views named. Separators and a two-digit year are the
      same day written differently, and reporting two has somebody chasing a
      revision that never happened

  - given: >
      MAY in one view and May in another
    expect: >
      one date, not two. Case does not make a different day

negative:
  - given: >
      a model whose only text notes read "2 OFF 300" and "SFGSFDGSDFG"
    expect: >
      no dates, and notesRead reporting that both notes WERE examined. A count
      of zero with no evidence of looking cannot be told from a fragment that
      never ran

  - given: >
      a note reading "09-09-2026"
    expect: >
      NO date, and the finding saying why - a numeric month is refused because
      03-04-2026 is 3 April in Qatar and 4 March in America. Reading it would
      make this fragment disagree with EXTRACT_DATES_FROM_TEXT on the same note,
      which is worse than either being wrong alone

  - given: >
      a note reading "31 SEP 2026"
    expect: >
      no date. There is no 31st of September, and a three-letter word between
      two numbers is not a date

  - given: >
      a model with no text notes at all
    expect: >
      no dates, notesRead 0, and a finding pointing at READ_ELEMENT_PARAMETERS
      for a date held in a title block parameter - which is a different thing
      and already schedulable

  - given: >
      a date held only in the title block's "Sheet Issue Date" parameter
    expect: >
      NOTHING found. That date is already data Revit can schedule and filter.
      What this fragment exists for is the one typed by hand, which is invisible
      to every schedule in the model

  # VERSION 2 (2026-11-01, LIST_DATES_ON_SHEETS merged in). Each of these
  # FAILS on version 1, which has no switch and no dateList. The arrangement
  # is that card's: "Heron Sheet Dates", a scratch project with four sheets.
  # Typed ON the sheets, each while that sheet is the open view: S-01 "ISSUED
  # 09 SEP 2026" and "REV A 22 Jul 2025"; S-02 "22/JUL/25" and "15 MAY 2026";
  # S-03 "15 May 2026"; S-04 "09-09-2026", "31 SEP 2026" and "2 OFF 300". A
  # floor plan is placed on S-04 with "01 JAN 2026" typed INSIDE the plan.
  # It is never made in one of the owner's working models.
  - given: VERSION 2. "Heron Sheet Dates", sheetsOnly on, nothing selected
    expect: >
      uniqueDateCount 3 and dateList, oldest first,
      "22-JUL-2025 - 2 note(s) on 2 sheet(s): S-01, S-02  ||
      15-MAY-2026 - 2 note(s) on 2 sheet(s): S-02, S-03  ||
      09-SEP-2026 - 1 note(s) on 1 sheet(s): S-01". sheetsWithDateCount 3,
      sheetsRead 4, notesOnSheets 8, sheetsWithNoDate "S-04", and
      notesInViewsNotRead at least 1. 01-JAN-2026 is NOT in the list - it is
      inside a plan. Version 1 has no switch and reports it

  - given: VERSION 2. The same project, both switches left out
    expect: >
      every note read, as version 1 - 01-JAN-2026 IS found, against the plan
      it was typed in; notesInViewsNotRead 0; dateList carries all four dates
      oldest first, each with its views

  - given: >
      VERSION 2. sheetsOnly on, in a project whose only dates are typed
      inside a floor plan placed on a sheet, in a drafting view on no sheet,
      and in a sheet's Sheet Issue Date parameter
    expect: >
      uniqueDateCount 0, dateList empty, every sheet in sheetsWithNoDate,
      notesInViewsNotRead at least 2. A version that read every view shows
      the plan's and the drafting view's dates here

  - given: >
      VERSION 2. onlySheetsGiven on, S-01 and S-03 handed in (selected in the
      Project Browser)
    expect: >
      sheetsRead 2, uniqueDateCount 3 - 22-JUL-2025 and 09-SEP-2026 from S-01,
      15-MAY-2026 from S-03 - each row naming only S-01 or S-03: S-02's notes
      are NOT read, and the summary says how many notes on other sheets were
      not. datesFound has the same three dates, each with those sheets' ids

  - given: VERSION 2. onlySheetsGiven on and NOTHING handed in
    expect: >
      sheetsRead 0, uniqueDateCount 0, and the summary saying no sheet was
      handed in and nothing was read. NOT every sheet - an empty list is what
      the binder hands in when nothing is given

  - given: VERSION 2. onlySheetsGiven on, S-01 handed in with a floor plan VIEW and a duct
    expect: the plan's and the duct's ids in notASheet, never read; S-01 read

  - given: VERSION 2. onlySheetsGiven left out, S-01 selected, sheetsOnly on
    expect: >
      every sheet read, exactly the answer with nothing selected. The
      selection is ignored when the switch is off

  - given: >
      VERSION 2. A view template for sheets in the project, sheetsOnly on, on
      a release that lets one be made (which release first does is NOT
      MEASURED here)
    expect: >
      not counted in sheetsRead and not listed in sheetsWithNoDate - it is
      not a sheet

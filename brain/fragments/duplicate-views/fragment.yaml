id: FRG-VIEW-029
semantic-identity: "make copies of these views, plain or with the detailing, or as dependents - a legend under a new name, or a view template when asked"
kind: action
domain: revit.views
capability: DUPLICATE_VIEWS
version: 3
source: OFFICIAL
risk: MODIFY

purpose: >
  Duplicates every view handed in, one of three ways, and hands back the ids of
  what was made so the next fragment can rename them, apply a template to them
  or place them on sheets.

  THE THREE WAYS ARE NOT INTERCHANGEABLE and the caller must choose:
    Duplicate       the view alone. Annotation and detail items are NOT copied
    WithDetailing   the view and everything drawn on it
    AsDependent     a dependent view that stays tied to its parent's crop

  Revit is asked FIRST whether each view can be duplicated that particular way,
  because the answer differs per option - a view can be duplicable plainly and
  refuse to become a dependent. Asking per option rather than per view is the
  difference between a clean skip and an exception.

  EACH VIEW IS TRIED ON ITS OWN. The version this was re-authored from wrapped
  the whole loop in one try, so one awkward view rolled back thirty-nine good
  duplicates. Under Golden Rule 16 the transaction belongs to the caller, so a
  throw let out of here would abort work this fragment never saw. Catching per
  view and reporting the id is both safer and more useful.

  The returned id is resolved back to a real view before it is counted. Every
  fragment here reports what HAPPENED rather than what was asked for, and an id
  that does not resolve is not a duplicated view.

  A VIEW TEMPLATE IS NOT DUPLICATED ON THE PLAIN PATH (version 2) and is
  reported in notDuplicated, so a template is never copied by accident.

  **Version 3: a legend under a new name, and a template when asked.** One
  view copied takes `newName`, read back, and a name Revit refuses is said. A
  legend copied is told it is on no sheet yet - a legend can sit on many sheets
  at once - and with nothing handed in, a project with no legend is told that
  Revit's API cannot make the first one. A view template is copied only when
  asked for - by name in `templateName`, or with `copyTemplates` - through
  CopyElements, because View.Duplicate cannot copy one; Revit's suffixed name
  for the copy is read back and the copy is not renamed here. Version 2's
  proof no longer describes the code and is kept as a record, and the
  fragment is DRAFT until it is proved again.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16), so
  duplicating forty views is one undo entry.

contract:
  needs:
    - name: doc
      type: Document
    # The views to copy. Optional since version 3, so a template can be named
    # in `templateName` with nothing else handed in; left out it binds an
    # empty list (HeronBindingNote.EmptyWhenAbsent).
    - name: elements
      type: IList<Element>
      optional: true
    # Duplicate, WithDetailing or AsDependent - never a default. Optional
    # since version 3: left out it reads `none`, no way at all, and every view
    # handed in is named in notDuplicated and none is made - exactly what an
    # unrecognised word always did. A template copy needs no option.
    - name: duplicateOption
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 3, from CREATE_LEGEND_VIEW. The name for the copy when ONE view
    # is copied, read back; with several copied it is not applied and
    # RENAME_ELEMENTS is named. Never put on a template copy. Left out:
    # `none`, Revit's own name.
    - name: newName
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 3, from DUPLICATE_VIEW_TEMPLATE. true copies the view templates
    # handed in with `elements`, through CopyElements. Left out it is false:
    # a template handed in is refused, as version 2 refused it.
    - name: copyTemplates
      type: bool
      source: request
      optional: true
    # VERSION 3, from DUPLICATE_VIEW_TEMPLATE. A view template to copy, by
    # name - "Mechanical Plan". One that is not a template in this model is
    # refused with every template named. Left out: `none`.
    - name: templateName
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: newViewIds
      role: result
      type: IList<ElementId>
    - name: duplicated
      role: result
      type: int
    - name: notDuplicated
      # Views Revit said could not be duplicated that particular way. *An id
      # that does not resolve is not a duplicated view* - never one it made
      # (D-52).
      role: accounting
      type: IList<ElementId>
    - name: newNames
      # VERSION 3. Each new view's name as Revit holds it, in the order of
      # newViewIds - read back, never the name asked for.
      role: result
      type: IList<string>
    - name: templateCopyIds
      # VERSION 3, from DUPLICATE_VIEW_TEMPLATE. Each view template copied,
      # for RENAME_ELEMENTS to take after the commit.
      role: result
      type: IList<ElementId>
    - name: copyName
      # VERSION 3, from DUPLICATE_VIEW_TEMPLATE. The name each template copy
      # ACTUALLY carries - Revit auto-suffixes it, 'Mechanical Plan' becomes
      # 'Mechanical Plan1' - comma separated. Empty when none was copied.
      role: result
      type: string
    - name: findings
      # VERSION 3. A summary line, then the template refusals, the name read
      # back or refused, a legend's note, and the first-legend sentence.
      type: IList<string>


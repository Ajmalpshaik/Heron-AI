compatibility-note: >
  One implementation for every release. `View.Duplicate`,
  `View.CanViewBeDuplicated` and the three `ViewDuplicateOption` members are
  unchanged 2020 to 2027 and no units call is made. The option arrives as a
  STRING and is matched by name, so an unrecognised one is reported rather than
  silently becoming a default, and a release that adds a member needs no change
  here. `ElementId` values are collected and resolved only, never converted to
  or from an integer, which keeps this clear of the 2024 change. Version 3
  adds `ElementTransformUtils.CopyElements`, `View.IsTemplate`, `Element.Name`
  (get and set) and `ViewType.Legend`, present 2020 through 2027 - the calls
  DUPLICATE_VIEW_TEMPLATE and CREATE_LEGEND_VIEW were proved with, compiled for
  all eight releases by tools/check-fragments-compile.py on 2026-11-01. There
  is no legend creation method on any of them.

# VERSION 2 (2026-11-01) - DUPLICATE_VIEW WAS MERGED INTO THIS CARD on the
# owner's instruction, and is DEPRECATED. The same job - copy views one of
# Revit's three ways, the way stated and never a default - and this card already
# handed back the new ids for the next step. Its one guard this card lacked is
# now here: a view template is refused, never copied. Its option arrives here as
# the word Duplicate, WithDetailing or AsDependent. Its sentences and its routing
# rows moved here.
#
# ROUTING - repeated in APPLY_VIEW_TEMPLATE, CREATE_PLAN_VIEW, CREATE_3D_VIEW,
# PLACE_VIEW_ON_SHEET, CREATE_DRAFTING_VIEW, RENAME_ELEMENTS and
# CREATE_VIEW_TEMPLATE_FROM_VIEW.
#
#   "duplicate this view"            -> here
#   "make a new 3d view"             -> CREATE_3D_VIEW. Duplicating an existing
#                                       view and making one from scratch are
#                                       different jobs and this does only the
#                                       first
#   "copy this view template"        -> here since version 3, with
#                                       templateName or copyTemplates
#   "copy these to the other floors" -> COPY_ELEMENTS - elements, not views.
#                                       "COPY" MEANS ELEMENTS OR VIEWS
#                                       depending on the sentence
#   "make another legend like this one" -> here since version 3. Revit can
#                                       make no legend from nothing on any
#                                       release, so copying one is the only
#                                       route
#   "make a template from this view" -> CREATE_VIEW_TEMPLATE_FROM_VIEW - a new
#                                       template out of a view's settings,
#                                       rather than a copy of one that exists
#   "rename the copy"                -> EDIT_TEXT_VALUES field Name (RENAME_ELEMENTS
#                                       until it was merged there, 2026-11-01), and for a template
#                                       copy a SEPARATE call: its name is
#                                       settled once this transaction commits
#   "make a detail view"             -> CREATE_DRAFTING_VIEW
#   "add a colour fill legend"       -> APPLY_COLOR_FILL_SCHEME - Revit's
#                                       Color Fill Legend, placed IN a plan,
#                                       not a legend view
#
# VERSION 3 (2026-11-01) - CREATE_LEGEND_VIEW AND DUPLICATE_VIEW_TEMPLATE WERE
# MERGED INTO THIS CARD on the owner's instruction ("make sure there is no
# duplicate tools"), and are DEPRECATED. CREATE_LEGEND_VIEW copied one legend
# under a new name; that is one view duplicated here with `newName`, its
# `created` now newViewIds[0] and its name in newNames, and its first-legend
# sentence said when nothing is handed in and the project has none. Its
# refusal of a view that is not a legend was NOT carried: this card copies any
# view, which is the job that card pointed away to. DUPLICATE_VIEW_TEMPLATE
# copied a template by name; that is `templateName` here, its copyId now
# templateCopyIds and its copyName the same name. THE PLAIN PATH STILL REFUSES
# A TEMPLATE, as version 2 decided - a template is copied only when the call
# asks for one by templateName or copyTemplates. Their sentences and routing
# rows moved here.


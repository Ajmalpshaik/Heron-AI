id: FRG-VIEW-030
semantic-identity: "tag a mixed set of elements in one view, each with the right tag family, without double-tagging"
kind: action
domain: revit.views
capability: TAG_ELEMENTS_IN_VIEW
version: 3
source: OFFICIAL
risk: MODIFY

purpose: >
  Tags a MIXED set of elements in one view - ducts get a duct tag, pipes a pipe
  tag, terminals a terminal tag - and reports what it tagged, what was already
  tagged, and what it could not tag.

  THREE THINGS IT KNOWS THAT THE API WILL NOT TELL YOU, all of them the reason
  this is a fragment rather than three lines:

  **1. The category-to-tag-category map is a fixed fact, not a lookup.** Nothing
  in the API derives "a duct is tagged by a duct tag". `ElementTypeGroup` has no
  per-MEP-category tag entries at all, so the map is carried here.

  **2. The tag family must come from the project's own default, never from the
  first one loaded.** `GetDefaultFamilyTypeId` on the tag category returns what
  Revit's own "Tag by Category" would use - the family this project
  standardised on. Taking the first loaded symbol instead silently produces the
  wrong tag family on every element, and the drawing looks tagged. The order
  here is: the caller's hint, then the project default, then first loaded - and
  the answer SAYS which of the three it used, so a guess is never invisible.

  **3. `IndependentTag.Create` DOES NOT RELIABLY HONOUR THE TYPE PASSED TO IT,
  and it throws nothing.** Measured where this was re-authored from: 38 tags
  created with an explicit type id all came out as the document's default type
  instead. So every tag's type is read back after creation and corrected, and
  the number of corrections is REPORTED rather than quietly fixed - a silent
  correction hides an API that is not doing what it was told.

  IT NEVER DOUBLE-TAGS. Existing tags in the view are read first and their
  targets recorded, so running twice is safe and the second run says "already
  tagged" instead of stacking a second tag - the failure that makes a drawing
  look right on screen and print wrong.

  NO DRY-RUN INPUT, DELIBERATELY. Previewing a write is the HOST's job through
  the Step 6 preview and approval path. A second preview inside the fragment
  would be a second mechanism that can disagree with the first about what is
  going to happen, and the one the user approved must be the one that runs.

  TAGS ARE VIEW-SPECIFIC. An element tagged in the ceiling plan is untagged in
  the section, and that is correct Revit behaviour rather than a miss.

  WHICH VIEW COMES FROM THE REQUEST, NOT FROM A FRAGMENT. The user says "tag
  everything in THIS view", and turning that into a `View` is the host's job -
  the same shape as `category` on a filter or the template name on
  APPLY_VIEW_TEMPLATE. Declaring it fragment-sourced instead made the dependency
  graph report this action as one nothing could feed, because the graph requires
  a SINGLE producer to satisfy every fragment-sourced need and no filter
  provides both `elements` and a `view`. That report was right about the
  contract and is fixed here by naming the source correctly, not by working
  around the graph.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16), so
  tagging a whole view is one undo entry.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: view
      type: View
      source: request
    - name: tagTypeHintId
      type: ElementId
      source: request
    - name: leader
      # none | straight, and `none` is the default ON PURPOSE - it is byte for
      # byte the behaviour proved on 2026-09-14 (addLeader false, head at
      # XYZ.Zero), so leaders did not disturb the path that was proved.
      #
      # `L` IS ACCEPTED BUT MEANS `straight` HERE. This fragment does not bend
      # anything: FORCE_TAG_LEADER_LSHAPE (FRG-VIEW-088) owns that, because a
      # bend needs LeaderEndCondition.Free set first and an elbow read back
      # afterwards, and neither belongs in a tagging fragment. Ask for a
      # leader here, then bend it there.
      type: string
      source: request
    - name: minLengthMm
      # MODEL MILLIMETRES - the run's own length, NOT a length on the paper.
      # The exception among the millimetre values here, and deliberately so:
      # "do not tag anything under half a metre" is a fact about the duct and
      # must not change meaning when the view scale does. It is therefore the
      # one value NOT multiplied by the scale.
      #
      # 0, the default, tags everything. A run shorter than this is reported
      # in `tooShort` rather than dropped in silence.
      type: double
      source: request
    - name: leaderOffsetMm
      # PAPER MILLIMETRES, multiplied by the view scale - the house idiom, and
      # the thing version 2 of this fragment got wrong. An unscaled 3000 mm is
      # 60 mm on the sheet at 1:50, which ran the leaders across the drawing.
      # Converted here with no units API call, deliberately, because UnitUtils
      # splits at 2021 and this range starts at 2020. Unset arrives as 0 and a
      # zero offset puts the head on what it points at, so 0 falls back to 8.
      type: double
      source: request
  provides:
    - name: tagged
      role: result
      type: int
    - name: alreadyTagged
      # Elements that were ALREADY in the state asked for, so there was
      # nothing to do. The evidence it looked, never a change it made
      # (D-52).
      role: accounting
      type: int
    - name: typeCorrections
      # Tags moved onto the project's own default tag family. THE TAG FAMILY
      # MUST COME FROM THE PROJECT'S DEFAULT, NEVER FROM THE FIRST ONE LOADED,
      # and this is the count of that correction actually happening.
      role: result
      type: int
    - name: leadersDrawn
      # Leaders actually drawn. A RESULT, not accounting: it is the thing the
      # caller asked for when they asked for a leader, and it is what
      # `leader=none` turns off - which is what lets the negative leg of a
      # proof be value-driven rather than a second selection (D-30).
      role: result
      type: int
    - name: leadersNotDrawn
      # Elements tagged with NO leader though one was asked for, because Revit
      # gave no location to run one from - hosted and nested things among them.
      # The tag is real and the leader is not, so this is accounting, never a
      # thing it made (D-52).
      role: accounting
      type: int
    - name: tooShort
      # Runs below the caller's minimum length, left untagged on purpose. A
      # stub shorter than its own tag is clutter on a drawing. Counted, never
      # silent - a tag count that falls with no reason given reads as elements
      # the run could not handle.
      role: accounting
      type: IList<ElementId>
    - name: verticalSkipped
      # Risers. A duct running along the view's own direction has no length on
      # the paper, so a tag on it sits against a dot and its leader points at
      # nothing anybody can follow. NOT tagged, deliberately, and counted
      # rather than quietly dropped - a count that falls with no reason given
      # reads as elements the run could not handle.
      role: accounting
      type: IList<ElementId>
    - name: notTagged
      # *What it could not tag* - the third of the three things this reports,
      # beside what it tagged and what was already tagged. Never a tag it
      # placed (D-52).
      role: accounting
      type: IList<ElementId>


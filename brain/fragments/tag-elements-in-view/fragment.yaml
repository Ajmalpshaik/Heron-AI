revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `IndependentTag.Create`,
  `IndependentTag.GetTaggedLocalElementIds`, `Element.ChangeTypeId`,
  `Document.GetDefaultFamilyTypeId` and `Category.GetCategory` are unchanged
  2020 to 2027, and no units call is made. Version 4's derived tag category
  reads `Enum.GetNames(typeof(BuiltInCategory))` and `Category.CategoryType` -
  the enum's names differ between releases only by categories added, and a
  name a release lacks simply does not parse, so the same code asks each
  release about the categories it has.

  **TWO REAL VERSION BREAKS, BOTH FOUND BY THE COMPILE GATE AND NEITHER BY
  READING.** This note said something confidently wrong before it was run, which
  is exactly why the gate reads every release a fragment claims:

  **1. Reading what a tag points at splits at 2022, with no single expression.**
  `GetTaggedLocalElementIds` was added when one tag became able to carry several
  hosts, and DOES NOT EXIST on 2020 or 2021; the singular `TaggedLocalElementId`
  it replaced is deprecated after. This note previously claimed the plural
  "works on every release in this range" - it does not, and the compiler said so
  on 2020 and 2021. The split is written out with `#if`, and it is the only
  place in this fragment where the release matters.

  **2. `ElementId.IntegerValue` is GONE by 2026** - the 2024 change finishing
  rather than a new one. So categories are matched by comparing `ElementId`
  values against `new ElementId(BuiltInCategory)` instead of unwrapping one to
  an integer, which needs no version branch at all.

  The `#if` needs the same compilation symbols the add-in is built with, and the
  fragment harness did not define any until this fragment needed one - see
  `tools/check-fragments-compile.py`, which now mirrors
  `Directory.Build.props`.

# ROUTING - the same rows are in the fragments named here.
#
#   "tag these ducts"                -> here - it PLACES tags
#   "the tags are on top of each other" -> FIND_OVERLAPPING_TAGS - a READ over
#                                       tags already there, and it must not
#                                       answer by placing more
#   "what is untagged"               -> FIND_UNTAGGED_ELEMENTS
#   "tag the doors in this view"     -> here, since version 4. Before it the
#                                       route that worked was
#                                       FIND_UNTAGGED_ELEMENTS then TAG_ELEMENTS
#                                       with the door tag named. ONE TAG TYPE ON
#                                       EVERYTHING, chosen by hand, is here too
#                                       since version 6: `tagTypeId`
#   "tag the ducts again using this tag family"
#                                    -> here, with `tagTypeId` (version 6). An
#                                       element is skipped only when it already
#                                       carries a tag of THAT type
#   "tag the rooms"                  -> TAG_ROOMS - a room tag is not an
#                                       independent tag, and here refuses rooms

# VERSION 6 (2026-11-01) - TAG_ELEMENTS WAS MERGED INTO THIS CARD on the
# owner's instruction, and is DEPRECATED. Both put a tag on each element in one
# view and never stacked a second; this card also chooses the tag family per
# category, reads the type back and corrects it, skips risers and refuses
# rooms. What TAG_ELEMENTS had that this lacked is here: the exact type, the
# type-aware skip that comes with it, and `skipped`. Its `alreadyTagged` input
# - FIND_UNTAGGED_ELEMENTS' list - is not taken: this reads the view's own
# tags, so the list cannot be stale. Its `addLeader` is `leader` here, none or
# straight. NOT CARRIED, the safer rule kept: TAG_ELEMENTS tagged a room as an
# IndependentTag ("tagged 5" in Project1's "1 - Mech", 2026-09-23); here a room
# goes to TAG_ROOMS in both modes. Its routing rows now read here: "tag these"
# and "put tags on these" -> here; "show me the ducts" -> SET_SELECTION; "cloud
# this change" -> ADD_REVISION_CLOUD; "dimension these" -> CREATE_DIMENSION;
# "centre the room tags" -> CENTER_ROOM_TAGS; "stack the tags at the side" ->
# STACK_TAGS; "copy the tags from the old units to the new units" ->
# COPY_TAGS_TO_REPLACEMENTS. "SHOW" IS THE AMBIGUOUS WORD: "show me the sizes"
# wants an answer in the chat, "show the sizes on the drawing" wants tags.


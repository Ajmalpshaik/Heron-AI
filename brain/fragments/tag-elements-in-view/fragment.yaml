compatibility-note: >
  One implementation for every release. `IndependentTag.Create`,
  `IndependentTag.GetTaggedLocalElementIds`, `Element.ChangeTypeId`,
  `Document.GetDefaultFamilyTypeId` and `Category.GetCategory` are unchanged
  2020 to 2027, and no units call is made. Version 4's derived tag category
  reads `Enum.GetNames(typeof(BuiltInCategory))` and `Category.CategoryType` -
  the enum's names differ between releases only by categories added, and a
  name a release lacks simply does not parse, so the same code asks each
  release about the categories it has.

  **TWO REAL VERSION BREAKS, BOTH FOUND BY THE COMPILE GATE AND NEITHER BY
  READING.** This note said something confidently wrong before it was run, which
  is exactly why the gate reads every release a fragment claims:

  **1. Reading what a tag points at splits at 2022, with no single expression.**
  `GetTaggedLocalElementIds` was added when one tag became able to carry several
  hosts, and DOES NOT EXIST on 2020 or 2021; the singular `TaggedLocalElementId`
  it replaced is deprecated after. This note previously claimed the plural
  "works on every release in this range" - it does not, and the compiler said so
  on 2020 and 2021. The split is written out with `#if`, and it is the only
  place in this fragment where the release matters.

  **2. `ElementId.IntegerValue` is GONE by 2026** - the 2024 change finishing
  rather than a new one. So categories are matched by comparing `ElementId`
  values against `new ElementId(BuiltInCategory)` instead of unwrapping one to
  an integer, which needs no version branch at all.

  The `#if` needs the same compilation symbols the add-in is built with, and the
  fragment harness did not define any until this fragment needed one - see
  `tools/check-fragments-compile.py`, which now mirrors
  `Directory.Build.props`.

  Version 7 adds TAG_ROOMS' calls, PROVEN on Revit 2024: NewRoomTag(LinkElementId,
  UV, ElementId), RoomTag.TaggedLocalRoomId, NewSpaceTag(Space, UV, View),
  SpaceTag.Space, the Zone Tags category OST_ZoneTags, Zone.Spaces,
  View.GenLevel, GetPrimaryViewId, GetDependentViewIds and GetCategoryHidden -
  the same signatures 2020 to 2027, read off every release's reference
  assemblies for that card. A zone tag's target is read with
  GetTaggedLocalElementIds or TaggedLocalElementId FOUND BY NAME at run time,
  and Zone.IsDefaultZone the same way - Revit 2027 removed it - exactly as
  TAG_ROOMS read them (its reason: row 5b-181).

# ROUTING - the same rows are in the fragments named here.
#
#   "tag these ducts"                -> here - it PLACES tags
#   "the tags are on top of each other" -> FIND_OVERLAPPING_TAGS - a READ over
#                                       tags already there, and it must not
#                                       answer by placing more
#   "what is untagged"               -> FIND_UNTAGGED_ELEMENTS
#   "tag the doors in this view"     -> here, since version 4. Before it the
#                                       route that worked was
#                                       FIND_UNTAGGED_ELEMENTS then TAG_ELEMENTS
#                                       with the door tag named. ONE TAG TYPE ON
#                                       EVERYTHING, chosen by hand, is here too
#                                       since version 6: `tagTypeId`
#   "tag the ducts again using this tag family"
#                                    -> here, with `tagTypeId` (version 6). An
#                                       element is skipped only when it already
#                                       carries a tag of THAT type
#   "tag the rooms"                  -> here, since version 7 (TAG_ROOMS was
#                                       merged in, 2026-11-01) - with Revit's
#                                       own ROOM tag, never an independent tag,
#                                       after FILTER_ELEMENTS_BY_CATEGORY with
#                                       category=Rooms and the plan's level
#   "tag all the rooms in the active view" -> here, the same. Never a view-
#                                       scoped collect: it can return no rooms
#                                       at all (0 of 7 on 2026-09-19)
#   "tag the spaces"                 -> here, a Space Tags type, after
#                                       FILTER_ELEMENTS_BY_CATEGORY with
#                                       category=Spaces and the plan's level
#   "tag the hvac zones"             -> here, a Zone Tags type, after
#                                       FILTER_ELEMENTS_BY_CATEGORY with
#                                       category=HVAC Zones and the plan's level
#   "centre the room tags"           -> CENTER_ROOM_TAGS, which only MOVES room
#                                       tags that already exist
#   "which rooms are not tagged"     -> FIND_UNTAGGED_ELEMENTS - a READ; it
#                                       reads the independent tag class only,
#                                       so to it every room is untagged (row
#                                       recorded on TAG_ROOMS, 2026-09-24)
#   "put beam tags at mid-span on every beam in this view"
#                                    -> ADD_BEAM_ANNOTATIONS (2026-11-02) - a
#                                       tag at a beam's start, middle or end,
#                                       with spot elevations at its ends if
#                                       asked; this card tags at an element's
#                                       own point and knows no position along
#                                       a beam

# VERSION 7 (2026-11-01) - TAG_ROOMS WAS MERGED INTO THIS CARD on the owner's
# instruction ("make sure there is no duplicate tools"), and is DEPRECATED.
# The same job - a tag on each element handed in, in one view, never a second
# - for the three kinds this card had refused. What it had and this card
# lacked is here now: ROOMS through the document's NewRoomTag, SPACES through
# NewSpaceTag, HVAC ZONES through IndependentTag.Create on a reference to the
# zone with a Zone Tags type, at the largest space's point on the plan's level;
# the tags already in the plan read by category over the whole model and by
# the view that owns them, a dependent view's shared; only a plan of one
# level, and `unplaced`, `notEnclosed` and `otherLevel` for the rest; every tag
# read back for its type and its target, a wrong one removed (`mismatched`);
# `newTags`; the hidden-category and Revit's-own-words lines in `findings`;
# and one from another model refused.
#
# THE SAFER RULE IN EACH CONFLICT IS KEPT (the owner: "in every conflict keep
# the safer rule"). A ROOM IS NEVER GIVEN AN ORDINARY ELEMENT TAG: TAG_ELEMENTS
# did that on 2026-09-23 and the tags were not room tags. THE TAG TYPE FOR A
# ROOM: TAG_ROOMS demanded one and refused the call without it; this card
# chose per category, falling to the first one loaded. Kept: a type NAMED -
# and of the room's own kind, a mismatch refused for that element - or the
# project's DEFAULT room, space or zone tag; never the first one loaded, so it
# is never guessed (D-33). TAG_ROOMS stopped the whole call for a view that is
# not a plan of one level, a template, or a type not of the three kinds; here
# each such room is refused by id with the reason, and the ducts and doors
# handed in beside them are still tagged - nothing is placed on a room either
# way.
#
# WHERE ITS OUTPUTS ARE NOW: tagged -> tagged, newTags -> newTags, mismatched

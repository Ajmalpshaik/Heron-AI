# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: >
      a mixed set - ducts, pipes and air terminals, none tagged - in one plan
      view, tagTypeHintId = ElementId.InvalidElementId
    expect: >
      tagged equals the count, alreadyTagged 0. Then LOOK AT THE VIEW and check
      the tag FAMILIES: ducts carry a duct tag, pipes a pipe tag. A count cannot
      show that, and the wrong family everywhere still counts as fully tagged

  - given: the same call run a SECOND time on the same view
    expect: >
      tagged = 0 and alreadyTagged equals the count, and NO second tag appears
      on any element. Stacked tags look right on screen and print wrong

  - given: a tagTypeHintId naming a real tag type of the right category
    expect: that family is used, and the read-back confirms it on every tag

  - given: >
      doors on one level (version 4), tagTypeHintId = a door tag type, in a
      plan view
    expect: >
      every door tagged with THAT door tag, `tagTypesUsed` naming it with "the
      caller's hint". Count them back with FILTER_ELEMENTS_BY_CATEGORY Door Tags
      inViewOnly=<the view>. Version 3 answered notTagged for every door

  - given: >
      ducts in a plan view, leader = none (version 5)
    expect: >
      every tag's head READ BACK at its own duct - the middle of the location
      line, in the view's plane - and none at the project origin. Versions 3
      and 4 passed XYZ.Zero on the MEP path and Revit put every head there,
      87 to 93 m from its duct, while the count still said tagged 3 (5b-452).
      A count cannot see where a tag went; IndependentTag.TagHeadPosition can

  - given: >
      VERSION 6. a mixed set - ducts, pipes and doors, none tagged - with
      tagTypeId a Multi-Category tag type
    expect: >
      every element tagged with THAT Multi-Category type, typeCorrections
      reading back to it, and `tagTypesUsed` one line, "every category: ...
      (the caller's exact type, on every category)". Version 5 has no
      tagTypeId and tags each category with its own family, so this FAILS on
      it (TAG_ELEMENTS' case)

  - given: >
      VERSION 6. ducts already tagged with M_Duct Size Tag, then the same call
      with tagTypeId a different duct tag type ("tag the ducts again using this
      tag family")
    expect: >
      every duct gains ONE tag of the new type, alreadyTagged 0, skipped empty.
      Version 5 counts any tag as already tagged and tags none, so this FAILS
      on it

  - given: VERSION 6. the same exact-type call run a SECOND time
    expect: >
      tagged 0, alreadyTagged equal to the count and every id in `skipped` - a
      tag of that type is already there, so nothing is stacked

  - given: >
      VERSION 6 REVIEW FIX. "tag these ducts in this view" - the view and the
      selected ducts, and NOTHING else typed: no tagTypeHintId, leader,
      minLengthMm or leaderOffsetMm
    expect: >
      it runs, and the binding note says each of the four came "not given -
      ... the card's own default (optional)": none, none, 0, 0. The result is
      the same as typing tagTypeHintId=none leader=none minLengthMm=0
      leaderOffsetMm=0 - each duct tagged with the project's default duct
      tag, no leader, nothing too short. FAILS on the version 6 first draft:
      the binder refused the call before it ran, four needs never supplied

  - given: VERSION 6 REVIEW FIX. the same call with each of the four given EMPTY ("leader=")
    expect: the same as left out - an empty value on an optional need is a value left out (row 5b-1320)

negative:
  - given: VERSION 6 REVIEW FIX. minLengthMm "500mm" typed with the unit
    expect: >
      refused by the binder before anything runs, "Type digits only" - being
      optional changes what leaving it OUT means, never what a value typed
      wrong means

  - given: >
      any successful run - check typeCorrections whatever the result
    expect: >
      IT MAY BE NON-ZERO, AND THAT IS THE FINDING, not a fault. `Create` is
      given a type id and does not reliably use it: 38 tags created with an
      explicit id all came out as the document's default where this was
      re-authored from. A non-zero count means the API ignored the type and this
      fragment put it back. A version that fixed it silently would hide that

  - given: an element of a category with NO tag family loaded in the project
    expect: >
      its id in notTagged and nothing created for it. Nothing this fragment can
      do, and saying which elements is the useful answer

  - given: an element whose category has no tag category at all, e.g. a room separation line
    expect: its id in notTagged, no exception, the taggable elements still tagged

  - given: rooms handed in with the doors
    expect: >
      versions 4 to 6: the rooms in notTagged, sent to TAG_ROOMS. VERSION 7:
      each room gets a ROOM tag - the project's default room tag, read back -
      and the doors their door tag, in one call; `newTags` holds both kinds.
      Select a room tag and check its Properties: Room Tags, not a door or
      multi-category tag. A room tag is not an independent tag

  - given: an empty element list
    expect: all counts zero, notTagged empty, reported as nothing to do

  - given: VERSION 6 AND 7. rooms and doors with tagTypeId a door tag type
    expect: >
      the rooms in notTagged - version 7's notTaggedWhy saying the door tag is
      not a Room Tags type - and the doors tagged. An exact type never makes an
      independent tag on a room - the safer rule kept over TAG_ELEMENTS, which
      tagged rooms as independent tags

  - given: VERSION 6. tagTypeId naming a door TYPE, not a tag type
    expect: >
      every element in notTagged with "the tag type given is not a tag family
      type", nothing created

  - given: VERSION 6. a riser among the ducts, with tagTypeId a duct tag type
    expect: the riser in verticalSkipped, untagged, as without an exact type

  - given: >
      tagTypeHintId a PIPE tag type handed in for ducts, no tagTypeId
    expect: >
      the ducts tagged with the project's default duct tag, and `tagTypesUsed`
      saying "the project's default - the hint given is not a tag for this
      category" (version 6 says why). The hint is set aside, never placed:
      a pipe tag on a duct prints blank

  - given: the same ducts with minLengthMm longer than any of them
    expect: >
      tagged 0 and every duct in tooShort, nothing created - the value alone
      empties the result, so the selection is the positive's

  - given: the same elements in a DIFFERENT view
    expect: >
      they tag again, and that is correct. Tags are view-specific; an element
      tagged in the ceiling plan is untagged in the section and this is not a
      double-tag

  # VERSION 7 (2026-11-01, TAG_ROOMS merged in). Each FAILS on version 6,
  # which refuses every room, space and zone. TAG_ROOMS' arrangement: "c
  # bulding test" (Revit 2024), Level 1 with 37 enclosed rooms and 37 spaces
  # in 3 HVAC zones, plans "Level 1 - HVAC Zones" and "Level 1 - Spaces".
  - given: >
      VERSION 7. The 37 Level 1 rooms, from FILTER_ELEMENTS_BY_CATEGORY
      category=Rooms with Level 1, in "Level 1 - HVAC Zones", tagTypeId
      "Room Tag With Area"
    expect: >
      tagged 37, newTags 37 room tags, each READ BACK carrying Room Tag With
      Area and pointing at its own room; mismatched empty. Revit's own Select
      All Instances on that tag type counts 37 more than before

  - given: VERSION 7. The same 37 rooms run a second time
    expect: tagged 0, all 37 in skipped - one tag per room per view, never a second

  - given: VERSION 7. The 37 Level 1 spaces with a Space Tags type, in "Level 1 - Spaces"
    expect: tagged 37, space tags, each pointing at its own space

  - given: VERSION 7. Level 1's 3 zones with a Zone Tags type, in "Level 1 - Spaces"
    expect: >
      tagged 3, zone tags pointing at their zones, each at its largest space's
      point; the Default zone, handed in, in unplaced

  - given: VERSION 7. The 37 spaces handed in with a ROOM tag type as tagTypeId
    expect: >
      NOTHING placed on them, all 37 in notTagged with notTaggedWhy saying the
      type is not a Space Tags type. A mismatch is refused, never placed

  - given: >
      VERSION 7. The rooms with tagTypeId left out, in a project whose Room
      Tags default is "Room Tag"
    expect: >
      every room tagged with "Room Tag" - the project's default - and
      tagTypesUsed saying "the project's default". Never the first loaded

  - given: VERSION 7. Level 2's rooms handed to the Level 1 plan
    expect: all in otherLevel, nothing placed

  - given: VERSION 7. A room in the schedule and in no plan, and a room with no area
    expect: the first in unplaced, the second in notEnclosed, nothing placed on either

  - given: VERSION 7. The rooms, in a 3D view
    expect: >
      nothing placed on them; each in notTagged saying the view is not a plan
      of one level

  - given: >
      VERSION 7. The rooms, in a plan whose view template turns Room Tags off
    expect: >
      the tags placed, and findings saying Room Tags are turned off in that
      view, so they are in the model and NOT SHOWN

  - given: VERSION 7. An AREA handed in, in an area plan
    expect: >
      in notTagged, notTaggedWhy saying an area takes an area tag, which
      nothing in Heron places yet - never an independent tag

second_route:
  - look at the view and read the tag families, not the count
  - run twice and confirm no element gains a second tag
  - one Ctrl+Z removes every tag in a single step (Golden Rule 16)

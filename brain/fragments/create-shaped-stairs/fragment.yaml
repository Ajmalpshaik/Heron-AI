id: FRG-ELE-152
semantic-identity: "make an L-shaped, U-shaped or spiral stair from one level to another, placed from a point, turning left or right at its landing"
kind: action
domain: revit.elements
capability: CREATE_SHAPED_STAIRS
# Version 2 (2026-11-02, FRAGMENT-ISSUES 5b-1456, Group MN): a STAIR BY
# SKETCH - Architecture > Stair > Create Sketch, its boundary and riser lines -
# was asked for as a ribbon gap. Version 1 made runs by component only
# (CreateStraightRun, CreateSpiralRun); nothing in the library called
# StairsRun.CreateSketchedRun. Widened here rather than a second stair card:
# the same job (a whole new stair between two levels in one edit scope), the
# same values for the levels and the type, the same riser rules, read-back,
# retry and sweep. shape "sketch" takes leftBoundary, rightBoundary and,
# optionally, riserLines; direction, turn and runWidth became optional (a
# sketch has none) and L, U and spiral refuse them left out in this card's
# words, where the add-in refused them before. Nothing else about L, U or
# spiral changed. The card was DRAFT on this branch only, and stays DRAFT.
version: 2
source: OFFICIAL
risk: MODIFY

# WHY IT EXISTS - a comment, not `purpose`, because `purpose` is searched.
# 2026-11-02: the modeller asked for an L-shaped stair turning left at the
# landing, a U-shaped stair with a 1200 landing at a point, and a spiral stair
# of 1500 radius. brain/heron_retrieve.py with those words reached
# CREATE_STAIRS first every time; nothing in the library makes an L or a spiral
# run, or a landing of a chosen depth.
#
# WHY CREATE_STAIRS WAS NOT WIDENED. It is PROVEN (Group HS, 2026-10-22, Heron
# Capture Test), and any change under its impl/ makes that proof stale. It makes
# a straight or U stair FITTED TO A STAIR HALL - a rectangle, an entry side, a
# start offset, side-stringer insets, an optional slab opening. This one is
# placed FROM A POINT, with a direction and a turn, and makes the shapes that
# card cannot: L, spiral, and a U with a landing of a set depth. The duplicate
# check (heron-duplicate-checker's method, 2026-11-02) read the pair as an
# OVERLAP on the U only:
#   a (both)              base and top level, stair type by name, risers from
#                         the type's rules, all-or-nothing read-back inside the
#                         edit scope, one riser more once, Revit's words, the
#                         railings Revit adds named, nothing left by a refusal
#   b (CREATE_STAIRS)     straight run, a U fitted to a hall's clear inside,
#                         side-stringer inset, cut the opening in the slab above
#   c (this card)         L, spiral, a U from a point, a landing of a chosen
#                         depth (sketched), the turn left or right, Revit's
#                         default stair type when none is named
# Combining them is the owner's choice once this is proved; until then a U in a
# stair hall stays CREATE_STAIRS's.
#
# ADD_STAIRS_LANDING (FRG-ELE-153) adds a landing between two runs of a stair
# ALREADY in the model; this one makes the whole stair with its landing.
#
# THE PATTERN IS CREATE_STAIRS's, line for line where it can be: the ambient
# `editScopeFailures` need (D-112), the elevation frames of 5b-445, the riser
# retry of 5b-1239, Revit's words of 5b-1240, the sweep of 5b-1241 and the
# railings read after the Commit (5b-455).

purpose: >
  Makes a Revit stair by component - an L-shaped stair with a landing at the
  turn, a U-shaped stair with a landing across its end, or a spiral stair -
  from a base level to a top level, placed from a point on plan: the middle of
  the first riser for an L or U, the centre for a spiral. The first run climbs
  north, south, east or west and turns left or right. The riser count comes
  from the stair type's Maximum Riser Height and its tread from the type's
  Minimum Tread Depth; the type is the one named, or Revit's default for new
  stairs, said in the answer. A landing depth in mm sets the landing; without
  one Revit makes its own. What Revit made is read back - risers, tread, runs,
  landings and the landing's depth - and a stair Revit refuses is refused with
  its reason and leaves nothing. Or a stair by sketch: one run from its two
  boundaries and its risers.

contract:
  needs:
    - name: doc
      type: Document
    - name: editScopeFailures
      type: IFailuresPreprocessor
      source: ambient
    - name: baseLevel
      # Never guessed: the level by its name in the model's level list.
      type: Level
      source: request
    - name: topLevel
      type: Level
      source: request
    - name: stairType
      # A stair type by its name. Left out, Revit's default type for new stairs
      # (ElementTypeGroup.StairsType), named in the answer; a name not loaded is
      # refused with the loaded names listed.
      type: string
      source: request
      optional: true
      absent: none
    - name: shape
      # l, u, spiral or sketch ("L-shaped", "U-shaped", "dogleg" are read the
      # same; "sketched" as sketch).
      type: string
      source: request
    - name: startPoint
      # Three numbers in mm. L or U: the middle of the first riser. Spiral: the
      # centre of the stair. Sketch: the point the sketch's points are measured
      # from - 0,0,0 for the model's own coordinates.
      type: XYZ
      source: request
    - name: direction
      # north, south, east or west. L or U: the way the first run climbs.
      # Spiral: the side of the centre the first riser is on. Not a sketch's -
      # left out, L, U and spiral refuse it by name.
      type: string
      source: request
      optional: true
      absent: none
    - name: turn
      # left or right, as you climb. On a spiral, left is anticlockwise seen
      # from above and right clockwise ("clockwise" is read too). Not a
      # sketch's - left out, L, U and spiral refuse it by name.
      type: string
      source: request
      optional: true
      absent: none
    - name: runWidth
      # mm; refused under the type's Minimum Run Width. Not a sketch's - its
      # width is its boundaries'; left out (0), L, U and spiral refuse it.
      type: double
      source: request
      optional: true
      absent: "0"
    - name: landingDepth
      # mm, L or U only: the landing's depth along the first run, made as a
      # sketched landing. Left out (0), Revit's automatic landing.
      type: double
      source: request
      optional: true
      absent: "0"
    - name: radius
      # mm, spiral only: to the centre line of the run. Never guessed - a
      # spiral without one is refused.
      type: double
      source: request
      optional: true
      absent: "0"
    - name: firstRunRisers
      # L or U only: risers in the first run. Left out (0), the larger half.
      type: int
      source: request
      optional: true
      absent: "0"
    - name: leftBoundary
      # Sketch only: the left edge as you climb, two or more points in mm from
      # startPoint, straight lines between them - "0,0,0; 0,3000,0".
      type: IList<XYZ>
      source: request
      optional: true
    - name: rightBoundary
      # Sketch only: the right edge as you climb, the same way.
      type: IList<XYZ>
      source: request
      optional: true
    - name: riserLines
      # Sketch only: the riser lines in order from the bottom, in mm from
      # startPoint, "x,y,z; x,y,z | x,y,z; x,y,z" - one line per riser, the
      # first and the last included. Left out, the risers the type's rules give
      # are spread evenly along the two boundaries.
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: created
      role: result
      type: ElementId
    - name: risers
      role: result
      type: int
    - name: riserHeightMm
      role: result
      type: double
    - name: treadDepthMm
      role: result
      type: double
    - name: runCount
      role: result
      type: int
    - name: landingCount
      role: result
      type: int
    - name: landingDepthMm
      # The deepest landing's depth along the first run, off its footprint.
      role: result
      type: double
    - name: railings
      # The railings Revit added with the stair, read after the edit scope's
      # Commit as CREATE_STAIRS does (5b-455). Empty when refused.
      role: result
      type: IList<ElementId>
    - name: findings
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release, no #if. Read off the reference
  assemblies for 2020 to 2027 with tools/api-surface on 2026-11-02, every one
  present with the same signature throughout: StairsEditScope(Document, string),
  Start(ElementId, ElementId), Commit(IFailuresPreprocessor), Cancel and
  IsPermitted (on StairsEditScope for 2020-2021, inherited from EditScope from
  2022); StairsRun.CreateStraightRun(Document, ElementId, Line,
  StairsRunJustification), CreateSpiralRun(Document, ElementId, XYZ, double,
  double, double, bool, StairsRunJustification), CreateSketchedRun(Document,
  ElementId, double, IList<Curve>, IList<Curve>, IList<Curve>) (version 2,
  read 2026-11-02, one signature 2020-2027), ActualRunWidth,
  ActualRisersNumber and TopElevation; StairsLanding.CanCreateAutomaticLanding,
  CreateAutomaticLanding, CreateSketchedLanding(Document, ElementId, CurveLoop,
  double) and GetFootprintBoundary; Stairs.DesiredRisersNumber,
  ActualRisersNumber, ActualRiserHeight, ActualTreadDepth, GetStairsRuns,
  GetStairsLandings and GetAssociatedRailings; StairsType.MaxRiserHeight,
  MinTreadDepth and MinRunWidth; Document.GetDefaultElementTypeId with
  ElementTypeGroup.StairsType. NOT RUN on any Revit.

# ROUTING
#
#   "make an L-shaped stair ... turning left at the landing"   -> here
#   "add a U-shaped stair with a 1200 landing here"            -> here
#   "place a spiral stair of 1500 radius ..."                  -> here
#   "create a stair by sketch from these boundary and riser
#    lines"                                                    -> here, version 2
#   "create a U-shaped stair in the stair hall"                -> CREATE_STAIRS
#   "make the stair" / "add a stair from level 1 to level 2"   -> CREATE_STAIRS
#   "add a landing between these two runs"                     -> ADD_STAIRS_LANDING
#   "put railings on these stairs"                             -> CREATE_RAILING
#   "make the leaders L-shaped"                                -> FORCE_TAG_LEADER_LSHAPE -
#                                                                 tag leaders, not a stair;
#                                                                 declared there (row 5b-1457)
utterances:
  - make an L-shaped stair from Level 1 to Level 2 turning left at the landing
  - add a U-shaped stair with a 1200 landing here
  - place a spiral stair of 1500 radius from Level 0 to Level 1
  - create a stair by sketch from these boundary and riser lines

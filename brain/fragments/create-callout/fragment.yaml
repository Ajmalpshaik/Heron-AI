id: FRG-VIEW-027
semantic-identity: "draw a callout around this part of a view, enlarged"
kind: action
domain: revit.views
capability: CREATE_CALLOUT
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Draws a callout over a rectangle of a parent view and makes the enlarged view
  it points at.

  **A callout is two things at once and that is what makes it useful.** It puts
  a marked boundary on the parent drawing AND creates a linked view at a bigger
  scale. Move the callout on the plan and the detail follows; the reference on
  the plan updates itself when the detail lands on a sheet. Drawing the two
  separately gets a detail that says nothing about where it came from.

  **The scale is separate from the boundary.** A callout drawn at the parent's
  scale shows nothing new - the whole point is to enlarge, and Revit does not
  choose that for you.

contract:
  needs:
    - name: doc
      type: Document
    - name: parentView
      type: View
      source: request
    - name: corner
      type: XYZ
      source: request
    - name: opposite
      type: XYZ
      source: request
    - name: viewScale
      type: int
      source: request
    - name: viewName
      type: string
      source: request
  provides:
    - name: created
      role: result
      type: ElementId
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string


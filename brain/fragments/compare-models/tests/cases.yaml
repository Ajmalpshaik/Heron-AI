positive:
  - given: this model and a save-as copy of it with three ducts deleted and one Mark edited
    expect: >
      3 removed, 0 added, 1 changed - and the changed row naming the Mark with
      its old value and its new one. That is the whole contract of a change report

  - given: the same pair on Revit 2021 or later
    expect: >
      most matched elements skipped on Revit's own per-element stamp, with the
      count of skips stated. The answer must be identical to the full walk - the
      stamp is a speed-up, never a different result

  - given: a workshared central file as the other model
    expect: >
      it opens detached with worksets closed, and THE CENTRAL IS NOT TOUCHED -
      no local created, no borrow taken, no save-to-central prompt afterwards

  - given: somebody else's local file as the other model
    expect: >
      it opens. Without allowing the wrong user, Revit refuses outright and the
      commonest real path fails

  # Row 5b-203, added 2026-11-11 with version 2. NOT RUN - Group NK, NK8.
  - given: >
      the same pair of saves, parameterNames "Mark" - a name each wall
      carries once - with one wall's Mark edited between them
    expect: >
      changed 1, that wall named with its old and new Mark, and `ambiguous`
      0 - the count must not turn down a name that occurs once

negative:
  - given: the same file compared with itself
    expect: >
      "THESE TWO FILES ARE THE SAME MODEL AT THE SAME SAVE", and 0/0/0. THIS IS
      THE CASE THAT PROVES THE COMPARISON. Any difference reported here is a
      fault in this fragment, and the warning is what makes that readable rather
      than reassuring

  - given: a model saved in an older Revit release
    expect: >
      "it is a VERSION MISMATCH, not damage", naming both releases. Revit's own
      word for this is "corrupt", which sends people looking for damage that is
      not there

  - given: an empty parameterNames list
    expect: >
      added and removed still counted, changed reported as 0 WITH the note that
      no parameter was compared. A zero that means "nothing changed" and a zero
      that means "nothing was checked" must not print the same

  - given: an empty categories list
    expect: >
      "nothing was compared" and no diff at all. A clean diff over an empty set
      reads exactly like good news, which is the failure

  - given: a path that does not exist
    expect: >
      "there is no file at ...", and explicitly NOT a model with no changes

  - given: any run at all
    expect: >
      the other document CLOSED afterwards, and no transaction opened on either.
      A document left open holds a file lock the modeller cannot explain

  # Row 5b-203, added 2026-11-11 with version 2. NOT RUN - NEEDS-CHECKING
  # Group NK, NK8; it needs a model that carries a duplicated name.
  - given: >
      this model and an earlier save of it, Walls, parameterNames "Comments",
      with "Comments" bound to Walls a second time as a project parameter in
      both saves, and one wall's built-in Comments edited between them
    expect: >
      changed 0 on that name and `ambiguous` above 0 - one for each wall whose
      parameters were read: every matched wall on Revit 2020, and from 2021
      only those Revit's own per-element stamp says changed - with a finding
      naming 'Comments' as NOT READ. Never a wall reported as changed, or the
      edit silently passed as unchanged, on whichever of the two parameters
      Revit returned first (row 5b-203)

second_route:
  - >
    Revit's own Collaborate - Compare Models, where the release has it, over the
    same pair. It answers the same question through a different mechanism and
    should agree on the added and removed counts

  - >
    Delete a known element, save-as, and compare: the count must be exactly one
    and it must name that element. A deliberate single change is the cheapest
    possible check that the matching is on identity rather than on a key

compatibility-note: >
  One implementation for every release. `OpenOptions`,
  `DetachFromCentralOption`, `WorksetConfiguration`,
  `WorksetConfigurationOption`, `ModelPathUtils.ConvertUserVisiblePathToModelPath`,
  `Application.OpenDocumentFile`, `Document.Close`,
  `Document.GetDocumentVersion`, `DocumentVersion.VersionGUID`,
  `DocumentVersion.NumberOfSaves`, `BasicFileInfo.Extract` and
  `ElementMulticategoryFilter` are present and unchanged 2020 through 2027.

  **`Element.VersionGuid` is reached by REFLECTION and never named**, because it
  does not exist on Revit 2020 and naming it is a compile error there rather
  than something a try/catch could hold. The lookup is done ONCE and reused, so
  the reflection costs one call for the whole run. Where the property is absent
  the fragment falls through to the full parameter walk and says which path it
  took.

  **`Document.GetChangedElements` was deliberately NOT used**, though it is the
  fastest answer on Revit 2023 and later. It needs an episode GUID recorded at a
  previous point in time, and Heron has nowhere to have recorded one - a
  capability that only works when something else already ran is not a capability
  a fragment can offer.

  Elements are matched by comparing `ElementId` to `ElementId`, never by reading
  one as a number, so the 2024 widening to 64-bit does not reach this fragment.

  No units API is called. Parameter values are compared through `AsValueString`,
  which is Revit's own formatting in each model's units - so a value that only
  LOOKS different because the two files display different units reports as
  different, which is honest and is stated.

# ROUTING - the same rows are in the fragments named here.
#
#   "what changed since the last issue"  -> here. Two MODELS
#   "what did the architect change in this revision" -> here
#   "what changed between them"          -> COMPARE_ELEMENTS, and the reason is
#                                           worth keeping: A SENTENCE THAT NAMES
#                                           NO FILE CANNOT BE THE TWO-MODELS
#                                           QUESTION, because this fragment
#                                           cannot run without a path. Ranking
#                                           put this one first on 2026-09-06;
#                                           the identity route still serves
#                                           COMPARE_ELEMENTS, which declares it
#   "why is this duct different from that one" -> COMPARE_ELEMENTS - two ELEMENTS,
#                                           inside ONE model. Both sentences
#                                           start "what is different" and they
#                                           are not the same question
#   "who changed it"                     -> REPORT_ELEMENT_OWNERSHIP, once this
#                                           has said WHAT changed
#   "what links does this model have"    -> LIST_LINKED_MODELS
#   "what is in this file"               -> READ_MODEL_FILE_INFO - reads the
#                                           header WITHOUT opening it, which is
#                                           the cheap first look before this
#   "compare two unrelated models"       -> NOT ANSWERED HERE, on purpose. Ids
#                                           share no lineage between unrelated
#                                           files, and matching on a composite
#                                           key reports an edited Mark as an
#                                           element added and one removed

utterances:
  - what changed since the last issue of this model
  - compare this model to the previous version
  - what did the architect change in this revision
  - which elements were added or removed between these two files
  - diff this model against the one on disk
  - what is different from last week's model
  - show me the changes between these two revit files

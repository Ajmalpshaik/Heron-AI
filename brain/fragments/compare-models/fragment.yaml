id: FRG-QA-024
semantic-identity: "what changed between this model and the last issue of it"
kind: action
domain: revit.qa
version: 1
capability: COMPARE_MODELS
source: OFFICIAL
risk: READ

purpose: >
  Compares the open model against another `.rvt` on disk - what was added, what
  was removed, and which of the named parameters changed on the elements present
  in both. The *"what did they change in this revision"* question answered from
  the two models rather than from a transmittal note. It opens the other file
  read-only, detached, and closes it again; neither model is modified.

  **`COMPARE_ELEMENTS` COMPARES TWO ELEMENTS INSIDE ONE MODEL AND THIS COMPARES
  TWO MODELS.** They read as the same job and are not: one answers *"why does
  this duct behave differently from that one"*, this one answers *"what came
  back different in the architect's new issue"*. Nothing in this library could
  ask the second question.

  **THE VERSION LINE IS READ BEFORE THE DIFF, AND IT IS THE PART THAT SAYS
  WHETHER TO BELIEVE THE REST.** Two files with the same version GUID and save
  count are literally the same model at the same save. Any difference reported
  after that is a fault in the comparison, not a change in the model - so it is
  checked first and stated first, rather than left for somebody to wonder about
  at the bottom of a long list.

  **ELEMENTS ARE MATCHED ON `ElementId`, AND THE SECOND MATCHING MODE WAS
  DELIBERATELY NOT CARRIED OVER.** The earlier library offered a composite key -
  category, family, type and Mark, falling back to location - for models whose
  ids "share no lineage", and its own note recorded that the key mode is
  strictly worse for the case this exists for: a save-as preserves ids, so on a
  model and an earlier save of itself the id IS the identity, while the
  composite key invents an *added* and a *removed* every time somebody edits a
  Mark or nudges an element. **That is precisely the noise a change report must
  not produce**, and offering it as an option asks the reader to choose between
  a right answer and a wrong one. Two genuinely unrelated models are a different
  question and do not have this answer.

  **THE FILE IS OPENED DETACHED, WITH THE WORKSETS CLOSED, AND AS THE WRONG
  USER.** Every real project file is workshared. A bare open touches the central;
  loading every workset costs minutes this comparison does not need; and the path
  handed over is usually somebody else's local, which Revit refuses outright
  without being told to allow it. All three are set unconditionally because on a
  non-workshared file each is harmless.

  **REVIT CALLS A FILE FROM ANOTHER RELEASE "CORRUPT", AND THAT WORD SENDS
  PEOPLE LOOKING FOR DAMAGE THAT IS NOT THERE.** The header can be read without
  opening the file, so when the open fails this reports which release it was
  saved in against which release is running, and only says damaged when those
  match.

  **A CLEAN DIFF IS NOT A PROOF THAT NOTHING CHANGED, AND THE READ-BACK SAYS
  SO.** Only the categories handed in are looked at and only the parameters
  named. A wall that changed thickness without moving reads as unchanged unless
  thickness is in the list. The summary states what was actually covered, so the
  claim stays the size of the check.

contract:
  needs:
    - name: doc
      type: Document
    - name: otherModelPath
      type: string
      source: request
    # RESOLVED categories, never BuiltInCategory names in a string - the same
    # rule ADD_PROJECT_PARAMETER follows. Turning a BIM word into a category is
    # its own job and belongs upstream.
    - name: categories
      type: IList<Category>
      source: request
    - name: parameterNames
      type: IList<string>
      source: request
    - name: maxRows
      type: int
      source: request
  provides:
    - name: findings
      type: IList<string>
    - name: added
      type: int
    - name: removed
      type: int
    - name: changed
      type: int
    - name: sameSaveVersion
      type: bool


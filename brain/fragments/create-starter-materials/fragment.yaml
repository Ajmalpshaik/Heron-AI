version: 2
source: OFFICIAL
risk: MODIFY

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# THE OWNER'S WORDS, 2026-10-20: "for material adding also we need to make it".
# One call adds a set of materials that read right in every view: a shading
# colour for Shaded, and an appearance asset of each material's own for
# Realistic and a rendering. CREATE_MATERIAL - PROVEN, and left as it is -
# makes a material with a shading colour alone, which draws flat dark grey in
# Realistic (row 5b-1263).
#
# THE TWELVE, named namePrefix + words, "TRG_" by the owner's naming rule with
# the words spelled out: Glass Clear, Steel Stainless Satin, Steel Galvanised,
# Aluminium Brushed, Concrete Smooth, Plaster Paint White, Floor Tile Grey,
# Wood Oak, Carpet Grey, Ceiling Tile White, Duct Galvanised, Pipe Copper.
# starterPick takes some by their words - "glass; copper" - or all.
#
# THE COLOURS, GLOSS AND REFLECTION ARE HERON'S STARTER VALUES, picked to read
# as the material at a glance - not a standard, not a product (D-33: nothing
# here is offered as a design value). SET_MATERIAL_PROPERTIES and
# SET_MATERIAL_APPEARANCE change any of them afterwards.
#
# NO LIBRARY NAME IS ASSUMED. Each appearance is a plain Generic asset of the
# material's own, set from those values, unless libraryLooks names one -
# "Wood Oak=<a name LIST_MATERIALS lists with withLibraryAppearances>". What
# Revit's appearance library holds depends on the PC's install; a name it
# has not got refuses the call before anything is made. VERSION 2 (row
# 5b-1272): a library look is matched on SET_MATERIAL_APPEARANCE's rule - a
# Prism asset's description, most often the browser's name but not always,
# and Revit's code ("Prism-256"), which always matches.
# Version 1 read the UIName as the browser's name; on Revit 2020 it is the code.
#
# A NAME ALREADY IN USE IS LEFT AS IT IS AND REPORTED - never duplicated and
# never changed.
#
# READ BACK: name, shading colour, class and an appearance of its own on every
# material made, and a Generic appearance's colour; one that does not read as
# made fails the call and nothing is kept.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Adds the office starter set of twelve materials - each made with its own
  appearance asset and a matching shading colour, so it looks right drawn
  and rendered - named with the office prefix; a name already taken is left
  as it is.

contract:
  needs:
    - name: doc
      type: Document
    # The office prefix in front of each name. Left out, the owner's "TRG_".
    - name: namePrefix
      type: string
      source: request
      optional: true
      absent: TRG_
    # Which of the twelve, by their words with ';' between - "glass; copper".
    - name: starterPick
      type: string
      source: request
      optional: true
      absent: all
    # "Starter words=Appearance name" pairs, for a library look instead of
    # Heron's own Generic one.
    - name: libraryLooks
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: createdMaterialIds
      role: result
      type: IList<ElementId>
    - name: starterReport
      # ONE STRING, a line per starter material: made, with its class, colour
      # and appearance - or already there and left.
      role: result
      type: string
    - name: alreadyThere
      # Names already in use, left as they are. The evidence it looked (D-52).
      role: accounting
      type: IList<string>
    - name: refused
      role: accounting
      type: string
    - name: findings
      type: IList<string>


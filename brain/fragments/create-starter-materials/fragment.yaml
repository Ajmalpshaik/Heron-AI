# VERSION 4, 2026-11-01 - CREATE_MATERIAL MERGED IN; see the block below.
#
# VERSION 3, 2026-10-20 - row 5b-1280. The owner saw Prism-152 in the Asset
# Browser as "Glass (Clear)"; version 2 listed and matched it as "Glass -
# clear" and refused the browser's spelling. With no exact match, a library
# name is now matched with capitals, spaces and punctuation ignored, and the

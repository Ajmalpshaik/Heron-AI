compatibility-note: >
  One implementation for every release. Material.Create, Color, Transparency,
  MaterialClass, UseRenderAppearanceForShading and AppearanceAssetId;
  AppearanceAssetElement Create and Duplicate; Application.GetAssets with
  AssetType.Appearance; AppearanceAssetEditScope; and the Generic property
  names GenericDiffuse, GenericGlossiness, GenericIsMetal,
  GenericReflectivityAt0deg, GenericReflectivityAt90deg, GenericTransparency
  and GenericRefractionIndex are present 2020 through 2027 - read off the
  shipped assemblies with tools/api-surface --members on 2026-10-20.

# ROUTING - the same rows are in SET_MATERIAL_APPEARANCE.
#
#   "add a starter set of materials"            -> here
#   "set up good looking materials for a render" -> here
#   "make a new material"                       -> here, materialNames - one, by name and
#                                                  colour, since version 4 (CREATE_MATERIAL
#                                                  until it was merged here, 2026-11-01)
#   "add a material for the ductwork"           -> here, materialNames
#   "change the material on these"              -> REPLACE_MATERIAL - the swap, and it
#                                                  needs both materials to exist first
#   "what material is this"                     -> REPORT_MATERIAL_TAKEOFF - a question,
#                                                  and it must not reach this write
#   "give these materials a render appearance"  -> SET_MATERIAL_APPEARANCE
#   "make these columns concrete"               -> SET_ELEMENT_MATERIAL
utterances:
  - add a starter set of materials
  - set up a library of good looking materials for rendering
  - add the standard TRG materials to this project
  # MOVED 2026-11-01 from CREATE_MATERIAL, merged into this card. Its note on
  # the last one, kept: declared 2026-10-09 (row 5b-375) - the sentence a
  # modeller typed, which had reached SELECT_BY_MATERIAL. Every other was
  # measured and refused there: any more "material" on that card lifted it
  # over READ_ELEMENT_MATERIAL (now REPORT_MATERIAL_TAKEOFF) for "what
  # material is that" and "what material are these", and both questions went
  # to the write. A new sentence here is measured against those two first.
  - make a new material
  - create a material
  - add a material for the ductwork
  - i need a material in this colour
  - set up the materials for this model
  - create a new material called galvanised steel
  # ...and its semantic identity, which nothing else declares:
  - make a new material with this colour

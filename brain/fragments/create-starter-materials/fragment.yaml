# 4 is proved.)
source: OFFICIAL
risk: MODIFY

# VERSION 4 (2026-11-01) - CREATE_MATERIAL WAS MERGED INTO THIS CARD on the
# owner's instruction ("ok go ahead merge all", after "make sure there is no
# duplicate tools" and "in every conflict keep the safer rule"), and is
# DEPRECATED. ON 2026-10-20 THE OWNER HAD CHOSEN TO LEAVE CREATE_MATERIAL AS
# IT WAS ("CREATE_MATERIAL - PROVEN, and left as it is", below); his
# 2026-11-01 "merge all" supersedes that choice. The same job - materials
# made in this document by name, a name already in use left as it is and
# reported. What that card had and this one lacked, all of it here:
# `materialNames`, any names, each made with exactly that name (the office
# prefix is NOT put on them); `colours`, a shading colour each in name order,
# "R,G,B; R,G,B"; `transparencies`, a percentage each in name order, CLAMPED
# to 0..100 and the clamp reported; a material with a shading colour only and
# no appearance asset, said so in the answer. In a family document too.
#
# THE OPPOSITE RULE, AND THE SAFER ONE KEPT (Constitution Article 8, all or
# nothing): CREATE_MATERIAL kept the rest when Revit refused one name, and
# skipped a blank name and made the others. Here a name Revit refuses fails
# the call and nothing is kept, and a blank name, a name holding a character
# Revit refuses, a colour that is not one or a transparency that is not a
# whole number refuses the call before anything is made. NEW FOR THE MERGE:
# each material made by name is read back - its name, shading colour and
# transparency - as the starter set always was.
#
# `starterPick` LEFT OUT IS NOW "auto": all twelve when no names are given -
# version 3's "all", unchanged - and none of them when names are, so "make a
# material called galvanised steel" makes one material, not thirteen. "none"
# makes none of the twelve; "all" makes all twelve beside the names.
#
# WHERE ITS OUTPUTS ARE NOW: `created` -> `createdMaterialIds`;
# `alreadyThere` -> `alreadyThere`; `findings` -> `findings` and the line per
# material in `starterReport`. Its sentences moved here.
#
# Version 3's proof below no longer described the code (impl/ changed) and
# was kept as the record; DRAFT at the time, until version 4 is proved on a
# real model (D-30).

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# THE OWNER'S WORDS, 2026-10-20: "for material adding also we need to make it".
# One call adds a set of materials that read right in every view: a shading
# colour for Shaded, and an appearance asset of each material's own for
# Realistic and a rendering. CREATE_MATERIAL - PROVEN, and on 2026-10-20 left
# as it is; merged here 2026-11-01, above - made a material with a shading
# colour alone, which draws flat dark grey in Realistic (row 5b-1263).
#
# THE TWELVE, named namePrefix + words, "TRG_" by the owner's naming rule with
# the words spelled out: Glass Clear, Steel Stainless Satin, Steel Galvanised,
# Aluminium Brushed, Concrete Smooth, Plaster Paint White, Floor Tile Grey,
# Wood Oak, Carpet Grey, Ceiling Tile White, Duct Galvanised, Pipe Copper.
# starterPick takes some by their words - "glass; copper" - or all.
#
# THE COLOURS, GLOSS AND REFLECTION ARE HERON'S STARTER VALUES, picked to read
# as the material at a glance - not a standard, not a product (D-33: nothing
# here is offered as a design value). SET_MATERIAL_PROPERTIES and
# SET_MATERIAL_APPEARANCE change any of them afterwards.
#
# NO LIBRARY NAME IS ASSUMED. Each appearance is a plain Generic asset of the
# material's own, set from those values, unless libraryLooks names one -
# "Wood Oak=<a name LIST_MATERIALS lists with withLibraryAppearances>". What
# Revit's appearance library holds depends on the PC's install; a name it
# has not got refuses the call before anything is made. VERSION 2 (row
# 5b-1272): a library look is matched on SET_MATERIAL_APPEARANCE's rule - a
# Prism asset's description, most often the browser's name but not always,
# and Revit's code ("Prism-256"), which always matches.
# Version 1 read the UIName as the browser's name; on Revit 2020 it is the code.
#
# A NAME ALREADY IN USE IS LEFT AS IT IS AND REPORTED - never duplicated and
# never changed.
#
# READ BACK: name, shading colour, class and an appearance of its own on every
# material made, and a Generic appearance's colour; one that does not read as
# made fails the call and nothing is kept.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Adds the office starter set of twelve materials - each made with its own
  appearance asset and a matching shading colour, so it looks right drawn
  and rendered - named with the office prefix; a name already taken is left
  as it is.

  Version 4 makes any materials by name beside them, each with a shading
  colour and a transparency.

contract:
  needs:
    - name: doc
      type: Document
    # The office prefix in front of each name. Left out, the owner's "TRG_".
    - name: namePrefix
      type: string
      source: request
      optional: true
      absent: TRG_
    # Which of the twelve, by their words with ';' between - "glass; copper",
    # "all" or "none". Left out ("auto", version 4): all twelve when no
    # materialNames are given, none of them when names are.
    - name: starterPick
      type: string
      source: request
      optional: true
      absent: auto
    # "Starter words=Appearance name" pairs, for a library look instead of
    # Heron's own Generic one.
    - name: libraryLooks
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 4, from CREATE_MATERIAL. Any materials by name, comma
    # separated, each made with exactly that name - the prefix is not put on.
    - name: materialNames
      type: IList<string>
      source: request
      optional: true
      absent: none
    # VERSION 4, from CREATE_MATERIAL. A shading colour per name, in name
    # order: "R,G,B; R,G,B", each 0 to 255. One not given leaves Revit's.
    - name: colours
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 4, from CREATE_MATERIAL. A transparency per name, in name order,
    # whole percentages: "0, 80". Clamped to 0..100 and the clamp reported.
    - name: transparencies
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: createdMaterialIds
      role: result
      type: IList<ElementId>
    - name: starterReport
      # ONE STRING, a line per starter material: made, with its class, colour
      # and appearance - or already there and left.
      role: result
      type: string
    - name: alreadyThere
      # Names already in use, left as they are. The evidence it looked (D-52).
      role: accounting
      type: IList<string>
    - name: refused
      role: accounting
      type: string
    - name: findings
      type: IList<string>


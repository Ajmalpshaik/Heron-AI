# VERSION 2 (2026-11-20) - THE LINK'S SETTINGS, and back to DRAFT.
# FRAGMENT-ISSUES row 5b-474, the owner's yes of 2026-11-20
# (Ajmalpshaik/Heron-AI#921): "is the link room bounding" and "are the links
# relative or absolute" had no read and reached SET_LINK_ROOM_BOUNDING and
# LOAD_KEYNOTE_FILE, both writes. Each file now says its path type, Room
# Bounding, Overlay or Attachment, nested or not, unloaded for this user only
# or not, and its saved path; each placement whether it is pinned, its
# workset, and its name as Revit shows it (which ends with its shared
# position). `summary` is new - every line whole. The owner asked for the
# other settings a modeller asks about too; these are the ones every release
# 2020 to 2027 can read without opening the link (tools/api-surface,
# 2026-11-20). Version 1 was PROVEN (the proof block below, kept as its
# record); the C# moved, so it is DRAFT until NEEDS-CHECKING Group OQ is run.
purpose: >
  Reports the Revit models linked into this project - one row per linked FILE,
  how many times each is placed, and whether it is loaded right now.

  **And how each link is set, as Manage Links and the link's Properties show
  it (version 2):** its path type - relative or absolute, or Revit Server -
  and the path it was saved with; whether its type is Room Bounding; whether
  it is an Overlay or an Attachment; whether it is nested inside another
  link; whether it is unloaded for this user only. For each placement:
  whether it is pinned, which workset it is on, and its shared position as
  Revit names it. A setting that cannot be read is said, never guessed. It
  only reads - changing any of these is a write of its own.

  **Loaded is established by asking for the document, not by reading a status.**
  A link's stored status says what Revit last recorded; `GetLinkDocument()`
  returning null says the geometry is not there to read. Those two disagree
  after an unload, and the second one is the one that decides whether a clash
  check finds anything. This is the same discipline that produced
  TRACE_CONNECTIVITY: the flag describes intent, the geometry describes reality.

  **One file, several placements.** A link placed twice - a repeated wing, a
  mirrored block - is two instances of one file, and a list that counts
  instances says a project has nine linked models when it has four. The row is
  the file; the placement count sits on it.

contract:
  needs:
    - name: doc
      type: Document
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: findings
      type: IList<string>
    - name: notLoaded
      # Whether each link is loaded RIGHT NOW is one of the three things this
      # fragment reports, established by asking for the document rather than
      # by reading a status. The answer, however much the name looks like a
      # reject.
      role: result
      type: IList<ElementId>
    - name: summary
      # VERSION 2. Every file and every placement, each setting on its own
      # line, as ONE string: a reply prints a list as its first three names
      # (row 5b-195), so `findings` could not carry six links' settings. A
      # RESULT, and EMPTY when the model has no link - the negative case.
      role: result
      type: string

proof:
  date: '2026-09-13'
  by: Ajmal PS
  model: >
    Snowdon Towers Sample HVAC.rvt (9,628 elements) and Project1 (3,410 elements, unsaved default template), both open at once in Revit 2024.3
  positive_case: >
    Snowdon Towers: 6 links, ALL loaded, notLoaded 0, each named with its placement - 'Snowdon Towers Sample Architectural.rvt : Architecture : location <Not Shared>'.
  negative_case: >
    Project1: 0 links, 0 loaded, 0 notLoaded. Empty because there are none - and with both documents open it did not report Snowdon's six.
  second_route: >
    REPORT_EXTERNAL_REFERENCES counted 8 references on Snowdon and 2 on Project1 in the same run; the difference is exactly these 6 links.
  fingerprint: "e2c3a50aaaf63f52"

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  `RevitLinkInstance`, `GetLinkDocument()` and `GetTypeId()` are unchanged 2020
  to 2027. `GetLinkedFileStatus()` is deliberately NOT used - not for a version
  reason but for a truthfulness one, set out in the implementation.

  No ElementId is built from an int, so 2024's 64-bit ids do not reach this
  code.

# THIS IS READ-ONLY BY DESIGN, and the agent that owns it says so: the Revit
# Link Agent "never modifies a link's source". Loading, unloading and reloading
# a link are not here, and adding them to this fragment would put a change to
# another project's file behind a question about this one.

# ROUTING - repeated in FIND_CLASHES.
#
#   "list the linked models"     -> here
#   "is the link loaded"         -> here
#   "which links do we have"     -> here
#   "reload the links"           -> nothing here does that, and it is
#                                   deliberate: this agent never modifies a
#                                   link's source
#   "does anything clash"        -> FIND_CLASHES - and note it can only see
#                                   what is LOADED, which is what makes this
#                                   fragment worth running first
#   "reload the links"               -> RELOAD_LINKS - a write, and this one
#                                       only reads
#   "unload this link"               -> RELOAD_LINKS
#   "copy these out of the link"     -> COPY_ELEMENTS_BETWEEN_DOCUMENTS, fromLink=true


# ROUTING (2026-11-20, version 2 - row 5b-474). Questions about how a link is
# SET come here; changing a setting is a write:
#
#   "is the link room bounding"          -> here
#   "are the links relative or absolute" -> here
#   "is the link pinned"                 -> here
#   "make the link room bounding"        -> SET_LINK_ROOM_BOUNDING
#   "make the links relative"            -> SET_LINK_ROOM_BOUNDING (it took
#                                           SET_LINK_PATH_TYPE in)
#   "select the pinned elements"         -> SELECT_BY_PIN_STATE

# ROUTING (2026-10-12, the gap fill)
#
#   "link the architect's model"            -> LINK_FILES
#   "is the structural link in the right place" -> CHECK_LINK_COORDINATES
utterances:
  - list the linked models
  - which links do we have
  - is the link loaded
  - what models are linked in
  - show me the links
  - are all the links loaded
  - which link is this from

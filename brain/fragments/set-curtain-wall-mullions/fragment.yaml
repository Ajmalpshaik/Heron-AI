id: FRG-ELE-073
semantic-identity: "put these mullion types on a curtain wall type's grid lines and borders"
kind: action
domain: revit.elements
capability: SET_CURTAIN_WALL_MULLIONS
# VERSION 2 (2026-10-29, on the owner's yes in the chat that day - "build the
# three widenings too" - to docs/work-notes/plans/facade-capability.md's
# "Waiting for the owner's word"): a CURTAIN SYSTEM TYPE too, the type Curtain
# System by Face uses (CREATE_CURTAIN_SYSTEM), by its Grid 1 and Grid 2
# Mullions. `curtainWallType` is now the type's NAME, matched in the fragment
# among wall types and curtain system types by the add-in's own rule, because
# the add-in has no binder for a curtain system type; `systemsOfType` is new. A
# wall type is version 1 to the word, except that a bare name a curtain system
# type also carries is now refused naming both (D-54 s3), and a name no type
# has is refused by the fragment, listing the curtain wall and curtain system
# types, where the add-in used to refuse it before the run. Version 1's proof
# below no longer describes the code and is kept as a record; the card is DRAFT
# until NEEDS-CHECKING Group JP proves version 2 - both paths - and the owner
# signs.
#
# THE CURTAIN SYSTEM TYPE, IN FULL - comments, not `purpose`, because
# `purpose` is searched: written there at first, this text sent "select all
# walls of type Curtain Wall" and two more of row 5b-329's guards
# (tests/test_routing_phrases.py) to this write, measured 2026-10-29 on the
# trained backend. Named "Curtain System: " and its type name, or the bare name
# when no wall type or curtain system type shares it. Its mullions are Grid 1
# Mullions and Grid 2 Mullions, not vertical and horizontal - which way each
# grid runs is set by the face it lies on, not by the type - so its six
# positions are grid 1 interior, grid 1 border 1, grid 1 border 2 and the same
# three for grid 2, and a vertical or horizontal position on one is refused.
# The curtain systems of the type are counted first (`systemsOfType`), as walls
# are. Reached by AUTO_MULLION_INTERIOR_GRID1, _BORDER1_GRID1, _BORDER2_GRID1 and
# the three _GRID2 - an ASSUMPTION the proof settles, since Revit's reference
# does not say which element carries them: a type without them is refused
# naming the mullion ids it has, and a position that does not read back as
# asked stops the call and nothing is kept.
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Sets the mullion types of a curtain wall TYPE - its Interior, Border 1 and
  Border 2 types for the Vertical Mullions, the Horizontal Mullions, or both,
  which is what Type Properties shows under those two headings. Only the
  positions the modeller names change; a position left out keeps what it has.

  **IT CHANGES THE TYPE, SO EACH WALL BUILT FROM IT CHANGES TOO.** The walls
  using it are counted before anything is written, and the count is the first
  line of the answer. To change one wall alone, DUPLICATE_TYPE first, put that
  wall on the copy with CHANGE_ELEMENT_TYPE, and set the copy.

  **THE TYPE IS NAMED IN THE REQUEST** - "Curtain Wall: Storefront", or the bare
  type name when no other wall type shares it (D-54) - for the same reason as
  SET_CURTAIN_WALL_GRID: it is a type change, and the request should say so. A
  wall type that is not a curtain wall is refused by name and nothing changes.

  **WHY NOT WRITE_ELEMENT_PARAMETERS.** "Interior Type", "Border 1 Type" and
  "Border 2 Type" each appear twice on a curtain wall type, once per direction,
  so that fragment refuses the name (D-54 s3, FRAGMENT-ISSUES 5b-203) - and
  each holds a mullion TYPE, an element reference, which it refuses as well.
  This reaches each position by Revit's own parameter id -
  AUTO_MULLION_INTERIOR_VERT, _BORDER1_VERT, _BORDER2_VERT and the three _HORIZ.

  **THE REQUEST IS A SHORT TABLE** - "vertical interior=Rectangular Mullion:
  50 x 150mm; horizontal border 2=none". Six positions can be named: vertical
  interior, vertical border 1, vertical border 2, and the same three
  horizontal. Border 1 and Border 2 are the two edges of that direction.

  **A MULLION TYPE IS NAMED, AND THE NAME HAS TO MEAN ONE.** The family and the
  type as Revit writes them - "Rectangular Mullion: 50 x 150mm", with or
  without a space before the colon - or the bare type name when no other
  mullion type in the model shares it. Compared exactly, capitals included. A
  name that matches none is refused WITH THE MULLION TYPES THE MODEL HAS; a
  name that matches two is refused naming both, never chosen from (D-54 s3).
  Any refusal refuses the whole request, so nothing is half-done.

  **"none" TAKES THE MULLIONS OFF A POSITION**, and it is the only word that
  does. A blank is refused rather than read as none.

  **NOTHING IS LOADED.** A mullion family that is not in the model is refused
  with the ones that are. Loading one is the modeller's call - a family brings
  its own materials and can overwrite the project's.

  **IT REPORTS WHAT REVIT HOLDS, NOT WHAT WAS ASKED.** After the write the
  walls are rebuilt and all six positions are read back, beside what each held
  before. Where a wall of the type is placed, one wall is measured before and
  after: its mullions counted by type and by the way each one runs, and how
  many grid lines it has each way - an interior type on a direction with no
  grid lines shows nowhere, and the answer says so rather than leaving the
  modeller to wonder why nothing appeared.

  **A CURTAIN SYSTEM'S TOO (version 2)** - its Grid 1 and Grid 2 Mullions: grid
  1 interior, grid 1 border 1, grid 1 border 2, and the same for grid 2. The
  comments above `version` say how they are reached and what is assumed.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16). Every
  refusal is made before the first write. If Revit refuses a write, or cannot
  rebuild the walls with it, the call stops and nothing it did is kept.

contract:
  needs:
    - name: doc
      type: Document
    # A curtain wall TYPE BY NAME - "Curtain Wall: Storefront", or the bare
    # name when unique among wall types and curtain system types (D-54) - or,
    # since version 2, a curtain SYSTEM type: "Curtain System: Heron JM 1500".
    # A STRING, matched in the fragment by the add-in's own rule - the name
    # exactly, or "Family: Type" - because the add-in has no binder for a
    # curtain system type; CREATE_CURTAIN_SYSTEM matches its own the same way.
    # A basic or stacked wall type is refused here, by name. The same need
    # name as version 1, so its proof's values still bind. Not `wallType`, for
    # the reason SET_CURTAIN_WALL_GRID gives: CREATE_WALL takes that name, and
    # a proof's writing steps share one set of values.
    - name: curtainWallType
      type: string
      source: request
    # Position=mullion type, SEMICOLONS between - "vertical interior=
    # Rectangular Mullion: 50 x 150mm; horizontal border 2=none". Positions:
    # vertical interior, vertical border 1, vertical border 2, horizontal
    # interior, horizontal border 1, horizontal border 2 - and, for a curtain
    # system type, grid 1 interior, grid 1 border 1, grid 1 border 2 and the
    # same three for grid 2. A position left out
    # keeps what it has; "none" takes its mullions off. A mullion type's name
    # cannot hold a semicolon - Revit forbids one in any type name - so the
    # table's separator can never cut a name in two.
    - name: mullions
      type: IDictionary<string, string>
      source: request
  provides:
    - name: applied
      # Positions Revit now HOLDS as asked AND that this call changed - counted
      # off the read-back after the rebuild, never off the write.
      role: result
      type: int
    - name: differs
      # Positions where Revit holds something other than what was asked. A
      # finding, never a success.
      role: result
      type: IList<string>
    - name: alreadyAsAsked
      # Positions that already held what was asked, so nothing was written.
      # The evidence it looked, never a change it made (D-52).
      role: accounting
      type: int
    - name: wallsOfType
      # How many placed walls use the type - the REACH of the change, counted
      # before the write. Never a thing it found (D-52).
      role: accounting
      type: int
    - name: systemsOfType
      # How many curtain systems use a curtain SYSTEM type - the reach of the
      # change, counted before the write, as wallsOfType is for a wall type;
      # 0 for a wall type. Never a thing it found (D-52).
      role: accounting
      type: int
    - name: readBack
      # ALL SIX positions as Revit holds them after the write, beside what each
      # held before; for a curtain system type, which of Revit's mullion ids it
      # carries as well. A STRING, because a reply cuts a list to three items
      # and this is the evidence. Accounting: empty on a refusal.
      role: accounting
      type: string
    - name: measured
      # One placed wall of the type, before and after: its mullions by type and
      # by the way each runs, and its grid lines each way. For a curtain system
      # type, one curtain system over all its faces, with Revit's U and V line
      # counts. Read off Revit.
      role: accounting
      type: string
    - name: refused
      # Why nothing was changed, in plain words - for a name that matches no
      # mullion type, WITH the names the model has. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


compatibility-note: >
  ONE PATH FOR EVERY RELEASE, read rather than remembered. On 2026-09-24
  tools/api-surface read the reference assemblies of all eight releases, 2020
  through 2027: `MullionType` derives from FamilySymbol on all eight, so its
  `FamilyName` is the mullion family's; `WallType.Kind`, `Wall.CurtainGrid`,
  CurtainGrid's `GetMullionIds`, `GetUGridLineIds` and `GetVGridLineIds`,
  `CurtainGridLine.FullCurve`, `Mullion.LocationCurve`,
  `Parameter.Set(ElementId)`, `Parameter.AsElementId()` and the application's
  `AngleTolerance` carry one signature on every release. The API reference
  text of all eight releases lists AUTO_MULLION_INTERIOR_VERT and _HORIZ
  ("Interior Type"), AUTO_MULLION_BORDER1_VERT and _HORIZ ("Border 1 Type")
  and AUTO_MULLION_BORDER2_VERT and _HORIZ ("Border 2 Type"). A mullion type is
  found by walking the model's element types and testing each as a
  MullionType - the add-in's own way of finding a type by class - rather than
  by a class filter. No ElementId is constructed and none is read as a number.
  VERSION 2, read the same way on 2026-10-29, all eight releases:
  CurtainSystemType derives from HostObjAttributes, as WallType does, and
  declares nothing of its own; CurtainSystem.CurtainGrids (a CurtainGridSet,
  enumerable, null when it holds none) and GetTypeId; BuiltInCategory
  OST_CurtaSystem; ElementType.Name and FamilyName; Document.Title. The
  BuiltInParameter ids AUTO_MULLION_INTERIOR_GRID1 and _GRID2 ("Interior
  Type"), AUTO_MULLION_BORDER1_GRID1 and _GRID2 ("Border 1 Type") and
  AUTO_MULLION_BORDER2_GRID1 and _GRID2 ("Border 2 Type") are on all eight.
  The reference text gives each only its display name - the same names as the
  _VERT/_HORIZ ids - and nothing about which element carries it, so the
  curtain system type's ids are an assumption the code checks and the proof
  settles. Revit names groups "Grid 1 Mullions" and "Grid 2 Mullions"
  (BuiltInParameterGroup PG_CURTAIN_MULLION_1 and _2, 2020 to 2024 only), but
  a parameter's group is not read here: Definition.ParameterGroup ends with
  2024 and GetGroupTypeId starts with 2022, so no one member reads it on all
  eight.


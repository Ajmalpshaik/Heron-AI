# WRITE_ELEMENT_PARAMETERS, DUPLICATE_TYPE, CREATE_WALL and
# ADD_CURTAIN_GRID_LINES.
#
#   "set the mullions on this curtain wall type" -> here
#   "put 50 x 150 mullions on the borders"  -> here
#   "take the top mullion off"              -> here, horizontal border 2=none
#   "put mullions on the curtain system type" -> here, on the curtain SYSTEM
#                                              type (version 2, DRAFT until
#                                              Group JP): grid 1 or grid 2,
#                                              never vertical or horizontal -
#                                              which way each grid runs is the
#                                              face's. The curtain system itself
#                                              is CREATE_CURTAIN_SYSTEM's
#   "which mullions are on this curtain system" -> NOT HERE - a question never
#                                              lands on a write (D-86). Nothing
#                                              reads a curtain system type's
#                                              positions yet; REPORT_CURTAIN_WALL_TYPE
#                                              reads a wall type only. MEASURED
#                                              2026-10-29 on the cloud's trained
#                                              backend: with the host's question
#                                              flag it reaches that reader;
#                                              WITHOUT it, it ranks HERE since
#                                              version 2 (it reached the reader
#                                              before). Asked with no table, this
#                                              refuses "Nothing was named to
#                                              change". The fix is a reader of a
#                                              curtain system type - the owner's
#                                              word, REPORT_CURTAIN_WALL_TYPE being
#                                              PROVEN (NEEDS-CHECKING JP17)
#   "set the curtain wall grid spacing"     -> SET_CURTAIN_WALL_GRID. Interior
#                                              mullions sit on the grid lines;
#                                              with none there, an interior type
#                                              shows nowhere
#   "change the mullions on just this wall" -> DUPLICATE_TYPE first, then
#                                              CHANGE_ELEMENT_TYPE to put that
#                                              wall on the copy, then here on the
#                                              copy
#   "split this curtain wall into 4 equal bays with mullions" -> ADD_CURTAIN_GRID_LINES
#                                              - new grid lines on ONE wall, with
#                                              mullions of the type named on those
#                                              lines only. This sets the TYPE's six
#                                              positions, for every wall of it
#   "change this one mullion"               -> CHANGE_ELEMENT_TYPE, with that

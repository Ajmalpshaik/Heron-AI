# VERSION 2 (2026-10-29) - A CURTAIN SYSTEM TYPE TOO. NOT RUN; NEEDS-CHECKING
# Group JP (docs/needs-checking/group-jp.md) is the plan, and its job file
# tools/jobs/set-curtain-wall-mullions-curtain-system-2026-10-29.yaml the
# batch. Every wall-type case below still holds word for word - the type's name
# is now matched in the fragment instead of by the add-in, and `systemsOfType`
# reads 0 for a wall type - and JP re-runs version 1's own two (Project1,
# "Curtain Wall: Storefront") because its proof went stale. The curtain system
# cases are marked VERSION 2 below, on Group JP's rig: the owner's Project1
# (Revit 2020) saved as "Heron JP Curtain", the mass "Heron JP Tower" - 18000
# x 12000 mm on plan from (0, 30000), 30000 mm high - and ONE curtain system on
# its four side faces made BY HAND with Curtain System by Face, of "Heron JP
# 1500": Grid 1 and Grid 2 Fixed Distance 1500, every mullion None. At 1500 the
# four faces carry 36 upright lines and 76 level ones (derived in
# set-curtain-wall-grid/tests/cases.yaml). WHICH OF GRID 1 AND GRID 2 RUNS
# WHICH WAY IS THE FACE'S AND NOT KNOWN, so each expectation is written for
# both. Version 1's proof showed Project1 holds "Rectangular Mullion: 30mm
# Square" and "Rectangular Mullion: 50 x 150mm".
#
# THE PROOF PLAN, written 2026-09-24 and NOT RUN. Nothing here has touched a
# model (D-30); every case says what to arrange and what must come back. The
# owner runs it, on a TEST COPY - the first positive with the first negative is
# tools/jobs/set-curtain-wall-mullions-test-projject-2026-09-24.yaml, and with
# the second negative tools/jobs/set-curtain-wall-mullions-unknown-name-test-
# projject-2026-09-24.yaml. Two files, because a batch keeps one draft per
# fragment.
#
# THE TYPE IS BUILT, NOT FOUND - the same four steps as SET_CURTAIN_WALL_GRID,
# rolled back with everything else:
#   1. CREATE_WALL draws one 9000 mm wall, 3000 mm high, of an EXISTING curtain
#      wall type - "Curtain Wall: Curtain Wall 1" in Revit's templates, which
#      has no grid lines and no mullions: the cleanest "before" there is
#   2. DUPLICATE_TYPE copies that wall's type as "HERON CW MULLION PROOF"
#   3. CHANGE_ELEMENT_TYPE puts the wall on the copy
#   4. this fragment, on "HERON CW MULLION PROOF"
# See set-curtain-wall-grid/tests/cases.yaml for why it is built in that order.
#
# NOTHING MAY BE SELECTED IN REVIT WHEN THE POSITIVE STARTS - press Esc.
# Steps 2 and 3 take the selection before they take what step 1 made.
#
# READ `measured` BEFORE `applied`. It must name ONE wall, 9000 mm long.
#
# THE MULLION TYPE IS A GUESS UNTIL CHECKED. "Rectangular Mullion: 50 x 150mm"
# is in Revit's metric templates; whether `test projject` has it has not been
# read. The second negative below prints every mullion type the model has, so
# its own answer is the list to correct the name from.
#
# THE COUNTS ARE DERIVED, NOT REMEMBERED. Curtain Wall 1 has no grid lines, so
# each edge of the wall is ONE border segment: Border 1 and Border 2 of the
# vertical mullions are the wall's two ends, and Border 1 and Border 2 of the
# horizontal ones its base and its top - four edges, one mullion each.

positive:
  - given: >
      the arrangement above in `test projject`, Revit 2024, on "Level 1": the
      wall from "0,60000,0" to "9000,60000,0" - well clear of the building -
      height 3000, structural false;
      curtainWallType "HERON CW MULLION PROOF"; mullions "vertical border
      1=Rectangular Mullion: 50 x 150mm; vertical border 2=Rectangular Mullion:
      50 x 150mm; horizontal border 1=Rectangular Mullion: 50 x 150mm;
      horizontal border 2=Rectangular Mullion: 50 x 150mm"
    expect: >
      wallsOfType 1, applied 4, alreadyAsAsked 0, differs empty, refused empty.
      readBack names the four border positions "'Rectangular Mullion: 50 x
      150mm', was none - asked for 'Rectangular Mullion: 50 x 150mm'" and both
      interior positions "not asked, left as it was". measured names one wall,
      "9000 mm long", with 0 vertical and 0 horizontal grid lines; mullions
      before "none", now "2 x horizontal 'Rectangular Mullion: 50 x 150mm', 2 x
      vertical 'Rectangular Mullion: 50 x 150mm'" - four edges, one mullion
      each (derivation above)

  - given: >
      the same arrangement with SET_CURTAIN_WALL_GRID as a fourth setup step
      before this one - grid "vertical layout=fixed distance; vertical
      spacing=1500" on the same copy - and mullions "vertical
      interior=Rectangular Mullion: 50 x 150mm". RUN ONLY ONCE
      SET_CURTAIN_WALL_GRID HAS PASSED ITS OWN PROOF: here it is part of the
      arrangement, and an arrangement nobody has proved proves nothing
    expect: >
      applied 1; measured shows 5 vertical grid lines (derived in
      set-curtain-wall-grid's cases) and the mullions now "5 x vertical
      'Rectangular Mullion: 50 x 150mm'" - one per interior line, each line a
      single segment because the copy has no horizontal lines

  - given: >
      the first case with the bare type name - mullions "vertical border
      1=50 x 150mm" - on a model where no other mullion type is called that;
      and again spelled "Rectangular Mullion : 50 x 150mm", a space before the
      colon
    expect: >
      both resolve to the same type as the full name: applied 1, and readBack's
      vertical border 1 reads "'Rectangular Mullion: 50 x 150mm'". Two
      spellings of one name, not a guess between two names

  - given: the first case again on Revit 2020
    expect: >
      the same answer. One path serves every release, and this is the release
      at the other end of the range

  # VERSION 2, added 2026-10-29 - THE CURTAIN SYSTEM TYPE, Group JP's rig (see
  # the top of this file), nothing selected, rolled back.
  - given: >
      JP11, THE JOB FILE'S CASE. curtainWallType "Heron JP 1500"; mullions
      "grid 1 interior=Rectangular Mullion: 30mm Square" - one position, an
      interior one, because the rig's type has lines both ways and every
      mullion None, so what appears is counted exactly
    expect: >
      systemsOfType 1, wallsOfType 0, applied 1, alreadyAsAsked 0, differs
      empty, refused empty. readBack "grid 1 interior: 'Rectangular Mullion:
      30mm Square', was none - asked for 'Rectangular Mullion: 30mm Square'",
      the other five "none - not asked, left as it was", and "Of Revit's
      mullion ids, ... carries: AUTO_MULLION_INTERIOR_GRID1, ..." - RECORD
      that line: it is the assumption, read. measured: ONE curtain system, on
      4 face(s), with 36 vertical and 76 horizontal grid lines; mullions before
      "none", and now EITHER "720 x vertical 'Rectangular Mullion: 30mm
      Square'" (Grid 1 runs upright: 36 lines, each cut into 20 by the 19
      level lines) OR "760 x horizontal 'Rectangular Mullion: 30mm Square'"
      (Grid 1 runs level: on each 18000 face 19 lines cut into 12, on each
      12000 face into 8). RECORD which - it must agree with SET_CURTAIN_WALL_GRID's
      JP2. A position Revit does not then hold stops the call and keeps
      nothing, quoting Revit: the assumption failing, recorded

  - given: >
      JP12. The rig; mullions "grid 2 interior=Rectangular Mullion: 30mm
      Square" - the other grid
    expect: >
      applied 1; the mullions now the OTHER of JP11's two answers - 760
      horizontal if JP11 gave 720 vertical, and the other way round

  - given: >
      JP13. The rig; mullions "grid 1 border 1=none" - the type already holds
      none there
    expect: >
      applied 0 and alreadyAsAsked 1, NOT a refusal: findings "Nothing on ...
      needed changing ... It is used by 1 curtain system(s) in this model"

negative:
  - given: >
      the same arrangement and the SAME mullions, with curtainWallType "Basic
      Wall: Generic - 200mm" - the basic type CREATE_WALL was proved with in
      this model. A type it must NOT touch, not an empty request
    expect: >
      applied 0, differs empty, wallsOfType 0, readBack and measured empty.
      refused names the type: "is a basic wall type, not a curtain wall type -
      it has no mullions to set", ending "Nothing was changed"

  - given: >
      the same arrangement; mullions "vertical border 1=HERON NO SUCH MULLION"
    expect: >
      refused "No mullion type called 'HERON NO SUCH MULLION' in this model",
      followed by EVERY mullion type the model has, in the Properties spelling,
      and that Heron does not load families; applied 0, readBack empty. Nothing
      is chosen for the modeller and nothing is loaded

  - given: >
      a bare type name two mullion families in the model share - only if the
      list the case above prints has one; if it has none, this case cannot be
      arranged in this model and is recorded NOT RUN, never passed
    expect: >
      refused "2 mullion types are called", naming both in the family-and-type
      spelling; applied 0. Never chosen from (D-54 s3)

  - given: >
      the arrangement; mullions "vertical interior=" - a position with nothing
      after the equals sign - and separately "top border=none"
    expect: >
      the first refused "was given no mullion type. Name one, or say none"; the
      second refused naming the six positions this sets. applied 0 both times.
      A blank is never read as none

  - given: >
      the arrangement; mullions "vertical interior=none" - the copy of Curtain
      Wall 1 already holds none there
    expect: >
      applied 0 and alreadyAsAsked 1, NOT a refusal: findings says nothing
      needed changing. A request already met writes nothing and counts nothing
      as done

  # VERSION 2, added 2026-10-29 - THE CURTAIN SYSTEM TYPE'S NEGATIVES, Group
  # JP's rig, each rolled back.
  - given: >
      JP14, THE JOB FILE'S NEGATIVE. The SAME mullions as JP11 aimed at a type
      it must NOT touch - curtainWallType "Curtain Wall: Storefront", the
      curtain WALL type version 1 was proved on in Project1. A different type,
      not an empty request
    expect: >
      applied 0, wallsOfType 0, systemsOfType 0, readBack and measured empty;
      refused "'grid 1 interior' is not a mullion position. Name one or more
      of: vertical interior, vertical border 1, vertical border 2, horizontal
      interior, horizontal border 1, horizontal border 2. Nothing was changed"
      - version 1's own words. Storefront's mullions as they were

  - given: >
      JP15. The rig; curtainWallType "Heron JP 1500"; mullions "vertical
      interior=Rectangular Mullion: 30mm Square" - a wall type's position on a
      curtain system type
    expect: >
      refused "'vertical interior' is a curtain WALL type's position", saying
      its mullions are Grid 1 Mullions and Grid 2 Mullions and which way each
      grid runs is the face's, and naming the six grid positions; applied 0,
      readBack empty. Never guessed to mean Grid 1

  - given: >
      JP16. The rig; curtainWallType "Heron JP 1500"; mullions "grid 1
      interior=HERON NO SUCH MULLION"
    expect: >
      refused "No mullion type called 'HERON NO SUCH MULLION' in this model",
      followed by every mullion type the model has, as version 1 does for a
      wall type; applied 0


id: FRG-ELE-051
semantic-identity: "put a ceiling in every room, the shape of the room"
kind: action
domain: revit.elements
capability: CREATE_FROM_ROOM_BOUNDARIES
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Builds a floor or a ceiling on each room, taking the shape from the room's
  own boundary - including the holes. No typed coordinates: the room already
  knows its shape.

  **THE HOLES ARE THE REASON THIS EXISTS.** A room's boundary comes back as
  several loops: the first is the outside edge and every one after it is a
  shaft, a core or a column the room wraps around. Building from the first loop
  alone puts a slab straight over the shaft - which looks right in plan, passes
  every check, and is found by the person who tries to run a riser through it.
  The plain creators take ONE loop and say so; this is the fragment for the
  real-room case.

  **AN UNENCLOSED ROOM HAS NO USABLE BOUNDARY.** It reports no area and no
  loops, so nothing can be built on it. Those rooms are named rather than
  silently skipped - a floor of thirty rooms that produced twenty-eight
  ceilings needs to say which two.

  **THE TYPE DECIDES WHAT IS BUILT.** A floor type makes floors and a ceiling
  type makes ceilings, so there is no mode to get wrong - and a type that is
  neither is refused before anything is attempted.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # A FloorType or a CeilingType - which one decides what gets built.
    - name: hostType
      type: HostObjAttributes
      source: request
    # Ceilings only: how far above the room's level the ceiling sits, in
    # INTERNAL FEET. It goes straight into CEILING_HEIGHTABOVELEVEL_PARAM via
    # Parameter.Set(double), which takes Revit's internal units and accepts any
    # number without complaint - so a caller who reads "how far above" and
    # passes 2700 for millimetres gets a ceiling 2,700 FEET up and no error.
    # Stated 2026-09-09: tools/check-revit-gate.py asked question 11 of the
    # fourteen against all 360 fragments and this was the only one that never
    # said what its number meant.
    - name: heightAboveLevel
      type: double
      source: request
  provides:
    - name: created
      role: result
      type: IDictionary<ElementId, ElementId>
    - name: withHoles
      # THE HOLES ARE THE REASON THIS EXISTS - the rooms whose ceiling was
      # built with its shafts and columns cut out. What it made, not what it
      # turned away.
      role: result
      type: IList<ElementId>
    - name: unenclosed
      # Rooms with no usable boundary, so nothing could be built on them. *No
      # area and no loops* - given and unusable, never a ceiling it made
      # (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<string>


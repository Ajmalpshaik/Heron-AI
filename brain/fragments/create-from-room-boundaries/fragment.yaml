compatibility-note: >
  The creation calls moved. A floor is made one way up to 2021 and another from
  2022, and a ceiling cannot be made from code at all before 2022 - so both are
  reached by looking the method up at run time rather than naming it, which is
  what lets one file serve all eight releases. A release with no ceiling call
  says so instead of failing to build. The boundary loops themselves are
  unchanged 2020 to 2027.

# ROUTING - the same rows are in the fragments named here.
#
#   "put a ceiling in every room"        -> here, and the shafts stay open
#   "make a slab under this block of     -> here
#    rooms"
#   "make a floor from these points"     -> CREATE_FLOOR, which takes ONE typed
#                                           loop and cuts no openings
#   "make a ceiling from these points"   -> CREATE_CEILING, the same
#   "what shape is this room"            -> READ_ROOM_GEOMETRY, which hands
#                                           back the outline and the holes
#                                           separately
#   "which rooms are not enclosed"       -> SELECT_UNENCLOSED_ROOMS


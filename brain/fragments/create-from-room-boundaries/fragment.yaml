compatibility-note: >
  The creation calls moved. A floor is made one way up to 2021 and another from
  2022, and a ceiling cannot be made from code at all before 2022 - so both are
  reached by looking the method up at run time rather than naming it, which is
  what lets one file serve all eight releases. A release with no ceiling call
  says so instead of failing to build. The boundary loops themselves are
  unchanged 2020 to 2027.
  Version 2's wall finishes call nothing that moved: Wall.Create with a type,
  level, height and offset, Wall.Flip and Orientation, WallType.Kind and Width,
  HostObject.FindInserts, Opening.BoundaryRect, BoundarySegment.ElementId and
  LinkElementId, JoinGeometryUtils, Arc.Create through three points, Level.
  ProjectElevation and SpatialElementBoundaryLocation.Finish are on every
  release 2020 to 2027 - read off the reference assemblies with
  tools/api-surface on 2026-10-19. Curve.Intersect is NOT used: deprecated at
  2026 and gone at 2027, so where two finishes meet is worked out in the
  fragment.

# ROUTING - the same rows are in the fragments named here.
#
#   "put a ceiling in every room"        -> here, and the shafts stay open
#   "make a slab under this block of     -> here
#    rooms"
#   "line the walls of every room with   -> here, version 2: a WALL type, the
#    plaster up to 2400"                    height, and baseOffset for a
#                                           skirting. One thin wall per stretch,
#                                           on the inside face, gaps at doors
#   "put a wall here", "build a wall     -> CREATE_WALL, which takes typed
#    between these points"                  points and knows no room
#   "paint the walls of this room"       -> PAINT_FACES - paint is a material on
#                                           a face, not a wall of its own
#   "change the finish layer of this     -> SET_COMPOUND_LAYER_WIDTH - a layer
#    wall type"                             of the TYPE, every wall of it
#   "make a floor from these points"     -> CREATE_FLOOR, which takes ONE typed
#                                           loop and cuts no openings
#   "make a ceiling from these points"   -> CREATE_CEILING, the same
#   "what shape is this room"            -> READ_ROOM_GEOMETRY, which hands
#                                           back the outline and the holes
#                                           separately
#   "which rooms are not enclosed"       -> SELECT_UNENCLOSED_ROOMS

utterances:
  - put a ceiling in every room
  - make a slab under these rooms
  - build the floor from the room shape
  - i need ceilings in all the rooms
  # ADDED 2026-10-19, version 2 (row 5b-1255): wall finishes by room. Measured
  # against main before they went in - see the row.
  - line the walls of every room with plaster
  - add a tile finish to the room walls up to 2400
  - put wall finishes in these rooms

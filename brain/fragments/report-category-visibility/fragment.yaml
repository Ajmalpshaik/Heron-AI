id: FRG-VIEW-054
semantic-identity: "which categories are switched off in this view"
kind: filter
domain: revit.views
capability: REPORT_CATEGORY_VISIBILITY
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Lists which CATEGORIES are switched off in one view - the read half of
  `SET_CATEGORY_VISIBILITY`, which only ever sets. Read-only.

  **BEFORE THIS, ASKING WHAT WAS TURNED OFF RESOLVED TO THE FRAGMENT THAT TURNS
  THINGS OFF.** A question about a drawing answered by something that changes it.

  **IT DELIBERATELY DOES NOT SCOPE TO THE VIEW, AND THAT IS THE OPPOSITE
  DECISION FROM `REPORT_CATEGORY_OVERRIDES`.** A hidden category's elements do
  not appear in a view-scoped collector AT ALL - so scoping this to what the view
  shows would hide exactly the categories it exists to find. It looks at every
  category with something in the MODEL instead. The two fragments look alike and
  the difference is not a style choice.

  **VISIBILITY IS NOT AN OVERRIDE**, and confusing them costs an afternoon.
  A category switched off shows nothing; a category overridden shows differently.
  Something missing from a drawing is this fragment's question;
  something the wrong colour is the other one's.

  **A CATEGORY WITH NOTHING IN THE MODEL IS NOT REPORTED.** It is switched off in
  every view by default and listing hundreds of them buries the few that matter.

contract:
  needs:
    - name: doc
      type: Document
    - name: view
      type: View
      source: request
  provides:
    - name: findings
      type: IList<string>
    - name: hiddenCategories
      role: result
      type: IList<ElementId>


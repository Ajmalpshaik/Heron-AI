heron-step: 14
heron-status: DRAFT
heron-since: 0.1.0
heron-layer: brain

id: FRG-ELE-012
semantic-identity: "put these elements into one Revit group"
kind: action
domain: revit.elements
capability: GROUP_ELEMENTS
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Makes one Revit group from the given elements — a repeated toilet block, a
  typical plant arrangement, a riser that recurs on every floor — in a project,
  or in the family open in the Family Editor.

  **The group's name is a value**: `name`, or empty for Revit's own "Group 1".
  A name another group already has is refused, and nothing is grouped.

  **Grouping changes how every later operation behaves on these elements, and
  that is the reason to read this before using it.** A group member silently
  refuses to move: Revit's move call returns normally and moves nothing. That
  is the defect this repository already found and fixed in `MOVE_ELEMENTS`, and
  this fragment is the thing that creates the condition.

  **Revit decides what can be grouped, and it is not obvious.** Every refusal
  says why, in Revit's own words where Revit said no, and the member count is
  read back from the group.

  **In a family, docs/43 section 12 advises against groups.** For identical
  parts, one nested family placed at each spot is usually lighter, or
  ARRAY_FAMILY_FORMS for a row. This still groups them when asked.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # The group type's name - "Bracket parts", "TRG_Toilet Block". EMPTY for
    # Revit's own "Group 1". A name another group already has, or one with a
    # character Revit forbids in names, is refused and nothing is grouped.
    - name: name
      type: string
      source: request
  provides:
    - name: groupId
      role: result
      type: ElementId
    - name: grouped
      # Read back from the group, not taken from the input.
      role: result
      type: int
    - name: groupName
      # The group type's name as Revit has it afterwards - the one asked for,
      # or Revit's own. Empty when nothing was grouped.
      role: result
      type: string
    - name: refused
      # Whether it declined - kept a bool, as version 1 had it. The evidence
      # it looked and said no, never a thing it FOUND, so it must not count
      # toward "did this come back empty" (D-52). The WORDS are in
      # `refusalReason`.
      role: accounting
      type: bool
    - name: refusalReason
      # Why nothing was grouped, in plain words, Revit's own message quoted
      # when Revit said no. Empty when the group was made.
      role: accounting
      type: string
    - name: findings
      # Where it was grouped and under which name, what Revit added to or left
      # out of the group, and - in a family - the lighter routes.
      type: IList<string>

# NO PROOF YET FOR VERSION 2. Version 1 (a project only, no name, a bare
# `refused`) was PROVEN on 2026-09-13 by Ajmal PS on test projject, Revit 2024 -
# the record is in git history. Version 2 changes impl/, so it is DRAFT until it
# is proved again: NEEDS-CHECKING Group CT.

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `NewGroup(ICollection<ElementId>)` is
  declared on the creation factory that both `Document.Create` and
  `Document.FamilyCreate` are, and `Document.Create` throws in a family
  document - RevitAPI.xml for 2020, 2024 and 2027, read 2026-10-07, the same
  remarks in all three. `Group.GroupType`, `GetMemberIds`, the `Element.Name`
  setter, `NamingUtils.IsValidName` (since 2015) and `SubTransaction` (since
  2011) are unchanged 2020 to 2027, and no ElementId is built from an integer.

# ROUTING - repeated in UNGROUP_ELEMENTS and MOVE_ELEMENTS.
#
#   "group these"                     -> here
#   "group these forms in this family"
#                                     -> here - and say the lighter routes
#   "make the small parts one group"  -> here
#   "ungroup them"                    -> UNGROUP_ELEMENTS
#   "array the blade along X with Blade Count"
#                                     -> ARRAY_FAMILY_FORMS - one form in a
#                                        row in a family, its count a
#                                        parameter; lighter than a group
#   "put the motor family into this air handler"
#                                     -> PLACE_NESTED_FAMILY - one nested
#                                        family placed many times is the
#                                        lighter way to repeat a part
#   "why will these not move"         -> MOVE_ELEMENTS reports blocked; a GROUP
#                                        MEMBER is a common cause and is not
#                                        the same as pinned
#   "select the group"                -> FILTER_ELEMENTS_BY_ID
#
# GROUPED, PINNED AND OWNED ALL PRESENT AS "IT WILL NOT MOVE" and have three
# different fixes. Reporting the wrong one sends somebody to the wrong place.

utterances:
  - group these
  - put them in a group
  - make a group out of these
  - group the toilet block
  - turn these into a group
  - group these forms in this family
  - make the small parts one group
  - group these parts in the family editor
  - make a model group

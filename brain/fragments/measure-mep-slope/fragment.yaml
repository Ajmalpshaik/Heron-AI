runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `LocationCurve`, `Curve.GetEndPoint`
  and `XYZ` are unchanged 2020 to 2027. The slope is a RATIO of two internal
  lengths, so it needs no unit conversion at all and 2021's unit API rewrite
  cannot reach it - the one number that is the same in feet and in millimetres.

# ROUTING - repeated in ALIGN_MEP_ELEVATION, which is the fragment that gets
# asked for when this one is meant.
#
#   "what fall is on this drain"        -> here
#   "which pipes are too flat"          -> here, with the minimum stated
#   "set them all to the same level"    -> ALIGN_MEP_ELEVATION
#   "put the ducts at 2800"             -> ALIGN_MEP_ELEVATION
#
# ALIGNING AND SLOPING ARE OPPOSITE JOBS ON THE SAME ELEMENTS. Aligning makes a
# run flat on purpose; a drain being flat is the defect. Landing on the wrong
# one of these does not give a poor answer, it gives a confident wrong one.
#   "give it a fall of 1 in 100"     -> SET_MEP_SLOPE - the FIX. This one only
#                                       measures, and must not answer a request
#                                       to change the model
#   "the drain is running flat"      -> SET_MEP_SLOPE

utterances:
  - what slope is on these pipes
  - which pipes are too flat
  - check the fall on the drainage
  - what is the gradient
  - are these sloped enough
  - the drain is not running
  - what fall is on this drain

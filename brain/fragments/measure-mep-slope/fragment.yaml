id: FRG-MEP-005
semantic-identity: "what fall do these pipes have, and which are flatter than they should be"
kind: action
domain: revit.mep
capability: MEASURE_MEP_SLOPE
version: 1
source: OFFICIAL
risk: READ

purpose: >
  The fall on each pipe or duct, as a percentage, measured from the geometry -
  and which of them are flatter than a minimum the caller states.

  Drainage that does not fall does not drain. It is one of the few MEP mistakes
  that looks completely correct in every view, passes every clash check, and is
  only found on site.

  **The slope is COMPUTED FROM THE ENDPOINTS, not read from the slope
  parameter,** and that is this repository's standing rule rather than a
  preference: Revit's own reported values describe intent and are not always the
  physical fact. A pipe whose slope parameter says 1% and whose two ends are at
  the same level is flat, and the geometry is the half that is true. The same
  reasoning found the real refrigerant pairing when the tags and the connector
  flags both said otherwise.

  **It answers "is there enough fall", NOT "does it fall the right way".** The
  sign it reports runs from the curve's start to its end, and Revit's curve
  direction is whichever way the modeller drew - two identical drains drawn from
  opposite ends report +1% and -1%. So the verdict is taken on the magnitude,
  and which end is downstream is TRACE_CONNECTIVITY's question. This limit was
  found by writing the negative case: the first version compared the signed
  value against a positive minimum, which would have failed a correct drain for
  the direction somebody dragged the mouse.

  **The minimum is a per-request input and has no default.** 1:100, 1:40 and 1%
  are different site answers to different pipe sizes and different authorities,
  and a number invented here would be a number quietly relied on. Nothing in
  this fragment knows what the job requires.

contract:
  needs:
    - name: elements
      type: IList<Element>
    - name: minimumSlopePercent
      type: double
      source: request
  provides:
    - name: slopePercent
      # The slope worked out for every element that has one. Filled in
      # identically whatever minimum was asked for - the answer is which
      # of them fall below it (D-52).
      role: accounting
      type: IDictionary<ElementId, double>
    - name: belowMinimum
      type: IList<ElementId>
    - name: vertical
      # Elements standing vertical, which have no slope to measure. The
      # evidence it looked, not a shortfall it found.
      role: accounting
      type: IList<ElementId>
    - name: noGeometry
      type: IList<ElementId>


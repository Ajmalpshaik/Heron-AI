tests: tests/

compatibility-note: >
  **The only fragment in the library that needs a compile symbol, and the first
  case where NO single API spans the supported releases.**
  `IndependentTag.TaggedElementId` exists 2020 to 2026 and was **removed in
  2027**; `GetTaggedLocalElementIds()` **arrived in 2022**. The overlap is
  2022-2026 and neither covers the span, so the implementation splits on
  `REVIT2020 || REVIT2021`.

  This was established by the compile gate, not from memory: the first version
  used `TaggedElementId` throughout, passed on 2020 and 2022, and failed on
  2027 - the "worked in 2020, errors on the new one" failure the owner named as
  his own recurring problem, caught here instead of mid-job.

  It puts a REQUIREMENT ON UNBUILT WORK: D-28's in-process Roslyn executor must
  define the same `REVIT20xx` symbol MSBuild does. A host defining none takes
  the `#else` branch and breaks on 2020 and 2021 only - which is the release
  the owner actually runs.

# ROUTING - repeated in TAG_ELEMENTS.
#
#   "which ducts are not tagged"     -> here
#   "tag the ones that are missing"  -> here, then TAG_ELEMENTS
#   "tag these"                      -> TAG_ELEMENTS
#   "how many ducts are there"       -> COUNT_ELEMENTS - a count of elements,
#                                       not a count of what is annotated
#   "the tags are on top of each other" -> FIND_OVERLAPPING_TAGS - the opposite
#                                       problem: annotation that is there and
#                                       unreadable, not annotation missing

utterances:
  - which ones are not tagged
  - what is missing a tag
  - which ducts have no tag
  - find the untagged elements
  - check the tagging on this drawing
  - are they all tagged
  - tag the ones that are not tagged yet
  - tag the ones that are missing

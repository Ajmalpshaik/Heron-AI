positive:
  - given: >
      "Family and Type" contains "VCD" over the duct accessory category, in a
      model with 30 VCDs and 90 other accessories
    expect: >
      the 30, with the scanned count at 120 and withoutParameter at 0 - every
      family instance has a family and a type

  - given: Mark begins with "AHU"
    expect: >
      only marks starting AHU, and NOT one that merely contains it. The four
      modes have to differ or only "contains" is really implemented

  - given: a shared type parameter matched with includeTypeParameters true
    expect: >
      the instances found. With the same request and includeTypeParameters
      false, 0 matched and withoutParameter equal to the scanned count

  # D-59, added 2026-09-28 with version 2. NOT RUN.
  - given: >
      a text match that linked elements pass (for
      example Doors, Family contains "Door"), includeLinks true
    expect: >
      `elements` unchanged from the host-only run,
      and each link's matched-of-scanned count in `linkedMatches`

  # VERSION 4 - SELECT_BY_FAMILY and SELECT_BY_NUMERIC_PARAMETER merged in.
  # Each fails on version 3, which refuses the numeric modes and has none of
  # these inputs or outputs.
  - given: >
      parameterName Family, matchText "M_Desk", matchMode contains, exactMatch
      true, categories empty, in a model with two M_Desk and one M_Desk-Corner
    expect: >
      the two M_Desk only, found 2, matchedFamilies {M_Desk: 2},
      scannedWholeModel true and a finding saying the whole model was scanned.
      Without exactMatch the corner desk is found too and matchedFamilies
      names both families

  - given: parameterName Family, matchText "Basic Wall", categories Walls
    expect: >
      the basic walls - a SYSTEM family's name read through the type - and
      scannedWholeModel false

  - given: >
      parameterName Length, matchMode between, compareValue 30, compareValueMax
      35 (internal feet), categories Walls, matchText empty
    expect: >
      the walls 30 to 35 feet long, and the finding stating it in internal
      units AND as 9144 to 10668 mm if a length - SELECT_BY_NUMERIC_PARAMETER's
      proof case, by this card

  - given: parameterName Height, matchMode eq, matchText "1.6404" (500 mm), compareValue left out, Ducts
    expect: >
      the 500 mm ducts, tested to a tolerance of 1/304.8 and said so - the
      number typed as matchText is used when compareValue is not given

  - given: an integer parameter (Number of Poles) with matchMode eq and compareValue 3
    expect: >
      the three-pole elements - an integer is compared, never skipped

negative:
  - given: >
      Mark "notcontains" ABC over a whole category where most elements have no
      Mark at all
    expect: >
      ONLY elements that have a Mark and whose Mark lacks ABC. THIS IS THE
      FIRST CASE TO RUN. Reading a missing parameter as an empty string makes
      every unmarked element a match, and the answer is then the whole category
      reported as a successful filter

  - given: a parameter name that is spelled wrongly
    expect: >
      0 matched, withoutParameter equal to the scanned count, and the report
      saying nothing carries it. Not a bare zero - a typo and a model with no
      matches must not read alike

  - given: >
      a length parameter searched for the text "500" in a project displaying
      metres
    expect: >
      whatever it finds, treated as UNRELIABLE. The stored value is feet and
      the text is whatever Revit formatted; this is the case that belongs to
      SELECT_BY_NUMERIC_PARAMETER and the routing table has to send it there

  - given: an empty parameter name
    expect: refused, with the reason

  # Row 5b-1319, added 2026-10-22 with version 3. NOT RUN. THIS IS THE
  # SECOND CASE TO RUN: an unknown mode used to fall through to "contains"
  # with nothing said, and the wider selection fed a delete.
  - given: >
      matchMode "exactly" - or any word that is not contains, equals, begins,
      ends, notcontains or notequals - with a parameter name and text that
      WOULD match something
    expect: >
      refused before anything is scanned, naming the six modes, with no
      `elements` left behind for the next step. NOT a zero, and NOT the
      contains answer

  - given: matchMode "exact", and then "is", for a Name that another Name begins with
    expect: >
      the equals answer - ONE element, the one whose Name is exactly the text -
      and the finding line reading "equals". The contains answer, both
      elements, comes only when contains is asked for by name

  # Row 5b-203, added 2026-10-09. NOT RUN - it needs a model that carries a
  # duplicated name, and none has been arranged yet.
  - given: >
      parameterName "Interior Type" over Walls with includeTypeParameters
      true, on a model with a curtain wall whose type shows Interior Type
      twice (under Vertical and Horizontal Mullions) - or any name a shared
      or project parameter repeats beside a built-in one
    expect: >
      that wall counted in `ambiguous` and named in findings as carrying two
      parameters by the name, NOT matched and NOT in withoutParameter - with
      matchMode equals or notequals alike, because either answer would be
      read from whichever parameter Revit returned first (row 5b-203)

  # D-59, added 2026-09-28 with version 2. NONE OF THESE HAS BEEN RUN.
  - given: includeLinks ABSENT, on a model that HAS loaded links
    expect: >
      the same answer as version 1's proof, and linksSearched 0 with the first
      line of linkedMatches reading "Host model only - links not read". The
      switch left out must bind false, not refuse - if the run refuses with
      needs_request_values, the add-in in Revit is older than this change

  - given: includeLinks true on a model with NO links, or with every link unloaded
    expect: >
      linksSearched 0 and "Links asked for, NONE loaded - host only". It must
      NOT read like the absent case: one means there was nothing else to read,
      the other means reload them in Manage Links and ask again

  - given: one linked file placed TWICE, with includeLinks true
    expect: >
      linksSearched 1, not 2 - it counts files, not placements

  # VERSION 4.
  - given: parameterName Family, matchText empty, matchMode contains
    expect: >
      NOTHING scanned, elements empty, and the finding that no family name was
      given - a blank would match every element that has one
      (SELECT_BY_FAMILY's rule). Version 3 selected every element with a family

  - given: matchMode gt and neither compareValue nor a number as matchText
    expect: REFUSED before anything is scanned - no number was given

  - given: matchMode between, compareValue 100, compareValueMax 90 (or left out)
    expect: REFUSED before anything is scanned - not a range

  - given: matchMode gt on Comments, a text parameter
    expect: >
      0 matched and notNumeric equal to the elements carrying it, with the
      finding that a text mode matches those - never compared as a number

  - given: exactMatch true with matchMode begins
    expect: REFUSED before anything is scanned - two different ways of matching

  - given: matchMode gt, compareValue 1, matchText "2"
    expect: REFUSED - two different numbers

second_route: >
  A schedule of the same category with that parameter as a field and a Contains
  filter set to the same text, counted - Revit answering the same question in
  its own words

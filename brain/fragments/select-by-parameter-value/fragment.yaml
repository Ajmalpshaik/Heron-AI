compatibility-note: >
  One implementation for every release. `Element.LookupParameter`,
  `Element.GetParameters(string)`,
  `Parameter.HasValue`, `StorageType`, `AsString`, `AsValueString`,
  `ElementType.FamilyName` and `FamilyInstance.Symbol` are present 2020 through
  2027, compiled at both ends. An ElementId-valued parameter is resolved to its
  element and read by NAME - never as a number, which is what would have made
  2024's 64-bit ids matter here.

# ROUTING - repeated in FILTER_ELEMENTS_BY_TYPE, DESCRIBE_BLANK_PARAMETERS,
# MEASURE_RUN_QUANTITIES and SET_MEP_SIZE.
#
#   "find every vcd"                 -> here, matching Family and Type
#   "mark begins with ahu"           -> here
#   "comments contain revise"        -> here
#   "ducts 500 mm high"              -> here, a NUMERIC mode - eq on Height
#                                       with 500/304.8 (version 4). A number
#                                       only becomes text after Revit formats
#                                       it in the project's units - searching
#                                       for "500" as text is a coin toss
#   "pipes larger than 100 mm"       -> here, gt (version 4)
#   "walls between 200 and 300"      -> here, between (version 4)
#   "find all the VCDs" / "where are all the fire dampers" -> here,
#                                       parameterName Family, when VCD is the
#                                       FAMILY name - no category needed
#                                       (version 4, SELECT_BY_FAMILY)
#   "all the 300x300 ducts"          -> A SKILL. On a duct, 300x300 is Width
#                                       and Height - two numbers, not text -
#                                       so it is this card's numeric mode
#                                       twice with the results intersected,
#                                       and a composition is a skill's job.
#                                       Route here only when the size really
#                                       is in the type NAME, which is common
#                                       on fittings and rare on duct
#   "every duct of this type"        -> FILTER_ELEMENTS_BY_TYPE - the type
#                                       itself, not its name as text
#   "select every wall of type curtain wall" -> here
#                                       Type equals that name, in Walls. On
#                                       2026-10-06 it reached
#                                       SET_CURTAIN_WALL_GRID, a CHANGE, and
#                                       9 of 15 such sentences reached a
#                                       change (FRAGMENT-ISSUES 5b-329)
#   "what is blank"                  -> DESCRIBE_BLANK_PARAMETERS - presence
#                                       and emptiness, not a value to match
#   "the sheets with the as-built revision" -> FIND_SHEETS, revisionDescription
#                                       (FIND_SHEETS_BY_REVISION_OR_NUMBER
#                                       until it was merged there, 2026-11-01).
#                                       A sheet's "Current Revision ..."
#                                       parameters hold its LATEST revision
#                                       only, so a match here loses a sheet
#                                       once a later revision is added to it
#                                       (row 5b-550)
#   "how long are these ducts"       -> MEASURE_RUN_QUANTITIES - the value
#                                       reported, not used to filter
#   "make these ducts 500 high"      -> SET_MEP_SIZE - this one only reads
#   "everything of the same type as this one" -> FILTER_ELEMENTS_BY_TYPE, which
#                                       takes an example element
#   "which families are not used"    -> FIND_PURGEABLE_ELEMENTS
#
# SELECT_BY_FAMILY AND SELECT_BY_NUMERIC_PARAMETER WERE MERGED INTO THIS CARD
# on 2026-11-01, on the owner's instruction ("make sure there is no duplicate
# tools"), and are DEPRECATED. Where their inputs and outputs are now:
#   SELECT_BY_FAMILY    familyName -> parameterName=Family, matchText=<the
#                       name>, matchMode=contains (or equals); exactMatch,
#                       categories (empty = whole model), includeLinks,
#                       elements, matchedFamilies, scannedWholeModel, found,
#                       linksSearched, linkedMatches - the same names. One rule
#                       is kept from it: no name to look for matches nothing.
#                       Its families were read through the instance's symbol
#                       and the type's family name; this card's familyNameOf
#                       reads the same two
#   SELECT_BY_NUMERIC_PARAMETER  comparison -> matchMode (gt, gte, lt, lte,
#                       between, eq, ne); compareValue, compareValueMax,
#                       tolerance, includeTypeParameters, categories,
#                       includeLinks, elements, withoutParameter, notNumeric,
#                       ambiguous, findings, linksSearched, linkedMatches - the
#                       same names. NOT carried, as an opposite rule: an empty
#                       comparison there meant eq; here an empty matchMode
#                       means contains, as it always has, and a numeric
#                       compare must be named - a silent default between text
#                       and number is the one this card refuses


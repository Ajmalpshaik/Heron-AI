id: FRG-SEL-007
semantic-identity: "the elements whose parameter text matches what i typed"
kind: filter
domain: revit.selection
capability: SELECT_BY_PARAMETER_VALUE
# Version 3 (2026-10-22, row 5b-1319) changed impl/: a matchMode the code does
# not know is REFUSED before anything is scanned, naming the modes it takes,
# and "exact" and "is" are read as equals. Seen on Revit 2020 (session 78736):
# matchMode=exact fell through to contains without a word, "Outlet Port"
# answered "Outlet Port" AND "Outlet Port Bore", and the next call would have
# deleted the plane carrying a connector. Version 2's proof below no longer
# describes the code: DRAFT until NEEDS-CHECKING Group IT proves version 3
# (D-30).
#
# Version 4 (2026-11-01) changed impl/ again: SELECT_BY_FAMILY and
# SELECT_BY_NUMERIC_PARAMETER were merged in - see the purpose's last paragraph
# and the comment at the end of the routing table. The proof below is
# version 2's, kept as the record; DRAFT until version 4 is proved.
version: 4
source: OFFICIAL
risk: READ

purpose: >
  Selects the elements of one TYPE by its name, or whose named parameter
  matches a piece of TEXT - "every curtain wall of type Atrium Glass", "every
  door of type Office Single", "every VCD", "mark begins with AHU" - optionally
  bounded to a list of categories.

  Three names are understood beyond real parameters, because they are what a
  modeller actually says: **Family**, **Type**, and **Family and Type**. The
  last one matches against `Family : Type` the way Revit's own properties
  palette writes it - "Curtain Wall : Storefront". So "select every curtain
  wall of type Storefront" is Type equals Storefront, in Walls.

  **AN ELEMENT THAT DOES NOT CARRY THE PARAMETER IS COUNTED, NEVER MATCHED -
  not even by a "does not contain" query.** Treating a missing parameter as an
  empty string is the obvious code and it is wrong in one direction that
  matters: "everything whose Mark is not ABC" then returns every element in the
  model, including the thousands that have no Mark at all. They are reported as
  `withoutParameter` instead, which also means a MISTYPED parameter name comes
  back as "0 matched, 4,812 do not carry it" rather than as a plausible zero.

  **A text mode matches text, and a number is not text.** A length, an airflow
  or a pressure is stored as a double and only becomes "500" after Revit
  formats it - in the project's display units, with the project's rounding and
  separators. Searching for "500" as text finds it in a millimetre project,
  misses it in a metre one, and misses 500.4 rounded to "500" in neither
  predictably. The NUMERIC modes compare the stored number instead, and are
  the right answer for anything with a unit.

  **Type parameters are searched after instance parameters, and only if asked.**
  A name that exists on both wins at the instance, which is the same order
  Revit's own schedules use.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, every loaded link is read too and
  `linksSearched` says how many were: set and 0 means "you asked, and none
  are loaded", which is a different answer from host-only. The same match runs in each link and its
  matches are counted per link in `linkedMatches`.
  **NOTHING FROM A LINK IS EVER SELECTED OR CARRIED** - `elements` stays this model's own; the chain
  revives ids against this model, and a linked id that happens to be in
  use here binds an unrelated element (FRAGMENT-ISSUES row 75). Links
  nested inside a link are not read, and are counted in the answer. This
  is version 2; version 1's proof no longer describes the code, and the
  fragment is DRAFT until it is proved again.

  **VERSION 4 ALSO FINDS BY FAMILY AND COMPARES NUMBERS** - SELECT_BY_FAMILY
  and SELECT_BY_NUMERIC_PARAMETER were merged in. Family as the parameter
  finds every element of a named family wherever it is, the category
  optional, `exactMatch` for one family whose name another contains; the
  families that matched are counted in `matchedFamilies` and an unbounded
  sweep is said in `scannedWholeModel`. Modes gt, gte, lt, lte, between, eq and
  ne compare a stored number - "ducts 500 mm high", "pipes larger than 100" -
  with `compareValue` in Revit's internal unit (500 mm is 500/304.8), eq to a
  tolerance, and a parameter held as text is counted in `notNumeric`.

# A NAME TWO PARAMETERS SHARE IS NEVER READ, AND THE ELEMENT IS NEVER MATCHED -
# it is counted in `ambiguous` (D-54 s3, FRAGMENT-ISSUES 5b-203; added
# 2026-10-09, see that provide). Written here and not in `purpose` on purpose:
# the purpose is embedded for routing, and a sentence about this in it moved
# other cards' utterances in check-routing, measured against the base commit.
contract:
  needs:
    - name: doc
      type: Document
    - name: parameterName
      type: string
      source: request
    - name: matchText
      type: string
      source: request
    # ONE OF: contains (also what an empty value means), equals, begins, ends,
    # notcontains, notequals - whatever the capitals; "exact" and "is" are
    # read as equals. Any other word is REFUSED before anything is scanned,
    # naming these (version 3, row 5b-1319): until then an unknown word fell
    # through to contains in silence and widened a selection that fed a delete.
    - name: matchMode
      type: string
      source: request
    - name: includeTypeParameters
      type: bool
      source: request
    - name: categories
      type: IList<BuiltInCategory>
      source: request
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
    # Version 4, from SELECT_BY_FAMILY: true is matchMode equals - one family
    # whose name another contains. Left out, false. Beside a mode that is not
    # equals or contains it is refused.
    - name: exactMatch
      type: bool
      source: request
      optional: true
    # Version 4, from SELECT_BY_NUMERIC_PARAMETER: the number a numeric mode
    # (gt, gte, lt, lte, between, eq, ne) compares with, IN REVIT'S INTERNAL
    # UNIT - a length in feet, so 500 mm is 1.6404. Left out, a number typed as
    # matchText is used; neither is refused.
    - name: compareValue
      type: double
      source: request
      optional: true
      absent: NaN
    # Version 4: the upper bound of between, in the same internal unit.
    - name: compareValueMax
      type: double
      source: request
      optional: true
      absent: NaN
    # Version 4: how close eq and ne mean, internal units. Left out or 0 it is
    # 1/304.8 - one millimetre if a length.
    - name: tolerance
      type: double
      source: request
      optional: true
      absent: 0
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: withoutParameter
      # Elements that do not carry the parameter, counted and NEVER matched.
      # What makes a mistyped name come back as 0 matched, 4,812 do not carry
      # it rather than as a plausible zero - never a match (D-52).
      role: accounting
      type: int
    - name: ambiguous
      # Elements carrying TWO OR MORE parameters by this name - on the
      # element, or on its type when the search reached it - where Revit's
      # lookup would pick one at random. Not tested and never matched: which
      # one was meant is the modeller's to say (D-54 s3, FRAGMENT-ISSUES
      # 5b-203). Turned down, never found (D-52).
      role: accounting
      type: int
    - name: findings
      type: IList<string>
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then one line per link. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75).
      role: accounting
      type: IList<string>
    - name: notNumeric
      # Version 4, from SELECT_BY_NUMERIC_PARAMETER. For a numeric mode, the
      # elements carrying the parameter as TEXT, so no comparison was
      # possible. Given and unusable, never a match (D-52).
      role: accounting
      type: int
    - name: matchedFamilies
      # Version 4, from SELECT_BY_FAMILY. Every match counted by its family -
      # a contains that caught more families than meant shows which.
      role: result
      type: IDictionary<string, int>
    - name: scannedWholeModel
      # Version 4, from SELECT_BY_FAMILY. True when no category bounded the
      # sweep - how it ran, never what it found.
      role: accounting
      type: bool
    - name: found
      # Version 4, from SELECT_BY_FAMILY: how many matched, the count of
      # `elements`.
      role: result
      type: int


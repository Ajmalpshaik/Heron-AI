compatibility-note: >
  One implementation for every release. Document.Paint, RemovePaint and
  IsPainted, HostObjectUtils.GetSideFaces, GetTopFaces and GetBottomFaces,
  Reference.ConvertToStableRepresentation, Face.ComputeNormal, Evaluate and
  GetBoundingBox, and Options.ComputeReferences are present 2020 through 2027 -
  read off RevitAPI.xml in the Nice3point reference packages for all eight
  releases on 2026-10-12.

# ROUTING - the same rows are in the fragments named here.
#
#   "paint the window reveals white"          -> here, faces reveals
#   "paint the tops of these slabs"           -> here, faces top
#   "change the wall's material"              -> REPLACE_MATERIAL - the type,
#                                                for every wall of it

utterances:
  - paint the window and door reveals with this material
  - paint the tops of these slabs with epoxy
  - paint the exterior face of these walls
  - remove the paint from these walls

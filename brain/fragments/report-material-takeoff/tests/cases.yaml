# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: several walls with a compound structure
    expect: >
      an area and a volume per layer material, matching a Revit Material
      Takeoff schedule of the same elements line for line. Revit's own schedule
      is the check - a figure derived here that disagreed with it would be a
      second opinion nobody can reconcile

  - given: a wall with a PAINTED face
    expect: >
      the painted material present WITH AN AREA. Reading only the geometry set
      reports it as zero, which on a finishes schedule reads as "that material
      is not in this model" rather than "I did not ask for it"

  # VERSION 3 - REPORT_EMBODIED_CARBON merged in. Each fails on version 2,
  # which took no factorParameter and had no carbon, totalKg or noFactor.
  - given: >
      VERSION 3. Two concrete floors of 10 m3 each, the material Concrete
      carrying a Number parameter "Carbon Factor" of 300, factorParameter
      "Carbon Factor", groupBy left out, top 0 - REPORT_EMBODIED_CARBON's own case
    expect: >
      totalKg 6000 and the Concrete line first in `carbon` with 6000 kgCO2e,
      20 m3, 100%; volumes and areas exactly as without the factor

  - given: VERSION 3. One of the floors handed in twice, the factor 300
    expect: >
      totalKg 3000 - taken off once. REPORT_EMBODIED_CARBON gave 6000

  - given: VERSION 3. factorParameter left out
    expect: >
      carbon empty, totalKg 0, noFactor empty, noVolume 0 - the takeoff alone,
      version 2's to the number

negative:
  # VERSION 3 - the carbon negative; fails on version 2, which had no noFactor.
  - given: VERSION 3. The same floors with the Carbon Factor parameter cleared
    expect: >
      totalKg 0 and noFactor naming Concrete - never a factor guessed

  - given: a material applied ONLY as paint, nowhere in any geometry
    expect: >
      an area and NO volume entry. Paint is a surface, not a body - the missing
      volume is the correct answer, and a 0 there would price as "no material"

  - given: >
      the same material used BOTH in a wall's structure and as paint on another
      element
    expect: >
      one row, areas added, and the volume covering only the structural use.
      The two flags must not double-count the same face, and must not silently
      drop one use for having the name already

  - given: an element with no materials at all - a generic family, a line
    expect: >
      its id in `elementsWithNoMaterial` and no throw. Nothing to take off is a
      real answer, and it must be distinguishable from an element skipped by an
      exception

  - given: >
      a material whose area comes back 0 because the element is a symbol or has
      no geometry in this phase
    expect: >
      no row for it, rather than a 0 row. A zero line in a takeoff is priced as
      a real material that is present in no quantity, which is a different claim
      from not being there

  # VERSION 2 - READ_ELEMENT_MATERIAL merged in. Each fails on version 1.
  - given: the same wall handed in twice (two finders' lists merged)
    expect: >
      its materials taken off ONCE - the volume equal to one wall's. Version 1
      counted it twice

  - given: a compound wall of concrete, insulation and board, one face painted
    expect: >
      `materials` names ALL FOUR for that wall - the three layers and the
      paint; READ_ELEMENT_MATERIAL named three, reading the geometry set alone

  - given: 28 duct taps that carry no material
    expect: >
      all 28 in `noMaterial` and in `elementsWithNoMaterial`, `materials` empty

  - given: 4 walls, 'Exterior - Brick on Mtl. Stud'
    expect: >
      `volumeM3` equal to `volumes` times 0.028316846592 for every material,
      `areaM2` to `areas` times 0.09290304 - and `volumes` still in cubic feet,
      unchanged from version 1

second_route:
  - >
    build a Material Takeoff schedule in Revit for the same category and compare
    line by line - it is the same engine, so a disagreement means this is
    reading the wrong flag

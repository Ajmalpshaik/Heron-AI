compatibility-note: >
  One implementation for every release. `Element.GetMaterialIds`,
  `GetMaterialArea` and `GetMaterialVolume` are unchanged 2020 to 2027. Areas
  and volumes are handed on in Revit's internal square feet and cubic feet
  without touching a units API - D-20 keeps the conversion at the edge where the
  user is, and avoiding the units API is what keeps this clear of the 2021 move.
  Materials are keyed by NAME rather than by id, because a takeoff is read and
  priced by name and an id would have to be resolved again by every caller.


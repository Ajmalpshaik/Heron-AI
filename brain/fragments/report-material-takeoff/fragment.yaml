# VERSION 3 (2026-11-01) - REPORT_EMBODIED_CARBON WAS MERGED INTO THIS CARD on
# the owner's instruction ("make sure there is no duplicate tools", then "ok go
# ahead merge all"), and is DEPRECATED. The same reading - each element's
# material volumes, from Revit's own takeoff - with one sum more. What it had
# and this card lacked: a carbon factor read off each MATERIAL from the Number
# parameter the modeller names (`factorParameter`, kgCO2e per cubic metre);
# kg = m3 x factor; grouped by material, category or type (`groupBy`), largest
# first, the top N listed (`top`, 0 meaning 20) with each group's share; the
# materials with no factor named in `noFactor` and adding nothing, never a
# factor guessed; the elements with no volume counted in `noVolume`. Its
# outputs - `carbon`, `totalKg`, `noFactor`, `noVolume`, `findings` - are here
# under the same names and types. Left out, `factorParameter` reads "none" and
# no carbon is worked out: the takeoff is version 2's to the number.
#
# ONE RULE WAS NOT CARRIED, AS THE LESS SAFE OF TWO: REPORT_EMBODIED_CARBON
# took an element handed in twice twice, doubling its carbon; this card takes
# it off ONCE, as it takes its volumes. And a material id Revit hands back that
# is no Material is skipped here, as this card's takeoff always skipped it -
# that card keyed one by its id. Nothing else of that card is left out.
#
# DRAFT, as version 2 was: version 1's proof no longer describes the code and
# is kept as the record; proved again on a real model (D-30).

purpose: >
  Area and volume of each material across a set of elements, taken from Revit's
  own takeoff engine rather than recomputed from geometry - so the numbers agree
  with a Material Takeoff schedule instead of being a second opinion nobody can
  reconcile.

  **PAINT AND GEOMETRY ARE TWO SEPARATE MATERIAL SETS AND ASKING FOR ONE MISSES
  THE OTHER ENTIRELY.** An element's geometric and compound-structure materials
  are one set. Materials applied face by face with Paint are a different set,
  reached by a different flag - and the area call must be given the SAME flag it
  was listed with. Read only the geometry set and a painted finish reports as
  ZERO, which on a finishes schedule reads as *"that material is not in this
  model"* rather than *"I did not ask for it"*. Both sets are read, and
  `paintedMaterials` says which came from where.

  **PAINT HAS AREA AND NEVER VOLUME.** Paint is a surface, not a body, so there
  is no volume to ask for. A painted material therefore has an area and NO
  volume entry, and that absence is the correct answer rather than missing data.
  It is also why the result is not sorted by volume anywhere - doing so buries
  every painted finish at the bottom of a finishes schedule.

  **THE NUMBERS ARE REVIT'S, NOT THIS FRAGMENT'S.** Nothing is derived from
  solids here. That is deliberate: a takeoff computed independently produces a
  defensible figure that disagrees with the model's own schedule, and two
  numbers that both look right is worse than one that is plainly wrong.

  **IT ALSO SAYS WHAT EACH ELEMENT IS MADE OF** (version 2, when
  READ_ELEMENT_MATERIAL was merged in): `materials` names every material of
  each element, painted ones included, `noMaterial` the elements carrying
  none, and the totals come in cubic and square metres beside Revit's own
  units. An element handed in twice is taken off once. Version 1's proof no
  longer describes the code and is kept as a record; DRAFT until it is proved
  again.

  **AND THE EMBODIED CARBON, WHEN A FACTOR IS NAMED** (version 3): each
  material's volume times the carbon factor stored on the material, grouped
  by material, category or type, largest first - the hotspots lead - with the
  materials that have no factor named rather than counted as zero.

contract:
  needs:
    - name: elements
      type: IList<Element>
    - name: doc
      type: Document
      source: ambient
    # VERSION 3, from REPORT_EMBODIED_CARBON. The MATERIAL parameter holding
    # kgCO2e per cubic metre, e.g. "Carbon Factor" - a Number. Left out it
    # reads "none": no carbon is worked out.
    - name: factorParameter
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 3. "material", "category" or "type"; left out, material.
    - name: groupBy
      type: string
      source: request
      optional: true
      absent: material
    # VERSION 3. How many groups to list; 0, or left out, means 20.
    - name: top
      type: int
      source: request
      optional: true
      absent: '0'
  provides:
    - name: areas
      role: result
      type: IDictionary<string, double>
    - name: volumes
      role: result
      type: IDictionary<string, double>
    - name: paintedMaterials
      # Materials applied face by face with Paint. PAINT AND GEOMETRY ARE TWO
      # SEPARATE MATERIAL SETS AND ASKING FOR ONE MISSES THE OTHER ENTIRELY -
      # so these are their own answer, not a footnote.
      role: result
      type: IList<string>
    - name: elementsWithNoMaterial
      # Elements carrying no material at all, so it could not be taken off.
      # The evidence it looked, never a thing it found (D-52). Also holds an
      # element whose materials gave no area and no volume; `noMaterial` is
      # the narrower list.
      role: accounting
      type: IList<ElementId>
    - name: materials
      # Version 2, from READ_ELEMENT_MATERIAL. Per element, the name of every
      # material it carries - geometry and paint - a material with no volume
      # still named.
      role: result
      type: IDictionary<ElementId, ICollection<string>>
    - name: noMaterial
      # Version 2, from READ_ELEMENT_MATERIAL. Elements carrying NO material
      # at all. The evidence it looked, never a thing found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: volumeM3
      # Version 2, from READ_ELEMENT_MATERIAL. `volumes` in cubic metres,
      # beside them - `volumes` keeps Revit's cubic feet.
      role: result
      type: IDictionary<string, double>
    - name: areaM2
      # Version 2. `areas` in square metres, beside them - `areas` keeps
      # Revit's square feet.
      role: result
      type: IDictionary<string, double>
    - name: carbon
      # VERSION 3, from REPORT_EMBODIED_CARBON. ONE STRING, a line per group,
      # largest first: kgCO2e, m3 and share of the total. Empty when no
      # factorParameter was named.
      role: result
      type: string
    - name: totalKg
      # VERSION 3. The embodied carbon in kgCO2e - m3 x factor over every
      # material with a factor. 0 when none was named.
      role: result
      type: double
    - name: noFactor
      # VERSION 3. Materials with no value in factorParameter - they add
      # nothing to the total, said aloud (D-52).
      role: accounting
      type: IList<string>
    - name: noVolume
      # VERSION 3. Elements whose materials have no volume, so no carbon
      # (D-52). Counted only when a factor was named.
      role: accounting
      type: int
    - name: findings
      # VERSION 3. The totals in words - the carbon, the materials with no
      # factor, and what was taken off.
      type: IList<string>


compatibility-note: >
  One implementation for every release. `Element.GetMaterialIds`,
  `GetMaterialArea` and `GetMaterialVolume` are unchanged 2020 to 2027. Areas
  and volumes are handed on in Revit's internal square feet and cubic feet
  without touching a units API - D-20 keeps the conversion at the edge where the
  user is, and avoiding the units API is what keeps this clear of the 2021 move.
  Materials are keyed by NAME rather than by id, because a takeoff is read and
  priced by name and an id would have to be resolved again by every caller.
  Version 3's carbon reads Element.LookupParameter on each material, present
  2020 through 2027 - read off RevitAPI.xml in the Nice3point reference
  packages for all eight releases on 2026-10-12, for REPORT_EMBODIED_CARBON.
  The factor is a Number, so no units conversion is applied to it; the volume
  is converted once, 1 ft3 = 0.028316846592 m3.

# ROUTING - the same rows are in the fragments named here.
#
#   "change the material on these"   -> REPLACE_MATERIAL
#   "make a floor slab over this area" -> CREATE_FLOOR
#   "make a new material"            -> CREATE_STARTER_MATERIALS


# ROUTING (2026-10-12, the gap fill)
#
#   "what is the embodied carbon"           -> here, factorParameter (version 3,
#                                              REPORT_EMBODIED_CARBON merged in)
#   "which materials have the most carbon"  -> here, groupBy material
#   "set the carbon factor on these materials" -> WRITE_ELEMENT_PARAMETERS on the
#                                              materials
# ROUTING (2026-10-14, FRAGMENT-ISSUES row 5b-471) - repeated in READ_ELEMENT_MATERIAL.
# The two cards overlap and neither named the other until then.
#
#   "give me a material takeoff"       -> here - the numbers a Material Takeoff schedule
#                                         shows, paint included
#   "what material is this"            -> here since version 2 - `materials`, what
#                                         each element is made of; `volumeM3`
#   "what is this wall made of"        -> REPORT_COMPOUND_STRUCTURE - the LAYERS of
#                                         the type, with their thicknesses
#   "what is this element"             -> DESCRIBE_ELEMENTS - category and type
#   "what is the volume"               -> MEASURE_ELEMENT_VOLUME - the whole solid,
#                                         whatever it is made of
#
# READ_ELEMENT_MATERIAL WAS MERGED INTO THIS CARD on 2026-11-01, on the owner's
# instruction ("make sure there is no duplicate tools"), and is DEPRECATED.
# Its outputs, here now: `materials` and `noMaterial` (the same names and
# types), `volumeM3` (the same, m3). Nothing not carried. One of its defects is
# NOT carried: it read GetMaterialIds(false) alone - the geometry set - while
# its purpose said painted finishes were kept, so every painted material was
# missing from its answer. This card reads both sets.


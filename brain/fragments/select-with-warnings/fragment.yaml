revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Document.GetWarnings`,
  `FailureMessage.GetSeverity`, `GetDescriptionText`, `GetFailingElements` and
  the `FailureSeverity` enum are present 2020 through 2027, compiled at both
  ends. Duplicate ids are removed by comparing ElementId to ElementId, never by
  reading either as a number.

# ROUTING - repeated in READ_MODEL_WARNINGS, FIND_CLASHES and
# CHECK_FAMILY_STANDARDS.
#
#   "select everything with a warning" -> here
#   "fix the slightly off axis warnings" -> STRAIGHTEN_OFF_AXIS_LINES, after this
#                                       selects them (2026-10-12)
#   "isolate the error level warnings" -> here with errorsOnly, then
#                                       ISOLATE_ELEMENTS
#   "what warnings does this
#    model have"                     -> READ_MODEL_WARNINGS - the list to read,
#                                       grouped and counted
#   "show me the duplicate
#    instances"                      -> FIND_DUPLICATE_ELEMENTS, which is the
#                                       fragment built for it. Revit does raise
#                                       identical-instance WARNINGS, so this one
#                                       finds them too if a description phrase
#                                       is given - but the dedicated check is
#                                       the better answer and does not depend on
#                                       Revit having noticed
#   "what clashes"                   -> FIND_CLASHES. A clash is not a Revit
#                                       warning and will never appear here
#   "are the families named
#    properly"                       -> CHECK_FAMILY_STANDARDS - a standard is
#                                       ours, a warning is Revit's

utterances:
  - select everything with a warning
  - show me the elements revit is warning about
  - isolate the error level warnings
  - find elements with duplicate instances warning
  - which elements have warnings

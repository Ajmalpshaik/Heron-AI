id: FRG-ELE-132
semantic-identity: "put a wall by face on every side face of these masses"
kind: action
domain: revit.elements
capability: CREATE_WALLS_BY_FACE
version: 1
source: OFFICIAL
risk: MODIFY

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# The step from a massing study to a building: Massing & Site > Wall by Face
# puts walls on a mass's faces, and they stay tied to the faces, so Update to
# Face follows the mass when the scheme changes. By hand it is face by face;
# this does every side face of the masses given.
#
# WALLS ONLY. A curtain system type is refused by name and sent to
# CREATE_CURTAIN_SYSTEM (FRG-ELE-127), which makes Curtain System by Face -
# one job, one card. This card was written as CREATE_ELEMENTS_BY_FACE, doing
# both, and narrowed to walls on 2026-10-29 when CREATE_CURTAIN_SYSTEM
# reached main first.
#
# FLOOR BY FACE AND ROOF BY FACE HAVE NO API - no face-floor or face-roof
# class and no creation call in the reference assemblies of any release
# 2020 to 2027, read 2026-10-28. A floor or roof type is refused by name with
# the route that exists: REPORT_MASSES' outlines handed to CREATE_FLOOR - a
# slab that does not follow the mass - or Floor by Face and Roof by Face by
# hand.
#
# THE FACES BY WHICH WAY THEY FACE: sides (empty) is every face not facing
# straight up or down, as a building's walls are; vertical, upright faces
# only, to within one degree. Revit's own IsValidFaceReferenceForFaceWall
# decides which of them take a wall, and the faces it refuses are counted,
# not guessed at.
#
# THE FACE REFERENCES ARE READ THROUGH THE FAMILY'S OWN GEOMETRY -
# GeometryInstance.GetSymbolGeometry() with no transform, which RevitAPI.xml's
# remarks on GetInstanceGeometry name as the only geometry "suitable for
# creating new Revit elements referencing the original element". The
# instance's transform turns the normals into the model's directions only.
# CREATE_CURTAIN_SYSTEM reads its faces the same way.
#
# THE LOCATION LINE DEFAULTS TO FINISH FACE: EXTERIOR - the wall's outside
# face on the mass face, so the massing's outside is the building's - and the
# answer says that is Heron's default, not Revit's.
#
# A MASS ALREADY CARRYING WALLS BY FACE is skipped by name, read off
# MassInstanceUtils.GetJoinedElementIds, so a second run never doubles the
# skin. That the list holds walls by face is NEEDS-CHECKING JN11.
#
# READ BACK, ALL OR NOTHING: every wall made is read again - its type and
# its area; one that fails takes every wall made in the call back out.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Wall by Face on conceptual masses - one wall of the wall type named on
  every side face of the masses given, tied to the faces so Update to Face
  follows the mass.

contract:
  needs:
    - name: doc
      type: Document
    # The masses - selected, or REPORT_MASSES' elements through expect_from.
    - name: elements
      type: IList<Element>
    # A wall type, by "Family : Type" or its name.
    - name: wallType
      type: string
      source: request
    # sides (empty) or vertical.
    - name: faces
      type: string
      source: request
      optional: true
    # finish face exterior (empty), finish face interior, wall centerline,
    # core centerline, core exterior, core interior.
    - name: locationLine
      type: string
      source: request
      optional: true
  provides:
    - name: created
      role: result
      type: int
    - name: createdIds
      role: result
      type: IList<ElementId>
    - name: skipped
      # Masses that already carried walls by face, or had no face Revit took
      # (D-52).
      role: accounting
      type: int
    - name: report
      # ONE STRING, mass by mass (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. FaceWall.Create,
  IsValidFaceReferenceForFaceWall and IsWallTypeValidForFaceWall;
  MassInstanceUtils.GetJoinedElementIds; and GeometryInstance.GetSymbolGeometry
  and Transform are present 2020 through 2027 - read with tools/api-surface
  on 2026-10-28.

# ROUTING - the same rows are in the fragments named here.
#
#   "put walls on the faces of the mass"          -> here
#   "curtain system by face on this mass"         -> CREATE_CURTAIN_SYSTEM
#   "make a wall along these points"              -> CREATE_WALL
#   "add mass floors at every level"              -> CREATE_MASS_FLOORS

utterances:
  - put walls by face on the sides of this mass
  - make a wall by face on every face of the massing
  - turn the mass faces into walls
  - wall by face on the tower mass with the exterior wall type

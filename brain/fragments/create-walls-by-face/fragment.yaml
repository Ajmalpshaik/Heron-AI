heron-agent: HERON-REVIT-ELE-010
heron-step: 17
heron-status: DRAFT
heron-since: 0.1.0
heron-layer: brain

id: FRG-ELE-129
semantic-identity: "turn the faces of these masses into walls by face or a curtain system by face"
kind: action
domain: revit.elements
capability: CREATE_ELEMENTS_BY_FACE
version: 1
source: OFFICIAL
risk: MODIFY

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# The step from a massing study to a building: Massing & Site > Model by
# Face puts walls and curtain systems on a mass's faces, and they stay tied
# to the faces, so Update to Face follows the mass when the scheme changes.
# By hand it is face by face; this does every face of the masses given.
#
# WHAT IS MADE FOLLOWS FROM THE TYPE NAMED, so no kind is asked: a wall type
# makes Wall by Face, one wall per face; a curtain system type makes Curtain
# System by Face, one system per mass over every face chosen (Revit's own
# remark on NewCurtainSystem2: one system per mass).
#
# FLOOR BY FACE AND ROOF BY FACE HAVE NO API - no face-floor or face-roof
# class and no creation call in the reference assemblies of any release
# 2020 to 2027, read 2026-10-28. A floor or roof type is refused by name with
# the route that exists: REPORT_MASSES' outlines handed to CREATE_FLOOR - a
# slab that does not follow the mass - or Floor by Face and Roof by Face by
# hand.
#
# THE FACES BY WHICH WAY THEY FACE: sides (empty) is every face not facing
# straight up or down, as a building's walls are; vertical, upright faces
# only; up, every face facing upward - a glazed roof's curtain system; all.
# For a wall, Revit's own IsValidFaceReferenceForFaceWall decides which of
# those take a wall, and the faces it refuses are counted, not guessed at.
#
# THE LOCATION LINE DEFAULTS TO FINISH FACE: EXTERIOR - the wall's outside
# face on the mass face, so the massing's outside is the building's - and the
# answer says that is Heron's default, not Revit's.
#
# A MASS ALREADY CARRYING WALLS BY FACE (or a curtain system, for a curtain
# system) is skipped by name, read off MassInstanceUtils.GetJoinedElementIds,
# so a second run never doubles the skin.
#
# The face references come from the mass's own geometry first and the
# family's geometry it carries second; the answer names which Revit took -
# NEEDS-CHECKING Group JJ records it.
#
# READ BACK, ALL OR NOTHING: every element made is read again - its type, a
# wall's area, a curtain system's grids; one that fails takes everything
# made in the call back out.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Model by Face on conceptual masses - Wall by Face with a wall type, or
  Curtain System by Face with a curtain system type - on every side face of
  the masses given, tied to the faces so Update to Face follows the mass.

contract:
  needs:
    - name: doc
      type: Document
    # The masses - selected, or REPORT_MASSES' elements through expect_from.
    - name: elements
      type: IList<Element>
    # A wall type or a curtain system type, by "Family : Type" or its name.
    - name: typeName
      type: string
      source: request
    # sides (empty), vertical, up or all.
    - name: faces
      type: string
      source: request
      optional: true
    # Walls only: finish face exterior (empty), finish face interior, wall
    # centerline, core centerline, core exterior, core interior.
    - name: locationLine
      type: string
      source: request
      optional: true
  provides:
    - name: created
      role: result
      type: int
    - name: createdIds
      role: result
      type: IList<ElementId>
    - name: skipped
      # Masses that already carried them, or had no face Revit took (D-52).
      role: accounting
      type: int
    - name: report
      # ONE STRING, mass by mass (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. FaceWall.Create,
  IsValidFaceReferenceForFaceWall and IsWallTypeValidForFaceWall;
  Document.Create.NewCurtainSystem2(ReferenceArray, CurtainSystemType);
  CurtainSystem.CurtainGrids; MassInstanceUtils.GetJoinedElementIds; and
  GeometryInstance.GetInstanceGeometry, GetSymbolGeometry and Transform are
  present 2020 through 2027 - read with tools/api-surface on 2026-10-28.

# ROUTING - the same rows are in the fragments named here.
#
#   "put walls on the faces of the mass"          -> here, a wall type
#   "curtain system by face on this mass"         -> here, a curtain system type
#   "make a wall along these points"              -> CREATE_WALL
#   "add mass floors at every level"              -> CREATE_MASS_FLOORS
#   "floor by face on the mass floors"            -> REPORT_MASSES withOutlines, then CREATE_FLOOR

utterances:
  - put walls by face on the sides of this mass
  - make a wall by face on every face of the massing
  - add a curtain system by face to this mass
  - turn the mass into walls and glazing by face
  - cover the mass faces with a curtain system

id: FRG-PAR-001
semantic-identity: "reads one named parameter off every element"
kind: action
domain: revit.parameters
capability: READ_ELEMENT_PARAMETERS
version: 4
source: OFFICIAL
risk: READ

purpose: >
  Reads one named parameter off every element, and says which of three things
  was true for each: it had a value, it had the parameter but blank, or it did not
  have the parameter at all.

  **VERSION 2 FIXED TWO WAYS THIS SAID `absent` WHILE THE VALUE WAS RIGHT
  THERE.** Version 1 asked `LookupParameter` and nothing else, which is correct
  for an instance parameter and wrong for most of what gets asked:

  | Asked for | v1 answered | Why it was wrong |
  |---|---|---|
  | A **type** parameter - size, fire rating, manufacturer | `absent`, every element | Most schedule columns live once on the type, not per instance |
  | **"Level"** on walls or ducts | `absent` for both | A wall has no level-named parameter at all; a duct calls it "Reference Level" |

  The second is the dangerous one. Across a mixed set, air terminals answered
  and walls and ducts did not, so the report read *"most of this model has no
  level"* - which is not a thing that can be true, and looks like a modelling
  problem rather than a reading one.

  The type is now asked **second**, never first, so an instance parameter of the
  same name still wins - that is the one the modeller edited. `resolvedFrom`
  records which answered, because *"they share one value"* and *"they each carry
  the same value"* are different findings with different fixes.

  **LEVEL IS THE ONLY SPECIAL CASE.** Category, Family and Type are how a table
  is labelled rather than something read off an element, and D-20 keeps that at
  the edge where the user is.

  **"Text" on a text note is what the note says** (version 3): its wording,
  with each paragraph's list type - and (version 4) whether it is a numbered
  or bulleted list and which paragraphs are bold, italic or underlined.

# VERSION 3 (2026-10-17, FRAGMENT-ISSUES 5b-520). Kept out of the purpose on
# purpose: the purpose is searched, and a paragraph about notes and lists would
# pull other cards' questions.
#
#   NO HERON TOOL READ WHAT A TEXT NOTE SAYS. Asked "read what the text notes in
#   the open view say", the lookup answered LIST_DATES_ON_SHEETS and
#   EXTRACT_DATES_FROM_TEXT, and the chat had to send scratch code. This card
#   could not do it either: MEASURED 2026-10-17, Revit 2020, LookupParameter
#   ("Text") on a TextNote is null and GetParameters("Text") is empty, so every
#   note answered `absent`.
#
#   So parameterName Text on a TEXT NOTE reads the note itself, by the rule
#   EDIT_TEXT_VALUES writes it by - its plain text without the closing carriage
#   return Revit always adds. `values` holds that wording, `resolvedFrom` says
#   "note", and `noteWording` (a string, because a dictionary reaches a chat as
#   a count) shows each note on one line: paragraph ends as \r, soft line
#   breaks (Shift+Enter) as \v and a backslash as \\ - the marks
#   EDIT_TEXT_VALUES takes back - then each paragraph's list type, indent and
#   start number, then any character a keyboard does not type plainly (the
#   curly apostrophe U+2019 that was in the real note). Past 20,000 characters
#   the rest are counted, not printed. Anything that is not a text note, and
#   any other name, reads exactly as version 2 did.
#
#   Version 2's proof below no longer describes the code and is kept as a
#   record; the card is DRAFT until the version 3 proof is signed.

# VERSION 4 (2026-10-17, FRAGMENT-ISSUES 5b-737). EDIT_TEXT_VALUES version 5's
# mode format can now SET a note's lists and its bold, italic and underline, so
# the check reads all of it: `noteWording` adds each paragraph's bold, italic
# and underline - "bold 1; partly bold 3; underline 5-6" - and every list's own
# start number, where version 3 read the first paragraph's only. A note with
# none of the three says nothing about them. NOT RUN IN REVIT: compiled for all
# eight releases; GetBoldStatus, GetItalicStatus and GetUnderlineStatus read the
# same in RevitAPI 2020 to 2027 (tools/api-surface, one release at a time).
# Version 3's proof draft, made 2026-10-17 on the owner's PC, no longer
# describes this code; the proof plan is NEEDS-CHECKING group FD.

contract:
  needs:
    # THE COMMENT DIRECTLY ABOVE `parameterName` is printed under it by
    # heron_resolve and heron_lookup (heron_fragment.need_notes), and is never
    # searched, so it moves no routing (FRAGMENT-ISSUES 5b-975). This one sits
    # above `elements`, which nobody types, and is never printed.
    - name: elements
      type: IList<Element>
    # The parameter's name. Text on a text note reads what the note says:
    # noteWording shows \r at a paragraph end, \v at a Shift+Enter line break
    # and \\ for one backslash - typed the same way into EDIT_TEXT_VALUES. The
    # text notes of one view: run SELECT_VISIBLE_IN_VIEW with view=<the view>
    # and categories=Text Notes first, then this with parameterName=Text and
    # expect_from="select-visible-in-view".
    - name: parameterName
      type: string
      source: request
  provides:
    - name: values
      role: result
      type: IDictionary<ElementId, string>
    - name: blank
      # Elements that carry it and hold nothing. Also evidence it looked -
      # an empty value is not a value found.
      role: accounting
      type: IList<ElementId>
    - name: absent
      # Elements handed in that do NOT carry the parameter at all. The
      # evidence it looked, never a value it read (D-52).
      role: accounting
      type: IList<ElementId>
    - name: resolvedFrom
      # Whether each value came off the instance or off its type. "THEY SHARE
      # ONE VALUE" AND "THEY EACH CARRY THE SAME VALUE" ARE DIFFERENT FINDINGS
      # WITH DIFFERENT FIXES, and this is what tells them apart. "note" for a
      # text note's own wording (version 3), "level" for the Level case.
      role: result
      type: IDictionary<ElementId, string>
    - name: noteWording
      # Version 3. Every text note read with parameterName Text, one line each:
      # the wording with \r and \v showing, each paragraph's list type, and any
      # character not typed plainly. Version 4 adds each list's start number and
      # the paragraphs that are bold, italic or underlined. Null when no note
      # was read.
      role: result
      type: string


revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `LookupParameter`, `Element.LevelId`
  and the five level built-ins are unchanged 2020 to 2027, and no units call is
  made - the value is read as Revit's own display text, which is already in the
  project's units. `ElementId.InvalidElementId` is compared as an ElementId
  rather than through its integer, which is what keeps this clear of the 2024
  64-bit change.

# ROUTING - repeated in REPORT_GLOBAL_PARAMETERS and ADD_PROJECT_PARAMETER.
#
#   "what parameters does this duct have" -> REPORT_PARAMETER_INVENTORY - the
#                                           FULL LIST, before you know any
#                                           names. Ask that fragment FIRST and
#                                           this one second: this reads a
#                                           parameter you can already name
#   "what is the Mark on these"           -> here
#   "show me the global parameters in this model" -> REPORT_GLOBAL_PARAMETERS -
#                                           a global belongs to the MODEL, not
#                                           to any element, so nothing here can
#                                           see one
#   "add a parameter to all the doors"    -> ADD_PROJECT_PARAMETER
#   "the section mark shows the wrong    -> REPORT_VIEW_REFERENCES. A section
#    number"                                MARK is not the Mark parameter,
#                                           and its text comes from the view
#                                           it points at

utterances:
  - what is the Mark on these
  - what is the system name on these
  - read the mark values
  - get the size parameter
  - which ones have no value
  - what level are they on
  - which level is each duct on
  - what parameters does this duct have

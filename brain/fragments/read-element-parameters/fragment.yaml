id: FRG-PAR-001
semantic-identity: "reads one named parameter off every element"
kind: action
domain: revit.parameters
capability: READ_ELEMENT_PARAMETERS
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Reads one named parameter off every element, and says which of three things
  was true for each: it had a value, it had the parameter but blank, or it did not
  have the parameter at all.

  **VERSION 2 FIXED TWO WAYS THIS SAID `absent` WHILE THE VALUE WAS RIGHT
  THERE.** Version 1 asked `LookupParameter` and nothing else, which is correct
  for an instance parameter and wrong for most of what gets asked:

  | Asked for | v1 answered | Why it was wrong |
  |---|---|---|
  | A **type** parameter - size, fire rating, manufacturer | `absent`, every element | Most schedule columns live once on the type, not per instance |
  | **"Level"** on walls or ducts | `absent` for both | A wall has no level-named parameter at all; a duct calls it "Reference Level" |

  The second is the dangerous one. Across a mixed set, air terminals answered
  and walls and ducts did not, so the report read *"most of this model has no
  level"* - which is not a thing that can be true, and looks like a modelling
  problem rather than a reading one.

  The type is now asked **second**, never first, so an instance parameter of the
  same name still wins - that is the one the modeller edited. `resolvedFrom`
  records which answered, because *"they share one value"* and *"they each carry
  the same value"* are different findings with different fixes.

  **LEVEL IS THE ONLY SPECIAL CASE.** Category, Family and Type are how a table
  is labelled rather than something read off an element, and D-20 keeps that at
  the edge where the user is.

contract:
  needs:
    - name: elements
      type: IList<Element>
    - name: parameterName
      type: string
      source: request
  provides:
    - name: values
      role: result
      type: IDictionary<ElementId, string>
    - name: blank
      # Elements that carry it and hold nothing. Also evidence it looked -
      # an empty value is not a value found.
      role: accounting
      type: IList<ElementId>
    - name: absent
      # Elements handed in that do NOT carry the parameter at all. The
      # evidence it looked, never a value it read (D-52).
      role: accounting
      type: IList<ElementId>
    - name: resolvedFrom
      # Whether each value came off the instance or off its type. "THEY SHARE
      # ONE VALUE" AND "THEY EACH CARRY THE SAME VALUE" ARE DIFFERENT FINDINGS
      # WITH DIFFERENT FIXES, and this is what tells them apart.
      role: result
      type: IDictionary<ElementId, string>


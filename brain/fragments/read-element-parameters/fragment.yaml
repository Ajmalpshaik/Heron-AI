tests: tests/

compatibility-note: >
  One implementation for every release. `LookupParameter`, `Element.LevelId`
  and the five level built-ins are unchanged 2020 to 2027, and no units call is
  made - the value is read as Revit's own display text, which is already in the
  project's units. `ElementId.InvalidElementId` is compared as an ElementId
  rather than through its integer, which is what keeps this clear of the 2024
  64-bit change.

# ROUTING - repeated in REPORT_GLOBAL_PARAMETERS and ADD_PROJECT_PARAMETER.
#
#   "what parameters does this duct have" -> REPORT_PARAMETER_INVENTORY - the
#                                           FULL LIST, before you know any
#                                           names. Ask that fragment FIRST and
#                                           this one second: this reads a
#                                           parameter you can already name
#   "what is the Mark on these"           -> here
#   "show me the global parameters in this model" -> REPORT_GLOBAL_PARAMETERS -
#                                           a global belongs to the MODEL, not
#                                           to any element, so nothing here can
#                                           see one
#   "add a parameter to all the doors"    -> ADD_PROJECT_PARAMETER
#   "the section mark shows the wrong    -> REPORT_VIEW_REFERENCES. A section
#    number"                                MARK is not the Mark parameter,
#                                           and its text comes from the view
#                                           it points at

utterances:
  - what is the Mark on these
  - what is the system name on these
  - read the mark values
  - get the size parameter
  - which ones have no value
  # ADDED 2026-09-20. Measured: this sentence reached REPOINT_VIEW_REFERENCE, a
  # MODIFY. The READ it beat was FIND_UNTAGGED_ELEMENTS, and that is the WRONG
  # owner - a tag is an annotation, a Mark is an instance parameter, and an
  # element can have one without the other. No capability in the library reads
  # Mark by name; this one declares 'what is the Mark on these' and 'which ones
  # have no value', which together ARE this question. Mark is an identifier and
  # is never bulk-written, so a READ owning the sentence is the safe end of it.
  - what is missing its mark
  # ADDED 2026-09-20, ON THE OWNER'S EXPLICIT CALL, AND ALL FIVE ARE THE SAME
  # JUDGEMENT: this fragment owns the questions that ask for ONE VALUE OFF AN
  # ELEMENT. Each was measured answering a fragment that CHANGES THE MODEL -
  # AUTO_SIZE_MEP, CREATE_PIPE, CREATE_WORKSET, AUTO_SIZE_MEP and AUTO_SIZE_PIPE -
  # and in every case the READ the crossings tool named as beaten was the wrong
  # owner: a duct WEIGHT is not a size, the pipe SEGMENT TYPES a project stocks
  # are not this pipe's diameter, SELECT_BY_WORKSET answers the inverse question
  # (workset in, elements out), READ_SPACE_LOADS is about spaces rather than
  # ducts, and MEASURE_MEP_VELOCITY is a velocity in ducts rather than a flow
  # rate in a pipe. FRAGMENT-ISSUES rows 116 and 146; row 146 said to TRY this
  # fragment before writing anything new, and this is that being done.
  # 
  # THE PURPOSE ABOVE IS WHY IT FITS: version 2 exists because v1 answered
  # `absent` for TYPE parameters and names SIZE as the first example. Instance is
  # asked first and type second, so whichever carries the value answers and
  # `resolvedFrom` says which.
  # 
  # WHAT THIS DOES NOT DO, said plainly: it reads a parameter the caller NAMES,
  # so these sentences resolve to a READ that then needs `parameterName` bound -
  # Size, Diameter, Workset, Flow. That is a binding step, not an answer, and it
  # is the whole point: an unbound READ asks, where the writer it used to reach
  # acted.
  - what size is this duct
  - what is the diameter of this pipe
  - what workset is this on
  - what is the airflow in this duct
  - what is the flow rate in this pipe
  - what level are they on
  - which level is each duct on
  - what parameters does this duct have

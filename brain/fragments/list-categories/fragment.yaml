id: FRG-DOC-031
semantic-identity: "what categories does this model actually have, and the object style of each one - how it draws in Object Styles"
kind: filter
domain: revit.document
capability: LIST_CATEGORIES
# Version 2 (2026-10-14, FRAGMENT-ISSUES 5b-464): reads OBJECT STYLES as well -
# every category's and subcategory's projection line colour, projection and cut
# line weight and projection line pattern, as one string, one row per line; in
# a family the family's own category and its subcategories first. Version 1
# listed the names, the bindable count and the sub-category total, and those
# three are unchanged. An optional `everySubcategory` lists every other
# category's subcategories too; left out it is false. Nothing read a
# category's own graphics before this, so "what colour is the signature
# subcategory" was answered by a WRITE - the routing outcome D-86 does not
# leave to judgement.
# Version 3 (2026-10-17, FRAGMENT-ISSUES 5b-630): an optional `categories`
# names the rows to report - "Generic Annotations", "Generic Annotations >
# Signature", several with commas, capitals and extra spaces forgiven - and a
# new count, `styleRows`, says how many rows came back. Left out it is "all",
# version 2's answer exactly. A name the document has not got is answered with
# the nearest names it has, and no table. Asking for one subcategory's colour
# printed all 303 Object Styles rows of a family, twice in one chat. The
# identity gained "the object style of each one": the re-ranker reads only
# identity, capability and domain, and without those words "show the object
# style of Generic Annotations" reached TRANSFER_OBJECT_STYLES_BETWEEN_DOCUMENTS,
# a write, on both re-ranked backends (measured in row 5b-630).
version: 3
source: OFFICIAL
risk: READ

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# NOTHING LISTED THEM. SELECT_BY_CATEGORY_NAME returns NEAR MISSES when a name
# does not match, which is the closest thing in the library and is not a list -
# it only answers once somebody has already guessed wrong. So the question a
# modeller asks first, what is even in here, had no answer.
#
# CATEGORY NAMES ARE LOCALISED AND THE INTERNAL IDENTIFIERS ARE NOT. On a
# French or Arabic Revit the names come back in that language. That is not a
# defect to work around: it is exactly why SELECT_BY_CATEGORY_NAME exists, and
# this fragment is what tells somebody which names their machine will accept.
#
# IT LISTS WHAT THE DOCUMENT HAS, NOT WHAT REVIT KNOWS. Every release carries
# hundreds of built-in categories whether or not the model uses them. This
# reads Document.Settings.Categories, the document's own set, and reports
# sub-categories with it because that is where an object style lives.
#
# OBJECT STYLES ARE READ OFF THE CATEGORY ITSELF (version 2) - Manage > Object
# Styles in a project, the Model Objects and Annotation Objects tabs in the
# Family Editor - never off a view. A view's override of a category is
# REPORT_CATEGORY_OVERRIDES, and the two answer different questions: "what
# colour is Walls" here, "why are the walls red in this view" there. The cut
# line weight is given only where the category is cut (IsCuttable); "-"
# otherwise. Solid is the solid pattern's own id; "none" is no pattern, no
# weight or no colour set.
#
# ONE STRING, ONE LINE PER ROW: `objectStyles`. Its first line says what the
# rows are and what was left out, its second names the columns. A reply shows a
# list as its first three items, each cut to sixty characters, and a string
# whole (RevitFragment.Describe), so the rows travel as text.
#
# LEFT OUT, NARROWED BY ONE SWITCH. In a family the family's own category
# (doc.OwnerFamily.FamilyCategory) and every subcategory of it come first; every
# other category follows as its own row, sorted by name, and its subcategories
# only with `everySubcategory` - a project has hundreds, and a reply would carry
# every one.
#
# NARROWED BY NAME (version 3). Row 5b-464 left this out because the add-in
# then bound an absent value only for an optional bool. Since row 5b-488 a
# need marked `optional: true` with `absent: <text>` is read, when left out,
# as if that text had been typed (HeronBindingNote.DeclaredAbsent) - so
# `categories` is a string with `absent: all`, and no caller of version 2 has
# to send it. A category named alone is its own row and every subcategory of
# it; "category > subcategory" is that one row; a bare name no category has is
# every subcategory of that name, under whichever categories have one. Rows
# come in the order asked, each once. `everySubcategory` does nothing to a
# narrowed answer, and the first line says so when it is set.
#
# A NAME IT HAS NOT GOT IS ANSWERED WITH THE NEAREST NAMES, NEVER AN EMPTY
# TABLE. A column line over no rows reads as "nothing there"; what is true is
# "not by that name". With nothing matched, objectStyles is one line - what was
# asked and up to five nearest names each, nearest by spelling, a name holding
# the words first - and styleRows is 0. A category found but not its
# subcategory is answered with that category's own subcategories; an internal
# category is named as internal. A comma splits names, so a subcategory whose
# own name holds a comma cannot be asked for by name.
#
# AN INTERNAL CATEGORY HAS NO ROW. Object Styles shows model, annotation and
# analytical categories; an internal one is counted in the first line and left
# out.
#
# ASSUMES NOTHING ABOUT TRANSACTIONS - it opens none and needs none.
purpose: >
  Answers what categories this document has and how each category and
  subcategory draws its lines in Object Styles - the projection line colour,
  the projection and cut line weight and the line pattern. In a family, the
  family's own category and its subcategories come first. Also counts the
  categories that can carry a project parameter.

contract:
  needs:
    - name: doc
      type: Document
    # true lists every subcategory of every category. Absent is false: in a
    # family, the family's own category's subcategories and every other
    # category's own row; in a project, one row per category. `optional: true`
    # is what lets it be left out (HeronBindingNote.AbsentValue).
    - name: everySubcategory
      type: bool
      source: request
      optional: true
    # VERSION 3. The categories and subcategories to report, comma separated -
    # "Generic Annotations", "Generic Annotations > Signature". Capitals and
    # extra spaces are forgiven. Left out it is "all" (`absent: all`,
    # HeronBindingNote.DeclaredAbsent): every row, version 2's answer exactly;
    # an empty value is the same.
    - name: categories
      type: string
      source: request
      optional: true
      absent: all
  provides:
    - name: names
      role: result
      type: IList<string>
    - name: bindable
      # How many of them can carry a project parameter - the number that decides
      # whether ADD_PROJECT_PARAMETER can reach a category at all. A thing it
      # FOUND, so a result (D-52).
      role: result
      type: int
    - name: objectStyles
      # Object Styles, one row per line: "category > subcategory | projection
      # line colour R,G,B | projection line weight | cut line weight (- not
      # cut) | projection line pattern", after a first line saying what the
      # rows are and what was left out. A STRING because a reply cuts a list
      # to three items of sixty characters.
      role: result
      type: string
    - name: familySubcategories
      # How many subcategories the family's own category has - the rows that
      # follow its own row at the top of objectStyles. 0 in a project, and 0 in
      # a family whose category has none: that is the proof's negative leg.
      role: result
      type: int
    - name: styleRows
      # VERSION 3. How many Object Styles rows objectStyles carries - 1 for one
      # subcategory asked by name, 0 when nothing asked is in the document. A
      # thing it FOUND, so a result.
      role: result
      type: int
    - name: findings
      type: IList<string>


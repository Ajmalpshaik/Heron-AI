revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  `Document.Settings.Categories`, `Category.Name`, `Category.SubCategories` and
  `Category.AllowsBoundParameters` are present 2020 through 2027 - read off the
  reference assemblies at both ends on 2026-09-18. `Categories` is iterated
  rather than indexed, so nothing here depends on an ordering Revit does not
  promise. Version 2 adds `Category.LineColor`, `GetLineWeight` (an `int?`),
  `GetLinePatternId`, `IsCuttable` and `CategoryType`,
  `LinePatternElement.GetSolidPatternId`, `Document.IsFamilyDocument`,
  `Document.OwnerFamily` and `Family.FamilyCategory` - read off tools/api-surface
  for all eight releases on 2026-10-14, each 2020-2027 with one signature; the
  same members CREATE_LINE_STYLE and SET_FAMILY_FORM_SUBCATEGORY already call.
  Version 3 adds no Revit member: narrowing by name and the nearest names are
  string work on the names version 2 already reads.

# ROUTING - repeated in SELECT_BY_CATEGORY_NAME and REPORT_FILTERABLE_PARAMETERS;
# the object-style rows in CREATE_LINE_STYLE, SET_FAMILY_FORM_SUBCATEGORY and
# DRAW_FAMILY_DETAIL_LINES.
#
#   "what categories are in this model" -> here
#   "what colour is the signature subcategory" -> here - its Object Styles row
#   "what line weight is the hidden lines subcategory" -> here
#   "list the object styles in this family" -> here
#   "what colour is the Signature subcategory" -> here, categories
#                                          "Generic Annotations > Signature" -
#                                          one row, not the whole table
#   "show the object style of Generic Annotations" -> here, categories "Generic
#                                          Annotations" - on the trained model and
#                                          both re-ranked backends; on the lexical
#                                          backend alone it still reaches
#                                          REMAP_LINE_STYLES, a write, as on main.
#                                          Declaring it moved another question onto
#                                          a write (row 5b-630)
#   "what colour are the lines in this family" -> here
#   "everything in duct accessories"    -> SELECT_BY_CATEGORY_NAME - and this
#                                          fragment is what tells you the name
#                                          that machine will accept
#   "which parameters can I filter on"  -> REPORT_FILTERABLE_PARAMETERS
#   "what category overrides are on this view" -> REPORT_CATEGORY_OVERRIDES - a
#                                          view's override, not the category's
#                                          own style
#   "make a red dashed line style"      -> CREATE_LINE_STYLE - the write
#   "put this extrusion on the Hidden Lines subcategory" -> SET_FAMILY_FORM_SUBCATEGORY

utterances:
  - list the categories
  - what categories are in this model
  - show me all categories
  - which categories can take a parameter
  - what colour are the lines in this family
  - what colour is the signature subcategory
  - what line weight is the hidden lines subcategory
  - list the object styles in this family

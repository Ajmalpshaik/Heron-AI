id: FRG-VIEW-093
semantic-identity: "which views did nobody put on a sheet"
kind: filter
domain: revit.views
capability: FIND_UNPLACED_VIEWS
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Finds the views that are on no sheet - the working views nobody placed. The
  list somebody wants before an issue, and before any tidy-up.

  **A SCHEDULE IS NOT PLACED THROUGH A VIEWPORT, AND THAT IS WHY A NAIVE
  VERSION OF THIS IS DANGEROUS.** Sheets carry schedules as a different kind of
  element entirely. Collect viewports only, and every schedule in the project
  comes back as unplaced - so a tidy-up built on that offers to delete the
  drawing set's schedules. Both routes are read here.

  **IT REPORTS AND DELETES NOTHING.** *"Purge the unplaced views"* is a real
  request and the honest half of it is showing what would go: some working
  views are somebody's live workspace, and one that is unplaced today is on a
  sheet tomorrow. Deleting is one Revit command away for whoever decides.

  **A VIEW TEMPLATE IS NOT AN UNPLACED VIEW.** Templates are views by type and
  belong on no sheet by definition - counting them would put every template in
  a deletion list. Neither are the browser views Revit keeps for itself.

  ASSUMES NOTHING ABOUT TRANSACTIONS - it opens none and needs none.

contract:
  needs:
    - name: doc
      type: Document
  provides:
    - name: elements
      type: IList<Element>
    - name: byType
      type: IDictionary<string, int>
    - name: placedCount
      type: int

proof:
  date: "2026-09-06"
  by: "Claude Opus 5, at Ajmal PS's PC"
  model: >
    Snowdon Towers Sample HVAC.rvt (9,628 elements) and Project1 (3,410 elements, unsaved default template), both open at once in Revit 2024.3
  positive_case: >
    Snowdon Towers: 7 views on no sheet against 42 that are placed - 'North - Mech', 'South - Mech', 'Model Linking'.
  negative_case: >
    Project1: placedCount 0. Nothing is on a sheet because the model has no sheets, and the fragment says so rather than reporting every view as an unplaced problem without context.
  second_route: >
    LIST_SHEETS independently found 17 sheets on Snowdon and 0 on Project1, which is what makes 42 placed and 0 placed the right answers.
  fingerprint: "7a7ecbf7015918ee"

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. Viewports and schedule sheet instances
  are separate element kinds on all of them, and both carry the id of the view
  they place, which is what makes the two routes readable the same way.

# ROUTING - the same rows are in the fragments named here.
#
#   "which views are not on a sheet"     -> here
#   "purge the unplaced views"           -> here first. It reports and deletes
#                                           nothing: an unplaced view today is
#                                           on a sheet tomorrow
#   "which views are there"              -> FIND_VIEWS, narrowed by type and
#                                           name rather than by placement
#   "put these views on sheets"          -> PLACE_VIEWS_ON_SHEET
#   "which families are unused"          -> FIND_UNUSED_FAMILIES
#   "what else is unused"                -> FIND_UNUSED_DEFINITIONS, for view
#                                           templates and filters
#   "delete these"                       -> DELETE_ELEMENTS, deliberately and
#                                           with the list in front of you

utterances:
  - which views are not on a sheet
  - find the unplaced views
  - the project browser is full of working views
  - what would purge unplaced views delete

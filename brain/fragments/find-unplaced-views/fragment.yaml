# DEPRECATED 2026-11-01 - MERGED INTO FIND_VIEWS (find-views), on the owner's
# instruction in conversation: "make sure there is no duplicate tools", then
# "ok go ahead merge all". Constitution Article 1: kept, never deleted, so its
# record and its proof stay readable and it can be brought back. Nothing
# offers it now - retrieval leaves DEPRECATED out, and its sentences claim

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release.
  `FamilySizeTableManager.GetFamilySizeTableManager`, `GetAllSizeTableNames`,
  `GetSizeTable`, and `FamilySizeTable.NumberOfRows`, `NumberOfColumns`,
  `GetColumnHeader` and `AsValueString` were confirmed present on the 2020
  assembly on 2026-09-15. No number is converted here at all - values cross as
  Revit's own strings - so the 2021 units move cannot reach it.

# ROUTING
#
#   "why does the fitting not appear at this size" -> here, first
#   "what sizes does this family know"             -> here
#   "what fitting will this type insert"           -> REPORT_ROUTING_PREFERENCES
#   "what sizes does the segment have"             -> REPORT_PIPE_SEGMENTS

utterances:
  - what is in this family's lookup table
  - which sizes does this family know
  - why does this fitting not appear at my size
  - read the size table
  - show me the lookup table rows

id: FRG-ELE-056
semantic-identity: "what sizes this family's lookup table actually holds"
kind: action
domain: revit.families
capability: REPORT_FAMILY_SIZE_TABLE
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Reads the LOOKUP TABLE inside an open family - every row, every column - and
  says which sizes it covers. The answer to "why does this fitting not appear
  at my size".

  **A SIZE MISSING FROM THE LOOKUP TABLE IS SILENT.** A parametric fitting
  looks its dimensions up by the pipe size it is asked for. Ask for a size the
  table has no row for and the family cannot resolve - so Revit inserts
  nothing, or inserts it with the wrong geometry, and says nothing either way.
  A new segment with new sizes is exactly how a table falls out of date, and
  the table is where the search has to start.

  **EVERY ROW COMES BACK AS ONE STRING.** A list is abbreviated to its first
  three entries before a reader sees it, and a table of twenty rows then reads
  as three. The whole table is the answer here - which sizes are present is a
  question no summary can answer - so it crosses as text.

  **IT NEEDS THE FAMILY OPEN FOR EDITING.** A size table belongs to the family
  document, so this reads the one in front. Run it with a project in front and
  it says so rather than reporting an empty table, because "no rows" and "you
  are looking at the wrong document" are different answers and only one of
  them is a fault in the family.

  **VALUES COME BACK AS REVIT FORMATS THEM.** `AsValueString` is what the
  family itself reads, units and all. Re-deriving a number here would invent a
  second opinion about a value the family has already settled.

  Changes nothing and opens no transaction.

contract:
  needs:
    - name: doc
      type: Document
    # Which table, when a family holds more than one. Empty reads the first.
    - name: tableName
      type: string
      source: request
    # A file path to write the table to as CSV. Empty writes nothing. It
    # changes NOTHING in the model - and the exported file is the only place
    # Revit states the header format an import must use.
    - name: exportTo
      type: string
      source: request
  provides:
    - name: tableNames
      # Every table in the family, on one line - a family may hold several and
      # reading the wrong one answers a different question.
      role: result
      type: string
    - name: columnHeaders
      role: result
      type: string
    - name: rows
      # The whole table as text, one row per entry, joined. See the purpose.
      role: result
      type: string
    - name: rowCount
      role: result
      type: int
    - name: columnCount
      role: result
      type: int
    - name: exportedTo
      # Where the CSV was written, empty when none was asked for. A path, not
      # a promise - it is set only after the export returned.
      role: accounting
      type: string
    - name: notAFamily
      # That the document in front is a project, not a family being edited.
      # The evidence it looked in the wrong place, never an empty table
      # (D-52).
      role: accounting
      type: bool
    - name: findings
      type: IList<string>


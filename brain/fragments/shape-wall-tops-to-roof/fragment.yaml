#   "edit the wall profile to follow the gable"
#                                        -> here, Revit 2022 on
#   "attach these walls to the roof"     -> ATTACH_WALLS (2025 on) - the wall
#                                           then FOLLOWS the roof. On 2025 on
#                                           that is the better tool; this one
#                                           draws an outline once
#   "set the wall top to level 2"        -> SET_ELEMENT_LEVEL, topLevelId

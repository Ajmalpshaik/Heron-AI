#   "reset the wall profile"             -> NOT HERE, and nowhere yet: by hand
#                                           in Revit, Reset Profile
#   "slope this roof"                    -> SLOPE_ROOF_EDGES
#   "join the main roof to the wing roof"
#                                        -> here, with the join-roofs method
#                                           named beside it (row 5b-1671):
#                                           Revit's API has no Join/Unjoin
#                                           Roof, this is the other way for the
#                                           walls; a roof by extrusion to a roof
#                                           is EXTEND_ROOF_TO_ROOF (row 5b-1877),
#                                           a footprint roof to a roof is done
#                                           by hand. tests/test_brain_reachable.py


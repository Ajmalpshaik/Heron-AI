compatibility-note: >
  Declared 2022 to 2027 because the wall profile sketch is in the API from
  2022 only: Wall.CanHaveProfileSketch, CreateProfileSketch,
  RemoveProfileSketch and SketchId, SketchEditScope with Start(ElementId),
  and Sketch.GetAllElements are all marked "since 2022" in RevitAPI.xml
  2024.3.60, and Q-91 found none of them in 2020.2.90 or 2021.1.100.
  EditScope's IsPermitted, IsActive, Commit and Cancel,
  Solid.IntersectWithCurve (2013), HostObjectUtils.GetSideFaces,
  Document.Create.NewModelCurve and Sketch.Profile are older. No ElementId is
  built from a number. One path for every release it claims. MEASURED
  2026-11-16 with tools/check-fragments-compile.py: compiled against 2021's
  reference assemblies (the card's release list widened for that one run) it
  fails on exactly SketchId, CanHaveProfileSketch, CreateProfileSketch,
  RemoveProfileSketch, SketchEditScope and Sketch.GetAllElements; it compiles
  on 2022 to 2027.

# ROUTING - the same rows are in ATTACH_WALLS where they meet.

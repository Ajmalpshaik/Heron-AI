compatibility-note: >
  One implementation for every release. `JoinGeometryUtils.AreElementsJoined`,
  `JoinGeometry` and `UnjoinGeometry` are present 2020 through 2027 - read off
  the reference assemblies at both ends rather than remembered. ElementIds are
  compared as ElementIds and never read as numbers.

# ROUTING - repeated in FIND_CLASHES, CONNECT_OPEN_ENDS and
# REPORT_JOINED_ELEMENTS (and SWITCH_JOIN_ORDER's, retired into this card).
#
#   "join these walls together"      -> here
#   "the wall and the slab are not
#    joining"                        -> here
#   "unjoin these"                   -> here, with join = false
#   "unjoin these two walls"         -> here, join false - UNJOIN_GEOMETRY's
#                                       job since version 2
#   "stop this wall cutting the column" -> here, join false, the column the
#                                       target
#   "what is this joined to"         -> REPORT_JOINED_ELEMENTS - read first,
#                                       because a join nobody knew about is
#                                       what makes a takeoff wrong
#   "the wrong one is cutting"       -> here since version 3, join switch
#                                       (was SWITCH_JOIN_ORDER). The join is
#                                       right and its direction is not -
#                                       unjoining there loses the join as well
#                                       as fixing nothing
#   "the wall has eaten the column"  -> here, join switch - NOT unjoin
#   "which one is cutting"           -> REPORT_JOINED_ELEMENTS - the read to do
#                                       first, and the one that shows a switch
#                                       worked
#   "stop them joining at all"       -> DISALLOW_JOIN, which turns the end
#                                       cleanup off rather than reversing it
#   "they are touching but not
#    connected"                      -> CONNECT_OPEN_ENDS - that is MEP
#                                       CONNECTORS on ducts and pipes, and it
#                                       can do nothing for a wall
#   "join these two ducts"           -> FIT_MEP_JOINTS
#   "what is clashing"               -> FIND_CLASHES - it REPORTS an overlap.
#                                       Joining is what makes two elements
#                                       agree about which one cuts the other
#   "build a wall between these points" -> CREATE_WALL - it joins nothing
#   "join these two columns"             -> ADD_SCHEDULE_FIELDS, version 2, if a
#                                           SCHEDULE column is meant. This
#                                           one joins geometry



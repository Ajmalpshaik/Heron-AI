compatibility-note: >
  One implementation for every release. It is arithmetic plus one move call, and
  neither has changed 2020 to 2027. `spacingX` and `spacingY` arrive in
  millimetres and are divided by 304.8 in the code (D-71); every distance
  after that is internal feet, and no units API is touched. (This note said
  "All distances are internal feet" until 2026-09-24, while the code and its
  own proof - 600 in, 1.97 feet used - said millimetres.)

# ROUTING - repeated in LIST_GRIDS and CREATE_GRID.
#
# THE WORD "GRID" MEANS TWO DIFFERENT THINGS AND THIS IS THE COLLISION. A
# LAYOUT grid is an imaginary spacing used to place diffusers evenly - that is
# what this fragment means. A COLUMN grid is the building's setting-out datum,
# drawn on every plan, and that is what LIST_GRIDS and CREATE_GRID mean. One
# word, two jobs, and nothing in the sentence usually says which.
#
#   "space these out evenly"    -> ARRAY_ELEMENTS. Even spacing along a
#                                  direction is what an array IS; this
#                                  fragment moves things onto the cells of a
#                                  spacing that is already decided. BOTH
#                                  tables claimed it until 2026-09-01
#   "snap these onto the cells" -> here
#   "put them on a 3 m grid"    -> here - a spacing
#   "snap these to the grid"    -> here
#   "list the grids"            -> LIST_GRIDS - the datums
#   "add a grid"                -> CREATE_GRID - a datum
#   "align these to grid 5"     -> CREATE_GRID / LIST_GRIDS territory; nothing
#                                  here aligns elements to a named column grid
#   "the grid bubbles are on the wrong side" -> SET_DATUM_BUBBLES. This one
#                                       MOVES elements, and used to answer
#                                       that sentence

# SENTENCES ADDED 2026-09-01 BECAUSE THE ROUTING TABLE ABOVE ALREADY CLAIMED
# THEM. A routing table is a COMMENT and comments are not indexed - the search
# reads semantic-identity, the utterances, the capability, the domain and the
# purpose, and nothing else. So a table saying "-> here" recorded a decision
# that retrieval could not act on, and these resolved elsewhere.

#   "are the light fittings sitting properly in the ceiling tiles" ->
#                                        CHECK_CEILING_COORDINATION - a READ.
#                                        This one MOVES things, and a question
#                                        about the model must not be answered
#                                        by something that changes it
utterances:
  - put them on the ceiling grid
  - line the diffusers up with the tiles
  - snap them to the grid
  - centre them in the tiles
  - they are not on the grid
  - tidy up the sprinkler positions
  - put them on a 3 m grid

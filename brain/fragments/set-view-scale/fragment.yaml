compatibility-note: >
  One implementation for every release. `View.Scale` is a settable int on every
  release 2020 to 2027 - a denominator, so 1:50 is the number 50 - and nothing
  here touches a unit or builds an ElementId from an integer.

# ROUTING - repeated in APPLY_VIEW_TEMPLATE.
#
#   "set the scale"                 -> here
#   "apply the template"            -> APPLY_VIEW_TEMPLATE - and note it may
#                                      LOCK the scale, after which this refuses
#   "the text is too small"         -> here, usually. Scale is what sizes it
#
# SCALE IS OFTEN OWNED BY THE TEMPLATE. When this refuses on a batch, that is
# almost always why, and the fix is in the template rather than in the view.
#
# ROWS ADDED 2026-09-06 - the fix that sentence needs now exists. The same rows
# are in REPORT_VIEW_TEMPLATE_CONTROL and SET_VIEW_TEMPLATE_CONTROL.
#
#   "why can I not change the scale on this view"
#                                   -> REPORT_VIEW_TEMPLATE_CONTROL, which
#                                      declares it. IT IS NOT THIS FRAGMENT,
#                                      and this one ranks high on it by wording
#                                      - answering "why is it locked" by
#                                      setting it is a write in place of an
#                                      explanation, and it will simply refuse
#   "let this view set its own scale" -> SET_VIEW_TEMPLATE_CONTROL, which
#                                      declares it. The sentence asks for the
#                                      scale to be UNLOCKED, not set

# SENTENCES ADDED 2026-09-01 BECAUSE THE ROUTING TABLE ABOVE ALREADY CLAIMED
# THEM. A routing table is a COMMENT and comments are not indexed - the search
# reads semantic-identity, the utterances, the capability, the domain and the
# purpose, and nothing else. So a table saying "-> here" recorded a decision
# that retrieval could not act on, and these resolved elsewhere.

utterances:
  - set the scale of this view
  - what scale is this view
  - change these to 1 to 50
  - the text is too small on this drawing
  - make all these views the same scale
  - the text is too small

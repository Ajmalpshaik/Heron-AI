id: FRG-VIEW-018
semantic-identity: "read or set the scale of these views"
kind: action
domain: revit.views
capability: SET_VIEW_SCALE
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Reads and sets view scale, across a batch of views.

  **Changing scale changes every piece of text and every symbol on the
  drawing.** Tags, dimensions and annotation are sized in paper units, so a
  view taken from 1:100 to 1:50 keeps its geometry and halves the apparent size
  of everything annotated on it. On a view already on a sheet that is a visible
  change to an issued drawing, not a display setting.

  **A view controlled by a template refuses.** Scale is one of the properties a
  template commonly locks, and the setter throws. Reported by name so the fix —
  change the template, or detach the view — is obvious rather than a mystery.

  **The old scale comes back**, so a batch can be undone by a caller that
  recorded it.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: views
      type: IList<View>
      source: request
    - name: scale
      type: int
      source: request
    - name: apply
      type: bool
      source: request
  provides:
    - name: wasScale
      # What each view's scale WAS before this ran. The evidence it
      # looked, never a change it made - it is filled in identically
      # whether `apply` was set or not (D-52).
      role: accounting
      type: IDictionary<ElementId, int>
    - name: changed
      type: int
    - name: alreadyThatScale
      type: int
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>


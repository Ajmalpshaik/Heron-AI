# VERSION 5 (2026-11-20) - A FORM'S EXTRUSION START AND END SAY WHICH WAY
# THEY RUN, and back to DRAFT. FRAGMENT-ISSUES row 177, its second half
# (issue Ajmalpshaik/Heron-AI#944). LINK_FAMILY_FORM_PARAMETER was merged into
# this card; on 2026-10-04, Revit 2024, linking a form's Extrusion Start or
# Extrusion End associated Revit's RAW value, which runs along the form's
# SKETCH PLANE's normal, where CREATE_FAMILY_EXTRUSION takes start and end
# along the model axis: on `Port Right`, whose plane faces -X, +1 at build is
# raw -1, so a linked +1 put a thin cap on the other side and a connector made
# on it pointed into the valve. Now, for every extrusion whose Extrusion Start
# or End (EXTRUSION_START_PARAM, EXTRUSION_END_PARAM) is in the call,
# `linkReport` says which way its sketch plane faces in model terms -
# "Extrusion End runs along -X here: its sketch plane, on "Port Right", faces
# -X, so a positive value goes left" - and, after the links and the
# regenerate, where the form now reaches along that axis, read off its
# geometry: "the form now runs X 48 to 49 mm". No new input or output; every
# other path is version 4's. Version 4 was PROVEN (the proof block below, kept
# as the record of what it proved); its C# moved, so it is DRAFT again until
# NEEDS-CHECKING Group OT is run (D-30) - on the owner's word that a
# fragment found wrong may be changed even though it is proven.

# VERSION 6 (2026-11-22) - A REFERENCE POINT TOO, still DRAFT. The folded
# pattern-panel tip: PLACE_ADAPTIVE_POINTS version 2 pushes a reference point
# off another point's plane ("on point 7 normal 300"), and that distance is
# the point's Offset (BuiltInParameter.POINT_ELEMENT_OFFSET, "Offset" in
# Properties), which the modeller links to a Length family parameter such as

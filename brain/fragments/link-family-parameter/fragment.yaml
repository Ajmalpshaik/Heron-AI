compatibility-note: >
  `FamilyManager.AssociateElementParameterToFamilyParameter`,
  `GetAssociatedFamilyParameter`, `CanElementParameterBeAssociated` and
  `Parameters`, `ConnectorElement.Domain` and `SystemClassification`, and the
  `MEPSystemClassification` values read the same 2020 through 2027
  (api-surface, read 2026-09-28). Revit's own rule - "the parameter types of
  these two input parameter should be same" - is in RevitAPI.xml for 2020, 2024
  and 2027 alike. A parameter's KIND moved at 2022: `Definition.ParameterType`
  and `LabelUtils.GetLabelFor(ParameterType)` up to 2022,
  `Definition.GetDataType()` and `LabelUtils.GetLabelForSpec` from 2022 - so
  both are reached by reflection, newest first, the way SET_FAMILY_TYPE_VALUES
  reads a kind. Nested families' TYPE parameters (Edit Type on a nested
  family) were not reached until version 3: a nested TYPE, a `FamilySymbol`
  found by `Family.GetFamilySymbolIds`, is named by `family` and `type`, as
  LINK_NESTED_TYPE_PARAMETER named it. `BuiltInParameter.MATERIAL_ID_PARAM`,
  `Parameter.Set(ElementId)` and `Selection.GetElementIds` read the same 2020
  through 2027. Version 4's kinds - `DetailCurve` and `SymbolicCurve` (both
  `: CurveElement`), `FilledRegion` with `IsMasking`, and `ModelText` (`:
  Element`, not a form) - are the same classes 2020 through 2027 (api-surface,
  read 2026-11-11). A filled region in a 3D family needs Revit 2023 and a
  masking region 2024 to exist at all (DRAW_FAMILY_FILLED_REGION); linking one
  that exists has no release limit of its own.

# 2026-11-01 - LINK_FAMILY_FORM_PARAMETER, SET_FAMILY_FORM_MATERIAL AND
# LINK_NESTED_TYPE_PARAMETER WERE MERGED INTO THIS CARD (version 3) on the
# owner's instruction ("make sure there is no duplicate tools"; a merge covers
# every area), and are DEPRECATED. One job - Revit's Associate Family
# Parameter button - for whatever element it sits on. Where their inputs and
# outputs are now: their `forms` is `forms`; LINK_NESTED_TYPE_PARAMETER's
# `family` and `type` by the same names; their `links` is `links`;
# SET_FAMILY_FORM_MATERIAL's `material` is a `links` pair, "Material=<it>";
# its `changed` list is the `linkReport` line, its `linked` is `linked`; their
# `changed`, `alreadyLinked`, `notAFamily`, `refused` and `findings` by the
# same names. Added in version 3: `uidoc`, `forms`, `family`, `type`, `linked`;
# `category` and `system` optional.
#
# THE CONFLICT, AND THE SAFER RULE KEPT: SET_FAMILY_FORM_MATERIAL read
# "none" as <By Category>; this card's "none" unlinks and keeps the value, so
# "Material=none" unlinks - <By Category> is "Material=by category". Not
# carried: LINK_FAMILY_FORM_PARAMETER's refusal of a form's Material, which
# existed only because another tool owned it; this is that tool now.

# ROUTING - see SET_FAMILY_SETTINGS for the whole family-building table.
#
#   "link the connector flow to a family parameter"  -> here
#   "unlink the solid's material"                    -> here, Material=none
#   "link the handle's visible to Show_Handle"       -> here, forms= its id
#   "link the arrow's visible to Show Arrow"         -> here, forms= the
#                                                       symbolic line's,
#                                                       region's or nested
#                                                       arrow's id (version 4)
#   "link the elbow's end angle to Bend Angle"       -> here, forms= its id
#   "link this nested beam's length to Beam Length"  -> here, forms= ONE copy's id
#   "link the nested type's width to Motor Width"    -> here, family= and type=
#   "link the body material to Body Material"        -> here, Material=Body Material
#   "make this extrusion steel"                      -> here, Material=Steel - a
#                                                       SET, not a link
#   "show this form only in fine"                    -> SET_FAMILY_FORM_VISIBILITY,
#                                                       detail levels, no parameter
#   "put a supply air connector on the neck"         -> ADD_FAMILY_CONNECTOR -
#                                                       a connector it MAKES,
#                                                       sized as it is made
#   "label the width with the Width parameter"       -> LABEL_FAMILY_DIMENSION -
#                                                       a dimension, not an
#                                                       element's parameter
#   "set the flow on these air terminals"            -> SET_AIR_TERMINAL_FLOW -
#                                                       a VALUE, in a project
#   "what parameters does this family have"          -> REPORT_FAMILY_PARAMETERS
#   "is this connector supply or return"             -> REPORT_CONNECTORS, a
#                                                       read. By words alone
#                                                       this card ranks first;
#                                                       the identity route
#                                                       keeps it there
#                                                       (measured 2026-09-28)


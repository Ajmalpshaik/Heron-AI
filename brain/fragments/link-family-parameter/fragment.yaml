purpose: >
  Links a parameter of elements ALREADY in the family open in the Family
  Editor to one of the family's own parameters, or unlinks it, and reads every
  link back - the "Associate Family Parameter" button at the end of a row in
  Properties, for every element the call names at once. A duct connector's
  Flow or size, a solid's Material or Visible: whatever Revit lets be linked.

  **ONE TOOL FOR "ASSOCIATE FAMILY PARAMETER" (version 3, 2026-11-01).**
  LINK_FAMILY_FORM_PARAMETER, SET_FAMILY_FORM_MATERIAL and
  LINK_NESTED_TYPE_PARAMETER were merged into this card and are DEPRECATED.
  The elements are named ONE way a call: by category, as before; or
  PARTICULAR forms and nested copies by the ids the form tools or
  PLACE_FAMILY_INSTANCES gave back, or `selected` (`forms`) - one form's Visible,
  a revolve's End Angle, one copy's Thread Size, its other copies left alone;
  or a nested family's TYPE by its family and type (`family`, `type`) - the
  motor's Width following Motor Width. A form's Material is LINKED to a
  family material parameter, or SET to a material the family holds
  ("Material=Steel"), or put back with "Material=by category"; a field already
  linked is unlinked before a material is written into it, and the answer
  says so. A void has no material and is refused. A reporting parameter
  cannot drive anything and is refused. A TYPE parameter asked of a nested
  copy is refused naming family= and type=; an instance parameter asked of a
  nested type is refused naming the copy. The Material-of-a-form word
  conflict between those cards ends here: there is one tool.

  **THE ELEMENTS ARE NAMED, NEVER GUESSED.** A category as Revit or the
  Properties palette names it - "Duct Connector", "Pipe Connector",
  "Extrusion", a nested family's name - or "all", and for connectors a system
  classification such as "Return Air", or "all". A name that takes nothing is
  refused with what the family has.

  **THE LINKS ARE PAIRS**, element parameter = family parameter, semicolons
  between; "none" in place of a family parameter unlinks.

  **A LINK REVIT WOULD REFUSE IS REFUSED FIRST.** A family parameter that does
  not exist, or holds a different kind of value - a Length cannot drive an Air
  Flow - is refused naming both parameters and both kinds, with the ones that
  could drive it, before anything changes. So is a parameter Revit does not
  let be linked at all.

  **EVERY LINK IS READ BACK**, before and after, per element, on one line. One
  already as asked is reported "already linked" and not counted as a change.

  **ALL OR NOTHING, ONE UNDO.** Everything is checked before the first link; a
  refusal from Revit part-way fails the call, and Heron rolls the whole call
  back. The links live in the family: a project's placed units follow them
  only once the family is loaded into it again.

  **VERSION 2 (2026-09-29, FRAGMENT-ISSUES 5b-260).** Three edge cases a
  review found after version 1 was signed are fixed, and a fourth waits on a
  measurement in Revit - NEEDS-CHECKING BD5. This is version 2; version 1's
  proof no longer describes the code and is kept as a record, and the fragment
  is DRAFT until it is proved again.

  **VERSION 4 (2026-11-11, FRAGMENT-ISSUES 5b-1497): A FAMILY'S 2D TOO.**
  The ids in `forms`, or what is `selected`, may also name a detail line
  (straight, arc, ellipse or spline), a symbolic line, a filled or masking
  region, or model text - a plan arrow's Visible linked to "Show Arrow", a
  symbolic outline's Visible to a Yes/No - for whatever parameter Revit lets
  be linked on it. Anything that is none of these, nor a form or a nested
  copy, is still refused by name. The answer names them as the Properties
  palette does ("Symbolic Line id N", "Masking Region id N"). This is version
  4: version 3's proof is kept as the record, and the tool is DRAFT until
  NEEDS-CHECKING Group NE proves it again.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # VERSION 3: for `forms=selected`, what is selected in the family's window.
    - name: uidoc
      type: UIDocument
    # Which elements: a category as Revit or the Properties palette names it -
    # "Duct Connector", "Pipe Connector", "Extrusion", a nested family's name -
    # or "all". Matched exactly first, case aside; failing that with spaces
    # ignored and a plural read as its singular, and refused when that loose
    # match reaches two different sets of elements.
    #
    # VERSION 3: optional - left out it binds "none", not named this way. The
    # elements are named ONE way a call: `category`, `forms`, or `family`
    # with `type`; two ways together are refused.
    - name: category
      type: string
      source: request
      optional: true
      absent: none
    # For connectors, the system classification - "Supply Air", "Return Air",
    # "Hydronic Supply", "Fire Protection Wet", "Fitting" - or "all". Every
    # classification Revit has is accepted but Undefined. Anything but "all"
    # leaves out every element that is not a connector of that system. A blank
    # is refused, never read as "all".
    # VERSION 3: optional, "none" when left out - which, with a category, is
    # refused as a blank always was; with forms or a nested type it is not
    # wanted, and one given there is refused.
    - name: system
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 3, from LINK_FAMILY_FORM_PARAMETER and SET_FAMILY_FORM_MATERIAL:
    # PARTICULAR forms and nested copies, by the ids the form tools or
    # PLACE_FAMILY_INSTANCES gave back (PLACE_NESTED_FAMILY until 2026-11-01),
    # commas between - or `selected`, what is
    # selected in this family's window. Anything that is not a form or a
    # nested copy refuses the call. Optional, "none" when left out.
    # VERSION 4: a detail line, a symbolic line, a filled or masking region
    # and model text are accepted too, by the ids DRAW_FAMILY_DETAIL_LINES,
    # DRAW_FAMILY_SYMBOLIC_LINES and DRAW_FAMILY_FILLED_REGION gave back;
    # anything else still refuses the call by name. The name and the binding
    # are version 3's, so a version 3 caller binds unchanged.
    - name: forms
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 3, from LINK_NESTED_TYPE_PARAMETER: a nested family's name, as
    # loaded into this family, for its TYPE parameters. Given with `type`.
    # Optional, "none" when left out.
    - name: family
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 3, from LINK_NESTED_TYPE_PARAMETER: the nested type whose
    # parameters are linked. Given with `family`. Optional, "none" when left
    # out.
    - name: type
      type: string
      source: request
      optional: true
      absent: none
    # Element parameter = family parameter, SEMICOLONS between -
    # "Flow=Actual_Supply_Air_Flow". "Flow=none" unlinks. The left name is the
    # one in Properties, the right one the one in Family Types. VERSION 3: a
    # form's Material may name a MATERIAL the family holds - "Material=Steel"
    # SETS it - or "Material=by category" to put it back; a name that is both
    # a family parameter and a material is refused. "none" still unlinks.
    - name: links
      type: IDictionary<string, string>
      source: request
  provides:
    - name: linkReport
      # Every link asked for, element by element, as it was before and as it
      # reads after, on ONE line - a list is cut to three entries before anyone
      # reads it, and the whole of this is the answer.
      role: result
      type: string
    - name: changed
      # Links that read differently after the call than before it. One already
      # as asked is not counted.
      role: result
      type: int
    - name: alreadyLinked
      # Asked for and already so: looked at, nothing done (D-52).
      role: accounting
      type: int
    - name: matched
      # How many elements the category and system took - or the forms named,
      # or the one nested type (version 3). Work done, never a thing changed
      # (D-52).
      role: accounting
      type: int
    - name: linked
      # VERSION 3, from SET_FAMILY_FORM_MATERIAL: true when the call left a
      # parameter linked to a family parameter, false when it only unlinked or
      # SET a value - a material linked rather than set.
      role: result
      type: bool
    - name: notAFamily
      # That the document in front is a project, not a family being edited.
      role: accounting
      type: bool
    - name: refused
      # Why nothing changed, in plain words - with what the family has when
      # nothing matched. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


# VERSION 7 (2026-11-24) - A PLAIN ELEMENT ID IN `forms`, and back to DRAFT.
# FRAGMENT-ISSUES row 5b-2013. Measured 2026-11-24, Revit 2020 session 29500,
# add-in 0.3.0, a mechanical equipment family open in the Family Editor:
# REPORT_PARAMETER_INVENTORY printed a nested fan copy as "ELEMENT id 9659268
# ... unique id 79c6e3cb-...-00936384"; forms=9659268 was refused "No element
# in this family has the id", forms=<the unique id> linked it. Version 6 read
# every id with Document.GetElement(string), which knows unique ids only. Now
# an id of digits alone is read as the element id Revit prints - built as a
# 64-bit ElementId from Revit 2024 on, 32-bit before (REVIT2024_OR_GREATER) -
# and anything else as a unique id, as before; an id naming nothing is still
# refused, and the refusal now says both kinds of id are taken. No new input
# or output; every other path is version 6's. Version 6 was PROVEN on
# 2026-11-23 (the proof block below, kept as the record of what it proved);
# its C# moved, so it is DRAFT again until NEEDS-CHECKING Group QE is run

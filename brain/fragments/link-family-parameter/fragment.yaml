  - relink the return connector flow to Actual_Return_Air_Flow
  - link the connector flow to a family parameter
  - associate this element parameter with a family parameter
  - change which family parameter drives the connector flow
  - unlink the connector flow from its family parameter
  - associate the extrusion material with a family parameter
  - link the visibility of this solid to a yes no family parameter
  # MOVED 2026-11-01 from LINK_FAMILY_FORM_PARAMETER, merged into this card.
  - link the handle's visible to Show_Handle
  - link the elbow's end angle to Bend Angle
  - drive this extrusion's end with the Depth parameter
  - link this form's visible field to a family parameter
  - make this part optional in some types
  - link this nested beam's length to Beam Length
  - link only this copy's visible to Pipe 2 Visible
  # VERSION 4 (2026-11-11): a family's 2D - the owner's words for the job.
  - link the arrow's visible to Show Arrow
  # MOVED 2026-11-01 from SET_FAMILY_FORM_MATERIAL, merged into this card.
  - link the body material to Body Material
  - make this extrusion steel
  - give the neck its own material parameter
  - set the material of these forms
  - put this form back to by category material
  # MOVED 2026-11-01 from LINK_NESTED_TYPE_PARAMETER, merged into this card.
  - link the motor type's width to Motor Width
  - drive the nested type's size from this family
  - drive the nested motor's sizes from the air handler
  - make the nested part's size follow this family's parameters

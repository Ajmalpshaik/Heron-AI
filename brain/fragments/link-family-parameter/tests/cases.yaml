positive:
  - given: >
      a Mechanical Equipment family with a Supply Air and a Return Air duct
      connector, each with a Preset flow, and the Air Flow parameters
      Designed_Supply_Air_Flow and Actual_Supply_Air_Flow; the supply
      connector's Flow linked to Actual_Supply_Air_Flow. category "Duct
      Connector", system "Supply Air", links "Flow=Designed_Supply_Air_Flow"
    expect: >
      changed 1, matched 1, and linkReport "Duct Connector (Supply Air) id N:
      Flow Actual_Supply_Air_Flow -> Designed_Supply_Air_Flow" - LOOKED AT in
      the Family Editor by selecting that connector and pressing the button at
      the end of Flow's row in Properties. The return connector untouched

  - given: the same family and selector, links "Flow=Actual_Supply_Air_Flow" when it already is
    expect: >
      changed 0, alreadyLinked 1, "Flow already linked to Actual_Supply_Air_Flow",
      and nothing in Revit's undo list that changes anything

  - given: the same family, category "Duct Connector", system "all", links "Flow=none"
    expect: >
      changed 2, both connectors' Flow "-> not linked", each keeping the value
      it read, and editable again in Properties

  - given: >
      category "all", system "all", links "Visible=none; Material=none", in a
      family whose solids have both and whose connectors have neither
    expect: >
      the solids unlinked; the connectors left alone, and a finding that they
      lack at least one of "Visible" and "Material", grouped by what each one
      lacks and named - never "no Visible or Material" said of an element that
      has Visible (version 2, row 5b-260)

  - given: >
      system "Fire Protection Wet", "Fitting" or "Global", with a connector of
      that classification in the family
    expect: >
      that connector matched - Revit's own name for the system is read as its
      FireProtectWet, and Fitting and Global are classifications like any
      other (version 2, row 5b-260)

  # VERSION 3 (2026-11-01), from LINK_FAMILY_FORM_PARAMETER,
  # SET_FAMILY_FORM_MATERIAL and LINK_NESTED_TYPE_PARAMETER. Each FAILS on
  # version 2, which took a category alone and set no value.
  - given: >
      a new family from the metric Generic Model template with a Yes/No type
      parameter "Show_Handle", and two solid extrusions made by
      create-family-forms; forms = the SECOND form's id, links
      "Visible=Show_Handle"
    expect: >
      changed 1, matched 1; linkReport reads Visible going from not linked to
      "Show_Handle"; the FIRST form untouched - one form, not every extrusion

  - given: >
      two copies of a small nested family placed by PLACE_NESTED_FAMILY, a
      Length type parameter "Bolt Length"; forms = the SECOND copy's id, links
      "Thread Size=Bolt Length" (an instance length on the nut)
    expect: >
      changed 1; FLEX_FAMILY to another Bolt Length moves the second copy's
      Thread Size and leaves the first copy's as it was

  - given: >
      the nested box from place-nested-family, type "300" with a Length type
      parameter "Width"; this family's Length "Motor Width" holding 450;
      family "Heron Nested Box", type "300", links "Width=Motor Width"
    expect: >
      changed 1; linkReport naming the nested type and Width not linked ->
      "Motor Width" (reads 450); the nested box 450 wide in plan

  - given: a material type parameter "Body Material"; forms = the first form's id, links "Material=Body Material"
    expect: >
      linked true, changed 1; Material going from <By Category> to linked to
      "Body Material" - greyed in Properties, the associate button showing it

  - given: the second form's id, links "Material=Default" (a material the template holds)
    expect: linked false; the second form going from <By Category> to Default - SET, not linked

  - given: the first form, linked to Body Material, links "Material=Default"
    expect: >
      changed 1, "(its link was removed first)", and the form's Material
      reading Default with no link - a linked field cannot hold a value

  - given: the second form's id, links "Material=by category"
    expect: the form back to <By Category>, changed 1

negative:
  - given: >
      the same family, category "Duct Connector", system "Supply Air", links
      "Flow=<a Length parameter of the family>"
    expect: >
      refused naming the Length parameter and Flow, both kinds (Length, Air
      Flow), and the Air Flow parameters that could drive it; changed 0 and
      the connector's link as it was

  - given: links "Flow=No_Such_Parameter"
    expect: refused with the family parameters that could drive Flow, nothing changed

  - given: category "Duct Connector", system "Exhaust Air", in a family with no exhaust connector
    expect: >
      refused with what the family has - "1 Duct Connector (Supply Air), 1 Duct
      Connector (Return Air), ..." - and nothing changed

  - given: system "Suply Air" (misspelt)
    expect: refused as no such system classification, nothing changed

  - given: system left blank, category "Duct Connector"
    expect: >
      refused, asking for a classification or "all" - a blank is never read as
      all, which would relink supply, return and exhaust alike

  - given: links "Flow=Actual_Supply_Air_Flow; flow=Actual_Supply_Air_Flow"
    expect: refused as the same parameter named twice, nothing changed

  - given: a project in front
    expect: notAFamily true and nothing changed

  - given: >
      system "Fire Protection Wet", "Fitting" or "Global" in a family with no
      connector of that classification
    expect: >
      refused as nothing matching on that system, with what the family has -
      not as "No system classification is called", which version 1 said of
      all three (row 5b-260)

  - given: >
      category "all", system "all", links "Flow=<an Air Flow parameter>;
      Material=<a Material parameter>", in a family where no element has both
    expect: >
      refused before anything changes, naming which of the two each element
      lacks - the solids "Flow", the duct connectors "Material" - never "no
      Flow or Material" (version 2, row 5b-260)

  - given: >
      a read-only parameter of a connector that is not its Flow, and the Flow
      of a connector whose Flow Configuration is not Preset
    expect: >
      both refused as read-only, nothing changed; only the Flow carries
      "as a connector's flow is unless its Flow Configuration is Preset"
      (version 2, row 5b-260)

  # VERSION 3 (2026-11-01).
  - given: category "Extrusion" AND forms = a form's id in the same call
    expect: refused - the elements are named one way a call - and nothing changed

  - given: forms = a form's id and the UniqueId of a reference plane, links "Visible=Show_Handle"
    expect: >
      refused - the plane is neither a form nor a nested part - and NEITHER
      linked

  - given: a nested copy's id, links a field that is a TYPE parameter of its family
    expect: >
      refused naming family= and type=, and listing what can be linked on that
      copy alone; nothing changed

  - given: forms = a VOID extrusion's id, links "Material=Default" or "Material=Body Material"
    expect: refused - a void has no material to show - and nothing changed

  - given: links "Material=Width", a LENGTH parameter
    expect: refused naming both kinds, Length and Material, and nothing changed

  - given: a family parameter and a material both called "Steel", links "Material=Steel"
    expect: refused as not saying which is meant, and nothing changed

  - given: links "Width=Overall_Width" where Overall_Width is a REPORTING parameter
    expect: refused as a reporting parameter that cannot drive anything; version 2 left this to Revit

  - given: forms = a form's id, links "Material=none"
    expect: >
      the Material UNLINKED and its value kept - "none" unlinks, it never puts
      the material back to <By Category> (SET_FAMILY_FORM_MATERIAL's reading,
      not carried)

second_route:
  - >
      Family Editor by hand: select the connector, press the button at the end
      of Flow's row in Properties, and read which family parameter the
      Associate Family Parameter dialog has selected - compared with
      linkReport, before and after

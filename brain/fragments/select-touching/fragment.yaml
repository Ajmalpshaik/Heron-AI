id: FRG-SEL-018
semantic-identity: "what is physically overlapping this one element"
kind: filter
domain: revit.selection
capability: SELECT_TOUCHING
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Finds the elements whose real geometry OVERLAPS one given element -
  "what is clashing with this beam", "what is running through this wall" -
  optionally bounded to a list of categories.

  **Overlapping is not the same as meeting, and for MEP that distinction
  decides the answer.** Two ducts joined by an elbow at a shared connector are
  touching face to face and do NOT occupy the same space, so this returns
  nothing for them - proved by running it against exactly that pair, across
  every category. It is not a fault: the test is volumetric overlap, and a clean
  connection has none. "What is connected to this duct" is TRACE_CONNECTIVITY;
  this is "what is in the same place as it".

  **So an empty answer means no clash, not no relationship**, and the report
  says so rather than leaving a bare zero to be misread as a broken filter.

  **The element is never returned as touching itself.** It overlaps its own
  geometry perfectly, and including it would put a false pair in every clash
  list built on this.

  **This is one element against the model.** FIND_CLASHES takes two SETS and
  reports pairs, which is what a coordination round needs; this is the single
  question a modeller asks with something already selected.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as
  version 1 did. With it set, the target's solids are carried into each
  placement of every loaded link and tested against that link's elements,
  and `linkedMatches` gives each link's count by category and then names
  every overlap, up to twenty a link - the type, the id IN THE LINK and the
  **Fire Rating**. *"What does this pipe run through"* is usually answered
  by the architect's walls and the structural slabs, and whether the wall
  is 2-hour is the question that follows. `linksSearched` says how many
  links were read: set and 0 means "you asked, and none are loaded".
  **NOTHING FROM A LINK IS EVER SELECTED OR CARRIED** - `elements` stays
  this model's own; the chain revives ids against this model, and a linked
  id that happens to be in use here binds an unrelated element
  (FRAGMENT-ISSUES row 75). Only model elements are read from a link, never
  its views or sheets. Links nested inside a link are not read, and are
  counted in the answer. This is version 2, and DRAFT until proved.

# A NAME TWO PARAMETERS SHARE IS NEVER READ: a linked element whose Fire Rating
# two parameters carry - a shared or project "Fire Rating" bound beside the
# built-in one, on the element or on the type the lookup falls through to -
# reads "Fire Rating NOT READ - N parameters share that name" in
# `linkedMatches`, never either value (D-54 s3, FRAGMENT-ISSUES 5b-203; added
# 2026-10-09). Written here and not in `purpose`, as on check-sleeve-size's
# card: the purpose is embedded for routing, and on that card's change a
# purpose sentence about this moved other cards' utterances in check-routing,
# measured against d9b27f03 (row 5b-203's 2026-10-09 note). Not measured for
# this card.
contract:
  needs:
    - name: doc
      type: Document
    - name: target
      type: Element
      source: request
    - name: categories
      type: IList<BuiltInCategory>
      source: request
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: findings
      type: IList<string>
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then the links' own lines. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75). Since 2026-10-09 a Fire
      # Rating two parameters share reads NOT READ there, never either
      # value (D-54 s3, FRAGMENT-ISSUES 5b-203).
      role: accounting
      type: IList<string>


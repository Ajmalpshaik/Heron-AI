id: FRG-SHT-001
semantic-identity: "every drawing sheet in this project, with its number and name"
kind: filter
domain: revit.sheets
capability: LIST_SHEETS
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Collects the project's sheets and reports each one's number, name and how
  many views are on it.

  **The first fragment in the SHT area.** Sheets had an agent in the registry
  and nothing on disk, so *"list the sheets"* resolved to FILTER_ELEMENTS_BY_ID
  and *"which sheet is this on"* to PLACE_VIEW_ON_SHEET - a read answered by
  the fragment that puts things on sheets.

  **A sheet with no views on it is still a sheet, and it is worth knowing
  about.** An empty sheet in the list is usually one that was created for a
  drawing nobody has produced yet, which is exactly the thing somebody is
  looking for when they ask what sheets exist before an issue.

contract:
  needs:
    - name: doc
      type: Document
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: findings
      type: IList<string>
    - name: placeholders
      role: result
      type: IList<ElementId>


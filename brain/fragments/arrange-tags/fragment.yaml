id: FRG-VIEW-080
semantic-identity: "the tags are sitting on top of each other, spread them out"
kind: action
domain: revit.annotation
capability: ARRANGE_TAGS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Pushes overlapping tags apart until nothing sits on top of anything else,
  leaving every tag as near where it started as it can be. The tidy-up for tags
  that ALREADY exist - placed by hand, or by an earlier run - which is the case
  a placement job cannot reach, because that only arranges the tags it places
  itself.

  **A TAG'S BOUNDING BOX INCLUDES ITS LEADER, SO IT CANNOT BE USED TO MEASURE
  THE TAG.** On a leadered tag the box wraps the head AND the leader line - on
  a congested plan that is metres, not millimetres, and spacing derived from it
  flings tags across the drawing. Sizes are therefore measured ONLY from
  leaderless tags, and the leadered ones take the median of those. Where every
  tag in the set has a leader nothing can be measured at all, and the caller's
  stated size is used instead: a size somebody chose beats a measured number
  that is silently wrong. Which of the two happened is reported.

  **A BENT LEADER HAS ALREADY BEEN THREADED ROUND SOMETHING, SO IT STAYS PUT.**
  An elbow means somebody - or an earlier pass - routed that tag past a duct,
  another tag, or its own text. Nudging it reopens a problem that was already
  solved. When exactly one tag of a clashing pair has a straight leader, that
  one takes the whole separation; only a pair of the same kind splits it.
  Straight or bent is read fresh from each tag's current elbow, never
  remembered.

  **THAT PREFERENCE CAN FAIL TO CONVERGE, SO IT IS TWO PHASES.** A tag boxed in
  by bent-leader neighbours has nowhere to go alone. The first phase keeps the
  preference; anything still clashing at the end of it is separated with both
  tags moving, and the tags that needed the exception are named. A preference
  must not silently block a real clash, and must not be silently dropped
  either.

  **MOVING A TAG DRAGS A FREE LEADER'S END OFF ITS ELEMENT.** A leader whose
  end is attached follows the element it points at. A free one carries its own
  end point, which travels with the head - so a bulk tidy-up quietly pulls
  every arrow off the thing it was pointing at. Free ends are read before the
  move and written back after.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: view
      type: View
      source: request
    - name: elements
      type: IList<Element>
    # The clear gap to leave between two tags, on paper terms the reader
    # judges. No default: what looks right at 1:100 is crowded at 1:50.
    - name: minGapMm
      type: double
      source: request
    # How many separation passes before the first phase gives up.
    - name: maxPasses
      type: int
      source: request
    # Used ONLY when every tag in the set has a leader, so nothing can be
    # measured. Stated by the caller rather than assumed here.
    - name: fallbackTagWidthMm
      type: double
      source: request
    - name: fallbackTagHeightMm
      type: double
      source: request
  provides:
    - name: moved
      role: result
      type: int
    - name: measuredFrom
      # How many leaderless tags the size was measured from - zero means the
      # caller's stated size was used instead. Which of the two happened,
      # never a tag it moved (D-52).
      role: accounting
      type: int
    - name: bothHadToMove
      # Tags where the bent-leader preference had to be ABANDONED and both
      # of a clashing pair moved. A real outcome of the run, which the
      # purpose requires be named rather than silently dropped - not a count
      # of what it could not use.
      role: result
      type: IList<ElementId>
    - name: stillOverlapping
      # Tags still clashing when it ran out of passes. What it could NOT fix,
      # and a run that moved nothing must not read as work because of it
      # (D-52).
      role: accounting
      type: IList<ElementId>
    - name: notTags
      # Handed in but not tags, so there was nothing here to act on. A count
      # of what it was GIVEN and could not use, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>


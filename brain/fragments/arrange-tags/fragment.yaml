# VERSION 3 (2026-11-20) - THE GAP AND THE FALLBACK SIZES ARE ON PAPER, and
# back to DRAFT. FRAGMENT-ISSUES row 5b-240, the owner's yes of 2026-11-19
# (Ajmalpshaik/Heron-AI#924): `minGapMm`, `fallbackTagWidthMm` and
# `fallbackTagHeightMm` are paper millimetres, multiplied by the view's
# scale - STACK_TAGS' rule. Version 2 took them as model millimetres, so the
# 3 mm gap a caller typed was 0.04 mm on a 1:75 sheet. A size measured off a
# leaderless tag is a model distance already and is not multiplied. The
# proof block below is version 2's, kept as the record of what it proved;
# its C# moved, so it is DRAFT until NEEDS-CHECKING Group OP is run (D-30).
# A caller who sent version 2 a model size now sends the paper one: 200 mm in
# the model is 2 mm on a 1:100 view.
#
# VERSION 2 (2026-11-16) - ROOM, SPACE AND AREA TAGS TOO, and back to DRAFT.
# FRAGMENT-ISSUES row 5b-1732 (Sruthina, Revit 2024, model `villa 2`,
# Ajmalpshaik/Heron-AI#854 item c): version 1 kept only IndependentTag, so
# every room tag (a SpatialElementTag) went to `notTags` - never moved, and not
# even an obstacle for the tags that were. The commonest clash on a plan, a
# door tag over a room tag, could not be pushed apart, while
# FIND_OVERLAPPING_TAGS found it. A SpatialElementTag is now arranged by its
# TagHeadPosition like the rest; its leader is not written to (what Revit
# does with a room tag's leader end is NOT CHECKED), and a room tag pushed
# out of a small room raises Revit's own "outside of its Room" warning.
# `roomTagsStayPut` true holds room, space and area tags exactly where
# they are, as fixed obstacles the other tags move away from in both phases,
# named in `keptInPlace`. Every tag still takes one size, the median (row
# 5b-1652, still open). Version 1 was PROVEN (the proof block below, kept as
# the record of what it proved); its C# moved, so it is DRAFT again until
# NEEDS-CHECKING Group OC is run (D-30) - on the owner's word of 2026-11-11
# that a fragment found wrong may be changed even though it is proven.

purpose: >
  Pushes overlapping tags apart until nothing sits on top of anything else,
  leaving every tag as near where it started as it can be. The tidy-up for tags
  that ALREADY exist - placed by hand, or by an earlier run - which is the case
  a placement job cannot reach, because that only arranges the tags it places
  itself.

  **A TAG'S BOUNDING BOX INCLUDES ITS LEADER, SO IT CANNOT BE USED TO MEASURE
  THE TAG.** On a leadered tag the box wraps the head AND the leader line - on
  a congested plan that is metres, not millimetres, and spacing derived from it
  flings tags across the drawing. Sizes are therefore measured ONLY from
  leaderless tags, and the leadered ones take the median of those. Where every
  tag in the set has a leader nothing can be measured at all, and the caller's
  stated size is used instead: a size somebody chose beats a measured number
  that is silently wrong. Which of the two happened is reported.

  **A BENT LEADER HAS ALREADY BEEN THREADED ROUND SOMETHING, SO IT STAYS PUT.**
  An elbow means somebody - or an earlier pass - routed that tag past a duct,
  another tag, or its own text. Nudging it reopens a problem that was already
  solved. When exactly one tag of a clashing pair has a straight leader, that
  one takes the whole separation; only a pair of the same kind splits it.
  Straight or bent is read fresh from each tag's current elbow, never
  remembered.

  **THAT PREFERENCE CAN FAIL TO CONVERGE, SO IT IS TWO PHASES.** A tag boxed in
  by bent-leader neighbours has nowhere to go alone. The first phase keeps the
  preference; anything still clashing at the end of it is separated with both
  tags moving, and the tags that needed the exception are named. A preference
  must not silently block a real clash, and must not be silently dropped
  either.

  **MOVING A TAG DRAGS A FREE LEADER'S END OFF ITS ELEMENT.** A leader whose
  end is attached follows the element it points at. A free one carries its own
  end point, which travels with the head - so a bulk tidy-up quietly pulls
  every arrow off the thing it was pointing at. Free ends are read before the
  move and written back after.

  **ROOM, SPACE AND AREA TAGS ARE ARRANGED TOO (version 2)**, by their head,
  so a door tag over a room tag is pushed apart. Asked to keep room tags
  still, they stay exactly where they are and the other tags move away from
  them.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: view
      type: View
      source: request
    - name: elements
      type: IList<Element>
    # The clear gap to leave between two tags, in PAPER millimetres - the
    # distance the reader judges on the printed sheet. Multiplied by the
    # view's scale (version 3). No default: what looks right on one drawing
    # is crowded on another.
    - name: minGapMm
      type: double
      source: request
    # How many separation passes before the first phase gives up.
    - name: maxPasses
      type: int
      source: request
    # Used ONLY when every tag in the set has a leader, so nothing can be
    # measured. Stated by the caller rather than assumed here, in PAPER
    # millimetres - a tag's printed size - multiplied by the view's scale
    # (version 3).
    - name: fallbackTagWidthMm
      type: double
      source: request
    - name: fallbackTagHeightMm
      type: double
      source: request
    # VERSION 2. True holds room, space and area tags still - fixed obstacles
    # the other tags move away from. Left out it is false (an absent optional
    # bool binds false) and they are arranged like the rest.
    - name: roomTagsStayPut
      type: bool
      source: request
      optional: true
  provides:
    - name: moved
      role: result
      type: int
    - name: measuredFrom
      # How many leaderless tags the size was measured from - zero means the
      # caller's stated size was used instead. Which of the two happened,
      # never a tag it moved (D-52).
      role: accounting
      type: int
    - name: bothHadToMove
      # Tags where the bent-leader preference had to be ABANDONED and both
      # of a clashing pair moved. A real outcome of the run, which the
      # purpose requires be named rather than silently dropped - not a count
      # of what it could not use.
      role: result
      type: IList<ElementId>
    - name: stillOverlapping
      # Tags still clashing when it ran out of passes. What it could NOT fix,
      # and a run that moved nothing must not read as work because of it
      # (D-52).
      role: accounting
      type: IList<ElementId>
    - name: notTags
      # Handed in but not tags, so there was nothing here to act on. A count
      # of what it was GIVEN and could not use, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>
    - name: keptInPlace
      # VERSION 2. Room, space and area tags held still because
      # roomTagsStayPut was true - what it was told not to move, never a
      # thing it moved (D-52).
      role: accounting
      type: IList<ElementId>


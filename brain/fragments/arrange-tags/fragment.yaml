tests: tests/

compatibility-note: >
  A compile-time split at 2022 for the leader. Before it a tag had one leader
  and its elbow and end were properties; from 2022 a tag can point at several
  elements and both became methods taking the reference they belong to, with
  the properties REMOVED. Naming either set directly stops the fragment
  compiling on the other half of the range, and a try/catch cannot help
  because a missing member fails the compile rather than the run. The head
  position, which is what actually moves, is unchanged 2020 to 2027.

# ROUTING - the same rows are in the fragments named here.
#
#   "the tags are on top of each other"  -> FIND_OVERLAPPING_TAGS owns that
#                                           sentence and REPORTS them; here
#                                           when they are to be MOVED
#   "spread the tags out"                -> here
#   "which tags overlap"                 -> FIND_OVERLAPPING_TAGS, which
#                                           reports and changes nothing. Run it
#                                           first if you want to see the list
#   "centre the room tags"               -> CENTER_ROOM_TAGS. Room tags belong
#                                           in their rooms, which is a
#                                           different rule from not touching
#   "tag the rest of these"              -> TAG_ELEMENTS_IN_VIEW
#   "what are the tags pointing at"      -> REPORT_TAGS_AND_TARGETS
#   "fix the leader shape on these tags" -> FORCE_TAG_LEADER_LSHAPE. This one
#                                           moves tag HEADS and leaves the
#                                           leader shape alone
#   "there is no room for the tags here" -> STACK_TAGS, which gathers them at
#                                           the side instead of spreading them

utterances:
  - the tags are sitting on top of each other
  - spread the tags out
  - tidy up the tags on this view
  - arrange the tags so they do not clash
  - the tags are overlapping on this drawing
  - fix the tag clash

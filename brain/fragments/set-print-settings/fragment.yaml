id: FRG-SHT-019
semantic-identity: "set the paper size and orientation and save it as a print setting"
kind: action
domain: revit.sheets
capability: SET_PRINT_SETTINGS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Sets the paper size, orientation and fit, and saves them as a named print
  setting - the middle link of the print chain: a sheet set to print, a setting
  to print it with, and the print itself.

  **THE PAPER SIZES COME FROM THE PRINT DRIVER, NOT FROM REVIT.** A size that
  exists on the PDF writer may not exist on the plotter in the corridor, and
  asking for one the current driver does not have fails in a way that reads as
  a Revit problem. What the driver actually offers is reported, so a refused
  size can be seen against the list rather than guessed at.

  **THE PRINT MANAGER IS NOT TRANSACTIONAL.** These settings are application
  state as much as document state: an undo does not reliably put the previous
  paper size back. That is worth knowing before treating this as a change like
  any other.

  **A NAME ALREADY IN USE IS REFUSED.** Saving over an existing setting is not
  what somebody means by "save this as A1 Landscape", and quietly replacing one
  another drawing set prints with is worse than the refusal.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16) - for the
  document side of it.

contract:
  needs:
    - name: doc
      type: Document
    # Exactly as the driver names it. Empty lists what is available and
    # changes nothing.
    - name: paperSizeName
      type: string
      source: request
    # "portrait" | "landscape" | "" to leave alone.
    - name: orientation
      type: string
      source: request
    - name: zoomToFit
      type: bool
      source: request
    # Empty applies the settings without saving them under a name.
    - name: saveAsName
      type: string
      source: request
  provides:
    - name: availableSizes
      # Every paper size the print driver offers. A fact about the driver,
      # offered so a refusal can name the alternatives - never a setting
      # this fragment applied.
      role: accounting
      type: IList<string>
    - name: applied
      role: result
      type: IList<string>
    - name: savedAs
      role: result
      type: string
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string


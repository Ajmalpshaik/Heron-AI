revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Schema.ListSchemas`, `SchemaName`,
  `VendorId`, `GUID`, `Documentation`, `ReadAccessLevel`, `WriteAccessLevel`,
  `ReadAccessGranted`, `ListFields`, `Field.FieldName`, `Field.ValueType` and
  `ExtensibleStorageFilter` are present and unchanged 2020 through 2027.

  **The extensible storage namespace is NOT one the fragment wrapper imports**,
  so every type in it is written out in full. That is deliberate: adding the
  namespace to the harness would be a promise to the executor that has to be
  kept in two places, and one fragment does not justify it.

  `DataStorage` is never named. It is not publicly accessible and naming it does
  not compile on any release here - the carrier is matched on `GetType().Name`
  instead.

  No units API is called and no `ElementId` is read as a number.

# ROUTING - the same rows are in the fragments named here.
#
#   "what data is hidden in this file"   -> here. Extensible storage - not
#                                           visible anywhere in Revit's own UI
#   "which add-ins have touched this"    -> here, by the data they left. What is
#                                           RUNNING is a different question and
#                                           this fragment cannot see it
#   "what parameters does this have"     -> REPORT_PARAMETER_INVENTORY. A
#                                           parameter is visible in Properties;
#                                           none of this is
#   "what does this file depend on"      -> REPORT_EXTERNAL_REFERENCES - links,
#                                           images, keynote files
#   "what is this file"                  -> READ_MODEL_FILE_INFO
#   "read a vendor's hidden values"      -> NOT ANSWERED HERE, on purpose. A
#                                           closed schema's refusal is reported
#                                           and obeyed

utterances:
  - what data have other add-ins written into this model
  - is there hidden data on these elements
  - which tool stamped these elements
  - list the extensible storage schemas
  - what comes with this file that is not mine
  - there is data on this element that is not a parameter
  - what add-in data does this model carry

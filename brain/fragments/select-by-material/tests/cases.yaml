positive:
  - given: >
      a model with 40 walls of a type whose core is "Concrete, Cast-in-Place",
      asked for that name over the walls category
    expect: >
      those 40, and the scanned count equal to the total number of walls. Open
      one wall's type in Revit and read its compound structure to confirm

  - given: the same material with no category list
    expect: >
      the 40 walls plus any floor, column or beam using it, and a scanned count
      in the thousands. Every wall from the bounded run must still be present

  - given: a name typed in the wrong case
    expect: found anyway

  # D-59, added 2026-09-28 with version 2. NOT RUN.
  - given: >
      a material that exists ONLY in the architectural
      link, categories Walls, includeLinks true
    expect: >
      the host's findings say it has no such material, and
      the link's line gives its count - the case a link exists for

  # Version 3, added 2026-10-08. A family open in the Family Editor.
  - given: >
      a scratch Generic Model family with a solid extrusion set to "Glass", a
      solid revolve and a void extrusion left at <By Category>; materialName
      "Glass", categories "Generic Models"
    expect: >
      elements 1, the glass extrusion; the family finding says all 3 forms
      were scanned whatever the category list says, and that 1 form takes its
      material <By Category> - the revolve; the void shows nothing and is not
      counted. Before version 3 this read "0 of 0 scanned"

negative:
  - given: >
      a wall PAINTED with a material it is not made of, asked with includePaint
      false and then true
    expect: >
      absent from the first answer and present in the second. THIS IS THE FIRST
      CASE TO RUN. If both answers match, one of the two questions is not being
      asked, and "what is this made of" has quietly become "what has this
      material touched"

  - given: '"Steel - Galvanized" asked for in a model whose material is "Steel, Galvanized"'
    expect: >
      refused, with the real names listed. Not a bare zero - with names this
      long and this inconsistently punctuated, a miss is nearly always a
      spelling, and the list is what makes the next attempt right

  - given: a material that exists but nothing uses
    expect: >
      0 elements and a scanned count in the thousands. That is the honest zero,
      and it is the same answer PURGE_UNUSED_MATERIALS is built on

  - given: an empty material name
    expect: refused, with the reason

  # D-59, added 2026-09-28 with version 2. NONE OF THESE HAS BEEN RUN.
  - given: includeLinks ABSENT, on a model that HAS loaded links
    expect: >
      the same answer as version 1's proof, and linksSearched 0 with the first
      line of linkedMatches reading "Host model only - links not read". The
      switch left out must bind false, not refuse - if the run refuses with
      needs_request_values, the add-in in Revit is older than this change

  - given: includeLinks true on a model with NO links, or with every link unloaded
    expect: >
      linksSearched 0 and "Links asked for, NONE loaded - host only". It must
      NOT read like the absent case: one means there was nothing else to read,
      the other means reload them in Manage Links and ask again

  - given: one linked file placed TWICE, with includeLinks true
    expect: >
      linksSearched 1, not 2 - it counts files, not placements

  # Version 3, added 2026-10-08.
  - given: >
      the same scratch family, materialName "Default Wall" - a material the
      family holds that no form is made of
    expect: >
      elements 0 with the same forms scanned - the honest zero inside a
      family, not the "0 of 0" the category filter gave

  - given: the same name and categories in a project
    expect: >
      the project answer exactly as before - no family finding, nothing
      scanned beyond the categories

second_route: >
  A material takeoff schedule filtered to the same material and counted, and
  one element's type opened in Revit to read its compound structure by hand -
  the schedule and this fragment could share a mistake, the manual read cannot

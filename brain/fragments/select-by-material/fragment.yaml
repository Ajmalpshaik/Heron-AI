id: FRG-SEL-015
semantic-identity: "the elements made of one material"
kind: filter
domain: revit.selection
capability: SELECT_BY_MATERIAL
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Narrows the model to the elements that use one named material - "which walls
  are fair-faced block", "everything in galvanised steel" - optionally bounded
  to a list of categories.

  **Revit has no material-to-elements lookup, so this is a SCAN and says so.**
  Every element in scope is asked what it is made of; there is no index to
  consult. That is not an implementation detail the caller can ignore - it is
  why the category bound matters here more than in most filters, and why the
  scanned count is reported beside the answer.

  **Paint is a separate question and is off by default.** A material can reach
  an element two ways: as its real make-up, through the type's compound
  structure or family geometry, or as PAINT applied to one face. "What is this
  wall made of" and "what did we paint" are different questions with different
  answers, and folding them together silently would inflate the first. Asking
  for paint includes both, and the report says which was asked.

  **A material name that does not exist is refused, with the real names
  listed.** Revit material names are long, near-duplicated and inconsistently
  punctuated - "Steel, Galvanized" against "Steel - Galvanized" - so a miss is
  far more often a spelling than an absence, and a bare zero would read as the
  wrong one.

  **The material usually lives on the TYPE, and that is not a mistake.** An
  instance reports the materials its type and geometry give it, so every wall
  of one type answers alike. Changing what one is made of means a new type,
  which is DUPLICATE_TYPE and then REPLACE_MATERIAL.

contract:
  needs:
    - name: doc
      type: Document
    - name: materialName
      type: string
      source: request
    - name: includePaint
      type: bool
      source: request
    - name: categories
      type: IList<BuiltInCategory>
      source: request
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: scanned
      # How many elements were examined. A count of work DONE, not of things
      # found - the evidence it ran, which is the opposite of a reason to
      # doubt it (D-52).
      role: accounting
      type: int
    - name: findings
      type: IList<string>

proof:
  date: '2026-09-13'
  by: Ajmal PS
  model: test projject (3,432 elements), Revit 2024, session 40932
  positive_case: run as it would normally be run. returned elements 9 item(s) [Generic - 200mm,
    Generic - 200mm, Generic - 200mm, ...], findings 1 item(s) [9 of 9 scanned element(s)
    use 'Default Wall', within 1 categ...], includePaint false, scanned 9, wanted Default
    Wall. inputs came materialName as given; includePaint as given; categories as given (1).
    on test projject
  negative_case: run with materialName=Brick, Common, includePaint=false, categories=Walls
    instead - chosen because it should not contain what this fragment reports. returned elements
    0 item(s), findings 1 item(s) [0 of 9 scanned element(s) use 'Brick, Common', within 1
    cate...], includePaint false, scanned 9, wanted Brick, Common. inputs came materialName
    as given; includePaint as given; categories as given (1). on test projject
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  caveat: >-
    THE LEG ITS OWN TEST FILE CALLS "THE FIRST CASE TO RUN" WAS NOT RUN. tests/cases.yaml asks
    for a wall PAINTED with a material it is not made of, read once with includePaint false and
    once true, and expects it absent from the first answer and present in the second - because
    if both answers match then "what is this made of" has quietly become "what has this
    material touched". includePaint was FALSE in both legs here and nothing in `test projject`
    is painted, so that distinction is untested. What IS proved is the material match itself,
    and the same nine walls were scanned both times: 9 of 9 use 'Default Wall', 0 of 9 use
    'Brick, Common' - a material that exists in the model and is on nothing.
  fingerprint: c3e971010738026c

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Material` and
  `Element.GetMaterialIds(bool)` are present 2020 through 2027, compiled at
  both ends. The returned ids are compared to the material's ElementId
  directly, never read as numbers.

# ROUTING - repeated in READ_ELEMENT_MATERIAL, REPLACE_MATERIAL and
# REPORT_MATERIAL_TAKEOFF.
#
#   "which walls are fair faced
#    block"                          -> here
#   "everything in galvanised steel" -> here
#   "what is this wall made of"      -> READ_ELEMENT_MATERIAL - one element,
#                                       every material it carries, not a sweep
#   "swap that material for
#    another"                        -> REPLACE_MATERIAL - this one only reads
#   "how much of each material"      -> REPORT_MATERIAL_TAKEOFF - quantities,
#                                       once the elements are chosen
#   "which materials are unused"     -> PURGE_UNUSED_MATERIALS, which asks the
#                                       same question of every material at once
#                                       and is the right shape for that
#   "make this one wall different"   -> DUPLICATE_TYPE first. Material lives on
#                                       the type, so changing one instance
#                                       without a new type changes them all

utterances:
  - which walls are fair faced block
  - find everything in galvanised steel
  - everything in galvanised steel
  - select elements using this material
  - show me what is made of concrete
  - filter by material

heron-step: 17
heron-status: DRAFT
heron-since: 0.1.0
heron-layer: brain

id: FRG-MEP-052
semantic-identity: "draw straight duct or pipe - one run from here to there or every run of a layout, each at its own size, in one go"
kind: action
domain: revit.mep
capability: CREATE_DUCT_RUNS
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Draws straight duct OR straight pipe - one run from here to there, or every
  main and every branch of a layout - in ONE call and ONE undo step, each run
  at its own size. Since 2026-11-01 it is the one straight-duct and
  straight-pipe tool: CREATE_DUCT, which drew one duct run per call, and
  CREATE_PIPE, which drew straight pipe between points, were merged into it.

  **Duct or pipe: the type decides (version 2, 2026-11-01).** Name a duct type
  and a duct system and it draws duct; name a pipe type and a piping system
  and it draws pipe - as CREATE_FLEX_PIPE does for flex. The two must go
  together, checked by name before Revit is asked. A pipe run's size is a
  diameter, `d50`; a width by height on a pipe type is refused. Revit snaps a
  pipe size to its segment's sizes and still reports success - 77 asked, 80
  made - so every size is read back, and a snap fails the whole job, named.

  **It exists because drawing was the slow half once the fittings were not.**
  On 2026-09-23 a five-room supply layout took twenty-five CREATE_DUCT calls
  and two SET_MEP_SIZE calls, then one FIT_MEP_JOINTS and one
  CONNECT_OPEN_ENDS. The owner asked for the drawing to be done at one time as
  well. With this the whole layout is three calls: draw, fit, join.

  **How to write the runs.** Runs are separated by | . Each is an optional
  size - WxH for rectangular, d250 for round, in millimetres - a colon, then the
  points in millimetres, x,y,z each, separated by ; . Consecutive points make
  one segment each. No size means the duct type's own:
  `850x195: 3075,-2100,3122.5; 3075,-1100,3122.5 | 300x300: 3075,-1100,3122.5; 3075,8100,3122.5`

  **One run is just its points**, with no size and no bar - two points give one
  duct, five give four, at the duct type's own size:
  `0,40000,2500; 3000,40000,2500`

  **It guesses no route.** Every point is given and used in order. Deciding
  where ducts go - reading the connectors, leaving room for an elbow or a
  transition - happens before this call.

  **It connects nothing.** The new ducts are left as `elements`, so
  FIT_MEP_JOINTS can take them straight from here, and CONNECT_OPEN_ENDS joins
  the free ends to equipment and terminals after that.

  **All or nothing.** A run it cannot read, a segment too short to exist, a duct
  Revit will not create, or a size the duct type snaps to something else - any
  one of them rolls the whole job back and names each problem (Article 8).

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # RESOLVED OBJECTS, never ids - the 2024 ElementId trap (D-05).
    # Version 2: a duct system OR a piping system - MEPSystemType, which the
    # binder resolves as "duct or pipe system type". It must go with the type
    # below: a duct type with a duct system, a pipe type with a piping system,
    # checked by name before Revit is asked. Version 1 took a
    # MechanicalSystemType only.
    - name: systemType
      type: MEPSystemType
      source: request
    # A DUCT type or a PIPE type (version 2), and which it is decides what is
    # drawn. MEPCurveType because the binder resolves that class by name and
    # both derive from it; anything else is refused by name. Still called
    # `ductType` so every call written for version 1 runs unchanged - for a
    # pipe it is the pipe type (CREATE_PIPE's `pipeType`).
    - name: ductType
      type: MEPCurveType
      source: request
    - name: level
      type: Level
      source: request
    # The runs as the caller typed them - millimetres, converted here once
    # (D-20). A string on purpose: many runs, each with its own size, is not
    # something a list of points can say.
    - name: runs
      type: string
      source: request
  provides:
    # The new ducts or pipes, named `elements` on purpose so FIT_MEP_JOINTS
    # can take them straight from here with expect_from. CREATE_PIPE's
    # `created`.
    - name: elements
      role: result
      type: IList<Element>
    - name: runsDrawn
      role: result
      type: int
    - name: segments
      role: result
      type: int
    - name: sized
      role: result
      type: int
    # The whole answer as ONE string, because a string reaches the reader whole.
    - name: summary
      role: result
      type: string

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  `Duct.Create(Document, ElementId, ElementId, ElementId, XYZ, XYZ)`, as
  CREATE_DUCT used it until it was merged in, `Pipe.Create` with the same
  arguments, as CREATE_PIPE used it, `RBS_PIPE_DIAMETER_PARAM`, and the `RBS_CURVE_WIDTH_PARAM`,
  `RBS_CURVE_HEIGHT_PARAM` and `RBS_CURVE_DIAMETER_PARAM` parameters, as SET_MEP_SIZE uses them - all
  unchanged 2020 to 2027. The numbers are read with the invariant culture, so a
  PC set to a comma decimal separator reads 3122.5 as the caller meant it.

  Millimetres to feet is arithmetic - divide by 304.8, per D-20.

# 2026-11-01 - CREATE_DUCT WAS MERGED INTO THIS CARD on the owner's
# instruction ("now merge the other duplicates also"), and is DEPRECATED. The
# same drawing: straight duct between consecutive points, a system type, a duct
# type and a level, nothing connected. CREATE_DUCT WAS THE ONLY PROVEN
# STRAIGHT-DUCT TOOL - signed on 2026-09-13 on Revit 2024 - and this card is
# DRAFT, never proved (NEEDS-CHECKING Group AL), so until AL1 and AL2 are run
# a straight duct from here is kept only through D-117's try-once. CARD ONLY: the
# code already took everything CREATE_DUCT did. One run is the `runs` text with
# no size and no bar - the same points in millimetres that CREATE_DUCT took as
# a list; its `created` is this card's `elements`. Its `tooShort` and `refused`
# counts are, here, a refusal that names each one.
#
# THE CONFLICT, AND THE SAFER RULE KEPT: CREATE_DUCT kept the segments that
# worked and COUNTED the ones Revit refused, so a run that failed at segment
# nine left eight. This card is all or nothing (Article 8) - any segment too
# short, refused by Revit or snapped to another size undoes the whole job and
# names each problem. Half a layout that looks drawn is worse than none, so the
# keep-the-rest rule is NOT carried.

# VERSION 2 (2026-11-01) - CREATE_PIPE WAS MERGED INTO THIS CARD on the
# owner's instruction ("make sure there is no duplicate tools"), and is
# DEPRECATED. The same drawing in the other domain: straight pipe between
# consecutive points, a system type, a pipe type and a level, nothing
# connected. Widened the way CREATE_FLEX_PIPE was: the type class decides,
# MEPCurveType and MEPSystemType. Where its inputs and outputs are now: its
# `pipeType` is `ductType`, holding the pipe type; its `points` (internal feet)
# are a run's points in millimetres in `runs`; its `created` is `elements`; its
# `tooShort` and `refused` counts are a refusal naming each one.
#
# THE CONFLICTS, AND THE SAFER RULES KEPT: CREATE_PIPE kept the segments that
# worked and counted the ones Revit refused; this card is all or nothing
# (Article 8), as it was for CREATE_DUCT. CREATE_PIPE set no size and left the
# snap to SET_MEP_SIZE; here a size is optional per run and READ BACK - a pipe
# drawn at its type's own size when none is given, and a snapped size failing
# the job by name - so the snap is caught where the pipe is made.

# ROUTING - the neighbours this must not be confused with. Repeated in
# SPLIT_MEP_RUN, FIT_MEP_JOINTS and CREATE_ELECTRICAL_RUN.
#
#   "draw all the ducts"            -> here
#   "draw the mains and the branches" -> here
#   "draw a duct from here to there" -> here - one run, its points alone
#   "add a duct"                    -> here
#   "change these ducts to 400x250" -> SET_MEP_SIZE - existing ducts
#   "put the fittings in"           -> FIT_MEP_JOINTS, which follows this
#   "connect the open ends"         -> CONNECT_OPEN_ENDS, which follows that
#   "split this duct"               -> SPLIT_MEP_RUN - the run already exists
#   "join these two"                -> FIT_MEP_JOINTS. Connecting two
#                                      existing runs is not drawing a new one
#   "connect these two ducts"       -> FIT_MEP_JOINTS
#   "put an elbow here"             -> FIT_MEP_JOINTS - the fitting is
#                                      CHOSEN from the geometry, not named
#   "add a dimension between these" -> CREATE_DIMENSION
#   "run a pipe from here to there" -> here - a pipe type and a piping system
#                                      (CREATE_PIPE until 2026-11-01)
#   "put a drain line in"           -> here - it is still a pipe
#   "give it a fall of 1 in 100"    -> SET_MEP_SLOPE - drawn flat, then sloped
#   "they are touching but not connected" -> CONNECT_OPEN_ENDS
#   "draw a cable tray"             -> CREATE_ELECTRICAL_RUN
#   "draw a conduit"                -> CREATE_ELECTRICAL_RUN
#   "run flex to that diffuser"     -> CREATE_FLEX_PIPE - FLEXIBLE duct or
#                                      pipe; this makes rigid duct and pipe

utterances:
  - draw all the ducts
  - draw every duct run at once
  - draw the mains and the branches
  - make all the ducts at one time
  - draw the whole duct layout
  # MOVED 2026-11-01 from CREATE_DUCT, merged into this card.
  - draw straight duct segments along these points
  - draw a duct from here to there
  - run a duct across the room
  - add a duct between these points
  - draw the duct run
  - put a supply duct in
  - add a duct
  # MOVED 2026-11-01 from CREATE_PIPE, merged into this card.
  - run a pipe from here to there
  - draw a pipe between these points
  - draw the pipe run
  - add a pipe
  - put a drain line in
  - add a drain line
  - draw the chilled water pipe

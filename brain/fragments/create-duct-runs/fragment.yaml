    runTexts 1 item(s) [400x200: 80000,0,2700; 83000,0,2700], runWidth 1 item(s) [1.31233595800525],
    runsDrawn 1, segments 1, shortest 0.00256026455729167, sized 1, summary 1 run(s) drawn
    as 1 duct piece(s), 3000 mm along the points given; 1 sized as asked. NOTHING IS CONNECTED

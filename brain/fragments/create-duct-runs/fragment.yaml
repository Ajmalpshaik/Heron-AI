compatibility-note: >
  `Duct.Create(Document, ElementId, ElementId, ElementId, XYZ, XYZ)`, as
  CREATE_DUCT used it until it was merged in, `Pipe.Create` with the same
  arguments, as CREATE_PIPE used it, `RBS_PIPE_DIAMETER_PARAM`, and the `RBS_CURVE_WIDTH_PARAM`,
  `RBS_CURVE_HEIGHT_PARAM` and `RBS_CURVE_DIAMETER_PARAM` parameters, as SET_MEP_SIZE uses them - all
  unchanged 2020 to 2027. The numbers are read with the invariant culture, so a
  PC set to a comma decimal separator reads 3122.5 as the caller meant it.

  Millimetres to feet is arithmetic - divide by 304.8, per D-20.

  Version 3: `CableTray.Create` and `Conduit.Create(Document, ElementId, XYZ,
  XYZ, ElementId)`, as CREATE_ELECTRICAL_RUN used them, `FlexDuct.Create` and
  `FlexPipe.Create(Document, ElementId, ElementId, ElementId, IList<XYZ>)` and
  `FlexPipe.IsFlexPipeTypeId`, as CREATE_FLEX_PIPE used them, and
  `RBS_CABLETRAY_WIDTH_PARAM`, `RBS_CABLETRAY_HEIGHT_PARAM` and
  `RBS_CONDUIT_DIAMETER_PARAM` - present 2020 to 2027, compiled against all
  eight reference assemblies on 2026-11-01. No ElementId is built from a number.

# 2026-11-01 - CREATE_DUCT WAS MERGED INTO THIS CARD on the owner's
# instruction ("now merge the other duplicates also"), and is DEPRECATED. The
# same drawing: straight duct between consecutive points, a system type, a duct
# type and a level, nothing connected. CREATE_DUCT WAS THE ONLY PROVEN
# STRAIGHT-DUCT TOOL - signed on 2026-09-13 on Revit 2024 - and this card is
# DRAFT, never proved (NEEDS-CHECKING Group AL), so until AL1 and AL2 are run
# a straight duct from here is kept only through D-117's try-once. CARD ONLY: the
# code already took everything CREATE_DUCT did. One run is the `runs` text with
# no size and no bar - the same points in millimetres that CREATE_DUCT took as
# a list; its `created` is this card's `elements`. Its `tooShort` and `refused`
# counts are, here, a refusal that names each one.
#
# THE CONFLICT, AND THE SAFER RULE KEPT: CREATE_DUCT kept the segments that
# worked and COUNTED the ones Revit refused, so a run that failed at segment
# nine left eight. This card is all or nothing (Article 8) - any segment too
# short, refused by Revit or snapped to another size undoes the whole job and
# names each problem. Half a layout that looks drawn is worse than none, so the
# keep-the-rest rule is NOT carried.

# VERSION 2 (2026-11-01) - CREATE_PIPE WAS MERGED INTO THIS CARD on the
# owner's instruction ("make sure there is no duplicate tools"), and is
# DEPRECATED. The same drawing in the other domain: straight pipe between
# consecutive points, a system type, a pipe type and a level, nothing
# connected. Widened the way CREATE_FLEX_PIPE was: the type class decides,
# MEPCurveType and MEPSystemType. Where its inputs and outputs are now: its
# `pipeType` is `ductType`, holding the pipe type; its `points` (internal feet)
# are a run's points in millimetres in `runs`; its `created` is `elements`; its
# `tooShort` and `refused` counts are a refusal naming each one.
#
# THE CONFLICTS, AND THE SAFER RULES KEPT: CREATE_PIPE kept the segments that
# worked and counted the ones Revit refused; this card is all or nothing
# (Article 8), as it was for CREATE_DUCT. CREATE_PIPE set no size and left the
# snap to SET_MEP_SIZE; here a size is optional per run and READ BACK - a pipe
# drawn at its type's own size when none is given, and a snapped size failing
# the job by name - so the snap is caught where the pipe is made.

# VERSION 3 (2026-11-01) - CREATE_ELECTRICAL_RUN AND CREATE_FLEX_PIPE WERE
# MERGED INTO THIS CARD on the owner's instruction ("make sure there is no
# duplicate tools", "in every conflict keep the safer rule"), and both are
# DEPRECATED. Where their inputs and outputs are now:
#
#   CREATE_ELECTRICAL_RUN  runType -> ductType (a cable tray or conduit type);
#                          runKind -> runKind, now optional and checked against
#                          the type; points (internal feet) -> a run's points in
#                          millimetres in `runs`; created -> elements; tooShort
#                          and refused -> a refusal naming each one; findings ->
#                          summary. No system type: left out.
#   CREATE_FLEX_PIPE       flexPipeType -> ductType (a flex duct or flex pipe
#                          type); systemType -> systemType; points -> ONE run in
#                          `runs`, drawn as ONE flex curve through every point;
#                          maxLengthMm -> maxLengthMm, required for flex, the
#                          route refused before anything is made; created ->
#                          elements (one per run); lengthMm -> lengthMm;
#                          refused and findings -> the refusal, or summary.
#
# THE CONFLICTS, AND THE SAFER RULES KEPT: CREATE_ELECTRICAL_RUN kept the
# segments that worked and counted the refused and the too-short ones; this
# card is all or nothing (Article 8). Both set no size and left Revit's snap to
# SET_MEP_SIZE; here a size is optional per run and READ BACK, a snap failing
# the job by name. CREATE_FLEX_PIPE answered a refused route with no exception
# and `created` null; here it throws, so the caller's transaction rolls back
# with nothing made - the same outcome, one rule for every kind.

# ROUTING - the neighbours this must not be confused with. Repeated in
# SPLIT_MEP_RUN, FIT_MEP_JOINTS and SET_MEP_SIZE.
#
#   "draw all the ducts"            -> here
#   "draw the mains and the branches" -> here
#   "draw a duct from here to there" -> here - one run, its points alone
#   "add a duct"                    -> here
#   "change these ducts to 400x250" -> SET_MEP_SIZE - existing ducts
#   "put the fittings in"           -> FIT_MEP_JOINTS, which follows this
#   "connect the open ends"         -> CONNECT_OPEN_ENDS, which follows that
#   "split this duct"               -> SPLIT_MEP_RUN - the run already exists
#   "join these two"                -> FIT_MEP_JOINTS. Connecting two
#                                      existing runs is not drawing a new one
#   "connect these two ducts"       -> FIT_MEP_JOINTS
#   "put an elbow here"             -> FIT_MEP_JOINTS - the fitting is
#                                      CHOSEN from the geometry, not named
#   "add a dimension between these" -> CREATE_DIMENSION
#   "run a pipe from here to there" -> here - a pipe type and a piping system
#                                      (CREATE_PIPE until 2026-11-01)
#   "put a drain line in"           -> here - it is still a pipe
#   "give it a fall of 1 in 100"    -> SET_MEP_SLOPE - drawn flat, then sloped
#   "they are touching but not connected" -> CONNECT_OPEN_ENDS
#   "draw a cable tray"             -> here, with a cable tray type and no
#                                      system (CREATE_ELECTRICAL_RUN until
#                                      2026-11-01)
#   "draw a conduit"                -> here, with a conduit type
#   "run the containment across"    -> here
#   "run flex to that diffuser"     -> here, with a FLEX duct type, a duct
#                                      system and a maximum length
#                                      (CREATE_FLEX_PIPE until 2026-11-01)
#   "make the flex drop to the head" -> here, with a FLEX pipe type
#   "circuit these sockets"         -> CREATE_MEP_SYSTEM - a circuit is the
#                                      electrical relationship, not containment
#   "connect the terminal to the duct" -> CONNECT_AIR_TERMINALS. This makes
#                                      the flex and does NOT join it up
#   "is the sprinkler connected"    -> TRACE_CONNECTIVITY


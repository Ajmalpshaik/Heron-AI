id: FRG-MEP-052
semantic-identity: "draw duct, pipe, cable tray or conduit - or a flexible duct or pipe - one run from here to there or every run of a layout, each at its own size, in one go"
kind: action
domain: revit.mep
capability: CREATE_DUCT_RUNS
version: 3
source: OFFICIAL
risk: MODIFY

purpose: >
  Draws straight duct OR straight pipe - one run from here to there, or every
  main and every branch of a layout - in ONE call and ONE undo step, each run
  at its own size. Since 2026-11-01 it is the one straight-duct and
  straight-pipe tool: CREATE_DUCT, which drew one duct run per call, and
  CREATE_PIPE, which drew straight pipe between points, were merged into it.

  **Cable tray, conduit and flex too: the type decides (version 3,
  2026-11-01).** CREATE_ELECTRICAL_RUN, which drew cable tray or conduit, and
  CREATE_FLEX_PIPE, which made one flexible duct or pipe, were merged in. A
  cable tray or conduit type draws containment between consecutive points and
  takes NO system type - one named with it is refused. A flex duct or flex pipe
  type makes ONE flexible curve through every point of a run, and needs a
  maximum length: `maxLengthMm` greater than zero, and a run whose route is
  longer is refused before anything is made. `runKind` - tray, conduit, duct,
  pipe, flex duct, flex pipe - may be said as well, and must then agree with
  the type. Sizes stay optional per run and read back: a tray is WxH, a
  conduit d25.

  **Duct or pipe: the type decides (version 2, 2026-11-01).** Name a duct type
  and a duct system and it draws duct; name a pipe type and a piping system
  and it draws pipe - as a flex type draws flex. The two must go
  together, checked by name before Revit is asked. A pipe run's size is a
  diameter, `d50`; a width by height on a pipe type is refused. Revit snaps a
  pipe size to its segment's sizes and still reports success - 77 asked, 80
  made - so every size is read back, and a snap fails the whole job, named.

  **It exists because drawing was the slow half once the fittings were not.**
  On 2026-09-23 a five-room supply layout took twenty-five CREATE_DUCT calls
  and two SET_MEP_SIZE calls, then one FIT_MEP_JOINTS and one
  CONNECT_OPEN_ENDS. The owner asked for the drawing to be done at one time as
  well. With this the whole layout is three calls: draw, fit, join.

  **How to write the runs.** Runs are separated by | . Each is an optional
  size - WxH for rectangular, d250 for round, in millimetres - a colon, then the
  points in millimetres, x,y,z each, separated by ; . Consecutive points make
  one segment each. No size means the duct type's own:
  `850x195: 3075,-2100,3122.5; 3075,-1100,3122.5 | 300x300: 3075,-1100,3122.5; 3075,8100,3122.5`

  **One run is just its points**, with no size and no bar - two points give one
  duct, five give four, at the duct type's own size:
  `0,40000,2500; 3000,40000,2500`

  **It guesses no route.** Every point is given and used in order. Deciding
  where ducts go - reading the connectors, leaving room for an elbow or a
  transition - happens before this call.

  **It connects nothing.** The new ducts are left as `elements`, so
  FIT_MEP_JOINTS can take them straight from here, and CONNECT_OPEN_ENDS joins
  the free ends to equipment and terminals after that.

  **All or nothing.** A run it cannot read, a segment too short to exist, a duct
  Revit will not create, or a size the duct type snaps to something else - any
  one of them rolls the whole job back and names each problem (Article 8).

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # RESOLVED OBJECTS, never ids - the 2024 ElementId trap (D-05).
    # Version 2: a duct system OR a piping system - MEPSystemType, which the
    # binder resolves as "duct or pipe system type". It must go with the type
    # below: a duct type with a duct system, a pipe type with a piping system,
    # checked by name before Revit is asked. Version 1 took a
    # MechanicalSystemType only.
    #
    # Version 3: OPTIONAL. Cable tray and conduit carry no system in Revit, so
    # it is left out for a cable tray or conduit type - and one named with them
    # is refused, because it says duct or pipe was meant. Left out for any
    # other type, that type is refused by name. Absent binds null
    # (HeronBindingNote.AbsentValue).
    - name: systemType
      type: MEPSystemType
      source: request
      optional: true
    # A DUCT type or a PIPE type (version 2), or a CABLE TRAY, CONDUIT, FLEX
    # DUCT or FLEX PIPE type (version 3), and which it is decides what is
    # drawn - CREATE_ELECTRICAL_RUN's `runType`, CREATE_FLEX_PIPE's
    # `flexPipeType`. MEPCurveType because the binder resolves that class by name and
    # both derive from it; anything else is refused by name. Still called
    # `ductType` so every call written for version 1 runs unchanged - for a
    # pipe it is the pipe type (CREATE_PIPE's `pipeType`).
    - name: ductType
      type: MEPCurveType
      source: request
    - name: level
      type: Level
      source: request
    # The runs as the caller typed them - millimetres, converted here once
    # (D-20). A string on purpose: many runs, each with its own size, is not
    # something a list of points can say.
    - name: runs
      type: string
      source: request
    # Version 3, CREATE_FLEX_PIPE's limit, in millimetres. REQUIRED greater
    # than zero for a flex duct or flex pipe type; a run whose route, measured
    # along its points, is longer is refused before anything is made. Given for
    # a rigid type it holds there too. Left out it is 0 - no limit for rigid,
    # refused for flex.
    - name: maxLengthMm
      type: double
      source: request
      optional: true
      absent: '0'
    # Version 3, CREATE_ELECTRICAL_RUN's "asked for, never guessed": duct,
    # pipe, tray, conduit, flex duct or flex pipe. Left out it is `any` and the
    # type decides; said, it must agree with the type or nothing is drawn. Any
    # other word is refused, naming the ones it takes.
    - name: runKind
      type: string
      source: request
      optional: true
      absent: any
  provides:
    # The new ducts or pipes, named `elements` on purpose so FIT_MEP_JOINTS
    # can take them straight from here with expect_from. CREATE_PIPE's
    # `created`.
    - name: elements
      role: result
      type: IList<Element>
    - name: runsDrawn
      role: result
      type: int
    - name: segments
      role: result
      type: int
    - name: sized
      role: result
      type: int
    # Version 3: the length drawn, in millimetres, measured along the points
    # given - CREATE_FLEX_PIPE's `lengthMm`, now for every kind. Nothing drawn
    # is a refusal, never a 0 here.
    - name: lengthMm
      role: result
      type: double
    # The whole answer as ONE string, because a string reaches the reader whole.
    - name: summary
      role: result
      type: string


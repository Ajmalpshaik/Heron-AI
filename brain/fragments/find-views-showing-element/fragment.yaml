id: FRG-VIEW-019
semantic-identity: "which views and sheets show this element"
kind: action
domain: revit.reporting
capability: FIND_VIEWS_SHOWING_ELEMENT
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Which views show a given element, and which of those views are on sheets.

  **This is the question to ask BEFORE changing or deleting something.** An
  element that appears on four issued sheets is a different decision from one
  that appears nowhere. Revit will not warn, and the drawings are found later
  by whoever is checking the set.

  **The sheet answer is the one that matters.** A view nobody has placed can be
  changed freely; a view on a sheet is a drawing somebody will receive.

  **It is genuinely expensive and says so.** One collector pass per view, over
  every view in the project. That is the honest cost of a true answer — Revit
  keeps no reverse index — and it is why this is a deliberate check rather than
  something to run in a loop.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
  provides:
    - name: inViews
      role: result
      type: IDictionary<ElementId, ICollection<ElementId>>
    - name: onSheets
      role: result
      type: IDictionary<ElementId, ICollection<ElementId>>
    - name: nowhere
      type: IList<ElementId>
      # Elements that were looked at and appear in no view. Not a finding about
      # views - a count of what was handed in and had nothing to report.
      role: accounting

proof:
  date: '2026-09-07'
  by: Ajmal PS
  model: Snowdon Towers Sample HVAC (9,628 elements), Revit 2024, session 42676
  positive_case: 28 duct taps selected in Snowdon Towers Sample HVAC - modelled things that
    appear in views and on sheets - run as it would normally be run. returned inViews 28 entry(ies),
    nowhere 0 item(s), onSheets 28 entry(ies), sheetOf 23 entry(ies), wanted HashSet`1. inputs
    came elements from the selection (28). on Snowdon Towers Sample HVAC
  negative_case: 12 sheets selected in the same model. A sheet is not drawn INSIDE a view
    - it is the thing views are placed on - so there is nothing for this fragment to find,
    and it accounted for all 12 as nowhere rather than returning a bare zero. returned inViews
    0 entry(ies), nowhere 12 item(s) [1363532, 1363547, 1363562, ...], onSheets 0 entry(ies),
    sheetOf 23 entry(ies), wanted HashSet`1. inputs came elements from the selection (12).
    on Snowdon Towers Sample HVAC
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: f46a619cbd6673f8

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `FilteredElementCollector(Document,
  ElementId)`, `View.IsTemplate`, `View.CanBePrinted` and `Viewport.SheetId`
  are unchanged 2020 to 2027, and no ElementId is built from an integer.

# ROUTING - repeated in DELETE_ELEMENTS and DIAGNOSE_VISIBILITY.
#
#   "where is this used"            -> here
#   "what views show this"          -> here
#   "delete these"                  -> DELETE_ELEMENTS - and this is what to
#                                      run first if any of them might be on a
#                                      sheet
#   "why can I NOT see it"          -> DIAGNOSE_VISIBILITY, the opposite
#                                      question about one view
#
# THIS AND DIAGNOSE_VISIBILITY ARE THE SAME READ ASKED TWO WAYS: one view many
# causes, or one element many views.

utterances:
  - what views is this element shown in
  - where is this used
  - which sheets show this
  - is this on any drawing
  - will deleting this change a sheet

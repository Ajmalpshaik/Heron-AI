semantic-identity: "place the adaptive points an adaptive component is clicked into place by, in an adaptive or pattern-based family"
kind: action
domain: revit.families
capability: PLACE_ADAPTIVE_POINTS
# VERSION 2 (2026-11-22) - A POINT PUSHED OFF ANOTHER POINT'S PLANE, Revit's
# Offset, and back to DRAFT. Asked for the folded pattern-based curtain panel
# (Metric Curtain Panel Pattern Based, Triangle tile): a TIP point over the
# cell's centroid, out along the panel's normal, so lines from the corners to
# it and CREATE_CONCEPTUAL_FORM make a pyramid facet - and its distance
# driven by a family length parameter (Tip Depth) through LINK_FAMILY_
# PARAMETER version 6, so the tip follows every cell of a divided surface.
# Version 1 hosted a point ON a point's plane only; nothing pushed one off it.
# The centroid itself is built from what was there: a mid-point "on <edge> at
# 0.5", a median by DRAW_FAMILY_POINT_CURVES, then "on <median> at 0.6667".
# Two new forms, the old three unchanged:
#   "on point <n or id> normal <mm>" - the host's plane that lies in the panel
#     the placement points span is FOUND (a point on a line takes its planes
#     from the line, so which one lies in the panel is Revit's to say); within
#     half a degree, or refused naming each plane's angle. With fewer than
#     three placement points the family's unhosted points give the panel
#     (BV4 is open on whether a pattern-based template's points read as
#     placement points). They must lie in one plane.
#   "on point <n or id> xy|yz|xz U,V offset <mm>" - a plane named.
# OFFSET READS WHAT WAS TYPED: Revit measures it along the plane's own normal,
# which may face either way; where it reads the opposite it is set to the
# number typed, so a parameter linked to it later holds the same number, and
# the answer says which side that is - "the side from which placement points
# 1, 2, 3 run anticlockwise". Refusals come back as `refused` with nothing
# made; only Revit's own failures throw. Version 1 was PROVEN (the proof
# block below, kept as the record of what it proved); its C# moved, so it is
# DRAFT until NEEDS-CHECKING Group PQ is run (D-30).
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Places POINTS in an adaptive component, a pattern-based panel or a mass open
  in the Family Editor - the Point tool, then Make Adaptive. A modeller places
  an adaptive family by clicking its PLACEMENT points in their number order,
  and its shape follows wherever they land: a four-point panel, a two-point
  beam, a three-point bracket. A SHAPE HANDLE point moves the shape after
  placement; a plain REFERENCE point is a point to build on.

  **ONLY IN A CONCEPTUAL FAMILY.** Revit makes reference points only in an
  adaptive component, a pattern-based panel or a mass; any other family is
  refused before anything is made, naming the templates that make one. A
  PLACEMENT or SHAPE HANDLE point is an adaptive point, which Revit makes only
  in an adaptive family - a mass is refused them and takes reference points.

  **THREE WAYS TO SAY WHERE**, semicolons between, made in the order given:
  FREE - "X,Y,Z" in millimetres from the family origin; HOSTED ON A LINE -
  "on <line id> at 0.25", that far along it from its start (Revit's normalised
  curve parameter), so it slides with the line: an inset frame, a mid-point,
  an opening that scales with the cell; HOSTED ON A POINT'S OWN PLANE - "on
  point 1 yz 0,150", millimetres along that plane's two axes, so a profile
  drawn through such points turns with the point: a two-point beam's section.
  A hosted point is a REFERENCE point that follows its host; placement and
  shape handle points are free ones, so the two are not mixed in one call.

  **PUSHED OFF A POINT'S PLANE (version 2)** - Revit's Offset: "on point 7
  normal 300" puts a point 300 mm off the plane of point 7 that lies in the
  panel, along the panel's normal - a folded panel's TIP over a centre point,
  so lines from the corners to it make a pyramid facet; "on point 1 xy 0,0
  offset 300" pushes off a plane named. Offset reads the number typed, and
  the answer says which side of the panel that is; a negative number is the
  other side. Its Offset can then follow a family parameter such as Tip
  Depth through LINK_FAMILY_PARAMETER.

  **ALL OR NOTHING**: every point's position, kind and number are read again;
  placement numbers must rise in the order given, and numbers that are not the
  next ones after the family's own are reported. A point where another
  already is - in this call or in the family - is refused. Their ids come back.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # "X,Y,Z" in millimetres, semicolons between, in placement order -
    # "0,0,0; 1000,0,0; 1000,1000,0; 0,1000,0" - or hosted: "on <line id> at
    # 0.5", "on point 1 yz 0,150"; or pushed off a point's plane (version 2):
    # "on point 7 normal 300", "on point 1 xy 0,0 offset 300".
    - name: points
      type: string
      source: request
    # placement, shape handle or reference.
    - name: pointKind
      type: string
      source: request
  provides:
    - name: pointIds
      # The new points' unique ids, commas between, in the order given.
      role: result
      type: string
    - name: placedPoints
      # Every point as read back - kind, placement number, id, position - on
      # ONE line. A point pushed off a plane has its Offset and side in
      # `findings` too ("Pushed off: ...").
      role: result
      type: string
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing was placed, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


compatibility-note: >
  `FamilyItemFactory.NewReferencePoint(XYZ)` - which Autodesk's remarks say
  throws when the family is not a conceptual one - and
  `AdaptiveComponentFamilyUtils.MakeAdaptivePoint`, `GetPlacementNumber`,
  `IsAdaptivePlacementPoint` and `GetNumberOfPlacementPoints` read the same
  2020 through 2027 (the RevitAPI reference assemblies and XML remarks, read
  2026-10-01). Whether Revit's conceptual flag reads true for the adaptive and
  pattern-based templates as well as a mass is NEEDS-CHECKING BV4; the check
  here accepts any of the three flags. A hosted point is
  `FamilyItemFactory.NewReferencePoint(PointElementReference)` on
  `Application.NewPointOnEdge` with a `PointLocationOnCurve`, or on
  `PointOnPlane.NewPointOnPlane` with `ReferencePoint.GetCoordinatePlaneReference
  XY/YZ/XZ` - all 2020 through 2027 (the RevitAPI XML, read 2026-10-02).
  VERSION 2: `PointOnPlane.NewPointOnPlane(Document, Reference, XYZ, XYZ)` -
  whose 2020 remark says a position off the plane sets the point's Offset -
  `ReferencePoint.GetCoordinateSystem`, and `BuiltInParameter.
  POINT_ELEMENT_OFFSET` ("Offset", measured along the plane's normal per
  `PointOnPlane.Offset`'s remark) read the same 2020 through 2027 (the
  nice3point RevitAPI XML, 2020.2.90 read 2026-11-22). Which way Offset runs
  on each of a point's three planes, and which of a line-hosted point's
  planes lies in the panel, are NEEDS-CHECKING PQ1, PQ2 and PQ9 - the call finds
  both at run time rather than assuming either.

# ROUTING - see SET_FAMILY_SETTINGS for the whole family-building table.
#
#   "add four adaptive points to this family"     -> here
#   "draw lines between the adaptive points"      -> DRAW_FAMILY_POINT_CURVES
#   "make a surface from these lines"             -> CREATE_CONCEPTUAL_FORM

# ROUTING (2026-11-22, version 2 - the folded pattern panel)
#
#   "put a tip point out along the panel's normal" -> here, "on point <n> normal <mm>"
#   "link the tip point's offset to Tip Depth"     -> LINK_FAMILY_PARAMETER
#                                                    (version 6) - this MAKES the
#                                                    point; that links its Offset
#   "add a Tip Depth length parameter"             -> ADD_FAMILY_PARAMETERS


# ROUTING (2026-10-13, the gap fill)
#
#   "place this adaptive panel on these four points" -> PLACE_ADAPTIVE_COMPONENTS

# ROUTING (2026-10-28) - a comment only; this card's impl/ and its proof are
# untouched.
#
#   "set the adaptive points orientation to host and loop system"
#                                                 -> SET_ADAPTIVE_POINT_ORIENTATION -
#                                                    this MAKES the points; that
#                                                    sets each one's Orientation
utterances:
  - add four adaptive points to this family
  - host a point on this line at its midpoint
  - add points on the yz plane of point 1 for the beam profile
  - place adaptive placement points
  - make these points adaptive
  - add a shape handle point to the adaptive component
  # VERSION 2 (2026-11-22): the folded pattern panel's tip.
  - put a tip point out along the panel's normal above the centre point
  - push a reference point off the point's plane by 300 mm

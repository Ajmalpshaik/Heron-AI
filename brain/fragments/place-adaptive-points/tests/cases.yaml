positive:
  - given: >
      a new family from the metric Generic Model Adaptive template; points
      "0,0,0; 1000,0,0; 1000,1000,0; 0,1000,0", pointKind "placement"
    expect: >
      four placement points numbered 1 to 4 in that order, each read back where
      it was asked; the family now has 4 placement points; LOOKED AT - the
      numbers shown beside them in the Family Editor

  - given: the same family; points "500,500,300", pointKind "shape handle"
    expect: one shape handle point at 500,500,300, read back, with no number

negative:
  - given: a new family from the plain metric Generic Model template
    expect: >
      refused - not an adaptive component, a pattern-based panel or a mass -
      and nothing placed

  - given: points "0,0" in the adaptive family
    expect: refused - not a point X,Y,Z - and nothing placed

  - given: a project in front
    expect: notAFamily true and nothing placed

second_route:
  - >
      In the Family Editor, select each point: Properties shows it as an
      Adaptive Point with its Point number

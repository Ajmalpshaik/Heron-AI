id: FRG-VIEW-016
semantic-identity: "why is this element not showing in this view"
kind: action
domain: revit.views
capability: DIAGNOSE_VISIBILITY
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Says whether an element is actually shown in a view, and when it is not,
  **which of the reasons applies**.

  *"Why can I not see my ducts"* is one of the most expensive questions in
  Revit, because there are at least eight unrelated answers and no single place
  to look: the element is hidden, its category is off, a view filter excludes
  it, it is outside the view range, outside the crop, wrong phase, wrong design
  option, or on an unloaded workset. A modeller checks them one at a time and
  usually in the wrong order.

  **The ground truth is asked FIRST, and it is not a guess.** A collector
  scoped to the view returns what the view actually contains. Everything after
  that is explaining a fact rather than predicting one — which is the
  difference between this and a checklist.

  **It reports EVERY cause it finds, not the first.** Two causes at once is
  routine — a category switched off in a template *and* the element hidden by
  somebody — and fixing one leaves it still invisible, which is how the second
  hour goes.

contract:
  needs:
    - name: doc
      type: Document
    - name: view
      type: View
      source: request
    - name: elements
      type: IList<Element>
  provides:
    - name: visible
      # The elements that ARE shown, which is the complement of the answer.
      # This fragment exists to say WHY something is not visible; the ones
      # with nothing to explain are the evidence it looked (D-52).
      role: accounting
      type: IList<ElementId>
    - name: reasons
      type: IDictionary<ElementId, string>


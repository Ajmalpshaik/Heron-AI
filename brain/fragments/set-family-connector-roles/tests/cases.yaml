positive:
  - given: >
      a Pipe Accessories valve family with pipe connectors on faces lying on
      Port Left and Port Right (x = -49 and +49 mm), sized by Nominal
      Diameter, plus a third Domestic Cold Water connector added on Port Left
      by ADD_FAMILY_CONNECTOR as a setup step; connectors "all", settings
      "system=Global"
    expect: >
      the Domestic Cold Water connector reads Global, the two already Global
      are reported "already Global", nothing else changes. MEASURED
      2026-10-04, Revit 2024, rolled back in TRG_PLMB_VLV_PPR Gate Valve_GV_R0

  - given: >
      the same family; connectors "Port Right", settings "flowDirection=Out;
      flowConfiguration=Preset; sizeParameters=Nominal Diameter;
      description=Outlet; flip=true", primary "Port Right", links "Port Left >
      Port Right"
    expect: >
      Port Right reads flow Out, Preset, described "Outlet", pointing left (-X)
      where it pointed right (+X), still found on "Port Right", PRIMARY, and
      the pair linked both ways. MEASURED 2026-10-04, as above

  - given: the same family, connectors, settings, primary and links all empty
    expect: every connector listed, nothing changed - the read mode

  - given: >
      a duct fitting family - Part Type Elbow - with two round duct connectors
      made by ADD_FAMILY_CONNECTOR on faces lying on "Inlet" and "Outlet";
      primary "Inlet"
    expect: >
      the Inlet connector reads PRIMARY and the Outlet one secondary in the
      report; a finding when the Inlet connector does not point along X
      (Autodesk's help puts a fitting's primary on the X axis); LOOKED AT in
      the Family Editor - the primary connector's Properties (BV17)

  - given: >
      a mechanical equipment family (a coil) with two pipe connectors whose
      System Classification is Global, on "Water In" and "Water Out"; links
      "Water In > Water Out"
    expect: >
      both connectors read linked to each other; RECORD whether Revit linked
      both ends or Heron set the second (BV17); then loaded into a test project
      and piped on both sides - the two pipe runs read as ONE system

  - given: links "Water In > none" on the same family
    expect: both connectors read not linked; the change names the former partner

  - given: >
      VERSION 3. A scratch Electrical Equipment family from the metric
      template, one box, and ADD_FAMILY_CONNECTOR "Power Balanced" on the face
      lying on "Box Top"; connectors "Box Top", settings "voltage=400 V;
      poles=3; apparentLoad=1.5 kVA; powerFactor=0.85"
    expect: >
      changed names all four; connectorReport reads 400 V, 3 pole(s), 1500 VA,
      power factor 0.85; findings quote what Revit shows for each - "400.00 V"
      or as the family's units format it, and 1500 VA - and the connector's
      Properties in the Family Editor read the same. A voltage that reads 37.2 V
      or 4305 V instead is the unit factor wrong, and the refusal that checks
      it against UnitUtils should have stopped it first

  - given: >
      the same family; connectors "Box Top", settings "voltage=230 V [Supply
      Voltage]; apparentLoad=[Rated Load]", neither parameter in the family
    expect: >
      two type parameters made under Electrical - Loads, of Electrical
      Potential and Apparent Power kind; Supply Voltage holds 230 V in the
      current type and the connector's Voltage reads 230 V, driven by it;
      Apparent Load driven by Rated Load and reading 0 VA until a value is
      given; Family Types shows both

  - given: >
      VERSION 4. A scratch Mechanical Equipment family with a Sanitary pipe
      connector on the face lying on "Outlet Face" (flow Out), a second on
      "Inlet Face" (flow In), and a Supply Air duct connector on "Duct Face",
      each made by ADD_FAMILY_CONNECTOR; connectors "Outlet Face, Inlet
      Face", settings "allowSlopeAdjustments=yes"
    expect: >
      changed names both pipe connectors "Allow Slope Adjustments no -> yes";
      connectorReport reads "slope adjustments allowed" on each; a finding
      per connector quotes what Revit shows ("Yes"); the connector's
      Properties in the Family Editor show the box ticked; then
      "allowSlopeAdjustments=no" unticks it and reads "no slope adjustments"

  - given: >
      the same family; connectors "Outlet Face", settings
      "flowConfiguration=Preset; presetFlow=12 L/s"
    expect: >
      changed names the configuration and the flow; connectorReport reads
      "flow configuration Preset, preset flow 12 L/s"; the finding quotes
      Revit's own display of the Flow. A flow shown as 0.34 L/s or 423.8 L/s
      is the unit factor wrong, and the refusal that checks it against
      UnitUtils should have stopped it first

  - given: >
      the same family; connectors "Duct Face", settings
      "flowConfiguration=System; flowFactor=50%"
    expect: >
      the duct connector reads "flow configuration System, flow factor 0.5"

  - given: >
      a duct fitting family - Part Type Elbow - with two Fitting duct
      connectors on "Inlet" and "Outlet", and a type Angle parameter;
      connectors "all", settings "angle=90 [Angle]"
    expect: >
      both connectors' Angle driven by Angle, Angle holding 90 degrees in the
      current type, each row reading "angle 90 degrees (<- Angle)"; the
      elbow flexes when Angle changes

  - given: >
      the Electrical Equipment family of version 3; connectors "Box Top",
      settings "powerFactorState=Leading"
    expect: the connector reads "power factor state Leading" and its Properties agree

  - given: connectors "all", settings "utility=yes" on the Mechanical Equipment family above
    expect: >
      each connector that carries the Utility box reads "utility"; one that
      has none is refused by name - which domains carry it is RECORDED, not
      assumed (Group IR)

negative:
  - given: connectors "Port Middle", where no connector lies on such a plane
    expect: refused, naming the family's connectors - nothing changed. MEASURED 2026-10-04

  - given: connectors "all", settings "system=Supply Air" on the pipe connectors
    expect: >
      refused per connector with the systems a pipe connector takes (Revit's
      IsSystemClassificationValid) - nothing changed. MEASURED 2026-10-04

  - given: an electrical connector (Power Balanced) and settings "system=Global"
    expect: >
      NOT A NEGATIVE ON REVIT 2024: Revit accepts Global on an electrical
      connector and it reads back Global (measured 2026-10-04). Kept here so a
      release that refuses it is noticed; the refusal would name the systems
      that connector takes

  - given: links "Water In > Neck Top", where Neck Top holds a duct connector
    expect: refused - a pipe connector paired with a duct one - and nothing changed

  - given: >
      primary "Ref. Level" in a family with two connectors on faces lying on
      Ref. Level
    expect: refused - two connectors lie on that plane, naming both ids - nothing changed

  - given: >
      links "Water In > Water Out" where both connectors are Hydronic Supply,
      not Global
    expect: >
      linked, read back both ways, and a finding that a linked pair passes a
      system through only as Global - their system NOT changed

  - given: >
      VERSION 3. The valve family above; connectors "Port Left", settings
      "voltage=400 V" - a pipe connector
    expect: refused - Voltage is an electrical connector's - and nothing changed

  - given: >
      the Electrical Equipment family above; settings "voltage=400 V
      [Width]", Width a Length parameter of the family
    expect: >
      refused naming Width's kind and the connector Voltage's kind, and nothing
      changed - no parameter made, the connector's Voltage as it was

  - given: the same; settings "poles=4"
    expect: refused - 1, 2 or 3 - and nothing changed

  - given: >
      VERSION 4. The Mechanical Equipment family above; connectors "Duct
      Face", settings "allowSlopeAdjustments=yes" - a duct connector
    expect: >
      refused in one sentence naming the connector and its domain - 'duct
      connector NNNN on "Duct Face" is a duct connector - Allow Slope
      Adjustments is a pipe connector's' - changed empty, nothing written;
      the same for "allowSlopeAdjustments=yes" on an electrical connector

  - given: connectors "Outlet Face", settings "allowSlopeAdjustments=maybe"
    expect: refused - yes or no - and nothing changed

  - given: connectors "Outlet Face", settings "powerFactorState=Lagging" - a pipe connector
    expect: refused naming the connector and its domain - Power Factor State is an electrical connector's

  - given: connectors "Box Top", settings "angle=90" - an electrical connector
    expect: refused naming the connector and its domain - Angle is a fitting's connector's

  - given: connectors "Duct Face", settings "presetFlow=12 L/s; presetFlow=13 L/s"
    expect: refused - Flow is given twice - and nothing changed

  - given: connectors "Outlet Face", settings "presetFlow=-5 L/s"
    expect: refused - a flow of 0 or more - and nothing changed

  - given: a project in front
    expect: notAFamily true and nothing changed

second_route:
  - >
      In the Family Editor, select each connector: Properties shows System
      Classification, and the ribbon's connector tools show which is primary
      and which are linked
  - >
      VERSION 3. In the Family Editor, the electrical connector's Properties -
      Voltage, Number of Poles, Apparent Load, Power Factor, Load
      Classification, and the small button at the end of each row showing the
      family parameter it is associated with; then the family loaded into a
      test project, placed, and its Properties and an Electrical Equipment
      schedule read for whatever Revit offers of Voltage and Number of Poles -
      which of them a project shows without a shared parameter is part of
      what is measured

id: FRG-MEP-055
semantic-identity: "choose which connector of the family being edited is primary, and link connector pairs so a system passes through it"
kind: action
domain: revit.families
capability: SET_FAMILY_CONNECTOR_ROLES
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Sets the two connector settings a new connector is left at by Revit, in the
  family open in the Family Editor: which connector is PRIMARY, and which pairs
  are LINKED.

  **ONE PRIMARY PER DOMAIN.** `AssignAsPrimary` promotes the connector named
  and, in Revit's own remark, makes the rest of its system secondary. A
  fitting's primary connector belongs on the face lying on the X axis
  (Autodesk's help, as the mep-fitting skill records) - one that does not is
  reported, not refused.

  **A LINKED PAIR PASSES A SYSTEM THROUGH THE FAMILY** - a coil, a pump, a valve
  body - so the run on one side and the run on the other become one system. The
  sources docs/43 §10 records say it does so only when both connectors' system
  is Global; a pair that is not is reported with the words to fix it, and its
  system is never changed here. `"Inlet > none"` removes a link, and
  `"Inlet > none | Inlet > Branch"` moves one to a new partner in one call -
  the unlinks run first.

  **A CONNECTOR IS NAMED BY THE PLANE ITS FACE LIES ON** - "Neck Top", the way
  ADD_FAMILY_CONNECTOR places one - or by its id from the report. A plane that
  holds more than one connector is refused with their ids.

  **CHECKED FIRST, READ BACK AFTER, ALL OR NOTHING.** A pair of two domains, a
  connector linked to itself or in two pairs, or a connector already linked to a
  third one and not unlinked in the same call, is refused before anything
  changes. After the change the primary
  must read primary and each link must read linked BOTH ways; where Revit set
  only one end, the other is set to match and the report says so. Every
  connector is reported before and after.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The connector to make primary: the plane its face lies on, "Neck Top", or
    # its id. Empty leaves the primary as it is.
    - name: primary
      type: string
      source: request
    # Pairs to link, `|` between - "Inlet > Outlet". "Inlet > none" unlinks.
    # Each end is a plane name or an id. Empty links nothing.
    - name: links
      type: string
      source: request
  provides:
    - name: connectorReport
      # Every connector as read back: domain, id, the plane it lies on, system,
      # direction, primary or secondary, what it is linked to - on ONE line.
      role: result
      type: string
    - name: changed
      # Each change made, in order.
      role: result
      type: IList<string>
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing was changed, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


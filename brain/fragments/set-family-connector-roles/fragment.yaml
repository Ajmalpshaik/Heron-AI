id: FRG-MEP-055
semantic-identity: "edit a connector already in the family being edited - set its system classification, flow, size parameters, voltage, poles, load and power factor, flip it, make it primary, link a pair"
kind: action
domain: revit.families
capability: SET_FAMILY_CONNECTOR_ROLES
version: 3
source: OFFICIAL
risk: MODIFY

purpose: >
  Edits a connector that is ALREADY in the family open in the Family Editor -
  the settings ADD_FAMILY_CONNECTOR leaves at Revit's defaults, and the ones a
  modeller changes later: System Classification (Global and Fitting too),
  Flow Direction, Flow Configuration, Loss Method with its coefficient or
  pressure drop, Description, the family parameters driving its size, which
  way it points (a flip), which connector is PRIMARY and which pairs are
  LINKED - and, from version 3, an ELECTRICAL connector's Voltage, Number of
  Poles, Apparent Load, Power Factor and Load Classification.

  **`settings` IS ONE VALUE** - "system=Global; flowDirection=In; flip=true" -
  holding only what should change, for every connector `connectors` names.
  Keys: system, flowDirection, flowConfiguration, lossMethod,
  lossCoefficient, pressureDrop (Pa), description, flip, sizeParameters;
  and on an electrical connector voltage, poles, apparentLoad, powerFactor
  and loadClassification.

  **AN ELECTRICAL VALUE IS A NUMBER, A FAMILY PARAMETER, OR BOTH** -
  "voltage=400 V; poles=3; apparentLoad=1.5 kVA; powerFactor=0.85" sets
  the values; "voltage=[Voltage]" drives the connector's Voltage from the
  family parameter Voltage, making it - a type parameter of the field's own
  kind, under Electrical - Loads, as Revit's Associate Family Parameter
  dialog does with New Parameter - when the family has none; "voltage=400 V
  [Voltage]" does both and writes 400 V into the current type. A project
  schedules a family's value only through a SHARED parameter: add it first
  with ADD_FAMILY_SHARED_PARAMETERS and name it in the brackets. Voltage in
  V or kV, Apparent Load in VA or kVA, Number of Poles 1 to 3 (a three-phase
  connector is 3), Power Factor above 0 to 1 or a percentage. Revit keeps a
  voltage and a load in its own internal units; the conversion is checked
  against Revit's own on the release that runs, and every value is read
  back with what Revit shows. Load Classification is a classification's
  name in the family, set as a value only.

  **VERSION 3 (2026-10-12).** The electrical values are new; version 2's
  proof no longer describes the code and is kept below as a record, and the
  fragment is DRAFT until it is proved again (NEEDS-CHECKING Group DD).

  **REVIT DECIDES WHICH SYSTEM A CONNECTOR MAY TAKE.** Each connector is
  asked (IsSystemClassificationValid) before anything changes, so a system
  Revit keeps from it is refused with the systems it does take.

  **A LINKED PAIR PASSES A SYSTEM THROUGH THE FAMILY** - a coil, a pump, a
  valve body. The sources docs/43 §10 records say it does so only when both
  connectors are Global, so a linked pair that is not is reported with the
  setting that fixes it; give "system=Global" in the same call to set it.

  **A CONNECTOR IS NAMED BY THE PLANE ITS FACE LIES ON** - "Port Left", the
  way ADD_FAMILY_CONNECTOR places one - by its id, or "all". A plane holding
  more than one connector is refused with their ids.

  **NOTHING ASKED CHANGES NOTHING**; REPORT_FAMILY_CONNECTORS is the read.

  **CHECKED FIRST, READ BACK AFTER, ALL OR NOTHING.** Every setting is read
  back on every connector named - a flip must point the other way, a size
  must follow its parameter - and one that differs fails the whole call.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The connectors `settings` is for: the planes their faces lie on, or
    # ids, commas between - "Port Left, Port Right" - or "all". Empty when
    # only `primary` or `links` is asked.
    - name: connectors
      type: string
      source: request
    # "name=value" with `;` between, only the settings to change:
    # system, flowDirection, flowConfiguration, lossMethod, lossCoefficient,
    # pressureDrop (Pa), description, flip, sizeParameters (diameter; or
    # width, height); on an electrical connector voltage (V, kV), poles (1-3),
    # apparentLoad (VA, kVA), powerFactor (0-1 or %), each a value, a
    # [family parameter] or both - "voltage=400 V [Voltage]" - and
    # loadClassification (a name). Empty changes none of them.
    - name: settings
      type: string
      source: request
    # The connector to make primary: the plane its face lies on, "Neck Top", or
    # its id. Empty leaves the primary as it is.
    - name: primary
      type: string
      source: request
    # Pairs to link, `|` between - "Inlet > Outlet". "Inlet > none" unlinks.
    # Each end is a plane name or an id. Empty links nothing.
    - name: links
      type: string
      source: request
  provides:
    - name: connectorReport
      # Every connector as read back - domain, id, the plane it lies on,
      # system, size and the parameters driving it, an electrical one's
      # voltage, poles, load, power factor and load classification, flow,
      # which way it points, where it sits, primary or secondary, linked -
      # on ONE line.
      role: result
      type: string
    - name: changed
      # Each change made, in order.
      role: result
      type: IList<string>
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing was changed, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


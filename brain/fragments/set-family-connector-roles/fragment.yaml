compatibility-note: >
  Version 2 adds `ConnectorElement.FlipDirection`, the `SystemClassification`
  setter and `IsSystemClassificationValid`,
  `FamilyManager.GetAssociatedFamilyParameter`, the enums FlowDirectionType,
  Duct/PipeFlowConfigurationType and Duct/PipeLossMethodType, and the
  built-in parameters RBS_DUCT/PIPE_FLOW_DIRECTION_PARAM,
  RBS_DUCT/PIPE_FLOW_CONFIGURATION_PARAM, RBS_DUCT/PIPE_FITTING_LOSS_METHOD_PARAM,
  RBS_LOSS_COEFFICIENT, RBS_PRESSURE_DROP and RBS_CONNECTOR_DESCRIPTION - each
  present 2020, 2024 and 2027 (api-surface, read 2026-10-04).
  `ConnectorElement.AssignAsPrimary`, `IsPrimary`, `GetLinkedConnectorElement`,
  `SetLinkedConnectorElement`, `Origin`, `Direction`, `Domain` and
  `SystemClassification`, and `MEPSystemClassification.Global`, read the same
  2020 through 2027 (the RevitAPI XML of all eight releases, read 2026-10-02).
  `SetLinkedConnectorElement` throws for two domains or one connector twice,
  and for "a connector type that does not support linked connectors" - the
  first two are refused here before Revit is asked.
  Version 3 adds the built-in parameters RBS_ELEC_VOLTAGE,
  RBS_ELEC_NUMBER_OF_POLES, RBS_ELEC_APPARENT_LOAD, RBS_ELEC_POWER_FACTOR
  and RBS_ELEC_LOAD_CLASSIFICATION and the class
  ElectricalLoadClassification, all 2020 to 2027; `FamilyManager.Set` and
  `CanElementParameterBeAssociated`, 2020 to 2027. Three things moved and
  are reached by reflection so one build serves every release: a
  parameter's kind (`Definition.ParameterType` to 2022,
  `Definition.GetDataType()` from 2022), `FamilyManager.AddParameter`
  (BuiltInParameterGroup and ParameterType to 2022, ForgeTypeId group and
  spec from 2022 - PG_ELECTRICAL_LOADS / GroupTypeId.ElectricalLoads), and
  the unit check (`UnitUtils.ConvertToInternalUnits` with DisplayUnitType
  DUT_VOLTS / DUT_VOLT_AMPERES to 2021, UnitTypeId.Volts / VoltAmperes from
  2021) - tools/api-surface --members, read 2026-10-12 off all eight
  releases. Compiles on 2020 to 2027 (tools/check-fragments-compile.py,
  2026-10-12); not yet run in Revit.

# ROUTING - see SET_FAMILY_CATEGORY for the whole family-building table.
#
#   "set the primary connector of this family"   -> here
#   "set the valve connectors to Global"         -> here
#   "flip the connector on Port Left"            -> here
#   "list this family's connectors"              -> REPORT_FAMILY_CONNECTORS,
#                                                   a read
#   "put a supply air connector on the neck"     -> ADD_FAMILY_CONNECTOR - a
#                                                   new connector
#   "add an electrical connector to the family"  -> ADD_FAMILY_CONNECTOR - a
#                                                   new one; its voltage and
#                                                   poles are set here after
#   "delete the connector on Port Left"          -> REMOVE_FAMILY_CONNECTOR -
#                                                   named the same way, deleted
#   "set the connector voltage and poles"       -> here, settings voltage=
#                                                   and poles= on an
#                                                   electrical connector
#   "make the connector 3 phase 400 V"          -> here, "poles=3;
#                                                   voltage=400 V"
#   "link the connector flow to a family parameter"
#                                                -> LINK_FAMILY_PARAMETER - a
#                                                   connector's VALUE to a
#                                                   family parameter, any
#                                                   connector by category and
#                                                   system. An electrical value
#                                                   SET here may name its
#                                                   [family parameter] in the
#                                                   same call; unlinking is
#                                                   LINK_FAMILY_PARAMETER's
#   "what is this panel's connected load"        -> REPORT_CONNECTOR_LOADS, a
#                                                   read, in a project

utterances:
  - set the primary connector of this family
  - make the neck connector the primary connector
  - link the inlet and outlet connectors so the system passes through
  - pair the two connectors of this coil family
  - set the connector voltage and poles
  - make the connector 3 phase 400 V

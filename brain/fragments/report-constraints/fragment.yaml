tests: tests/

compatibility-note: >
  One implementation for every release. `OST_Constraints`,
  `Dimension.References` and `Reference.ElementId` are unchanged 2020 to 2027,
  and no units call is made. A constraint element is reached as a `Dimension` -
  which is what both a locked dimension and an alignment are underneath - and
  its references are compared by `ElementId` rather than through any integer, so
  the 2024 64-bit change does not reach this.

utterances:
  - why will this not move
  - what is holding this element
  - what is locked to this
  - what moves with it
  - is this constrained to anything
  - find the locked dimensions on these

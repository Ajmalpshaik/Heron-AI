compatibility-note: >
  `BuiltInParameter.FAMILY_WORK_PLANE_BASED`, `FAMILY_SHARED`,
  `FAMILY_ALWAYS_VERTICAL`, `ROOM_CALCULATION_POINT`,
  `FAMILY_ALLOW_CUT_WITH_VOIDS`,
  `FAMILY_ELECTRICAL_MAINTAIN_ANNOTATION_ORIENTATION`,
  `FAMILY_ROTATE_WITH_COMPONENT`, `FAMILY_KEEP_TEXT_READABLE`,
  `FAMILY_ENABLE_CUTTING_IN_VIEWS`, `FAMILY_CONTENT_PART_TYPE` and
  `FAM_PROFILE_USAGE`, read from `Document.OwnerFamily`, and the `PartType`
  and `ProfileFamilyUsage` enums are the same 2020 through 2027 (the RevitAPI
  reference assemblies and their XML labels, read 2026-10-01). Which
  categories carry each switch, which Part Types a category accepts, and when
  Revit holds Always Vertical read-only, are Revit's - read at run time, never
  listed here (NEEDS-CHECKING BS1, BS2 and BV7). Widened 2026-10-01, before any
  proof, from four switches to eleven settings (row 5b-280), and on
  2026-10-02 to thirteen: `FAMILY_STRUCT_MATERIAL_TYPE` with the
  `StructuralMaterialType` enum, and `STRUCTURAL_SECTION_SHAPE` with the enum
  `Family.StructuralSectionShape` carries - read from that property, because
  its namespace is not one the executor imports (the RevitAPI XML and
  assemblies, read 2026-10-02; BV23).
  VERSION 2, THE OMNICLASS NUMBER (read 2026-10-11 with `tools/api-surface
  --members BuiltInParameter` over the 2020 to 2027 reference assemblies):
  its built-in parameters were RENAMED at 2026 and kept their numbers -
  `OMNICLASS_CODE` (-1002502) and `OMNICLASS_DESCRIPTION` (-1002503) on 2020
  to 2025, `CLASSIFICATION_CODE` and `CLASSIFICATION_DESCRIPTION` on 2026 and
  2027, and the old names do not exist there (tools/api-surface/changes.json
  records the removal at 2025 to 2026). Naming either in code fails the build
  on the other releases, so the one the running Revit has is found by NAME
  (`Enum.IsDefined`, `Enum.Parse`), one implementation and no #if, and shown
  with `LabelUtils.GetLabelFor(BuiltInParameter)` (2020-2027) - "OmniClass
  Number" up to 2025, "Classification Number" from 2026. The classification
  file is read as a plain file, since no API reads it: only the per-user copy
  Revit itself reads, at `Application.CurrentUsersDataFolderPath`
  (2020-2027), "OmniClassTaxonomy.txt" to 2025 and
  "Classification_Taxonomy.txt" from 2026, the one matching the parameter's
  name first. Revit refills that copy from its cache under ProgramData at
  start-up; the cache is not read here, because only HeronPaths may resolve
  a Windows special folder (tools/check-structure.py, docs/06 section 2). The 2020 to 2025 file holds Windows-1252 bytes, so it is
  decoded strict UTF-8, then code page 1252, then Latin-1 (28591), which .NET
  8 and 10 have without a code-page provider; titles are trimmed of every
  char.IsWhiteSpace character, a non-breaking space among them. Revit 2026
  and 2027 ship only a sample file filed under no category, so out of the
  box no code is valid there, and the refusal says so. The file's category
  column is compared as `new ElementId(BuiltInCategory)` with
  `Family.FamilyCategory.Id` after `Enum.IsDefined` - never an ElementId read
  as a number, and not `Category.BuiltInCategory`, which is 2023 and later;
  another category is named with `Category.GetCategory(Document,
  BuiltInCategory)`, else `LabelUtils.GetLabelFor(BuiltInCategory)`, both
  2020-2027. Whether an API write of the number fills OmniClass Title is
  Revit's - the title is read after the write and the answer reported
  (NEEDS-CHECKING).

# ROUTING - see SET_FAMILY_CATEGORY for the whole family-building table.
#
#   "make this family work plane based"           -> here
#   "make the motor family shared"                -> here
#   "set the part type of this fitting to elbow"  -> here
#   "turn on cut with voids when loaded"          -> here
#   "set the family category to air terminal"     -> SET_FAMILY_CATEGORY
#   "set the omniclass number of this family"     -> here (version 2)
#   "set the omniclass number to 23.65.55.14.14"  -> here
#   "clear the omniclass number"                  -> here
#   "what is the omniclass number of this family" -> REPORT_FAMILY_TEMPLATE -
#                                                    a READ; this writes
#   "which omniclass codes fit this family"       -> REPORT_FAMILY_TEMPLATE
#   "which families have no omniclass number"     -> CHECK_FAMILY_STANDARDS -
#                                                    a READ, the audit
#   "set the omniclass number" in a PROJECT       -> refused here (notAFamily):
#                                                    OPEN_FAMILY_FOR_EDITING,
#                                                    set it, then LOAD_FAMILY
#                                                    back - a reload, asked for
#                                                    by name (Article 7)

utterances:
  - make this family work plane based
  - make the motor family shared
  - turn on always vertical for this family
  - set the family to shared and work plane based
  - set the part type of this fitting to elbow
  - turn on cut with voids when loaded
  - set the profile usage to mullion
  - set the omniclass number of this family
  - set the omniclass number to 23.65.55.14.14
  - clear the omniclass number

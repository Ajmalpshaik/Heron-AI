id: FRG-DOC-036
semantic-identity: "set the family's own Category, Work Plane-Based, Shared, Always Vertical, Room Calculation Point, Cut with Voids When Loaded, Part Type, Profile Usage, Material for Model Behavior, Section Shape, OmniClass Number or Light Source in the family being edited"
kind: action
domain: revit.families
capability: SET_FAMILY_SETTINGS
# VERSION 4 (2026-11-01): SET_FAMILY_CATEGORY was merged into this card on the
# owner's instruction and is DEPRECATED - "Category=Air Terminals" is one more
# setting, matched to Revit's own names and never guessed, written FIRST in a
# combined call, read back with `wasCategory` and `parametersGained`. See the
# merge block above `utterances`. DRAFT until version 4 is proved (D-30); the
# version 3 proof below is kept as the record of what was run.
version: 4
source: OFFICIAL
risk: MODIFY

purpose: >
  Sets the switches in Family Category and Parameters for the family open in
  the Family Editor: WORK PLANE-BASED - placed on any plane or face and moving
  with it, the way a family nested in another is best made; SHARED - a nested
  copy that a project schedules and tags as an element of its own; ALWAYS
  VERTICAL - a Work Plane-Based family that stays upright on a slope; ROOM
  CALCULATION POINT; CUT WITH VOIDS WHEN LOADED - its unattached voids cut
  walls, floors and the rest in a project; MAINTAIN ANNOTATION ORIENTATION - a
  nested symbol stays readable in plan; ROTATE WITH COMPONENT and KEEP TEXT
  READABLE for an annotation; ENABLE CUTTING IN VIEWS.

  **AND FOUR THAT TAKE A NAME**: PART TYPE - Elbow, Tee, Transition, Breaks
  Into, Damper - which decides how an MEP fitting or accessory behaves and
  which routing preference group offers it; PROFILE USAGE - Wall Sweep,
  Mullion, Railing - which decides where a profile family is offered; and for
  a structural framing or column family MATERIAL FOR MODEL BEHAVIOR - Steel,
  Concrete, Precast Concrete, Wood, Other - which decides its cutback, shape
  handles and joins, and SECTION SHAPE, which adds the section's schedulable
  dimensions. Each is matched to Revit's own list, read from the running
  Revit, and the words Revit shows are accepted with their spaces and dashes.

  **ONE VALUE FOR THE WHOLE FAMILY**, not per type. A switch this family's
  category does not have, or that Revit holds read-only here, is refused by
  name.

  **WORK PLANE-BASED IS WRITTEN FIRST**, because Always Vertical belongs to a
  Work Plane-Based family; anything Revit changes on its own as a result is
  reported as Revit's.

  **READ BACK, ALL OR NOTHING**: every switch is read again after the last
  write. Copies already placed elsewhere take a change when the family is
  loaded there again.

  **VERSION 2 (2026-10-11): THE OMNICLASS NUMBER** - Classification Number
  from Revit 2026 - the one setting that takes text. Only a code the
  classification file files under this family's category is written, and any
  other is refused with the codes that file gives the category; blank, none or
  clear empties it. Version 1's proof no longer describes the code and is kept
  below as a record; the fragment is DRAFT until it is proved again.

  **VERSION 3 (2026-10-21): LIGHT SOURCE** - "Light Source=yes" ticks the box
  a Lighting Fixtures family needs before SET_FAMILY_LIGHT_SOURCE can define
  its light, done by hand until then. The switch Revit hands the API is not
  named Light Source in its reference, so the tick is PROVED: after the write,
  Revit's lighting API must find a light source in the family, or the call
  fails and nothing is kept. Only yes is taken - unticking removes the light
  source and every photometric value, and is left to the modeller. Version 2's
  proof is kept below as a record; the fragment is DRAFT until it is proved
  again.

  **VERSION 4 (2026-11-01): THE CATEGORY** - SET_FAMILY_CATEGORY's job,
  merged here: "Category=Air Terminals" makes a family started from a generic
  template an Air Terminal or Mechanical Equipment. THE FIRST STEP OF BUILDING
  A FAMILY, AND THE ONE THAT CANNOT WAIT: the category decides which built-in
  parameters the family carries, which schedules it lands in and which
  connectors make sense on it, and switching it adds that category's own
  parameters - `parametersGained`, read from the family, because that is the
  part people do not expect. The name is matched to the names Revit shows in
  Family Category and Parameters, in the language it runs in, and NEVER
  GUESSED - "Air Terminal" is refused with "Air Terminals" offered (D-33).
  Revit decides which categories a family may take; when it refuses, its own
  words are passed on and nothing is kept. IN A COMBINED CALL THE CATEGORY IS
  WRITTEN FIRST, because Part Type, the OmniClass Number and which switches
  the family has at all are checked against it; once it is written, a problem
  with any other setting fails the whole call rather than keeping the
  category alone. Version 3's proof is kept below as a record; the fragment
  is DRAFT until it is proved again.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # Setting = value, SEMICOLONS between - "Work Plane-Based=yes;
    # Shared=yes", "Part Type=Elbow", "Profile Usage=Mullion". Yes or no for
    # Work Plane-Based, Always Vertical, Shared, Room Calculation Point, Cut with
    # Voids When Loaded, Maintain Annotation Orientation, Rotate with Component,
    # Keep Text Readable and Enable Cutting in Views; a name from Revit's own
    # list for Part Type, Profile Usage, Material for Model Behavior and
    # Section Shape. VERSION 2: "OmniClass Number=23.65.55.14.14" (also
    # "OmniClass", "Classification Number", "Classification Code" or
    # "Classification") - a code the classification file files under this
    # family's category, written with its title; "OmniClass Number=",
    # "=none" or "=clear" empties it. The add-in's NamedValues keeps an empty
    # value as "" (RevitFragment.cs), and none and clear are taken either way.
    # VERSION 3: "Light Source=yes" - yes only, proved by Revit's lighting API.
    # VERSION 4, from SET_FAMILY_CATEGORY: "Category=Air Terminals" (also
    # "Family Category") - the category as Revit names it in the Family
    # Category and Parameters dialog, matched whole and never guessed;
    # written FIRST, whatever order the settings are given in.
    - name: settings
      type: IDictionary<string, string>
      source: request
  provides:
    - name: settingReport
      # Every setting that changed, before and after, on ONE line. ACCOUNTING,
      # not a result: it is written on every run - "Every setting named already
      # read as asked." when nothing changed - so it can never come back empty,
      # and `changed` beside it is the count that says whether anything did
      # (D-51). Declared a result, it failed the 2026-10-18 proof's negative
      # case on a run that changed nothing.
      role: accounting
      type: string
    - name: changed
      role: result
      type: int
    - name: alreadySet
      # Asked for and already so: looked at, nothing done (D-52).
      role: accounting
      type: int
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing changed, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: category
      # VERSION 4, from SET_FAMILY_CATEGORY: the family's category AFTER, read
      # back from the family - never the name that was asked for. Read on every
      # run in a family, so ACCOUNTING: it is never empty there, and `changed`
      # is the count that says whether anything did (D-52).
      role: accounting
      type: string
    - name: wasCategory
      # VERSION 4: the family's category before the call. Accounting, as above.
      role: accounting
      type: string
    - name: parametersGained
      # VERSION 4: how many parameters the family has now minus how many it had
      # before the category was written - a category switch brings that
      # category's own built-in parameters, and can take the old one's away.
      # 0 when the category was not written. A reading of a change `changed`
      # already counts, never a thing found (D-52).
      role: accounting
      type: int
    - name: findings
      type: IList<string>


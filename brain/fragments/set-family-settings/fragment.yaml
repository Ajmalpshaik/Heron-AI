#                                             -> CREATE_OPENING - `shape`, in
#                                                the template's wall or ceiling
#   "use the handrail profile family for this sweep"
#                                             -> SET_FAMILY_SWEEP_PROFILE
#   "add four adaptive points to this family" -> PLACE_ADAPTIVE_POINTS
#   "draw lines between the adaptive points"  -> DRAW_FAMILY_POINT_CURVES
#   "set the adaptive points orientation to host and loop system"
#                                             -> SET_ADAPTIVE_POINT_ORIENTATION
#   "make a surface from these lines"         -> CREATE_CONCEPTUAL_FORM - an
#                                                adaptive or pattern family
#   "make a type catalog for this family"     -> REPORT_FAMILY_TYPE_CATALOG
#   "set the primary connector of this family" -> SET_FAMILY_CONNECTOR_ROLES -
#                                                primary and linked connectors
#   "divide the surface of this mass into panels"
#                                             -> DIVIDE_FAMILY_SURFACE
#
# THIS CARD'S OWN ROWS:
#
#   "make this family work plane based"           -> here
#   "make the motor family shared"                -> here
#   "set the part type of this fitting to elbow"  -> here
#   "turn on cut with voids when loaded"          -> here
#   "set the family category to air terminal"     -> here (version 4)
#   "make it mechanical equipment and work plane based"
#                                                 -> here, one call - the
#                                                    category first
#   "change the type of these air terminals to another type"
#                                                 -> CHANGE_ELEMENT_TYPE - the
#                                                    TYPE of placed elements in
#                                                    a project, not the family's
#                                                    category (row 5b-220)
#   "tick light source for this family"           -> here (version 3)
#   "set the light source of this fixture family" -> SET_FAMILY_LIGHT_SOURCE -
#                                                    its shape, distribution
#                                                    and values, once ticked
#   "set the omniclass number of this family"     -> here (version 2)
#   "set the omniclass number to 23.65.55.14.14"  -> here
#   "clear the omniclass number"                  -> here
#   "what is the omniclass number of this family" -> REPORT_FAMILY_TEMPLATE -
#                                                    a READ; this writes
#   "which omniclass codes fit this family"       -> REPORT_FAMILY_TEMPLATE
#   "which families have no omniclass number"     -> CHECK_FAMILY_STANDARDS -
#                                                    a READ, the audit
#   "set the omniclass number" in a PROJECT       -> refused here (notAFamily):
#                                                    OPEN_FAMILY_FOR_EDITING,
#                                                    set it, then LOAD_FAMILY
#                                                    back - a reload, asked for

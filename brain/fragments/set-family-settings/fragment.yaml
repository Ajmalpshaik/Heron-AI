# the owner's instruction in conversation: "make sure there is no duplicate
# tools", "merge means ... all area need to be covered", every conflict to
# keep the safer rule. It is DEPRECATED, never deleted. Where each of its
# inputs and outputs is now:
#
#   SET_FAMILY_CATEGORY                 here, "Category=<name>" in `settings`
#     categoryName                      the value of Category (or Family
#                                       Category) - matched whole, never guessed
#     category                          category - read back, every family run
#     changed (bool)                    changed (int) - the category counts one
#     wasCategory, parametersGained     the same names
#     notAFamily, refused, findings     the same names, its sentences carried
#
# THE ORDER: the category is written FIRST, before any other setting is
# checked, because which switches the family has, which Part Types it takes
# and which OmniClass codes are filed under it are all the category's. So once
# it is written, a problem with any other setting throws - nothing kept -
# where before the write it refuses, as both cards always did.
# THE SAFER RULE WHERE THEY DIFFERED, both kept from the stricter card: that
# card REFUSED, with the transaction still open, when Revit did not keep the
# category; here that read-back failure throws and the whole call is rolled
# back, as every read-back here is all or nothing. And a category already as
# asked is counted in `alreadySet` with a sentence saying so, where that card
# set `refused` - nothing is written either way. Nothing of that card was left
# out.


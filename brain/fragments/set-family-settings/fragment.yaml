compatibility-note: >
  `BuiltInParameter.FAMILY_WORK_PLANE_BASED`, `FAMILY_SHARED`,
  `FAMILY_ALWAYS_VERTICAL`, `ROOM_CALCULATION_POINT`,
  `FAMILY_ALLOW_CUT_WITH_VOIDS`,
  `FAMILY_ELECTRICAL_MAINTAIN_ANNOTATION_ORIENTATION`,
  `FAMILY_ROTATE_WITH_COMPONENT`, `FAMILY_KEEP_TEXT_READABLE`,
  `FAMILY_ENABLE_CUTTING_IN_VIEWS`, `FAMILY_CONTENT_PART_TYPE` and
  `FAM_PROFILE_USAGE`, read from `Document.OwnerFamily`, and the `PartType`
  and `ProfileFamilyUsage` enums are the same 2020 through 2027 (the RevitAPI
  reference assemblies and their XML labels, read 2026-10-01). Which
  categories carry each switch, which Part Types a category accepts, and when
  Revit holds Always Vertical read-only, are Revit's - read at run time, never
  listed here (NEEDS-CHECKING BS1, BS2 and BV7). Widened 2026-10-01, before any
  proof, from four switches to eleven settings (row 5b-280), and on
  2026-10-02 to thirteen: `FAMILY_STRUCT_MATERIAL_TYPE` with the
  `StructuralMaterialType` enum, and `STRUCTURAL_SECTION_SHAPE` with the enum
  `Family.StructuralSectionShape` carries - read from that property, because
  its namespace is not one the executor imports (the RevitAPI XML and
  assemblies, read 2026-10-02; BV23).
  VERSION 2, THE OMNICLASS NUMBER (read 2026-10-11 with `tools/api-surface
  --members BuiltInParameter` over the 2020 to 2027 reference assemblies):
  its built-in parameters were RENAMED at 2026 and kept their numbers -
  `OMNICLASS_CODE` (-1002502) and `OMNICLASS_DESCRIPTION` (-1002503) on 2020
  to 2025, `CLASSIFICATION_CODE` and `CLASSIFICATION_DESCRIPTION` on 2026 and
  2027, and the old names do not exist there (tools/api-surface/changes.json
  records the removal at 2025 to 2026). Naming either in code fails the build
  on the other releases, so the one the running Revit has is found by NAME
  (`Enum.IsDefined`, `Enum.Parse`), one implementation and no #if, and shown
  with `LabelUtils.GetLabelFor(BuiltInParameter)` (2020-2027) - "OmniClass
  Number" up to 2025, "Classification Number" from 2026. The classification
  file is read as a plain file, since no API reads it: only the per-user copy
  Revit itself reads, at `Application.CurrentUsersDataFolderPath`
  (2020-2027), "OmniClassTaxonomy.txt" to 2025 and
  "Classification_Taxonomy.txt" from 2026, the one matching the parameter's
  name first. Revit refills that copy from its cache under ProgramData at
  start-up; the cache is not read here, because only HeronPaths may resolve
  a Windows special folder (tools/check-structure.py, docs/06 section 2). The 2020 to 2025 file holds Windows-1252 bytes, so it is
  decoded strict UTF-8, then code page 1252, then Latin-1 (28591), which .NET
  8 and 10 have without a code-page provider; titles are trimmed of every
  char.IsWhiteSpace character, a non-breaking space among them. Revit 2026
  and 2027 ship only a sample file filed under no category, so out of the
  box no code is valid there, and the refusal says so. The file's category
  column is compared as `new ElementId(BuiltInCategory)` with
  `Family.FamilyCategory.Id` after `Enum.IsDefined` - never an ElementId read
  as a number, and not `Category.BuiltInCategory`, which is 2023 and later;
  another category is named with `Category.GetCategory(Document,
  BuiltInCategory)`, else `LabelUtils.GetLabelFor(BuiltInCategory)`, both
  2020-2027. Whether an API write of the number fills OmniClass Title is
  Revit's - the title is read after the write and the answer reported
  (NEEDS-CHECKING).
  VERSION 3, LIGHT SOURCE (read 2026-10-21 with `tools/api-surface --members
  BuiltInParameter` over the 2020 to 2027 assemblies and their RevitAPI.xml):
  `BuiltInParameter.LIGHTING_FIXTURE_LIGHT_EMITTER` (-1010508), labelled
  "Light Emitter", is the only family-level light switch in the enum, the same
  on all eight releases; no reference text says it is the Light Source box of
  Family Category and Parameters, so the write is proved by
  `LightFamily.GetLightFamily(Document)` succeeding afterwards (2020-2027,
  reached by name - the Lighting namespace is not imported). Whether the
  switch is on `Document.OwnerFamily` at all is Revit's to answer
  (NEEDS-CHECKING Group IK); where it is not, the call refuses by name.
  VERSION 4, THE CATEGORY: `Family.FamilyCategory { get; set; }`,
  `Document.OwnerFamily`, `Document.Settings.Categories` and
  `FamilyManager.Parameters` read the same 2020 through 2027 in the cached
  reference assemblies (api-surface, read 2026-09-24 for SET_FAMILY_CATEGORY,
  whose code this is). Category names come from `Category.Name`, so they
  follow the language Revit runs in - the same words the modeller sees.

# ROUTING - the family-building capabilities, each with one job. THE WHOLE
# TABLE LIVES HERE since 2026-11-01: it was on SET_FAMILY_CATEGORY, which was
# merged into this card, and that card keeps its copy as the record. Every
# other family card's "see ... for the whole family-building table" points
# here.
#
#   "make this family an air terminal"       -> here, Category=Air Terminals
#                                                (SET_FAMILY_CATEGORY until
#                                                2026-11-01)
#   "add Width and Depth parameters"          -> ADD_FAMILY_PARAMETERS
#   "delete the Cap R Start parameter"       -> DELETE_FAMILY_PARAMETERS -
#                                                only what nothing uses
#   "make a 600 x 600 type"                   -> SET_FAMILY_TYPE_VALUES
#   "neck top is height plus neck depth"      -> SET_FAMILY_FORMULA
#   "add reference planes at 300 each side"   -> CREATE_REFERENCE_PLANES
#   "label the width with the Width parameter"-> LABEL_FAMILY_DIMENSION
#   "label the angle between these planes with Arrow Angle"
#                                             -> LABEL_FAMILY_DIMENSION,
#                                                version 3 - an angle
#                                                parameter, two planes
#                                                that meet
#   "make a box between these planes"         -> EXTRUDE_BETWEEN_PLANES
#   "extrude a circle 300 diameter 500 high"  -> CREATE_FAMILY_FORMS -
#                                                any other shape, solid or void
#   "make a revolve in the family"            -> CREATE_FAMILY_FORMS
#   "build all these forms in one go"         -> CREATE_FAMILY_FORMS - many
#                                                extrusions and revolves, a
#                                                row each, one undo
#   "blend a rectangle into a circle"         -> CREATE_FAMILY_FORMS, a
#                                                kind=blend row
#   "sweep a profile along a path"            -> CREATE_FAMILY_FORMS, a
#                                                kind=sweep row
#   "sweep one shape into another along a path" -> CREATE_FAMILY_FORMS, a
#                                                kind=swept blend row
#                                                (CREATE_FAMILY_BLEND,
#                                                CREATE_FAMILY_SWEEP and
#                                                CREATE_FAMILY_SWEPT_BLEND
#                                                until 2026-11-01)
#   "make a spring as one smooth sweep along a helix" -> CREATE_FAMILY_FREEFORM_SOLID -
#                                                a fixed shape, not parametric
#   "loft a smooth body through elliptical sections" -> CREATE_FAMILY_FREEFORM_SOLID
#   "cut the solid with the void"             -> COMBINE_FAMILY_FORMS - a
#                                                join too
#   "align and lock this form to the planes"  -> LOCK_FORM_TO_PLANES - any
#                                                form's flat faces
#   "lock the sweep path to the planes"       -> LOCK_FORM_SKETCH_TO_PLANES -
#                                                the sketch: a path's lines,
#                                                a circle's centre
#   "lock the arrow's lines to the planes"    -> LOCK_FAMILY_LINES_TO_PLANES -
#                                                2D lines and a filled
#                                                region's edges, along and
#                                                by their ends
#   "label the neck diameter with Neck Diameter" -> LABEL_FAMILY_RADIUS
#   "label the arc's radius with Arc Radius"  -> LABEL_FAMILY_RADIUS v6 - a
#                                                detail or symbolic arc
#   "show this form only in fine"             -> SET_FAMILY_FORM_VISIBILITY
#   "show this symbolic line only in coarse"  -> SET_FAMILY_FORM_VISIBILITY v2
#   "set the subcategory of these forms"      -> SET_FAMILY_FORM_SUBCATEGORY
#   "put these lines on the Flow Arrow subcategory" -> SET_FAMILY_FORM_SUBCATEGORY
#                                                v2 - detail or symbolic lines
#   "link the body material to Body Material" -> LINK_FAMILY_PARAMETER -
#                                                one form, not every one
#   "link the handle's visible to Show_Handle" -> LINK_FAMILY_PARAMETER -
#                                                a form's Visible, angles or
#                                                extrusion ends, one form
#   "link the arrow's visible to Show Arrow"  -> LINK_FAMILY_PARAMETER,
#                                                version 4 - a symbolic or
#                                                detail line's, a filled or
#                                                masking region's or model
#                                                text's Visible, by its id
#   "make this plane the left reference"      -> SET_FAMILY_PLANE_REFERENCE -
#                                                Is Reference, Defines Origin
#   "draw the valve symbol in plan"           -> DRAW_FAMILY_SYMBOLIC_LINES -
#                                                2D lines, no 3D body
#   "array the blade along X with Blade Count" -> ARRAY_FAMILY_FORMS - one form
#                                                in a row, its count a parameter
#   "array the arrows in the plan"            -> ARRAY_FAMILY_FORMS v4 - a
#                                                nested detail item, in its view
#   "group these forms in this family"        -> GROUP_ELEMENTS - a group, when
#                                                asked; a nested family or an
#                                                array is usually lighter
#   "put the motor family into this air handler" -> PLACE_FAMILY_INSTANCES -
#                                                nested, in the family edited
#   "place the flow arrow in the Ref. Level view" -> PLACE_DETAIL_COMPONENTS v2 -
#                                                a nested detail item or
#                                                annotation, in a family view
#   "lock the motor's centre to the centre planes" -> LOCK_NESTED_FAMILY_TO_PLANES
#   "link the motor type's width to Motor Width" -> LINK_FAMILY_PARAMETER -

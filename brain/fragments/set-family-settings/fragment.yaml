#   "add flip arrows to this family"          -> ADD_FAMILY_FLIP_CONTROL
#   "add a solid fill to this detail item family" -> DRAW_FAMILY_FILLED_REGION
#   "draw the profile in this profile family" -> DRAW_FAMILY_DETAIL_LINES -
#                                                a 2D family's lines

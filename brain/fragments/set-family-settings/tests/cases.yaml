positive:
  - given: >
      a new family from the metric Generic Model template; settings
      "Work Plane-Based=yes; Shared=yes"
    expect: >
      changed 2; settingReport reading Work Plane-Based No -> Yes and Shared No
      -> Yes; Family Category and Parameters showing both ticked

  - given: the same call again
    expect: changed 0, alreadySet 2

  - given: settings "Always Vertical=no" after Work Plane-Based is on
    expect: Always Vertical reads No, read back

  - given: >
      a new family from the metric Generic Model face based template with a
      void built in it; settings "Cut with Voids When Loaded=yes"
    expect: >
      changed 1, Cut with Voids When Loaded No -> Yes read back, and the
      finding naming Cut Geometry in a project

  - given: >
      a Generic Model family switched to the Pipe Fittings category; settings
      "Part Type=Elbow"
    expect: Part Type Normal -> Elbow, read back in Family Category and Parameters

  - given: a new family from the metric Profile template; settings "Profile Usage=Mullion"
    expect: Profile Usage reads Mullion, read back

  - given: >
      a new family from the metric Structural Framing - Beams and Braces
      template; settings "Material for Model Behavior=Precast Concrete; Section
      Shape=Rectangle Parameterized"
    expect: >
      both read back by their enum names in the report; Family Category and
      Parameters shows Precast Concrete and the section shape - LOOKED AT (BV23)

  # VERSION 2 - the OmniClass Number. Revit 2024, whose per-user
  # OmniClassTaxonomy.txt files 21 codes under Pipe Accessories.
  - given: >
      a new family from the metric Pipe Accessory template, OmniClass Number
      blank; settings "OmniClass Number=23.65.55.14.14"
    expect: >
      changed 1; settingReport "OmniClass Number (blank) -> 23.65.55.14.14
      Isolation Valves for Liquid Services - " and WHICH title outcome it
      reports (Revit filled OmniClass Title / it was written from the file /
      Revit holds it read-only) - the first time this is known; a finding
      naming the classification file read; Family Category and Parameters
      showing the number AND the title - LOOKED AT

  - given: the same call again
    expect: changed 0, alreadySet 1, nothing written to the number or the title

  - given: settings "OmniClass Number=clear" after the code above is set
    expect: >
      changed 1; the number reads blank, read back; the title cleared, or
      the report saying Revit holds it read-only and what it reads

  - given: settings "OmniClass Number=" (an empty value) with the code set again
    expect: >
      the same clear as "clear" - the case that settles whether an empty value
      reaches the fragment as "" (NamedValues keeps it, by reading) or is lost
      on the way

  # VERSION 3 - Light Source.
  - given: >
      a Generic Model family switched to Lighting Fixtures with
      "Category=Lighting Fixtures" (SET_FAMILY_CATEGORY when this case was
      written), Light Source not ticked; settings "Light Source=yes"
    expect: >
      changed 1; settingReport "Light Source No -> Yes"; the finding that
      Revit's lighting API finds the light source; Family Category and
      Parameters showing Light Source ticked - LOOKED AT; SET_FAMILY_LIGHT_SOURCE
      then runs on the family without refusing. Or the call fails saying the
      switch written is not the Light Source tick, nothing kept - EITHER answer
      is the measurement Group IK wants

  - given: the same call again
    expect: changed 0, alreadySet 1, the light-source finding

  # VERSION 4 (2026-11-01) - the category, from SET_FAMILY_CATEGORY. Each of
  # these FAILS on version 3, which refuses "Category" as not one of the
  # settings it sets.
  - given: >
      a new family started from the metric Generic Model template and open in
      front; settings "Category=Air Terminals"
    expect: >
      changed 1, wasCategory "Generic Models", category "Air Terminals" -
      LOOKED AT in Revit's own Family Category and Parameters dialog, not read
      off the report - and parametersGained above zero, matching the new flow
      fields that appear in Family Types; settingReport opening "Category
      Generic Models -> Air Terminals"

  - given: the same family, run again with "Category=Air Terminals"
    expect: >
      changed 0, alreadySet 1, category "Air Terminals", and the finding that
      it was already there. Nothing in the undo list but the one entry the
      call makes

  - given: >
      a Generic Model family; settings "Work Plane-Based=yes; Category=Lighting
      Fixtures; Light Source=yes" - the category named LAST
    expect: >
      changed 3 and the category written FIRST: settingReport opens with
      Category, and Light Source is accepted - on version 3, and with the
      category checked last, Light Source is refused because a Generic Model
      has no such setting

  - given: a Pipe Fittings template's family in Generic Models; settings "Category=Pipe Fittings; Part Type=Elbow"
    expect: >
      changed 2, Part Type checked against Pipe Fittings and read back Elbow

negative:
  - given: settings "Work Plane-Based=maybe"
    expect: refused - neither yes nor no - and nothing changed

  - given: settings "Hosted=yes"
    expect: refused, naming the settings this sets, and nothing changed

  - given: settings "Part Type=Sprocket" in the Pipe Fittings family
    expect: refused, naming the Part Types this Revit has, and nothing changed

  - given: a project in front
    expect: notAFamily true and nothing changed

  - given: settings "Material for Model Behavior=Granite"
    expect: refused naming the materials Revit has - nothing changed

  # VERSION 2
  - given: >
      the Pipe Accessory family above; settings "OmniClass Number=23.99.99.99",
      a code that is not in the file
    expect: >
      refused - "not a code in the classification file", the path named - and
      the refusal listing the file's 21 Pipe Accessories codes as "code
      Title", 23.65.55.14.14 Isolation Valves for Liquid Services among them;
      no nearby code picked; the number unchanged

  - given: >
      the same Pipe Accessory family; settings "OmniClass Number=23.30.10.00",
      which the 2024 file files under Doors
    expect: >
      refused naming Doors and the Pipe Accessories codes; nothing changed.
      THE D-30 NEGATIVE: a real code, correctly typed, for another category,
      must not be written

  - given: a project in front; settings "OmniClass Number=23.65.55.14.14"
    expect: >
      notAFamily true, nothing changed, and the refusal saying the number is
      set in the family - OPEN_FAMILY_FOR_EDITING, set it there, LOAD_FAMILY
      back, a reload that needs the modeller's word (Article 7)

  - given: >
      Revit 2026 or 2027 with the classification file it ships (a sample filed
      under no category); a Pipe Accessory family; settings "Classification
      Number=23.65.55.14.14"
    expect: >
      refused - not in the file - and the refusal saying the file is the
      sample, that no code is valid for any category out of the box, and the
      path the office's own file goes at

  - given: a Lighting Fixtures family with Light Source ticked; settings "Light Source=no"
    expect: >
      refused - unticking removes the light source and every photometric
      value, left to the modeller - nothing changed. THE V3 NEGATIVE

  - given: a Generic Model family (not Lighting Fixtures); settings "Light Source=yes"
    expect: >
      refused - the category has no Light Source setting Revit hands the API,
      naming "Category=Lighting Fixtures" (SET_FAMILY_CATEGORY before version
      4) - nothing changed

  # VERSION 4 (2026-11-01) - SET_FAMILY_CATEGORY's negatives, carried.
  - given: the Generic Model family; settings "Category=Air Terminal" (singular)
    expect: >
      refused, nothing changed, and "Air Terminals" offered as a close name.
      NOT the nearest category quietly taken - that is the guess this refuses

  - given: a PROJECT in front; settings "Category=Air Terminals"
    expect: >
      notAFamily true, refused naming OPEN_FAMILY_FOR_EDITING and File, New,
      Family, and the project's categories untouched

  - given: settings "Category=Walls" on a loadable family
    expect: >
      the call FAILS with Revit's own words and NOTHING kept - the family's
      category still reads what it was before, checked in the dialog

  - given: a Generic Model family; settings "Category=Pipe Fittings; Part Type=Sprocket"
    expect: >
      the call FAILS - the category was written first and then Part Type
      refused - and NOTHING is kept: the family still reads Generic Models in
      the dialog. A refusal there would have kept the category alone

  - given: settings "Category=" (no name)
    expect: refused - no category named, never guessed - nothing changed

second_route:
  - >
      version 4: Create, Family Category and Parameters in the Family Editor,
      the category read there and compared with `category` -
      SET_FAMILY_CATEGORY's second route, carried here
  - >
      Family Category and Parameters in the Family Editor: the Work Plane-Based,
      Shared and Always Vertical boxes read as the answer says
  - >
      Family Category and Parameters: the OmniClass Number and OmniClass Title
      rows (Classification Number and Title from 2026), and the dialog behind
      the number's button listing the same codes for the category
  - >
      Family Category and Parameters of a Lighting Fixtures family: the Light
      Source box ticked, and the Light Source Definition button available in
      the light source's Properties

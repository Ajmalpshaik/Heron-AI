positive:
  - given: 4 standalone ducts, none hosted, nothing depending on them
    expect: deleted has exactly those 4 ids, askedFor is 4, alsoWent is 0, refused empty

  - given: the whole call made inside a transaction that is then rolled back
    expect: >
      `deleted` still reports the full blast radius and the model is unchanged -
      which is how a deletion preview is built, and what Golden Rule 17 needs

  # VERSION 3 - WHAT WENT IS NAMED, READ BEFORE IT WENT (row 5b-1993). Every
  # case below FAILS on version 2, which had no `deletedWhat` or
  # `deletedByCategory` and gave the extra elements as bare ids only.
  # NEEDS-CHECKING Group PS.

  - given: >
      VERSION 3. A family document; 21 extrusions (forms) selected and deleted
    expect: >
      deleted holds every id Revit removed (241 on the owner's family of
      2026-11-23), deletedWhat has one entry for EACH of them, and
      deletedByCategory reads "241 deleted = 21 form(s) + their sketches",
      with the forms' own sketches counted as sketch(es), sketch plane(s) and
      sketch line(s) - their total equal to alsoWent. Each sketch entry in
      deletedWhat names the form it went with. The run record's reply holds
      every deletedWhat entry. On version 2: alsoWent 220 and nothing more

  - given: >
      VERSION 3. A host family; one unused nested family type selected and
      deleted, and Revit takes one more element with it
    expect: >
      deletedWhat names BOTH ids - the type "asked for", and the other "went
      with" the type's id, each with the category and name Revit gave it
      before the delete - and deletedByCategory says "Asked for 1: ... Also
      went 1: <that category> 1". Read in Revit, the category matches what
      Revit's own Delete box listed for it

  - given: >
      VERSION 3. A floor with no wall attached, in a project; deleted
    expect: >
      the floor and its own sketch are named, but the sketch is NOT counted as
      "their sketches" - that grouping is for a FORM only - so
      deletedByCategory lists the sketch's parts by category under "Also went",
      and never says "form(s)"

negative:
  - given: 1 wall carrying 3 doors and 2 windows
    expect: >
      deleted holds SIX ids and alsoWent is 5, not "deleted 1". This is the case
      the fragment exists for: Revit removes the hosted elements without asking,
      and a count taken from the input reads as a tidy little change while five
      other elements have gone from the model

  - given: a batch of 200 where element 11 is pinned and cannot be deleted
    expect: >
      the batch runs to the END, that id is in refused, and the remaining 189
      are still processed - not an exception that abandons the rest after ten
      have already gone, reporting nothing at all

  - given: an element Revit accepts and removes nothing for - Delete returns an empty set
    expect: >
      it is in refused, NOT counted as deleted. An empty return is a silent
      no-op, the same shape as the move that returned normally and moved nothing

  # VERSION 2 - THE WALLS A DELETE DETACHES (row 5b-1674). Every case below
  # FAILS on version 1, which had no `attachedBefore`, `detachedWalls` or
  # `wallsNote` and said nothing about a wall that was changed, not deleted.
  # NEEDS-CHECKING Group OE.

  - given: >
      VERSION 2. Four walls, Level 1 to 2440 mm unconnected, their tops
      ATTACHED by hand (Attach Top/Base, Revit 2024) to a flat roof above them;
      the roof selected and deleted
    expect: >
      deleted holds the roof (and nothing else), attachedBefore names the four
      walls "top attached", detachedWalls holds those four ids, and wallsNote
      says 4 walls are DETACHED now and that on Revit 2024 Heron cannot attach
      a wall again. In a section, after Keep, the walls stop at 2440 mm. On
      version 1: deleted 1, alsoWent 0, and nothing about the walls

  - given: >
      VERSION 2. A floor with NO wall attached to it, walls standing under it at
      their own height; the floor deleted
    expect: >
      deleted holds the floor, attachedBefore empty, detachedWalls empty,
      wallsNote empty - a wall that was never attached is not named. The
      tracking case: the same delete, a different answer

  - given: >
      VERSION 2. Two flat roofs side by side, walls attached under each; ONE
      roof deleted
    expect: >
      only the walls under the deleted roof are in detachedWalls; the walls
      under the other roof are not in attachedBefore at all, and stay attached

  # VERSION 3 negatives (row 5b-1993).
  - given: >
      VERSION 3. 4 standalone ducts, nothing depending on them
    expect: >
      deletedWhat has exactly those 4 ids, each "Ducts | <type name> | asked
      for"; deletedByCategory says "4 deleted. Asked for 4: Ducts 4. Nothing
      else went." - no "form(s)", no sketch, nothing NOT READ. The tracking
      case: a different delete, a different answer

  - given: >
      VERSION 3. The trial cannot read an id - Revit gave no element for it
      before the delete
    expect: >
      that id is in deletedWhat as "NOT READ - ...", counted as NOT READ in
      deletedByCategory, and given NO category. A category it could not read is
      never claimed

  - given: >
      VERSION 3. The same delete, whole call rolled back afterwards (the
      preview the delete box is built from)
    expect: >
      after the rollback every element is back, and the trial deletes inside
      the call left nothing behind: Revit's own Delete box lists exactly the
      count `deleted` reports, not double, and no extra warning appears

second_route:
  - Revit's own undo stack: one Ctrl+Z must put back exactly what `deleted` listed

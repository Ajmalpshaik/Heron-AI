id: FRG-ELE-007
semantic-identity: "delete these elements from the model"
kind: action
domain: revit.elements
capability: DELETE_ELEMENTS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Deletes elements. The most destructive thing in this library, and the one
  whose honest reporting matters most.

  **Deleting one element can delete others, and Revit will not warn first.**
  A wall takes its hosted doors and windows. A duct run takes its fittings and
  its insulation. A level can take everything on it. `Document.Delete` hands
  back **what actually went** — which is routinely a longer list than what was
  asked for — and that returned set, never the input count, is what this
  fragment reports.

  **So the caller can tell the user what will really happen before it happens.**
  This is what makes Golden Rule 17's preview possible for deletion: run the
  same call inside a transaction that is rolled back, and the returned set is
  the true blast radius.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
  provides:
    - name: deleted
      role: result
      type: ICollection<ElementId>
    - name: askedFor
      # How many were handed in. The size of the request, never what actually
      # went - `deleted` is what Document.Delete returned and that is the only
      # honest number here (D-52).
      role: accounting
      type: int
    - name: alsoWent
      # How many MORE went than were asked for. DELETING ONE ELEMENT CAN
      # DELETE OTHERS AND REVIT WILL NOT WARN FIRST - a wall takes its hosted
      # doors and windows. The finding this fragment exists to surface.
      role: result
      type: int
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>

proof:
  date: '2026-09-13'
  by: Ajmal PS
  model: test projject (3,509 elements), Revit 2024, session 40932
  positive_case: run as it would normally be run - the arrangement was re-made first by running
    select-by-category-name, set-selection with this phase's own values - run inside a transaction,
    and Revit reported the transaction group ROLLED BACK afterwards. returned alsoWent 0,
    askedFor 6, deleted 6 item(s) [925780, 925782, 925784, ...], refused 0 item(s). inputs
    came elements from the selection (6). on test projject
  negative_case: "CANNOT COME BACK EMPTY, so proved by TRACKING instead (D-53). delete-elements\
    \ describes whatever it is given, so no arrangement makes its answer empty. What D-30's\
    \ negative case exists to catch - a fragment that succeeds while doing nothing, or answers\
    \ about a set it was not given - is caught here by the answer following the input exactly\
    \ across 4 different inputs:\n\n      2 pipes - a fitting went with them -> deleted 4\
    \ (asked for 2, alsoWent 2)\n      2 levels - SAME askedFor as the row above, 60 more\
    \ went -> deleted 62 (asked for 2, alsoWent 60)\n      6 ducts - nothing hung off them\
    \ -> deleted 6 (asked for 6, alsoWent 0)\n      19 walls - nothing hung off them either\
    \ -> deleted 19 (asked for 19, alsoWent 0)\n\n    Different inputs, exact matches every\
    \ time. A fragment falling back to the active view, the whole model, or a previous run\
    \ could not do that."
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: 41bec93db19aba00

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Document.Delete(ICollection<ElementId>)`
  returns the ids actually removed on every release 2020 to 2027, and no
  ElementId is built from an integer, so 2024's move to 64-bit ids does not
  reach this code.

# ROUTING - repeated in HIDE_ELEMENTS, which is what is usually meant.
#
#   "get rid of them"                -> ASK WHICH. On a view it is HIDE_ELEMENTS
#                                       and reversible; in the model it is here
#                                       and it is not. The sentence does not say
#   "hide these"                     -> HIDE_ELEMENTS
#   "delete these" / "remove these"  -> here
#   "undo that"                      -> Revit's own Undo, never a delete written
#                                       to reverse a create
#
# "GET RID OF THEM" IS THE DANGEROUS SENTENCE and it is genuinely ambiguous.
# Hiding and deleting are one word apart in English and a world apart in the
# model. D-33 says ask, and this is the clearest case in the library.
#   "find the lines drawn on top of each other" -> FIND_OVERLAPPING_LINES
#                                       first. It deletes nothing, and the
#                                       heights have to be read before a
#                                       model line is removed

utterances:
  - delete these
  - remove these elements
  - delete them from the model
  - take these out of the model
  - delete the ones I selected

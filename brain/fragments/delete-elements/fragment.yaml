# VERSION 5 (2026-11-26) - THE COUNT STOP IS A REFUSAL, NOT A THROWN ERROR,
# and still DRAFT. FRAGMENT-ISSUES row 5b-2060 (issue #1462), Revit 2020, a
# scratch copy of the MEP sample: 78 rooms that Revit's delete takes as 81,
# and expectedCount 80 and 0 stopped with the right words and nothing deleted
# - but THROWN, so the caller got `fragment_threw` and NEEDS-CHECKING Group QV
# could not sign the card on its negatives. Now both stops - a count that
# differs, and a trial that cannot start - put version 4's same words in
# `refusedWhy`, every id asked for in `refused` (none of them went), and
# delete nothing: `deleted` stays empty. A trial Revit cannot put back, and a
# rebuild it cannot finish, are still thrown - failures, not refusals. Version
# 4 was never proved; Group QV is owed on version 5 (D-30).
#
# VERSION 4 (2026-11-26) - A COUNT THE YES NAMED IS CHECKED BEFORE ANYTHING
# GOES, and back to DRAFT. FRAGMENT-ISSUES row 5b-1990 (issue #1278), Revit
# 2020, a real job: the yes named 36 elements and Revit's delete took 62, and
# the method compared `deleted` only AFTER the delete. With `expectedCount`
# given, the whole request is first deleted inside one SubTransaction and
# rolled back - Revit's own count of what goes - and when that count is not
# the one the yes named, NOTHING is deleted: the call stops with Revit's list
# by category and every id, so the modeller can be asked again for what
# really goes. Left out (-1), nothing changes from version 3; a given 0 is
# checked like any other count. Version 3 was
# PROVEN on 2026-11-24 (the proof block below, kept as the record of what it
# proved); its C# moved, so it is DRAFT again until NEEDS-CHECKING Group QV
# is run (D-30).
#
# VERSION 3 (2026-11-23) - WHAT WENT IS NAMED, READ BEFORE IT WENT, and back
# to DRAFT. FRAGMENT-ISSUES row 5b-1996 (issue in the row), Revit 2020, family
# documents: one unused family type asked for and `deleted 2 item(s) [5931,
# 9021]`; 21 forms asked for and `alsoWent 220`; the run record held only
# `{"change": "deleted", "id": "9021"}`, so nobody could say what went. Version
# 3 tries each delete first in a SubTransaction it rolls back - Revit's own
# answer to "what goes" - reads every id it returns while it still exists, then
# deletes for real. `deletedWhat` names every deleted id (category | name | why
# it went) and travels whole into the reply and the run record;
# `deletedByCategory` counts what was asked for and what also went, a form's
# own sketch, sketch plane and sketch lines counted as "their sketches". An id
# it could not read is NOT READ, never given a category. The delete itself is
# unchanged. Version 2 was PROVEN on 2026-11-16 (the proof block below, kept as
# the record of what it proved); its C# moved, so it is DRAFT again until
# NEEDS-CHECKING Group PS is run (D-30).
#
# VERSION 2 (2026-11-16) - THE WALLS A DELETE DETACHES ARE NAMED, and back to
# DRAFT. FRAGMENT-ISSUES row 5b-1674 (issue #852, Villa 2, Revit 2024): each
# roof rebuild left the walls at their plate - Revit said only "Walls 19
# modified" - and on 2020 to 2024 Heron cannot attach them again. Version 1
# reported what Document.Delete returned, and a wall that loses its attachment
# is changed, not deleted, so it was in no answer. Version 2 names, before the
# delete, every wall whose top or base is attached and whose plan lies under a
# roof, floor or ceiling being deleted (`attachedBefore`), then rebuilds the
# model and reads them again: those whose attachment went are in
# `detachedWalls`, and `wallsNote` says so in plain words, with Heron's limit
# on 2020 to 2024. The delete itself is unchanged. Version 1 was PROVEN on
# 2026-09-13 (the proof block below, kept as the record of what it proved);
# its C# moved, so it is DRAFT again until NEEDS-CHECKING Group OE is run
# (D-30).

purpose: >
  Deletes elements. The most destructive thing in this library, and the one
  whose honest reporting matters most.

  **Deleting one element can delete others, and Revit will not warn first.**
  A wall takes its hosted doors and windows. A duct run takes its fittings and
  its insulation. A level can take everything on it. `Document.Delete` hands
  back **what actually went** — which is routinely a longer list than what was
  asked for — and that returned set, never the input count, is what this
  fragment reports.

  **So the caller can tell the user what will really happen before it happens.**
  This is what makes Golden Rule 17's preview possible for deletion: run the
  same call inside a transaction that is rolled back, and the returned set is
  the true blast radius.

  **A WALL ATTACHED TO A ROOF, FLOOR OR CEILING THAT GOES IS DETACHED, AND
  NAMED** (version 2). It is changed, not deleted, so `deleted` never shows
  it. So before the delete every wall attached at its top or base and lying
  in plan under what is deleted is named, and after it each is read again:
  `detachedWalls` lists those whose attachment went, and `wallsNote` says what
  that means - on Revit 2020 to 2024 Heron cannot attach a wall again, so it
  is Attach Top/Base by hand.

  **WHAT WENT IS NAMED, BY CATEGORY** (version 3). Each delete is first tried
  inside a SubTransaction that is rolled back, and every id that trial returns
  is read while it is still in the model. `deletedWhat` names every deleted id
  - category, name, and why it went (asked for, went with an element, or a
  form's own sketch) - and `deletedByCategory` says what was asked for and
  what also went, counted by category. In a family, a form's own sketch,
  sketch plane and sketch lines are counted together, so 241 reads as "21
  form(s) + their sketches". An id it could not read is NOT READ.

  **A COUNT THE YES NAMED IS CHECKED BEFORE ANYTHING GOES** (version 4).
  With `expectedCount` given - the number the modeller said yes to, which
  REPORT_ELEMENT_DEPENDENCIES gives as `goesTotal` - the whole request is
  first deleted in one SubTransaction and rolled back. When Revit's own count
  differs, NOTHING is deleted: the call stops and says the two numbers,
  Revit's list by category and every id that would go, so the question can be
  asked again with what really goes. `countChecked` says the count was met.
  Left out, the delete runs as version 3 did.

  **THAT STOP IS A REFUSAL** (version 5). The words are in `refusedWhy`,
  every id asked for is in `refused`, and `deleted` is empty - the call
  answers that it refused, never that it threw. A trial that cannot start,
  so the count cannot be checked, is refused the same way.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: expectedCount
      # Version 4. How many elements the modeller's yes named - asked for and
      # everything that goes with them. Given, the whole delete is tried and
      # rolled back first, and a different count from Revit deletes NOTHING.
      # Left out (-1), no check: the delete runs as version 3 did. A given 0
      # is a count like any other - the yes named nothing - and stops the
      # delete if Revit would take anything.
      type: int
      source: request
      optional: true
      absent: "-1"
  provides:
    - name: deleted
      role: result
      type: ICollection<ElementId>
    - name: askedFor
      # How many were handed in. The size of the request, never what actually
      # went - `deleted` is what Document.Delete returned and that is the only
      # honest number here (D-52).
      role: accounting
      type: int
    - name: alsoWent
      # How many MORE went than were asked for. DELETING ONE ELEMENT CAN
      # DELETE OTHERS AND REVIT WILL NOT WARN FIRST - a wall takes its hosted
      # doors and windows. The finding this fragment exists to surface.
      role: result
      type: int
    - name: refused
      # The ids asked for that were NOT deleted: each one Revit refused or
      # removed nothing for, and - version 5 - every id asked for when the
      # count check stopped the delete (why is in `refusedWhy`). The evidence
      # it looked and said no. Never a thing it FOUND, so it must not count
      # toward "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refusedWhy
      # Version 5. Why the count check stopped the delete, in the modeller's
      # words: the count the yes named, Revit's own count, its list by
      # category and every id beyond those asked for - or that the trial
      # could not start, so the count could not be checked. Nothing was
      # deleted. Empty when it did not stop (D-52).
      role: accounting
      type: string
    - name: attachedBefore
      # Version 2. Read BEFORE the delete: every wall whose top or base is
      # attached and whose plan extent overlaps a roof, floor or ceiling being
      # deleted, with which end. A likely list - a wall can be attached to
      # something else above the same plan - so it describes what
      # `detachedWalls` was measured on (D-52). Empty when none.
      role: accounting
      type: string
    - name: detachedWalls
      # Version 2. Walls in `attachedBefore` that are NOT attached at that end
      # once the model is rebuilt after the delete - measured, never inferred.
      # The finding version 2 exists to surface: Revit says only "Walls N
      # modified".
      role: result
      type: IList<ElementId>
    - name: wallsNote
      # Version 2. The sentence for `detachedWalls`: how many, their ids, and
      # on Revit 2020 to 2024 that Heron cannot attach them again (D-52).
      # Empty when none.
      role: accounting
      type: string
    - name: deletedWhat
      # Version 3. EVERY deleted id -> "category | name | why it went": asked
      # for, went with <asked id>, or sketch / sketch plane / sketch line of
      # form <asked id>. Read BEFORE the delete, from a trial delete rolled
      # back. An id the trial did not return or Revit gave no element for is
      # "NOT READ - ..." - never a category guessed. A dictionary, so every
      # entry reaches the reply and the run record whole. The finding version
      # 3 exists to surface: what the extra elements WERE.
      role: result
      type: IDictionary<string, string>
    - name: deletedByCategory
      # Version 3. The sentence for `deletedWhat`: how many were deleted, what
      # was asked for and what also went, counted by category, a form's own
      # sketches counted as "their sketches", and how many were NOT READ
      # (D-52). Empty when nothing was deleted.
      role: accounting
      type: string
    - name: countChecked
      # Version 4. With expectedCount given: the sentence that Revit's own
      # trial took that same count before anything was deleted. Empty when no
      # count was given. A different count never reaches here - the call
      # stops, deletes nothing, and says why in `refusedWhy` (D-52).
      role: accounting
      type: string


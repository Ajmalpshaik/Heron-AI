compatibility-note: >
  One implementation for every release. `Document.Delete(ICollection<ElementId>)`
  returns the ids actually removed on every release 2020 to 2027, and no
  ElementId is built from an integer, so 2024's move to 64-bit ids does not
  reach this code. Version 2's `WALL_TOP_IS_ATTACHED` and
  `WALL_BOTTOM_IS_ATTACHED` (read-only, on every release), `RoofBase`,
  `Floor`, `Ceiling`, `Element.get_BoundingBox`, `Document.Regenerate`,
  `Element.IsValidObject` and `Application.VersionNumber` read the same on
  2020 to 2027; no wall attachment member (2025 on) is used, so one path
  serves every release. Version 3's `SubTransaction` (Start, RollBack),
  `Document.GetElement`, `Element.Category`, `Element.Name`, `Sketch`,
  `Sketch.SketchPlane`, `SketchPlane`, `CurveElement.SketchPlane` and
  `GenericForm` are on every release 2020 to 2027, and an id is only ever
  printed with `ElementId.ToString()`. Version 4 adds no API member: the
  same `SubTransaction`, `Document.Delete(ElementId)`,
  `Document.GetElement` and `Element.Category` on every release. Version 5
  adds no API member: it changes only how the stop is answered.

# ROUTING - repeated in HIDE_ELEMENTS, which is what is usually meant.
#
#   "get rid of them"                -> ASK WHICH. On a view it is HIDE_ELEMENTS
#                                       and reversible; in the model it is here
#                                       and it is not. The sentence does not say
#   "hide these"                     -> HIDE_ELEMENTS
#   "delete these" / "remove these"  -> here. "remove these" DECLARED below
#                                       2026-11-01 (row 5b-1358): without it
#                                       the bare sentence ranked to
#                                       REMOVE_TAGS, then REMOVE_MEP_INSULATION
#   "remove the insulation from these
#    ducts"                          -> REMOVE_MEP_INSULATION - the insulation
#                                       only, never the duct
#   "undo that"                      -> Revit's own Undo, never a delete written
#                                       to reverse a create
#   "delete this roof" with walls attached to it
#                                    -> here; the walls it detaches are named
#                                       (version 2, row 5b-1674). Attaching
#                                       them again is ATTACH_WALLS (2025 on),
#                                       by hand before
#   "delete these forms" (ids given) -> REPORT_FAMILY_FORMS first, in a
#                                       family; its forms then come here
#                                       with expect_from report-family-forms
#
# "GET RID OF THEM" IS THE DANGEROUS SENTENCE and it is genuinely ambiguous.
# Hiding and deleting are one word apart in English and a world apart in the
# model. D-33 says ask, and this is the clearest case in the library.
#   "find the lines drawn on top of each other" -> FIND_OVERLAPPING_LINES
#                                       first. It deletes nothing, and the
#                                       heights have to be read before a
#                                       model line is removed

utterances:
  - delete these
  - remove these
  - remove these elements
  - delete them from the model
  - take these out of the model
  - delete the ones I selected

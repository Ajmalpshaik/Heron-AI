# VERSION 2 (2026-11-01) - REPORT_ELEMENT_GEOMETRY WAS MERGED INTO THIS CARD
# on the owner's instruction ("make sure there is no duplicate tools"), and is
# DEPRECATED. Both read an element's solids - nested ones as placed - and
# named the ones with none; this one totalled the volume and area and guarded
# against an element counted twice, that one listed the shape. What it had and
# this card lacked is here now: `geometry`, one line per element - solids,
# faces and their area, edges and their length, volume and box in
# millimetres - and, with `detail` "edges" or "faces", each edge (a line's
# ends, an arc's centre and radius) or each face (a flat one's normal and
# area), stopping at 200 lines and saying so; `solidCount`; `findings`.
#
# THE TWO READ GEOMETRY AT DIFFERENT DETAIL LEVELS, AND THE MERGED CARD READS
# FINE: REPORT_ELEMENT_GEOMETRY set ViewDetailLevel.Fine; version 1 here left
# Options' detail level unset, which Revit reads at its own default. A family
# can draw different solids at Coarse, Medium and Fine, and only Fine is its
# whole shape - a volume measured below it can be short, and a face list can
# describe a simplified stand-in. So Fine, for the totals and the shape alike.
# WHETHER VERSION 1's NUMBERS MOVE ON A REAL MODEL is NEEDS REAL REVIT: run
# both versions on the same set - a nested mechanical family above all - and
# compare. A solid counts when it has volume (this card's rule; that one
# counted any solid with a face), so `solidCount` and the totals come from the
# same solids. Where its outputs are now: `geometry`, `solidCount`, `findings`
# -> the same names; `noGeometry` -> `noSolid`.
#
# Version 1's proof below no longer described the code (impl/ changed) and
# was kept as the record; DRAFT at the time, until version 2 is proved on a
# real model (D-30).

purpose: >
  The solid volume and surface area of each element, in cubic and square
  metres, plus the totals.

  **Surface area is the one that gets used on an MEP job.** Duct insulation,
  painting and lagging are all bought by the square metre, and nothing in this
  library could produce that number — `MEASURE_ELEMENT_LENGTHS` answers a
  different takeoff question and was what the search offered.

  **It measures the GEOMETRY, not a parameter.** Revit publishes a volume
  parameter on some categories and not others, and where it exists it can be
  stale or excluded by a setting. The solids are what the element actually is.

  **Version 2 lists the shape as well** - solids, faces, edges and the box in
  millimetres, and each edge or face when asked - all read at Fine detail.

  **Insulation is NOT included, and that matters for exactly the job this is
  for.** Insulation is a separate element wrapped around the duct, so a duct's
  own surface area is the bare duct. To price the lagging, measure the
  insulation elements — which is a different selection, not a different number.

contract:
  needs:
    - name: elements
      type: IList<Element>
    # VERSION 2, from REPORT_ELEMENT_GEOMETRY. "summary", "edges" or "faces" -
    # how much of the shape `geometry` lists. Left out: summary.
    - name: detail
      type: string
      source: request
      optional: true
      absent: summary
  provides:
    - name: volumeM3
      role: result
      type: IDictionary<ElementId, double>
    - name: areaM2
      role: result
      type: IDictionary<ElementId, double>
    - name: totalVolumeM3
      role: result
      type: double
    - name: totalAreaM2
      role: result
      type: double
    - name: noSolid
      # Elements with no solid geometry, so it could not be measured. The
      # evidence it looked, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: geometry
      # VERSION 2. ONE STRING, a line per element - solids, faces and their
      # area, edges and their length, volume and box in millimetres - and,
      # when asked, a line per edge or face. A string because a list reaches
      # the chat cut to three items.
      role: result
      type: string
    - name: solidCount
      # VERSION 2. The solids read, nested ones included.
      role: result
      type: int
    - name: findings
      type: IList<string>


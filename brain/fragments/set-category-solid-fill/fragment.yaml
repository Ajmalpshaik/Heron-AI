id: FRG-VIEW-107
semantic-identity: "wash a whole category with a solid colour in one view"
kind: action
domain: revit.views
capability: SET_CATEGORY_SOLID_FILL
# Version 2 (2026-10-13, FRAGMENT-ISSUES 5b-453): every category is READ BACK
# after the Set - the stamped solid fill included - and counted only when what
# was asked for is what Revit holds. Version 1 counted the call, so Rooms on
# Revit 2020 came back "overridden 1" with nothing stored. One that reads back
# empty is in `refused` in a sentence; one that kept part of it is in the new
# `notKept`, each setting named. The inputs and the other outputs mean what
# they meant. The proof below is version 2's, signed by Ajmal PS on
# 2026-10-13 (Group DV, DV7).
version: 2
source: OFFICIAL
risk: MODIFY
# A settings change: after it runs from the chat, the Companion page offers its values
# as a table the modeller can edit and apply again (docs/40 section 21.1).
companion: settings
companion-subject: view, categories

purpose: >
  SET_CATEGORY_GRAPHICS with the fill patterns filled in. It takes the same
  settings object - colours, halftone, line weights - and stamps Revit's solid
  fill pattern onto the surface and the cut before applying it to the category.

  WHY THIS IS A SEPARATE FRAGMENT RATHER THAN TWO MORE KEYS IN THE PARSER.
  `OneOverride` in RevitFragment.cs sets nine things and deliberately not the
  patterns, because a pattern is an ELEMENT and naming one is a filter's job
  rather than a string parse. That line is right and this fragment keeps it:
  THE ELEMENT LOOKUP HAPPENS HERE, in fragment source, where a
  FilteredElementCollector belongs. The parser still only ever sees strings,
  and widening it would have cost a rebuilt add-in and a Revit restart.

  WITHOUT THIS, A PATTERN COLOUR DOES NOTHING YOU CAN SEE. A surface colour
  tints the pattern the material already carries; where the material carries
  none, the colour is stored, reads back correctly, and paints nothing at all.
  That is the quietest failure in the whole override cluster - REPORT_CATEGORY_
  OVERRIDES says RGB(230,230,230) and the paper comes out blank.

  AND NOT EVERY CATEGORY CAN BE CUT. Furniture, most equipment in plan and
  every annotation category are not cuttable, and Revit does not object when
  you set a cut pattern on one - it stores it, reads it back faithfully, and
  draws nothing with it. So the cut half is applied only where `IsCuttable`
  says it means something, and the categories that could not take it come back
  NAMED in `notCuttable`. They are still overridden and still counted: the
  surface half lands, and a plan of furniture shows its surface anyway.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: view
      type: View
      source: request
    # Top-level categories only: a sub-category's name is refused. Revit
    # 2020 takes an override on a sub-category and reads back nothing
    # (measured 2026-10-13, FRAGMENT-ISSUES 5b-453). Version 1 counted the
    # call, so it would have reported a change that is not there; version 2
    # reads it back and would refuse it in words, but the binder still hands
    # this card top-level categories only - whether a later release keeps a
    # sub-category's override is NEEDS-CHECKING DV4. SET_CATEGORY_VISIBILITY
    # takes sub-categories; it reads its change back.
    - name: categories
      type: IList<Category>
      source: request
    # The same object SET_CATEGORY_GRAPHICS takes, built by the same parser.
    # This fragment ADDS the two pattern ids to it and changes nothing else,
    # so every colour and weight the caller asked for survives.
    - name: overrides
      type: OverrideGraphicSettings
      source: request
  provides:
    - name: overridden
      # Categories whose read-back holds every setting asked for, the solid
      # fill included. Not the calls made: version 1 counted those (5b-453).
      role: result
      type: int
    - name: notKept
      # Categories that read back with PART of what was asked for, each
      # setting that did not land named with what came back - "Ducts: not
      # kept - surface colour asked 230,230,230, read back none". Something
      # was written, so this is not a refusal; not all of it, so not counted.
      role: accounting
      type: IList<string>
    - name: solidPattern
      # WHICH pattern it found, by name. The evidence the wash will actually
      # paint - "overridden 1" cannot tell you that on its own.
      role: accounting
      type: string
    - name: notCuttable
      # Categories whose CUT half was left alone because Revit never cuts
      # them. NOT a refusal and NOT a skip - these ARE overridden and DO
      # count toward `overridden` when the surface half reads back. It is a
      # note on what landed, so that a cut colour that draws nothing is a
      # sentence rather than a mystery.
      role: accounting
      type: IList<string>
    - name: notControllable
      # Categories this view will not let be overridden. The evidence it
      # looked and could not, never a thing it did (D-52).
      role: accounting
      type: IList<string>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52). A category name alone is a view
      # template that refused the Set; "Revit took the override and stored
      # nothing for Rooms" is a Set that raised nothing and read back empty.
      role: accounting
      type: IList<string>

proof:
  date: '2026-10-13'
  by: Ajmal PS
  model: Project1 (3,001 elements), Revit 2020, session 33484
  positive_case: 'THE POSITIVE WAS Walls on ''FloorPlan: Level 1'', overrides=surface-colour=230,230,230;
    projection-line-colour=200,30,30; projection-line-weight=5, and it is counted because
    GetCategoryOverrides read back those colours, the weight and the solid fill on both the
    surface and the cut (version 2''s own read-back). run as it would normally be run - run
    inside a transaction, and Revit reported the transaction group ROLLED BACK afterwards.
    returned notControllable 0 item(s), notCuttable 0 item(s), notKept 0 item(s), overridden
    1, refused 0 item(s), solid FillPatternElement, solidPattern <Solid fill>. inputs came
    view as given; categories as given (1); overrides as given. on Project1'
  negative_case: 'run with view=FloorPlan: Level 1, categories=Rooms, overrides=surface-colour=230,230,230;
    projection-line-colour=200,30,30; projection-line-weight=5 instead - chosen because it
    should not contain what this fragment reports - run inside a transaction, and Revit reported
    the transaction group ROLLED BACK afterwards. returned notControllable 0 item(s), notCuttable
    1 item(s) [Rooms], notKept 0 item(s), overridden 0, refused 1 item(s) [Revit took the
    override and stored nothing for Rooms], solid FillPatternElement, solidPattern <Solid
    fill>. inputs came view as given; categories as given (1); overrides as given. on Project1.
    VERSION 1, RUN THE SAME WAY ON Rooms the same hour (rolled back), answered overridden
    1, refused 0 - the defect this version fixes (FRAGMENT-ISSUES 5b-453).'
  second_route: 'REPORT_CATEGORY_OVERRIDES, the same evening on the same model and plan, rolled
    back. It reads only categories that have elements in the view and Project1''s plan had
    no room, so four walls and an enclosed room were made first by a scratch setup step (NOT
    a Heron fragment - CREATE_WALL and PLACE_ROOM_AT_POINT share their `points` input and
    cannot both run in one arrangement), then this fragment as a setup step, then the report:
    categories present 11 against 10 without the room, so Rooms was looked at. With Walls
    asked: 1 of 11 carry an override, ''Walls: line RGB(200,30,30), surface RGB(230,230,230),
    surface pattern <Solid fill>, cut pattern <Solid fill>, line weight 5''. With Rooms asked:
    0 of 11, nothing overridden at category level. The plan read 10 categories and no override
    afterwards, so nothing was kept. Visibility/Graphics by hand was not opened: nothing survives
    a rollback to look at.'
  fingerprint: d8d8e5d89b509e2a

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `OverrideGraphicSettings.SetSurface
  ForegroundPatternId`, `SetCutForegroundPatternId` and their `...Visible`
  pairs have carried these names since 2019, so 2020 is already past the
  rename from the old `SetProjectionFillPatternId` spelling.
  `FillPattern.IsSolidFill`, `View.SetCategoryOverrides` and
  `Category.get_AllowsVisibilityControl` are unchanged 2020 to 2027 - the
  first is read off COLOR_BY_PARAMETER, which is proven on the same span.
  `Category.IsCuttable` and the OverrideGraphicSettings COPY CONSTRUCTOR are
  both unchanged across the same span. The copy is what makes the per-category
  decision possible without stamping and un-stamping one shared object round
  the loop. The read-back (version 2) calls `View.GetCategoryOverrides` and
  the getters beside those setters, under the same 2019 names;
  tools/check-api-surface.py finds every one on 2020 to 2027.

# TRAP - OBSERVED ELSEWHERE, NOT YET PROVEN HERE. Added 2026-09-23.
#
# Another tool, on real models and mostly on Revit 2020, saw a CATEGORY
# override drop the SURFACE fill on ducts, pipes, air terminals, sprinklers,
# cable tray and conduit - and found that `IsCuttable` predicts only the CUT
# half of what lands. This fragment decides the cut half by `IsCuttable`.
# Version 1 counted every category it set as `overridden`, so on those six
# categories the wash might not land at all and nothing in the answer said so.
# Heron measured the same shape once, one fragment over: on Ducts, Revit kept
# one setting of the four SET_CATEGORY_GRAPHICS gave it, the surface colour
# among the ones dropped (FRAGMENT-ISSUES row 175, Revit 2024). Not reproduced
# here for this fragment. Since version 2 (5b-453) each category is read back
# after the Set, and a wash that did not land comes back in `notKept` or
# `refused`, named, rather than counted. Since PR #300, REPORT_CATEGORY_OVERRIDES
# reads the surface and cut pattern and colour back in full as well.
# NEEDS-CHECKING AJ7.
#
# THE INSULATION RULE IS NOT APPLIED HERE, AND WHY. The owner's standing rule
# is that insulation and lining take the colour of the run they wrap, and
# COLOR_BY_PARAMETER, OVERRIDE_GRAPHICS_IN_VIEW and HIGHLIGHT_VS_REST follow it
# element by element. By CATEGORY it has no single answer: ducts and duct
# fittings washed two colours cannot both be the colour of the one Duct
# Insulation category; the owner's grayout standard gives insulation a layer
# of its own; and whether Revit keeps a surface fill on the insulation
# categories at all is not known. To wash insulation the colour of its runs,
# name the insulation categories in the same call.
#
# Written 2026-09-23 as a note only, while the code was version 1's. Row 174 -
# its signed proof says the read-back cannot tell a stamped pattern from none,
# and the code and a run since say it could - is the owner's call and is not
# touched here: version 2 compares the pattern ids it stamped, so its own
# read-back does tell them apart.

# ROUTING - the line between this and SET_CATEGORY_GRAPHICS is ONE QUESTION:
# must the category READ as a colour, or only be tinted where it already
# hatches?
#
#   "grey the architecture back"      -> SET_CATEGORY_GRAPHICS. Halftone and
#                                        line colour need no pattern
#   "wash the walls light grey so it
#    prints"                          -> HERE. A colour with no pattern is
#                                        stored and invisible
#   "colour these by system"          -> COLOR_BY_PARAMETER, which finds the
#                                        same solid fill and groups by a value
#   "put this view back to normal"    -> RESET_VIEW_GRAPHICS
#
# THIS REPLACES RATHER THAN MERGES, inherited from SET_CATEGORY_GRAPHICS and
# true for the same reason: `SetCategoryOverrides` takes the whole object. To
# keep what a category already had, read `view.GetCategoryOverrides(id)` first
# and hand THAT in as `overrides`.

utterances:
  - wash the category in a solid colour
  - make the walls solid grey so it prints
  - solid fill the whole category
  - the colour is set but nothing shows on paper
  - give this category a colour wash
  - fill the category solid, not just the lines

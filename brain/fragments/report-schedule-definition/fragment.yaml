# VERSION 2 (2026-10-21, row 5b-1290). EVERY FILTER RULE, NUMBERED, ON ONE
# LINE. On a real project in Revit 2020 two duplicated duct heater schedules
# came back "filterCount 4" and nothing a modeller could read: the rules were
# one line inside `findings`, and a list is cut to three entries before anyone
# reads it - the filter line is the fourth. `filterRules` is a new result, one
# string: each schedule's rules numbered in the order the schedule holds them,
# each column by its printed heading, the match type in words and the value as
# Revit shows it - a Level rule's level by NAME. The numbers are the ones
# SET_SCHEDULE_FILTERS version 2 counts with in `ruleNumber`, so the rules can
# be read before a change and after it. Only the filter part of the report
# changed: the same rule wording is in `findings`, columns, sorting and totals
# are as version 1 reported them. Version 1's proof below is kept as evidence
# of version 1; it no longer describes this code (D-30), so this is DRAFT
# until NEEDS-CHECKING Group IH is run and signed.

purpose: >
  Reads back how a schedule is CONFIGURED - the columns it carries, the order
  they sit in, what it sorts and groups by, what it filters out, and whether it
  totals. It changes nothing.

  IT EXISTS BECAUSE EVERY QUESTION ABOUT A SCHEDULE WAS BEING ANSWERED BY THE
  FRAGMENT THAT ADDS COLUMNS TO ONE. Measured against the library before this
  batch, *"what columns does this schedule have"*, *"show the schedule filter
  rules"* and *"what fields are in this schedule"* all resolved to
  `ADD_SCHEDULE_FIELDS` or `FIND_SCHEDULES`. The first is a **write** answering
  a question; the second finds the schedule and then has nothing to say about
  it. A question must not be answered by a fragment that modifies anything.

  **A HIDDEN COLUMN IS STILL A COLUMN, and that is the row worth reading.**
  Revit keeps a hidden field in the definition - it is in the schedule, it is
  simply not drawn. Somebody looking at the sheet and asking "where did the
  Level column go" is looking at a schedule that still HAS the Level column.
  Listing only what is visible would confirm their wrong guess, so hidden
  columns are listed and marked rather than omitted.

  **A FILTER'S NUMERIC VALUE IS REPORTED IN REVIT'S INTERNAL UNITS AND SAID TO
  BE.** A double filter value could be a length, an airflow, a pressure or an
  angle, and telling them apart needs the units API - which is the call that
  breaks at Revit 2021 and is forbidden here. So the number is handed back raw
  with the internal-units caveat attached rather than converted on a guess. A
  number converted by the wrong rule is worse than a number nobody converted:
  it looks finished.

  **A FILTER VALUE IS READ THROUGH THE GETTER THAT MATCHES ITS KIND.** Asking
  a string filter for its double value throws. Each filter is asked what kind
  of value it holds first, which is also the honest way to report a filter that
  holds no value at all - "has a value" and "is blank" are real filter types.

  **EVERY FILTER RULE IS LISTED, NUMBERED, IN ONE LINE (version 2).**
  `filterRules` holds each schedule's rules - "'DUCT HEATER SCHEDULE': 1. Type
  Mark equals 'MFD'; 2. Level equals 'FIRST FLOOR'" - each column by the
  heading it prints under (and its field name beside it when the heading was
  renamed), the match type in words, the value as Revit shows it. An element
  value - a Level rule holds the level, not its name - is shown by the
  element's NAME. A schedule with no rules says so. The numbers are the ones
  SET_SCHEDULE_FILTERS' `ruleNumber` counts with. One string, not a list,
  because a list is cut to three entries before anyone reads it - which is how
  four rules over two schedules came back as a count and nothing else.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
  provides:
    - name: findings
      type: IList<string>
    - name: fieldNames
      role: result
      type: IList<string>
    - name: hiddenFieldNames
      # A HIDDEN COLUMN IS STILL A COLUMN, and that is the row worth reading -
      # Revit keeps it in the definition where nothing on the drawing shows
      # it.
      role: result
      type: IList<string>
    - name: filterCount
      role: result
      type: int
    - name: filterRules
      # VERSION 2. Every schedule's filter rules, numbered, on one line - the
      # column by its printed heading, the match type in words, the value as
      # Revit shows it, an element value by name. Empty when no schedule was
      # described.
      role: result
      type: string
    - name: sortFieldCount
      role: result
      type: int
    - name: skippedNotSchedules
      type: int
      # Handed in and not a schedule - a wall has no columns or sort order.
      # A count of what was passed over, not of anything described.
      role: accounting


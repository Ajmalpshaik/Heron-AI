# What a proof of this fragment must contain. D-30: the negative case is the one
# that catches "succeeded and did nothing", so it is not optional.

positive:
  - given: a model with 4 ducts, whole model (levelId = InvalidElementId)
    category: OST_DuctCurves
    expect: 4 elements, and the same 4 a manual selection gives

  # THE CASE THAT MATTERS MOST, and the reason this fragment was re-authored.
  # A level lookup that stops before RBS_START_LEVEL_PARAM does not throw on a
  # duct - it silently matches nothing and reports success. Only a level scope
  # that SHOULD match can tell the two apart, so a proof of this fragment
  # without this row is not a proof of the thing most likely to be wrong.
  - given: the same model, scoped to the level those 4 ducts are actually on
    category: OST_DuctCurves
    expect: >
      4 - the SAME count as the whole-model run. Anything less, and especially
      0, means the level chain is not reaching MEP curves

  - given: walls on a known level, to prove the chain's other end
    category: OST_Walls
    expect: the walls on that level only, via Wall.LevelId rather than a parameter

  # D-59, added 2026-09-28 with version 2. NOT RUN.
  - given: >
      category Doors, a host level whose NAME also
      exists in the architectural link, includeLinks true
    expect: >
      `elements` unchanged from the host-only run,
      and the link's count "on a level named" that name in `linkedMatches`

  # VERSION 3, added 2026-10-06 - FRAGMENT-ISSUES 5b-335. The element whose
  # FIRST level parameter is empty and a LATER one holds the level.
  - given: >
      three work plane-based air terminals placed with no level of their own -
      FAMILY_LEVEL_PARAM empty, SCHEDULE_LEVEL_PARAM Level 1, the shape
      version 1 of PLACE_FAMILY_INSTANCES left - category Air Terminals,
      levelId Level 1
    category: OST_DuctTerminal
    expect: >
      elements 3 and unresolvedLevel 0. Version 2 answered elements 0 with
      matching 3 here, and the loads' Finalize then wrote no flow to any of
      them

  # VERSION 4, added 2026-11-01 - SELECT_BY_CATEGORIES and
  # SELECT_BY_CATEGORY_NAME merged in. NONE OF THESE HAS BEEN RUN. Each is
  # written to FAIL on version 3, which had no `categories`, no view, no
  # `perCategory`, `found` or `resolvedTo`, and refused a levelId left out.
  - given: >
      categories "Ducts, Duct Fittings, Duct Accessories, Flex Ducts", category
      and levelId LEFT OUT, on a model with ducts and fittings and no flex duct
    expect: >
      one set holding every duct, fitting and accessory, `found` its count, and
      `perCategory` with all FOUR names - Flex Ducts at 0, not missing. Each
      number agrees with a Revit schedule of that category. Version 3 refused
      the call: category and levelId were values the caller had to supply

  - given: >
      category Pipes, inViewOnly a floor plan that shows only part of the
      model's pipes, levelId left out
    expect: >
      only the pipes that view draws - fewer than the same call without the
      view. Version 3 had no view and answered for the whole model

  - given: category "duct accessories", lower case
    expect: >
      `resolvedTo` "Duct Accessories" - Revit's own name for what the words
      were read as - and the same elements as category OST_DuctAccessory

  - given: >
      category Ducts AND categories "Ducts, Duct Fittings"
    expect: >
      every element once, and Ducts once in `perCategory`. A category named
      twice is asked for once

  - given: >
      includeLinks true, inViewOnly a plan, category Doors, levelId the plan's
      level, on Revit 2023 or later with a linked model the plan shows
    expect: >
      `elements` the host's doors in that view only, and the link's line in
      `linkedMatches` counting its doors as that plan draws them on a level
      named as the host's - never added to `elements`

negative:
  - given: the same model, which has no air terminals
    category: OST_DuctTerminal
    expect: EMPTY, and reported as empty rather than as a success with no count

  - given: ducts, scoped to a level that has none on it
    category: OST_DuctCurves
    expect: >
      EMPTY - and this zero is only meaningful once the positive level case
      above has passed. On its own it is indistinguishable from a broken chain

  # VERSION 3, 5b-335's other half: passing an empty parameter over must not
  # put the element on EVERY level.
  - given: the same three air terminals, levelId Level 2
    category: OST_DuctTerminal
    expect: >
      elements 0 and unresolvedLevel 0 - they are found on Level 1 and only
      there

  # D-59, added 2026-09-28 with version 2. NONE OF THESE HAS BEEN RUN.
  - given: includeLinks ABSENT, on a model that HAS loaded links
    expect: >
      the same answer as version 1's proof, and linksSearched 0 with the first
      line of linkedMatches reading "Host model only - links not read". The
      switch left out must bind false, not refuse - if the run refuses with
      needs_request_values, the add-in in Revit is older than this change

  - given: includeLinks true on a model with NO links, or with every link unloaded
    expect: >
      linksSearched 0 and "Links asked for, NONE loaded - host only". It must
      NOT read like the absent case: one means there was nothing else to read,
      the other means reload them in Manage Links and ask again

  - given: one linked file placed TWICE, with includeLinks true
    expect: >
      linksSearched 1, not 2 - it counts files, not placements

  # VERSION 4, added 2026-11-01. NONE OF THESE HAS BEEN RUN.
  - given: category AND categories both left out
    expect: >
      REFUSED before anything is read - "No category was named, so NOTHING was
      read" - never an empty set that reads as "there are none". Version 3 was
      refused by the binder instead, for want of `category`; the sentence is
      this card's own now

  - given: category "Duct Accessory", singular - a word that is no category
    expect: >
      refused by the binder before this runs - "is not a category Revit
      knows" - and nothing read. The SAFER of the two merged rules:
      SELECT_BY_CATEGORY_NAME answered this with an empty set and near
      misses, and an empty set is the plausible zero. LIST_CATEGORIES gives the
      names to choose from

  - given: >
      includeLinks true WITH a view, on Revit 2020, 2021 or 2022, on a model
      that has a loaded link
    expect: >
      "Links NOT read: this Revit cannot read a link through a view" and
      linksSearched 0 - never the whole link reported as if it were the view.
      Version 3 had no view and read the whole link

  - given: categories "Ducts, Duct Fittings", inViewOnly a view that draws neither
    expect: >
      an empty set, found 0, and `perCategory` still listing both at 0

second_route:
  - compare against Revit's own schedule count for the category
  - for the level cases, compare against a view filtered to that level by eye

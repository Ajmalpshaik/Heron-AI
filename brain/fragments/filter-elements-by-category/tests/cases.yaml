# What a proof of this fragment must contain. D-30: the negative case is the
# one that catches "succeeded and did nothing", so it is not optional.
positive:
  - given: a model with 4 ducts
    category: OST_DuctCurves
    expect: 4 elements, and the same 4 a manual selection gives

negative:
  - given: the same model, which has no air terminals
    category: OST_DuctTerminal
    expect: EMPTY, and reported as empty rather than as a success with no count

second_route:
  - compare against Revit's own schedule count for the category

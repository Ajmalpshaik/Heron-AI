# What this fragment IS. The folder name is where it happens to sit today -
# rename it and nothing downstream notices. docs/09 section 4.
id: FRG-ELE-001
semantic-identity: "all elements of one category in the active document"
kind: filter
domain: revit.elements
capability: FILTER_ELEMENTS_BY_CATEGORY
# VERSION 3 (2026-10-06, FRAGMENT-ISSUES 5b-335): a level parameter that holds
# no level is passed over and the next one asked, where version 2 answered
# with the first one an element HAD. Three work plane-based diffusers with
# FAMILY_LEVEL_PARAM empty and SCHEDULE_LEVEL_PARAM on Level 1 were on no
# level ("matching 3", "elements 0"), so the loads' Finalize gave them no flow.
# VERSION 4 (2026-11-01): SELECT_BY_CATEGORY_NAME and SELECT_BY_CATEGORIES were
# merged into this card on the owner's instruction, and are DEPRECATED - see
# the comment block above `utterances`. Version 3's proof below is kept as the
# record; it no longer describes the code, so the card is DRAFT until version
# 4 is proved on a real model (D-30).
#
# VERSION 4, THE DETAIL - KEPT HERE BECAUSE `purpose` IS SEARCHED (the lesson
# of FRAGMENT-ISSUES 5b-1293: a hundred words of mechanics in a purpose moved
# a card out of the duct shortlists). `resolvedTo` says which categories the
# words were read as, by Revit's own names. Neither `category` nor
# `categories` given is refused before anything is read - never an empty set.
# `levelId` may be left out for the whole model. With `includeLinks` and a
# view, each link is read through that view on Revit 2023 and later, and
# refused in words on 2020-2022; the level is matched by name in a link
# either way.
version: 4
source: OFFICIAL
risk: READ

purpose: >
  Answers "which elements" for one Revit category or several, in the active
  document, excluding types, optionally scoped to one level. It is the filter half of
  every "select the X" and "how many X" job, which is exactly why it is a
  fragment and not part of either: two questions sharing one filter is D-29's
  design working.

  Leave levelId out, or pass none, for the whole model.

  Reports unresolvedLevel - how many elements had NO level found at all - so a
  broken level lookup reads as "12 found, 12 with no level" instead of as a
  plausible zero. Silently dropping them is what makes that failure invisible.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, every loaded link is read too and
  `linksSearched` says how many were: set and 0 means "you asked, and none
  are loaded", which is a different answer from host-only. Each link is asked for the category, and
  for the level by the host level's NAME - a link's levels are its own -
  and its matches are counted per link in `linkedMatches`.
  **NOTHING FROM A LINK IS EVER SELECTED OR CARRIED** - `elements` stays this model's own; the chain
  revives ids against this model, and a linked id that happens to be in
  use here binds an unrelated element (FRAGMENT-ISSUES row 75). Links
  nested inside a link are not read, and are counted in the answer. This
  is version 3 - version 2 read the links - and version 1's proof no longer
  describes the code; version 3's does.

  **SEVERAL CATEGORIES, OR ONE VIEW (version 4).** `categories` names several
  in one pass, `perCategory` shows each - one asked for and empty at 0 - and
  `inViewOnly` narrows it to what one view draws. This is version 4; version
  3's proof no longer describes the code, and the fragment is DRAFT until it
  is proved again.

contract:
  needs:
    - name: doc
      type: Document
    - name: category
      # ONE category, by the name Visibility/Graphics shows or the API name -
      # the binder turns the word into the category and refuses one that is
      # none, before this runs. Optional since version 4, so several can be
      # named in `categories` instead; left out it binds INVALID, which names
      # no category and is dropped. Neither given is refused here. The name and
      # the type are what versions 1 to 3 declared, and stay: the loads'
      # Finalize, the companion and drawing-set.yaml call `category=`.
      type: BuiltInCategory
      source: request
      optional: true
      absent: INVALID
    - name: categories
      # VERSION 4, from SELECT_BY_CATEGORIES: several categories, comma
      # separated, collected in ONE pass - "Ducts, Duct Fittings, Duct
      # Accessories". Optional; left out it binds INVALID, as `category` does.
      # A list of its own rather than `category` widened, because a
      # BuiltInCategory need is one category everywhere else in the binder.
      type: IList<BuiltInCategory>
      source: request
      optional: true
      absent: INVALID
    - name: levelId
      # Optional since version 4: left out reads as `none`, the whole model -
      # what the binder already made of `levelId=none`
      # (HeronBindingNote.DeclaredAbsent, then OneIdNamed).
      type: ElementId
      source: request
      optional: true
      absent: none
    - name: inViewOnly
      # VERSION 4, from SELECT_BY_CATEGORY_NAME and SELECT_BY_CATEGORIES: only
      # what this view draws. Left out, or given empty, it binds null - the
      # whole model (HeronBindingNote.AbsentValue, row 5b-1320). A view NAMED
      # and not found is still refused.
      type: View
      source: request
      optional: true
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: unresolvedLevel
      # How many had NO level found at all, so a broken level lookup reads as
      # "12 found, 12 with no level" instead of as a plausible zero. The
      # pattern SELECT_BY_PHASE names as the reason it counts the same way
      # (D-52).
      role: accounting
      type: int

# An explicit list, never a range. ">=2020" would claim 2028 and every release
# after it, which is exactly what D-05 forbids - an unlisted release is an
# error, never a guess.
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then one line per link. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75).
      role: accounting
      type: IList<string>
    - name: perCategory
      # VERSION 4, from SELECT_BY_CATEGORIES. One entry per category ASKED
      # FOR, by Revit's own name, with how many of `elements` are in it - one
      # asked for and empty is there at 0, because the absence is the finding
      # (no dampers in the model, or a category left out). About the answer,
      # never an element (D-52).
      role: accounting
      type: IDictionary<string, int>
    - name: found
      # VERSION 4, from both merged cards: how many are in `elements`.
      role: result
      type: int
    - name: resolvedTo
      # VERSION 4, from SELECT_BY_CATEGORY_NAME. Which categories the words
      # were read as, by Revit's own names, comma separated - the guard
      # against a word binding to a different category than the one meant.
      # A statement about the LOOKUP, filled in whether anything was found
      # or not (D-52).
      role: accounting
      type: string

# What somebody might actually type. These are what the exact-match short
# circuit runs on - nobody asks for "all elements of one category in the active
# document", they ask for ducts. Revit's own tokens belong here too: they are
# what a modeller pastes in, and they are exactly what a meaning-based search
# handles worst.
#   "find all elements of a category"    -> here
#   "how many MEP spaces are in the model" -> here, category Spaces (5b-355)
#   "how many rooms are there"           -> here, category Rooms (5b-401)
#   "list the rooms"                     -> here, category Rooms (5b-426)
#   "show me all the rooms"              -> here, category Rooms (5b-426)
#   "show me all the walls"              -> here, category Walls (5b-426)
#   "list the walls on level 2"          -> here, category Walls, that level
#                                           (5b-468)
#   "how many walls are on each level"   -> here, category Walls, then a level
#                                           read and a count (5b-468)
#   "which level are these walls on"     -> READ_ELEMENT_PARAMETERS, Level -
#                                           walls already chosen (5b-468)
#   "find all the VCDs"                 -> SELECT_BY_FAMILY, when the FAMILY
#                                           name is what is known and the
#                                           category is not
#   "all the ductwork"                   -> here, with `categories` (version
#                                           4). Ducts, fittings, accessories,
#                                           flex and insulation are five
#                                           categories and one answer
#   "everything in duct accessories"     -> here, category Duct Accessories -
#                                           the words are the input
#   "select all the pipes in this view"  -> here, category Pipes, inViewOnly
#                                           that view
#   "what is visible in this view"       -> SELECT_VISIBLE_IN_VIEW, which is
#                                           about visibility rather than
#                                           category
#   "these are in the wrong category"    -> CHECK_CATEGORY_MISMATCH
#   "which categories are there"         -> LIST_CATEGORIES - the names a
#                                           word that was refused here can be
#                                           checked against

# VERSION 4 (2026-11-01) - SELECT_BY_CATEGORY_NAME AND SELECT_BY_CATEGORIES
# WERE MERGED INTO THIS CARD on the owner's instruction in conversation: "now
# merge the other duplicates also", every conflict to keep the SAFER rule.
# Both are DEPRECATED. The same job - which elements of a category, or of
# several, in the model or in one view, optionally on one level, links counted
# and never selected - and this card is the one eleven methods, the loads'
# Finalize and the companion already call. Where each retired output is now:
#
#   SELECT_BY_CATEGORY_NAME             here
#     categoryName                      category (or categories) - the binder
#                                       reads the name Revit shows first,
#                                       localised, as that card did
#     inViewOnly                        inViewOnly
#     elements, found                   elements, found
#     resolvedTo                        resolvedTo
#     nearMisses                        NOT CARRIED - a word that is no
#                                       category is refused by the binder
#                                       before this runs, in the binder's own
#                                       words, which carry no near misses.
#                                       LIST_CATEGORIES lists the names
#     linksSearched, linkedMatches      the same, through a view on 2023+
#
#   SELECT_BY_CATEGORIES                here
#     categories                        categories, the same type
#     inViewOnly                        inViewOnly
#     elements, perCategory, found      the same
#     linksSearched, linkedMatches      the same, each link's breakdown too
#
# THE SAFER RULE WHERE THEY DIFFERED. SELECT_BY_CATEGORY_NAME answered an
# unknown name with an empty set and near misses; SELECT_BY_CATEGORIES
# answered an empty list with an empty set. Here nothing runs for either: the
# binder refuses a word that is no category, and this refuses no category
# named - no zero that reads as "there are none".
#
# ROUTING - repeated in SELECT_BY_MEP_SYSTEM, SELECT_OPENINGS,
# SET_CATEGORY_GRAPHICS, DESCRIBE_ELEMENTS and LIST_CATEGORIES.


    load-family, place-family-instances with this phase's own values - run inside a transaction,
    and Revit reported the transaction group ROLLED BACK afterwards. returned category BuiltInCategory,
    elements 3 item(s) [FamilyInstance, FamilyInstance, FamilyInstance], hostLevelName Level
    1, includeLinks false, levelOf Func`2, levelParameterOrder 5 item(s) [FAMILY_LEVEL_PARAM,
    SCHEDULE_LEVEL_PARAM, LEVEL_PARAM, ...], linkBlocked , linkDocs 0 item(s), linkPlacements
    0 item(s), linkTypes 0 item(s), linkedMatches 1 item(s) [Host model only - links not read],
    linkedTotal 0, linksSearched 0, matching 3 item(s) [FamilyInstance, FamilyInstance, FamilyInstance],

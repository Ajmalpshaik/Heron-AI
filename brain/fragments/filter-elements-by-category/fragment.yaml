# The five standard fields (docs/29). `heron-status` IS this fragment's
# lifecycle state - there is no second `status` key, because one fact wants
# one home and this repository has been bitten by the alternative.
heron-agent: HERON-REVIT-CMP-021
heron-step: 7
heron-status: PROVEN
heron-since: 0.1.0
heron-layer: brain

# What this fragment IS. The folder name is where it happens to sit today -
# rename it and nothing downstream notices. docs/09 section 4.
id: FRG-ELE-001
semantic-identity: "all elements of one category in the active document"
kind: filter
domain: revit.elements
capability: FILTER_ELEMENTS_BY_CATEGORY
# VERSION 3 (2026-10-06, FRAGMENT-ISSUES 5b-335): a level parameter that holds
# no level is passed over and the next one asked, where version 2 answered
# with the first one an element HAD. Three work plane-based diffusers with
# FAMILY_LEVEL_PARAM empty and SCHEDULE_LEVEL_PARAM on Level 1 were on no
# level ("matching 3", "elements 0"), so the loads' Finalize gave them no flow.
version: 3
source: OFFICIAL
risk: READ

purpose: >
  Answers "which elements" for a single Revit category, in the active document,
  excluding types, optionally scoped to one level. It is the filter half of
  every "select the X" and "how many X" job, which is exactly why it is a
  fragment and not part of either: two questions sharing one filter is D-29's
  design working.

  Pass ElementId.InvalidElementId as levelId for the whole model.

  Reports unresolvedLevel - how many elements had NO level found at all - so a
  broken level lookup reads as "12 found, 12 with no level" instead of as a
  plausible zero. Silently dropping them is what makes that failure invisible.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, every loaded link is read too and
  `linksSearched` says how many were: set and 0 means "you asked, and none
  are loaded", which is a different answer from host-only. Each link is asked for the category, and
  for the level by the host level's NAME - a link's levels are its own -
  and its matches are counted per link in `linkedMatches`.
  **NOTHING FROM A LINK IS EVER SELECTED OR CARRIED** - `elements` stays this model's own; the chain
  revives ids against this model, and a linked id that happens to be in
  use here binds an unrelated element (FRAGMENT-ISSUES row 75). Links
  nested inside a link are not read, and are counted in the answer. This
  is version 3 - version 2 read the links - and version 1's proof no longer
  describes the code; version 3's does.

contract:
  needs:
    - name: doc
      type: Document
    - name: category
      type: BuiltInCategory
      source: request
    - name: levelId
      type: ElementId
      source: request
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: unresolvedLevel
      # How many had NO level found at all, so a broken level lookup reads as
      # "12 found, 12 with no level" instead of as a plausible zero. The
      # pattern SELECT_BY_PHASE names as the reason it counts the same way
      # (D-52).
      role: accounting
      type: int

# An explicit list, never a range. ">=2020" would claim 2028 and every release
# after it, which is exactly what D-05 forbids - an unlisted release is an
# error, never a guess.
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then one line per link. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75).
      role: accounting
      type: IList<string>
proof:

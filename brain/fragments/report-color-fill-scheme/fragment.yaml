id: FRG-VIEW-136
semantic-identity: "which Color Scheme a view shows, what it colours by and in which colours, and whether its Color Fill Legend is there"
kind: filter
domain: revit.views
capability: REPORT_COLOR_FILL_SCHEME
version: 1
source: OFFICIAL
risk: READ

# WHY THIS IS A NEW CARD AND NOT A WIDENING (2026-10-13). The owner's rule is
#   to widen what already touches the job, and APPLY_COLOR_FILL_SCHEME was
#   widened for every verb that CHANGES a scheme. Reading is the one verb a
#   MODIFY card cannot carry: revit_read refuses anything above ANALYZE, so a
#   question asked of a writer needs the Changes switch and lands in the undo
#   list. The library pairs every writer with its read the same way -
#   SET_CATEGORY_GRAPHICS with REPORT_CATEGORY_OVERRIDES, APPLY_VIEW_FILTER with
#   REPORT_VIEW_FILTERS. No read of a view's colour scheme existed: asked
#   "which colour scheme does this view use and what colours are in it",
#   heron_lookup answered COLOR_BY_PARAMETER, a write.
# THE CHECK LIVES HERE TOO, because every check is a reading: a coloured plan
#   with no legend, a legend with no scheme, two rows in one colour or nearly
#   (within 24 across the three channels), values the view shows with no row,
#   elements with no value, rows nothing uses, rows switched to hidden, and a
#   view template that holds the scheme - so a change goes to the template.
# REVIT 2020 AND 2021. The 2020 API has no colour scheme type and no view call
#   that reads one, and 2021's is a different shape with no legend (read off
#   the reference assemblies, see APPLY_COLOR_FILL_SCHEME's compatibility-note).
#   Those releases report what they can see - the legends each view owns, the
#   schemes the model holds by name, and the view's own property when Revit
#   exposes one holding a scheme - and say the rest is not readable there.
purpose: >
  Answers which Color Scheme each view shows - for Rooms, Spaces, HVAC Zones,
  Areas, Ducts or Pipes - what it colours by, every row's value and RGB, and
  the Color Fill Legends the view carries. Then checks it: a filled plan with
  no legend, two rows that look alike, values the view shows with no row, rows
  nothing uses, a view template that holds the scheme.

  Reads only. It opens no transaction and changes nothing.

contract:
  needs:
    - name: doc
      type: Document
    # One view or several, separated by commas, or a view template.
    - name: views
      type: IList<View>
      source: request
  provides:
    - name: schemes
      # One line per view and category with a scheme set: the scheme, what it
      # colours by, its rows and its legends. A view with none adds nothing.
      role: result
      type: IList<string>
    - name: legends
      # The colour fill legends the views own, every category.
      role: result
      type: int
    - name: report
      # Everything - every row with its colour, every check - in one string
      # the reply cannot truncate. Prose, so accounting (D-52).
      role: accounting
      type: string
    - name: findings
      # The checks that found something. Questions for a person about the
      # drawing, never a count of what was read (D-52).
      role: accounting
      type: IList<string>
    - name: refused
      role: accounting
      type: string


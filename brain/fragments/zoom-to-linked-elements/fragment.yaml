compatibility-note: >
  One implementation for every release. `RevitLinkInstance`, `GetLinkDocument`,
  `GetTotalTransform`, `UIDocument.GetOpenUIViews`, `UIView.ZoomAndCenterRectangle`
  and `Reference.CreateLinkReference` are present 2020 to 2027.
  `Selection.SetReferences` is 2023 to 2027 only (tools/api-surface, read
  2026-10-17), so it is found by reflection when it is wanted and its absence is
  a finding, not a compile error - no version `#if` (D-05).

# ROUTING - repeated in ZOOM_TO_ELEMENTS and SELECT_FROM_LINK.
#
#   "zoom to the beams in the
#    structural link"                    -> here
#   "take me to the ducts in the MEP
#    link"                               -> here
#   "zoom to these" / "where is it"      -> ZOOM_TO_ELEMENTS, when they are the
#                                           HOST model's own elements. Its Show
#                                           cannot reach inside a link
#   "how many beams are in the
#    structural link"                    -> SELECT_FROM_LINK. That one READS
#                                           and moves nothing on screen
#   "copy those grids into ours"         -> COPY_FROM_LINK

utterances:
  - zoom to the beams in the structural link
  - take me to the ducts in the mep link
  - show me the linked elements on screen
  - zoom to the elements inside the linked model
  - select and zoom to the walls in the architectural link
  # MOVED HERE 2026-10-17 from SELECT_FROM_LINK, which reads the elements and
  # selects nothing - this is the one that puts them in the selection
  # (FRAGMENT-ISSUES 5b-500).
  - select elements inside a linked model

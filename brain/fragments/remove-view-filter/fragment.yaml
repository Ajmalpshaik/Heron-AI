revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `View.RemoveFilter`, `View.GetFilters`,
  `View.IsFilterApplied` and `Document.Delete` are unchanged 2020 through 2027 -
  read off the reference assemblies at both ends. `GetOrderedFilters` is NOT
  used: it arrives at 2024 and naming it would break the 2020 build for an
  ordering this does not need.

# ROUTING - repeated in APPLY_VIEW_FILTER, REPORT_VIEW_FILTERS and
# CREATE_VIEW_FILTERS_BY_VALUE.
#
#   "take that filter off the view"      -> here
#   "remove the filters from this plan"  -> here
#   "delete this filter from the project" -> here, with the delete flag - and it
#                                           says how many other views use it
#                                           first
#   "put that filter on this view"       -> APPLY_VIEW_FILTER - the other end
#   "what filters are on this view"      -> REPORT_VIEW_FILTERS - a READ, and
#                                           the one to run BEFORE deleting
#                                           anything

utterances:
  - take that filter off the view
  - remove the filters from this plan
  - delete this filter from the project
  - clear the filters off this view
  - get rid of that filter

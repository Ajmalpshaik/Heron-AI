id: FRG-SEL-035
semantic-identity: "find the dimensions that measure under, over or between these values"
kind: filter
domain: revit.selection
capability: SELECT_DIMENSIONS_BY_VALUE
version: 1
source: OFFICIAL
risk: READ

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# IT HANDS `elements` ON rather than painting anything: OVERRIDE_GRAPHICS_IN_VIEW
# colours them, ISOLATE_ELEMENTS shows them alone, SET_SELECTION selects them.
#
# THE VALUE IS REVIT'S MEASURED VALUE, not its text. A string of segments is
# in range when ANY segment is. An overridden text ("EQ") does not change what
# a dimension measures.
#
# ONLY LINEAR DIMENSIONS; angular and radial are counted apart.
#
# RANGE: minMm 0 is no lower limit, maxMm 0 no upper limit; both 0 refuses.
#
# READ ONLY - opens no transaction.
purpose: >
  Finds the linear dimensions whose measured value is under, over or between
  given millimetre values, in one view or every view, and hands them on - to
  colour, isolate or select.

contract:
  needs:
    - name: doc
      type: Document
    # One view by its Project Browser name; an EMPTY value reads every view.
    # Where a plan and a ceiling plan share a name, write the kind first:
    # "FloorPlan: Level 1". A name that still answers to two views is refused.
    - name: viewName
      type: string
      source: request
    # 0 means no lower limit.
    - name: minMm
      type: double
      source: request
    # 0 means no upper limit.
    - name: maxMm
      type: double
      source: request
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: matched
      role: result
      type: int
    - name: outside
      # Linear dimensions read and found outside the range (D-52).
      role: accounting
      type: int
    - name: notLinear
      # Angular and radial dimensions, left out (D-52).
      role: accounting
      type: int
    - name: findings
      type: IList<string>

proof:
  date: '2026-10-18'
  by: Ajmal PS
  model: Project2 (3,027 elements), Revit 2020, session 13520
  positive_case: 'run as it would normally be run. returned MmPerFoot 304.8, elements 1 item(s)
    [Diagonal - 2.5mm Arial], findings 1 item(s) [1 linear dimension(s) measure at most 20000
    mm in "Level 1";...], high 65.6167979002625, low -Infinity, matched 1, maxMm 20000, minMm
    0, notLinear 0, outside 0, view ViewPlan, viewProblem (null), wantedView FloorPlan: Level
    1. inputs came viewName as given; minMm as given; maxMm as given. on Project2'
  negative_case: 'run with categoryName=Text Notes, inViewOnly=FloorPlan: Level 1, maxMm=60000,
    minMm=50000, viewName=FloorPlan: Level 1 instead - chosen because it should not contain
    what this fragment reports. returned MmPerFoot 304.8, elements 0 item(s), findings 1 item(s)
    [0 linear dimension(s) measure between 50000 and 60000 mm in ...], high 196.850393700787,
    low 164.041994750656, matched 0, maxMm 60000, minMm 50000, notLinear 0, outside 1, view
    ViewPlan, viewProblem (null), wantedView FloorPlan: Level 1. inputs came viewName as given;
    minMm as given; maxMm as given. on Project2'
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: 58733b5430abd228

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. Dimension.DimensionShape, Value,
  NumberOfSegments and Segments, DimensionSegment.Value and DimensionShape
  .Linear are present 2020 through 2027 - read off RevitAPI.xml in the
  Nice3point reference packages for all eight releases on 2026-10-12. Values
  are compared in feet, millimetres divided by 304.8 (D-20).

# ROUTING - the same rows are in the fragments named here.
#
#   "show me every dimension under 1 m in red" -> here, then OVERRIDE_GRAPHICS_IN_VIEW
#   "which dimensions are less than 500"       -> here
#   "list the dimensions in this view with their values and references" -> REPORT_SPOT_DIMENSIONS
#   "dimension these rooms"                    -> DIMENSION_ROOMS
#   "ducts 500 mm high"                        -> SELECT_BY_NUMERIC_PARAMETER

utterances:
  - find every dimension under 1000 mm
  - which dimensions are less than 500 in this view
  - select the dimensions over 5 m
  - pick out the dimensions between 1 and 2 metres
  - which dimensions are less than 500

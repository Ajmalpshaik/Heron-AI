tests: tests/

compatibility-note: >
  One implementation for every release. The family behind an instance is
  reached through its symbol, and a system family through the element's type
  name - both unchanged 2020 to 2027. Categories are compared as ElementId
  against ElementId rather than as numbers, which is what survives the id going
  64-bit.

# ROUTING - the same rows are in the fragments named here.
#
#   "find all the VCDs"                  -> here, when VCD is the FAMILY name
#   "where are all the fire dampers"     -> here
#   "everything of the same type as      -> FILTER_ELEMENTS_BY_TYPE, which
#    this one"                              takes an example element. This one
#                                           takes a name and needs no example
#   "all the ducts"                      -> FILTER_ELEMENTS_BY_CATEGORY, when
#                                           the CATEGORY is what is meant
#   "which families are not used"        -> FIND_UNUSED_FAMILIES
#   "these are in the wrong category"    -> CHECK_CATEGORY_MISMATCH
#   "load this family"                   -> LOAD_FAMILY
#   "rename this family"                 -> RENAME_FAMILY

utterances:
  - find all the VCDs
  - select everything from this family
  - where are all the fire dampers
  - find the family by name
  - which elements use this family

id: FRG-SEL-022
semantic-identity: "find everything of this family, wherever it is"
kind: filter
domain: revit.selection
capability: SELECT_BY_FAMILY
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Finds every element belonging to a named family, by the FAMILY name rather
  than by a type or an example element. The *"where are all the VCDs"* question,
  asked when the family name is known and the category is not.

  **THE CATEGORY IS OFTEN THE THING NOBODY KNOWS.** A dampers family can be
  loaded as duct accessories on one job and mechanical equipment on another,
  and a family whose name says what it is can sit anywhere. Naming the category
  first is what makes that search come back empty and look like the family is
  not in the model. So the category list is optional here, and an empty one
  means the whole model.

  **AN UNBOUNDED SCAN IS REPORTED AS ONE.** Walking every element in a
  document is fine for one lookup and expensive to do repeatedly, so
  `scannedWholeModel` says which kind of search ran. Where the category IS
  known, passing it is cheaper and narrower.

  **SYSTEM FAMILIES COUNT TOO.** A wall, a duct or a pipe belongs to a system
  family - *Basic Wall*, *Rectangular Duct* - and asking for those by name is
  the same question. Both routes are read: the loadable family through the
  instance's own symbol, the system family through the element's type.

  **MATCHING IS BY CONTAINED TEXT UNLESS EXACT IS ASKED FOR.** Family names on
  a real job carry prefixes and revision suffixes, so a contains match is what
  finds them; exact is there for when two families differ by a suffix and only
  one is wanted. Which families actually matched is reported with a count each,
  so a search that caught more than it meant to says so.

  ASSUMES NOTHING ABOUT TRANSACTIONS - it opens none and needs none.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, every loaded link is read too and
  `linksSearched` says how many were: set and 0 means "you asked, and none
  are loaded", which is a different answer from host-only. The same family match runs in each link and its
  matches are counted per link, with the families hit, in `linkedMatches`.
  **NOTHING FROM A LINK IS EVER SELECTED OR CARRIED** - `elements` stays this model's own; the chain
  revives ids against this model, and a linked id that happens to be in
  use here binds an unrelated element (FRAGMENT-ISSUES row 75). Links
  nested inside a link are not read, and are counted in the answer. This
  is version 2; version 1's proof no longer describes the code, and the
  fragment is DRAFT until it is proved again.

contract:
  needs:
    - name: doc
      type: Document
    - name: familyName
      type: string
      source: request
    - name: exactMatch
      type: bool
      source: request
    # Empty means the whole model - see the purpose.
    - name: categories
      type: IList<BuiltInCategory>
      source: request
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: matchedFamilies
      role: result
      type: IDictionary<string, int>
    - name: scannedWholeModel
      # Whether the sweep was bounded by category or walked the whole
      # document. *AN UNBOUNDED SCAN IS REPORTED AS ONE* - how it ran, never
      # what it found.
      role: accounting
      type: bool
    - name: found
      role: result
      type: int
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then one line per link. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75).
      role: accounting
      type: IList<string>


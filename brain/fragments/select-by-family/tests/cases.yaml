# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: a model with a VCD family loaded as duct accessories, no categories given
    expect: >
      every VCD instance found, `scannedWholeModel` true, and the family named
      in `matchedFamilies` with its count. Compare against a schedule of that
      family - the counts must agree

  - given: the same search with the duct accessory category passed in
    expect: >
      the same elements, `scannedWholeModel` false. Narrower and cheaper when
      the category is known

  - given: a system family name such as Basic Wall
    expect: >
      the walls of that family found. A loadable-family-only search misses
      every wall, duct and pipe, which are exactly what people ask for by name

  - given: exactMatch true on a family whose name has a revision suffix
    expect: >
      only the exact name matching, and the suffixed one absent

  # D-59, added 2026-09-28 with version 2. NOT RUN.
  - given: >
      familyName "Door", includeLinks true, on
      Snowdon-scratch_ajmal.al
    expect: >
      `elements` and `matchedFamilies` unchanged, and each
      link's count with the families it hit in `linkedMatches`

negative:
  - given: a family loaded under a category nobody expected
    expect: >
      it still found, because the category was not named first. That is the
      whole reason the category is optional - naming it is what makes a real
      search come back empty

  - given: a contains match that catches two families
    expect: >
      BOTH named in `matchedFamilies` with counts. A single number would hide
      that the search caught more than was meant

  - given: an empty family name
    expect: >
      nothing matched and no elements. An empty name matching everything would
      hand back the whole model as a result

  - given: a name that exists in no family
    expect: >
      empty results and `found` = 0 - not an error. The honest answer to a
      search that found nothing

  # D-59, added 2026-09-28 with version 2. NONE OF THESE HAS BEEN RUN.
  - given: includeLinks ABSENT, on a model that HAS loaded links
    expect: >
      the same answer as version 1's proof, and linksSearched 0 with the first
      line of linkedMatches reading "Host model only - links not read". The
      switch left out must bind false, not refuse - if the run refuses with
      needs_request_values, the add-in in Revit is older than this change

  - given: includeLinks true on a model with NO links, or with every link unloaded
    expect: >
      linksSearched 0 and "Links asked for, NONE loaded - host only". It must
      NOT read like the absent case: one means there was nothing else to read,
      the other means reload them in Manage Links and ask again

  - given: one linked file placed TWICE, with includeLinks true
    expect: >
      linksSearched 1, not 2 - it counts files, not placements

second_route:
  - >
    build a Revit schedule filtered on Family, or use Select All Instances on
    one of them, and compare the count. Revit's own selection is the second
    route

# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: 4 air terminals, offset 3 m sideways
    expect: >
      4 ids in `copies`, notCopied 0, and 8 terminals in the model. Check the
      copies are 3 m away and not on top of the originals - an offset that
      silently came through as zero looks like a successful copy until somebody
      tries to select one

  - given: a duct AND its fitting, copied together in one call
    expect: >
      the copies are still CONNECTED to each other. This is why the fragment
      takes a list rather than looping: copied one at a time they arrive
      unjoined, and that is invisible until somebody traces the system

  - given: >
      version 2 - one slab and four walls on Level 1, toLevels "Level 2, Level 3",
      turnDegrees 5, turnCentreMm "0, 0", offset 0,0,0
    expect: >
      ten copies; copiedTo says 5 of 5 belong to Level 2 and 5 of 5 to Level 3
      at their originals' offsets, and the four wall points sit where a turn of
      5 deg (Level 2) and 10 deg (Level 3) puts them. Read back from outside
      too: the walls' Base Constraint is Level 2 and Level 3, not Level 1 with
      an offset of a storey

  - given: version 2 with toLevels, turnDegrees and turnCentreMm all blank
    expect: >
      exactly version 1 - one copy at the offset, copiedTo empty, refused empty

  - given: >
      version 3, a NEW project made workshared with two user worksets, A and B
      (A active) - four generic model instances on B, toWorkset "source",
      offset 3 m sideways
    expect: >
      four copies; onWorksets reads back "B 4" and "4 of 4 copies whose workset
      can be set are on the workset asked for". Read back from outside too: the
      copies' Workset property says B in the Properties palette, though A is
      the active workset

  - given: >
      version 3, the same project - two instances on A and two on B, one call,
      toWorkset "source"
    expect: >
      each copy on its own original's workset - "A 2, B 2" read back - and the
      two on A are the copies of the two on A, found by their place in plan

  - given: version 3, four instances on A with A active, toWorkset "B"
    expect: >
      every copy on B - onWorksets reads back "B 4", says the copy was made
      with B active, and A is the active workset again after the call

  - given: version 3, toWorkset left out, in the workshared project
    expect: >
      exactly version 2 - the copies on the active workset A, onWorksets empty,
      refused empty; the binding note says toWorkset not given - "active"

negative:
  - given: an empty element list
    expect: >
      `copies` EMPTY and notCopied 0, reported as nothing to do rather than as
      a successful copy of nothing

  - given: an element Revit refuses to duplicate
    expect: >
      it is missing from `copies` and counted in `notCopied`. The two lists must
      not be assumed to line up - a caller pairing originals with copies by
      index would pair the wrong ones from that point on

  - given: version 2 - toLevels names a level the model does not have
    expect: >
      `copies` EMPTY, refused names the unknown level and lists the model's
      own, and ends "Nothing was copied" - the element count is unchanged

  - given: version 2 - a turn given with toLevels blank
    expect: refused, nothing copied - a turn is never silently ignored

  - given: >
      version 3 - toWorkset "source" in a project that is NOT workshared (a new
      project from the default template, never made workshared)
    expect: >
      `copies` EMPTY, onWorksets empty, refused says the model is not
      workshared and ends "Nothing was copied" - the element count is
      unchanged. The same call with toWorkset left out copies as version 2

  - given: version 3 - toWorkset names a workset the workshared model does not have
    expect: >
      `copies` EMPTY, refused names the workset asked for and lists the model's
      user worksets, and ends "Nothing was copied"

  - given: version 3 - toWorkset names a workset that is CLOSED in this session
    expect: refused, nothing copied, and the active workset unchanged

second_route:
  - a count of that category before and after, differing by exactly the number copied
  - version 3 - select the copies and read each one's Workset in the Properties palette, or
    View > Visibility/Graphics > Worksets with one workset hidden at a time
  - one Ctrl+Z removes every copy in a single step (Golden Rule 16)

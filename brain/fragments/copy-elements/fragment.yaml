compatibility-note: >
  One implementation for every release. `ElementTransformUtils.CopyElements`
  returning an `ICollection<ElementId>` is unchanged 2020 to 2027, and the
  offset arrives in internal feet with no units call. Version 2 adds the
  plan-to-plan `CopyElements` overload, `ViewPlan.Create` for a level with no
  floor plan, `MoveElements`, `RotateElements` and level and offset
  parameters by their built-in names, all present on every release from 2020;
  the turn centre is millimetres to feet by arithmetic (D-20). Compiled 2020
  to 2027; run on Revit 2020 only (2026-10-14, Project2, 5b-460).

# WHY VERSION 2 COPIES PLAN TO PLAN - measured 2026-10-14 on Revit 2020 in a
# scratch Project2, every probe rolled back (FRAGMENT-ISSUES 5b-460):
#   - copied by a +4000 mm vector, four walls stayed at 0..4000 on Level 1 and
#     only the slab rose; the first version of this code then re-levelled them
#     in place, which read back as "offsets DIFFER";
#   - a curtain wall moved onto Level 2 by its Base Constraint keeps its six
#     panels on Level 1 (read-only) - a type swap to refresh them made eleven;
#   - plan to plan, as Paste Aligned > Selected Levels does it, the walls came
#     out on Level 3 + 0 with their top tie moved from Level 2 to Level 4, the
#     slab on Level 3 + 0 and all six panels on Level 3 - with walls and floors
#     hidden in the source plan, and into a plan made for the copy and deleted
#     after it;
#   - a copy made on top of its original joins to it and Revit refused to keep
#     the join once the copy was turned ("Can't keep elements joined"), so the
#     copy is made a kilometre aside and brought back.


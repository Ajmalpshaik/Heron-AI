id: FRG-GEO-005
semantic-identity: "duplicate these elements at an offset, and hand back the copies"
kind: action
domain: revit.geometry
capability: COPY_ELEMENTS
# Version 2 (2026-10-13, FRAGMENT-ISSUES 5b-460): copies onto a LIST OF LEVELS
# as well - Revit's Paste Aligned > Selected Levels - each copy belonging to its
# level, with an optional turn per level about a plan point. Version 1 copied by
# one offset and nothing else. The name stays, so every caller finds it; with
# the three new values blank it runs version 1's code unchanged. The new values
# are strings because only an optional bool may be left out, and a blank string
# is how "not asked" is typed (HeronBindingNote.AbsentValue).
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Duplicates every element at one offset and hands back the NEW elements, so
  the next step can act on the copies alone - select just them, set a parameter
  on just them, move just them.

  OR ONTO LEVELS - Paste Aligned to Selected Levels. Name the levels in
  toLevels, comma separated, or a run of them as "Level 2..Roof", and every
  element is copied onto each one, standing over the original in plan. Each
  copy BELONGS to its level: a wall's base constraint, a floor's or a
  ceiling's level, a roof's base level, a duct's or a pipe's reference level, a
  family's level is set to it, and the offset is the original's. Walls keep
  their type and height - one tied to the level above is tied to the level
  above its new base, or left unconnected at the same height on the top storey.
  Floors keep their type and outline.

  TURNED, WHEN ASKED: turnDegrees turns each level's copy that much more than
  the one before, anticlockwise in plan, about turnCentreMm - a plan point in
  millimetres, or the middle of what is copied when blank. A twisting tower is
  one storey drawn, then one call.

  Unlike moving and rotating, this one is self-evidencing: Revit returns the
  ids it created, and a copy that did not happen is a copy that is not in that
  list. Onto levels it also reads every copy back - its level, that it did not
  move up or down when it took it, its offset against the original's, and its
  plan point against where the turn puts it - and one copy that fails takes the
  whole call back. A level name the model does not have is refused before
  anything is copied, naming the levels it does have.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: offset
      # MILLIMETRES, three numbers. Onto levels it must be 0,0,0 - each copy
      # stands over its original - and anything else is refused.
      type: XYZ
      source: request
    - name: toLevels
      # Version 2. Level names, comma separated, as Revit spells them - case
      # and extra spaces forgiven - or "A..B" for every level from A to B by
      # height. BLANK COPIES BY THE OFFSET, as version 1. The order given is the
      # order of the turn. A name the model does not have refuses the call.
      type: string
      source: request
    - name: turnDegrees
      # Version 2. Degrees each level's copy turns more than the one before,
      # anticlockwise in plan; negative turns clockwise. Blank or 0 is no turn.
      # Given without toLevels it is refused rather than ignored.
      type: string
      source: request
    - name: turnCentreMm
      # Version 2. The plan point the copies turn about, "x, y" in MILLIMETRES.
      # Blank is the middle of the originals' box in plan.
      type: string
      source: request
  provides:
    - name: copies
      role: result
      type: IList<ElementId>
    - name: notCopied
      # Elements Revit returned no copy for. The evidence it looked and could
      # not, never a thing it did (D-52).
      role: accounting
      type: int
    - name: copiedTo
      # Version 2, onto levels: one line per level - how many were copied, how
      # many read back as belonging to it at their originals' offsets, how many
      # plan points sit where the turn puts them. ONE string because a list
      # reaches the reply cut to three lines. Empty when copying by the offset.
      role: result
      type: string
    - name: refused
      # Why it declined, in the modeller's words, ending "Nothing was copied".
      # Evidence it looked and said no, never a thing it did (D-52).
      role: accounting
      type: string

proof:
  date: '2026-09-13'
  by: Ajmal PS
  model: test projject (3,509 elements), Revit 2024, session 40932
  positive_case: run as it would normally be run - the arrangement was re-made first by running
    select-by-category-name, set-selection with this phase's own values - run inside a transaction,
    and Revit reported the transaction group ROLLED BACK afterwards. returned copies 19 item(s)
    [926379, 926380, 926381, ...], notCopied 0, source 19 item(s) [925629, 925630, 925631,
    ...]. inputs came elements from the selection (19); offset as given. on test projject
  negative_case: "CANNOT COME BACK EMPTY, so proved by TRACKING instead (D-53). copy-elements\
    \ describes whatever it is given, so no arrangement makes its answer empty. What D-30's\
    \ negative case exists to catch - a fragment that succeeds while doing nothing, or answers\
    \ about a set it was not given - is caught here by the answer following the input exactly\
    \ across 4 different inputs:\n\n      selection \"Ducts in {3D}\" (6), offset 5000,0,0\
    \ -> copies 6\n      selection \"Walls in {3D}\" (19), offset 5000,0,0 -> copies 19\n\
    \      selection \"Pipes in {3D}\" (2), offset 5000,0,0 -> copies 2\n      selection \"\
    Ducts in {3D}\" (6), offset 0,0,0 - the OFFSET changed, the count did not -> copies 6\n\
    \n    Different inputs, exact matches every time. A fragment falling back to the active\
    \ view, the whole model, or a previous run could not do that."
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: b119e7eb2130792c

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `ElementTransformUtils.CopyElements`
  returning an `ICollection<ElementId>` is unchanged 2020 to 2027, and the
  offset arrives in internal feet with no units call. Version 2 adds
  `RotateElements` and level and offset parameters by their built-in names,
  all present on every release from 2020; the turn centre is millimetres to
  feet by arithmetic (D-20). Compiled 2020 to 2027; run on Revit 2020 only.


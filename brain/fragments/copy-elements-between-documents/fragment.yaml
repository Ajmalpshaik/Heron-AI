id: FRG-ELE-098
semantic-identity: "copy these elements from the other open file into this one - family to family, project to project - or the labels of a seed tag or title block family, view to view"
kind: action
domain: revit.elements
capability: COPY_ELEMENTS_BETWEEN_DOCUMENTS
# VERSION 2 (2026-11-01): COPY_FROM_LINK was merged into this card on the
# owner's instruction - "make sure there is no duplicate tools" - and is
# DEPRECATED; see the merge block above `utterances`. Version 1's proof below
# is kept as the record; it no longer describes the code, so the card is DRAFT
# until version 2 is proved on a real model (D-30).
#
# VERSION 2, THE DETAIL. With `fromLink` true, `sourceDocumentTitle` names a
# LINK in this model - part of its name as Manage Links shows it, or of its
# file's title - the ids are ids INSIDE the link, and the copies land where the
# link puts them: the placement's total transform, then the offset. One
# placement only: words matching two are refused with both named. A link not
# loaded is refused naming RELOAD_LINKS. The copies are ours and stop tracking
# the link, said in the answer. Without `fromLink` a LINKED document is never
# a source - version 1 could match one in Application.Documents and copy out of
# it with no transform - and words matching only a link are refused pointing
# at `fromLink`. Fewer arriving than were picked is said.
#
# VERSION 3 (2026-11-01): COPY_LABELS_FROM_FAMILY was merged into this card on
# the owner's instruction and is DEPRECATED - `labels` true copies a seed
# family's labels into the tag, annotation or title block family in front,
# view to view, same category only, each read back against its seed. See the
# merge block above `utterances`. DRAFT until version 3 is proved (D-30);
# version 2 was never proved either.
#
# VERSION 4 (2026-11-11, rows 5b-1123 and 5b-1516): the words must find ONE
# open document, never a guessed one. Versions 1 to 3 took the first open
# document whose title held the words and said nothing - measured 2026-10-18
# on Revit 2020 with thirteen open documents of one title, right there only
# because all were one file. Now the words take the document whose WHOLE
# title they are when there is one ("Project1" beside "Project10"), otherwise
# the one whose title holds them; when more than one is left, nothing is
# copied and each is named with its title and its path (or "not saved yet"),
# as a link placed twice is refused on the other route. The answer says what
# to do by what tells them apart: their titles (give the whole title), their
# paths alone (close the ones not meant), or nothing (close them in Revit).
#
# THE TITLE IS REVIT'S, AND IT DIFFERS BY RELEASE. RevitAPI.xml on
# Document.Title: 2022 to 2027 "not including the filename extension"; 2020
# and 2021 "Extension will be present, depending on user settings". So a
# project and a family saved under one name are titled alike on 2022 and
# later, and on 2020 and 2021 only where extensions are hidden - this card's
# 2020 proof record shows them hidden on the owner's PC. The refusal does not
# hang on it: two matches are refused whether or not their titles come out
# alike. Not yet seen in any Revit.
#
# The document in front and linked documents are not counted - neither is
# ever a source. Label mode finds its seed by the same lines, so it refuses
# the same way. COMPILED ON EVERY RELEASE, NOT RUN IN ANY REVIT (NEEDS-CHECKING
# Group DR, DR10a to DR10c). DRAFT as before: versions 2 and 3 were never
# proved either.
version: 4
source: OFFICIAL
risk: MODIFY

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# Copy to Clipboard in one window and Paste Aligned in the other, for model
# elements: from another document open in the same Revit into the one in
# front, either side a project or a family - the forms of one family into
# another, model elements from one project into this one. Picked by category
# name (or "all" model elements) or by id in the other document; an offset
# moves them on the way. View-specific elements are left and counted: Revit
# copies those view to view. Types and materials come along as Revit's own
# paste brings them.
#
# COPY_ELEMENTS copies within this model; this card copies out of a linked
# model too since version 2, with fromLink; the TRANSFER_*_BETWEEN_DOCUMENTS
# cards carry views, filters,
# materials, line and object styles and project parameters.
#
# READ BACK: every id Revit returns is looked up in this document.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Copies model elements from another open document - a project or a family -
  into the one in front, by category or by id, aligned or moved by an offset.

  **OR OUT OF A LINKED MODEL, WITH ITS TRANSFORM (version 2).** With `fromLink`
  the source is a link, and the copies land where the link puts them - and
  stop tracking it. Version 2 is DRAFT until proved.

  **OR A SEED FAMILY'S LABELS, VIEW TO VIEW (version 3).** View-specific
  elements stay out unless asked: with `labels` true, labels set up once in
  Edit Label in a seed family are copied into the tag, annotation or title
  block family in front - the route to a new label, which Revit's API cannot
  make. Same category only; the first lands at `placeAtMm`; each copy is read
  back against its seed, on Revit 2027 parameter by parameter.

contract:
  needs:
    - name: doc
      type: Document
    - name: app
      type: Application
    - name: sourceDocumentTitle
      type: string
      source: request
    # Category names, comma separated, or "all"; EMPTY when ids are given.
    - name: categories
      type: string
      source: request
    # Ids in the other document, comma separated; an EMPTY value is none.
    # With `labels` true, label ids in the SEED, as REPORT_FAMILY_LABELS lists
    # them on the seed; EMPTY or "all" is every label.
    - name: elementIds
      type: string
      source: request
    # "x,y,z" in millimetres; an EMPTY value keeps them aligned.
    - name: offsetMm
      type: string
      source: request
    # VERSION 2, from COPY_FROM_LINK: true when the source is a LINK in this
    # model - sourceDocumentTitle then names the link, the ids are ids in the
    # link, and the link's own transform places the copies. Left out it binds
    # false: another open document, never a link.
    - name: fromLink
      type: bool
      source: request
      optional: true
    # VERSION 3, from COPY_LABELS_FROM_FAMILY: true copies LABELS from a seed
    # family open in this Revit - sourceDocumentTitle names it - into the tag,
    # annotation or title block family in front, view to view, the same
    # category only. categories is then empty, "all" or "labels", offsetMm
    # empty and fromLink false. Left out it binds false: view-specific
    # elements stay out, version 2 exactly.
    - name: labels
      type: bool
      source: request
      optional: true
    # VERSION 3, label mode. Part of a label's text - or, on 2027, of a
    # parameter's name, sample, prefix or suffix - "Diameter"; several with
    # commas between. Left out, "all".
    - name: labelContains
      type: string
      source: request
      optional: true
      absent: all
    # VERSION 3, label mode. "x,y" in millimetres: where the first label
    # picked - the top left one - lands; the rest keep their spacing. Left
    # out, "keep": where they are in the seed.
    - name: placeAtMm
      type: string
      source: request
      optional: true
      absent: keep
  provides:
    - name: copied
      role: result
      type: int
    - name: copiedIds
      role: result
      type: IList<ElementId>
    - name: kept
      # VERSION 3, label mode: copies that read back showing exactly what their
      # seed shows. 0 outside label mode. A reading of what was copied, never a
      # thing found (D-52).
      role: accounting
      type: int
    - name: readBack
      # VERSION 3, label mode: one line per copy, joined by "  ||  ": its id,
      # its seed's id, where it landed, and what it shows - or DIFFERS with
      # both sides. Empty outside label mode.
      role: accounting
      type: string
    - name: report
      # ONE STRING: picked, arrived by category, view-specific left (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>


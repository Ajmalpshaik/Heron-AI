compatibility-note: >
  One implementation for every release. ElementTransformUtils.CopyElements(
  Document, ICollection<ElementId>, Document, Transform, CopyPasteOptions),
  Application.Documents, Element.OwnerViewId, Category.Parent and
  CategoryType are present 2020 through 2027 - read off RevitAPI.xml in the
  Nice3point reference packages for all eight releases on 2026-10-13.
  Version 3 adds COPY_LABELS_FROM_FAMILY's calls:
  ElementTransformUtils.CopyElements(View, ICollection<ElementId>, View,
  Transform, CopyPasteOptions), Family.FamilyCategory, Element.GetTypeId,
  View.ViewType, TextElement.Coord and Text, all eight releases (tools/api-
  surface --members, 2026-10-21); the parameter-by-parameter comparison reads
  AnnotationLabel under #if REVIT2027_OR_GREATER - 2020 to 2026 compare text
  and type only. Built on all eight releases on 2026-11-01.
  Version 4 adds Document.PathName, all eight releases (tools/api-surface
  --members, 2026-11-11); compiled for each on 2026-11-11. Document.Title is
  on all eight, but what it holds differs: with the file extension
  "depending on user settings" on 2020 and 2021, without it from 2022
  (RevitAPI.xml, each release). NOT RUN in any Revit.

# ROUTING - the same rows are in the fragments named here.
#
#   "copy the extrusions from the valve family into this one" -> here
#   "copy the furniture over from the other project"          -> here
#   "copy these walls 3 m to the east"                        -> COPY_ELEMENTS
#   "copy the ducts out of the linked model"                  -> here since
#                                         version 2, fromLink=true - it was
#                                         COPY_FROM_LINK's, merged in
#   "bring the grids in from the architect"                   -> here, fromLink
#   "what links are in this model"                            -> LIST_LINKED_MODELS
#   "reload the links"                                        -> RELOAD_LINKS -
#                                         and the copies made from a link do
#                                         NOT update when it does
#   "copy the diameter label from the seed pipe tag into this tag" -> here,
#                                         labels=true - COPY_LABELS_FROM_FAMILY
#                                         until 2026-11-01
#   "read the labels in this tag family"                      -> REPORT_FAMILY_LABELS
#   "move the diameter label up 2 mm"                         -> SET_FAMILY_LABEL_LAYOUT
#
# VERSION 2 (2026-11-01) - COPY_FROM_LINK WAS MERGED INTO THIS CARD on the
# owner's instruction in conversation: "make sure there is no duplicate
# tools", every conflict to keep the SAFER rule. It is DEPRECATED - DRAFT,
# never proved. The same CopyElements across documents; a link is one more
# kind of source document, with a transform. Where each retired input and
# output is now:
#
#   COPY_FROM_LINK                      here, fromLink=true
#     linkInstance                      sourceDocumentTitle, naming the link -
#                                       one placement, refused when two match
#     linkedElementIds                  elementIds, ids in the link - or
#                                       categories
#     the link's total transform        applied, then offsetMm
#     created                           copiedIds, read back; copied
#     findings                          findings - placed through the link's
#                                       transform, ours and not tracking it,
#                                       fewer arrived said, a link not loaded
#                                       refused naming RELOAD_LINKS
#
# THE SAFER RULE WHERE THEY DIFFERED. COPY_FROM_LINK copied whatever ids it
# was given; this card leaves view-specific elements and counts them - Revit
# copies those view to view - and that is kept. Version 1 here could copy out
# of a link's document by title with no transform; that is closed.
#
# VERSION 3 (2026-11-01) - COPY_LABELS_FROM_FAMILY WAS MERGED INTO THIS CARD,
# same instruction, and is DEPRECATED - DRAFT, never proved. Where each of its
# inputs and outputs is now:
#
#   COPY_LABELS_FROM_FAMILY             here, labels=true
#     sourceDocumentTitle               sourceDocumentTitle - the seed family,
#                                       open in this Revit, never a link
#     labelIds                          elementIds - label ids in the seed;
#                                       empty or "all" is every label
#     labelContains, placeAtMm          the same names, the same absent words
#     copied, copiedIds, kept,          the same names
#     readBack, report, findings
#
# THE DEFAULT STAYS: view-specific elements are left unless `labels` is said -
# a label is view-specific, and nothing else of a view's comes along. The
# category rule, the seed-by-seed read-back (2027 parameter by parameter) and
# the type-name clash named before the copy are that card's, moved whole.
# THE SAFER RULE WHERE THEY DIFFERED: that card skipped a label Revit refused,
# or one with no view of its kind here, and kept the rest; here such a call
# copies NOTHING - it throws and is rolled back, as every copy this card makes
# is all or nothing. A copy that DIFFERS from its seed is named, never counted
# kept - both cards' rule.


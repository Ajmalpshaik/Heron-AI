  - copy these out of the link
  - bring the grids in from the architect
  - take the elements out of the linked model
  - copy from the link into our model
  - i need a real copy of what is in the link
  # MOVED 2026-11-01 from COPY_LABELS_FROM_FAMILY, merged into this card.
  - copy the diameter label from the seed pipe tag into this tag family
  - add a label for bottom elevation from our seed tag family
  - copy the sheet number label from our seed title block

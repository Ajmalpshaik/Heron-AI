revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Room.IsPointInRoom`,
  `SpatialElement.Location`, `Level.ProjectElevation` and `Element.LevelId` are
  unchanged 2020 through 2027 - read off the reference assemblies at both ends.
  Rooms and spaces are told apart by CATEGORY rather than by type, because the
  wrapper imports the base namespace and the architecture and mechanical types
  are not both available as names.

# ROUTING - repeated in WRITE_ELEMENT_PARAMETERS, FILTER_ELEMENTS_IN_ROOM and
# READ_ELEMENT_LEVEL.
#
#   "put the room name on all the equipment" -> here - it WORKS OUT the value
#                                           per element
#   "fill in the location columns"       -> here
#   "which room is each device in"       -> here, and it writes the answer down
#   "set the mark on these"              -> WRITE_ELEMENT_PARAMETERS - one value
#                                           somebody supplies, on many elements
#   "which elements are in this room"    -> FILTER_ELEMENTS_IN_ROOM - the
#                                           question from the room's end
#   "what level is this on"              -> READ_ELEMENT_LEVEL - a READ that
#                                           writes nothing

utterances:
  - put the room name on all the equipment
  - fill in the location columns
  - which room is each device in
  - write the room and level onto these
  - fill in the space name for the asset register

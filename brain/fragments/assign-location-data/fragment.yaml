# VERSION 3 (2026-11-19, FRAGMENT-ISSUES 5b-1856) - from a real job stopped
# before anything was written: 118 duct accessories whose ID_Room Name and
# ID_Room Number were to be filled from the MEP space each sits in.
#   1. roomParameter takes the room's or space's NAME alone - its Name
#      parameter (ROOM_NAME). Version 2 wrote Element.Name, which for a room or
#      a space Revit answers with the name AND the number together, so a name
#      column got "PUMP ROOM 121" for a space PUMP ROOM numbered 121.
#   2. numberParameter, new and optional, takes the Number on its own.
#   3. A space is tested by its boundary (Space.IsPointInSpace), never its
#      bounding box - version 2's Room cast missed every Space, which fell
#      through to the box.
#   4. NEW LOGIC, said plainly - THE STOREY IS CHECKED. In plan (Revit's test at
#      the container's mid-height or its location point's height, the second
#      being COUNT_BY_SPATIAL_CONTAINER's) is not enough: a space on Level 1
#      says yes to a damper on Level 3 above it. A container is taken only when
#      the element is INSIDE it (Revit's test at the element's own point) or
#      above it but below the top of its storey - its location point plus the
#      height from its level to the next STOREY level up (Building Story
#      ticked; every level if none is), a difference of elevations.
#      Anything else - below the floor, a higher storey, a storey whose top is
#      unknown, two equally good - is NOT WRITTEN and named with the reason.
#      Version 2 and COUNT_BY take the first container to say yes in plan;
#      row 5b-1858 records COUNT_BY's side. A "ceiling" or slab level ticked
#      as a storey (or any, in a model with none ticked) makes the storey short:
#      ceiling-void elements above it then go unwritten and named, never
#      written to another floor. So this can write fewer than COUNT_BY counts
#      in a space.
#   5. All three targets are optional (`absent: none`), each target must be a
#      text parameter, and every value is read back after it is written.
#   6. `includeLinks` (D-59, optional, absent = host only): rooms or spaces in
#      LOADED links are asked too - COUNT_BY_SPATIAL_CONTAINER's mechanism, the
#      element's point moved into each link placement and tested there with the
#      link's own levels, nested links counted and not read. THIS MODEL'S OWN
#      CONTAINER WINS - one that passed the storey check - where a host and a
#      linked one both hold the element, and the answer counts it;
#      `linkedMatches` names the link each came from. Added on Ajmal PS's word
#      the same day ("YES ADD LINKED ROOMS TO THE FIX"): his job's rooms are in
#      the architect's link.
# Version 2 was PROVEN on 2026-10-18 on Project2 with ROOMS (the proof block
# below, kept as the record of what it proved). Its C# moved, so it is DRAFT
# until NEEDS-CHECKING Group ON is run and signed (D-30). Spaces have never
# been proved on this card.
version: 3
source: OFFICIAL
risk: MODIFY

purpose: >
  Writes where each element actually IS onto its own parameters - the name and
  the number of the room or space it sits in, each into a parameter of its own,
  and its level. The *"fill in the location columns"* job that
  a handover register or a client's asset list needs, and that nothing in Revit
  fills for you.

  **IT IS NOT `WRITE_ELEMENT_PARAMETERS`, because the value is not given - it is
  WORKED OUT.** That fragment writes a value somebody supplies. This one reads
  each element's position from geometry and derives what to write, per element.
  Nobody can hand in four hundred different room names.

  **ROOM AND SPACE ARE NOT THE SAME THING, AND THIS IS THE SINGLE MOST COMMON WAY
  A LOCATION REGISTER COMES OUT WRONG.** Architecture puts people in ROOMS; MEP
  calculates in SPACES. A model can hold both, in the same place, with different
  names and different numbers. Which one is used is asked for, and the report
  says which was used. Rooms in a LINKED model are asked only with
  `includeLinks` (D-59), and this model's own room or space wins where both
  hold an element.

  **THE STOREY IS CHECKED.** A room on Level 1 lies under a damper on Level 3
  in plan; it is taken only when the element is inside it, or above it but
  still on its storey. Anything else - another floor, below the floor, two
  rooms equally good - is left unwritten and named with the reason, never
  written with another floor's name.

  **THE PROBE POINT IS NUDGED TO THE ROOM'S OWN MID-HEIGHT, and without that the
  answer is wrong for exactly the elements most often asked about.** The room
  test needs a point inside the room's VOLUME. A ceiling-mounted diffuser sits
  above the room's upper limit and tests false from its own position - so a
  register built the obvious way has every terminal blank.

  **THE TARGET PARAMETERS MUST ALREADY EXIST.** This fills them; it does not
  create them. Anything missing is counted and named per parameter, so
  *"0 written"* is never mysterious.

  **A TARGET NAME TWO PARAMETERS SHARE IS NOT FILLED.** A shared or project
  parameter can be bound beside a built-in one of the same name, and Revit's
  lookup by name then returns one of them at random, in Autodesk's own words - so
  the room name would land in a field no schedule reads. Counted and named per
  parameter in `refused`, and neither is touched (D-54 s3, FRAGMENT-ISSUES
  5b-203). This is version 3; the proof below is version 2's, kept as a record,
  and the fragment is DRAFT until it is proved again.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # The parameter that takes the room's or space's NAME alone - never the
    # number with it (version 3). Each target below is optional: left out,
    # "none" or blank, it is skipped. With all three skipped nothing is written
    # and the answer says so.
    - name: roomParameter
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 3. The parameter that takes the room's or space's NUMBER.
    - name: numberParameter
      type: string
      source: request
      optional: true
      absent: none
    - name: levelParameter
      type: string
      source: request
      optional: true
      absent: none
    - name: useSpaces
      type: bool
      source: request
    # VERSION 3, D-59. THE MODELLER DECIDES, JOB BY JOB: set, the rooms or
    # spaces of every loaded link are asked as well, and this model's own win
    # where both hold an element. Absent means host only - what version 2 did.
    # `optional: true` lets it be left out: an absent bool marked so binds
    # false (HeronBindingNote.AbsentValue).
    - name: includeLinks
      type: bool
      source: request
      optional: true
  provides:
    - name: written
      role: result
      type: int
    - name: noRoomFound
      # Elements sitting in no room or space, so it could not be written. The
      # evidence it looked, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<string>
    - name: linksSearched
      # D-59's second field (version 3): how many linked DOCUMENTS were read -
      # a file placed twice is one. `includeLinks` set and this at 0 means
      # "asked, and none are loaded", which must not read as host only.
      role: accounting
      type: int
    - name: linkedMatches
      # What the links gave, as TEXT: the first line says which of D-59's three
      # cases this is, then one line per link - how many of its rooms or spaces
      # were asked and how many elements were given one of them.
      role: accounting
      type: IList<string>


compatibility-note: >
  One implementation for every release. `ScheduleDefinition.GetFieldOrder`,
  `GetField(ScheduleFieldId)`, `RemoveField(ScheduleFieldId)`, `GetFilters`,
  `RemoveFilter(int)`, `GetSortGroupFields`, `RemoveSortGroupField(int)` and
  `ScheduleField.IsHidden`, `GetName` and `ColumnHeading` are present and
  unchanged 2020 through 2027, with the same argument counts.

  Field identity is `ScheduleFieldId`, not an `ElementId`, so nothing here reads
  an id as a number and 2024's 64-bit change does not reach it. No units call is
  made.

# ROUTING - the same rows are in the fragments named here.
#
#   "remove a column from the schedule"   -> here
#   "take the level column out"           -> here
#   "hide a column but keep the field"    -> here, with hideOnly
#   "add a column to the schedule"        -> ADD_SCHEDULE_FIELDS - the opposite,
#                                            and what these sentences used to
#                                            resolve to
#   "what columns are there"              -> REPORT_SCHEDULE_DEFINITION, which
#                                            lists hidden columns too and is
#                                            how you find the name to pass here
#   "stop sorting by level"               -> SET_SCHEDULE_SORT_GROUP. Removing
#                                            the COLUMN is not how you remove
#                                            the SORT, and this fragment
#                                            refuses rather than assume so

utterances:
  - remove a column from the schedule
  - take the level column out of the schedule
  - delete this field from the schedule
  - i do not want that column any more
  - hide a column in the schedule but keep the field
  - hide that column on the sheet
  - take these fields off the schedule

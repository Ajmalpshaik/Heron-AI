id: FRG-VIEW-058
semantic-identity: "take these columns out of the schedule, or hide them and keep the field"
kind: action
domain: revit.schedules
capability: REMOVE_SCHEDULE_FIELDS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Takes named columns out of a schedule - or HIDES them and keeps the field -
  and reports which of the two actually happened to each one.

  **IT EXISTS BECAUSE "REMOVE A COLUMN" WAS RESOLVING TO THE FRAGMENT THAT ADDS
  ONE.** Measured before this batch, *"remove a column from the schedule"* and
  *"take the level column out"* both returned `ADD_SCHEDULE_FIELDS`, which is
  not a near miss - it is the opposite operation, and it would have quietly put
  the column back that somebody asked to have taken away.

  **HIDING AND REMOVING ARE DIFFERENT JOBS AND BOTH ARE RIGHT ANSWERS.**

  | What you want | What to use |
  |---|---|
  | The column off the drawing, the data still available to sort and filter on | `hideOnly` - the field stays |
  | The field out of the schedule altogether | the default - it is gone |

  Somebody who sorts by Level but does not want a Level column wants the first
  one, and a fragment offering only the second breaks their schedule while doing
  exactly what they asked.

  **A FIELD USED BY A SORT OR A FILTER IS REFUSED, NOT SILENTLY CASCADED.**
  Revit will not let go of a field a rule still points at. Removing that rule
  too is often the right thing - but it is a SECOND change to the schedule that
  nobody asked for, and a schedule quietly losing its filter is exactly how a
  drawing goes out listing every level. So the rules are named, the removal is
  refused, and `removeDependentRules` is the caller saying yes to it.

  **THE FIELD ORDER IS RE-READ AFTERWARDS.** An absence of exception is not
  evidence that a field went - the standing lesson from the move and parameter
  paths. What is reported is what a second read found.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16), so
  clearing four columns off three schedules is one undo entry.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: fieldNames
      type: IList<string>
      source: request
    - name: hideOnly
      type: bool
      source: request
    - name: removeDependentRules
      type: bool
      source: request
  provides:
    - name: removed
      role: result
      type: int
    - name: hidden
      role: result
      type: int
    - name: notPresent
      # Field names the schedule does not carry, so it could not be removed.
      # The evidence it looked, never a thing it found (D-52).
      role: accounting
      type: IList<string>
    - name: refusedInUse
      # Fields a sort or filter still points at, so the removal was refused
      # rather than cascaded. The evidence it looked and said no, never a
      # field it removed (D-52).
      role: accounting
      type: IList<string>
    - name: rulesRemoved
      # Sort and filter rules taken out with the field, which the caller had
      # to say yes to. A second change to the schedule, and the one that would
      # otherwise send a drawing out listing every level.
      role: result
      type: int
    - name: presentFields
      # The fields on the schedule when it was re-read afterwards. THE FIELD
      # ORDER IS RE-READ because an absence of exception is not evidence a
      # field went - the verification, filled in whether anything was removed
      # or not (D-52).
      role: accounting
      type: IList<string>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string


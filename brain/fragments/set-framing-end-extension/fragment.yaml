compatibility-note: >
  One implementation for every release. Read with tools/api-surface --members
  on the reference assemblies of 2020 to 2027 on 2026-11-02, every one present
  in all eight: `BuiltInParameter.START_EXTENSION`, `END_EXTENSION`,
  `START_JOIN_CUTBACK`, `END_JOIN_CUTBACK`; `Element.get_Parameter
  (BuiltInParameter)`, `Parameter.IsReadOnly`, `StorageType`, `AsDouble`,
  `Set(double)`; `LocationCurve.ElementsAtJoin[int end]`; `Element.Category`,
  `Document.Regenerate`. `StructuralFramingUtils.SetEndReference` /
  `IsEndReferenceValid` / `RemoveEndReference` are present too and NOT used:
  they attach a beam end to a picked face, which nobody asked for. ElementIds
  are compared as ElementIds and never read as numbers.

# ROUTING - repeated in COPE_FRAMING, DISALLOW_JOIN and WRITE_ELEMENT_PARAMETERS.
#
#   "set the beam end extension to 150 mm"  -> here
#   "cut back these beams 50 mm at the column" -> here, setting cutback,
#                                              whichEnd joined
#   "cope these beams at the columns"       -> COPE_FRAMING - a cut round the
#                                              column, not a cutback
#   "the beam is being eaten by the column" -> DISALLOW_JOIN
#   "trim these back to the corner"         -> TRIM_EXTEND_ELEMENTS
#   "extend this until it hits that one"    -> TRIM_EXTEND_ELEMENTS, declared
#                                              there since row 5b-1419 - ranking
#                                              alone moved it here
#   "set the justification of these beams"  -> SET_FRAMING_JUSTIFICATION -
#                                              where the member sits on its
#                                              line, not its length (added
#                                              2026-11-02, row 5b-1444)

utterances:
  - set the beam end extension to 150 mm
  - cut back these beams 50 mm at the column

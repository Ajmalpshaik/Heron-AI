compatibility-note: >
  `FamilyItemFactory.NewBlend(isSolid, profile1, profile2, sketchPlane)` - each
  profile a single planar loop, the two in parallel planes - with
  `SketchPlane.Create(Document, ElementId)`, `Arc.Create(end0, end1,
  pointOnArc)` and `Element.UniqueId`, reads the same 2020 through 2027 (the
  RevitAPI reference assemblies and their own XML remarks, read 2026-10-01).
  `Blend.TopOffset` and `BottomOffset` exist on every release too; they are not
  set here, because the remarks say their order depends on orientation - the
  extent is read instead. Version 2 adds `Document.Delete(ElementId)`,
  `Element.IsValidObject`, `PlanarFace.FaceNormal` and `Origin`,
  `Face.EdgeLoops` and `Edge.Tessellate`, each in RevitAPI.xml for 2020, 2024
  and 2027 alike (read 2026-10-08).


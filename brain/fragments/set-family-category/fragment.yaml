compatibility-note: >
  `Family.FamilyCategory { get; set; }` and `Document.OwnerFamily` read the same
  2020 through 2027 in the cached reference assemblies (api-surface, read
  2026-09-24). Category names come from `Category.Name`, so they follow the
  language Revit runs in - the same words the modeller sees.

# ROUTING - the family-building capabilities, each with one job:
#
#   "make this family an air terminal"       -> here
#   "add Width and Depth parameters"          -> ADD_FAMILY_PARAMETERS
#   "delete the Cap R Start parameter"       -> DELETE_FAMILY_PARAMETERS -
#                                                only what nothing uses
#   "make a 600 x 600 type"                   -> SET_FAMILY_TYPE_VALUES
#   "neck top is height plus neck depth"      -> SET_FAMILY_FORMULA
#   "add reference planes at 300 each side"   -> CREATE_REFERENCE_PLANES
#   "label the width with the Width parameter"-> LABEL_FAMILY_DIMENSION
#   "make a box between these planes"         -> EXTRUDE_BETWEEN_PLANES
#   "extrude a circle 300 diameter 500 high"  -> CREATE_FAMILY_EXTRUSION -
#                                                any other shape, solid or void
#   "make a revolve in the family"            -> CREATE_FAMILY_REVOLUTION
#   "blend a rectangle into a circle"         -> CREATE_FAMILY_BLEND
#   "sweep a profile along a path"            -> CREATE_FAMILY_SWEEP
#   "sweep one shape into another along a path" -> CREATE_FAMILY_SWEPT_BLEND
#   "make a spring as one smooth sweep along a helix" -> CREATE_FAMILY_FREEFORM_SOLID -
#                                                a fixed shape, not parametric
#   "loft a smooth body through elliptical sections" -> CREATE_FAMILY_FREEFORM_SOLID
#   "cut the solid with the void"             -> COMBINE_FAMILY_FORMS - a
#                                                join too
#   "align and lock this form to the planes"  -> LOCK_FORM_TO_PLANES - any
#                                                form's flat faces
#   "label the neck diameter with Neck Diameter" -> LABEL_FAMILY_RADIUS
#   "show this form only in fine"             -> SET_FAMILY_FORM_VISIBILITY
#   "set the subcategory of these forms"      -> SET_FAMILY_FORM_SUBCATEGORY
#   "link the body material to Body Material" -> SET_FAMILY_FORM_MATERIAL -
#                                                one form, not every one
#   "link the handle's visible to Show_Handle" -> LINK_FAMILY_FORM_PARAMETER -
#                                                a form's Visible, angles or
#                                                extrusion ends, one form
#   "make this plane the left reference"      -> SET_FAMILY_PLANE_REFERENCE -
#                                                Is Reference, Defines Origin
#   "draw the valve symbol in plan"           -> DRAW_FAMILY_SYMBOLIC_LINES -
#                                                2D lines, no 3D body
#   "array the blade along X with Blade Count" -> ARRAY_FAMILY_FORMS - one form
#                                                in a row, its count a parameter
#   "put the motor family into this air handler" -> PLACE_NESTED_FAMILY
#   "lock the motor's centre to the centre planes" -> LOCK_NESTED_FAMILY_TO_PLANES
#   "link the motor type's width to Motor Width" -> LINK_NESTED_TYPE_PARAMETER -
#                                                a nested TYPE's parameter
#   "make this family work plane based"       -> SET_FAMILY_SETTINGS
#   "add the shared parameter Equipment Tag to this family"
#                                             -> ADD_FAMILY_SHARED_PARAMETERS
#   "put a supply air connector on the neck"  -> ADD_FAMILY_CONNECTOR
#   "delete the pipe connector from this family" -> REMOVE_FAMILY_CONNECTOR
#   "link the connector flow to a parameter"  -> LINK_FAMILY_PARAMETER - an
#                                                element already in the family
#   "flex the family"                         -> FLEX_FAMILY
#   "start a new family from a template"      -> CREATE_FAMILY_DOCUMENT
#   "what kind of family is this"             -> REPORT_FAMILY_TEMPLATE - read
#                                                first, every kind
#   "set the part type of this fitting to elbow" -> SET_FAMILY_SETTINGS
#   "let each type choose which motor it uses" -> ADD_FAMILY_TYPE_PARAMETER -
#                                                a nested TYPE swapped by type
#   "add flip arrows to this family"          -> ADD_FAMILY_FLIP_CONTROL
#   "add a solid fill to this detail item family" -> DRAW_FAMILY_FILLED_REGION
#   "draw the profile in this profile family" -> DRAW_FAMILY_DETAIL_LINES -
#                                                a 2D family's lines
#   "cut an opening in the host wall of this family"
#                                             -> CREATE_FAMILY_HOST_OPENING
#   "use the handrail profile family for this sweep"
#                                             -> SET_FAMILY_SWEEP_PROFILE
#   "add four adaptive points to this family" -> PLACE_ADAPTIVE_POINTS
#   "draw lines between the adaptive points"  -> DRAW_FAMILY_POINT_CURVES
#   "make a surface from these lines"         -> CREATE_CONCEPTUAL_FORM - an
#                                                adaptive or pattern family
#   "make a type catalog for this family"     -> REPORT_FAMILY_TYPE_CATALOG
#   "set the primary connector of this family" -> SET_FAMILY_CONNECTOR_ROLES -
#                                                primary and linked connectors
#   "set the light source of this fixture family"
#                                             -> SET_FAMILY_LIGHT_SOURCE
#   "divide the surface of this mass into panels"
#                                             -> DIVIDE_FAMILY_SURFACE


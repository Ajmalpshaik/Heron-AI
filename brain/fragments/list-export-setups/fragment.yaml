compatibility-note: >
  `ExportDWGSettings` and `ExportDGNSettings` with `ListNames`, `FindByName`,
  `GetActivePredefinedSettings`, `GetDWGExportOptions` and
  `GetDGNExportOptions`, every option read here on `DWGExportOptions`,
  `ACADExportOptions` and `BaseExportOptions`, `ExportLayerTable` with its
  keys and infos, `PrintSetting.PrintParameters` and `PrintSetup` are
  present with the same signatures 2020 through 2027 - looked up with
  tools/api-surface --members on every release on 2026-11-01.
  `DGNExportOptions.MasterUnits` is 2020-2021 and `WorkingUnits` 2021-2027,
  so 2020 reads the first and 2021 on the second. `ExportPDFSettings` and
  `PDFExportOptions` exist from 2022 only: on 2020 and 2021 the PDF part is
  compiled out and a finding says PDF setups need 2022 or later. A naming
  rule's parameter is matched by ElementId equality against built-in ids,
  never read as a number, so 2024's 64-bit ids do not reach this code.

# ROUTING - the same rows are in MANAGE_EXPORT_SETUPS and
# SET_EXPORT_SETUP_OPTIONS.
#
#   "list the export setups"             -> here. A QUESTION
#   "which DWG export setups are there"  -> here
#   "what units does Setup 1 export in"  -> here, with setupName
#   "rename the DWG export setup Setup 1 to Tags Export"
#                                        -> MANAGE_EXPORT_SETUPS. A CHANGE
#   "copy Setup 1 as MEP Export"         -> MANAGE_EXPORT_SETUPS, duplicate
#   "set Setup 1 to export in millimetres"
#                                        -> SET_EXPORT_SETUP_OPTIONS
#   "list the view/sheet sets"           -> LIST_SHEET_SETS. A sheet set is
#                                           WHAT gets exported; a setup is HOW
#   "export the views to dwg"            -> EXPORT_VIEWS_TO_DWG. A PUBLISH


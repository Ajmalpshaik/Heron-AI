risk: READ

# WRITTEN 2026-11-01 FOR FRAGMENT-ISSUES ROW 5b-1360. Ajmal PS asked Heron to
# rename the DWG/DXF export setup "Setup 1" on his Revit 2020 job model
# 4355-BHVD-3D-50S20-BL001A, and nothing in the library could see an export
# setup at all: "rename the DWG export setup Setup 1 to Tags Export" reached
# EXPORT_VIEWS_TO_DWG, a PUBLISH that only USES a setup. The research - which
# setups the Revit API reaches, on which releases - is
# docs/work-notes/investigations/2026-11-01-export-setups.md.
#
# A NEW CARD, NOT A WIDENING. LIST_SHEET_SETS and SET_PRINT_SETTINGS are
# PROVEN and about other things; EXPORT_VIEWS_TO_DWG is a PUBLISH. One read
# for every kind of setup the API reaches, not one card per kind.
#
# IFC, NAVISWORKS, DWF AND IMAGE ARE LEFT OUT ON PURPOSE. None of them keeps a
# saved setup the Revit API exposes (the work note, section 1). The answer
# says so in a finding rather than reading as "none".
purpose: >
  Answers which export setups the project holds and what is in each - the
  DWG/DXF export setups, the DGN export setups, the PDF export setups (Revit
  2022 and later) and the print settings - each by name, which one is active,
  and its key options in the export dialog's words: file version, units,
  coordinate basis, how views on sheets are exported, layer standard, solids,
  colours, line scaling, and for PDF the paper, zoom, colour and file naming.
  A question, read and never changed; it opens no transaction.

  **ONE SETUP NAMED SHOWS ITS LAYER TABLE.** With a setup's name given, its
  category-to-layer rows are listed as well.

  **IFC, NAVISWORKS, DWF AND IMAGE EXPORT ARE NOT LISTED.** They keep no saved
  setup the Revit API can read, and the answer says so.

contract:
  needs:
    - name: doc
      type: Document
    # "dwg" (DWG and DXF are one setup), "dgn", "pdf", "print" - or left out
    # for every kind.
    - name: kind
      type: string
      source: request
      optional: true
      absent: all
    # One setup's name, which also lists its layer table - or left out for
    # every setup.
    - name: setupName
      type: string
      source: request
      optional: true
      absent: all
  provides:
    - name: setups
      # The answer, ONE string with " || " between setups, because a list
      # reaches the reply cut to three entries of sixty characters. Each:
      # "<kind>: <name>", "(ACTIVE)" when it is the one the dialog opens on,
      # then its options. Sorted by kind, then name.
      role: result
      type: string
    - name: setupCount
      # How many setups were listed - every kind asked for.
      role: result
      type: int
    - name: activeSetups
      # The setup each kind's dialog opens on, "; " between kinds. Empty for
      # a kind with none.
      role: result
      type: string
    - name: layerTable
      # Only with one DWG/DXF or DGN setup named: its layer rows as
      # "Category : Subcategory -> layer (colour n)", "; " between rows, the
      # first 80 and then how many more. Empty otherwise.
      role: result
      type: string
    - name: findings
      type: IList<string>
    - name: refused
      # Why it declined, in the user's words - a kind it does not know, or a
      # setup name that is not there, naming the ones that are. Never a thing
      # it FOUND (D-52).
      role: accounting
      type: string

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  `ExportDWGSettings` and `ExportDGNSettings` with `ListNames`, `FindByName`,
  `GetActivePredefinedSettings`, `GetDWGExportOptions` and
  `GetDGNExportOptions`, every option read here on `DWGExportOptions`,
  `ACADExportOptions` and `BaseExportOptions`, `ExportLayerTable` with its
  keys and infos, `PrintSetting.PrintParameters` and `PrintSetup` are
  present with the same signatures 2020 through 2027 - looked up with
  tools/api-surface --members on every release on 2026-11-01.
  `DGNExportOptions.MasterUnits` is 2020-2021 and `WorkingUnits` 2021-2027,
  so 2020 reads the first and 2021 on the second. `ExportPDFSettings` and
  `PDFExportOptions` exist from 2022 only: on 2020 and 2021 the PDF part is
  compiled out and a finding says PDF setups need 2022 or later. A naming
  rule's parameter is matched by ElementId equality against built-in ids,
  never read as a number, so 2024's 64-bit ids do not reach this code.

# ROUTING - the same rows are in MANAGE_EXPORT_SETUPS and
# SET_EXPORT_SETUP_OPTIONS.
#
#   "list the export setups"             -> here. A QUESTION
#   "which DWG export setups are there"  -> here
#   "what units does Setup 1 export in"  -> here, with setupName
#   "rename the DWG export setup Setup 1 to Tags Export"
#                                        -> MANAGE_EXPORT_SETUPS. A CHANGE
#   "copy Setup 1 as MEP Export"         -> MANAGE_EXPORT_SETUPS, duplicate
#   "set Setup 1 to export in millimetres"
#                                        -> SET_EXPORT_SETUP_OPTIONS
#   "list the view/sheet sets"           -> LIST_SHEET_SETS. A sheet set is
#                                           WHAT gets exported; a setup is HOW
#   "export the views to dwg"            -> EXPORT_VIEWS_TO_DWG. A PUBLISH

utterances:
  - list the export setups
  - which dwg export setups are there
  - show the options in the dwg export setup
  # ADDED 2026-11-01, measured on a scratch store, trained model, 2020 and
  # 2024: without it "what units does Setup 1 export in" - a question - went
  # to SET_EXPORT_SETUP_OPTIONS, a write, unless the host marked it a
  # question. Not the modeller's words yet; row 5b-1360 says so.
  - what units does the export setup export in

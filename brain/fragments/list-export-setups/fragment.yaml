# WRITTEN 2026-11-01 FOR FRAGMENT-ISSUES ROW 5b-1360. Ajmal PS asked Heron to
# rename the DWG/DXF export setup "Setup 1" on his Revit 2020 job model
# 4355-BHVD-3D-50S20-BL001A, and nothing in the library could see an export
# setup at all: "rename the DWG export setup Setup 1 to Tags Export" reached
# EXPORT_VIEWS_TO_DWG, a PUBLISH that only USES a setup. The research - which
# setups the Revit API reaches, on which releases - is
# docs/work-notes/investigations/2026-11-01-export-setups.md.
#
# A NEW CARD, NOT A WIDENING. LIST_SHEET_SETS and SET_PRINT_SETTINGS are
# PROVEN and about other things; EXPORT_VIEWS_TO_DWG is a PUBLISH. One read
# for every kind of setup the API reaches, not one card per kind.
#
# IFC, NAVISWORKS, DWF AND IMAGE ARE LEFT OUT ON PURPOSE. None of them keeps a
# saved setup the Revit API exposes (the work note, section 1). The answer
# says so in a finding rather than reading as "none".
purpose: >
  Answers which export setups the project holds and what is in each - the
  DWG/DXF export setups, the DGN export setups, the PDF export setups (Revit
  2022 and later) and the print settings - each by name, which one is active,
  and its key options in the export dialog's words: file version, units,
  coordinate basis, how views on sheets are exported, layer standard, solids,
  colours, line scaling, and for PDF the paper, zoom, colour and file naming.
  A question, read and never changed; it opens no transaction.

  **ONE SETUP NAMED SHOWS ITS LAYER TABLE.** With a setup's name given, its
  category-to-layer rows are listed as well.

  **IFC, NAVISWORKS, DWF AND IMAGE EXPORT ARE NOT LISTED.** They keep no saved
  setup the Revit API can read, and the answer says so.

contract:
  needs:
    - name: doc
      type: Document
    # "dwg" (DWG and DXF are one setup), "dgn", "pdf", "print" - or left out
    # for every kind.
    - name: kind
      type: string
      source: request
      optional: true
      absent: all
    # One setup's name, which also lists its layer table - or left out for
    # every setup.
    - name: setupName
      type: string
      source: request
      optional: true
      absent: all
  provides:
    - name: setups
      # The answer, ONE string with " || " between setups, because a list
      # reaches the reply cut to three entries of sixty characters. Each:
      # "<kind>: <name>", "(ACTIVE)" when it is the one the dialog opens on,
      # then its options. Sorted by kind, then name.
      role: result
      type: string
    - name: setupCount
      # How many setups were listed - every kind asked for.
      role: result
      type: int
    - name: activeSetups
      # The setup each kind's dialog opens on, "; " between kinds. Empty for
      # a kind with none.
      role: result
      type: string
    - name: layerTable
      # Only with one DWG/DXF or DGN setup named: its layer rows as
      # "Category : Subcategory -> layer (colour n)", "; " between rows, the
      # first 80 and then how many more. Empty otherwise.
      role: result
      type: string
    - name: findings
      type: IList<string>
    - name: refused
      # Why it declined, in the user's words - a kind it does not know, or a
      # setup name that is not there, naming the ones that are. Never a thing
      # it FOUND (D-52).
      role: accounting
      type: string


id: FRG-MEP-047
semantic-identity: "which pipe segments this project has, of what material, and in which sizes"
kind: action
domain: revit.mep
capability: REPORT_PIPE_SEGMENTS
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Lists every pipe segment in the project - its name, its material, how many
  sizes it carries and the outside-diameter range those sizes cover. The
  question "what am I allowed to build a pipe type out of", answered before
  anybody points a routing rule at one.

  **A SEGMENT IS WHERE A PIPE'S MATERIAL ACTUALLY LIVES.** A PipeType has no
  Material parameter - measured on Project1, 2026-09-15. It has a routing rule
  pointing at a segment, and the segment carries the material and the size
  table. So "which copper can I use" is this fragment, and SET_ROUTING_PREFERENCE
  is what then uses the answer.

  **THE SIZE RANGE IS THE POINT, NOT THE COUNT.** Refrigerant line sets are
  sized by imperial outside diameter - 6.35, 9.52, 12.7 mm - and water tube by
  metric DN - 15, 22, 28. Both are "copper" and a name cannot tell them apart.
  Reporting the OD range is what shows, at a glance, that a segment holds the
  wrong sizes for the job - which is a mistake that survives all the way to a
  material order.

  **THE NAMES COME BACK AS ONE STRING, DELIBERATELY.** A list is abbreviated to
  its first three entries by the time it reaches a reader, and a project with
  five copper segments then shows three - which reads as "there are three".
  One string is not abbreviated, so the answer is complete or it is obviously
  cut. Found by hitting it: five copper segments displayed as "Copper - A,
  Copper - B, Copper - C, ..." and the other two could not be discovered
  without guessing names one at a time.

  Changes nothing and opens no transaction.

contract:
  needs:
    - name: doc
      type: Document
    # Narrows to segments whose NAME or MATERIAL contains this. Empty means
    # every segment, which is the usual ask.
    - name: nameContains
      type: string
      source: request
  provides:
    # The matching segments themselves, so the answer can be ACTED on. A pipe
    # segment is a settings object and never appears in a view, so it cannot
    # be clicked - naming it here is the only way set-selection, and then
    # anything that changes or removes one, can reach it.
    - name: elements
      role: result
      type: IList<Element>
    - name: segmentCount
      role: result
      type: int
    - name: segmentList
      # Every matching segment on ONE line. A string rather than a list, for
      # the reason in the purpose - this is the answer people actually read.
      role: result
      type: string
    - name: sizeTable
      # Every size of the ONE segment the needle narrowed to - OD and wall,
      # in millimetres - and empty when it matched more or none. Every size of
      # every segment on one line is unreadable, and the range already answers
      # "is this the right family of sizes"; this is for the moment somebody
      # is actually choosing between two.
      role: result
      type: string
    - name: scanned
      # How many segments were examined before narrowing. A count of work
      # DONE, never a thing it found (D-52).
      role: accounting
      type: int
    - name: noSizes
      # Segments carrying no size at all. They exist, cannot be drawn with,
      # and look identical to a working one in a dropdown.
      role: accounting
      type: IList<string>
    - name: findings
      type: IList<string>


compatibility-note: >
  One implementation for every release. `PipeSegment`, `Segment.GetSizes`,
  `MEPSize.OuterDiameter`, `MEPSize.NominalDiameter` and `Segment.MaterialId`
  are present 2020 through 2027, confirmed by reflection on the 2020 assembly
  and in the 2027 metadata on 2026-09-15.

  Diameters are internal feet multiplied by 304.8 as plain arithmetic - no
  units API, which is the call that changed shape at 2021.

# ROUTING - repeated in SET_ROUTING_PREFERENCE.
#
#   "what pipe segments do we have"   -> here
#   "which copper can I use"          -> here
#   "make this type copper"           -> SET_ROUTING_PREFERENCE, which needs
#                                        the name this one reports
#   "what fitting will this insert"   -> REPORT_ROUTING_PREFERENCES

utterances:
  - what pipe segments do we have
  - list the pipe segments
  - which copper can I use
  - show me the segments and their sizes
  - what material can this pipe type be

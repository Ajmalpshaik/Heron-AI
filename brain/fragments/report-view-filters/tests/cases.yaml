positive:
  - given: a project with a dozen MEP colour filters
    expect: >
      each named with its kind and the views using it - CHECKED against one
      view's own Visibility/Graphics, Filters tab, before the list is believed

  - given: a filter known to be on three views
    expect: those three named, and no others

  - given: viewName naming a view that carries filters (version 2)
    expect: >
      filterSettings reads back every filter's whole row of the Filters tab -
      Enable Filter, Visibility, projection lines, surface foreground and
      background patterns, transparency, cut lines and patterns, halftone - and
      says whether the cut columns apply. First read on 2026-09-28 in "heron ai
      bulding", Revit 2024: the three duct filters on two views, each "cut not
      applicable" because none of the eight duct categories can be cut

negative:
  - given: any project at all
    expect: >
      the report COMPLETES. THIS IS THE FIRST CASE TO RUN. The project browser
      and system browser come back from the same collector as real views and
      THROW when asked about filters - a version of this without a guard per view
      dies partway through and reports whatever it had reached, which reads as a
      short list rather than as a crash

  - given: a filter applied to no view
    expect: >
      named as such, not omitted. That row is the point of the report: a leftover
      filter and a tidy project look identical without it

  - given: a filter used only inside a view TEMPLATE
    expect: >
      reported as on no view. Templates are excluded deliberately - a template is
      not where a drawing is - and this is the one case where "unused" needs a
      second look before anybody deletes anything

  - given: a project with no filters
    expect: a plain zero, not silence

  - given: viewName naming a view that does not exist
    expect: >
      filterSettings says there is no view called that and nothing was read for
      it - never an empty string that reads as "no filters". Measured 2026-09-28
      with "No Such View"

  - given: viewName blank
    expect: >
      filterSettings empty and the rest of the report exactly what version 1
      gave - a caller that only wants the project-wide list is not handed more

  - given: a Revit 2020 model and viewName
    expect: >
      the view's heading says Revit 2020 has no Enable Filter tick, and no row
      claims one. GetIsFilterEnabled arrived at 2021 and is reached by name, so
      the fragment still compiles and runs on 2020. NOT YET RUN on 2020

second_route:
  - Revit's own Manage then Filters for the list, and one view's Visibility/Graphics for the usage

compatibility-note: >
  One implementation for every release. `FilterElement` and its two subclasses,
  and `View.IsFilterApplied`, are present 2020 through 2027 - read off the
  reference assemblies at both ends rather than remembered. `GetOrderedFilters`
  is NOT used: it is absent from 2020 (present 2021 to 2027 - version 1 said it
  arrived at 2024, which the 2021 reference assembly disproves) and the order is
  not what this report is for.

  `View.GetIsFilterEnabled` is the same: 2021 to 2027, absent from 2020, read
  off all eight reference assemblies on 2026-09-28. It is reached by name at run
  time, never under `#if REVIT2020`, because the add-in compiles fragments with
  no release symbols (FRAGMENT-ISSUES 5b-181). On 2020 the report says there is
  no Enable Filter tick. Every `OverrideGraphicSettings` getter it reads,
  `Category.IsCuttable`, `ParameterFilterElement.GetCategories` and
  `LinePatternElement.GetSolidPatternId` are present 2020 to 2027.

# ROUTING - repeated in APPLY_VIEW_FILTER, CREATE_VIEW_FILTER and
# CREATE_SELECTION_FILTER.
#
#   "what filters are on this view"  -> here - a READ
#   "what are the filter settings on this view" -> here, with viewName
#   "read the filter settings back"  -> here, with viewName
#   "which views use this filter"    -> here
#   "what filters already exist"     -> here, before making a near-duplicate
#   "put that filter on this view"   -> APPLY_VIEW_FILTER - a WRITE, and it must
#                                       not answer a question about a drawing
#   "make a filter for supply air"   -> CREATE_VIEW_FILTER
#   "save these as a set"            -> CREATE_SELECTION_FILTER
#   "list the saved selection sets in the model" -> here - a saved selection
#                                       set is a filter too, reported as "a
#                                       SAVED LIST". Row 5b-1005

#   "copy the view filters from this view to the other views" -> COPY_VIEW_FILTERS
#                                        - a WRITE. This one only says what is
#                                          where
#   "take that filter off the view"      -> REMOVE_VIEW_FILTER - and run this
#                                        READ first, to see what else uses it
utterances:
  - what filters are on this view
  - which views use this filter
  - what filters already exist
  - report the filters in this model
  - list the view filters
  - what are the filter settings on this view
  - show the filter overrides on this view
  # ADDED 2026-10-09, row 5b-387. The routing table above claims this
  # sentence, and a comment is not indexed, so ranking decided: "read the
  # filter settings back": COPY_VIEW_FILTERS on lexical answered it.
  - read the filter settings back
  # ADDED 2026-10-17, FRAGMENT-ISSUES row 5b-1005: asked on 2026-10-14 with the
  # Revit 2020 filter, it reached UPDATE_SAVED_SET, a write. Every saved
  # selection set is listed here as "a SAVED LIST" with the views using it.
  - list the saved selection sets in the model

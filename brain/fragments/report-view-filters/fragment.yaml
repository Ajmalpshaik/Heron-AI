compatibility-note: >
  One implementation for every release. `FilterElement` and its two subclasses,
  and `View.IsFilterApplied`, are present 2020 through 2027 - read off the
  reference assemblies at both ends rather than remembered. `GetOrderedFilters`
  is NOT used: it is absent from 2020 (present 2021 to 2027 - version 1 said it
  arrived at 2024, which the 2021 reference assembly disproves) and the order is
  not what this report is for.

  `View.GetIsFilterEnabled` is the same: 2021 to 2027, absent from 2020, read
  off all eight reference assemblies on 2026-09-28. It is reached by name at run
  time, never under `#if REVIT2020`, because the add-in compiles fragments with
  no release symbols (FRAGMENT-ISSUES 5b-181). On 2020 the report says there is
  no Enable Filter tick. Every `OverrideGraphicSettings` getter it reads,
  `Category.IsCuttable`, `ParameterFilterElement.GetCategories` and
  `LinePatternElement.GetSolidPatternId` are present 2020 to 2027.

  Version 3 adds what AUDIT_VIEW_FILTERS was proved with: `View.GetOrderedFilters`
  (2021 to 2027, absent from 2020) reached BY NAME at run time, as
  GetIsFilterEnabled is - never under a version #if, which AUDIT_VIEW_FILTERS
  used for the enabled check; and, on every release,
  `View.AreGraphicsOverridesAllowed`, `View.GetCategoryHidden`,
  `ParameterFilterElement.GetElementFilter`, `ElementLogicalFilter.GetFilters`,
  `ElementParameterFilter.GetRules`, `ElementFilter.Inverted`,
  `FilterRule.GetRuleParameter`, `FilterInverseRule.GetInnerRule`,
  `FilterCategoryRule`, `HasValueFilterRule`, `HasNoValueFilterRule`, the
  string and numeric rule getters, `ElementMulticategoryFilter`,
  `SelectionFilterElement.GetElementIds` and the `ElementId(BuiltInParameter)`
  constructor. No ElementId number is read.

# ROUTING - repeated in APPLY_VIEW_FILTER, CREATE_VIEW_FILTER and
# UPDATE_SAVED_SET.
#
#   "what filters are on this view"  -> here - a READ
#   "the filter is on the view and nothing is coloured" -> here since version
#                                       3, with the view named (was
#                                       AUDIT_VIEW_FILTERS)
#   "my filter change did not save"  -> here - templateOwned
#   "list every filter on this view in order with its rules" -> here
#   "why can I not see my ducts"     -> DIAGNOSE_VISIBILITY, which asks about
#                                       ONE ELEMENT and every reason it might
#                                       be invisible
#   "does this filter catch this element" -> TEST_VIEW_FILTER_MATCH
#   "which parameters can I filter on" -> REPORT_FILTERABLE_PARAMETERS
#   "the colours are not showing on this drawing" -> here when a filter is
#                                       applied and nothing draws;
#                                       COLOR_BY_PARAMETER when nothing has
#                                       been coloured yet
#   "show me the full visibility graphics of this view" ->
#                                       REPORT_CATEGORY_OVERRIDES with
#                                       allCategories true - this card is the
#                                       filters
#   "what are the filter settings on this view" -> here, with viewName
#   "read the filter settings back"  -> here, with viewName
#   "which views use this filter"    -> here
#   "what filters already exist"     -> here, before making a near-duplicate
#   "which filters are unused"       -> FIND_PURGEABLE_ELEMENTS - the unused
#                                       question, with templates no view
#                                       follows as their own list. This card
#                                       says what is where, and since version 4

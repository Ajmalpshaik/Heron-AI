id: FRG-VIEW-041
semantic-identity: "what filters exist, which views use them, and why a filter on a view draws nothing"
kind: filter
domain: revit.views
capability: REPORT_VIEW_FILTERS
# VERSION 3 (2026-11-01): AUDIT_VIEW_FILTERS was merged into this card on the
# owner's instruction ("make sure there is no duplicate tools"), and is
# DEPRECATED. For each view named: every filter numbered in PRIORITY order (the
# dialog's, from Revit 2021; Revit's own on 2020, and said), its categories,
# its rule as the Filters dialog reads it, how many host elements it catches in
# that view, and the four ways a filter can be present and do nothing -
# `disabled`, `hidden`, `blankOverride`, `nothingToActOn` - with the
# template-owned verdict, `templateOwned`. The proof below is version 2's and
# no longer describes the code; the card is DRAFT until version 3 is proved.
#
# VERSION 4 (2026-11-01) - A SAFETY FIX, on the owner's instruction ("in
# every conflict keep the safer rule"). The "used in" sweep read real views
# only, so a filter carried ONLY by a view template that views follow read
# "ON NO VIEW. Either a leftover" - inviting a delete that changes every
# drawing following that template. FIND_PURGEABLE_ELEMENTS counts that filter
# as in use, and that rule is taken here: every view template is read too, a
# filter one carries is IN USE and never in `unusedFilters`, and its finding
# names the template and how many views follow it (a template no view follows
# is said to be one - the filter is still kept out of the unused list). "Which
# filters are unused" is FIND_PURGEABLE_ELEMENTS' question; it routes there.
version: 4
source: OFFICIAL
risk: READ

purpose: >
  Lists every filter in the project - rule-based and saved-set alike - and which
  views actually use each one. Read-only.

  **Name a view and its whole Filters tab comes back** (version 2, 2026-09-28,
  FRAGMENT-ISSUES 5b-248). `viewName` takes a view as the Project Browser shows
  it or as Heron prints it (`FloorPlan: Level 1`), several separated by
  semicolons, or `*` for every view carrying a filter. For each filter on it,
  `filterSettings` reads back the row of Visibility/Graphics: Enable Filter,
  Visibility, projection lines (pattern, colour, weight), surface foreground and
  background patterns (pattern, colour, Visible tick), transparency, cut lines,
  cut patterns, halftone - and whether the cut columns apply at all, because
  Revit greys them out when none of the filter's categories can be cut. It is
  the read half of APPLY_VIEW_FILTER. A blank `viewName` leaves
  `filterSettings` empty and the report is what it always was.

  **And why a filter on a view draws nothing** (version 3, from
  AUDIT_VIEW_FILTERS). Each filter on a view named comes back numbered in
  priority order - the higher one wins - with its categories, its rule and
  how many elements it catches there, and the four ways a filter can be
  present and do nothing, none of which Revit calls an error: switched off,
  its visibility off, an empty override, or every one of its categories
  hidden. A view template owning the filters - the answer to "my change did
  not save" - is said once, by name. It changes nothing.

  **Before this, asking what filters a view has resolved to APPLY_VIEW_FILTER**,
  which is a write. A question about a drawing answered by something that
  changes it is the worst shape of mis-routing in this library, and it is why
  this fragment exists at all.

  **It answers two questions that get asked before two different mistakes.**
  *What already exists* stops a near-duplicate filter being created beside one
  that does the job. *Where is this used* stops one being edited or deleted
  without knowing which drawings change.

  **A filter applied to NO view is the row worth finding.** It is either a
  leftover from a standard nobody follows any more, or one somebody made and
  never applied - and both look identical to a project that is simply tidy.

  **Not every "view" Revit returns can answer the question.** The project
  browser and the system browser come back from the same collector and throw
  when asked about filters, so each is asked inside its own guard - one
  pseudo-view must not take the whole report down. That was found on a real
  model, not reasoned about.

contract:
  needs:
    - name: doc
      type: Document
    # A view, several separated by semicolons, or * - or BLANK for the
    # project-wide report alone.
    - name: viewName
      type: string
      source: request
  provides:
    - name: findings
      type: IList<string>
    - name: unusedFilters
      # On no view AND in no view template (version 4). A filter only a
      # template carries is IN USE - a finding names the template and how
      # many views follow it - and is never listed here.
      role: result
      type: IList<ElementId>
    - name: filterCount
      # How many filters exist in the project. The size of the sweep, never an
      # unused one it found (D-52).
      role: accounting
      type: int
    # Every Filters-tab control of every filter on the views named, as ONE
    # string - a list reaches the reply cut to three items of sixty
    # characters, and this list is the answer.
    - name: filterSettings
      role: result
      type: string
    # VERSION 3, from AUDIT_VIEW_FILTERS - each filled from the views named,
    # empty with a blank viewName. Each is ONE OF THE FOUR WAYS a filter can be
    # present and do nothing, so each is an ANSWER, by filter id, with a
    # finding naming the filter and the view.
    - name: disabled
      # Applied, its Enable Filter tick OFF (2021 on - Revit 2020 has no such
      # tick, and filterSettings says so).
      role: result
      type: IList<ElementId>
    - name: hidden
      # Its Visibility off: it HIDES what it matches instead of colouring it.
      role: result
      type: IList<ElementId>
    - name: blankOverride
      # An EMPTY override - every slot asked, none set.
      role: result
      type: IList<ElementId>
    - name: nothingToActOn
      # Every one of its categories switched off in the view - a correct rule
      # with nothing to act on. The answer, however much the name reads like
      # bookkeeping.
      role: result
      type: IList<ElementId>
    - name: templateOwned
      # THE ANSWER TO "MY CHANGE DID NOT SAVE": a view named follows a template
      # that controls its filters, named in findings.
      role: result
      type: bool


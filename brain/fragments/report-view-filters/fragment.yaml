id: FRG-VIEW-041
semantic-identity: "what filters exist and which views use them"
kind: filter
domain: revit.views
capability: REPORT_VIEW_FILTERS
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Lists every filter in the project - rule-based and saved-set alike - and which
  views actually use each one. Read-only.

  **Name a view and its whole Filters tab comes back** (version 2, 2026-09-28,
  FRAGMENT-ISSUES 5b-243). `viewName` takes a view as the Project Browser shows
  it or as Heron prints it (`FloorPlan: Level 1`), several separated by
  semicolons, or `*` for every view carrying a filter. For each filter on it,
  `filterSettings` reads back the row of Visibility/Graphics: Enable Filter,
  Visibility, projection lines (pattern, colour, weight), surface foreground and
  background patterns (pattern, colour, Visible tick), transparency, cut lines,
  cut patterns, halftone - and whether the cut columns apply at all, because
  Revit greys them out when none of the filter's categories can be cut. It is
  the read half of APPLY_VIEW_FILTER. A blank `viewName` leaves
  `filterSettings` empty and the report is what it always was.

  **Before this, asking what filters a view has resolved to APPLY_VIEW_FILTER**,
  which is a write. A question about a drawing answered by something that
  changes it is the worst shape of mis-routing in this library, and it is why
  this fragment exists at all.

  **It answers two questions that get asked before two different mistakes.**
  *What already exists* stops a near-duplicate filter being created beside one
  that does the job. *Where is this used* stops one being edited or deleted
  without knowing which drawings change.

  **A filter applied to NO view is the row worth finding.** It is either a
  leftover from a standard nobody follows any more, or one somebody made and
  never applied - and both look identical to a project that is simply tidy.

  **Not every "view" Revit returns can answer the question.** The project
  browser and the system browser come back from the same collector and throw
  when asked about filters, so each is asked inside its own guard - one
  pseudo-view must not take the whole report down. That was found on a real
  model, not reasoned about.

contract:
  needs:
    - name: doc
      type: Document
    # A view, several separated by semicolons, or * - or BLANK for the
    # project-wide report alone.
    - name: viewName
      type: string
      source: request
  provides:
    - name: findings
      type: IList<string>
    - name: unusedFilters
      role: result
      type: IList<ElementId>
    - name: filterCount
      # How many filters exist in the project. The size of the sweep, never an
      # unused one it found (D-52).
      role: accounting
      type: int
    # Every Filters-tab control of every filter on the views named, as ONE
    # string - a list reaches the reply cut to three items of sixty
    # characters, and this list is the answer.
    - name: filterSettings
      role: result
      type: string

proof:
  date: '2026-09-13'
  by: Ajmal PS
  model: >
    Snowdon Towers Sample HVAC.rvt (9,628 elements) and Project1 (3,410 elements, unsaved default template), both open at once in Revit 2024.3
  positive_case: >
    Snowdon Towers: 13 filters checked against 30 views, 9 unused, each named and described as a RULE.
  negative_case: >
    Project1: 10 filters against 18 views, 6 unused - a different model gives different numbers rather than a repeated answer, and neither run reported the other's filters.
  second_route: >
    FIND_UNUSED_DEFINITIONS reached the same unused count by a different route in the same run: 8 used by nothing plus 1 used only by unused templates = 9 on Snowdon, and 6 on Project1. Two mechanisms agreeing.
  fingerprint: "007bed6516b5b671"

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `FilterElement` and its two subclasses,
  and `View.IsFilterApplied`, are present 2020 through 2027 - read off the
  reference assemblies at both ends rather than remembered. `GetOrderedFilters`
  is NOT used: it is absent from 2020 (present 2021 to 2027 - version 1 said it
  arrived at 2024, which the 2021 reference assembly disproves) and the order is
  not what this report is for.

  `View.GetIsFilterEnabled` is the same: 2021 to 2027, absent from 2020, read
  off all eight reference assemblies on 2026-09-28. It is reached by name at run
  time, never under `#if REVIT2020`, because the add-in compiles fragments with
  no release symbols (FRAGMENT-ISSUES 5b-181). On 2020 the report says there is
  no Enable Filter tick. Every `OverrideGraphicSettings` getter it reads,
  `Category.IsCuttable`, `ParameterFilterElement.GetCategories` and
  `LinePatternElement.GetSolidPatternId` are present 2020 to 2027.

# ROUTING - repeated in APPLY_VIEW_FILTER, CREATE_VIEW_FILTER and
# CREATE_SELECTION_FILTER.
#
#   "what filters are on this view"  -> here - a READ
#   "what are the filter settings on
#    this view" / "read the filter
#    colours back"                   -> here, with viewName
#   "which views use this filter"    -> here
#   "what filters already exist"     -> here, before making a near-duplicate
#   "put that filter on this view"   -> APPLY_VIEW_FILTER - a WRITE, and it must
#                                       not answer a question about a drawing
#   "make a filter for supply air"   -> CREATE_VIEW_FILTER
#   "save these as a set"            -> CREATE_SELECTION_FILTER

#   "copy the view filters from this view to the other views" -> COPY_VIEW_FILTERS
#                                        - a WRITE. This one only says what is
#                                          where
#   "take that filter off the view"      -> REMOVE_VIEW_FILTER - and run this
#                                        READ first, to see what else uses it
utterances:
  - what filters are on this view
  - which views use this filter
  - what filters already exist
  - report the filters in this model
  - list the view filters
  - what are the filter settings on this view
  - show the filter overrides on this view

id: FRG-SEL-028
semantic-identity: "give me the view templates themselves as a set I can act on"
kind: filter
domain: revit.selection
capability: SELECT_VIEW_TEMPLATES
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Returns the View Templates themselves as elements, narrowed by name and by
  whether anything uses them. Not the views that follow them.

  **EVERY OTHER TEMPLATE FRAGMENT HERE TAKES A TEMPLATE BY NAME, AND THAT IS
  THE GAP.** APPLY_VIEW_TEMPLATE, REMOVE_VIEW_TEMPLATE, DUPLICATE_VIEW_TEMPLATE
  and SET_VIEW_TEMPLATE_CONTROL all start from a template somebody has already
  named. None of them can answer *"do it to all of them"*, or hand a set of
  templates to a rename, a report or a delete. A template is an element like
  any other and nothing here could reach it as one.

  **USED AND UNUSED ARE NOT THE SAME QUESTION AS APPLIED AND NOT APPLIED, AND
  GETTING THAT WRONG DELETES A LIVE TEMPLATE.** A template is in use if a view
  follows it - and ALSO if a view family type names it as the template new
  views of that kind start with. The second is invisible: no view points at it,
  so a check that only walks views calls it unused, and deleting it silently
  changes what every new plan is created with. Both reasons are gathered, and
  both are reported per template rather than collapsed into one flag.

  **AN UNRECOGNISED USAGE MODE RETURNS NOTHING, NOT EVERYTHING.** A typo in the
  mode falling back to "no filter" hands the whole template list to whatever
  comes next, and what comes next is often a delete. The refusal is reported as
  a finding.

  **IT DELETES NOTHING AND JUDGES NOTHING.** *"Which definitions is nobody
  using"* as a report is FIND_UNUSED_DEFINITIONS, which also covers view
  filters and states its own reasoning about them. This one hands back
  templates as elements so something else can act, which is the half that was
  missing.

  **BUILDING IT FOUND A DEFECT IN THAT ONE.** FIND_UNUSED_DEFINITIONS walked
  views only, so a template used solely as a view family type's default was
  reported unused. Asking the same question a third way is what made the two
  answers disagree, and it was corrected the same day. Both now check both
  kinds of use.

  ASSUMES NOTHING ABOUT TRANSACTIONS - it opens none and needs none.

contract:
  needs:
    - name: doc
      type: Document
    - name: nameContains
      type: string
      source: request
    # "all" | "used" | "unused". Anything else is refused, not defaulted.
    - name: usage
      type: string
      source: request
  provides:
    - name: elements
      type: IList<Element>
    - name: matchedNames
      type: IList<string>
    - name: findings
      type: IList<string>
    - name: scanned
      type: int
    - name: found
      type: int


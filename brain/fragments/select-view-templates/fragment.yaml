compatibility-note: >
  One implementation for every release. `View.IsTemplate`,
  `View.ViewTemplateId` and `ViewFamilyType.DefaultTemplateId` are unchanged
  2020 to 2027.

  Template ids are compared as `ElementId` against `ElementId` and none is read
  as a number, so nothing here meets the 2024 widening to 64-bit or the removal
  of `IntegerValue` by 2026.

# ROUTING - repeated in FIND_UNUSED_DEFINITIONS, APPLY_VIEW_TEMPLATE and
# REPORT_VIEW_TEMPLATE_CONTROL.
#
#   "give me the view templates"          -> here
#   "rename all the templates"            -> here, then RENAME_ELEMENTS
#   "which templates is nobody using"     -> BOTH, and the difference is what
#                                            comes next. Wanting to READ the
#                                            answer is FIND_UNUSED_DEFINITIONS,
#                                            which covers view filters too and
#                                            says what a filter used only by an
#                                            unused template means. Wanting to
#                                            ACT on them - delete, rename,
#                                            report parameters - is here,
#                                            because that needs elements
#   "put this template on these views"    -> APPLY_VIEW_TEMPLATE
#   "why is this greyed out"              -> REPORT_VIEW_TEMPLATE_CONTROL
#   "copy this template"                  -> DUPLICATE_VIEW_TEMPLATE
#
# NEITHER OF THE TWO THAT ANSWER "UNUSED" DELETES ANYTHING, and that is the
# same decision in both files rather than a coincidence.

utterances:
  - give me the view templates
  - list every view template in this model
  - select the view templates
  # "which view templates are unused" IS DELIBERATELY NOT DECLARED HERE. It is
  # a QUESTION and the answer is a report, so it belongs to
  # FIND_UNUSED_DEFINITIONS - which also covers view filters. Declaring it here
  # took it from that fragment, measured 2026-09-06. What this one answers is
  # the sentence that names an ACTION, because acting needs elements.
  - delete the unused view templates
  - the templates themselves not the views
  - find view templates by name

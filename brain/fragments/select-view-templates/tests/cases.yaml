positive:
  - given: >
      usage "all", nameContains empty, a project carrying 23 view templates
    expect: >
      found is 23 and every one is a template element. matchedNames says how
      many views follow each, which is the number nobody can see from the
      template browser

  - given: >
      usage "unused" on a project where 6 templates have no view following them
    expect: >
      those 6 come back, plus a finding that says this is what is
      unreferenced today rather than what should go

  - given: >
      a template that no view follows, but which a view family type names as
      the template new plans start with, asked with usage "unused"
    expect: >
      it does NOT come back, and asked with "used" it does, carrying the reason
      "no view follows it; it is the template new views of a view type start
      with". This is the case the fragment was built around - the earlier
      version of this idea walked views only, called it unused, and deleting it
      would have changed what every new plan is created with

  - given: usage "used", nameContains "Mechanical"
    expect: >
      only templates whose name carries Mechanical AND which something uses.
      Both narrowings apply; neither silently replaces the other

negative:
  - given: usage "usde" - a typo for "used"
    expect: >
      found is 0 and a finding names the bad mode. NOT every template. A mode
      that is not understood falling back to "no filter" hands the whole list
      to whatever runs next, and what runs next is often a delete

  - given: >
      a project with no view templates at all, usage "all"
    expect: >
      found is 0 and scanned is 0, with no error. A model that never had
      templates is a real answer, not a failure

  - given: >
      somebody who wanted the VIEWS that follow a template and got the
      templates
    expect: >
      a handful of elements where they expected hundreds of views. This returns
      the templates themselves; the views following one are read through
      REPORT_VIEW_TEMPLATE_CONTROL

  - given: >
      the result passed to a delete without reading matchedNames, on a project
      where two of the "unused" templates are view-type defaults
    expect: >
      nothing here stops that, and the reason string is the only warning given.
      This fragment deletes nothing by design - the judgement of what should go
      is the modeller's, and it is stated in the finding for exactly this
      reason

second_route: >
  Revit's View Templates dialog lists them and its Purge Unused shows a subset
  of the unused ones. Neither shows which template a view family type hands to
  new views - that is read one view type at a time in the Type Properties of
  each, which is why it is gathered here.

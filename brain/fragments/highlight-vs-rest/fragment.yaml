compatibility-note: >
  One implementation for every release. `InsulationLiningBase.GetInsulationIds`,
  `GetLiningIds` and `HostElementId`, and `View.GetElementOverrides` /
  `SetElementOverrides`, are present 2020 through 2027 - read off the reference
  assemblies at both ends rather than remembered. `DuctInsulation`, `DuctLining`
  and `PipeInsulation` all derive from `InsulationLiningBase`, and there is no
  pipe lining class on any release, so those three are the whole set.

# GetInsulationIds AND GetLiningIds THROW for an id that cannot host a wrap, and
# catching per element IS the category test. Pre-filtering by category would be
# a second list to keep in step with Revit's own idea of what can be wrapped, and
# letting one throw escape would lose the whole view.

# ROUTING - repeated in OVERRIDE_GRAPHICS_IN_VIEW, COLOR_BY_PARAMETER and
# RESET_GRAPHIC_OVERRIDES.
#
#   "grey everything except the ducts" -> here
#   "do the grayout"                   -> here
#   "bring these forward and dim the rest" -> here
#   "make these red"                   -> OVERRIDE_GRAPHICS_IN_VIEW - one look
#                                         on a set, everything else untouched
#   "colour code by system"            -> COLOR_BY_PARAMETER - a colour PER
#                                         VALUE within the set
#   "put the colours back"             -> RESET_GRAPHIC_OVERRIDES

utterances:
  - grey everything except the ducts
  - do the grayout
  - bring these forward and dim the rest
  - highlight these against the rest
  - grey the background and show these

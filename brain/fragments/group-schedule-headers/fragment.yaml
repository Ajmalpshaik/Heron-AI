revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `ViewSchedule.GroupHeaders`,
  `UngroupHeaders`, `CanGroupHeaders`, `CanUngroupHeaders` and `GetTableData`,
  `TableData.GetSectionData(SectionType)`, `TableSectionData.FirstRowNumber`,
  `LastRowNumber`, `FirstColumnNumber`, `GetCellText` and `GetMergedCell`,
  and `TableMergedCell.Top`, `Left`, `Bottom` and `Right` are present with the
  same signatures 2020 through 2027 - looked up with tools/api-surface
  --members on all eight releases, 2026-11-01. A column is found by its
  ScheduleField, never by reading an id as a number. No units call is made.

# ROUTING - the same rows are in the fragments named here.
#
#   "group the Width and Height headers under Size"
#                                        -> here
#   "ungroup the Size heading"           -> here, mode ungroup
#   "rename the column heading"          -> SET_SCHEDULE_APPEARANCE. One
#                                           column's own heading, not a
#                                           caption over several
#   "move the Length column next to Size"
#                                        -> SET_SCHEDULE_FIELD_ORDER. A group
#                                           takes neighbouring columns as they
#                                           stand; reorder first
#   "hide the schedule headers"          -> SET_SCHEDULE_OPTIONS, showHeaders
#   "group the schedule by system type"  -> SET_SCHEDULE_SORT_GROUP. Grouping
#                                           ROWS, not headings

utterances:
  - group these column headers under one heading
  - put a heading over the width and height columns
  - group the schedule headers
  - ungroup the schedule headers

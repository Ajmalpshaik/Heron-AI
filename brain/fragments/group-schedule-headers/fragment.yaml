id: FRG-VIEW-156
semantic-identity: "group neighbouring schedule column headings under one caption, or ungroup them"
kind: action
domain: revit.schedules
capability: GROUP_SCHEDULE_HEADERS
version: 1
source: OFFICIAL
risk: MODIFY

# WRITTEN 2026-11-01 FOR FRAGMENT-ISSUES ROW 5b-1367, Ajmal PS's check of
# every schedule setting Heron could not reach (NEEDS-CHECKING Group KK). A
# grep of every fragment's C# found no ViewSchedule.GroupHeaders,
# UngroupHeaders, CanGroupHeaders or CanUngroupHeaders.
#
# A NEW CARD. SET_SCHEDULE_APPEARANCE renames ONE column's heading; a group
# caption is a cell above several headings, made and removed by its own
# Revit command (Modify Schedule/Quantities, Group / Ungroup).
#
# THE CELL NUMBERS ARE AN ASSUMPTION THE PROOF SETTLES: GroupHeaders takes
# table row and column numbers, and the reference does not say which section
# numbers them. The body section is taken, the heading row is READ rather
# than guessed, and Revit's own CanGroupHeaders decides before anything is
# written - the C# header says it in full.
purpose: >
  Groups the headings of neighbouring schedule columns under one caption -
  "Size" over Width and Height - or ungroups a caption that is there. The
  first and last column are named by field name or printed heading, and
  every column between them in the schedule's order is in the group. Revit is
  asked whether the headings can be grouped before anything is written, and
  the table is read again afterwards to find the caption above the columns.

  A name answering to two columns touches neither; a hidden column is refused,
  because it has no heading on the sheet. The columns themselves - their
  data, headings and widths - are not changed.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # The first and last column of the group, by field name or by the heading
    # as it prints. Their order does not matter.
    - name: fromColumn
      type: string
      source: request
    - name: toColumn
      type: string
      source: request
    # The caption printed above the group. Left out it is "none" - a blank
    # caption when grouping; when ungrouping, the caption over those columns,
    # whatever it reads.
    - name: caption
      type: string
      source: request
      optional: true
      absent: none
    # "group" or "ungroup". Left out it is "group".
    - name: mode
      type: string
      source: request
      optional: true
      absent: group
  provides:
    - name: grouped
      # Schedules where the group was made or removed and read back.
      role: result
      type: int
    - name: applied
      # Per schedule, the columns grouped or ungrouped, the cell numbers used,
      # and what a second read of the table found above them. ONE STRING.
      role: result
      type: string
    - name: notPresent
      # Column names the schedule does not carry. The evidence it looked,
      # never a thing it found (D-52).
      role: accounting
      type: IList<string>
    - name: refused
      # Why it declined, in the user's words - a name answering to two
      # columns, a hidden column, headers switched off, Revit's own
      # CanGroupHeaders saying no with the cells it was asked about (D-52).
      role: accounting
      type: IList<string>


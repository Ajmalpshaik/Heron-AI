compatibility-note: >
  One implementation for every release. Document.ActiveProjectLocation,
  ProjectLocation.GetProjectPosition(XYZ) with ProjectPosition.EastWest,
  NorthSouth and Elevation, RevitLinkInstance.GetLinkDocument and
  Instance.GetTotalTransform are present 2020 through 2027 - read off
  RevitAPI.xml in the Nice3point reference packages for all eight releases on
  2026-10-12.


# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# Two points of each link - its internal origin and 30 m east of it - get
# their shared coordinates in the link's own system and in this model's after
# the link's placement. Within toleranceMm for both, the link sits where its
# own shared coordinates say. Otherwise the E/W, N/S and elevation difference
# is printed for both points; a difference that changes between them is a
# rotation.
#
# A link placed origin to origin on purpose disagrees, which is true: it is
# not where the survey says it is.
#
# REPORT_LOCATION reads this model's site and True North; this compares links
# against it.
#
# READ ONLY - opens no transaction.
purpose: >
  Checks every loaded Revit link against this model's shared coordinates and
  names the links that do not sit where their own shared coordinates say, with
  the difference in millimetres.

contract:
  needs:
    - name: doc
      type: Document
    # How close counts as agreeing; 0 means 1 mm.
    - name: toleranceMm
      type: double
      source: request
  provides:
    - name: coordinates
      # ONE STRING, a line per link.
      role: result
      type: string
    - name: mismatched
      # Links that disagree beyond the tolerance (D-52).
      role: result
      type: IList<string>
    - name: agreeing
      role: accounting
      type: int
    - name: findings
      type: IList<string>


compatibility-note: >
  One implementation for every release. `Element.GetDependentElements`,
  `DocumentValidation.CanDeleteElement` and `JoinGeometryUtils` are unchanged
  2020 to 2027, and so are the members version 2 reads -
  `Dimension.AreReferencesAvailable`, `References`, `DimensionShape` and
  `Reference.ElementId`, read 2026-11-26 off the shipped assemblies with
  `tools/api-surface --members`. From 2025 a dimension is a
  `LinearDimension`, `RadialDimension` or `ArcLengthDimension`; all derive
  from `Dimension`, so `OfClass(typeof(Dimension))` finds them on every
  release, and the shape is read from `DimensionShape`, never from the class. `JoinGeometryUtils.GetJoinedElements` throws rather than
  returning empty for an element that cannot be joined at all - a tag, a view -
  so it is guarded per element rather than assumed to be answerable, which is
  the difference between a report and a crash on a mixed selection.
#   "what is attached to this element"   -> here
#   "put these walls on another level"   -> SET_ELEMENT_LEVEL, which
#                                           changes what a wall is attached
#                                           TO without moving it

utterances:
  - can I delete this
  - what breaks if I move this
  - what is attached to this element
  - what goes with it
  - is anything tagging this
  - why can I not delete that

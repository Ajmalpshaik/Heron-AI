id: FRG-QA-009
semantic-identity: "what else goes if this element goes"
kind: action
domain: revit.qa
capability: REPORT_ELEMENT_DEPENDENCIES
version: 3
source: OFFICIAL
risk: READ

# VERSION 3 (2026-11-26, FRAGMENT-ISSUES row 5b-2068, issue #1478) - A FREE
# ELEMENT LEAVES NOTHING TO COUNT. Version 2 keyed `dependents` by every
# element given, an empty list for a free one, and `goesTotal` always counts
# the elements themselves - so on Revit 2020 three free walls read "dependents
# 3 entry(ies), goesTotal 3" and the negative could never read empty. Now only
# an element something goes with is a key of `dependents` (as `joined` already
# was), and `goesTotal` is `accounting`: its value is unchanged and still what
# DELETE_ELEMENTS is handed as expectedCount, but it is never 0 for a selection,
# so it is not the evidence. RESHAPED RATHER THAN PROVED BY TRACKING (D-53):
# version 1's tracking rows matched "N entries for N elements given", which a
# fragment that read nothing at all would also match. impl/ changed, so still
# DRAFT, owing NEEDS-CHECKING Group RD and Group QT (D-30).
#
# VERSION 2 (2026-11-26, FRAGMENT-ISSUES row 5b-1990, issue #1278) - EVERY
# DIMENSION THAT MEASURES TO WHAT GOES, IN EVERY VIEW, AND BACK TO DRAFT.
# Version 1 trusted `GetDependentElements(null)` to be the whole of what a
# delete takes. Measured 2026-11-23 on Revit 2020, project
# 4355-BHVD-3D-60P00-BL003A: three in-place Mechanical Equipment units
# reported 36 dependents; the delete of them took 62 elements and cut 26
# dimensions that measured to them and to something else. Version 2 also
# reads every dimension in the model - no view, so sections, elevations and
# 3D views too - and names each one whose references touch the elements or
# their dependents: DELETED when too few references would be left
# (`dimensionsDeleted`, only those Revit did not already list), CUT when a
# linear string keeps two or more (`dimensionsCut`); each with its view in
# `dimensionLines`, and `goesTotal` the count Revit's Delete box should show.
# A filter on GetDependentElements was not the fix: a filter narrows the same
# list. Version 1 was PROVEN on 2026-09-09 (the proof block below, kept as the
# record); its C# moved, so it is DRAFT until NEEDS-CHECKING group QT is run
# (D-30).

purpose: >
  For each element, what Revit would take away with it - the tags, dimensions,
  hosted families, sketch lines and openings - and, separately, whether Revit
  would allow the deletion at all. Asked BEFORE the change rather than
  discovered after it.

  **THE DEPENDENTS ARE REVIT'S OWN LIST, AND IT IS NOT EVERYTHING A DELETE
  TAKES.** `GetDependentElements(null)` returns what Revit itself considers
  attached: a tag that references the element, a family hosted in it, the
  sketch a floor is drawn from, an opening cut through it. It can leave out a
  dimension that measures to the element, so every dimension in the model,
  in every view, is read as well, and each one that measures to what goes is
  named as deleted or cut.

  **THE LIST ALWAYS CONTAINS THE ELEMENT ITSELF.** That is not a defect and it
  must not be stripped blindly - it is why a count reads one higher than
  expected. It is excluded from `dependents` and reported as its own fact, so
  the number is never quietly wrong in either direction.

  **"CAN I DELETE IT" IS A SECOND QUESTION AND REVIT ANSWERS IT DIRECTLY.** An
  element can have zero dependents and still be undeletable - pinned, the last
  level, owned by another user in a workshared model. Both are asked, because
  either one alone gives a confident wrong answer to "is this safe to remove".

  **JOINED AND CUT ARE REPORTED SEPARATELY AND ON PURPOSE.** Revit does not
  delete a joined neighbour; it re-cleans the geometry. A wall joined to three
  others changes shape when one goes, and that change appears in a drawing
  nobody was looking at. Folding it in with the dependents would say the wrong
  thing about it in both directions.

  **WHAT IT CANNOT SEE, SAID OUT LOUD:** a reference from a linked model,
  which sheets show the element, and what a delete changes in a view itself
  (on 2026-11-23 a delete also modified seven 3D views). A clean report here does not mean nothing
  downstream breaks.

contract:
  needs:
    - name: elements
      type: IList<Element>
    - name: doc
      type: Document
      source: ambient
  provides:
    - name: dependents
      # VERSION 3: only the elements something goes with are keys - a free
      # element is left out, as in `joined` (row 5b-2068).
      role: result
      type: IDictionary<ElementId, IList<ElementId>>
    - name: joined
      # Neighbours Revit does not delete but DOES re-clean the geometry of.
      # JOINED AND CUT ARE REPORTED SEPARATELY AND ON PURPOSE - a wall joined
      # to three others changes shape when one goes, in a drawing nobody was
      # looking at.
      role: result
      type: IDictionary<ElementId, IList<ElementId>>
    - name: undeletable
      # CAN I DELETE IT IS A SECOND QUESTION AND REVIT ANSWERS IT DIRECTLY -
      # an element can have zero dependents and still be undeletable: pinned,
      # the last level, owned by somebody else.
      role: result
      type: IList<ElementId>
    - name: standalone
      # Elements nothing goes with. The evidence it looked; the dependents and
      # the undeletable ones are the answer (D-52).
      role: accounting
      type: IList<ElementId>
    - name: dimensionsDeleted
      # VERSION 2. Dimensions in any view that measure to what goes - the
      # elements or a dependent - and keep too few references to stand, which
      # Revit did NOT list as a dependent. A delete takes these too.
      role: result
      type: IList<ElementId>
    - name: dimensionsCut
      # VERSION 2. Linear dimensions in any view that measure to what goes and
      # keep two or more references: not deleted, but their segments to what
      # goes are removed - a changed drawing nobody asked for.
      role: result
      type: IList<ElementId>
    - name: dimensionLines
      # VERSION 2. One line per dimension that measures to what goes, deleted
      # or cut: its view, kind, id, DELETED or CUT, how many of its references
      # are on what goes and how many stay, and which ids it measures to.
      role: result
      type: IList<string>
    - name: goesTotal
      # VERSION 2. Every distinct element the delete is expected to take - the
      # elements, Revit's dependents and `dimensionsDeleted` - the number
      # Revit's Delete box should show. Expected, not promised (group QT).
      # ACCOUNTING FROM VERSION 3 (row 5b-2068): it counts the elements given,
      # so it is never 0 for a selection and cannot say nothing goes with them.
      role: accounting
      type: int
    - name: dimensionsRead
      # VERSION 2. How many dimensions in the model were read - the evidence
      # the model was looked at, not one view (D-52).
      role: accounting
      type: int
    - name: dimensionsUnread
      # VERSION 2. Dimensions whose references Revit would not give: looked
      # at, not answered. Never counted as clear of what goes.
      role: accounting
      type: IList<ElementId>


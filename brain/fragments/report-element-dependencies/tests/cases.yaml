# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: a TAGGED door hosted in a wall
    expect: >
      its tag among the dependents, and `goesTotal` the number Revit's own
      Delete box shows when you press Delete on that door by hand (then
      Escape). Version 1 claimed Revit's dependents list WAS that set; on
      2026-11-23 it was 36 against a delete of 62 (row 5b-1990), so the
      number is compared, not assumed

  - given: a wall joined to three others
    expect: >
      those three in `joined` and NOT in dependents. Revit does not delete them;
      it re-cleans the geometry, and the wall changes shape in a drawing nobody
      was looking at

  - given: a floor drawn from a sketch, with an opening cut through it
    expect: >
      the sketch lines and the opening among the dependents. These are the ones
      nothing could derive by hand, and are why Revit's own call is used

  # VERSION 2 (row 5b-1990). Each of these fails on version 1, which never
  # read a dimension outside Revit's dependents list.
  - given: >
      a family instance with ONE dimension from it to a grid drawn in a
      SECTION (not the active view), and a three-reference linear string
      grid - instance - grid drawn in an ELEVATION
    expect: >
      the section's dimension in `dimensionsDeleted` (one reference would be
      left) unless Revit already listed it among the dependents, and the
      elevation's string in `dimensionsCut` (two stay); each a line in
      `dimensionLines` naming its own view, DELETED or CUT, and "1 of its 2" /
      "1 of its 3" references on what goes. Run with a plan open, not either
      view - the answer must not change with the active view. `goesTotal`
      equals the count in Revit's Delete box for the instance; afterwards the
      elevation's string still exists with two references

  - given: an in-place family whose dimensions measure to its own parts
    expect: >
      a dimension to one of the in-place family's parts is named the same as
      one to the instance - its parts are dependents, and what goes is the
      instance AND its dependents

negative:
  - given: >
      a dimension in another view between two elements that are NOT in the
      set and are not dependents of it - two grids beside the instance
    expect: >
      it is in neither `dimensionsDeleted` nor `dimensionsCut` and has no line
      in `dimensionLines`; `dimensionsRead` counts it. A version that named
      every dimension near the element, or every dimension in the view, fails
      here

  - given: an element with nothing attached to it at all
    expect: >
      NO key for it in `dependents`, and its id in `standalone`. THE COUNT MUST
      BE 0 AND NOT 1 - the raw call always returns the element itself, and a
      fragment that forgets that reports every free element as having one
      dependent. Version 3 (row 5b-2068): version 2 wrote an empty list for it

  # VERSION 3 (row 5b-2068, issue #1478) - THE BATCH NEGATIVE. Fails on
  # version 2, which keyed `dependents` by every element given.
  - given: >
      three walls with nothing attached, nothing joined, not pinned - the
      night's arrangement on the Revit 2020 MEP sample
    expect: >
      dependents 0 entry(ies), joined 0, undeletable 0, dimensionsDeleted 0,
      dimensionsCut 0, dimensionLines 0 - read as EMPTY by batch-prove; the
      three walls in `standalone`, and `goesTotal` 3 (the walls themselves -
      accounting, the number DELETE_ELEMENTS would be handed)

  - given: a PINNED element with no dependents
    expect: >
      its id in `undeletable` and NOT in `standalone`. Zero dependents does not
      mean deletable, and reporting only the attachments would say "safe to
      remove" about something Revit will refuse

  - given: a TAG or a VIEW in the set, which cannot be joined to anything
    expect: >
      no entry in `joined` and no throw. GetJoinedElements throws rather than
      returning empty for those, so on a mixed selection an unguarded call loses
      the whole report rather than one row

  - given: an element referenced only from a LINKED model
    expect: >
      it reports as standalone, and that is the KNOWN LIMIT. This sees what
      Revit knows inside this file; a clean report here does not prove nothing
      downstream breaks

second_route:
  - >
    press Delete on the element in Revit and read the warning dialog, then
    press Escape - the dialog lists what this fragment should have reported

# sentences moved to DRAW_FAMILY_FILLED_REGION. Its view, regionType and
# boundary inputs are workPlane, regionType (by name) and shapes there - the
# boundary in millimetres in that card's shape language rather than XYZ points
# in feet. DRAW_FAMILY_FILLED_REGION was kept rather than this card because
# more of the library points at it - nine family-building skills,
# SET_FAMILY_CATEGORY's table and the family jobs - and it already drew
# masking regions. Nothing this card did was left behind. The proof below is
# the record of what this card's code did, not a claim about today.
deprecated:
  date: '2026-11-01'
  by: Ajmal PS
  superseded-by: DRAW_FAMILY_FILLED_REGION
  why: >
    The same job: draw a filled or masking region from closed loops.
    DRAW_FAMILY_FILLED_REGION version 2 draws in a project's view as well as
    inside a family - the view named as the Project Browser shows it, a view
    that takes no annotation (a 3D view, a schedule) or a template refused
    with the reason, a view at an angle read along its right and up, and the
    answer saying every time that a filled region is annotation, in one view
    only, in no schedule.

purpose: >
  Draws a filled region - a hatched or solid patch - inside one view, from a
  closed boundary. The drafting patch: a shaft marked up, an area shaded on a
  key plan, a zone coloured on a coordination drawing.

  **It exists in ONE view and nowhere else.** A filled region is annotation, not
  model. It does not appear on any other drawing, it is not in the model, and it
  schedules as nothing. That is exactly right for a markup and exactly wrong for
  anybody who thinks they have modelled something.

  **The boundary closes itself** - the last point joins back to the first - and
  must not cross itself.

  **The view has to be one that takes annotation.** A 3D view does not, and is
  refused with the reason rather than throwing something obscure.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: view
      type: View
      source: request
    - name: regionType
      type: FilledRegionType
      source: request
    # Internal units, in the view's own plane.
    - name: boundary
      type: IList<XYZ>
      source: request
  provides:
    - name: created
      role: result
      type: ElementId
    - name: findings
      type: IList<string>


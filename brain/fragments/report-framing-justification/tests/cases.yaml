# REPORT_FRAMING_JUSTIFICATION - built 2026-11-02 in a cloud session with no
# Revit. NOT RUN. Arranged on Group ML's "framing-ml" (see
# SET_FRAMING_JUSTIFICATION's cases): beam B1 between two columns at Revit's
# defaults, beam B2 set to yz Justification Independent by hand, column C1.
# The members are handed in by FILTER_ELEMENTS_BY_ID.

positive:
  - given: framing-ml, B1 handed in - the job file's positive
    expect: >
      justifications one line, "Structural Framing '...' (id <B1>): yz
      Justification Uniform; y Justification Center; z Justification Top; y
      Offset Value 0 mm; z Offset Value 0 mm; Start Level Offset 0 mm; End
      Level Offset 0 mm" - the same words as B1's Properties, LOOKED AT

  - given: B2 handed in
    expect: >
      one line with yz Justification Independent and Start / End y and z
      Justification and Offset Value, each as Properties shows it

negative:
  - given: framing-ml, column C1 handed in - the job file's negative
    expect: >
      justifications empty; notFraming "Structural Columns '...' (id <C1>):
      not structural framing - it has no yz justification". THE FIRST CASE TO
      RUN

  - given: B1 after SET_FRAMING_JUSTIFICATION set z Justification Bottom (kept in a scratch copy)
    expect: >
      B1's line reads z Justification Bottom and nothing else changed - a
      tracking check that the read follows the model, never a fixed answer

second_route: >
  Revit itself: select B1 and B2 and read the same values in Properties
  under Geometric Position, and Start / End Level Offset under Constraints

# WHY IT EXISTS - a comment, not `purpose`, because `purpose` is searched.
# 2026-11-02: the request was to "set AND READ the structural framing
# yz-justification, y/z offsets and start/end level offsets". The setting is
# SET_FRAMING_JUSTIFICATION's, a write; reading is a question, and a question
# never reaches a write (D-86). Measured 2026-11-02 on a scratch store of this
# change before this card existed: the probe "what is the z justification of
# this beam" - nobody's words - reached SET_FRAMING_JUSTIFICATION through
# `find` with no question flag, words #1 and nearness #1.
#
# LOOK-ALIKES, KEPT SEPARATE (heron-duplicate-checker's method, 2026-11-02):
#   READ_ELEMENT_PARAMETERS           reads ONE parameter named exactly. A
#     member's justification is up to fourteen parameters, which ones depend
#     on its own yz Justification, and the choices are numbers underneath -
#     this reads the set that applies, each choice in Revit's own word.
#   REPORT_WALL_JOIN_TYPE (DRAFT)  walls' end joins, not framing.
#
# THE WORDS. Two declared, the request's own "read" of the two the write
# declares. No other sentence is declared until a modeller says one.
kind: filter
domain: revit.elements
capability: REPORT_FRAMING_JUSTIFICATION
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Reports, for each structural beam and brace handed in, where it sits on its
  own line as Properties shows it - yz uniform or independent, y and z (at
  each end when independent), the y and z offset values, and the start and
  end level offsets in millimetres - and changes nothing.

contract:
  needs:
    - name: doc
      type: Document
    # Structural framing - the selection, or the chain. Anything else is
    # named in notFraming, never read as framing.
    - name: elements
      type: IList<Element>
  provides:
    - name: justifications
      # One line per member: its name and id, then each value as Properties
      # names it, a choice in Revit's own word, a length in millimetres, and
      # a parameter it does not carry as "absent".
      role: result
      type: IList<string>
    - name: notFraming
      # Elements handed in that are not structural framing, named. The
      # evidence it looked, never a value it read (D-52).
      role: accounting
      type: IList<string>
    - name: findings
      type: IList<string>


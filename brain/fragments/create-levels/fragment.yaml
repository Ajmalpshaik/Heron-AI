id: FRG-DOC-008
semantic-identity: "add storeys to the project"
kind: action
domain: revit.document
capability: CREATE_LEVELS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Creates levels at the elevations given, and reports what each one ended up at
  and what it ended up called.

  **A LEVEL NAME THAT ALREADY EXISTS IS REFUSED BY REVIT, AND THE REFUSAL IS THE
  INTERESTING PART.** The level is created first and named second, so a name
  clash leaves a real level in the model carrying whatever Revit called it -
  `Level 7` when `Level 3` was asked for. Reporting only a count hides that
  completely: the number is right and the browser is wrong. `namedAs` returns
  the name each level actually has.

  **THE ELEVATION IS READ BACK AS `ProjectElevation`.** That is the one in the
  same space as everything else in the model. `Elevation` is measured from
  whatever the level type's base says, so reading it back would confirm a number
  that was never in question and miss a survey offset entirely.
  `REPORT_LEVEL_ELEVATIONS` is the fragment that says whether the two differ on
  this model.

  **AN ELEVATION THAT ALREADY HAS A LEVEL IS SKIPPED, NOT STACKED.** Two levels
  at the same height is legal in Revit and is almost never wanted - it makes
  every view range and every "which level is this on" answer ambiguous, and it
  is the shape a re-run of this job takes if nothing guards it.

  **IT DOES NOT SPACE THEM.** *"Four more floors at 3.5 m"* is arithmetic, and
  arithmetic between two Revit calls belongs to the host (D-01). Handing this
  fragment a count and a spacing would put a second idea of what a storey height
  is inside the library.

contract:
  needs:
    - name: doc
      type: Document
    - name: elevations
      type: IList<double>
      source: request
    - name: names
      type: IList<string>
      source: request
  provides:
    - name: created
      role: result
      type: IList<ElementId>
    - name: namedAs
      role: result
      type: IDictionary<ElementId, string>
    - name: elevationOf
      role: result
      type: IDictionary<ElementId, double>
    - name: nameRefused
      # Levels Revit would not let take the name asked for. The evidence it
      # tried and was refused; the name each one ACTUALLY carries is in
      # `namedAs`, which is the result. Never a level it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: alreadyThere
      # Elements that were ALREADY in the state asked for, so there was
      # nothing to do. The evidence it looked, never a change it made
      # (D-52).
      role: accounting
      type: IList<double>


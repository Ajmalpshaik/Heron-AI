purpose: >
  Creates levels at the elevations given - one level or many - and reports what
  each one ended up at and what it ended up called.

  **A NAME ALREADY TAKEN IS REFUSED BEFORE ANY LEVEL IS CREATED** (version 2,
  when CREATE_LEVEL was merged in). Every name asked for is checked against
  the project's levels and against the other names in the call, ignoring
  capitals as Revit does, and one clash creates nothing: `refused` says which
  name clashed with which level. Version 1 created the level first and named it
  second, so a clash left a real level in the model under whatever Revit called
  it - `Level 7` when `Level 3` was asked for. `namedAs` still returns the name
  each level actually has, and `nameRefused` the ones whose name did not take.

  **A LEVEL REVIT WILL NOT CREATE IS NAMED, NEVER DROPPED** (version 2). Each
  refusal is recorded against its height and the whole job is then undone -
  nothing kept, one request one change (Article 8). Version 1 let it vanish
  and returned one level fewer with nothing said. It makes the levels and
  nothing else - `noViewsMade`, and the note below the contract. This is
  version 2; version 1's proof no longer describes the code and is kept as a
  record, and the fragment is DRAFT until it is proved again.

  **THE ELEVATION IS READ BACK AS `ProjectElevation`.** That is the one in the
  same space as everything else in the model. `Elevation` is measured from
  whatever the level type's base says, so reading it back would confirm a number
  that was never in question and miss a survey offset entirely.
  `REPORT_LEVEL_ELEVATIONS` is the fragment that says whether the two differ on
  this model.

  **AN ELEVATION THAT ALREADY HAS A LEVEL IS SKIPPED, NOT STACKED.** Two levels
  at the same height is legal in Revit and is almost never wanted - it makes
  every view range and every "which level is this on" answer ambiguous, and it
  is the shape a re-run of this job takes if nothing guards it.

  **IT DOES NOT SPACE THEM.** *"Four more floors at 3.5 m"* is arithmetic, and
  arithmetic between two Revit calls belongs to the host (D-01). Handing this
  fragment a count and a spacing would put a second idea of what a storey height
  is inside the library.

contract:
  needs:
    - name: doc
      type: Document
    - name: elevations
      type: IList<double>
      source: request
    - name: names
      type: IList<string>
      source: request
  provides:
    - name: created
      role: result
      type: IList<ElementId>
    - name: namedAs
      role: result
      type: IDictionary<ElementId, string>
    - name: elevationOf
      role: result
      type: IDictionary<ElementId, double>
    - name: nameRefused
      # Levels Revit would not let take the name asked for. The evidence it
      # tried and was refused; the name each one ACTUALLY carries is in
      # `namedAs`, which is the result. Never a level it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: alreadyThere
      # Elements that were ALREADY in the state asked for, so there was
      # nothing to do. The evidence it looked, never a change it made
      # (D-52).
      role: accounting
      type: IList<double>
    - name: refused
      # Version 2, from CREATE_LEVEL. The sentence saying which name asked for
      # is already taken, and by which level - and that NO level was created.
      # Null when nothing was refused. Why it declined, never a thing it made
      # (D-52).
      role: accounting
      type: string
    - name: noViewsMade
      # Version 2, from CREATE_LEVEL. Always true: no floor plan and no ceiling
      # plan were made, which is this fragment stating what it deliberately
      # does NOT do. Never a thing it created (D-52).
      role: accounting
      type: bool


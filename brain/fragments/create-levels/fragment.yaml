compatibility-note: >
  One implementation for every release. `Level.Create`, `Level.Name` and
  `Level.ProjectElevation` are unchanged 2020 to 2027. `elevations` arrive in
  millimetres and are divided by 304.8 in the code (D-71); what comes back -
  `elevationOf` and `alreadyThere` - stays in Revit's internal feet. No units
  API is touched, which is what keeps this clear of the 2021 units move. (This
  note said "Elevations arrive and are returned in Revit's internal feet",
  with D-20 keeping the millimetre conversion at the edge, until 2026-09-24,
  while the code and its own proof - 4000 in, 13.12 feet used - said
  millimetres. The returning half was true all along.)

# VERSION 2 (2026-11-01) - CREATE_LEVEL WAS MERGED INTO THIS CARD on the
# owner's instruction ("now merge the other duplicates also"), and is
# DEPRECATED. The same job - a level at a height, named - and this card already
# made one or many, skipped a height that has a level, and read back the name
# and the height each one ended with. What CREATE_LEVEL had and this one lacked
# is here now: a name already taken refused BEFORE anything is created,
# ignoring capitals, with a sentence (`refused`); `noViewsMade`; and "Revit
# declined" when Level.Create returns null - which, with a level Revit throws
# on, is now named and undoes the job rather than vanishing in a catch. Its
# `created` (one id) is one entry of this card's `created`; its `elevationMm`
# and `levelName` are one entry of `elevations` and `names`. Row 5b-1347's
# contest between the two level cards for "add four more floor levels" ends
# here: there is one level card.
#
# NOT CARRIED, ON PURPOSE: CREATE_LEVEL took a base-point shift off the height
# (`existing.ProjectElevation - existing.Elevation`, measured on any level)
# before Level.Create. This card passes the height straight in and reads it
# back as ProjectElevation. Which of Elevation and ProjectElevation is measured
# from where is FRAGMENT-ISSUES row 5b-180, OPEN until a real Revit answers it
# on a model whose base point has moved - so this card's reading stays as it
# was, and the shift is not carried until that row is settled.
#
# WHAT IT MAKES, AND WHAT IT DOES NOT (carried from CREATE_LEVEL, and kept out
# of `purpose` for the reason it gave). Revit's Level TOOL creates a floor plan
# and a ceiling plan alongside the level, because the tool does that - not
# because the level does. Created here the level exists, appears in every
# elevation, and is offered on every Level parameter, with NO PLAN VIEW AT ALL.
# The modeller looks in the Project Browser, finds nothing, and reports that it
# failed. It did not. `noViewsMade` is always true and exists to be said out
# loud, and CREATE_PLAN_VIEW is the other half of the job. That paragraph sat in
# CREATE_LEVEL's `purpose` until 2026-09-01, where it is INDEXED, and it took
# "the new level has no plan" off CREATE_PLAN_VIEW.

# ROUTING - repeated in CREATE_GRIDS, REPORT_LEVEL_ELEVATIONS and SET_ELEMENT_LEVEL.
#
#   "add a level"                        -> here, one level
#   "add four more floor levels"         -> here - many at once
#   "list the levels"                    -> REPORT_LEVEL_ELEVATIONS
#   "move these to level 3"              -> SET_ELEMENT_LEVEL - reassigns
#                                           EXISTING elements; it creates
#                                           nothing
#   "make the plan for it"               -> CREATE_PLAN_VIEW. A level created
#                                           through the API has no views; that
#                                           fragment makes them, and the two
#                                           together are what "add 4 more
#                                           floors" actually means
#   "make a grid series across the building" -> CREATE_GRIDS - the same
#                                        one-versus-many pair, for grids

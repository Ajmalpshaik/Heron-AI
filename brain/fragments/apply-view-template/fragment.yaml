heron-agent: HERON-REVIT-VIE-013
heron-step: 14
heron-status: DRAFT
heron-since: 0.1.0
heron-layer: brain

id: FRG-VIEW-011
semantic-identity: "put a view template on these views"
kind: action
domain: revit.views
capability: APPLY_VIEW_TEMPLATE
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Applies one view template to a set of views. The office's standard, applied
  the way it is meant to be applied — once, from a template — rather than by
  overriding each view by hand.

  **A view template LOCKS whatever it controls, and that is the whole point and
  the whole hazard.** Every setting the template includes stops being editable
  on the view. Graphic overrides somebody applied by hand are not deleted — they
  are overruled and become invisible and unreachable, which reads exactly like
  the work having been lost.

  **That makes this the fragment the grayout job has to route around.** Greying
  a background by category and then applying a template that controls
  V/G overrides silently discards the greyout. The order matters and neither
  call reports the conflict.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: views
      type: IList<View>
      source: request
    - name: templateId
      type: ElementId
      source: request
  provides:
    - name: applied
      type: int
    - name: alreadyOnIt
      # Elements that were ALREADY in the state asked for, so there was
      # nothing to do. The evidence it looked, never a change it made
      # (D-52).
      role: accounting
      type: int
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `View.ViewTemplateId` is a settable
  ElementId property on every release 2020 to 2027, and the template arrives as
  an ElementId object taken from a live view, so nothing here builds one from
  an integer.

# ROUTING - repeated in FIND_VIEWS_WITHOUT_TEMPLATE.
#
#   "apply the template to these"   -> here - the FIX
#   "which views have no template"  -> FIND_VIEWS_WITHOUT_TEMPLATE, which
#                                      finds what needs fixing and separates
#                                      the views that are ON SHEETS - those are
#                                      being issued
#   "put that filter on this view"   -> APPLY_VIEW_FILTER - ONE filter. A
#                                       template is a far bigger change and
#                                       is easy to ask for by mistake

# ROUTING - repeated in SET_CATEGORY_GRAPHICS and OVERRIDE_GRAPHICS_IN_VIEW.
#
#   "apply the view template"          -> here
#   "do the grayout"                   -> SET_CATEGORY_GRAPHICS - and CHECK
#                                         whether a template controls V/G on
#                                         that view first, or the grayout is
#                                         overruled the moment it is applied
#   "make all the architecture faint"  -> SET_CATEGORY_GRAPHICS
#   "put it back how it was"           -> RESET_GRAPHIC_OVERRIDES
#
# ROWS ADDED 2026-09-06, the other side of three crossings with the view
# template fragments built that day. The same rows are in each of them.
#
#   "set the view template"            -> HERE, and it is declared here, so
#                                         identity resolves it before any
#                                         ranking. REMOVE_VIEW_TEMPLATE ranks
#                                         high on it by wording alone and must
#                                         never win it - a request to put a
#                                         standard ON a view answered by the
#                                         fragment that takes one OFF is the
#                                         worst mistake in this cluster
#   "take the template off this view"  -> REMOVE_VIEW_TEMPLATE. It does NOT put
#                                         the view back how it looked before -
#                                         the settings stay and merely unlock
#   "why is this setting greyed out"   -> REPORT_VIEW_TEMPLATE_CONTROL. This
#                                         fragment is what caused it
#   "unlock ONE setting, keep the rest" -> SET_VIEW_TEMPLATE_CONTROL. Note it
#                                         edits the TEMPLATE, so it frees that
#                                         setting on every view following it
#   "save this view as the template"   -> CREATE_VIEW_TEMPLATE_FROM_VIEW, which
#                                         is where a template comes from before
#                                         this fragment can apply one
#
# A TEMPLATE BEATS A HAND OVERRIDE, SILENTLY. Neither call reports the
# conflict, and the override is not deleted - it is overruled and becomes
# unreachable, which reads as the work having been lost.

utterances:
  - apply the view template
  - put the standard template on these views
  - set the view template
  - use the office template on this view
  - apply the template to all these views

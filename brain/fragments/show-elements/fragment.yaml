id: FRG-VIEW-007
semantic-identity: "bring back elements that were hidden in this view"
kind: action
domain: revit.views
capability: SHOW_ELEMENTS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Undoes a hide. HIDE_ELEMENTS and ISOLATE_ELEMENTS could both take things off
  a view and nothing here could put them back, which made every hide a one-way
  door - the user says "show them again" and Heron has nothing to offer.

  **The two modes are NOT mirror images of hiding, and that asymmetry is the
  whole reason to read this fragment before using it.** A permanent hide is
  undone element by element. A temporary one CANNOT BE: Revit's only way out of
  temporary hide/isolate is to leave the mode entirely, which brings back
  everything anybody hid temporarily, not just the elements named here. So the
  temporary path ignores its own element list, and says so in
  `temporaryModeCleared` rather than reporting a count that would imply a
  precision it does not have.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: view
      type: View
      source: request
    - name: elements
      type: IList<Element>
    - name: permanent
      type: bool
      source: request
  provides:
    - name: shown
      role: result
      type: int
    - name: notHidden
      # Elements that were not hidden, so there was nothing to bring back.
      # Never a thing it showed (D-52).
      role: accounting
      type: IList<ElementId>
    - name: temporaryModeCleared
      # That the temporary hide/isolate mode was left entirely, WHICH BRINGS
      # BACK EVERYTHING ANYBODY HID TEMPORARILY, not just the elements named
      # here. A consequence far wider than the request.
      role: result
      type: bool
    - name: viewRefused
      # The view declined the change - a template owns the slot, or the view
      # cannot take it at all. The evidence it looked and said no, never a
      # change it made (D-52).
      role: accounting
      type: bool

proof:
  date: '2026-09-13'
  by: Ajmal PS
  model: test projject (3,509 elements), Revit 2024, session 40932
  positive_case: run as it would normally be run - the arrangement was re-made first by running
    select-in-region, set-selection with this phase's own values - run inside a transaction,
    and Revit reported the transaction group ROLLED BACK afterwards. returned notHidden 0
    item(s), permanent true, shown 3, temporaryModeCleared false, viewRefused false. inputs
    came view as given; elements from the selection (3); permanent as given. on test projject
  negative_case: run with minMm=-2000,23000,0, maxMm=14000,32000,4000, exact=false, categories=Ducts,
    view=HERON DUCT SCHEDULE, permanent=true instead - chosen because it should not contain
    what this fragment reports - the arrangement was re-made first by running select-in-region,
    set-selection with this phase's own values - run inside a transaction, and Revit reported
    the transaction group ROLLED BACK afterwards. returned notHidden 3 item(s) [925780, 925782,
    925784], permanent true, shown 0, temporaryModeCleared false, viewRefused false. inputs
    came view as given; elements from the selection (3); permanent as given. on test projject
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  caveat: >-
    `shown` IS ZERO BY DESIGN ON THE TEMPORARY PATH and that is not a fault. With `permanent:
    false` the fragment calls DisableTemporaryViewMode, which clears the whole mode rather than
    acting element by element, and `fragment.cs:17` says counting it would be 'a lie of exactly
    the shape this project keeps'. The legs above therefore use `permanent: true`, where
    `shown` means something. CHECKED FROM OUTSIDE: 6 ducts visible in '{3D}', 3 hidden for
    real, count 3, shown 3, count back to 6 - every count from a separate process.
  fingerprint: 241246c4c56f47e6
revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `View.UnhideElements`,
  `Element.IsHidden`, `View.DisableTemporaryViewMode` and the
  `TemporaryViewMode` enum are unchanged 2020 to 2027, and the view arrives as
  an object so no ElementId is built from an integer.

# ROUTING - these four all answer sentences about things not being visible, and
# the table is repeated in each of them rather than written here once. A
# cross-reference in one direction only routes whoever happens to land on the
# newer file.
#
#   "hide these"                        -> HIDE_ELEMENTS
#   "show me only these"                -> ISOLATE_ELEMENTS
#   "show them again" / "unhide"        -> here
#   "reset the view" / "put it back"    -> here, permanent false
#   "the ducts are not showing at all"  -> SET_CATEGORY_VISIBILITY, which is a
#                                          different cause with the same symptom:
#                                          a whole category switched off, not
#                                          these elements hidden

# ROUTING - repeated in ZOOM_TO_ELEMENTS.
#
#   "show them again"                     -> here. UNHIDES them. This is the
#                                            answer when a VIEW SETTING is
#                                            hiding them
#   "show me these"                       -> EITHER, and the difference is why
#                                            they cannot be seen. Hidden by the
#                                            view is here. Off the screen - on
#                                            another level, in another view -
#                                            is ZOOM_TO_ELEMENTS, which moves
#                                            the camera and unhides nothing
#   "where is it"                         -> ZOOM_TO_ELEMENTS
#
# THE NAME OF THIS FRAGMENT IS A TRAP AND IT IS WORTH SAYING SO. `SHOW_ELEMENTS`
# reads like "put them on the screen" and means "undo a hide". The two jobs were
# one word apart in the earlier library too.

utterances:
  - unhide these
  - show them again
  - bring back what I hid
  - put them back on the view
  - reset the temporary hide
  - I hid them by mistake

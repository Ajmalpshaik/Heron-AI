compatibility-note: >
  One implementation for every release. `View.UnhideElements`,
  `Element.IsHidden`, `View.DisableTemporaryViewMode` and the
  `TemporaryViewMode` enum are unchanged 2020 to 2027, and the view arrives as
  an object so no ElementId is built from an integer.

# ROUTING - these four all answer sentences about things not being visible, and
# the table is repeated in each of them rather than written here once. A
# cross-reference in one direction only routes whoever happens to land on the
# newer file.
#
#   "hide these"                        -> HIDE_ELEMENTS
#   "show me only these"                -> ISOLATE_ELEMENTS
#   "show them again" / "unhide"        -> here
#   "reset the view" / "put it back"    -> here, permanent false
#   "the ducts are not showing at all"  -> SET_CATEGORY_VISIBILITY, which is a
#                                          different cause with the same symptom:
#                                          a whole category switched off, not
#                                          these elements hidden

# ROUTING - repeated in ZOOM_TO_ELEMENTS.
#
#   "show them again"                     -> here. UNHIDES them. This is the
#                                            answer when a VIEW SETTING is
#                                            hiding them
#   "show me these"                       -> EITHER, and the difference is why
#                                            they cannot be seen. Hidden by the
#                                            view is here. Off the screen - on
#                                            another level, in another view -
#                                            is ZOOM_TO_ELEMENTS, which moves
#                                            the camera and unhides nothing
#   "where is it"                         -> ZOOM_TO_ELEMENTS
#
# THE NAME OF THIS FRAGMENT IS A TRAP AND IT IS WORTH SAYING SO. `SHOW_ELEMENTS`
# reads like "put them on the screen" and means "undo a hide". The two jobs were
# one word apart in the earlier library too.

utterances:
  - unhide these
  - show them again
  - bring back what I hid
  - put them back on the view
  - reset the temporary hide
  - I hid them by mistake

positive:
  - given: >
      a new family from the metric Generic Model wall based template, nothing
      built in it yet
    expect: >
      familyKind "wall-based - placed only on a wall, which the template
      carries"; templateReport naming 1 wall among the host elements and Host
      as Family Category and Parameters shows it; planeList naming the
      template's own planes - Center (Left/Right) and Center (Front/Back) among
      them - each with where it sits and its Is Reference

  - given: a new family from the metric Generic Model line based template
    expect: >
      familyKind "line-based ..."; the built-in parameters naming Length as an
      instance parameter with its value in the current type; the planes the
      Length is measured between in planeList

  - given: a new family from the metric Curtain Panel Pattern Based template
    expect: >
      familyKind "a pattern-based curtain panel ..."; templateReport naming the
      tile pattern (Rectangle in a new one) and its spacing; pointList naming
      the placement points 1 to 4 with ids and positions; lineList naming the
      template's lines between them with their ids - the ids a form is built on

  # VERSION 2 - Revit 2024, whose per-user OmniClassTaxonomy.txt files 21
  # codes under Pipe Accessories.
  - given: >
      a new family from the metric Pipe Accessory template, after
      SET_FAMILY_SETTINGS "OmniClass Number=23.65.55.14.14"
    expect: >
      classificationCodes listing 21 codes as "code Title" joined by " || ",
      23.65.55.14.14 Isolation Valves for Liquid Services among them, then
      "21 code(s) ... Pipe Accessories, read from" and the per-user file's
      path; templateReport's settings showing OmniClass Number 23.65.55.14.14
      and OmniClass Title as Family Category and Parameters shows it

  # VERSION 3 - Revit 2020, where the owner's outdoor unit was built in a
  # template whose Length was Feet and fractional inches (2026-10-12). The
  # same case again on 2024 or later, for the ForgeTypeId route.
  - given: >
      a new family from an IMPERIAL Generic Model template (English-Imperial
      content, Length shown in Feet and fractional inches), nothing built
    expect: >
      templateReport naming "units: Length = Feet and fractional inches (no
      symbol), rounding" and the accuracy Manage > Project Units shows, then
      "- IMPERIAL"; a finding saying Length is not metric and naming
      SET_PROJECT_UNITS "Length=Millimeters, 0 decimal places" and a Metric
      template - and the same unit as REPORT_PROJECT_UNITS's Common: Length row

negative:
  - given: >
      a new family from the plain metric Generic Model template - not hosted
    expect: >
      familyKind "level-based - not hosted, placed on a level", host elements
      none, pointList empty - it must NOT read as wall-based or face-based

  - given: a project in front
    expect: notAFamily true and nothing read - classificationCodes empty

  - given: a new family from the metric Detail Item template
    expect: >
      classificationCodes saying the classification file gives Detail Items no
      code at all, with the path - a reason, NOT an empty answer; the 2024 file
      files none under that category

  - given: >
      a new family from the metric Generic Model template, Length in
      Millimeters
    expect: >
      templateReport naming "units: Length = Millimeters" ending "- metric",
      and NO finding about units - a metric family must not be told to change

second_route:
  - >
      Family Category and Parameters in the Family Editor - the Host row and the
      switches - and the Family Types dialog for the built-in parameters; the
      reference planes read by selecting each and reading Properties
  - >
      Manage > Project Units in the Family Editor, the Length row: its units,
      rounding and symbol against templateReport's units line
  - >
      The OmniClass Number button in Family Category and Parameters: the codes
      its dialog offers for the category against classificationCodes

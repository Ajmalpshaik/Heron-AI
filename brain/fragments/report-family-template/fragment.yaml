  `AdaptiveComponentFamilyUtils` point queries, `ModelCurve.IsReferenceLine`,
  and the built-in parameters `FAMILY_HOSTING_BEHAVIOR` ("Host"),
  `FAMILY_ALLOW_CUT_WITH_VOIDS`, `FAMILY_CONTENT_PART_TYPE`,
  `FAM_PROFILE_USAGE`, `FAMILY_STRUCT_MATERIAL_TYPE` and
  `STRUCTURAL_SECTION_SHAPE` read the same 2020 through 2027 (the RevitAPI
  reference assemblies and their XML documentation, read 2026-10-01 and
  2026-10-02). Which words Revit shows for Host, whether a face-based
  template's placement reads WorkPlaneBased with the Work Plane-Based switch
  off, and whether `IsCurtainPanelFamily` reads true for a classic curtain wall
  panel, and for a Generic Model Pattern Based family as well as a Curtain
  Panel Pattern Based one, are Revit's - recorded in NEEDS-CHECKING BV1.
  VERSION 2, THE OMNICLASS NUMBER (read 2026-10-11 with `tools/api-surface
  --members BuiltInParameter` over the 2020 to 2027 reference assemblies):
  `OMNICLASS_CODE` (-1002502) and `OMNICLASS_DESCRIPTION` (-1002503) on 2020
  to 2025 were RENAMED `CLASSIFICATION_CODE` and `CLASSIFICATION_DESCRIPTION`
  at 2026, same numbers, old names gone (tools/api-surface/changes.json). So
  the name the running Revit has is found at run time with `Enum.IsDefined`
  and `Enum.Parse` - one implementation, no #if - and shown with
  `LabelUtils.GetLabelFor(BuiltInParameter)`, 2020-2027: "OmniClass Number"
  and "OmniClass Title" up to 2025, "Classification Number" and
  "Classification Title" from 2026. The classification file is a plain file
  no API reads: only the per-user copy Revit itself reads, at
  `Application.CurrentUsersDataFolderPath` (2020-2027),
  "OmniClassTaxonomy.txt" to 2025 and "Classification_Taxonomy.txt" from
  2026, the one matching the parameter's name first. Revit refills that copy
  from its cache under ProgramData at start-up; the cache is not read here,
  because only HeronPaths may resolve a Windows special folder
  (tools/check-structure.py, docs/06 section 2). Rows are TAB separated - code, title, level,
  BuiltInCategory, the last possibly empty - and '#' lines are comments. The
  2020 to 2025 file holds Windows-1252 bytes and some titles end in a
  non-breaking space, so it is decoded strict UTF-8, then 1252, then Latin-1
  (28591, present on .NET 8 and 10 without a code-page provider), and every
  char.IsWhiteSpace character is trimmed. Revit 2026 and 2027 ship only a
  sample file filed under no category, and the answer says so. The category
  column is compared as `new ElementId(BuiltInCategory)` with
  `Family.FamilyCategory.Id` after `Enum.IsDefined` - never an ElementId read
  as a number, and not `Category.BuiltInCategory`, which is 2023 and later.
  VERSION 3, THE LENGTH UNITS (read 2026-10-12 with `tools/api-surface
  --members` over the 2020 to 2027 reference assemblies): `SpecTypeId.Length`,
  `ForgeTypeId.TypeId` and `ForgeTypeId.Empty()` exist 2021-2027 and not on
  2020; `FormatOptions.Accuracy` 2020-2027. So it reads the way
  REPORT_PROJECT_UNITS does, by reflection with one implementation: the
  ForgeTypeId route where `SpecTypeId` exists, `UnitType.UT_Length` with
  `DisplayUnits` and `UnitSymbol` on 2020. Metric is told from Revit's own id
  for the unit - every metric length unit's names a metre
  ("millimeters-1.0.1", DUT_METERS_CENTIMETERS) and no imperial one does -
  never from the label, which Revit translates. Whether a family document's
  Project Units read the same through these calls as a project's is Revit's,
  and is part of the proof below.
  VERSION 4, THE ORIENTATION (read 2026-10-29 with `tools/api-surface
  --members` over the 2020 to 2027 reference assemblies, one signature on all
  eight): `AdaptiveComponentFamilyUtils.GetPointOrientationType(Document,
  ElementId)` and the enum `AdaptivePointOrientationType` - ToHost,
  ToHostAndLoopSystem, ToGlobalZthenHost, ToGlobalXYZ, ToInstanceZthenHost,
  ToInstance - beside the `IsAdaptivePlacementPoint`,
  `IsAdaptiveShapeHandlePoint` and `GetPlacementNumber` calls version 1
  already made. The RevitAPI.xml of all eight releases says the call is "of
  an Adaptive Placement Point" and throws ArgumentException when the id "does
  not correspond to an Adaptive Placement Point" or not to "an Adaptive
  Family"; so it is asked of placement points only, and whether a
  pattern-based panel's points answer it is Revit's (JQ, with JK9).


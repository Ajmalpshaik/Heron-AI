id: FRG-DOC-037
semantic-identity: "what kind of family is open - wall, ceiling, floor, roof or face based, line based, adaptive, pattern based, profile, detail or annotation - what its template already holds, and its OmniClass Number and the codes that fit its category"
kind: action
domain: revit.families
capability: REPORT_FAMILY_TEMPLATE
# Version 4, 2026-10-29: each adaptive point's Orientation in pointList - see
# VERSION 4 below. Version 3 was PROVEN (2026-10-18); its proof is kept below
# as a record and no longer describes the code.
version: 4
source: OFFICIAL
risk: READ

purpose: >
  Says what KIND of family is open in the Family Editor, and what its template
  already holds, before anything is built in it: level-based, work-plane-based,
  face-based, wall-, ceiling-, floor- or roof-based, line-based, a line-based
  or ordinary detail item, an adaptive component, a pattern-based curtain
  panel or a classic curtain wall panel - told apart by the reference points
  only the pattern-based one can hold - a conceptual mass, a profile, an
  annotation or a title block.

  **THE TEMPLATE DECIDED IT AND NOTHING CHANGES IT.** A wall-based family cannot
  become a face-based one, a line-based family takes its Length from two clicks,
  a pattern-based panel is driven by its tile pattern's points. The method that
  builds each kind differs, so the kind is READ - from the family's own
  placement, its category, Revit's own flags and the host element the template
  carries - never guessed from the name.

  **WITH WHAT IS ALREADY THERE**, each on ONE line: the named reference planes,
  where each sits, what it faces, its Is Reference and Defines Origin; the host
  wall, ceiling, floor or roof; the built-in parameters with their values - a
  line-based family's Length, a door's Width and Height; the family's own
  switches, Host, Part Type, Profile Usage and a structural family's Material
  for Model Behavior and Section Shape among them; the reference
  lines and the lines drawn through points, with their ids; the adaptive
  points with their placement numbers, ids and Orientation; a pattern panel's
  tile pattern and spacing; the views; the types.

  It reads only; nothing is changed.

  **VERSION 2 (2026-10-11): THE OMNICLASS NUMBER AND TITLE** join the settings
  (Classification Number and Title from Revit 2026), and it lists the codes
  the classification file gives this family's category - what a family build
  proposes the code from - or says why there are none. Version 1's proof no
  longer describes the code and is kept below as a record; the fragment is
  DRAFT until it is proved again.

# VERSION 3 (2026-10-12): THE LENGTH UNITS join templateReport - which units
# the family shows a length in, its symbol and rounding, and whether that is
# metric - with a finding when it is not, so a template set to feet and
# inches is caught at a family build's first step rather than after it. A
# comment, not `purpose`, because `purpose` is searched: units words there
# moved "which template was this family made from" from 2nd to 3rd
# (check-routing, measured 2026-10-12). Version 2's proof is still owed;
# both are re-proved together (NEEDS-CHECKING DB15).
#
# VERSION 4 (2026-10-29, the owner's yes the same day): EACH ADAPTIVE POINT'S
# ORIENTATION joins its pointList row, after the position - "placement point
# 1 <id> at 0, 0, 0 mm, Orientation Host and Loop System (xyz)" - with one
# finding saying the placement points' Orientations together. So what
# SET_ADAPTIVE_POINT_ORIENTATION writes can be read back, and "what
# orientation are the adaptive points" is answered by a READ rather than
# landing on that write (D-86). The words are that card's own mapping, copied
# exactly, so the two print the same words for one value. A PLACEMENT point
# only is asked; a shape handle point reads "Orientation not read (shape
# handle point)" with no call made, and a placement point Revit refuses
# says Revit's reason - never a guessed value (D-52). Whether the point is a
# placement point or a shape handle was already in each row (version 1).
# Everything version 3 printed is printed as before; a family with no
# adaptive points gets nothing new. Version 3's proof (2026-10-18) no longer
# describes the code and is kept below as a record; the card is DRAFT until
# it is proved again (NEEDS-CHECKING Group JQ). A comment, not `purpose`,
# because `purpose` is searched.

contract:
  needs:
    - name: doc
      type: Document
  provides:
    - name: familyKind
      # The kind in a modeller's words - "wall-based - placed only on a wall,
      # which the template carries".
      role: result
      type: string
    - name: templateReport
      # Category, kind, the length units (version 3) - "units: Length =
      # Millimeters (mm), rounding 1 - metric", or "- IMPERIAL" - placement,
      # host elements, the family's switches, the built-in parameters, counts
      # of planes, lines, points, types, and the views - on ONE line.
      role: result
      type: string
    - name: planeList
      # Every reference plane on ONE line: name, the axis it faces, where it
      # sits in millimetres, Is Reference, defines origin, pinned.
      role: result
      type: string
    - name: pointList
      # Every adaptive point on ONE line, in placement order: its kind, number,
      # id and position in millimetres - and, version 4, its Orientation in
      # Revit's Properties words ("Orientation Instance (xyz)"); a shape handle
      # point "Orientation not read (shape handle point)". Empty for a family
      # with none.
      role: result
      type: string
    - name: lineList
      # Every reference line, and every line drawn through points, on ONE line:
      # its id, the points it runs through by placement number, its length. The
      # ids a form on lines is built from.
      role: result
      type: string
    - name: classificationCodes
      # VERSION 2. The codes the classification file gives THIS family's
      # category, on ONE line - "23.65.55.14.14 Isolation Valves for Liquid
      # Services || ..." - then how many and the path read; a list would reach
      # the reply cut to three. Where there are none, why, in words: no file
      # (every path tried), the file holds no code for the category, or the
      # sample Revit 2026 and later ship. Empty in a project.
      role: result
      type: string
    - name: notAFamily
      # That the document in front is a project, not a family being edited.
      role: accounting
      type: bool
    - name: findings
      type: IList<string>


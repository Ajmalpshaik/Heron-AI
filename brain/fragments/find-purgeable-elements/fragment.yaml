compatibility-note: >
  Document.GetUnusedElements(ISet<ElementId>) is present from 2024 and absent
  before - read off RevitAPI.xml in the Nice3point reference packages for all
  eight releases on 2026-10-13. Version 2 reaches it by reflection, so the one
  implementation compiles on all eight; on 2020-2023 it is absent and the
  placed-instance count answers instead, with `route` saying so.
  `Family.GetFamilySymbolIds()`, `Family.FamilyCategory` and
  `Element.GetTypeId()` are unchanged 2020 to 2027, and no ElementId is built
  from an int.

# ROUTING - the same rows are in the fragments named here.
#
#   "list everything purgeable in this family" -> here
#   "every unused element, all categories"     -> here, then DELETE_ELEMENTS
#   "purge unused"                             -> here, AS A LIST. Nothing here deletes;
#                                                 DELETE_ELEMENTS removes what the modeller
#                                                 has seen, and on 2020-2023 nothing is
#                                                 handed on at all
#   "which families are unused"                -> here (version 2), family by family, on
#                                                 every release
#   "purge the unused stuff"                   -> here, AS A LIST (FIND_UNUSED_FAMILIES'
#                                                 row, moved)
#   "purge this loaded family"                 -> OPEN_FAMILY_FOR_EDITING, here, DELETE_ELEMENTS, LOAD_FAMILY
#   "which materials are unused"               -> here (version 3), with
#                                                 includeMaterials=true - the walk
#                                                 of every element is slow
#   "which groups is nobody using"             -> here (version 3), by name
#   "which images are not used"                -> here (version 3), by name
#   "which view templates are unused" / "unused view filters" -> here (version 3),
#                                                 by name
#   "delete the unused templates"              -> SELECT_VIEW_TEMPLATES with usage
#                                                 unused - the templates as ELEMENTS;
#                                                 the names here are a report
#   "list the materials in this family"        -> LIST_MATERIALS - every material,
#                                                 used or not
#   "what is this material used on"            -> SELECT_BY_MATERIAL - the forward
#                                                 question, to ask before deleting
#   "which views are not on a sheet"           -> FIND_VIEWS, placement unplaced
#   "what filters exist and where"             -> REPORT_VIEW_FILTERS

# VERSION 2 (2026-11-01) - FIND_UNUSED_FAMILIES WAS MERGED INTO THIS CARD on
# the owner's instruction in conversation: "now merge the other duplicates
# also", every conflict to keep the SAFER rule. It is DEPRECATED. The same
# question - what is loaded and unused - and this card answers it from Revit's
# own list where Revit has one. Where each retired output is now:
#
#   elements           elements on 2024+ (Revit's list, handed on); EMPTY on
#                      2020-2023, where the same families are in perFamily
#   findings           findings, with the nested-family warning on 2020-2023
#   wholeFamilyUnused  wholeFamilyUnused, as NAMES rather than ids
#
# THE SAFER RULE WHERE THEY DIFFERED. FIND_UNUSED_FAMILIES handed its unplaced
# types on as `elements` and said they were not to be deleted; this card hands
# Revit's list on for DELETE_ELEMENTS. Here a list that is Revit's is handed
# on, and the placed-instance count - which calls a nested-only family unused
# - is a report that hands nothing on.
#
# ROUTING - repeated in CHECK_FAMILY_STANDARDS, SELECT_TYPES, LOAD_FAMILY and
# FIND_LIBRARY_FAMILIES.
#
# VERSION 3 (2026-11-01) - FIND_UNUSED_MATERIALS, FIND_UNUSED_GROUP_TYPES,
# FIND_UNUSED_IMAGES AND FIND_UNUSED_DEFINITIONS WERE MERGED INTO THIS CARD on
# the owner's instruction ("make sure there is no duplicate tools"; "in every
# conflict keep the safer rule"). All four are DEPRECATED. Each one's rule for
# what counts as USED came with it, on every release 2020-2027:
#   FIND_UNUSED_GROUP_TYPES   a detail group attached to a placed model group
#                             is in use - and a placed group that will not say
#                             what it offers makes every unplaced detail group
#                             type count as in use (safer than its skip)
#   FIND_UNUSED_IMAGES        an image named by ANY image parameter of any
#                             element or type is in use; a schedule header
#                             image is not seen, and the finding says so
#   FIND_UNUSED_DEFINITIONS   a template a view family type names as the
#                             default for new views is in use; filters used
#                             ONLY by unused templates are their own list
#   FIND_UNUSED_MATERIALS     both material sets, geometry AND paint, of every
#                             element and type - opt-in, includeMaterials
# Where each output is now: unusedGroupTypes -> unusedGroupTypeNames,
# usedOnlyAsAttached -> attachedDetailGroupsInUse, scanned -> a finding;
# FIND_UNUSED_IMAGES' elements -> unusedImageNames, usedCount ->
# usedImageCount; unusedTemplates -> unusedTemplateNames, unusedFilters ->
# unusedFilterNames, filtersUsedOnlyByUnusedTemplates ->
# filtersOnlyInUnusedTemplates (the templates kept as a default ->
# templatesKeptAsDefault); unusedMaterials -> unusedMaterialNames,
# scannedInstances, scannedTypes and unreadable the same; unusedNames and
# findings -> the lists above and `findings`.
#
# THE SAFER RULE WHERE THEY DIFFERED - version 2's, kept: ONLY REVIT'S OWN LIST
# IS HANDED ON FOR DELETING. FIND_UNUSED_IMAGES handed its images on as
# `elements` for DELETE_ELEMENTS, and FIND_UNUSED_MATERIALS,
# FIND_UNUSED_GROUP_TYPES and FIND_UNUSED_DEFINITIONS returned ids. Here every
# home-made list is a REPORT BY NAME, so NOT CARRIED, on purpose: an id list a
# delete could take, from any of the four. And where a home-made check finds
# something IN USE that Revit's list offers, it is held back (`heldBack`) -
# the cards' own reasons for existing, applied to the list that is handed on.
# Not carried either: FIND_UNUSED_MATERIALS' walk on every call - it is
# opt-in here because it reads every element and every type.


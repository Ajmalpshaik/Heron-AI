id: FRG-SEL-037
semantic-identity: "which elements of every category are unused in this project or family"
kind: filter
domain: revit.selection
capability: FIND_PURGEABLE_ELEMENTS
# VERSION 2 (2026-11-01): FIND_UNUSED_FAMILIES was merged into this card on the
# owner's instruction, and is DEPRECATED - see the comment block above
# `utterances`. Version 1's proof below is kept as the record; it no longer
# describes the code, so the card is DRAFT until version 2 is proved on a real
# model (D-30) - on 2024 or later for Revit's list, and on 2020-2023 for the
# fallback.
#
# VERSION 3 (2026-11-01): FIND_UNUSED_MATERIALS, FIND_UNUSED_GROUP_TYPES,
# FIND_UNUSED_IMAGES and FIND_UNUSED_DEFINITIONS were merged in - see the
# second comment block above `utterances`. Still DRAFT, version 1's proof
# still the record.
version: 3
source: OFFICIAL
risk: READ

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# What Purge Unused would offer, by Revit's own unused-element list - so
# nothing here decides what counts as used - in a project or in a family in
# front, every category or the ones named. The elements are handed on;
# DELETE_ELEMENTS removes them after the modeller has seen the list. Purge
# is a ladder: removing a type can leave its material unused, so a second
# run after the delete finds the next rung. Revit 2024 opened the list to
# code.
#
# VERSION 2: REVIT 2020 TO 2023 TOO. The list is reached by reflection, so one
# file compiles on every release; where Revit has no list, FIND_UNUSED_FAMILIES'
# own count of placed instances is the stated fallback - and it is a REPORT
# ONLY: `elements` stays empty there, because a family placed only inside
# another family has no instance of its own and would read as unused.
#
# A loaded family is purged by opening it (OPEN_FAMILY_FOR_EDITING), running
# this and DELETE_ELEMENTS there, and loading it back (LOAD_FAMILY) - a
# family cannot be opened inside a change in the project.
#
# Families are answered here, on every release, since version 2; group
# definitions, images, view templates, view filters and - asked for, because
# the walk is slow - materials since version 3, each by its own rule and each
# as a REPORT by name.
#
# READ ONLY - opens no transaction.
purpose: >
  Finds every element Revit counts as unused - in a project or a family, in
  every category or the ones named - and hands them on for deleting.

  Version 2 also answers which families are unused, family by family, and on
  Revit 2020 to 2023 counts placed instances instead - a report that hands
  nothing on for deleting, because a family nested in another reads as unused.

  Version 3 also reports, by name, the group definitions with nothing placed,
  the images nothing uses, the view templates and view filters nothing uses -
  and, asked for, the materials nothing uses. Only Revit's own list is handed
  on, and never anything one of those checks finds in use.

contract:
  needs:
    - name: doc
      type: Document
    # Category names, comma separated; an EMPTY value looks in every category.
    - name: categories
      type: string
      source: request
    # Version 3, from FIND_UNUSED_MATERIALS: true walks every element and
    # every type for the materials they use - geometry AND paint - and reports
    # the ones nothing uses. Slow on a large model, so left out it is false
    # and materials are not walked.
    - name: includeMaterials
      type: bool
      source: request
      optional: true
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: purgeableNames
      role: result
      type: IList<string>
    - name: byCategory
      # ONE STRING, how many in each category (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>
    - name: perFamily
      # VERSION 2, from FIND_UNUSED_FAMILIES. One line per family with types
      # unused - "M_Diffuser  - 3 of 5 type(s) unused: ..." - on both routes.
      # TEXT on purpose: on the 2020-2023 fallback it is the whole answer, and
      # text cannot be carried to a delete (D-52).
      role: accounting
      type: IList<string>
    - name: wholeFamilyUnused
      # VERSION 2, from FIND_UNUSED_FAMILIES: the families with NOTHING used -
      # whole files that could go - by NAME. That card handed them on as ids;
      # here they are names, so the fallback list stays a report (D-52).
      role: accounting
      type: IList<string>
    - name: route
      # VERSION 2. Which list answered: Revit's own (2024 and later), or the
      # placed-instance count (2020-2023), which hands nothing on. About the
      # method, never an element (D-52).
      role: accounting
      type: string
    - name: heldBack
      # VERSION 3. Elements on Revit's own list that a check here finds IN
      # USE - an attached detail group, a template named as a view type's
      # default, an image named by a parameter, a material used as paint - and
      # so NOT handed on. Turned down, never found (D-52).
      role: accounting
      type: IList<string>
    - name: unusedGroupTypeNames
      # VERSION 3, from FIND_UNUSED_GROUP_TYPES: group definitions with
      # nothing placed, by NAME - a report, never handed on (D-52).
      role: accounting
      type: IList<string>
    - name: attachedDetailGroupsInUse
      # VERSION 3, from FIND_UNUSED_GROUP_TYPES (its usedOnlyAsAttached):
      # detail groups with no instance of their own that a placed model
      # group offers - in use, by name. The row that stops a delete (D-52).
      role: accounting
      type: IList<string>
    - name: unusedImageNames
      # VERSION 3, from FIND_UNUSED_IMAGES: images placed nowhere and named by
      # no image parameter, by NAME - a report (D-52).
      role: accounting
      type: IList<string>
    - name: usedImageCount
      # VERSION 3, from FIND_UNUSED_IMAGES (its usedCount): images found in
      # use. The evidence it looked (D-52).
      role: accounting
      type: int
    - name: unusedTemplateNames
      # VERSION 3, from FIND_UNUSED_DEFINITIONS: view templates no view
      # follows and no view family type names as a default, by NAME (D-52).
      role: accounting
      type: IList<string>
    - name: unusedFilterNames
      # VERSION 3, from FIND_UNUSED_DEFINITIONS: view filters no view or
      # template uses, by NAME (D-52).
      role: accounting
      type: IList<string>
    - name: filtersOnlyInUnusedTemplates
      # VERSION 3, from FIND_UNUSED_DEFINITIONS: filters whose only users are
      # templates that are themselves unused - by NAME (D-52).
      role: accounting
      type: IList<string>
    - name: templatesKeptAsDefault
      # VERSION 3, from FIND_UNUSED_DEFINITIONS: templates no view follows that
      # a view family type names as the default for new views - in use. The
      # evidence it looked (D-52).
      role: accounting
      type: int
    - name: unusedMaterialNames
      # VERSION 3, from FIND_UNUSED_MATERIALS, with includeMaterials true:
      # materials neither geometry nor paint of any element or type uses, by
      # NAME (D-52).
      role: accounting
      type: IList<string>
    - name: scannedInstances
      # VERSION 3, from FIND_UNUSED_MATERIALS: placed elements walked for
      # materials. Work done, never a thing found (D-52).
      role: accounting
      type: int
    - name: scannedTypes
      # VERSION 3, from FIND_UNUSED_MATERIALS: types walked for materials.
      role: accounting
      type: int
    - name: unreadable
      # VERSION 3, from FIND_UNUSED_MATERIALS: elements that would not report
      # their materials at all. The evidence it tried (D-52).
      role: accounting
      type: int


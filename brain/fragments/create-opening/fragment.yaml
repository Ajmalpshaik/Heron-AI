id: FRG-ELE-067
semantic-identity: "cut the hole through this wall or slab - or the opening in a wall- or ceiling-based family's own template wall or ceiling"
kind: action
domain: revit.elements
capability: CREATE_OPENING
# VERSION 3 (2026-11-01) - CREATE_FAMILY_HOST_OPENING WAS MERGED INTO THIS
# CARD on the owner's instruction ("make sure there is no duplicate tools",
# every conflict to keep the safer rule), and is DEPRECATED. Version 2's proof
# below no longer describes the code (impl/ changed) and is kept as the
# record; DRAFT until version 3 is proved on a real model (D-30).
version: 3
source: OFFICIAL
risk: MODIFY

purpose: >
  Cuts an opening through a host element - a wall, a floor, a roof or a ceiling -
  from a closed boundary, and through a beam, brace or column with Revit's own
  framing opening.

  **A BEAM, BRACE OR COLUMN** (version 2, 2026-10-12, the gap fill) takes the
  framing opening: perpendicularFace true cuts through the web, false through
  the flanges - the duct or pipe penetration through a steel beam's web.

  **IN A WALL- OR CEILING-BASED FAMILY (version 3, 2026-11-01)** - the
  Opening tool those templates offer, CREATE_FAMILY_HOST_OPENING's job, merged
  in: `shape` is ONE closed loop in millimetres in the template's own wall or
  ceiling - along the wall and up it, X,Y in plan for a ceiling - and the
  template's one wall or ceiling is found, so `host` and `boundary` are left
  out. An opening cut there is cut in every wall or ceiling the family is
  placed on. A floor- or roof-based family is refused by name - Revit's call
  takes a wall or a ceiling. Its size is FIXED as drawn, and the answer says
  so. Read back, all or nothing: its host and its extent, to a millimetre.

  **THIS IS THE HALF `PROPOSE_MEP_OPENINGS` SAYS SOMEBODY ELSE MUST DO, AND
  NOBODY DID.** Its own purpose reads: *"It creates nothing... The list this
  produces is meant to be read, argued with, and only then acted on - by a
  separate write that somebody approved."* Measured 2026-09-18: that write did
  not exist anywhere in the library. So Heron could find every place the services
  pass through structure, size each hole, audit the holes already cut and check
  their sleeves - and could not cut one.

  **THE SPLIT IS RIGHT AND IS KEPT.** Proposing and cutting stay two operations,
  because cutting holes in somebody's structure is not a thing to do as a side
  effect of looking for them. This fragment is the deliberate second step, run on
  a list a person has seen.

  **THE BOUNDARY IS IN THE HOST'S PLANE AND THE CALLER OWNS IT.** Revit projects
  the profile onto the host; a boundary worked out against the wrong face comes
  back as an opening in the wrong place rather than as an error.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16), so a run of
  forty penetrations is one undo entry.

contract:
  needs:
    - name: doc
      type: Document
    # The wall, floor, roof, ceiling, beam, brace or column to cut through, in
    # a project. Left out it binds null (version 3): in a family the
    # template's own wall or ceiling is found; in a project it is refused,
    # "No host was given", as before. A host named in a family must be the
    # template's own.
    - name: host
      type: Element
      source: request
      optional: true
    # The closed boundary in a project, in the host's plane. Left out it binds
    # empty (version 3): a family's opening is `shape`; in a project it is
    # refused, "at least three boundary points", as before. Refused in a
    # family when given.
    - name: boundary
      type: IList<XYZ>
      source: request
      optional: true
    # true cuts perpendicular to the face (a beam's web), false vertically (a
    # beam's flanges). Not used in a family - give it false.
    - name: perpendicularFace
      type: bool
      source: request
    # VERSION 3, from CREATE_FAMILY_HOST_OPENING: the opening in a family, ONE
    # closed loop in millimetres in the template's wall or ceiling's own two
    # coordinates - "rect -300,600 300,1200" on a wall along X is 600 wide and
    # 600 high, its sill at 600; "circle 0,0 100" in a ceiling. Left out
    # ("none"): a project's opening, by host and boundary. Refused in a project.
    - name: shape
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: created
      role: result
      type: ElementId
    - name: openingId
      # VERSION 3, CREATE_FAMILY_HOST_OPENING's: the new opening's unique id -
      # in a project too.
      role: result
      type: string
    - name: built
      # VERSION 3: the host and the opening's extent - read back in a family;
      # in a project, the host and the cut.
      role: result
      type: string
    - name: refused
      # VERSION 3: why nothing was cut, in plain words. Empty when the call
      # cut one (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>


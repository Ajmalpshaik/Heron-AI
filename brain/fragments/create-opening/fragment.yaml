compatibility-note: >
  `Document.Create.NewOpening(Element, CurveArray, bool)` is present 2020 through
  2027 - read off the reference assemblies at both ends on 2026-09-18. The bool
  chooses whether the profile is cut perpendicular to the face or vertically,
  which matters on a sloped roof and on nothing else. Lengths are internal FEET.
  Version 3 adds CREATE_FAMILY_HOST_OPENING's call, unchanged 2020 to 2027 -
  `FamilyItemFactory.NewOpening(Element, CurveArray)`, "an opening to cut the
  wall or ceiling", which Autodesk's remarks say throws when the host is
  neither - with `Opening.Host` and `BoundaryCurves`. Built on all eight
  releases on 2026-11-01.

# TRAP - OBSERVED ELSEWHERE, NOT YET PROVEN HERE. Added 2026-09-23.
#
# Another tool, on real models and mostly on Revit 2020, found that an opening
# in a WALL and an opening in a BEAM take different API calls from an opening
# in a floor. Revit's API carries four `NewOpening` calls - read off the 2020
# and 2027 reference assemblies on 2026-09-23. This fragment uses the one that
# takes a host `Element`, a profile and a bool. A wall has a call of its own,
# taking the `Wall` and two corner points; a family instance - a beam, a
# brace, a column - has another, taking a profile and a reference face. So
# the purpose's "a wall, a floor, a roof or a ceiling" is a claim the call
# used here may not keep for a wall, and a beam is not covered at all.
# Autodesk's own description of which host each call serves could not be read
# from the machine this was written on.
#
# A note only: the fragment is DRAFT and nothing was changed. Prove it on a
# WALL first. If Revit refuses the wall, the purpose is wrong about walls and
# the repair is the wall's own call. NEEDS-CHECKING AJ9.

# ROUTING - repeated in PROPOSE_MEP_OPENINGS and AUDIT_MEP_OPENINGS.
#
#   "cut the holes"                  -> here, on a list somebody has approved
#   "where do the holes need to be"  -> PROPOSE_MEP_OPENINGS - it creates nothing
#   "are the holes already cut right"-> AUDIT_MEP_OPENINGS
#   "are the sleeves big enough"     -> CHECK_SLEEVE_SIZE
#   "where are the shafts"           -> SELECT_OPENINGS - a READ
#   "make the stair and its opening" -> CREATE_STAIRS with cutOpening=true; it
#                                       cuts the top level's slab itself, over
#                                       the stair it made
#   "cut an opening in the host wall of this family" -> here since version 3,
#                                       `shape` - CREATE_FAMILY_HOST_OPENING
#                                       until 2026-11-01
#   "cut the solid with the void"    -> COMBINE_FAMILY_FORMS
#
# VERSION 3 - WHERE CREATE_FAMILY_HOST_OPENING'S INPUTS AND OUTPUTS ARE NOW:
#   shape                 shape, the same one closed loop in millimetres
#   (the template host)   found here, never named; host and boundary left out
#   openingId, built      openingId, built - read back the same way
#   refused, findings     refused, findings
#   notAFamily            NOT AN OUTPUT HERE: a project is this card's own
#                         case, so being one is no refusal. A `shape` given in
#                         a project is refused, saying it is a family's.
# NOTHING WAS OPPOSITE. The two never cut the same host: the family half keeps
# that card's rules whole - a Revit refusal there THROWS and rolls the call
# back; the project half keeps this card's, a refusal reported in findings.

utterances:
  - cut an opening in this wall
  - make the hole through the slab
  - cut the penetrations
  - create an opening
  - put a hole in this wall for the duct
  - cut a hole through the web of this beam for the duct
  # MOVED 2026-11-01 from CREATE_FAMILY_HOST_OPENING, merged into this card.
  - cut an opening in the host wall of this family
  - add an opening to the wall based family
  - cut the ceiling opening in this ceiling based family
  - make the opening in the template wall
  # ...and CREATE_FAMILY_HOST_OPENING's semantic identity, which nothing else declares:
  - cut an opening in the template's own wall or ceiling, in a wall-based or ceiling-based family

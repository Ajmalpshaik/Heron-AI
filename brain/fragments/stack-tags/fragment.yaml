id: FRG-VIEW-087
semantic-identity: "stack these tags in a tidy column at the side, or park them in columns down both edges of the view"
kind: action
domain: revit.annotation
capability: STACK_TAGS
# VERSION 2 (2026-11-01): ARRANGE_TAGS_TO_VIEW_EDGES was merged into this card
# on the owner's instruction ("make sure there is no duplicate tools"), and is
# DEPRECATED. `layout` `edges` parks the tags in TWO columns just outside the
# view's left and right edges - each tag to the side its own element is on,
# each column ordered by the elements up the view - `marginMm` paper
# millimetres out, multiplied by the scale; the crop is the edge, or the tags'
# own extent when the view is not cropped (`usedTagExtent`), with `perSide`
# saying how many went each way. `point`, the default, is version 1's one
# column at `stackAt`; a stack point left out reads 0,0,0 and is refused on
# that road. Version 1's proof below no longer describes the code; DRAFT until
# version 2 is proved.
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Arranges tags into a neat vertical column at one point, each still leadered
  back to its own element. What a drafter does by hand beside a busy area, when
  there is no room for the tags where the elements are.

  **THE STACK ORDER IS NEAREST-ELEMENT-FIRST, NOT THE ORDER THE SET ARRIVED
  IN.** Tags are sorted by where their own element sits along the stack, so the
  leaders fan out without crossing. Stacking them in the order a filter
  happened to return produces a plate of spaghetti that looks like the tool is
  broken - and it is the same tags, in the same places, with the same leaders.

  **THE GAP IS A PAPER DISTANCE AND HAS TO BE MULTIPLIED BY THE VIEW SCALE.**
  Every millimetre in tag work is a paper millimetre: 5 mm between tags is 500
  model mm at 1:100 and 250 at 1:50. Using the number as a model distance is
  the commonest mistake in this whole subject, and it produces a stack that is
  either unreadable or off the sheet.

  **IT MOVES HEADS AND LEAVES THE LEADERS TO FOLLOW.** An attached leader end
  stays on its element; a free one is carried back to where it was, so the
  arrows do not come off the things they point at.

  **Or two columns down the view's edges** (version 2, from
  ARRANGE_TAGS_TO_VIEW_EDGES) - the "I cannot read the drawing for tags" fix
  on a busy services plan. Each tag goes to the side its own element is on,
  so the leaders stay short; each column follows the elements up the view, so
  they do not cross; the margin is paper millimetres from the crop, or from
  the tags' own extent when the view is not cropped, and the answer says
  which.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: view
      type: View
      source: request
    - name: elements
      type: IList<Element>
    # Where the top of the stack goes, in the view's plane. Optional since
    # version 2, for layout edges: left out it reads 0,0,0 - the project
    # origin - which the point layout refuses rather than stacking there.
    - name: stackAt
      type: XYZ
      source: request
      optional: true
      absent: 0,0,0
    # Paper millimetres between tags - multiplied by the view scale here.
    - name: gapMm
      type: double
      source: request
    # VERSION 2, from ARRANGE_TAGS_TO_VIEW_EDGES. point - one column at
    # stackAt, version 1's - or edges, two columns just outside the view's
    # left and right edges. Left out: point.
    - name: layout
      type: string
      source: request
      optional: true
      absent: point
    # VERSION 2, from ARRANGE_TAGS_TO_VIEW_EDGES. Paper millimetres from the
    # view's edge to the column, multiplied by the view scale - edges needs
    # it. Left out: none, and edges is refused. Text, because the binder has
    # no way to leave a number out.
    - name: marginMm
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: stacked
      role: result
      type: int
    - name: noHead
      # Tags with no head to move, so it could not be stacked. The evidence it
      # looked, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: notTags
      # Handed in but not tags, so there was nothing here to act on. A count
      # of what it was GIVEN and could not use, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>
    - name: perSide
      # VERSION 2, from ARRANGE_TAGS_TO_VIEW_EDGES. With edges, how the parked
      # tags were split between the left and right edges. A breakdown of the
      # answer, never more of it (D-52).
      role: accounting
      type: IDictionary<string, int>
    - name: usedTagExtent
      # VERSION 2, from ARRANGE_TAGS_TO_VIEW_EDGES. With edges, whether the
      # tags' own extent stood in for an uncropped view's edges. Which method
      # ran, never a tag it moved (D-52).
      role: accounting
      type: bool
    - name: findings
      # VERSION 2. The refusal of a layout, a missing margin or a stack point
      # left out, and with edges how many went to each side and against what.
      type: IList<string>


# ROUTING - the same rows are in every rebar card.
#
#   "make a 40 mm cover type"                   -> here
#   "set the cover on these beams to 40"        -> SET_REBAR_COVER
#   "what cover types are there"                -> LIST_REBAR_TYPES
utterances:
  - make a 40 mm rebar cover type
  - create a cover type for 50 mm cover
  - add a rebar cover setting of 75 mm

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. It is a position read and a move, and
  neither has changed 2020 to 2027. All coordinates are internal feet with no
  units call.

  Version 2: the four size parameters ALIGN_MEP_ELEVATION read -
  RBS_CURVE_HEIGHT_PARAM, RBS_CURVE_DIAMETER_PARAM, RBS_PIPE_DIAMETER_PARAM and
  RBS_CABLETRAY_HEIGHT_PARAM - are BuiltInParameter values unchanged 2020 to
  2027, asked for by enum rather than by display name so it works on a Revit in
  any language. `targetZ` arrives in millimetres and is divided by 304.8 (D-71).

# VERSION 2 (2026-11-01) - ALIGN_MEP_ELEVATION WAS MERGED INTO THIS CARD on the
# owner's instruction ("make sure there is no duplicate tools", "in every
# conflict keep the safer rule"), and is DEPRECATED. Its `elements` are this
# card's; its `edge` and `targetZ` are here under the same names, the reference
# left out; its `aligned`, `noSize` and `notCurveBased` are here too.
#
# THE CONFLICTS, AND THE SAFER RULES KEPT: ALIGN_MEP_ELEVATION read any edge
# word but "top" and "bottom" as the centre - "soffit" would have levelled
# centrelines. KEPT: a word it does not know is refused, naming the three. It
# counted every move as aligned without looking; this card reads every move
# back, and a run Revit would not move is in `blocked`. Asked both ways at
# once, nothing is moved rather than one way picked.

# ROUTING - the same rows are in the fragments named here.
#
#   "line these up"                  -> here, with a reference
#   "get the services level"         -> here, with an edge and a height
#                                       (ALIGN_MEP_ELEVATION until 2026-11-01)
#   "line up the soffits"            -> here, edge bottom
#   "how high is the soffit"         -> MEASURE_CEILING_HEIGHT - a READ
#   "give it a fall of 1 in 100"     -> SET_MEP_SLOPE - a graded run, not a level one
#   "raise the ducts 200"            -> MOVE_ELEMENTS - both ends together
#   "jump this pipe over the beam"   -> OFFSET_MEP_SECTION - ONE STRETCH of a run
#   "which services are stacked too close together" -> CHECK_VERTICAL_CLEARANCE

utterances:
  - line these up
  - get them on the same line
  - align with that one
  - they should all be at the same X
  - straighten this row
  # MOVED 2026-11-01 from ALIGN_MEP_ELEVATION, merged into this card.
  - get the services level
  - align the bottoms so the ceiling fits
  - line up the soffits
  - level the ducts with each other
  - align the tops
  - set them all to the same underside
  - level these up

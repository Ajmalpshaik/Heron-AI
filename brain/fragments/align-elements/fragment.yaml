id: FRG-GEO-012
semantic-identity: "line these elements up with one reference element, axis by axis - or line MEP runs up by their top, bottom or centre at one height"
kind: action
domain: revit.geometry
capability: ALIGN_ELEMENTS
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Moves elements so they share one reference element's position along whichever
  axes are asked for - *"get these diffusers on the same line"*, *"line the
  equipment up with that one"*. Each axis is chosen separately, so aligning in X
  leaves every element's own Y and Z alone.

  **It aligns each element's own position point, which for a duct or pipe is
  its MIDPOINT, not an end.** Two runs of different lengths aligned this way
  share a centre, and their ends do not line up. That is the right answer for
  equipment and the wrong one for somebody who meant "make the ends meet" - and
  the difference is invisible until it is looked at.

  **MEP runs by their top, bottom or centre (version 2, 2026-11-01).**
  ALIGN_MEP_ELEVATION was merged in. Give `edge` - top, bottom or centre - and
  `targetZ`, a height in millimetres, instead of a reference: each duct, pipe,
  tray or conduit is moved up or down so that edge lands on the height, its
  half-height read from its OWN size, so a 600 mm duct and a 100 mm pipe
  genuinely share a soffit. The insertion point of an MEP run is its
  centreline, so making centrelines equal leaves the tops and bottoms apart -
  which is exactly what a coordinated corridor needs to be equal. A run whose
  size cannot be read is in `noSize` and not moved; something not curve-based
  is in `notCurveBased`. Insulation is NOT included - the bare service size. A
  sloped run's midpoint lands on the height and its slope is kept. Every move
  is read back. Version 2's proof is owed; the card is DRAFT.

  **"SOFFIT" MEANS TWO DIFFERENT JOBS AND ONE OF THEM CHANGES THE MODEL:**

  | What you meant | Use |
  |---|---|
  | "the soffit height in here", "how high is the ceiling" - to know | `MEASURE_CEILING_HEIGHT`, read-only |
  | "line up the soffits", "align the undersides" - to change | `ALIGN_ELEMENTS` with an edge, which MOVES services |

  Asking a height must never move a duct.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # Version 2: OPTIONAL. Left out when lining up by an edge and a height.
    # Absent binds null (HeronBindingNote.AbsentValue); with no edge either,
    # nothing is moved and `refused` says why.
    - name: reference
      type: Element
      source: request
      optional: true
    # Version 2: optional, a switch not said is off - so a call by edge need
    # not name them. Every version 1 call names them and runs unchanged.
    - name: alignX
      type: bool
      source: request
      optional: true
    - name: alignY
      type: bool
      source: request
      optional: true
    - name: alignZ
      type: bool
      source: request
      optional: true
    # Version 2, ALIGN_MEP_ELEVATION's `edge`: top, bottom or centre. Left out
    # it is `none` - align to the reference, as version 1. Any other word is
    # refused, naming the three (ALIGN_MEP_ELEVATION read it as the centre).
    - name: edge
      type: string
      source: request
      optional: true
      absent: none
    # Version 2, ALIGN_MEP_ELEVATION's `targetZ`: the height in MILLIMETRES
    # the edge is put at, divided by 304.8 in the code (D-71). Required with
    # an edge; left out it is NaN, and an edge with no height is refused.
    - name: targetZ
      type: double
      source: request
      optional: true
      absent: NaN
  provides:
    - name: aligned
      role: result
      type: int
    - name: blocked
      # Elements that would not move - pinned, owned by somebody else, or
      # driven by a constraint. Never a thing it aligned (D-52).
      role: accounting
      type: IList<ElementId>
    - name: unverified
      # Elements it moved but could not read back to confirm. The evidence it
      # could not check, never a confirmed alignment (D-52).
      role: accounting
      type: IList<ElementId>
    # VERSION 2 - ALIGN_MEP_ELEVATION's two lists, under their own names.
    - name: noSize
      # Runs whose size parameter could not be read, so they could not be
      # aligned by an edge and were NOT moved. Never treated as flat (D-52).
      role: accounting
      type: IList<ElementId>
    - name: notCurveBased
      # Handed in for an edge but not curve-based - a damper, a valve - so
      # there was nothing to level (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Version 2: why NOTHING WAS MOVED, as one sentence - no reference and no
      # edge, an edge word it does not know, an edge with no height, or both
      # ways asked at once. Null when it ran (D-52).
      role: accounting
      type: string


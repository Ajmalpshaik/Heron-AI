# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: 5 scattered diffusers, one chosen as reference, alignY only
    expect: >
      all 5 share the reference's Y, each keeps its own X and Z, and the
      reference itself has NOT moved. Check the reference - a fragment that
      moved it too would still look like a tidy row

  - given: the same 5 with alignX and alignY both true
    expect: they end up stacked on one point, which is what was asked for

  # VERSION 2 (2026-11-01), from ALIGN_MEP_ELEVATION. Each FAILS on version
  # 1, which had no edge and needed a reference.
  - given: a 600 mm rectangular duct and a 100 mm pipe in one corridor, edge "bottom", targetZ 2700, no reference
    expect: >
      THEIR UNDERSIDES ARE LEVEL at 2700, measured in a section - not their
      centrelines. A version that moved both centrelines to the same Z leaves
      the soffits 250 mm apart and looks plausible on plan

  - given: the same two, edge "top"
    expect: their tops level, and the centrelines therefore NOT level

  - given: edge "centre"
    expect: centrelines level, the one case where half-height does not matter

negative:
  # VERSION 2, from ALIGN_MEP_ELEVATION.
  - given: an element carrying none of the four size parameters, edge "bottom"
    expect: its id in `noSize` and NOT MOVED - never treated as zero-height

  - given: a damper or a valve in the list, edge "top"
    expect: its id in `notCurveBased`, and no attempt made

  - given: an INSULATED duct, edge "bottom"
    expect: aligned on its BARE size, its insulation proud of the line - deliberate

  - given: a SLOPED run, edge "bottom"
    expect: its midpoint on the height, its slope kept - RECORD WHAT HAPPENS

  - given: edge "soffit"
    expect: >
      REFUSED, naming top, bottom and centre, and NOTHING moved.
      ALIGN_MEP_ELEVATION levelled the centrelines for any word it did not
      know; that rule is not carried

  - given: edge "bottom" with no targetZ
    expect: refused - an edge needs a height - nothing moved

  - given: edge "bottom", targetZ 2700 AND a reference with alignZ
    expect: refused - asked both ways at once - nothing moved

  - given: a duct inside a REVIT GROUP, edge "bottom"
    expect: its id in `blocked`, not counted as aligned - ALIGN_MEP_ELEVATION counted it

  - given: TWO DUCTS OF DIFFERENT LENGTHS aligned in X
    expect: >
      their MIDPOINTS share an X and their ENDS DO NOT. Right for equipment,
      wrong for somebody who meant "make the ends meet" - record it so the
      difference is known rather than discovered

  - given: two MEP runs of different sizes aligned in Z
    expect: >
      their centrelines match and their tops and bottoms do not. This is the
      case that belongs to `edge` instead (ALIGN_MEP_ELEVATION until 2026-11-01), and proving it here is
      what makes the boundary between the two fragments real

  - given: elements inside a REVIT GROUP
    expect: their ids in `blocked` - the usual silent no-op, reported

  - given: a reference element with no readable position
    expect: >
      NOTHING moved at all. There is nothing to align to, and moving everything
      to an invented coordinate would be far worse than doing nothing

  - given: all three axes false
    expect: >
      every element counted as aligned and nothing moved - asking for no
      alignment changes nothing, and that is not a failure

second_route:
  - a dimension between two aligned elements along the chosen axis reads zero
  - one Ctrl+Z puts the whole row back (Golden Rule 16)

compatibility-note: >
  One implementation for every release. Read with tools/api-surface --members
  on the reference assemblies of 2020 to 2027 on 2026-11-02, every one present
  in all eight: `BuiltInParameter.YZ_JUSTIFICATION`, `Y_JUSTIFICATION`,
  `Z_JUSTIFICATION`, `Y_OFFSET_VALUE`, `Z_OFFSET_VALUE`, `START_Y_JUSTIFICATION`,
  `END_Y_JUSTIFICATION`, `START_Z_JUSTIFICATION`, `END_Z_JUSTIFICATION`,
  `START_Y_OFFSET_VALUE`, `END_Y_OFFSET_VALUE`, `START_Z_OFFSET_VALUE`,
  `END_Z_OFFSET_VALUE`, `STRUCTURAL_BEAM_END0_ELEVATION` ("Start Level
  Offset") and `STRUCTURAL_BEAM_END1_ELEVATION` ("End Level Offset");
  `Parameter.AsInteger`, `AsValueString`, `Set(int)`, `Set(double)`,
  `IsReadOnly`; `Document.Regenerate`. `StructuralFramingUtils` has no
  justification member on any release - its ten methods are end joins, end
  references and FlipEnds - so the parameters are the API. ElementIds are
  compared as ElementIds and never read as numbers. Not seen in Revit.

# ROUTING (2026-11-02) - the same rows are in SET_FRAMING_END_EXTENSION and
# REPORT_FRAMING_JUSTIFICATION.
#
#   "set the justification of these beams"    -> here
#   "set the start and end level offsets of these beams" -> here
#   "read the justification of these beams"   -> REPORT_FRAMING_JUSTIFICATION -
#                                                a question, never this write
#   "set the beam end extension to 150 mm"    -> SET_FRAMING_END_EXTENSION -
#                                                the length past the end, not
#                                                where the member sits
#   "line these runs up on their tops"        -> SET_MEP_JUSTIFICATION - ducts
#                                                and pipes
utterances:
  - set the justification of these beams
  - set the start and end level offsets of these beams

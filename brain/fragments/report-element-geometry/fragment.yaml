id: FRG-GEO-068
semantic-identity: "what is the shape of this element - its faces, edges and volume in numbers"
kind: action
domain: revit.geometry
capability: REPORT_ELEMENT_GEOMETRY
version: 1
source: OFFICIAL
risk: READ

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# summary: solids, faces and their area, edges and their length, volume and
# box; edges: each line with its ends or arc with centre and radius; faces:
# each flat face with its normal and area. Detailed lists stop at 200 lines.
# A family instance is read as placed and turned.
#
# REPORT_BOUNDING_BOX gives the box only; MEASURE_ELEMENT_VOLUME the volume
# only; REPORT_GEOMETRY_COMPLEXITY counts for model health.
#
# READ ONLY - opens no transaction.
purpose: >
  Reads the geometry of elements in millimetres - solids, faces and their
  area, edges and their length, volume and box - and, when asked, each edge
  or face.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # "summary", "edges" or "faces"; an EMPTY value means summary.
    - name: detail
      type: string
      source: request
  provides:
    - name: geometry
      # ONE STRING, a line per element and, when asked, per edge or face.
      role: result
      type: string
    - name: solidCount
      role: result
      type: int
    - name: noGeometry
      # Elements with no solid geometry - annotation, lines (D-52).
      role: accounting
      type: IList<ElementId>
    - name: findings
      type: IList<string>


id: FRG-VIEW-128
semantic-identity: "point this 3D view's camera from here to there, or make a perspective view"
kind: action
domain: revit.views
capability: SET_VIEW_CAMERA
version: 2
source: OFFICIAL
risk: MODIFY

# VERSION 2 (2026-10-20) - the rendering tools' widening, on the owner's word
# ("for the rendering ... all the part should be covered"). Two OPTIONAL
# inputs, so a version 1 call runs exactly as before: `levelName` - the eye's
# and the target's heights measured from a level ("eye 1600 above Level 1"),
# with Revit's Eye Elevation and Target Elevation read back - and `farClipMm` -
# off, or the Far Clip Offset with Far Clip Active on, read back. A field of
# view is NOT offered: Revit's API has no field-of-view value on any release
# 2020 to 2027, and FRAME_ELEMENTS_IN_CAMERA fits the crop to elements instead.
# Version 1's proof no longer describes the code, so it is kept below as a
# record and the card is DRAFT until it is proved again (D-30) - D-117 refuses
# a kept camera from it until then.

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# ONE JOB WHETHER THE VIEW EXISTS OR IS NEW: an existing 3D view of that name
# has its camera moved; with none and createIfMissing, a new PERSPECTIVE view
# is made with that name first - what the ribbon's Camera tool makes.
#
# perspective true turns an isometric view perspective where Revit allows it.
# Revit has no call turning a perspective view back to isometric, and none is
# claimed.
#
# THE UP DIRECTION IS DERIVED: square to the line of sight in the vertical
# plane through it, so the camera is level. Looking straight up or down,
# north is up.
#
# A view a template controls is refused, not half-changed.
#
# READ BACK: eye, direction and perspective off the view, in millimetres.
#
# CREATE_3D_VIEW makes an isometric default 3D view and is PROVEN, so it was
# not widened; SET_VIEW_SECTION_BOX boxes a 3D view round elements.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Sets a 3D view's camera from an eye point to a target point in millimetres,
  turning it perspective if asked, or makes a new perspective view with that
  camera - the Camera tool, without clicking.

contract:
  needs:
    - name: doc
      type: Document
    # The 3D view by name; with createIfMissing, the name of the new one.
    - name: viewName
      type: string
      source: request
    # "x,y,z" in millimetres.
    - name: eyeMm
      type: string
      source: request
    # "x,y,z" in millimetres - what the camera looks at.
    - name: targetMm
      type: string
      source: request
    # true turns an isometric view perspective; false, or not said, leaves
    # its projection as it is.
    - name: perspective
      type: bool
      source: request
      optional: true
    # true makes a new perspective view when none has the name; false, or
    # not said, refuses.
    - name: createIfMissing
      type: bool
      source: request
      optional: true
    # Version 2: the eye's and target's heights are measured from this level;
    # keep, or not said, means from the project's origin as version 1.
    - name: levelName
      type: string
      source: request
      optional: true
      absent: keep
    # Version 2: off, or the far clip in millimetres from the camera.
    - name: farClipMm
      type: string
      source: request
      optional: true
      absent: keep
  provides:
    - name: camera
      role: result
      type: View3D
    - name: madeNew
      role: result
      type: bool
    - name: readBack
      # Eye, direction and projection read off the view afterwards.
      role: result
      type: string
    - name: refused
      # Why NOTHING WAS CHANGED, as one sentence; null otherwise (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>

# VERSION 1's PROOF, KEPT AS A RECORD. Version 2 changed impl/, so its
# fingerprint no longer describes the code and the card is DRAFT until the
# rendering tools' NEEDS-CHECKING group proves version 2 (D-30). A call with
# neither new input still takes the road this proof ran.
proof:
  date: '2026-10-18'
  by: Ajmal PS
  model: Project2 (3,035 elements), Revit 2020, session 13520
  positive_case: 'run as it would normally be run - run inside a transaction, and Revit reported
    the transaction group ROLLED BACK afterwards. returned MmPerFoot 304.8, camera View3D,
    createIfMissing true, eye XYZ, findings 1 item(s) [Made perspective view "Heron Camera":
    eye 5000,-10000,1600 m...], madeNew true, name Heron Camera, perspective false, point
    Func`2, readBack eye 5000,-10000,1600 mm, looking 0,1,0, perspective, refused (null),
    target XYZ. inputs came viewName as given; eyeMm as given; targetMm as given; perspective
    as given; createIfMissing as given. on Project2'
  negative_case: 'run with categoryName=Text Notes, createIfMissing=False, eyeMm=5000,-10000,1600,
    inViewOnly=FloorPlan: Level 1, perspective=False, targetMm=5000,3000,1600, viewName=No
    Such View instead - chosen because it should not contain what this fragment reports -

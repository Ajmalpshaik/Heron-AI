  fingerprint: f146f1d6cccc6b75

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. View3D.CreatePerspective,
  SetOrientation, GetOrientation, IsPerspective, ToggleToPerspective,
  IsLocked and Unlock, ViewOrientation3D(XYZ, XYZ, XYZ) and
  ViewFamily.ThreeDimensional are present 2020 through 2027 - read off
  RevitAPI.xml in the Nice3point reference packages for all eight releases on
  2026-10-12. Points are millimetres divided by 304.8 (D-20). Version 2 adds
  Level.ProjectElevation and BuiltInParameter VIEWER_EYE_ELEVATION,
  VIEWER_TARGET_ELEVATION, VIEWER_BOUND_ACTIVE_FAR and VIEWER_BOUND_OFFSET_FAR -
  read off the shipped reference assemblies of 2020 through 2027 on
  2026-10-20, alike on every release.

# ROUTING - the same rows are in the fragments named here.
#
#   "make a perspective from the entrance looking at the lobby" -> here
#   "move the camera of this 3D view"         -> here
#   "far clip this camera at 20 m"            -> here, version 2
#   "a close-up camera of these elements"     -> FRAME_ELEMENTS_IN_CAMERA,
#                                                which takes a selection
#   "make a 3D view"                          -> CREATE_3D_VIEW
#   "box the 3D view round these"             -> SET_VIEW_SECTION_BOX

utterances:
  - make a perspective view from the entrance looking at the lobby
  - move the camera of the 3D view to look at the plant room
  - set the eye and target of this 3D view
  - make a camera view from this point to that point
  - make a perspective from the entrance looking at the lobby
  - put the camera eye 1600 above level 1 looking at the reception desk
  - turn the far clip of this camera on at 15000

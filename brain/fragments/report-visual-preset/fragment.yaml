compatibility-note: >
  One implementation for every release, reading only members
  REPORT_RENDER_SETTINGS, SET_VIEW_PROPERTIES and LIST_MATERIALS already read,
  but SunAndShadowSettings.GetSunset - read on 2026-10-20 with
  tools/api-surface --members, present and alike on 2020 to 2027 - and
  Element.GetMaterialIds, the same on every release. View.DisplayStyle is
  read by name, as SET_VIEW_PROPERTIES does.

# ROUTING - the same rows are in the render, sun, display and view cards.
#
#   "what would the exterior day preset do here"  -> here
#   "which preset is this view closest to"        -> here
#   "which materials in this view render grey"    -> here
#   "make this view look good"                    -> APPLY_VISUAL_PRESET, the
#                                                    write (D-86)
#   "what are the render settings of this view"   -> REPORT_RENDER_SETTINGS,
#                                                    the four dialogs as they
#                                                    stand
#   "list the materials with their appearance"    -> LIST_MATERIALS, every
#                                                    material in the project

utterances:
  - what would the exterior day preset do to this view
  - how far is this 3D view from the equipment close-up look
  - which visual preset is this view closest to
  - which materials in this view have no render appearance
  - what visual presets does Heron have

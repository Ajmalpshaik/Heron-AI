compatibility-note: >
  One implementation for every release. NumberingSchema.GetNumberingSchema
  (Document, NumberingSchemaType), NumberingSchemaTypes.StructuralNumberingSchemas
  Rebar, RebarCoupler and ReinforcementFabric, NumberingSchema.GetNumberingSequences,
  GetNumbers(string) and NumberingParameterId, IntegerRange.Low and High,
  BuiltInParameter.NUMBER_PARTITION_PARAM, BuiltInCategory OST_Rebar, OST_Coupler
  and OST_FabricReinforcement, WorksharingUtils.GetCheckoutStatus(Document,
  ElementId, out string) and CheckoutStatus.OwnedByOtherUser carry the same
  signatures 2020 through 2027 - read with tools/api-surface --members on
  2026-11-01. Revit 2027 marks the schema-type route and NumberingSchemaType
  obsolete in favour of a schema name, and still ships both; NumberingParameterId
  gains a setter in 2027, unused here. An ElementId is compared with ==, never
  read as a number.

# ROUTING (2026-11-01) - the same rows are in EDIT_REBAR_NUMBERING.
#
#   "what rebar numbers are in partition B2"        -> here
#   "renumber the rebar in partition P1"            -> EDIT_REBAR_NUMBERING
#   "start rebar numbering at 100 in this partition" -> EDIT_REBAR_NUMBERING -
#                                                      which partition "this"
#                                                      is, is read here first
#   "compact the rebar numbers"                     -> EDIT_REBAR_NUMBERING
#   "move these bars to partition Level 3 slab"     -> EDIT_REBAR_NUMBERING
#   "renumber the doors"                            -> RENUMBER_SEQUENTIAL - a
#                                                      running sequence in a
#                                                      parameter, not Revit's
#                                                      rebar numbering
#   "what rebar is in these columns"                -> REPORT_HOST_REBAR
utterances:
  - what rebar numbers are in partition B2

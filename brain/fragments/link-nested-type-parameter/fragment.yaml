compatibility-note: >
  `FamilyManager.AssociateElementParameterToFamilyParameter` ("the parameter
  of an element in family"; the two must be the same type),
  `CanElementParameterBeAssociated`, `GetAssociatedFamilyParameter`,
  `Family.GetFamilySymbolIds` and `FamilySymbol.FamilyName` read the same 2020
  through 2027 (the RevitAPI reference assemblies and their XML remarks, read
  2026-10-01). A parameter's kind is read by reflection across 2022, as
  LINK_FAMILY_PARAMETER reads it.

# ROUTING - see SET_FAMILY_CATEGORY for the whole family-building table.
#
#   "link the motor type's width to Motor Width"  -> here
#   "drive the nested type's size from this family" -> here
#   "link the connector flow to a parameter"      -> LINK_FAMILY_PARAMETER,
#                                                    an instance parameter

utterances:
  - link the motor type's width to Motor Width
  - drive the nested type's size from this family
  - drive the nested motor's sizes from the air handler
  - make the nested part's size follow this family's parameters

id: FRG-DOC-026
semantic-identity: "which projects and families are open in this Revit, each with its file or none yet, and how to tell two models of the same name apart"
kind: action
domain: revit.document
capability: REPORT_OPEN_DOCUMENTS
version: 2
source: OFFICIAL
risk: READ

# VERSION 2 (2026-10-16, row 5b-435). Version 1 counted the families open in
# the Family Editor and listed none, so "2 family document(s) are open and are
# NOT listed above" was the whole answer while a modeller's 60 inch monitor
# family sat unsaved in one of them (2026-10-14, Revit 2020), and the family
# method's step 11 b - check a lost answer while a window opens "with
# REPORT_OPEN_DOCUMENTS" - could not see the window it was checking for. A
# family closed without a file is gone (a house and two towers were lost
# unsaved on 2026-10-13), and Heron cannot save one: SAVE_DOCUMENT saves only
# a document that already has a file, and never the one in front. So each
# family is named, and one with no file is said out loud, with Ctrl+S as the
# only way to keep it. The projects' lists and `count` are version 1's.

purpose: >
  Lists the projects open in this Revit session, and the families open in the
  Family Editor, with enough identity to act on one: each model's title and
  full path, and each family's category and file, or that it has none yet. It
  changes nothing.

  **THIS EXISTS BECAUSE A TITLE IS NOT AN IDENTIFIER.** Two projects called
  `Project1` can be open at once, and then *"switch to Project1"* names nothing.
  Revit's own tab bar has the same problem and solves it by making you look. So
  the full **path** is reported beside every title, and it is the path
  SWITCH_ACTIVE_PROJECT matches on first - a title match is the convenience, a
  path match is the answer.

  **A FAMILY BEING EDITED IS NOT A PROJECT.** Each one is listed apart, on
  one line in `familyList`, and one with no file is said to be NEVER SAVED:
  nothing on disk holds it.

  **LINKS ARE COUNTED, NOT LISTED.** `Application.Documents` returns each
  linked model too, and a link is nothing to switch to.

  **AN UNSAVED PROJECT HAS NO PATH, AND THAT IS NOT AN ERROR.** A new model that
  has never been saved reports an empty `PathName`, said out loud rather than
  left blank: such a project can only ever be matched by title.

  Reads only. Opens no transaction and needs none.

contract:
  needs:
    - name: app
      type: Application
    - name: doc
      type: Document
  provides:
    - name: documents
      role: result
      type: IList<string>
    - name: paths
      role: result
      type: IList<string>
    - name: titles
      role: result
      type: IList<string>
    - name: activeTitle
      role: result
      type: string
    - name: count
      # How many are real projects. LINKS AND FAMILIES ARE OPEN DOCUMENTS AND
      # ARE NOT PROJECTS, so this is what tells you the list is shorter than
      # you expected on purpose. Unchanged in version 2.
      role: result
      type: int
    - name: familyList
      # Version 2. Every family open in the Family Editor on ONE line, "  ||  "
      # between them: title, [ACTIVE] when it is the document read, [unsaved
      # changes], its category, and its file - or "NEVER SAVED, no file of its
      # own". One line because a list reaches the reply cut to three entries of
      # sixty characters, and a family's path alone is longer.
      role: result
      type: string
    - name: familyCount
      # Version 2. How many families are open in the Family Editor.
      role: result
      type: int
    - name: findings
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Application.Documents`, and
  `Document.Title`, `.PathName`, `.IsLinked`, `.IsFamilyDocument`, `.IsValidObject`
  and `.IsModified` are unchanged 2020 to 2027 - checked by compiling this
  fragment against the reference assemblies for all eight.

  `DocumentSet` is not generic, so the loop variable is typed rather than `var`.
  Version 2 adds `Document.OwnerFamily`, `Family.FamilyCategory` and
  `Document.Equals`, which LOAD_FAMILY already uses to compare an open document
  with `doc` - the same 2020 to 2027, compiled against all eight on 2026-10-16.

# ROUTING - cross-referenced in SWITCH_ACTIVE_PROJECT and LIST_LINKED_MODELS.
#
#   "what projects are open"           -> here
#   "which models do I have open"      -> here
#   "how many Revit files are open"    -> here
#   "what links are loaded"            -> LIST_LINKED_MODELS. This one COUNTS
#                                         links and does not describe them
#   "what file is this"                -> READ_MODEL_FILE_INFO, which is about
#                                         the ONE active model in depth
#   "switch to the other project"      -> SWITCH_ACTIVE_PROJECT, which needs
#                                         what this returns
#   "which families are open"          -> here (version 2)
#   "what family windows are open"     -> here (version 2)
#   "save the family and close it"     -> SAVE_DOCUMENT, which saves only a
#                                         document that has a file, and never
#                                         the one in front
#   "activate the family document"     -> ACTIVATE_DOCUMENT

utterances:
  - what projects are open
  - which models are open right now
  - list the open Revit files
  - how many projects do I have open
  - which one is active
  # ADDED 2026-10-09, row 5b-387. The routing table above claims these
  # sentences, and a comment is not indexed, so ranking decided: "how many
  # Revit files are open": READ_MODEL_FILE_INFO answered it on both backends;
  # "which models do I have open": COMPARE_MODELS on the trained backend
  # answered it.
  - how many Revit files are open
  - which models do I have open
  # ADDED 2026-10-16, version 2 (row 5b-435): the families open in the Family
  # Editor. Measured against main on three backends before they went in - see
  # the row.
  - which families are open
  - what family windows are open
  - has the family been saved

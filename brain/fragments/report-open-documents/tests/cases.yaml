positive:
  - given: three projects open, one of them the active one
    expect: >
      all three listed with title and full path, the active one marked, and the
      count saying three. The path is the column that makes the list actionable

  - given: two open projects both called "Project1", saved in different folders
    expect: >
      BOTH listed, their differing paths visible, and a finding naming the
      collision out loud. This is the case the fragment exists for - a title
      alone would name neither

  - given: a project that has never been saved
    expect: >
      listed, with the empty path said in words rather than left blank. A blank
      column reads as a bug, and such a project can only be matched by title

  - given: a project with unsaved changes
    expect: >
      marked as such. Anything that might later close a view or switch away is
      worth knowing about before it happens

  - given: >
      version 2 - a project open, and two families open in the Family Editor:
      one saved to a file, one made from a template and never saved
    expect: >
      the project listed and counted exactly as version 1 lists it (count 1);
      familyCount 2, and familyList on ONE line naming both families with their
      category - the saved one with its full .rfa path, the other with NEVER
      SAVED - and a finding naming the never-saved family with Ctrl+S as the
      way to keep it

  - given: version 2 - the never-saved family is the window in front
    expect: >
      that family marked [ACTIVE] in familyList, and no project marked active

  - given: >
      version 3 - a saved project, then changed (a wall drawn) more than 15
      minutes after its last save, and not saved again
    expect: >
      fileTimes names the project with its file's last-written time and age -
      "file written HH:mm, N min ago" - and [unsaved changes]; staleFileCount
      1, and a finding naming the project with that time - "the file on disk
      is from HH:mm - everything since is not saved" - and telling the modeller
      to click inside the Revit window before Ctrl+S. The time matches the
      file's Date modified in Windows Explorer to the minute

  - given: version 3 - a saved family open in the Family Editor, the same
    expect: >
      the family in fileTimes with its .rfa's time, staleFileCount 1, and the
      finding naming the family - families are checked exactly as projects

negative:
  - given: a session with two links loaded inside one project
    expect: >
      ONE project listed and the links COUNTED SEPARATELY, not listed as
      projects. THIS IS THE CASE THAT MATTERS. Application.Documents returns
      links too, so counting them as projects would offer a switch to something
      that has no tab to switch to

  - given: a family document open for editing alongside a project
    expect: >
      the family listed in familyList and NOT in documents, titles or paths,
      and not counted in count - it is edited in its own editor and is not a
      project to switch to (version 1 only counted it)

  - given: version 2 - a project open and no family open at all
    expect: >
      familyCount 0 and familyList empty - not a family invented from the
      project, and no NEVER SAVED finding for a family that is not there

  - given: >
      version 3 - the same project as the positive case, saved with Ctrl+S
      after a click inside the Revit window, then read at once
    expect: >
      fileTimes gives that project's file a time of now - "under a minute ago"
      - with no [unsaved changes]; staleFileCount 0 and no "not saved" finding.
      THE NEGATIVE THAT MATTERS: a save that reached the disk is never called
      stale

  - given: >
      version 3 - a project with unsaved changes made less than 15 minutes
      after its last save
    expect: >
      its time and [unsaved changes] in fileTimes, staleFileCount 0, and no
      "not saved" finding - recent unsaved work is not called stale

  - given: version 3 - a project never saved
    expect: >
      not in fileTimes - it has no file - and named by the NEVER BEEN SAVED
      finding exactly as version 2 names it; staleFileCount does not count it

  - given: a session with no project open at all
    expect: >
      an empty list, a count of zero, and it said plainly - not an error, and
      not a silent empty result

  - given: any run at all
    expect: >
      NOTHING OPENED, NOTHING CLOSED, NO TRANSACTION. This reports. Acting on
      what it returns is SWITCH_ACTIVE_PROJECT's job

second_route:
  - >
    Revit's own View tab > Switch Windows and the title bar. What is listed here
    should match what the user can see and click, one for one - the projects
    in `documents`, the families in `familyList` - and the links that are
    counted rather than listed should be the ones with no window

  - >
    For a family listed NEVER SAVED: Ctrl+S in that window opens Save As rather
    than saving in place, which is Revit saying the same thing

  - >
    Version 3: Windows Explorer's Date modified column on the .rvt or .rfa
    named in fileTimes. The two times agree to the minute; a fileTimes time
    that does not move after a save is the save not reaching the disk

  - >
    The Manage Links dialog, for the linked models this fragment only counts.
    Two numbers that disagree mean the split between project and link is wrong

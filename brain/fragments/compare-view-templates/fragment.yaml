id: FRG-VIEW-132
semantic-identity: "where do these two view templates differ"
kind: action
domain: revit.views
capability: COMPARE_VIEW_TEMPLATES
version: 1
source: OFFICIAL
risk: READ

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# ONLY WHERE THEY DIFFER, as "setting: A value | B value": view type, scale,
# detail level, visual style, discipline, phase filter; template parameters
# ticked in one only; categories hidden in one only, or with a different line
# colour, weight, halftone or transparency override; filters applied in one
# only, visible in one only, or overridden differently.
#
# REPORT_VIEW_TEMPLATE_CONTROL says which template controls one view's
# setting; this compares two templates. COMPARE_ELEMENTS compares parameters
# of elements, not a template's visibility.
#
# READ ONLY - opens no transaction.
purpose: >
  Compares two view templates and lists only where they differ - scale,
  detail level, visual style, discipline, phase filter, which settings each
  controls, category visibility and overrides, and filters.

contract:
  needs:
    - name: doc
      type: Document
    - name: templateA
      type: string
      source: request
    - name: templateB
      type: string
      source: request
  provides:
    - name: differences
      # ONE STRING, a line per difference, A on the left and B on the right.
      role: result
      type: string
    - name: differenceCount
      role: result
      type: int
    - name: refused
      # Why nothing was compared - a template not found; null otherwise
      # (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>

proof:
  date: '2026-10-18'
  by: Ajmal PS
  model: Project1 (3,081 elements), Revit 2020, session 30308
  positive_case: 'run as it would normally be run. returned a ViewPlan, b ViewPlan, differ
    Action`3, differenceCount 1, differences Category Topography: hidden | shown, findings
    1 item(s) [1 difference(s) between "Architectural Plan" (left) and "Sit...], lines 1 item(s)
    [Category Topography: hidden | shown], look Func`2, refused (null), shown Func`3, template
    Func`2. inputs came templateA as given; templateB as given. on Project1'
  negative_case: 'run with categoryName=Walls, inViewOnly=FloorPlan: Level 1, templateA=Architectural
    Plan, templateB=Architectural Plan instead - chosen because it should not contain what
    this fragment reports. returned a ViewPlan, b ViewPlan, differ Action`3, differenceCount
    0, differences , findings 1 item(s) [Both names are the same template.], lines 0 item(s),
    look Func`2, refused Both names are the same template., shown Func`3, template Func`2.
    inputs came templateA as given; templateB as given. on Project1'
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: 3613afd14b51d69e

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. View.Scale, DetailLevel, DisplayStyle,
  GetTemplateParameterIds, GetNonControlledTemplateParameterIds,
  GetCategoryHidden, IsCategoryOverridable, GetCategoryOverrides, GetFilters,
  GetFilterVisibility and GetFilterOverrides, the OverrideGraphicSettings
  members read, and VIEW_DISCIPLINE and VIEW_PHASE_FILTER are present 2020
  through 2027 - read off RevitAPI.xml in the Nice3point reference packages for
  all eight releases on 2026-10-12.

# ROUTING - the same rows are in the fragments named here.
#
#   "what is different between these two templates" -> here
#   "compare the mechanical and plumbing templates" -> here
#   "why is this setting greyed out"          -> REPORT_VIEW_TEMPLATE_CONTROL
#   "compare these two ducts"                 -> COMPARE_ELEMENTS

utterances:
  - what is different between these two view templates
  - compare the mechanical plan template with the plumbing one
  - where do these view templates differ
  - check these two templates against each other

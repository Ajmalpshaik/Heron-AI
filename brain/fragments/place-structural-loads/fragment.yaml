compatibility-note: >
  Hosted loads on every release, through two branches read with
  tools/api-surface --members on 2026-11-01. 2020 to 2022 (#if REVIT2020 ||
  REVIT2021 || REVIT2022): Element.GetAnalyticalModel(), and
  PointLoad.Create(Document, AnalyticalModelStick, AnalyticalElementSelector,
  XYZ, XYZ, PointLoadType), LineLoad.Create(Document, AnalyticalModelStick,
  XYZ, XYZ, LineLoadType), AreaLoad.Create(Document, AnalyticalModelSurface,
  XYZ, AreaLoadType). 2023 to 2027: AnalyticalToPhysicalAssociationManager,
  AnalyticalMember, AnalyticalPanel and the same three Creates taking the
  analytical ElementId. FREE LOADS 2020 TO 2023 ONLY: the Creates taking a
  point, two points or curve loops and no host are present 2020-2023 and gone
  at 2024, and RevitAPI.xml 2024 to 2027 documents no unhosted route, so from
  2024 a free load is refused with that reason. Values go in through
  UnitUtils.ConvertToInternalUnits - DisplayUnitType.DUT_KILONEWTONS,
  DUT_KILONEWTONS_PER_METER and DUT_KILONEWTONS_PER_SQUARE_METER in 2020
  (#if REVIT2020), UnitTypeId.Kilonewtons, KilonewtonsPerMeter and
  KilonewtonsPerSquareMeter from 2021. LoadBase.LoadCaseId (get; set),
  OrientTo and IsOrientToPermitted are alike 2020-2027. Whether a point load
  on a column's base or top lands where Revit's own tool puts it has not been
  seen in Revit.

# ROUTING (2026-11-01) - the same rows are in REPORT_STRUCTURAL_LOADS,
# CREATE_LOAD_CASE and PLACE_BOUNDARY_CONDITIONS.
#
#   "put a 10 kN point load on this beam end"    -> here, kind point, value
#                                                   10, at end; the load case
#                                                   asked
#   "add a 5 kN/m line load along this beam"     -> here, kind line, value 5
#   "add a 2.5 kPa area load on this slab"       -> here, kind area, value 2.5
#   "list the loads on this beam"                -> REPORT_STRUCTURAL_LOADS
#   "add a load case called Wind X"              -> CREATE_LOAD_CASE
#   "add a pinned boundary condition at these column bases"
#                                                -> PLACE_BOUNDARY_CONDITIONS
utterances:
  - put a 10 kN point load on this beam end
  - add a 5 kN/m line load along this beam
  - add a 2.5 kPa area load on this slab

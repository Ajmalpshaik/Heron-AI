id: FRG-DOC-057
semantic-identity: "create, copy, rename or delete a DWG, DGN, PDF or print export setup by name"
kind: action
domain: revit.export
capability: MANAGE_EXPORT_SETUPS
version: 1
source: OFFICIAL
# MODIFY, NOT PUBLISH. A setup is an element in the model and changing one
# writes no file; the export itself is EXPORT_VIEWS_TO_DWG's, at PUBLISH.
risk: MODIFY

# WRITTEN 2026-11-01 FOR FRAGMENT-ISSUES ROW 5b-1360: Ajmal PS asked to rename
# the DWG/DXF export setup "Setup 1" to "Tags Export" on his Revit 2020 job
# model 4355-BHVD-3D-50S20-BL001A, and had to do it by hand. The shape is
# MANAGE_SHEET_SETS': one card, a `mode`, a name that does not exist refused
# naming it. Research: docs/work-notes/investigations/2026-11-01-export-setups.md.
#
# A NEW CARD, NOT A WIDENING. MANAGE_SHEET_SETS and SET_PRINT_SETTINGS are
# PROVEN - a change under either's impl/ makes its proof stale - and neither
# is about an export setup. Print settings are here for duplicate, rename and
# delete only: making one is SET_PRINT_SETTINGS' save-as, and stays there.
purpose: >
  Creates, copies, renames or deletes a saved export setup by name - the
  DWG/DXF export setups, the DGN export setups, the PDF export setups (Revit
  2022 and later) and the print settings. Copying keeps every option of the
  setup it starts from under the new name.

  **A NAME THAT IS NOT THERE IS REFUSED, NAMING IT AND THE ONES THAT ARE.**
  So is a new name already in use for that kind, and a name found under two
  kinds when the kind was not said.

  **DELETING A SETUP IS DESTRUCTIVE.** It is asked for by name, one setup at
  a time, and needs the modeller's yes for that setup first (Article 7).

  **PRINT SETTINGS GO THROUGH THE PRINT MANAGER**, which is application state
  and not undone by Undo, so the current print setting is put back afterwards
  and the reply says which it is.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The setup acted on - for create, the name of the new one.
    - name: setupName
      type: string
      source: request
    # "create" | "duplicate" | "rename" | "delete". "copy" reads as duplicate.
    - name: mode
      type: string
      source: request
    # The name a copy or a rename ends up with. Not used by create or delete.
    - name: newName
      type: string
      source: request
      optional: true
      absent: none
    # "dwg" (DWG and DXF are one setup), "dgn", "pdf", "print" - or left out,
    # and the name is looked for under every kind. Create needs it said.
    - name: kind
      type: string
      source: request
      optional: true
      absent: any
  provides:
    - name: done
      role: result
      type: bool
    - name: kindUsed
      # The kind the setup was found or made under, in the dialog's words:
      # "DWG/DXF", "DGN", "PDF", "print". Empty when nothing was found.
      role: result
      type: string
    - name: nowCalled
      # The name the setup has after the call - the new one for create,
      # duplicate and rename; empty for delete and whenever nothing was done.
      role: result
      type: string
    - name: setupsNow
      # Every setup of that kind after the call, read back from Revit rather
      # than assumed, "; " between them.
      role: result
      type: string
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and said
      # no. Never a thing it FOUND (D-52).
      role: accounting
      type: string
    - name: note
      # Something worth knowing that is not the answer: the deleted setup was
      # the active one, a copy's layer rows differ from its source's, or which
      # print setting is current afterwards. Never a finding.
      role: accounting
      type: string


compatibility-note: >
  `ExportDWGSettings` and `ExportDGNSettings` - `ListNames`, `FindByName`,
  `GetActivePredefinedSettings`, `Create(doc, name)`, `Create(doc, name,
  options)`, `Get/SetDWGExportOptions`, `Get/SetDXFExportOptions`,
  `Get/SetDGNExportOptions` - `Element.Name { get; set; }`,
  `Document.Delete(ElementId)`, `PrintSetup.CurrentPrintSetting`, `SaveAs`,
  `Rename`, `Delete` and `InSession` are the same 2020 through 2027
  (tools/api-surface --members, 2026-11-01). `ExportPDFSettings` -
  `ListNames`, `FindByName`, `IsValidName`, `Create`, `GetOptions` - is 2022
  on: on 2020 and 2021 a PDF setup is refused as needing 2022, and that code
  is compiled out. No ElementId is read as a number.

# ROUTING - the same rows are in LIST_EXPORT_SETUPS and
# SET_EXPORT_SETUP_OPTIONS.
#
#   "rename the DWG export setup Setup 1 to Tags Export" -> here, rename
#   "copy Setup 1 as MEP Export"         -> here, duplicate
#   "delete the export setup Old"        -> here, delete - after a yes
#   "list the export setups"             -> LIST_EXPORT_SETUPS. A QUESTION
#   "set Setup 1 to export in millimetres"
#                                        -> SET_EXPORT_SETUP_OPTIONS
#   "save this as a print setting"       -> SET_PRINT_SETTINGS, which makes
#                                           a print setting from the paper
#                                           size it sets
#   "rename the sheet set"               -> MANAGE_SHEET_SETS. A sheet set is
#                                           WHAT is exported; a setup is HOW
#   "export the views to dwg"            -> EXPORT_VIEWS_TO_DWG. A PUBLISH

utterances:
  - rename the dwg export setup Setup 1 to Tags Export
  - copy Setup 1 as MEP Export
  - make a new dwg export setup
  - delete the export setup

compatibility-note: >
  The same Revit calls as PLACE_MEP_FITTING and nothing else -
  `Document.Create.NewElbowFitting`, `NewTransitionFitting`, `NewUnionFitting`,
  `NewTeeFitting` and `NewCrossFitting`, with `MEPCurve.ConnectorManager`,
  `Connector.Origin`, `Connector.IsConnected`, `Connector.CoordinateSystem` and
  `Connector.Radius` / `Width` / `Height` - all unchanged 2020 to 2027.

  Millimetres to feet is arithmetic - divide by 304.8, per D-20.

# 2026-11-01 - PLACE_MEP_FITTING WAS MERGED INTO THIS CARD (version 3) on the
# owner's instruction ("make sure there is no duplicate tools"), and is
# DEPRECATED. The same job: the fitting two, three or four open duct or pipe
# ends call for, chosen from the geometry, nothing moved to close a gap. Where
# its outputs are now: its `created` (one fitting) is this card's `created`
# list, one entry for one joint; its `refused` is this card's `refused`, set
# when nothing was fitted, with the gap named as it named it; its
# `notMepCurve` is this card's `notMepCurve`. Added in version 3: `gaps`,
# `noOpenEnd` and `refused`. Its proof is the record of what its code did.
#
# THE CONFLICT, AND THE SAFER RULE KEPT: PLACE_MEP_FITTING built a transition
# with the ends in whatever order they were found; this card puts the LARGER
# end first, measured 2026-09-23 (a short run was turned inside out the other
# way). Its rule that two to four RUNS are handed in is not carried as a
# refusal of five runs - five runs is a layout here - but as the rule it
# protected: no fitting joins more than four ends, and a point where five meet
# fails the whole job. Its "Revit declined to build the fitting" is this
# card's throw with Revit's words, which rolls the whole job back (Article 8).

# ROUTING - the neighbours this must not be confused with. Repeated in
# CREATE_DUCT_RUNS, TRACE_CONNECTIVITY and SPLIT_MEP_RUN.
#
#   "fit all the joints"            -> here
#   "put the elbows and tees in"    -> here
#   "join these two"                -> here - one joint, two runs handed in
#                                      (PLACE_MEP_FITTING until 2026-11-01)
#   "connect these two ducts"       -> here
#   "put an elbow here"             -> here - the elbow is CHOSEN, not named
#   "is this duct connected"        -> TRACE_CONNECTIVITY - a READ, and it must
#                                      not answer a request to change the model
#   "split this duct"               -> SPLIT_MEP_RUN - the opposite job
#   "join these walls together"     -> JOIN_GEOMETRY
#   "connect the open ends"         -> CONNECT_OPEN_ENDS - ends already at one
#                                      point, no fitting added; it is what joins
#                                      the free ends this leaves
#   "draw a duct from here"         -> CREATE_DUCT_RUNS, which this follows
#   "connect the diffusers to the
#    duct"                          -> CONNECT_AIR_TERMINALS - but NEEDS-CHECKING
#                                      AJ1 saw it lift terminals; see its card
#   "pipe these sprinklers to the main" -> CONNECT_AIR_TERMINALS first - it
#                                      draws the risers and arms; this then
#                                      fits its `runs` (2026-10-14)
#   "jump this pipe over the beam"  -> OFFSET_MEP_SECTION first; this then fits
#                                      its five `runs` (2026-10-14)


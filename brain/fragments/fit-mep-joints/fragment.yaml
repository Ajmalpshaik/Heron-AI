id: FRG-MEP-051
semantic-identity: "put the fitting every joint in these runs calls for, all in one go"
kind: action
domain: revit.mep
capability: FIT_MEP_JOINTS
version: 3
source: OFFICIAL
risk: MODIFY

purpose: >
  Finds every point where two, three or four open duct or pipe ends meet among
  the runs handed in, and puts the fitting the geometry calls for at each one -
  elbow, tee, transition, union or cross - in ONE call and ONE undo step.

  **It exists because one-joint-per-call was the slow half of drawing a run.**
  On 2026-09-23 five rooms of supply duct took 25 quick CREATE_DUCT calls and
  then 90 calls for the fittings - a selection and a PLACE_MEP_FITTING for each
  of 45 joints - although every joint was fully known the moment the ducts were
  drawn. The owner's words: make the ducts, and then the path is known, so the
  fittings can be made at one time.

  **One joint or every joint - the same tool (version 3, 2026-11-01).** Hand
  in two runs and it fits the one joint between them; hand in a whole layout
  and it fits every joint among ALL the runs handed in. PLACE_MEP_FITTING,
  which fitted one joint a call, was merged into this card and is DEPRECATED.
  What it did that this did not is here now: two free ends of different runs
  that are APART are named with the gap - "two open ends 40 mm apart" - in
  `gaps`, and nothing is moved to close it; a run handed in with no open end
  is named in `noOpenEnd`; and when nothing at all is fitted, `refused` says
  why in that card's words - no duct or pipe given, no open end, the gap, or a
  single run whose ends meet nothing. Its two-to-four rule is a rule about one
  joint: a point where five or more ends meet fails the whole job.

  **The fitting is chosen as Revit chooses it**, and that is
  the rule Revit follows when one duct is dragged onto another: two ends at an
  angle make an elbow, two in line a union or - if the size changes - a
  transition, three a tee whose main is the most nearly head-on pair, four a
  cross. Nobody should have to name the fitting.

  **A branch drawn to the side of a main gets a TAP.** An end that lands on
  another run's axis, clear of both its ends, is joined with Revit's takeoff and
  the main is not cut - how a duct type whose routing preference is "Taps" wants
  its branches. The owner's correction, the same day: tap, not tee. Draw the
  main as one straight run and start each branch on its centreline; draw the
  main split at the branch points and three ends meet there, which is a tee.
  Which tap family is built is the duct type's routing preference.

  **Any other lone end is not a joint - unless the size changes at an outlet.**
  An end on a diffuser's neck, or on a unit's outlet of its own size, has
  nothing to fit, so it is counted in `freeEnds` and CONNECT_OPEN_ENDS joins it
  afterwards. An end on the open connector of a unit, terminal or accessory of
  a DIFFERENT size gets a transition, built into the duct and straight onto the
  outlet (version 2, 2026-09-28): draw the main from the outlet at its own size.
  A short outlet-sized piece before the transition, the way this was done
  until then, is what Revit's own Duct Sizing tore up - it deleted the main
  carrying the taps (FRAGMENT-ISSUES 5b-250).

  **All or nothing.** If any joint cannot be fitted the whole job is rolled
  back and every failed joint is named, with where it is and Revit's words
  (Article 8). A run with forty-four fittings of forty-five looks finished and
  carries no air past the gap.

  **Nothing is moved to close a gap.** Ends are grouped only when they already
  sit within the tolerance of one another.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The runs - ducts or pipes. Anything else handed in is counted in
    # notMepCurve and ignored.
    - name: elements
      type: IList<Element>
    # How close two ends must be to count as meeting. A rounding gap, not a
    # hole: 1 mm is the value that was used on the first real run.
    - name: toleranceMm
      type: double
      source: request
  provides:
    - name: fitted
      role: result
      type: int
    - name: created
      role: result
      type: IList<ElementId>
    # The whole answer as ONE string, because a string reaches the reader
    # whole and a list is cut to three items of sixty characters.
    - name: summary
      # ACCOUNTING, not a result: one sentence written on every run, a run that
      # fits nothing included ("0 joint(s) ... all 0 fitted", measured
      # 2026-10-18 on Revit 2020). fitted and created decide (D-51, 5b-1116).
      role: accounting
      type: string
    - name: freeEnds
      # Ends with nothing meeting them, so not joints at all - left open on
      # purpose for CONNECT_OPEN_ENDS. The evidence it looked (D-52).
      role: accounting
      type: int
    - name: ontoOutlets
      # How many of the transitions were built straight onto the open
      # connector of a unit, terminal or accessory (version 2). Also counted
      # in `fitted`; NEEDS-CHECKING AL7 reads it.
      role: result
      type: int
    - name: notMepCurve
      # Handed in but not a duct or pipe, so there was nothing here to fit.
      # A count of what it was GIVEN and could not use (D-52).
      role: accounting
      type: IList<ElementId>
    - name: noOpenEnd
      # VERSION 3, from PLACE_MEP_FITTING: runs handed in whose every connector
      # already carries something, so they had no end to join. Given and
      # unusable as an end - another run may still be tapped onto their side.
      # Never a thing fitted (D-52).
      role: accounting
      type: IList<ElementId>
    - name: gaps
      # VERSION 3, from PLACE_MEP_FITTING: each pair of free ends of different
      # runs, each the other's nearest, with nothing under either, named with
      # where they are and how far apart - "two open ends 40 mm apart".
      # Nothing is moved to close a gap. The evidence it looked (D-52).
      role: accounting
      type: IList<string>
    - name: refused
      # VERSION 3, from PLACE_MEP_FITTING: why NOTHING was fitted, in that
      # card's words - no duct or pipe, no open end, the nearest gap, or one
      # run whose ends meet nothing. Empty when anything was fitted. Never a
      # thing it found (D-52).
      role: accounting
      type: string


heron-step: 14
heron-status: DRAFT
heron-since: 0.1.0
heron-layer: brain

id: FRG-PAR-012
semantic-identity: "clear a parameter back to empty on many elements"
kind: action
domain: revit.parameters
capability: REMOVE_PARAMETER_VALUE
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Clears one named parameter back to EMPTY on many elements, and reports every
  element it could not clear and why.

  **`WRITE_ELEMENT_PARAMETERS` CANNOT DO THIS, AND THE REASON IS ITS OWN BEST
  DECISION.** That fragment takes the value as TEXT on purpose. Writing an empty
  string clears a text parameter and does NOT clear a length, an airflow or one
  that points at another element - those are different storage kinds and an empty
  string is not a value they can hold. Clearing is its own call, and it works on
  all four.

  **AN EMPTY PARAMETER AND A ZERO ARE NOT THE SAME THING, and telling them apart
  is the whole point.** A schedule with a blank means nobody has said; a schedule
  with 0 means somebody said none. Writing "0" to clear a field is the mistake
  this exists to make unnecessary.

  **A READ-ONLY PARAMETER IS REPORTED, NEVER SKIPPED.** Most of the interesting
  ones - Area, Volume, Length - are computed by Revit and cannot be cleared at
  all. Silently passing over them makes a report of forty cleared elements when
  none was.

  **IT WILL NOT CLEAR A TYPE PARAMETER FROM AN INSTANCE LIST.** A type is shared,
  so clearing one from a selection of forty instances changes every other
  instance in the project too. That is refused by name rather than done quietly.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: parameterName
      type: string
      source: request
  provides:
    - name: cleared
      role: result
      type: int
    - name: alreadyEmpty
      # Elements whose parameter was ALREADY empty, so there was nothing to
      # clear. The evidence it looked (D-52).
      role: accounting
      type: int
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Parameter.ClearValue`,
  `Parameter.HasValue`, `Parameter.IsReadOnly` and `Element.LookupParameter` are
  present 2020 through 2027 - read off the reference assemblies at both ends.
  Storage kind is read from `StorageType`, which is unchanged, rather than from
  any of the specification types that moved at Revit 2022.

# ROUTING - repeated in WRITE_ELEMENT_PARAMETERS and DESCRIBE_BLANK_PARAMETERS.
#
#   "clear the value out of this parameter" -> here
#   "empty this field on all of them"    -> here
#   "take the mark off these"            -> here
#   "set the mark on these"              -> WRITE_ELEMENT_PARAMETERS - it takes
#                                           TEXT, and an empty string clears a
#                                           text field but not a length or a
#                                           number
#   "which ones have no value"           -> DESCRIBE_BLANK_PARAMETERS - a READ,
#                                           and the one to run before clearing
#                                           anything
#   "take the mark off these"            -> here for the Mark PARAMETER. A
#                                           section mark on a drawing is
#                                           REPORT_VIEW_REFERENCES

utterances:
  - clear the value out of this parameter
  - empty this field on all of them
  - take the mark off these
  - blank this parameter
  - remove the value from these

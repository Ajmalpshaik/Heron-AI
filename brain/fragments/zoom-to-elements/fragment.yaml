# DEPRECATED 2026-11-01 - MERGED INTO SET_SELECTION (set-selection), on the
# owner's instruction in conversation: "make sure there is no duplicate
# tools", then "ok go ahead merge all". Constitution Article 1: kept, never
# deleted, so its record and its proof stay readable and it can be brought
# back. Nothing offers it now - retrieval leaves DEPRECATED out, and its
# sentences claim nothing in the identity table (heron_search
# RETIRED_FRAGMENTS). Its sentences moved to SET_SELECTION. The proof below is
# the record of what this card's code did, not a claim about today.
deprecated:
  date: '2026-11-01'
  by: Ajmal PS
  superseded-by: SET_SELECTION
  why: >
    The same job - put what was found in front of the modeller, changing
    nothing in the model, at risk EXECUTE. SET_SELECTION version 2 takes show,
    Revit's own Show, which may change the active view and reports the view it
    landed on in viewAfter; keepSelection with show for the camera only, the
    selection left alone; missing, dead ids left out before Show is asked;
    Show never attempted with nothing left; shown and findings. Where the
    rules differed the safer was kept: dead ids are left out of the selection
    as well, and keepSelection without show is refused with nothing touched.
    Not carried, as opposite: alsoSelect, whose false meant do not select -
    leaving a switch out there never stops the selection SET_SELECTION always
    made; this card's alsoSelect=true is show=true, its alsoSelect=false is
    show=true with keepSelection=true.

purpose: >
  Moves the screen to the elements - Revit's own *Show* - so the person can
  actually see what was found.

  **SELECTING IS NOT SHOWING, AND THE DIFFERENCE IS THE WHOLE FRAGMENT.**
  SET_SELECTION highlights elements and does not move the view a millimetre. Ask
  it to show you three fittings on Level 6 while a Level 2 plan is open and you
  get a highlighted nothing: the count says three, the screen says empty, and
  the modeller concludes the tool is broken. This navigates.

  **THE NAME `SHOW_ELEMENTS` IS ALREADY TAKEN BY A DIFFERENT JOB, AND THAT TRAP
  IS THE REASON THIS ONE IS CALLED ZOOM.** SHOW_ELEMENTS means UNHIDE - it
  reverses a hide. *"Show me these"* is the sentence for both, so the two are
  cross-referenced in each other's routing rather than left to a ranking to
  separate.

  **IT CAN CHANGE THE ACTIVE VIEW, AND THAT SURPRISES PEOPLE.** Revit finds a
  view where the elements are visible, which may not be the one on screen. Doing
  it any other way would mean refusing to show anything not already in front of
  the user, which defeats the point. The view it landed on is reported so the
  jump is explainable rather than mysterious.

  **IF NOTHING CAN SHOW THEM, REVIT PUTS UP A DIALOG THIS FRAGMENT CANNOT
  SUPPRESS.** *"There is no open view that shows any of the highlighted
  elements"* is modal, and in the middle of a batch it stops everything until
  somebody clicks it. So this is the last step of a job, not one in the middle
  of a loop, and ids that no longer resolve are dropped first - a deleted
  element is the cheap half of that problem and the half worth removing.

  **SELECTING IS A SEPARATE FLAG BECAUSE THE TWO ARE SEPARATE WISHES.** *"Where
  is it"* wants the camera moved and nothing touched; *"select and show"* wants
  both. Doing both always would replace a selection the user was in the middle
  of building.

  ASSUMES NOTHING ABOUT TRANSACTIONS - it opens none and needs none. It changes
  nothing in the model, which is why it is EXECUTE rather than MODIFY: it acts
  on the session, not the building.

contract:
  needs:
    - name: uidoc
      type: UIDocument
    - name: elements
      type: IList<Element>
    # true also puts them in the selection; false moves the camera only.
    - name: alsoSelect
      type: bool
      source: request
  provides:
    - name: shown
      role: result
      type: int
    - name: missing
      # Ids it was asked to show that resolve to nothing. What it was GIVEN
      # and could not use, never something it showed (D-52).
      role: accounting
      type: IList<ElementId>
    - name: viewAfter
      # The view it LANDED ON, which may not be the one that was on screen. IT
      # CAN CHANGE THE ACTIVE VIEW, AND THAT SURPRISES PEOPLE - so the jump is
      # explainable rather than mysterious.
      role: result
      type: string
    - name: findings
      type: IList<string>


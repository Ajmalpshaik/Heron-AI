compatibility-note: >
  One implementation for every release. `UIDocument.ShowElements(ICollection<ElementId>)`,
  `UIDocument.Selection.SetElementIds` and `UIDocument.ActiveView` are unchanged
  2020 to 2027.

  `UIDocument` comes from the Revit UI namespace the fragment wrapper already
  imports, so it is not written out in full - a fully qualified name would
  smuggle in a namespace the executor was never told to supply.

# ROUTING - repeated in SHOW_ELEMENTS, SET_SELECTION and HIDE_ELEMENTS.
#
#   "where is it"                          -> here
#   "take me to it"                        -> here
#   "zoom to these"                        -> here
#   "show me these"                        -> HERE when they are hidden BY
#                                             DISTANCE - off screen, on another
#                                             level, in another view. This
#                                             moves the camera
#   "show them again"                      -> SHOW_ELEMENTS. That one UNHIDES -
#                                             it reverses HIDE_ELEMENTS or
#                                             ISOLATE_ELEMENTS. It moves no
#                                             camera and it is the answer when
#                                             the elements are hidden BY A VIEW
#                                             SETTING rather than by distance
#   "select these"                         -> SET_SELECTION, which highlights
#                                             and does NOT move the view. On
#                                             another level that looks like an
#                                             empty result
#   "hide these"                           -> HIDE_ELEMENTS
#   "zoom to the beams in the structural
#    link"                                 -> ZOOM_TO_LINKED_ELEMENTS. Show takes
#                                             host ids, and a linked element's
#                                             id means nothing in the host
#
# TWO FRAGMENTS ANSWER "SHOW ME THESE" AND THE DIFFERENCE IS WHY THEY CANNOT BE
# SEEN. Off the screen is this one. Hidden by the view is SHOW_ELEMENTS. The
# sentence does not say which, so both tables carry both.

utterances:
  - take me to these on screen
  - where is it
  - zoom to these
  - zoom in on what you found
  - take me to that element
  - select and show me these

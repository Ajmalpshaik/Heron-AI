# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: a floor of placed, enclosed rooms
    expect: >
      an area for each matching Revit's own Area column to two decimals.
      Compare against a room schedule in Revit, not against a hand measurement -
      the schedule is what gets issued

  - given: a set of MEP Spaces
    expect: >
      areas AND volumes for all of them. Spaces compute volume without the
      project switch rooms need, so a space with no volume is a real fault

  - given: a mixed set of Rooms and Spaces
    expect: >
      both kinds reported in one table with no branch, because both are read
      through the shared base type

  - given: a room whose number is 3.12 and name Meeting Room, on Level 2
    expect: >
      "3.12 Meeting Room, Level 2" in `identities`

negative:
  - given: a project with Area and Volume Computations set to areas only
    expect: >
      every room id in `volumeNotComputed` and NOTHING in `volumes` - not a
      column of zeros. A zero volume reads as a modelling fault and this is a
      project setting

  - given: a room that exists in the schedule but was never placed
    expect: >
      its id in `unplaced`, and NOT in `areas` with a 0. It is a room waiting
      to be placed, not a room of no size

  - given: a room placed where the walls do not close
    expect: >
      its id in `unenclosed` and NOT in `unplaced`. The two need different
      fixes - this one is a wall or a room-bounding setting

  - given: a duct, or anything that is not a Room or a Space
    expect: >
      its id in `notSpatial` and no row anywhere else. The rest of the set
      must still be reported

  - given: the same rooms read twice with nothing changed between
    expect: >
      identical numbers. A drift means the area is being recomputed from the
      boundary rather than read off the element

  # VERSION 2 (2026-11-01) - MEASURE_ROOM_DIMENSIONS merged in. Each FAILS on
  # version 1, which measured no length or width. NOT RUN.
  - given: a plain rectangular room square to project north, 8000 x 4000 mm
    expect: >
      lengths 8000 and widths 4000 within a millimetre (as feet), rotation
      about 0, irregular near 0 - checked against a dimension placed by hand
  - given: THE SAME ROOM ROTATED 30 DEGREES
    expect: >
      STILL 8000 x 4000, rotation about 30, irregular near 0. A bounding box
      gives about 8900 x 7500 here
  - given: a room with a structural column inside it, so its boundary has a hole
    expect: the room's own outside dimensions, not the column's
  - given: an L-shaped room
    expect: irregular clearly above zero
  - given: a room whose longer side runs north-south
    expect: lengths still the longer number
  - given: every room in a project with Area and Volume Computations set to areas only
    expect: volumeComputationOff TRUE, and every room in volumeNotComputed
  - given: one badly-bounded room with no volume where the others compute
    expect: volumeComputationOff FALSE
  - given: an unplaced room and an unenclosed one in the same set
    expect: >
      one in `unplaced` and the other in `unenclosed`, and neither measured -
      MEASURE_ROOM_DIMENSIONS called both unplaced

second_route:
  - >
    build a Revit room schedule with Number, Name, Level, Area and Volume and
    compare it row for row. Revit's own schedule is the second route, not
    another script

# VERSION 2 (2026-11-01) - MEASURE_ROOM_DIMENSIONS WAS MERGED INTO THIS CARD on
# the owner's instruction ("make sure there is no duplicate tools"), and is
# DEPRECATED. Both read a set of rooms and spaces - area, volume, the rooms
# that could not be read - and only that card measured them. What it had and
# this one lacked is here now: LENGTH AND WIDTH ALONG THE ROOM'S OWN WALLS
# (the longest segment of the outer loop, the loop picked by its area, the
# boundary turned in memory - never the bounding box), the ROTATION of that
# axis, HOW FAR FROM RECTANGULAR it is (`irregular`), `unmeasurable`, and
# `volumeComputationOff` said once for the run.
#
# THE SAFER RULE KEPT: an UNPLACED room is kept apart from an UNENCLOSED one.
# MEASURE_ROOM_DIMENSIONS put both in `unplaced` because both have no area;
# one is placed or deleted and the other is a wall or a room-bounding setting
# to fix, and this card tells them apart by the location. Where its outputs
# are now: `lengths`, `widths`, `rotations`, `irregular`, `areas`, `volumes`,
# `volumeComputationOff`, `unmeasurable` -> the same names; `unplaced` ->
# `unplaced` and `unenclosed`, apart.
#
# STILL DRAWS NOTHING. "Put the room sizes on the plan" is DIMENSION_ROOMS,
# which creates real dimensions; a question about a room's size must never be
# answered by something that marks the drawing.
#
# Version 1's proof below no longer described the code (impl/ changed) and
# was kept as the record; DRAFT at the time, until version 2 is proved on a
# real model (D-30).

purpose: >
  The room and space table: number, name, level, area and volume for every
  Room or MEP Space given. Read-only, and it works on both categories at once
  because they share one base type - number, name, level and area are the same
  properties on each.

  **A ZERO VOLUME IS USUALLY A SETTING, NOT A ROOM.** Room volumes are only
  computed when *Area and Volume Computations* is set to compute volumes; with
  it off - which is the Revit default - EVERY room reports zero. Reporting
  those zeros as numbers produces a schedule that says the building has no
  volume, and somebody then goes looking for the modelling fault. Ids with no
  computed volume are named in `volumeNotComputed` instead, so the answer says
  which switch to turn on rather than handing over a column of noughts. Spaces
  compute volume without that switch, so a mixed set can legitimately have the
  volume for its spaces and not for its rooms.

  **AN UNPLACED ROOM IS NOT AN UNENCLOSED ONE, AND ONLY ONE OF THEM IS A
  MODELLING FAULT.** Both report zero area. A room with no location was never
  put in the model - it sits in the schedule waiting to be placed. A room with
  a location and no area was placed somewhere its boundaries do not close. They
  are told apart here by asking for the location, and named separately, because
  the first is deleted or placed and the second is a wall or a room-bounding
  setting to fix.

  **OCCUPANCY AND THE OTHER TEXT COLUMNS ARE DELIBERATELY NOT HERE.** Reading
  one named parameter off a set of elements is `READ_ELEMENT_PARAMETERS`,
  which already handles the instance-then-type lookup and says which elements
  simply do not carry it. Adding a column here would be a second place that
  reads parameters, and the two would drift.

  Version 2 also gives each one's length and width along its own walls, its
  rotation, and how far from rectangular it is.

  Areas are square feet, volumes cubic feet and lengths feet - Revit's
  internal units, per D-20, converted at the edge where the user is.

  ASSUMES NOTHING ABOUT TRANSACTIONS - it opens none and needs none.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
  provides:
    - name: identities
      role: result
      type: IDictionary<ElementId, string>
    - name: areas
      role: result
      type: IDictionary<ElementId, double>
    - name: volumes
      role: result
      type: IDictionary<ElementId, double>
    - name: unplaced
      # A room that was never put in the model. Named separately from
      # `unenclosed` *because the first is deleted or placed and the second is
      # a wall or a room-bounding setting to fix* - two faults, two fixes,
      # both findings.
      role: result
      type: IList<ElementId>
    - name: unenclosed
      # A room placed where its boundaries do not close - the one of the two
      # that IS a modelling fault. A finding, and the reason the pair is split
      # at all.
      role: result
      type: IList<ElementId>
    - name: volumeNotComputed
      # Rooms with no computed volume, NAMED INSTEAD OF HANDING OVER A COLUMN
      # OF NOUGHTS - so the answer says which switch to turn on rather than
      # reporting a building with no volume.
      role: result
      type: IList<ElementId>
    - name: notSpatial
      # Handed in but not a room or a space, so there was nothing here to act
      # on. A count of what it was GIVEN and could not use, never a thing it
      # found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: lengths
      # VERSION 2, from MEASURE_ROOM_DIMENSIONS. The LONGER side of the room's
      # own rectangle, along its own walls - never the bounding box. Feet.
      role: result
      type: IDictionary<ElementId, double>
    - name: widths
      # VERSION 2. The shorter side, the same way.
      role: result
      type: IDictionary<ElementId, double>
    - name: rotations
      # VERSION 2. The room's own axis, degrees from project X, -90 to 90.
      role: result
      type: IDictionary<ElementId, double>
    - name: irregular
      # VERSION 2. How much bigger the room's own rectangle is than the room,
      # in percent - large means genuinely not rectangular, and that room
      # needs splitting rather than quoting.
      role: result
      type: IDictionary<ElementId, double>
    - name: unmeasurable
      # VERSION 2. Rooms and spaces with an area whose own axes could not be
      # established. The evidence it looked, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: volumeComputationOff
      # VERSION 2. Every placed Room read has no volume - Area and Volume
      # Computations is not set to volumes. It explains a column of missing
      # room volumes at once; one room doing it does not set it.
      role: result
      type: bool


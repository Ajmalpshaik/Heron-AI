# VERSION 2 (row 5b-2006, issue #1308): the two points are the TWO elements
# selected in Revit, or two ids typed in `elementIds` UPSTREAM FIRST - the
# typed ids decide. Until version 2 no case below could be arranged: `upstream`
# and `downstream` were single-element needs and `selected` bound one element
# to both. The first two cases of each list are the two ways in; the rest are
# the measuring itself, arranged either way - except the rise, which only typed
# ids can show. Owed in Revit: NEEDS-CHECKING Group QX.

positive:
  - given: >
      SELECTION - a gully and a manhole 24000 mm apart whose invert is 300 mm
      lower, both selected in Revit, nothing typed
    expect: >
      1 in 80, with the finding that the selection has no order and the
      higher one - the gully - was taken as upstream. Selected in either
      order, the same answer

  - given: >
      TYPED IDS - the same two typed in elementIds, gully first ("<gully>,
      <manhole>"), while a third element is selected
    expect: >
      1 in 80, no sentence about the selection's order, and the finding "The
      1 element(s) selected were NOT used - ids were typed, and typed ids
      decide"

  - given: >
      a gully at level 0 and a manhole 24000 mm away whose invert is 300 mm
      lower
    expect: >
      300 mm of fall over 24000 mm, reported as 1 in 80. Check the arithmetic by
      hand - 24000 / 300 is 80, and a fragment that reports 1 in 0.0125 has the
      ratio upside down

  - given: the same two moved 12000 mm apart with the same levels
    expect: 1 in 40 - halving the run doubles the gradient

  - given: a run where the drop is measured against a sloping connection
    expect: >
      the LOWEST point of each element used, not its centre. A drain is set out
      from its invert, and a centre-to-centre figure is wrong by half a diameter
      at each end

negative:
  - given: >
      SELECTION - three elements selected, nothing typed (and, the same case,
      one element selected)
    expect: >
      nothing measured, every number 0, and the finding "3 element(s) are
      selected ... and this measures between exactly TWO points" ("1
      element(s)" for one). THE D-30 NEGATIVE FOR THE SELECTION WAY

  - given: >
      TYPED IDS - one id typed ("<gully>"), then two where the second names
      nothing in the model ("<gully>, 999999999")
    expect: >
      nothing measured, every number 0: "1 element id(s) were typed, and this
      measures between exactly TWO points", then "No element in '<model>' has
      the id 999999999". THE D-30 NEGATIVE FOR THE TYPED WAY

  - given: >
      a downstream point 50 mm HIGHER than the upstream one - TYPED IDS,
      upstream first; a selection would take the higher one as upstream
    expect: >
      reported as a RISE, with no gradient given. THIS IS THE FIRST CASE TO RUN.
      A negative fall carried into a calculation lays a drain uphill, and a
      minus sign is far too quiet a way to say that

  - given: two points at exactly the same level
    expect: >
      no fall available, said in words. Zero fall and a failed measurement look
      identical as a number

  - given: two points directly above one another
    expect: >
      refused as having no horizontal run, with the height difference still
      reported. Dividing by a zero run gives an infinite gradient that looks
      like a very good answer

  - given: a shallow run measured with the sloping length instead of the plan length
    expect: >
      a gradient that is WRONG in the safe-looking direction. The horizontal
      distance is what a gradient is measured along, and using the slope
      overstates what is available

second_route: >
  A level survey read off the model in Revit and the arithmetic done by hand:
  fall divided into run. For a real drain, the invert levels on the drainage
  schedule are the number this must match

id: FRG-SEL-023
semantic-identity: "add these to the set i saved, or take them out of it"
kind: action
domain: revit.selection
capability: UPDATE_SAVED_SET
# VERSION 2 (2026-11-01): CREATE_SELECTION_FILTER was merged into this card on
# the owner's instruction - "make sure there is no duplicate tools" - and is
# DEPRECATED; see the merge block above `utterances`. Version 1's proof below
# is kept as the record; it no longer describes the code, so the card is DRAFT
# until version 2 is proved on a real model (D-30).
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Changes what is in a named selection set that already exists - adds elements,
  removes them, replaces the lot, or deletes the set. The other half of saving
  a set: parking the beams while the ducts are run is only useful if the parked
  set can be corrected afterwards.

  **THE SET LIVES IN THE MODEL, NOT IN THIS SESSION.** It is a real element, so
  it survives the file being closed, it is visible to everybody on the job, and
  Revit maintains it as elements are deleted. That is also why editing one is a
  model change with an undo entry, not a convenience.

  **IDS IN THE SET THAT NO LONGER RESOLVE ARE COUNTED, NEVER SILENTLY
  DROPPED.** A saved set outlives the elements in it. Somebody deletes forty
  beams, the set still names them, and a set that quietly shrinks looks like it
  was edited by somebody. `missing` is that number, read fresh each time.

  **CREATING IS ASKED FOR BY NAME, WITH MODE "create" (version 2).** Asking to
  add to a set that does not exist is almost always the name being wrong -
  spelled differently, or on another model - so it is still refused. Creating
  one silently would leave two sets a letter apart, both half right. Mode
  "create" saves the elements as a new set, read back, applied to no view; a
  name already in use is refused and points at "replace". DRAFT until proved.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: setName
      type: string
      source: request
    # "add" | "remove" | "replace" | "delete" | "create" - the last since
    # version 2, from CREATE_SELECTION_FILTER: a NEW set of the elements handed
    # in, refused when the name is in use, by a saved set or a view filter.
    - name: mode
      type: string
      source: request
  provides:
    - name: setSize
      role: result
      type: int
    - name: changed
      role: result
      type: int
    - name: missing
      # Ids in the set that no longer resolve, read fresh each time. Never a
      # change it made (D-52).
      role: accounting
      type: int
    - name: deleted
      role: result
      type: bool
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string
    - name: filterId
      # VERSION 2, from CREATE_SELECTION_FILTER: the set's id - the one made,
      # or the existing one edited. Invalid when refused.
      role: result
      type: ElementId
    - name: findings
      # VERSION 2, from CREATE_SELECTION_FILTER: what was done, in words - for
      # "create", how many it holds, how many were handed in when Revit kept
      # fewer, and that it is applied to NO view.
      type: IList<string>

proof:
  date: '2026-09-13'
  by: Ajmal PS
  model: test projject (3,492 elements), Revit 2024, session 40932
  positive_case: run as it would normally be run - the arrangement was re-made first by running
    select-in-region, set-selection with this phase's own values - run inside a transaction,
    and Revit reported the transaction group ROLLED BACK afterwards. returned changed 3, deleted
    false, missing 0, operation add, refused , set SelectionFilterElement, setSize 7, wanted
    HERON WALL SET. inputs came elements from the selection (3); setName as given; mode as
    given. on test projject
  negative_case: run with minMm=-2000,23000,0, maxMm=14000,32000,4000, exact=false, categories=Ducts,
    setName=ZZZ NO SUCH SET, mode=add instead - chosen because it should not contain what
    this fragment reports - the arrangement was re-made first by running select-in-region,
    set-selection with this phase's own values - run inside a transaction, and Revit reported
    the transaction group ROLLED BACK afterwards. returned changed 0, deleted false, missing
    0, operation add, refused No saved set called 'ZZZ NO SUCH SET'. Creating one is CREATE_SELECTION_FILTER
    - a name typed differently would otherwise leave two sets, each holding half the work.,
    set (null), setSize 0, wanted ZZZ NO SUCH SET. inputs came elements from the selection
    (3); setName as given; mode as given. on test projject
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  caveat: >-
    THE DECLARED NEGATIVE WAS RUN AND HELD, and is recorded here rather than as the leg because
    it is not an EMPTY case. tests/cases.yaml asks for mode 'add' with elements ALREADY in the
    set, expecting changed 0 and setSize unchanged - 'counting them would report twenty added
    when none were, and the set is the thing somebody checks'. Measured 2026-09-13: the four
    walls already in 'HERON WALL SET' re-added gave changed 0, setSize 4, missing 0. setSize is
    a legitimate non-zero state report there, so the D-30 leg uses a set that does not exist
    instead - setSize 0, changed 0, and a refusal naming CREATE_SELECTION_FILTER as the way to
    make one.
  fingerprint: 5c34a0b218c534a4

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. The selection filter element and its
  get and set of member ids are unchanged 2020 to 2027, and membership is
  compared as ElementId against ElementId rather than as numbers - the
  comparison that survived the id going 64-bit.

# ROUTING - the same rows are in the fragments named here.
#
#   "add these to the saved set"        -> here
#   "take those out of the set"         -> here - declared here and answered
#                                          by identity; since 2026-11-02
#                                          ranking alone puts CUT_GEOMETRY
#                                          first on it (FRAGMENT-ISSUES
#                                          5b-1416). A saved selection set,
#                                          never a cut
#   "delete that selection set"         -> here, mode "delete"
#   "save these as a set"               -> here since version 2, mode
#                                          "create" - it was
#                                          CREATE_SELECTION_FILTER's, merged in.
#                                          "add" to a set that is not there is
#                                          still refused, because a mistyped
#                                          name would leave two sets a letter
#                                          apart
#   "make a selection set"              -> here, mode "create"
#   "i want to find these again later"  -> here, mode "create"
#   "make a filter for supply air"      -> CREATE_VIEW_FILTER - a RULE that keeps
#                                          working as the model changes; a saved
#                                          set is a LIST
#   "put that filter on this view"      -> APPLY_VIEW_FILTER - the step that
#                                          makes a saved set do something to a
#                                          drawing
#   "select what is in that set"        -> SELECT_FROM_SAVED_SET
#   "load a saved selection set and select its elements" -> SELECT_FROM_SAVED_SET
#                                          - this answered it on the spelling
#                                          route. Row 5b-1005
#   "list the saved selection sets in the model" -> REPORT_VIEW_FILTERS - a
#                                          question; this answered it on the
#                                          spelling route. Row 5b-1005
#   "select these in Revit"             -> SET_SELECTION, which is the current
#                                          selection and not saved anywhere
#   "hide these while i work"           -> ISOLATE_ELEMENTS or HIDE_ELEMENTS,
#                                          composed after the set is read
#
# VERSION 2 (2026-11-01) - CREATE_SELECTION_FILTER WAS MERGED INTO THIS CARD on
# the owner's instruction in conversation: "make sure there is no duplicate
# tools", every conflict to keep the SAFER rule. It is DEPRECATED. One saved
# set, made or changed - the same element, the same SetElementIds and the same
# read-back. Where each retired input and output is now:
#
#   CREATE_SELECTION_FILTER             here, mode "create"
#     elements                          elements
#     filterName                        setName
#     filterId                          filterId
#     saved                             setSize, read back; changed beside it
#     findings                          findings
#
# THE SAFER RULE WHERE THEY DIFFERED. CREATE_SELECTION_FILTER, given a name
# that already existed, REPLACED that set's contents and said so after the
# fact. Here "create" with a name already in use is REFUSED with nothing
# written, and the refusal names mode "replace" - the word that says the old
# contents go - and "add". A view filter of that name is refused by name too,
# where that card met Revit's own error ("The given value for name is already
# in use"). Not carried: the silent replace on create.

utterances:
  - add these to the saved set
  - remove these from my selection set
  - update the named set
  - delete that selection set
  - the saved set is out of date
  - take those out of the set
  # MOVED 2026-11-01 from CREATE_SELECTION_FILTER, merged into this card.
  - save these as a set
  - make a selection set
  - save this selection with a name
  - i want to find these again later
  - put these in a named filter

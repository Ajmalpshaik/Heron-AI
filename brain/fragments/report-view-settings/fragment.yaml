id: FRG-VIEW-140
semantic-identity: "how a view is shown - its ratio, detail level, visual style, discipline, phase, phase filter and view range, and where a section or elevation cuts"

# WHY IT EXISTS - a comment, not `purpose`, because `purpose` is searched.
# FRAGMENT-ISSUES row 5b-477: nothing read a view's detail level, visual
# style, discipline, phase or phase filter. On the trained model, private
# stores, 2026-10-14, "what is the detail level of this view" reached
# PLACE_DETAIL_COMPONENTS and "what is the detail level of these views"
# SET_VIEW_PROPERTIES - both writes - "is this view in wireframe or shaded"
# reached SET_VIEW_CAMERA, and "which phase filter does this view use" and
# "what phase is this view showing" reached reads about filters and
# visibility that do not say. This is the read half of SET_VIEW_PROPERTIES
# and SET_VIEW_PHASE. The scale was READ_VIEW_SCALE's and was not repeated -
# until version 2 merged that card in (2026-11-01).
# The second sweep the same night (row 5b-478) found "what is the view range
# of this plan" reaching SET_VIEW_RANGE and "what is the cut plane height"
# LABEL_FAMILY_DIMENSION, both writes - nothing read a plan's view range - so
# the view range was added here before the card was ever run, as the read
# half of SET_VIEW_RANGE.
kind: action
domain: revit.views
capability: REPORT_VIEW_SETTINGS
# VERSION 2 (2026-11-01): READ_VIEW_SCALE and REPORT_VIEW_CUT_PLANES were
# merged into this card on the owner's instruction ("make sure there is no
# duplicate tools"), and are DEPRECATED. From READ_VIEW_SCALE: `viewScales`,
# `scaled` and `noScale` - each view's scale written 1 : N, no number for a
# kind not drawn to a ratio with the reason, and whether the view's template
# holds it, named, read off the template's include list. From
# REPORT_VIEW_CUT_PLANES: `cutPlanes` and `cutViewCount` - where each section,
# elevation and detail view cuts, the way it looks and its far clip, and with
# no view named every one in the model, which is why `views` is optional now.
# Version 1's proof below no longer describes the code and is kept as the
# record; the card is DRAFT until it is proved again.
version: 2
source: OFFICIAL
risk: READ

# HOW IT ANSWERS - a comment, not `purpose`, because `purpose` is searched.
#
# **REVIT'S OWN WORDS.** Each setting is the view's own parameter, found by
# BuiltInParameter and printed with AsValueString under its own name - "Detail
# Level = Fine", "Phase Filter = Show Complete" - as the Properties palette
# shows it, in whatever language Revit runs in.
#
# **A SETTING A KIND OF VIEW DOES NOT HAVE IS NAMED.** A schedule has a phase
# and no detail level; it is listed as "not on this kind of view", never
# given a value.
#
# **A SETTING HELD BY A VIEW TEMPLATE IS MARKED**, read off the template's
# include list as READ_VIEW_SCALE and REPORT_VIEW_TEMPLATE_CONTROL read it,
# because the place to change it is then the template, not the view.
#
# **ONE STRING, ROWS JOINED BY "  ||  "**, for the same reason as
# READ_VIEW_SCALE: a list reaches the chat cut to three entries.
#
# `purpose` HOLDS NO CHANGE VERB - none of set, change, update, adjust,
# switch, make or apply - for the reason READ_VIEW_SCALE's card gives: a READ
# whose searched text names a change takes change requests from the write.
# tests/test_read_view_scale.py holds the verbs out of this card since
# READ_VIEW_SCALE was merged into it, and asks the scale change requests back.
#
# VERSION 2 - THE SCALE, AS READ_VIEW_SCALE ANSWERED IT. **THE SCALE IS
# WRITTEN 1 : N.** `View.Scale` is the denominator, so the number 100 is
# printed "1 : 100". **A KIND WITH NO SCALE HAS NO VIEW SCALE ROW IN THE
# PROPERTIES PALETTE** - a sheet, a schedule, a perspective, a walkthrough, a
# rendering, a report - so each is named with the reason and given no number;
# Revit's own API documentation calls the number a perspective holds
# meaningless. Plans, ceiling plans, structural and area plans, elevations,
# sections, details, drafting views, legends, and 3D views that are not
# perspective are the kinds that have one. **A RATIO HELD BY A TEMPLATE IS
# NAMED WITH THAT TEMPLATE**, read off the template's own include list; a
# template that leaves it free is said so, a template named directly is
# answered with the ratio it holds, and a list that cannot be read is reported
# as unknown, never guessed. The purpose says "ratio" and "drawn at" and keeps
# "scale" scarce, for the reason READ_VIEW_SCALE's card gave: its first draft
# took change requests from the write on ranking.
#
# VERSION 2 - WHERE A SECTION CUTS, AS REPORT_VIEW_CUT_PLANES ANSWERED IT.
# "LOOKING" IS THE OPPOSITE OF ViewDirection: Revit's ViewDirection points
# from the model OUT towards the viewer, so a section looking north has a
# ViewDirection of south, and the answer prints the looking direction. The
# far clip is Revit's own text, on or off and how deep. A plan named has no
# cut plane and is not listed there; with NO view named every section,
# elevation and detail view in the model is.
purpose: >
  Answers how each view named is shown: its detail level, its visual style,
  its discipline, the phase it shows and its phase filter, in the words the
  Properties palette uses, and for a plan its view range - top, cut plane,
  bottom and view depth, each a level and an offset in millimetres - and
  whether each is held by the view template the view follows. It only reads.

  Version 2: the ratio each one is drawn at, written 1 : N as the title under
  it on a sheet shows it, or why it has none - a sheet, a schedule, a
  perspective - and whether that ratio is held by its template, named. And
  for each section, elevation and detail - every one in the model when none
  is named - a point it cuts through in millimetres, the direction it looks
  and its far clip, on or off and how deep.

contract:
  needs:
    - name: doc
      type: Document
    # The views, as the Project Browser names them, several separated by
    # commas - "1 - Mech, {3D}". Two views sharing a name are written
    # "FloorPlan: Level 1" - "Section: Section 1" too - the binding
    # READ_VIEW_SCALE had. Optional since version 2: left out it binds an
    # empty list (HeronBindingNote.AbsentValue), nothing is read for the
    # settings or the ratio, and every section, elevation and detail view in
    # the model is listed for where it cuts - REPORT_VIEW_CUT_PLANES' empty
    # viewName.
    - name: views
      type: IList<View>
      source: request
      optional: true
  provides:
    - name: viewSettings
      # One row per view that has any of the five: "'1 - Mech' (FloorPlan)
      # Detail Level = Medium (held by its view template), Visual Style =
      # Hidden Line, Discipline = Mechanical, Phase = New Construction, Phase
      # Filter = Show All, View Range = Top: Level 2 + 0 mm, Cut plane: Level 1
      # + 1200 mm, Bottom: Level 1 + 0 mm, View depth: Level 1 + 0 mm - follows
      # view template 'Mechanical Plan'".
      role: result
      type: string
    - name: read
      # How many of the views named had at least one of the five - a count of
      # what it FOUND.
      role: result
      type: int
    - name: heldByTemplate
      # How many of those have at least one setting held by their view
      # template. Part of `read`, never more of it (D-52).
      role: accounting
      type: int
    - name: findings
      # A summary line for the settings and one for the ratio, then a line per
      # view with none of the five, one per view with no ratio and why, and
      # any template whose include list could not be read.
      type: IList<string>
    - name: viewScales
      # VERSION 2, from READ_VIEW_SCALE. One row per view that HAS a scale:
      # "'1 - Mech' (FloorPlan) 1 : 100 - held by its view template
      # 'Mechanical Plan' - change it there". Empty when none of the views
      # named is drawn at a scale.
      role: result
      type: string
    - name: scaled
      # VERSION 2, from READ_VIEW_SCALE. How many of the views named were read
      # with a scale - a count of what it FOUND.
      role: result
      type: int
    - name: noScale
      # VERSION 2, from READ_VIEW_SCALE. Views named that have no scale - a
      # sheet, a schedule, a perspective - each named with its reason in
      # `findings`. The evidence it looked, never a scale it found (D-52).
      role: accounting
      type: int
    - name: cutPlanes
      # VERSION 2, from REPORT_VIEW_CUT_PLANES. ONE STRING, a line per
      # section, elevation or detail view: "Section: Section 1 | cuts through
      # -600,600,-500 mm | looking 1,0,0 | far clip Clip with line, 11200".
      role: result
      type: string
    - name: cutViewCount
      # VERSION 2, from REPORT_VIEW_CUT_PLANES (its `viewCount`). How many
      # section, elevation and detail views `cutPlanes` lists.
      role: result
      type: int

proof:
  date: '2026-11-02'
  by: Ajmal PS
  model: P1102 MEP (21,446 elements), Revit 2020, session 59096
  positive_case: 'run with views=Level 1 HVAC Plan - the first of 3 tracked inputs. returned
    cutPlanes , cutViewCount 0, findings 2 item(s) [1 view(s) read; 0 of them have at least
    one setting held by ..., Read 1 view(s) for their scale: 1 with a scale, 0 with none....],
    heldByTemplate 0, named 1 item(s) [Level 1 HVAC Plan], noScale 0, read 1, scaleHeld HashSet`1,
    scaled 1, settingRows 1 item(s) [''Level 1 HVAC Plan'' (FloorPlan) Detail Level = Medium,
    Visua...], viewScales ''Level 1 HVAC Plan'' (FloorPlan) 1 : 50 - its own - no view template,
    viewSettings ''Level 1 HVAC Plan'' (FloorPlan) Detail Level = Medium, Visual Style = Hidden
    Line, Discipline = Mechanical, Phase = New Construction, Phase Filter = Show All, View
    Range = Top: Level 2 + 0 mm, Cut plane: Level 1 + 1200 mm, Bottom: Level 1 + 0 mm, View
    depth: Level 1 + 0 mm. inputs came views as given (1). on P1102 MEP'
  negative_case: "CANNOT COME BACK EMPTY, so proved by TRACKING instead (D-53). report-view-settings\
    \ describes whatever it is given, so no arrangement makes its answer empty. What D-30's\
    \ negative case exists to catch - a fragment that succeeds while doing nothing, or answers\
    \ about a set it was not given - is caught here by the answer following the input exactly\
    \ across 3 different inputs:\n\n      views=Level 1 HVAC Plan -> viewSettings 'Level 1\
    \ HVAC Plan' (FloorPlan) Detail Level = Medium, Visual Style = Hidden Line, Discipline\
    \ = Mechanical, Phase = New Construction, Phase Filter = Show All, View Range = Top: Level\
    \ 2 + 0 mm, Cut plane: Level 1 + 1200 mm, Bottom: Level 1 + 0 mm, View depth: Level 1\
    \ + 0 mm\n      views=Space Schedule -> viewSettings 'Space Schedule' (Schedule) Visual\
    \ Style = Wireframe, Phase = New Construction, Phase Filter = Show All - not on this kind\
    \ of view: Detail Level, Discipline\n      views=3D Duct & Equipment -> viewSettings '3D\
    \ Duct & Equipment' (ThreeD) Detail Level = Medium, Visual Style = Shaded with Edges,\
    \ Discipline = Mechanical, Phase = New Construction, Phase Filter = Show All\n\n    Different\
    \ inputs, exact matches every time. A fragment falling back to the active view, the whole\
    \ model, or a previous run could not do that."
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: e9ec7d9aab7ab005
revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. Read with tools/api-surface --members
  on the reference assemblies of all eight releases, 2020 to 2027, on
  2026-10-14: the BuiltInParameter values VIEW_DETAIL_LEVEL,
  MODEL_GRAPHICS_STYLE, VIEW_DISCIPLINE, VIEW_PHASE and VIEW_PHASE_FILTER,
  `LabelUtils.GetLabelFor(BuiltInParameter)`, `View.IsTemplate`,
  `View.ViewTemplateId`, `View.GetTemplateParameterIds` and
  `View.GetNonControlledTemplateParameterIds` are present with the same
  signature on all eight. `Element.get_Parameter(BuiltInParameter)`,
  `Parameter.AsValueString`, `AsString`, `Parameter.Id` and `Definition.Name`
  are the long-standing members READ_VIEW_SCALE uses the same way. The view
  range reads `ViewPlan.GetViewRange`, `PlanViewRange.GetLevelId` and
  `GetOffset`, the markers `PlanViewRange.Current`, `LevelAbove`,
  `LevelBelow` and `Unlimited`, the `PlanViewPlane` values TopClipPlane,
  CutPlane, BottomClipPlane and ViewDepthPlane, and BuiltInParameter
  PLAN_VIEW_RANGE - all present unchanged 2020 to 2027, read the same way on
  2026-10-14.

  Version 2 adds what READ_VIEW_SCALE and REPORT_VIEW_CUT_PLANES were proved
  with: `View.Scale`, `View3D.IsPerspective` and the BuiltInParameter values
  VIEW_SCALE, VIEW_SCALE_PULLDOWN_METRIC and VIEW_SCALE_PULLDOWN_IMPERIAL
  (READ_VIEW_SCALE's card, 2026-10-09: the kinds of view are an ALLOW list,
  because ViewType 121 is spelt PresureLossReport to 2026 and
  PressureLossReport on 2027; and 2027's VIEW_SCALE_METRIC and
  VIEW_SCALE_IMPERIAL are not compared - a template listing only one of those
  is reported as unknown, NEEDS REAL REVIT); `View.Origin`,
  `View.ViewDirection` and VIEWER_BOUND_FAR_CLIPPING and
  VIEWER_BOUND_OFFSET_FAR (REPORT_VIEW_CUT_PLANES' card, 2026-10-12) - all
  present 2020 through 2027.


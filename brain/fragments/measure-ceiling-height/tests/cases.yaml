# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: a room with one flat ceiling at 2700 mm
    expect: >
      mainHeight 2700 within a millimetre. Check against the ceiling's own
      Height Offset From Level in the Properties palette plus the level - not
      against a section, which measures to the finish

  - given: >
      a room with a MAIN GRID at 2700 and a 400 mm BULKHEAD over one corner
    expect: >
      the main grid as mainCeiling, and BOTH in ceilingsOver with their own
      heights. Taking the first ceiling found is how a report quotes the
      bulkhead as the room's ceiling height, and the whole point is that both
      numbers survive

  # D-59, added 2026-09-28 with version 2. NOT RUN.
  - given: >
      the spaces of this MEP model, under ceilings that are only in the
      architectural link, includeLinks true
    expect: >
      every dictionary unchanged from the host-only run; each space's line
      gives the linked ceiling's clear height in mm and its type, checked
      against the ceiling's Height Offset From Level in the link

  # Row 5b-1128, added 2026-11-11 with version 3. NOT RUN - NEEDS-CHECKING
  # Group NK, NK1. Version 2 answered these rooms exactly as it answers a room
  # with no ceiling.
  - given: >
      two rooms placed with the template's default limits (upper limit below
      2600 mm), each under a ceiling drawn at 2600 mm - the arrangement row
      5b-1128 measured
    expect: >
      both ids in limitBelowCeiling AND in noCeiling, no entry in mainHeight,
      and one finding each naming the room, the height of its upper limit
      above its floor, 1 ceiling above that and 2600 mm. Then raise the
      rooms' upper limit to Level 2 (SET_ROOM_LIMITS) and ask again: both in
      mainHeight at 2600, limitBelowCeiling and findings EMPTY

negative:
  # CORRECTED 2026-11-11 (row 5b-1128). This case said "the ceiling still
  # found ... Nothing here uses the room solid". Measured 2026-10-18, Revit
  # 2020: it is NOT found - the plan-overlap test stops at the top of the
  # room's box, which is its upper limit. Version 3 does not measure it
  # either; it names the room.
  - given: A ROOM WHOSE UPPER LIMIT IS LEFT BELOW ITS CEILING, the common case
    expect: >
      NOT measured, and NAMED: its id in limitBelowCeiling and a finding
      saying it stops short of the ceiling over it - never the silence of a
      room with no ceiling. The positive case above is this one, arranged

  # Row 5b-1128, added 2026-11-11 with version 3. NOT RUN - Group NK, NK1.
  - given: >
      a room whose upper limit IS above its ceiling, and a second room in the
      same plan with no ceiling anywhere over it - a shaft
    expect: >
      limitBelowCeiling and findings EMPTY: the first room is measured, the
      shaft is in noCeiling alone. The new sentence is said only of a room
      with a ceiling over it above its limit

  # Row 5b-1128, added 2026-11-11 with version 3. NOT RUN - Group NK, NK1.
  - given: >
      a room with NO ceiling in its own storey and its limits left at the
      default, directly under a ceiling drawn on Level 2 - the storey above's
    expect: >
      its id in noCeiling ALONE - not in limitBelowCeiling, and no finding.
      Level 2 is above the room's limit, so that ceiling is another storey's,
      and the room must never be told to raise its limit to reach it

  - given: a room directly above another room that has its own ceiling
    expect: >
      only this room's ceiling. The one below overlaps perfectly in plan, so a
      plan-only test with no height check picks it and reports the wrong storey

  - given: a room with genuinely NO ceiling - a double-height space, a shaft
    expect: >
      its id in `noCeiling` and no entry in mainHeight. "No ceiling" is a real
      answer and must be distinguishable from a room the fragment failed on

  - given: >
      a ROTATED room whose ceiling is the same shape and rotation
    expect: >
      the right ceiling still chosen, AND the coverage figure read as
      approximate. Bounding boxes are axis-aligned, so coverage over-reports
      here - it is a ranking aid and not a certified area

  - given: two ceilings covering nearly equal parts of one room
    expect: >
      `coverage` close for both. This is the case where ranking by plan area
      could differ from ranking by intersected volume, and it must be visible
      in the numbers rather than settled silently

  # D-59, added 2026-09-28 with version 2. NONE OF THESE HAS BEEN RUN.
  - given: includeLinks ABSENT, on a model that HAS loaded links
    expect: >
      the same answer as version 1, and linksSearched 0 with the first
      line of linkedMatches reading "Host model only - links not read". The
      switch left out must bind false, not refuse - if the run refuses with
      needs_request_values, the add-in in Revit is older than this change

  - given: includeLinks true on a model with NO links, or with every link unloaded
    expect: >
      linksSearched 0 and "Links asked for, NONE loaded - host only". It must
      NOT read like the absent case: one means there was nothing else to read,
      the other means reload them in Manage Links and ask again

  - given: one linked file placed TWICE, with includeLinks true
    expect: >
      linksSearched 1, not 2 - it counts files, not placements

second_route:
  - >
    cut a section through the room in Revit and dimension floor to ceiling -
    that is the number a person would quote

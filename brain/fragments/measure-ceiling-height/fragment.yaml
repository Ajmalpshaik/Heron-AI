runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `CEILING_HEIGHTABOVELEVEL_PARAM`,
  `Level.ProjectElevation` and `get_BoundingBox(null)` are unchanged 2020 to
  2027, and no units API is touched - heights are handed on in Revit's internal
  feet, with D-20 keeping the millimetre conversion at the edge. Ceilings are
  collected by category rather than by the `Ceiling` class. **The class is
  reachable** - it is in the base DB namespace, measured on 2026-08-31 rather
  than assumed - so this is a choice, not a workaround: a category collector
  catches a ceiling from any family or subclass without a cast, which is what a
  real model contains.

# ROUTING - the same rows are in the fragments named here.
#
#   "make a ceiling over this area" -> CREATE_CEILING - this one only
#                                      MEASURES a ceiling that exists

#   "how much room is there between the duct and the pipe above it" ->
#                                        CHECK_VERTICAL_CLEARANCE - service to
#                                        service. This one is floor to ceiling
utterances:
  - what is the ceiling height in this room
  - how high is the ceiling
  - clear height under the ceiling
  - how much space is there above the ceiling
  - which rooms have a bulkhead
  - the soffit height in here

  fingerprint: 8629c43e77e3836c

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. Reading and writing a sheet's
  additional revisions is unchanged 2020 to 2027, and so is the fact that the
  list holds only the revisions NOT put there by a cloud - which is why a
  cloud-driven one cannot be removed through it.

# ROUTING - the same rows are in the fragments named here.
#
#   "put that revision on these sheets"  -> here
#   "take that revision off the sheets"  -> here, with attach false
#   "cloud this change"                  -> ADD_REVISION_CLOUD, which puts the
#                                           revision on the sheet as a side
#                                           effect and is the other way in
#   "make a new revision"                -> CREATE_REVISION
#   "which sheets carry this revision"   -> LIST_REVISIONS
#   "delete the revision itself"         -> DELETE_REVISION

utterances:
  - put that revision on these sheets
  - add the revision to the drawing list
  - take that revision off these sheets
  - the revision is missing from the title block

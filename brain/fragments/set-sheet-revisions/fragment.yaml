compatibility-note: >
  One implementation for every release. Reading and writing a sheet's
  additional revisions, `ViewSheet.GetAllRevisionIds()`, and
  `RevisionCloud.RevisionId` and `GetSheetIds()` are unchanged 2020 to 2027 -
  read with tools/api-surface --members on each release on 2026-11-07. No
  ElementId is built from an int. So is the fact that the ticked list holds only the revisions NOT put there by a cloud - which is why a
  cloud-driven one cannot be removed through it.

# ROUTING - the same rows are in the fragments named here.
#
#   "put that revision on these sheets"  -> here
#   "take that revision off the sheets"  -> here, with attach false
#   "replace the last revision on these sheets" -> here, with replaceWith
#                                           (version 2). A sheet whose clouds
#                                           keep the old one is named
#   "move the clouds on these sheets to today's revision"
#                                        -> EDIT_REVISION_CLOUDS. This list
#                                           cannot move a cloud
#   "why can't I untick this revision"   -> LIST_REVISION_CLOUDS - a question:
#                                           the clouds that hold it on the
#                                           sheet are the answer
#   "cloud this change"                  -> ADD_REVISION_CLOUD, which puts the
#                                           revision on the sheet as a side
#                                           effect and is the other way in
#   "make a new revision"                -> CREATE_REVISION
#   "which sheets carry this revision"   -> LIST_REVISIONS
#   "delete the revision itself"         -> DELETE_REVISION
#   "create revisions for the dates on the sheets" -> CREATE_REVISIONS_FROM_SHEET_DATES -
#                                         makes a revision per date typed on the
#                                         sheets and adds each to its own sheets

utterances:
  - put that revision on these sheets
  - add the revision to the drawing list
  - take that revision off these sheets
  - the revision is missing from the title block
  # VERSION 2, 2026-11-07 - the owner's own words that day (row 5b-1463).
  - replace the last revision on these sheets
  - make today's revision the last one on these sheets instead of 28-Oct
  - swap revision 20 for revision 21 on these sheets

id: FRG-SHT-021
semantic-identity: "move a revision up or down the project's revision sequence"

# WHY IT EXISTS - a comment, not `purpose`, because `purpose` is searched.
# On 2026-09-28 the owner checked Manage > Sheet Issues/Revisions control by
# control in Revit 2024 and asked for every one of them from chat. Move Up and
# Move Down had nothing behind them in the library.
kind: action
domain: revit.sheets
capability: REORDER_REVISION
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Moves one revision up or down the project's revision sequence - the Move Up
  and Move Down buttons in Sheet Issues/Revisions - one row at a time, or to
  the first or last place, and reads the order back.

  **MOVING A REVISION RENUMBERS IT AND EVERY REVISION IT PASSES**, issued ones
  included. So a move that would change the number of an ISSUED revision is
  refused, naming it: that number is printed on drawings already sent out.

  **ONE REVISION, HANDED IN BY A FIND** - by Revision Sequence, the number the
  dialog shows, or by description. Two found is refused with both named.

  The order before and after is handed back in full. A move that does not read
  back where it was asked is rolled back.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16), so one
  undo puts the order back.

contract:
  needs:
    - name: doc
      type: Document
    # THE revision to move, from the find before this - exactly one.
    - name: elements
      type: IList<Element>
    # "up" or "down" (one row, as the dialog's buttons), or "first" or "last".
    - name: direction
      type: string
      source: request
  provides:
    - name: moved
      role: result
      type: bool
    - name: order
      # The whole sequence before and after, READ BACK - "Seq. 1 'A', Seq. 2
      # 'B'". A string, so every revision prints. The project's order whether
      # or not anything moved (D-52).
      role: accounting
      type: string
    - name: revisionName
      # Which revision, "Seq. N 'description'" as it stood before the move.
      role: accounting
      type: string
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward "did
      # this come back empty" (D-52).
      role: accounting
      type: string


compatibility-note: >
  A compile-time split at 2022, where an independent tag's elbow and end became
  methods taking the reference they belong to and the properties were removed.
  Spatial tags - room, space and area - kept properties on every release and
  are handled in their own branch. Naming either set alone would compile on
  half the range, which is the version-shaped hole that reads as green.

# ROUTING - the same rows are in the fragments named here.
#
#   "make the leaders L-shaped"          -> here
#   "the leaders should bend into the    -> here
#    tag"
#   "the tags are on top of each other"  -> FIND_OVERLAPPING_TAGS, then
#                                           ARRANGE_TAGS. A bent leader is
#                                           left alone by that fragment,
#                                           because bending it was deliberate
#   "stack the tags at the side"         -> STACK_TAGS
#   "centre the room tags"               -> CENTER_ROOM_TAGS
#   "tag these"                          -> TAG_ELEMENTS_IN_VIEW
#   "spread the tags out"                -> ARRANGE_TAGS, which moves heads
#                                           and leaves leader shape alone

utterances:
  - make the tag leaders L-shaped
  - the leaders should bend into the tag
  - straight diagonal leaders are not our standard
  - put a shoulder on the leaders
  - fix the leader shape on these tags

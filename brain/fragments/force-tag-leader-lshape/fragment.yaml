id: FRG-VIEW-088
semantic-identity: "make the tag leaders bend into the tag instead of running diagonally"
kind: action
domain: revit.annotation
capability: FORCE_TAG_LEADER_LSHAPE
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Bends every tag's leader into an L - a short horizontal leg into the tag,
  then a straight run to the element - instead of one diagonal line. The
  drafting standard on most issued drawings, applied in bulk.

  **THE ELBOW WILL NOT TAKE UNTIL THE LEADER END IS FREE.** With the end
  attached, Revit owns the leader's shape and setting an elbow is quietly
  ignored - the call returns, nothing bends, and the tag looks untouched. The
  end condition is set first, which is a real change to how that leader
  behaves: a free end no longer follows its element when the element moves.
  That trade is the whole reason this is a deliberate act rather than a
  setting.

  **AND A ROOM TAG HAS NO END CONDITION TO SET.** The property is not on that
  class at all, on any release - the compile gate caught it the first time this
  was written to mirror the independent-tag branch. Its elbow is set directly
  and read back, which is what says whether it took.

  **TAG CLASSES SHARE NO BASE THAT CARRIES A LEADER.** An independent tag and a
  room, space or area tag each declare their own elbow, end and head. Casting
  to the independent kind alone silently skips every room tag in the set and
  reports the rest as done, so both are handled explicitly - which the compiler
  checks, and a name lookup does not.

  **THE LEG IS A PAPER LENGTH.** How long the horizontal shoulder should be is
  judged on the printed sheet, so the number is multiplied by the view scale.
  A model-distance leg is invisible at 1:200 and absurd at 1:20.

  **THE LEG POINTS TOWARD THE ELEMENT.** A shoulder that leaves the tag on the
  wrong side crosses back over the text, which is worse than the diagonal it
  replaced.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: view
      type: View
      source: request
    - name: elements
      type: IList<Element>
    # PAPER MILLIMETRES, and it no longer sets the shoulder's length -
    # nothing does. Both legs now fall out of the geometry as the separation
    # between the element and the head. This is the GUARD STUB: how far the
    # head must sit across from the element before a corner is worth drawing
    # at all, and how big the sideways hook is when it is not. Scaled by the
    # view, like every clearance here.
    - name: legMm
      type: double
      source: request
  provides:
    - name: bent
      role: result
      type: int
    - name: upTheSheetLeftStraight
      # Runs lying UP the plan rather than across it. Left straight on
      # purpose: their leader already drops onto them cleanly and a corner
      # would be a kink in something correct. They also keep their ATTACHED
      # end, because nothing was written and so nothing had to be freed.
      role: accounting
      type: IList<ElementId>
    - name: alreadyStraight
      # Tags whose head already sits on the element's own row, so the leader
      # is one clean horizontal line with no corner to make. DONE, not
      # refused: a straight leader is the right answer to that geometry, and
      # bending it would put a kink in something already correct. Accounting,
      # because it is the evidence it looked rather than a bend it made (D-52).
      role: accounting
      type: IList<ElementId>
    - name: hooked
      # Tags whose head sat almost directly over the element, where a corner
      # would collapse onto the line. Given a small sideways hook at the
      # head's level instead. These ARE bent, and are counted in `bent` too -
      # this says which ones took the degenerate route.
      role: accounting
      type: IList<ElementId>
    - name: endsAttached
      # Leader ends put BACK to attached after the corner was placed. An
      # attached leader follows its duct when the duct moves; a free one does
      # not, so this is the state a drawing has to be left in.
      role: result
      type: int
    - name: legStillTrue
      # Tags whose run to the duct is STILL true after being re-attached -
      # end and corner still share an across-coordinate. Re-attaching hands
      # the end back to Revit, which may move it; this is the measurement of
      # whether it did, not an assumption that it did not.
      role: result
      type: int
    - name: cornerMovedToEnd
      # Tags whose corner had to be rebuilt over the end Revit chose when the
      # leader was re-attached. Dragging the end onto the corner only holds
      # while the leader is free; attaching undoes it. Building the corner
      # over the attached end instead cannot be undone, because attaching has
      # already happened by then.
      role: result
      type: int
    - name: legWentDiagonal
      # Tags whose run went diagonal again once re-attached. The honest other
      # half of legStillTrue - if this is not empty, an attached end and a
      # true L cannot both be had by this route, and that is worth knowing
      # rather than hiding.
      role: accounting
      type: IList<ElementId>
    - name: endsLeftFree
      # Ends that could NOT be put back. Each one is a leader that has
      # stopped following its duct, so it is named rather than counted.
      role: accounting
      type: IList<ElementId>
    - name: endsMoved
      # Leader STARTING points moved onto the corner's across-position. This
      # is what makes the run down to the element true rather than a
      # diagonal: the corner is only one end of that leg, and setting it
      # alone leaves a short shoulder with a long diagonal hanging off it.
      role: result
      type: int
    - name: usedLeaderEnd
      # Tags whose host gave no location, so the corner had to be taken from
      # the leader end instead. The weaker route, and the one that produced a
      # degenerate run when it was the only route. Counted so it is never
      # silent (D-52).
      role: accounting
      type: IList<ElementId>
    - name: noLeader
      # Tags with no leader, so it could not be bent. The evidence it looked,
      # never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: notTags
      # Handed in but not tags, so there was nothing here to act on. A count
      # of what it was GIVEN and could not use, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>


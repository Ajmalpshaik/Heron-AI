compatibility-note: >
  One implementation for every release. `ViewSheet.Create`, `SheetNumber`,
  `Name`, `IsPlaceholder` and collecting `OST_TitleBlocks` on a sheet are
  unchanged 2020 to 2027, and no units call is made. `ElementId` values are
  collected and resolved only, never converted to or from an integer, which
  keeps this clear of the 2024 width change.

utterances:
  - duplicate these sheets
  - make a copy of this sheet
  - i need another sheet like this one
  - copy the sheet with a new number
  - duplicate the drawing sheet
  - create sheets based on these

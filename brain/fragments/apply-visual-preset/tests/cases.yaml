# D-30: the negative case is what catches "succeeded and did nothing".
# The count tracks the view (D-53): a view already given the preset changes
# nothing the second time, and a plan takes fewer settings than a 3D view.

positive:
  - given: >
      the perspective view "Heron Frame - Heater" framing a duct heater in a
      scratch copy of Project1 (Revit 2020), preset Equipment Close-up,
      renderFor check - REPORT_VISUAL_PRESET run first and its wouldChange
      noted
    expect: >
      changed equal to that wouldChange, skipped 0, and readBack giving every
      setting "(as the preset)": Realistic, sun 80, shadow 40, edges off, the
      light grey gradient, lighting 135/35 relative to view, Draft, Screen,
      Exterior: Sun only, colour 245,245,245, exposure 13 / 6500. A finding
      names Cast Shadows and Ambient Shadows as the modeller's to tick. Open
      the view: the heater drawn Realistic on a light grey ground, lit from
      the top right. Revit's Rendering, Sun Settings and Graphic Display
      Options dialogs show the same
  - given: the same call again, straight after
    expect: >
      changed 0, alreadySo equal to the first run's changed plus its alreadySo
      - the count follows the view (D-53)
  - given: >
      an elevation of the project, preset Presentation Elevation
    expect: >
      Shaded with Edges, silhouettes on, depth cueing start 0, end 100, fade
      50 and a lighting study at 225/35 relative to the view read back; no
      render setting in the preset, so none skipped. Open the elevation: the
      light comes from the top left
  - given: the floor plan "Level 1", preset Exterior Day
    expect: >
      the display and sun settings changed and read back; Render Quality,
      Render Output, Render Lighting, Render Background and Exposure skipped,
      each saying only a 3D view has Rendering Settings, and Display
      Background skipped - a plan takes none

  - given: >
      version 4, row 5b-1464 - a 3D view such as "Exterior - Day", preset
      Exterior Day, renderFor issue
    expect: >
      the answer lists noRender and noDisplay among the values that are code,
      by name only, and prints neither sentence - no "is not a 3D view" and no
      "has no Graphic Display Options" anywhere in it. Render Quality and
      Render Output read back as set. Version 3 printed both sentences here
  - given: >
      version 4, row 5b-1464 - the floor plan "Level 1", preset Exterior Day
    expect: >
      each render setting skipped still says "is not a 3D view, and only a 3D
      view has Rendering Settings" - the sentence is made where it is true
  - given: >
      version 4, row 5b-1465 - the 3D view with Sun Intensity set to 60 by
      SET_GRAPHIC_DISPLAY_OPTIONS first, then preset Exterior Day
    expect: >
      a finding "Replaced what '<view>' had:" naming Sun Intensity 60 -> 80
      among the settings it changed, each from and to. Version 3 changed it
      and said nothing

  - given: >
      VERSION 5, row 5b-1472: preset Exterior Day, renderFor issue, on a 3D view
      whose Render Output is Screen (Test for Issue's {3D}, Revit 2024)
    expect: >
      Render Output read back as 300 DPI and counted changed, with nothing
      "not taken". Version 4 left it at Screen: "not taken: Render Output
      (reads Screen) - Revit: The resolution target is not printer."

negative:
  - given: the schedule "Heron Render Schedule", preset Exterior Day
    expect: >
      changed 0, refused "takes none of Exterior Day's settings" and NOTHING
      WAS CHANGED. THIS IS THE FIRST CASE TO RUN
  - given: the camera view, preset "Studio Glow"
    expect: >
      changed 0, refused naming the seven presets; REPORT_RENDER_SETTINGS on
      the view reads the same before and after
  - given: the camera view, preset Clay, renderFor "print"
    expect: refused, saying check or issue, nothing changed
  - given: the camera view, preset Exterior Day, sunTime "teatime"
    expect: refused, "not a time Heron can read", nothing changed

  - given: >
      VERSION 5, row 5b-1472: the same with renderFor check (left out)
    expect: >
      Render Output Screen, as a check preset says - no printer level read,
      nothing refused; the fix touches only a request for a DPI

second_route:
  - the Rendering dialog (View Control Bar teapot), Sun Settings and Graphic Display Options on the same view, read before and after
  - one Ctrl+Z takes the whole look back (Golden Rule 16)

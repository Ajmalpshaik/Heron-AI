positive:
  - given: >
      templatePath "Metric Generic Model" (a name, not a path) and a savePath
      ending .rfa in a scratch folder that exists, on Revit 2024, with --in
      naming a document that is NOT in front
    expect: >
      templateUsed is the full path of Metric Generic Model.rft in this Revit's
      family template folder; the family is saved at exactly savePath; it is
      open in a window and in front - REPORT_OPEN_DOCUMENTS gives its title as
      the active one - and the open-family count rises by ONE, which shows the
      windowless copy was closed rather than left beside it

negative:
  - given: a savePath that already exists
    expect: >
      refused BY NAME saying it already exists, NOTHING created -
      REPORT_OPEN_DOCUMENTS shows the same family count - and the file's time
      stamp unchanged. Never overwritten

  - given: no template, or a template name with no file of that name
    expect: >
      refused by name, naming the folder searched. NOT a fall back to some
      default or near-match template - a guessed template makes the wrong KIND
      of family, which is worse than failing

  - given: a project template (.rte)
    expect: refused naming CREATE_PROJECT_DOCUMENT, nothing created

  - given: a savePath that is relative, ends .rvt, or sits in a missing folder
    expect: refused by name, nothing created, no folder made

  - given: >
      a template saved by a NEWER Revit than the one running
    expect: >
      refused with the reason named. This is the real-world failure on a mixed
      version office and a bare null would explain nothing

  - given: the run aimed at the document in front
    expect: >
      saved, NOT opened, openNext naming the path - Revit opens no window while
      the active document is modifiable. ACTIVATE_DOCUMENT with that path then
      opens it

second_route:
  - >
      File then New then Family by hand from the same template, and the two
      documents' categories and parameter lists compared

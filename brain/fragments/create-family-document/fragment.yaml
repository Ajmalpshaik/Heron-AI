id: FRG-DOC-034
semantic-identity: "start a brand new family from a template and save it where I say"
kind: action
domain: revit.document
capability: CREATE_FAMILY_DOCUMENT
version: 2
source: OFFICIAL
risk: ADMIN

purpose: >
  Starts a new family from a family template, saves it to the file the caller
  names, and opens that file in a Revit window - File > New > Family, then Save
  As, done in one call.

  **VERSION 2, 2026-10-06 - SEEN AND SAVED.** Version 1 made the family in
  memory only. No window showed it, and nothing could save it, because
  SAVE_DOCUMENT refuses a document with no path rather than invent one. So
  every nested part of Rejin's pipe support was started by hand through
  File > New > Family. Now the new family is saved to exactly `savePath`, the
  windowless copy the API makes is closed, and the saved file is opened in a
  window. `title` is what the next call names it by.

  **THE TEMPLATE DECIDES THE CATEGORY AND ALMOST EVERYTHING ELSE**, and it is
  asked for rather than chosen (D-33). A full .rft path is used as given. A
  name alone - "Metric Generic Model" - is looked up by EXACT file name in the
  folder this Revit reports as its family template path, which differs by
  version, language and installation; the full path it used is always
  returned as `templateUsed`. Two files of that name are refused with both
  listed, and no near match is ever taken.

  **THE FILE NAME IS THE CALLER'S AND NOTHING IS OVERWRITTEN.** `savePath` must
  be a full path ending .rfa in a folder that exists. A file already there is
  refused and left untouched, and the save itself is told never to overwrite,
  so a file that appears in between is still safe. No folder is created.

  **WHEN HERON IS WORKING IN THE WINDOW IN FRONT, IT IS SAVED BUT NOT OPENED.**
  Revit opens no window while the active document is modifiable, and Heron's
  own transaction makes it so. Measured 2026-10-06, Revit 2024: refused with
  "The active document is currently modifiable"; with only Heron's group open
  the window opened AND Revit threw an internal error; deferred to Revit's idle
  event it never fired. So the reply says so and gives `openNext`, the path
  ACTIVATE_DOCUMENT opens - that runs with no transaction and opened such a
  file the same day. Aimed (`--in`) at a document that is not in front, the
  family opens in this one call.

  **A PROJECT IS CREATE_PROJECT_DOCUMENT'S**, with the same body word for word
  below its first lines - tests/test_new_document_twins.py holds them level.

  **IT MAKES AN EMPTY FAMILY AND NOTHING ELSE.** No geometry, no parameters, no
  types. The family stays open and is the caller's, like any file opened by
  hand.

  ASSUMES NOTHING ABOUT TRANSACTIONS - a new document cannot be inside the
  current one's, and this opens none.

contract:
  needs:
    - name: app
      type: Application
    - name: uidoc
      type: UIDocument
    # A full .rft path, or a template's file name such as "Metric Generic
    # Model", looked up by exact name in this Revit's FamilyTemplatePath.
    - name: templatePath
      type: string
      source: request
    # The full .rfa path the new family is saved to. Named by the caller and
    # never invented; refused if it exists or its folder does not.
    - name: savePath
      type: string
      source: request
  provides:
    - name: created
      # The family as it is now OPEN IN A WINDOW - the saved file reopened,
      # never the windowless copy the API first makes.
      role: result
      type: Document
    - name: title
      # What the next call names it by: `fragment --in "<title>"`.
      role: result
      type: string
    - name: savedTo
      role: result
      type: string
    - name: templateUsed
      # The full template path a short name resolved to, always reported.
      role: result
      type: string
    - name: openNext
      # Set only when the family was saved but could not be opened because
      # Heron was working in the window in front: the path to hand
      # ACTIVATE_DOCUMENT as documentPath. Empty when it opened here.
      role: result
      type: string
    - name: refused
      # Why it declined, in the user's words - evidence it looked and said no.
      # Never a thing it MADE (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>


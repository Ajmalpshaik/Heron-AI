compatibility-note: >
  `Application.NewFamilyDocument(string)`, `Application.FamilyTemplatePath`,
  `Document.SaveAs(string, SaveAsOptions)`, `Document.Close(bool)` and
  `UIApplication.OpenAndActivateDocument(string)` are present 2020 through 2027
  - read off the reference assemblies at both ends on 2026-10-06, and the
  fragment compile gate builds it against all eight. The template folder is a
  setting of each installation, which is why it is read from Revit rather than
  written here.

# ROUTING - repeated in CREATE_PROJECT_DOCUMENT, LOAD_FAMILY and
# OPEN_FAMILY_FOR_EDITING.
#
#   "start a new family"           -> here
#   "start a new project"          -> CREATE_PROJECT_DOCUMENT - a .rte template
#                                     and a .rvt file
#   "open that saved family"       -> ACTIVATE_DOCUMENT - it is already a file
#   "load this family in"          -> LOAD_FAMILY - it already exists as a file
#   "open that family to edit it"  -> OPEN_FAMILY_FOR_EDITING - it is already
#                                     loaded into the project
#   "what parameters has it got"   -> REPORT_FAMILY_PARAMETERS
#   "upgrade my family library"    -> UPGRADE_FAMILY_FILES

utterances:
  - create a new family
  - start a family from a template
  - make a new family document
  - new family from this template
  - open a new family from the generic model template
  - new family from the metric generic model template and save it as
  - make a new family file

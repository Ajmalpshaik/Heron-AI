heron-step: 14
heron-status: DRAFT
heron-since: 0.1.0
heron-layer: brain

id: FRG-DOC-071
semantic-identity: "which heights a linked point cloud shows a floor, a roof or the ground at, proposed as candidate levels"
kind: action
domain: revit.datums
capability: PROPOSE_LEVELS_FROM_POINT_CLOUD
# VERSION 1 (2026-11-25), written for a modeller learning scan to BIM who had
# just linked a street scan origin to origin and asked for the floor levels to
# be found from the cloud rather than measured by hand. NOT RUN IN REVIT.
# DRAFT until its cases are run on a named model with the negative case (D-30).
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Reads a sample of a linked point cloud's points, sorts their heights into
  thin horizontal bands, and reports each band holding far more points than
  the bands around it as a CANDIDATE level - its height in millimetres and in
  the project's own units, what share of the points it holds, how strongly it
  stands out from its neighbours (HIGH, MEDIUM or LOW), and the nearest level
  already in the model with the distance to it. It also reports how many
  points were read and the lowest and highest height among them. It creates
  nothing.

  **A CANDIDATE IS NOT A LEVEL (D-33).** A dense horizontal layer of points is
  a horizontal surface - a floor slab, a ceiling, a roof, a canopy, the
  ground. Which of them is a level is the modeller's call, and every answer
  says so in words. The heights are handed on as `candidateElevationsMm` so
  that, once the modeller has said yes to some of them, CREATE_LEVELS can make
  those - never on this card's own word.

  **A SCAN TAKEN FROM OUTSIDE HAS NO FLOORS IN IT.** A street scan sees the
  ground and the facades, and at best a canopy, an eave or a parapet. A facade
  spreads its points evenly up its whole height, so it makes no candidate; the
  ground and the roof line do. Every answer says that an outside-only scan
  gives ground and roof or eaves only, so "two candidates" is never read as
  "a two-storey building".

  **IT ANSWERS "NO POINT CLOUD", NEVER A GUESS.** A model with no point cloud
  linked is refused with that said, and so is a name that matches none or
  more than one. A box that holds no points answers with no candidates and
  says why, rather than an empty list that reads as "nothing horizontal here".

  **WHERE THE HEIGHTS ARE MEASURED FROM.** From the internal origin, the same
  space as each level's Project Elevation and as the millimetres CREATE_LEVELS
  takes. The box is passed to Revit in model coordinates, as RevitAPI.xml says
  the filter must be; the points read are carried through the cloud's own
  transform. Points that land more than a metre outside the cloud's extent in
  Revit are said, with a CHECK line, because that is the shape of points read
  in the scan's own coordinates instead.

contract:
  needs:
    - name: doc
      type: Document
    # The point cloud to read, by its name as Manage Links shows it, or part of
    # it. Left out, the only one in the model; with more than one, refused
    # with every name said.
    - name: pointCloudName
      type: string
      source: request
      optional: true
      absent: only
    # The part of the cloud to read, as minX,minY,maxX,maxY in millimetres
    # from the internal origin - one building on a street scan. Left out, the
    # whole cloud's extent.
    - name: boxMm
      type: string
      source: request
      optional: true
      absent: all
    # How tall each height band is. 25 mm is usual; between 5 and 1000.
    - name: bandMm
      type: double
      source: request
      optional: true
      absent: "25"
    # How many points Revit is asked for at most - its own limit is 1,000,000.
    - name: maxPoints
      type: int
      source: request
      optional: true
      absent: "200000"
  provides:
    - name: candidates
      # One line per candidate, bottom to top: height in mm and in the
      # project's units, share of points, how many times its neighbours, HIGH
      # MEDIUM or LOW, and the nearest existing level.
      role: result
      type: IList<string>
    - name: candidateElevationsMm
      # The same candidates' heights in millimetres from the internal origin,
      # for CREATE_LEVELS once the modeller has said which ones.
      role: result
      type: IList<double>
    - name: pointsRead
      role: accounting
      type: int
    - name: zMinMm
      role: accounting
      type: double
    - name: zMaxMm
      role: accounting
      type: double
    - name: pointCloudUsed
      role: accounting
      type: string
    - name: findings
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release but one line. PointCloudInstance.GetPoints
  (filter, averageDistance, numPoints), PointCloudFilterFactory.CreateMultiPlaneFilter
  (IList of Plane), PointCollection's Count and enumerator, CloudPoint's X, Y, Z
  and its conversion to XYZ, Instance.GetTotalTransform and
  Plane.CreateByNormalAndOrigin are each present 2020 to 2027 - read off the
  shipped assemblies of all eight releases with tools/api-surface --members on
  2026-11-25. The height in project units is UnitFormatUtils.Format with
  UnitType.UT_Length on 2020 and with SpecTypeId.Length from 2021 (`#if
  REVIT2020`). The point cloud namespace was added to the fragment imports for
  the filter factory, the one type here that must be named. No ElementId is
  read as a number. Not seen in Revit.

# ROUTING - the same rows are in the fragments named here.
#
#   "find the floor levels from the point cloud" -> here
#   "list the levels" / "what are the floor levels" -> REPORT_LEVEL_ELEVATIONS -
#                                       the levels the MODEL already has; this
#                                       card reads the SCAN, and names the
#                                       nearest existing level beside each
#                                       candidate
#   "add a level" / "make levels at these heights" -> CREATE_LEVELS - the write
#                                       that follows, after the modeller's yes
#   "link a point cloud"              -> LINK_FILES
#   "what is linked in this model"    -> REPORT_EXTERNAL_REFERENCES

utterances:
  # The modeller's request, 2026-11-25, learning scan to BIM with a street
  # scan linked: automate finding the floor levels from the cloud.
  - find the floor levels from the point cloud
  - propose levels from the point cloud
  - what levels does the scan show
  - find the levels from the scan

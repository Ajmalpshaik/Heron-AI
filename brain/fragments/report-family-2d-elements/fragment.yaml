id: FRG-GEO-084
semantic-identity: "what 2D this open family holds - its detail lines, symbolic lines, filled and masking regions and nested families, each with its view, ends, style, visibility, locks, labels and parameter links"
kind: action
domain: revit.families
capability: REPORT_FAMILY_2D_ELEMENTS
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Lists the 2D SIDE of the family open in the Family Editor, element by
  element - the part REPORT_FAMILY_FORMS (the 3D forms) and
  REPORT_FAMILY_LABELS (the labels) do not read. Read before locking,
  labelling, hiding or linking a family's plan symbol, and after it, to see
  that it took.

  **DETAIL LINES AND SYMBOLIC LINES** - a 2D family's lines in its view, and a
  3D family's plan or elevation symbol on its plane: each with its view or
  plane, its ends in millimetres (an arc's centre and radius), its line style,
  and for a symbolic line the detail levels and kinds of view it shows in.

  **FILLED AND MASKING REGIONS** - view, type, extent, and how many edges its
  sketch has. A region's edges are its own and are never listed as loose
  lines; the locks on them are counted under the region.

  **NESTED FAMILIES** - a detail item or a generic annotation in its OWNER
  VIEW, or a model family on its host plane: its type, point, rotation,
  whether it is mirrored, and which of its instance and type parameters are
  linked to this family's.

  **WHAT HOLDS EACH ONE** - every dimension and alignment that references it,
  in words: "locked along Head Top", "locked at an end to Tip", "labelled
  Length to Center (Left/Right)", "EQ with ...", and a dimension left
  unlocked said as such. And what its Visible is linked to.

  **ONE LINE**, rows "||" apart - a list is cut to three entries before
  anyone reads it. **`which` NARROWS IT**: left out or "all" for everything;
  kinds with commas between - "detail line", "symbolic line", "line",
  "filled region", "masking region", "region", "nested"; or the ids the 2D
  tools gave back. Ids and kinds are not mixed; an id that is not a line,
  region or nested family of this family is refused by name and nothing is
  read. A project in front is refused: a family's 2D is read in the family.

  It reads only; nothing is changed.

contract:
  needs:
    - name: doc
      type: Document
    # "all", kinds with commas between, or the long UniqueIds the 2D tools
    # gave back. Left out, everything is read - the same as "all".
    - name: which
      type: string
      source: request
      optional: true
      absent: all
  provides:
    - name: elementCount
      # How many 2D elements matched `which`.
      role: result
      type: int
    - name: elementList
      # Every matching element on ONE line, rows "  ||  " apart: kind, id, view
      # or plane, ends or extent or point, style or type, visibility, Visible
      # and its link, parameter links, and every lock, label and EQ on it.
      role: result
      type: string
    - name: scanned
      # How many lines, regions and nested families the family holds before
      # `which` narrowed them. Work done, never a thing found (D-52): 0 when
      # the call was refused and nothing read.
      role: accounting
      type: int
    - name: notAFamily
      # That the document in front is a project, not a family being edited.
      role: accounting
      type: bool
    - name: refused
      # Why nothing was read, every bad id named. Empty when the call ran; a
      # kind that matched nothing is an answer, not a refusal.
      role: accounting
      type: string
    - name: findings
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  `DetailCurve`, `SymbolicCurve.GetVisibility`, `CurveElement.GeometryCurve`,
  `CurveElement.LineStyle`, `CurveElement.SketchPlane`, `FilledRegion.IsMasking`,
  `FilledRegion.GetBoundaries`, `Element.GetDependentElements(ElementFilter)`,
  `Element.OwnerViewId`, `Dimension.References`, `Dimension.FamilyLabel`,
  `Dimension.IsLocked`, `Dimension.AreSegmentsEqual`, `Dimension.NumberOfSegments`,
  `FamilyManager.GetAssociatedFamilyParameter`, `LocationPoint.Rotation` and
  `FamilyInstance.Mirrored` read the same 2020 through 2027 (RevitAPI
  reference assemblies, read 2026-11-11). One implementation, no #if.

# VERSION 1, 2026-11-11 (row 5b-1496). Asked for by the 2D-in-family audit
# (docs/work-notes/family-2d-capability-audit.md, item 8): after a flow arrow
# was placed, locked and stretched in a diffuser family there was no way to
# read back what was locked to what - REPORT_FAMILY_FORMS reads GenericForms
# only, REPORT_FAMILY_LABELS labels only, LOCK_FAMILY_LINES_TO_PLANES reads the
# ends of the lines it was given and nothing of a nested family or a link.
# A card of its own rather than a widened REPORT_FAMILY_FORMS: that card is
# PROVEN, its rows and its `elements` hand-on are about forms, and widening it
# would send it to DRAFT for a job it does not do.
#
# NOT KNOWN UNTIL RUN (NEEDS-CHECKING Group ND): whether a filled region's
# sketch edges come back from GetDependentElements (the same question as
# LOCK_FAMILY_LINES_TO_PLANES NC2), and whether an alignment's References
# carry the line's own id for an END lock as for an ALONG lock.
#
# ROUTING - see SET_FAMILY_SETTINGS for the whole family-building table.
#
#   "what is locked to the reference planes in this family" -> here
#   "list the symbolic lines in this family"                 -> here
#   "what is the nested arrow linked to"                     -> here
#   "what forms are in this family"                          -> REPORT_FAMILY_FORMS
#   "what labels are in this family"                         -> REPORT_FAMILY_LABELS
#   "what parameters does this family have"                  -> REPORT_FAMILY_PARAMETERS
#   "what is inside this family" (a project's equipment)     -> REPORT_NESTED_FAMILIES

utterances:
  - what is locked to the reference planes in this family
  - list the symbolic lines and filled regions in this family
  - show me the 2D lines in this family with their ends
  - what is the nested arrow family linked to
  - which lines in this family are not locked
  - read back the plan symbol of this family

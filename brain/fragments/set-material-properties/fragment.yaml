compatibility-note: >
  One implementation for every release. Material's Color, Transparency,
  UseRenderAppearanceForShading, MaterialClass, the four Surface/Cut
  Foreground/Background PatternId and PatternColor properties,
  StructuralAssetId, ThermalAssetId, SetMaterialAspectByPropertySet and
  ClearMaterialAspect; PropertySetElement.Create (structural and thermal) and
  Duplicate; StructuralAsset and ThermalAsset constructors; FillPatternElement
  and FillPattern.IsSolidFill and Target; and BuiltInParameter
  ALL_MODEL_DESCRIPTION, ALL_MODEL_INSTANCE_COMMENTS, ALL_MODEL_TYPE_COMMENTS,
  ALL_MODEL_MANUFACTURER, ALL_MODEL_MODEL, ALL_MODEL_COST, ALL_MODEL_URL,
  KEYNOTE_PARAM and ALL_MODEL_MARK are present 2020 through 2027 - read off the
  shipped assemblies with tools/api-surface --members on 2026-10-20. No unit
  API is called: asset values go through SetValueString in the project's units.

# ROUTING - the same rows are in SET_MATERIAL_APPEARANCE,
# CREATE_STARTER_MATERIALS, SET_ELEMENT_MATERIAL and LIST_MATERIALS.
#
#   "set the manufacturer of this material"        -> here
#   "give the material a cut pattern"              -> here
#   "set the density of the steel material"        -> here
#   "set the material colour"                      -> here, "Shading Colour=" -
#                                                     SET_MATERIAL_COLOUR's job
#                                                     since version 2
#   "this pipe has no colour"                      -> here, on the material the
#                                                     segment uses
#   "make a new material"                          -> CREATE_STARTER_MATERIALS
#   "what material is this element"                -> REPORT_MATERIAL_TAKEOFF
#                                                     (READ_ELEMENT_MATERIAL until
#                                                     it was merged there, 2026-11-01)
#   "make the glass look like glass when rendered" -> SET_MATERIAL_APPEARANCE
#   "change the material on these"                 -> REPLACE_MATERIAL
#   "make these columns concrete"                  -> SET_ELEMENT_MATERIAL
#   "show every property of the materials"         -> LIST_MATERIALS
utterances:
  - set the manufacturer and model of this material
  - give the material a cut pattern and a surface pattern
  - fill in the identity tab of these materials
  - set the density and thermal conductivity of the steel material
  - change the class of every TRG material to metal
  # MOVED 2026-11-01 from SET_MATERIAL_COLOUR, merged into this card.
  - set the material colour
  - this material has no colour
  - make the copper material look copper
  - change the shading colour of a material
  # ...and its semantic identity, which nothing else declares:
  - give an existing material its shading colour, and say what it was

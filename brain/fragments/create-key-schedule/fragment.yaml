id: FRG-VIEW-044
semantic-identity: "make a key schedule so one choice fills several fields"
kind: action
domain: revit.schedules
capability: CREATE_KEY_SCHEDULE
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Creates a key schedule - the lookup table where picking one value on an
  element fills in several others. Choose a room's Finish Key and its floor,
  wall and ceiling finishes all follow.

  **A key schedule is not a schedule of things.** CREATE_SCHEDULE lists what is
  in the model; a key schedule is a table of DEFINITIONS that elements point at.
  The two are asked for in nearly the same words and do completely different
  jobs, which is why both carry this table.

  **Not every category can have one, and Revit is asked rather than guessed.**
  The create call throws instead of explaining, so the category is checked first
  and a refusal comes back as a sentence naming the category.

  **The key parameter's name is set here**, because the default is "Key Name"
  on every key schedule in the project and three of them called that is how
  nobody can tell which is which in a dropdown.

  **It creates the table and no rows.** The rows are the definitions somebody
  has to type or import, and a key schedule with no rows offers an empty
  dropdown - which looks broken and is simply new.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # Resolved, never a name: resolving a BIM word to a category is its own job.
    - name: category
      type: Category
      source: request
    - name: scheduleName
      type: string
      source: request
    - name: keyParameterName
      type: string
      source: request
  provides:
    - name: created
      role: result
      type: ElementId
    - name: findings
      type: IList<string>


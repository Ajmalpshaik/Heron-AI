compatibility-note: >
  One implementation for every release. `ViewSchedule.CreateKeySchedule`,
  `ViewSchedule.IsValidCategoryForKeySchedule` and the
  `KeyScheduleParameterName` setter are present 2020 through 2027 - read off the
  reference assemblies at both ends rather than remembered.

# ROUTING - repeated in CREATE_SCHEDULE and ADD_SCHEDULE_FIELDS.
#
#   "make a key schedule"            -> here - a table of DEFINITIONS
#   "set up a finish key"            -> here
#   "make a schedule of the ducts"   -> CREATE_SCHEDULE - a list of what is in
#                                       the model, which is the opposite thing
#   "add a column to the schedule"   -> ADD_SCHEDULE_FIELDS - and it is how the
#                                       key schedule's own columns get added
#                                       after this makes the table

#   "make a sheet list schedule"       -> CREATE_SHEET_LIST - a drawing index
utterances:
  - make a key schedule
  - set up a finish key
  - create a key schedule for the rooms
  - i want one choice to fill several fields
  - make a lookup table for the finishes

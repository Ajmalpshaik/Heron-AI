compatibility-note: >
  One implementation for every release. `ViewSheetSet`, `ViewSheetSet.Name`,
  `ViewSheetSet.Views` (a `ViewSet`, walked by its enumerator), `ViewSheet`,
  `ViewSheet.SheetNumber`, `View.ViewType`, `View.Name` and
  `Document.Title` are present with the same signatures 2020 through 2027 -
  looked up with tools/api-surface --members on every release on
  2026-10-14. 2023 added `IsAutomatic`, `OrderedViewList`,
  `SheetOrganizationId` and `ViewOrganizationId` to a set, which say how
  the dialog ORDERS a set's members; none is read, so every release answers
  the same way and no 2023-only member is called. No ElementId is read as a
  number, so 2024's 64-bit ids do not reach this code - version 2 compares
  members as sets of ElementId by the type's own Equals and GetHashCode,
  present 2020 through 2027 (api-surface --members, 2026-10-17). The same
  collector and member walk answered on Revit 2020 on 2026-10-14 as a
  scratch read - that is not this fragment's proof.


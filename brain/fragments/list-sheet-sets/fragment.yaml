compatibility-note: >
  One implementation for every release. `ViewSheetSet`, `ViewSheetSet.Name`,
  `ViewSheetSet.Views` (a `ViewSet`, walked by its enumerator), `ViewSheet`,
  `ViewSheet.SheetNumber`, `View.ViewType`, `View.Name` and
  `Document.Title` are present with the same signatures 2020 through 2027 -
  looked up with tools/api-surface --members on every release on
  2026-10-14. 2023 added `IsAutomatic`, `OrderedViewList`,
  `SheetOrganizationId` and `ViewOrganizationId` to a set, which say how
  the dialog ORDERS a set's members; none is read, so every release answers
  the same way and no 2023-only member is called. No ElementId is read as a
  number, so 2024's 64-bit ids do not reach this code. The same collector
  and member walk answered on Revit 2020 on 2026-10-14 as a scratch read -
  that is not this fragment's proof.

# ROUTING - the first two rows are also in MANAGE_SHEET_SETS and LIST_SHEETS.
#
#   "how many sheet sets are there"      -> here. A QUESTION
#   "list the view/sheet sets"           -> here
#   "which print sets are there"         -> here
#   "save these sheets as a named set"   -> MANAGE_SHEET_SETS. A CHANGE: it
#                                           creates, renames and deletes a
#                                           set, and reads none back
#   "add these sheets to the set"        -> NOT YET. MANAGE_SHEET_SETS has no
#                                           mode that adds to or takes from an
#                                           existing set - row 5b-466
#   "list the sheets"                    -> LIST_SHEETS - every sheet, which
#                                           is not the same as every set
#   "what views are on this sheet"       -> LIST_VIEWS_ON_SHEET
#   "print these to PDF"                 -> EXPORT_SHEETS_TO_PDF. A PUBLISH
#   "what is in that filter i saved earlier"
#                                        -> SELECT_FROM_SAVED_SET. A saved
#                                           SELECTION set is a different thing
#                                           with one word

utterances:
  - how many sheet sets are there
  - list the view/sheet sets
  - which print sets are there

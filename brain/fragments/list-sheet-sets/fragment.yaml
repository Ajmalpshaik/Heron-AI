# WRITTEN 2026-10-14 FOR FRAGMENT-ISSUES ROW 5b-465. Ajmal PS asked "how many
# sets are there" on his Revit 2020 job model 4355-BHVD-3D-21S10-BL001A, and
# Heron had nothing that read a saved View/Sheet Set: "how many view/sheet
# sets are there in the model" reached REPORT_VIEWPORT_TYPES, weakly, and the
# one fragment that touches a set, MANAGE_SHEET_SETS, is a write that makes,
# renames and deletes them. The answer that day - six sets, one of them empty
# - came from a scratch read under another fragment's contract.
#
# A NEW CARD, NOT A WIDENING OF LIST_SHEETS. LIST_SHEETS is the obvious host -
# a READ that needs only the document - and it is PROVEN: any change under its
# impl/ makes its proof stale, and "list the sheets", one of the most asked
# questions in the library, would go back to DRAFT for an answer about a
# different element. A saved set is not a sheet either: four of the six sets
# on that model held views and no sheet at all. One job, one fragment.
#
# A WRITE'S WORDS ARE KEPT OUT OF THE INDEXED TEXT - identity, purpose and
# utterances - so "make a print set" and "save these sheets as a named set"
# stay with MANAGE_SHEET_SETS. "SAVED" AND "NAMED" ARE LEFT OUT ON PURPOSE.
# Measured 2026-10-14 on both backends: a first wording that called them "the
# saved View/Sheet Sets" and "the named sets" took "save the sheets as a set",
# "store these sheets as a set named IFC" and "save the selected views as a
# view/sheet set" onto this read on the trained model, and "save these sheets
# as a set" on the spelling route - change requests answered by a read. This
# wording moves none of them; its cost is that "show me the saved print sets"
# stays with MANAGE_SHEET_SETS, where main sends it. Row 5b-465.
purpose: >
  Answers which View/Sheet Sets the project holds - the sets the Print and
  Export dialogs list - and what is in each set: its sheets by number and
  name, its other views by name and view type, how many of each, and which
  sets hold nothing at all. A question, read and never changed; it
  opens no transaction.

  **AN EMPTY SET IS FLAGGED.** A set whose sheets and views have all gone
  still appears in the dialog, and holds nothing. It is listed, marked
  EMPTY, and listed again in `emptySets`.

  **TWO SETS HOLDING EXACTLY THE SAME SHEETS AND VIEWS ARE FLAGGED.** Each is
  marked SAME with the other's name, and the pair is listed in `sameSets`.

  **THE IN-SESSION SET IS NOT COUNTED.** It lives only in the Revit session,
  not in the model, so a project with no other set answers none.

contract:
  needs:
    - name: doc
      type: Document
  provides:
    - name: sheetSets
      # The answer, ONE string with " || " between sets, because a list
      # reaches the reply cut to three entries of sixty characters. Each set:
      # its name, how many sheets and views it holds, then every sheet as
      # "number - name" and every view as "name (view type)", "; " between
      # them. An empty set reads "<name> - EMPTY: no sheet and no view".
      # Since version 2, a set holding exactly what another holds reads
      # "<name> - SAME sheets and views as <other> - " and then its counts.
      # Sorted by set name; sheets by number, views by name.
      role: result
      type: string
    - name: setCount
      # How many saved sets the project has - the number the dialog's list
      # shows once its in-session entry is set aside.
      role: result
      type: int
    - name: emptySets
      # The names of the sets that hold nothing, ", " between them. Empty
      # when every set holds something.
      role: result
      type: string
    - name: sameSets
      # Version 2. The sets that hold exactly the same sheets and views,
      # member for member - each group as "A = B", "; " between groups, in
      # name order. Compared by element, never by name or count, and not by
      # print order. Empty sets are not compared (they are in emptySets).
      # Empty when no two sets match.
      role: result
      type: string
    - name: findings
      type: IList<string>


revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  `ItemFactoryBase.NewDetailCurve(View, Curve)` and
  `ItemFactoryBase.NewAlignment(View, Reference, Reference)` - "a new locked
  alignment", which Autodesk's remarks allow between a line and a reference
  plane already aligned - read the same 2020 through 2027 (the RevitAPI
  reference assemblies and XML remarks, read 2026-10-01). That a profile
  family's lines are detail lines drawn this way is from a published Revit
  API answer read 2026-10-01, and is NEEDS-CHECKING BV11, not a promise.
  Version 2 adds the calls CREATE_LINE made, unchanged 2020 to 2027:
  `Document.Create.NewDetailCurve(View, Curve)`, `NewModelCurve(Curve,
  SketchPlane)`, `Plane.CreateByNormalAndOrigin` and `SketchPlane.Create`,
  with `Categories.get_Item(BuiltInCategory.OST_Lines)` for a project's line
  styles. Built on all eight releases on 2026-11-01.

# ROUTING - see SET_FAMILY_CATEGORY for the whole family-building table.
#
#   "draw the profile in this profile family"     -> here
#   "draw the lines of this detail item family"   -> here
#   "draw the valve symbol in plan"               -> DRAW_FAMILY_SYMBOLIC_LINES -
#                                                    a 3D family's 2D symbol
#   "draw a line between these points"            -> here since version 2 -
#                                                    a project's detail or model
#                                                    lines, lineKind said
#                                                    (CREATE_LINE until 2026-11-01)
#   "the lines are drawn twice on top of each other" -> FIND_OVERLAPPING_LINES
#   "draw a grid line"                            -> CREATE_GRIDS - a datum
#   "hatch this area"                             -> DRAW_FAMILY_FILLED_REGION
#                                                    (CREATE_FILLED_REGION until
#                                                    2026-11-01)
#   "draw a room separation line across an opening" -> CREATE_ROOM_SEPARATION_LINES -
#                                                    a line drawn here splits no room
#
# VERSION 2 - WHERE CREATE_LINE'S INPUTS AND OUTPUTS ARE NOW:
#   pointPairs (feet)   shapes, millimetres - "path X,Y; X,Y" per line, `|`
#                       between; in the view's two coordinates, or X,Y on a
#                       horizontal plane with no view
#   asDetail            lineKind detail or model - asked for in a project
#   view                view, by name; left out only for model lines
#   (a point's Z)       planeMm - one plane per call; lines at several heights
#                       are one call each
#   created             created, the same elements; lineIds their ids
#   tooShort            NOT CARRIED - see below
#   refused             refused, one sentence
# NOT CARRIED, AN OPPOSITE RULE: CREATE_LINE skipped a pair shorter than Revit's
# shortest line, counted it in tooShort, and drew the rest. This card refuses
# the whole call and names the piece - all or nothing, the safer rule kept on
# the owner's instruction. A line leaning through space was never drawn by
# CREATE_LINE (it threw); here every line lies on one plane.
#   "what colour are the lines in this family"    -> LIST_CATEGORIES - a question goes to the read

utterances:
  - draw the profile in this profile family
  - draw the lines of this detail item family
  - draw the outline of the handrail profile and lock it to the planes
  - draw lines in this annotation symbol family
  # MOVED 2026-11-01 from CREATE_LINE, merged into this card.
  - draw a detail line here
  - draw a line between these points
  - put a setting out line on this plan
  - add a model line
  - draw some reference lines
  # ...and CREATE_LINE's semantic identity, which nothing else declares:
  - draw plain model or detail lines between points

id: FRG-VIEW-119
semantic-identity: "draw lines from a typed shape - a 2D family's lines in its view, locked to the planes they lie on, or a project's detail lines in a view or model lines on a plane"
kind: action
domain: revit.families
capability: DRAW_FAMILY_DETAIL_LINES
# VERSION 2 (2026-11-01) - CREATE_LINE WAS MERGED INTO THIS CARD on the
# owner's instruction ("make sure there is no duplicate tools", every conflict
# to keep the safer rule), and is DEPRECATED: a PROJECT's detail lines in a
# view and model lines on a plane, from the same millimetre shape language.
# Version 1's proof below no longer describes the code (impl/ changed) and is
# kept as the record; DRAFT until version 2 is proved on a real model (D-30).
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Draws the LINES of a 2D family - a profile, a detail item, an annotation
  symbol, a title block - in its view, as the Family Editor's Line tool does
  there: detail lines. In a PROFILE family every line is part of the profile,
  so the loops given ARE the profile - closed loops that do not cross, a loop
  inside another a hole - and an open path is refused there, as are loops
  that cross or touch, checked edge by edge before anything is drawn.

  **THE SAME SHAPE LANGUAGE AS THE FORM TOOLS**, millimetres in the view's own
  two model coordinates: closed "circle", "rect", "polygon" or corners, and
  open "path X,Y; X,Y" pieces, `|` between.

  **LOCKED TO THE PLANES THEY LIE ON, WHEN ASKED** - every straight line lying
  along a NAMED reference plane is aligned and locked to it, so the profile
  resizes when a labelled dimension moves the plane. That is the step that
  makes a profile parametric. A line is locked only where it already lies; one
  on no named plane is left free and counted. ONE PLANE PER LINE: where named
  planes coincide, the one that does not define the origin is the one locked
  to, and two such planes are refused as ambiguous rather than both locked.

  **ON A SUBCATEGORY** of the family's category for its line weight, made when
  new, or "none" for the category itself.

  **AND IN A PROJECT (version 2, 2026-11-01)** - CREATE_LINE was merged into
  this card and is DEPRECATED. `lineKind` says DETAIL lines, drawn in the view
  named and printed with it alone, or MODEL lines, real lines in the model on
  the plane `planeMm` along the view's direction - with no view, a horizontal
  plane at that height. There is no safe default, so in a project it is asked
  for; a 3D view holds no detail lines. The style is one of the project's line
  styles or "none". All or nothing in millimetres: a piece shorter than
  Revit's shortest line refuses the call.

  **A 3D MODEL FAMILY IS REFUSED** - its 2D symbol is DRAW_FAMILY_SYMBOLIC_LINES.
  READ BACK, ALL OR NOTHING: every line's ends, its style and every lock are
  read again. Their ids come back.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The family's view, as the Project Browser names it - "Ref. Level". In a
    # project (version 2) the view a detail line is drawn in, or whose two
    # coordinates a model line is written in. Left out ("none"): model lines
    # on a horizontal plane, X,Y; refused for detail lines and in a family.
    - name: view
      type: string
      source: request
      optional: true
      absent: none
    # Closed loops and open "path ..." pieces, `|` between. Millimetres.
    - name: shapes
      type: string
      source: request
    # A subcategory of the family's category, made when new, or "none". In a
    # project (version 2), one of the project's line styles - never made
    # there, CREATE_LINE_STYLE makes one - or "none" for Revit's default.
    - name: subcategory
      type: string
      source: request
    # True to lock every straight line to the named reference plane it lies
    # along. A family's only: refused true in a project.
    - name: lockToPlanes
      type: bool
      source: request
    # VERSION 2, from CREATE_LINE (its asDetail): "detail" - lines in one
    # view, printed with it - or "model" - real lines in the model, in every
    # view that sees them. Left out ("auto"): detail in a family, version 1
    # exactly; REFUSED in a project and asked which, because there is no safe
    # default. "model" is refused in a family.
    - name: lineKind
      type: string
      source: request
      optional: true
      absent: auto
    # VERSION 2. A project's model lines' plane, in millimetres along the
    # view's direction from the project's origin - on a plan or with no view,
    # their height. Asked for, never assumed; refused for detail lines. Left
    # out ("none"): refused for model lines.
    - name: planeMm
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: lineIds
      # The new lines' unique ids, commas between.
      role: result
      type: string
    - name: created
      # VERSION 2, CREATE_LINE's own: the lines drawn, as elements, for the
      # next step that takes them - FILLET_LINES, FIND_OVERLAPPING_LINES. The
      # same lines as lineIds.
      role: result
      type: IList<Element>
    - name: drawn
      # How many lines, where, how long in all, their style and their locks -
      # read back.
      role: result
      type: string
    - name: notAFamily
      # True when the document in front is a project. Since version 2 a
      # project's lines are drawn too, so this no longer means refused -
      # refused says that.
      role: accounting
      type: bool
    - name: refused
      # Why nothing was drawn, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


id: FRG-DOC-022
semantic-identity: "what dates are written on these sheets"
kind: action
domain: revit.document
capability: EXTRACT_DATES_FROM_TEXT
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Reads the text notes on sheets and pulls out the dates written in them, with
  the sheets each one came from. Read-only.

  **THE DATE ON A DRAWING IS OFTEN TYPED TEXT, NOT A PARAMETER.** Title blocks
  get filled in by hand more often than anybody admits, and a revision date
  typed into a text note is invisible to every schedule and every filter. This
  is how that text becomes data - so a revision can be matched to the sheets
  that already claim its date.

  **CASE DOES NOT MAKE A DIFFERENT DATE.** MAY and May are the same issue, and
  reporting them separately would have somebody chasing an issue that never
  happened.

  **A THREE-LETTER WORD BETWEEN TWO NUMBERS IS NOT A DATE.** Every candidate is
  checked as a real calendar date before it is reported: 31 SEP is not one, and
  a drawing note reading "2 OFF 300" must not become a date. That check is the
  difference between a list somebody can act on and a list they have to
  re-read.

  **IT READS TEXT NOTES ON THE SHEET, NOT INSIDE THE VIEWS PLACED ON IT.** A
  date typed into a plan is on the plan, not on the sheet, and pretending
  otherwise would attribute a date to every sheet that view appears on.

  ASSUMES NOTHING ABOUT TRANSACTIONS - it opens none and needs none.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
  provides:
    - name: datesFound
      role: result
      type: IDictionary<string, IList<ElementId>>
    - name: sheetsWithNoDate
      type: IList<ElementId>
      # Sheets that WERE read and carried no date. The evidence it looked, not
      # a date it found.
      role: accounting
    - name: notASheet
      type: IList<ElementId>
      # Handed in and not a sheet at all - a duct carries no title block.
      role: accounting

proof:
  date: '2026-09-08'
  by: Ajmal PS
  model: Snowdon Towers Sample HVAC (9,704 elements), Revit 2024, session 42676
  positive_case: 'sheet M102 ''Plan HVAC L2'' in Snowdon Towers Sample HVAC, with a text note
    reading ''09 SEP 2026'' typed ON THE SHEET and the sheet then selected. Three things had
    to be right and each was got wrong first: the text must be a TEXT NOTE (not a title block
    parameter), placed while the SHEET is the open view (text typed in a plan belongs to the
    plan and would be counted on every sheet that plan appears on), and the month must be
    WRITTEN - a first attempt reading ''09-09-2026'' was correctly refused, because 03-04-2026
    is 3 April in one country and 4 March in another. returned datesFound 1 entry(ies), datesIn
    Func`2, months 12 entry(ies), names 12 item(s) [jan, feb, mar, ...], notASheet 0 item(s),
    sheetsWithNoDate 0 item(s). inputs came elements from the selection (1). on Snowdon Towers
    Sample HVAC'
  negative_case: 12 sheets in the same model earlier the same session, before any date was
    typed - real sheets, read and found to carry no date, so the answer had to be empty. All
    12 were accounted for as sheetsWithNoDate rather than returning a bare zero. returned
    datesFound 0 entry(ies), datesIn Func`2, months 12 entry(ies), names 12 item(s) [jan,
    feb, mar, ...], notASheet 0 item(s), sheetsWithNoDate 12 item(s) [1363532, 1363547, 1363562,
    ...]. inputs came elements from the selection (12). on Snowdon Towers Sample HVAC
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: 5ffb8242c65068da

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. Text notes and their text are unchanged
  2020 to 2027, and the date reading is plain string work with no dependence on
  any Revit type at all.

# ROUTING - the same rows are in the fragments named here.
#
#   "what dates are on these sheets"     -> here
#   "which sheets carry this date"       -> here
#   "put that revision on the sheets     -> SET_SHEET_REVISIONS, fed by this.
#    that carry its date"                   Reading the dates and attaching the
#                                           revision are two decisions
#   "change the revision date"           -> EDIT_REVISION
#   "change the text in a note"          -> EDIT_TEXT_VALUES
#   "read a parameter off these"         -> READ_ELEMENT_PARAMETERS, for a date
#                                           that IS a parameter

utterances:
  - what dates are written on these sheets
  - find the dates in the title block text
  - which sheets carry this date
  - the date is typed in a text note

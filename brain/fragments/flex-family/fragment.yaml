compatibility-note: >
  `FamilyManager.Set / CurrentType / GetAssociatedFamilyParameter`,
  `Dimension.FamilyLabel / Value`, `Element.get_BoundingBox(null)` and
  `GenericForm.IsSolid` read the same 2020 through 2027 (api-surface, read
  2026-09-24). A parameter's kind moved at 2022 and is read by reflection, the
  same way SET_FAMILY_TYPE_VALUES reads it. Version 2 also reads
  `BaseArray.GetOriginalMemberIds / GetCopiedMemberIds` and
  `Group.GetMemberIds`, present in every reference assembly 2020 through
  2027 (read 2026-10-08). Version 3 reads a nested `FamilyInstance` by the
  same `Element.get_BoundingBox(null)` (`tools/api-surface --members`,
  2020 through 2027, 2026-11-20).


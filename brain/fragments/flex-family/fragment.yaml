# VERSION 3 (2026-11-20) - EVERY NESTED FAMILY IS MEASURED, and back to
# DRAFT. FRAGMENT-ISSUES row 5b-367: seen 2026-10-07 flexing a spring family
# on Revit 2024, every trial reported "across 4 solid(s)" - the family's own
# forms - while 4 to 8 arrayed one-turn nested families were never measured,
# so a nested part that failed to follow would have passed. Version 3 reads
# each nested family's own box per trial, in model coordinates as a solid's
# is, says how many beside the solids ("across 4 solid(s) and 6 nested
# families"), marks NOT HELD a trial whose labelled planes moved while no
# nested family did, and checks that every nested family comes back where it
# started - by its own id, or for an array's copy Revit remade with a new id
# by the same box matched one to one (version 2's rule). A detail item or
# annotation with no extent outside its view is counted, not measured. A family
# with no nested family reads exactly as before. Version 2 was PROVEN (the
# proof block below, kept as the record of what it proved); its C# moved, so it
# is DRAFT again until NEEDS-CHECKING Group OT is run (D-30) - on the
# owner's word that a fragment found wrong may be changed even though it is
# proven.

purpose: >
  FLEXES the family open in the Family Editor: tries it at each set of sizes
  given - "Width=900; Depth=500 | Width=400; Depth=700" - reads the geometry
  back at every one, then puts every value back as it was and proves it did.
  The test a modeller runs by typing new sizes into Family Types and watching
  the family follow, with the watching done by measurement.

  **IT MEASURES THE GEOMETRY, NOT THE PLANES.** Planes that move prove the
  dimensions work, not that anything followed them - reported from an earlier
  family build, where a box drawn without locks looked parametric right up to
  its first flex. So each trial reads EVERY solid's own extent - a neck moving
  inside a body that does not is invisible in the whole - and every labelled
  dimension and every connector tied to a parameter is compared with what that
  parameter holds. When the labelled planes moved and no solid did, that is
  said in those words.

  **AND EVERY NESTED FAMILY** (version 3, row 5b-367) - each one's own extent
  is read beside the solids, judged the same way, and must come back where it
  started; a spring's arrayed turns are measured, not only its end forms.

  **EACH TRIAL STARTS FROM THE FAMILY AS IT WAS**, plus only the values that
  trial names. Use sizes that are really different and not square - a square
  trial alone hides a width and a depth swapped.

  **IT CHANGES THE FAMILY AND CHANGES IT BACK, AND SAYS SO.** It writes values,
  so it is a MODIFY: it is not a read and does not pretend to be one. Every
  value it touched is written back afterwards and read back, and the solid is
  measured again against how it started. If the family does not come back
  exactly as it was, the call fails and nothing from it is kept.

  **A TRIAL REVIT CANNOT SOLVE FAILS THE CALL**, naming the trial and the
  dimension that could not reach its value, and nothing is kept - constraints
  that cannot be satisfied at some size are exactly what a flex exists to find,
  and Revit itself may only warn about them.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The trials. Within a trial, parameter=value pairs with SEMICOLONS
    # between; between trials, a PIPE - "Width=900; Depth=500 | Width=400;
    # Depth=700". Lengths in millimetres, angles in degrees.
    - name: trials
      type: string
      source: request
  provides:
    - name: allHeld
      # Every labelled dimension and every tied connector read its parameter
      # in every trial, and the solid moved whenever its planes did - and,
      # from version 3, a nested family did too, where there are any. A
      # statement about the checks this made, not a proof of anything else.
      role: result
      type: bool
    - name: trialResults
      # One line per trial: the sizes tried and what the geometry read.
      role: result
      type: IList<string>
    - name: restored
      # Every value put back and the solid measured the same as before the
      # first trial - each solid by its own id, and an array's copies that
      # Revit remade with new ids when a trial changed the count by shape:
      # the same boxes, matched one to one (version 2, 5b-373). The findings
      # say how many were judged each way. Version 3 (5b-367): every nested
      # family's own extent too, by the same rule.
      role: result
      type: bool
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing was tried, in plain words. Empty when the flex ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


id: FRG-MEP-007
semantic-identity: "put insulation on these ducts or pipes, at a stated thickness"
kind: action
domain: revit.mep
capability: SET_MEP_INSULATION
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Adds insulation to ducts and pipes at a stated thickness, replacing whatever
  is there.

  **Insulation is the difference between a run that fits and one that does
  not.** A 400 mm duct with 50 mm insulation needs 500 mm of clear space, and
  the clash check that was run before the insulation went on is the one that
  said the ceiling void was fine. That is why this belongs beside
  `FIND_CLASHES` rather than in a corner of its own.

  **Duct and pipe insulation are different API types and this handles both**,
  because a modeller selects a run and does not sort it first.

  **Existing insulation is REPLACED, not added to.** Revit will happily carry
  two layers, and a duct wrapped twice reports a size nobody drew. The old is
  removed first, and the count reports what ended up on the element.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: insulationTypeId
      type: ElementId
      source: request
    - name: thicknessMm
      type: double
      source: request
  provides:
    - name: insulated
      role: result
      type: int
    - name: replaced
      role: result
      type: int
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>

proof:
  date: '2026-09-13'
  by: Ajmal PS
  model: test projject (3,500 elements), Revit 2024, session 40932
  positive_case: run as it would normally be run - the arrangement was re-made first by running
    select-in-region, set-selection with this phase's own values - run inside a transaction,
    and Revit reported the transaction group ROLLED BACK afterwards. returned MillimetresPerFoot
    304.8, insulated 3, refused 0 item(s), replaced 0, thickness 0.0820209973753281, thicknessMm
    25. inputs came elements from the selection (3); insulationTypeId as given; thicknessMm
    as given. on test projject
  negative_case: 'run with minMm=-1000,-1000,-1000, maxMm=9000,7000,3900, exact=false, categories=Walls,
    insulationTypeId=Duct Insulation: Duct Wrap, thicknessMm=25 instead - chosen because it
    should not contain what this fragment reports - the arrangement was re-made first by running
    select-in-region, set-selection with this phase''s own values - run inside a transaction,
    and Revit reported the transaction group ROLLED BACK afterwards. returned MillimetresPerFoot
    304.8, insulated 0, refused 4 item(s) [925629, 925630, 925631, ...], replaced 0, thickness
    0.0820209973753281, thicknessMm 25. inputs came elements from the selection (4); insulationTypeId
    as given; thicknessMm as given. on test projject'
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  caveat: >-
    THE DECLARED NEGATIVE NEEDS DUCT FITTINGS AND THIS MODEL HAS NONE - measured, 0 in a 200 x
    200 x 100 metre box covering everything built. tests/cases.yaml asks for a selection of
    ducts AND their fittings, expecting the fitting ids in refused, NAMED rather than skipped,
    because 'fittings between insulated ducts are exactly what gets missed, and it shows on
    site rather than on the drawing'. The ducts here were drawn by create-duct, which states in
    its own purpose that it connects nothing and makes no fittings, so there are none to hand
    in. WHAT RAN INSTEAD was four WALLS against the same call: insulated 0, replaced 0, refused
    4 BY ID. That proves the refusal is by id and not a silent skip - the property the case is
    really about - but a wall is obviously not insulable where a duct FITTING looks exactly
    like the thing that is.
  fingerprint: d5645b81e8af4f08

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `DuctInsulation.Create`,
  `PipeInsulation.Create` and `InsulationLiningBase.GetInsulationIds` are
  unchanged 2020 to 2027. Millimetres to feet is arithmetic, not `UnitUtils`
  (D-20), and the insulation type arrives as an ElementId object so nothing
  here builds one from an integer.

# ROUTING - repeated in FIND_CLASHES and SET_MEP_SIZE.
#
#   "insulate these"                  -> here
#   "add 50 insulation"               -> here
#   "make the duct bigger"            -> SET_MEP_SIZE - the duct itself
#   "will it fit in the ceiling"      -> FIND_CLASHES, and RUN IT AFTER this:
#                                        insulation is what makes a run that
#                                        cleared the void stop clearing it
#
# A CLASH CHECK RUN BEFORE THE INSULATION IS A CLASH CHECK OF THE WRONG MODEL.

utterances:
  - insulate these
  - insulate these ducts
  - add insulation
  - put 50 mm insulation on these
  - insulate the pipework
  - change the insulation thickness

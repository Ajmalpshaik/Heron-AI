compatibility-note: >
  One implementation for every release. The document's category list and each
  category's name are unchanged 2020 to 2027. The names themselves are
  LOCALISED, which is a property of the model rather than of the release - and
  the reason this fragment and the identifier-based one are both worth having.

# ROUTING - the same rows are in the fragments named here.
#
#   "everything in duct accessories"     -> here, when the words are what you
#                                           have
#   "all the ducts"                      -> FILTER_ELEMENTS_BY_CATEGORY when
#                                           the internal category is already
#                                           known - narrower and exact
#   "all the ductwork"                   -> SELECT_BY_CATEGORIES, several
#                                           categories in one pass
#   "find all the VCDs"                  -> SELECT_BY_FAMILY, by family name
#   "these are in the wrong category"    -> CHECK_CATEGORY_MISMATCH


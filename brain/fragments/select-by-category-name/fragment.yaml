id: FRG-SEL-026
semantic-identity: "everything in the category called duct accessories"
kind: filter
domain: revit.selection
capability: SELECT_BY_CATEGORY_NAME
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Collects a category's elements by the category's plain NAME - "Ducts", "Duct
  Accessories", "Mechanical Equipment" - rather than by the internal identifier
  a person never says.

  **IT EXISTS BECAUSE THE WORDS ARE WHAT ARRIVES.** A request comes in
  somebody's own language, and turning "duct accessories" into the right
  internal category is a guess with a wrong answer that looks right: the
  identifier for duct accessories is not the obvious one, and a near miss picks
  a different category silently.

  **A NAME THAT MATCHES NOTHING RETURNS THE NEAR MISSES.** "Duct Accessory"
  singular, or "Ducts Accessories", is what a person types - and a list of the
  category names that nearly matched turns a dead end into one more sentence.
  Guessing which one they meant is what this refuses to do.

  **CATEGORY NAMES ARE LOCALISED.** On a French or Arabic Revit the names are
  in that language while the internal identifiers are not, so this is the
  fragment that works on that machine and the identifier route is the one that
  does not - and the reverse is true when a script has to run everywhere.

  ASSUMES NOTHING ABOUT TRANSACTIONS - it opens none and needs none.

contract:
  needs:
    - name: doc
      type: Document
    - name: categoryName
      type: string
      source: request
    - name: inViewOnly
      type: View
      source: request
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: resolvedTo
      # Which internal category the plain name actually resolved to. A
      # statement about the LOOKUP, filled in whether anything was found or
      # not - and the guard against a near miss picking a different category
      # silently (D-52).
      role: accounting
      type: string
    - name: nearMisses
      # Category names that nearly matched, so a wrong resolution is visible.
      # About the lookup, never an element it found (D-52).
      role: accounting
      type: IList<string>
    - name: found
      role: result
      type: int


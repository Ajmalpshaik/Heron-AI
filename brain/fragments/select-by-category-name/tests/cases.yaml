# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: >
      categoryName "Duct Accessories"
    expect: >
      every duct accessory in the model, and `resolvedTo` echoing the exact
      category name. Compare the count against a schedule of that category

  - given: >
      "ducts" in lower case
    expect: >
      the Ducts category. Case is not what somebody meant to change

  - given: >
      a view passed in
    expect: >
      only what that view draws

  # D-59, added 2026-09-28 with version 2. NOT RUN.
  - given: >
      categoryName "Doors" and includeLinks true, on
      Snowdon-scratch_ajmal.al
    expect: >
      `elements` UNCHANGED from the same run without
      includeLinks - host doors only - and `linkedMatches` naming each link
      with its count. linksSearched counts link FILES

negative:
  - given: >
      categoryName "Duct Accessory", singular
    expect: >
      no elements, and "Duct Accessories" in `nearMisses`. Guessing which was
      meant is exactly the silent wrong answer this avoids

  - given: >
      a name matching no category at all
    expect: >
      empty results and empty near misses - a plain "that is not a category
      here"

  - given: >
      a French or Arabic Revit
    expect: >
      the LOCALISED name matching. That is the case this fragment exists for,
      and the internal-identifier route is the one that fails there

  - given: >
      an empty category name
    expect: >
      nothing selected. An empty name matching everything would hand back the
      whole model

  # D-59, added 2026-09-28 with version 2. NONE OF THESE HAS BEEN RUN.
  - given: includeLinks ABSENT, on a model that HAS loaded links
    expect: >
      the same answer as version 1's proof, and linksSearched 0 with the first
      line of linkedMatches reading "Host model only - links not read". The
      switch left out must bind false, not refuse - if the run refuses with
      needs_request_values, the add-in in Revit is older than this change

  - given: includeLinks true on a model with NO links, or with every link unloaded
    expect: >
      linksSearched 0 and "Links asked for, NONE loaded - host only". It must
      NOT read like the absent case: one means there was nothing else to read,
      the other means reload them in Manage Links and ask again

  - given: one linked file placed TWICE, with includeLinks true
    expect: >
      linksSearched 1, not 2 - it counts files, not placements

  - given: includeLinks true WITH a view, on Revit 2020, 2021 or 2022
    expect: >
      "Links NOT read: this Revit cannot read a link through a view" and
      linksSearched 0 - never the whole link reported as if it were the view

second_route:
  - >
    open Visibility/Graphics in Revit and read the category list - those are
    the names this matches against, in the language the model is running in

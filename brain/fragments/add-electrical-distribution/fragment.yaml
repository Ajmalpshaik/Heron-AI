compatibility-note: >
  One implementation for every release but the unit check.
  ElectricalSetting.GetElectricalSettings, VoltageTypes, DistributionSysTypes,
  AddVoltageType(string, double, double, double) and
  AddDistributionSysType(string, ElectricalPhase, ElectricalPhaseConfiguration,
  int, VoltageType, VoltageType); VoltageType.ActualValue, MinValue and
  MaxValue; DistributionSysType.ElectricalPhase, ElectricalPhaseConfiguration,
  NumWires, VoltageLineToLine and VoltageLineToGround carry the same
  signatures 2020 through 2027 - read with tools/api-surface --members on
  2026-11-01. VoltageType.ActualValue, MinValue and MaxValue are volts on every
  release - "the unit is volt" in the reference 2020 to 2027 - so volts are
  matched and written as volts (version 2), and the type AddVoltageType makes,
  whose entry names no unit, is read back and removed again if it reads
  otherwise; ElectricalSetting.RemoveVoltageType is present 2020 to 2027 (the
  reference, read 2026-11-13). No unit conversion is used, so no #if. An
  ElementId is compared with ==, never read as a number.

# ROUTING (2026-11-01) - the same rows are in REPORT_ELECTRICAL_SETTINGS and
# ADD_LOAD_CLASSIFICATION.
#
#   "add a 230 V voltage type"                             -> here, add voltage,
#                                                             volts 230
#   "add a 400/230 V 3-phase 4-wire distribution system"   -> here, add
#                                                             distribution, volts
#                                                             400,
#                                                             lineToGroundVolts
#                                                             230, phases 3,
#                                                             wires 4 - wye or
#                                                             delta asked, never
#                                                             guessed
#   "what voltages and distribution systems are set up in this model" -> REPORT_ELECTRICAL_SETTINGS
#   "add a load classification called Kitchen Equipment"   -> ADD_LOAD_CLASSIFICATION
#   "add a demand factor of 80% over 10 kVA"               -> ADD_LOAD_CLASSIFICATION
#   "make a duct system type"                              -> CREATE_MEP_SYSTEM_TYPE -
#                                                             a duct or pipe system,
#                                                             not an electrical supply
#   "make the connector 3 phase 400 V"                     -> SET_FAMILY_CONNECTOR_ROLES -
#                                                             a family's connector,
#                                                             not the project's supply
utterances:
  - add a 230 V voltage type
  - add a 400/230 V 3-phase 4-wire distribution system

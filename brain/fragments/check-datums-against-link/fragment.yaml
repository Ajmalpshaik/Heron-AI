compatibility-note: >
  One implementation for every release. RevitLinkInstance.GetLinkDocument,
  Instance.GetTotalTransform, RevitLinkType.IsNestedLink, Transform.OfPoint,
  OfVector and BasisZ, Grid.Curve, MultiSegmentGrid.GetGridIds and the static
  MultiSegmentGrid.GetMultiSegementGridId (Revit's own spelling), Line.Direction
  and GetEndPoint, Arc.Center and Radius, and Level.ProjectElevation are each
  present 2020 to 2027 - read off the shipped assemblies of all eight releases
  with tools/api-surface --members on 2026-11-17. No ElementId is built from
  or read as a number, so 2024's 64-bit ids do not reach it. Feet become
  millimetres by * 304.8, D-20's fixed ratio, so the 2021 units change does
  not reach it either. Not seen in Revit.

# ROUTING (2026-11-17) - the row for this card's first sentence is in
# LIST_GRIDS, REPORT_LEVEL_ELEVATIONS, CHECK_LINK_COORDINATES and
# COPY_ELEMENTS_BETWEEN_DOCUMENTS too.
#
#   "check our grids and levels line up with the linked architect's model"
#                                         -> here
#   "list the grids"                      -> LIST_GRIDS - the grids themselves,
#                                            and a link's listed, not measured
#   "what elevation is each level at"     -> REPORT_LEVEL_ELEVATIONS - the
#                                            heights; with includeLinks it also
#                                            prints each linked level's
#                                            difference by name, with no
#                                            tolerance. Asked as a pass or fail
#                                            against one link, it is here
#   "check the links against our shared coordinates"
#                                         -> CHECK_LINK_COORDINATES - where the
#                                            link sits by the survey, not
#                                            whether its datums meet ours
#   "acquire coordinates from the architecture link"
#                                         -> ACQUIRE_COORDINATES, the ADMIN
#                                            change. Run this read after it to
#                                            see whether the datums then agree
#   "bring the grids in from the architect"
#                                         -> COPY_ELEMENTS_BETWEEN_DOCUMENTS,
#                                            fromLink - a write, and its own
#                                            declared sentence. On the ranked
#                                            routes (tools/check-routing.py,
#                                            Revit 2024, trained model,
#                                            2026-11-17) this card came first
#                                            and that one second; the identity
#                                            route still sends the exact
#                                            sentence there. A read ranked over
#                                            a write cannot change the model
#   "what levels are in this model"       -> REPORT_LEVEL_ELEVATIONS. Already
#                                            lost on the ranked routes before
#                                            this card (REMOVE_MASS_FLOORS, a
#                                            write, answered); this card answers
#                                            it there now, a read
#   "level these up"                      -> ALIGN_ELEMENTS. Already lost
#                                            before this card (CREATE_LEVELS
#                                            answered); this card answers it on
#                                            the ranked routes now
utterances:
  # The modeller's own sentence, 2026-11-17, once for each of the two links it
  # named, and once whole.
  - check our grids and levels line up with the linked architect's model
  - check our grids and levels line up with the linked structural model
  - before every issue check our grids and levels line up with the linked architect's model

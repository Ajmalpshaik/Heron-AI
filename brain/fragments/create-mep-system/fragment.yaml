revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. MechanicalSystem.Create and
  PipingSystem.Create, both with and without a name, MEPSystem.Add(ConnectorSet),
  the BaseEquipmentConnector setters on MechanicalSystem and PipingSystem,
  MEPSystem.BaseEquipment and Elements, and Connector.MEPSystem, Domain,
  ConnectorType, DuctSystemType and PipeSystemType are present 2020 through
  2027 - read off RevitAPI.xml in the Nice3point reference packages for all
  eight releases on 2026-10-12. Categories are compared by ElementId built
  from the BuiltInCategory, so 2024's 64-bit ids do not reach it.

# ROUTING - the same rows are in the fragments named here.
#
#   "make a supply air system from these"   -> here
#   "create a system for this pump"         -> here
#   "put these diffusers on the FCU's system" -> here
#   "make a new system type"                -> CREATE_MEP_SYSTEM_TYPE - a type
#                                              in the Project Browser, not a
#                                              system of elements
#   "change these ducts to return air"      -> SET_MEP_SYSTEM_TYPE
#   "what system is this on"                -> READ_MEP_SYSTEM
#   "select everything on this system"      -> SELECT_BY_MEP_SYSTEM
#   "circuit these sockets"                 -> CREATE_ELECTRICAL_CIRCUIT - an
#                                              electrical system is a circuit

utterances:
  - make a duct system from these diffusers and the fan coil unit
  - create a duct system for this equipment
  - create a piping system for this pump and the fixtures
  - put these terminals on one system with the FCU as base equipment
  - put these diffusers on the FCU's system

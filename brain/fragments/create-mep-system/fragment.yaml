compatibility-note: >
  One implementation for every release. MechanicalSystem.Create and
  PipingSystem.Create, both with and without a name, MEPSystem.Add(ConnectorSet),
  the BaseEquipmentConnector setters on MechanicalSystem and PipingSystem,
  MEPSystem.BaseEquipment and Elements, and Connector.MEPSystem, Domain,
  ConnectorType, DuctSystemType and PipeSystemType are present 2020 through
  2027 - read off RevitAPI.xml in the Nice3point reference packages for all
  eight releases on 2026-10-12. Categories are compared by ElementId built
  from the BuiltInCategory, so 2024's 64-bit ids do not reach it.

  Version 2, from CREATE_ELECTRICAL_CIRCUIT: `ElectricalSystem.Create(Document,
  IList<ElementId>, ElectricalSystemType)`, `.SelectPanel`, `.PanelName`,
  `.CircuitNumber`, `.Elements` and the `ElectricalSystemType` members used are
  unchanged 2020 to 2027. `Create` takes `IList<ElementId>`, not
  `ICollection<ElementId>`.


# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here (measured 2026-10-12).
#
# A CONNECTOR JOINS ONLY WHEN IT SUITS THE SYSTEM: of the system's domain, in
# no system already, and of its classification. Revit refuses a whole set for
# one wrong connector, so each element is checked first and each one left out
# is named with the reason.
#
# THE BASE EQUIPMENT IS NAMED OR FOUND, NEVER GUESSED: by Mark or id among the
# elements handed in, or the one Mechanical Equipment instance among them.
# Several and no name refuses; none makes the system without base equipment,
# which Revit allows, and says so.
#
# EVERYTHING IS READ BACK OFF THE SYSTEM - name, members, base equipment. A
# second run finds every connector already on a system and makes nothing.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
#
# VERSION 2 (2026-11-01) - CREATE_ELECTRICAL_CIRCUIT WAS MERGED INTO THIS CARD
# on the owner's instruction ("make sure there is no duplicate tools", "in every
# conflict keep the safer rule"), and is DEPRECATED. Its `elements` are this
# card's; its `systemType` word (power, data, fire alarm...) is `circuitType`
# here, because this card's `systemType` is a duct or pipe system type and an
# electrical system has no type element; its `panel` is `panel`; its created,
# memberIds, refused and findings are this card's, and its circuitNumber and
# panelName are here under the same names. A device Revit left off the circuit
# is now named in `skipped` as well as counted.
#
# THE CONFLICT, AND HOW IT WAS SETTLED: this card's `refused` meant NOTHING WAS
# MADE; CREATE_ELECTRICAL_CIRCUIT's also carried "the circuit exists and is
# UNASSIGNED" when Revit refused the panel. KEPT, the louder: for a circuit
# whose panel was refused, `refused` says so though the circuit exists - an
# unassigned circuit read as a clean success is the outcome both cards were
# written against. Asked both ways at once - a circuit word and a system type,
# a panel for a duct system, a base equipment for a circuit - nothing is made
# rather than one input ignored.
purpose: >
  Creates one mechanical duct system, one piping system or one electrical
  circuit from the elements handed in - the equipment and the terminals or
  fixtures it serves, as Create System does in the ribbon, or the devices on
  one circuit. The system type chosen decides duct or pipe.

  Version 2 (2026-11-01): `circuitType` - power, data, fire alarm and the
  rest - makes one electrical circuit from the devices instead, on the
  `panel` named, and reads back its number and the panel it landed on. DRAFT
  until version 2 is proved.

contract:
  needs:
    - name: doc
      type: Document
    # The equipment and the terminals or fixtures, from a selection or a filter.
    - name: elements
      type: IList<Element>
    # A duct system type or a pipe system type by its Project Browser name -
    # Supply Air, Domestic Cold Water. Which kind it is decides the system.
    # Version 2: OPTIONAL, left out for a circuit - absent binds null
    # (HeronBindingNote.AbsentValue). Left out with no circuitType either,
    # nothing is made and `refused` says so.
    - name: systemType
      type: MEPSystemType
      source: request
      optional: true
    # Optional. Empty lets Revit number it, as the ribbon does. Version 2:
    # may be left out - `auto`, read as empty. Refused for a circuit.
    - name: systemName
      type: string
      source: request
      optional: true
      absent: auto
    # Optional. The base equipment's Mark or element id, among the elements
    # handed in. Empty takes the one Mechanical Equipment instance among them.
    # Version 2: may be left out - `auto`, read as empty. Refused for a circuit,
    # whose base is its panel.
    - name: baseEquipment
      type: string
      source: request
      optional: true
      absent: auto
    # VERSION 2, CREATE_ELECTRICAL_CIRCUIT's `systemType` word: power, data,
    # fire alarm, security, telephone, nurse call, controls or communication.
    # Given, a circuit is made from the devices and systemType is left out.
    # Left out it is `none` - a duct or pipe system, as version 1. Any other
    # word is refused by name, never read as power.
    - name: circuitType
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 2, CREATE_ELECTRICAL_CIRCUIT's `panel`: RESOLVED by its Panel
    # Name, never an id. Left out (`none`) or blank, the circuit is made
    # unassigned and that is said. Refused for a duct or pipe system.
    - name: panel
      type: FamilyInstance
      source: request
      optional: true
      absent: none
  provides:
    # A MechanicalSystem, a PipingSystem or - version 2 - an ElectricalSystem;
    # all three are MEPSystems.
    - name: created
      role: result
      type: MEPSystem
    - name: createdName
      role: result
      type: string
    - name: memberIds
      # Read off the system after it was made, never copied from the request.
      role: result
      type: IList<ElementId>
    - name: baseEquipmentId
      # Read off the system's own base equipment field. InvalidElementId when
      # it has none, which the findings say aloud.
      role: result
      type: ElementId
    - name: skipped
      # Elements left out - no suiting free connector, already on a system,
      # or a duct or pipe rather than a family. Each reason is in `findings`
      # (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why NOTHING WAS MADE, as one sentence; null when something was made -
      # or, for a circuit (version 2), that it exists UNASSIGNED because Revit
      # refused the panel. One string because a list reaches the chat cut
      # short (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>
    # VERSION 2 - CREATE_ELECTRICAL_CIRCUIT's two answers. Empty for a duct or
    # pipe system.
    - name: circuitNumber
      # Read off the circuit after it was made.
      role: result
      type: string
    - name: panelName
      # Which panel it landed on, read back off the circuit - empty when it is
      # unassigned, which the findings say aloud.
      role: result
      type: string


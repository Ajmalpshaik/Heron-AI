# (RevisionSettings.GetRevisionSettings) - FRAGMENT-ISSUES row 5b-880. A family
# now answers that it holds no revisions, with nothing found. That is also what
# makes a negative case possible at all: a PROJECT always keeps at least one
# revision (Revit refuses to delete the last), so `elements` and
# `revisionTable` can never come back empty from one.

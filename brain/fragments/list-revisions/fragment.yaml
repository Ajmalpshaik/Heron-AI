id: FRG-SHT-005
semantic-identity: "every revision in the project and which sheets carry each one"
kind: filter
domain: revit.sheets
capability: LIST_REVISIONS
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Lists the project's revisions in sequence, and for each one the sheets that
  show it.

  **The sheet list is the answer, not the revision list.** *"Which sheets go out
  with this issue"* is the question somebody is actually asking, and it decides
  what gets printed. A revision with no sheets against it is either not yet
  clouded or was clouded on a view that is on no sheet - both are worth finding
  before an issue rather than after.

  **A sheet shows a revision two different ways.** A cloud on it puts the
  revision there; so does ticking the revision on the sheet by hand, with no
  cloud anywhere. Revit reports both together and so does this - because both
  print, and a sheet that shows a revision is issued whichever way it got there.

contract:
  needs:
    - name: doc
      type: Document
  provides:
    - name: elements
      type: IList<Element>
    - name: findings
      type: IList<string>
    - name: onNoSheets
      type: IList<ElementId>

proof:
  date: "2026-09-06"
  by: "Claude Opus 5, at Ajmal PS's PC"
  model: >
    Snowdon Towers Sample HVAC.rvt (9,628 elements) and Project1 (3,410 elements, unsaved default template), both open at once in Revit 2024.3
  positive_case: >
    Snowdon Towers: 1 revision, 'Date 1 Revision 1 - 1 sheet: M001', onNoSheets 0.
  negative_case: >
    Project1: the template's Revision 1 came back as ON NO SHEETS with its id, and shownOn 0. That is the discriminating case - it did not report an empty list, and it did not claim the revision was in use. A revision that exists and reaches no drawing is exactly what this has to tell apart.
  second_route: >
    LIST_SHEETS independently reported 17 sheets on Snowdon and 0 on Project1, matching the sheet set this fragment walked.
  fingerprint: "5a3373822bfd6f74"

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  `Revision.GetAllRevisionIds(Document)`, `ViewSheet.GetAllRevisionIds()` and
  `GetRevisionNumberOnSheet(ElementId)` are unchanged 2020 to 2027 - read off
  the reference assemblies at both ends rather than remembered.

  No ElementId is built from an int, so 2024's 64-bit ids do not reach this
  code.

# ROUTING - repeated in CREATE_REVISION, ADD_REVISION_CLOUD and LIST_SHEETS.
#
#   "which sheets have this revision"  -> here
#   "list the revisions"               -> here
#   "what goes out with this issue"    -> here
#   "add a revision"                   -> CREATE_REVISION
#   "put a revision cloud around this" -> ADD_REVISION_CLOUD
#   "list the sheets"                  -> LIST_SHEETS - all of them, with no
#                                         revision involved

utterances:
  - which sheets have this revision
  - list the revisions
  - what revisions are there
  - what goes out with this issue
  - show me the revision history
  - which sheets are in this revision

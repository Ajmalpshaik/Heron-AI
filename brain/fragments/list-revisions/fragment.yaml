kind: filter
domain: revit.sheets
capability: LIST_REVISIONS
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Lists the project's revisions in sequence, and for each one the sheets that
  show it.

  **The sheet list is the answer, not the revision list.** *"Which sheets go out
  with this issue"* is the question somebody is actually asking, and it decides
  what gets printed. A revision with no sheets against it is either not yet
  clouded or was clouded on a view that is on no sheet - both are worth finding
  before an issue rather than after.

  **A sheet shows a revision two different ways.** A cloud on it puts the
  revision there; so does ticking the revision on the sheet by hand, with no
  cloud anywhere. Revit reports both together and so does this - because both
  print, and a sheet that shows a revision is issued whichever way it got there.

  **And sheet by sheet (version 2).** Every sheet in register order with its
  revisions in sequence, the letter or number each PRINTS, whether each is
  ticked on the sheet, held by a cloud, or both, and its CURRENT revision - the
  last one. With `expectedLast` ("Seq. 21") the sheets that do not end on it
  come back in `lastDiffers`. `cloudOnly` names every revision that only a
  cloud keeps on a sheet - **which is why it cannot be unticked**; the clouds
  themselves are LIST_REVISION_CLOUDS'.

  **It also reads the Sheet Issues/Revisions dialog row by row**: each
  revision's numbering, date, description, issued tick, issued to, issued by
  and show setting, the number it actually prints on each sheet, the Per
  Project / Per Sheet setting, every numbering sequence with its settings, and
  the revision cloud arc length.

contract:
  needs:
    - name: doc
      type: Document
    # VERSION 2. The revision every sheet should end on - "Seq. 21", 21, its
    # description or date. Left out ("none"), no sheet is compared.
    - name: expectedLast
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: findings
      type: IList<string>
    - name: onNoSheets
      # Revisions that appear on no sheet at all. THE SHEET LIST IS THE
      # ANSWER, NOT THE REVISION LIST - a revision nothing carries prints
      # nowhere, which is what somebody planning an issue needs to know.
      role: result
      type: IList<ElementId>
    - name: revisionTable
      # The dialog's table, one row per revision with " || " between rows:
      # sequence, numbering, date, description, issued, issued to, issued by,
      # show, and what it PRINTS on each sheet carrying it. A STRING, because
      # a list reaches the reply cut to three entries of sixty characters and
      # this list is the answer.
      role: result
      type: string
    - name: sheetTable
      # VERSION 2. One line per sheet in register order, " || " between: each
      # revision in sequence with what it prints and "ticked", "clouded only"
      # or "ticked and clouded", then CURRENT and the last revision. A string
      # for revisionTable's reason - this list is the answer.
      role: result
      type: string
    - name: lastDiffers
      # VERSION 2. Sheets whose current revision is not `expectedLast` -
      # including a sheet with no revision. Empty when none was named. The
      # sheets to hand to SET_SHEET_REVISIONS' replaceWith next.
      role: result
      type: IList<ElementId>
    - name: cloudOnly
      # VERSION 2. Per sheet, the revisions it prints that are NOT ticked - only
      # a cloud holds them, so unticking cannot take them off (row 5b-1463).
      role: result
      type: string
    - name: numbering
      # Per Project or Per Sheet - the switch at the bottom of the dialog.
      # Project state, there whether or not anything was found (D-52).
      role: accounting
      type: string
    - name: numberingSequences
      # Every numbering sequence with its type and settings, and which
      # revisions use it. On 2020 and 2021 there are no named sequences: the
      # project's one numeric and one alphanumeric scheme are read instead.
      # Project state, never a thing found (D-52).
      role: accounting
      type: string
    - name: arcLength
      # The revision cloud arc length, in millimetres on paper, with Revit's
      # internal feet beside it. Project state (D-52).
      role: accounting
      type: string


# VERSION 2, BACK TO DRAFT ON 2026-11-07, AND THE PROOF BLOCK IS KEPT - the
# 2026-10-17 arrangement is still the one to re-prove the table from; its
# fingerprint no longer matches. Version 2 adds the SHEET-BY-SHEET check:
# each sheet's revisions in sequence with what each prints and whether it is
# ticked, clouded or both, its current (last) revision, the sheets that do not

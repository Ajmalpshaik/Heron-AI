compatibility-note: >
  `Revision.GetAllRevisionIds(Document)`, `ViewSheet.GetAllRevisionIds()` and
  `GetRevisionNumberOnSheet(ElementId)` are unchanged 2020 to 2027 - read off
  the reference assemblies at both ends rather than remembered. So are the
  revision's `Description`, `RevisionDate`, `Issued`, `IssuedTo`, `IssuedBy`,
  `Visibility`, `SequenceNumber` and `RevisionNumber`, and `RevisionSettings`'
  `RevisionNumbering` and `RevisionCloudSpacing` (the arc length) - all read
  with tools/api-surface --members on each release's RevitAPI.dll.

  THE NUMBERING IS WHERE THE RELEASES PART. `RevisionNumberingSequence`,
  `Revision.RevisionNumberingSequenceId` and `NumericRevisionSettings.MinimumDigits`
  arrive in 2022; `Revision.NumberType` and `RevisionSettings`'
  Get/SetNumericRevisionSettings and Get/SetAlphanumericRevisionSettings exist
  2020 to 2022 and are gone from 2023. The add-in compiles fragments with no
  release symbol defined, so a `#if` would take one branch on every release;
  each of those members is reached by name and the one this Revit has is used.
  Both routes have run on a model: 2022+ on Revit 2024 in September, and the
  2020/2021 route on Revit 2020 on 2026-10-17, where it read the project's
  Numeric scheme and its Alphanumeric A to Z. 2021 is compiled, not run.

  `Document.IsFamilyDocument` and `Document.Title`, which answer a family, are
  unchanged 2020 to 2027.

  No ElementId is built from an int, so 2024's 64-bit ids do not reach this
  code.

  VERSION 2's members - `ViewSheet.GetCurrentRevision()`,
  `GetAdditionalRevisionIds()`, `RevisionCloud.GetSheetIds()`, `RevisionId` and
  `Element.OwnerViewId` - are unchanged 2020 to 2027, read with
  tools/api-surface --members on 2026-11-07.

# ROUTING - repeated in CREATE_REVISION, ADD_REVISION_CLOUD and FIND_SHEETS.
#
#   "which sheets have this revision"  -> here
#   "list the revisions"               -> here
#   "what goes out with this issue"    -> here
#   "add a revision"                   -> CREATE_REVISION
#   "put a revision cloud around this" -> ADD_REVISION_CLOUD
#   "list the sheets"                  -> FIND_SHEETS - all of them, with no
#                                         revision involved
#   "show me the sheet issues and revisions table"
#                                      -> here - every column, the numbering
#                                         sequences, Per Project / Per Sheet
#                                         and the arc length
#   "set issued to"                    -> EDIT_REVISION, fed one revision by
#                                         SELECT_BY_PARAMETER_VALUE
#   "move revision 2 up"               -> REORDER_REVISION
#   "merge revision 2 down"            -> MERGE_REVISION
#   "what is the revision cloud arc length" -> here - a question; the setter
#                                         is SET_REVISION_SETTINGS
#   "number revisions per project"     -> SET_REVISION_SETTINGS
#   "set the cloud arc length"         -> SET_REVISION_SETTINGS
#   "make an alphabetic sequence"      -> CREATE_REVISION_NUMBERING_SEQUENCE
#   "rename the numbering"             -> EDIT_REVISION_NUMBERING_SEQUENCE
#   "sheets on revision 15"            -> FIND_SHEETS, revisionSequence (version
#                                         3, which FIND_SHEETS_BY_REVISION_OR_
#                                         NUMBER was merged into on 2026-11-01) -
#                                         the sheets of ONE revision, picked
#                                         for the next step (a sheet set, a
#                                         PDF); this answers the question for
#                                         every revision. Row 5b-550
#   "list the revisions in the project with their dates" -> here - the
#                                         dates are in revisionTable. Row 5b-1005
#   "find the revision with date 04-Jun-2026" -> here - a question; it
#                                         changes no revision. Row 5b-1005
#   "what is the current revision on each sheet" -> here, sheetTable
#                                         (version 2)
#   "which sheets do not have revision 21 as the last one" -> here, with
#                                         expectedLast; then SET_SHEET_REVISIONS
#                                         replaceWith on lastDiffers
#   "why can't I untick this revision" -> LIST_REVISION_CLOUDS names the clouds;
#                                         cloudOnly here says which revisions
#                                         only clouds hold. Row 5b-1463
#   "which revision is this cloud"     -> LIST_REVISION_CLOUDS


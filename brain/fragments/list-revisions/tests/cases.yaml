positive:
  - given: >
      three revisions, the latest on 12 of 40 sheets
    expect: >
      three rows in sequence, the latest naming all 12 sheet numbers in register
      order - which is the print list for that issue

  - given: >
      a sheet where the revision was ticked by hand with no cloud on it
    expect: >
      that sheet IS counted. It prints the revision either way, and a sheet
      showing a revision is issued under it however it got there

  - given: >
      "heron ai bulding", Revit 2024, 2026-09-28 - two revisions, numbered Per
      Sheet, sequences Numeric and Custom
    expect: >
      `revisionTable` with both rows and every column as the Sheet
      Issues/Revisions dialog shows them; `numbering` Per Sheet;
      `numberingSequences` 'Custom' alphanumeric A to Z and 'Numeric' numeric,
      minimum digits 1, start 1; `arcLength` 20 mm - the dialog's 20.0

  - given: >
      VERSION 2 - three sheets: one with Seq. 20 ticked only, one with Seq. 20
      ticked AND clouded, one with Seq. 20 clouded only; expectedLast "Seq. 21"
      while all three end on Seq. 20
    expect: >
      `sheetTable` naming each way ("ticked", "ticked and clouded", "clouded
      only") and CURRENT Seq. 20 on each; `cloudOnly` naming only the third
      sheet; `lastDiffers` all three

negative:
  - given: >
      VERSION 2 - expectedLast naming the revision every sheet already ends on
    expect: >
      `lastDiffers` EMPTY and a finding that every sheet ends on it. A sheet
      ticked only must never appear in `cloudOnly`

  - given: expectedLast naming no revision, or a description two revisions share
    expect: >
      `lastDiffers` empty and one finding saying why no sheet was compared -
      never a guess at which revision was meant

  - given: >
      a revision clouded only on a view that is on no sheet
    expect: >
      it appears in `onNoSheets`. That case is invisible in Revit until somebody
      notices the drawing went out unmarked, and it is the single most useful
      row this fragment produces

  - given: >
      a revision created but not yet clouded anywhere
    expect: >
      also in `onNoSheets` - the same row, and correctly so: nothing goes out under it yet

  - given: >
      a FAMILY document - "TRG_GEN_CutOut_Rectangular_HVAC", Revit 2020,
      2026-10-17. A family holds no revisions; a project always keeps one
    expect: >
      `elements`, `onNoSheets` and `revisionTable` empty, and one finding that
      it is a family and a family holds no revisions - never Revit's "ccda is
      not a project document", which it threw until that day (row 5b-880)

second_route:
  - Revit's own Revisions dialog with "Show" set, or a Sheet List schedule with a revision column, compared sheet for sheet

compatibility-note: >
  One implementation for every release. `ViewSheet.SheetNumber`,
  `FamilyInstance.OwnerViewId`, `FamilyInstance.Symbol`, `FamilySymbol.Family`
  and `BuiltInCategory.OST_TitleBlocks` are present and unchanged 2020 through
  2027, read off the reference assemblies at both ends.

  Sheets are matched to title blocks by comparing `OwnerViewId` to the sheet id
  - `ElementId` to `ElementId`, never a number - so 2024's 64-bit ids do not
  reach this code.

# ROUTING - the same rows are in SET_SHEET_TITLE_BLOCK and LIST_SHEETS.
#
#   "what title block is on this sheet"   -> here
#   "which sheets use the old border"     -> here. typesInUse is the list of
#                                            distinct borders across the set,
#                                            which is what says whether a set is
#                                            actually consistent
#   "any sheets missing a title block"    -> here
#   "change the title block"              -> SET_SHEET_TITLE_BLOCK, and this is
#                                            the call to make first: it says
#                                            whether that will be a safe
#                                            same-family swap or a replace that
#                                            loses what was on the old instance
#   "list the sheets"                     -> LIST_SHEETS - sheet numbers and
#                                            names, nothing about what they are
#                                            drawn on
#   "which views are on the sheet"        -> LIST_SHEETS, which reports the
#                                            placed views
#
#   "change the title block on these sheets" / "swap the title block"
#                                       -> SET_SHEET_TITLE_BLOCK, WHICH DECLARES
#                                          BOTH. The report ranks above it on
#                                          wording, because the two share almost
#                                          every word and only one of them says
#                                          change. Identity resolves it, and the
#                                          crossing is written down here because
#                                          the direction matters: a read
#                                          answering a write request wastes a
#                                          call, and the reverse silently
#                                          replaces forty borders

# CLAIMED ON 2026-09-17 SO THE IDENTITY ROUTE ANSWERS THESE, and it is
# not a rank being bought. An undeclared sentence never reaches
# short_circuit at all: it falls through to the fused ranking, and
# tools/check-risk-crossings.py measured where that lands. Each line
# below was answered by a MODIFY before it was claimed here.
#   -> CREATE_SHEET (MODIFY). This fragment's own identity already says
# "and which have none", so the sentence was always its own.
utterances:
  - which sheets are missing a titleblock
  - what title block is on this sheet
  - which title blocks are used across these sheets
  - are any sheets missing a title block
  - report the sheet borders
  - which sheets are still on the old title block
  - check the title blocks before I change them

compatibility-note: >
  One implementation for every release. Document.Create.NewSpotCoordinate(View,
  Reference, XYZ origin, XYZ bend, XYZ end, XYZ refPt, bool hasLeader),
  SpotDimension.SpotDimensionType (get and set), Dimension.Origin,
  Dimension.ValueString, SpotDimensionType.StyleType,
  DimensionStyleType.SpotCoordinate, BuiltInCategory.OST_SpotCoordinates,
  View3D.IsLocked and IsPerspective, View.ViewDirection, RightDirection and
  UpDirection, Grid.Curve, Face.Project, Face.IsInside(UV), Face.EdgeLoops,
  Edge.AsCurve, PlanarFace.FaceNormal and IntersectionResult.UVPoint and
  XYZPoint are present with these signatures 2020 through 2027 -
  tools/api-surface --members on 2026-11-01. Only the ViewType values present
  in all eight releases are named. Millimetres become feet by dividing by 304.8
  (D-20). No ElementId is built from a number or read as one.

# ROUTING (2026-11-01) - the same rows are in ADD_SPOT_ELEVATIONS,
# REPORT_SPOT_DIMENSIONS and REPORT_LOCATION.
#
#   "add spot coordinates to these column    -> here, at "corners"
#    corners"
#   "put a spot coordinate on this point"    -> here
#   "show the north/east coordinates of      -> here, on the floor under them -
#    these grid intersections"                  a request to annotate. Asked as
#                                               a question (D-128) it reaches a
#                                               read, never this
#   "what are the coordinates of this"       -> REPORT_LOCATION - a question,
#                                               answered without drawing
#   "read the spot coordinates in the model" -> REPORT_SPOT_DIMENSIONS - what
#                                               spots already say. It declares
#                                               it; this card outranks it on
#                                               the keyword route alone
#   "what are the coordinates of this point" -> REPORT_LOCATION, by its
#                                               declaration - a question this
#                                               card took the moment it existed
#                                               (FRAGMENT-ISSUES 5b-1377)
#   "put a column at each grid intersection" -> PLACE_FAMILY_INSTANCES, by its
#                                               declaration - places columns,
#                                               where this annotates them
#   "add spot levels to these"               -> ADD_SPOT_ELEVATIONS - a height,
#                                               not a north and east
#   "acquire coordinates from this link"     -> ACQUIRE_COORDINATES - moves the
#                                               project's coordinates, draws
#                                               nothing
utterances:
  - add spot coordinates to these column corners
  - put a spot coordinate on this point
  - show the north/east coordinates of these grid intersections

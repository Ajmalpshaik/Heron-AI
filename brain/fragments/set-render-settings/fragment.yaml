compatibility-note: >
  One implementation for every release. Read off the shipped reference
  assemblies and RevitAPI.xml of 2020 through 2027 on 2026-10-20 (Nice3point
  packages): View3D.GetRenderingSettings and SetRenderingSettings;
  RenderingSettings' BackgroundStyle, LightingSource, PrinterResolution,
  ResolutionTarget, ResolutionValue, UsesRegionRendering and the Get/Set of its
  background, exposure and quality settings; RenderingQuality (Draft, Medium,
  High, VeryHigh, Custom); RenderingQualitySettings' RenderDuration,
  RenderLevel (1-40), RenderTime (1-32768) and LightAndMaterialAccuracyMode;
  RenderingImageExposureSettings and its ranges; ColorBackgroundSettings,
  ImageBackgroundSettings and BackgroundImageFit; LightGroupManager's
  GetLightGroupManager, GetGroups, IsLightGroupOn and SetLightGroupOn - all
  present and alike on every release. The lighting classes are reached by name
  at run time because the fragment executor does not import their namespace.

# ROUTING - the same rows are in the render, sun, display and camera cards.
#
#   "set the render quality to best"             -> here
#   "render at 300 dpi"                          -> here
#   "interior lighting with the lights on"       -> here
#   "what are the render settings of this view"  -> REPORT_RENDER_SETTINGS. A
#                                                   question never reaches
#                                                   this write (D-86)
#   "set the sun to 10 am"                       -> SET_SUN_SETTINGS
#   "turn on sketchy lines"                      -> SET_GRAPHIC_DISPLAY_OPTIONS
#   "put this view on realistic"                 -> SET_VIEW_PROPERTIES, the
#                                                   visual style
#   "render it" / "start the render"             -> OPEN_RENDER_DIALOG. No API
#                                                   runs the render
#   "save this view as a picture"                -> EXPORT_VIEW_IMAGE
#   "make this view look good"                   -> APPLY_VISUAL_PRESET, a whole
#                                                   look in one call

utterances:
  - set the render quality of this 3D view to best
  - render this view at 300 dpi for printing
  - make the rendering lighting interior with sun and artificial lights
  - change the render background to a cloudy sky
  - turn the lobby light group off for this render
  - set the rendering exposure to 13 with a white point of 6500

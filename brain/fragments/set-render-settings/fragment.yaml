id: FRG-VIEW-141
semantic-identity: "change a 3D view's render quality, output resolution, lighting scheme, light groups, background and exposure to new values"
kind: action
domain: revit.views
capability: SET_RENDER_SETTINGS
version: 2
# VERSION 2, 2026-10-20 - row 5b-1278, found running Group IB's IB3 on Revit
# 2020. Asked for "150 DPI" on a view whose output was Screen, version 1
# read the printer level first, to put it back if the DPI was not offered,
# and Revit threw "The resolution target is not printer." - nothing set,
# the call fragment_threw. The level is now read only when the output is
# already Printer. Nothing else changed.
source: OFFICIAL
risk: MODIFY

# WHY IT EXISTS - a comment, not `purpose`, because `purpose` is searched.
# 2026-10-20: after a duct heater family was built and placed in Project1
# (Revit 2020), the owner asked for a render of the 3D view, and Heron could
# only switch the view to Realistic and export an image - nothing set the
# Rendering dialog. His words: "for the rendering ... all type of rendering,
# rendering settings all the things ... all the part should be covered".
#
# HOW IT BEHAVES - comments, not `purpose`.
#
# **WHAT REVIT'S RENDERING DIALOG HOLDS FOR ONE 3D VIEW**, each a word or left
# out (keep):
#   quality            Draft, Medium, High, Best or Custom. Best is the API's
#                      VeryHigh; Revit's API has these five on 2020 to 2027
#   customQuality      level N (1-40), time N (1-32768, Revit's own value) or
#                      until satisfactory - and it means Custom
#   lightingAccuracy   Simplified or Advanced
#   output             Screen, Printer, or a printer DPI such as 300 DPI. The
#                      DPI is FOUND: the printer level whose ResolutionValue
#                      reads that DPI is the one set, never a typed table
#   lighting           Exterior or Interior, Sun only / Sun and Artificial /
#                      Artificial only
#   lightGroups        "Lobby=on; Plant=off" or "all=off" - the Artificial
#                      Lights dialog, per view
#   background         Sky: No Clouds .. Sky: Very Cloudy, colour R,G,B,
#                      image <file>, Transparent; with backgroundImageFit and
#                      backgroundImageOffsetMm for an image
#   exposure           "value=13; highlights=0.25; shadows=0.2; saturation=1;
#                      white point=6500", inside Revit's ranges
#   regionRendering    yes or no
#
# **EVERY WORD IS READ FIRST.** One word this cannot read refuses the whole
# call and says which words it takes - nothing reaches the view half-filled.
#
# **WHERE REVIT'S API STOPS**, read off the API reference of every release
# 2020 to 2027 on 2026-10-20: the sky's haze and the sun's own brightness in
# the background have no member (SkyBackgroundSettings has none), exposure has
# no "reset to automatic", and NO RELEASE LETS AN ADD-IN RUN THE RENDER -
# View3D has GetRenderingSettings and SetRenderingSettings and nothing that
# renders. OPEN_RENDER_DIALOG opens Revit's own dialog for the modeller to press
# Render; READ_RENDERED_IMAGES reads back what was saved.
#
# **A VIEW TEMPLATE THAT CONTROLS RENDERING SETTINGS** refuses the write; the
# answer carries Revit's words and points at the template.
#
# **READ BACK:** every setting asked is read again off the view; only one that
# reads as asked counts. `readBack` is the whole dialog as it stands after.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Sets the Rendering dialog of a 3D view to new values - quality, output
  resolution, lighting scheme, artificial light groups, background and
  exposure - from Revit's own words.

contract:
  needs:
    - name: doc
      type: Document
    # The 3D view, as the Project Browser names it.
    - name: view
      type: View
      source: request
    - name: quality
      type: string
      source: request
      optional: true
      absent: keep
    - name: customQuality
      type: string
      source: request
      optional: true
      absent: keep
    - name: lightingAccuracy
      type: string
      source: request
      optional: true
      absent: keep
    - name: output
      type: string
      source: request
      optional: true
      absent: keep
    - name: lighting
      type: string
      source: request
      optional: true
      absent: keep
    - name: lightGroups
      type: string
      source: request
      optional: true
      absent: keep
    - name: background
      type: string
      source: request
      optional: true
      absent: keep
    - name: backgroundImageFit
      type: string
      source: request
      optional: true
      absent: keep
    - name: backgroundImageOffsetMm
      type: string
      source: request
      optional: true
      absent: keep
    - name: exposure
      type: string
      source: request
      optional: true
      absent: keep
    - name: regionRendering
      type: string
      source: request
      optional: true
      absent: keep
  provides:
    - name: changed
      # Settings that read back as asked.
      role: result
      type: int
    - name: readBack
      # The whole Rendering dialog as the view holds it afterwards, filled on
      # every run that reached the view - so evidence, never the count.
      role: accounting
      type: string
    - name: refused
      # Why NOTHING WAS CHANGED, as one sentence; null otherwise (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>


compatibility-note: >
  `FamilyItemFactory.NewReferencePlane(bubbleEnd, freeEnd, cutVec, view)`,
  `FamilyItemFactory.NewDimension(view, line, references)`,
  `Dimension.AreSegmentsEqual`, `Dimension.FamilyLabel`,
  `FamilyItemFactory.NewExtrusion`, `SketchPlane.Create(Document, ElementId)`,
  `ItemFactoryBase.NewAlignment` and `Element.Pinned` - the calls the
  2026-10-24 probe made on Revit 2020 - are checked on every release by
  tools/check-api-surface.py. A parameter's kind is read by reflection,
  because it moved at 2022 - `Definition.ParameterType` before,
  `Definition.GetDataType()` from.

# ROUTING - see SET_FAMILY_CATEGORY for the whole family-building table.
#
#   "make a parametric hexagon / hex head / nut body"  -> here
#   "extrude a hexagon 20 mm thick"                    -> CREATE_FAMILY_EXTRUSION,
#                                                         a fixed shape
#   "make a box between these planes"                  -> EXTRUDE_BETWEEN_PLANES

utterances:
  - make a parametric hexagon whose across flats follows a parameter
  - build the hex head of the bolt so it resizes with Across Flats
  - extrude a hexagon between Ref. Level and Head Top driven by Head Across Flats
  - make the nut body a hexagon that changes size with the type
  - create a parametric octagon prism locked to its planes

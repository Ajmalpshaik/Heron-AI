# D-30: the negative case is what catches "succeeded and did nothing".
#
# The failure to fear is reporting a family "opened" while the project is
# still the window in front - the next fragment would then write its table
# into a project and report success.

positive:
  - given: a loaded, editable family and a writable folder
    expect: >
      opened true, savedTo naming a .rfa that EXISTS on disk, and activeAfter
      equal to the family's name. LOOK AT REVIT - the family window being in
      front is the whole point, and no count can stand in for it

  - given: the same family opened a second time
    expect: >
      the .rfa overwritten rather than refused - SaveAsOptions sets
      OverwriteExistingFile, so running twice is not a failure

  # VERSION 3, row 5b-1820 (repairing 5b-1750) - FAILS ON VERSION 2, which reported opened false
  # and Revit's "An internal error has occurred." as its problem here.
  - given: >
      run through revit_change on Revit 2024, inside the job's group, where
      OpenAndActivateDocument throws although the family window opens
    expect: >
      opened true, activeAfter the family's name, problem EMPTY - so the
      chat's verdict does not start "STOPPED, BY ITS OWN ACCOUNT" - and
      Revit's own words in findings beside "the window in front IS" the .rfa
      just written. LOOK AT REVIT: the family window in front

negative:
  # VERSION 3, row 5b-1820: the read-back must never take a window that is
  # not the file just written by THIS run.
  - given: >
      an EARLIER run's family window left open, the project window clicked
      back in front, then run again with saveFolder a SECOND folder - Revit
      may refuse a second family document of the same name
    expect: >
      opened false and Revit's own words as the problem - the window in
      front is a family of that name, but not the file this run wrote. A
      read-back by NAME would say opened true here; by path it must not

  - given: >
      an EARLIER run's family window left open, the project window clicked
      back in front, then run again with the SAME saveFolder - the window on
      that path was open before this run
    expect: >
      if Revit refuses (the save or the open), opened false with Revit's
      words as the problem and, when the save went through, a finding that a
      window on that same file was ALREADY open. Never opened true on the
      strength of the earlier window: it has the same path, and may hold
      edits this run never saw

  - given: familyName naming a family that is not loaded
    expect: >
      opened false, activeAfter unchanged, and NOTHING written to disk. The
      value-driven negative

  - given: an in-place family, which cannot be edited
    expect: opened false with the reason said in words, never a silent skip

  - given: a folder that cannot be written to
    expect: >
      opened false and Revit's own error. Never `opened true` with no file -
      the window in front would then be whatever it was before, and the next
      fragment would write into it

  - given: it is run while a transaction is open
    expect: >
      refused with "The document is currently modifiable!". This is EXECUTE
      for exactly that reason and must never be sent as a MODIFY

second_route:
  - look at Revit - is the family the window in front?
  - open the saved .rfa in Explorer and confirm it exists and is recent
  - run REPORT_OPEN_DOCUMENTS and read activeTitle back

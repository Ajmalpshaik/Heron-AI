id: FRG-ELE-062
semantic-identity: "put a loaded family in front in Revit, so it can be worked on"
kind: action
domain: revit.families
capability: OPEN_FAMILY_FOR_EDITING
version: 3
source: OFFICIAL
risk: EXECUTE

purpose: >
  Opens a loaded family in Revit's OWN WINDOW and makes it the document in
  front, so anything that writes to the active family can then reach it.

  **IT EXISTS BECAUSE EditFamily OPENS A FAMILY NOBODY CAN SEE.** A document
  from EditFamily is real and editable, and it is invisible: it never becomes
  the window in front, and it cannot be loaded back into the project without
  an answer to Revit's overwrite question that a fragment is not allowed to
  give. Edit such a document and close it and the work goes with it - measured
  on 2026-09-16, six families imported and every import discarded.

  **SO IT GOES THROUGH A FILE, DELIBERATELY.** The family is saved to a .rfa
  and that file is opened in the UI. A document opened this way is a window a
  person can see, work in, and LOAD INTO PROJECT from - which is the step the
  API route could not reach. The file is the bridge, not a side effect.

  **IT CHANGES NOTHING IN THE PROJECT.** No family is loaded, no element is
  touched. It writes one .rfa and opens a window. What happens in that window
  afterwards is somebody else's fragment, and loading it back is a person's
  click.

  **THE FAMILY IN FRONT AFTERWARDS IS NOT THE PROJECT'S COPY.** It is the file
  just written, which starts identical to it. Until it is loaded back, the
  project still holds the original - so a change made in that window has not
  reached the model, and saying otherwise would be the same lie the API route
  told.

  **IT CANNOT RUN INSIDE A TRANSACTION.** Both EditFamily and
  OpenAndActivateDocument refuse while the document is modifiable - "The
  document is currently modifiable! Close the transaction before calling
  EditFamily." That is why this is EXECUTE rather than MODIFY: it must be sent
  without the executor opening one.

  **VERSION 2: THE SAME CODE, AND THE SWITCH THAT SAYS WHAT IT NEEDS** -
  `noTransactionOpen` (D-125), as `OPEN_VIEW` declared it at its version 3.
  Version 1 declared nothing, so once its own door had gone it had none that
  could run it: `revit_show` turns it away because it writes a .rfa (row
  5b-591), and `revit_change` ran it inside a transaction, which EditFamily
  refused - *"The document is currently modifiable! Close the transaction
  before calling EditFamily."* - seen on Revit 2024, `villa 2`, 2026-11-11
  (row 5b-1701, issue #853). With the switch, `revit_change` runs it inside
  the job's group with no transaction open. `impl/` did not move, so its
  proof stands. **THAT PROOF WAS NOT TAKEN INSIDE A GROUP**: whether
  EditFamily and OpenAndActivateDocument run there is NEEDS-CHECKING Group
  NY's NY3, so a PROVEN line speaks for this code, not yet for that route.

  **VERSION 3 (2026-11-16): WHAT IS IN FRONT IS READ BACK, NOT TAKEN FROM
  REVIT'S ANSWER** (row 5b-1820, repairing row 5b-1750 - issue #853). NY3 answered on Revit 2024,
  `ny-scratch`, through `revit_change`: OpenAndActivateDocument, called
  inside the job's group, threw "An internal error has occurred." - and the
  family window WAS open and in front (Revit's title bar read
  "M_Single-Flush - Floor Plan: Ground floor", and the next call was pinned
  to it). Version 2 reported `opened false` and that sentence as its
  `problem`, so the chat said STOPPED over a family that had opened. Now,
  after a throw or no window handed back, the document in front is read:
  it counts as `opened` only when it is a family document whose file is the
  .rfa just written and no window on that file was open before the run -
  a window left from an earlier run into the same folder has the same path -
  and Revit's words go into `findings`, not `problem`. A
  family open but NOT in front is said apart, and stays `opened false` with
  its `problem` - the next fragment writes to whatever is in front.

contract:
  needs:
    - name: doc
      type: Document
    - name: noTransactionOpen
      # NEVER USED BY THE CODE. Declaring it is the switch that has the add-in
      # run this with NO transaction open on every path - inside the job's
      # TransactionGroup on the write path - because EditFamily and
      # OpenAndActivateDocument refuse inside one (D-125, rows 5b-591 and
      # 5b-1701). A save of the family EditFamily opened is this job's own to
      # make at EXECUTE (NEEDS-CHECKING Group EX, the owner's call 2026-10-18).
      type: bool
      source: ambient
    - name: uidoc
      type: UIDocument
    - name: familyName
      type: string
      source: request
    # Folder to write the .rfa into before opening it. The file is the bridge
    # into the UI, so it has to live somewhere a person can find again.
    - name: saveFolder
      type: string
      source: request
  provides:
    - name: opened
      role: result
      type: bool
    - name: savedTo
      # The .rfa that was written and opened. A path, not a promise - set only
      # after the save returned.
      role: result
      type: string
    - name: activeAfter
      # The document in front once this finished. Reported because the whole
      # point is which window is in front, and assuming it is the right one is
      # how the next fragment writes to a project.
      role: result
      type: string
    - name: problem
      # Revit's own words when anything refused, empty when nothing did -
      # and, since version 3, empty when the family ended up in front from the
      # file just written although Revit threw on the way (row 5b-1820): its
      # words are then in findings, and the card did what it was asked.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


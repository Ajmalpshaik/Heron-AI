revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Document.EditFamily`,
  `Document.SaveAs(string, SaveAsOptions)`, `Document.Close`,
  `UIDocument.Application` and `UIApplication.OpenAndActivateDocument(string)`
  are present 2020 through 2027, confirmed by reflection on the 2020
  assemblies on 2026-09-16. No unit is read or converted, so the 2021 units
  move cannot reach it.

# ROUTING - repeated in REPORT_FAMILY_TABLES_IN_PROJECT.
#
#   "open that family so we can fix it" -> here
#   "what is in its lookup table"       -> REPORT_FAMILY_SIZE_TABLE, once it
#                                          is in front
#   "write the table back"              -> WRITE_FAMILY_SIZE_TABLE, same
#   "read every family's table"         -> REPORT_FAMILY_TABLES_IN_PROJECT,
#                                          which needs nothing opened

utterances:
  - open that family for editing
  - put the family in front
  - edit this family
  - open the fitting family so I can change it

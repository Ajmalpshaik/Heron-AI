id: FRG-ELE-062
semantic-identity: "put a loaded family in front in Revit, so it can be worked on"
kind: action
domain: revit.families
capability: OPEN_FAMILY_FOR_EDITING
version: 1
source: OFFICIAL
risk: EXECUTE

purpose: >
  Opens a loaded family in Revit's OWN WINDOW and makes it the document in
  front, so anything that writes to the active family can then reach it.

  **IT EXISTS BECAUSE EditFamily OPENS A FAMILY NOBODY CAN SEE.** A document
  from EditFamily is real and editable, and it is invisible: it never becomes
  the window in front, and it cannot be loaded back into the project without
  an answer to Revit's overwrite question that a fragment is not allowed to
  give. Edit such a document and close it and the work goes with it - measured
  on 2026-09-16, six families imported and every import discarded.

  **SO IT GOES THROUGH A FILE, DELIBERATELY.** The family is saved to a .rfa
  and that file is opened in the UI. A document opened this way is a window a
  person can see, work in, and LOAD INTO PROJECT from - which is the step the
  API route could not reach. The file is the bridge, not a side effect.

  **IT CHANGES NOTHING IN THE PROJECT.** No family is loaded, no element is
  touched. It writes one .rfa and opens a window. What happens in that window
  afterwards is somebody else's fragment, and loading it back is a person's
  click.

  **THE FAMILY IN FRONT AFTERWARDS IS NOT THE PROJECT'S COPY.** It is the file
  just written, which starts identical to it. Until it is loaded back, the
  project still holds the original - so a change made in that window has not
  reached the model, and saying otherwise would be the same lie the API route
  told.

  **IT CANNOT RUN INSIDE A TRANSACTION.** Both EditFamily and
  OpenAndActivateDocument refuse while the document is modifiable - "The
  document is currently modifiable! Close the transaction before calling
  EditFamily." That is why this is EXECUTE rather than MODIFY: it must be sent
  without the executor opening one.

contract:
  needs:
    - name: doc
      type: Document
    - name: uidoc
      type: UIDocument
    - name: familyName
      type: string
      source: request
    # Folder to write the .rfa into before opening it. The file is the bridge
    # into the UI, so it has to live somewhere a person can find again.
    - name: saveFolder
      type: string
      source: request
  provides:
    - name: opened
      role: result
      type: bool
    - name: savedTo
      # The .rfa that was written and opened. A path, not a promise - set only
      # after the save returned.
      role: result
      type: string
    - name: activeAfter
      # The document in front once this finished. Reported because the whole
      # point is which window is in front, and assuming it is the right one is
      # how the next fragment writes to a project.
      role: result
      type: string
    - name: problem
      # Revit's own words when anything refused, empty when nothing did.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


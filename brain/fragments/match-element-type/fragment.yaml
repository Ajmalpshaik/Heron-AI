id: FRG-ELE-044
semantic-identity: "make these the same as that one"
kind: action
domain: revit.elements
capability: MATCH_ELEMENT_TYPE
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Changes a set of elements to the type of one chosen element - "make these the
  same as that one", pointed at rather than named.

  **The type is taken from an element, and that is the difference from
  CHANGE_ELEMENT_TYPE.** That fragment is told a type by name, which is right
  when the name is known. This one is told an element, which is right when it is
  not: a modeller points at the wall that is correct far more often than they
  can recite what it is called. Both exist because both are how the request
  actually arrives.

  **Only elements of the same category can take the type**, and the rest are
  refused by name rather than skipped. A duct cannot become a wall type, and a
  run that quietly changed nine of twelve would leave three wrong and nothing
  saying which.

  **What it does NOT copy is as important as what it does.** This changes the
  TYPE. Instance parameters - mark, comments, offsets, the things somebody typed
  on each element - are left exactly as they were. Revit's own match tool copies
  more than that, and expecting this to is how a mark gets overwritten across
  twelve elements at once.

  **The type is read back off each element after the change**, because a
  ChangeTypeId that returns is not a type that took. Some elements refuse
  silently, and a count that assumed success would report twelve changed where
  nine were.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16), so the
  whole set is one undo.

contract:
  needs:
    - name: doc
      type: Document
    - name: source
      type: Element
      source: request
    - name: elements
      type: IList<Element>
  provides:
    - name: changed
      role: result
      type: int
    - name: findings
      type: IList<string>


revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Element.ChangeTypeId` and
  `Element.GetTypeId` are present 2020 through 2027, compiled at both ends. Type
  ids are compared as ElementIds and never read as numbers, which is what would
  have made 2024's 64-bit change matter here.

# ROUTING - repeated in CHANGE_ELEMENT_TYPE, DUPLICATE_TYPE and
# COPY_PARAMETER_VALUE.
#
#   "make these the same as that one" -> here
#   "match this type onto those"      -> here
#   "change these to 200 blockwork"   -> CHANGE_ELEMENT_TYPE - the type is
#                                       NAMED, which is the other half of the
#                                       same job
#   "make a new type like this one
#    but 300 wide"                    -> DUPLICATE_TYPE. Nothing here creates a
#                                       type; it only moves elements onto one
#                                       that exists
#   "copy the mark across too"        -> COPY_PARAMETER_VALUE. This changes the
#                                       TYPE and leaves every instance
#                                       parameter alone, which is deliberate
#                                       and is not what Revit's own match tool
#                                       does

utterances:
  - make these the same as that one
  - match this type onto those
  - change these to match that wall
  - make them all like this one
  - match element type

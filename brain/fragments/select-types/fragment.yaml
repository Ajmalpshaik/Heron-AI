compatibility-note: >
  One implementation for every release. `WhereElementIsElementType`,
  `ElementType.FamilyName`, `ElementType.Name` and `FamilySymbol.Family` are
  unchanged 2020 to 2027.

  Categories are compared as `ElementId` against `ElementId` and no id is ever
  read as a number, so nothing here meets the 2024 widening to 64-bit or the
  removal of `IntegerValue` by 2026.

# ROUTING - repeated in FILTER_ELEMENTS_BY_TYPE, FIND_UNUSED_FAMILIES and
# DUPLICATE_TYPE.
#
#   "give me the types themselves"      -> here
#   "list the wall types in this model" -> here
#   "rename that type"                  -> RENAME_ELEMENTS does the renaming.
#                                          This one is how the type is REACHED
#                                          when nothing of it is placed, which
#                                          is the case no instance-based route
#                                          can serve. The two compose, this one
#                                          first - it is not a claim on the
#                                          sentence, which names the write
#   "select everything like this one"   -> FILTER_ELEMENTS_BY_TYPE - takes an
#                                          example ELEMENT and returns its
#                                          INSTANCES. The mirror image of this
#   "which types is nobody using"       -> FIND_UNUSED_FAMILIES - that one
#                                          walks the instances to prove the
#                                          absence; this one only describes
#   "make a copy of this type"          -> DUPLICATE_TYPE
#
# THE TRAP IS THAT "ALL THE 600x600 DIFFUSERS" MEANS EITHER. Asked by somebody
# about to change a product it means the TYPE; asked by somebody counting a
# drawing it means the instances. The two answers differ by a factor of
# hundreds, so the sentence is split between here and FILTER_ELEMENTS_BY_TYPE
# on whether the caller has an element in hand.

utterances:
  - give me the types themselves
  - list the wall types in this model
  - which duct types are loaded
  - find the type by name
  - the types not the instances
  - show me every family type in this category

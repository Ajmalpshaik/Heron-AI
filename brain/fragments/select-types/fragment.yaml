id: FRG-SEL-027
semantic-identity: "give me the types themselves, not the things placed from them"
kind: filter
domain: revit.selection
capability: SELECT_TYPES
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Returns the TYPE elements themselves - a family type, a duct type, a pipe
  type, a wall type - narrowed by category, by family name and by type name.
  Not the instances placed from them.

  **A TYPE WITH NOTHING PLACED IS OTHERWISE UNREACHABLE, AND THAT IS THE WHOLE
  REASON THIS EXISTS.** Every other route to a type in this library starts from
  an element and asks what type it is: FILTER_ELEMENTS_BY_TYPE takes an
  exemplar, CHANGE_ELEMENT_TYPE and DUPLICATE_TYPE both resolve from
  instances. All of them are blind to a type that has been loaded and never
  used - which is exactly the type somebody wants to rename before it spreads,
  or purge, or check against a naming standard. Starting from the instances
  cannot see it, by construction.

  **A TYPE IS AN ELEMENT AND CAN BE ACTED ON LIKE ONE.** That is not obvious
  and it is the point of returning `elements` rather than a list of names: a
  type can be renamed, have parameters written to it, be reported on, be
  deleted. Handing back strings would make this a report and stop it composing
  with everything that takes elements.

  **CATEGORIES ARE RESOLVED CATEGORIES, NEVER NAMES IN A STRING.** Turning a
  BIM word into a category is its own job and belongs upstream; a fragment that
  accepted "duct accessory" would be guessing at somebody else's vocabulary.
  Passing none means every category, which is the honest answer to "list the
  types in this model" and is deliberately allowed.

  **FAMILY NAME MEANS TWO DIFFERENT THINGS AND BOTH ARE ANSWERED.** A loadable
  family type carries its family as an object; a system family type - duct,
  pipe, wall - carries only a family NAME, and asking it for a family object
  gets nothing. Matching one way and not the other is how a filter reports zero
  for a duct type whose family is sitting there in the browser.

  **IT COUNTS NOTHING AND JUDGES NOTHING.** *"Which types are unused"* is
  FIND_UNUSED_FAMILIES, which walks the instances to prove it. This one hands
  back the types that match a description and leaves the judgement alone.

contract:
  needs:
    - name: doc
      type: Document
    # RESOLVED categories, never BuiltInCategory names in a string.
    #
    # AT LEAST ONE IS REQUIRED, AND THIS COMMENT USED TO SAY THE OPPOSITE.
    # It read "Null or empty means every category" until 2026-09-16, when a
    # caller believed it and got `bad_request_value: No categories were
    # named` - a refusal from the BINDER (RevitFragment.cs), which rejects an
    # empty IList<Category> before this fragment's own code runs. The binder
    # is right to: guessing a category is how a job runs against the wrong
    # thing. The comment was the false half. FRAGMENT-ISSUES row 112.
    - name: categories
      type: IList<Category>
      source: request
    - name: familyNameContains
      type: string
      source: request
    - name: typeNameContains
      type: string
      source: request
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: matchedNames
      role: result
      type: IList<string>
    - name: scanned
      # How many elements were examined. A count of work DONE, not of things
      # found - the evidence it ran, which is the opposite of a reason to
      # doubt it (D-52).
      role: accounting
      type: int
    - name: found
      role: result
      type: int


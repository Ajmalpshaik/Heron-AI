compatibility-note: >
  One implementation for every release. Read off the shipped reference
  assemblies and RevitAPI.xml of 2020 through 2027 on 2026-10-20:
  View3D.CreatePerspective, IsPerspective, IsLocked, Unlock, SetOrientation and
  GetOrientation; View.CropBox (get and set - the set's transform is ignored),
  CropBoxActive and ViewTemplateId; Element.get_BoundingBox(null);
  BuiltInParameter VIEWER_BOUND_ACTIVE_FAR and VIEWER_BOUND_OFFSET_FAR - present
  and alike on every release. No member named for a field of view exists on any
  release. Points are millimetres divided by 304.8 (D-20).


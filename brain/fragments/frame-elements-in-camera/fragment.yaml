compatibility-note: >
  One implementation for every release. Read off the shipped reference
  assemblies and RevitAPI.xml of 2020 through 2027 on 2026-10-20:
  View3D.CreatePerspective, IsPerspective, IsLocked, Unlock, SetOrientation and
  GetOrientation; View.CropBox (get and set - the set's transform is ignored),
  CropBoxActive and ViewTemplateId; Element.get_BoundingBox(null);
  BuiltInParameter VIEWER_BOUND_ACTIVE_FAR and VIEWER_BOUND_OFFSET_FAR - present
  and alike on every release. No member named for a field of view exists on any
  release. Points are millimetres divided by 304.8 (D-20). Version 3 adds
  Element.Location as LocationCurve with Line.Direction and Curve.Length,
  Element.LevelId with Level.ProjectElevation, and BuiltInParameter
  VIEWER_EYE_ELEVATION and VIEWER_TARGET_ELEVATION - SET_VIEW_CAMERA already
  calls the level's elevation and both parameters on every release - compiled
  for all eight by tools/check-fragments-compile.py on 2026-10-20. Version 4
  adds Room.IsPointInRoom, Space.IsPointInSpace and Document.GetRoomAtPoint
  (FILTER_ELEMENTS_IN_ROOM calls the first two), CurveLoop.Create,
  GeometryCreationUtilities.CreateExtrusionGeometry, ElementIntersectsSolidFilter
  and BoundingBoxIntersectsFilter with Outline (CHECK_EQUIPMENT_CLEARANCE's
  clash test), Document.ActiveView, Document.Phases, PhaseFilter and
  BuiltInParameter VIEW_PHASE and VIEW_PHASE_FILTER (SET_VIEW_PHASE's) -
  compiled for all eight by tools/check-fragments-compile.py on 2026-10-21.


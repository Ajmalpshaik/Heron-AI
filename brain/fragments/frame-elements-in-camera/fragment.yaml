# WHY IT EXISTS - a comment, not `purpose`, because `purpose` is searched.
# 2026-10-20: after four duct heaters were placed in Project1 (Revit 2020) the
# owner wanted a render of one, and the only camera tool took an eye point and
# a target typed in millimetres. A modeller frames a thing by looking at it;
# this takes the selection and does the arithmetic.
#
# HOW IT BEHAVES - comments, not `purpose`.
#
# **THE ELEMENTS HANDED IN ARE FRAMED**: their box is taken, the eye stands off
# it in the compass direction asked - north, south-east and so on, or degrees
# clockwise from PROJECT NORTH (plan up) - looking down at lookDownDeg (30 when
# not said), at distanceMm from the box's centre or, on auto, two and a half
# times its half-diagonal. The crop box is then set to the elements' box seen
# from that eye, with marginPercent (10) round it; the API reference says that
# moves "the crop region and far clip plane to the smallest values which will
# completely contain the 3D box".
#
# **ONE JOB WHETHER THE VIEW EXISTS OR IS NEW.** A perspective 3D view of that
# name is re-aimed; with none, one is made (auto names it after the first
# element). An isometric view of that name is refused - SET_VIEW_CAMERA turns
# one perspective.
#
# **WHAT IS MEASURED AND WHAT IS NOT.** `framed` counts the elements whose box
# lies inside the crop box Revit reads back afterwards, given in the view's own
# frame. Revit's API has NO field-of-view value on any release 2020 to 2027,
# and documents a perspective crop box only as "an outline encompassing the
# crop region", so no angle is claimed: the proof row has the modeller look at
# the view, and `readBack` carries the numbers.
#
# A view a template controls is refused, not half-changed.
#
# **VERSION 3 - THE SHOTS.** A visualisation artist does not type an eye point:
# they pick a shot, a side, a height and a lens, and walk back until the
# building fits. That is what the six inputs do.
#
# THE SHOT TABLE - Heron's STARTING values, never a standard (D-33). Any input
# given on its own wins over the shot's. "Round" is how far the camera steps
# clockwise round the building, seen in plan, off the face `side` names - to
# your left as you face that face; a corner or a compass word is used exactly.
#
#   shot            round  look        eye height        lens   composition  camera
#   eye-level        25°   level       1600 above base   35 mm  centre       level: two-point
#   low-angle hero   30°   6° up       450               24 mm  thirds       tilted - verticals lean in a little
#   high-angle       30°   25° down    on the look line  35 mm  centre       tilted
#   aerial           45°   40° down    on the look line  35 mm  centre       tilted (bird's-eye, aerial oblique)
#   worm's-eye       20°   25° up      150               20 mm  centre       tilted - the building towers
#   three-quarter    45°   level       1600              35 mm  thirds       level: two-point, both faces alike
#   front             0°   level       1600              50 mm  centre       level: one-point, elevation-like
#   interior          0°   level       1400              24 mm  centre       level: one-point, from INSIDE
#   close-up         30°   20° down    on the look line  85 mm  centre, 15%  tilted - a detail, little distortion
#   cinematic        30°   level       1200              28 mm  thirds       level - and a 2.39:1 cinema picture
#
# THE PICTURE'S SHAPE (`aspect`): every shot's window is a 35 mm frame's 3:2
# but the cinematic shot's, which is the cinema's 2.39:1 - a low, level, wide
# camera with the building on a third and a letterbox picture. `aspect` sets
# any shape: 16:9, 4:3, 1:1, 9:16 or a word - cinema, widescreen, square,
# portrait. Asked without a lens, the window is a 35 mm lens's.
#
# WHY THESE. 1600 mm is a standing person's eye, so the picture reads as being
# there; a level camera keeps verticals vertical - the commonest thing wrong
# in a render is walls leaning in. Low and wide (450 mm, 24 mm) makes a
# building tower over the viewer - the hero shot; a little look-up adds to it.
# 35 mm is a natural exterior lens, 50 mm the eye's own and the flattest for
# an elevation-like view, 24 mm what an interior needs to show a room, 85 mm a
# product lens that does not stretch a unit's corners. 1400 mm inside shows
# floor and ceiling alike. Thirds puts the building's middle on the left third
# line, which a still from a film does more often than not.
#
# THE SIDE. front, back, left, right and the corners front-left, front-right,
# back-left, back-right are the elements' OWN faces: their plan grid is the
# length-weighted direction of their straight location lines (walls, ducts,
# beams), or project north with none, and the FRONT is the long face looking
# nearest project south - a STARTING RULE, said in the answer, because Heron
# cannot know where the entrance is. left and right are as you face the
# front. A compass word or degrees says where the eye stands, exactly.
# `direction` still works as version 2's, but not beside `side`. A shot with
# neither stands on the front.
#
# THE EYE HEIGHT is above the level most of the elements stand on (their
# Level; the lowest of those that tie), or the bottom of their box when none
# has one - named in the answer (row 5b-1301, the owner's word).
#
# THE LENS. Revit's API has no field-of-view value (row 5b-1267), but the
# perspective crop window IS one: it is drawn 0.1 ft (30.48 mm) in front of
# the eye, where the view's crop shape lies (measured, row 5b-1301 - row
# 5b-1281's 40 mm was the far clip over a thousand), so its angle across is
# 2 x atan(half-width / near). A lens of f mm on 35 mm film (36 x 24 mm) is a
# window near x 18 / f wide each side of the middle and near x 12 / f high. The
# window is made that size and the eye is moved out until the elements fit it
# with the margin, so the lens decides how close the camera stands. lensMm
# auto with no shot keeps version 2's window fitted to the elements.
#
# A LEVEL CAMERA looks dead level - forward has no up or down - and the window
# is SHIFTED up or down on the near plane to take the elements in, which is
# what an architectural photographer's shift lens does. levelCamera false on a
# level shot aims at the elements' middle instead (three-point perspective).
#
# COMPOSITION moves the window, never the eye: centre; thirds (thirds-left,
# or thirds-right) - the elements' middle on that third line; low-horizon -
# the horizon on the bottom third line, a big sky. One that cannot hold the
# elements from that angle falls back to centre and says so.
#
# INTERIOR stands INSIDE the room - select the room, or its walls (the room at
# their middle is then used) - 600 mm in from the room's OWN boundary on the
# side named (distanceMm, when given, is that inset), looking straight across
# at eye height. Version 4 (row 5b-1308): the boundary is found coming in from
# the box's face until the point is in the room, and the eye steps further in,
# 100 mm at a time, until nothing solid is within 150 mm - a wall, a door's
# frame - never past half way across; with no such point it refuses, naming
# what is in the way. Nothing is pulled back, so
# the lens alone decides what is seen, and `framed` cannot count a room the
# eye stands in: the answer says so and the picture is the check.
#
# A WINDOW THAT CANNOT HOLD THE ELEMENTS - distanceMm too close for the lens,
# or no distance found - drops a composition that cannot hold them for centre,
# and when even centred cannot, is centred on the elements' MIDDLE, with a
# finding saying so (version 4, row 5b-1304). Version 3 put it
# on the middle of their box's projected corners, and the corners nearest the
# eye pulled it to the floor.
#
# A NEW VIEW'S PHASE (version 4, row 5b-1307): the active view's phase, or the
# project's last, and the model's own phase filter 'Show Complete' - looked up
# by name, never made; with none by that name the view keeps Revit's default
# and the finding says so. A view that already existed keeps its own.
#
# THE READ-BACK adds, from what the view holds afterwards: the side stood on
# and its azimuth, the eye height above the base level, the point aimed at,
# the look angle, `lens` - the 35 mm-film lens the crop window amounts to and
# its angles across and up - and Revit's own Eye Elevation and Target
# Elevation. `framed` is version 2's count. Version 4 adds the view's phase
# and phase filter, and says when the far clip could not be pushed out or the
# crop shape could not be read (row 5b-1302).
#
# NOT YET: a portrait (upright) picture - the window is 3:2 across; depth of
# field; a camera path for a walkthrough.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Makes or re-aims a perspective camera view so the selected elements fill it -
  from a compass direction, looking down at an angle, with a margin round them -
  and reads the camera and its crop box back. Version 3 takes a named shot -
  eye-level, low-angle hero, bird's-eye aerial, worm's-eye, three-quarter,
  front, interior, close-up, cinematic - the building's side to stand on, the
  camera height, the lens and the picture's shape, the way a visualiser sets up
  a cinematic camera.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # The perspective view to make or re-aim; auto names it after the first
    # element.
    - name: viewName
      type: string
      source: request
      optional: true
      absent: auto
    # Where the camera stands, seen from the elements: north, north-east,
    # east ... north-west, or degrees clockwise from project north. auto
    # (version 3) is version 2's south-east, or the shot's side.
    - name: direction
      type: string
      source: request
      optional: true
      absent: auto
    # Degrees below level, -60 to 89; auto is 30, or the shot's angle.
    - name: lookDownDeg
      type: string
      source: request
      optional: true
      absent: auto
    # Millimetres from the elements' centre to the eye, or auto.
    - name: distanceMm
      type: string
      source: request
      optional: true
      absent: auto
    # auto is 10, or the shot's margin.
    - name: marginPercent
      type: string
      source: request
      optional: true
      absent: auto
    # VERSION 3. A named shot - the table above: eye-level, low-angle (hero),
    # high-angle, aerial (bird's-eye), worm's-eye, three-quarter, front
    # (one-point), interior, close-up (detail), cinematic; none is version 2.
    - name: shot
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 3. The side to stand on: front, back, left, right, front-left,
    # front-right, back-left, back-right - the elements' own faces - or a
    # compass word, or degrees from project north; none uses `direction`.
    - name: side
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 3. The eye in mm above the elements' base level; auto is the
    # shot's.
    - name: eyeHeightMm
      type: string
      source: request
      optional: true
      absent: auto
    # VERSION 3. A 35 mm-film focal length, 12 to 300 (24 wide, 35, 50
    # normal, 85 tele), or wide / normal / tele; auto is the shot's, or with
    # no shot the window fitted to the elements as version 2.
    - name: lensMm
      type: string
      source: request
      optional: true
      absent: auto
    # VERSION 3. centre, thirds (thirds-left, thirds-right) or low-horizon;
    # auto is the shot's, or centre.
    - name: composition
      type: string
      source: request
      optional: true
      absent: auto
    # VERSION 3. true looks dead level - verticals vertical; false aims at the
    # elements' middle; auto is the shot's, or version 2's tilt.
    - name: levelCamera
      type: string
      source: request
      optional: true
      absent: auto
    # VERSION 3 (row 5b-1287). The picture's width over height - 16:9, 3:2,
    # 4:3, 2.39:1 (cinema), 1:1, 9:16 - or cinema, widescreen, square,
    # portrait; auto is the shot's own.
    - name: aspect
      type: string
      source: request
      optional: true
      absent: auto
  provides:
    - name: camera
      role: result
      type: View3D
    - name: madeNew
      role: result
      type: bool
    - name: framed
      # Elements whose box lies inside the crop box Revit reads back.
      role: result
      type: int
    - name: readBack
      # Eye, direction, crop box and far clip as the view holds them -
      # evidence, never the count. Version 3 adds the side, eye height, the
      # point aimed at, the look angle and the lens.
      role: accounting
      type: string
    - name: lens
      # Version 3: the 35 mm-film lens the crop window amounts to, its angles
      # across and up, and the window's size on the near plane.
      role: accounting
      type: string
    - name: noGeometry
      # Elements with no box to frame - the evidence it looked (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why NOTHING WAS CHANGED, as one sentence; null otherwise (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>


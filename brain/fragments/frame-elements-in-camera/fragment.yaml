# BOX; on 'Kitchen & Dining 101', side right, that was inside a double door's
# frame and the Raytracer render came out black. It now stands the inset in
# from the room's OWN boundary (Room.IsPointInRoom, found coming in from the
# box), steps further in until nothing solid is within 150 mm, and refuses,
# naming what is in the way, when no point is clear. (2) row 5b-1304 - a window
# that cannot hold the elements (distanceMm given, or no distance found for the
# lens) was centred on their box's projected corners, which slid it to the
# floor: ten chairs and tables at 2500 mm gave a picture of table legs. It now
# drops a composition that cannot hold them, and when even centred cannot,

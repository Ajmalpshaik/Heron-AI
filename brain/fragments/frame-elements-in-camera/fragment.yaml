# VERSION 3, 2026-10-21 - row 5b-1287, the owner's ask: "this building left
# side like in a cinematic camera look ... different styles, camera angles,
# camera height ... all kind of camera settings". Six optional inputs, each
# absent reading as version 2 did:
#   shot         eye-level, three-quarter, front (one-point), hero (low angle),
#                worm's-eye, high-angle, bird's-eye (aerial), top-down,
#                cinematic, close-up - each a turn from the side, a camera
#                height or a look-down, a lens, a picture shape and a
#                composition, in ONE table in the source: Heron's STARTING
#                values, never a standard (D-33); the picture is the judge
#   side         front (stand south, look north), back, left (west), right
#                (east) with project north up, or a compass word or degrees
#   eyeHeightMm  the camera's height above the elements' base; with it the
#                camera is LEVEL - verticals stay vertical, a two-point
#                perspective - unless the shot aims at the centre (hero,
#                worm's-eye); a height and a look-down both given is refused
#   lensMm       a 35 mm camera's focal length, 10 to 300 - 24 wide, 35, 50
#                normal, 85 close. The crop window on Revit's near plane is
#                sized to that angle (row 5b-1281's measurement: half width =
#                near x 18 / lens) and the eye moves back until the elements
#                fill it
#   aspect       the picture's width over height - 16:9, 3:2, 4:3, 2.39:1
#                (cinema), 1:1, 9:16 or auto
#   composition  centre, thirds (the elements on the left third line) or low
#                horizon (a level camera's horizon on the lower third)
# direction, lookDownDeg and marginPercent now read `auto` when left out -
# south-east, 30 and 10 as before, or the shot's own. Version 2's proof below
# no longer describes the code: DRAFT until proved again, pictures looked at.
# VERSION 2, 2026-10-20 - row 5b-1281. Version 1, signed the same day on
# numbers alone (IB1's look at the view was never made), set a perspective
# view's crop box to the elements' box metres away; Revit draws a perspective
# crop window on its own near plane, 40 mm in front of the eye, so three
# exported views showed the elements as a dot. The corners are now projected
# onto that plane. Version 1's proof below no longer describes the code:
# DRAFT until it is proved again WITH the picture looked at.
source: OFFICIAL
risk: MODIFY

# WHY IT EXISTS - a comment, not `purpose`, because `purpose` is searched.
# 2026-10-20: after four duct heaters were placed in Project1 (Revit 2020) the
# owner wanted a render of one, and the only camera tool took an eye point and
# a target typed in millimetres. A modeller frames a thing by looking at it;
# this takes the selection and does the arithmetic.
#
# HOW IT BEHAVES - comments, not `purpose`.
#
# **THE ELEMENTS HANDED IN ARE FRAMED**: their box is taken, the eye stands off
# it in the compass direction asked - north, south-east and so on, or degrees
# clockwise from PROJECT NORTH (plan up) - looking down at lookDownDeg (30 when
# not said), at distanceMm from the box's centre or, on auto, two and a half
# times its half-diagonal. The crop box is then set to the elements' box seen
# from that eye, with marginPercent (10) round it; the API reference says that
# moves "the crop region and far clip plane to the smallest values which will
# completely contain the 3D box".
#
# **ONE JOB WHETHER THE VIEW EXISTS OR IS NEW.** A perspective 3D view of that
# name is re-aimed; with none, one is made (auto names it after the first
# element). An isometric view of that name is refused - SET_VIEW_CAMERA turns
# one perspective.
#
# **WHAT IS MEASURED AND WHAT IS NOT.** `framed` counts the elements whose box
# lies inside the crop box Revit reads back afterwards, given in the view's own
# frame. Revit's API has NO field-of-view value on any release 2020 to 2027,
# and documents a perspective crop box only as "an outline encompassing the
# crop region", so no angle is claimed: the proof row has the modeller look at
# the view, and `readBack` carries the numbers.
#
# A view a template controls is refused, not half-changed.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Makes or re-aims a perspective camera view so the selected elements fill it -
  from a compass direction, looking down at an angle, with a margin round them -
  and reads the camera and its crop box back.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # The perspective view to make or re-aim; auto names it after the first
    # element.
    - name: viewName
      type: string
      source: request
      optional: true
      absent: auto
    # Where the camera stands, seen from the elements: north, north-east,
    # east ... north-west, or degrees clockwise from project north.
    - name: direction
      type: string
      source: request
      optional: true
      absent: auto
    - name: lookDownDeg
      type: string
      source: request
      optional: true
      absent: auto
    # Millimetres from the elements' centre to the eye, or auto.
    - name: distanceMm
      type: string
      source: request
      optional: true
      absent: auto
    - name: marginPercent
      type: string
      source: request
      optional: true
      absent: auto
    # Version 3. A named shot - eye-level, three-quarter, front, hero, worm's-eye,
    # high-angle, bird's-eye, top-down, cinematic, close-up - or none.
    - name: shot
      type: string
      source: request
      optional: true
      absent: none
    # Version 3. Which side to stand on: front, back, left, right, or a compass word.
    - name: side
      type: string
      source: request
      optional: true
      absent: none
    # Version 3. Camera height in mm above the elements' base - a level camera.
    - name: eyeHeightMm
      type: string
      source: request
      optional: true
      absent: auto
    # Version 3. Lens in mm on a 35 mm camera, 10 to 300.
    - name: lensMm
      type: string
      source: request
      optional: true
      absent: auto
    # Version 3. Picture width over height - 16:9, 2.39:1 and so on, or auto.
    - name: aspect
      type: string
      source: request
      optional: true
      absent: auto
    # Version 3. centre, thirds or low horizon.
    - name: composition
      type: string
      source: request
      optional: true
      absent: auto
  provides:
    - name: camera
      role: result
      type: View3D
    - name: madeNew
      role: result
      type: bool
    - name: framed
      # Elements whose box lies inside the crop box Revit reads back.
      role: result
      type: int
    - name: readBack
      # Eye, direction, crop box and far clip as the view holds them -
      # evidence, never the count.
      role: accounting
      type: string
    - name: noGeometry
      # Elements with no box to frame - the evidence it looked (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why NOTHING WAS CHANGED, as one sentence; null otherwise (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>


revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `ScheduleDefinition.ShowTitle`,
  `ShowHeaders`, `ShowGridLines`, `IncludeLinkedFiles`, `CanIncludeLinkedFiles`,
  `HasEmbeddedSchedule`, `EmbeddedDefinition`, `CanHaveEmbeddedSchedule`,
  `GetValidCategoriesForEmbeddedSchedule`, `IsValidCategoryForEmbeddedSchedule`,
  `AddEmbeddedSchedule` and `RemoveEmbeddedSchedule`, and `ViewSchedule.
  TitleTextTypeId`, `HeaderTextTypeId`, `BodyTextTypeId`, `IsValidTextTypeId`
  and `HasStripedRows` are present with the same signatures 2020 through 2027.
  `UseStripedRowsOnSheets`, `GetStripedRowsColor`, `SetStripedRowsColor` and
  the `StripedRowPattern` enum (FirstRow, SecondRow) arrive at 2021;
  `IsFilteredBySheet` and `IsValidCategoryForFilterBySheet` at 2023;
  `RowHeight`, `RowHeightOverride` and `RowHeightOverrideOptions` (None, All,
  ImageRows) at 2024. Those are reached by name at run time, one
  implementation for every release, and a release without one names that setting in
  `notApplicable`. Every member looked up with tools/api-surface --members on
  all eight releases, 2026-11-01. Row height is mm / 304.8, plain arithmetic.

# ROUTING - the same rows are in the fragments named here.
#
#   "hide the schedule title"            -> here, showTitle no
#   "turn off the grid lines on the sheet" -> here, gridLinesOnSheets no
#   "use the 3.5mm Arial text for the schedule header"
#                                        -> here, headerTextType
#   "make the schedule text bold"        -> here by choosing a BOLD text type
#                                           for its body or header - the type
#                                           itself is not edited. For ONE
#                                           column's text, SET_SCHEDULE_APPEARANCE
#                                           (version 4, its cell style)
#   "stripe the schedule rows"           -> here, stripedRows yes
#   "include elements in links"          -> here, includeLinks yes
#   "filter the schedule by sheet"       -> here, filterBySheet yes (2023 on).
#                                           A filter by a VALUE is
#                                           SET_SCHEDULE_FILTERS
#   "change the column heading" / "make the column wider" / units of a column
#                                        -> SET_SCHEDULE_APPEARANCE. One
#                                           column's formatting
#   "sort by level" / "show the grand total"
#                                        -> SET_SCHEDULE_SORT_GROUP
#   "group the Width and Height headers under Size"
#                                        -> GROUP_SCHEDULE_HEADERS
#   "freeze the schedule headers"        -> NOT HERE AND NOWHERE IN THIS
#                                           LIBRARY. ViewSchedule.IsHeaderFrozen
#                                           is a static switch of the Revit
#                                           session, not a setting saved in the
#                                           model. Revit's route: Modify
#                                           Schedule/Quantities, Freeze Header
#   "what are the schedule's settings"   -> REPORT_SCHEDULE_DEFINITION

utterances:
  - hide the schedule title
  - turn off the schedule headers
  - turn off the grid lines on the sheet for this schedule
  - use a different text type for the schedule header
  # ADDED 2026-11-02, row 5b-1414 (FIXED). The routing table above sends it
  # here, headerTextType; it reached this card by ranking until
  # SET_DIMENSION_TYPE ("2.5mm Arial" in its words) was added and took it.
  - use the 3.5mm Arial text for the schedule header
  - change the body text of the schedule
  - stripe the schedule rows
  - include elements in links in this schedule
  # ADDED 2026-11-01 (FRAGMENT-ISSUES row 5b-1385). The routing table above
  # sends the shorter sentence here, includeLinks yes. It reached FIND_CLASHES
  # and, once REPORT_STRUCTURAL_CONNECTIONS and PLACE_STRUCTURAL_CONNECTIONS
  # moved the ranking, ZOOM_TO_LINKED_ELEMENTS; declared here, so the identity
  # route answers it before any ranking runs.
  - include elements in links
  - filter the schedule by sheet
  - add an embedded schedule
  - set the schedule row height

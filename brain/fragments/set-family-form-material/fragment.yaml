compatibility-note: >
  `FamilyManager.AssociateElementParameterToFamilyParameter` (whose remarks say
  the two parameters must be the same type, and which takes a null to unlink),
  `CanElementParameterBeAssociated`, `GetAssociatedFamilyParameter` and
  `BuiltInParameter.MATERIAL_ID_PARAM` read the same 2020 through 2027 (the
  RevitAPI reference assemblies and their own XML remarks, read 2026-10-01). A
  parameter's kind is read by reflection: `SpecTypeId.Reference.Material` from
  2022, `ParameterType.Material` before, gone from 2023.

# ROUTING - see SET_FAMILY_CATEGORY for the whole family-building table.
#
#   "link the body material to Body Material"     -> here
#   "make this extrusion steel"                   -> here
#   "link the connector flow to a parameter"      -> LINK_FAMILY_PARAMETER,
#                                                    every element of a kind
#   "what material is this wall"                  -> READ_ELEMENT_MATERIAL, a
#                                                    project read

utterances:
  - link the body material to Body Material
  - make this extrusion steel
  - give the neck its own material parameter
  - set the material of these forms
  - put this form back to by category material

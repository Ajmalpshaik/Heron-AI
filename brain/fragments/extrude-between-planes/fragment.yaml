compatibility-note: >
  `FamilyItemFactory.NewExtrusion(isSolid, profile, sketchPlane, end)`,
  `SketchPlane.Create(Document, ElementId datumId)`, `ItemFactoryBase.NewAlignment
  (view, reference1, reference2)`, `Options.ComputeReferences`,
  `PlanarFace.FaceNormal` and `Dimension.IsLocked` read the same 2020 through
  2027 (api-surface, read 2026-09-24). The sketch plane is made from the base
  plane's ELEMENT id, not from a copy of its geometry: made from geometry it is
  hosted on nothing, and cannot be re-hosted afterwards - reported from an
  earlier family build.


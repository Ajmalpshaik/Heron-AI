compatibility-note: >
  One implementation for every release. `ScheduleDefinition.GetSortGroupFields`,
  `ClearSortGroupFields`, `AddSortGroupField`, `CanSortByField`, `IsItemized`,
  `ShowGrandTotal`, `ShowGrandTotalTitle`, `ShowGrandTotalCount`, the
  `ScheduleSortGroupField(ScheduleFieldId, ScheduleSortOrder)` constructor and
  its `ShowHeader` and `ShowFooter` properties, and the `ScheduleSortOrder` enum
  (`Ascending`, `Descending`) are present and unchanged 2020 through 2027, with
  the same argument counts.

  `ShowBlankLine` exists on every release and is deliberately NOT set unless
  asked - a blank line between groups is a separate drafting choice, and
  setting it from the footer flag would be this fragment inventing a
  preference and then changing the sheet to match it. VERSION 2 sets it only
  from an explicit `showBlankLine` or a level's "blank line" word.

  VERSION 2: `ScheduleSortGroupField.ShowFooterTitle`, `ShowFooterCount` and
  `ShowBlankLine` (get and set) and `ScheduleDefinition.GrandTotalTitle` (get
  and set) are present and unchanged 2020 through 2027, read off the
  reference assemblies with `tools/api-surface --members`.

  Field identity is `ScheduleFieldId`, not an `ElementId`. No units call is made.

# ROUTING - the same rows are in the fragments named here.
#
#   "sort the schedule by level"        -> here
#   "group the schedule by system type" -> here, with showHeader - grouping IS
#                                          sorting with a header in Revit
#   "put a total at the bottom"         -> here, showGrandTotal
#   "calculate totals for the flow column"
#                                       -> SET_SCHEDULE_FIELD_TOTALS. A footer
#                                          and the grand total are switched on
#                                          HERE; what they add up is chosen per
#                                          column THERE. Until a column has
#                                          totals on, a footer only counts rows
#   "one line per size instead of every duct"
#                                       -> here, itemized off - it is the flag
#                                          that changes the ROW COUNT. Worded
#                                          to match the declared utterance
#                                          exactly: a table claiming a sentence
#                                          the index never saw records a
#                                          decision nothing acts on
#   "list the levels in the project"    -> LIST_LEVELS. A question about the
#                                          MODEL, and it is what "sort the
#                                          schedule by level" used to return
#   "filter the schedule to level 2"    -> SET_SCHEDULE_FILTERS. Sorting decides
#                                          the ORDER of rows; filtering decides
#                                          WHICH rows. Both get said as "by
#                                          level" and they are different jobs
#   "how is it sorted now"              -> REPORT_SCHEDULE_DEFINITION
#   "show the count in each group footer"
#                                       -> here, version 2, showFooterCount
#   "put a blank line between the groups"
#                                       -> here, version 2, showBlankLine
#   "sort level descending, mark ascending"
#                                       -> here, version 2, levelOptions
#   "change the grand total title to Total Length"
#                                       -> here, version 2, grandTotalTitle
#   "calculate the maximum flow for each group"
#                                       -> SET_SCHEDULE_FIELD_TOTALS v2. What
#                                          a COLUMN calculates is chosen
#                                          there; a footer's title and count
#                                          are a sort level's switches, here

utterances:
  - sort the schedule by level
  - group the schedule by system type
  - order the schedule by mark
  - add a total to the bottom of the schedule
  - show the grand total on this schedule
  - group these rows together
  - one line per size instead of every duct
  - put a header on each group
  # VERSION 2 - the rest of the Sorting/Grouping tab.
  - show the count in each group footer
  - put a blank line between the groups
  - sort level descending, mark ascending
  - change the grand total title to Total Length

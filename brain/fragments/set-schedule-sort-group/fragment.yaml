id: FRG-VIEW-059
semantic-identity: "sort and group this schedule by these fields, with headers and totals"
kind: action
domain: revit.schedules
capability: SET_SCHEDULE_SORT_GROUP
# VERSION 2 (2026-11-01, on the owner's word in the brief of that day's
# session: Ajmal PS asked, after a duct length schedule on his Revit 2020 job
# model could not have its Length column set to metres, for every schedule
# setting Heron is missing - FRAGMENT-ISSUES row 5b-1363). The rest of the
# Sorting/Grouping tab: a footer's title and count (`showFooterTitle`,
# `showFooterCount`), the blank line between groups (`showBlankLine`), order,
# header, footer, footer title, footer count and blank line PER SORT LEVEL
# (`levelOptions`, ";" between levels, "," between words - a string, because
# an optional list left out would bind its absent word as a one-entry list),
# and the grand total's title text and its title and count switches
# (`grandTotalTitle`, `showGrandTotalTitle`, `showGrandTotalCount`). Every new
# input is `optional: true` with an `absent:` word - "leave" or "none" - and
# left out does EXACTLY what version 1 did: the blank line is still not set
# unless asked (version 1's comment at the write, kept), and the grand total's
# title and count are still forced on with it. Every word is read before any
# schedule is touched; a bad one refuses the whole call. Version 1's proof
# below no longer describes the code and is kept as a record; the card is DRAFT
# until NEEDS-CHECKING Group KK proves version 2 and the owner signs.
#
# ASSUMPTION THE PROOF SETTLES: what a NEW sort level holds for footer title,
# footer count and blank line when they are left out. The reference does not
# say; appliedOrder reads all three back per level, and the proof records them.
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Sets what a schedule sorts and groups by - in order - and whether each level
  gets a header, a footer and a blank line, plus the grand total at the bottom.

  IT EXISTS BECAUSE *"sort the schedule by level"* RESOLVED TO `LIST_LEVELS`.
  Measured before this batch: a question about the levels in the project,
  returned for a sentence about the order of rows in a schedule. Nothing in the
  library could sort anything.

  **SORTING AND GROUPING ARE ONE CONTROL IN REVIT, AND THAT SURPRISES PEOPLE.**
  There is no separate "group by". A field with `showHeader` on IS a group -
  the header is the band carrying the level name across the sheet. So *"group
  the schedule by system type"* and *"sort it by system type"* are the same call
  with one flag different, and the flag is the entire difference between a
  grouped schedule and a long flat list.

  **"COLLAPSE THE ROWS" IS `itemized`, NOT A SORT, AND IT IS THE ONE THAT
  CHANGES THE ROW COUNT.** Turning itemising off makes identical elements share
  one row - which is what somebody means by *"just show me one line per size"*.
  It is set here because it is on the same Revit tab and is meaningless without
  the sorting beneath it.

  **A FIELD THE SCHEDULE CANNOT SORT BY IS ASKED ABOUT BEFORE IT IS TRIED.**
  `CanSortByField` is Revit's own answer, and it covers the cases that are
  otherwise exceptions half way through a batch that has already changed the
  first two fields.

  **THE SORT IS REPLACED, NOT APPENDED TO.** Asking for "sort by level" on a
  schedule already sorted by mark means sorted by level - not sorted by mark
  then level. Appending is how a schedule ends up with four sort levels nobody
  chose, and the existing rules are reported before they go.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: sortFieldNames
      type: IList<string>
      source: request
    - name: descending
      type: bool
      source: request
    - name: showHeader
      type: bool
      source: request
    - name: showFooter
      type: bool
      source: request
    - name: showGrandTotal
      type: bool
      source: request
    - name: itemized
      type: bool
      source: request
    # VERSION 2. Each "yes" | "no"; left out ("leave") nothing is set - for
    # the footer title and count on a new level that is Revit's own default.
    # Applied to every level that has a footer.
    - name: showFooterTitle
      type: string
      source: request
      optional: true
      absent: leave
    - name: showFooterCount
      type: string
      source: request
      optional: true
      absent: leave
    # VERSION 2. "yes" | "no" on every level; left out, NOT SET - version 1
    # never set it, and a blank line is a drafting choice nobody asked for.
    - name: showBlankLine
      type: string
      source: request
      optional: true
      absent: leave
    # VERSION 2. One entry per sort level, in the order of sortFieldNames,
    # ";" between levels, "," between words: ascending, descending, header,
    # no header, footer, no footer, footer title, no footer title, footer
    # count, no footer count, blank line, no blank line. Overrides the flat
    # switches for that level only. Left out it is "none".
    - name: levelOptions
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 2. The grand total's title text; it also turns the title on.
    # Left out ("leave"), Revit's text is kept.
    - name: grandTotalTitle
      type: string
      source: request
      optional: true
      absent: leave
    # VERSION 2. "yes" | "no"; left out ("leave") both are forced on with
    # the grand total, as version 1 did.
    - name: showGrandTotalTitle
      type: string
      source: request
      optional: true
      absent: leave
    - name: showGrandTotalCount
      type: string
      source: request
      optional: true
      absent: leave
  provides:
    - name: sorted
      role: result
      type: int
    - name: replacedRules
      # The sort rules that were there BEFORE - THE SORT IS REPLACED, NOT
      # APPENDED TO, and the existing rules are reported before they go. The
      # prior state, never a rule it applied (D-52).
      role: accounting
      type: IList<string>
    - name: cannotSortBy
      # Fields Revit will not sort by - CanSortByField is its own answer,
      # asked before anything is tried. Given and unusable (D-52).
      role: accounting
      type: IList<string>
    - name: notPresent
      # Field names the schedule does not carry, so it could not be sorted on.
      # The evidence it looked, never a thing it found (D-52).
      role: accounting
      type: IList<string>
    - name: appliedOrder
      role: result
      type: IList<string>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string


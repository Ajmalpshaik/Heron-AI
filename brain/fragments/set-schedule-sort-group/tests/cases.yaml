positive:
  - given: a duct schedule and "sort by Level"
    expect: >
      sorted 1, and the rows in level order when the schedule is opened in Revit
      - read on screen, not inferred from the count

  - given: the same request with showHeader
    expect: >
      each level's name appearing as a band across the schedule. That band IS
      the grouping - it is what somebody means by "group it by level"

  - given: sort by Level then by Mark
    expect: >
      appliedOrder reading "Level ascending, then Mark ascending", read back from
      the schedule rather than echoed from the request

  - given: itemized off on a duct schedule with forty identical 450x250 ducts
    expect: >
      ONE row for that size, not forty. This is the flag that changes the row
      count and the only one whose effect is countable

  - given: showGrandTotal on
    expect: a total row at the bottom, with its title and its count

  - given: VERSION 2 - sort by Level then Mark, showFooter on, showFooterCount yes, showFooterTitle no, showBlankLine yes
    expect: >
      appliedOrder reading each level "footer on (title off, count on), blank
      line on", and in Revit each group's footer showing the count with no
      title and a blank line after each group

  - given: VERSION 2 - levelOptions "descending, header; ascending, no header" for Level then Mark
    expect: >
      appliedOrder reading "Level descending with header (grouped) ... then
      Mark ascending, no header", whatever the flat descending and showHeader
      say

  - given: VERSION 2 - showGrandTotal on and grandTotalTitle "Total Length", showGrandTotalCount no
    expect: >
      appliedOrder reading "grand total ON - title on 'Total Length', count
      off", and the schedule's last row reading Total Length with no count

  - given: VERSION 2 - every new input left out
    expect: >
      exactly version 1 - the blank line not set, and the grand total's title
      and count forced on. appliedOrder records Revit's own footer title,
      footer count and blank line on a new level - THE DEFAULT THIS PROOF
      SETTLES

negative:
  - given: VERSION 2 - levelOptions "descending; bold" on a schedule sorted by Mark
    expect: >
      refused naming 'bold' and the words accepted, NOTHING WAS SORTED, and the
      Mark sort still there - nothing cleared

  - given: VERSION 2 - three levelOptions entries for two sort fields
    expect: refused, the schedule's sort unchanged

  - given: VERSION 2 - grandTotalTitle "Total" with showGrandTotal off
    expect: refused, the schedule's sort and grand total unchanged

  - given: a schedule already sorted by Mark, now asked to sort by Level
    expect: >
      sorted BY LEVEL ONLY, with the Mark rule named in replacedRules. THIS IS
      THE FIRST CASE TO RUN. A version that appends passes every positive case
      above and leaves schedules with sort levels nobody chose

  - given: a field name that is not a column in the schedule
    expect: >
      named in notPresent, and NOTHING CHANGED on that schedule - not cleared and
      left unsorted. Clearing then failing is worse than refusing

  - given: a field Revit will not sort by
    expect: >
      named in cannotSortBy from CanSortByField, asked BEFORE anything is
      cleared, and the schedule untouched

  - given: an empty sortFieldNames list
    expect: >
      nothing changed and nothing claimed. Zero sorted with no rules touched must
      be distinguishable from a run that cleared the sorting

  - given: a schedule with no sorting at all before the call
    expect: >
      replacedRules EMPTY rather than absent, and the new sort applied. An empty
      "what was replaced" is information, not a missing section

second_route:
  - >
    Revit's own schedule Properties - Sorting/Grouping tab, plus the Itemize
    every instance tick at its foot. That tab is exactly this fragment's inputs
    and is what the result is checked against

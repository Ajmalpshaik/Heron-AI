# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: a building with shafts and slab penetrations
    expect: >
      both kinds returned and `byKind` separating them. Twelve shafts and
      twelve floor openings are two different coordination pictures

  - given: a view passed in
    expect: >
      only the openings that view draws

  - given: a model with openings of one kind only
    expect: >
      the other kinds present in `byKind` at 0. No shafts at all is a finding
      on a building with risers in it

  # D-59, added 2026-09-28 with version 2. NOT RUN.
  - given: >
      includeLinks true on a model whose architectural or
      structural link holds shafts or floor openings
    expect: >
      `elements` and `byKind` unchanged, and each link's
      openings per kind in `linkedMatches`

negative:
  - given: a query for one opening category only
    expect: >
      NOT what this does. Openings are spread across several categories and one
      query returns a fraction of them while looking complete

  - given: the hole a DOOR cuts in a wall
    expect: >
      it not returned. That hole belongs to the door family and is in none of
      these categories - correct, and worth knowing when somebody says "every
      hole"

  - given: a model with no openings at all
    expect: >
      an empty set with every kind at 0, and no throw

  # D-59, added 2026-09-28 with version 2. NONE OF THESE HAS BEEN RUN.
  - given: includeLinks ABSENT, on a model that HAS loaded links
    expect: >
      the same answer as version 1 gave, and linksSearched 0 with the first
      line of linkedMatches reading "Host model only - links not read". The
      switch left out must bind false, not refuse - if the run refuses with
      needs_request_values, the add-in in Revit is older than this change

  - given: includeLinks true on a model with NO links, or with every link unloaded
    expect: >
      linksSearched 0 and "Links asked for, NONE loaded - host only". It must
      NOT read like the absent case: one means there was nothing else to read,
      the other means reload them in Manage Links and ask again

  - given: one linked file placed TWICE, with includeLinks true
    expect: >
      linksSearched 1, not 2 - it counts files, not placements

  - given: includeLinks true WITH a view, on Revit 2020, 2021 or 2022
    expect: >
      "Links NOT read: this Revit cannot read a link through a view" and
      linksSearched 0 - never the whole link reported as if it were the view

second_route:
  - >
    switch to a 3D view, isolate the opening categories in Revit, and count
    what you see

heron-agent: HERON-REVIT-ELE-010
heron-step: 17
heron-status: DRAFT
heron-since: 0.1.0
heron-layer: brain

id: FRG-SEL-025
semantic-identity: "where are the shafts and the holes in the slab"
kind: filter
domain: revit.selection
capability: SELECT_OPENINGS
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Collects the openings cut through the building - shafts, floor openings, wall
  openings, roof openings - as a set to act on. The MEP question behind it is
  always the same: where can this riser go, and is there a hole here already.

  **ONE QUERY MISSES MOST OF THEM, BECAUSE OPENINGS ARE NOT ONE CATEGORY.**
  They are spread across several - a shaft cutting many levels, a hole in a
  slab, a rectangular opening in a wall, one in a roof - and each is its own
  category with its own name. Asking for the obvious one comes back with a
  fraction of what is there and looks like an answer.

  **AN OPENING CUT BY A FAMILY IS NOT AN OPENING ELEMENT.** The hole a door or
  a window makes belongs to that family and appears in none of these
  categories. That is correct - it is the door's hole, not a shaft - and it is
  said here because "show me every hole" means both to a person, and only one
  of them is findable this way.

  **THE BREAKDOWN IS PART OF THE ANSWER.** Twelve shafts is a coordination
  picture; twelve floor openings is a different one. They are counted per kind
  rather than summed.

  ASSUMES NOTHING ABOUT TRANSACTIONS - it opens none and needs none.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as
  version 1 did. With it set, every loaded link is read too and
  `linksSearched` says how many were: set and 0 means "you asked, and none
  are loaded", which is a different answer from host-only. Each link's shafts and slab, wall, roof and
  column openings are counted per link and per kind in `linkedMatches` -
  for MEP coordination they are usually in a link; with a view, through
  that view, which only Revit 2023 and later can do.
  **NOTHING FROM A LINK IS EVER SELECTED OR CARRIED** - `elements` and `byKind` stay this model's own; the chain
  revives ids against this model, and a linked id that happens to be in
  use here binds an unrelated element (FRAGMENT-ISSUES row 75). Links
  nested inside a link are not read, and are counted in the answer. This
  is version 2, and like version 1 it is DRAFT - it has never been proved.

contract:
  needs:
    - name: doc
      type: Document
    # Null means the whole model; a view narrows it to what that view draws.
    - name: inViewOnly
      type: View
      source: request
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: byKind
      # ACCOUNTING, AND THE REASON IS IN THE IMPLEMENTATION RATHER THAN HERE.
      # Every opening category is seeded at zero on purpose - "no shafts at all
      # is a finding on a building with risers in it" - so this dictionary
      # ALWAYS holds exactly 5 entries whatever the model contains. The judge
      # reads an entry COUNT, so as a `result` it reported `5 entry(ies)` in a
      # negative leg that had found nothing, and `select-openings` came back
      # NEG NOT EMPTY on a model with no openings at all (measured 2026-09-13).
      #
      # The VALUES inside it are the finding and are still reported in full;
      # the SHAPE is a constant, and a constant is not evidence of work (D-52).
      # `found` and `elements` beside it are the results that move.
      role: accounting
      type: IDictionary<string, int>
    - name: found
      role: result
      type: int
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then one line per link. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75).
      role: accounting
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. The opening categories are unchanged
  2020 to 2027, and they are collected through a multi-category filter in one
  pass rather than one collector per category - which is both faster and unable
  to return the same opening twice.

# ROUTING - the same rows are in the fragments named here.
#
#   "where are the shafts"               -> here
#   "is there a hole in this slab"       -> here
#   "check the sleeves"                  -> AUDIT_MEP_OPENINGS, which is about
#                                           the sleeves MEP puts in rather than
#                                           the holes the building has
#   "what size should the sleeve be"     -> CHECK_SLEEVE_SIZE
#   "what is in the way"                 -> CHECK_OBSTRUCTIONS
#   "all the ductwork"                   -> SELECT_BY_CATEGORIES

utterances:
  - where are the shafts
  - find the openings in the slab
  - is there a hole here for this riser
  - show me every opening
  - select the wall openings

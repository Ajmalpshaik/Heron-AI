compatibility-note: >
  One implementation for every release. RebarCoupler.Create(Document,
  ElementId, ReinforcementData, ReinforcementData, out RebarCouplerError),
  GetCouplerQuantity; RebarReinforcementData.Create(ElementId, int); the
  RebarCouplerError values ValidationSuccessfuly, IncorrectInputData,
  DifferentLayout, BarsNotTouching, IncorrectEndTreatmentHook,
  IncorrectEndTreatmentCoupler, BarSegementsAreNotParallel and
  BarSegmentsAreNotOnSameLine; Rebar.GetCouplerId(int), NumberOfBarPositions,
  DoesBarExistAtPosition; ReinforcementSettings.RebarShapeDefinesEndTreatments;
  BuiltInCategory.OST_Coupler; FamilySymbol.FamilyName, IsActive and Activate;
  SubTransaction's Start, Commit, RollBack, HasStarted and HasEnded are present
  and unchanged 2020 through 2027. Rebar.GetCenterlineCurves and
  ReinforcementSettings.GetReinforcementSettings renamed a parameter (2026 and
  2022) with the same types, so one positional call serves all eight. Read with
  tools/api-surface --members on 2026-11-01. Ids are compared as ElementId,
  never read as numbers.

# ROUTING (2026-11-01) - the rebar rows are those in every rebar card.
#
#   "put a coupler at the ends of these bars" -> here, both ends capped
#   "join these two bars with a coupler"      -> here, between
#   "add couplers to the top end of the
#    column bars"                             -> here, top - the bars
#                                                selected, not the columns
#   "put 4 T16 and T8 links at 150 in these
#    columns"                                 -> PLACE_COLUMN_REBAR
#   "put bars and stirrups in these beams"    -> PLACE_BEAM_REBAR
#   "what rebar is in these columns"          -> REPORT_HOST_REBAR
#   "make a 16 mm rebar bar type"             -> CREATE_REBAR_BAR_TYPE
utterances:
  - put a coupler at the ends of these bars
  - join these two bars with a coupler
  - add couplers to the top end of the column bars

compatibility-note: >
  One implementation for every release. `CurveElement`, `LocationCurve`,
  `Line.Direction`, `Line.Origin` and `GraphicsStyle` are unchanged 2020 through
  2027. The whole method is arithmetic on XYZ, so nothing here can move with a
  units API.

# IT IS PLAN-BASED. Detail lines are 2D by nature; MODEL lines at different
# heights on the same plan alignment group together, so the height is reported
# per row and has to be read before anything is deleted.

# ROUTING - repeated in FIND_DUPLICATE_ELEMENTS and FIND_OVERLAPPING_TAGS.
#
#   "find the lines drawn on top of each other" -> here
#   "the drawing prints heavy"                  -> here, often
#   "clean up the exploded cad"                 -> here
#   "there are two elements on top of each
#    other"                                     -> FIND_DUPLICATE_ELEMENTS -
#                                                  stacked MODEL elements, not
#                                                  lines
#   "the tags are on top of each other"         -> FIND_OVERLAPPING_TAGS -
#                                                  annotation, measured in paper
#                                                  millimetres
#   "delete the duplicates"                     -> NOTHING HERE DELETES. This
#                                                  reports; DELETE_ELEMENTS is a
#                                                  separate and deliberate step

#   "change all the old line styles to the new ones" -> REMAP_LINE_STYLES - it
#                                        re-points a STYLE across the whole
#                                        model, sketch lines included. This one
#                                        finds lines drawn twice
#   "draw a detail line here"          -> CREATE_LINE - this one only reads
utterances:
  - find the lines drawn on top of each other
  - the drawing prints heavy for no reason
  - clean up the exploded cad
  - find duplicate lines
  - are there lines stacked on each other

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  `Document.LoadFamily(string, out Family)` and `Family.GetFamilySymbolIds()`
  are unchanged 2020 to 2027. No ElementId is built from an int, so 2024's
  64-bit ids do not reach this code.

  **A family saved by a NEWER Revit will not load into an older one**, and no
  version of this fragment can change that - Revit refuses the file itself. The
  refusal below reports it as an unloadable file rather than claiming a defect
  here.

  `Document.LoadFamily(string, IFamilyLoadOptions, out Family)`,
  `IFamilyLoadOptions.OnFamilyFound/OnSharedFamilyFound` and `FamilySource`
  are unchanged 2020 to 2027. `Material.Color`, `Transparency`, `Shininess`,
  `Smoothness` and `AppearanceAssetId` likewise.

# ROUTING - repeated in PLACE_FAMILY_INSTANCES and CHANGE_ELEMENT_TYPE.
#
#   "load a family"              -> here
#   "load this rfa"              -> here
#   "reload the family"          -> here, with reload=true - and confirmed
#                                   first (Constitution Article 7)
#   "place a diffuser"           -> PLACE_FAMILY_INSTANCES - it needs the family
#                                   to be loaded ALREADY, which is what this does
#   "change these to the 300 type" -> CHANGE_ELEMENT_TYPE
#   "which families are unused"  -> FIND_UNUSED_FAMILIES, which reports what
#                                   Revit's Purge Unused would look at and
#                                   deletes nothing
#   "i need that family as an rfa"       -> EXPORT_FAMILIES, the way OUT.
#                                           This one is the way in

utterances:
  - load a family
  - load this rfa
  - bring in the family file
  - load the family into the project
  - import this family
  - reload the family
  - load it again and overwrite
  - reload the nested family into the host family
  - overwrite the existing version of the family

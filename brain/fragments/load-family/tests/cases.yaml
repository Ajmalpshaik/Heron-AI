positive:
  - given: a .rfa file not yet in the project
    expect: >
      the family is loaded, its id in `created`, and every type name listed -
      which is what gets asked for next, since a family with one type and one
      with forty are placed very differently

  - given: >
      a family already in the target, its file edited and SAVED since, with
      reload=true
    expect: >
      reloaded as Revit's "Overwrite the existing version": `reloaded` says
      "version", the edit reads back on the family in the target, `typesKept`
      lists the types that were already there with the TARGET's values kept,
      `typesAdded` any the file brought new, and every material the load moved
      is in `materialsChanged` as "Name: before -> after"

  - given: the same, with reload=true and overwriteValues=true
    expect: >
      `reloaded` says "version and values", and the types' parameter values
      read back as the FILE's, not the target's

  - given: a nested family's saved .rfa, loaded into the open HOST family with reload=true
    expect: >
      the nested copy in the host family is replaced - a family document is
      a target like a project, and a shared nested family takes the file's
      version (FamilySource.Family)

negative:
  - given: a family of the same name already in the target, with reload left off
    expect: >
      REFUSED by name, saying reload=true would overwrite it. Reloading is
      never assumed: Constitution Article 7 lists family reloads among the
      operations that need explicit confirmation, and overwriting silently is
      how a colleague's edited type is replaced mid-job, values and all

  - given: overwriteValues=true without reload=true
    expect: refused, saying reload=true is needed as well - the stronger answer is never inferred

  - given: reload=true on a family whose file is the same version as the one loaded
    expect: >
      refused, saying there was nothing to overwrite and that an edited family
      must be SAVED first - Revit never reached its Family Already Exists
      question

  - given: a path that does not exist
    expect: >
      refused, naming the path. LoadFamily returns a bare `false` for a missing
      file AND for an already-loaded family, and those two need opposite
      responses - so the file is checked separately

  - given: a .rvt or a .rft path
    expect: refused, saying what each of those actually is - a project is linked, a template is what a family is built from

  - given: a family saved by a newer Revit
    expect: >
      refused. Revit itself rejects the file and no version of this fragment can
      change that, so it is reported as an unloadable file rather than as a
      defect here

second_route:
  - Revit's own Insert > Load Family with the same file, and the Project Browser's Families branch checked
  - for a reload, Insert > Load Family > Overwrite the existing version, and the edited value read in Family Types

# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: one straight duct and a volume damper symbol, positionAlong 0.5
    expect: >
      TWO ducts afterwards where there was one, the damper between them, and
      both its connectors joined. Count the ducts before and after - if the
      count did not change, the run was never broken and the damper is sitting
      loose on top of it

  - given: a pipe and a valve
    expect: >
      the same, through the pipe's own break utility. Ducts and pipes have
      separate calls and no shared one

  - given: the system traced afterwards
    expect: >
      it running THROUGH the accessory, end to end. A damper that is placed but
      not connected leaves the system severed while looking finished

  - given: >
      version 2, Revit 2020 - ONE LONE rectangular duct drawn by CREATE_MEP_RUNS
      (CREATE_DUCT and CREATE_PIPE were retired 2026-11-01, row 5b-1973) along Y (not the family's own X), nothing joined at either end, and
      M_Balancing Damper - Rectangular, positionAlong 0.5 (row 5b-1119)
    expect: >
      placed 1, leftSevered 0, notTurned 0, and NO "opposite direction" error:
      two ducts, the damper turned along the run between them, both its ends
      joined. Then the same on a lone pipe with M_Gate Valve, and on a duct
      drawn along X - and once more on a run joined at both ends, the case
      version 1 was proved on

  - given: positionAlong 0.25
    expect: >
      the accessory a quarter of the way along, and the two halves in that
      proportion

# WHICH CASE IS THE D-30 LEG THAT READS EMPTY (row 5b-1968, #1242): `placed`
# is this card's real answer, and it lists the accessory whether or not both
# ends joined (a placed accessory that joined nothing is ALSO in
# `leftSevered`). So a case where Revit does place the accessory - the riser
# below - can never leave `placed` empty, and a batch reads it NEG NOT EMPTY.
# The negative a batch can judge is the one where nothing is a run, so nothing
# is broken and nothing placed: the fitting and the air terminal. The riser
# and the cases that place something stay negatives for what they say in
# words, judged by eye.
negative:
  - given: a fitting or an air terminal in the set
    expect: >
      THE D-30 NEGATIVE, the one a batch can judge: its id in `notARun`,
      `placed` empty and `leftSevered` empty, nothing broken. Only a duct or a
      pipe can be broken

  - given: a vertical duct (a riser) and a damper
    expect: >
      NOT an empty leg - Revit may place the accessory on it, and then `placed`
      names it. Its run named in notTurned - a vertical run is not turned in
      plan - and whatever Revit did with the joins reported in placed or
      leftSevered, never a silent success. Judged by eye

  - given: the accessory hosted on the run instead of breaking it first
    expect: >
      NOT what this does. That call looks like the Revit command, changes no
      duct count, leaves the accessory hostless with neither connector joined,
      and reports success - which is the defect this fragment was rewritten to
      avoid

  - given: a break that succeeds and a placement that fails
    expect: >
      both half ids in `leftSevered`. The break does not join the halves to
      each other, so the run is now in two pieces and somebody has to know

  - given: an accessory whose connectors do not reach either half
    expect: >
      it in `placed` AND the run in `leftSevered`. Placed is not connected, and
      reporting only the placement would read as done

  - given: a symbol never used this session
    expect: >
      it activated first. Without that the first placement throws, and it reads
      as the family being wrong

second_route:
  - >
    select the accessory in Revit and drag it a little - a connected accessory
    drags the ducts with it. Then undo once: one undo must put the whole run
    back

positive:
  - given: >
      a new scratch family from the metric Generic Model template on Revit
      2020, with one solid box built first - CREATE_FAMILY_FORMS
      "kind=extrusion workPlane=Ref. Level profile=rect -300,-150 300,150
      startMm=0 endMm=600 solid=true" - so its front face is at Y -150;
      texts 'text="FIRE ALARM" workPlane=Center (Front/Back) at=0,400
      heightMm=40 depthMm=2 align=center offsetMm=-150'
    expect: >
      textCount 1, textIds one id; placed names "FIRE ALARM" on "Center
      (Front/Back)" at X 0, Z 400, a type of 40 mm, 2 mm deep, aligned
      center, read from the front, running +X (right) and up +Z, on a work
      plane of its own (offsetMm moved it), its letters reaching Y -150 to
      -152 or -148 - WHICH of the two is the measurement; the Front
      elevation in the Family Editor shows FIRE ALARM reading left to right,
      not mirrored, centred on the box at 400 mm

  - given: >
      the same family; texts two rows, 'text="L1 L2 L3" workPlane=Ref. Level
      at=-200,0 heightMm=25 depthMm=1 offsetMm=600' and 'text=400 V
      workPlane=Center (Left/Right) at=0,300 heightMm=25 depthMm=1
      readFrom=right offsetMm=300 material=by category detailLevels=medium,
      fine'
    expect: >
      textCount 2 in ONE undo entry; ONE Model Text type of 25 mm used by
      both (made once as "25 mm" if the family had none of that size, and
      named in findings); the first reads from the top on the box's top at
      Z 600, the second from the right on its right face at X 300, shown at
      medium and fine only

  - given: >
      VERSION 2, row 5b-1315 - the case seen on Revit 2020 (session 40628):
      a scratch Generic Model family with a box whose front face is at
      Y -2560; texts 'text=1 workPlane=Center (Front/Back) at=-650,510
      heightMm=100 depthMm=3 align=center offsetMm=-2560'
    expect: >
      placed reads "1" on "Center (Front/Back)", offset -2560 mm, aligned
      center, and its letters reach Y -2560 to -2563 (version 1 read Y -5120
      to -5123 - the offset twice) and are centred on X -650 - their X extent
      runs about equally either side of -650, not from -650 (version 1: X
      -650 to -542.32); findings say whether Revit's first placing missed
      and by how much - THAT LINE IS THE MEASUREMENT of how Revit reads the
      point, to be copied into the run record; the Front elevation shows the
      1 on the box's face, centred where asked

  - given: >
      the same family; texts 'text=PANEL workPlane=Center (Front/Back)
      at=0,400 heightMm=40 depthMm=2 align=right' - no offset, on the named
      plane itself
    expect: >
      sketched on the plane itself, its letters' right end at X 0 (their X
      extent ends at 0 within a millimetre), Y 0 to -2

  - given: >
      VERSION 3, row 5b-2033 - the case seen on Revit 2020 on 2026-11-24: a
      scratch Generic Model family with a reference plane "Panel Face" facing
      front at Y -489.5 and a box whose front face lies on it; texts
      'text=AHU-01 workPlane=Panel Face at=0,300 heightMm=40 depthMm=0.5'
      and then, in a second call, 'text=AHU-01 workPlane=Center (Front/Back)
      at=0,300 heightMm=40 depthMm=0.5 offsetMm=-489.5'
    expect: >
      each placed, "measured on its solids", its letters reaching Y -489.5
      to -490 (or -489 to -489.5 - which side is the measurement); no "are
      ... mm thick" refusal. If a finding says "Revit's bounding box for the
      text reaches ... mm through the plane ... so the box is not the
      letters", COPY IT into the run record: it says version 2's 494.5 mm was
      the box, not the letters. Then Revit's Measure tool in a plan view
      across one letter, and the Front elevation, show the letters 0.5 mm
      deep on the box face - the second route for this case
  - given: >
      the same family, a reference plane at Y -697.5; texts 'text=FAN
      workPlane=<that plane> at=0,300 heightMm=40 depthMm=0.5'
    expect: >
      as above - letters Y -697.5 to -698, not to -1398 as version 2 said

negative:
  - given: >
      the same family; texts 'text=PANEL workPlane=Center (Front Back)
      at=0,400 heightMm=40 depthMm=2' - a plane name the family does not
      have
    expect: >
      refused naming row 1 and listing the family's planes and levels;
      textCount 0, nothing placed, and no Model Text type made

  - given: >
      the same family; texts 'text=PANEL workPlane=Ref. Level at=0,0
      heightMm=40 depthMm=2 readFrom=front'
    expect: refused - a horizontal plane is read from top or bottom - and nothing placed

  - given: texts two rows, the second with heightMm 0
    expect: refused naming row 2, and neither text placed

  - given: a project in front
    expect: notAFamily true, the refusal naming CREATE_TEXT_NOTE, and nothing placed anywhere

  - given: >
      VERSION 3. If on Revit 2020 the letters' solids themselves are deeper
      than asked on a plane away from the origin - the first case above
      refused "Row 1's letters are ... mm thick through the plane, measured
      on their own solids"
    expect: >
      textCount 0, NOTHING placed, the refusal naming the depth asked, the
      Depth Revit reads and where the letters reached - never letters half a
      metre deep kept with a warning. Then this card's depth is the defect
      and row 5b-2033 is reopened for it
  - given: >
      VERSION 3, the negative that checks the measure itself: texts
      'text=AHU-01 workPlane=Center (Front/Back) at=0,300 heightMm=40
      depthMm=2' (a plane at the origin, where version 2's box and the
      solids agree)
    expect: >
      placed, letters Y 0 to -2 measured on the solids, NO bounding-box
      finding - a box finding here would mean the solids are measured wrong

second_route:
  - >
      In the Family Editor: the Front and Right elevations and the Ref. Level
      plan, each text selected to read Text, Type, Depth, Horizontal Align and
      Material in Properties, and the type's Text Size in Edit Type; Revit's
      own Model Text button then places the same words on the same face by
      hand, and the two are compared side by side - which way they read and
      where they stand

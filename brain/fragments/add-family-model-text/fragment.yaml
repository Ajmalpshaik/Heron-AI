compatibility-note: >
  `FamilyItemFactory.NewModelText(string, ModelTextType, SketchPlane, XYZ,
  HorizontalAlign, double)` has one signature 2020 to 2027, and so do
  `ModelText.Text`, `Depth`, `HorizontalAlignment`, `ModelTextType`,
  `GetVisibility` and `SetVisibility`, `ElementType.Duplicate(string)`, the
  `HorizontalAlign` values Left, Center and Right, and the built-in
  parameters MODEL_TEXT_SIZE (-1006336), TEXT_FONT and MATERIAL_ID_PARAM
  (tools/api-surface --members, read 2026-10-12 off all eight releases).
  `SketchPlane.Create(Document, ElementId)` and `(Document, Plane)`,
  `Plane.CreateByOriginAndBasis` and the material parameter's kind read by
  reflection are the calls CREATE_FAMILY_FORMS and SET_FAMILY_FORM_MATERIAL
  already make on every release. Not yet run in Revit: which way Revit lays
  the letters on a sketch plane (along its X, up its Y, standing out along
  its normal is what the code assumes and the answer reports), whether `at`
  is the start, middle or end of the baseline per alignment, whether the
  metric templates hold a Model Text type, and that model text takes
  MATERIAL_ID_PARAM - NEEDS-CHECKING Group DC.

# ROUTING - see SET_FAMILY_CATEGORY for the whole family-building table.
#
#   "add text to the family"                     -> here, 3D model text
#   "write a label on the panel"                 -> here, inside a family; in a
#                                                   project view a 2D note is
#                                                   CREATE_TEXT_NOTE
#   "put a text note in this view"               -> CREATE_TEXT_NOTE - 2D, a
#                                                   project view
#   "draw the valve symbol in plan"              -> DRAW_FAMILY_SYMBOLIC_LINES -
#                                                   2D lines, no 3D body
#   "set the material of the lettering"          -> SET_FAMILY_FORM_MATERIAL is
#                                                   for FORMS; model text takes
#                                                   material= here, as it is placed

utterances:
  - add model text to a family
  - add text to the family
  - write a label on the panel

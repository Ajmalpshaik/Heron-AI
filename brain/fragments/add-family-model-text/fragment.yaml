capability: ADD_FAMILY_MODEL_TEXT
# Version 3 (2026-11-24, row 5b-2033) changed impl/: THE LETTERS ARE MEASURED
# BY THEIR OWN SOLIDS. Seen on Revit 2020 building an air handling unit
# family: depthMm=0.5 on a front-back plane at Y -489.5 - a reference plane
# there, or Center (Front/Back) with offsetMm=-489.5 - answered "the letters
# measure 494.5 mm through the plane where 0.5 mm deep was asked", reaching Y
# -984 to -489.5; at Y -697.5 they reached -1398. The far side grew with the
# plane's distance from the origin, to about twice it - where Revit 2020 first
# puts letters on an offset plane - while the text's Depth read back 0.5.
# Version 2 read that thickness, and where the letters land, off the element's
# bounding box, so whether the letters or only the box were that deep could
# not be told from the answer. Version 3 measures both on the letters' own
# solids (the box only where Revit gives none, and then says so): solids not
# the depth asked are refused with both numbers - the depth Revit built is
# wrong, not the measure - and a box that disagrees with right solids is said
# to be the box. Which of the two it was on Revit 2020 is settled by
# NEEDS-CHECKING Group QP; this was written with no Revit. Version 2 was
# PROVEN (the proof block below, kept as the record of what it proved); its
# C# moved, so it is DRAFT again (D-30).
#
# Version 2 (2026-10-22, row 5b-1315) changed impl/: where the letters land is
# MEASURED, not trusted. Seen on Revit 2020 (session 40628): a text on
# Center (Front/Back) with offsetMm=-2560 came out at Y -5123 to -5120 - the
# offset twice - and align=center at=-650,510 ran X -650 to -542.32, as if
# aligned left; version 1's answer printed both and kept them. Version 2
# measures each text once placed - its left end, centre or right end along
# the text, its foot against the baseline, its back against the plane -
# places one that missed again moved by the miss, and refuses the whole call
# when it still misses. Version 1's proof below no longer described the code:
# DRAFT at the time, until NEEDS-CHECKING Group IQ proves version 2 (D-30).
version: 3
source: OFFICIAL
risk: MODIFY

purpose: >
  Places MODEL TEXT in the family open in the Family Editor - the Family
  Editor's Model Text button, typed rather than clicked: a nameplate on a
  panel, a raised or engraved label, a legend. Real 3D lettering that shows
  in 3D and elevation and stays editable as text afterwards. One or many
  texts in one call, ONE entry in the undo list.

  **EACH ROW STARTS `text=`** and gives `workPlane` (a reference plane or
  level by name - "Center (Front/Back)", "Ref. Level"), `at` (where),
  `heightMm` (the letters' height) and `depthMm` (how far they stand out).
  Optional: `align` (left, center, right - left is Revit's own default),
  `readFrom`, `offsetMm`, `material`, `detailLevels` and `views`. A text
  holding "=" goes in double quotes. A long list may be a file under
  %TEMP%\heron-work, its full path given instead, read as
  CREATE_FAMILY_FORMS reads its file.

  **`at` IS IN THE PLANE'S OWN TWO MODEL COORDINATES, MILLIMETRES FROM THE
  FAMILY ORIGIN**, the way the form tools write a profile: on a level or a
  horizontal plane X,Y as seen in plan; on a plane facing front or back -
  Center (Front/Back) - X,Z; on a plane facing left or right - Center
  (Left/Right) - Y,Z. Never relative to the plane and never mirrored by the
  way it faces. `offsetMm` moves the text off the plane along the axis it
  faces, positive up (+Z), back (+Y) or right (+X) - onto a box's front face
  with no plane of its own there.

  **`readFrom` IS THE SIDE THE TEXT READS CORRECTLY FROM** - top or bottom on
  a horizontal plane, front or back on a front-back one, left or right on a
  left-right one; by default top, front and right, the Family Editor's own
  views. The text stays on the named plane itself when that plane's own axes
  already read from that side and no offset is given; otherwise it is put on
  a work plane of its own at the same place, which does NOT follow the named
  plane when it moves, and the answer says so.

  **THE HEIGHT IS A TYPE.** A Model Text type of exactly that size is used
  when the family has one; otherwise the first type by name is copied as
  "<height> mm" - "40 mm", "2.5 mm" - keeping its font. A family holding no
  Model Text type at all is refused.

  **WHERE THE LETTERS LAND IS MEASURED.** Once placed, each text's left
  end, centre or right end (by `align`) is measured against `at` along the
  text, its foot against the baseline and its back against the plane plus
  `offsetMm`. Revit 2020 put an offset text at twice its offset and started
  a centred one at `at`, so a text that missed by more than half a
  millimetre is placed again moved by the miss, and the answer says so; one
  that still misses refuses the whole call, naming where it was asked and
  where it reached.

  **MEASURED ON THE LETTERS THEMSELVES (version 3, row 5b-2033).** Where the
  letters land, how far they reach and how deep they are come from the
  letters' own solids, not Revit's bounding box for the text - on Revit 2020
  the box of a text on a plane away from the origin reached about twice the
  plane's distance while the text's Depth read as asked. Letters whose
  solids are not the depth asked keep nothing of the list; where only the
  box disagrees, the answer says the box is not the letters. With no solid
  to measure the box is used and the answer says so.

  **ALL OR NOTHING, READ BACK.** Every row is checked before anything is
  placed. Each text is read back - its words, type and size, depth,
  alignment, any material or visibility - with where its letters reach on
  all three axes and which way it runs; one that reads back wrong keeps
  nothing of the whole list.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The texts, ONE ROW EACH, each row starting text= and running to the
    # next text=; fields are name=value, each running to the next field's
    # name. Needed: text=, workPlane=, at=U,V (mm, the plane's own two model
    # coordinates), heightMm=, depthMm=. Optional: align= (left, center,
    # right), readFrom= (top, bottom, front, back, left, right), offsetMm=,
    # material= (a family material parameter, a material in the family, or
    # "by category"), detailLevels= and views= as SET_FAMILY_FORM_VISIBILITY
    # takes them. E.g. 'text="FIRE ALARM CONTROL PANEL" workPlane=Center
    # (Front/Back) at=0,1200 heightMm=40 depthMm=2 align=center
    # offsetMm=-150'. OR the full path of a text file in the temporary
    # folder (%TEMP%\heron-work\...) holding the rows, lines starting #
    # ignored.
    - name: texts
      type: string
      source: request
  provides:
    - name: textIds
      # Every new text's unique id, in the order listed, commas between.
      role: result
      type: string
    - name: textCount
      # How many texts were placed - every row, or none.
      role: result
      type: int
    - name: placed
      # Each text as Revit now holds it, || between: its words and id, the
      # plane and where on it, type and size, depth, alignment, the side it
      # reads from and which way it runs, whether it sits on the named plane
      # or a work plane of its own, material, visibility, and where its
      # letters reach on X, Y and Z in millimetres - measured where asked, and
      # whether it had to be placed a second time (version 2).
      role: result
      type: string
    - name: notAFamily
      # That the document in front is a project, not a family being edited.
      role: accounting
      type: bool
    - name: refused
      # Why nothing was placed, every problem named with its row. Empty when
      # the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


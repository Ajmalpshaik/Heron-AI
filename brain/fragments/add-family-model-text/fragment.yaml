compatibility-note: >
  `FamilyItemFactory.NewModelText(string, ModelTextType, SketchPlane, XYZ,
  HorizontalAlign, double)` has one signature 2020 to 2027, and so do
  `ModelText.Text`, `Depth`, `HorizontalAlignment`, `ModelTextType`,
  `GetVisibility` and `SetVisibility`, `ElementType.Duplicate(string)`, the
  `HorizontalAlign` values Left, Center and Right, and the built-in
  parameters MODEL_TEXT_SIZE (-1006336), TEXT_FONT and MATERIAL_ID_PARAM
  (tools/api-surface --members, read 2026-10-12 off all eight releases).
  `SketchPlane.Create(Document, ElementId)` and `(Document, Plane)`,
  `Plane.CreateByOriginAndBasis` and the material parameter's kind read by
  reflection are the calls CREATE_FAMILY_FORMS and SET_FAMILY_FORM_MATERIAL
  already make on every release. Not yet run in Revit when this was first
  written: which way Revit lays the letters on a sketch plane (along its X,
  up its Y, standing out along its normal is what the code assumes and the
  answer reports), whether `at` is the start, middle or end of the baseline
  per alignment, whether the metric templates hold a Model Text type, and
  that model text takes MATERIAL_ID_PARAM - NEEDS-CHECKING Group DC. Seen on
  Revit 2020 and fixed by measuring in version 2 (row 5b-1315): the point
  given is not simply where the letters go - on a work plane offset from the
  named one they went to twice the offset, and a centred text started at the
  point. Which reading Revit makes is not known, and version 2 does not
  assume one; it places again by the measured miss. `Document.Delete`,
  `Element.IsValidObject`, `XYZ.CrossProduct` and `DotProduct` are the same
  2020 to 2027. NEEDS-CHECKING Group IQ. Version 3 adds
  `Element.get_Geometry(Options)` with `Options.DetailLevel`, `Solid.Volume`,
  `Solid.Edges`, `Edge.Tessellate` and `GeometryInstance.GetInstanceGeometry`,
  calls ADD_FAMILY_CONNECTOR already makes on every release; built against
  all eight releases on 2026-11-24 (`tools/check-fragments-compile.py`).
  NEEDS-CHECKING Group QP.

# ROUTING - see SET_FAMILY_SETTINGS for the whole family-building table.
#
#   "add text to the family"                     -> here, 3D model text
#   "write a label on the panel"                 -> here, inside a family; in a
#                                                   project view a 2D note is
#                                                   CREATE_TEXT_NOTE
#   "put a text note in this view"               -> CREATE_TEXT_NOTE - 2D, a
#                                                   project view
#   "draw the valve symbol in plan"              -> DRAW_FAMILY_SYMBOLIC_LINES -
#                                                   2D lines, no 3D body
#   "set the material of the lettering"          -> LINK_FAMILY_PARAMETER is
#                                                   for FORMS; model text takes
#                                                   material= here, as it is placed
#   "change the label text height to 5 mm"       -> SET_TEXT_TYPE - a label's or
#                                                   a text note's TYPE (2D);
#                                                   model text is sized here

utterances:
  - add model text to a family
  - add text to the family
  - write a label on the panel

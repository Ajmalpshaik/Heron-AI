id: FRG-SEL-024
semantic-identity: "all the ductwork - the ducts, the fittings, the accessories and the flex"
kind: filter
domain: revit.selection
capability: SELECT_BY_CATEGORIES
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Collects several categories into one set in a single pass. What somebody
  means by *"the ductwork"* is five Revit categories - ducts, fittings,
  accessories, flex duct and the insulation on them - and by *"the pipework"*,
  five more. One category is almost never the whole answer.

  **ONE COLLECTOR, NOT ONE PER CATEGORY.** Running a separate collector for
  each category walks the document that many times and then needs the results
  de-duplicated by hand. A multi-category filter asks once, which is both
  faster and the only version that cannot return the same element twice.

  **IT REPORTS THE BREAKDOWN, WHICH IS WHERE THE MISTAKE SHOWS.** A total of
  480 says nothing about whether the flex duct was included; 300 ducts, 150
  fittings, 30 accessories and no flex says the model has no flex duct or the
  category was left out of the list. One of those is worth knowing before a
  takeoff goes out.

  **A CATEGORY WITH NOTHING IN IT IS REPORTED AS ZERO, NOT LEFT OUT.** The
  absence is the finding: a duct system with no accessories is either a model
  with no dampers in it yet, or a filter that missed them.

  ASSUMES NOTHING ABOUT TRANSACTIONS - it opens none and needs none.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, every loaded link is read too and
  `linksSearched` says how many were: set and 0 means "you asked, and none
  are loaded", which is a different answer from host-only. Linked matches are counted per link in
  `linkedMatches` with the same per-category breakdown; with a view,
  through that view, which only Revit 2023 and later can do.
  **NOTHING FROM A LINK IS EVER SELECTED OR CARRIED** - `elements` stays this model's own; the chain
  revives ids against this model, and a linked id that happens to be in
  use here binds an unrelated element (FRAGMENT-ISSUES row 75). Links
  nested inside a link are not read, and are counted in the answer. This
  is version 2; version 1's proof no longer describes the code, and the
  fragment is DRAFT until it is proved again.

contract:
  needs:
    - name: doc
      type: Document
    - name: categories
      type: IList<BuiltInCategory>
      source: request
    # Null means the whole model; a view narrows it to what that view draws.
    - name: inViewOnly
      type: View
      source: request
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: perCategory
      # One entry per category ASKED FOR, with what each contributed. Its
      # length mirrors the request, so it can never be zero when a category
      # was named - the counts inside are the answer, not the entry count.
      role: accounting
      type: IDictionary<string, int>
    - name: found
      role: result
      type: int
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then one line per link. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75).
      role: accounting
      type: IList<string>


# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: ducts, duct fittings, duct accessories and flex duct asked for together
    expect: >
      one set holding all four, and `perCategory` breaking it down. Compare each
      number against a Revit schedule of that category - they must agree

  - given: a view passed in
    expect: >
      only what that view draws. A plan of one floor must not return the whole
      building

  - given: the same category listed twice
    expect: >
      every element once. One filter cannot return a duplicate; a collector per
      category can, which is the reason for this shape

  # D-59, added 2026-09-28 with version 2. NOT RUN.
  - given: >
      categories Doors and Walls, includeLinks true, on
      Snowdon-scratch_ajmal.al
    expect: >
      `elements` and `perCategory` unchanged from the
      host-only run, and each link's count and per-category breakdown in
      `linkedMatches`

negative:
  - given: a category asked for that has nothing in the model
    expect: >
      it present in `perCategory` with 0, not absent. Absent reads as "not
      asked for", and the difference is whether somebody goes looking for
      missing dampers

  - given: an empty category list
    expect: >
      no elements and no throw. Nothing asked for is not an error, and it must
      not fall through to "everything"

  - given: a view that draws none of the categories
    expect: >
      an empty set with the breakdown still listing each category at 0

  - given: a set spanning categories whose names differ from the enum names
    expect: >
      the breakdown keyed by Revit's own category NAME, which is what the
      person reading it uses

  # D-59, added 2026-09-28 with version 2. NONE OF THESE HAS BEEN RUN.
  - given: includeLinks ABSENT, on a model that HAS loaded links
    expect: >
      the same answer as version 1's proof, and linksSearched 0 with the first
      line of linkedMatches reading "Host model only - links not read". The
      switch left out must bind false, not refuse - if the run refuses with
      needs_request_values, the add-in in Revit is older than this change

  - given: includeLinks true on a model with NO links, or with every link unloaded
    expect: >
      linksSearched 0 and "Links asked for, NONE loaded - host only". It must
      NOT read like the absent case: one means there was nothing else to read,
      the other means reload them in Manage Links and ask again

  - given: one linked file placed TWICE, with includeLinks true
    expect: >
      linksSearched 1, not 2 - it counts files, not placements

  - given: includeLinks true WITH a view, on Revit 2020, 2021 or 2022
    expect: >
      "Links NOT read: this Revit cannot read a link through a view" and
      linksSearched 0 - never the whole link reported as if it were the view

second_route:
  - >
    build a Revit schedule per category, or use the project browser's category
    counts, and compare. Revit's own numbers are the second route

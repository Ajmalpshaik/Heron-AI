id: FRG-ELE-017
semantic-identity: "reassign these to a different level without moving them"
kind: action
domain: revit.elements
capability: SET_ELEMENT_LEVEL
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Moves elements onto a different level **while keeping them physically where
  they are** — the coordination fix for services modelled against the wrong
  level, which is common and invisible until somebody schedules by level.

  **This is the fragment with the trap in it, and the trap is the whole
  point.** An element's height is stored as an OFFSET from its level. Change
  the level and leave the offset, and the element JUMPS by the difference
  between the two levels — a duct at 2800 above Level 1 becomes a duct 2800
  above Level 2, three metres higher, silently. So the offset is recomputed so
  the absolute height is unchanged.

  **The absolute height is read before and verified after**, because a
  recomputation that is merely written is not one that took.

  **WALLS TOO, BOTH ENDS** (version 2, when SET_WALL_CONSTRAINTS was merged
  in). A wall's base goes to the level given, its base offset re-solved so the
  wall does not move; its top goes to `topLevelId` when one is named, its top
  offset re-solved the same way. `keepWallBase` leaves every wall's base alone,
  so the tops can be tied on their own. A wall whose top is UNCONNECTED has no
  top level - giving it one is a design change, so it is named in
  `unconnectedTop` and skipped unless `allowUnconnectedToBecomeBound` says so.
  A top level id that is not a level refuses the whole call, and what is not a
  wall is named in `notAWall`. A write that fails part-way is put back, never
  left half-set. This is version 2; version 1's proof no longer describes the
  code and is kept as a record, and the fragment is DRAFT until it is proved
  again.

  **Reassigning and moving are opposite intentions said the same way.** *"Put
  these on Level 2"* can mean re-label them or physically raise them.
  `MOVE_ELEMENTS` and `ALIGN_MEP_ELEVATION` are the ones that move; this one
  deliberately does not.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # The level every element is moved to - and, for a WALL, its BASE level
    # unless keepWallBase is set.
    - name: newLevel
      type: Level
      source: request
    # Version 2, from SET_WALL_CONSTRAINTS. A WALL'S TOP level, its top offset
    # re-solved so the wall does not move. Left out, or none, leaves every
    # wall's top alone. Applies to walls only. A level name is looked up as a
    # level; an id that is not a level refuses the whole call.
    - name: topLevelId
      type: ElementId
      source: request
      optional: true
      absent: none
    # Version 2. True leaves every wall's BASE as it is, so a call can tie the
    # tops alone - on walls whose bases differ, which one `newLevel` cannot
    # say. Then whatever is not a wall is left alone too, and named in
    # `notAWall`. Left out, false.
    #
    # WHY A SWITCH AND NOT A SEPARATE BASE LEVEL: an optional id left out and
    # one given as none bind to the same value, so a `baseLevelId` could not
    # tell "leave the base alone" from "nothing said" - and `newLevel` is the
    # base already, for every caller of version 1.
    - name: keepWallBase
      type: bool
      source: request
      optional: true
    # Version 2, from SET_WALL_CONSTRAINTS. A wall whose top is UNCONNECTED is
    # skipped and named in `unconnectedTop` unless this is true - giving it a
    # top level is a design change, not a re-host. Left out, false.
    - name: allowUnconnectedToBecomeBound
      type: bool
      source: request
      optional: true
  provides:
    - name: moved
      role: result
      type: int
    - name: alreadyThere
      # Elements that were ALREADY in the state asked for, so there was
      # nothing to do. The evidence it looked, never a change it made
      # (D-52).
      role: accounting
      type: int
    - name: heightChanged
      # Elements whose ABSOLUTE height moved despite the offset being
      # recomputed. THIS IS THE FRAGMENT WITH THE TRAP IN IT AND THE TRAP IS
      # THE WHOLE POINT - height is stored as an offset from the level, so
      # changing the level alone moves the element.
      role: result
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52). Since version 2 an element here
      # was left as it was: a write that failed part-way is put back.
      role: accounting
      type: IList<ElementId>
    - name: unconnectedTop
      # Version 2, from SET_WALL_CONSTRAINTS. Walls whose top is unconnected,
      # so giving them a top level would be a design change rather than a
      # re-host. NAMED AND SKIPPED unless the caller says otherwise (D-52).
      role: accounting
      type: IList<ElementId>
    - name: notAWall
      # Version 2. Handed in but not walls, while a top level was asked for or
      # the walls' base kept - the wall part did not apply to them. A count of
      # what it was GIVEN, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: notApplicable
      # Version 2. The sentence saying what `notAWall` meant for those
      # elements - moved to the level like anything else, or left alone.
      # Null when there were none (D-52).
      role: accounting
      type: string
    - name: problem
      # Version 2. The sentence saying what stopped the whole call - a top
      # level id that is not a level - or that walls were left alone because
      # nothing was asked of them. Null when nothing did (D-52).
      role: accounting
      type: string


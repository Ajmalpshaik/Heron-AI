compatibility-note: >
  One implementation for every release. The `RBS_START_LEVEL_PARAM`,
  `FAMILY_LEVEL_PARAM`, `SCHEDULE_LEVEL_PARAM`, `RBS_OFFSET_PARAM` and
  `INSTANCE_FREE_HOST_OFFSET_PARAM` built-in parameters and `Level.Elevation`
  are unchanged 2020 to 2027, and so are the wall's `WALL_BASE_CONSTRAINT`,
  `WALL_BASE_OFFSET`, `WALL_HEIGHT_TYPE`, `WALL_TOP_OFFSET` and
  `WALL_USER_HEIGHT_PARAM` (version 2), reached by BuiltInParameter rather
  than by name so nothing depends on Revit's language. Levels are compared as
  ElementId against ElementId, never as numbers. Everything here is a ratio or a difference of two
  internal lengths, so no unit conversion is involved at all.

# ROUTING - repeated in READ_ELEMENT_LEVEL and MOVE_ELEMENTS.
#
#   "what level is this on"          -> READ_ELEMENT_LEVEL
#   "put these on Level 2"           -> ASK WHICH. Re-label without moving is
#                                       here; physically raise them is
#                                       MOVE_ELEMENTS or ALIGN_MEP_ELEVATION
#   "move them up 200"               -> MOVE_ELEMENTS
#   "they are on the wrong level"    -> here, almost always - the geometry is
#                                       right and the data is wrong
#   "filter the SCHEDULE to level 2" -> SET_SCHEDULE_FILTERS. NOT HERE. That
#                                       sentence resolved to this fragment
#                                       until 2026-09-04 - a request to hide
#                                       rows in a table, answered by the
#                                       fragment that MOVES DUCTS TO ANOTHER
#                                       LEVEL. Measured, not hypothetical
#   "sort the schedule by level"     -> SET_SCHEDULE_SORT_GROUP
#
# THE SENTENCE DOES NOT SAY WHICH, and the two produce models that differ by a
# whole storey.

# ROUTING - repeated in LIST_LEVELS, READ_ELEMENT_LEVEL and CREATE_LEVELS.
#
#   "move these to level 3"     -> here - reassigns EXISTING elements
#   "it is on the wrong level"  -> here
#   "add a level"               -> CREATE_LEVELS - this fragment creates none
#   "list the levels"           -> LIST_LEVELS
#   "what level is this on"     -> READ_ELEMENT_LEVEL

# VERSION 2 (2026-11-01) - SET_WALL_CONSTRAINTS WAS MERGED INTO THIS CARD on
# the owner's instruction ("now merge the other duplicates also"), and is
# DEPRECATED. The same job - put things on another level without them moving,
# the offset re-solved and the height measured again afterwards - and this card
# already did it for MEP and family instances. What SET_WALL_CONSTRAINTS had is
# here now: a wall's base and its top, each re-solved; unconnected tops named in
# `unconnectedTop` and skipped unless `allowUnconnectedToBecomeBound`; the top
# constraint put back when its offset will not take; a level id that is not a
# level refusing all; and what is not a wall named, in `notAWall`. Its
# `baseLevelId` is this card's `newLevel` (with `keepWallBase` for "leave the
# base"), its `topLevelId` is `topLevelId`, its `rehosted` count is in `moved`,
# and its `elevationChanged` is `heightChanged`.
#
# A DEFECT BOTH CARDS HAD, FIXED HERE because it sat inside the code this
# version changes: a level written and then an offset Revit threw on was left
# as it was, the element moved by the difference between the levels and only
# reported as refused. Now every value is read before it is written and put
# back on a failure; an element that still ends up elsewhere is in
# `heightChanged` as well as `refused`.

# ROUTING (from SET_WALL_CONSTRAINTS, 2026-11-01) - the wall rows.
#
#   "put these walls on level 3"         -> here, without the walls moving
#   "the walls are attached to the       -> here
#    wrong level"
#   "change the walls' base level"       -> here
#   "tie the wall tops to the level above" -> here, topLevelId, and
#                                           allowUnconnectedToBecomeBound for
#                                           walls drawn at a typed height
#   "make the walls taller"              -> a height change, not a re-host:
#                                           WRITE_ELEMENT_PARAMETERS on the
#                                           height parameter
#   "build a wall here"                  -> CREATE_WALL
#   "the corners are cleaning up wrong"  -> DISALLOW_JOIN
#   "attach these walls to the roof"     -> ATTACH_WALLS (2025 on)
#   "what is attached to this element"   -> REPORT_ELEMENT_DEPENDENCIES
#   "which level are these walls on"     -> READ_ELEMENT_PARAMETERS, Level. A
#                                           question, and this one changes it
#   "what is the base constraint of these walls" -> READ_ELEMENT_PARAMETERS
#   "list the walls on level 2"          -> FILTER_ELEMENTS_BY_CATEGORY, Walls
#   "how many walls are on each level"   -> FILTER_ELEMENTS_BY_CATEGORY, then
#                                           a level read and a count (5b-468)
#   "copy these walls onto the selected levels" -> COPY_ELEMENTS, which makes a
#                                           new copy on each level. This one
#                                           copies nothing (5b-467)


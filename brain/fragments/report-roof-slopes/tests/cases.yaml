# D-30: the negative case is what catches "succeeded and said the wrong
# thing" - for a read of slopes, a ratio reported as degrees, an upright end
# reported as sloped, or a flat roof reported as pitched.
#
# THE ARRANGEMENT (NEEDS-CHECKING Group PG). The scratch project
# "roofjoin-oy" of Group OY, never a working model: the MAIN ROOF (a roof by
# footprint, its two long sides Defining Slope at 30 degrees, its two ends
# upright), the WING ROOF (a roof by extrusion, profile "0,500; 2000,1655;
# 4000,500" - two lines at 30 degrees), and one more: a FLAT ROOF, a roof by
# footprint with no edge Defining Slope. Write down each roof's footprint
# lines' Defines Slope and Slope from Edit Footprint before the run.
# VERSION 2 adds a ROOF BY FACE (Massing & Site > Roof by Face on the face of
# a mass, made by hand in the copy and saved) - NEEDS-CHECKING Group PK, PK4.

positive:
  - given: >
      the main roof selected - THE UNITS CASE, RUN FIRST
    expect: >
      roofsRead 1; report "Roof by footprint <id> "Generic - 400mm": 2 of its
      4 footprint lines define slope." then each line - the two long sides
      "slopes at 30 degrees (rise 0.577 per 1 of run)", the two ends "defines
      no slope", each with its length (12000 and 8000 mm). 30 degrees, NOT
      0.577 called an angle - a slope read as an angle is the mistake
      SLOPE_ROOF_EDGES' header warns of, and the number looks plausible either
      way. The same as written down from Edit Footprint

  - given: >
      the wing roof selected
    expect: >
      roofsRead 1; report "Roof by extrusion <id> ..." with its two profile
      lines each "at 30.01 degrees (rise 0.578 per 1 of run)" - the profile's
      1155 mm rise over 2000 mm is 30.006 degrees

  - given: >
      the flat roof selected
    expect: >
      roofsRead 1; "0 of its 4 footprint lines define slope - no line sets a
      slope; a slope arrow or shape editing, if the roof has either, is not
      read here", and no line given a pitch. Never "flat"

  - given: >
      a wall and the main roof selected
    expect: >
      roofsRead 1; a finding "Walls <id> is not a roof, so it was left out";
      the main roof read as in the first case

  - given: >
      nothing selected
    expect: >
      every roof in the model read - the main roof, the wing, the far roof,
      the copy and the flat roof, and Wing F if Group OY's OY6 has been run -
      and the finding says "every roof in the model, as none was selected";
      nothing changed (the undo list has no new entry). Version 2, once the
      copy has the roof by face: it is named as a roof this does not read,
      and skippedRoofs is 1

  - given: >
      VERSION 2. only a roof by face selected (Massing & Site > Roof by Face
      on a mass face)
    expect: >
      roofsRead 0, skippedRoofs 1; the first finding "No roof's slope was
      read: 1 roof(s) among the elements selected were passed over, each named
      below - not the same as there being no roof", and the roof named as one
      this does not read

negative:
  - given: >
      only a wall selected - no roof at all
    expect: >
      roofsRead 0, report empty; findings "No roof by footprint or by
      extrusion is among the elements selected, so no slope was read" and
      "Walls <id> is not a roof, so it was left out"

  - given: >
      a roof by footprint with NO line Defining Slope and a SLOPE ARROW drawn
      in Edit Footprint (tail at one edge, head at the other, Level at Tail
      0, Height Offset at Head 1000 mm) - the roof slopes, and no line says so
    expect: >
      roofsRead 1; "0 of its 4 footprint lines define slope - no line sets a
      slope; a slope arrow ... is not read here" - NOT "flat", and no pitch
      made up from the arrow. Write down whether GetProfiles listed the
      arrow's line among the footprint lines: if it did, it is reported as a
      line that defines no slope, and that is a finding

  - given: >
      VERSION 2, NEGATIVE. the wall alone again
    expect: >
      skippedRoofs 0 - a wall is not a roof passed over - and the first
      finding exactly version 1's "No roof by footprint or by extrusion is
      among the elements selected ..."

second_route:
  - given: >
      the main roof, by hand
    expect: >
      Edit Footprint, each line's Properties: Defines Slope and Slope as the
      report says, line for line

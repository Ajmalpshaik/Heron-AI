id: FRG-ELE-172
semantic-identity: "how steep is this roof: read the slope of each roof edge"

# WHY IT EXISTS - comments, not `purpose`, because `purpose` is searched.
#
# FRAGMENT-ISSUES row 5b-1940, issue #1161 (2026-11-21). Asked "what pitch is
# this roof", "how steep is this roof" or "what angle is this roof sloped at",
# every backend answered SLOPE_ROOF_EDGES - a write that SETS a slope - on
# main. No read in the library read a roof's slope: READ_ELEMENT_PARAMETERS
# reads one named parameter, and a roof by footprint keeps its slope on each
# footprint line, not on the roof (FootPrintRoof.get_SlopeAngle per
# ModelCurve), while a roof by extrusion has no slope parameter at all - its
# pitch is the angle of its profile's lines. So the question had nowhere to go
# but the write. Checked first: no fragment's C# but SLOPE_ROOF_EDGES and
# EXTEND_ROOF_TO_ROOF calls get_SlopeAngle or get_DefinesSlope, and both are
# writes.
#
# WHAT IT READS - RevitAPI.xml 2020.2.90 to 2027.4.0, the same members on
# every release: FootPrintRoof.GetProfiles, get_DefinesSlope, get_SlopeAngle;
# ExtrusionRoof.GetProfile; CurveElement.GeometryCurve. SlopeAngle is a RISE
# OVER A RUN, not an angle, whatever its name says (SLOPE_ROOF_EDGES' header):
# 0.5 is 26.57 degrees, turned into degrees here by its arctangent.
#
# ROUTING - repeated in SLOPE_ROOF_EDGES and READ_ELEMENT_PARAMETERS.
#
#   "what pitch is this roof"        -> here. A question, answered by reading
#   "how steep is this roof"         -> here
#   "what is the slope of this roof" -> READ_ELEMENT_PARAMETERS keeps it
#                                       (row 5b-1929): the roof's Slope
#                                       parameter, when every sloped edge
#                                       shares one; here gives each edge
#   "slope this roof", "make it a gable at 30 degrees"
#                                    -> SLOPE_ROOF_EDGES. A change
kind: action
domain: revit.elements
capability: REPORT_ROOF_SLOPES
# VERSION 2 (2026-11-21, D-64, row 5b-1909, work-note item WN-7 of issue
# #1005): every roof passed over is counted in `skippedRoofs`, and the empty
# answer says how many instead of "this model has no roof by footprint or by
# extrusion". Its C# moved, so it stays DRAFT until NEEDS-CHECKING Group PK
# runs, after Group PG (D-30).
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Reports how steep each roof is, as a read only. Each line of the roof's
  outline is read for whether it defines slope and, where it does, its angle
  and its rise over a run; a roof by extrusion is read from its profile, each
  straight line from level. The roofs selected are read, or every roof in the
  model when none is selected.

contract:
  needs:
    - name: doc
      type: Document
    # The roofs, FROM THE SELECTION. Anything that is not a roof is named and
    # left out. Empty, every roof in the model is read.
    - name: elements
      type: IList<Element>
  provides:
    - name: roofsRead
      # How many roofs were read - a roof by footprint or by extrusion.
      role: result
      type: int
    - name: report
      # ONE STRING, one line per roof: its kind, type and id, then each
      # edge's slope - so no cut on the way to a chat can shorten it to a
      # count.
      role: accounting
      type: string
    - name: skippedRoofs
      # VERSION 2 (D-64). Roofs passed over - a footprint or profile that would
      # not read or has no lines, or a roof by face or in place - each also
      # named in `findings`. Never an element that is not a roof. Always
      # carried; on the empty answer the first finding gives the count.
      role: accounting
      type: int
    - name: findings
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. FootPrintRoof.GetProfiles,
  get_DefinesSlope and get_SlopeAngle, ExtrusionRoof.GetProfile and
  CurveElement.GeometryCurve are present 2020 through 2027. Degrees come from
  the arctangent of the rise over run as plain arithmetic - no units API,
  which is what changed shape at 2021. Lengths are feet times 304.8.

utterances:
  - what pitch is this roof
  - how steep is this roof
  - what angle is this roof sloped at
  - what is the roof pitch
  - what are the slopes of the edges of this roof
  - which edges of this roof define slope
  - report the slope of every roof
  # EIGHTH SINCE 2026-11-24 (row 5b-1953, issue #1187): "what slope is the main
  # roof at" reached SLOPE_ROOF_EDGES, a write, on both re-ranked backends,
  # which read the first eight lines (D-134). "how steep are the roofs in this
  # model" was eighth and is tenth now, after the ninth below.
  - what slope is the roof at
  # ADDED 2026-11-21, row 5b-1953 (issue #1187). SLOPE_ROOF_EDGES took a pitch
  # request ninth, and on the model alone that pulled a pitch QUESTION to the
  # write; this keeps it here. Ninth, so the re-ranker never reads it (D-134).
  - say what pitch each roof has
  - how steep are the roofs in this model

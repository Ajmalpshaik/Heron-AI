id: FRG-ELE-081
semantic-identity: "attach the tops of these walls to the roof or floor above, or detach them"
kind: action
domain: revit.elements
capability: ATTACH_WALLS
version: 1
source: OFFICIAL
risk: MODIFY

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# EACH WALL FINDS ITS OWN TARGET: the nearest roof, floor or ceiling whose plan
# extent overlaps it, above its top or below its base. A wall with nothing
# there is named and left - nothing guessed across the building.
#
# REVIT 2025 opened wall attachment to code (Wall.AddAttachment,
# RemoveAttachment, GetAttachmentIds), so the card declares 2025 on. On older
# releases the attachment is done by hand.
#
# READ BACK: each wall's attachments at that end read again.
#
# SET_ELEMENT_LEVEL sets a wall's levels and offsets; this attaches it to an
# element, which follows that element when it moves.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Attaches the tops or bases of walls to the roof, floor or ceiling above or
  below each one, or a base to the terrain - Attach Top/Base - or detaches
  them.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # "top" or "base"; an EMPTY value means top.
    - name: where
      type: string
      source: request
    # true removes the attachments at that end instead; false, or not said,
    # attaches.
    - name: detach
      type: bool
      source: request
      optional: true
  provides:
    - name: attached
      role: result
      type: int
    - name: attachedIds
      role: result
      type: IList<ElementId>
    - name: noTarget
      # Walls with no roof, floor or ceiling over or under them (D-52).
      role: accounting
      type: IList<ElementId>
    - name: report
      # ONE STRING, wall by wall (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>


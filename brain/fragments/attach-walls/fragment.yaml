compatibility-note: >
  Wall.AddAttachment, RemoveAttachment, GetAttachmentIds and AttachmentLocation
  are present from 2025 and absent in 2020 to 2024 - read off RevitAPI.xml in
  the Nice3point reference packages for all eight releases on 2026-10-12 - so
  the card declares 2025 to 2027 only.

# ROUTING - the same rows are in the fragments named here.
#
#   "attach these walls to the roof"          -> here
#   "detach the wall tops"                    -> here, detach
#   "attach the wall bases to the terrain"    -> here, base
#   "set the wall top to level 2"             -> SET_ELEMENT_LEVEL, topLevelId
#   "attach these columns to the roof"        -> ATTACH_COLUMNS - columns,
#                                                with the target selected
#
# ON 2020 TO 2024 THIS CARD IS NOT OFFERED, so its sentences rank another
# card there. Measured 2026-11-01 (brain/heron_retrieve.py, scratch store,
# model backend): four of them now rank ATTACH_COLUMNS first, where before
# they ranked PLACE_HOSTED_FAMILY, PLACE_AREA_REINFORCEMENT, PAINT_FACES and
# CREATE_FROM_ROOM_BOUNDARIES - none of which attaches a wall either. Handed walls, ATTACH_COLUMNS changes
# nothing and says none of them is a column. On those releases a wall is
# attached by hand.

utterances:
  # ADDED 2026-11-07, issue #799 routing table: ranked DIMENSION_ELEMENT_FACES
  # first on Villa 1. On Revit 2024 this card is not offered (no API for it
  # before 2025) and the answer names it as another release's (#801).
  - extend wall height up to the underside of the roof
  - attach these walls to the roof above
  - attach the wall tops to the slab
  - detach the tops of these walls
  - attach the bases of these walls to the floor below
  - attach the bottom of these walls to the toposolid

semantic-identity: "draw a filled or masking region - a hatch or mask in a project view, or inside the family being edited: a detail item's hatch, a symbol's mask, a solid plan fill"
kind: action
domain: revit.families
capability: DRAW_FAMILY_FILLED_REGION
# VERSION 2 (2026-11-01): CREATE_FILLED_REGION was merged into this card on the
# owner's instruction ("make sure there is no duplicate tools"), and is
# DEPRECATED. The keeper is this card because more of the library points at it
# - nine family-building skills, SET_FAMILY_CATEGORY's table and the family
# jobs - and it already drew masking regions; the capability keeps its name,
# so every one of those still reads. From CREATE_FILLED_REGION: a PROJECT's
# view as well as a family's - named as the Project Browser shows it or
# "FloorPlan: Level 1"; a view that takes no annotation, a 3D view or a
# schedule, refused with the reason; and the answer saying every time that a
# filled region is ANNOTATION, in one view only. A project view at an angle is
# taken too, its shapes read along the view's right and up. `notAFamily` now
# says which kind of document it drew in; it is no longer a refusal. The
# proof below is version 1's and no longer describes the code; DRAFT until
# version 2 is proved.
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Draws a FILLED or MASKING region in a project's view, or inside the family
  open in the Family Editor
  - the hatch of a detail item's insulation, the solid of a cut steel section,
  the white mask a symbol hides what is under it with, the solid fill of a
  plan symbol in a model family. The Family Editor's Filled Region and Masking
  Region.

  **THE KIND OF FAMILY AND THE RELEASE DECIDE WHAT EXISTS.** A 2D family - a
  detail item, an annotation, a profile, a title block - draws in its VIEW, by
  the view's name, on every release 2020 to 2027. A 3D model family draws on a
  level or a named reference plane, and Revit has a call for that only from
  2023. A MASKING region has a call of its own only from 2024. Each is found on
  the running Revit by its own signature; a release without it is refused by
  name with what to do instead.

  **THE SAME SHAPE LANGUAGE AS THE FORM TOOLS**, millimetres in the plane's own
  two model coordinates, closed loops only, `|` between them - a loop inside
  another is a hole.

  **THE TYPE IS NAMED** - the family's own filled region type, "Solid Black",
  or "masking". A name the family does not hold is refused with the ones it
  does.

  **READ BACK, ALL OR NOTHING**: the region, its loops, its type and whether it
  is masking are read again; one that does not read as asked fails the call.
  Its id comes back.

  **In a project, it exists in ONE view and nowhere else** (version 2, from
  CREATE_FILLED_REGION) - the drafting patch: a shaft marked up, an area
  shaded on a key plan, a zone coloured on a coordination drawing. A filled
  region is annotation, not model: it is on no other drawing, not in the
  model, and in no schedule, and the answer says so. The view must take
  annotation - a plan, a section, an elevation, a detail, a drafting view, a
  legend or a sheet; a 3D view is refused with the reason.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # In a 2D family the VIEW to draw in, as the Project Browser names it -
    # "Ref. Level". In a 3D family a level or a named reference plane facing
    # left-right, front-back or up. Version 2: in a PROJECT the view to draw
    # in, as the Project Browser names it or "FloorPlan: Level 1" - one that
    # takes annotation.
    - name: workPlane
      type: string
      source: request
    # Closed loops, `|` between: "circle CX,CY R", "rect X1,Y1 X2,Y2",
    # "polygon CX,CY R N", or corners "X,Y; X,Y; arc MX,MY X,Y". Millimetres,
    # in the plane's own two model coordinates - and, in a project view at an
    # angle (version 2), along the view's right and up from the point of its
    # plane over the project origin.
    - name: shapes
      type: string
      source: request
    # A filled region type in the family - "Solid Black" - or "masking".
    - name: regionType
      type: string
      source: request
  provides:
    - name: regionId
      # The new region's unique id.
      role: result
      type: string
    - name: drawn
      # Filled or masking, its type, where, its loops and boundary length - read
      # back.
      role: result
      type: string
    - name: notAFamily
      # Version 2: true when it drew in a PROJECT's view - which kind of
      # document it was. Version 1 refused a project; this is no longer a
      # refusal (D-52: the evidence of where it looked).
      role: accounting
      type: bool
    - name: refused
      # Why nothing was drawn, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


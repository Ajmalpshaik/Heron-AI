compatibility-note: >
  `FilledRegion.Create(Document, ElementId, ElementId, IList<CurveLoop>)` - a
  view-specific region, in models and 2D families - is the same 2020 through
  2027. `FilledRegion.Create(Document, ElementId, SketchPlane, ...)` - a
  region in a 3D model family - exists from 2023, and
  `FilledRegion.CreateMaskingRegion`, both forms, from 2024 (the RevitAPI
  reference assemblies and Autodesk's XML remarks, read 2026-10-01). Both are
  found by signature at run time, so 2020 to 2022 refuse a 3D family's region
  by name rather than failing to compile. Version 2 adds what
  CREATE_FILLED_REGION was proved with - the view-specific
  `FilledRegion.Create(Document, ElementId, ElementId, IList<CurveLoop>)` on a
  project view, the same call - and `View.RightDirection`, `UpDirection`,
  `Origin` and `ViewDirection` for a view at an angle, present 2020 through
  2027.

# ROUTING - see SET_FAMILY_SETTINGS for the whole family-building table.
#
#   "add a solid fill to this detail item family" -> here
#   "put a masking region in this family"         -> here
#   "put a filled region here"                    -> here since version 2, a
#                                                    project's view (was
#                                                    CREATE_FILLED_REGION)
#   "hatch this area on the drawing"              -> here, a project view
#   "write on the drawing"                        -> CREATE_TEXT_NOTE - the
#                                                    other markup that lives in
#                                                    one view only
#   "make a detail view"                          -> CREATE_DRAFTING_VIEW
#   "make a floor slab over this area"            -> CREATE_FLOOR. A filled
#                                                    region LOOKS like a slab on
#                                                    a plan and is not one
#   "draw a detail line here"                     -> DRAW_FAMILY_DETAIL_LINES - a line has no
#                                                    fill
#   "make a 45 degree hatch pattern"              -> CREATE_FILL_PATTERN - the
#                                                    pattern, not a region drawn
#                                                    with one
#   "draw the valve symbol in plan"               -> DRAW_FAMILY_SYMBOLIC_LINES

utterances:
  - add a solid fill to this detail item family
  - put a masking region in this family
  - draw a filled region in the family
  - fill the insulation hatch in this detail component
  # MOVED 2026-11-01 from CREATE_FILLED_REGION, merged into this card.
  - hatch this area on the drawing
  - shade this bit
  - put a filled region here

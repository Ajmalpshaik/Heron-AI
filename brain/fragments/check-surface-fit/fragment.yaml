id: FRG-QA-023
semantic-identity: "can this element actually sit flat against what is behind it"
kind: filter
domain: revit.qa
capability: CHECK_SURFACE_FIT
version: 2
source: OFFICIAL
risk: READ

purpose: >
  For each element, fires rays from its whole FOOTPRINT rather than from its
  centre alone, and reports whether it can actually sit flat against what it
  finds. Read-only.

  **A SINGLE CENTRE RAY IS RIGHT IN THE MIDDLE OF A LARGE FLAT SURFACE AND LIES
  AT THE EDGES - AND EDGES ARE WHERE THE MISTAKES ARE.** This is the same
  intersection arithmetic with more sample points, and it names the four ways
  one ray gets it wrong:

  | Verdict | What it means |
  |---|---|
  | `STRADDLING` | corners hit DIFFERENT elements - it spans a ceiling edge or a level change |
  | `OVERHANGING` | some corners hit nothing - it hangs off the edge |
  | `UNEVEN` | corners hit the same element at different heights |
  | `SLOPED` | the surface is not square to the ray, so nothing can sit flush |

  **IT IS THE CHECK BEFORE `MOVE_TO_RAY_HIT`, not a replacement for it.** Its
  real use is deciding which elements are safe to move automatically and which
  need somebody to look. A batch move that includes a straddling unit puts it in
  the wrong place confidently.

  **BEFORE THIS, THE QUESTION RESOLVED TO `SNAP_TO_GRID` - which MOVES things.**
  A question about whether the model is right, answered by something that changes
  it.

  **IT REPORTS BY EXCEPTION.** Ray count is not the cost here; output is. A clean
  run over five thousand elements should print a summary line and nothing else.

  **LINKED MODELS ARE NOT HIT UNLESS ASKED FOR.** If the ceilings and slabs are a link, every
  element reports as finding nothing - which looks exactly like a real finding.
  Said on the summary line.

  **LINKED MODELS ARE HIT ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, the same five rays are cast again with
  Revit's own FindReferencesInRevitLinks, and every element whose rays land
  on a LINKED surface gets its own verdict in `linkedMatches` - the same
  four names, with the linked ceiling or slab's type, id IN THE LINK and
  Fire Rating. On an MEP model the ceilings and slabs are the architect's
  and the structural engineer's, so this is the check a host-only run
  cannot make. **The ray sees a link only where the 3D view shows it**, and
  the answer names that view. `linksSearched` says how many links are
  loaded: set and 0 means "you asked, and none are loaded". **NOTHING FROM
  A LINK IS CARRIED** - `unsafeToMove` and `clean` stay this model's answer;
  `unsafeToMove` feeds the move (FRAGMENT-ISSUES row 75). Only model
  elements are read from a link, never its views or sheets. Links nested
  inside a link are not read, and are counted in the answer. This is
  version 2; version 1's proof no longer describes the code, and the
  fragment is DRAFT until it is proved again.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: direction
      type: XYZ
      source: request
    - name: maxDistance
      type: double
      source: request
    - name: evenness
      type: double
      source: request
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: findings
      type: IList<string>
    - name: unsafeToMove
      role: result
      type: IList<ElementId>
    - name: clean
      # How many sat flat with nothing wrong. The evidence it looked - a clean
      # run over five thousand elements should print a summary line and
      # nothing else (D-52).
      role: accounting
      type: int
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then the links' own lines. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75).
      role: accounting
      type: IList<string>


id: FRG-QA-023
semantic-identity: "can this element actually sit flat against what is behind it"
kind: filter
domain: revit.qa
capability: CHECK_SURFACE_FIT
version: 1
source: OFFICIAL
risk: READ

purpose: >
  For each element, fires rays from its whole FOOTPRINT rather than from its
  centre alone, and reports whether it can actually sit flat against what it
  finds. Read-only.

  **A SINGLE CENTRE RAY IS RIGHT IN THE MIDDLE OF A LARGE FLAT SURFACE AND LIES
  AT THE EDGES - AND EDGES ARE WHERE THE MISTAKES ARE.** This is the same
  intersection arithmetic with more sample points, and it names the four ways
  one ray gets it wrong:

  | Verdict | What it means |
  |---|---|
  | `STRADDLING` | corners hit DIFFERENT elements - it spans a ceiling edge or a level change |
  | `OVERHANGING` | some corners hit nothing - it hangs off the edge |
  | `UNEVEN` | corners hit the same element at different heights |
  | `SLOPED` | the surface is not square to the ray, so nothing can sit flush |

  **IT IS THE CHECK BEFORE `MOVE_TO_RAY_HIT`, not a replacement for it.** Its
  real use is deciding which elements are safe to move automatically and which
  need somebody to look. A batch move that includes a straddling unit puts it in
  the wrong place confidently.

  **BEFORE THIS, THE QUESTION RESOLVED TO `SNAP_TO_GRID` - which MOVES things.**
  A question about whether the model is right, answered by something that changes
  it.

  **IT REPORTS BY EXCEPTION.** Ray count is not the cost here; output is. A clean
  run over five thousand elements should print a summary line and nothing else.

  **LINKED MODELS ARE NOT HIT.** If the ceilings and slabs are a link, every
  element reports as finding nothing - which looks exactly like a real finding.
  Said on the summary line.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: direction
      type: XYZ
      source: request
    - name: maxDistance
      type: double
      source: request
    - name: evenness
      type: double
      source: request
  provides:
    - name: findings
      type: IList<string>
    - name: unsafeToMove
      role: result
      type: IList<ElementId>
    - name: clean
      # How many sat flat with nothing wrong. The evidence it looked - a clean
      # run over five thousand elements should print a summary line and
      # nothing else (D-52).
      role: accounting
      type: int


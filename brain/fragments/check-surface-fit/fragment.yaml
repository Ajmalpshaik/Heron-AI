compatibility-note: >
  One implementation for every release. `ReferenceIntersector`,
  `ReferenceWithContext.Proximity`, `Reference.ElementId` and `View3D` are
  unchanged 2020 through 2027 - read off the reference assemblies at both ends.
  Elements are compared by `ElementId`, never by a number. `maxDistance` and
  `evenness` arrive in millimetres and are divided by 304.8 in the code
  (D-71) - no units API is touched. (This note said they "arrive in internal
  FEET" until 2026-09-24, while the code and its own proof - 50000 and 5 in,
  164.04 and 0.0164 feet used - said millimetres.)

  **THE CONSTRUCTOR WAS WRONG ON ALL EIGHT RELEASES UNTIL 2026-09-05, AND THIS
  NOTE SAID IT HAD BEEN CHECKED.** It called
  `new ReferenceIntersector(FindReferenceTarget.Element, rayView)` - a
  two-argument form Revit has never shipped, on any release here. It is now the
  filter-first overload with an inverted `ElementIsElementTypeFilter`, which
  passes every placed instance and no types.

  The reason it survived is worth more than the fix. `tools/check-api-surface.py`
  MATCHES BY NAME, and `ReferenceIntersector` exists everywhere, so a wrong
  SIGNATURE reads as present - its own docstring says exactly that. The compile
  gate is the only thing that reads an argument list, and no compiler had ever
  read this fragment. **A sentence claiming a member was "read off the reference
  assemblies at both ends" is a claim about names only until something compiles
  it.**

# ROUTING - repeated in MOVE_TO_RAY_HIT, SNAP_TO_GRID and CHECK_OBSTRUCTIONS.
#
#   "is the equipment sitting flat on the floor" -> here
#   "will these sit properly against the ceiling" -> here
#   "which of these are safe to move automatically" -> here - that IS the
#                                           question it was built for
#   "drop these down onto the slab"      -> MOVE_TO_RAY_HIT - the MOVE. Run this
#                                           first and leave the straddling ones
#                                           out of it
#   "line these up with the ceiling grid" -> SNAP_TO_GRID - also a move
#   "is anything above this point"       -> CHECK_OBSTRUCTIONS - ONE ray from one
#                                           point, which is the thing this exists
#                                           because it is not enough

utterances:
  - is the equipment sitting flat on the floor
  - will these sit properly against the ceiling
  - which of these are safe to move automatically
  - check these sit flush
  - are any of these hanging off the edge

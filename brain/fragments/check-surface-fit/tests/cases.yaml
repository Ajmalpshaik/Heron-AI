positive:
  - given: a diffuser well inside a large flat ceiling
    expect: >
      clean, counted and not listed - CHECKED against a section, and it is the
      case where one centre ray would also have been right

  - given: a unit spanning the edge between two ceilings at different heights
    expect: >
      STRADDLING, naming that the corners land on different elements. This is the
      case a centre ray passes and a batch move then gets wrong

  - given: a unit half over the edge of a slab
    expect: OVERHANGING, with how many sample points found nothing

  # D-59, added 2026-09-28 with version 2. NOT RUN.
  - given: >
      air terminals in this MEP model under a ceiling that is only in the
      architectural link, direction up, includeLinks true
    expect: >
      `unsafeToMove` and `clean` unchanged from the host-only run; each
      terminal's line in `linkedMatches` reads "sits flat" or names its
      verdict against the linked ceiling - checked with one in a section

negative:
  - given: a fitting on a sloping soffit
    expect: >
      SLOPED or UNEVEN with the spread in mm. THIS IS THE FIRST CASE TO RUN. A
      centre ray returns one clean distance and reports it as fine; nothing can
      sit flush against it, and the batch move puts it at one corner's height

  - given: a project where the ceilings are in a LINKED model
    expect: >
      the summary saying links were not hit. Everything will read as finding
      nothing, which is indistinguishable from a real finding on every element

  - given: a model with no 3D view at all
    expect: >
      "NOTHING was checked" said plainly. A ray needs a real 3D view, and an
      empty findings list would read as a clean sweep

  - given: five thousand clean elements
    expect: >
      a summary line and no table. Rays are cheap; output is what makes a check
      unreadable and then unused

  - given: an element with no readable extent
    expect: named and skipped, with the rest completing

  # D-59, added 2026-09-28 with version 2. NONE OF THESE HAS BEEN RUN.
  - given: includeLinks ABSENT, on a model that HAS loaded links
    expect: >
      the same answer as version 1, and linksSearched 0 with the first
      line of linkedMatches reading "Host model only - links not read". The
      switch left out must bind false, not refuse - if the run refuses with
      needs_request_values, the add-in in Revit is older than this change

  - given: includeLinks true on a model with NO links, or with every link unloaded
    expect: >
      linksSearched 0 and "Links asked for, NONE loaded - host only". It must
      NOT read like the absent case: one means there was nothing else to read,
      the other means reload them in Manage Links and ask again

  - given: one linked file placed TWICE, with includeLinks true
    expect: >
      linksSearched 1, not 2 - it counts files, not placements

  - given: a terminal placed half under the edge of a linked ceiling, includeLinks true
    expect: >
      OVERHANGING on its linked line - never "sits flat" because the centre
      ray alone reached the ceiling

  # Row 5b-203, added 2026-10-09. NOT RUN - it needs a model that carries a
  # duplicated name, and none has been arranged yet.
  - given: >
      air terminals in this MEP model under a ceiling that is only in the
      architectural link, its type carrying two parameters named Fire Rating -
      a shared or project one bound to Ceilings beside another of that name -
      direction up, includeLinks true
    expect: >
      each terminal's line in `linkedMatches` names the linked ceiling with
      "Fire Rating NOT READ - 2 parameters share that name", never either
      rating, and `unsafeToMove` and `clean` are unchanged from the host-only
      run (row 5b-203)

second_route:
  - Cut a section through a reported element and look at whether its underside meets the surface

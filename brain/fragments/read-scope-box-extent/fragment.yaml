id: FRG-GEO-027
semantic-identity: "how big is that scope box, and where is it"
kind: action
domain: revit.geometry
capability: READ_SCOPE_BOX_EXTENT
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Finds a scope box by name and hands back the box it occupies. Read-only.

  **IT EXISTS TO FEED THE REGION SELECTION.** *"What is inside the podium scope
  box"* is a real question and nothing could answer it: selecting in a region
  needs two corners, and the corners of a scope box were unreadable. This
  publishes them under the names that selection already uses, so the two
  compose without anything in between.

  **A SCOPE BOX CANNOT BE CREATED FROM CODE, WHICH MAKES READING ONE MORE
  USEFUL, NOT LESS.** Revit exposes no create call on any release here - the
  box is drawn once by hand. Everything after that is automatable, and this is
  the piece that was missing.

  **NAMES ARE MATCHED BY CONTAINED TEXT, AND AMBIGUITY IS REFUSED.** Scope
  boxes get named for zones and phases, so a partial name is what somebody
  types. Where two boxes match it is refused rather than resolved by picking
  the first: one is the wrong half of a building.

  Millimetres, deliberately - not the feet the rest of this library hands on.
  The region selection this feeds takes millimetres at its own edge, and
  publishing the same unit is what lets them compose without a conversion
  nobody can see.

  ASSUMES NOTHING ABOUT TRANSACTIONS - it opens none and needs none.

contract:
  needs:
    - name: doc
      type: Document
    - name: scopeBoxName
      type: string
      source: request
  provides:
    - name: minMm
      role: result
      type: XYZ
    - name: maxMm
      role: result
      type: XYZ
    - name: scopeBoxId
      role: result
      type: ElementId
    - name: findings
      type: IList<string>


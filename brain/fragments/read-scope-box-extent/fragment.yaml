revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. A scope box is an ordinary element of
  the volume-of-interest category on all of them - there is no scope box class
  in the API at all, which is also why none can be created - and its extent is
  read from its bounding box, unchanged 2020 to 2027.

# ROUTING - the same rows are in the fragments named here.
#
#   "how big is that scope box"          -> here
#   "what is inside the podium scope     -> here, then SELECT_IN_REGION, which
#    box"                                   takes the two corners this hands on
#   "put the scope box on these views"   -> ASSIGN_SCOPE_BOX_TO_VIEW
#   "make a scope box"                   -> not possible from code on any
#                                           release: Revit exposes no create
#                                           call. Draw it once by hand
#   "everything inside this box"         -> SELECT_IN_REGION with typed corners
#   "how big is this element"            -> REPORT_BOUNDING_BOX

# ROUTING - repeated in SELECT_SCOPE_BOXES.
#
#   "how big is the podium scope box"     -> here. Takes the NAME, returns the
#                                            corners, and feeds SELECT_IN_REGION
#   "what scope boxes are there"          -> SELECT_SCOPE_BOXES, which hands
#                                            them back as ELEMENTS so a rename,
#                                            a report or a delete can act on
#                                            them. Everything here took a box by
#                                            NAME and nothing could enumerate
#                                            them - the same gap
#                                            SELECT_VIEW_TEMPLATES filled
#   "make a scope box"                    -> NOT POSSIBLE on any release here,
#                                            and resizing one is out for the
#                                            same reason

utterances:
  - how big is that scope box
  - what is inside the scope box
  - the extent of the podium scope box
  - select everything in this scope box

version: 2
source: OFFICIAL
risk: READ

# IDENTITY NAMES DOORS, WINDOWS AND A WALL (2026-11-21, row 5b-321, GitHub issue
# #955). With both re-rankers "which doors are in this wall" and "which windows
# sit in this wall" reached PLACE_HOSTED_FAMILY, a change, on main 0429fc1c, and
# "count the windows in the external walls" did on every backend but lexical:
# the re-ranker reads the identity and the first eight utterances (D-134), and
# the identity named no door, window or wall. Measured with
# tools/score-routing.py --sentences on 764 sentences frozen before the edit
# (tests/data/routing-sentences-2026-11-21-round4.yaml and its neighbours), all
# four backends: all three reach this card now, nothing moved the wrong way.
# On lexical "put two windows in the north wall" now reaches this read instead
# of DIMENSION_ELEMENT_FACES (a different write) - a request answered by a read,
# which changes nothing; PLACE_HOSTED_FAMILY was not first on main either.

# DOORS AND WINDOWS FIRST, AND THE COUNT BESIDE THE SELECTION (FRAGMENT-ISSUES
# 5b-321, 2026-10-09). Until then this purpose was mostly duct insulation and
# MEP fittings, so the trained search model put this card 10th to 20th for
# questions about the doors and windows already in a wall, and those questions
# went to PLACE_HOSTED_FAMILY - a change. The opening now says what a modeller
# asks it for. The wording was chosen on phrasings written before it and
# checked on a second set nobody chose it by. Two things it must not do, both
# measured on a margin of one rank: say "doors" and "windows" so often that
# "place doors and windows hosted in walls at points" (a change, 5b-319) ties
# here and wins on words - so later mentions say "a door", "each door" - and
# name the tool that places them, whose name is made of the words of a request
# to place. And it keeps "cut into": without it the routing table's "what is
# cut into this wall" left this card on spelling.
purpose: >
  Finds the doors and windows already cut into a wall - selects them, and counts
  them - and everything else Revit records as HOSTED ON one given element:
  the skylights in a roof, the face-hosted fixtures on a ceiling, the
  insulation and lining wrapped around a duct or pipe. The answer is the
  selection, with a count beside it of every door, window and other family
  found on it and of the insulation wraps, narrowed to Doors or Windows when
  the category is given. One host per call.

  **A read, never a change.** It finds each door and window a wall already
  has; adding a new one is a different tool, and nothing here edits the wall.

  **This is the recorded parent relationship, not proximity.** Two elements
  touching, overlapping or sharing a face do not host one another, and
  nothing here will find them. That is the point: a host relationship is what
  makes the child move when the parent moves, and it is the only one worth
  filtering on when the question is "what depends on this".

  Two mechanisms are covered, because Revit uses two and neither one alone is
  enough: `FamilyInstance.Host` for a door, a window and every other
  host-based family, and `InsulationLiningBase.HostElementId` for insulation
  and lining. A filter that reads only the first finds no insulation at all
  and says so with a confident zero.

  **MEP FITTINGS ARE CONNECTED TO THEIR RUN, AND THE RUN IS NOT THEIR HOST.**
  An elbow, a tee or a valve has connectors and NO host, so "what is on this
  pipe" comes back empty here - correct, and useless. TRACE_CONNECTIVITY
  follows connectors and answers it, and the empty result says so in words.

  **A level is not a host in this sense either.** Almost every element records a
  level, so "everything on Level 2" is a different question -
  FILTER_ELEMENTS_BY_CATEGORY takes a level and answers it.

contract:
  needs:
    - name: doc
      type: Document
    - name: host
      type: Element
      source: request
    - name: categories
      type: IList<BuiltInCategory>
      source: request
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: findings
      type: IList<string>
    - name: unresolvedElements
      # VERSION 2 (D-64). Elements of the categories searched whose host Revit
      # would not give, so they were passed over. Always carried; a sentence
      # in `findings` names it only when it is above 0.
      role: accounting
      type: int


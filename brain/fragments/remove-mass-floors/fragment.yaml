tests: tests/

compatibility-note: >
  One implementation for every release.
  MassInstanceUtils.RemoveMassLevelDataFromMassInstance, GetMassLevelIds and
  GetMassLevelDataIds, and MassLevelData.StrUsage are present 2020 through
  2027 - read with tools/api-surface on 2026-10-28. MassLevelData is marked
  obsolete on 2023 alone.

# ROUTING
#
#   "remove the mass floor at the roof level"   -> here
#   "add mass floors at every level"            -> CREATE_MASS_FLOORS
#   "delete these"                              -> DELETE_ELEMENTS

utterances:
  - remove the mass floor at the roof level
  - take the mass floors off levels 5 to 8
  - the plant level should not count, remove its mass floor
  - delete the mass floors at these levels

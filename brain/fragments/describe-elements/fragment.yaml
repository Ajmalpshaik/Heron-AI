id: FRG-ELE-009
semantic-identity: "what are these - category, family, type and id"
kind: action
domain: revit.reporting
capability: DESCRIBE_ELEMENTS
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Says what an element actually IS: its category, its family, its type name and
  its id. The plainest question in the model — *"what is this thing"* — and
  before this fragment the library answered it with FLIP_ELEMENTS.

  **It reads the family and type from the element's TYPE, not from its name.**
  An instance's name is frequently the type name, frequently not, and on a
  system family it is neither. Reading the type is the answer that survives
  somebody having renamed things.

  **An element with no type is reported, not skipped.** Walls, ducts and pipes
  are system families and have one; a line, a group or a view does not. Leaving
  those out of the answer would report fewer things than were asked about, and
  nobody counts the rows.

contract:
  needs:
    - name: elements
      type: IList<Element>
  provides:
    - name: described
      type: IDictionary<ElementId, string>
    - name: noType
      type: IList<ElementId>

proof:
  date: '2026-09-07'
  by: Ajmal PS
  model: Snowdon Towers Sample HVAC (9,641 elements), Revit 2024, session 42676
  positive_case: 37 mechanical equipment items selected in Snowdon Towers Sample HVAC - run
    as it would normally be run. returned described 37 entry(ies), noType 0 item(s). inputs
    came elements from the selection (37). on Snowdon Towers Sample HVAC
  negative_case: "CANNOT COME BACK EMPTY, so proved by TRACKING instead (D-53). describe-elements\
    \ describes whatever it is given, so no arrangement makes its answer empty. What D-30's\
    \ negative case exists to catch - a fragment that succeeds while doing nothing, or answers\
    \ about a set it was not given - is caught here by the answer following the input exactly\
    \ across 5 different selections:\n\n      28 (28 duct taps) selected -> described 28 entry(ies)\n\
    \      16 (16 spaces) selected -> described 16 entry(ies)\n      4 (4 walls) selected\
    \ -> described 4 entry(ies)\n      12 (12 sheets) selected -> described 12 entry(ies)\n\
    \      37 (37 mechanical equipment items) selected -> described 37 entry(ies)\n\n    Different\
    \ inputs, exact matches every time. A fragment falling back to the active view, the whole\
    \ model, or a previous run could not do that."
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: 04f22c1dae5b520a

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Element.Category`, `Element.GetTypeId`
  and `ElementType.FamilyName` are unchanged 2020 to 2027. The id is printed
  with `ToString()` rather than read as a number, which is what keeps this
  fragment clear of 2024's change of ElementId from 32-bit to 64-bit - a
  fragment that formatted `IntegerValue` would compile on 2020 and warn or
  break later.

# ROUTING - repeated in READ_ELEMENT_PARAMETERS.
#
#   "what is this"                     -> here
#   "what family and type is this"     -> here
#   "what size is it"                  -> READ_ELEMENT_PARAMETERS
#   "what system is it on"             -> READ_ELEMENT_PARAMETERS
#
# IDENTITY AND PROPERTIES ARE DIFFERENT QUESTIONS. This one answers what a thing
# is; the parameter read answers what is filled in on it.
#   "everything in duct accessories"     -> SELECT_BY_CATEGORY_NAME, which
#                                           collects a category by its plain
#                                           name. This one describes elements
#                                           you already have

utterances:
  - what is this element
  - what family and type is this
  - what are these
  - tell me what I have selected
  - what category is this
  - what is this

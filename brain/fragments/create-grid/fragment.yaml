compatibility-note: >
  `Grid.Create(Document, Line)` is unchanged 2020 to 2027. The points arrive as
  `XYZ` in feet, already converted by whoever supplied them, so there is no
  millimetre input here and no D-20 arithmetic - adding a conversion "for
  consistency" would move every grid by a factor of 304.8.

# ROUTING - repeated in LIST_GRIDS and SNAP_TO_GRID.
#
#   "add a grid"                -> here
#   "put a grid line here"      -> here
#   "list the grids"            -> LIST_GRIDS
#   "space these out on a grid" -> SNAP_TO_GRID, which means a LAYOUT grid -
#                                  an imaginary spacing for placing diffusers -
#                                  and not the building's setting-out datum.
#                                  One word, two jobs
#   "add a level"               -> CREATE_LEVEL

#   "draw a detail line here"          -> CREATE_LINE - a line is not a datum:
#                                        no bubble, no name, no view extents
#   "make a grid series across the building" -> CREATE_GRIDS - the SPACINGS
#                                        are the input there, which is how a
#                                        drawing dimensions a grid. This one
#                                        needs the coordinates worked out
utterances:
  - add a grid
  - create a grid line
  - put a grid here
  - add another column grid
  - I need a new grid line

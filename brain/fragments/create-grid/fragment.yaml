  needs:
    - name: doc
      type: Document
    - name: from
      type: XYZ
      source: request
    - name: to
      type: XYZ
      source: request
    - name: gridName
      type: string
      source: request
  provides:
    - name: created
      role: result
      type: ElementId
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string


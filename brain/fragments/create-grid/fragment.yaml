id: FRG-ELE-024
semantic-identity: "add a column grid line between these two points"
kind: action
domain: revit.datums
capability: CREATE_GRID
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Creates one straight column grid between two points and names it.

  **A grid is a vertical plane, so the line that defines it must be
  horizontal.** Give it two points at different heights and Revit refuses the
  whole call - there is no such thing as a sloping grid. That is checked here,
  where the message can say why, rather than surfacing as an exception a
  modeller cannot read.

  **The name is checked for a clash first**, for the same reason CREATE_SHEET
  and CREATE_LEVEL check theirs: Revit refuses a duplicate by throwing, and a
  throw after creation leaves a grid in the model carrying whatever default name
  Revit picked, in the middle of a setting-out somebody is relying on.


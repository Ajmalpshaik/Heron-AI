heron-agent: HERON-REVIT-IMP-019
heron-step: 17
heron-status: DEPRECATED
heron-since: 0.1.0
heron-layer: brain

id: FRG-SEL-036
semantic-identity: "which images in Manage Images does nothing use"
kind: filter
domain: revit.selection
capability: FIND_UNUSED_IMAGES
version: 1
source: OFFICIAL
risk: READ

# DEPRECATED 2026-11-01 - MERGED INTO FIND_PURGEABLE_ELEMENTS (find-purgeable-elements), on the owner's instruction
# in conversation: "make sure there is no duplicate tools". Constitution
# Article 1: kept, never deleted, so its record and its proof stay readable and
# it can be brought back. Nothing offers it now - retrieval leaves DEPRECATED
# out, and its sentences claim nothing in the identity table (heron_search
# RETIRED_FRAGMENTS). Its sentences moved to FIND_PURGEABLE_ELEMENTS. The proof below, where there
# is one, is the record of what this card's code did, not a claim about today.
deprecated:
  date: '2026-11-01'
  by: Ajmal PS
  superseded-by: FIND_PURGEABLE_ELEMENTS
  why: >
    The same question for one kind: which images nothing uses.
    FIND_PURGEABLE_ELEMENTS version 3 took this card's rule - placed, or named
    by any image parameter of any element or type - and its usedCount, and
    reports the unused by name. Not carried, the safer rule: this card handed
    its images on as elements for DELETE_ELEMENTS; there only Revit's own list
    is handed on, and an image found used is held back from it.

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# IT DELETES NOTHING: the unused images are handed on as `elements`, so
# DELETE_ELEMENTS removes them in the next step, after the modeller has seen
# the list. One delete path for everything, already PROVEN.
#
# "USED" IS LOOKED FOR EVERYWHERE AN IMAGE CAN BE: every placed image, and
# every element-id parameter of every element and type that names an image -
# Image, Type Image, shared or family image parameters. An image used ONLY as
# a schedule header picture is not seen, and the answer says so.
#
# FIND_PURGEABLE_ELEMENTS (families, and everything else Purge Unused
# offers), FIND_UNUSED_MATERIALS and FIND_UNUSED_GROUP_TYPES are the same job
# for other things.
#
# READ ONLY - opens no transaction.
purpose: >
  Finds the images in Manage Images that are placed nowhere and named by no
  image parameter, and hands them on - to DELETE_ELEMENTS once the list has
  been seen.

contract:
  needs:
    - name: doc
      type: Document
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: unusedNames
      role: result
      type: IList<string>
    - name: usedCount
      # Images found in use. The evidence the search looked (D-52).
      role: accounting
      type: int
    - name: findings
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. ImageType, ImageInstance and
  Element.GetTypeId are present 2020 through 2027 - read off RevitAPI.xml in
  the Nice3point reference packages for all eight releases on 2026-10-12.

# ROUTING - the same rows are in the fragments named here.
#
#   "which images are not used"               -> here
#   "delete the unused images"                -> here, then DELETE_ELEMENTS
#   "which families are not used"             -> FIND_PURGEABLE_ELEMENTS
#   "which materials are not used"            -> FIND_UNUSED_MATERIALS

utterances:
  - which images in the project are not used
  - find the unused images in manage images
  - clean out the images nothing uses
  - list the raster images that are not placed anywhere

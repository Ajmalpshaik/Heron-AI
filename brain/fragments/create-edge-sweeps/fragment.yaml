id: FRG-ELE-085
semantic-identity: "run a fascia or gutter along the roof eaves, or a slab edge round the floor"
kind: action
domain: revit.elements
capability: CREATE_EDGE_SWEEPS
version: 1
source: OFFICIAL
risk: MODIFY

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# THE EDGES COME FROM THE HOST'S OWN GEOMETRY: a roof's eaves are the level
# edges of its upward faces at each face's lowest height; a floor's slab edge
# is the outer loop of its top face. One sweep per host, along all its edges,
# which is how Revit joins them at corners.
#
# The type is found by name among the fascia, gutter or slab edge types; a
# name not there refuses, naming those that are.
#
# READ BACK: each sweep looked up after a regeneration.
#
# PLACE_WALL_SWEEPS runs a sweep along walls; SLOPE_ROOF_EDGES sets which roof
# edges slope.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Places a fascia or gutter along the eaves of each roof, or a slab edge round
  the top outer edge of each floor, the edges taken from the host itself.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # "fascia", "gutter" or "slab edge".
    - name: kind
      type: string
      source: request
    - name: typeName
      type: string
      source: request
  provides:
    - name: made
      role: result
      type: int
    - name: sweepIds
      role: result
      type: IList<ElementId>
    - name: edgeCount
      # Edges the new sweeps run along (D-52).
      role: accounting
      type: int
    - name: report
      # ONE STRING, host by host (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>


compatibility-note: >
  One implementation for every release. Creation.Document.NewFascia,
  NewGutter and NewSlabEdge with a ReferenceArray, FasciaType, GutterType,
  SlabEdgeType, Face.EdgeLoops, Edge.Reference, AsCurve and ApproximateLength,
  and PlanarFace.FaceNormal are present 2020 through 2027 - read off
  RevitAPI.xml in the Nice3point reference packages for all eight releases on
  2026-10-12.

# ROUTING - the same rows are in the fragments named here.
#
#   "add a fascia to this roof"               -> here
#   "put gutters on the eaves"                -> here
#   "add a slab edge round this floor"        -> here
#   "add skirting to these walls"             -> PLACE_WALL_SWEEPS

utterances:
  - add a fascia along the eaves of this roof
  - put gutters on the roof edges
  - add a slab edge round the edge of this floor
  - run a fascia board round the roof

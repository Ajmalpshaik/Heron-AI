revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Document.EditFamily`,
  `Document.Close`, `FamilySizeTableManager.GetFamilySizeTableManager`,
  `GetAllSizeTableNames`, `ExportSizeTable` and `FamilySizeTable.NumberOfRows`
  are present 2020 through 2027, confirmed by reflection on the 2020 assembly
  on 2026-09-15. No number is read or converted here - the CSV carries its own
  units in its header - so the 2021 units move cannot reach it.

# 2026-11-01 - REPORT_FAMILY_SIZE_TABLE WAS MERGED INTO THIS CARD (version 2)
# on the owner's instruction ("make sure there is no duplicate tools"), and is
# DEPRECATED. The same job: the lookup tables of a family, which sizes they
# hold. This card was kept - it covered more (every loaded family, the CSVs,
# the leftOpen guard), and CHECK_FAMILY_SIZE_TABLES' own C# names it. Its
# outputs now, by the same names: tableNames, columnHeaders, rows, rowCount,
# columnCount, exportedTo, notAFamily (true now for a project in front, which
# is read, not refused), findings; its inputs tableName and exportTo, optional
# here. A family with no table is in noTable, with its finding, as it said.
#
# NOTHING WAS OPPOSITE. Its "a project in front is not a family - open the
# family" is no refusal here: a project in front reads every loaded family,
# the job this card did.

# ROUTING - the neighbours this must not be confused with.
#

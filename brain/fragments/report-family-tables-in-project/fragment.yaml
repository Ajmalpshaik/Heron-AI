#                                         names, then REPORT_PIPE_SEGMENTS
#   "what fitting will this type insert" -> REPORT_ROUTING_PREFERENCES
#   "write a table back"                 -> WRITE_FAMILY_SIZE_TABLE
#   "check the lookup tables in this family"
#                                        -> CHECK_FAMILY_SIZE_TABLES - the
#                                           family open in front, its
#                                           size_lookup formulas against its
#                                           tables


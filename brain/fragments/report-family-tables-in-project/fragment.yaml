id: FRG-ELE-059
semantic-identity: "what sizes a family's lookup tables actually hold - the family in front read row by row, or every loaded family from the project without opening any by hand"
kind: action
domain: revit.families
capability: REPORT_FAMILY_TABLES_IN_PROJECT
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Opens each loaded family from the PROJECT, reads its lookup tables, writes
  them out as CSV, and closes it again - so a whole set of fittings can be
  checked in one pass instead of one family at a time by hand.

  **OR THE FAMILY IN FRONT, ROW BY ROW (version 2, 2026-11-01).**
  REPORT_FAMILY_SIZE_TABLE, which read the lookup table of the family open in
  the Family Editor, was merged into this card and is DEPRECATED. With a
  family in front this reads it directly: every table it holds named in
  `tableNames`, and one table whole - every row in `rows`, the column headers,
  Revit's own value strings - `tableName` picking it, empty reading the first,
  and a name the family has not got refused with the ones it has, never a
  silent fall back. `exportTo` writes that table as CSV. From a project, when
  `nameContains` narrows to ONE family, its table is read whole the same way.
  It answers "why does this fitting not appear at my size": a size missing
  from the lookup table is silent - Revit inserts nothing, or the wrong
  geometry, and says nothing either way.

  **IT EXISTS BECAUSE A SIZE TABLE IS ONLY REACHABLE FROM INSIDE THE FAMILY.**
  Reading the family in front means opening each one, looking, and closing
  it. A pipe type references eight fitting families,
  and every one of them can carry the same stale table - so doing it by hand
  is eight rounds of the same work and the easiest place to stop early.

  **IT CHANGES NOTHING AND KEEPS NOTHING OPEN.** Each family document is
  closed WITHOUT saving the moment its tables are read. A family left open is
  not a neutral side effect: the next fragment would find it in front and
  answer about the wrong document.

  **A FAMILY THAT REFUSES TO OPEN IS NAMED, NOT SKIPPED.** In-place families
  and some system families cannot be edited, and a silent skip is
  indistinguishable from a family with no table. Both are real answers and
  they are different ones.

  **THE CSV IS THE POINT, NOT THE SUMMARY.** Tables are wide - a reducing tee
  is two keys and three dimensions - and no line of text holds one. The
  summary says which family has which table and how many rows; the files hold
  what is actually in them.

contract:
  needs:
    - name: doc
      type: Document
    - name: app
      type: Application
    # Narrows to families whose NAME contains this. Empty reads every loaded
    # family, which on a real project is a long job. Version 2: optional - left
    # out it binds "none", read as empty - and not read with a family in front.
    - name: nameContains
      type: string
      source: request
      optional: true
      absent: none
    # Folder to write one CSV per table into, named <family>__<table>.csv.
    # Empty reads without writing anything. Version 2: optional, "none" when
    # left out.
    - name: exportFolder
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 2, from REPORT_FAMILY_SIZE_TABLE: which table is read whole,
    # when a family holds more than one. Left out it binds "none", read as
    # empty - the first. A name the family has not got is refused with the
    # ones it has.
    - name: tableName
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 2, from REPORT_FAMILY_SIZE_TABLE: a file path to write the table
    # read whole to, as CSV. Left out it binds "none" and writes nothing. It
    # changes NOTHING in the model - and the exported file is the only place
    # Revit states the header format an import must use.
    - name: exportTo
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: familiesRead
      role: result
      type: int
    - name: tablesFound
      role: result
      type: int
    - name: summary
      # One line per family - its tables and their row counts. A string,
      # because a list is abbreviated to three entries before a reader sees
      # it and eight families would read as three.
      role: result
      type: string
    - name: noTable
      # Families carrying no lookup table at all. A real answer: such a family
      # takes its dimensions from its own parameters, so a size that will not
      # appear is not a table problem there.
      role: result
      type: IList<string>
    - name: leftOpen
      # Families that were ALREADY open when this ran, and so were left open.
      # A document this fragment did not open holds somebody's unsaved work,
      # and closing it discards that work silently - measured 2026-09-16, six
      # corrected families closed and every correction lost.
      role: accounting
      type: IList<string>
    - name: refused
      # Families Revit would not open for editing, named with why. The
      # evidence it looked, never a table it read (D-52).
      role: accounting
      type: IList<string>
    - name: scanned
      # How many families were examined before narrowing. Work DONE, never a
      # thing found (D-52).
      role: accounting
      type: int
    # VERSION 2 (2026-11-01), from REPORT_FAMILY_SIZE_TABLE: ONE table read
    # whole - the family in front's, or the one family `nameContains`
    # narrowed to from a project. Empty when no single family was read.
    - name: tableNames
      # Every table in that family, on one line - a family may hold several
      # and reading the wrong one answers a different question.
      role: result
      type: string
    - name: columnHeaders
      role: result
      type: string
    - name: rows
      # The whole table as text, one row per entry, joined - a list is cut to
      # three entries before a reader sees it, and which sizes are present is
      # a question no summary can answer.
      role: result
      type: string
    - name: rowCount
      role: result
      type: int
    - name: columnCount
      role: result
      type: int
    - name: exportedTo
      # Where that table's CSV was written, empty when none was asked for. A
      # path, not a promise - set only after the export returned.
      role: accounting
      type: string
    - name: notAFamily
      # That the document in front is a project, so the loaded families were
      # read rather than one in front. Never an empty table (D-52).
      role: accounting
      type: bool
    - name: findings
      type: IList<string>


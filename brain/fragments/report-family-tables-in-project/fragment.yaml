revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Document.EditFamily`,
  `Document.Close`, `FamilySizeTableManager.GetFamilySizeTableManager`,
  `GetAllSizeTableNames`, `ExportSizeTable` and `FamilySizeTable.NumberOfRows`
  are present 2020 through 2027, confirmed by reflection on the 2020 assembly
  on 2026-09-15. No number is read or converted here - the CSV carries its own
  units in its header - so the 2021 units move cannot reach it.

# ROUTING - repeated in REPORT_FAMILY_SIZE_TABLE.
#
#   "check every fitting family's sizes" -> here, from the project
#   "read THIS family's table"           -> REPORT_FAMILY_SIZE_TABLE, with the
#                                           family open in front
#   "write a table back"                 -> WRITE_FAMILY_SIZE_TABLE

utterances:
  - check the lookup tables of all the families
  - export every family size table
  - which families have stale size tables
  - read all the fitting tables

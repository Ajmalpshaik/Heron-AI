id: FRG-VIEW-094
semantic-identity: "park the tags down the sides so i can read the drawing"
kind: action
domain: revit.annotation
capability: ARRANGE_TAGS_TO_VIEW_EDGES
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Parks every tag in a column down the left and right edges of the view, each
  still leadered back to its own element. The *"I cannot read the drawing for
  tags"* fix on a busy services plan, where there is no room for tags anywhere
  in the middle.

  **EACH TAG GOES TO THE SIDE ITS OWN ELEMENT IS ON.** Sending them all to one
  edge doubles the leader length and crosses every leader over the drawing.
  Which half of the view the element sits in is the only rule that keeps the
  leaders short.

  **THE ORDER DOWN EACH COLUMN FOLLOWS THE ELEMENTS, NOT THE SET.** Tags are
  placed in the order their elements sit up the view, so the leaders fan out
  without crossing. Any other order produces the same tags in the same places
  with a plate of spaghetti between them.

  **THE MARGIN AND THE GAP ARE PAPER MILLIMETRES.** Both are judged on the
  printed sheet, so both are multiplied by the view scale. A model-distance
  margin puts the tags off the sheet at 1:200 and inside the building at 1:20.

  **IT USES THE CROP WHEN THERE IS ONE.** An uncropped view has no edges to
  park against, so the extent of the tagged elements is used instead and the
  columns sit outside that - which is the same intent and a different number.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: view
      type: View
      source: request
    - name: elements
      type: IList<Element>
    # Paper millimetres from the edge, and between tags in the column.
    - name: marginMm
      type: double
      source: request
    - name: gapMm
      type: double
      source: request
  provides:
    - name: parked
      role: result
      type: int
    - name: perSide
      # How the parked tags were split between the view's edges. A
      # breakdown of the answer, filled in whether anything moved or not.
      role: accounting
      type: IDictionary<string, int>
    - name: usedTagExtent
      # Whether the crop was used or the tagged elements' own extent stood in
      # for it. Which method ran, never a tag it parked (D-52).
      role: accounting
      type: bool
    - name: notTags
      # What was handed in that is not a tag at all. The evidence it
      # looked, never a tag it parked (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>


compatibility-note: >
  A compile-time split at 2022 for the leader end, which became a method taking
  its reference. The crop box, its transform and the view's own right and up
  directions are unchanged 2020 to 2027, and spatial tags are handled in their
  own branch because they share no base with independent tags that carries a
  head position.

# ROUTING - the same rows are in the fragments named here.
#
#   "park the tags at the sides"         -> here
#   "i cannot read the drawing for tags" -> here
#   "stack these tags in one column"     -> STACK_TAGS, at a point you choose.
#                                           This one uses the view's own edges
#                                           and both sides
#   "spread the tags out"                -> ARRANGE_TAGS, which keeps them near
#                                           their elements
#   "which tags overlap"                 -> FIND_OVERLAPPING_TAGS
#   "make the leaders L-shaped"          -> FORCE_TAG_LEADER_LSHAPE
#   "put the tags in a column"           -> STACK_TAGS, at one point you
#                                           choose. This one uses both edges

utterances:
  - park the tags down the sides
  - i cannot read the drawing for tags
  - move the tags to the edge of the view
  - put the tags in columns at the sides

tests: tests/

compatibility-note: >
  One implementation for every release. `UIDocument.GetOpenUIViews()`,
  `UIView.ViewId`, `UIView.Close()`, `UIDocument.ActiveView` and
  `Document.GetElement(ElementId)` are unchanged 2020 to 2027 - checked by
  compiling this fragment against the reference assemblies for all eight.

  `GetOpenUIViews` returns the tabs of THIS UIDocument only. Tabs belonging to
  another open project are not visible here and are not touched.

# ROUTING - cross-referenced in OPEN_VIEW and DELETE_ELEMENTS.
#
#   "close that view"                  -> here. It closes the TAB
#   "close the tabs I am done with"    -> here
#   "tidy up my open views"            -> here
#   "delete that view"                 -> DELETE_ELEMENTS. THAT REMOVES IT FROM
#                                         THE PROJECT. One keystroke apart in a
#                                         chat, a world apart in a model
#   "open the Level 2 plan"            -> OPEN_VIEW
#   "close the project"                -> NOT HERE, AND NOWHERE. Heron does not
#                                         close a model or Revit

utterances:
  - close that view tab
  - close the views I am finished with
  - tidy up my open tabs
  - close all the plans except this one
  - I have too many views open

id: FRG-VIEW-100
semantic-identity: "close the view tabs I have finished with, without losing the views"
kind: action
domain: revit.views
capability: CLOSE_VIEW_TABS
version: 1
source: OFFICIAL
risk: EXECUTE

purpose: >
  Closes open view TABS in the active project. It deletes nothing: the views
  themselves stay in the Project Browser and can be reopened at any time.

  **CLOSING A TAB IS NOT DELETING A VIEW, AND THE WORDING HAS TO CARRY THAT.**
  *"Close the view"* and *"delete the view"* are one keystroke apart in a chat and
  a world apart in a model. This closes tabs only. DELETE_ELEMENTS is what removes
  a view, and it is a different, MODIFY-risk operation on purpose.

  **IT WILL NEVER CLOSE THE LAST OPEN TAB, AND THAT IS THE WHOLE SAFETY OF IT.**
  In Revit, closing the last open view of a project closes the PROJECT - and a
  project very likely has unsaved work in it. A request that would empty the tab
  bar is honoured as far as it safely can be and then stops, with the kept-back
  tab named. Losing somebody's unsaved model to tidy up their tabs is not a
  trade this fragment will make.

  **THE ACTIVE TAB IS THE ONE KEPT BACK** when the request would otherwise close
  everything, because leaving the user looking at the view they were already in
  is the least surprising place to stop.

  **A TAB THAT IS ALREADY CLOSED IS NOT A FAILURE.** It is reported separately
  from the ones that were closed, because "I asked for six and six happened" and
  "I asked for six, four were open" are different facts and merging them hides
  the second.

  Opens no transaction and needs none: it acts on the session, not the building.
  That is why it is EXECUTE rather than MODIFY.

contract:
  needs:
    - name: uidoc
      type: UIDocument
    - name: doc
      type: Document
    # The view names whose tabs should close. Empty closes nothing, deliberately.
    - name: viewNames
      type: IList<string>
      source: request
  provides:
    - name: closed
      role: result
      type: int
    - name: closedNames
      role: result
      type: IList<string>
    - name: notOpen
      # The views asked for that had no tab to close. The evidence it
      # looked and found nothing to do, never a tab it closed.
      role: accounting
      type: IList<string>
    - name: keptBack
      # Tabs deliberately NOT closed, because closing the last view closes
      # the project. A refusal this fragment makes on purpose.
      role: accounting
      type: IList<string>
    - name: remaining
      # How many tabs are still open afterwards. It can NEVER be zero - that
      # is the whole safety rule above - so it cannot be part of an empty
      # answer, and judging it as one made every negative case look full.
      role: accounting
      type: int
    - name: findings
      type: IList<string>


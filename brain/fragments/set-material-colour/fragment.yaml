id: FRG-ELE-061
semantic-identity: "give an existing material its shading colour, and say what it was"
kind: action
domain: revit.elements
capability: SET_MATERIAL_COLOUR
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Sets the SHADING COLOUR of a material that already exists, and reports the
  colour it had before. The "this pipe draws grey and that one draws copper"
  job, which CREATE_MATERIAL could only solve by making a second material
  nobody asked for.

  **A MATERIAL WITH NO COLOUR IS NOT AN ERROR ANYWHERE.** Revit gives a new
  material a default grey and draws it without complaint, so a run of pipe
  that should read as copper reads as nothing in particular and the model
  looks finished. Nothing reports it, which is why somebody has to ask.

  **IT REPORTS THE OLD COLOUR, BECAUSE THAT IS THE EVIDENCE.** "Set to
  184,115,51" is true of a material that was already that colour and of one
  that was grey, and those are different facts. The before and after are both
  reported so the difference is visible rather than assumed.

  **SHADING COLOUR IS NOT THE APPEARANCE ASSET.** This sets what a shaded or
  consistent-colours view draws - the Graphics tab. The Appearance tab, which
  a rendering uses, is a separate asset this does not touch, and saying so is
  what stops a render being blamed on this.

  **A NAME THAT MATCHES NOTHING RETURNS THE NEAR MISSES** rather than creating
  anything. Making a material here would leave a second one beside the one
  that was meant, and nothing pointing at it.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: materialName
      type: string
      source: request
    - name: colour
      type: Color
      source: request
  provides:
    - name: changed
      role: result
      type: int
    - name: wasColour
      # The colour it had before, as text. The evidence that something moved -
      # "set to X" alone is true whether or not anything changed.
      role: result
      type: string
    - name: nowColour
      role: result
      type: string
    - name: alreadyThat
      # It was already the colour asked for, so nothing was done. The evidence
      # it looked, never a change it made (D-52).
      role: accounting
      type: bool
    - name: nearMisses
      # Material names that nearly matched when the one named was not found.
      role: accounting
      type: IList<string>
    - name: findings
      type: IList<string>

proof:
  date: '2026-09-16'

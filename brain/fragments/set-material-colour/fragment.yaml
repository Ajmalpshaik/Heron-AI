  fingerprint: 7e11fbefd70acbe2

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Material`, `Material.Color` and
  `Color.Red/Green/Blue` are unchanged 2020 through 2027. A colour is three
  bytes and names no unit, so the 2021 units move cannot reach it.

# ROUTING - repeated in CREATE_MATERIAL.
#
#   "this pipe has no colour"        -> here, on the material the segment uses
#   "make a new material"            -> CREATE_MATERIAL
#   "what material is this element"  -> READ_ELEMENT_MATERIAL
#   "swap one material for another"  -> REPLACE_MATERIAL

utterances:
  - set the material colour
  - this material has no colour
  - make the copper material look copper
  - change the shading colour of a material

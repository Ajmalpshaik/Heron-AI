    3 item(s) [1 material(s) recoloured; was 128,0,0, now 200,120,60, ''Copper'': 128,0,0
    -> 200,120,60, This is the SHADING colour, which a shaded or consistent-col...], nearMisses
    0 item(s), nowColour 200,120,60, wanted Copper, wasColour 128,0,0. inputs came materialName

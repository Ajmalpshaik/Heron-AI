    changed 0, findings 2 item(s) [0 material(s) recoloured; was <not read>, now <not read>,
    No material is called 'ZZZNOTAMATERIAL'. Nothing came close ...], nearMisses 0 item(s),
    nowColour , wanted ZZZNOTAMATERIAL, wasColour . inputs came materialName as given; colour
    as given. on PIPE
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as

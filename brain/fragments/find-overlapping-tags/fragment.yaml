# VERSION 2 (2026-11-16) - TAGS OVER THE DRAWING TOO, and back to DRAFT.
# FRAGMENT-ISSUES row 5b-1731 (Sruthina, Revit 2024, model `villa 2`,
# Ajmalpshaik/Heron-AI#854 item b): "0 clash(es)" on a plan where nearly every
# door and window tag sat on the cut wall - version 1 compared annotation with
# annotation only, and its answer did not say so. WIDENED HERE RATHER THAN A
# CARD OF ITS OWN: the row left the owner that choice, and the job is the same
# one - what prints on top of what in this view - so a second card would split
# one question in two. Each tag's paper box is now also compared with the
# WALLS a plan shows (a band the wall's width wide about its centre, never in a
# section, where the location line is not where the cut is drawn), MODEL AND
# DETAIL LINES (a line crossing the box), and the FIGURE of each DIMENSION (the
# point it is placed at, inside the box - never the dimension's whole-string
# box, which is why version 1 left them out). A tag's own element is never its
# clash. A door or window opening is inside a wall's band, and a wall shown
# below the plan's cut is compared too - a tag across either is counted.
# Counted in `overModel`, the ids in `overlapping`; `annotationOnly`
# true is version 1 exactly. The first finding names what was compared, every
# time. Version 1 was PROVEN (the proof block below, kept as the record of
# what it proved); its C# moved, so it is DRAFT again until NEEDS-CHECKING
# Group OC is run (D-30) - on the owner's word of 2026-11-11 that a fragment
# found wrong may be changed even though it is proven.

purpose: >
  Finds annotation that PRINTS ON TOP OF other annotation in one view - tag over
  tag, text over a symbol, a keynote buried under a room tag. The drawing check
  that catches what nobody sees on screen at 200% and everybody sees on the
  printed A1. Read-only; it moves nothing.

  **It measures in paper millimetres, which is the only unit this question has.**
  Whether two tags clash depends entirely on the scale the view prints at - the
  same two tags are clear at 1:50 and merged at 1:200. Every figure here is
  converted through the view's own scale, so the answer is what comes out of the
  plotter rather than what the model happens to look like.

  **It projects onto the view's own paper axes, not onto world X and Y.** The
  earlier library compared model X against model Y, which is right in a plan and
  wrong in every section and elevation - a view looking along X has all its
  annotation at one X, so every box overlaps every other and the report is
  worthless exactly where a section is busiest. The boxes are projected onto the
  view's right and up directions instead, which is the same test in a plan and
  the correct one everywhere else.

  **Touching is not overlapping**, and how much counts is asked for. Two boxes
  sharing an edge are legible; two sharing half their area are not.

  **A bounding box is bigger than the ink**, so this over-reports slightly and
  says so. Two boxes can overlap while the visible characters do not touch. The
  opposite error costs a reissued drawing; this one costs thirty seconds of
  looking.

  **Tags over the drawing are found too (version 2)** - a door or window tag
  sitting on the wall poche in a plan, a tag a model or detail line runs
  through, a tag over a dimension's figure. A dimension is judged by where its
  figure sits, never by its box, which is the whole string, witness lines and
  all, and would overlap almost everything inside its own extent.

contract:
  needs:
    - name: doc
      type: Document
    - name: view
      type: View
      source: request
    - name: minOverlapMm
      type: double
      source: request
    - name: annotationOnly
      # VERSION 2. True compares annotation with annotation only - version 1
      # exactly. Left out it is false (the add-in binds an absent optional
      # bool false), and each tag is also compared with walls in a plan,
      # lines and dimension figures.
      type: bool
      source: request
      optional: true
  provides:
    - name: findings
      type: IList<string>
    - name: overlapping
      role: result
      type: IList<ElementId>
    - name: pairs
      role: result
      type: int
    - name: overModel
      # VERSION 2 (row 5b-1731). Tags over a wall's poche in a plan, crossed
      # by a model or detail line, or over a dimension's figure - each once
      # per thing it is over. A thing it found, so a result.
      role: result
      type: int
    - name: noBox
      # Tags with no bounding box, so it could not be tested for overlap. The
      # evidence it looked, never a thing it found (D-52).
      role: accounting
      type: int


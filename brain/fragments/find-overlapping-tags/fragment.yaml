compatibility-note: >
  One implementation for every release. `Element.get_BoundingBox(View)`,
  `View.Scale`, `View.IsTemplate`, `View.RightDirection`, `View.UpDirection`,
  `IndependentTag` and `TextElement.Text` are all present 2020 through 2027 -
  read off the reference assemblies at both ends rather than remembered. Room,
  space and area tags are collected BY CATEGORY rather than by class, because
  which of them is an `IndependentTag` subclass has moved between releases and
  a category sweep is the same on all of them.

# WHAT IT CANNOT SEE. Annotation overlapping a MODEL line, a hatch or a linked
# view's graphics is not found - this compares annotation against annotation.
# And a view placed on two sheets prints at whatever each viewport carries; the
# VIEW's own scale is used here, which is the usual case and not always the one.

# ROUTING - repeated in TAG_ELEMENTS_IN_VIEW and FIND_UNTAGGED_ELEMENTS.
#
#   "the tags are on top of each other" -> here
#   "check the drawing for clashing
#    annotation"                        -> here
#   "the text is overlapping"           -> here
#   "tag these ducts"                   -> TAG_ELEMENTS_IN_VIEW - it PLACES
#                                          tags, and must not answer a request
#                                          to check ones already there
#   "what is untagged"                  -> FIND_UNTAGGED_ELEMENTS - the
#                                          opposite problem, missing annotation
#   "move the tags apart"               -> ARRANGE_TAGS. That row said nothing
#                                          in the library did this, which was
#                                          true until ARRANGE_TAGS was written.
#                                          This one says which ones clash and
#                                          moves nothing
#   "find the lines drawn on top of each other" -> FIND_OVERLAPPING_LINES
#   "what are these tags pointing at"    -> REPORT_TAGS_AND_TARGETS,
#                                           including targets inside a link.
#                                           This one is about where tags SIT
#   "check the tags before I issue this" -> REPORT_TAGS_AND_TARGETS
#   "spread the tags out"                -> ARRANGE_TAGS, which MOVES them.
#                                           This one reports and changes
#                                           nothing, which is why it owns the
#                                           bare complaint

utterances:
  - the tags are on top of each other
  - the text is overlapping
  - check this view for clashing annotation
  - the annotation is all on top of itself
  - tags overlapping on this sheet
  - check the tags before i issue this

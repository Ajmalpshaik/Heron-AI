id: FRG-VIEW-035
semantic-identity: "the tags are printing on top of each other in this view"
kind: filter
domain: revit.views
capability: FIND_OVERLAPPING_TAGS
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Finds annotation that PRINTS ON TOP OF other annotation in one view - tag over
  tag, text over a symbol, a keynote buried under a room tag. The drawing check
  that catches what nobody sees on screen at 200% and everybody sees on the
  printed A1. Read-only; it moves nothing.

  **It measures in paper millimetres, which is the only unit this question has.**
  Whether two tags clash depends entirely on the scale the view prints at - the
  same two tags are clear at 1:50 and merged at 1:200. Every figure here is
  converted through the view's own scale, so the answer is what comes out of the
  plotter rather than what the model happens to look like.

  **It projects onto the view's own paper axes, not onto world X and Y.** The
  earlier library compared model X against model Y, which is right in a plan and
  wrong in every section and elevation - a view looking along X has all its
  annotation at one X, so every box overlaps every other and the report is
  worthless exactly where a section is busiest. The boxes are projected onto the
  view's right and up directions instead, which is the same test in a plan and
  the correct one everywhere else.

  **Touching is not overlapping**, and how much counts is asked for. Two boxes
  sharing an edge are legible; two sharing half their area are not.

  **A bounding box is bigger than the ink**, so this over-reports slightly and
  says so. Two boxes can overlap while the visible characters do not touch. The
  opposite error costs a reissued drawing; this one costs thirty seconds of
  looking.

  **Dimensions are not compared, on purpose.** A dimension's box is the whole
  string, witness lines and all, so it appears to overlap almost everything
  inside its own extent - included, it produces hundreds of rows that are all
  the same non-finding. A dimension genuinely clashing with a tag is found by
  eye on the sheet, not here.


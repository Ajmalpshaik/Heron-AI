id: FRG-MEP-102
semantic-identity: "make a new drafting view and draw one duct or pipe system on it in single lines, from its source to every terminal, each run labelled with Revit's own size, flow and pressure drop"

# WHY IT EXISTS - a comment, not `purpose`, because `purpose` is searched.
# 2026-11-08: the owner's ask, docs/48-studying-bimlogiq.md section 5 item 5 -
# "3D to 2D MEP schematic - one system traced, drawn as single lines on a
# drafting view, with sizes, flow and pressure drop" - and his "yes start item
# 5". Measured that day on a scratch store (lexical and model, no release
# filter): nothing in the library drew a schematic; "draw a schematic of supply
# air system SA-01" reached CREATE_MEP_SYSTEM or READ_MEP_SYSTEM, "3D to 2D
# schematic" SET_DATUM_EXTENT_TYPE.
#
# WHY ONE CARD DOES TRACE, LAYOUT AND DRAWING (the owner's design). A traced
# network handed out through revit_read is no use to a second step: the add-in
# hands a list back as its count and its first three items, and a chat's values
# lose their line breaks. So the whole job is one C# script, in one call, one
# undo.
#
# HOW IT RELATES TO THE CARDS IT OVERLAPS - none was edited, not even a routing
# row (FRAGMENT-ISSUES row 5b-1479):
#   TRACE_CONNECTIVITY (FRG-MEP-001, DRAFT v2) walks connectors from one element
#     and reports what it reaches - a READ. This walks the same connectors, but
#     inside one system's own element sets, as a tree, and draws it. Its walk
#     is re-authored here, not called: a fragment cannot call another.
#   REPORT_MEP_PRESSURE_DROP (FRG-MEP-028, PROVEN v2) reads Revit's sections
#     and the critical path - a READ. Its lesson is used: an uncalculated
#     system reports zero, so SectionsCount is asked first and "not
#     calculated" is said, never 0.
#   CREATE_DRAFTING_VIEW (FRG-VIEW-026, PROVEN), CREATE_TEXT_NOTE (FRG-VIEW-022,
#     PROVEN v2) and DRAW_FAMILY_DETAIL_LINES (FRG-VIEW-119, PROVEN v2) each do
#     one of the three drawing steps on what they are handed. Their API routes
#     are re-authored here. Widening any of them would send it back to DRAFT
#     and out of revit_change (D-117), so this is a card of its own.
#   The trace-system skill (DRAFT) is TRACE_CONNECTIVITY's plan and stays so.
#   docs/48 also named brain/heron_graph.py as a base: that file is the graph
#     of FRAGMENTS (which card feeds which), not of ducts - nothing of it is
#     used here, and row 5b-1479 says so.
# Planned once this is PROVEN: heron-duplicate-checker on this card and
# TRACE_CONNECTIVITY, whose walk could then be one shared lesson; the drawing
# cards stay, each a one-step job.
#
# EVERY VALUE IS THE MODELLER'S (D-33):
#   systemName   the system by its name, as the System Browser shows it -
#                exactly, ignoring case, or the ONE system whose name contains
#                it (said in findings). Several, or none: refused, nothing drawn
#   start        an element on the system - "selected" for the one selected in
#                Revit. Left out with a name, the base equipment is the root.
#                Given alone, its system is drawn from it; on several systems
#                it needs systemName too
#   newViewName  the new drafting view's name. Left out, "Schematic - <system>".
#                A name already taken gets " (2)", " (3)" ... - an existing view
#                is never touched
#   viewScale    the new view's scale, 100 for 1:100, from 1 to 500 - above, it
#                is refused. Left out, 100. It decides how big a paper
#                millimetre is in the view, nothing else - the drawing is NOT to
#                scale. A drawing that would reach more than 1500 m from the
#                view's origin at this scale is refused before the view is made.
#                A scale Revit will not take (a template on the view type can
#                fix it) is read back, drawn at, and said
#   spacingMm    PAPER millimetres between things on one side of a run, and the
#                shortest segment drawn. Left out, 10
#   textType     a text type by name, for every label. Left out, the project's
#                default text type - never the first one loaded. Its height and
#                width factor size the gaps
#   maxElements  the most elements the system may hold. Left out, 2000. Above
#                it the call is refused, in words, before anything is made
#
# WHAT A TERMINAL IS - THE OWNER'S DECISION (2026-11-08): an air terminal, a
# plumbing fixture, a sprinkler - OR any mechanical equipment that is neither
# the root nor the system's base equipment. On a chilled or hot water system
# the fan coils and air handlers are where it ends: they are drawn with the
# terminal's circle, carry their Mark, and are counted in `terminals`. The
# chiller, boiler or air handler feeding the system is equipment.
#
# THE ROOT: `start`, else the base equipment. Either one JOINED TO NOTHING by
# its connectors (assigned to the system in Revit, never connected) gives way
# to equipment with joints, then an element with one joint - said in findings.
# When no element of the system has any joint, it refuses, before the view is
# made: there is no network to draw.
#
# THE VIEW TYPE: a Drafting view type with no default template where there is
# one, so the scale asked for is the scale drawn at.
#
# RISK MODIFY. It makes one drafting view and the detail lines and text notes
# in it. NOTHING IN THE 3D MODEL IS CHANGED - the system is only read. It
# deletes nothing but the view it has just made, when Revit refuses that view's
# name.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16). The
# executor makes the call one TransactionGroup: one undo takes the view and the
# whole drawing away.
kind: action
domain: revit.mep
capability: DRAW_MEP_SCHEMATIC
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Makes a new drafting view and draws one duct or pipe system on it in
  single lines, in one call and one undo. Its connectors are followed from
  the source equipment, or from the element handed in, out to every
  terminal, and the result is laid out as a tidy orthogonal tree - the main run
  straight across, branches square to it on alternating sides, not to scale.
  Each straight segment is labelled with the size, flow and pressure drop
  Revit itself holds, never figures of Heron's own; equipment and terminals
  carry their Mark or type name. Open ends and loops are marked on the drawing
  and listed. The 3D model is left exactly as it was.

contract:
  needs:
    - name: doc
      type: Document
    # The system by name. Left out ("none"), the system of `start`.
    - name: systemName
      type: string
      source: request
      optional: true
      absent: none
    # An element on the system - "selected" for the one selected in Revit.
    # Absent binds null (HeronBindingNote.AbsentValue).
    - name: start
      type: Element
      source: request
      optional: true
    # The new view's name. Left out ("none"), "Schematic - <system>".
    - name: newViewName
      type: string
      source: request
      optional: true
      absent: none
    # The new view's scale, 100 for 1:100. Left out, 100.
    - name: viewScale
      type: int
      source: request
      optional: true
      absent: 100
    # PAPER millimetres between things on one side of a run, and the shortest
    # segment. Left out, 10.
    - name: spacingMm
      type: double
      source: request
      optional: true
      absent: 10
    # A text type by name. Left out ("none"), the project's default text type.
    - name: textType
      type: string
      source: request
      optional: true
      absent: none
    # The most elements the system may hold to be drawn. Left out, 2000.
    - name: maxElements
      type: int
      source: request
      optional: true
      absent: 2000
  provides:
    - name: viewId
      # The new drafting view. Null when refused.
      role: result
      type: ElementId
    - name: viewName
      # The new view's name as made - with its suffix, if the name asked for
      # was taken (D-52).
      role: accounting
      type: string
    - name: nodes
      # Schematic nodes drawn - the root, equipment, terminals, junctions, ends,
      # open ends and loop ends (D-52).
      role: accounting
      type: int
    - name: segments
      # Labelled segments drawn - a change of size starts a new one (D-52).
      role: accounting
      type: int
    - name: terminals
      # Air terminals, plumbing fixtures and sprinklers drawn, and mechanical
      # equipment the system serves - neither the root nor the base equipment,
      # such as the fan coils on a chilled water loop (D-52).
      role: accounting
      type: int
    - name: openEnds
      # Runs, fittings and accessories with an END connector joined to
      # nothing - found, never made (D-52).
      role: accounting
      type: IList<ElementId>
    - name: loopsCut
      # One line per loop: its tag on the drawing and the two elements of the
      # joint drawn as two ends (D-52).
      role: accounting
      type: IList<string>
    - name: skipped
      # Elements of the system left out of the drawing (D-52).
      role: accounting
      type: IList<ElementId>
    - name: skippedWhy
      # One line per reason with a count, adding up to `skipped` (D-52).
      role: accounting
      type: IList<string>
    - name: labelsWithoutValue
      # One line per segment Revit holds no flow or no pressure drop for - "not
      # calculated" where Revit has not calculated the system; per segment with
      # a fitting or accessory holding 0 (left out of its Δp); and per stretch
      # of fittings only, which gets no label at all (D-52).
      role: accounting
      type: IList<string>
    - name: refused
      # Why nothing was drawn at all, in plain words. Empty when it ran (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>


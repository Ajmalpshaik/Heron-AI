compatibility-note: >
  One implementation for every release, with ONE version branch, in one
  adapter (formatPressure): a sum of pressure drops is formatted by
  UnitFormatUtils.Format(Units, UnitType, double, bool, bool) on Revit 2020 -
  UnitType is 2020-2021 and gone at 2022 - and by
  UnitFormatUtils.Format(Units, ForgeTypeId, double, bool) with
  SpecTypeId.HvacPressure or PipingPressure from 2021, read with
  tools/api-surface --members on 2026-11-08. The other members, present with
  these signatures 2020 through 2027 by the same reading: MEPSystem.Elements,
  BaseEquipment, MechanicalSystem.DuctNetwork, PipingSystem.PipingNetwork,
  MEPCurve.MEPSystem and ConnectorManager, MEPModel.ConnectorManager,
  Connector.AllRefs, Owner, ConnectorType, Domain and MEPSystem, the
  ConnectorType and Domain enums, ViewFamilyType.DefaultTemplateId,
  ViewDrafting.Create, TextNote.Create(
  Document, ElementId, XYZ, string, TextNoteOptions), TextNoteOptions with
  HorizontalAlignment and VerticalAlignment, ElementTypeGroup.TextNoteType,
  Document.GetDefaultElementTypeId, ItemFactoryBase.NewDetailCurve,
  Line.CreateBound, Arc.Create(XYZ, double, double, double, XYZ, XYZ),
  Document.GetUnits, Document.Delete, Parameter.HasValue,
  Element.GetTypeId, and BuiltInParameter RBS_CALCULATED_SIZE,
  RBS_DUCT_FLOW_PARAM, RBS_PIPE_FLOW_PARAM, RBS_PRESSURE_DROP,
  RBS_PIPE_PRESSUREDROP_PARAM, ALL_MODEL_MARK, TEXT_SIZE and TEXT_WIDTH_SCALE.
  SectionsCount is read as REPORT_MEP_PRESSURE_DROP (PROVEN) reads it.
  OST_PlumbingEquipment is 2023 on, so it is parsed by name at run time.
  Categories are compared as ElementIds and elements are ordered by UniqueId -
  no ElementId is read as a number, so 2024's 64-bit ids do not reach this
  code. Paper millimetres become model feet by the view scale / 304.8 (D-20).

# ROUTING (2026-11-08) - which card wins which sentence. The cards named here
# were not edited, so these rows are written here and in row 5b-1479.
#
#   "draw a schematic of supply air system SA-01"     -> here
#   "draw a schematic of the system of the selected   -> here
#    element"
#   "3D to 2D schematic" / "3D to 2D MEP schematic"   -> here
#   "show me the schematic for SA-01"                 -> a READ that finds the
#   "is there already a schematic of this system"        view - NOT here. OPEN:
#                                                        both reach this card on
#                                                        the model backend
#                                                        (lexical:
#                                                        SET_VIEW_UNDERLAY and
#                                                        EDIT_MEP_SYSTEM, both
#                                                        writes) - see below
#   "trace this system" / "what connects to what" /   -> TRACE_CONNECTIVITY - a
#    "where does this run go"                            READ: what it reaches,
#                                                        drawn nowhere
#   "what is the pressure drop in this duct run" /    -> REPORT_MEP_PRESSURE_DROP
#    "which is the critical path"                        - a READ, which must never
#                                                        be answered by drawing
#   "how fast is the air moving"                      -> MEASURE_MEP_VELOCITY - a
#                                                        read
#   "what system is this on"                          -> READ_MEP_SYSTEM - a read
#   "select everything on this system"                -> SELECT_BY_MEP_SYSTEM - a
#                                                        read
#   "make a drafting view"                            -> CREATE_DRAFTING_VIEW - an
#                                                        empty view
#   "add a text note"                                 -> CREATE_TEXT_NOTE
#   "draw a detail line here"                         -> DRAW_FAMILY_DETAIL_LINES
#   "create a duct system for this equipment"         -> CREATE_MEP_SYSTEM
#   "draw a duct placeholder from here to here"       -> CREATE_MEP_PLACEHOLDER -
#                                                        a single-line run IN
#                                                        THE MODEL, not a drawing
# Questions about a system's flows, sizes, terminals or open ends are reads,
# and none was claimed for this card. Measured before and after it was written
# (row 5b-1479, lexical and model): none of them reaches it - TWO EXCEPTIONS,
# OPEN: "is there already a schematic of this system" and "show me the
# schematic for SA-01" reach this card on the model backend (lexical:
# EDIT_MEP_SYSTEM and SET_VIEW_UNDERLAY - writes, as before this card
# existed). Both carry this card's defining word, and no read card declares
# them. Two rewordings of identity and purpose did not move the first; the
# owner's own utterances were not weakened.
# A CONDITION FOR PROMOTION TO PROVEN, NOT A LATER NOTE: a READ card that
# finds views (FIND_VIEWS, or one like it) owns the "is there already a
# schematic" and "show me the schematic" questions, in the owner's own words,
# before this card is signed - so that asking to see a schematic never draws
# a new one (row 5b-1479, NEEDS-CHECKING Group MW).
# MET 2026-11-09: FIND_VIEWS declares both questions, and both reach it on
# lexical and model (row 5b-1479). The OPEN notes above are history.
#
# WORDINGS CHANGED BEFORE THIS WAS WRITTEN: a purpose saying "the system is
# traced" sent TRACE_CONNECTIVITY's "trace this system" here on check-routing's
# ranked route, and the utterance "3D to 2D MEP schematic" sent FRG-ELE-001's
# "all the mep in this view" here; the purpose now says "its connectors are
# followed", and the utterance is the owner's section 2 wording.

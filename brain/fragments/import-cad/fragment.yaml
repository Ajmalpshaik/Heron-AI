compatibility-note: >
  One implementation for every release. Document.Import with DWGImportOptions
  and DGNImportOptions (Placement and ThisViewOnly on BaseImportOptions) and
  ImportPlacement are present 2020 through 2027 - read off RevitAPI.xml in the
  Nice3point reference packages for all eight releases on 2026-10-12.

# ROUTING - the same rows are in the fragments named here.
#
#   "import this dwg into the family plan as an underlay" -> here
#   "link the cad drawings"                   -> LINK_FILES
#   "turn this cad into model geometry"       -> CONVERT_CAD_TO_DIRECTSHAPE

utterances:
  - import this dwg into the family plan as an underlay
  - bring the manufacturer's drawing into the front elevation
  - import these cad drawings into this view only
  - put the cad underlay in the reference level plan

compatibility-note: >
  One implementation for every release. Floor.SpanDirectionAngle (double,
  get and set, radians), Floor.GetSpanDirectionSymbolIds, Floor.FloorType,
  Grid.Curve, Grid.IsCurved, MultiSegmentGrid, ReferencePlane.BubbleEnd and
  FreeEnd, CurveElement.GeometryCurve, Line.Direction, Parameter.AsInteger and
  BuiltInParameter.FLOOR_PARAM_IS_STRUCTURAL and FLOOR_PARAM_SPAN_DIRECTION carry
  the same signatures 2020 through 2027 - read with tools/api-surface --members
  on 2026-11-01. No ElementId is built from a number or read as one.

# ROUTING (2026-11-01) - the same rows are in PLACE_SPAN_DIRECTION_SYMBOLS.
#
# MEASURED 2026-11-01 through heron_retrieve.find on two scratch stores, one
# built from the tree before these two cards and one after, no Revit filter,
# `model` backend: every declared utterance and every routing-table sentence in
# the library reaches the card it reached before. On the keyword route alone
# "set out the structural grid" (CREATE_GRIDS' own) now ranks this card
# first; the host answers it by identity, so CREATE_GRIDS keeps it.
#
# A QUESTION RANKS HERE, AND THIS WRITES. "what is the span direction of this
# slab" and its like, declared nowhere, reached other writes before these cards
# (PLACE_AREA_REINFORCEMENT, CREATE_PARTS, CREATE_FOUNDATION_SLAB) and reach
# one of these two after. With the host's question:true (D-128) they reach a
# read instead - never either card - but a read that does not answer them: no
# card in the library reports a floor's span direction. Recorded for the owner
# (FRAGMENT-ISSUES 5b-1369), not repaired by declaring words nobody said.
#
# REPAIRED 2026-11-01 by REPORT_FLOOR_SPAN_DIRECTION (FRG-ELE-141), a read that
# reports each floor's span direction and its symbols and declares "what is the
# span direction of this slab" and "which way does this floor span" - this
# card's own words untouched (FRAGMENT-ISSUES 5b-1369, FIXED).
#
#   "set the span direction of this slab   -> here, along "grid 1"
#    to run along grid 1"
#   "change the floor span to 90 degrees"  -> here, angleDegrees 90
#   "what is the span direction of this    -> REPORT_FLOOR_SPAN_DIRECTION -
#    slab"                                    a question, and this writes
#   "which way does this floor span"       -> REPORT_FLOOR_SPAN_DIRECTION
#   "add span direction symbols to these   -> PLACE_SPAN_DIRECTION_SYMBOLS -
#    slabs in this plan"                      draws the symbol, turns nothing
#   "rotate these floors 90 degrees"       -> ROTATE_ELEMENTS - turns the floor
#                                             itself, outline and all
#   "make a floor"                         -> CREATE_FLOOR
#   "add a low point to this floor"        -> EDIT_SLAB_SHAPE
#   "set out the structural grid"          -> CREATE_GRIDS - draws grids; a
#                                             span only runs along one
utterances:
  - set the span direction of this slab to run along grid 1
  - change the floor span to 90 degrees

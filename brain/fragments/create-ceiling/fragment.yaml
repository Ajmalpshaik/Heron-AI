compatibility-note: >
  ONE implementation across a range where the method does not exist at one end.
  `Ceiling.Create(Document, IList<CurveLoop>, ElementId, ElementId)` is present
  from Revit 2022; the reference assemblies show no `Ceiling.Create` at all on
  2020 - checked, not remembered. Naming it in source would fail to compile on
  2020, so it is looked up by name at run time and its absence is reported as an
  answer. `Level.ProjectElevation`, `CurveLoop.Create`, `Line.CreateBound` and
  `BuiltInParameter.CEILING_HEIGHTABOVELEVEL_PARAM` are present 2020 through
  2027.

# THE CEILING TYPE IS TAKEN AS AN Element, NOT A CeilingType. `CeilingType` is a
# real class on every release, but the reflection call wants only its id, and
# accepting the base type keeps the caller free to resolve it however it likes.
# The category is checked instead, so a wall type handed in by mistake is
# refused rather than producing something strange.

# ROUTING - repeated in MEASURE_CEILING_HEIGHT and READ_CEILING_GRID.
#
#   "make a ceiling over this area"  -> here
#   "add a ceiling to this room"     -> here
#   "how high is the ceiling"        -> MEASURE_CEILING_HEIGHT - a READ, and it
#                                       must not answer a request to build one
#   "where is the ceiling grid"      -> READ_CEILING_GRID
#   "will this duct clear the
#    ceiling"                        -> CHECK_MINIMUM_CLEARANCE, once a ceiling
#                                       exists for it to clear
#   "make a floor slab over this area" -> CREATE_FLOOR - the other flat thing,
#                                       and the one the ceiling hangs under
#   "put a ceiling in every room"        -> CREATE_FROM_ROOM_BOUNDARIES,
#                                           which takes the shape from the
#                                           room and leaves its shafts open.
#                                           This one takes one typed loop

utterances:
  - make a ceiling over this area
  - add a ceiling to this room
  - create a ceiling
  - draw the ceiling in here
  - put a ceiling at 2700
  - model the ceiling for this room

id: FRG-ELE-028
semantic-identity: "make a ceiling over this area"
kind: action
domain: revit.elements
capability: CREATE_CEILING
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Creates a ceiling from a closed boundary on one level, at a height above it.
  The element every MEP coordination question is asked against - what clears
  it, what sits above it, what the room's finished height really is.

  **`Ceiling.Create` arrived in Revit 2022 and this fragment still runs on
  2020**, because the method is reached by name at run time rather than
  written down. On 2020 it says plainly that the release cannot make a ceiling
  and what to do instead - draw one by hand, Architecture then Ceiling - which
  is a different thing from failing.

  **The earlier library recorded this job as impossible and it was not.** The
  API fact was right; the sentence left the version off, so "Ceiling.Create
  only exists from 2022" was read as "ceilings cannot be made" and the
  capability sat unbuilt while two of the three installed Revits could do it.
  **An impossibility with no version on it becomes a lie the day another
  release is installed**, which is worth more than this fragment.

  **The base height comes from the level's PROJECT elevation, not its
  elevation.** Every XYZ the API takes is project-internal, while `Elevation`
  is measured from whatever the level type's Elevation Base says. On a model
  set out to a survey datum the two differ, and using the wrong one puts the
  ceiling at the wrong height with no error at all.

  **The boundary closes itself** - the last point joins back to the first -
  and it must not cross itself. A self-crossing loop is refused by Revit, and
  that refusal is reported rather than swallowed.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: level
      type: Level
      source: request
    - name: ceilingType
      type: CeilingType
      source: request
    # Internal units. The loop closes itself, so the last point is not repeated.
    - name: boundary
      type: IList<XYZ>
      source: request
    - name: heightAboveLevel
      type: double
      source: request
  provides:
    - name: created
      role: result
      type: ElementId
    - name: findings
      type: IList<string>


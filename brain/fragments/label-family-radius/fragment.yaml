id: FRG-GEO-045
semantic-identity: "tie the radius or diameter of a round family form, inside its sketch, or of a 2D arc drawn as a detail or symbolic line, to a length parameter"
kind: action
domain: revit.families
capability: LABEL_FAMILY_RADIUS
# Version 5 (2026-10-22, row 5b-1318) changed impl/: the revolve route reads
# and checks both references of its straight dimension before Revit is asked.
# On Revit 2020 (session 78736, the owner's floor drain families) that route
# threw Revit's own "Invalid number of references" three times - from a made
# plane in an elevation and from a template plane in a plan - while the
# extrusion route labelled three sketched circles in the same session. Version
# 5 refuses, naming which of the two references is missing (not given, or
# naming no element or the wrong one) and the release; says each one's kind
# without refusing on it; never lets Revit's words out alone; and when Revit
# refuses with both in hand asks again with each read back from its written
# form so the answer names the one it would not take. Version 4's proof below
# no longer describes the code: DRAFT until NEEDS-CHECKING Group IS proves
# version 5 (D-30).
# Still version 5, never signed: on 2026-10-24 Group IS's IS6 measured on
# Revit 2020 that the ring route (a circle centre's distance from the axis)
# moved three other forms with the plane it made; the ring is refused until
# that is understood (row 5b-1333).
# VERSION 6 (2026-11-11, row 5b-1503) - A 2D ARC TOO, and DRAFT. Version 5
# was PROVEN on 2026-10-24 (the proof block below, kept as the record of what
# it proved: an extrusion's sketched circle labelled "Shaft Radius", a
# revolve with no plane through its axis refused); its C# moved, so it is
# DRAFT again until NEEDS-CHECKING Group NF is run (D-30, D-117). A family's
# plan symbol drawn as detail or symbolic lines had no tool to put its arc's
# radius on a parameter - CREATE_RADIAL_DIMENSION refuses a family. Version 6
# takes a detail or symbolic line that is an arc, by its id, and labels a
# radial (or diameter) dimension on it in its own view through
# `FamilyItemFactory.NewRadialDimension` / `NewDiameterDimension`, in the same
# safety order: the parameter already holds the arc's size, one label per
# parameter, read back. Forms take exactly the path they took. Owner's yes to
# widen rather than add a card: Ajmal PS, 2026-11-11.
version: 6
source: OFFICIAL
risk: MODIFY

purpose: >
  LABELS the round size of a form in the family open in the Family Editor with
  a length parameter, so the parameter drives it: a duct neck's diameter, a
  pipe stub's size, a bell's radius. The dimension goes INSIDE THE FORM'S
  SKETCH, where Edit Extrusion or Edit Revolve shows it - the way a modeller
  does it by hand. LABEL_FAMILY_DIMENSION is the straight distance between two
  planes; this is the round size.

  **ON THE SKETCH, NEVER ON THE FINISHED EDGE.** Version 1 labelled the
  finished form's round edge. Revit accepted the label and the circle ignored
  it: on 2026-10-03 the stem of a gate valve in Family1 (Revit 2024) read 8 mm
  with its parameter at 14, and FLEX_FAMILY refused (row 5b-305, NEEDS-CHECKING
  BM3). A dimension on the sketch's own curve drove the form at 300 and at
  40 mm the same evening - on a form made in that run and on one made days
  before - so a form already built can be labelled now.

  **TWO KINDS OF ROUND SIZE.** An EXTRUSION's circle: a radial or diameter
  dimension on a sketched arc of that radius. A REVOLVE's radius: a straight
  dimension, in the sketch, from a REFERENCE PLANE the axis lies on to the
  profile line running alongside the axis, with the axis locked to that plane.
  Measured from the revolve's own axis line, Revit moved the axis and the
  revolve broke, so a revolve with no plane through its axis is refused - make
  one with CREATE_REFERENCE_PLANES first. A distance from the axis is a
  radius: give it a radius parameter whose formula halves the diameter. Other
  forms are refused.

  **A TORUS - A REVOLVE WHOSE PROFILE IS A CIRCLE - HAS TWO MORE** (version 3,
  row 5b-306). The TUBE: the circle's own radius or diameter, labelled on its
  sketched arc as an extrusion's is. The RING: the circle centre's distance
  from the axis, labelled the way a modeller does it by hand - from the plane
  the axis lies on to a reference plane through the circle's centre, with the
  centre locked to that plane. The plane is made, named after the parameter,
  when the family has none. A plane already labelled with the same parameter
  is used as it is, not refused as a second label. A dimension straight to the
  centre point is refused by Revit, so it is never tried. Measured 2026-10-03
  on scratch families: a tube from 40 to 80 and 10, a ring from 200 to 400
  and 60. When one value is more than one size of the revolve, the call is
  refused and the label is left for Edit Revolve. THE RING IS HELD BACK since
  2026-10-24 (row 5b-1333): on Revit 2020 a ring labelled this way moved
  three OTHER forms with its plane at the first flex, so the ring is refused
  and left for Edit Revolve; the tube is still labelled.

  **A SWEPT BLEND HAS THREE** (version 4, 2026-10-07, for a coil spring's
  half-turns). Its PATH's arc radius, with the arc's centre locked to the
  planes through it; every PROFILE circle's own radius or diameter, a half
  circle's arc included; and a profile circle CENTRE's height off the path's
  plane - a coil's rise - from the level or plane the path is on to a plane
  through the centre, made and named after the parameter, the centre locked
  to it. One parameter may label the same kind of size on several swept
  blends; a rise reuses its plane. Measured on scratch families: radius 40 to
  60 and 25, wire 5 to 8 and 3, rise 15 to 30 and 6, each followed.
  Proved again 2026-10-07 on scratch SpringProof, signed by Ajmal PS.

  **BOTH REFERENCES ARE CHECKED BEFORE REVIT IS ASKED** (version 5,
  2026-10-22, row 5b-1318). On Revit 2020 the revolve route threw Revit's
  own "Invalid number of references" three times in the owner's floor drain
  families - a trap's two outlet sockets and a floor-based host's end disc,
  in an elevation and in a plan, from a made plane and from a template one -
  while the extrusion route labelled three sketched circles in the same
  session. Revit says that when one of the two references it is handed is
  not one it will measure to. Version 5 reads the plane's reference and the
  profile line's (or the centre plane's) before the call - that each exists
  and names the element it should - and refuses in one sentence naming
  which one is missing and the release when one is not; each reference's
  kind is read and said (a surface for a plane, a line for a sketch curve
  are what a straight dimension is expected to take), but a kind other than
  that is a note, not a refusal - which kinds Revit takes is Revit's to say.
  When Revit refuses the dimension with both in hand, it is asked again
  with each reference read back from its written form, so the answer names
  the one Revit would not take as first read; and the sentence that reaches
  the modeller is Heron's, counting the tries made, with Revit's words after
  it in quotes, never Revit's alone. A labelled call's answer says what was
  read of both. Which reference it is on 2020 is NOT known: NEEDS-CHECKING
  Group IS asks Revit, on 2020 and again on 2024. The extrusion and swept
  blend routes are untouched.

  **A 2D ARC TOO** (version 6, 2026-11-11) - a DETAIL or SYMBOLIC line that
  is an arc, named by its id: a plan symbol's round end, a detail item's
  curved arrow. A radial dimension - a diameter one for a diameter parameter
  - goes on the arc itself in the arc's own view: a detail line's Owner View;
  a symbolic line's Owner View where Revit gives one, else the plan or
  elevation looking straight at the plane it is drawn on. The same rules as
  a form's: the parameter must already hold the arc's size, one label per
  parameter, and the label, the value and the arc's own radius are read back.
  A straight line is refused - it has no radius; its planes are labelled by
  LABEL_FAMILY_DIMENSION.

  **ONE FAMILY RESIZES WITH THE PIPE SIZE.** With the round sizes labelled,
  one body follows Nominal Diameter through formulas, instead of one shape set
  per size switched on and off.

  **THE PARAMETER MUST ALREADY HOLD THE SIZE.** A label moves the geometry to
  the parameter's value - a new length reads zero - so the curve labelled is
  the one whose size the parameter already holds (half of it, for a diameter),
  and a form with none is refused, listing the sizes it has.

  **ONE LABEL PER PARAMETER**, as LABEL_FAMILY_DIMENSION: a second dimension
  driving the same parameter fights the first.

  **THE FORM IS NAMED BY ITS ID** - the one its form tool gave back - or
  SELECTED in the family's window and called `selected`.

  **ALL OR NOTHING, READ BACK** after Revit regenerates: the dimension must
  carry the parameter and read its value. FLEX_FAMILY at two different sizes
  shows the form following.

  **A FAMILY'S DIMENSION BELONGS TO NO VIEW** (row 5b-1572, measured 2026-11-12
  on Revit 2020): the label on a 2D arc reads back with no Owner View, and that
  is right; one in ANOTHER view is refused. Kept and flexed: a detail arc
  labelled "Arc Radius" followed it from 150 to 200 mm.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: uidoc
      type: UIDocument
    # The round form, by the id its form tool gave back, or `selected`.
    # Version 6: a detail or symbolic line that is an arc, by the id its draw
    # tool gave back, too.
    - name: form
      type: string
      source: request
    # The length parameter to label with - "Neck Diameter". It must already
    # hold the size: SET_FAMILY_TYPE_VALUES first.
    - name: parameterName
      type: string
      source: request
    # true for a diameter dimension, false for a radius. A distance from a
    # revolve's axis, or a swept blend profile's height off its path, takes a
    # radius only; a circle's own size or a swept blend's path takes either.
    - name: diameter
      type: bool
      source: request
  provides:
    - name: labelled
      # The dimension made, read back: radius or diameter, the edge's centre,
      # the parameter, the view and the value it reads.
      role: result
      type: string
    - name: valueMm
      # What the labelled dimension reads after the write, in millimetres.
      role: result
      type: double
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing was labelled, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


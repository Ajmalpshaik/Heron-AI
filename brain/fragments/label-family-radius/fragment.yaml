compatibility-note: >
  `FamilyItemFactory.NewRadialDimension(view, arcRef, origin)`,
  `NewDiameterDimension(view, arcRef, origin)`, `NewDimension(view, line,
  references)` and `NewAlignment(view, reference, reference)`,
  `Dimension.FamilyLabel`, `Dimension.Value`, `Sketch.Profile`,
  `Sketch.SketchPlane`, `Revolution.Axis`, `ReferencePlane.GetPlane()`,
  `Curve.Reference`, `CurveElement.CenterPointReference`,
  `Reference.ConvertToStableRepresentation` / `ParseFromStableRepresentation`,
  `FamilyItemFactory.NewReferencePlane` and `Dimension.References` read the
  same 2020 through 2027 (the RevitAPI reference
  assemblies, read 2026-10-01 and 2026-10-03), and so do version 4's
  `SweptBlend.PathSketch`, `BottomSketch` and `TopSketch`,
  `Level.GetPlaneReference()` and `Dimension.DimensionShape` (read
  2026-10-07). No `SketchEditScope` is used -
  it exists only from 2022 and refuses a family document. A parameter's kind is
  read by reflection, because it moved at 2022. Version 5's
  `Reference.ElementReferenceType`, `Reference.ConvertToStableRepresentation`,
  `Reference.ParseFromStableRepresentation`, `Curve.Reference` and
  `ReferencePlane.GetReference()` read the same 2020 through 2027 (the
  reference assemblies, read 2026-10-22 with `tools/api-surface --members`),
  and `GetReference()` is the only way to a plane's reference on every
  release - no `Reference` property exists on any of them; `Sketch.GetAllElements()`
  exists from 2022 only and is not used. So no call changed between Revit
  2024, where the revolve route was proved, and 2020, where it threw: the
  difference is in what Revit makes of the two references, which only a run
  on 2020 can read - NEEDS-CHECKING Group IS. Version 6's
  `FamilyItemFactory.NewRadialDimension(View, Reference, XYZ)` and
  `NewDiameterDimension(View, Reference, XYZ)`, `CurveElement.GeometryCurve`
  and `SketchPlane`, `Element.OwnerViewId`, `Arc.Radius`, `Center`,
  `XDirection`, `Curve.IsBound`, `View.SketchPlane` and `ViewDirection` read
  the same 2020 through 2027 (`tools/api-surface --members --inherited`,
  2026-11-11).

# ROUTING - see SET_FAMILY_SETTINGS for the whole family-building table.
#
#   "label the neck diameter with Neck Diameter"   -> here
#   "drive the radius of this cylinder by Radius"  -> here
#   "label the swept blend's path arc radius"      -> here, version 4
#   "make Pitch drive the rise of the swept blend" -> here, version 4
#   "label the arc's radius with Arc Radius"       -> here, version 6 - a
#                                                     detail or symbolic arc
#   "label the width with the Width parameter"     -> LABEL_FAMILY_DIMENSION
#   "put a radial dimension on this arc"           -> CREATE_RADIAL_DIMENSION,
#                                                     a project annotation

utterances:
  - label the neck diameter with Neck Diameter
  - drive the radius of this cylinder by Radius
  - make the circle size parametric
  - label the diameter of this round form
  - tie the cylinder radius to a parameter
  - make the revolve radius follow a parameter
  - make this round family resize with the pipe size
  - label the tube diameter of this torus
  - make the rim ring radius follow a parameter
  - label the swept blend's path arc radius
  - label each profile circle's radius of the swept blend
  - make Pitch drive the rise of the swept blend
  - label the arc's radius with Arc Radius

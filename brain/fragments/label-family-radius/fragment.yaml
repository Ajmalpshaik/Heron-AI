id: FRG-GEO-045
semantic-identity: "tie the radius or diameter of a round family form to a length parameter, inside its sketch"
kind: action
domain: revit.families
capability: LABEL_FAMILY_RADIUS
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  LABELS the round size of a form in the family open in the Family Editor with
  a length parameter, so the parameter drives it: a duct neck's diameter, a
  pipe stub's size, a bell's radius. The dimension goes INSIDE THE FORM'S
  SKETCH, where Edit Extrusion or Edit Revolve shows it - the way a modeller
  does it by hand. LABEL_FAMILY_DIMENSION is the straight distance between two
  planes; this is the round size.

  **ON THE SKETCH, NEVER ON THE FINISHED EDGE.** Version 1 labelled the
  finished form's round edge. Revit accepted the label and the circle ignored
  it: on 2026-10-03 the stem of a gate valve in Family1 (Revit 2024) read 8 mm
  with its parameter at 14, and FLEX_FAMILY refused (row 5b-305, NEEDS-CHECKING
  BM3). A dimension on the sketch's own curve drove the form at 300 and at
  40 mm the same evening - on a form made in that run and on one made days
  before - so a form already built can be labelled now.

  **TWO KINDS OF ROUND SIZE.** An EXTRUSION's circle: a radial or diameter
  dimension on a sketched arc of that radius. A REVOLVE's radius: a straight
  dimension, in the sketch, from a REFERENCE PLANE the axis lies on to the
  profile line running alongside the axis, with the axis locked to that plane.
  Measured from the revolve's own axis line, Revit moved the axis and the
  revolve broke, so a revolve with no plane through its axis is refused - make
  one with CREATE_REFERENCE_PLANES first. A revolve's size is a radius: give
  it a radius parameter whose formula halves the diameter. Other forms are
  refused.

  **ONE FAMILY RESIZES WITH THE PIPE SIZE.** With the round sizes labelled,
  one body follows Nominal Diameter through formulas, instead of one shape set
  per size switched on and off.

  **THE PARAMETER MUST ALREADY HOLD THE SIZE.** A label moves the geometry to
  the parameter's value - a new length reads zero - so the curve labelled is
  the one whose size the parameter already holds (half of it, for a diameter),
  and a form with none is refused, listing the sizes it has.

  **ONE LABEL PER PARAMETER**, as LABEL_FAMILY_DIMENSION: a second dimension
  driving the same parameter fights the first.

  **THE FORM IS NAMED BY ITS ID** - the one its form tool gave back - or
  SELECTED in the family's window and called `selected`.

  **ALL OR NOTHING, READ BACK** after Revit regenerates: the dimension must
  carry the parameter and read its value. FLEX_FAMILY at two different sizes
  shows the form following.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: uidoc
      type: UIDocument
    # The round form, by the id its form tool gave back, or `selected`.
    - name: form
      type: string
      source: request
    # The length parameter to label with - "Neck Diameter". It must already
    # hold the size: SET_FAMILY_TYPE_VALUES first.
    - name: parameterName
      type: string
      source: request
    # true for a diameter dimension, false for a radius. A revolve takes a
    # radius only.
    - name: diameter
      type: bool
      source: request
  provides:
    - name: labelled
      # The dimension made, read back: radius or diameter, the edge's centre,
      # the parameter, the view and the value it reads.
      role: result
      type: string
    - name: valueMm
      # What the labelled dimension reads after the write, in millimetres.
      role: result
      type: double
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing was labelled, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


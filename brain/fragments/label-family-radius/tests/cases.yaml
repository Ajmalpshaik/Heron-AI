positive:
  - given: >
      a new family from the metric Generic Model template; length type
      parameters "Pipe Diameter" 100 and "Bell Radius" 60 in type "DN100"; a
      solid extrusion "circle 0,0 50" on Ref. Level from 0 to 200, and a solid
      revolve "0,300; 60,300; 60,500; 0,500" about "0,300 0,500" on
      Center (Front/Back), both made by their form tools; form = the
      extrusion's id, parameterName "Pipe Diameter", diameter true
    expect: >
      a diameter dimension INSIDE the extrusion's sketch, labelled "Pipe
      Diameter" and reading 100 mm, valueMm 100; then FLEX_FAMILY with
      "Pipe Diameter=300 | Pipe Diameter=40" and the cylinder MEASURED 300 and
      40 across. Ran 2026-10-03, Revit 2024, scratch Family2, rolled back: the
      family 300 deep at 300, the label read 100

  - given: the same family, form = the revolve's id, "Bell Radius", diameter false
    expect: >
      a straight dimension in the revolve's sketch from "Center (Left/Right)"
      to the profile line 60 mm out, labelled "Bell Radius", the axis locked
      to that plane; FLEX_FAMILY "Bell Radius=300 | Bell Radius=40" and the
      revolve MEASURED 600 and 80 across. Ran 2026-10-03, rolled back: the
      family 600 deep at 300

  - given: an extrusion built in an earlier session, its circle 26 mm across, a parameter holding 26
    expect: >
      labelled the same way and followed by the flex - a form already built
      can be labelled. Measured 2026-10-03 on Family1's valve stem (300 and 40)

  - given: >
      a new metric Generic Model family; length parameters "Tube Diameter" 40
      and "Ring Radius" 200; a solid revolve "circle 200,0 20" about
      "0,-100 0,100" on Center (Front/Back) - a torus; form = its id, "Tube
      Diameter", diameter true
    expect: >
      a diameter dimension on the profile circle's arc, inside the revolve's
      sketch, reading 40 mm; FLEX_FAMILY "Tube Diameter=80" MEASURED 480 x 480
      x 80 mm. Ran 2026-10-03, scratch Family7, kept there, flex rolled back

  - given: the same torus, "Ring Radius", diameter false, no plane through the circle's centre
    expect: >
      a reference plane "Ring Radius" made through the circle's centre, the
      centre locked to it, the axis locked to "Center (Left/Right)", and the
      dimension between the two planes labelled "Ring Radius" reading 200;
      FLEX_FAMILY "Ring Radius=400" MEASURED 840 across, "Ring Radius=60" 160,
      and "Tube Diameter=10; Ring Radius=150" 310. Ran 2026-10-03, scratch Family7

  - given: >
      the same torus with a plane "Rim Centre" at X 200 already labelled from
      "Center (Left/Right)" with "Ring Radius" by LABEL_FAMILY_DIMENSION -
      Family4's rim as built by hand
    expect: >
      that dimension used as it is - "already labelled" - and the circle's
      centre locked to "Rim Centre"; FLEX_FAMILY 400 and 60 MEASURED 840 and
      160. The ring had followed at those sizes before the lock as well. Ran
      2026-10-03, scratch Family8

  - given: >
      version 4, a SWEPT BLEND. A new metric Generic Model family; length type
      parameters "Mean Radius" 40, "Wire Radius" 5, "Half Pitch" 15; a solid
      swept blend on Ref. Level, path "40,0; arc 0,40 -40,0", bottom "circle
      0,0 5", top "circle 0,15 5" - a coil's half-turn; form = its id,
      "Mean Radius", diameter false
    expect: >
      a radial dimension on the path arc in the Ref. Level plan, labelled
      "Mean Radius" reading 40, the arc's centre locked to Center (Left/Right)
      and Center (Front/Back). Ran 2026-10-07, scratch SpringProbe, kept there;
      a flex to 60 and 25 moved the arc's ends and both profiles with it

  - given: the same half-turn, "Wire Radius", diameter false
    expect: >
      two radial dimensions, one on each profile's circle, both labelled
      "Wire Radius" reading 5. Ran 2026-10-07, SpringProbe

  - given: the same half-turn, "Half Pitch", diameter false
    expect: >
      a reference plane "Half Pitch" made through the top circle's centre,
      parallel to Ref. Level, the centre locked to it, and a dimension from
      Ref. Level to it labelled "Half Pitch" reading 15. FLEX_FAMILY "Mean
      Radius=60; Wire Radius=8; Pitch=50 | Mean Radius=25; Wire Radius=3;
      Pitch=12" (Half Pitch = Pitch / 2) MEASURED 136 x 68 x 41 and 56 x
      26.63 x 12 mm. Ran 2026-10-07, SpringProbe, the flex rolled back

  - given: >
      a second half-turn, "-40,0; arc 0,-40 40,0", bottom "circle 0,15 5" top
      "circle 0,30 5", with the first already labelled; "Half Pitch" again
    expect: >
      the plane "Half Pitch" and its dimension used as they are, the bottom
      circle's centre locked to it - "already labelled ... used as it is";
      "Mean Radius" and "Wire Radius" labelled on this one too, beside the
      first's. Ran 2026-10-07 building TRG_Spring_One Turn

  - given: >
      version 5, the fault's own case (row 5b-1318), on Revit 2020. A new
      metric Generic Model family; a length instance parameter "Outlet
      Radius" 41; a horizontal reference plane "Outlet Axis" at Z -140 made
      in the Front elevation; a solid revolve "56,-140; 56,-99; 118,-99;
      118,-140" about "56,-140 118,-140" on Center (Front/Back) - the floor
      drain trap's outlet socket; form = its id, "Outlet Radius", diameter
      false
    expect: >
      EITHER a straight dimension in the revolve's sketch from "Outlet Axis"
      to the profile line 41 mm out, labelled "Outlet Radius" reading 41,
      the axis locked to the plane, and a finding "Its two references, read
      on Revit 2020 before the dimension was asked for: the plane "Outlet
      Axis" gave a surface reference (...); the profile line gave a linear
      reference (...)" - then FLEX_FAMILY "Outlet Radius=60 | Outlet
      Radius=30" and the revolve MEASURED 120 and 60 across; OR nothing
      labelled, in Heron's own sentence naming the plane or the profile line
      and "Revit 2020", with Revit's words after it in quotes - never "Revit
      refused to label ... Invalid number of references" alone. Whichever,
      copied whole: it is the finding. NOT RUN - NEEDS-CHECKING Group IS,
      IS1

  - given: >
      version 5, the same family on Revit 2020, "Outlet Disc Radius" 41; a
      solid revolve sketched on the horizontal plane "Outlet Axis", profile
      X,Y "170,0; 172,0; 172,41; 170,41" about "170,0 172,0" - the floor
      based host's end disc, which the tool dimensions from Center
      (Front/Back) in the Ref. Level plan
    expect: the same two outcomes as the case above, copied whole. NOT RUN - IS3

  - given: version 5, the "Bell Radius" revolve of the second case, on Revit 2020 and again on 2024
    expect: >
      labelled from "Center (Left/Right)" 60 mm out as version 4 did on 2024,
      and the flex 600 and 80 across - the checks let a working pair through.
      If version 5 REFUSES on 2024 what version 4 labelled there, the check's
      reading of the reference kinds is wrong, not Revit: narrow it, reopen
      row 5b-1318. NOT RUN - IS4, IS5

negative:
  - given: a revolve about "1000,300 1000,500" - no reference plane runs through its axis
    expect: >
      refused as no reference plane through the axis, naming
      CREATE_REFERENCE_PLANES, and nothing labelled. Ran 2026-10-03, rolled back

  - given: the parameter "Pipe Diameter" holding 250 while the cylinder is 100 across
    expect: refused as no sketched circle of radius 125 mm, listing the radius 50, and nothing labelled

  - given: the revolve with diameter true
    expect: refused as a revolve's size being a radius, naming the halving formula

  - given: parameterName "Pipe Diameter" while it already labels a dimension
    expect: refused as already labelling one, and nothing labelled

  - given: a project in front
    expect: notAFamily true and nothing labelled anywhere

  - given: the torus, "Tube Diameter" (40) with diameter false
    expect: >
      refused - nothing in the profile is 40 mm: the circle's radius 20 and its
      centre 200 from the axis listed - and nothing labelled. Ran 2026-10-03,
      scratch Family8, rolled back

  - given: a torus whose circle's radius equals its centre's distance from the axis
    expect: refused as more than one size of the revolve, naming Edit Revolve, and nothing labelled

  - given: the swept blend half-turn, a parameter holding 22 - no size of it is 22
    expect: >
      refused - its path radius 40, its circles' radii 5 and their centres 15
      off the path's plane listed - and nothing labelled

  - given: a half-turn whose top circle stands 5 off the path, "Wire Radius" holding 5
    expect: refused as more than one size of the swept blend, and nothing labelled

  - given: the parameter "Half Pitch" while it already labels a straight dimension between two other planes
    expect: refused as already labelling another dimension, and nothing labelled

  - given: >
      version 5: a revolve whose plane's reference, or whose profile line's,
      is MISSING on the release in front - not given at all, naming no
      element, or naming another element than the plane or a sketch line
    expect: >
      refused before Revit is asked, in one sentence naming WHICH of the two
      and the release ("On Revit 2020 the profile line gives no reference a
      straight dimension can measure to ..."), what was read of both with
      each one's kind, and Edit Revolve; nothing labelled, nothing locked,
      nothing in Undo. A reference of an unexpected KIND is said, never
      refused - Revit decides. Revit's "Invalid number of references" never
      reaches the modeller alone: when Revit refuses with both references in
      hand, Heron's sentence counts the tries made (as read, then each read
      back from its written form), names both references as read with their
      kinds, whether the axis was locked, and Revit's words in quotes after
      it. NOT RUN - Group IS reads which outcome 2020 gives

second_route:
  - >
      A swept blend by hand: Edit Swept Blend, Edit Profile on each end shows
      the radial dimensions and the locked centre; Family Types to another
      Pitch and the half-turn measured with the Measure tool in the front
      elevation
  - >
      By hand on the same family: Edit Extrusion shows the diameter dimension
      in the sketch, labelled "Pipe Diameter"; Family Types to 300 and the
      cylinder measured 300 across with the Measure tool

compatibility-note: >
  One implementation for every release. Every DuctSettings and PipeSettings
  member REPORT_MECHANICAL_SETTINGS names is 2020 to 2027 with one signature
  and a setter, read off tools/api-surface --members for all eight releases on
  2026-11-02, except air viscosity: AirViscosity 2020-2024 (obsolete in 2025)
  and AirDynamicViscosity 2025 on, behind `#if REVIT2025_OR_GREATER`. Density
  and viscosity go through UnitUtils.ConvertToInternalUnits /
  ConvertFromInternalUnits - DisplayUnitType on 2020 (`#if REVIT2020`),
  UnitTypeId KilogramsPerCubicMeter and PascalSeconds from 2021. NOT KNOWN
  FROM THE ASSEMBLIES and measured in NEEDS-CHECKING Group MM: that the
  fitting and rise/drop annotation sizes are held in feet, so that / 304.8
  writes what the dialog then shows; and Revit's words for a value it will
  not take.

# ROUTING (2026-11-02) - the same rows are in REPORT_MECHANICAL_SETTINGS.
#
#   "set the connector separator"                -> here - which page is asked
#                                                   when `system` names none
#   "set the air density and viscosity"          -> here, air density and air
#                                                   dynamic viscosity
#   "read the mechanical settings"               -> REPORT_MECHANICAL_SETTINGS - a question goes to the read (D-86)
#   "what duct sizes are available for round ducts"
#                                                -> REPORT_DUCT_CONDUIT_SIZES - the size lists
#
# WHAT MOVED: see NEEDS-CHECKING Group MM.
utterances:
  - set the connector separator
  - set the air density and viscosity

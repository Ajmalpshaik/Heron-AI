id: FRG-MEP-030
semantic-identity: "every duct and pipe on one system, or on one kind of system"
kind: filter
domain: revit.mep
capability: SELECT_BY_MEP_SYSTEM
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Gathers the ducts, pipes and their fittings that belong to one MEP system -
  either one named run, or every run of one system type - as a set the next
  fragment can act on.

  **System NAME and system TYPE are different questions, and this fragment
  makes the caller say which.** The type is the classification: Supply Air,
  Domestic Cold Water, or whatever short code the project renamed it to. The
  name is the particular run: `SA 1`, `DXS 2`. Several separately named systems
  share one type, which is exactly the difference somebody is checking when
  they ask. Guessing between them would answer a different question than the
  one asked and look identical - the same decision READ_MEP_SYSTEM makes for a
  single element, and CREATE_ELECTRICAL_RUN makes between tray and conduit.

  **They are read from different parameters, and getting that wrong is silent.**
  The name is on `RBS_SYSTEM_NAME_PARAM`. The type is an ElementId-valued
  parameter pointing at the system type element, so it is read through its
  display name - which is where a project's short code actually lives. Reading
  the name parameter first and falling back to the type never reaches the
  fallback, because the name parameter is present on nearly every duct and
  pipe: the fragment then matches names while reporting types.

  **The four categories are gathered in ONE pass, not united.** Uniting four
  collectors is the obvious shape and it has a trap in it:
  `FilteredElementCollector.UnionWith` does not carry each side's own quick
  filters into the merged result, so an instances-only filter applied per side
  is silently lost and TYPE elements land in the answer beside real ones -
  measured at 52 returned where 4 were right, every extra one a type. Taking
  all four categories in a single multi-category filter cannot have the
  problem, so the knowledge is kept here and the hazard is not.

  **Matching is a contains, because that is how these are named.** A project
  types `DXS` and means every `DXS 1`, `DXS 2`, `DXS 3`.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, every loaded link is read too and
  `linksSearched` says how many were: set and 0 means "you asked, and none
  are loaded", which is a different answer from host-only. The same system match runs on each link's
  own ducts and pipes, and its matches are counted per link in
  `linkedMatches`.
  **NOTHING FROM A LINK IS EVER SELECTED OR CARRIED** - `elements` stays this model's own; the chain
  revives ids against this model, and a linked id that happens to be in
  use here binds an unrelated element (FRAGMENT-ISSUES row 75). Links
  nested inside a link are not read, and are counted in the answer. This
  is version 2; version 1's proof no longer describes the code, and the
  fragment is DRAFT until it is proved again.

contract:
  needs:
    - name: doc
      type: Document
    - name: matchOn
      type: string
      source: request
    - name: systemText
      type: string
      source: request
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: withoutSystem
      # Elements carrying no system at all. The evidence it looked;
      # `elements` is the answer (D-52).
      role: accounting
      type: int
    - name: findings
      type: IList<string>
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then one line per link. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75).
      role: accounting
      type: IList<string>


compatibility-note: >
  One implementation for every release. `BuiltInParameter.RBS_SYSTEM_NAME_PARAM`,
  `RBS_PIPING_SYSTEM_TYPE_PARAM` and `RBS_DUCT_SYSTEM_TYPE_PARAM` are present
  2020 through 2027, compiled at both ends. The system type parameter holds an
  ElementId and is read through `AsValueString` - never as a number, which is
  what would have made 2024's 64-bit ids matter here. Categories go to
  `ElementMulticategoryFilter` as BuiltInCategory values.

# ROUTING - repeated in READ_MEP_SYSTEM, TRACE_CONNECTIVITY and
# FIND_SYSTEM_ISLANDS.
#
#   "select everything on DXS 1"     -> here, matching the NAME
#   "all the supply air"             -> here, matching the TYPE
#   "show only the supply ducts
#    in it"                          -> SET_SCHEDULE_FILTERS. That is a
#                                       schedule being narrowed, not a set of
#                                       elements being gathered - this fragment
#                                       takes the sentence on keywords alone
#                                       and should not
#   "show me the chilled water"      -> here, matching the TYPE
#   "what system is this duct on"    -> READ_MEP_SYSTEM - one element, both its
#                                       name and its type, not a sweep
#   "what connects to what"          -> TRACE_CONNECTIVITY - the geometry side.
#                                       This is the data side, and a duct can
#                                       carry a system name while being
#                                       physically disconnected
#   "which bits are orphaned"        -> FIND_SYSTEM_ISLANDS. An element with no
#                                       system at all is counted here but not
#                                       diagnosed here
#   "rename this system"             -> not this one. This only reads
#   "all the ductwork"                   -> SELECT_BY_CATEGORIES, when the
#                                           categories are what is meant
#                                           rather than one named system

utterances:
  - select everything on this system
  - find all the supply air ductwork
  - all the supply air
  - show me the chilled water pipes
  - select every duct on DXS 1
  - filter by mep system

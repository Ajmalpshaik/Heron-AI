id: FRG-VIEW-138
semantic-identity: "put a detail component or an annotation symbol on this view at these points"
kind: action
domain: revit.annotation
capability: PLACE_DETAIL_COMPONENTS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Places a detail component - a detail item family - or an annotation symbol
  - a generic annotation such as a north arrow or a fire-rating symbol - on
  one view, once at each point given, turned if an angle is given.

  **THESE FAMILIES BELONG TO A VIEW, NOT TO A LEVEL.** PLACE_FAMILY_INSTANCES
  places model families on a level and cannot place one of these at all; a
  detail item or a symbol exists only in the view it was drawn in. So the view
  is asked for, and a family that is NOT view-based is refused by name and
  pointed at PLACE_FAMILY_INSTANCES.

  **A 3D VIEW OR A TEMPLATE IS REFUSED.** Revit draws neither kind in a 3D
  view, and a view template holds no elements.

  **The points are on the view's own plane, in millimetres.** On a plan that is
  X and Y; a drafting view is the same.

  ASSUMES AN OPEN TRANSACTION (Golden Rule 16). One operation is one undo
  entry, and the caller owns it.

contract:
  needs:
    - name: doc
      type: Document
    - name: view
      type: View
      source: request
    # The detail item or generic annotation type - "Family: Type".
    - name: symbol
      type: FamilySymbol
      source: request
    - name: points
      type: IList<XYZ>
      source: request
    # Turned about the view's direction, anticlockwise, in degrees. 0 - not turned.
    - name: rotationDegrees
      type: double
      source: request
  provides:
    - name: placed
      role: result
      type: IList<Element>
    - name: refused
      role: accounting
      type: IList<string>
    - name: findings
      type: IList<string>


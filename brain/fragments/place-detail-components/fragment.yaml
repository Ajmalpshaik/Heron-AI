semantic-identity: "put a detail component or an annotation symbol on this view at these points, in a project or in a family's own view"
kind: action
domain: revit.annotation
capability: PLACE_DETAIL_COMPONENTS
version: 2
source: OFFICIAL
risk: MODIFY

# VERSION 2 (2026-11-11) - IN A FAMILY'S OWN VIEW TOO, READ BACK, and back to
# DRAFT. Version 1 was PROVEN on 2026-10-18 (the proof block below, kept as
# the record of what it proved: a project's plan, and a 3D view refused); its
# C# moved, so it is DRAFT again until NEEDS-CHECKING Group NF is run (D-30,
# D-117). On 2026-11-11 (Revit 2020) the owner's square diffuser family needed
# its plan flow arrows - a nested 600 mm detail item - and no tool placed a
# view-based family inside a family: this card called `doc.Create`, a
# project's factory, and PLACE_FAMILY_INSTANCES' nested branch takes only
# work plane-based and level-based families. Version 2 calls
# `doc.FamilyCreate`'s view overload in a family, reads every one placed back
# (exists, Owner View, point, type) on BOTH paths, and leaves `instanceId` and
# `instanceIds`. Owner's yes to widen rather than add a card: Ajmal PS,
# 2026-11-11. FRAGMENT-ISSUES row 5b-1499.

purpose: >
  Places a detail component - a detail item family - or an annotation symbol
  - a generic annotation such as a north arrow or a fire-rating symbol - on
  one view, once at each point given, turned if an angle is given.

  **THESE FAMILIES BELONG TO A VIEW, NOT TO A LEVEL.** PLACE_FAMILY_INSTANCES
  places model families on a level and cannot place one of these at all; a
  detail item or a symbol exists only in the view it was drawn in. So the view
  is asked for, and a family that is NOT view-based is refused by name and
  pointed at PLACE_FAMILY_INSTANCES.

  **IN A FAMILY TOO** (version 2, 2026-11-11). With a family open in the
  Family Editor, a detail item or a generic annotation LOADED INTO THE FAMILY
  - a diffuser's flow arrows - is placed in one of the family's own views, as
  Detail Component and Symbol do by hand: in the Ref. Level plan it shows in a
  project's plans only. The points are millimetres from the family's origin.
  The first one's id comes back as `instanceId`, for
  LOCK_NESTED_FAMILY_TO_PLANES to lock it to the family's planes and
  ARRAY_FAMILY_FORMS to array it.

  **READ BACK, ALL OR NOTHING** (version 2): each one placed is read again -
  it exists, its Owner View is the view asked for, its insertion point is
  where asked (half a millimetre, in the view's plane) and its type is the
  one asked. One that does not read so fails the call; nothing is kept.

  **A 3D VIEW OR A TEMPLATE IS REFUSED.** Revit draws neither kind in a 3D
  view, and a view template holds no elements.

  **The points are on the view's own plane, in millimetres.** On a plan that is
  X and Y; a drafting view is the same.

  **MEASURED 2026-11-12, REVIT 2020 (row 5b-1573):** inside a family, Revit
  reports a nested Detail Items family WorkPlaneBased and refuses it in a view
  ("its FamilyPlacementType is not ViewBased"), though the same file places as
  one in a project. So in a family only a type Revit reports ViewBased there is
  placed here; any other is refused up front with what Revit reports and the
  route that works: PLACE_FAMILY_INSTANCES on the level, then
  LOCK_NESTED_FAMILY_TO_PLANES, which locks it in the plan of its level. A
  family of category Detail Items or Generic Annotations counts as view-based
  in a project whatever placement type Revit reports.

  ASSUMES AN OPEN TRANSACTION (Golden Rule 16). One operation is one undo
  entry, and the caller owns it.

contract:
  needs:
    - name: doc
      type: Document
    - name: view
      type: View
      source: request
    # The detail item or generic annotation type - "Family: Type".
    - name: symbol
      type: FamilySymbol
      source: request
    - name: points
      type: IList<XYZ>
      source: request
    # Turned about the view's direction, anticlockwise, in degrees. 0 - not turned.
    - name: rotationDegrees
      type: double
      source: request
  provides:
    - name: placed
      role: result
      type: IList<Element>
    - name: instanceId
      # VERSION 2: the first one placed, by its unique id - the same kind of
      # id PLACE_FAMILY_INSTANCES' nested branch leaves, which
      # LOCK_NESTED_FAMILY_TO_PLANES and ARRAY_FAMILY_FORMS take. Empty when
      # nothing was placed.
      role: result
      type: string
    - name: instanceIds
      # VERSION 2: every one placed, by unique id, commas between, in the
      # order of the points. Empty when nothing was placed.
      role: result
      type: string
    - name: refused
      role: accounting
      type: IList<string>
    - name: findings
      type: IList<string>


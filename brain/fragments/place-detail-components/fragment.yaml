compatibility-note: >
  One implementation for every release. `Create.NewFamilyInstance(XYZ,
  FamilySymbol, View)`, `Family.FamilyPlacementType`, `FamilySymbol.IsActive`
  / `Activate` and `ElementTransformUtils.RotateElement` are present 2020
  through 2027, read with tools/api-surface on 2026-10-14. PLACE_FLOW_ARROWS
  already places view-based annotation through the same call. Version 2's
  `FamilyItemFactory`'s inherited `ItemFactoryBase.NewFamilyInstance(XYZ,
  FamilySymbol, View)`, `Document.IsFamilyDocument`, `Element.OwnerViewId`,
  `Element.GetTypeId`, `LocationPoint.Point`, `View.RightDirection` /
  `UpDirection` and `ElementId.InvalidElementId` are present 2020 through
  2027 (`tools/api-surface --members --inherited`, 2026-11-11).

# ROUTING - the same rows are in PLACE_FAMILY_INSTANCES and PLACE_FLOW_ARROWS.
#
#   "put the north arrow on this plan"      -> here
#   "add a detail component here"           -> here
#   "place the flow arrow in the family on Ref. Level" -> PLACE_FAMILY_INSTANCES,
#                                              then LOCK_NESTED_FAMILY_TO_PLANES.
#                                              MEASURED 2026-11-12 (Group NF, NF2,
#                                              row 5b-1573): inside a family Revit
#                                              2020 reports a nested detail item
#                                              WorkPlaneBased and refuses it in a
#                                              view - this card says so and names
#                                              that route
#   "put the motor family into this air handler" -> PLACE_FAMILY_INSTANCES
#   "place a diffuser"                      -> PLACE_FAMILY_INSTANCES - a model
#                                              family, on a level
#   "show which way the air is going"       -> PLACE_FLOW_ARROWS, which works out
#                                              where the arrows go
#   "put a text note here"                  -> CREATE_TEXT_NOTE
#   "hatch this area"                       -> DRAW_FAMILY_FILLED_REGION

utterances:
  - put the north arrow on this plan
  - add a detail component at these points
  - place this detail item in the drafting view
  - put the fire rating symbol on this view

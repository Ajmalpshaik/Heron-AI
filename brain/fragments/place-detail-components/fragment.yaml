runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Create.NewFamilyInstance(XYZ,
  FamilySymbol, View)`, `Family.FamilyPlacementType`, `FamilySymbol.IsActive`
  / `Activate` and `ElementTransformUtils.RotateElement` are present 2020
  through 2027, read with tools/api-surface on 2026-10-14. PLACE_FLOW_ARROWS
  already places view-based annotation through the same call.

# ROUTING - the same rows are in PLACE_FAMILY_INSTANCES and PLACE_FLOW_ARROWS.
#
#   "put the north arrow on this plan"      -> here
#   "add a detail component here"           -> here
#   "place a diffuser"                      -> PLACE_FAMILY_INSTANCES - a model
#                                              family, on a level
#   "show which way the air is going"       -> PLACE_FLOW_ARROWS, which works out
#                                              where the arrows go
#   "put a text note here"                  -> CREATE_TEXT_NOTE
#   "hatch this area"                       -> CREATE_FILLED_REGION

utterances:
  - put the north arrow on this plan
  - add a detail component at these points
  - place this detail item in the drafting view
  - put the fire rating symbol on this view

# D-30: the negative case is what catches "succeeded and did nothing" - and,
# for a write that draws from a drawing, "drew something nobody asked for":
# ducts from a layer that is not there, from the wrong layer, from a guessed
# neighbour of the layer named, or at sizes nobody gave.
#
# THE ARRANGEMENT IS HALF OF EVERY CASE (NEEDS-CHECKING Group MX). A SAVED
# scratch copy of Project1 (Revit 2020, the new project CREATE_MEP_RUNS was
# proved on) with ONE TEST DWG LINKED - never a working model. MX1 makes the
# DWG and records it: a small DOUBLE-LINE supply duct layout on one layer (a
# main about 600 wide, one tee branch about 400, one square corner, one radius
# elbow drawn as an arc, a line broken for a tag, and its size tags as TEXT),
# and a SINGLE-LINE chilled water pipe layout on another (supply and return
# side by side, one tee, one bend drawn as an arc, a tag "Ø100"). Its file
# name and its two layer names are recorded and go into the job file - the
# fragment-proving skill's rule 2, ask for what the model has. The negative is
# the SAME call with a LAYER NAME THE DRAWING HAS NOT GOT - a different value,
# not an empty one (rules 2 and 5). Every run ROLLED BACK but MX9's one run
# through try-once.

positive:
  - given: >
      the test DWG selected; layerNames "<MX1's duct layer>"; drawAs duct;
      systemType "Supply Air"; runType "Mitered Elbows / Tees"; level
      "Level 1"; middleElevationMm 2700; defaultSize "400x300"; previewOnly
      true - nothing else typed (mode auto = double for a duct)
    expect: >
      NOTHING drawn - created and fittings empty, nothing new in the model;
      runsFound opening with the span of the linework, then one line per run:
      the main split at the branch, the branch, the leg after the corner, the
      leg after the arc elbow - each with its two ends, length and "width
      from the spacing, height default"; findings counting the elbows (2),
      the tee (1) and the open ends, and saying PREVIEW - NOTHING WAS DRAWN;
      skippedWhy counting the arc and the unpaired end caps. layersRead "'<the
      layer>': N straight piece(s) read, 1 arc(s) skipped, taken as double
      lines"

  - given: >
      the same, previewOnly left out, sizes "<the tags read off the picture
      of the plan, each size@x,y - MX4 records them>"
    expect: >
      created one duct per run in runsFound, at Middle Elevation 2700 on
      Level 1, Supply Air, the type named; each duct's Width and Height in
      Properties the size runsFound gave it (the tag's where one was near,
      else width from the lines, height 300); fittings 2 elbows and 1 tee -
      Revit's own from the routing preferences; failedJoins empty;
      runsWithoutSize naming exactly the runs no tag reached and no tagged run
      continues into across an elbow; sizeConflicts naming any run whose tag
      disagrees with its lines' spacing. Select the whole layout:
      SELECT_BY_CONNECTION_STATUS finds open ends only at the run ends the
      drawing leaves open

  - given: >
      layerNames "<MX1's pipe layer>"; drawAs pipe; systemType "Hydronic
      Supply"; runType "Standard"; middleElevationMm 3000; defaultSize "d25";
      sizes "Ø100@<the tag's position>"; mode left out (auto = single for a
      pipe)
    expect: >
      one pipe per line, supply and return drawn as TWO pipes side by side -
      never paired into one; the tagged run 100, the run continuing from it
      across the arc bend 100 too ("carried from Ø100"), every other run 25
      and listed in runsWithoutSize; an elbow at the bend and a tee at the
      tee; any size Revit snapped (a size the pipe segment lacks) named in
      findings as "asked ..., Revit made it ..."

  - given: >
      the duct case with cadName "<MX1's DWG file name>" and NOTHING selected
    expect: the same runs as the first positive - the CAD found by its name

second_route:
  - >
    for three runs, measure the two CAD lines in Revit (Measure tool, or
    EXTRACT_CAD_CURVES listOnly on the layer) and check the duct's centreline
    sits midway between them and its Width is their spacing rounded to 50 mm
  - >
    revit_view_image of the plan after the run: every duct lies over its CAD
    lines, no duct where the drawing has none
  - one Ctrl+Z (before Keep) removes every duct, pipe and fitting in a single step (Golden Rule 16)

negative:
  - given: >
      THE D-30 NEGATIVE - THE FIRST CASE TO RUN. The first positive's call
      with layerNames "ZZZ-NO-SUCH-LAYER"
    expect: >
      refused "no layer called 'ZZZ-NO-SUCH-LAYER' is in the CAD drawing -
      layer names are matched exactly, including case. The layers are: ...
      Nothing was drawn"; created and fittings empty; nothing new in the
      model. A card that drew whatever layer it found would draw here; the
      value alone empties the result

  - given: layerNames "<MX1's duct layer>" written in a DIFFERENT CASE (all lower case)
    expect: refused the same way, the real name listed - a layer is never matched loosely

  - given: layerNames "<MX1's duct layer>, ZZZ-NO-SUCH-LAYER" - one real, one not
    expect: refused, naming only ZZZ-NO-SUCH-LAYER, nothing drawn - never the half that matched

  - given: nothing selected and cadName left out
    expect: refused, select the CAD or name it, the CAD files in the model listed, nothing drawn

  - given: cadName "ZZZ No Such.dwg"
    expect: refused, no CAD file called that, the CAD files listed, nothing drawn

  - given: drawAs pipe with runType "Mitered Elbows / Tees" (a duct type)
    expect: refused, not a pipe type, nothing drawn

  - given: drawAs duct with systemType "Hydronic Supply" (a piping system)
    expect: refused, not a duct system type, nothing drawn

  - given: drawAs "cable tray"
    expect: refused, neither duct nor pipe, nothing drawn

  - given: defaultSize "d200" with a rectangular duct type
    expect: refused, width x height needed, nothing drawn

  - given: sizes "600x400 at 12500,30200" (no @)
    expect: refused, the hint named as unreadable with how to write one, nothing drawn

  - given: the duct case with maxRuns 2
    expect: refused, N runs found - more than the 2 this draws in one call, nothing drawn

  - given: mode single on the DUCT layer, previewOnly true
    expect: >
      every line its own run - two runs per duct, NOT paired, at the default
      size; the count about twice the double-line count. Shows mode is obeyed,
      never guessed past

  - given: the pipe layer with mode double, previewOnly true
    expect: >
      supply and return side by side PAIRED as one "duct" - which is why auto
      never pairs a pipe layer; findings saying how much of the length paired

  - given: the first positive's call with a layer that holds ONLY text or arcs (MX1 names one, if the DWG has one)
    expect: refused, the layer holds no straight line this can draw, the skipped counts named, nothing drawn

# NOT COVERED - in the code, but a test DWG may not hold them; each is in Group
# MX's MX12 row, run if a drawing is found that has it:
#   - a block on the named layer (counted, not opened)
#   - a curve whose ends are at different heights (counted)
#   - a view-specific CAD import (read through its own view)
#   - two CAD imports of the same file (cadName refused; select one)
#   - more than 20000 straight pieces on the layers named (refused)
#   - a fitting Revit refuses (a branch wider than its main, a corner too
#     short for the elbow): failedJoins names it, the runs stay; with
#     allOrNothing true the whole call is rolled back

compatibility-note: >
  One implementation for every release. `TextElement.Text` (read and
  written for a text note, version 3) is present 2020 through 2027 - read off
  RevitAPI.xml for all eight releases on 2026-10-12. Version 4's
  `TextNote.GetFormattedText` / `SetFormattedText` and FormattedText's
  `SetPlainText(TextRange, string)`, `GetListType`, `SetListType`,
  `GetIndentLevel`, `SetIndentLevel`, `GetListStartNumber`,
  `SetListStartNumber` and the four style get/set pairs date from 2017 and were
  read off RevitAPI.xml for 2020, 2024, 2026 and 2027 on 2026-10-17; the
  fragment compiles for all eight releases. Version 5 adds
  `GetMinimumListStartNumber`, `GetMaximumListStartNumber` and
  `GetMaximumIndentLevel`; every FormattedText member, the ListType and
  FormatStatus values, TextRange and TextNote's Get/SetFormattedText read the
  same in the shipped RevitAPI.dll of each release 2020 to 2027, taken one
  release at a time with tools/api-surface on 2026-10-17 - so no #if. `Element.Name`, `LookupParameter`,
  `Parameter.AsString` and `Parameter.Set(string)` are unchanged 2020 to 2027,
  and no units call is made - this only ever touches text, which is what keeps
  it clear of the 2021 units move entirely. Only string-storage parameters are
  edited; a number is refused rather than converted through its display text,
  because that round trip is lossy and would rewrite a rounded value back as
  the truth.

# ROUTING - the same rows are in the fragments named here.
#
#   "add a prefix to all the names"  -> here. A separate ADD_NAME_AFFIX was
#                                       written on 2026-09-02 and WITHDRAWN
#                                       the same day: this fragment already
#                                       does prefix, suffix and replace, on a
#                                       parameter or on the name itself
#   "add a prefix to the mark"           -> EDIT_PARAMETER_TEXT. A mark is
#                                           a PARAMETER; this fragment is
#                                           for text notes on a drawing
#   "change SUP to SUPPLY in the         -> EDIT_PARAMETER_TEXT
#    parameter"
#   "find and replace in the text notes" -> here, field Text (version 3)
#   "change the wording of this note"    -> here, field Text, mode set
#   "change the wording of this note but keep the numbering" -> here, field Text (version 4, 5b-520)
#   "number the paragraphs of this note" -> here, field Text, mode format,
#                                           text numbers (version 5, 5b-737)
#   "turn the bullets into numbers"      -> here, mode format, text numbers
#   "make the first line bold"           -> here, mode format, text bold 1
#   "is this note numbered" / "which paragraphs are bold" -> READ_ELEMENT_PARAMETERS,
#                                           parameterName Text - a check is a read
#   "read what the text notes in this view say" -> READ_ELEMENT_PARAMETERS, parameterName Text
#   "make the tag text bold"             -> SET_TEXT_TYPE - the TYPE, so
#                                           every label or note of it; one
#                                           line or word of one note stays
#                                           here (measured 2026-10-21, row
#                                           5b-1294)
#
#   THE TEXT NOTES OF ONE VIEW, as a chain: SELECT_VISIBLE_IN_VIEW (PROVEN)
#   with view=<the view> and categories=Text Notes, then this with
#   expect_from select-visible-in-view. Measured 2026-10-17 on the scratch copy
#   "Heron note scratch": it handed 109 notes on in the drafting view "Spread
#   Footing". SELECT_BY_CATEGORY_NAME categoryName=Text Notes inViewOnly=<the
#   view> collects the same 109, and is DRAFT. Read the wording first with
#   READ_ELEMENT_PARAMETERS parameterName=Text: a curly apostrophe or a soft
#   line break inside the words to replace is shown there, and typed here as
#   it is shown.
#   "change part of the name"            -> EDIT_PARAMETER_TEXT for a
#                                           parameter, RENAME_ELEMENTS for a
#                                           name. Neither is a text note

utterances:
  - put a prefix on the mark
  - add AJ to the front of these names
  - find and replace in the comments
  - rename these with a suffix
  - change part of the name
  - swap that word in the parameter
  - find and replace REV A with REV B in all the text notes
  - change the wording of this text note
  - find and replace in the text notes
  - change the wording of this note
  - change the wording of this note but keep the numbering
  # ADDED 2026-10-17, 5b-737 - version 5's mode format, the owner's words.
  - number the paragraphs of this note
  - make this note a numbered list
  - turn the bullets into numbers
  - make the first line bold
  # ADDED 2026-10-17, 5b-930 - the owner's words, measured main against branch on the
  # lexical and trained backends: reaches here on both, where on main lexical
  # sent it to READ_ELEMENT_PARAMETERS.
  - turn this note into a numbered list

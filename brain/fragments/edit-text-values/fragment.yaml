id: FRG-PAR-009
semantic-identity: "change the text that is already there, rather than replacing it"
kind: action
domain: revit.parameters
capability: EDIT_TEXT_VALUES
version: 5
source: OFFICIAL
risk: MODIFY

purpose: >
  Transforms text that is already on each element - add a prefix, add a suffix,
  or replace part of it - instead of overwriting it with one flat value. A
  text note's own wording is one more field: find and replace across text
  notes, or set a note's whole wording.

  **A TEXT NOTE'S WORDING IS FIELD "Text"** (version 3, 2026-10-12, the gap
  fill). It is no parameter - it is the note's own text - so it is read and
  written through the note itself, and compared without the closing carriage
  return Revit adds. Mode "set" writes the whole wording, and only there: one
  value on a parameter is WRITE_ELEMENT_PARAMETERS.

  **`WRITE_ELEMENT_PARAMETERS` SETS A LITERAL AND THAT IS A DIFFERENT JOB.**
  *"Put AJ- in front of every mark"* cannot be done by setting a value, because
  the value is different on every element. This one reads first, transforms, and
  writes back.

  **THE ELEMENT'S OWN NAME IS JUST ANOTHER FIELD**, and treating it as one is
  the decision this fragment makes. The earlier library had a rename fragment
  and a prefix/suffix fragment carrying the same four transformations twice.
  `field: "Name"` edits `Element.Name`; anything else is a parameter. One
  mechanism, so a fix to the replace rule cannot reach one of them and miss the
  other.

  **AN ELEMENT WHOSE TEXT DOES NOT CONTAIN THE SEARCH TERM IS `untouched`, NOT
  A FAILURE.** Running a replace across a mixed set and having half of it not
  match is the normal case. Counting those as errors makes the report unusable;
  counting them as successes reports work that did not happen.

  **IT READS BACK.** Every element it says it changed was re-read after the
  write, and anything Revit accepted and then altered is reported separately.
  A count of attempts is not a count of changes.

  **NOTHING IS DONE TO AN EMPTY VALUE.** A prefix on a blank parameter would
  create a value where the modeller had none, which is a different edit from the
  one asked for and would look like data.

  **A FIELD NAME TWO PARAMETERS SHARE IS NOT EDITED.** A shared or project
  parameter can be bound beside a built-in one of the same name, and Revit's
  lookup by name then returns one of them at random, in Autodesk's own words.
  Such an element goes in `ambiguous`, untouched (D-54 s3, FRAGMENT-ISSUES
  5b-203). This is version 2; version 1's proof no longer describes the code and
  is kept as a record, and the fragment is DRAFT until it is proved again.

# VERSION 4 (2026-10-17, FRAGMENT-ISSUES 5b-520) - A TEXT NOTE IS EDITED THROUGH
# ITS FORMATTED TEXT. Kept out of the purpose on purpose: the purpose is
# searched, and these words would pull questions about lists and styles.
#
#   Version 3 wrote `note.Text = wanted`, and Autodesk's reference says that
#   loses "all previous formating". MEASURED 2026-10-17, Revit 2020, rolled back:
#   on a real project's note (read only, never written) whose 8 paragraphs were
#   a 1-2-3 list, a one-word replace came back with list type None on every
#   paragraph; on a scratch copy of Autodesk's rst_basic sample the same write
#   also made the whole note bold from one bold word and dropped an underlined
#   and an italic paragraph. Now every mode on a note goes through
#   GetFormattedText -> edit -> SetFormattedText:
#
#     replace  SetPlainText on each match, last first. Kept: list type, indent,
#              list start number, bold, italic, underline, all caps; the new
#              words take the style of the first character they replace. A
#              match over a paragraph end joins the two paragraphs
#     prefix   inserted at 0, taking the first character's style
#     suffix   inserted before the closing carriage return, taking the last's
#     set      the whole wording, then NEW PARAGRAPH N IS GIVEN OLD PARAGRAPH
#              N's list type, indent and bold/italic/underline/all caps, and
#              every extra one the old LAST paragraph's; the first keeps the
#              list's start number. MEASURED: SetPlainText alone kept the list
#              type but put every paragraph at indent 0 and spread the first
#              word's bold over the note. A paragraph that was PARTLY bold
#              (italic, ...) is written plain, and `noteFormatting` says
#              "NOT KEPT" for it
#
#   A PARAGRAPH BREAK IS TYPED \r, A SOFT LINE BREAK (Shift+Enter) \v, AND A
#   BACKSLASH \\ - on a text note only, and the same marks
#   READ_ELEMENT_PARAMETERS shows a note's wording in. A chat's values arrive one
#   per line, so without them a new wording could only ever be one paragraph.
#   A real line feed counts as a paragraph break: Revit allows none in a note.
#
#   IT READS THE FORMATTING BACK: each paragraph's list type and indent (and
#   the start number) are re-read and compared with what the rule meant; a note
#   where any differs is `unverified`, never `changed`. Proved rolled back on
#   the scratch copy "Heron note scratch", Revit 2020: replace, set 8 -> 3 and
#   8 -> 4 paragraphs, prefix and suffix, each with its negative.

# VERSION 5 (2026-10-17, FRAGMENT-ISSUES 5b-737) - MODE "format" SETS A NOTE'S
# LISTS AND STYLES. KEPT OUT OF THE PURPOSE ON PURPOSE, as version 4 was:
# MEASURED that day on four backends, a purpose paragraph naming numbers,
# bullets and bold sent up to six QUESTIONS about a note ("is the first line of
# this note bold") to this write on the trained model; without it, none. The
# owner's four sentences below reach it by their own words on every backend.
# Version 4 kept formatting that was there; nothing could set it, so an
# as-built legend whose numbering a wording edit had lost could not get it back
# through Heron. Field Text only, and never a character of the wording changed:
#
#   text         what to set, several joined with ';', each followed by the
#                paragraphs it is for - "numbers 2-4; bold 1". The words:
#                numbers, bullets, lowercase letters, uppercase letters, no
#                list; start N; indent N, no indent; bold, italic, underline;
#                not bold, not italic, not underlined
#   replacement  the paragraphs for an instruction that names none: "2-11",
#                "1, 3", "2 to last", "first", "last", "all"; empty is every
#                paragraph. Folded into the two strings the card already takes,
#                so no new input
#
#   A PARAGRAPH IS WHAT ENTER ENDS - "the first line" is paragraph 1, and a
#   line Revit wraps by itself is not one. Each instruction covers whole
#   paragraphs with their closing carriage return, where a list's own number
#   takes its bold from (RevitAPI's SetBoldStatus remarks).
#
#   CHECKED BEFORE ANYTHING IS APPLIED, per note: a paragraph past the last
#   one (the note goes in `absent`, and when that is every note the run is
#   refused, NOTHING WAS CHANGED), an indent past GetMaximumIndentLevel, a
#   start number outside Revit's range or on a paragraph that is not numbered
#   or lettered (`readOnly`). The edits are made on GetFormattedText's copy and
#   only SetFormattedText reaches the note, so a note that will not take every
#   instruction is left exactly as it was.
#
#   EVERY PARAGRAPH IS READ BACK, NAMED OR NOT. RevitAPI's SetListType remarks:
#   consecutive list paragraphs at one indent are one list, and a list type
#   change reaches all of them even outside the range. A paragraph that reads
#   back other than meant - named, or renumbered with its list - puts the note
#   in `unverified`, said in `noteFormatting`. A note already as asked is
#   `untouched`, and nothing is written to it.
#
#   RUN 2026-10-17 IN REVIT 2020, every run rolled back, on "Heron Note Format
#   Test" (a copy of the rst_basic sample): NEEDS-CHECKING group FD rows FD1-FD3
#   and FD5-FD9 answered as looked for. The proof below is FD1/FD2, signed by
#   Ajmal PS and PROVEN on 2026-10-18 (FD10). Compiled for all eight releases;
#   not run on 2021-2027. The purpose's sentence that version 1's proof no
#   longer describes the code is older than this proof - left there because
#   the purpose is searched, and rewording it moves routing.

contract:
  needs:
    - name: doc
      type: Document
    # THE COMMENT DIRECTLY ABOVE A VALUE THE CALLER TYPES - field, text,
    # replacement - is printed under that value by heron_resolve and
    # heron_lookup (heron_fragment.need_notes), and is never searched, so it
    # moves no routing (FRAGMENT-ISSUES 5b-975). This one sits above
    # `elements`, which nobody types, and is never printed.
    - name: elements
      type: IList<Element>
    # A parameter's name, Name for the element's own name, or Text for what a
    # text note says. The text notes of one view: run SELECT_VISIBLE_IN_VIEW
    # with view=<the view> and categories=Text Notes first, then this with
    # expect_from="select-visible-in-view". Read the wording first with
    # READ_ELEMENT_PARAMETERS parameterName=Text, and type the words to
    # replace exactly as it shows them.
    - name: field
      type: string
      source: request
    - name: mode
      type: string
      source: request
    # replace: the words to look for. prefix or suffix: the words to add. set
    # (text notes only): the note's whole new wording. format (text notes
    # only): what to set, joined with ';', each with its paragraphs - numbers
    # 2-4; bold 1 - and no word is changed. In a note's words \r ends a
    # paragraph, \v is a Shift+Enter line break and \\ is one backslash - the
    # marks READ_ELEMENT_PARAMETERS shows a note in. Each value is one line,
    # so two paragraphs are typed text=First paragraph\rSecond paragraph
    - name: text
      type: string
      source: request
    # replace: the words that go in their place, with the same \r, \v and \\
    # marks as text on a text note. format: the paragraphs for an instruction
    # that names none - 2-11, first, last or all.
    - name: replacement
      type: string
      source: request
  provides:
    - name: changed
      role: result
      type: IList<ElementId>
    - name: untouched
      # Elements whose text did not contain the search term - or, for mode
      # format, a note already formatted as asked, to which nothing is written.
      # The purpose is explicit that counting these as successes would report
      # work that did not happen (D-52).
      role: accounting
      type: IList<ElementId>
    - name: blank
      # Elements whose value was empty - NOTHING IS DONE TO AN EMPTY VALUE,
      # because a prefix on a blank would create data where the modeller had
      # none. Never an edit it made (D-52).
      role: accounting
      type: IList<ElementId>
    - name: readOnly
      # Elements whose parameter will not take a write - or a text note that
      # will not take a format instruction (an indent or start number out of
      # Revit's range, a start on a paragraph that is not numbered), left as it
      # was. Given and unusable, never an edit it made (D-52).
      role: accounting
      type: IList<ElementId>
    - name: absent
      # Elements not carrying that field at all - for mode format, anything
      # that is not a text note, or a note without a paragraph the request
      # names. Given and unusable, never an edit it made (D-52).
      role: accounting
      type: IList<ElementId>
    - name: ambiguous
      # Elements where the field name answers to TWO OR MORE parameters - on the
      # instance, or on the type when the search reached it - so Revit's lookup
      # would pick one at random. Neither is edited (D-54 s3, FRAGMENT-ISSUES
      # 5b-203). Turned down, never found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: unverified
      # Elements Revit accepted and then altered, so the read-back does not
      # match what was intended. The evidence it could not confirm, never a
      # confirmed edit (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string
    - name: noteFormatting
      # Version 4. One line per text note it edited: paragraphs before and
      # after, each paragraph's list as READ BACK, and anything NOT KEPT. The
      # read-back that puts a note in `unverified` is said here. Version 5: for
      # mode format, each note's lists and bold/italic/underline as read back,
      # or why it was not edited. A sentence about the edit, never a thing it
      # found (D-52).
      role: accounting
      type: string


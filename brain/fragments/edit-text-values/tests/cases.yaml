# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: 5 elements with marks, mode "prefix", text "AJ-"
    expect: >
      all 5 in changed, and their marks reading AJ- in front of what was there
      before. Read one in the Properties palette by eye - the fragment's own
      count is not the check

  - given: field "Name" on a set of views, mode "replace"
    expect: >
      the views renamed. The element's Name is just another field here, which
      is why one mechanism serves both and a fix to the replace rule cannot
      reach one and miss the other

  - given: four text notes, two reading "SEE DETAIL A", field "Text", mode "replace", text "DETAIL A", replacement "DETAIL B"
    expect: >
      the two in `changed`, reading "SEE DETAIL B" on the view; the other two
      in `untouched`. Version 3: the note's own wording, not a parameter

  - given: one text note, field "Text", mode "set", text "PROVIDE ACCESS PANEL"
    expect: >
      changed, and the note on the view reads exactly that

  - given: >
      VERSION 4. A text note whose 8 paragraphs are a 1-2-3 list (soft line
      breaks inside paragraph 3, a curly apostrophe, one bold word), field
      "Text", mode "replace", text "DETAIL A", replacement "DETAIL B"
    expect: >
      changed, and `noteFormatting` reads back "1-8 ArabicNumbers from 1" - the
      numbering still on every paragraph, the bold word still bold. Version 3
      wrote `note.Text` and every paragraph came back with no list (measured on
      a real project's note, read only, 2026-10-17)

  - given: >
      the same note, mode "set", text "ALPHA\rBETA\vSOFT\rGAMMA" - three
      paragraphs typed with the marks READ_ELEMENT_PARAMETERS shows
    expect: >
      changed, 8 paragraph(s) before and 3 after, "1-3 ArabicNumbers from 1",
      the soft line break kept inside paragraph 2, and "NOT KEPT: paragraph 1
      was partly bold" said rather than hidden. A bulleted note in the same set
      keeps its indent 1 paragraphs at indent 1

  - given: >
      the same note, mode "prefix" with "NOTE: ", then mode "suffix" with " (END)"
    expect: >
      changed, 8 paragraphs before and after, the list on all 8 - the added
      words land in paragraph 1 and paragraph 8 and take their neighbour's style

  - given: >
      VERSION 5, mode "format". A text note of four paragraphs typed with Enter,
      no list and nothing bold, field "Text", text "numbers 2-4; bold 1",
      replacement empty
    expect: >
      changed, the four paragraphs word for word unchanged, and `noteFormatting` reads
      back "1 no list, 2-4 ArabicNumbers from 1; bold 1" - on the plan,
      paragraphs 2-4 numbered 1. 2. 3. and paragraph 1 bold. NOT RUN: it needs
      Revit (NEEDS-CHECKING FD1, tools/jobs/note-format-2026-10-17.yaml)

  - given: >
      VERSION 5. The same note, text "numbers", replacement "2-4", then
      "lowercase letters", then "start 3", then "indent 1 3"
    expect: >
      each changed and read back as asked: 2-4 ArabicNumbers, then
      LowerCaseLetters, then "from 3" (c. d. e.), then paragraph 3 at indent 1.
      A paragraph Revit renumbers with its list but that was not named is said
      by number in `noteFormatting` and puts the note in `unverified`

  # VERSION 8 - RENAME_FAMILY merged in, field Family. NOT RUN. Each fails on
  # version 7, which read "Family" as a parameter - the built-in one holds an
  # element id, so it was refused as not text - and refused mode set on it.
  - given: >
      VERSION 8. One air terminal instance handed in, field Family, mode set,
      text the project standard's name - RENAME_FAMILY's own first case
    expect: >
      `changed` holds the family's id, `typesEdited` its types, and
      `familyRename` "'<old>' is now '<new>'. Its N type(s) and EVERY instance
      of them changed with it" - N matching what the project browser shows
      under that family. LOOKED AT in the browser: the new name, the same
      types beneath it, every instance following

  - given: VERSION 8. The same family, field Family, mode prefix, text "AJ_", run twice
    expect: >
      the first run "AJ_<old>", the second `untouched` - never "AJ_AJ_<old>"

negative:
  - given: >
      VERSION 5, mode "format". The same four-paragraph note, text "numbers
      2-5" - paragraph 5 is not there
    expect: >
      REFUSED - "the paragraphs named are not there" - NOTHING WAS CHANGED,
      `changed` empty, the note on the plan exactly as typed. Checked against
      each note BEFORE anything is applied, so a note is never half formatted

  - given: >
      VERSION 5. text "start 3" on paragraphs with no list, or "indent 99", or
      a word it does not know ("bolden 1")
    expect: >
      "start 3" and "indent 99" - the note in `readOnly`, NOT edited, the reason
      in plain words; "bolden 1" - REFUSED before any element is read

  - given: two ducts, field "Text", mode "set"
    expect: >
      REFUSED - not one is a text note - and nothing written. One value on a
      parameter is WRITE_ELEMENT_PARAMETERS, not this

  - given: mode "set" with field "Comments"
    expect: >
      REFUSED before any element is read: set is for a text note's wording only
  - given: a mixed set where only HALF the elements contain the search text
    expect: >
      the other half in `untouched`, NOT in changed and NOT reported as errors.
      This is the normal case for a replace, and calling it a failure makes the
      report unusable while calling it a success reports work that never
      happened

  - given: mode "prefix" on elements whose parameter is BLANK
    expect: >
      those in `blank` and NOT changed. A prefix on an empty parameter creates
      a value where the modeller had none - it would look like data afterwards
      and nobody would know where it came from

  - given: A NUMERIC parameter, such as a length
    expect: >
      REFUSED, in readOnly. Editing it through its display text is lossy - a
      length shown as 2500 is not exactly 2500 internally, and writing the
      display back rewrites a rounded value as the truth

  - given: an element whose Name Revit will not let you set
    expect: >
      in readOnly, the rest still edited, and no throw

  - given: >
      an element where Revit ACCEPTS the write and stores something different
    expect: >
      in `unverified`, NOT in changed. Everything reported as changed was
      re-read after the write

  - given: >
      a field name two text parameters on one element share - a shared
      parameter loaded with the same name as a built-in text one and bound to
      the category (NEEDS-CHECKING P8 arranges it), mode prefix
    expect: >
      those elements in `ambiguous`, not in changed, and BOTH parameters exactly
      as they were. Before version 2 one of the two - Revit's reference calls the
      choice random - took the prefix and was reported changed

  - given: >
      VERSION 4. The numbered note and a bulleted one, mode "replace", a text
      neither contains
    expect: >
      both `untouched`, `noteFormatting` null - nothing written, so nothing to
      read back

  - given: a note whose formatting reads back other than the rule meant
    expect: >
      in `unverified`, NOT in changed, and `noteFormatting` names the
      paragraph and what it reads back

  # VERSION 6 - EDIT_PARAMETER_TEXT merged in. Each of these fails on version 5.
  - given: >
      mode prefix, text AJ_, field Mark, run TWICE on the same five elements -
      the second run after the first was kept
    expect: >
      the second run changes nothing: all five `untouched`, each Mark reads
      AJ_M-01 and never AJ_AJ_M-01. A re-run that stacks is the failure that
      makes the second run worse than the first

  - given: >
      mode prefix, text AJ_, field Type Mark, five instances of ONE type handed
      in, its Type Mark M-01
    expect: >
      the type's Type Mark reads AJ_M-01 - ONE prefix, not five - all five
      instances in `changed`, and that one type's id in `typesEdited`. Every
      other instance of the type, handed in or not, now reads AJ_M-01 too, and
      `typesEdited` is what says so

  - given: >
      mode replace, text SUP, replacement SUPPLY, field Type Comments, three
      instances of one type whose Type Comments is SUP
    expect: >
      SUPPLY - not SUPPLYPLYPLY. The replacement holds the text it replaces, so
      a type written once per instance would grow on every pass

  - given: >
      mode prefix, a field whose INSTANCE parameter is a number and whose TYPE
      carries a text parameter of the same name, two instances of one type
    expect: >
      the type's text value changed once, its id in `typesEdited`, both
      instances in `changed` - and NOT counted as not text. Version 5 refused
      both as a number

  - given: the same, but the type's parameter of that name is a number too
    expect: >
      both in `readOnly` as not text, and when that is every element handed in,
      the refusal that NOTHING WAS CHANGED because the field is not text

  - given: mode replace SUP -> SUPPLY, a TYPE handed in together with two of its instances
    expect: >
      the type's value reads SUPPLY - written once, not twice

  # VERSION 7 - RENAME_ELEMENTS merged in. Each of these fails on version 6.
  - given: >
      field Name, mode replace, elements named "AHU-1-SUP" and "AHU-1-RET",
      run with text "-SUP" so the first would become "AHU-1" - and a third
      element of the same kind already named "AHU-1"
    expect: >
      REFUSED - `collisions` names "AHU-1" and the id already holding it,
      NOTHING WAS RENAMED, `changed` empty, every name as it was. Version 6
      renamed one at a time with no check: Revit threw on a type or view, or
      quietly took a duplicate instance name

  - given: >
      field Name, mode replace, text "-SUP", replacement "", twelve views of
      which two, "L1-SUP" and "L1", would land on "L1" - L1 listed SECOND in the
      batch
    expect: >
      REFUSED before the first write, `collisions` names "L1", all twelve
      views keep their names. Version 6 wrote the first eleven and refused the
      clash at Revit's throw - a batch half renamed

  - given: >
      field Name, mode replace, two views named "A" and "B", text and
      replacement swapping them in one run (each would take the other's name)
    expect: >
      REFUSED - a swap clashes, because the second still holds its old name
      when the first write lands. Two runs through a name nobody holds do it

  - given: field Name, mode replace, text "SUP", replacement "", an element named exactly "SUP"
    expect: >
      REFUSED, `collisions` says it would be left with NO name, nothing renamed

  - given: field Name, mode replace, 40 elements of which only 4 contain the text
    expect: >
      `changed` holds 4 and `notMatched` the other 36 - the same ids as
      `untouched`. Version 6 had no `notMatched`

  # VERSION 8 - field Family's refusals, nothing renamed in any of them.
  - given: >
      VERSION 8. Instances of THREE different families, field Family, mode
      set, one new name
    expect: >
      REFUSED "covers 3 different families", the three named; nothing renamed

  - given: >
      VERSION 8. One instance, field Family, mode set, text a name another
      loaded family already has (in other capitals)
    expect: >
      REFUSED BEFORE THE RENAME, `collisions` naming the other family's id -
      RENAME_FAMILY tried first and reported Revit's refusal after

  - given: VERSION 8. An IN-PLACE family's instance, field Family, mode set
    expect: refused "is an in-place family" before anything is attempted

  - given: VERSION 8. Walls and ducts handed in, field Family, mode set
    expect: >
      REFUSED "nothing handed in belongs to a loaded family" - system
      families have none; their TYPE names are field Name's

  - given: VERSION 8. A mark parameter, mode set
    expect: >
      still REFUSED - "set" is for field Text and field Family only; one
      value on a parameter is WRITE_ELEMENT_PARAMETERS

  - given: VERSION 8. The family renamed, then reloaded from its .rfa
    expect: the OLD name back - nothing here touches the file on disk

  # VERSION 9 (2026-11-07, row 5b-1475). Each FAILS on version 8, which
  # compared a name read back with the transform's output exactly, so a name
  # Revit saved without its leading space went in `unverified`.
  - given: >
      VERSION 9 - THE FIELD CASE. Four section views named "Warehouse - HVAC
      Air ducts Sections-1" to "-4"; field Name, mode replace, text "Warehouse -"
      (what arrives when "Warehouse - " is typed - row 5b-215), replacement empty
    expect: >
      `changed` 4, `unverified` 0, the four read back "HVAC Air ducts
      Sections-1" to "-4", and `nameNote` saying 4 names would have started
      with a space Revit does not keep. Version 8 answered changed 0,
      unverified 4 with all four renamed (2026-11-07,
      4355-BHVD-3D-60A10-BL007A, Revit 2020)
      Second route: the four names in the Project Browser, and READ_ELEMENT_PARAMETERS
      parameterName View Name on the four

  - given: >
      VERSION 9. The same four, text "Warehouse - " with the space kept (the
      command line keeps it), replacement empty
    expect: changed 4, unverified 0, and NO nameNote - nothing was trimmed

  - given: VERSION 9. One view, field Name, mode replace, a non-empty replacement leaving no edge space
    expect: changed 1, no nameNote - version 8's answer, unchanged

  - given: >
      VERSION 9 - NEGATIVE. A text parameter (Comments) holding "Warehouse - A"
      on one element; field Comments, mode replace, text "Warehouse -",
      replacement empty
    expect: >
      changed 1 with the value read back " A" - the leading space KEPT, and no
      nameNote. The trim is for names only: Revit keeps a parameter's spaces,
      and taking one off would be an edit nobody asked for

  - given: >
      VERSION 9 - NEGATIVE. Two views, "X - Plan A" and "Plan A"; field Name,
      mode replace on the first, text "X -", replacement empty
    expect: >
      REFUSED, NOTHING WAS RENAMED, `collisions` naming "Plan A" as already the
      name of the second view - the clash judged on the name Revit would keep.
      Version 8 planned " Plan A", saw no clash, and left it to Revit

second_route:
  - >
    open a schedule of that parameter in Revit before and after - the column is
    the second route, and it is what a person would actually check

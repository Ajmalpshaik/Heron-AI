# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: 5 elements with marks, mode "prefix", text "AJ-"
    expect: >
      all 5 in changed, and their marks reading AJ- in front of what was there
      before. Read one in the Properties palette by eye - the fragment's own
      count is not the check

  - given: field "Name" on a set of views, mode "replace"
    expect: >
      the views renamed. The element's Name is just another field here, which
      is why one mechanism serves both and a fix to the replace rule cannot
      reach one and miss the other

  - given: four text notes, two reading "SEE DETAIL A", field "Text", mode "replace", text "DETAIL A", replacement "DETAIL B"
    expect: >
      the two in `changed`, reading "SEE DETAIL B" on the view; the other two
      in `untouched`. Version 3: the note's own wording, not a parameter

  - given: one text note, field "Text", mode "set", text "PROVIDE ACCESS PANEL"
    expect: >
      changed, and the note on the view reads exactly that

  - given: >
      VERSION 4. A text note whose 8 paragraphs are a 1-2-3 list (soft line
      breaks inside paragraph 3, a curly apostrophe, one bold word), field
      "Text", mode "replace", text "DETAIL A", replacement "DETAIL B"
    expect: >
      changed, and `noteFormatting` reads back "1-8 ArabicNumbers from 1" - the
      numbering still on every paragraph, the bold word still bold. Version 3
      wrote `note.Text` and every paragraph came back with no list (measured on
      a real project's note, read only, 2026-10-17)

  - given: >
      the same note, mode "set", text "ALPHA\rBETA\vSOFT\rGAMMA" - three
      paragraphs typed with the marks READ_ELEMENT_PARAMETERS shows
    expect: >
      changed, 8 paragraph(s) before and 3 after, "1-3 ArabicNumbers from 1",
      the soft line break kept inside paragraph 2, and "NOT KEPT: paragraph 1
      was partly bold" said rather than hidden. A bulleted note in the same set
      keeps its indent 1 paragraphs at indent 1

  - given: >
      the same note, mode "prefix" with "NOTE: ", then mode "suffix" with " (END)"
    expect: >
      changed, 8 paragraphs before and after, the list on all 8 - the added
      words land in paragraph 1 and paragraph 8 and take their neighbour's style

  - given: >
      VERSION 5, mode "format". A text note of four paragraphs typed with Enter,
      no list and nothing bold, field "Text", text "numbers 2-4; bold 1",
      replacement empty
    expect: >
      changed, the four paragraphs word for word unchanged, and `noteFormatting` reads
      back "1 no list, 2-4 ArabicNumbers from 1; bold 1" - on the plan,
      paragraphs 2-4 numbered 1. 2. 3. and paragraph 1 bold. NOT RUN: it needs
      Revit (NEEDS-CHECKING FD1, tools/jobs/note-format-2026-10-17.yaml)

  - given: >
      VERSION 5. The same note, text "numbers", replacement "2-4", then
      "lowercase letters", then "start 3", then "indent 1 3"
    expect: >
      each changed and read back as asked: 2-4 ArabicNumbers, then
      LowerCaseLetters, then "from 3" (c. d. e.), then paragraph 3 at indent 1.
      A paragraph Revit renumbers with its list but that was not named is said
      by number in `noteFormatting` and puts the note in `unverified`

negative:
  - given: >
      VERSION 5, mode "format". The same four-paragraph note, text "numbers
      2-5" - paragraph 5 is not there
    expect: >
      REFUSED - "the paragraphs named are not there" - NOTHING WAS CHANGED,
      `changed` empty, the note on the plan exactly as typed. Checked against
      each note BEFORE anything is applied, so a note is never half formatted

  - given: >
      VERSION 5. text "start 3" on paragraphs with no list, or "indent 99", or
      a word it does not know ("bolden 1")
    expect: >
      "start 3" and "indent 99" - the note in `readOnly`, NOT edited, the reason
      in plain words; "bolden 1" - REFUSED before any element is read

  - given: two ducts, field "Text", mode "set"
    expect: >
      REFUSED - not one is a text note - and nothing written. One value on a
      parameter is WRITE_ELEMENT_PARAMETERS, not this

  - given: mode "set" with field "Comments"
    expect: >
      REFUSED before any element is read: set is for a text note's wording only
  - given: a mixed set where only HALF the elements contain the search text
    expect: >
      the other half in `untouched`, NOT in changed and NOT reported as errors.
      This is the normal case for a replace, and calling it a failure makes the
      report unusable while calling it a success reports work that never
      happened

  - given: mode "prefix" on elements whose parameter is BLANK
    expect: >
      those in `blank` and NOT changed. A prefix on an empty parameter creates
      a value where the modeller had none - it would look like data afterwards
      and nobody would know where it came from

  - given: A NUMERIC parameter, such as a length
    expect: >
      REFUSED, in readOnly. Editing it through its display text is lossy - a
      length shown as 2500 is not exactly 2500 internally, and writing the
      display back rewrites a rounded value as the truth

  - given: an element whose Name Revit will not let you set
    expect: >
      in readOnly, the rest still edited, and no throw

  - given: >
      an element where Revit ACCEPTS the write and stores something different
    expect: >
      in `unverified`, NOT in changed. Everything reported as changed was
      re-read after the write

  - given: >
      a field name two text parameters on one element share - a shared
      parameter loaded with the same name as a built-in text one and bound to
      the category (NEEDS-CHECKING P8 arranges it), mode prefix
    expect: >
      those elements in `ambiguous`, not in changed, and BOTH parameters exactly
      as they were. Before version 2 one of the two - Revit's reference calls the
      choice random - took the prefix and was reported changed

  - given: >
      VERSION 4. The numbered note and a bulleted one, mode "replace", a text
      neither contains
    expect: >
      both `untouched`, `noteFormatting` null - nothing written, so nothing to
      read back

  - given: a note whose formatting reads back other than the rule meant
    expect: >
      in `unverified`, NOT in changed, and `noteFormatting` names the
      paragraph and what it reads back

second_route:
  - >
    open a schedule of that parameter in Revit before and after - the column is
    the second route, and it is what a person would actually check

# D-30: the negative case is what catches "answered, and about another model".
# The proof plan is tools/jobs/sheet-sets-by-parameter-scratch-2026-11-01.yaml,
# NEEDS-CHECKING Group KA row KA13. NEVER on a 4355-* job model.

positive:
  - given: >
      the scratch project after MANAGE_SHEET_SETS mode by-parameter
      (SYNC_SHEET_SETS_BY_PARAMETER until 2026-11-01) made its two sets, and
      then A103's "HERON Browser 1" changed from 01_IAB to 02_IFI
    expect: >
      outOfStep 2 - '01_IAB-ISSUED AS-BUILT' OUT OF STEP with "extra A103"
      and '02_IFI-ISSUED FOR INFORMATION' with "missing A103" - inStep 0,
      missingSets empty

  - given: a value no set is named for
    expect: >
      that value in missingSets and its row reading NO SET

  - given: the sets just brought back in step
    expect: >
      inStep 2, outOfStep 0

  # Row 5b-203, added 2026-11-11 with version 2. NOT RUN - Group NK, NK8.
  - given: >
      the scratch project as version 1's positive arranged it - one "HERON
      Browser 1" on Sheets, A103 moved to another value
    expect: >
      outOfStep 2 exactly as version 1 gave it and `ambiguous` EMPTY - the
      count must not turn down a name that occurs once

negative:
  - given: parameterName "ZZZ NO SUCH PARAMETER"
    expect: >
      refused naming it, report empty, inStep 0 and outOfStep 0

  - given: >
      a second project from the default template with no such parameter,
      open beside the first - a DIFFERENT model
    expect: >
      refused naming the parameter and that model's title - the first
      project's sets appearing is what a read of the wrong document would show

  # Row 5b-203, added 2026-11-11 with version 2. NOT RUN - NEEDS-CHECKING
  # Group NK, NK8; it needs a model that carries a duplicated name.
  - given: >
      the scratch project with its two sets in step, and a second parameter
      called "HERON Browser 1" bound to Sheets - a project parameter beside
      the first - so every sheet carries the name twice
    expect: >
      nothing checked: refused says every sheet that has the parameter has
      two of that name, every sheet is in `ambiguous` and named in a finding
      as NOT READ, report empty, inStep 0, outOfStep 0 - never a set called
      out of step, or in step, on whichever of the two Revit returned first
      (row 5b-203)

  # Row 5b-203, added 2026-11-11 with version 2. NOT RUN - Group NK, NK8.
  - given: >
      the scratch project with its two sets in step, "HERON Browser 1" bound
      to Sheets AND Views, and a second parameter of that name bound to Views
      only - so each sheet carries the name once and each view twice
    expect: >
      every view in `ambiguous`; each set that matches its sheets reads NOT
      CONFIRMED and is counted in `unconfirmed`, inStep 0 - never "in step"
      while a sheet or view was not read

second_route:
  - >
    File - Print - Settings, each set selected, its ticked sheets read by a
    person against a sheet list showing the parameter
  - >
    LIST_SHEET_SETS on the same model: each set's sheets by number, read by a
    different card

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  `ViewSheetSet.Name`, `ViewSheetSet.Views` (a `ViewSet`), `ViewSheet`,
  `ViewSheet.SheetNumber`, `Element.LookupParameter`, `Parameter.AsString`
  and `AsValueString` are the same 2020 through 2027 (tools/api-surface
  --members, 2026-11-01). 2023's `IsAutomatic` and `OrderedViewList` order a
  set and are not read. Sets are read as elements, never through the print
  manager, so this changes no application state. Members are compared by
  ElementId's own equality, never as numbers.

# ROUTING - the same rows are in MANAGE_SHEET_SETS and LIST_SHEET_SETS.
#
#   "which sheet sets are out of date"   -> here. A QUESTION
#   "make a sheet set for each value of TCM_Project Browser 1"
#                                        -> MANAGE_SHEET_SETS, mode
#                                           by-parameter (merged in from
#                                           SYNC_SHEET_SETS_BY_PARAMETER,
#                                           2026-11-01)
#   "list the view/sheet sets"           -> LIST_SHEET_SETS
#   "save these sheets as a named set"   -> MANAGE_SHEET_SETS

utterances:
  - which sheet sets are out of date
  - check the sheet sets against the sheet parameter

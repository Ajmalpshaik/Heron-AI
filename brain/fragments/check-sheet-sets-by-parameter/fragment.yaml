id: FRG-SHT-035
semantic-identity: "which View/Sheet Sets are out of step with the sheet parameter value they are named for"
kind: action
domain: revit.sheets
capability: CHECK_SHEET_SETS_BY_PARAMETER
version: 2
source: OFFICIAL
risk: READ

# VERSION 2 (2026-11-11) - A NAME TWO PARAMETERS SHARE IS NEVER READ, and back
# to DRAFT. Version 1 was PROVEN on 2026-11-02 (the proof block below, kept as
# the record of what it proved). Its C# moved, so it is DRAFT again until
# NEEDS-CHECKING Group NK, NK8, is run (D-30). D-54 s3 and FRAGMENT-ISSUES row
# 5b-203: version 1 took `LookupParameter`'s first match, which Autodesk's
# reference calls random when two parameters on one element share the name. A
# sheet or view carrying the name twice is now listed in `ambiguous` and named
# in findings as NOT READ; it joins no value's group and is never called
# missing from a set or extra in one. While any sheet was not read, no set is
# called "in step": one that matches every sheet that was read is NOT
# CONFIRMED and counted in `unconfirmed`. A sheet Revit will not count the
# name on is not read either. With every sheet read, each is grouped exactly
# as version 1 grouped it. Written here and not in `purpose`: the purpose is
# routing text. A read: it still answers through revit_read while DRAFT, and
# says DRAFT (D-117 item 4).

# WRITTEN 2026-11-01 FOR FRAGMENT-ISSUES ROW 5b-1361. Ajmal PS groups his
# sheets by a sheet parameter - "TCM_Project Browser 1", values such as
# "01_IAB-ISSUED AS-BUILT" and "02_IFI-ISSUED FOR INFORMATION" - and keeps one
# View/Sheet Set per value. This answers which sets no longer hold what their
# value says; MANAGE_SHEET_SETS mode by-parameter is the change that puts
# them right (SYNC_SHEET_SETS_BY_PARAMETER until 2026-11-01, merged into it).
# Research: docs/work-notes/investigations/2026-11-01-export-setups.md,
# section 6.
#
# A NEW CARD, NOT A WIDENING. LIST_SHEET_SETS is PROVEN and reads every set
# with no parameter in mind; it already flags the EMPTY and the SAME sets, so
# those are not repeated here.
purpose: >
  Answers, for one sheet parameter, which View/Sheet Sets are out of step with
  it - the sheets that carry a value and are not in the set named for that
  value, the sheets and views in that set that no longer carry it, and the
  values that have no set at all. A set is named for a value as the value
  itself, or with a prefix put in front. A question, read and never changed;
  it opens no transaction.

  **A PARAMETER NO SHEET HAS IS REFUSED, NAMING IT.** Empty and duplicate sets
  are LIST_SHEET_SETS' answer, not this one's.

contract:
  needs:
    - name: doc
      type: Document
    # The parameter's name exactly as the sheet's Properties show it, e.g.
    # "TCM_Project Browser 1".
    - name: parameterName
      type: string
      source: request
    # Put in front of each value to make the set's name, or left out.
    - name: setPrefix
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: report
      # ONE string, " || " between values: "<value> -> set '<name>': in step,
      # N sheets" or "... OUT OF STEP: missing A101, A102; extra M201" or
      # "... NO SET". Sorted by value.
      role: result
      type: string
    - name: inStep
      role: result
      type: int
    - name: outOfStep
      # Sets that exist and hold something other than their value's sheets.
      role: result
      type: int
    - name: missingSets
      # Values with no set of their name, "; " between them.
      role: result
      type: string
    - name: findings
      type: IList<string>
    - name: refused
      # Why it declined - a parameter no sheet carries, naming it. Never a
      # thing it FOUND (D-52).
      role: accounting
      type: string
    - name: ambiguous
      # VERSION 2. The sheets and views carrying TWO OR MORE parameters by
      # this name, where Revit's lookup would pick one at random; `findings`
      # names them. Not read, in no value's group, never missing or extra
      # (D-54 s3, FRAGMENT-ISSUES 5b-203). Turned down, never found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: unconfirmed
      # VERSION 2. Sets that match every sheet and view that WAS read while
      # some were not read - reported NOT CONFIRMED, never "in step": an
      # unread sheet may carry the set's value and be missing from it. 0 when
      # every sheet was read. Not judged, so accounting (D-52).
      role: accounting
      type: int


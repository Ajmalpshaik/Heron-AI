positive:
  - given: >
      a floor plan, "grid 1 | grid Skew" - grid 1 along X and Skew drawn at 60
      degrees through the same point - radius 3000, on Revit 2024
    expect: >
      one angular dimension reading 60 degrees, the angle Skew was drawn at; and
      "grid A | grid Skew" reading 30 degrees, so the answer follows the arms.
      Proved 2026-10-03 in Project1

negative:
  - given: one reference
    expect: refused by name, nothing created

  - given: >
      two parallel arms - "grid A | grid B"
    expect: >
      refused in words: they never meet and make no angle. Version 1's worst case,
      an arc centred somewhere other than the apex, cannot be typed any more: the
      arc is struck here, on the apex

  - given: a view template handed in as the view
    expect: refused by name, not a silent empty answer

second_route:
  - >
      Revit's own Annotate then Angular dimension picked on the same two walls,
      and the two values compared

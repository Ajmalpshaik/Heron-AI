positive:
  - given: 'a face-based diffuser family, six points 300 mm under a ceiling in this model, ray up, the default 3D view'
    expect: >
      six instances placed, each reporting a real host. Move the ceiling
      afterwards and they move with it - that is the whole difference from
      PLACE_FAMILY_INSTANCES

  - given: 'the same, the ceiling in a loaded architectural LINK, searchLinks true (version 2)'
    expect: >
      six instances hosted on the linked ceiling, the findings saying so and
      that unloading the link leaves them unhosted - or Revit's refusal named
      per point, which settles what version 1 only believed

  - given: a family type that has never been used in this project
    expect: >
      it is activated first and said so. An unactivated symbol places nothing and
      raises nothing, which is the most silent failure in the Revit API

  - given: 'points 300 mm in front of a wall, ray north'
    expect: >
      the same result on the wall face. Any real face can host

negative:
  - given: a LEVEL-BASED family passed to this
    expect: >
      REFUSED by name, with its placement type stated, and nothing placed. The
      face overload throws from inside Revit for this, and the message says
      nothing a modeller can act on

  - given: 'points with nothing above them, ray up'
    expect: >
      each point named as finding no face; nothing placed

  - given: a placement that returns an instance with no host
    expect: >
      counted as REFUSED even though Revit raised nothing. An unhosted instance
      looks completely correct on screen and is exactly what this prevents

  - given: any run at all
    expect: >
      NO TRANSACTION OPENED HERE. Golden Rule 16 - undo is the caller's, and one
      operation is one undo entry

second_route:
  - >
    Move or delete the host afterwards. A properly hosted instance moves with it
    or goes with it; one that stays behind was never hosted, whatever this
    reported

  - >
    SELECT_BY_HOST over the host element. It should return exactly the instances
    this placed, and a count that disagrees means the host verification here is
    reading something other than the real relationship

compatibility-note: >
  One implementation for every release. `Document.Create.NewFamilyInstance(Reference,
  XYZ, XYZ, FamilySymbol)`, `Family.FamilyPlacementType`, `FamilySymbol.IsActive` /
  `.Activate()`, `FamilyInstance.Host` and `Reference.ElementId` are unchanged
  2020 to 2027 - checked by compiling this fragment against the reference
  assemblies for all eight. Version 2's ReferenceIntersector(View3D) with
  TargetType, FindReferencesInRevitLinks and FindNearest, ReferenceWithContext
  and Reference.GlobalPoint are present in all eight too - read off
  RevitAPI.xml in the Nice3point reference packages on 2026-10-13.

# ROUTING - cross-referenced in PLACE_FAMILY_INSTANCES and SELECT_BY_HOST.
#
#   "put diffusers on that ceiling"    -> here, when they must be HOSTED
#   "place these on the wall face"     -> here
#   "place a family at these points"   -> PLACE_FAMILY_INSTANCES, which is
#                                         point-and-level and NOT hosted
#   "put a skylight in the roof",      -> PLACE_HOSTED_FAMILY. A family whose
#    "put floor drains in the floor",     Host setting reads Wall, Floor,
#    "put doors in the walls"             Ceiling or Roof goes INTO that host,
#                                         found at a point; this one places a
#                                         FACE-BASED family on a face. The
#                                         words cannot tell which a family
#                                         is - its Host setting does - and
#                                         PLACE_HOSTED_FAMILY refuses a
#                                         face-based family naming this one
#                                         (measured 2026-10-06, Project2:
#                                         M_Downlight - Round - LED and
#                                         M_Floor Drain - Round)
#   "what is hosted on this"           -> SELECT_BY_HOST

utterances:
  - place diffusers hosted on that ceiling
  - put this family on the wall face
  - place face-based families properly hosted

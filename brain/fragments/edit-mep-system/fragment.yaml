heron-since: 0.1.0
heron-layer: brain

id: FRG-MEP-071
semantic-identity: "edit the members of a duct or piping system already in the model - Add to System, Remove from System"

# WHY IT EXISTS - a comment, not `purpose`, because `purpose` is searched.
# 2026-11-01: asked for in the modeller's words "add these diffusers to Supply
# Air 2", "take this terminal out of the system", "add these sprinklers to the
# FP system" and "remove this pipe run from Domestic Cold Water 1". Nothing in
# Heron edited a duct or piping system that already exists (checked that day
# with brain/heron_retrieve.py on each sentence, Revit 2024: PLACE_FAMILY_
# INSTANCES, CONNECT_AIR_TERMINALS, CREATE_MEP_SYSTEM, SET_MEP_SYSTEM_TYPE and
# REPORT_SPRINKLER_NETWORK came back, and none of them changes an existing
# system's members). The Revit ribbon survey of the same day marked Add /
# Remove from System PARTIAL for exactly this.
#
# A NEW CAPABILITY, NOT A WIDENING. CREATE_MEP_SYSTEM (FRG-MEP-062, PROVEN)
# makes a NEW system from elements on none; a change under its impl/ would
# make its proof stale for a job it does not do. SET_MEP_SYSTEM_TYPE changes a
# run's classification, not which system a terminal is on.
# EDIT_ELECTRICAL_CIRCUIT (FRG-MEP-070) is the same two buttons for circuits,
# and its shape and its care are copied here.
#
# ONE FRAGMENT FOR THE TWO BUTTONS. Add to System and Remove from System act
# on the same element - one duct or piping system that already exists - and
# need the same things: which system, which elements. `edit` says which.
#
# WHICH SYSTEM IS NEVER GUESSED. A name matching no system exactly is taken
# only when ONE system holds it as a whole word of its name or as its system
# type's name or abbreviation, and the answer says how it was found. Two or
# more refuses and names them. An element on two systems is skipped and both
# are named. One already on ANOTHER system is never moved by an add: it is
# skipped and the other system named.
#
# TAKING EVERY TERMINAL OUT OF A SYSTEM IS REFUSED for that system. Revit's
# API documentation forbids it on all eight releases, and a system left empty
# is one to delete, not to edit (Article 7). The base equipment is not taken
# out here; Revit says the element joined to it cannot be removed.
#
# DUCTS, PIPES, FITTINGS AND ACCESSORIES ARE NAMED AND LEFT. They are on a
# system through what they connect to - MEPSystem.Elements lists terminals
# and equipment only. "remove this pipe run from Domestic Cold Water 1"
# reaches here and is answered with that reason and with what does change a
# run: disconnecting it, or another system type. What Revit itself does with a
# pipe's id handed to Remove is NOT known from the assemblies - NEEDS-CHECKING
# Group JW, JW8 - and it is not tried until that is answered.
#
# THE IDENTITY AND PURPOSE ARE SHORT ON PURPOSE (2026-11-01). The first
# wording - "add elements to or remove them from", terminals "go onto it or
# come off it" - put this card nearest "put them on the screen" (0.403 on
# the model backend), pushing SET_SELECTION out of the top two and failing
# tests/test_embed.py. Reworded to 0.309; the modeller's utterances unchanged.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
kind: action
domain: revit.mep
capability: EDIT_MEP_SYSTEM
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Edits the membership of an existing duct or piping system, as Revit's Add
  to System and Remove from System buttons do, and reads the system's members
  back afterwards.

contract:
  needs:
    - name: doc
      type: Document
    # The selection: the terminals, fixtures, sprinklers or equipment to add
    # or take out, and/or the one system picked in the System Browser.
    - name: elements
      type: IList<Element>
    # Which button: "add" or "remove" (also "add to system", "remove from
    # system", "take out"). Anything else refuses and changes nothing.
    - name: edit
      type: string
      source: request
    # The system's name as the System Browser shows it - "Supply Air 2". Left
    # out, the system is the one selected, or - to take an element out - the
    # one system that element is on.
    - name: systemName
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: systemIds
      # The systems that read back changed.
      role: result
      type: IList<ElementId>
    - name: changed
      # Elements that read back added or taken out - never what was asked.
      role: result
      type: int
    - name: report
      # ONE STRING, a line per system changed: before and after.
      role: accounting
      type: string
    - name: refused
      # Why NOTHING was changed, in the modeller's words - evidence it looked
      # and said no, never a thing it found (D-52). Null when something was
      # changed. ONE STRING, because a list reaches the reply cut to sixty
      # characters an item.
      role: accounting
      type: string
    - name: findings
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. MEPSystem.Add(ConnectorSet),
  MEPSystem.Remove(ICollection<ElementId>), MEPSystem.Elements and
  BaseEquipment, MEPSystemType.SystemClassification and Abbreviation,
  Connector.MEPSystem, Domain, ConnectorType, DuctSystemType and
  PipeSystemType, and FamilyInstance.MEPModel.ConnectorManager are present and
  unchanged 2020 through 2027 - read with tools/api-surface on 2026-11-01. The
  API documentation of all eight says Remove refuses taking every terminal out
  and refuses the element joined to the base equipment. Categories are
  compared by ElementId built from the BuiltInCategory and ids are carried as
  ElementId, never read as numbers.

# ROUTING - repeated in CREATE_MEP_SYSTEM, SET_MEP_SYSTEM_TYPE and
# EDIT_ELECTRICAL_CIRCUIT (2026-11-01).
#
#   "add these diffusers to Supply Air 2"     -> here, edit add
#   "add these sprinklers to the FP system"   -> here, edit add
#   "take this terminal out of the system"    -> here, edit remove
#   "remove this pipe run from Domestic
#    Cold Water 1"                            -> here, edit remove - answered
#                                                that a run is changed by
#                                                disconnecting it or by its
#                                                system type
#   "make a supply air system from these"     -> CREATE_MEP_SYSTEM - a NEW
#                                                system
#   "put these diffusers on the FCU's system" -> CREATE_MEP_SYSTEM, declared
#                                                there
#   "change these ducts to return air"        -> SET_MEP_SYSTEM_TYPE
#   "add these lights to circuit 3"           -> EDIT_ELECTRICAL_CIRCUIT - a
#                                                circuit, not a duct or
#                                                piping system
#   "unhook the terminal from the duct"       -> DISCONNECT_CONNECTORS - a
#                                                physical join, not system
#                                                membership
#   "what system is this on"                  -> READ_MEP_SYSTEM

utterances:
  - add these diffusers to Supply Air 2
  - take this terminal out of the system
  - add these sprinklers to the FP system
  - remove this pipe run from Domestic Cold Water 1

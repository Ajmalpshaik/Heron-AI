id: FRG-MEP-017
semantic-identity: "the runs that stop and serve nothing - the accidents, not the deliberate ends"
kind: action
domain: revit.mep
capability: FIND_DEAD_ENDS
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Finds runs that end at nothing - a duct stopping in mid-air, a branch left
  behind when the layout changed, a spur drawn to a terminal that was later
  deleted.

  **MOST OPEN ENDS ARE MEANT TO BE THERE, AND THAT IS WHY A RAW OPEN-END LIST
  GETS IGNORED.** A run ending at an air terminal, a fixture, a piece of
  equipment or a cap is finished, not broken. Report all of those as faults and
  the sweep gets switched off within a week. Every open end is classified first
  and only the unexplained ones are the finding:

  | Class | Meaning |
  |---|---|
  | `served` | the end sits at a terminal, fixture or equipment — fine |
  | `capped` | a cap fitting closes it — fine |
  | `stub` | very short and open — usually a deliberate future connection, reported quietly |
  | `deadEnd` | a real run ending at nothing — **this is the finding** |

  **"SERVES NOTHING" IS DECIDED BY WALKING, NOT BY LOOKING AT THE LAST
  ELEMENT.** A branch can end at a fitting that ends at another fitting that
  ends at nothing. Judging the last element alone calls that chain served,
  because a fitting is something. The walk follows the chain from each open end
  until it finds something served or runs out.

  **A STUB IS REPORTED SEPARATELY RATHER THAN SUPPRESSED.** A short open spur is
  usually deliberate and occasionally the whole problem. Folding it into
  `deadEnd` produces false alarms; dropping it hides a real one. It gets its own
  list and `stubLength` says what counted as short.

contract:
  needs:
    - name: elements
      type: IList<Element>
    - name: stubLength
      type: double
      source: request
  provides:
    - name: deadEnds
      role: result
      type: IList<ElementId>
    - name: stubs
      # Very short open ends - usually a deliberate future connection,
      # REPORTED QUIETLY rather than dropped. One of the classes this fragment
      # exists to separate.
      role: result
      type: IList<ElementId>
    - name: served
      # Open ends sitting at a terminal, fixture or equipment - FINE, and
      # classified so they never reach the finding. The evidence it looked
      # (D-52).
      role: accounting
      type: IList<ElementId>
    - name: capped
      # Open ends closed by a cap fitting - FINE, and classified so they never
      # reach the finding. The evidence it looked (D-52).
      role: accounting
      type: IList<ElementId>
    - name: openEndsFound
      # How many open ends were classified at all. The size of the sweep -
      # MOST OPEN ENDS ARE MEANT TO BE THERE, which is why the raw number is
      # not the answer (D-52).
      role: accounting
      type: int


revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `ConnectorManager`,
  `Connector.IsConnected` and `Connector.AllRefs` are unchanged 2020 to 2027.
  `stubLength` arrives in Revit's internal feet, and no units API is touched -
  D-20 keeps the millimetre conversion at the edge where the user is. What
  counts as served is decided by CATEGORY rather than by a type test, so one
  code path covers terminals, fixtures and equipment.

# ROUTING - the same rows are in the fragments named here.
#
#   "where are the open ends"        -> here - it sorts the DELIBERATE ends
#                                       from the mistakes
#   "connect the open ends"          -> CONNECT_OPEN_ENDS - the fix, and it
#                                       joins only ends already at one point
#   "is this duct connected"         -> TRACE_CONNECTIVITY
#   "why is my pressure drop zero"   -> REPORT_MEP_PRESSURE_DROP reports the
#                                       system as UNCALCULATED, and an open
#                                       end is the usual cause. This fragment
#                                       finds it; that one shows the symptom

#   "are all the sinks and toilets connected to the drainage" ->
#                                        CHECK_FIXTURE_CONNECTIVITY - it
#                                        starts at the FIXTURE. A fixture
#                                        nobody piped produces no open end, so
#                                        this one structurally cannot see it
#   "which pipes are still open at the end" -> here - a READ. It classifies
#                                        every open end and only the
#                                        unexplained ones are the finding
utterances:
  - which runs end in nothing
  - find the dead ends
  - is there a duct going nowhere
  - which branch was left behind
  - find the open ends that matter
  - is anything not terminated
  - where are the open ends
  - which pipes are still open at the end

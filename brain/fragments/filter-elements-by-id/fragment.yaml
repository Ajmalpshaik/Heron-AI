id: FRG-ELE-003
semantic-identity: "the elements carrying these ids, in the active document"
kind: filter
domain: revit.elements
capability: FILTER_ELEMENTS_BY_ID
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Turns a list of element ids into the elements themselves - the starting point
  for any job that begins from what the user already has selected, or from ids
  carried over from an earlier answer.

  Reports `missing` - ids that resolve to nothing - rather than dropping them.
  An id goes stale the moment somebody deletes the element or undoes the thing
  that made it, and this fragment exists to be composed onto a trace, so a
  silently shorter list would read as "the system is smaller than you thought"
  rather than as "three of these are gone".

contract:
  needs:
    - name: doc
      type: Document
    - name: elementIds
      type: IList<ElementId>
      source: request
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: missing
      # Ids that resolve to nothing. A count of what it was GIVEN and could
      # not use, never an element it found (D-52).
      role: accounting
      type: IList<ElementId>


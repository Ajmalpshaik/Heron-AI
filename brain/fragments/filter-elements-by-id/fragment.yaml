id: FRG-ELE-003
semantic-identity: "the elements carrying these ids, in the active document"
kind: filter
domain: revit.elements
capability: FILTER_ELEMENTS_BY_ID
# VERSION 2 (2026-10-12, FRAGMENT-ISSUES 5b-441): element ids may be TYPED,
# and the answer names what each element is. DRAFT until a Revit run signs it;
# version 1's proof below no longer describes the code and reads STALE.
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Turns a list of element ids into the elements themselves - the starting point
  for any job that begins from what the user already has selected, or from ids
  carried over from an earlier answer.

  Reports `missing` - ids that resolve to nothing - rather than dropping them.
  An id goes stale the moment somebody deletes the element or undoes the thing
  that made it, and this fragment exists to be composed onto a trace, so a
  silently shorter list would read as "the system is smaller than you thought"
  rather than as "three of these are gone".

contract:
  needs:
    - name: doc
      type: Document
    # The word `selected` - everything selected in Revit - or, from version 2,
    # element ids typed as Revit shows them: digits only, comma separated -
    # "8453537, 8453556". Each is matched as TEXT in the model being read;
    # one that names nothing there refuses the whole call, naming it. Typed
    # ids are taken on a READ only - read `named` before a change uses them.
    - name: elementIds
      type: IList<ElementId>
      source: request
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: missing
      # Ids that resolve to nothing. A count of what it was GIVEN and could
      # not use, never an element it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: named
      # VERSION 2. What each element in `elements` is - its id, its category,
      # and "Family: Type" - in one line: "3 element(s): 8453537 Mechanical
      # Equipment - "FCU: 600"; ...". A STRING, because a reply cuts a list
      # to three items and prints an element by its name alone, which cannot
      # show that a typed id named the wrong thing. Accounting: it describes
      # what `elements` holds.
      role: accounting
      type: string


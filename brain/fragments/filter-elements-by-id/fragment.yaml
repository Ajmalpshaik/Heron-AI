  fingerprint: c6a59bbe682fae83

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Document.GetElement(ElementId)` is
  unchanged from 2020 to 2027, and no ElementId is ever CONSTRUCTED here - the
  ids arrive from the request. That matters: 2024 widened ElementId to 64-bit,
  and `new ElementId(int)` is the call that breaks across that boundary. Taking
  ids rather than integers is what makes this fragment version-proof.
  Version 2 keeps that true for TYPED ids: the add-in's binder matches each
  one as text against `ElementId.ToString()` over one FilteredElementCollector
  walk (ElementIsElementTypeFilter both ways), and builds no id from a number.
  The fragment adds `Element.GetTypeId()`, `ElementType.FamilyName` and
  `Category.Name`, all unchanged 2020 to 2027.

# Three sentences were removed on 2026-08-30, found by tools/check-routing.py:
# "trace from this element" and "what is connected to that duct" are
# TRACE_CONNECTIVITY's, and "check these elements" is a QA sentence. This
# fragment turns ids into elements - it is the FIRST STEP of those jobs, and a
# fragment claiming the whole sentence is the composition mistake that
# brain/retrieval-history.md keeps arriving at: a composition is what a SKILL
# names. The search was already routing all three elsewhere, correctly.
# "the ones I have selected" WAS DECLARED HERE AND WAS MOVED, 2026-09-01,
# when READ_SELECTION was written. It is not a rank that was given away: this
# fragment resolves ids somebody already has - from a previous answer, from a
# schedule - and it has no way to ask Revit what is highlighted on screen.
# READ_SELECTION does exactly that, so the sentence was never this fragment's
# to answer and answering it meant acting on the wrong set with no sign
# anything had gone wrong.

# VERSION 2 - TYPED IDS, AND WHY HERE (FRAGMENT-ISSUES 5b-441).
#
# On 2026-10-12 (Revit 2020) PLACE_FAMILY_INSTANCES answered with the ids of
# three new units, and nothing would take them back: this card refused any
# number, so each unit was selected with SELECT_IN_REGION drawn round a spot
# only it stood in, just so ROTATE_ELEMENTS and MIRROR_ELEMENTS could act on
# one at a time. Now:
#
#   revit_read  FILTER_ELEMENTS_BY_ID  elementIds=8453537
#               -> named "1 element(s): 8453537 Mechanical Equipment - ..."
#   revit_change ROTATE_ELEMENTS  angleRadians=..., pivot=...
#               expect_from="filter-elements-by-id where elementIds=8453537"
#
# THE RULE LIVES IN THE ADD-IN'S BINDER, KEYED ON THIS NEED'S NAME, AND ONLY
# ON A READ - this card is the one READ that declares `elementIds`. A write
# that declares it later is refused typed ids and told to come here first, so
# what each id names is always seen before a change uses it.
#
# WHY NOT "LET PLACE_FAMILY_INSTANCES LEAVE `elements`" INSTEAD. It would hand
# the WHOLE placement on as one set, and the job that found this turned and
# mirrored each unit differently; it would serve ids from that one card only,
# not from a clash list or a schedule; and it would re-open the proof of a
# PROVEN card the sprinkler and terminal layouts stand on. It is still worth
# having - every creator leaves `created`, which the binder hands to an
# `elements` need, and that card leaves `placed` - so it is recorded in the
# same row, not done here.

utterances:
  - these ones
  - use the ids from the last answer
  - the elements with these ids
  - get the elements for those ids

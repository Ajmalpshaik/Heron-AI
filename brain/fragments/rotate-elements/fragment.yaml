id: FRG-GEO-006
semantic-identity: "turn these elements about a vertical axis, and check they really turned"
kind: action
domain: revit.geometry
capability: ROTATE_ELEMENTS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Turns every element about a vertical axis - a mis-oriented piece of equipment
  spun 90 degrees, a cluster of terminals turned to match a new room layout.

  Like moving, and for the same reason: Revit's rotate call returns normally and
  rotates NOTHING for a pinned element or a group member. Five grouped air
  terminals stayed at 0.00 degrees while the code reported *"rotated 5, skipped
  0"*. So orientation is read before and after, and only a change in it counts.

  The pivot may be left out, and then each element turns about its own position
  - which is what *"spin that damper round"* means, as against *"swing this
  whole row about the corner"*.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: angleRadians
      type: double
      source: request
    - name: pivot
      type: XYZ
      source: request
  provides:
    - name: rotated
      role: result
      type: int
    - name: blocked
      # Elements that did not turn at all. Revit's rotate call returns
      # normally and turns nothing on a group member - five grouped terminals
      # stayed at 0.00 degrees while an earlier version reported "rotated 5"
      # (D-52).
      role: accounting
      type: IList<ElementId>
    - name: unverified
      # Elements whose new angle could not be read back to confirm. The
      # evidence it could not check, never a confirmed rotation (D-52).
      role: accounting
      type: IList<ElementId>


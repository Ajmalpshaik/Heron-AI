compatibility-note: >
  One implementation for every release. `ElementTransformUtils.RotateElement`,
  `Line.CreateBound` and `LocationPoint.Rotation` are unchanged 2020 to 2027.
  The angle arrives in RADIANS, which is what the API takes - the degrees a
  person says are converted at the edge, not here (D-20's rule applied to an
  angle rather than a length).

# ROUTING (2026-11-01, ROTATE_ELEMENTS_ABOUT_AXIS merged in)
#
#   "turn this damper round"       -> here - vertical axis, the plan rotation
#   "tilt this panel"              -> here, `axisLine` horizontal
#   "rotate this about X"          -> here, `axisLine` - and say WHERE the X
#                                     axis is
#   "rotate the beam's section"    -> NOT a rotation at all. A beam's
#                                     cross-section rotation is an instance
#                                     PARAMETER - WRITE_ELEMENT_PARAMETERS

# ROUTING (2026-10-12)
#
#   "straighten these walls onto the axis" -> STRAIGHTEN_OFF_AXIS_LINES - each
#                                             turned by its own error, not by
#                                             one given angle

utterances:
  - rotate the equipment 90 degrees
  - spin that damper round
  - turn them to face the other way
  - swing this row about the corner
  - the diffuser is the wrong way round
  - rotate them 180
  # MOVED 2026-11-01 from ROTATE_ELEMENTS_ABOUT_AXIS, merged into this card.
  - tilt these elements
  - rotate about a horizontal axis
  - rotate these about this line
  - rotate on the X axis
  - rake these supports
  - tilt this panel
  # ...and its semantic identity, which nothing else declares:
  - tilt these about a horizontal axis, not about the vertical one

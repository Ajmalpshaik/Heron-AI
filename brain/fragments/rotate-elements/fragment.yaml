id: FRG-GEO-006
semantic-identity: "turn these elements about a vertical axis, and check they really turned"
kind: action
domain: revit.geometry
capability: ROTATE_ELEMENTS
version: 3
source: OFFICIAL
risk: MODIFY

# VERSION 2 (2026-11-01) - ROTATE_ELEMENTS_ABOUT_AXIS WAS MERGED INTO THIS CARD
# on the owner's instruction ("make sure there is no duplicate tools"), and is
# DEPRECATED. The same job - elements turned, and checked that they turned -
# about a vertical axis here and about any line there. Both are here now:
# `axisLine`, two points in millimetres, so it can tilt. What that card had
# and this one lacked: the axis; Revit's outright refusal (pinned) KEPT APART
# from accepted-and-did-not-move, in `refused`; `rotatedIds`; `findings`.
#
# THE SAFER RULE KEPT IN EACH CONFLICT: a zero angle, or a whole turn, is
# REFUSED and nothing attempted - that card's rule; version 1 here counted it
# as rotated. An element with nothing to compare is UNVERIFIED, never counted
# as turned - this card's rule; that one counted it as turned. And that
# card's check compared a placed element's POSITION only, so one turned about
# a line through its own point was reported as not moving: fixed in the move,
# the comparison is now every reading that changes when a thing turns, in
# three dimensions. Where its outputs are now: `rotated` (ids) ->
# `rotatedIds`; `didNotMove` -> `blocked`; `refused` -> `refused`; `findings`
# -> `findings`.
#
# Version 1's proof below no longer described the code (impl/ changed) and
# was kept as the record; DRAFT at the time, until version 2 is proved on a
# real model (D-30).
#
# VERSION 3 (2026-11-01, the review of the merges) - THE PIVOT CAN BE LEFT OUT,
# AS THE PURPOSE SAID IT COULD. `pivot` was declared XYZ, and the add-in refuses
# an absent point before the card runs - so "each about its own point" (the
# null-pivot branch the code has had since version 1, "spin that damper round")
# could never be asked. `pivot` is now text the card reads itself: "x,y,z" in
# millimetres as before - the add-in's own unit for a point, so every call that
# typed a pivot types it the same way - and left out it binds `none`, each
# element about its own point ("itself" reads the same). A pivot that is not
# three numbers is refused and nothing turned. The least change: no binder
# change, one contract type, one parse the card already had for `axisLine`.
# Still DRAFT at the time (D-30); version 1's proof was still the record.

purpose: >
  Turns every element about a vertical axis - a mis-oriented piece of equipment
  spun 90 degrees, a cluster of terminals turned to match a new room layout.

  Like moving, and for the same reason: Revit's rotate call returns normally and
  rotates NOTHING for a pinned element or a group member. Five grouped air
  terminals stayed at 0.00 degrees while the code reported *"rotated 5, skipped
  0"*. So orientation is read before and after, and only a change in it counts.

  The pivot may be left out, and then each element turns about its own position
  - which is what *"spin that damper round"* means, as against *"swing this
  whole row about the corner"*. Since version 3 it really can be: left out, it
  reads as none.

  Version 2 turns about any line given as well - `axisLine` - so a panel can
  tilt; a zero angle is refused, and Revit refusing outright is kept apart
  from an element that did not move.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: angleRadians
      type: double
      source: request
    # VERSION 3: TEXT, read by the card - "x,y,z" in MILLIMETRES, as the
    # add-in read the XYZ it was until then ("24000,3000,0"). Left out it binds
    # `none` - each element turns about its own location point, the "spin
    # that damper round" job; "itself" means the same. Anything else that is
    # not three numbers is refused and nothing turned. Not used when
    # `axisLine` is given.
    - name: pivot
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 2, from ROTATE_ELEMENTS_ABOUT_AXIS. The line to turn about, two
    # points in MILLIMETRES - "0,0,3000; 5000,0,3000" is a horizontal axis 3 m
    # up, so the elements TILT. Left out ("none"): a vertical axis through
    # `pivot`, as version 1; given, the pivot is not used.
    - name: axisLine
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: rotated
      role: result
      type: int
    - name: blocked
      # Elements that did not turn at all. Revit's rotate call returns
      # normally and turns nothing on a group member - five grouped terminals
      # stayed at 0.00 degrees while an earlier version reported "rotated 5"
      # (D-52).
      role: accounting
      type: IList<ElementId>
    - name: unverified
      # Elements whose new angle could not be read back to confirm. The
      # evidence it could not check, never a confirmed rotation (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # VERSION 2. Elements Revit would not rotate at all - pinned. KEPT APART
      # from `blocked`, which Revit accepted and did not move. Evidence, never
      # a result (D-52).
      role: accounting
      type: IList<ElementId>
    - name: rotatedIds
      # VERSION 2. The elements that turned - the ids `rotated` counts.
      role: result
      type: IList<ElementId>
    - name: findings
      # VERSION 2. The outcomes in a sentence, or why nothing was turned.
      type: IList<string>


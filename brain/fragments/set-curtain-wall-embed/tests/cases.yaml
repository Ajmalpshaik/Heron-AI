# THE PROOF PLAN, written 2026-11-24 in a cloud session with no Revit, and NOT
# RUN. Not tested in Revit (D-30). The owner runs it - NEEDS-CHECKING Group
# QB, rows QB10 and QB11. The curtain wall type is made by hand, so there is
# no batch job: the cases are run with try-once or validate on a scratch copy.
#
# THE ARRANGEMENT:
#   1. CREATE_WALL draws a basic wall 9000 mm long, 3000 mm high, on "Level
#      1", from 0,72000,0 to 9000,72000,0, of "Basic Wall: Generic - 200mm"
#      - clear of the building
#   2. ONE wall in a scratch copy by hand first: DUPLICATE_TYPE of "Curtain
#      Wall: Curtain Wall" named "HERON QB Embed", its Automatically Embed
#      UNTICKED, and one 3000 x 2000 wall of it drawn by hand on the same
#      line, from 3000 to 6000, saved. Read its box with
#      READ_ELEMENT_PARAMETERS first: "Automatically Embed" No
#   3. this fragment with that curtain wall selected, embed "yes"

positive:
  - given: >
      THE ARRANGEMENT ABOVE, Revit 2020 or 2024; the HERON QB Embed wall
      selected, embed "yes"
    expect: >
      typesChanged 1, alreadyThat empty, refused empty. readBack "'Curtain
      Wall: HERON QB Embed' now ticked - 1 wall(s) of this type". The cut part
      RECORDS one of two things, both a result: "cut no wall before, 'Generic
      - 200mm' (id ...) now" - ticking embeds a wall already drawn - or "cut no
      wall before, no wall now" - it embeds only walls drawn after; then draw
      a second HERON QB Embed wall by hand on the basic wall and read it again.
      RECORD which, in Group QB

  - given: the same wall afterwards, embed "no"
    expect: >
      typesChanged 1; the box reads back off; what it cuts after is recorded
      as above

  - given: the first case on the other release of the two
    expect: the same answer

negative:
  - given: >
      The same arrangement with the BASIC wall
      selected instead of the curtain wall; embed "yes"
    expect: >
      typesChanged 0, readBack empty; notCurtain names it "a basic wall, not a
      curtain wall"; refused "Nothing given is a curtain wall ... Select the
      curtain wall, not the wall it sits in". Edit Type on Generic - 200mm:
      nothing written

  - given: the first positive again straight after it - embed "yes" twice
    expect: >
      typesChanged 0, alreadyThat "already has Automatically Embed ticked"

  - given: embed "maybe"
    expect: refused, naming yes and no; nothing changed

second_route:
  - >
      By hand: Edit Type on HERON QB Embed - the Automatically Embed box shows
      what readBack says; in a 3D view the basic wall has, or has not, an
      opening where the curtain wall is

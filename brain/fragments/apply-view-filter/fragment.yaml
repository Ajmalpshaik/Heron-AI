id: FRG-VIEW-039
semantic-identity: "put that filter on this view and make it do something"
kind: action
domain: revit.views
capability: APPLY_VIEW_FILTER
version: 2
source: OFFICIAL
risk: MODIFY
# A settings change: after it runs from the chat, the Companion page offers its values
# as a table the modeller can edit and apply again (docs/40 section 21.1).
companion: settings

purpose: >
  Adds a filter to a view and sets its whole row on the view's Visibility/Graphics
  Filters tab - Enable Filter, Visibility, Projection/Surface Lines and Patterns,
  Transparency, Cut Lines and Patterns, Halftone. The step after making a filter -
  without which the filter exists in the project and does nothing to any drawing.

  **Every control of the row, since version 2 (2026-09-28, FRAGMENT-ISSUES
  5b-248).** The graphic ones come in `overrides`: line pattern, colour and
  weight; foreground and background pattern, colour and Visible tick; for the
  surface and for the cut; transparency, halftone. Patterns by the name Revit
  shows, or `solid`. `enabled` is the Enable Filter tick and `visible` the
  Visibility tick. `solidFill` puts Revit's solid fill on as the foreground
  pattern from this fragment's own code, so it works on an add-in that has not
  been restarted since the pattern keys were added to the parser.

  **A blank leaves it as it is.** With `keepOtherSettings` blank or true only
  what `overrides` sets changes, so "halftone the return air filter" keeps its
  colours. `keepOtherSettings=false` replaces the filter's whole override - the
  way to clear a colour or switch halftone, transparency or a Visible tick back
  to Revit's default, which a keep-mode call cannot do because those defaults
  are also values. `overrides=none` asks for no graphic change at all, for a
  call that only ticks or unticks.

  **Cut is never stamped where it cannot show.** When none of the filter's
  categories can be cut (`Category.IsCuttable`), Revit greys the Cut columns out
  and a cut value set anyway is stored and draws nothing. The cut half is left
  out and the answer says "cut not applicable to this filter's categories" and
  names them.

  **"Untick the filter" is two different ticks in Revit's own dialog** - Enable
  Filter and Visibility sit side by side. Unticking Visibility HIDES what the
  filter matches; unticking Enable Filter switches the filter off so its
  elements draw as if it were not there. Ask which is meant when the sentence
  does not say.

  **It works with either kind of filter.** A rule-based view filter and a saved
  selection filter are both looked up through the class they share, and a view
  does not care which it was handed. That is why one fragment serves both
  CREATE_VIEW_FILTER and CREATE_SELECTION_FILTER.

  **Projection and cut are BOTH set, always.** Revit does not derive one from
  the other, and setting only the projection is why a filter looks right in plan
  and shows the wrong colour the moment anything is cut. Found on a real model
  where twenty-six filters carried a projection colour and no cut colour.

  **Re-running it updates rather than fails.** A filter already on the view has
  its override and ticks rewritten, which is what somebody adjusting a colour
  actually wants - and the `summary` names each setting that changed, before and
  after, or says NOTHING CHANGED.

  **Hiding is done here too, and it is the same operation.** A filter set
  invisible hides everything it matches in that view - the ordinary way to take
  a discipline out of a drawing without deleting anything.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: view
      type: View
      source: request
    # The filter itself, resolved. Looking it up by name here would hide a
    # near-miss behind a silent no-op.
    - name: filter
      type: FilterElement
      source: request
    # Built by the add-in's parser from "key=value; key=value", or `none`.
    - name: overrides
      type: OverrideGraphicSettings
      source: request
    # The Visibility tick. False HIDES what the filter matches in this view.
    - name: visible
      type: bool
      source: request
    # The Enable Filter tick: true, false, or BLANK to leave it as it is.
    # Revit 2021 and later; a non-blank value on 2020 refuses the whole call.
    - name: enabled
      type: string
      source: request
    # BLANK or true: only what `overrides` sets changes. false: `overrides`
    # replaces the filter's whole override on this view.
    - name: keepOtherSettings
      type: string
      source: request
    # surface, cut or both: Revit's solid fill as the foreground pattern, set
    # by this fragment rather than the parser. BLANK sets nothing.
    - name: solidFill
      type: string
      source: request
  provides:
    - name: applied
      role: result
      type: bool
    - name: findings
      type: IList<string>
    # The whole answer as ONE string, because a list reaches the reply cut to
    # three items of sixty characters: what changed before and after, what
    # was kept, which cut values were not applicable, and any setting Revit
    # did not keep.
    - name: summary
      role: accounting
      type: string


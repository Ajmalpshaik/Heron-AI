revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `View.AddFilter`, `GetFilters`,
  `SetFilterOverrides`, `GetFilterOverrides`, `SetFilterVisibility`, every
  pattern, colour and Visible setter and getter on `OverrideGraphicSettings`
  and its copy constructor, `Category.IsCuttable`, `ParameterFilterElement.GetCategories`,
  `FillPattern.IsSolidFill` and `LinePatternElement.GetSolidPatternId` are
  present 2020 through 2027 - read off all eight reference assemblies on
  2026-09-28 rather than remembered.

  `View.SetIsFilterEnabled` and `GetIsFilterEnabled` are present 2021 through
  2027 and ABSENT from 2020. Version 1's note said they arrived at 2024, which
  the 2021 reference assembly disproves. They are reached by name at run time,
  not under `#if REVIT2020`: the add-in compiles fragments with no release
  symbols (FRAGMENT-ISSUES 5b-181), so a `#if` would name the member on a real
  Revit 2020 and the whole fragment would fail to compile there. On 2020 a
  non-blank `enabled` refuses the call by name and nothing is written.

# THE OVERRIDE COMES IN ALREADY BUILT, exactly as OVERRIDE_GRAPHICS_IN_VIEW
# takes it. Building it here from colours and weights would be a second place
# where the eight-release compatibility of OverrideGraphicSettings has to be got
# right, and one of the two would drift. `solidFill` is the one exception and
# it is narrow on purpose: one pattern, found the way the parser finds it, so a
# filter can be made solid before the add-in carrying the pattern keys is
# loaded.

# ROUTING - repeated in CREATE_VIEW_FILTER, CREATE_SELECTION_FILTER and
# APPLY_VIEW_TEMPLATE.
#
#   "put that filter on this view"   -> here
#   "apply the filter"               -> here
#   "hide everything that filter matches" -> here, with visible false
#   "make a filter for supply air"   -> CREATE_VIEW_FILTER - it MAKES the rule
#                                       and puts it on no view
#   "save these as a set"            -> CREATE_SELECTION_FILTER
#   "apply the view template"        -> APPLY_VIEW_TEMPLATE - a whole template,
#                                       which is a much bigger change than one
#                                       filter and is easy to ask for by mistake
#   "what filters are on this view"  -> REPORT_VIEW_FILTERS - a READ, and it
#                                       used to be answered by this WRITE

#   "copy the view filters from this view to the other views" -> COPY_VIEW_FILTERS
#                                        - the WHOLE set, with the overrides
#                                          and the on/off state. This one puts
#                                          ONE filter on with an override the
#                                          caller built
#   "take that filter off the view"      -> REMOVE_VIEW_FILTER - the other end
#                                        of this one
#
#   "make the filter pattern solid"      -> here, solidFill=surface (or the
#                                           parser's surface-foreground-pattern)
#   "set the filter transparency"        -> here, overrides=transparency=N
#   "halftone the return air filter"     -> here, overrides=halftone=true;
#                                           keepOtherSettings blank keeps colours
#   "disable the filter"                 -> here, enabled=false, overrides=none
#   "untick the supply air filter"       -> here - ask whether Enable Filter or
#                                           Visibility is meant
#   "what are the filter settings on this view" -> REPORT_VIEW_FILTERS with
#                                           viewName - a READ
utterances:
  - apply the filter
  - put that filter on this view
  - apply the filter to this view
  - hide everything that filter matches
  - add the filter and colour it
  - use that filter here
  - make the filter pattern solid
  - set the filter transparency
  - halftone the return air filter
  - disable the filter
  - untick the supply air filter
  - enable the filter on this view
  - switch off the filter in this view

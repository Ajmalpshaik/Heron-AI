id: FRG-VIEW-072
semantic-identity: "why is my filter not catching these"
kind: filter
domain: revit.views
capability: TEST_VIEW_FILTER_MATCH
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Tests an existing filter against elements and says, for each one, whether it
  MATCHES, fails the rule, or could never match at all - without applying the
  filter to any view or changing anything.

  **THE THIRD VERDICT IS THE WHOLE POINT.** A rule-based view filter only ever
  applies to the categories it was scoped to. An element outside that list can
  satisfy the rule perfectly and still never be caught, because the filter was
  never looking at its category. A plain pass/fail test reports those as
  "fails the rule" and sends somebody off rewriting a rule that was already
  correct - which is hours, and it is the commonest way this question gets
  answered wrongly.

  **A selection filter has no rule, so membership is the only question.** It is
  a hand-picked list; an element is in it or it is not, and there is nothing to
  diagnose. The report says which kind of filter it found, because that changes
  what the answer even means.

  **Nothing is applied and no view is touched.** APPLY_VIEW_FILTER is what puts
  a filter on a view. This exists so the rule can be understood before it is.

contract:
  needs:
    - name: doc
      type: Document
    - name: filterName
      type: string
      source: request
    - name: elements
      type: IList<Element>
  provides:
    - name: matched
      role: result
      type: IList<Element>
    - name: outOfScope
      # Elements the filter COULD NEVER MATCH, because its rule only applies
      # to the categories it was scoped to. THE THIRD VERDICT IS THE WHOLE
      # POINT - it is a different answer from failing the rule and has a
      # different fix.
      #
      # ACCOUNTING, NOT RESULT, corrected 2026-09-13. It is a count of what was
      # LOOKED AT AND EXCLUDED, never a thing the filter found, so it must not
      # count toward "did this come back empty" (D-52). Proving the fragment
      # showed why: 4 walls against a duct-scoped filter gave matched 0 and
      # outOfScope 4, and the gate read the 4 as the negative case returning
      # content. The number is still reported and still the third verdict - it
      # simply is not evidence of a match.
      role: accounting
      type: int
    - name: findings
      type: IList<string>

proof:
  date: '2026-09-13'
  by: Ajmal PS
  model: test projject (3,492 elements), Revit 2024, session 40932
  positive_case: run as it would normally be run - the arrangement was re-made first by running
    select-in-region, set-selection with this phase's own values. returned findings 1 item(s)
    ['HERON RULESupply Air' is a RULE filter scoped to 1 category...], matched 3 item(s) [Radius
    Elbows / Taps, Radius Elbows / Taps, Radius Elbows / Taps], outOfScope 0, wanted HERON
    RULESupply Air. inputs came filterName as given; elements from the selection (3). on test
    projject
  negative_case: run with minMm=-1000,-1000,-1000, maxMm=9000,7000,3900, exact=false, categories=Walls,
    filterName=HERON RULESupply Air instead - chosen because it should not contain what this
    fragment reports - the arrangement was re-made first by running select-in-region, set-selection
    with this phase's own values. returned findings 2 item(s) ['HERON RULESupply Air' is a
    RULE filter scoped to 1 category..., Those 4 can NEVER match, however well they satisfy
    the rule ...], matched 0 item(s), outOfScope 4, wanted HERON RULESupply Air. inputs came
    filterName as given; elements from the selection (4). on test projject
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  caveat: >-
    THE CASE ITS FILE CALLS FIRST WAS APPROXIMATED, NOT MET, and the difference is worth
    stating. tests/cases.yaml wants a filter scoped to Ducts tested against PIPES THAT SATISFY
    THE RULE PERFECTLY, so that the answer is OUT OF SCOPE rather than 'fails the rule' -
    because a plain pass/fail sends somebody off rewriting a rule that was already correct.
    What ran was four WALLS against 'HERON RULESupply Air': outOfScope 4, matched 0, and the
    finding said 'Those 4 can NEVER match'. The MECHANISM is therefore proved - out-of-scope is
    reported as its own third verdict rather than as a failure. What is NOT proved is the sharp
    version, where the out-of-scope element would have passed the rule on value: a pipe's
    System Type is 'Hydronic Supply', not 'Supply Air', so pipes in this model fail the value
    as well as the scope and are no sharper than walls. Building the sharp case needs a filter
    on a parameter ducts and pipes share, carrying the same value on both.
  fingerprint: 2cfe4e5faca142d4
revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `ParameterFilterElement.GetCategories`,
  `GetElementFilter`, `ElementFilter.PassesFilter` and
  `SelectionFilterElement.GetElementIds` are present 2020 through 2027, compiled
  at both ends. Category ids are compared as ElementIds, never as numbers.

# ROUTING - repeated in CREATE_VIEW_FILTER, APPLY_VIEW_FILTER and
# REPORT_VIEW_FILTERS.
#
#   "why is my filter not catching these" -> here
#   "test this filter against these" -> here
#   "would this filter pick this up" -> here
#   "make a filter for supply air"   -> CREATE_VIEW_FILTER
#   "put that filter on this view"   -> APPLY_VIEW_FILTER. Nothing here is
#                                       applied and no view is touched
#   "what filters exist"             -> REPORT_VIEW_FILTERS
#   "what is in that saved set"      -> SELECT_FROM_SAVED_SET, which reads a
#                                       selection filter out as elements rather
#                                       than testing membership

utterances:
  - why is my filter not catching these
  - test this filter against these elements
  - would this filter pick this up
  - does this element match the view filter
  - check what this filter matches

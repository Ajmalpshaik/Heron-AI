compatibility-note: >
  One implementation for every release, by name where the names changed.
  SlabShapeEditor with Enable, IsEnabled, ResetSlabShape, ModifySubElement
  and SlabShapeVertices is present 2020 through 2027. The editor is the
  property SlabShapeEditor on Floor and RoofBase 2020 to 2025 and the method
  GetSlabShapeEditor on Floor, RoofBase and Toposolid 2024 to 2027; DrawPoint
  and DrawSplitLine are 2020 to 2025 and AddPoint and AddSplitLine 2025 to
  2027 - read off RevitAPI.xml in the Nice3point reference packages for all
  eight releases on 2026-10-13. Face.Intersect(Curve, out
  IntersectionResultArray) is present in all eight.

# ROUTING - the same rows are in the fragments named here.
#
#   "add a low point to this floor"                 -> here, points
#   "slope this roof with split lines"              -> here, lines
#   "lay this floor to the terrain"                 -> here, follow
#   "reset the shape of this floor"                 -> here, reset
#   "make a toposolid"                              -> CREATE_TOPOSOLID

utterances:
  - add a low point to this floor 25 mm down
  - slope this roof with split lines
  - raise the corners of this toposolid by 500
  - reset the shape of this floor
  - lay this floor to follow the terrain

id: FRG-GEO-069
semantic-identity: "edit the shape of this floor, roof or terrain - add points, split lines, raise or lower points, reset, or lay it to the terrain"
kind: action
domain: revit.geometry
capability: EDIT_SLAB_SHAPE
version: 1
source: OFFICIAL
risk: MODIFY

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# Revit's shape editing - Modify Sub Elements, Add Point, Add Split Line,
# Reset Shape - on floors, footprint roofs and toposolids, one tool for all
# three because Revit gives all three the same editor. Modes: points (add
# and raise), lines (split lines through added points), heights (move the
# existing point nearest each place, corners too), reset (flat again), and
# follow - reset, then a grid of points and every corner set to the top of
# another element straight above or below: a floor laid to the terrain, a
# toposolid edited to a slab. Offsets are millimetres from the element's own
# unshaped top, as Revit measures them.
#
# The editor and its calls changed names twice (a property before 2024,
# AddPoint and AddSplitLine from 2025); each is found by name, so one
# implementation runs on all eight releases - a toposolid only exists from
# 2024.
#
# READ BACK: the top is probed again at every point set and how far it moved
# reported; for follow, how many points sit within 5 mm of the target's top.
#
# CREATE_TOPOSOLID makes terrain; ADD_TOPOSOLID_SUBDIVISION paints a region
# on it; CREATE_FLOOR makes a floor.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Edits the shape of floors, roofs and toposolids - adds points or split
  lines, raises or lowers points, resets the shape, or lays a floor to the top
  of the terrain.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # "points", "lines", "heights", "reset" or "follow".
    - name: mode
      type: string
      source: request
    # points and heights: "x,y,offset; ..." in millimetres; lines: groups of
    # those split by "|"; follow: "<element id>, <spacing mm>"; reset: EMPTY.
    - name: shapeMm
      type: string
      source: request
  provides:
    - name: edited
      role: result
      type: int
    - name: editedIds
      role: result
      type: IList<ElementId>
    - name: report
      # ONE STRING, element by element, with how far the top moved (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>


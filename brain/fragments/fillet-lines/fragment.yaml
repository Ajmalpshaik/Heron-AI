id: FRG-GEO-022
semantic-identity: "round the corner between two drafting lines to a radius"
kind: action
domain: revit.geometry
capability: FILLET_LINES
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Rounds the corner between exactly TWO model or detail lines with a true
  tangent arc at a given radius: both lines are cut back to their tangent
  points and an arc is drawn between them.

  **"Fillet" means two different operations in Revit, and only one of them is
  this.** On drafting lines it is geometry - a radius somebody chooses. On a
  duct or a pipe it is a real ELBOW FITTING, whose shape comes from the type's
  routing preferences and not from any radius that could be typed. The earlier
  library carried both in one file behind a mode switch; here the MEP half is
  already PLACE_MEP_FITTING, so this fragment is the drafting half alone and
  refuses MEP curves by name rather than doing something plausible to them.

  **THE TWO SOURCE LINES ARE DELETED AND REDRAWN, SO THEY COME BACK WITH NEW
  IDS.** That is not tidiness - it is the only thing that works. Editing a line
  in place to shorten it has been seen to do nothing at all when the two lines
  already share an endpoint, which is exactly the corner this fragment exists
  to round: no exception, a clean commit, and the original geometry still there
  on re-read. Delete and redraw is reliable where the in-place edit is not, and
  the cost is that anything holding the old ids - a saved set, a tag, a
  dimension - is holding ids that no longer exist. The new ids are reported.

  **A radius too large for the lines is refused with the length it would
  need.** The tangent point has to fall on both lines; a radius that pushes it
  past the end has no fillet, and the number needed to correct it is more use
  than a refusal on its own.

  **A corner of about 0 or about 180 degrees is refused.** There is nothing to
  round in a straight line or a fold-back, and the arithmetic there produces a
  huge arc rather than an error.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16) - which
  matters more here than usual, because the delete and the redraw must be one
  undo step or a failure halfway leaves two lines gone and no arc.


compatibility-note: >
  One implementation for every release. `Arc.Create`, `Line.CreateBound`,
  `SketchPlane.Create`, `Plane.CreateByNormalAndOrigin`,
  `Document.Create.NewModelCurve` and `NewDetailCurve` are present 2020 through
  2027, compiled at both ends. Millimetres become feet by dividing by 304.8, as
  plain arithmetic - no units API, which is what changed shape at 2021.

# ROUTING - repeated in PLACE_MEP_FITTING and TRIM_EXTEND_ELEMENTS.
#
#   "round that corner off"          -> here, for model and detail lines
#   "fillet these two lines"         -> here
#   "put a radius on that corner"    -> here
#   "round off this duct corner"     -> PLACE_MEP_FITTING. A duct corner is
#                                       rounded by a real elbow whose shape
#                                       comes from the type, not by an arc, and
#                                       there is no radius to choose
#   "make these two meet first"      -> TRIM_EXTEND_ELEMENTS. This fragment
#                                       needs a real corner between the two
#                                       directions; it does not need them to
#                                       be touching already
#   "draw an arc"                    -> CREATE_LINE. A fillet is a corner being
#                                       rounded, not an arc being drawn

utterances:
  - round that corner off
  - fillet these two lines
  - put a radius on this corner
  - round the corner between these lines
  - fillet at 300mm

compatibility-note: >
  One implementation for every release. AssemblyInstance.Create,
  AreElementsValidForAssembly, IsValidNamingCategory, AssemblyTypeName and
  GetMemberIds, and Element.AssemblyInstanceId, are present 2020 through 2027
  - read off RevitAPI.xml in the Nice3point reference packages for all eight
  releases on 2026-10-12.

# ROUTING - the same rows are in the fragments named here.
#
#   "make an assembly of this pipe spool"     -> here
#   "make the shop drawings for this assembly" -> CREATE_ASSEMBLY_VIEWS
#   "group these"                             -> GROUP_ELEMENTS
#   "select by assembly"                      -> SELECT_GROUP_MEMBERS, which opens an
#                                                assembly and hands its members out
#                                                (row 5b-470). GROUP_BY_ASSEMBLY reads
#                                                nested families, not assemblies

utterances:
  - make an assembly from these elements
  - create an assembly of this pipe spool called Spool 01
  - assemble these into one prefab unit
  - put these into a new assembly

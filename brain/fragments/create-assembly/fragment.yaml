compatibility-note: >
  One implementation for every release. AssemblyInstance.Create,
  AreElementsValidForAssembly, IsValidNamingCategory, AssemblyTypeName and
  GetMemberIds, and Element.AssemblyInstanceId, are present 2020 through 2027
  - read off RevitAPI.xml in the Nice3point reference packages for all eight
  releases on 2026-10-12.

  Version 2 opens its own `Transaction`s and adds `Element.GetTypeId`,
  `Transaction.GetFailureHandlingOptions` and `SetFailureHandlingOptions`,
  and `FailureHandlingOptions.SetFailuresPreprocessor` and
  `SetClearAfterRollback` - each on every release 2020 to 2027
  (`tools/api-surface --members`, 2026-11-12). The same RevitAPI.xml carries
  the remark on `AssemblyInstance.Create` that row 5b-1553 is about, and on
  `AssemblyTypeName` "All matching assembly instances share this name" - both
  word for word the same in all eight.


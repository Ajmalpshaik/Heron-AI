# VERSION 2 (2026-11-12) - MADE IN ONE TRANSACTION AND NAMED IN THE NEXT, ALL
# OR NOTHING, and back to DRAFT. Version 1 was signed PROVEN on 2026-10-21 (the
# proof block below, kept as the record of what was signed); its C# moved, so
# it is DRAFT again until NEEDS-CHECKING Group NL is run (D-30, D-117).
#
# READ THAT PROOF BLOCK BEFORE TRUSTING IT. Its POSITIVE case is the defect:
# "assembly (null) ... memberIds 2 item(s) ... refused Revit refused the
# assembly: No valid type for the assembly instance.. NOTHING WAS MADE." No
# assembly was ever seen made by this card - the count of `memberIds` passed
# the judgement, the same as on 2026-10-18 (FRAGMENT-ISSUES row 5b-1117).
# Read in the code: version 1's catch took nothing back, and the add-in keeps
# a change unless something throws out of the fragment - so with the change
# kept, an assembly stayed in the model beside "NOTHING WAS MADE". That
# leftover was never looked for in a Revit.
#
# WHY TWO TRANSACTIONS - FRAGMENT-ISSUES row 5b-1553. Revit's own remark on
# AssemblyInstance.Create, the same on all eight releases: "Transaction must
# be committed after calling this method before performing any action on the
# newly created instance. Assembly type is assigned after the transaction for
# creating assembly instance is complete." Version 1 named the assembly, and
# read its name, inside the one transaction that made it; both recorded runs
# are that refusal. So this card now declares `editScopeFailures`, D-112's
# switch, as the stair cards do: the add-in runs it inside its TransactionGroup
# with no transaction of its own open, and the card makes the assembly in one
# transaction, commits, and names it in a second. One group, so ONE undo.
#
# THE SWITCH IS DECIDED FOR THIS. D-115 item 1 (Accepted 2026-10-13): "A
# fragment that Revit refuses inside a transaction declares `editScopeFailures`
# too, whatever the reason - an edit mode (D-112) or a call Revit will not make
# while the document is modifiable". Its item 3: "Each further one is named on
# its card with the Revit refusal that made it need the switch, so the reason
# can be checked against the release it was measured on." THE REFUSAL, on
# Revit 2020, 2026-10-18 and again 2026-10-21, inside the transaction that
# made the assembly: "No valid type for the assembly instance". D-125 item 2
# (Accepted 2026-10-17) keeps the switch's meaning: "a fragment that opens its
# own transactions".
#
# NOT MEASURED, AND THE CARD RESTS ON IT: whether Revit assigns the type at a
# commit made INSIDE an open TransactionGroup. NEEDS-CHECKING NL9 is the run
# that says. After the commit the TYPE is looked for first, so if Revit has
# not assigned one the answer says exactly that - never that a name was
# refused.
#
# ALL OR NOTHING, BY REVIT'S OWN ROLLBACK. Once the first transaction is
# committed there is an assembly in the group, so EVERY refusal after it
# THROWS, with the reason in Revit's words and the house ending ("The call
# failed, and Heron rolls the whole call back - no assembly is kept"). The
# add-in rolls a fragment that throws back whole and answers "'create-assembly'
# threw while running: <those words>", adding what its own check of the model
# found. Nothing is assimilated, so there is no undo entry and no touched
# element beside a refusal. (The first cut of this version took the assembly
# apart again with Disassemble and returned normally - which, on a kept run,
# left "make, then unmake" in the undo list. A review replaced it.)
#
# A NAME IS NEVER TAKEN FROM OTHER ASSEMBLIES. Revit's reference on
# AssemblyTypeName: "The name for the assembly type. All matching assembly
# instances share this name." Matching assemblies share ONE type, so Revit
# may hand a new assembly an existing type, and naming the new one would
# rename every assembly of that type. The assemblies already in the model are
# read first; if the new one shares its type with any of them under another
# name, or the name asked for is already another type's, the card stops - and
# after naming, every other assembly's name is read again.
#
# IT CAN NO LONGER BE A SETUP STEP OF ANOTHER CARD'S PROOF: a setup step runs
# inside the add-in's own step transaction, where this card cannot open its
# own, and `validate` and a dry run now refuse it there (FRAGMENT-ISSUES row
# 5b-1556; tools/jobs/p1102-round9-2026-11-02.yaml arranged
# CREATE_ASSEMBLY_VIEWS that way). An assembly for another proof is made and
# KEPT first. Nothing of version 2 has run in Revit.

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# ELEMENTS ALREADY IN AN ASSEMBLY are left out and named - Revit puts an
# element in one only. The rest are checked with Revit's own tests first, so a
# set Revit would refuse is refused with the reason, not half-made.
#
# THE NAMING CATEGORY decides the assembly's category and default name: given
# by name it must be one Revit accepts for the set; empty takes the first
# element's category.
#
# READ BACK: members and type name off the new assembly, after its own
# transaction is committed - and a result is given only then.
#
# CREATE_ASSEMBLY_VIEWS makes the shop drawing views of an EXISTING assembly;
# GROUP_ELEMENTS makes a group, which is not an assembly.
#
# OPENS ITS OWN TRANSACTIONS inside the add-in's group, with none of the
# add-in's open - D-112's `editScopeFailures`. Still one undo (Golden Rule 16).
purpose: >
  Creates an assembly from the elements handed in - Create Assembly in the
  ribbon - named as asked, ready for its shop drawing views.

contract:
  needs:
    - name: doc
      type: Document
    # D-112's switch, here under D-115 item 1: the add-in runs this with no
    # transaction of its own open, and hands in the failure discipline every
    # transaction here takes.
    - name: editScopeFailures
      type: IFailuresPreprocessor
      source: ambient
    - name: elements
      type: IList<Element>
    # The assembly's name; an EMPTY value lets Revit name it. A name another
    # assembly type already has, or one Revit will not take, stops the call
    # and NOTHING is made. So does a new assembly that Revit matches to an
    # existing assembly type: naming it would rename the others.
    - name: assemblyName
      type: string
      source: request
    # A category name to name it by - "Pipes"; an EMPTY value takes the
    # first element's category.
    - name: namingCategory
      type: string
      source: request
  provides:
    - name: assembly
      # The assembly, after it has been made, named and read back with a type
      # - null whenever anything was refused (version 2).
      role: result
      type: AssemblyInstance
    - name: memberIds
      # Read off the new assembly - and EMPTY whenever `assembly` is null
      # (version 2, 5b-1117): filled only after the assembly is kept.
      role: result
      type: IList<ElementId>
    - name: alreadyInOne
      # Elements already in an assembly, left out (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why NOTHING WAS MADE, as one sentence; null otherwise (D-52). Version
      # 2: said only where Revit made nothing at all - and the assemblies in
      # the model are looked for again before it is said. Once Revit HAS made
      # the assembly, a refusal is not this: the card throws, and the add-in
      # rolls the whole call back and says why.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


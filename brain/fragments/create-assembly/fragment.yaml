# VERSION 2 (2026-11-11) - "NOTHING WAS MADE" IS TRUE WHEN IT IS SAID, and back
# to DRAFT. Version 1 was signed PROVEN on 2026-10-21 (the proof block below,
# kept as the record of what was signed); its C# moved, so it is DRAFT again
# until NEEDS-CHECKING Group NL is run (D-30, D-117).
#
# READ THAT PROOF BLOCK BEFORE TRUSTING IT. Its POSITIVE case is the defect:
# "assembly (null) ... memberIds 2 item(s) ... refused Revit refused the
# assembly: No valid type for the assembly instance.. NOTHING WAS MADE." No
# assembly was ever seen made by this card - the count of `memberIds` passed
# the judgement, the same as on 2026-10-18 (FRAGMENT-ISSUES row 5b-1117).
#
# WHAT VERSION 2 CHANGES: the making sits in one SubTransaction, kept only
# after its members and name have been read back, and `memberIds` is filled
# only then. A refusal part way rolls it back, so the half-made assembly is
# not left in the model and `memberIds` stays empty. Read in the code
# 2026-11-11: version 1's catch took nothing back, and the caller's
# transaction is kept unless something throws out of the fragment - so with
# the change kept, an assembly stayed in the model beside "NOTHING WAS MADE".
# That leftover has not been looked for in a Revit.
#
# WHAT IT DOES NOT CHANGE - FRAGMENT-ISSUES row 5b-1553, OPEN. Both measured
# refusals are the same sentence, and Revit's own remark on
# AssemblyInstance.Create explains it on all eight releases: "Transaction must
# be committed after calling this method before performing any action on the
# newly created instance. Assembly type is assigned after the transaction for
# creating assembly instance is complete." This card names the assembly, and
# reads its name, inside the transaction that makes it. So until that row is
# repaired the expected answer is the refusal - now a true one - and the
# card's positive case cannot pass. Nothing of version 2 has run in Revit.

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# ELEMENTS ALREADY IN AN ASSEMBLY are left out and named - Revit puts an
# element in one only. The rest are checked with Revit's own tests first, so a
# set Revit would refuse is refused with the reason, not half-made.
#
# THE NAMING CATEGORY decides the assembly's category and default name: given
# by name it must be one Revit accepts for the set; empty takes the first
# element's category.
#
# READ BACK: members and type name off the new assembly.
#
# CREATE_ASSEMBLY_VIEWS makes the shop drawing views of an EXISTING assembly;
# GROUP_ELEMENTS makes a group, which is not an assembly.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Creates an assembly from the elements handed in - Create Assembly in the
  ribbon - named as asked, ready for its shop drawing views.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # The assembly's name; an EMPTY value lets Revit name it.
    - name: assemblyName
      type: string
      source: request
    # A category name to name it by - "Pipes"; an EMPTY value takes the
    # first element's category.
    - name: namingCategory
      type: string
      source: request
  provides:
    - name: assembly
      role: result
      type: AssemblyInstance
    - name: memberIds
      # Read off the new assembly - and EMPTY whenever `assembly` is null
      # (version 2, 5b-1117): filled only after the assembly is kept.
      role: result
      type: IList<ElementId>
    - name: alreadyInOne
      # Elements already in an assembly, left out (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why NOTHING WAS MADE, as one sentence; null otherwise (D-52). Version
      # 2: whatever Revit had started is rolled back before this is said.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


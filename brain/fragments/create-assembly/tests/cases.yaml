# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: three pipes and two pipe fittings in one run, assemblyName "Spool 01", namingCategory "Pipes"
    expect: >
      one assembly named Spool 01, memberIds the five elements, read back.
      NOT YET SEEN ON ANY RUN, AND NOT EXPECTED UNTIL ROW 5b-1553 IS REPAIRED:
      Revit gives a new assembly its type only after the transaction that made
      it is committed, and this card names it inside that transaction. What
      version 2 is expected to answer here is the first negative below

  - given: >
      version 2, once row 5b-1553 is repaired - the same five elements,
      assemblyName empty
    expect: >
      one assembly under the name Revit gives it, `assembly` not null, and
      memberIds the five elements. The Project Browser's Assemblies node shows
      exactly one new entry

negative:
  - given: >
      version 2 (5b-1117), THE CASE THE ROW IS ABOUT, Group NL - any elements
      Revit will assemble (two ducts, or two pieces of furniture),
      namingCategory their own category, assemblyName given or empty. Count
      the entries under Assemblies in the Project Browser first
    expect: >
      while row 5b-1553 is open: `refused` quoting Revit and ending "What it
      had started was taken back, so NOTHING WAS MADE", `assembly` null and
      memberIds EMPTY - never the elements handed in. Then the same call
      through `try-once`, answered Keep: the Assemblies node holds what it
      held, and no element reports an assembly in its Properties (Undo
      afterwards). Version 1 answered the same sentence with memberIds filled;
      its code took nothing back, so a kept run left the assembly in the model
      - read in the code, never looked for in Revit

  - given: the same five elements straight after
    expect: >
      every one in alreadyInOne and refused - nothing made twice

  - given: a text note, namingCategory empty
    expect: >
      refused with Revit's reason - a view-specific element is not assembled
      - and nothing made

second_route:
  - the Project Browser's Assemblies node, and the assembly's members selected in a view
  - >
    version 2 - after a REFUSED run that was kept: the Assemblies node counted
    before and after, and one of the elements selected - its Properties must
    show no assembly. The report alone cannot settle whether anything was left
  - one Ctrl+Z takes it away in a single step (Golden Rule 16)

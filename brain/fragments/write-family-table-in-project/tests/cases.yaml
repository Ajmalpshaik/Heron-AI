# D-30: the negative case is what catches "succeeded and did nothing".
#
# The failure to fear is an import that succeeds and is never loaded back. The
# fragment reports success, the family document is discarded on close, and the
# project is exactly as it was.

positive:
  - given: a loaded family and a CSV holding its table plus new rows
    expect: >
      imported true AND reloaded true, rowsAfter larger than rowsBefore. Then
      draw a fitting at one of the new sizes IN THE PROJECT - that is the only
      check that separates a real reload from an import nobody loaded

  - given: the same CSV run a second time
    expect: rowsBefore equal to rowsAfter, imported true - replacing a table with itself is not a failure

negative:
  - given: familyName naming a family that is not loaded
    expect: >
      imported false, reloaded false, and the name said back. The
      value-driven negative

  - given: a CSV whose header Revit cannot parse
    expect: >
      imported false, the transaction ROLLED BACK, and Revit's own error with
      the row and column that failed. Never a half-written table

  - given: a family that is open in Revit's own window
    expect: >
      leftOpen true, and the editing session NOT discarded. Revit refuses to
      close such a document; catching that refusal is what protects the work

  - given: an import that succeeds but a reload that throws
    expect: >
      imported true, reloaded FALSE, and a finding saying the project is
      unchanged. These must never be reported as one fact

second_route:
  - open the family by hand afterwards and read Manage Lookup Tables
  - draw a fitting at a newly added size in the project
  - one Ctrl+Z puts the reload back in a single step (Golden Rule 16)

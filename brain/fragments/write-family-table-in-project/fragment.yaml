id: FRG-ELE-060
semantic-identity: "import a lookup table into a loaded family and reload it, without opening it by hand"
kind: action
domain: revit.families
capability: WRITE_FAMILY_TABLE_IN_PROJECT
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Opens one loaded family from the PROJECT, imports a CSV over its lookup
  table, loads the family back in, and closes it - so a set of fittings can be
  corrected without opening each one by hand.

  **IT EXISTS BECAUSE A TABLE IS ONLY WRITABLE FROM INSIDE THE FAMILY.**
  WRITE_FAMILY_SIZE_TABLE writes to the family in front, so a pipe type's
  eight fitting families mean eight rounds of open, import, load, close. This
  does one of those rounds without a person in it, and
  REPORT_FAMILY_TABLES_IN_PROJECT is the read that says which need it.

  **IT OPENS A TRANSACTION, AND THAT IS NOT A BREACH OF GOLDEN RULE 16.** The
  rule keeps a fragment out of the transaction the EXECUTOR manages, on the
  document the executor handed it. A family document opened here is a second
  document the executor knows nothing about - nobody else can commit it, and
  leaving it uncommitted would discard the import. The transaction is on that
  document only and is rolled back if anything fails.

  **A FAMILY OPEN IN THE UI CANNOT BE CLOSED, and that is a feature.** Revit
  refuses to close a document a person has open for editing, so a session
  somebody is working in is never discarded by this. The refusal is caught and
  reported rather than swallowed, because "left open" is a fact the next
  fragment depends on.

  **THE IMPORT REPLACES, IT DOES NOT MERGE.** A CSV holding five rows leaves a
  table of five rows, so the file must carry every row that is to survive.
  `rowsBefore` is reported beside `rowsAfter` to make a table that shrank
  visible rather than silent.

  **LOADING BACK IS THE STEP THAT MAKES IT REAL.** An edited family document
  changes nothing in the project until it is loaded, and a fragment that
  imported a table and stopped there would report success over a project that
  had not changed. Whether the load returned is reported separately from
  whether the import did.

  ASSUMES AN OPEN TRANSACTION on the PROJECT and does not open one there
  (Golden Rule 16), so the reload is one undo entry.

contract:
  needs:
    - name: doc
      type: Document
    # The loaded family to correct, by name.
    - name: familyName
      type: string
      source: request
    # The CSV to import over its table.
    - name: csvPath
      type: string
      source: request
    # Which table the CSV replaces. Empty takes the name from the filename.
    - name: tableName
      type: string
      source: request
  provides:
    - name: imported
      role: result
      type: bool
    - name: reloaded
      # Whether the family was loaded BACK into the project. Reported apart
      # from `imported` because an import that is never loaded changes nothing
      # a person can see.
      role: result
      type: bool
    - name: rowsBefore
      role: result
      type: int
    - name: rowsAfter
      role: result
      type: int
    - name: leftOpen
      # That the family was open in the UI and so could not be closed. Never a
      # failure - the import still happened - but the next fragment will find
      # it in front, so it is said out loud.
      role: accounting
      type: bool
    - name: problem
      # Revit's own words when anything refused, empty when nothing did. A
      # string, because a list entry is abbreviated before a reader sees it.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


tests: tests/

compatibility-note: >
  One implementation for every release. `Document.EditFamily`,
  `Document.LoadFamily(Document)`, `Document.Close`, `Transaction`,
  `FamilySizeTableManager.GetFamilySizeTableManager`, `ImportSizeTable`,
  `HasSizeTable` and `GetSizeTable` are present 2020 through 2027, confirmed
  by reflection on the 2020 assembly on 2026-09-15. Units are named inside the
  CSV header, so nothing is converted here and the 2021 units move cannot
  reach it.

# ROUTING - repeated in REPORT_FAMILY_TABLES_IN_PROJECT.
#
#   "fix the lookup tables of these families" -> here, one family per call
#   "which families need it"                  -> REPORT_FAMILY_TABLES_IN_PROJECT
#   "write the table of the family in front"  -> WRITE_FAMILY_SIZE_TABLE

utterances:
  - import this table into that family
  - fix the family's lookup table from the project
  - update the fitting family sizes and reload it
  - write a size table without opening the family

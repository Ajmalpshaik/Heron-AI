# VERSION 3 (2026-11-01) - CREATE_CEILING AND CREATE_ROOF WERE MERGED INTO THIS
# CARD on the owner's instruction ("make sure there is no duplicate tools", then
# "ok go ahead merge all"), and both are DEPRECATED. The same job three times
# over: one closed boundary on one level, at the level's PROJECT elevation and
# never its Elevation, closed by itself, a repeated point named, a
# self-crossing refusal reported - and the type decides what it makes.
# `floorType` is now the TYPE of whichever (HostObjAttributes, resolved by the
# add-in among wall, floor, ceiling and roof types, D-54): a floor type makes
# a floor exactly as version 2 did; a ceiling type a ceiling, CREATE_CEILING's
# rules - Ceiling.Create found by name, so Revit 2020 and 2021 are refused with
# the sentence to draw one by hand, the type's category checked, the height
# above the level (`heightAboveLevel`, millimetres) set and READ BACK; a roof
# type a footprint roof, CREATE_ROOF's rules - NewFootPrintRoof on every
# release, left FLAT, `edges` the model curves it hands back and `measuredMm`
# its size and base height read back off Revit. A wall type is refused by name.
#
# WHAT EACH RETIRED CARD'S OUTPUTS ARE NOW: `created` and `findings`, the same
# names and the same sentences; CREATE_ROOF's `edges` and `measuredMm`, the
# same names, on this card. Their boundaries were IList<XYZ> read by the
# add-in; this card's is text read here by the same rule (version 2), so the
# same "X,Y,Z; ..." makes the same edges - and a ceiling or a roof may now have
# an arc edge too, which neither could. NOT CARRIED, AS THE LESS SAFE OF TWO:
# nothing. One thing is NEW, and safer: a height given with a floor or roof
# type is refused rather than ignored - neither took one, and a number quietly
# dropped reads as a number used. Asked by a BARE name a wall type also has, a
# type is now refused naming both, where a floor- or roof-only need found the
# one; "Basic Roof: Generic - 400mm" says which.
#
# SLOPE_ROOF_EDGES STAYS SEPARATE: it slopes the edges of a footprint roof that
# exists, a decision about the design this card does not make.
#
# Version 2's proof below no longer describes the code (impl/ changed) and is
# kept as the record; CREATE_ROOF's held signature and CREATE_CEILING's proof
# stay on their own cards. DRAFT until version 3 is proved on a real model
# (D-30) - a ceiling on 2024 and refused on 2020, a roof measured, a floor
# word for word as version 2.

purpose: >
  Creates a floor from a closed boundary on one level. The slab everything else
  sits on, and the thing MEP has to penetrate.

  **A CEILING OR A FLAT ROOF FROM THE SAME BOUNDARY (version 3)** - the type
  decides. A ceiling type makes a ceiling at a height above the level, read
  back; Revit 2020 and 2021 cannot make one from code, and say so - draw one
  by hand. A roof type makes a footprint roof, left flat: no slope is set on
  any edge, and its size and height are measured back.

  **The creation call changed at Revit 2022 and this fragment still runs on
  2020.** The old one took a curve array through the document's creation
  object; the new one is a static taking curve loops. Neither name can appear in
  source that compiles at both ends, so whichever exists is found at run time -
  the same shape as CREATE_CEILING, for the same reason.

  **The base height is the level's PROJECT elevation.** Every XYZ the API takes
  is project-internal, while `Elevation` is measured from whatever the level
  type's Elevation Base says. On a model set out to a survey datum the two
  differ, and the wrong one puts the slab at the wrong height with no error at
  all.

  **The boundary closes itself** and must not cross itself. A self-crossing loop
  is refused by Revit, and that refusal is reported rather than swallowed.

  **AN EDGE CAN BE AN ARC (version 2, row 5b-1216).** `arc MX,MY X,Y` after a
  corner makes the next edge an arc: through MX,MY, ending at X,Y - the writing
  CREATE_FAMILY_FORMS's loops take, so one writing works for a family and a
  project. A round slab is two arcs, the second ending where the first began; a
  boundary with an arc in it may end on its first corner, because a round one
  has to. A boundary with no `arc` in it makes exactly the floor version 1 made,
  and a last corner repeating the first is still refused there. An arc whose
  three points are in a line, or two in one place, makes nothing.

  **It makes one floor, not a storey.** Openings, shafts and penetrations are
  separate jobs; nothing here cuts a hole in anything.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: level
      type: Level
      source: request
    # The TYPE - a floor, ceiling or roof type; it decides what is made
    # (version 3). "Basic Roof: Generic - 400mm" when a bare name is shared.
    - name: floorType
      type: HostObjAttributes
      source: request
    # Millimetres, as typed: corners "X,Y,Z" with semicolons between - the Z
    # is taken from the level - and an arc "arc MX,MY X,Y" after a corner: a
    # point the edge passes through, then where it ends. Closed back to the
    # first corner. A round slab is "R,0,0; arc 0,R -R,0; arc 0,-R R,0". TEXT
    # SINCE VERSION 2, read in the fragment exactly as the add-in read an
    # IList<XYZ> before - the same numbers, refusals, bound and division by
    # 304.8 - so a boundary without an arc is unchanged (5b-1216).
    - name: boundary
      type: string
      source: request
    # VERSION 3, from CREATE_CEILING. A ceiling's height above its level, in
    # MILLIMETRES - 2700. A ceiling type needs it; a floor or roof type
    # refuses it. Left out it is NaN, "not given".
    - name: heightAboveLevel
      type: double
      source: request
      optional: true
      absent: NaN
  provides:
    - name: created
      role: result
      type: ElementId
    - name: edges
      # VERSION 3, from CREATE_ROOF. A roof's boundary model curves, handed
      # back so a slope can be set per edge afterwards - 0 for a floor or a
      # ceiling. A thing it MADE, so a result (D-52).
      role: result
      type: int
    - name: measuredMm
      # VERSION 3, from CREATE_ROOF. What Revit says is there, read back off a
      # new ROOF, in millimetres - its size on plan and its base height beside
      # the level's. Accounting, not a result (D-52): it describes `created`.
      # Empty for a floor or a ceiling.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


compatibility-note: >
  THE CREATION CALL IS DIFFERENT AT EACH END OF THE RANGE, checked against the
  reference assemblies rather than remembered: `Floor.Create` does NOT exist on
  2020 and does on 2024 and 2027, while `Document.Create.NewFloor` exists on
  2020 and is gone by 2024. Naming either in source breaks the other build, so
  both are looked up at run time and whichever this release has is used.
  `Level.ProjectElevation`, `CurveLoop.Create` and `Line.CreateBound` are
  present throughout, and so is `Arc.Create` taking two ends and a point on the
  arc - what version 2 hands both calls for a curved edge, read off the
  reference assemblies on 2026-10-19 with tools/api-surface.

# THE OLD CALL WANTS A CurveArray AND THE NEW ONE WANTS CurveLoops, so the
# boundary is built into both shapes and the one the found method needs is
# passed. That is the only real difference between the two paths.

# ROUTING - repeated in CREATE_CEILING and MEASURE_ELEMENT_VOLUME.
#
#   "make a floor slab over this area" -> here
#   "add a slab here"                  -> here
#   "draw a slab with an arc edge"     -> here, with "arc MX,MY X,Y" edges in
#                                         the boundary (version 2, 5b-1216).
#                                         "make a round floor slab" does NOT
#                                         reach here on the lexical backend:
#                                         CREATE_EDGE_SWEEPS, measured
#                                         2026-10-19 by check-routing
#   "make a ceiling over this area"    -> CREATE_CEILING - the other flat thing,
#                                         and the one MEP actually hides above
#   "how much concrete is in this"     -> REPORT_MATERIAL_TAKEOFF
#   "cut a hole for the duct"          -> NOTHING HERE DOES THAT. An opening is
#                                         its own job and nothing covers it yet
#   "build a wall between these points" -> CREATE_WALL
#   "hatch this area on the drawing" -> CREATE_FILLED_REGION. It LOOKS like a
#                                       slab on a plan and is in no other
#                                       view, no schedule and not the model
#   "make a slab under these rooms"      -> CREATE_FROM_ROOM_BOUNDARIES. This
#                                           one takes one typed loop and cuts
#                                           no openings


# ROUTING (2026-10-13, the gap fill)
#
#   "lay this floor to follow the terrain"   -> EDIT_SLAB_SHAPE, follow
utterances:
  - make a floor slab over this area
  - add a slab here
  - create the floor
  - draw the slab for this area
  - model the floor
  - draw a slab with an arc edge

positive:
  - given: a rectangular boundary on Level 1 with a 200 mm slab type, on Revit 2024
    expect: >
      a floor at that level - checked in a SECTION against the level, not read
      off the report. Its area should match the boundary handed in

  - given: >
      "5000,0,0; arc 0,5000 -5000,0; arc 0,-5000 5000,0" on Level 1 - a round
      slab of radius 5000 mm (version 2, 5b-1216)
    expect: >
      one floor whose Area in Properties reads 78.54 m2 (pi x 25), not the
      area of any polygon inside the circle, and the findings saying 2 of its 2
      edges are arcs. Seen in plan as a true circle

  - given: '"0,0,0; 10000,0,0; arc 15000,5000 10000,10000; 0,10000,0" - a 10 m square with one side bowed out 5 m'
    expect: one floor of area 139.27 m2 (100 plus a half circle of radius 5 m, 39.27)

  - given: the version 1 rectangle again, no arc in it
    expect: >
      exactly the floor version 1 made, and the same findings sentence word for
      word

  - given: the same request on Revit 2020
    expect: >
      the same floor, made through the older call, and the report saying which
      path it took. THIS IS THE FIRST CASE TO RUN: Floor.Create does not exist on
      2020 and NewFloor is gone by 2024, so a run that throws a missing-method
      error means the run-time lookup is not working

  # VERSION 3 - CREATE_CEILING and CREATE_ROOF merged in. NOT RUN. Each fails
  # on version 2, whose `floorType` took a floor type only and which had no
  # `heightAboveLevel`, `edges` or `measuredMm`.
  - given: >
      VERSION 3. A rectangular boundary in a room on Level 1, floorType a
      ceiling type ("Compound Ceiling: 600 x 600mm Grid"), heightAboveLevel
      2700, on Revit 2024 - CREATE_CEILING's own first case
    expect: >
      a ceiling at 2700 mm above that level - MEASURED in a section against
      the level, not read off the report - and the finding "Ceiling created on
      'Level 1' at 2700 mm above it". MEASURE_CEILING_HEIGHT over the same
      room agrees

  - given: >
      VERSION 3. "0,0,0; 10000,0,0; 10000,6000,0; 0,6000,0" on the top level,
      floorType a roof type ("Basic Roof: Generic - 400mm"), on Revit 2024 -
      CREATE_ROOF's own case
    expect: >
      edges 4, measuredMm "10000 x 6000 mm on plan, base at" the level's
      height, "level '...' sits at" the same; the finding "It is FLAT - no
      slope has been set on any edge". Checked IN A SECTION against the level

  - given: VERSION 3. The roof case on Revit 2020
    expect: >
      the same roof - NewFootPrintRoof did not change at 2022, so one path

negative:
  - given: >
      VERSION 3. The ceiling case on Revit 2020 - CREATE_CEILING's FIRST CASE
      TO RUN
    expect: >
      NOTHING created, and "This Revit cannot create a ceiling - the method
      arrived in Revit 2022 ... Draw ONE by hand (Architecture, then
      Ceiling)". A missing-method error means the run-time lookup is broken

  - given: >
      VERSION 3. floorType a WALL type, "Basic Wall: Generic - 200mm"
    expect: >
      refused by name, "is a Walls type, and this makes a floor, a ceiling or
      a footprint roof"; nothing created

  - given: VERSION 3. floorType a ceiling type, heightAboveLevel left out
    expect: >
      refused "A ceiling needs its height above the level"; nothing created

  - given: VERSION 3. floorType a floor type, heightAboveLevel 2700
    expect: >
      refused "heightAboveLevel is a ceiling's height above its level" -
      never a floor made with the number quietly dropped

  - given: VERSION 3. floorType a roof type, a boundary of two points
    expect: refused "A roof needs at least three boundary points and 2 were given"

  - given: a model set out to a survey datum, where Elevation and ProjectElevation differ
    expect: >
      the slab at the height Revit shows for that level, NOT off by the survey
      offset. No error, no warning, a slab metres from where it belongs - only a
      section reveals it

  - given: a boundary that crosses itself
    expect: refused and reported, not a silently strange floor

  - given: two boundary points at the same coordinates
    expect: named as a repeated point, nothing created

  - given: '"0,0,0; 6000,0,0; arc 6000,0 6000,4000; 0,4000,0" - an arc through its own start'
    expect: >
      nothing created, and the findings name the arc from 6000,0 through 6000,0
      to 6000,4000 as not an arc - before Revit is asked for anything

  - given: the floor created, then asked to take a duct penetration
    expect: >
      NOTHING here does that. This makes a slab; cutting an opening through it is
      a separate job that nothing in the library covers yet, and expecting it
      from here is how a coordination model ends up solid

second_route:
  - Revit's own Architecture then Floor on the same boundary, and the two compared in a section
  - For the round slab, Revit's own Floor with a Circle boundary of the same radius, and the two Areas compared

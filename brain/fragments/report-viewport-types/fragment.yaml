id: FRG-SHT-030
semantic-identity: "which viewport types are there, what does each title show, and how many use each"
kind: action
domain: revit.sheets
capability: REPORT_VIEWPORT_TYPES
version: 1
source: OFFICIAL
risk: READ

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# The type settings are Revit's own text: title family, show title, extension
# line, box. A type no viewport uses is listed apart - two near-identical
# title types, one unused, is the usual reason a sheet set looks inconsistent.
#
# Viewport types are found by family name "Viewport", so no BuiltInCategory
# member is relied on.
#
# READ ONLY - opens no transaction.
# THE PURPOSE NAMES NO TYPE AND NOT THE WORD "LINE" (FRAGMENT-ISSUES 5b-501):
# with "Title w Line" and "extension line" in it, "line the viewports up" - a
# request to MOVE them - reached this read on the trained model ahead of
# ALIGN_VIEWPORTS_ACROSS_SHEETS. Title w Line and No Title are what it lists.
purpose: >
  Lists the viewport types - the title styles a viewport on a sheet can carry -
  with each one's title family, whether its title and its extension show, and
  how many viewports on sheets use it.

contract:
  needs:
    - name: doc
      type: Document
  provides:
    - name: viewportTypes
      # ONE STRING, a line per type, because a list reaches the chat cut to
      # three entries.
      role: result
      type: string
    - name: typeCount
      role: result
      type: int
    - name: unused
      # Viewport types no viewport uses (D-52).
      role: accounting
      type: IList<string>
    - name: findings
      type: IList<string>

proof:
  date: '2026-10-18'
  by: Ajmal PS
  model: 'PHASES RAN AGAINST DIFFERENT DOCUMENTS: Project2, Family1 - active was Project2,
    Revit 2020, session 13520'
  positive_case: 'run as it would normally be run. returned findings 1 item(s) [3 viewport
    type(s); 2 used by no viewport: Title No Line, No...], lines 3 item(s) [Title w Line |
    title M_View Title | show title Yes | extensi..., Title No Line | title M_View Title |
    show title Yes | extens..., No Title | title M_View Title | show title No | extension
    li...], shown Func`3, typeCount 3, unused 2 item(s) [Title No Line, No Title], useCount
    1 entry(ies), viewportTypes Title w Line | title M_View Title | show title Yes | extension
    line Yes | box No | used by 1 viewport(s)

    Title No Line | title M_View Title | show title Yes | extension line No | box No | used
    by 0 viewport(s)

    No Title | title M_View Title | show title No | extension line No | box No | used by 0
    viewport(s). on Project2'
  negative_case: 'run against ''Family1'' with categoryName=Text Notes, inViewOnly=FloorPlan:
    Level 1 instead - chosen because it should not contain what this fragment reports. returned
    findings 1 item(s) [0 viewport type(s); 0 used by no viewport.], lines 0 item(s), shown
    Func`3, typeCount 0, unused 0 item(s), useCount 0 entry(ies), viewportTypes . on Family1'
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: c5ef0d4992c3421b

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. Viewport, ElementType.FamilyName and
  the parameters VIEWPORT_ATTR_LABEL_TAG, VIEWPORT_ATTR_SHOW_LABEL,
  VIEWPORT_ATTR_SHOW_EXTENSION_LINE and VIEWPORT_ATTR_SHOW_BOX are present
  2020 through 2027 - read off RevitAPI.xml in the Nice3point reference
  packages for all eight releases on 2026-10-12.

# ROUTING - the same rows are in the fragments named here.
#
#   "which viewport types are there"          -> here
#   "which title type is each viewport"       -> LIST_VIEWS_ON_SHEET
#   "change the viewports to No Title"        -> CHANGE_ELEMENT_TYPE on the viewports
#   "shorten the title lines"                 -> SET_VIEWPORT_TITLE_LINE

utterances:
  - which viewport types are in this project
  - list the viewport title types and how many use each
  - which viewport types are not used
  - what does each viewport type show in its title

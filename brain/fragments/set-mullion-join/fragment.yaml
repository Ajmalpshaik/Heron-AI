# VERSION 1 (2026-11-24) - written in a cloud session with no Revit, for
# WN-11 in GitHub issue #1005 (the facade note's "a mullion ... its join
# changed"). Not tested in Revit. NEEDS-CHECKING Group QB, rows QB8 and QB9.

purpose: >
  SETS HOW MULLIONS MEET WHERE THEY CROSS - Revit's Make Continuous, the
  mullion running through the crossing, and Break at Join, the mullion
  stopping at the one it meets. "Make this mullion continuous", "break this
  mullion at the join", "make the vertical mullions run through the
  transoms".

  **THE MULLIONS HANDED IN, AND ONLY THOSE.** Any number, on any curtain
  walls; anything that is not a mullion is named in `notMullion` and left
  alone. `join` is continuous or break. Nothing on a type is written.

  **REVIT SAYS NOTHING BACK, SO EACH MULLION IS MEASURED.** Neither of
  Revit's calls returns anything, and a mullion has no setting to read back.
  So each one's length along its own run is measured off its solid before and
  after: made continuous it grows by the width of what it crosses, broken it
  shrinks. One that did not change the way asked is in `unchanged` with both
  lengths and never counted - it may already have been that way, may cross
  nothing, or the wall type's Join Condition may decide it. ASSUMPTION for the
  proof: that this length tells continuous from broken.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16). Every
  refusal is made before the first write; a mullion Revit will not take stops
  the call and nothing it did is kept. In a shared model a mullion another
  user holds is refused naming them.

contract:
  needs:
    - name: doc
      type: Document
    # The mullions - selected in Revit (Tab to one), or from the step before.
    - name: elements
      type: IList<Element>
    # "continuous" - Make Continuous - or "break" - Break at Join.
    - name: join
      type: string
      source: request
  provides:
    - name: changed
      # Mullions whose length along their run changed the way asked -
      # MEASURED, never counted off a call that returned.
      role: result
      type: int
    - name: unchanged
      # Mullions Revit took the call on whose length did not move the way
      # asked, each with both lengths. Evidence, never a failure hidden.
      role: accounting
      type: IList<string>
    - name: notMullion
      # Handed in but not a mullion, so left alone (D-52).
      role: accounting
      type: IList<string>
    - name: readBack
      # Each mullion's length along its run before and after. A STRING - the
      # evidence. Empty on a refusal.
      role: accounting
      type: string
    - name: refused
      role: accounting
      type: string
    - name: findings
      type: IList<string>


compatibility-note: >
  ONE PATH FOR EVERY RELEASE, read rather than remembered. On 2026-11-24
  tools/api-surface read the reference assemblies of all eight releases, 2020
  through 2027, and found one signature on every one for each member this
  calls: `Mullion.JoinMullion()`, `Mullion.BreakMullion()` and
  `Mullion.LocationCurve`; `Element.get_Geometry(Options)`, `Solid.Edges`,
  `Edge.AsCurve()`, `GeometryInstance.GetInstanceGeometry()`;
  `WorksharingUtils.GetCheckoutStatus` with its owner and
  `Document.Regenerate`. No ElementId is constructed and none is read as a
  number.

# ROUTING
#
#   "make this mullion continuous"            -> here, join continuous
#   "break this mullion at the join"          -> here, join break
#   "make the vertical mullions run through
#    the transoms"                            -> here, the vertical mullions
#                                                handed in, continuous
#   "change this one mullion"                 -> CHANGE_ELEMENT_TYPE - its type
#   "change the mullions on this curtain
#    wall type"                               -> SET_CURTAIN_WALL_GRID
#   "move this mullion"                       -> MOVE_CURTAIN_GRID_LINE
#   "delete this mullion"                     -> DELETE_ELEMENTS. MEASURED
#                                                2026-11-24 RANKING HERE on all
#                                                four backends - row 5b-2008
#   "which mullions are joined on this
#    curtain wall"                            -> a question, never this write
#                                                (D-86); nothing reads a join yet


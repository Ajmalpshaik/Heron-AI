heron-agent: HERON-REVIT-LVL-027
heron-step: 15
heron-status: DRAFT
heron-since: 0.1.0
heron-layer: brain

id: FRG-ELE-021
semantic-identity: "every level in the project, in height order, with its elevation"
kind: filter
domain: revit.levels
capability: LIST_LEVELS
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Collects the project's levels bottom to top and reports each one's elevation
  in millimetres.

  **Two elevations, and they are not always the same number.** A level carries
  `Elevation`, measured from the project's internal origin, and
  `ProjectElevation`, measured from the elevation base the project was set up
  with. They agree until somebody moves the base point, and then the number on
  the level head in Revit is the second one while the API's obvious property is
  the first. Reporting only `Elevation` gives a set of heights that disagree
  with the drawing and look authoritative. **Both are reported when they
  differ**, and that difference is exactly the thing worth being told about.

  **Sorted by height, not by name.** "Level 10" sorts before "Level 2" as text
  and above it in the building, and a level list in the wrong order is read as
  the building's section.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, every loaded link is read too and
  `linksSearched` says how many were: set and 0 means "you asked, and none
  are loaded", which is a different answer from host-only. Each link's levels are listed in
  `linkedMatches`, with where they sit from this model's internal origin
  when the link is placed higher or lower.
  **NOTHING FROM A LINK IS EVER SELECTED OR CARRIED** - `elements` and `elevationsMm` stay this model's own; the chain
  revives ids against this model, and a linked id that happens to be in
  use here binds an unrelated element (FRAGMENT-ISSUES row 75). Links
  nested inside a link are not read, and are counted in the answer. This
  is version 2; version 1's proof no longer describes the code, and the
  fragment is DRAFT until it is proved again.

contract:
  needs:
    - name: doc
      type: Document
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: findings
      type: IList<string>
    - name: elevationsMm
      role: result
      type: IDictionary<ElementId, double>
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then one line per link. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75).
      role: accounting
      type: IList<string>

proof:
  date: '2026-09-13'
  by: Ajmal PS
  model: >
    Snowdon Towers Sample HVAC.rvt (9,628 elements) and Project1 (3,410 elements, unsaved default template), both open at once in Revit 2024.3
  positive_case: >
    Snowdon Towers: 11 levels with elevations - Parking -5156.2 mm, L1 - Block 35 -1803.4 mm, L1 - Block 37 -1054.1 mm. Negative elevations are read correctly rather than clamped.
  negative_case: >
    Project1: exactly the 2 template levels, Level 1 at 0 mm and Level 2 at 4000 mm. With BOTH documents open it returned only the active one's levels - it does not read across documents, which is the way this could have been quietly wrong.
  second_route: >
    REPORT_LEVEL_ELEVATIONS read the same 11 levels by a different route in the same run, and Revit's Project Browser lists them.
  fingerprint: "49e6afa85a115f06"

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  `Level`, `Level.Elevation` and `Level.ProjectElevation` are unchanged 2020 to
  2027. Feet to millimetres is arithmetic - multiply by 304.8, per D-20 -
  because `UnitUtils` was rewritten in 2021 and the 2020 call does not exist on
  2022.

# ROUTING - repeated in READ_ELEMENT_LEVEL, SET_ELEMENT_LEVEL and CREATE_LEVEL.
#
#   "list the levels"           -> here - the levels THEMSELVES
#   "how many levels"           -> here
#   "what levels do we have"    -> here
#   "what level is this duct on"-> READ_ELEMENT_LEVEL - the level of an
#                                  ELEMENT, which is a different question with
#                                  the same words in it
#   "move these to level 3"     -> SET_ELEMENT_LEVEL
#   "add a level"               -> CREATE_LEVEL
#   "sort the schedule by level"-> SET_SCHEDULE_SORT_GROUP. NOT HERE. That
#                                  sentence resolved to this fragment until
#                                  2026-09-04 - a question about the ORDER OF
#                                  ROWS IN A TABLE, answered with a list of the
#                                  project's levels
#   "filter the schedule to level 2"
#                               -> SET_SCHEDULE_FILTERS
#
# "WHAT IS THE ELEVATION OF THIS" LANDS HERE AND SHOULD LAND ON
# READ_ELEMENT_LEVEL, whose sentence it is - "of this" means an element, and
# this fragment lists the project's levels. It is left as it is on measured
# grounds rather than by shrugging: before this fragment existed that sentence
# was answered by SET_VIEW_RANGE, which WRITES. A read giving a near-miss is a
# better failure than a write giving one, so the risk direction improved even
# though the rank did not. Fixing it properly means strengthening
# READ_ELEMENT_LEVEL, not weakening this one.
#   "turn the level heads on"        -> SET_DATUM_BUBBLES

utterances:
  - list the levels
  - how many levels
  - what levels do we have
  - show me the levels
  - what are the floor levels
  - level heights
  # ADDED 2026-10-09 (FRAGMENT-ISSUES 146). Declared nowhere, and measured
  # reaching CREATE_LEVELS, a change, on spelling.
  - what levels are in this model

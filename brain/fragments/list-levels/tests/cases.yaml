positive:
  - given: a building with levels named Basement, Ground, Level 1 … Level 10
    expect: >
      eleven rows bottom to top by HEIGHT - so Level 2 comes before Level 10,
      which text sorting reverses, and a level list is read as a section

  - given: the result handed into COUNT_ELEMENTS
    expect: the number of levels, because the levels are handed on as `elements`

  # D-59, added 2026-09-28 with version 2. NOT RUN.
  - given: >
      includeLinks true on Snowdon-scratch_ajmal.al
    expect: >
      `elements` and `elevationsMm` unchanged, and each link's
      levels in height order in `linkedMatches`, with the host-origin figure
      where the link is placed higher or lower

negative:
  - given: a project whose base point has been moved, so Elevation and ProjectElevation disagree
    expect: >
      the row reports the number the LEVEL HEAD shows and says the internal one
      differs. Reporting only Elevation gives heights that disagree with the
      drawing and carry no sign that they do

  - given: a project whose base point has never moved
    expect: >
      no caveat on any row. The two agree in most projects, which is exactly why
      the difference goes unnoticed until the one where it matters

  # D-59, added 2026-09-28 with version 2. NONE OF THESE HAS BEEN RUN.
  - given: includeLinks ABSENT, on a model that HAS loaded links
    expect: >
      the same answer as version 1's proof, and linksSearched 0 with the first
      line of linkedMatches reading "Host model only - links not read". The
      switch left out must bind false, not refuse - if the run refuses with
      needs_request_values, the add-in in Revit is older than this change

  - given: includeLinks true on a model with NO links, or with every link unloaded
    expect: >
      linksSearched 0 and "Links asked for, NONE loaded - host only". It must
      NOT read like the absent case: one means there was nothing else to read,
      the other means reload them in Manage Links and ask again

  - given: one linked file placed TWICE, with includeLinks true
    expect: >
      linksSearched 1, not 2 - it counts files, not placements

second_route:
  - Revit's own elevation view with the level heads read off, or a Level schedule, compared row for row

id: FRG-ELE-065
semantic-identity: "put a door or a window into this wall"
kind: action
domain: revit.elements
capability: PLACE_HOSTED_FAMILY
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Places a door or a window INTO the wall at each point given, and turns each
  one so it swings toward the room named for it.

  **VERSION 1 COULD NOT BE GIVEN A WALL BY NAME.** It took the host as one
  element, and a wall instance has no name anybody could type: the add-in
  refuses a typed name for one particular element, and until 2026-09-23
  heron_resolve told the caller to type an element TYPE (row 5b-190). Only a
  wall selected by hand could reach it - one wall for every point - and it was
  never run. So on 2026-09-22 in Project4 a door went through
  PLACE_FAMILY_INSTANCES instead, which answered "placed 1, failed 0", and the
  door was FREE-STANDING - right in plan, cutting nothing (FRAGMENT-ISSUES, "A
  drawing set and a house plan", item 1). Version 2 asks each POINT which wall
  it sits in: the straight walls on the level whose location line passes
  within half their width of the point, away from their ends. One wall, and the
  door goes in it. None, or two equally near, and the point is named and
  skipped - a door is never guessed into a wall.

  **HOW EACH DOOR HANGS IS NAMED BY THE CALLER, NEVER ASSUMED (D-33), AND IT IS
  THREE SETTINGS.** Each point comes with a second point inside the room the
  door should swing toward, and a third on the side its hinge belongs - the
  side wall, when the open leaf should lie back along it. Measured 2026-09-24
  in Project1 (Revit 2024), M_Single-Flush:
  - **The swing.** The leaf's plan swing arc lies on the door's FACING side, so
    the room a short way out along the facing must be the room asked for, or
    the door is flipped once.
  - **The hinge.** Read off the same plan swing arc, whose centre is the hinge,
    in a floor plan of the level. Flipping the hand moves it to the other jamb
    and leaves the swing side alone. A door with no arc in any plan, or two arcs
    a jamb apart (a pair of leaves), is named rather than guessed.
  - **The To Room.** This is what door schedules and door numbers read. Revit
    sets it at placement, and a facing flip does NOT move it: four doors flipped
    to swing toward their offices still read "To Corridor". So it is checked on
    its own, and swapped with Revit's From/To flip when wrong.
  A door still wrong on any count is named rather than counted.

  **A DOOR ALREADY AT THE POINT IS NOT DOUBLED.** A door of the same category,
  in the same wall, within 50 mm of the point, is taken as the one asked for.
  It is set right rather than stacked on - so re-running is safe, and it is
  how a door placed earlier gets corrected.

  **EVERY DOOR IS READ BACK.** Its host must be the wall that was found. One
  that Revit hosted somewhere else, or nowhere, is removed again inside the same
  undo and its point named.

  **NOTHING IN THIS LIBRARY COULD PUT A DOOR IN A WALL.** Measured 2026-09-18:
  every `NewFamilyInstance` call in the 372 fragments passes a point, a face or a
  view, and not one passes a HOST ELEMENT. So the most ordinary architectural act
  there is had no route at all.

  **A DOOR PLACED WITHOUT ITS HOST IS NOT A DOOR.** Revit will place some
  families free-standing and they then cut nothing, schedule wrong, and do not
  move when the wall moves. That is why the wall is found and the door read
  back, rather than the host being left to a name: the failure is silent and
  looks fine in plan.

  **PLACE_FAMILY_ON_FACE IS THE OTHER HALF AND IS NOT THIS.** That one hosts to a
  FACE picked off geometry, which is right for a face-based family on a soffit.
  This one hosts to the ELEMENT, which is what a door and a window want.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: symbol
      type: FamilySymbol
      source: request
    # Where each door goes - on, or within half a wall's width of, the wall's
    # location line. The wall is found from the point.
    - name: points
      type: IList<XYZ>
      source: request
    # One per point: a point inside the room that door should open into.
    - name: toRoomAt
      type: IList<XYZ>
      source: request
    # One per point: a point on the side of the jamb the hinge belongs at -
    # the side wall, when the leaf should open back against it.
    - name: hingeAt
      type: IList<XYZ>
      source: request
    - name: level
      type: Level
      source: request
  provides:
    - name: placed
      role: result
      type: IList<ElementId>
    - name: failed
      # Points where a wall was found and Revit would not host one, or hosted
      # it elsewhere so it was removed again. Never an instance it kept (D-52).
      role: accounting
      type: int
    - name: noWall
      # Points no wall on the level passes through. Given and unusable (D-52).
      role: accounting
      type: IList<string>
    - name: twoWalls
      # Points two walls are equally near, so the host is not guessed (D-52).
      role: accounting
      type: IList<string>
    - name: alreadyThere
      # Points where a door of this category already sat in that wall, within
      # 50 mm - nothing new placed, the existing door brought into line (D-52).
      role: accounting
      type: IList<string>
    - name: flipped
      # Doors turned round so they swing into the room asked for. What it did
      # to the doors, never a thing it found.
      role: accounting
      type: int
    - name: handFlipped
      # Doors whose hand was flipped so the hinge sits at the jamb named. What
      # it did to the doors, never a thing it found.
      role: accounting
      type: int
    - name: wrongHinge
      # Doors whose hinge is still at the other jamb, or could not be read -
      # no swing arc in any floor plan of the level, or two arcs a jamb apart.
      # Named, never counted as right (D-52).
      role: accounting
      type: IList<string>
    - name: toRoomSwapped
      # Doors whose From and To Room were swapped so the To Room is the room
      # asked for. A facing flip does not move the To Room, so this is its own
      # count.
      role: accounting
      type: int
    - name: wrongRoom
      # Doors still swinging into another room, or whose room point was in no
      # room. Named, never counted as right (D-52).
      role: accounting
      type: IList<string>
    - name: toRoomWrong
      # Doors whose To Room is still not the room asked for. Named, never
      # counted as right (D-52).
      role: accounting
      type: IList<string>
    - name: findings
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  `Document.Create.NewFamilyInstance(XYZ, FamilySymbol, Element, Level, StructuralType)`
  is present 2020 through 2027 - read off the reference assemblies at both ends
  on 2026-09-18. `StructuralType.NonStructural` is passed deliberately: a door is
  not a structural member, and PLACE_STRUCTURAL_FAMILY is where that decision
  belongs. Points arrive in internal FEET (D-20).

# ROUTING - repeated in PLACE_FAMILY_INSTANCES and PLACE_FAMILY_ON_FACE.
#
#   "put a door in this wall"       -> here
#   "add windows to this elevation" -> here
#   "put this light on that soffit" -> PLACE_FAMILY_ON_FACE - a FACE, picked off
#                                      geometry, which a face-based family wants
#   "place these sprinklers"        -> PLACE_FAMILY_INSTANCES - free-standing

utterances:
  - put a door in this wall
  - place windows in this wall
  - add a door here
  - place a hosted family
  - put these openings into the wall

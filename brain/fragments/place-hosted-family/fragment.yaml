id: FRG-ELE-065
semantic-identity: "put a door, a window, a skylight or any hosted family into its wall, floor, ceiling or roof"
kind: action
domain: revit.elements
capability: PLACE_HOSTED_FAMILY
version: 4
source: OFFICIAL
risk: MODIFY

# THE TOP OF THIS PURPOSE IS WHAT THE SEARCH READS (FRAGMENT-ISSUES 5b-319).
# The trained search model reads only the first 512 word-pieces of a card -
# identity, utterances, then the purpose - and this card is far longer
# (measured 2026-10-04: 1,355). Version 3 put its sill rules first, and "place
# doors and windows hosted in walls at points" went to REPORT_SPACE_ENVELOPE
# with this card 35th by nearness. So what a modeller asks it for comes first,
# the rules that still hold come next, and history comes last. A new version's
# rules go below the summary, never above it.
purpose: >
  Places a hosted family INTO its host at each point given: a door or a
  window into the wall there, and - since version 4 - a skylight into a flat
  roof, a roof hatch or a vent into the roof over the point, a floor drain, a
  grating or a floor box into the floor under it, a light or a fitting into
  the ceiling over it. A door is turned to swing toward the room named for it and a
  window to face out, and - when a sill height is given - a door's or a
  window's sill is set and read back.

  What a modeller asks it for: put doors and windows into walls, skylights
  into roofs, drains and floor boxes into floors, fittings into ceilings.

  **THE FAMILY SAYS WHAT IT GOES INTO** - its own Host setting, never its
  category or the words used: a skylight is a Windows family hosted by a
  roof. A face-based family is refused, naming PLACE_FAMILY_ON_FACE; one
  that is not hosted at all, naming PLACE_FAMILY_INSTANCES.

  **ONE ALREADY AT THE POINT IS NOT DOUBLED.** One of the same category, in
  the same host, within 50 mm of the point, is taken as the one asked for and
  set right rather than stacked on - so re-running is safe, and it is how
  one placed earlier gets corrected.

  **PLACE_FAMILY_ON_FACE IS THE OTHER HALF AND IS NOT THIS.** That one hosts to a
  FACE picked off geometry, which is right for a face-based family on a soffit.
  This one hosts to the ELEMENT - the wall, floor, ceiling or roof.

  **VERSION 4: FLOORS, CEILINGS AND ROOFS, AND A WINDOW FACES OUT.** The host
  is found straight down through the point - up, for a ceiling: floors and
  ceilings on `level`, roofs on every level, where `level` only decides
  between two. None or two there, and the point is named and skipped. Every
  one is read back - its host, its Level, where it stands and how it is
  turned - in `hostedIn` and, whole, in `readBack`. `rotation` turns it in
  plan, in degrees; blank leaves it as Revit places it. No offset and no
  sill: the host's face decides its height. `toRoomAt` and `hingeAt` are a
  door's and a window's and are not read for a roof, floor or ceiling - send
  the points again, since an empty point list is refused. A window keeps
  facing its wall's exterior and no hinge is read for it (rows 5b-325,
  5b-293).

  **VERSION 3 SETS THE SILL, AND READS IT EITHER WAY.** `sillHeight` is in
  millimetres above the level, or blank. BLANK IS VERSION 2 EXACTLY: the sill
  is left as Revit placed it - but what each door or window reads is still
  reported, in `sills`, because a window placed through the API has been said
  to land with its sill at 0. Nobody here has measured that; the reading
  settles it either way. Given a sill:
  - **Checked before placing.** Level + sill + the type's Height (the
    built-in Height doors and windows both use) against the top of the wall
    found at the point. A head that would stand above the wall skips that
    point - `sillTooHigh` - and nothing is placed or changed there. A type
    whose Height is on the instance cannot be read this cheaply, and the reply
    counts those points as not checked rather than guessing.
  - **Set on the built-in Sill Height and nothing else.** A family without one,
    or with it read-only, is never given some other parameter found by its name
    - a typed name may repeat (FRAGMENT-ISSUES 5b-203). One this call placed is
    removed again inside the same undo; one already there is left as it was.
    Both are named in `noSillParameter`. **A door or window already in the
    wall is never given the asked sill** - this call did not place it; its sill
    is read and said in `sills`, and nothing on it changes.
  - **Read back after a regenerate**, and set beside what was asked in `sills`.
    More than 1 mm out is named in `sillWrong`, never counted as right.

  **VERSION 2'S RECORD FOLLOWS.** The two rules about a door already at the
  point and PLACE_FAMILY_ON_FACE are version 2's as well, and still hold.

  **VERSION 1 COULD NOT BE GIVEN A WALL BY NAME.** It took the host as one
  element, and a wall instance has no name anybody could type: the add-in
  refuses a typed name for one particular element, and until 2026-09-23
  heron_resolve told the caller to type an element TYPE (row 5b-190). Only a
  wall selected by hand could reach it - one wall for every point - and it was
  never run. So on 2026-09-22 in Project4 a door went through
  PLACE_FAMILY_INSTANCES instead, which answered "placed 1, failed 0", and the
  door was FREE-STANDING - right in plan, cutting nothing (FRAGMENT-ISSUES, "A
  drawing set and a house plan", item 1). Version 2 asks each POINT which wall
  it sits in: the straight walls on the level whose location line passes
  within half their width of the point, away from their ends. One wall, and the
  door goes in it. None, or two equally near, and the point is named and
  skipped - a door is never guessed into a wall.

  **HOW EACH DOOR HANGS IS NAMED BY THE CALLER, NEVER ASSUMED (D-33), AND IT IS
  THREE SETTINGS.** Each point comes with a second point inside the room the
  door should swing toward, and a third on the side its hinge belongs - the
  side wall, when the open leaf should lie back along it. Measured 2026-09-24
  in Project1 (Revit 2024), M_Single-Flush:
  - **The swing.** The leaf's plan swing arc lies on the door's FACING side, so
    the room a short way out along the facing must be the room asked for, or
    the door is flipped once.
  - **The hinge.** Read off the same plan swing arc, whose centre is the hinge,
    in a floor plan of the level. Flipping the hand moves it to the other jamb
    and leaves the swing side alone. A door with no arc in any plan, or two arcs
    a jamb apart (a pair of leaves), is named rather than guessed.
  - **The To Room.** This is what door schedules and door numbers read. Revit
    sets it at placement, and a facing flip does NOT move it: four doors flipped
    to swing toward their offices still read "To Corridor". So it is checked on
    its own, and swapped with Revit's From/To flip when wrong.
  A door still wrong on any count is named rather than counted.

  **EVERY DOOR IS READ BACK.** Its host must be the wall that was found. One
  that Revit hosted somewhere else, or nowhere, is removed again inside the same
  undo and its point named.

  **NOTHING IN THIS LIBRARY COULD PUT A DOOR IN A WALL.** Measured 2026-09-18:
  every `NewFamilyInstance` call in the 372 fragments passes a point, a face or a
  view, and not one passes a HOST ELEMENT. So the most ordinary architectural act
  there is had no route at all.

  **A DOOR PLACED WITHOUT ITS HOST IS NOT A DOOR.** Revit will place some
  families free-standing and they then cut nothing, schedule wrong, and do not
  move when the wall moves. That is why the wall is found and the door read
  back, rather than the host being left to a name: the failure is silent and
  looks fine in plan.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

# VERSION 4 IN FULL - kept here, not in the purpose. The words route ranks a
# long card lower, and the version-4 rules written out in the purpose (1,817
# words against main's 1,020) dropped "add windows to the outside walls" from
# this card to REPORT_SPACE_ENVELOPE, a READ (measured 2026-10-06 on private
# stores, both backends). The search reads the purpose; nothing reads this.
#
#   THE HOST, FROM THE FAMILY. FamilyPlacementType says whether it is hosted
#   at all; the family's FAMILY_HOSTING_BEHAVIOR (Host) says by what. Measured
#   2026-10-06 in Project2 (Revit 2024, session 51820): a project reads it off
#   a loaded family - M_Skylight-Flat reads Roof, M_Fixed Wall, M_Troffer
#   Light - Parabolic Rectangular Ceiling; M_Downlight - Round - LED and
#   M_Floor Drain - Round are face-based and were refused naming
#   PLACE_FAMILY_ON_FACE; M_Floor Drain-2D, M_Outlet Floor-Duplex and
#   M_Supply Register-Floor are level-based and were refused naming
#   PLACE_FAMILY_INSTANCES. No floor-hosted family was in the library on this
#   PC, so the floor path is read from the code, not yet seen on a model.
#
#   FOUND STRAIGHT DOWN. Every floor or roof whose TOP face, and every
#   ceiling whose UNDERSIDE, a vertical line through the point crosses is a
#   candidate - so a point over a shaft or an opening has none, and a point
#   over two slabs, two ceilings or a canopy under the main roof has two.
#   Floors and ceilings on `level` only: every storey has its own, so any
#   level would always find several. Roofs on EVERY level: a roof is drawn on
#   a level of its own - "Roof", the top storey - seldom the one a modeller
#   names. Where two roofs are, the one on `level` is taken when exactly one
#   of them is on it. Measured: a skylight asked for on Level 1 went into the
#   flat roof on Level 2, and a point under two ceilings was refused naming
#   both while the next point, under one, still got its light.
#
#   ONE ALREADY THERE IS LOOKED FOR FIRST: it has cut its own opening, so the
#   vertical line through its point meets no face. Measured: before this was
#   put first, re-running a kept skylight's own call answered "no roof on any
#   level is over it".
#
#   PLACED THROUGH THE HOST'S OWN LEVEL. Measured: the overload that takes a
#   direction left a skylight reading no Level at all; this one gives it the
#   roof's, 'Level 2'. The direction overload is the fallback, counted.
#
#   ROTATION is the instance's own X axis, in plan, from east. Given, it is
#   read back after placing and turned about the instance's own vertical line
#   if it points anywhere else, then read again; more than half a degree out
#   is `rotationWrong`. Measured: 90 and 30 degrees, and 45 on one already
#   there, all read back exact. A rotation for a wall family is refused - a
#   door or window turns with its wall.
#
#   NO OFFSET. A family hosted by a floor, a ceiling or a roof sits on that
#   host's face; one that must stand off a face is face-based. Measured: the
#   skylight's insertion point reads the roof's base, 4000 mm, under its
#   top face at 4400; the ceiling light reads the ceiling's underside, 2700.
#
#   A WINDOW FACES OUT. Version 3 gave a window the door's swing rule. On
#   2026-10-06 in "Heron loads test" (Revit 2024) it flipped eight M_Fixed
#   0915 x 1220mm windows inside-out - FacingFlipped True, opposite their
#   walls' exterior (row 5b-325) - and the same day in Project2 version 3
#   flipped both windows of a rolled-back run the same way, naming both in
#   `wrongHinge` for want of a swing arc (row 5b-293). Version 4 on the same
#   walls: FacingOrientation equal to Wall.Orientation, FacingFlipped False,
#   To Room the room named, no hinge read.
#
#   PROVED BY THE HOST, NOT BY `placed`: the roof in Project2, 8600 x 6600 x
#   400 mm (22.704 m3, 56.76 m2), read 22.243 m3 and 55.604 m2 with one
#   M_Skylight-Flat 1200 x 1200mm in it - an opening of about 1.155 m2 - read
#   by SELECT_BY_NUMERIC_PARAMETER, not by this fragment.

contract:
  needs:
    - name: doc
      type: Document
    # The family type. ITS FAMILY'S OWN HOST SETTING decides what it goes
    # into - a wall, a floor, a ceiling or a roof - never its category: a
    # skylight is a Windows family hosted by a roof.
    - name: symbol
      type: FamilySymbol
      source: request
    # Where each one goes. In a wall: on, or within half a wall's width of,
    # the wall's location line - the wall is found from the point. In a
    # floor, a ceiling or a roof: anywhere over its outline in plan - the host
    # is found straight down (up, for a ceiling) through the point, and the
    # point's own height is not read.
    - name: points
      type: IList<XYZ>
      source: request
    # One per point, for a door or a window: a point inside the room it should
    # open into - a window's To Room. NOT READ for a floor, a ceiling or a
    # roof; the add-in refuses an empty point list, so send `points` again.
    - name: toRoomAt
      type: IList<XYZ>
      source: request
    # One per point, for a door: a point on the side of the jamb the hinge
    # belongs at - the side wall, when the leaf should open back against it.
    # NOT READ for a window, a floor, a ceiling or a roof; send `points` again.
    - name: hingeAt
      type: IList<XYZ>
      source: request
    # The level the walls stand on, or the floors and ceilings belong to.
    # Roofs are found on EVERY level, by what is over the point; this one
    # decides only between two roofs over the same point.
    - name: level
      type: Level
      source: request
    # VERSION 3. Millimetres above the level - "900" - or BLANK for version
    # 2's behaviour: the sill left as Revit placed it, and only read. A string
    # so that blank can mean "not asked". NOT marked `optional: true`, because
    # nothing would honour it: the add-in refuses any `source: request` need
    # that arrives with no value unless it is a bool (FRAGMENT-ISSUES 5b-227
    # and 5b-252). Send it, blank or not.
    - name: sillHeight
      type: string
      source: request
    # VERSION 4. Degrees, turned anticlockwise in plan from the way the family
    # is drawn - "90" - for a family in a floor, a ceiling or a roof: one for
    # every point, or one per point with semicolons between. BLANK places it
    # with its own X along east and leaves it as Revit puts it. A door, a
    # window or anything else in a wall turns with its wall, so a rotation
    # other than 0 for one is refused before anything is placed. A string
    # like sillHeight, so blank can mean "not asked" - and sent, blank or not,
    # for the same reason (5b-227, 5b-252).
    - name: rotation
      type: string
      source: request
  provides:
    - name: placed
      role: result
      type: IList<ElementId>
    - name: failed
      # Points where a host was found and Revit would not host one, or hosted
      # it elsewhere so it was removed again. Never an instance it kept (D-52).
      role: accounting
      type: int
    - name: noWall
      # Points no wall on the level passes through. Given and unusable (D-52).
      role: accounting
      type: IList<string>
    - name: twoWalls
      # Points two walls are equally near, so the host is not guessed (D-52).
      role: accounting
      type: IList<string>
    - name: noHost
      # VERSION 4. Points with no floor or ceiling of the level given, or no
      # roof on any level, at them - named with the levels that DO have one.
      # Given and unusable (D-52).
      role: accounting
      type: IList<string>
    - name: twoHosts
      # VERSION 4. Points two floors, ceilings or roofs cover, named with
      # their ids and levels - the host is not guessed (D-52).
      role: accounting
      type: IList<string>
    - name: hostedIn
      # VERSION 4. One line per instance kept or found already there, read
      # back: the host's id, category, type and level, where the instance
      # stands, how it is turned, and a window's facing. A reading, never a
      # thing it did.
      role: accounting
      type: IList<string>
    - name: offPoint
      # VERSION 4. Instances it placed that read back more than 1 mm in plan
      # from their point - or, in a wall, from the wall's line there. Named,
      # never counted as right (D-52).
      role: accounting
      type: IList<string>
    - name: alreadyThere
      # Points where one of this category already sat in that host, within
      # 50 mm - nothing new placed, the existing one brought into line (D-52).
      role: accounting
      type: IList<string>
    - name: flipped
      # Doors turned round so they swing into the room asked for - and other
      # wall-hosted families turned to face it; never a window. What it did,
      # never a thing it found.
      role: accounting
      type: int
    - name: handFlipped
      # Doors whose hand was flipped so the hinge sits at the jamb named. What
      # it did to the doors, never a thing it found.
      role: accounting
      type: int
    - name: wrongHinge
      # Doors whose hinge is still at the other jamb, or could not be read -
      # no swing arc in any floor plan of the level, or two arcs a jamb apart.
      # Named, never counted as right (D-52). A door's alone since version 4:
      # a window has no hinge to read (row 5b-293).
      role: accounting
      type: IList<string>
    - name: toRoomSwapped
      # Doors and windows whose From and To Room were swapped so the To Room
      # is the room asked for. A facing flip does not move a door's To Room,
      # so this is its own count.
      role: accounting
      type: int
    - name: turnedOut
      # VERSION 4. Windows turned round so they face their wall's exterior,
      # Wall.Orientation - what it did to them, never a thing it found.
      role: accounting
      type: int
    - name: wrongRoom
      # Doors still swinging into another room - or another wall-hosted family
      # still facing one - and doors and windows whose room point was in no
      # room. Named, never counted as right (D-52).
      role: accounting
      type: IList<string>
    - name: toRoomWrong
      # Doors and windows whose To Room is still not the room asked for.
      # Named, never counted as right (D-52).
      role: accounting
      type: IList<string>
    - name: facingWrong
      # VERSION 4. Windows still facing into the building, against their
      # wall's exterior, after the flip. Named, never counted as right (D-52).
      role: accounting
      type: IList<string>
    - name: rotationWrong
      # VERSION 4. Instances in a floor, a ceiling or a roof whose own X axis
      # reads more than half a degree from the rotation asked, after the turn.
      # Named, never counted as right (D-52).
      role: accounting
      type: IList<string>
    - name: sills
      # VERSION 3. One line per door or window kept: the sill asked and the
      # sill read back, or - with no sill asked - what Revit placed it at. A
      # reading, never a thing it did, so it banks nothing.
      role: accounting
      type: IList<string>
    - name: sillWrong
      # Sills that read back more than 1 mm from what was asked. Named, never
      # counted as right (D-52).
      role: accounting
      type: IList<string>
    - name: noSillParameter
      # Doors and windows whose family has no usable built-in Sill Height. One
      # this call placed was removed again; one already there was left alone.
      # No other parameter is ever tried by name (5b-203).
      role: accounting
      type: IList<string>
    - name: sillTooHigh
      # Points skipped before placing: the sill plus the type's Height would
      # put the head above the wall's top. Given and unusable (D-52).
      role: accounting
      type: IList<string>
    - name: readBack
      # VERSION 4. The family's Host setting as read, then every `hostedIn`
      # line, joined on one line - because a reply prints a list's first three
      # lines cut at 60 characters, and the read-back is the evidence. A
      # reading, never a thing it did.
      role: accounting
      type: string
    - name: findings
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  `Document.Create.NewFamilyInstance(XYZ, FamilySymbol, Element, Level, StructuralType)`
  is present 2020 through 2027 - read off the reference assemblies at both ends
  on 2026-09-18. `StructuralType.NonStructural` is passed deliberately: a door is
  not a structural member, and PLACE_STRUCTURAL_FAMILY is where that decision
  belongs. Points arrive in internal FEET (D-20).

  Version 3, read off the reference assemblies 2020 to 2027 on 2026-10-04:
  `BuiltInParameter.INSTANCE_SILL_HEIGHT_PARAM` and `FAMILY_HEIGHT_PARAM`
  (one value, which `DOOR_HEIGHT` and `WINDOW_HEIGHT` share), `Element.get_Parameter
  (BuiltInParameter)`, `Element.get_BoundingBox(View)`, `Parameter.Set(double)`,
  `IsReadOnly`, `StorageType` and `AsDouble` - one signature each across all
  eight. The sill arrives in millimetres and becomes feet by / 304.8 (D-20).

  Version 4, compiled against the reference assemblies of all eight releases
  on 2026-10-06 (tools/check-fragments-compile.py): `Family.FamilyPlacementType`,
  `BuiltInParameter.FAMILY_HOSTING_BEHAVIOR` and the `FamilyHostingBehavior`
  values it holds - Wall 1, Floor 2, Ceiling 3, Roof 4, Face 5, read off the
  2020 and 2024 assemblies - `HostObjectUtils.GetTopFaces` and
  `GetBottomFaces`, `Element.GetGeometryObjectFromReference`,
  `Face.Intersect(Curve, out IntersectionResultArray)`,
  `Document.Create.NewFamilyInstance(XYZ, FamilySymbol, XYZ, Element,
  StructuralType)` - the overload for an instance that needs a host and a
  direction - `FamilyInstance.GetTransform`, `ElementTransformUtils.RotateElement`,
  `Wall.Orientation` ("the normal vector projected from the exterior side of
  the wall") and `FamilyInstance.FacingFlipped`. Whether a project reads the
  Host setting off a loaded family is Revit's, and is the first thing the
  proof reads.

# ROUTING - repeated in PLACE_FAMILY_INSTANCES and PLACE_FAMILY_ON_FACE.
#
#   "put a door in this wall"       -> here
#   "add windows to this elevation" -> here
#   "place a skylight into the roof at this point" -> here - ROOF-hosted
#   "put floor boxes into the floors at these points" -> here - FLOOR-hosted
#   "place ceiling-hosted fittings into the ceilings" -> here - CEILING-hosted
#   "put this light on that soffit" -> PLACE_FAMILY_ON_FACE - a FACE, picked off
#                                      geometry, which a face-based family wants
#   lights or diffusers "in the     -> here when the family's Host setting reads
#    ceiling"                          Ceiling; PLACE_FAMILY_ON_FACE when the
#                                      family is face-based. The words cannot
#                                      tell the two apart and do not have to:
#                                      the family decides, and this tool
#                                      refuses a face-based family by name
#   "place these sprinklers"        -> PLACE_FAMILY_INSTANCES - free-standing
#   "put a roof over this",         -> CREATE_ROOF, CREATE_FLOOR and
#    "add a slab here", "put a         CREATE_FROM_ROOM_BOUNDARIES - the host
#    ceiling in every room"            itself, not a family hosted in it
#   "the plan is off to the side,   -> CENTER_VIEWPORTS_ON_SHEETS - a viewport
#    centre it"                        on a sheet, not a family in a wall. The
#                                      sentence reached here until 2026-09-27

# VERSION 3: "put the windows in at a 900 sill" is still here - the sill is a
# value of this job, not a second tool.
#
# VERSION 4 (2026-10-06, row 5b-326): a skylight in a flat roof was the first
# job no tool could do - nothing placed a family INTO a roof, a floor or a
# ceiling at a point. This tool was widened rather than a second one written:
# the job is the same - find the host at the point, place into it, read it
# back - and only the host differs. The phrasings below name roofs, floors and
# ceilings in the plural because the words route matches a typed word as a
# prefix (row 5b-319): "roofs" in a card answers "roof" typed, and not the
# other way round.
#
# 2026-10-04 (5b-319): "place doors and windows hosted in walls at points",
# "add windows to the outside walls" and "put doors in the walls at these
# points" -> here. Each had gone to REPORT_SPACE_ENVELOPE, a READ, or to
# CREATE_WALL. The plural phrasings below are there because the words route
# matches a typed word as a PREFIX: "walls" never matches "wall", and every
# phrasing here was singular. tests/test_routing_phrases.py asks them back.

utterances:
  - put a door in this wall
  - place windows in this wall
  - add a door here
  - place a hosted family
  - put these openings into the wall
  - place windows along the outside walls
  - add doors to the walls at the points given
  - insert windows into the walls at a sill height
  - put a door at each of these points
  - fit the windows into the external walls
  - place a skylight into the roof at this point
  - put roof hatches and vents into the roofs
  - place floor drains and gratings into the floor slabs
  - put floor boxes into the floors at these points
  - place ceiling-hosted fittings into the ceilings

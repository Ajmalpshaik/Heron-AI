tests: tests/

compatibility-note: >
  One implementation for every release. The `RBS_DUCT_FLOW_PARAM`,
  `RBS_VELOCITY`, `RBS_CURVE_WIDTH_PARAM`, `RBS_CURVE_HEIGHT_PARAM` and
  `RBS_CURVE_DIAMETER_PARAM` built-in parameters are unchanged 2020 to 2027.
  Every conversion here is arithmetic rather than `UnitUtils` (D-20), so
  2021's unit API rewrite does not reach this code.

# ROUTING - repeated in SET_MEP_SIZE.
#
#   "how fast is the air moving"        -> here
#   "is this duct too small"            -> here, with the limit stated
#   "make the duct 400 wide"            -> SET_MEP_SIZE
#   "what size are these"               -> READ_ELEMENT_PARAMETERS
#
# THE VELOCITY QUESTION AND THE SIZE QUESTION ARE THE SAME SENTENCE HALF THE
# TIME. "This duct is too small" is a velocity finding and a size instruction
# in one breath; this fragment answers the first and never acts on the second.
#   "size the ducts from the flow"   -> AUTO_SIZE_MEP - the write. This one
#                                       only measures what is there

utterances:
  - how fast is the air moving
  - check the duct velocity
  - is the duct too small for the flow
  - what is the velocity in these
  - are any of these over the velocity limit

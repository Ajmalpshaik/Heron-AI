id: FRG-MEP-006
semantic-identity: "how fast is the air moving in these ducts"
kind: action
domain: revit.mep
capability: MEASURE_MEP_VELOCITY
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Air velocity in each duct, in metres per second, and which ones exceed a
  stated limit. The check behind *"is this duct too small for the flow"* —
  and before this fragment the search answered that with `CREATE_DUCT`.

  **It computes the velocity from flow and area AND reads Revit's own, then
  reports both.** Not belt and braces: Revit's velocity parameter is derived
  from the size and the flow it currently believes, and both can be stale — a
  duct resized after the system was last calculated reports the old figure and
  looks fine. Two numbers that disagree is the finding, not a nuisance.

  **The limit is a per-request input with no default.** 5 m/s in an occupied
  space, 8 or more in a riser, different again for a plant room and for a
  different authority. A number invented here would be a number quietly relied
  on across every project.

  **A round duct is not a rectangular one and the area is not the same
  arithmetic.** Both are handled; anything that is neither is named rather
  than guessed at.

contract:
  needs:
    - name: elements
      type: IList<Element>
    - name: maximumVelocity
      type: double
      source: request
  provides:
    - name: velocity
      # The velocity worked out for every element that HAS flow. Filled in
      # identically whatever limit was asked for - the answer is which of
      # them exceed it (D-52).
      role: accounting
      type: IDictionary<ElementId, double>
    - name: revitSays
      # Revit's own velocity for the same elements, carried so the two can
      # be compared. Evidence, not a finding.
      role: accounting
      type: IDictionary<ElementId, double>
    - name: overLimit
      type: IList<ElementId>
    - name: disagrees
      type: IList<ElementId>
    - name: noFlow
      type: IList<ElementId>


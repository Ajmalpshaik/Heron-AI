positive:
  - given: a library where six air terminal types are missing the office prefix
    expect: >
      those six named, each with its placed count - CHECKED against the Project
      Browser's Families branch, because a count alone does not say which

  - given: an MEP equipment type with no connectors, placed forty times
    expect: >
      ONE row, not forty, with "40 placed" beside it. That count is what makes it
      urgent; the row is what makes it fixable

  - given: a type missing a required project parameter
    expect: the parameter named, so the fix is exact

  # VERSION 2 - a family open in the Family Editor
  - given: >
      a scratch Pipe Accessories family with two opposite pipe connectors,
      Work Plane-Based Yes, Part Type Normal, one connector flipped to point
      into the body, its Diameter associated to a TYPE parameter that two
      formulas read, and one family parameter nothing uses
    expect: >
      offStandard 6 and each named in familyReport: FAIL Work Plane-Based, FAIL
      Part Type Normal, FAIL the inward connector by id, FAIL the pair not
      opposite (the flip makes both point one way), FAIL the type size
      parameter with "2 formula(s) depend on it", FAIL the unused parameter by
      name. Each with its fix - SET_FAMILY_SETTINGS, SET_FAMILY_CONNECTOR_ROLES
      flip, the Family Types switch, DELETE_FAMILY_PARAMETERS

  - given: TRG_PLMB_VLV_PPR Gate Valve_GV_R0 as saved on 2026-10-04
    expect: >
      FAIL on Nominal Diameter being a TYPE parameter, with the formulas
      depending on it counted (the build reported 35) - the reason it does not
      resize with its pipe. PASS on
      Work Plane-Based No and Part Type Valve Breaks Into

  - given: a connector whose System Classification is Domestic Cold Water on an inline accessory
    expect: a WARN, not a FAIL - some offices fix the system on purpose

  # VERSION 3 - classification. Revit 2024, whose per-user
  # OmniClassTaxonomy.txt files 21 codes under Pipe Accessories and 23.30.10.00
  # under Doors.
  - given: a Pipe Accessories family open in the Family Editor, OmniClass Number blank
    expect: >
      WARN "OmniClass Number is blank. The classification file gives Pipe
      Accessories 21 code(s)" with FIX SET_FAMILY_SETTINGS "OmniClass
      Number=<code>"; classificationReport carrying that line and the file read

  - given: the same family after OmniClass Number is set to 23.30.10.00 by hand
    expect: FAIL - filed under Doors in the classification file, not Pipe Accessories

  - given: the same family with OmniClass Number 23.99.99.99 typed by hand
    expect: FAIL - not a code in the classification file, the path named

  - given: >
      the same family with a type whose Assembly Code is typed by hand to a
      code the Assembly Code table does not hold, and one whose Keynote is
      not in the keynote table
    expect: >
      FAIL naming the type and the code, FIX SET_FAMILY_TYPE_VALUES "Assembly
      Code=..."; WARN for the keynote - OR, if the family document holds no
      Assembly Code or keynote table, NOT CHECKED saying so. Which of the two
      a family document gives is the first thing this case learns

  - given: >
      a PROJECT with a loaded Pipe Accessories family whose OmniClass Number
      is 23.30.10.00, and a family type whose Assembly Code is not in the
      project's Assembly Code table
    expect: >
      both types' rows OFF STANDARD with the reason - "filed under Doors" with
      OPEN_FAMILY_FOR_EDITING, SET_FAMILY_SETTINGS, LOAD_FAMILY back; the
      Assembly Code not in the table - and classificationReport counting each,
      naming the types, and naming the file read. FIRST read whether the
      loaded type exposes OmniClass Number at all: a "not checked - no value
      to read" there is the answer to that question, not a pass

  # VERSION 4 - a duct or pipe fitting's own rules (row 5b-1346)
  - given: >
      a scratch Pipe Fittings family, Part Type Elbow, two pipe end faces each
      with a pipe connector sized by an instance Nominal Diameter, system
      Fitting, the one pointing +X primary, and both connectors' Angle driven
      by an instance parameter Angle
    expect: >
      no FAIL and no WARN from the version 4 checks: PASS "Part Type Elbow with
      2 pipe connector(s)", each connector "is Fitting", the +X one "is primary
      and lies on the X axis", each Angle "driven by the instance parameter
      \"Angle\""

  - given: the same family with a third pipe connector added on a side face, in the same rolled-back run
    expect: >
      FAIL "Part Type is Elbow but the family has 3 pipe connector(s) - that
      part has 2", FIX naming REMOVE_FAMILY_CONNECTOR

negative:
  - given: >
      VERSION 4. The same scratch elbow with its Angle switched to a TYPE
      parameter, and one connector's System Classification set to Global
    expect: >
      FAIL on that Angle naming the type parameter and the switch; WARN that
      connector "is Global, not Fitting". And a Pipe ACCESSORIES family with
      two Global connectors gets none of the version 4 rows - they are a
      fitting's, never an accessory's

  - given: a family type that exists in the project but is placed NOWHERE
    expect: >
      counted in notChecked, with the reason. THIS IS THE FIRST CASE TO RUN. A
      type does not expose its connectors - only a placed instance does - so a
      version that reports it as having none is guessing, and it is guessing in
      the direction that generates false work

  - given: duct types, pipe types and wall types in the project
    expect: >
      counted as system families and EXCLUDED, with the count said. They have no
      family file and cannot be audited this way; silently skipping them makes
      the total meaningless

  - given: an in-place family
    expect: >
      audited but marked IN-PLACE. It belongs to one model and can never be a
      library standard, so the label changes what the reader does about it

  - given: an empty namePattern and no required parameters
    expect: >
      only the connector question asked, and nothing reported off standard for
      naming. There is no default convention here and inventing one would apply
      one office's rules to another's model

  # VERSION 2
  - given: >
      the two PPR check valves after SET_FAMILY_SETTINGS fixed them -
      Work Plane-Based No, Part Type Valve Breaks Into, instance sizes
    expect: >
      no FAIL for placement or size - the D-30 case that must NOT contain what
      the scratch family reported. Anything still failing is named and
      checked by hand before the case is called clean

  - given: a Mechanical Equipment family whose connector size is driven by a type parameter
    expect: >
      NO size FAIL - equipment is a run's end and a fixed size per type is
      right for it; and no Work Plane-Based or Part Type check at all

  - given: a Generic Models family
    expect: >
      only the name, required-parameter and tidiness checks, and a finding that
      says so - not a single connector FAIL

  # Row 5b-203, added 2026-10-09. NOT RUN - it needs a project that carries a
  # duplicated name, and none has been arranged yet.
  - given: >
      in a PROJECT, requiredParameters naming a parameter a family type
      carries twice - a TYPE project parameter bound to the category beside
      the family's own type parameter of the same name
    expect: >
      that type's row saying WARN, the name and "2 times", and `warned`
      counting it - NOT a silent pass, and NOT "no such parameter" either.
      It is present; which of the two a lookup by that name shows is Revit's
      pick (row 5b-203)

  # VERSION 3
  - given: >
      the Pipe Accessories family with OmniClass Number 23.65.55.14.14
      (Isolation Valves for Liquid Services) - set by SET_FAMILY_SETTINGS
    expect: >
      PASS on the OmniClass Number - a correct code for its category must NOT
      be flagged. THE D-30 NEGATIVE for this group

  - given: a Detail Items family open in the Family Editor, OmniClass Number blank
    expect: >
      NOT CHECKED - the classification file gives Detail Items no code, so it
      is not judged; no WARN and no FAIL on the OmniClass Number

  - given: >
      a PROJECT whose loaded family types mostly have a blank OmniClass
      Number, with requiredParameters empty
    expect: >
      the blanks COUNTED in classificationReport and NOT off standard - there
      is no universal standard that every family carries one (D-33); the same
      run with requiredParameters "OmniClass Number" makes each blank one off
      standard

  - given: a PROJECT family type whose Keynote is not in the loaded keynote file
    expect: >
      "WARN Keynote ... is not in the keynote table" in its row, counted in
      classificationReport - NOT off standard, and `warned` unchanged (it
      counts only doubled required names)

second_route:
  - Project Browser, Families branch - and Manage, Purge Unused to see which are placed at all
  - "In the Family Editor: Family Category and Parameters for Work Plane-Based and Part Type; select each connector for its direction arrow, System Classification and the small associate button beside Diameter; Family Types for Instance or Type"
  - REPORT_FAMILY_TEMPLATE, REPORT_FAMILY_CONNECTORS and REPORT_FAMILY_PARAMETERS on the same family
  - "The OmniClass Number in Family Category and Parameters (its button lists the file's codes); a type's Assembly Code and Keynote buttons in Type Properties, which list the loaded tables"
  - REPORT_FAMILY_TEMPLATE's classificationCodes on the same family

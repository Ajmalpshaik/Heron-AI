compatibility-note: >
  One implementation for every release. Version 2's family checks use
  `ConnectorElement`, `FamilyManager.GetAssociatedFamilyParameter`,
  `GenericForm.GetVisibility` and `Options.DetailLevel`, all on 2020, and the
  project audit counts a required name with `Element.GetParameters(string)`,
  on 2020 too; part types
  and categories are matched by their enum NAMES read on the running Revit, so
  one a release has not got (OST_PlumbingEquipment before 2025) is never this
  family's. `Family`, `FamilySymbol`,
  `Family.IsInPlace`, `FamilyInstance.MEPModel` and `ConnectorManager` are
  unchanged 2020 through 2027 - read off the reference assemblies at both ends.
  The name test is a plain substring match rather than a regular expression, so
  it behaves the same on .NET Framework and .NET 10 and needs no escaping of
  whatever the office convention contains.
  VERSION 4 adds `ConnectorElement.IsPrimary`, `Direction`,
  `SystemClassification` and the built-in parameter `CONNECTOR_ANGLE`, read
  through `FamilyManager.GetAssociatedFamilyParameter` - all 2020 to 2027, the
  same members REPORT_FAMILY_CONNECTORS and SET_FAMILY_CONNECTOR_ROLES use - and
  matches Part Type by `PartType` enum name, the names read in the RevitAPI XML
  of all eight releases on 2026-10-28 (docs/43 section 10).
  VERSION 3, CLASSIFICATION (read 2026-10-11 with `tools/api-surface
  --members` over the 2020 to 2027 reference assemblies): the built-in
  parameters were RENAMED at 2026 with their numbers kept - `OMNICLASS_CODE`
  (-1002502) and `UNIFORMAT_CODE` (-1002500) on 2020 to 2025 are
  `CLASSIFICATION_CODE` and `ASSEMBLY_CODE` on 2026 and 2027, the old names
  gone (tools/api-surface/changes.json) - so the name the running Revit has is
  found with `Enum.IsDefined` and `Enum.Parse`, one implementation and no #if,
  and shown with `LabelUtils.GetLabelFor(BuiltInParameter)`; `KEYNOTE_PARAM`
  (-1140422) is the same on every release. `AssemblyCodeTable.GetAssemblyCodeTable`,
  `KeynoteTable.GetKeynoteTable`, `KeyBasedTreeEntryTable.GetKeyBasedTreeEntries`,
  `KeyBasedTreeEntry.Key`, `ClassificationEntry.CategoryId`, `Description` and
  `HasBadCategoryId`, `FamilyManager.get_Parameter(BuiltInParameter)` and
  `FamilyType.AsString` are all 2020-2027. The classification file is a plain
  file no API reads: only the per-user copy Revit itself reads, at
  `Application.CurrentUsersDataFolderPath`, "OmniClassTaxonomy.txt" to 2025,
  "Classification_Taxonomy.txt" from 2026, the one matching the parameter's
  name first. Revit refills that copy from its cache under ProgramData at
  start-up; the cache is not read here, because only HeronPaths may resolve
  a Windows special folder (tools/check-structure.py, docs/06 section 2). Its 2020 to 2025
  copy holds Windows-1252 bytes, so it is decoded strict UTF-8, then 1252,
  then Latin-1 (28591), which .NET 8 and 10 have without a code-page
  provider; titles are trimmed of every char.IsWhiteSpace character. Revit
  2026 and 2027 ship only a sample filed under no category, and with it
  nothing is judged. Its category column is compared as `new
  ElementId(BuiltInCategory)` with the family's category id after
  `Enum.IsDefined` - never an ElementId read as a number, and not
  `Category.BuiltInCategory`, which is 2023 and later; a category is named
  with `Category.GetCategory`, else `LabelUtils.GetLabelFor(BuiltInCategory)`.
  Whether a loaded family's TYPE exposes the OmniClass Number, and whether a
  family document holds an Assembly Code table, are Revit's - an empty read
  is NOT CHECKED, never blank (NEEDS-CHECKING).

# ROUTING - repeated in RENAME_FAMILY, FIND_UNUSED_FAMILIES and
# READ_ELEMENT_PARAMETERS.
#
#   "check the families are named to our standard" -> here - a READ
#   "audit the family library"           -> here
#   "why does nothing schedule properly" -> here - a missing parameter on the
#                                           TYPE is the usual cause
#   "rename this family"                 -> RENAME_FAMILY - a WRITE, and it must
#                                           not answer a question about whether
#                                           the names are right
#   "which families are not used"        -> FIND_UNUSED_FAMILIES - about USAGE,
#                                           not about whether they are built
#                                           correctly
#   "which families are nested inside this one"
#                                        -> GROUP_BY_ASSEMBLY, which walks UP to
#                                           the host and DOWN to every nested
#                                           part. That sentence resolved HERE
#                                           until 2026-09-05, and this fragment
#                                           audits whether a family is BUILT
#                                           right - a different question
#   "what parameters does it have"       -> REPORT_PARAMETER_INVENTORY - the
#                                           full list on one element, before you
#                                           know any of the names
#   "will this family connect when it is placed on a pipe"
#                                        -> here, in the Family Editor (v2)
#   "check this family before i load it" -> REPORT_GEOMETRY_COMPLEXITY owns
#                                           that exact sentence - how HEAVY a
#                                           family is; not declared here
#   "list the connectors in this family" -> REPORT_FAMILY_CONNECTORS - every
#                                           setting of each, no verdict
#   "what kind of family is this"        -> REPORT_FAMILY_TEMPLATE - its
#                                           settings, no verdict
#   "make this family work plane based", "set the part type"
#                                        -> SET_FAMILY_SETTINGS - the WRITE that
#                                           fixes what this reports
#   "which families have no omniclass number"
#                                        -> here (v3) - FIND_UNUSED_FAMILIES
#                                           answered it until 2026-10-11, and
#                                           that is about USAGE, not about
#                                           what a family is classified as
#   "check the omniclass numbers of the families" -> here (v3)
#   "check the assembly codes"           -> here (v3)
#   "what is the omniclass number of this family", "which omniclass codes
#   fit this family"                     -> REPORT_FAMILY_TEMPLATE - the value
#                                           and the file's codes, no verdict
#   "set the omniclass number of this family"
#                                        -> SET_FAMILY_SETTINGS - the WRITE
#   "set the assembly code", "set the keynote"
#                                        -> SET_FAMILY_TYPE_VALUES - per type,
#                                           as text

utterances:
  - check the families are named to our standard
  - audit the family library
  - why does nothing schedule properly
  - do these families have connectors
  - check the families against our convention
  - will this family connect when it is placed on a pipe
  - will this valve family connect to a pipe
  - why does this valve not follow the pipe size
  - check this mep family will connect and follow its size
  - check this fitting family before I load it
  - which families have no omniclass number
  - check the omniclass numbers of the families
  - check the assembly codes

id: FRG-QA-021
semantic-identity: "audit the family library against the office standard, or check the mep family open in the family editor joins its run and follows its pipe size"
kind: filter
domain: revit.qa
capability: CHECK_FAMILY_STANDARDS
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Audits the families a project is using - are they named to the convention, do
  they carry the parameters the job needs, and do the MEP ones have connectors
  at all. The library check before a family set goes onto a job, and the
  explanation for *"why does nothing schedule properly"*. Read-only.

  **BEFORE THIS, ASKING WHETHER THE FAMILIES FOLLOW THE STANDARD RESOLVED TO
  `RENAME_FAMILY`** - a write, to a question about the model. That is the worst
  shape of mis-route in this library and it is the same one `REPORT_VIEW_FILTERS`
  was built to close.

  **IT AUDITS TYPES, NOT INSTANCES, AND THAT IS THE POINT.** One badly built
  family type placed two hundred times is ONE thing to fix. An instance-based
  report shows it as two hundred findings and buries everything else. Every row
  is a type; the instance count beside it is what makes it urgent.

  **NO CONNECTOR IS THE HEADLINE FINDING FOR MEP.** A terminal, a valve or a
  piece of equipment with no connector cannot join a system, cannot carry flow,
  and never appears in a system browser - but it looks perfectly normal in a
  plan and clashes like anything else. It is the most common reason a model
  looks finished and behaves as though nothing is connected.

  **CONNECTORS ARE READ THROUGH A PLACED INSTANCE, BECAUSE A TYPE DOES NOT
  EXPOSE THEM.** So a type with no instance placed cannot be checked this way
  and is reported as NOT CHECKED rather than as passing. That distinction is the
  difference between an audit and a guess.

  **SYSTEM FAMILIES HAVE NO FAMILY FILE** - duct types, wall types, pipe types.
  They are counted and excluded, never silently skipped.

  **THE NAMING PATTERN AND THE REQUIRED PARAMETERS ARE INPUTS (D-33).** There is
  no universal family standard, and a default here would be one office's
  convention applied to another's model.

  **VERSION 2 (2026-10-04, FRAGMENT-ISSUES 5b-313): A FAMILY OPEN IN THE FAMILY
  EDITOR IS CHECKED ITSELF, BEFORE IT IS LOADED.** Three PPR valves built
  through Heron in Revit 2024 looked finished and were not: two check valves
  would not connect to a pipe (Work Plane-Based Yes; one also Part Type Normal),
  and the gate valve would not resize with its pipe (its connector's Nominal
  Diameter, and 35 formulas off it, were TYPE parameters). Nothing said so
  until each was loaded and tried. Now, in a family document, this answers
  PASS, FAIL or WARN for each check, with the fix in Revit words and the Heron
  tool that makes it where there is one, as ONE string - `familyReport` -
  because a list reaches the reply cut to three:

  - placement: an inline accessory or a fitting that is Work Plane-Based; an
    inline accessory whose Part Type is Normal with a run's connectors; a
    fitting whose Part Type is Normal;
  - connectors: none at all on an MEP family; one pointing toward the family's
    own centre (5b-309); a pass-through pair not opposite on one line; a size
    no family parameter drives; a size driven by a TYPE parameter, with how
    many formulas depend on it, or by one with a formula of its own; an inline
    accessory's System Classification not Global (a WARN - some offices fix it);
  - tidiness: a family parameter nothing uses (a FAIL; a SHARED one is a WARN,
    since shared ones carry schedule data); a solid form shown at Coarse or
    Medium inside a nested family that already draws that level (a WARN).

  The checks go by CATEGORY and PART TYPE, never by the family's name: pipe and
  duct accessories are inline, pipe, duct, cable tray and conduit fittings are
  the run's joints, and equipment, terminals, fixtures and devices sit at a
  run's end (no Work Plane-Based or Part Type check; a size driven by a type
  parameter is right for them). Every other category gets the name, required
  parameter and tidiness checks only. `namePattern` is matched against the
  family's own name and `requiredParameters` against its family parameters.

  In a family document the version 1 audit of NESTED family types is not run:
  a nested handwheel needs no connector, and reporting one would be false work.
  Version 1's proof no longer describes the code and is kept below as a record;
  the fragment is DRAFT until it is proved again (NEEDS-CHECKING Group CB).

contract:
  needs:
    - name: doc
      type: Document
    - name: namePattern
      type: string
      source: request
    - name: requiredParameters
      type: IList<string>
      source: request
    - name: mustHaveConnectors
      type: bool
      source: request
  provides:
    - name: findings
      type: IList<string>
    # In a family document: the whole verdict, every PASS, FAIL, WARN and NOT
    # CHECKED with its fix, joined - a list would arrive cut to three. Empty
    # in a project.
    - name: familyReport
      role: result
      type: string
    - name: warned
      # In a family document, the WARNs - things that may be meant. Zero in a
      # project.
      role: result
      type: int
    - name: offStandard
      # In a project, family types off standard; in a family document, FAILs.
      role: result
      type: int
    - name: notChecked
      # Types the audit could not reach. The evidence it looked and could not,
      # never a thing it did (D-52).
      role: accounting
      type: int
      

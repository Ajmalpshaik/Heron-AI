heron-agent: HERON-REVIT-FAM-012
heron-step: 17
heron-status: DRAFT
heron-since: 0.1.0
heron-layer: brain

id: FRG-VIEW-118
semantic-identity: "add flip arrows to the family being edited, so a placed copy flips left-right or front-back in one click"
kind: action
domain: revit.families
capability: ADD_FAMILY_FLIP_CONTROL
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Adds FLIP CONTROLS to the family open in the Family Editor - the small arrows
  a placed door, window, fan coil or valve shows when selected, which flip it
  left-right or front-back in one click instead of a mirror that moves it. The
  Family Editor's Control tool.

  **FOUR SHAPES, AS THE CONTROL TOOL NAMES THEM** - single horizontal, double
  horizontal, single vertical, double vertical - each placed in a plan or
  elevation of the family at a point in millimetres, in the view's own two
  model coordinates: X,Y in a plan. Several at once, `|` between.

  **WHICH WAY EACH FLIPS A PLACED COPY IS REVIT'S** - a horizontal arrow is
  expected to flip it left-right and a vertical one front-back - and is
  recorded in NEEDS-CHECKING BT3 rather than promised here.

  **READ BACK, ALL OR NOTHING**: every control's shape, view and position are
  read again; one that does not read as asked fails the call. Their ids come
  back.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The plan or elevation to place them in, as the Project Browser names it -
    # "Ref. Level".
    - name: view
      type: string
      source: request
    # Shape then where, `|` between - "single horizontal 0,-400 | single
    # vertical 400,0". Millimetres, in the view's two model coordinates.
    - name: controls
      type: string
      source: request
  provides:
    - name: controlIds
      # The new controls' unique ids, commas between.
      role: result
      type: string
    - name: placed
      # Every control's shape and position as read back, on ONE line.
      role: result
      type: string
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing was added, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  `FamilyItemFactory.NewControl(ControlShape, View, XYZ)`, the four
  `ControlShape` values and `Control.Shape`, `Origin` and `View` read the same
  2020 through 2027 (the RevitAPI reference assemblies, read 2026-10-01).

# ROUTING - see SET_FAMILY_CATEGORY for the whole family-building table.
#
#   "add flip arrows to this family"              -> here
#   "the door opens the wrong way"                -> FLIP_ELEMENTS - placed
#                                                    copies in a project

utterances:
  - add flip arrows to this family
  - add a flip control to the family
  - put flip controls on this door family
  - add the horizontal and vertical flip arrows

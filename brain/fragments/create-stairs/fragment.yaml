id: FRG-ELE-076
semantic-identity: "make a stair between these two levels in this stair hall"
kind: action
domain: revit.elements
capability: CREATE_STAIRS
# Version 3 (2026-10-13, FRAGMENT-ISSUES 5b-455): the answer names the railings
# Revit adds with the stair - `railings`, their ids from
# Stairs.GetAssociatedRailings read AFTER the edit scope's Commit (Revit adds
# them at the Commit, none before), and one finding with their count and type,
# e.g. "Revit added 2 railings of type '1100mm' with the stair". Same inputs,
# same refusals; a refused stair, or one taken away again because its opening
# failed, names none. Run ROLLED BACK on Revit 2020 only (2026-10-13,
# Project1: a U and a straight stair each named 2 railings of type '1100mm',
# a refused one none - 5b-455); the kept run is Group BX, BX8.
# Version 2 (2026-10-13, FRAGMENT-ISSUES 5b-445): a run's top is set only when
# its path did not already give it. Version 1 always set it, and Revit 2020
# refused that on every stair whose base level is not at 0 - see the
# compatibility-note. Same inputs, same results; a stair from Level 2 now runs.
version: 3
source: OFFICIAL
risk: MODIFY

purpose: >
  Makes a real Revit stair - a Stairs element with its runs and landing -
  from a base level to a top level, laid out inside a rectangle on plan: one
  straight run, or a U (dogleg) with a landing across the far end. Optionally
  cuts the opening in the top level's floor over it.

  **NOTHING IN THE LIBRARY COULD MAKE A STAIR BEFORE THIS, AND NO FRAGMENT
  COULD.** Revit makes a stair only inside a StairsEditScope, which refuses to
  start while a transaction is open - and every write fragment runs inside
  one. Measured 2026-10-03 on Project2, Revit 2024. This fragment declares the
  ambient `editScopeFailures` need, and D-112 has the add-in run it inside the
  job's TransactionGroup with no transaction open: still one undo, still
  rolled back on a preview.

  **THE RISER HEIGHT AND TREAD ARE THE STAIR TYPE'S.** The riser count is the
  fewest that keeps every riser at or under the type's Maximum Riser Height;
  the tread is its Minimum Tread Depth. A type name that is not loaded is
  refused, with the loaded names listed - never guessed.

  **THE RECTANGLE IS THE CLEAR INSIDE OF THE HALL**, wall faces and not
  centrelines. `entrySide` is the side the first riser faces - the stair climbs
  away from it - and `startOffset` is the clear floor between that side and the
  first riser: where a door opens, and on a U where the top run arrives.

  **ALL OR NOTHING, READ BACK.** The run count, the landing, the total risers
  and the stair's plan extent inside the rectangle are read inside the edit
  scope, and any miss cancels it. With `cutOpening` the top level's slab is cut
  over the stair and its VOLUME read before and after; an opening that removed
  nothing takes the stair away again.

  **THE OPENING IS THE SLAB'S OWN, NOT A SHAFT.** Measured 2026-10-03, rolled
  back: a shaft from Level 1 to Level 2 over the hall removed nothing from
  either slab, while a floor opening in the Level 2 slab removed 8 m3.

  Revit gives the stair the model's default stair railing on both sides as it
  is made (5b-455); this adds none of its own, and reads them back.

# THE RAILINGS, MEASURED - kept here, out of the purpose, because the purpose's
# words move routing and a comment's do not. Until 2026-10-13 the purpose said
# "It makes no railing. Revit's own Stair tool adds one; the API does not, and
# nothing in the library makes one yet". Both halves were wrong (FRAGMENT-ISSUES
# 5b-455):
#
#   - Measured 2026-10-13 on Project1, Revit 2020.2, session 18392, by a
#     scratch probe outside the repository running this code verbatim, rolled
#     back each time: six stairs made, every one with its railings.
#     A U stair (Cast-In-Place Stair, Level 1 to Level 2, 23 risers) came with
#     TWO railings - one 6080 mm between the runs, one 10480 mm round the
#     outside - and a straight stair with two, 6160 mm, one each side. All of
#     the document's default stair railing type (ElementTypeGroup.
#     StairsRailingType, '1100mm' there), hosted by the stair, IsDefault true,
#     returned by Stairs.GetAssociatedRailings and counted by
#     SELECT_BY_CATEGORY_NAME's route (categoryName=Railings). Inside the edit
#     scope, before its Commit, there were none: Revit adds them at the Commit.
#     Cutting the opening changed nothing. Switching the document's default to
#     another railing type switched the railings' type; setting it to none was
#     refused by the API ("The element type id typeId is invalid").
#   - CREATE_RAILING (FRG-ELE-090) places railings on a stair or along a path.
#     Count what came with the stair first: what it does to a stair that
#     already has its railings is not measured.
#   - NOT measured on 2021 to 2027 - Group BX, BX7.
#   - VERSION 3 NAMES THEM. "and reads them back" in the purpose means the
#     `railings` result and its one finding, read after the Commit - see the
#     version note. Version 2's answer said nothing of them. The answer has
#     run only rolled back, on Revit 2020 (5b-455); the kept run is Group BX,
#     BX8. A host about to run CREATE_RAILING
#     reads the count here first.
#   - THOSE FOUR WORDS WERE MEASURED, main against this branch, 2026-10-13, as
#     5b-455's status records: 80 sentences on both backends, no winner moved.
#     Two other wordings were dropped - "the count and type are read back"
#     moved CREATE_STAIRS up the lexical shortlist for "count the ducts on
#     level 2", and "every one is read back" put it second for "is there one
#     stair on each level". Explanations go here, never in the purpose.

contract:
  needs:
    - name: doc
      type: Document
    - name: editScopeFailures
      type: IFailuresPreprocessor
      source: ambient
    - name: baseLevel
      type: Level
      source: request
    - name: topLevel
      type: Level
      source: request
    - name: stairType
      # A NAME, NOT A BOUND TYPE: the binder has no stair-type row, and adding
      # one is an add-in change. The fragment looks it up and lists the loaded
      # names when it is not there.
      type: string
      source: request
    - name: shape
      type: string
      source: request
    - name: runWidth
      type: double
      source: request
    - name: area
      type: IList<XYZ>
      source: request
    - name: entrySide
      type: string
      source: request
    - name: firstRunSide
      type: string
      source: request
    - name: startOffset
      type: double
      source: request
    - name: cutOpening
      type: bool
      source: request
      optional: true
  provides:
    - name: created
      role: result
      type: ElementId
    - name: risers
      role: result
      type: int
    - name: riserHeightMm
      role: result
      type: double
    - name: runCount
      role: result
      type: int
    - name: landingCount
      role: result
      type: int
    - name: openings
      role: result
      type: IList<ElementId>
    - name: railings
      # Version 3 (5b-455): the railings Revit added with the stair, from
      # Stairs.GetAssociatedRailings after the edit scope's Commit. Empty when
      # the stair was refused or taken away again.
      role: result
      type: IList<ElementId>
    - name: findings
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  Read off the reference assemblies for 2020 to 2027 on 2026-10-03:
  `StairsEditScope.Start(ElementId, ElementId)`, `Commit(IFailuresPreprocessor)`,
  `Cancel` and `IsPermitted`; `StairsRun.CreateStraightRun`, `TopElevation`,
  `ActualRunWidth` and `ActualRisersNumber`; `StairsLanding.CanCreateAutomaticLanding`
  and `CreateAutomaticLanding`; `Stairs.DesiredRisersNumber`, `ActualRisersNumber`,
  `ActualRiserHeight`, `ActualTreadDepth`, `GetStairsRuns` and `GetStairsLandings`;
  `StairsType.MaxRiserHeight`, `MinTreadDepth` and `MinRunWidth` - all present
  and unchanged across the range. `Document.Create.NewOpening(Element, CurveArray,
  bool)` is CREATE_OPENING's call, present throughout.

  TWO ELEVATION FRAMES, read in RevitAPI.xml for 2020 to 2027 and MEASURED on
  Revit 2020.2 only (Project2, 2026-10-13, rolled back, 5b-445). A straight
  run's path Z is in MODEL coordinates - "must be greater than or equal to the
  stairs base elevation"; a path at Z 0 on a stair based at 4000 mm was refused.
  A run's TopElevation and BaseElevation are RELATIVE to the stair's base, and
  that is how they read - but on 2020 the TopElevation SETTER refused every
  value below the base level's own elevation, the run's own reading included,
  and took 5200 as a relative 5143. So it is called only when the run's path
  did not already give the top. Whether 2021 to 2027 share that setter's
  behaviour is NOT measured; this code does not depend on it.

# ROUTING - repeated in CREATE_OPENING.
#
#   "make the stair"                 -> here
#   "cut the hole for the stair"     -> here with cutOpening=true, when the stair
#                                       is being made; CREATE_OPENING for a hole
#                                       in a slab that already has its stair
#   "cut an opening in this slab"    -> CREATE_OPENING
#   "make a floor slab"              -> CREATE_FLOOR


# ROUTING (2026-10-12, the gap fill)
#
#   "put railings on these stairs"          -> CREATE_RAILING
utterances:
  - make the stair also
  - make the stair
  - add a stair from level 1 to level 2
  - create a U-shaped stair in the stair hall
  - put a dogleg staircase in the stair core
  - model the staircase between the two floors

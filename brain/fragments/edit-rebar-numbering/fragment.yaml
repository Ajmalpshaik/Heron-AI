tests: tests/

compatibility-note: >
  One implementation for every release. NumberingSchema.GetNumberingSchema
  (Document, NumberingSchemaType), GetNumberingSequences, GetNumbers(string),
  NumberingParameterId, ShiftNumbers(string, int), RemoveGaps(string),
  ChangeNumber(string, int, int), MoveSequence(string, string),
  AppendSequence(string, string), MergeSequences(IList<string>, string),
  AssignElementsToSequence(ISet<ElementId>, string), IsValidPartitionName(string,
  out string) and MaximumStartingNumber, BuiltInParameter.NUMBER_PARTITION_PARAM
  and WorksharingUtils.GetCheckoutStatus(Document, ElementId, out string) carry
  the same signatures 2020 through 2027 - read with tools/api-surface --members
  on 2026-11-01. Revit 2027 marks the schema-type route, MoveSequence,
  AppendSequence, MergeSequences and AssignElementsToSequence obsolete (rebar,
  couplers and fabric only) and still ships them; 2027 adds
  ChangePartitioningValue, unused here so one implementation serves all eight.
  An ElementId is compared with ==, never read as a number.

# ROUTING (2026-11-01) - the same rows are in REPORT_REBAR_NUMBERING.
#
#   "renumber the rebar in partition P1"            -> here, action renumber
#   "start rebar numbering at 100 in this partition" -> here, action start,
#                                                      startAt 100 - which
#                                                      partition "this" is is
#                                                      read by
#                                                      REPORT_REBAR_NUMBERING
#   "compact the rebar numbers"                     -> here, action compact
#   "move these bars to partition Level 3 slab"     -> here, action move
#   "what rebar numbers are in partition B2"        -> REPORT_REBAR_NUMBERING -
#                                                      a question, and this
#                                                      only writes
#   "renumber the doors"                            -> RENUMBER_SEQUENTIAL - a
#                                                      running sequence in a
#                                                      parameter, not Revit's
#                                                      rebar numbering
utterances:
  - renumber the rebar in partition P1
  - move these bars to partition Level 3 slab
  - start rebar numbering at 100 in this partition
  - compact the rebar numbers

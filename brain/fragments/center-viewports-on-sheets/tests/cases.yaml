# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: >
      three sheets, each with one A1 title block and one floor plan viewport
      that sits to one side of it - M-101 to M-103 in "heron ai bulding"
    expect: >
      `centred` 3, and in `findings` each sheet's viewport centre reading back
      at its title block's centre, with the before and after in millimetres.
      Look at the sheets in Revit - the box sits in the middle of the paper,
      which is the whole test

  - given: the same three sheets, run a second time
    expect: >
      `centred` 0 and all three in `alreadyCentred`, nothing moved. This is
      the read-back, and it proves a centred viewport is not nudged again

  - given: >
      one of those views annotated after it was centred - on 2026-09-27, 15
      room tags and then 90 air terminal tags added to M-104's view shifted
      its viewport 30 mm and then 43 mm left on the sheet, with the box the
      same size
    expect: >
      that sheet alone moved back to the title block centre and the others in
      `alreadyCentred`. Annotating a placed view can move it on its sheet, so
      this runs last

negative:
  - given: >
      a sheet carrying TWO viewports, one of them off-centre, handed in with
      the sheets above
    expect: >
      its id in `ambiguous` and neither viewport moved. Which one is "the
      plan" is not answerable here, and moving the wrong one is worse than
      moving none

  - given: a sheet with no title block
    expect: >
      its id in `noTitleBlock` and its viewport not moved. There is no paper
      to centre on

  - given: a sheet with two title blocks
    expect: >
      its id in `severalTitleBlocks` and its viewport not moved

  - given: a view or a wall handed in instead of a sheet
    expect: >
      its id in `refused`, named as not a sheet, and nothing moved

  - given: >
      the four sheets run with NO transaction open - `heron_bridge_client.py
      validate` without `--write` - so Revit refuses every move
    expect: >
      every off-centre sheet in `refused`, each line still saying where the
      viewport was, the title block centre and the box size, and nothing
      moved. That makes it the one measurement that cannot change the model:
      on 2026-09-27 it found all four at (312, 303) mm after another tool had
      moved them

  - given: a viewport Revit refuses to move
    expect: >
      the sheet in `refused`, established by reading the centre back. A sheet
      counted as centred that is not is a report nobody can trust

  - given: >
      a viewport Revit moves but does not read back at the title block centre
    expect: >
      the viewport PUT BACK where it was, read back there, and the sheet in
      `refused` saying so - never left moved under a refusal, which is what
      ALIGN_VIEWPORTS_ACROSS_SHEETS does (row 5b-237). If it cannot be put
      back either, the run throws, the whole group rolls back, and nothing on
      any sheet is kept

  # VERSION 2 (2026-11-01, ALIGN_VIEWPORTS_ACROSS_SHEETS merged in). Each FAILS
  # on version 1, which has no master and centres every sheet on its own title
  # block.
  - given: >
      VERSION 2. Eight sheets of the same plan at 1:100 on one title block
      family, masterSheetNumber one of them
    expect: >
      aligned 7, the master "left as it is", and the plan in the same place on
      all eight - page through them in Revit, the building must not shift

  - given: VERSION 2. A master sheet NOT among the sheets handed in
    expect: the set still lined up to it - aligning to a sheet already right is the normal case

  - given: VERSION 2. A sheet whose view is at 1:50 while the master is 1:100
    expect: its id in scaleMismatch and NOT moved

  - given: >
      VERSION 2. A sheet whose title block sits at another origin than the
      master's (move it 100 mm on that sheet first)
    expect: >
      its id in titleBlockElsewhere, its viewport NOT moved and its title
      block STILL where it was put. ALIGN_VIEWPORTS_ACROSS_SHEETS moved the
      title block onto the master's origin - a second change nobody asked for

  - given: VERSION 2. masterSheetNumber matching no sheet
    expect: every sheet in refused, each line naming the missing master, nothing moved

  - given: VERSION 2. A master carrying two viewports
    expect: every sheet in refused - which of the master's is the plan is not answerable

  - given: VERSION 2. The same alignment run twice
    expect: aligned 0 the second time and every sheet in alreadyCentred - nothing nudged again

second_route:
  - >
    open each sheet in Revit, select the viewport and read where its box sits
    against the title block border - or print it. The box's left and right
    margins, and its top and bottom ones, come out equal to the millimetre.
    Paper is the second route, and a lopsided box from an elevation marker
    shows there first

# VERSION 2 (2026-11-01) - ALIGN_VIEWPORTS_ACROSS_SHEETS WAS MERGED INTO THIS
# CARD on the owner's instruction ("make sure there is no duplicate tools"),
# and is DEPRECATED. The same job - move the one viewport on each sheet to a
# target, read it back - with the other target: a MASTER sheet's viewport
# centre, so the plan sits in the same place on every sheet. What it had and
# this card lacked is here now: `masterSheetNumber`, found in the whole model;
# the master needing exactly one viewport; a sheet at another scale skipped in
# `scaleMismatch`; a sheet whose title block sits at another origin skipped,
# the centre being measured in sheet space; `aligned`; and its master
# included in the set left as it is.
#
# THE SAFER RULE IN EACH CONFLICT IS KEPT (the owner: "in every conflict keep
# the safer rule"). That card MOVED a sheet's title block onto the master's
# origin and then aligned it - a second change nobody asked for, with its
# purpose saying the sheet was skipped; here such a sheet is skipped and named
# in `titleBlockElsewhere`, and no title block is ever moved. That card left a
# move whose read-back missed in place and called it refused (row 5b-237);
# here it is put back. That card moved a sheet with no title block, or two;
# here neither is touched, and the master must carry exactly one title block.
# The read-back tolerance is this card's half millimetre on the paper, not
# Revit's IsAlmostEqualTo.
#
# WHERE ITS OUTPUTS ARE NOW: aligned -> aligned, scaleMismatch ->
# scaleMismatch, titleBlockMoved -> titleBlockElsewhere (skipped, never
# moved), ambiguous -> ambiguous, refused -> refused, every sheet with its
# line in findings. Its sentences moved here.


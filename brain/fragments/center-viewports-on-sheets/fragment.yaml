compatibility-note: >
  One implementation for every release. `Viewport.GetBoxCenter`,
  `Viewport.SetBoxCenter`, `Viewport.GetBoxOutline`, `ViewSheet.GetAllViewports`
  and `Element.get_BoundingBox(View)` are present and unchanged 2020 through
  2027 - read out of the reference assemblies for each release with
  `tools/api-surface --members Viewport --inherited` and `ViewSheet`, not
  assumed from `ALIGN_VIEWPORTS_ACROSS_SHEETS`, which uses the first two.
  Positions are Revit's internal feet on the sheet, turned into millimetres
  only for the report by `* 304.8` (D-20), so no units API is called and the
  2021 units move cannot reach this.

  Version 2 adds `View.Scale` and a title block's `LocationPoint`, unchanged
  2020 through 2027 - the members ALIGN_VIEWPORTS_ACROSS_SHEETS read, PROVEN
  on Revit 2024.


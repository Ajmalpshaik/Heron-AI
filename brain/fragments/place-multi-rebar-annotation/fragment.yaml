#                                                     and no tag
#   "add a linear dimension"                       -> CREATE_LINEAR_DIMENSION
#   "what rebar is in these columns"               -> REPORT_HOST_REBAR - a read
#
# WHAT MOVED. No declared utterance changed the card it reaches, and no TAG_
# ELEMENTS_IN_VIEW sentence moved. ONE ROUTING-TABLE SENTENCE DID, between two
# cards neither of which its table names: "put it back", claimed by SHOW_
# ELEMENTS and not reached before this card either, went from PLACE_FAMILY_
# INSTANCES to RESET_GRAPHIC_OVERRIDES - a write either way. Not declared on
# SHOW_ELEMENTS here: RESET_GRAPHIC_OVERRIDES claims "put it back how it was",
# and which card the bare sentence means is the owner's choice - recorded as
# FRAGMENT-ISSUES row 5b-1375, OPEN.
#
# ON THE KEYWORD ROUTE ALONE (tools/check-routing.py, not the lookup) "add a
# linear dimension" now ranks this card first, where CREATE_DIMENSION did -
# neither its claimant; the lookup answers it by identity, on CREATE_LINEAR_
# DIMENSION, before and after. "Linear" is Revit's own name for the button and

#
# AND SENTENCES NOBODY DECLARES, measured the same day: "tag the rebar", "tag
# the rebar in this view", "put a tag on this rebar set", "annotate the rebar"
# and "dimension the rebar" reached CREATE_REBAR_BAR_TYPE, SET_REBAR_VIEW_STATE,
# PLACE_BEAM_REBAR, LIST_REBAR_TYPES and CREATE_REBAR_COVER_TYPE before this
# card, and reach it after. Here, with no multi-rebar annotation type named,
# nothing is placed and the types are listed. Recorded for the owner in row
# 5b-1375; no words were declared on another card to win them back.
utterances:
  - add a multi-rebar annotation to these bars
  - put a multi-rebar tag with a dimension line on this rebar set
  - annotate these bars with one tag and a dimension

compatibility-note: >
  ONE implementation, and the rule factory is reached BY REFLECTION for a reason
  found in the assemblies rather than guessed. `CreateEqualsRule` for a TEXT
  value is `(ElementId, string, bool)` on Revit 2020 and `(ElementId, string)`
  by 2027 - the case-sensitivity argument was dropped. **Each spelling compiles
  on exactly one end and breaks the other**, so the overload is chosen at run
  time by its argument count. `ParameterFilterElement.Create`,
  `SetElementFilter` and `ElementParameterFilter` are themselves unchanged 2020
  through 2027.

# ROUTING - repeated in COLOR_BY_PARAMETER, CREATE_VIEW_FILTER and
# APPLY_VIEW_FILTER.
#
#   "make a filter for every different system type" -> here
#   "one filter for each fire zone"      -> here
#   "set up the colour standard for this project" -> here - it PERSISTS and
#                                           catches work modelled later
#   "colour code by system"              -> COLOR_BY_PARAMETER - per-element
#                                           overrides, right for looking at
#                                           something NOW. An element drawn
#                                           tomorrow gets nothing
#   "make a filter for supply air"       -> CREATE_VIEW_FILTER - ONE rule, one
#                                           filter, when the value is known
#   "put that filter on this view"       -> APPLY_VIEW_FILTER

utterances:
  - make a filter for every different system type
  - one filter for each fire zone
  - set up the colour standard for this project
  - a filter per value of this parameter
  - make filters for each different value

heron-step: 17
heron-status: DRAFT
heron-since: 0.1.0
heron-layer: brain

id: FRG-ELE-111
semantic-identity: "report the reinforcement in these concrete elements, host by host"
kind: action
domain: revit.elements
capability: REPORT_HOST_REBAR
version: 1
source: OFFICIAL
risk: READ

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# THE READ-BACK OF EVERY REBAR WRITE. A placing tool answering "placed 6" is
# not the proof; the bars in the host are (D-30). This reads, for each element
# handed in - a column, a beam, a footing, a slab, a wall:
#   - whether Revit takes it as a rebar host at all (RebarHostData.IsValidHost);
#   - its cover on every face it has one for, by Revit's own label for that
#     face ("Rebar Cover - Top Face") and the cover type's name and distance;
#   - every rebar set in it: bar type and nominal diameter, standard or
#     stirrup/tie, shape, layout rule, bar count, spacing where the layout has
#     one, the hook at each end, and total bar length;
#   - every area reinforcement: each layer that is on, by Revit's own label,
#     its bar type, spacing and number of lines;
#   - every path reinforcement: bar type, spacing, number of bars, length;
#   - fabric areas and fabric sheets, with their sheet type.
# And a bar list across all of them - bars and total length per bar type.
#
# NO WEIGHT. A mass per length is a property of the bar type only from Revit
# 2027; before it the API has none, and a density typed in here would be a
# design value Heron chose (D-33). Revit's own rebar schedule gives weight
# from the model's own material.
#
# READ ONLY. Opens no transaction and needs none.
purpose: >
  Answers what reinforcement is in each concrete element handed in - how many
  bars, what bar size, what spacing and hooks, what rebar cover on each face,
  and any area, path or fabric reinforcement - with a bar list by bar type,
  so a placed bar can be read back.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
  provides:
    - name: rebarSets
      # Rebar elements found in the hosts. Something the read FOUND.
      role: result
      type: int
    - name: bars
      # Bars in those sets - the sum of each set's quantity.
      role: result
      type: int
    - name: systems
      # Area, path and fabric reinforcement elements found in the hosts.
      role: result
      type: int
    - name: hostsWithRebar
      role: result
      type: int
    - name: report
      # HOST BY HOST, in words: cover, every set and every system. A STRING,
      # because a reply cuts a list to three items and this is the answer.
      role: accounting
      type: string
    - name: barList
      # Bars and total length per bar type, across every host read.
      role: accounting
      type: string
    - name: notHosts
      # Elements Revit does not take as a rebar host, each with its category.
      # What was handed in and could not be read, never a finding (D-52).
      role: accounting
      type: IList<string>
    - name: withoutRebar
      # Valid hosts that hold no reinforcement at all.
      role: accounting
      type: int
    - name: findings
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation, one #if for the bar diameter (BarDiameter 2020-2021,
  BarNominalDiameter from 2022). Read off the shipped assemblies 2020 to 2027
  on 2026-10-19: RebarHostData.IsValidHost, GetRebarHostData, GetRebarsInHost,
  GetAreaReinforcementsInHost, GetPathReinforcementsInHost,
  GetFabricAreasInHost, GetFabricSheetsInHost; Rebar.Quantity, LayoutRule,
  NumberOfBarPositions, TotalLength, GetHookTypeId, GetShapeId; the
  BuiltInParameters CLEAR_COVER_TOP / BOTTOM / OTHER / EXTERIOR / INTERIOR,
  REBAR_ELEM_BAR_SPACING, REBAR_SYSTEM_* and PATH_REIN_* used here - all on
  every release.

# ROUTING - the same rows are in every rebar card.
#
#   "what rebar is in these columns"            -> here
#   "read back the bars in this beam"           -> here
#   "what cover does this slab have"            -> here
#   "what bar types are loaded"                 -> LIST_REBAR_TYPES
#   "set the cover on these beams to 40"        -> SET_REBAR_COVER
utterances:
  - what rebar is in these columns
  - what rebar cover do these beams have
  - how many bars does this column have
  - what bar size is in this slab
  - what spacing are the links in this beam
  - read back the bars in these footings
  - report the reinforcement in this beam
  - what cover does this slab have
  - give me a bar list for these elements
  - is this column reinforced
  - what rebar cover is on these walls
  - how much rebar is in these footings

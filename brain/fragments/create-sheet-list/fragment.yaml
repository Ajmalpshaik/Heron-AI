compatibility-note: >
  One implementation for every release. `ViewSchedule.CreateSheetList`,
  `ViewSchedule.CreateViewList`, `ScheduleDefinition.GetSchedulableFields` and
  `ScheduleSortGroupField` are present 2020 through 2027 - read off the
  reference assemblies at both ends, and `CreateViewList(Document)` checked in
  all eight releases' RevitAPI.xml on 2026-09-27 with the same one-argument
  signature as `CreateSheetList`. A
  schedulable field is matched by the NAME Revit gives it rather than by any
  parameter id, which is what keeps one implementation working across the
  release where parameter identity changed.

# ROUTING - repeated in CREATE_SCHEDULE, CREATE_KEY_SCHEDULE, FIND_SHEETS and
# CREATE_SHEETS.
#
#   "make a sheet list schedule"      -> here
#   "I need a drawing index"          -> here
#   "put a list of all the sheets on the cover" -> here
#   "create a view list"              -> here, listKind=views. Until version 2
#                                        this sentence landed here and could
#                                        only make a SHEET list
#   "schedule of the views on sheets" -> here, listKind=views, then
#                                        SET_SCHEDULE_FILTERS Sheet Number
#                                        has value. A view list shows every
#                                        view until it is filtered
#   "which views are not on a sheet"  -> FIND_UNPLACED_VIEWS - a READ, no
#                                        schedule made
#   "make a duct schedule"            -> CREATE_SCHEDULE - a CATEGORY of model
#                                        elements; sheets are not model elements
#                                        and the category route cannot make this
#   "make a room finish schedule I can type into" -> CREATE_KEY_SCHEDULE
#   "what sheets are in this model"   -> FIND_SHEETS - a READ, no view made
#   "make me a new sheet"             -> CREATE_SHEETS
#   "put the schedule on the sheet"   -> PLACE_SCHEDULE_ON_SHEET. NOT HERE.
#                                        That sentence resolved to this
#                                        fragment until 2026-09-04, and this
#                                        one makes a NEW schedule listing every
#                                        sheet in the project - a
#                                        plausible-looking result with nothing
#                                        to do with what was asked


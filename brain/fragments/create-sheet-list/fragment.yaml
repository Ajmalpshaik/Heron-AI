purpose: >
  Creates a Sheet List - the drawing index that goes on the cover sheet, listing
  every sheet in the project with its number and name.

  **IT IS A DIFFERENT API CALL FROM CREATE_SCHEDULE, NOT AN OPTION ON IT.** An
  ordinary schedule schedules a CATEGORY of model elements - doors, ducts,
  rooms. A sheet list schedules SHEETS, which are not model elements, so the
  category route cannot produce one at all. Asking for a drawing index and being
  given the schedule maker is the mis-route this fragment closes.

  **THE FIELDS ARE SHEET PARAMETERS, NOT MODEL ONES.** Sheet Number, Sheet Name,
  Current Revision, Sheet Issue Date. Ask for Size or Level and there is nothing
  to give. A field the sheet list cannot carry is REPORTED with the schedulable
  names listed, never quietly dropped - a silently short index looks finished
  and is missing a column, and the person reading the printed sheet has no way
  to know a column was ever asked for.

  **A SHEET THAT DOES NOT EXIST YET CAN STILL BE ON THE INDEX.** Revit calls it
  a placeholder sheet - a number and a name with no titleblock and no views -
  and it appears on a sheet list like any other. That is how a drawing register
  is set up before the drawings are. CREATE_SHEETS makes them; this lists them.

  **A VIEW LIST IS THE SAME JOB, ONE CALL OVER.** `listKind` = `views` makes
  Revit's View List through `ViewSchedule.CreateViewList` - a schedule of the
  project's views - with the same fields-by-name, the same refusal listing the
  real names, and the same sort. Its fields are VIEW parameters - View Name,
  Sheet Number, Sheet Name, Title on Sheet, Detail Number are the names expected,
  not yet read off a model; the refusal lists the real ones. Blank or `sheets` is
  the sheet list this fragment has always made. Anything else is refused and
  NOTHING is created - guessing would make the wrong index and report it made.

  **"ONLY THE VIEWS PLACED ON A SHEET" IS A FILTER, NOT A SECOND LIST.** A view
  list shows every view. Add Sheet Number as a column, then SET_SCHEDULE_FILTERS
  with `matchType` = `has value` on Sheet Number keeps only the placed ones - a
  view on no sheet has that column blank. The column has to be in the list for
  the filter to find it.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: scheduleName
      type: string
      source: request
    - name: fieldNames
      type: IList<string>
      source: request
    - name: sortByField
      type: string
      source: request
      optional: true
    # BLANK MEANS A SHEET LIST, SO A CALLER THAT SENDS "" GETS TODAY'S JOB.
    # "views" makes a view list. NOT marked `optional: true`, because nothing
    # reads that key: the add-in refuses any `source: request` need that
    # arrives with no value, marked or not (FRAGMENT-ISSUES 5b-227). Send it,
    # blank or not.
    - name: listKind
      type: string
      source: request
  provides:
    - name: sheetList
      role: result
      type: Element
    - name: fieldsAdded
      role: result
      type: IList<string>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<string>


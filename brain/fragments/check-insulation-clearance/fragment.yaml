id: FRG-QA-025
semantic-identity: "the gap measured to the outside of the lagging, which is the gap that has to be built"
kind: action
domain: revit.qa
capability: CHECK_INSULATION_CLEARANCE
version: 1
source: OFFICIAL
risk: READ

purpose: >
  The same clearance sweep as `CHECK_MINIMUM_CLEARANCE`, with the one correction
  that changes the answer on a real MEP job: the distance is measured to the
  OUTSIDE OF THE INSULATION, not to the bare duct or pipe. A 50 mm jacket on
  each of two services eats 100 mm of the gap, so a pair reading 120 mm clear on
  the bare geometry has 20 mm in fact and cannot be built. It changes nothing.

  **THE BARE-GEOMETRY CHECK IS OPTIMISTIC AND THIS ONE IS NOT.** Revit models
  insulation as SEPARATE elements wrapped round the host, so a duct's own solid
  and its own bounding box stop at the sheet metal. Every distance measured off
  the host is therefore too generous by the jacket thickness at each end. This
  reads each element's real insulation and takes it off the measured gap.

  **INSULATION IS FOUND THROUGH THE HOST, AND THE LOOKUP THROWS BY DESIGN - THE
  CATCH IS THE CATEGORY FILTER.** `GetInsulationIds` raises for any element that
  cannot carry a wrap. Pre-filtering by category instead would miss whatever the
  API accepts and nobody predicted, so the throw is caught and read as *"this
  one carries none"*. That behaviour is already proven elsewhere in this
  library and is reused rather than rediscovered.

  **LINING IS DELIBERATELY NOT COUNTED.** Duct lining sits INSIDE the duct - it
  takes air away, not space outside. Adding it to an external clearance figure
  would inflate every gap and produce failures that are not there.

  **THE THICKEST WRAP GOVERNS, NOT THE SUM OF THEM.** A host may legitimately
  carry more than one insulation element. The clearance is decided by the
  fattest one; adding them together would invent a jacket nobody specified.

  **AN ELEMENT WITH NO INSULATION MODELLED IS THE SILENT PROBLEM, SO IT IS
  COUNTED AND SAID FIRST.** If the specification calls for insulated chilled
  water and the model carries no insulation elements, this check reads EXACTLY
  like the bare one and passes things that will not fit. The insulated /
  not-insulated split is printed before any result, so the assumption is visible
  rather than buried. `assumeThicknessMm` is how a run is checked against what
  it is *going* to be lagged with, and every row it touches says it was assumed.

  **DISTANCE IS BOUNDING-BOX BASED, DELIBERATELY.** Once both jackets are
  subtracted the answer is an engineering figure rather than a precise one, and
  the box keeps a whole-floor sweep affordable. For a defensible millimetre on
  one specific pair of linear runs, the centreline calculation is exact and this
  is not.

  **`ElementId` IS NEVER CONVERTED TO A NUMBER HERE, AND THE EARLIER LIBRARY DID
  CONVERT IT.** Its version reflected `ElementId.Value` or `IntegerValue` to key
  a set of connected elements. `ElementId` compares and hashes perfectly well as
  itself, so the set is a set of `ElementId`, and the whole 2024 widening to
  64-bit stops being something this fragment has to know about.


compatibility-note: >
  One implementation for every release. `InsulationLiningBase.GetInsulationIds`,
  `BuiltInParameter.RBS_INSULATION_THICKNESS`, `Element.get_BoundingBox`,
  `MEPCurve.ConnectorManager`, `FamilyInstance.MEPModel`, `Connector.AllRefs`
  and `Connector.Owner` are present and unchanged 2020 through 2027.

  **`Thickness` is read off the wrap by REFLECTION and never named as a typed
  member.** It is declared on the derived wrap classes rather than on the base
  the API hands back, and the built-in parameter is the fallback where the
  property is not there. Neither is assumed to exist.

  Millimetres become internal feet by dividing by 304.8, as plain arithmetic. No
  units API is called - that is what breaks at Revit 2021, and every figure here
  is handed on in feet.

  `ElementId` is only ever compared or hashed as itself, never read as a number.

# ROUTING - these rows are in the fragments named here. FIVE fragments answer
# "is there enough room" and they measure DIFFERENT THINGS. The wrong one is not
# slower, it is a different number.
#
#   "clearance with the lagging on"      -> here. The gap to the OUTSIDE of the
#                                           jacket, over any set, approximate
#   "these read clear but both pipes are insulated" -> here. The whole fragment
#   "how close are these two"            -> CHECK_MINIMUM_CLEARANCE - any
#                                           element against a target set,
#                                           samples the real faces, BARE
#                                           geometry. More exact per pair, and
#                                           optimistic on anything lagged
#   "how much room above that duct"      -> CHECK_VERTICAL_CLEARANCE - Z
#                                           separation only
#   "can this pump be serviced"          -> CHECK_EQUIPMENT_CLEARANCE - the
#                                           MAINTENANCE zone. Can it be
#                                           maintained, not can it be built
#   "do these overlap"                   -> FIND_CLASHES. A clash is yes/no with
#                                           no distance in it, and is NOT a
#                                           clearance failure
#   "which runs still need insulating"   -> not a clearance question. This
#                                           fragment REPORTS the bare count as a
#                                           side effect and is not the way to ask
#   "draw the dimension"                 -> DIMENSION_MEP_RUNS
#   "insulate these"                     -> SET_MEP_INSULATION, which PUTS THE
#                                           LAGGING ON. This fragment only
#                                           measures, and ranked first on that
#                                           sentence on 2026-09-06 because its
#                                           utterances are full of the word.
#                                           SET_MEP_INSULATION already claims it
#                                           in its own table and should win

utterances:
  - check the clearance with the insulation on
  - is there enough room once these are lagged
  - clearance to the outside of the insulation
  - these read clear but both pipes are insulated
  - will these fit with 50mm lagging
  - insulation aware clearance check
  - the gap is not big enough once it is insulated

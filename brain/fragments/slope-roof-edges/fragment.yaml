compatibility-note: >
  ONE PATH FOR EVERY RELEASE, read rather than remembered. On 2026-09-24
  tools/api-surface read the reference assemblies of all eight releases, 2020
  through 2027, and found FootPrintRoof's `GetProfiles()` returning a
  ModelCurveArrArray and its per-edge indexed properties `DefinesSlope` (bool)
  and `SlopeAngle` (double), both get and set - written get_/set_DefinesSlope
  and get_/set_SlopeAngle in C# - with one signature on every release.
  `ExtrusionRoof` and `RoofBase`, ModelCurveArrArray and ModelCurveArray,
  `CurveElement.GeometryCurve`, the application's `ShortCurveTolerance` and
  `AngleTolerance`, `Element.GroupId`, `LevelId` and `get_BoundingBox`,
  `Document.Regenerate`, `Level.ProjectElevation`, and ElementId's `Equals`
  and `!=` read the same on all eight. ElementId's `CompareTo` exists only
  from 2026 and is not used. The API reference text for SlopeAngle - a slope,
  0.5 being one of rise for two of run, 26.57 degrees - is identical on all
  eight releases (2020 to 2026 from the reference packages, 2027 from Revit
  2027's own RevitAPI.xml). No ElementId is constructed and none is read as a
  number.

# ROUTING - repeated in CREATE_FLOOR (CREATE_ROOF, merged into it 2026-11-01).
#
#   "slope this roof"                    -> here
#   "make it a gable roof at 30 degrees" -> here
#   "make this a hip roof"               -> here
#   "put a roof over this"               -> CREATE_FLOOR, with a roof type
#                                           (CREATE_ROOF merged in). It makes the roof FLAT;
#                                           this slopes it afterwards
#   "add a gable extrusion roof on reference plane North Face",
#   "make a barrel roof over the entrance"
#                                        -> CREATE_EXTRUSION_ROOF (2026-11-02).
#                                           A roof by extrusion takes its slope
#                                           from its profile; this card refuses
#                                           one by name
#   "what pitch is this roof", "how steep is this roof"
#                                        -> REPORT_ROOF_SLOPES (2026-11-21, row
#                                           5b-1940), which reads each edge's
#                                           slope and changes nothing. Before
#                                           it nothing read a roof's pitch edge
#                                           by edge, and the question landed
#                                           here, a write, on every backend
#                                           (measured 2026-09-24 through
#                                           heron_lookup, it resolved to
#                                           CREATE_ROOF, another write).
#                                           READ_ELEMENT_PARAMETERS reads what
#                                           the roof's Properties show
#   "change a value in the roof's Properties"
#                                        -> WRITE_ELEMENT_PARAMETERS. It writes
#                                           one parameter and cannot choose which
#                                           edges slope, so it cannot make a flat
#                                           roof a gable
#   "give it a fall of 1 in 100"         -> SET_MEP_SLOPE - a pipe or a duct,
#                                           never a roof
#   "slope just this one edge", a lean-to -> here since version 2, roofShape
#                                           edges with that edge's number. An
#                                           edge number is something only a
#                                           Heron reply can show - Revit's own
#                                           screen names none - so `edges` with
#                                           no numbers lists them first
#   "slope these edges of the roof",
#   "make only these roof edges define slope"
#                                        -> here, edges (row 5b-1670; both
#                                           measured to reach this card on
#                                           2026-11-15)

utterances:
  - slope this roof
  - turn this flat roof into a gable roof
  - make this a hip roof
  - slope the edges of this roof
  - make it a gable roof at 30 degrees
  # VERSION 2, row 5b-1670.
  - slope only these edges of the roof
  - make only these roof edges define slope
  # ADDED 2026-11-21, row 5b-1953 (issue #1187). A pitch asked for in degrees.
  # The eighth line is a plain slope request, because the re-ranker reads the
  # first eight (D-134) and a pitch sentence there pulled a pitch QUESTION to
  # this write on both re-ranked backends (row 5b-1953, tried and taken back);
  # the pitch line is ninth, read by words and nearness only. On the model
  # alone it pulled "tell me the pitch of the selected roof" here, so
  # REPORT_ROOF_SLOPES carries a pitch question ninth as its counterweight.
  - slope every edge of this roof
  - set this roof to a 30 degree pitch

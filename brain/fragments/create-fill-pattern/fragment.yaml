# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# THE TWO PATTERNS Revit's Fill Patterns dialog makes without a .pat file:
# parallel lines at an angle and spacing, or a crosshatch when crossSpacingMm
# is more than 0.
#
# DRAFTING OR MODEL: a drafting pattern's spacing is on paper and scales with
# the view; a model pattern's is real size - a 600 mm tile grid. A name is
# unique within its target only.
#
# AN EXISTING NAME IS REFUSED unless replaceExisting is true, and then the
# pattern is replaced in place, so every region and material using it follows.
#
# READ BACK: the stored grids, angle and spacing of each.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Creates a fill pattern - parallel lines at an angle and spacing, or a
  crosshatch - as a drafting or a model pattern, or replaces an existing one.

contract:
  needs:
    - name: doc
      type: Document
    - name: patternName
      type: string
      source: request
    # "drafting" or "model"; an EMPTY value means drafting.
    - name: target
      type: string
      source: request
    - name: angleDegrees
      type: double
      source: request
    - name: spacingMm
      type: double
      source: request
    # 0 for parallel lines; more than 0 adds a set at right angles this far
    # apart - a crosshatch.
    - name: crossSpacingMm
      type: double
      source: request
    # true replaces a pattern of that name and target in place; false, or not
    # said, refuses an existing name.
    - name: replaceExisting
      type: bool
      source: request
      optional: true
  provides:
    - name: pattern
      role: result
      type: FillPatternElement
    - name: madeNew
      role: result
      type: bool
    - name: readBack
      # The stored grids, read off the pattern afterwards.
      role: result
      type: string
    - name: refused
      # Why NOTHING WAS MADE, as one sentence; null otherwise (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>

proof:
  date: '2026-10-18'
  by: Ajmal PS
  model: Project2 (3,035 elements), Revit 2020, session 13520
  positive_case: 'run as it would normally be run - run inside a transaction, and Revit reported
    the transaction group ROLLED BACK afterwards. returned MmPerFoot 304.8, angleDegrees 0,
    crossSpacingMm 600, fillTarget FillPatternTarget, findings 1 item(s) [Made model fill
    pattern "Heron Tile 600": 0 degrees, 600 mm ...], kind model, madeNew true, name Heron
    Tile 600, pattern FillPatternElement, readBack 0 degrees, 600 mm apart; 90 degrees, 600
    mm apart, refused (null), replaceExisting false, spacingMm 600. inputs came patternName
    as given; target as given; angleDegrees as given; spacingMm as given; crossSpacingMm as
    given; replaceExisting as given. on Project2'
  negative_case: 'run with angleDegrees=0, categoryName=Text Notes, crossSpacingMm=600, inViewOnly=FloorPlan:
    Level 1, patternName=Heron Tile Bad, replaceExisting=False, spacingMm=0, target=model
    instead - chosen because it should not contain what this fragment reports - run inside
    a transaction, and Revit reported the transaction group ROLLED BACK afterwards. returned
    MmPerFoot 304.8, angleDegrees 0, crossSpacingMm 600, fillTarget FillPatternTarget, findings
    1 item(s) [The spacing must be more than 0 mm, so NOTHING WAS MADE.], kind model, madeNew
    false, name Heron Tile Bad, pattern (null), readBack , refused The spacing must be more
    than 0 mm, so NOTHING WAS MADE., replaceExisting false, spacingMm 0. inputs came patternName
    as given; target as given; angleDegrees as given; spacingMm as given; crossSpacingMm as
    given; replaceExisting as given. on Project2'
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: 10655fc94a170c29

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. FillPattern's two constructors (one
  spacing, and two for a crosshatch), FillPatternElement.Create,
  GetFillPatternElementByName, SetFillPattern and GetFillPattern, and
  FillGrid.Angle and Offset are present 2020 through 2027 - read off
  RevitAPI.xml in the Nice3point reference packages for all eight releases on
  2026-10-12. Spacing is millimetres divided by 304.8 (D-20).

# ROUTING - the same rows are in the fragments named here.
#
#   "make a 45 degree hatch"                  -> here
#   "make a 600 mm tile pattern"              -> here, target model, crosshatch
#   "fill this area with a hatch"             -> CREATE_FILLED_REGION, which
#                                                uses a filled region type
#   "make a dash dot line pattern"            -> CREATE_LINE_PATTERN

utterances:
  - make a 45 degree hatch pattern
  - create a 600 mm square tile fill pattern
  - add a crosshatch drafting pattern at 3 mm
  - make a diagonal hatch for the demolition areas
  - make a 600 mm tile pattern

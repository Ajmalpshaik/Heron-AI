id: FRG-VIEW-025
semantic-identity: "a rule that finds elements by a parameter value and colours whatever matches"
kind: action
domain: revit.views
capability: CREATE_VIEW_FILTER
# Version 3, 2026-10-15: the parameter is typed by NAME - `parameterName`,
# where version 2's `parameterId` could be bound by no name at all
# (FRAGMENT-ISSUES 5b-191) - and `matchValue` may lead with the operator
# Revit's Filters dialog shows, "does not contain Level 1". No operator is
# equals, as version 2 read it.
#
# Version 4, 2026-11-01: CREATE_VIEW_FILTERS_BY_RULE was merged into this card
# on the owner's instruction, and is DEPRECATED. Many filters in one call, one
# value each; the view and the colour optional together, so filters can be
# made on no view; categories by Revit's own name too; every category asked on
# its own and named in `cannotFilter`; a name already taken - a selection
# filter's included - skipped and named while the rest are made; and a
# read-back of what Revit holds. Version 3's proof below no longer describes
# the code and is kept as the record; the card is DRAFT until it is proved
# again.
#
# Version 4, review fixes of the same day (the owner's rule that a merged card
# covers everything both old cards did): a blank value asked for in words -
# "has no value" or "is blank" - while an empty value is still refused; and
# `matchValue` is text again, as in version 3, divided by the card, so a comma
# inside one value no longer splits it. Not a version of its own: version 4
# was never proved. SAID HERE AND NOT IN `purpose`, which is indexed: a
# paragraph there saying this moved the owner's question 67 ("Create an air
# terminals filter, give it colours, and apply it to the active 3D view") from
# 1st to 2nd behind APPLY_VIEW_FILTER on the model backend, measured
# 2026-11-01, and was taken out again.
version: 4
source: OFFICIAL
risk: MODIFY

purpose: >
  Creates a filter that tests one parameter - or several, all or any of them
  (version 2) - applies it to a view, and colours whatever the rule matches.
  Version 3: the parameter by its name, and an operator in front of the value
  when it is not equals - "does not contain Level 1".

  **A filter matches; it does not remember.** Whatever satisfies the rule is
  caught, including work modelled next week - so a reissued drawing stays
  correct with nobody touching it. That is the whole reason to set one up.

  **The rule is a project-wide object.** Creating it puts it in the project's
  filter list, available everywhere and applicable to the whole set later. It
  outlives the view it was made for.

  **Several at once, and on no view when that is the job** (version 4). Each
  filter gets its own name and one value, all on the same categories and the
  same parameter - "Supply Air, Return Air and Exhaust Air on System
  Classification, for air terminals and ductwork". Leave the view and the
  colour out and they are made on no view, the way a modeller sets up a
  standard in Manage > Filters. One category that cannot take the rule stops
  the whole call and is named; a name already a filter is skipped and named,
  never overwritten. Each new filter is read back from Revit - its categories,
  its rule as held, and how many elements it catches today.

contract:
  needs:
    - name: doc
      type: Document
    # Version 4: OPTIONAL, with `colour`. Left out, every filter is made on
    # no view and none is coloured - APPLY_VIEW_FILTER puts one on a view
    # later. Given, `colour` must be too.
    - name: view
      type: View
      source: request
      optional: true
    # One name, or several comma separated (version 4) - one filter each, the
    # values in `matchValue` in the same order. A name already a filter in the
    # project, a selection filter's included, is skipped and named in
    # `alreadyExists`, never overwritten.
    - name: filterName
      type: IList<string>
      source: request
    # As Visibility/Graphics shows them - "Ducts, Duct Fittings" - or by
    # Revit's own name, OST_DuctCurves (version 4; version 3 took the shown
    # name alone). Every one must take the rule, or nothing is made.
    - name: categoryIds
      type: IList<BuiltInCategory>
      source: request
    # The parameter the first rule tests, by the name Revit shows - "Type
    # Name", "System Classification" - among those EVERY category given may
    # be filtered by. None, or two, refuses; a built-in one may be typed by
    # its Revit name, RBS_SYSTEM_CLASSIFICATION_PARAM, to choose it (version 3).
    - name: parameterName
      type: string
      source: request
    # The text the first rule matches, with the operator in front when it is
    # not "equals": equals, does not equal, contains, does not contain, begins
    # with, does not begin with, ends with, does not end with ("does not
    # contain Level 1"). "equals contains" matches the word itself (version 3).
    # "has no value" - or "is blank" - ALONE catches the elements whose
    # parameter is empty; a value left blank is refused, so an empty
    # parameter is only ever asked for in words (version 4).
    #
    # ONE PER FILTER NAME, in the same order (version 4). TEXT, divided by the
    # card and not the binder, whose lists split at every comma: with ONE
    # filter name the whole text is the value, commas and all ("Smith, John"),
    # as version 3 read it; with several it is divided at the commas, and a
    # value holding a comma goes in double quotes - Supply Air, "Return,
    # Mixed". A value wholly in double quotes is taken as written inside them
    # either way. Type it as Revit shows it: whether capitals matter on 2023
    # and later is not known here (the cases say why).
    - name: matchValue
      type: string
      source: request
    # More rules beside the first, "Name = value; Name contains text", with =,
    # != or any of the operators above - "Comments has no value" too; an
    # EMPTY value is the one rule alone (version 2). For ONE filter only:
    # beside several names it is refused (version 4).
    - name: moreRules
      type: string
      source: request
    # "and" or "or" across the rules; an EMPTY value means and.
    - name: combine
      type: string
      source: request
    # Three numbers 0 to 255, "255,0,0", put on the filter's lines and
    # patterns in `view`. Version 4: OPTIONAL, with `view` - left out it is
    # "none", and a colour with no view, or a view with no colour, is refused
    # before anything is made. Text since version 4, where version 3 took a
    # Color: the binder has no way to leave a Color out.
    - name: colour
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: created
      # The filter made - the FIRST, when several were (version 4). Null when
      # nothing was.
      role: result
      type: ElementId
    - name: createdIds
      # Version 4. Every filter made, in the order of the names.
      role: result
      type: IList<ElementId>
    - name: readBack
      # Version 4, from CREATE_VIEW_FILTERS_BY_RULE. Each new filter as Revit
      # holds it: its categories, its rules (a "does not" rule unwrapped from
      # the FilterInverseRule Revit keeps it in), the elements that rule
      # catches today, and whether it is on the view with its colour. ONE
      # STRING, because a list reaches the chat as three entries cut at sixty
      # characters and the rule is at the end of each.
      role: result
      type: string
    - name: alreadyExists
      # Version 4. Names that were already a filter in the project - a
      # selection filter's included - and were left exactly as they were.
      # Given and unused, never a thing it made (D-52).
      role: accounting
      type: IList<string>
    - name: cannotFilter
      # Version 4. Categories the named parameter cannot filter, each with the
      # reason - Revit cannot filter the category at all, or it has no
      # parameter by that name. Any entry here means nothing was created.
      # Given and unusable (D-52).
      role: accounting
      type: IList<string>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string


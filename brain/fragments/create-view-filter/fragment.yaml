tests: tests/

compatibility-note: >
  **No compile symbol since version 3: the rule factories are reached by
  reflection, by method name.** Neither form of a text rule factory in
  `ParameterFilterRuleFactory` - CreateEqualsRule and the seven others the
  operators call - spans 2020 to 2027:

    (ElementId, string, bool)   2020 to 2025. REMOVED IN 2026
    (ElementId, string)         ADDED IN 2023

  The two-argument form is taken where it exists, otherwise the three-argument
  one with `false`, not case sensitive, as CREATE_VIEW_FILTERS_BY_RULE does.
  Version 2 split on a REVIT20xx symbol, which the add-in did not pass a
  fragment until 2026-10-09 (FRAGMENT-ISSUES 5b-181), so on 2020 to 2022 it
  compiled the newer branch and failed; reflection does not depend on it.

  The next paragraph is about version 2's split, kept for its lesson.

  **THIS NOTE WAS WRONG WHEN FIRST WRITTEN AND THE CODE WAS NOT.** It said the
  three-argument form was "gone after 2022"; it survived to 2025. The
  implementation happened to be right, so the compile gate passed on all eight
  releases and had nothing to complain about - a green build does not check the
  sentence next to it. The figures above were read off the reference assemblies
  for each release; do the same before changing them.

  `ParameterFilterElement.Create(Document, string, ICollection<ElementId>,
  ElementFilter)`, `View.AddFilter` and `View.SetFilterOverrides` are unchanged
  across the whole span.

  Version 4 adds what CREATE_VIEW_FILTERS_BY_RULE used on the same span, read
  off the reference assemblies there: `ParameterFilterUtilities.
  GetAllFilterableCategories`; `NamingUtils.IsValidName`; `FilterElement`;
  `ParameterFilterElement.GetCategories` and `GetElementFilter`;
  `FilterInverseRule.GetInnerRule`; `FilterRule.GetRuleParameter`;
  `FilterStringRule.RuleString` and `GetEvaluator`;
  `ElementParameterFilter.GetRules`; `ElementLogicalFilter.GetFilters`;
  `ElementMulticategoryFilter(ICollection<ElementId>)`; `Category.GetCategory(
  Document, BuiltInCategory)` and the `ElementId(BuiltInCategory)`
  constructor - and for the view's read-back `View.GetFilters` and
  `View.GetFilterOverrides`, unchanged 2020 to 2027. No id is read as a
  number on the new paths.

  Version 2 put a REQUIREMENT on the executor - define the `REVIT20xx` symbol
  MSBuild defines, or the `#else` branch is taken and this breaks on 2020 to
  2022. Version 3 has no `#if` and puts none.

# WHY THE CONTRAST BELOW IS IN A COMMENT. `purpose` is indexed, and the first
# draft explained this fragment by describing what OVERRIDE_GRAPHICS_IN_VIEW
# does - in that fragment's own words. Measured 2026-09-01: it took THREE
# sentences off its neighbours, including "colour these elements in this view"
# and "remove the colours", which belong to the two override fragments.
#
# The contrast is real and worth a reader's time, so it is kept - here, where
# retrieval cannot see it:
#
#   an OVERRIDE is stuck to the element ids it was given. Correct today, blind
#   to anything modelled afterwards
#   a FILTER tests a parameter. It catches work that does not exist yet
#
# On a drawing issued once, either will do. On one that gets reissued, only the
# second keeps being right.

# ROUTING - repeated in OVERRIDE_GRAPHICS_IN_VIEW and SET_CATEGORY_GRAPHICS.
#
#   "colour by system"             -> here - it colours whatever MATCHES, so
#                                     work drawn next week comes out right
#   "add a filter to the view"     -> here
#   "make the supply ducts blue"   -> here if it should keep working as the
#                                     model grows; OVERRIDE_GRAPHICS_IN_VIEW if
#                                     it is these elements, once
#   "make these red"               -> OVERRIDE_GRAPHICS_IN_VIEW - stuck to the
#                                     ids you found, and blind to anything added
#                                     afterwards
#   "grey the architecture back"   -> SET_CATEGORY_GRAPHICS - a whole category,
#                                     no parameter involved
#   "colour code by system"          -> COLOR_BY_PARAMETER paints what is there
#                                       NOW, in one step. A FILTER is a RULE that
#                                       keeps working as the model changes - use
#                                       this one when the drawing has to stay
#                                       right without being re-run
#   "colour by system"               -> either; say which behaviour is wanted
#   "save these as a set"            -> CREATE_SELECTION_FILTER - a LIST,
#                                       right when the elements share no
#                                       rule. This is the rule
#   "put that filter on this view"   -> APPLY_VIEW_FILTER. This makes the
#                                       rule and puts it on no view at all
#   "what filters already exist"     -> REPORT_VIEW_FILTERS, before making a
#                                       near-duplicate of one that works

#   "make a filter for every different system type" ->
#                                        CREATE_VIEW_FILTERS_BY_VALUE - one
#                                        filter PER VALUE, worked out from the
#                                        model. This makes ONE, from a rule
#                                        you already know
#   "take that filter off the view"      -> REMOVE_VIEW_FILTER
#   "create a supply air filter for      -> here since version 4, on no view
#    ducts"                                 when the view and colour are left
#                                           out. CREATE_VIEW_FILTERS_BY_RULE
#                                           answered it until it was merged
#                                           into this card on 2026-11-01
#   "make filters for supply return and  -> here (version 4). Three names,
#    exhaust air"                           three values, one category list
#   "take the Duct Systems category off  -> SET_VIEW_FILTER_CATEGORIES. This
#    these view filters"                    never edits a filter that exists -
#                                           it skips the name
#   "rename this view filter"            -> SET_VIEW_FILTER_CATEGORIES, with newName
#   "change the filter rule to does not contain TRG_MEC" -> SET_VIEW_FILTER_CATEGORIES, with matchValue
#   "add grids to this filter"           -> SET_VIEW_FILTER_CATEGORIES, with the whole list
#   "which parameters can I filter ducts -> REPORT_FILTERABLE_PARAMETERS. What
#    by"                                    to ask BEFORE this, when the
#                                           parameter's name is not known
#
# VERSION 4 (2026-11-01) - CREATE_VIEW_FILTERS_BY_RULE WAS MERGED INTO THIS
# CARD on the owner's instruction, and is DEPRECATED. Both make a rule-based
# filter from a parameter typed by name and an operator in front of the value,
# through the same reflected factories; this card also puts it on a view with a
# colour and takes more than one rule. What that card had that this lacked is
# here, listed in the C# header. The safer of each rule was kept: a filter name
# already taken is skipped and named, never overwritten, with the clash scan
# over every FilterElement; a blank value is refused, where version 3 would have
# built a rule matching blank - and the job version 3 could do by accident is
# asked for in words now, "has no value" (review fix, 2026-11-01). The other
# review fix: `matchValue` is text the card divides, because the binder's list
# rule splits at every comma and has no quote or escape (RevitFragment.Parts);
# CREATE_VIEW_FILTERS_BY_RULE's `matchValues` list had the same fault. KEPT IN STEP BY HAND WITH
# SET_VIEW_FILTER_CATEGORIES VERSION 2 (FRAGMENT-ISSUES 5b-481), which builds a
# filter's NEW rule from the same operator-led value: the operator words, their
# factory methods reached by reflection, the parameter matched by label or
# built-in name, and the read-back's rule words are a copy there. A fragment
# cannot call another's code, so a change to any of them here is made there
# too - EXCEPT "has no value" and "is blank", added here on 2026-11-01 and not
# there: SET_VIEW_FILTER_CATEGORIES is PROVEN and its impl/ changes only with
# its own next version. CREATE_VIEW_FILTERS_BY_VALUE stays its own card: its
# values come from the model.

positive:
  - given: categories Ducts and Duct Fittings, parameter System Type, value "Supply Air", blue
    expect: >
      every supply duct in that view comes out blue - AND so does one drawn next
      week, because a filter matches rather than remembering ids

  - given: the same job done with OVERRIDE_GRAPHICS_IN_VIEW instead
    expect: >
      it looks identical today and is wrong at the next issue. That is the
      difference the two fragments exist to keep apart

  - given: 'ducts, the first rule System Type = Supply Air, moreRules "Comments contains L2", combine and'
    expect: >
      one filter matching only supply ducts whose comments hold L2; with
      combine or, every supply duct and every duct marked L2 (version 2)

  - given: 'categories Levels, parameterName Name, matchValue "does not contain Level 1", red'
    expect: >
      one filter whose rule Revit holds as Name does not contain 'Level 1',
      on the view with red lines - the operator read off the front of the
      value (version 3)

  - given: >
      VERSION 4. filterName "Supply Air, Return Air, Exhaust Air", categoryIds
      "Air Terminals, Ducts, Flex Ducts, Duct Fittings, Duct Accessories",
      parameterName "System Classification", matchValue "Supply Air, Return
      Air, Exhaust Air", NO view and NO colour, in a project with none of
      those filters
    expect: >
      three filters created, on no view - createdIds three, `created` the
      first. readBack names each with the five categories as Revit holds them,
      the rule "System Classification equals '<value>'", and "on no view". The
      count each catches today is the model's own - an exhaust filter in a
      model with no exhaust ductwork catches 0 and is still created. Version 3
      takes one name and refuses a missing view, so this FAILS on it
      (CREATE_VIEW_FILTERS_BY_RULE's case)

  - given: VERSION 4. the same call again, straight after
    expect: >
      nothing created, alreadyExists naming all three, and refused saying they
      were left as they were. Never an overwrite and never a second copy

  - given: >
      VERSION 4. two names, one of them already a SELECTION filter in the
      project
    expect: >
      the other made, the taken one in alreadyExists. Version 3 scanned rule
      filters only, so Revit threw on the duplicate - this FAILS on it

  - given: VERSION 4. categoryIds "OST_DuctCurves" instead of "Ducts"
    expect: the same filter as "Ducts" gives - Revit's own name is taken too. Version 3 refused it

  - given: 'VERSION 4. categories Levels, matchValue "does not contain Level 1", no view'
    expect: >
      readBack says "rule Name does not contain 'Level 1'" - the
      FilterInverseRule Revit holds is unwrapped - and catches the levels not
      called Level 1

negative:
  - given: >
      VERSION 4. "Air Terminals, Ducts, Walls" with System Classification
    expect: >
      NOTHING created, and cannotFilter names Walls - it cannot be filtered by
      System Classification - while the two good categories are not named.
      Version 3 said only that no shared parameter has the name, so this FAILS
      on it

  - given: VERSION 4. three names and two values
    expect: refused before Revit is asked anything - each filter needs exactly one value, in order

  - given: VERSION 4. a filter name holding a colon, or the same name twice
    expect: refused by name before anything is created

  - given: VERSION 4. a view given and no colour, or a colour and no view
    expect: >
      refused before anything is made - a filter put on a view here is
      coloured in the same call, and a colour with no view has nowhere to go

  - given: VERSION 4. two names and a moreRules value
    expect: refused - moreRules makes ONE filter with several rules, and is not shared out

  - given: a filter name already in the project
    expect: >
      refused before anything is touched. Filters are project-wide, so another
      view may be relying on that name, and Revit throws on the duplicate AFTER
      the view has been modified

  - given: value "supply air" against a system type named "Supply Air"
    expect: >
      A MATCH on Revit 2020 to 2022 since version 3. There the three-argument
      factory is the only one, and it is passed the case-sensitivity flag as
      false - as CREATE_VIEW_FILTERS_BY_RULE does. Version 2 passed
      true, so that "SUPPLY" and "Supply" stayed two systems, and on 2023 and
      later the two-argument form has nowhere to say either way.

      ON 2023 AND LATER THIS IS STILL UNVERIFIED. Reflection shows a signature
      rather than a behaviour. **Check this case first when the fragment meets
      a real model on a newer Revit**: if the two spellings disagree, the same
      filter colours different elements on different Revit versions, which is
      the worst place for a difference to hide

  - given: a parameterName none of the categories can be filtered by - System Classification on Levels
    expect: >
      refused, naming the parameter, and nothing made - no filter in the
      project and none on the view (version 3)

  - given: a parameterName two shared parameters answer to
    expect: >
      refused, naming both; the built-in one can then be typed by its Revit
      name to choose it (version 3)

  - given: a matchValue that is an operator alone - "does not contain"
    expect: >
      refused - there is nothing to match. "equals does not contain" matches
      the words themselves (version 3)

  - given: no parameter given
    expect: >
      refused, pointing at SET_CATEGORY_GRAPHICS. A filter with no test matches
      the whole category, which is a different fragment's job

  - given: compiled with no REVIT20xx symbol defined
    expect: >
      the same code on every release since version 3 - the factory is found
      by reflection, so there is no branch to take. Version 2 took its
      2023-onward branch and failed on 2020 to 2022

second_route:
  - Revit's own View > Filters dialog with the same categories and rule, compared for which elements change colour

# VERSION 5 (2026-11-20, FRAGMENT-ISSUES rows 5b-1365 and 5b-342) - THE LEVEL AN
# ELEMENT STANDS ON, FOR THE BUILDING STORY COUNT, IS ASKED THE FIXED WAY, and
# still DRAFT. Version 4 kept the retired SELECT_WITHOUT_LEVEL's four steps -
# wall, LevelId, the family's level parameter, an MEP curve's start level - so
# an element whose family "Level" is empty (a work plane-based diffuser on a
# level's plane, row 5b-342; get_Parameter answers such a "Level" the element
# does not carry) and whose Schedule Level holds Level 1 counted on no level,
# and an unticked Level 1 read fewer elements than stand on it. Version 5 asks
# FILTER_ELEMENTS_BY_CATEGORY's five level parameters in its order, and one
# that holds no level is passed over and the next asked (row 5b-335). Every
# other answer is version 4's. DRAFT until its cases are run (D-30).

purpose: >
  Reports every level's TWO heights side by side and says, in one word, whether
  they disagree on this model.

  **A LEVEL HAS TWO HEIGHTS AND ONLY ONE OF THEM IS IN THE SAME SPACE AS THE
  MODEL'S GEOMETRY.** `Elevation` is measured from whatever the level type's
  "Elevation Base" says - Project or Shared. `ProjectElevation` is always
  measured from the project origin. Every XYZ the API hands back - a location
  point, a bounding box, a solid's vertices, a ray's origin - is in
  project-internal coordinates. So the moment a level height meets a
  coordinate, `ProjectElevation` is the only one that belongs there.

  **WHY IT IS A FRAGMENT AND NOT A NOTE IN A DOCUMENT.** On a test model the two
  numbers are identical and nothing shows. On a real site model with a survey
  offset, every height answer is wrong by exactly that offset - silently, with a
  plausible number. That is this project's defining failure shape, and a
  document warning about it cannot tell you whether TODAY'S model is affected.
  This can, and it prints the offset, which is exactly how wrong the answers
  would be.

  **THE VERDICT IS MEASURED, NEVER INFERRED FROM THE SETTING.** The "Elevation
  Base" parameter is reported because a person will want to see it, but nothing
  here branches on it: the API publishes no enum for its values, so "0 means
  Project" is an assumption, and its display text is localised. The verdict
  comes from subtracting the two elevations, which is true in any language.

  **A DIFFERENCE OF ZERO DOES NOT PROVE THE BASE IS PROJECT.** It also happens
  when the base is Shared and the shared origin simply sits on the project
  origin - true until somebody relocates the model. So a third verdict exists
  between the two obvious ones: NOT AFFECTED TODAY, BUT AT RISK, reported
  whenever the survey point carries a vertical offset that a single setting
  change would start applying.

  **CHECKING ONE LEVEL PROVES NOTHING ABOUT THE REST.** "Elevation Base" lives
  on the level TYPE, and two level types in one model may disagree - half on
  Project and half on Shared is legal. `typesDisagree` is reported for that
  case, because it is the version of this that survives a spot check.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, every loaded link's levels are carried
  through its first placement into this model's space and set against this
  model's level of the same NAME - *"is the architect's Level 2 at the same
  height as mine"* - and `linkedMatches` gives each link's count, then one
  line per linked level: its height here, this model's, and the difference
  in millimetres, or that no level here has that name. A file placed more
  than once at different heights is said, not averaged. `linksSearched`
  says how many links were read: set and 0 means "you asked, and none are
  loaded". **NOTHING FROM A LINK IS CARRIED** - `levels` and both
  dictionaries stay this model's own; they are keyed by ids the next step
  would look up here (FRAGMENT-ISSUES row 75). Links nested inside a link
  are not read, and are counted in the answer. This is version 2; version
  1's proof no longer describes the code, and the fragment is DRAFT until
  it is proved again.

  **WHICH LEVELS ARE BUILDING STORIES, AND WHAT STANDS ON THE ONES THAT ARE
  NOT (version 3).** Every reply now carries `storeys`: each level's
  "Building Story" setting, and for every level NOT marked, how many model
  elements have that level as their level. An IFC export makes a storey only
  from a level marked Building Story, so elements on an unmarked level are
  put in another storey on the way out. An element's level is found in four
  steps and in this order, ending on an
  MEP curve's start level, because a duct keeps its level nowhere else. Only
  model elements are counted; views, sheets and annotation carry a level
  too and go into no storey. **Numbers, never a verdict** - an unmarked
  level with nothing on it is harmless, and one with elements on it is the
  modeller's call. When every level is marked the reply says so and names
  the levels it read, rather than printing a bare zero. Linked models are
  not read for this, whatever `includeLinks` says. Versions 1 and 2 above
  are kept as the record; this is version 3, and the fragment is DRAFT until
  it is proved again.

  **VERSION 7 - THE ONE DATUM TOOL: LEVELS AND GRIDS, HERE, IN A LINK, AND
  COPY-MONITORED.** CHECK_DATUMS_AGAINST_LINK is merged in. With
  `includeLinks` or a link named in `linkName`, this model's grids and levels
  are checked against the link's - matched by name, then by lining up, and
  each said aligned within the tolerance, off by how many millimetres and
  degrees, not checked and why, or only in one model - one row each in
  `report`, the datums off counted in `failures` and handed on in
  `failingIds` to select, `compared` the pairs measured. `toleranceMm`,
  `angleToleranceDeg` and `datums` (grids, levels or both) are the check's.
  Every grid or level here that copy-monitors a link is listed in
  `monitored`, with the link placement it watches, and is measured against
  that placement when links are asked for. A linked file placed more than
  once is never measured until the copy is named in `linkName` - every
  placement is named and the modeller asked, never the first one taken
  (D-207); a placement a datum here copy-monitors is named by that
  monitoring. Nothing is changed. DRAFT until version 7 is proved.

  **IT IS ALSO THE LIST OF LEVELS** (version 4, when LIST_LEVELS was merged
  in): the levels bottom to top, handed on as `elements`, each one's height in
  millimetres as its level head shows it in `elevationsMm` and from the
  project origin in `projectElevationsMm`, one line per level in `findings`
  with the two said apart where they differ, and each linked level's own
  level head beside its height here. DRAFT until version 4 is proved.

contract:
  needs:
    - name: doc
      type: Document
      source: ambient
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
    # VERSION 7, from CHECK_DATUMS_AGAINST_LINK. Which link placement to
    # check against: its full name as Manage Links shows it ("Arch.rvt : 1 :
    # location <Not Shared>"), any part of it ("Arch"), or "only" for the one
    # placement this model has. A part matching two placements, or none, is
    # refused with every placement named, never picked. Naming one reads that
    # link whatever `includeLinks` says. LEFT OUT, NOTHING IS NAMED - not
    # "only", as it was on the retired card: with `includeLinks` every link
    # file placed once is checked and a file placed twice is refused until
    # one copy is named (D-207); without it no link is read (D-59).
    - name: linkName
      type: string
      source: request
      optional: true
      absent: ""
    # Version 7, from CHECK_DATUMS_AGAINST_LINK. "grids", "levels" or "both"
    # - what the link check compares. Left out, both. Anything else refuses
    # the check, never the level heights above it.
    - name: datums
      type: string
      source: request
      optional: true
      absent: both
    # Version 7, from CHECK_DATUMS_AGAINST_LINK. How far apart counts as
    # aligned, in mm - a grid's distance square to the grid here, a level's
    # height, an arc's centre and radius - and the "same height" of a linked
    # level's line in `linkedMatches`. Left out, 0.5. 0 or less is refused.
    - name: toleranceMm
      type: double
      source: request
      optional: true
      absent: "0.5"
    # Version 7, from CHECK_DATUMS_AGAINST_LINK. How far a straight grid may
    # turn and still be aligned, in degrees. Left out, 0.01 - which moves the
    # far end of a 60 m grid 10.5 mm. Above 0 and below 90.
    - name: angleToleranceDeg
      type: double
      source: request
      optional: true
      absent: "0.01"
  provides:
    - name: levels
      role: result
      type: IList<Element>
    - name: elevations
      role: result
      type: IDictionary<ElementId, double>
    - name: projectElevations
      role: result
      type: IDictionary<ElementId, double>
    - name: worstDifference
      role: result
      type: double
    - name: affected
      # The one-word verdict: whether this model's two level heights actually
      # disagree today. What the whole fragment exists to say.
      role: result
      type: bool
    - name: atRisk
      # NOT AFFECTED TODAY, BUT AT RISK - the third verdict between the two
      # obvious ones, reported when the survey point carries a vertical offset
      # that a single setting change would start applying.
      role: result
      type: bool
    - name: typesDisagree
      # That two level TYPES in this model disagree about their Elevation
      # Base, which is legal. CHECKING ONE LEVEL PROVES NOTHING ABOUT THE
      # REST, and this is what says so.
      role: result
      type: bool
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then the links' own lines. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75).
      role: accounting
      type: IList<string>
    - name: elements
      # Version 4, from LIST_LEVELS: the same levels as `levels`, bottom to
      # top, under the name the next step reads.
      role: result
      type: IList<Element>
    - name: elevationsMm
      # Version 4, from LIST_LEVELS: each level's height in millimetres AS ITS
      # LEVEL HEAD SHOWS IT - Elevation, from the base the level type names.
      # LIST_LEVELS put ProjectElevation here, reading the two the other way
      # round (row 5b-180); this card's reading is RevitAPI.xml's.
      role: result
      type: IDictionary<ElementId, double>
    - name: projectElevationsMm
      # Version 4: each level's height in millimetres from the PROJECT ORIGIN
      # - ProjectElevation, the one in the same space as every coordinate.
      role: result
      type: IDictionary<ElementId, double>
    - name: findings
      # Version 4, from LIST_LEVELS: how many levels, then one line per level,
      # bottom to top, its level head in mm and - where it differs - its
      # height from the project origin.
      type: IList<string>
    - name: storeys
      # Version 3. One line saying how many levels are marked Building Story,
      # then one line per UNMARKED level with the count of model elements on
      # it. Every level marked is said in words with the levels named - never
      # a bare zero. Text, because it is read by a person, not chained.
      # VERSION 8 (row 5b-2070): EMPTY in a document with no levels - a family
      # file - which version 7 told "every level is marked".
      role: result
      type: IList<string>
    - name: unreadable
      # VERSION 6 (D-64). Levels whose Building Story setting Revit would not
      # give - passed over by the storey count, never counted as unmarked,
      # and named in `storeys` when there are any. Empty on an ordinary model.
      role: accounting
      type: IList<string>
    # ---- VERSION 7: CHECK_DATUMS_AGAINST_LINK's outputs, under its names ----
    - name: report
      # ONE STRING, a header row then one row per datum compared, joined by
      # new lines: "kind | name | status | offset | angle | reason | against".
      # Status aligned, off, not checked, host only or link only; offset in mm
      # (a level's the link's minus this model's, + when the link's is
      # higher); angle in degrees for a straight grid; `against` the link
      # placement the row was measured against. Empty when no link was read.
      # ACCOUNTING: it carries rows on a run that finds nothing off.
      role: accounting
      type: string
    - name: failures
      # Datums OFF - compared and outside a tolerance, against any link read.
      # The number a QA check rules on: "failures == 0", beside `compared`.
      role: result
      type: int
    - name: aligned
      # Datums compared and aligned within both tolerances.
      role: accounting
      type: int
    - name: compared
      # Pairs actually measured - aligned plus off. 0 means nothing was read
      # from a link, and "failures == 0" beside it has met nothing (D-165).
      role: accounting
      type: int
    - name: notChecked
      # Pairs that could not be compared - a multi-segment grid, an arc
      # against a straight grid, a tilted placement - each row saying why.
      role: accounting
      type: int
    - name: hostOnly
      # This model's datums with no partner in a link read, by name or
      # position - a copy-monitored one whose source is gone among them.
      role: accounting
      type: int
    - name: linkOnly
      # A link's datums with no partner here, by name or position.
      role: accounting
      type: int
    - name: failingIds
      # THIS model's datums that are off, as ids - what a QA check selects.
      # Never a linked element (FRAGMENT-ISSUES row 75).
      role: result
      type: IList<ElementId>
    - name: failingElements
      # The same datums as elements. The retired card called this `elements`;
      # on this card `elements` is the levels, bottom to top (version 4), so
      # it carries this name instead.
      role: result
      type: IList<Element>
    - name: linkUsed
      # The link placement(s) compared against, by full name, "; " between.
      # Empty when nothing was compared (D-52).
      role: accounting
      type: string
    - name: refused
      # Why NO link datum was compared - no link, a name matching none or
      # two, not loaded, a file placed more than once with no copy named
      # (D-207), a tolerance nothing meets. The level heights above are
      # still answered. Null when the check ran or was not asked for (D-52).
      role: accounting
      type: string
    - name: monitored
      # Version 7, new. Every level and grid HERE that copy-monitors a link
      # element, with the link placement it watches - read from this model
      # alone, on every run - after one line counting this model's levels,
      # grids and monitored datums. Never a bare empty list.
      role: accounting
      type: IList<string>

proof:
  date: '2026-09-13'
  by: Ajmal PS
  model: >
    Snowdon Towers Sample HVAC.rvt (9,628 elements) and Project1 (3,410 elements, unsaved default template), both open at once in Revit 2024.3
  positive_case: >
    Snowdon Towers: 11 levels, surveyOffset 780.5 mm, surveyOffsetKnown true, atRisk true - the model IS one where Elevation and Project Elevation can diverge, and it says so - while worstDifference 0 and typesDisagree false show none of them actually does.
  negative_case: >
    Project1: 2 levels, surveyOffset 0, atRisk false, worstDifference 0. A model with no survey offset is reported as not at risk rather than flagged anyway, which is what makes the Snowdon flag mean something.
  second_route: >
    LIST_LEVELS read the same 11 and 2 levels by a different route in the same run, and Revit's own survey point can be read on screen.
  fingerprint: "96aeb0417c7e41bc"

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Level.Elevation`,
  `Level.ProjectElevation`, `BasePoint.Position` and `BasePoint.SharedPosition`
  are unchanged 2020 to 2027, and `LEVEL_RELATIVE_BASE_TYPE` is present on all
  of them. Version 3's members were looked up in every release's reference
  assemblies on 2026-10-04: `LEVEL_IS_BUILDING_STORY`, `FAMILY_LEVEL_PARAM`,
  `RBS_START_LEVEL_PARAM`, `Parameter.AsInteger` and `Category.CategoryType`
  are present 2020 to 2027. Version 7's check is CHECK_DATUMS_AGAINST_LINK's,
  whose members - RevitLinkInstance.GetLinkDocument, Instance.GetTotalTransform,
  RevitLinkType.IsNestedLink, Transform.OfPoint, OfVector and BasisZ,
  Grid.Curve, MultiSegmentGrid.GetGridIds and the static
  MultiSegmentGrid.GetMultiSegementGridId (Revit's own spelling), Line and Arc -
  were read on all eight releases on 2026-11-17; and
  Element.IsMonitoringLinkElement and Element.GetMonitoredLinkElementIds (which
  gives the LINK INSTANCE ids, not the linked elements) are present 2020 to
  2027 (tools/api-surface --members Element, 2026-11-26). Heights are handed on in Revit's internal feet, not millimetres -
  D-20 keeps the conversion at the edge where the user is, and this fragment is
  about which of two numbers to use rather than about units.

# ROUTING - the same rows are in the fragments named here.
#
#   "what elevation is each level at" -> here
#   "report the areas in this model"  -> REPORT_AREAS. AREA elements, per
#                                        scheme - that sentence resolved HERE
#                                        until 2026-09-05, and a list of level
#                                        heights is not a floor area
#   "list the levels"                 -> here since version 4 - the levels
#                                        themselves, bottom to top, and whether
#                                        their heights can be trusted
#   "how many levels" / "what levels do we have" -> here
#   "what level is this duct on"      -> READ_ELEMENT_LEVEL - the level of an
#                                        ELEMENT, a different question with the
#                                        same words in it
#   "move these to level 3"           -> SET_ELEMENT_LEVEL
#   "add a level"                     -> CREATE_LEVELS
#   "sort the schedule by level"      -> SET_SCHEDULE_SORT_GROUP - the order of
#                                        rows in a table, not the levels
#   "filter the schedule to level 2"  -> SET_SCHEDULE_FILTERS
#   "turn the level heads on"         -> SET_DATUM_BUBBLES
#   "where exactly is this"           -> REPORT_LOCATION - an ELEMENT's
#                                        position, internal or shared; this
#                                        fragment is about LEVELS
#   "check our grids and levels line up with the linked architect's model"
#                                     -> here since version 7 (2026-11-26) -
#                                        CHECK_DATUMS_AGAINST_LINK's until it
#                                        was merged in (row 5b-1878 (C))
#   "list the grids"                  -> LIST_GRIDS - the grids themselves in
#                                        drawing order, for the next step; this
#                                        card checks them against a link
#   "check the links against our shared coordinates"
#                                     -> CHECK_LINK_COORDINATES - where a link
#                                        sits by the survey, not whether its
#                                        datums meet ours
#   "bring the grids in from the architect"
#                                     -> COPY_ELEMENTS_BETWEEN_DOCUMENTS,
#                                        fromLink - a write; this card copies
#                                        nothing, and copy-monitoring is set up
#                                        in Revit's own Copy/Monitor tool
#   "what levels are in this model"   -> here. On the ranked routes it was
#                                        REMOVE_MASS_FLOORS's before
#                                        2026-11-17 and
#                                        CHECK_DATUMS_AGAINST_LINK's from then
#                                        until that card was merged in
#
# Version 3's Building Story report has NO utterance of its own yet: no
# modeller has asked for it in words, and none is invented.
#
# LIST_LEVELS WAS MERGED INTO THIS CARD on 2026-11-01, on the owner's
# instruction ("make sure there is no duplicate tools"), and is DEPRECATED.
# Its outputs, here now: `elements`, `elevationsMm`, `findings`,
# `linksSearched` and `linkedMatches` under the same names; sorted by height
# as it was. ITS READING OF THE TWO HEIGHTS IS NOT CARRIED, BECAUSE IT WAS
# INVERTED: it called Elevation "from the internal origin" and ProjectElevation
# "the level head", the opposite of RevitAPI.xml (ProjectElevation is relative
# to the project origin) and of this card - row 5b-180, which recorded the
# disagreement and left it open. So `elevationsMm` here is the level head by
# this card's reading, Elevation, and `projectElevationsMm` the project
# origin's; on a model whose base was never moved they are the same numbers
# LIST_LEVELS gave. Its link lines are this card's: each linked level carried
# into this model's space and set against this model's level of the same name,
# with its own level head beside it.

# CHECK_DATUMS_AGAINST_LINK WAS MERGED INTO THIS CARD on 2026-11-26 (row
# 5b-1878 (C), issue #1088), on the owner's words: "2 tools are there for the
# same purpose, level checking or datum checking. Levels or grids - 3 types are
# there: one is in the model, one is in the linked model, another is
# copy-monitored level or grid. If you can add all in one tool that is better,
# so with one tool all can cover." It is DEPRECATED. Its outputs, here now
# under the same names: `report` (one more column, `against`, the placement
# each row was measured against), `failures`, `aligned`, `compared`,
# `notChecked`, `hostOnly`, `linkOnly`, `failingIds`, `linkUsed` (every
# placement read, "; " between), `refused` and its lines at the end of
# `findings`; its `elements` is `failingElements` here, because this card's
# `elements` is the levels. Its four inputs are here under their names.
#
# NOT CARRIED, AND WHY. (1) Its `linkName` left out read "only" and checked
# the one link with nothing asked; here nothing is read from a link unless
# `includeLinks` is set or a link is named - this card's D-59 rule, the safer
# of the two, and the one its own proof measured. Asked as a check against a
# link, the host sets `includeLinks` or names it. (2) Its refusal of two
# DIFFERENT linked files with none named: here each file placed once is
# checked, as this card's `includeLinks` read every link - only a file placed
# more than once waits for its copy to be named (D-207). Version 6's first
# placement is gone with it.
#
# THE THIRD KIND IS NEW: copy-monitored levels and grids were in neither card.
#
# D-204 STILL APPLIES WHERE IT DID. Its by-hand reading was given for this
# card because no input can make its answer come back empty - `storeys` is
# written on every branch. From version 8 a document with NO levels leaves it
# empty (row 5b-2070); in any model that has levels it is still written, so
# the level heights and the storeys line are signed on the reading D-204
# describes (the
# storeys line read against Manage > Levels). The link check now has an empty
# leg of its own - toleranceMm 5 on a link 3 mm off gives failures 0 and
# failingIds empty - so that part of version 7's proof is a recorded run, as
# D-30 asks, not a reading.
utterances:
  - can I trust the level heights on this model
  - what elevation is each level at
  - list the levels and their heights
  - is this model on a survey offset
  # ADDED 2026-11-23 (row 5b-1984, issue #1127): since CREATE_LEVELS' label
  # became revit.datums, "what datums are in this project" reached that write
  # on both re-ranked backends. Inside the eight the re-ranker reads (D-134);
  # "why are my heights wrong", ninth now, is declared and still reached by
  # identity.
  - what datums do we have
  # MOVED 2026-11-01 from LIST_LEVELS, merged into this card.
  - list the levels
  - how many levels
  # These two were fifth and sixth until 2026-11-23 (row 5b-1984); the merged
  # LIST_LEVELS lines go on below them.
  - check the project base point
  - why are my heights wrong
  - what levels do we have
  - show me the levels
  - what are the floor levels
  - level heights
  - what levels are in this model
  # ADDED 2026-11-20, row 132 (GitHub issue #959). The ifc-export-readiness
  # skill's own sentence: this read reports each level's Building Story
  # (LEVEL_IS_BUILDING_STORY), and the sentence reached CREATE_LEVELS, a

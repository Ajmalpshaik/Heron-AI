id: FRG-MEP-049
semantic-identity: "which pipe schedules this project has, and which segments are using each"
kind: action
domain: revit.mep
capability: REPORT_PIPE_SCHEDULES
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Lists every pipe schedule in the project and names the segments using each
  one. The question "is this schedule still needed" - asked before anybody
  removes one.

  **IT EXISTS BECAUSE CREATE_PIPE_SEGMENT MAKES SCHEDULES.** Revit keys a
  segment by its material AND its schedule together and refuses a pair already
  in use, so a second copper segment forces a NEW schedule into the project.
  That schedule outlives the segment: delete the segment and the schedule
  stays, in Revit's own settings, belonging to nothing. Making a thing nothing
  can list or remove is a gap, and this closes it.

  **NOTHING ELSE IN THE LIBRARY CAN REACH ONE.** A PipeScheduleType is an
  ElementType with NO CATEGORY, so SELECT_BY_CATEGORY_NAME and SELECT_TYPES
  both refuse it - correctly, since they are told to name a category and there
  is none. It never appears in a view either, so it cannot be clicked. Naming
  it here is the only route to one.

  **WHICH SEGMENTS USE IT IS THE WHOLE POINT.** A schedule still in use cannot
  be removed without taking a segment with it, and Revit does not warn first.
  Reporting the users by name turns "can I delete this" from a guess into a
  reading.

  **AN UNUSED SCHEDULE IS A REAL ANSWER, NOT AN EMPTY ONE.** `unused` is the
  finding somebody is asking for, so it is a result rather than a count of
  nothing found (D-52).

  Changes nothing and opens no transaction.

contract:
  needs:
    - name: doc
      type: Document
    # Narrows to schedules whose name contains this. An EXACT name beats a
    # prefix, so naming one schedule cannot also return a longer one.
    - name: nameContains
      type: string
      source: request
  provides:
    # The schedules themselves, so the answer can be ACTED on - nothing else
    # can select one. See the purpose.
    - name: elements
      role: result
      type: IList<Element>
    - name: scheduleCount
      role: result
      type: int
    - name: scheduleList
      # Every matching schedule and its users, on ONE line. A string rather
      # than a list, because a list is abbreviated to three entries before a
      # reader sees it.
      role: result
      type: string
    - name: unused
      # Schedules no segment uses - the ones that can be removed. A finding in
      # its own right, never a count of nothing.
      role: result
      type: IList<string>
    - name: scanned
      # How many schedules were examined before narrowing. Work DONE, never a
      # thing found (D-52).
      role: accounting
      type: int
    - name: findings
      type: IList<string>


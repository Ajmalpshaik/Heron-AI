revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `PipeScheduleType`, `PipeSegment` and
  `PipeSegment.ScheduleTypeId` are present 2020 through 2027, confirmed by
  reflection on the 2020 assembly on 2026-09-15. No unit is read or converted
  here at all, so the 2021 units move cannot reach it.

# ROUTING - repeated in REPORT_PIPE_SEGMENTS and CREATE_PIPE_SEGMENT.
#
#   "what pipe schedules are there"   -> here
#   "can I delete this schedule"      -> here; it names the segments using it
#   "what pipe segments do we have"   -> REPORT_PIPE_SEGMENTS
#   "make a new segment"              -> CREATE_PIPE_SEGMENT, which may add one

utterances:
  - what pipe schedules do we have
  - list the pipe schedules
  - is this schedule still used
  - which segments use this schedule
  - can I delete this pipe schedule

heron-step: 14
heron-status: DRAFT
heron-since: 0.1.0
heron-layer: brain

id: FRG-GEO-001
semantic-identity: "the shape, area and height of one room or space"
kind: action
domain: revit.geometry
capability: READ_ROOM_GEOMETRY
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Reads the outline, area and height of one Room or Space, so a layout job has
  something real to lay out inside. It is the first step of every "how many fit
  in here, and where" question - air terminals, sprinkler heads, detectors.

  KIND: `action`, NOT `filter`, and the distinction is D-29's rather than a
  convenience. A filter answers *which elements*. This answers *what is true of
  this one*, which is the shape `read-element-parameters` already has.

  It was written as a filter first, and the orphan check reported it as one
  nothing can consume. That report was right about the fact and wrong about the
  cause: nothing consumes it because what it produces is consumed by the
  CALLER, not by another fragment. Turning an outline and a spacing into a list
  of points is arithmetic, and arithmetic between two Revit calls belongs to the
  Orchestrator - which is the host (D-01, docs/02 s4), not this library. The
  label was corrected; the composition was never the problem.

  It reports `unbounded` and `heightKnown` as separate facts rather than folding
  either into a zero. An unbounded room returns an area of 0 from Revit, and a
  layout that trusts that number places nothing and reports success.

  **IT DOES NOT MEASURE THE ROOM, AND IT USED TO CLAIM THE SENTENCES THAT ASK
  IT TO.** This hands back an outline for something else to lay out inside:

  | What you meant | Use |
  |---|---|
  | "how many fit in here", "lay them out in this space" | **this fragment** |
  | "how big is this room", "what are the room sizes" | `MEASURE_ROOM_DIMENSIONS` |

  It carried *"how big is this room"* and *"what is the room size"* until
  `MEASURE_ROOM_DIMENSIONS` existed, and answering those with a list of curves
  was never what they meant. They moved because the other fragment is genuinely
  the better answer - not to buy back a rank, which is the one move
  `brain/retrieval-history.md` rules out.

contract:
  needs:
    - name: room
      type: SpatialElement
      source: request
  provides:
    - name: boundary
      type: IList<Curve>
    - name: area
      type: double
    - name: height
      type: double
    - name: unbounded
      type: bool
    - name: heightKnown
      type: bool

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `SpatialElement` is the shared base of
  Room and Space, so one fragment serves both, and `GetBoundarySegments` with
  `SpatialElementBoundaryOptions` is unchanged 2020 to 2027. Area and height
  come back in Revit's internal feet and are handed on in feet - converting
  here would be a second place that knows about millimetres, and D-20 keeps
  that conversion at the edge where the user is.

# ROUTING - repeated in PLACE_ROOMS and FILTER_ELEMENTS_IN_ROOM.
#
#   "how big is this room"       -> here
#   "what is the room area"      -> here
#   "place the rooms"            -> PLACE_ROOMS - it needs them to EXIST first,
#                                   and this reads rooms that already do
#   "add spaces to this level"   -> PLACE_ROOMS, with spaces asked for
#   "which ducts are in room 5"  -> FILTER_ELEMENTS_IN_ROOM
#   "what is the heating load"   -> READ_SPACE_LOADS. Area and volume are a
#                                   shape; a load is an analysis result, and
#                                   only a Space carries one

utterances:
  - the ceiling height in here
  - how many fit in this room
  - lay them out in this space
  - the shape of the room

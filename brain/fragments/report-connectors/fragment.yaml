id: FRG-MEP-036
semantic-identity: "what connectors are on this thing, where they point, what is really plugged into them, and whether it matches - size, shape and domain"
kind: action
domain: revit.mep
capability: REPORT_CONNECTORS
# VERSION 3 (2026-11-01): CHECK_EQUIPMENT_CONNECTORS was merged into this card
# on the owner's instruction and is DEPRECATED - every joint on a placed
# family is now GRADED as well as described: `mismatched`,
# `unconnectedSpigots` and `findings`, sizes within `sizeTolerance`. See the
# merge block above `utterances`. DRAFT until version 3 is proved (D-30); the
# version 2 proof below is kept as the record of what was run.
version: 3
source: OFFICIAL
risk: READ

purpose: >
  Lists every MEP connector on the given elements - domain and, on a duct or
  pipe connector, its system classification (Supply Air, Return Air and the
  rest), shape, size, where it sits and which way it faces - and, for each
  one, the elements REALLY joined to it. Read-only.

  **THE WHOLE LIST ALSO COMES BACK AS ONE LINE OF TEXT**, `connectorSummary`,
  because a chat is sent only how many entries a dictionary holds: through a
  chat this answered `connectorFacts 1 entry(ies)` and nothing else (Project1,
  Revit 2024, 2026-09-23). It stops after 50 connectors, at a whole element,
  and says how many it left out.

  **`IsConnected` IS AN INTENT FLAG, NOT A FACT, AND IT HAS BEEN WRONG IN A
  REAL MODEL.** A connector can report `true` with nothing physically joined to
  it, and a run traced from that flag comes back complete while the air stops
  at a gap. So the flag is read and reported, and it is never what decides:
  the partners come from walking `AllRefs` and keeping only refs owned by
  ANOTHER element. Where the two disagree the element is named in
  `flagDisagrees`, which is the finding, not a footnote.

  **A SYSTEM IS NOT A PARTNER.** `AllRefs` also carries the logical MEP system
  the connector belongs to. Counting that as a connection makes every connector
  on a named system look joined, which is the exact failure the flag already
  causes - so refs owned by an `MEPSystem`, and refs back to the element
  itself, are dropped before anything is counted.

  **IT IS THE LOOK BEFORE THE DRAW.** Before a duct can be run off a spigot,
  four things have to be known and only one of them is in a schedule: is there
  a connector, what domain and size is it, which way does it face, and is it
  already taken. That is this fragment, and the direction is why it exists in
  geometry rather than as a count - a spigot facing into the wall is a
  different job from one facing the corridor.

  Positions and sizes are handed on in Revit's internal feet, not millimetres
  (D-20 keeps the conversion at the edge, where the user is).

  **VERSION 3 (2026-11-01): EVERY JOINT ON A PLACED FAMILY IS GRADED TOO** -
  CHECK_EQUIPMENT_CONNECTORS's job, merged here. On each family instance -
  equipment, terminal, fixture, fitting - every connector is compared with
  what is really joined to it: the *"the AHU has a 600x400 supply spigot and
  somebody ran 400x300 off it"* defect, which Revit builds with a transition
  and nobody sees until the airflow does not arrive. A pipe on a duct spigot
  is a DOMAIN MISMATCH, its own class - usually the wrong family was placed; a
  round-to-rectangular joint is a SHAPE CHANGE, said rather than measured;
  same shape is compared diameter to diameter, or width and height, within
  `sizeTolerance` in millimetres. `mismatched` names each element with a
  domain or size mismatch; `unconnectedSpigots` counts the spigots with
  nothing physically plugged in - usually the bigger finding, a gap no clash
  test and no connectivity walk flags. Sizes are what the FAMILY declares, and
  `findings` says so: check the first unit of each type against its datasheet
  once. The partner is the physical one the description uses - never the
  logical system, never the flag - which that card's grading did not do.

  ASSUMES NOTHING ABOUT TRANSACTIONS - it opens none and needs none.

contract:
  needs:
    - name: elements
      type: IList<Element>
    # VERSION 3, from CHECK_EQUIPMENT_CONNECTORS: how far apart, in
    # MILLIMETRES, a spigot and what is joined to it may be before the joint is
    # a SIZE MISMATCH - per dimension, diameter or width and height. Converted
    # to feet inside (D-71). Left out it binds 0: compared exactly. A negative
    # one grades no size at all and says so.
    - name: sizeTolerance
      type: double
      source: request
      optional: true
      absent: 0
  provides:
    - name: connectorFacts
      role: result
      type: IDictionary<ElementId, IList<string>>
    - name: connections
      role: result
      type: IDictionary<ElementId, IList<ElementId>>
    - name: openConnectors
      role: result
      type: IDictionary<ElementId, int>
    - name: flagDisagrees
      # Connectors whose IsConnected flag does not match what is physically
      # joined. ISCONNECTED IS AN INTENT FLAG, NOT A FACT, AND IT HAS BEEN
      # WRONG IN A REAL MODEL - a run traced from it comes back complete while
      # the air stops at a gap.
      role: result
      type: IList<ElementId>
    - name: connectorSummary
      # Every line of `connectorFacts`, element by element, as ONE string. A
      # reply prints a dictionary as its size alone, so through a chat the
      # three above arrived as `1 entry(ies)` each and the connectors
      # themselves never arrived at all (Project1, Revit 2024, 2026-09-23).
      # A RESULT, and EMPTY when nothing had a connector: an empty string is
      # what the proving tool reads as nothing found, where any sentence is a
      # shape it cannot count. Stops after 50 connectors, at a whole element,
      # and its last part says how many it left out (D-26).
      role: result
      type: string
    - name: noConnectors
      # Elements with no connectors to list, so it could not be reported on.
      # The evidence it looked, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: mismatched
      # VERSION 3, from CHECK_EQUIPMENT_CONNECTORS: each placed family with a
      # joint that is a DOMAIN MISMATCH or a SIZE MISMATCH beyond
      # `sizeTolerance`, once. A SHAPE CHANGE is said in `findings` and not
      # counted here - a transition there may be right.
      role: result
      type: IList<ElementId>
    - name: unconnectedSpigots
      # VERSION 3, from CHECK_EQUIPMENT_CONNECTORS: spigots on placed families
      # with NOTHING PHYSICALLY PLUGGED IN - decided by the partners, never by
      # IsConnected. Usually the bigger finding: a gap no clash test and no
      # connectivity walk will flag, because the system that IS connected
      # traces perfectly. A duct's or pipe's own open end is in
      # `openConnectors`, not here.
      role: result
      type: int
    - name: findings
      # VERSION 3: the grading in sentences, millimetres - the summary first,
      # with the warning that every size is what the FAMILY declares, then each
      # NOTHING PLUGGED IN, DOMAIN MISMATCH, SHAPE CHANGE and SIZE MISMATCH, and
      # each element that is not a placed family or has no MEP model. Stops
      # after 100 sentences and says how many it left out (D-26).
      type: IList<string>


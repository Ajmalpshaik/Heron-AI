compatibility-note: >
  One implementation for every release. `ConnectorManager`, `Connector.AllRefs`,
  `Domain`, `Shape`, `Origin` and `CoordinateSystem` are unchanged 2020 to 2027,
  and so are `DuctSystemType` and `PipeSystemType` - each documented, on every
  release, as throwing InvalidOperationException on a connector whose domain is
  not its own, so each is read only inside its own domain and guarded there.
  The size properties are the version-independent risk instead: `Radius` is only
  there on a round connector and `Width`/`Height` only on a rectangular one, and
  the wrong one THROWS rather than returning zero - on every release. Each is
  guarded, and an electrical connector, which has no profile at all, is reported
  with its domain and no size rather than being dropped.
  Version 3's grading adds nothing new to the API surface: it reads the same
  `Connector.Shape`, `Radius`, `Width`, `Height`, `Domain`, `AllRefs` and
  `Owner`, and `FamilyInstance.MEPModel`, that CHECK_EQUIPMENT_CONNECTORS read
  on all eight releases. `Domain.DomainStructuralAnalytical` is still not
  named - it arrives after 2020. `sizeTolerance` arrives in millimetres and is
  divided by 304.8 in the code (D-71).

# BACK TO DRAFT ON 2026-09-23, AND THE PROOF ABOVE WAS KEPT AS THE RECORD
# OF WHAT WAS RUN.
#
# The proof was taken on the code as it stood. The code then changed: every
# connector line now carries its duct or pipe system type after the domain -
# "DomainHvac SupplyAir" - and `connectorSummary` was added, the whole answer
# as one string, because through a chat the three dictionaries arrived as
# counts and the connectors never arrived at all. Nothing that proof recorded
# was contradicted, but it described code that no longer ran, so its
# fingerprint no longer matched, and it was NOT to be re-stamped: re-taking it
# on a named model was the only thing that would make this PROVEN again (D-30).
# NEEDS-CHECKING AM1 says what to arrange, and
# tools/jobs/report-connectors-project1-2026-09-23.yaml is that arrangement.
# FRAGMENT-ISSUES 5b-195.

# ROUTING - the same rows are in the fragments named here.
#
#   "what connectors does this have"      -> here. The inventory, with
#                                            direction and size, before
#                                            anything is drawn
#   "which spigots are open"              -> here - `openConnectors`, and on a
#                                            placed family `unconnectedSpigots`
#   "does what is plugged in MATCH the    -> here since version 3 - it judges
#    equipment"                              size, shape and domain against the
#                                            partner: `mismatched`.
#                                            CHECK_EQUIPMENT_CONNECTORS until
#                                            2026-11-01
#   "are the equipment connectors the     -> here, `sizeTolerance` in mm
#    right size for the duct"
#   "what flow is on the connectors"      -> REPORT_CONNECTOR_LOADS - the
#                                            numbers the connector CARRIES,
#                                            not its geometry
#   "what is connected to what"           -> TRACE_CONNECTIVITY, which walks
#                                            the whole run. This stops at one
#                                            element's own partners
#   "where does the system stop"          -> FIND_DEAD_ENDS
#   "narrow this set to the connected     -> SELECT_BY_CONNECTION_STATUS,
#    ones"                                   which hands on a set to act on
#                                            rather than describing each one
#   "is this connector supply or return"  -> here, a read. By words alone
#                                            LINK_FAMILY_PARAMETER ranks
#                                            first, a writer in a family;
#                                            the identity route keeps it
#                                            here (measured 2026-09-28)
#   "join these open ends up"             -> CONNECT_OPEN_ENDS - a WRITE
#
# VERSION 3 (2026-11-01) - CHECK_EQUIPMENT_CONNECTORS WAS MERGED INTO THIS CARD
# on the owner's instruction in conversation: "make sure there is no duplicate
# tools", "merge means ... all area need to be covered", every conflict to keep
# the safer rule. It is DEPRECATED, never deleted. Where each of its inputs and
# outputs is now:
#
#   CHECK_EQUIPMENT_CONNECTORS          here
#     equipment                         elements - any element; only a placed
#                                       family is graded
#     sizeTolerance (mm)                sizeTolerance (mm), now optional - left
#                                       out, compared exactly
#     findings                          findings - the same sentences, the
#                                       summary first
#     mismatched                        mismatched - each element once
#     unconnectedSpigots                unconnectedSpigots
#
# THE SAFER RULE WHERE THEY DIFFERED - this card's. That card took the first
# ref in AllRefs not owned by the unit as the partner, so the logical MEPSystem
# could be graded as the duct on the other side, and it trusted IsConnected to
# say a spigot was plugged in. Here the MEPSystem and the element itself are
# dropped before anything is graded, and a spigot with no physical partner is
# NOTHING PLUGGED IN whatever the flag says. Two narrower changes, neither an
# opposite rule: a connector with no profile (electrical) is graded on domain
# only, where that card read its unreadable shape as a SHAPE CHANGE; and an
# element is named in `mismatched` once, where that card added it once per
# bad joint.

# JUDGED 2026-11-01 (a duplicate sweep's look-alike, on the owner's rule "if one
# tool can safely do both, merge") AGAINST REPORT_CONNECTOR_LOADS AND KEPT APART -
# the next sweep should not reopen it unless one of these stops being true:
#   - THE SAME CONNECTORS, A DIFFERENT QUESTION AND A DIFFERENT FINDING. This
#     reads the geometry and the real partners (open ends, flag disagreements,
#     a mismatched size); that reads the values a connector CARRIES and splits
#     the zero that is a hole in the model from the zero that is normal. No
#     field is read by both. See the same block on that card.

utterances:
  - what connectors does this AHU have
  - which spigots are open
  - which way is the connector facing
  - show me the connectors on these
  - is anything connected to this
  - what size is the spigot
  - report the connectors
  - is this connector supply or return
  # MOVED 2026-11-01 from CHECK_EQUIPMENT_CONNECTORS, merged into this card.
  - are the equipment connectors the right size for the duct
  - check the spigots on this AHU
  - which connectors on this unit are not used
  - does the duct match the equipment connection
  - check the equipment connectors

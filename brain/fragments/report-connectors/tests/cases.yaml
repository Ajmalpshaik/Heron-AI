# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: a piece of mechanical equipment with four spigots, two of them ducted
    expect: >
      four lines in `connectorFacts`, two element ids in `connections`, and
      `openConnectors` = 2. Count the spigots on the family in Revit before
      trusting the number - a connector that is in the family but not in the
      report means the MEP model was not reached

  - given: a straight duct joined at both ends
    expect: >
      two connectors, both joined, `openConnectors` = 0. Its two partners are
      the fittings either side, not the ducts beyond them

  - given: a round duct
    expect: >
      "radius ... ft" in the fact line and no width or height. Multiply by two
      and compare against the duct's Diameter in Revit; if it disagrees, the
      wrong profile branch was taken

  - given: an air terminal with one connector facing down
    expect: >
      facing near (0, 0, -1). The direction is the whole reason this is read
      from geometry rather than from a schedule

  - given: a supply diffuser and a return grille, or an AHU with both
    expect: >
      "DomainHvac SupplyAir" opening the supply connector's line and
      "DomainHvac ReturnAir" the return's. Compare each against the connector's
      System Classification in Revit - an OPEN connector read SupplyAir in
      Project1 on 2026-09-23, though the API documents an unconnected
      connector's system type as undefined

  - given: a plumbing fixture, or a pipe
    expect: >
      "DomainPiping" followed by its pipe system type - DomesticColdWater,
      Sanitary and the like - and never a duct system type. Asking a piping
      connector for its duct system type throws, which is why each is asked
      only inside its own domain

  - given: a straight duct with one end open
    expect: >
      whatever its open end says, recorded as it came. NOT YET READ ON A REAL
      MODEL: the API calls an unconnected connector's system type undefined,
      so `UndefinedSystemType` there would be Revit's answer rather than a
      fault. The joined end should carry the run's own system

  - given: any selection with connectors
    expect: >
      `connectorSummary` carrying every line of `connectorFacts`, element by
      element in the order the elements were handed in, each as "element <id>:"
      and its lines, the elements joined by "  ||  ". Through a chat it prints
      whole, where the dictionaries print only how many entries they hold

  # VERSION 3 (2026-11-01), CHECK_EQUIPMENT_CONNECTORS's grading. Each of these
  # FAILS on version 2, which has no `mismatched`, no `unconnectedSpigots` and
  # no grading sentence at all.
  - given: an AHU with a 600x400 supply spigot and a 400x300 duct on it, sizeTolerance 0
    expect: >
      the AHU's id in `mismatched` and a SIZE MISMATCH sentence with both
      dimensions out - 200 mm wide, 100 mm high - CHECKED by selecting the duct
      and reading its size, because Revit builds the joint with a transition
      and nothing looks wrong

  - given: the same AHU and duct, sizeTolerance 250
    expect: >
      `mismatched` EMPTY and no SIZE MISMATCH sentence - the tolerance is in
      millimetres and is read. The same answer at 0 and 250 is the defect
      recorded against the retired card (FRAGMENT-ISSUES 3c, 3i)

  - given: an AHU with four connectors, two joined to nothing
    expect: >
      `unconnectedSpigots` 2 and both listed NOTHING PLUGGED IN. No clash test
      flags this, and the services that ARE connected trace perfectly

  - given: a round 300 mm spigot onto a round 300 mm duct, sizeTolerance left out
    expect: >
      nothing reported for that joint - left out, the tolerance binds 0 and
      equal sizes compare equal

  - given: an AHU whose supply connector belongs to a named Supply Air system and is joined to nothing
    expect: >
      NOTHING PLUGGED IN, counted in `unconnectedSpigots`, and NOT graded
      against anything. The system ref in AllRefs is not a duct: the retired
      card took it as the partner and graded the joint against the system

negative:
  - given: a connector whose `IsConnected` is true with nothing physically joined
    expect: >
      the element id in `flagDisagrees`, `connections` for it EMPTY, and the
      connector counted as OPEN. This case is why the fragment exists: a run
      traced from the flag reads complete while the air stops at the gap

  - given: an element whose connector belongs to a named MEP system but is joined to nothing
    expect: >
      OPEN, and no partner. The system ref in `AllRefs` must not be counted -
      if it is, every connector on a named system reads as connected and the
      report is worthless

  - given: a wall, or any element with no MEP model at all
    expect: >
      its id in `noConnectors` and no entry in `connectorFacts`. Not a failure,
      a fact about the element - and the rest of the set must still be reported

  - given: a selection with no connector anywhere in it - walls, spaces
    expect: >
      `connectorSummary` EMPTY, an empty string and not a sentence saying so.
      The proving tool reads any sentence as a shape it cannot count, so a note
      there would fail the negative leg of a correct answer

  - given: an ELECTRICAL connector, which has no profile and throws on Shape
    expect: >
      a line carrying its domain, origin and direction with the size reported
      as unavailable, and nothing after the domain - no system word, and no
      throw from asking for one. A dropped connector would read as equipment
      having fewer connections than it has

  - given: a selection holding more than 50 connectors
    expect: >
      `connectorSummary` stopping at a whole element - the first one in full
      whatever its count - and ending "N more element(s) with M connector(s)
      not listed here - select fewer to see them", where N plus the elements
      listed is the number of entries in `connectorFacts`. Every element keeps
      its entry there; only the one string stops (D-26)

  - given: a mixed set of ducts, equipment and walls
    expect: >
      no throw, every element accounted for in exactly one of the outputs. One
      element that cannot be read must not lose the rest

  # VERSION 3 (2026-11-01), CHECK_EQUIPMENT_CONNECTORS's negatives. Each FAILS
  # on version 2, which grades nothing.
  - given: a round spigot joined to a rectangular duct
    expect: >
      SHAPE CHANGE, NOT a size comparison, and the unit NOT in `mismatched`. A
      round connector reports a radius and a rectangular one width and height;
      comparing them as one number is how this kind of check produces confident
      nonsense

  - given: a pipe joined to a duct connector
    expect: >
      DOMAIN MISMATCH, its own sentence, and the unit in `mismatched`. It is
      not a tolerance problem and must not be filed with the size findings

  - given: a Generic Model being used as equipment
    expect: >
      its id in `noConnectors` and "no MEP model at all" in `findings` - it can
      never join a system, which is a different finding from a size being wrong

  - given: an equipment family whose connectors were authored at the wrong size
    expect: >
      everything reported as matching, AND the first sentence of `findings`
      warning that sizes are what the family declares. The fragment cannot
      detect this and must say so

  - given: a joint through a transition fitting
    expect: >
      compared against the FITTING, which is what is physically bolted to the
      spigot. The transition's far side is a separate joint

  - given: a spigot whose IsConnected flag is true with nothing physically joined
    expect: >
      NOTHING PLUGGED IN "though its IsConnected flag says joined", counted in
      `unconnectedSpigots` - never graded as joined

  - given: a lighting fixture's electrical connector joined to a circuit
    expect: >
      no SHAPE CHANGE - an electrical connector has no profile, so it is graded
      on its domain alone

  - given: sizeTolerance -5
    expect: >
      no SIZE MISMATCH at all and the summary saying NO SIZE WAS GRADED, rather
      than every joint called a mismatch; domains and shapes still graded

second_route:
  - >
    open the element in Revit, click the connector and read the properties
    palette - domain, size and the direction arrow on screen. Revit's own
    display is the second route, not another script
  - >
    version 3's grading: select the equipment, hover a connector, and read its
    size against the duct joined to it - CHECK_EQUIPMENT_CONNECTORS's second
    route, carried here

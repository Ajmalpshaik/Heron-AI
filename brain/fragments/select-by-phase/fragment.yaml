id: FRG-SEL-005
semantic-identity: "the elements created in one phase, or demolished in one"
kind: filter
domain: revit.selection
capability: SELECT_BY_PHASE
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Narrows the model to the elements whose Phase Created, or Phase Demolished,
  is one named project phase - "everything added in Phase 2", "what is coming
  out in Phase 1" - optionally bounded to a list of categories. Both may be
  asked at once, and then both must hold.

  **MOST OF A MODEL HAS NO PHASING AT ALL, and that is counted rather than
  dropped.** Levels, grids, views, sheets, view-specific annotation and every
  element type carry no phase parameters. The obvious code swallows them in a
  try/catch and reports only the matches, so a broken phase lookup and a
  correct small answer read identically. This reports `withoutPhasing`
  alongside, exactly as FILTER_ELEMENTS_BY_CATEGORY reports `unresolvedLevel`
  and for the same reason: a thing that does nothing must never be able to look
  like a thing that worked.

  **Phase is read from `CreatedPhaseId` and `DemolishedPhaseId`, and those were
  checked on 2020 rather than assumed.** The obvious guess is that a property
  pair this readable arrived later than 2020 and that the two phase
  BuiltInParameters are the safe route; a compile on both ends of the range
  says otherwise, and the guess would have put a false sentence in this file.

  **"Demolished in Phase 1" is not "demolished".** An element that is never
  demolished has no demolition phase at all, so asking for a named one answers
  a narrower question than it sounds like. Say which phase, or ask a different
  question.

  **A phase name that does not exist is refused, with the real names listed.**
  Revit's default phases are "Existing" and "New Construction" and almost every
  office renames them; a typo must not come back as an empty phase.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, every loaded link is read too and
  `linksSearched` says how many were: set and 0 means "you asked, and none
  are loaded", which is a different answer from host-only. Each link is asked for the phases BY NAME and
  its matches are counted per link in `linkedMatches`, or the link says it
  has no phase of that name.
  **NOTHING FROM A LINK IS EVER SELECTED OR CARRIED** - `elements` stays this model's own; the chain
  revives ids against this model, and a linked id that happens to be in
  use here binds an unrelated element (FRAGMENT-ISSUES row 75). Links
  nested inside a link are not read, and are counted in the answer. This
  is version 2; version 1's proof no longer describes the code, and the
  fragment is DRAFT until it is proved again.

contract:
  needs:
    - name: doc
      type: Document
    - name: createdPhaseName
      type: string
      source: request
    - name: demolishedPhaseName
      type: string
      source: request
    - name: categories
      type: IList<BuiltInCategory>
      source: request
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: withoutPhasing
      # Elements with no phase parameters at all, which is most of a model.
      # Counted so a thing that does nothing cannot look like a thing that
      # worked - never a match it found (D-52).
      role: accounting
      type: int
    - name: findings
      type: IList<string>
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then one line per link. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75).
      role: accounting
      type: IList<string>


tests: tests/

compatibility-note: >
  One implementation for every release. `Element.CreatedPhaseId`,
  `Element.DemolishedPhaseId` and the `Phase` class are present 2020 through
  2027 - compiled at both ends rather than remembered. No ElementId is built
  from an int, so 2024's move to 64-bit ids cannot reach this code.

# ROUTING - repeated in READ_ELEMENT_PHASE, SET_ELEMENT_PHASE and REPORT_PHASES.
#
#   "what was added in phase 2"      -> here
#   "show me everything being demolished in phase 1" -> here, with the
#                                       demolished name set
#   "what phase is this element in"  -> READ_ELEMENT_PHASE - one element, both
#                                       its phases, not a sweep
#   "what phases does this
#    model have"                     -> REPORT_PHASES - the names and their
#                                       order, which is what you need before
#                                       you can ask this one
#   "put these in phase 2"           -> SET_ELEMENT_PHASE - this one only reads
#   "which design option are
#    these in"                       -> SELECT_BY_DESIGN_OPTION. Phase and
#                                       design option are both "which version
#                                       of the building" and they are not the
#                                       same axis

utterances:
  - what was added in phase 2
  - show me everything being demolished in phase 1
  - select all elements created in the new construction phase
  - find elements by phase
  - which walls are existing

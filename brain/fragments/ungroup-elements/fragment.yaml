id: FRG-ELE-013
semantic-identity: "break these groups apart into their members"
kind: action
domain: revit.elements
capability: UNGROUP_ELEMENTS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Breaks groups apart and hands back the elements that were inside them.

  **The commonest reason to reach for this is that something will not move.** A
  group member silently refuses to move — Revit's move returns normally and
  moves nothing — and ungrouping is one of the three fixes for "it will not
  move", the other two being unpinning and getting ownership. They look
  identical to the user and are not interchangeable.

  **Ungrouping one instance changes only that instance.** The group TYPE stays
  in the project and every other placed instance is untouched, which is what
  somebody expects and is worth stating because deleting the type is a
  different, much larger action.

  **The members come back, which is what makes this composable.** Ungroup and
  then move is a real two-step job, and the second step needs the elements the
  first one released.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: ungrouped
      role: result
      type: int
    - name: notGroups
      # Handed in but not groups, so there was nothing here to act on. A count
      # of what it was GIVEN and could not use, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>


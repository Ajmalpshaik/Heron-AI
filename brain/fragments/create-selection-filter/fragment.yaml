compatibility-note: >
  One implementation for every release. `SelectionFilterElement.Create`,
  `SetElementIds` and `GetElementIds` are present 2020 through 2027 - read off
  the reference assemblies at both ends rather than remembered.

# ROUTING - repeated in SET_SELECTION, CREATE_VIEW_FILTER and COLOR_BY_PARAMETER.
#
#   "save these as a set"            -> here
#   "make a selection set"           -> here
#   "i want to find these again
#    later"                          -> here
#   "select these"                   -> SET_SELECTION - the CURRENT selection,
#                                       gone at the next click
#   "make a filter for supply air"   -> CREATE_VIEW_FILTER - a RULE that keeps
#                                       working as the model changes. Use that
#                                       when the elements share one; use this
#                                       when they share nothing but your choice
#   "colour code by system"          -> COLOR_BY_PARAMETER
#   "put that filter on this view"   -> APPLY_VIEW_FILTER - the step that
#                                       makes a saved set do something to a
#                                       drawing
#   "what filters already exist"     -> REPORT_VIEW_FILTERS
#   "add these to the saved set"         -> UPDATE_SAVED_SET. This one makes
#                                           a new set; that one edits an
#                                           existing one

utterances:
  - save these as a set
  - make a selection set
  - save this selection with a name
  - i want to find these again later
  - put these in a named filter

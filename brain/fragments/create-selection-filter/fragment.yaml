id: FRG-SEL-003
semantic-identity: "save these elements as a named set i can use again"
kind: action
domain: revit.selection
capability: CREATE_SELECTION_FILTER
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Saves a set of elements under a name, as a Revit selection filter - the
  hand-picked list that appears in the Filters tab beside the rule-based ones,
  and that a view can then colour or hide by name.

  **A saved set is not the current selection, and the difference is the whole
  point.** SET_SELECTION highlights things on screen and is gone the moment
  somebody clicks elsewhere. This survives closing the model, and can be used
  in a view template a year later.

  **And it is not a view filter either.** CREATE_VIEW_FILTER writes a RULE -
  everything whose System Type contains CHW - and keeps working as the model
  grows. This is a LIST, and it is exactly right when the twelve things being
  coloured share no rule at all. A list does not follow new elements, and that
  is stated rather than discovered.

  **An existing filter of that name is UPDATED, not duplicated.** Revit allows
  no second filter of the same name, and the honest behaviour is to replace its
  contents and say so - a run that silently made "Plant Room 2" because
  "Plant Room" existed would leave two sets and one wrong drawing.

  **It is not applied to any view.** Making the set and deciding where it shows
  are two jobs, and the second one belongs to whoever knows the view.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: filterName
      type: string
      source: request
  provides:
    - name: filterId
      role: result
      type: ElementId
    - name: saved
      role: result
      type: int
    - name: findings
      type: IList<string>


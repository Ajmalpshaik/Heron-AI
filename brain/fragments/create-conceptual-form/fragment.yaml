compatibility-note: >
  `FamilyItemFactory.NewFormByCap(bool, ReferenceArray)`,
  `NewExtrusionForm(bool, ReferenceArray, XYZ)` and
  `NewLoftForm(bool, ReferenceArrayArray)` read the same 2020 through 2027
  (the RevitAPI reference assemblies, read 2026-10-01). Autodesk's own remark
  on the extrusion call names the families it refuses in words that read the
  wrong way round - "Conceptual Mass, 2D, or other family where extrusions
  cannot be created" - so which conceptual families take each call is
  NEEDS-CHECKING BV6, not a promise here. `NewSweptBlendForm(bool,
  ReferenceArray, ReferenceArrayArray)` reads the same 2020 through 2027 too
  (the RevitAPI XML, read 2026-10-02), with its rule in its parameter remarks:
  a path in one plane, a single curve when there is more than one profile,
  each profile one loop in a plane square to the path - BV20; and
  `NewRevolveForms(bool, ReferenceArray, Reference, double, double)`, whose
  remark says some arguments make several forms from one profile - BV22.

# ROUTING - see SET_FAMILY_CATEGORY for the whole family-building table.
#
#   "make a surface from these lines"             -> here
#   "extrude the adaptive panel outline 50 mm"    -> here, in an adaptive or
#                                                    pattern-based family
#   "extrude a circle 300 diameter 500 high"      -> CREATE_FAMILY_EXTRUSION -
#                                                    any other family
#   "draw lines between the adaptive points"      -> DRAW_FAMILY_POINT_CURVES
#   "loft through these sections in the family"   -> CREATE_FAMILY_FREEFORM_SOLID -
#                                                    an ordinary family, sections
#                                                    typed, a fixed shape

utterances:
  - make a surface from these lines
  - create a form on the panel outline
  - loft a form through these two profiles
  - extrude the adaptive panel outline 50 mm
  - sweep this profile along the line between the adaptive points
  - revolve this profile around the axis line

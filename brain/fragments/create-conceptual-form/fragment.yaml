id: FRG-GEO-052
semantic-identity: "make a surface, an extrusion, a loft, a sweep or a revolve on lines in an adaptive, pattern-based or mass family, so it follows the points"
kind: action
domain: revit.families
capability: CREATE_CONCEPTUAL_FORM
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Makes a FORM ON LINES in an adaptive component, a pattern-based panel or a
  mass open in the Family Editor - its Create Form. Built on curves that run
  through the family's points, the form follows them: the flat glass of a
  panel that fits every cell of a divided surface, an adaptive fin, a lofted
  canopy, a two-point beam. These families do not take the classic extrusion,
  blend, revolve and sweep; this is the form they have - and any other family
  is refused by name before anything is made.

  **WHAT IS MADE FOLLOWS FROM WHAT IS GIVEN**, so no kind is asked: ONE closed
  profile and no depth makes a flat SURFACE filling it; ONE closed profile and
  a depth makes an EXTRUSION that far along its normal; TWO OR MORE profiles
  make a LOFT through them in the order given; a PATH makes a SWEEP of one
  profile along it, or a SWEPT BLEND of several - Revit's rule is a path in one
  plane, of one curve for a blend, with each profile square to it; an AXIS - one
  straight line - makes a REVOLVE of one profile about it, a full turn or the
  angle given, which Revit may return as more than one form. A profile is
  curve ids, commas between - the ids DRAW_FAMILY_POINT_CURVES gives back -
  with `|` between profiles; a path is curve ids too.

  **WHICH SIDE A DEPTH GOES IS A RULE**, not the way the lines were drawn: the
  profile's normal comes from its curves chained end to end and is turned so
  the axis it faces most is positive - UP for a profile lying flat, +Y or +X
  for an upright one; a negative depth goes the other way, and the report
  names the direction taken.

  **A PROFILE TO BE FILLED OR PUSHED MUST CLOSE** - a closed circle or ellipse
  closes by itself - and one to be pushed must be flat and enclose an area;
  each is refused by name. A void must enclose a volume.

  **READ BACK, ALL OR NOTHING**: the form, its extent and what it encloses - a
  solid's volume or a surface's area - are read again; a form holding no
  geometry fails the call. Its id comes back.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # Curve ids, commas between, `|` between profiles.
    - name: profiles
      type: string
      source: request
    # Millimetres to push one closed profile along its normal - negative for
    # the other side. Empty or 0 for a surface, a loft or a sweep.
    - name: depthMm
      type: string
      source: request
    # Curve ids of a path to sweep along, commas between. Empty for none.
    - name: path
      type: string
      source: request
    # One straight line's id to revolve about. Empty for none.
    - name: axis
      type: string
      source: request
    # A revolve's angle in degrees, more than 0 and up to 360. Empty for a full
    # turn.
    - name: angleDegrees
      type: string
      source: request
    # True for a solid form, false for a void.
    - name: solid
      type: bool
      source: request
  provides:
    - name: formId
      # The new form's unique id.
      role: result
      type: string
    - name: built
      # Solid or void; surface, extrusion, loft, sweep, swept blend or revolve; its
      # profiles and path, an extrusion's direction, its extent, and its volume
      # or area - read back.
      role: result
      type: string
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing was made, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


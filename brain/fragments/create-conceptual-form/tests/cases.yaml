positive:
  - given: >
      the Curtain Panel Pattern Based family with four reference lines drawn
      through points 1 to 4 by draw-family-point-curves; profiles their four
      ids, depthMm "", solid true
    expect: >
      a flat surface filling the 4 points, its area read back equal to the
      tile's area; LOOKED AT - moving point 3 up bends the surface with it

  - given: the same four lines; depthMm "50", solid true
    expect: >
      a solid extrusion 50 mm deep along the panel's normal, its volume read
      back as area x 50 mm - toward +Z for a panel lying flat, WHICHEVER way
      the four lines were drawn; the report names the direction

  - given: >
      the same four lines drawn the other way round, "2,1 | 3,2 | 4,3 | 1,4";
      depthMm "50"
    expect: the same extrusion as before, toward +Z - the rule, not the drawing order

  - given: >
      a two-point adaptive family: a reference line "1,2" from 0,0,0 to
      3000,0,0 and a closed 200 x 200 loop of four lines through points
      hosted on point 1's YZ plane (PLACE_ADAPTIVE_POINTS); profiles the loop's
      four ids, path the line's id, depthMm "", solid true
    expect: >
      a solid sweep about 120 L (0.2 x 0.2 x 3 m) along the line; dragging
      point 2 lengthens it (BV20)

  - given: >
      a mass family with a closed profile drawn beside a vertical reference
      line; profiles the profile's ids, axis the line's id, angleDegrees "",
      depthMm "", path ""
    expect: >
      a solid revolve, a full turn about the line, its volume read back; then
      angleDegrees "90" makes a quarter turn (BV22)

  - given: a mass family with a closed circle drawn as one reference line; depthMm "3000"
    expect: >
      a cylinder 3000 mm tall upward, the circle's own normal taken - or
      Revit's own refusal of an extrusion in a mass, wrapped (BV6) - never a
      raw error about a curve with no ends

  - given: >
      an adaptive family with two closed profiles of curves, one above the
      other; profiles "a,b,c,d | e,f,g,h", depthMm "", solid true
    expect: a loft between them, its volume read back

negative:
  - given: profiles of three of the four lines (one side missing), depthMm ""
    expect: refused - the profile does not close - nothing made

  - given: one closed profile, depthMm "", solid false
    expect: refused - a void needs a volume - nothing made

  - given: a plain Generic Model family with four model lines
    expect: >
      refused - not an adaptive, pattern-based or mass family, naming
      CREATE_FAMILY_EXTRUSION - nothing made

  - given: two profiles and a path of three curves
    expect: refused - a swept blend needs a path of one curve - nothing made

  - given: an axis that is an arc, or angleDegrees "400"
    expect: refused - the axis is one straight line, the angle up to 360 - nothing made

  - given: a project in front
    expect: notAFamily true and nothing made

second_route:
  - >
      In the Family Editor, select the form: it highlights on the curves, and
      Properties shows it as a Form; moving a point flexes it

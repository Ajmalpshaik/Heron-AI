# D-30: the negative cases are what catch "succeeded and did nothing" - and,
# here, "closed something it should not have". Every run on SCRATCH families
# saved under a scratch folder, never on a modeller's own file.

positive:
  - given: >
      Heron working in one scratch family (the HOST), a second scratch family
      (the NESTED part) open BEHIND it with one form added since it was saved,
      documentPath = the nested family's file
    expect: >
      saved true, savedTo its file - and the proof is NOT read off the report:
      the file's timestamp on disk moves, and the form survives a close and
      reopen. The host is untouched

  - given: the same, with closeWindow=true
    expect: >
      saved true AND closed true, the nested family gone from what is open
      (REPORT_OPEN_DOCUMENTS), the host still open and in front

  - given: the nested family IN FRONT, Heron working in the host behind it, closeWindow=true
    expect: >
      saved true, closed FALSE, and the finding saying Revit lets no tool close
      the window in front and that the file is saved - the window still open,
      Revit itself still running

  # VERSION 3 (Q-69) - THE DOCUMENT HERON WORKS IN. A SCRATCH project, never a
  # working model. Its save is the ADD-IN's, after the group; read it off the
  # reply's `save` block AND off the disk - the file's time - never off saveAsked.
  - given: >
      a saved scratch project with one unsaved change, Heron working in it,
      documentPath = its own file, the change KEPT (revit_change once proved,
      Ask to Keep off - or Keep pressed)
    expect: >
      saveAsked true, saveAskedTo its file; the reply's save block done true,
      saying a save cannot be undone; the file's time on disk moves and the
      title bar loses its unsaved mark. One Undo entry, and Ctrl+Z does not
      put the file back

  - given: >
      a NEVER-saved scratch project, Heron working in it, saveAsPath = a new
      full .rvt path under %TEMP%\heron-work, the change KEPT
    expect: >
      the file exists at that path; Revit's title is the new name; the save
      block names the new title and file; and the chat's NEXT change goes into
      the same model with no "use this model" - on Revit 2020, where the model
      has no CreationGUID, and on 2024

negative:
  - given: >
      documentPath = the file of the document Heron is working in, with one
      unsaved change, run WITHOUT keeping it - a proof's rolled-back run, a
      preview, or Discard pressed
    expect: >
      saveAsked true, and the reply's save block done false, saying the run was
      rolled back (or Discard was pressed) and the model was NOT saved; the
      file's time on disk UNCHANGED. Version 1 saved here every time and could
      not; version 2 refused; version 3 saves only a KEPT change (Q-69 point 2)

  - given: >
      saveAsPath = a path where a file is already, replaceFile not given
    expect: >
      refused, naming the file and saying Heron replaces one only when told to;
      saveAsked false, the file untouched. With replaceFile=true the same run
      kept replaces it, and the save block says it REPLACED it

  - given: saveAsPath for a model that already HAS a file, or a relative path, or a .txt
    expect: >
      refused, naming its file - it is saved there, never under a new name - or
      why the path is not one a project is saved as; nothing asked, nothing written

  - given: the CENTRAL model of a workshared project opened directly, documentPath its file
    expect: refused - saving it writes the file the whole job works from; nothing synced

  - given: a path no open document was opened from
    expect: refused, the path said back and the open titles listed; nothing written, nothing closed

  - given: >
      a family open behind with NO unsaved changes, closeWindow=true
    expect: >
      saved false (nothing to write), closed true - a window with nothing
      unsaved is closed without a save

  - given: a workshared local model, not the one Heron works in
    expect: >
      saved, AND the finding saying IN WORDS that nothing went to central. A
      second user reloading latest must NOT see the change

  - given: a document open read-only
    expect: refused by name

second_route:
  - >
      Ctrl+S by hand on the same family and the file timestamps compared; the
      family closed by hand with File > Close and Revit's own "save changes?"
      question never appearing, which says the save took

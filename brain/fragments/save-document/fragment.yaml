purpose: >
  Saves an open document - a family built in its own window, a tyre for a car -
  to the file it was opened from, named by that file's path, and closes its
  window when asked, so the family it belongs in can load it. Since version 3
  it also saves the model Heron is changing: to its own file, or - never saved
  yet - as the full path the modeller typed.

  **THE MODEL HERON IS CHANGING IS SAVED BY THE ADD-IN, ONCE HERON'S UNDO
  ENTRY HAS CLOSED** (version 3, Q-69, D-171). Revit will not save a document
  while Heron's Undo entry is open in it, so this card never saves that one
  itself - version 1 tried to, which Revit always refuses (row 5b-365). It
  asks the add-in through `saveWhenKept`, and the reply's `save` block says
  what the add-in wrote. **A kept change is saved, and so is a preview**: the
  preview's change is rolled back and its save is NOT - the reply says both,
  and that a save cannot be undone. **A Discard saves nothing**: the box is
  answered before the save, so a save follows only a Keep. A model that has a
  file keeps its name; a new one goes only to the path given, replacing a file
  there only with `replaceFile=true`, and the chat follows the model to its
  new name. Heron never closes that model's window.

  **ANOTHER OPEN DOCUMENT IS SAVED THE SAME WAY, AFTER THE GROUP** (row
  5b-1824): the card asks the add-in through `saveOtherWhenKept`, and the
  add-in saves it to its own file and then closes its window when asked - after
  a Keep, and after a preview; **a Discard saves and closes nothing**. Until
  2026-11-16 this card saved it inside the run, before the Keep or Discard box.
  The card itself writes and closes nothing.

  **A LOCAL SAVE OF A WORKSHARED MODEL IS NOT A SYNC.** It reaches nobody
  else on the job, so it says so - `SYNC_WITH_CENTRAL` is the other job. The
  CENTRAL model opened directly is refused, and nothing here synchronises.

  **IT IS `PUBLISH` RISK AND IT IS NOT UNDOABLE.** It never chooses a file name:
  another document with no file is not found here at all.

  **ONLY A WINDOW THAT IS NOT IN FRONT CAN BE CLOSED.** Revit lets no tool close
  the window in front, so that one is saved and left open for the modeller to
  close, and nothing with unsaved changes is ever closed.

contract:
  needs:
    - name: doc
      type: Document
    - name: uidoc
      type: UIDocument
    # The full path of the OPEN document to save - the .rfa or .rvt it was
    # opened from. Either document is saved by the add-in once the group has
    # closed, after a Keep or a preview, never after a Discard - the one Heron
    # is working in through saveWhenKept (version 3, D-171), another through
    # saveOtherWhenKept (row 5b-1824). Left out only for a Save As
    # (saveAsPath).
    - name: documentPath
      type: string
      source: request
      optional: true
    # VERSION 3. The full .rvt (or .rfa for a family) path THE MODELLER TYPED,
    # for a Save As of the model Heron works in when it has NEVER been saved.
    # Never a path Heron makes up; refused for a model that has a file.
    - name: saveAsPath
      type: string
      source: request
      optional: true
    # VERSION 3. Off unless typed: replace a file already at saveAsPath -
    # Revit's own SaveAsOptions default is not to. Say true only when the
    # modeller said to replace it.
    - name: replaceFile
      type: bool
      source: request
      optional: true
    # Off unless typed: after the save, close that document's window - only
    # when it is NOT the window in front, which Revit lets no tool close, and
    # never the window of the model Heron works in.
    - name: closeWindow
      type: bool
      source: request
      optional: true
    # VERSION 3, Q-69: the add-in's save of the document Heron works in, done
    # once the group has closed - after a Keep or a preview, never after a
    # Discard (D-171) - null for its own file, or the Save As path; the bool
    # is replaceFile.
    - name: saveWhenKept
      type: Action<string, bool>
      source: ambient
    # Row 5b-1824: the add-in's save of ANOTHER open document, by the same
    # rule and also once the group has closed - its file, and the bool is
    # closeWindow: close its window once it is saved. Until 2026-11-16 the
    # card saved it inside the run, before the Keep or Discard box.
    - name: saveOtherWhenKept
      type: Action<string, bool>
      source: ambient
  provides:
    # `saved`, `savedTo` and `closed` were version 2's results, and went on
    # 2026-11-16 (row 5b-1824): the run writes and closes nothing itself, so
    # it has nothing of its own to report. The reply's `save` block says what
    # the add-in saved and closed.
    - name: saveAsked
      # True when the run asked the add-in to save a document once its Undo
      # entry closes - the one Heron works in, or another open one with
      # unsaved changes. Asking is not saving: the reply's `save` block says
      # whether the add-in did - after a Keep or a preview, never after a
      # Discard.
      role: result
      type: bool
    - name: saveAskedTo
      # The file that save goes to: the model's own, the Save As path given,
      # or the other document's, spelt in full.
      role: result
      type: string
    - name: closeAsked
      # Row 5b-1824. True when the run asked the add-in to close another
      # document's window after its save - never the window in front, never
      # the model Heron works in. The `save` block's `closed` says whether it
      # closed.
      role: result
      type: bool
    - name: refused
      # Why it declined, in the user's words - evidence it looked and said no.
      # Never a thing it DID (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>


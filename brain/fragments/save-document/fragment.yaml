id: FRG-DOC-033
semantic-identity: "save an open document to its own file, and close its window - the model Heron is changing too, once its change is kept"
kind: action
domain: revit.document
capability: SAVE_DOCUMENT
version: 3
source: OFFICIAL
risk: PUBLISH

# VERSION 3 (2026-11-16) - THE MODEL HERON WORKS IN IS SAVED TOO, BY THE ADD-IN
# AFTER ITS UNDO ENTRY HAS CLOSED, and back to DRAFT. OPEN-QUESTIONS Q-69,
# answered by Ajmal PS that day in his own words, "go with you suggetions":
# Shape 2 - save after the group closes, from the add-in, only when the
# modeller asks; Heron never picks a name. Version 2 was PROVEN on 2026-10-07
# (the proof block below, kept as the record of what it proved - the save of
# ANOTHER open document, and the refusal of the one Heron works in, which
# version 3 now saves); its C# moved, so it is DRAFT again until NEEDS-CHECKING
# Group EN is run (D-30, D-117). Rows 5b-365 and 5b-513. Three new inputs:
# `saveAsPath`, `replaceFile`, and the ambient `saveWhenKept`; `documentPath`
# may now be left out, for a Save As. Nothing of version 3 has run in Revit.

purpose: >
  Saves an open document - a family built in its own window, a tyre for a car -
  to the file it was opened from, named by that file's path, and closes its
  window when asked, so the family it belongs in can load it. Since version 3
  it also saves the model Heron is changing: to its own file, or - never saved
  yet - as the full path the modeller typed.

  **THE MODEL HERON IS CHANGING IS SAVED BY THE ADD-IN, ONCE HERON'S UNDO
  ENTRY HAS CLOSED, AND ONLY WHEN THE CHANGE IS KEPT** (version 3, Q-69).
  Revit will not save a document while Heron's Undo entry is open in it, so
  this card never saves that one itself - version 1 tried to, which Revit
  always refuses (row 5b-365). It asks the add-in through `saveWhenKept`, and
  the reply's `save` block says what the add-in wrote. A preview, a Discard or a
  proof's rolled-back run leaves the file as it was. A model that has a file
  keeps its name; a new one goes only to the path given, replacing a file
  there only with `replaceFile=true`, and the chat follows the model to its
  new name. Heron never closes that model's window.

  **ANOTHER OPEN DOCUMENT IS SAVED INSIDE THE RUN**, as version 2 did - so a
  preview of it still writes its file (row 5b-1824).

  **A LOCAL SAVE OF A WORKSHARED MODEL IS NOT A SYNC.** It reaches nobody
  else on the job, so it says so - `SYNC_WITH_CENTRAL` is the other job. The
  CENTRAL model opened directly is refused, and nothing here synchronises.

  **IT IS `PUBLISH` RISK AND IT IS NOT UNDOABLE.** It never chooses a file name:
  another document with no file is not found here at all.

  **ONLY A WINDOW THAT IS NOT IN FRONT CAN BE CLOSED.** Revit lets no tool close
  the window in front, so that one is saved and left open for the modeller to
  close, and nothing with unsaved changes is ever closed.

contract:
  needs:
    - name: doc
      type: Document
    - name: uidoc
      type: UIDocument
    # The full path of the OPEN document to save - the .rfa or .rvt it was
    # opened from. Another open document is saved now; the document Heron is
    # working in is saved by the add-in once the change is kept (version 3).
    # Left out only for a Save As (saveAsPath).
    - name: documentPath
      type: string
      source: request
      optional: true
    # VERSION 3. The full .rvt (or .rfa for a family) path THE MODELLER TYPED,
    # for a Save As of the model Heron works in when it has NEVER been saved.
    # Never a path Heron makes up; refused for a model that has a file.
    - name: saveAsPath
      type: string
      source: request
      optional: true
    # VERSION 3. Off unless typed: replace a file already at saveAsPath -
    # Revit's own SaveAsOptions default is not to. Say true only when the
    # modeller said to replace it.
    - name: replaceFile
      type: bool
      source: request
      optional: true
    # Off unless typed: after the save, close that document's window - only
    # when it is NOT the window in front, which Revit lets no tool close, and
    # never the window of the model Heron works in.
    - name: closeWindow
      type: bool
      source: request
      optional: true
    # VERSION 3, Q-69: the add-in's save of the document Heron works in, done
    # once the group has closed and only if the change was kept - null for its
    # own file, or the Save As path; the bool is replaceFile.
    - name: saveWhenKept
      type: Action<string, bool>
      source: ambient
  provides:
    - name: saved
      # True only when something was WRITTEN. A document with no unsaved
      # changes is left alone and says so in `findings`.
      role: result
      type: bool
    - name: savedTo
      role: result
      type: string
    - name: closed
      # Read back: true only when the document is no longer open afterwards.
      role: result
      type: bool
    - name: saveAsked
      # VERSION 3. True when the run asked the add-in to save the document
      # Heron works in once its Undo entry closes. Asking is not saving: the
      # reply's `save` block says whether the add-in did - never on a preview.
      role: result
      type: bool
    - name: saveAskedTo
      # VERSION 3. The file that save goes to: the model's own, or the Save As
      # path given, spelt in full.
      role: result
      type: string
    - name: refused
      # Why it declined, in the user's words - evidence it looked and said no.
      # Never a thing it DID (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>


# may now be left out, for a Save As. Recorded as D-171. A PREVIEW SAVES TOO:
# asked whether a preview of "save my model" should really save, the owner
# answered "okkey" on 2026-11-16 - only when the save was asked for, the reply
# saying a save cannot be undone - so version 3 can be tried now, rolled

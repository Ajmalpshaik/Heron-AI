#
# ROW 5b-1824 (2026-11-16, still version 3, still DRAFT): ANOTHER OPEN
# DOCUMENT'S SAVE MOVED AFTER THE GROUP TOO. Version 2's save of another
# document - and the close of its window - ran inside the run, before Revit's
# Keep or Discard box, so a Discard still wrote that file, against D-171 point
# 5. The run now hands it to the add-in through a fourth new input, the ambient
# `saveOtherWhenKept`, and writes and closes nothing itself; `saved`, `savedTo`
# and `closed` went with it, `closeAsked` came. Same version: no rule of the

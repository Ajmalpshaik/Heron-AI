heron-agent: HERON-REVIT-DOC-004
heron-step: 17
heron-status: DRAFT
heron-since: 0.1.0
heron-layer: brain

id: FRG-DOC-033
semantic-identity: "save another open document to its own file, and close its window"
kind: action
domain: revit.document
capability: SAVE_DOCUMENT
version: 2
source: OFFICIAL
risk: PUBLISH

purpose: >
  Saves an open document - a family built in its own window, a tyre for a car -
  to the file it was opened from, named by that file's path, and closes its
  window when asked, so the family it belongs in can load it.

  **IT SAVES A DOCUMENT OTHER THAN THE ONE HERON IS WORKING IN.** Revit will not
  save a document while Heron's Undo entry is open in it, and Heron's entry is
  open in the document it works in for the whole run - so that one is refused
  by name, with the reason. Version 1 saved exactly that one, and could never
  have worked (row 5b-358).

  **SAVING A WORKSHARED MODEL IS NOT SYNCING IT.** A local save reaches nobody
  else on the job, so it says so - `SYNC_WITH_CENTRAL` is the other job.

  **IT IS `PUBLISH` RISK AND IT IS NOT UNDOABLE.** It never chooses a file name:
  a document with no file is not found here at all.

  **ONLY A WINDOW THAT IS NOT IN FRONT CAN BE CLOSED.** Revit lets no tool close
  the window in front, so that one is saved and left open for the modeller to
  close, and nothing with unsaved changes is ever closed.

contract:
  needs:
    - name: doc
      type: Document
    - name: uidoc
      type: UIDocument
    # The full path of the OPEN document to save - the .rfa or .rvt it was
    # opened from. Never the document Heron is working in: Revit refuses that.
    - name: documentPath
      type: string
      source: request
    # Off unless typed: after the save, close that document's window - only
    # when it is NOT the window in front, which Revit lets no tool close.
    - name: closeWindow
      type: bool
      source: request
      optional: true
  provides:
    - name: saved
      # True only when something was WRITTEN. A document with no unsaved
      # changes is left alone and says so in `findings`.
      role: result
      type: bool
    - name: savedTo
      role: result
      type: string
    - name: closed
      # Read back: true only when the document is no longer open afterwards.
      role: result
      type: bool
    - name: refused
      # Why it declined, in the user's words - evidence it looked and said no.
      # Never a thing it DID (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>

# NO PROOF. Version 1 was never run in Revit. Version 2 is DRAFT until it has
# been run on scratch families - NEEDS-CHECKING group CS.

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  `Document.Save(SaveOptions)`, `Document.PathName`, `Document.IsReadOnly`,
  `Document.IsModified`, `Document.IsWorkshared`, `Document.IsLinked`,
  `Document.Close(bool)`, `Application.Documents` and
  `UIApplication.ActiveUIDocument` are present 2020 through 2027. Save's remark
  that it "may not be called unless all transactions, sub-transactions, and
  transaction groups that were opened by the API code were closed", and Close's
  that "the currently active document may not be closed by this function", read
  the same in the 2020, 2024 and 2027 reference XML (2026-10-07).
  `PostableCommand.Close` exists on all three and is documented as "Close
  Revit" - the application - which is why no posted command is used to close a
  window. `SaveAs` is deliberately not called here at all.

# ROUTING - repeated in SYNC_WITH_CENTRAL and ACTIVATE_DOCUMENT.
#
#   "save the tyre family and close it" -> here, with its file and closeWindow
#   "save the model"        -> here only for a model Heron is NOT working in;
#                              the one it works in is refused, with Ctrl+S named
#   "sync to central"       -> SYNC_WITH_CENTRAL - and on a workshared model a
#                              save is NOT that, which is the confusion worth
#                              preventing
#   "go back to the car"    -> ACTIVATE_DOCUMENT, with the car's file
#   "save it somewhere else"-> NOT HERE, and nothing does it. SaveAs can
#                              overwrite another model and no fragment invents a
#                              path

utterances:
  - save the model
  - save this file
  - save my changes
  - save the nested family and close it
  - save that family and close its window

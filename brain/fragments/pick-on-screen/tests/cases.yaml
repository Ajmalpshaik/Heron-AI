# D-30: the negative case is what catches "succeeded and did nothing" - and,
# for a card that asks a person, "answered without asking": a point handed
# back that nobody clicked, a point from an earlier run, or a pick started in
# a view where a point means nothing.
#
# A PERSON IS HALF OF EVERY CASE. This card waits for the modeller's click, so
# no case here runs unattended: somebody is at Revit for each one, and the
# case says what they click. That is the card's job, not a gap in the cases.
#
# THE ARRANGEMENT (NEEDS-CHECKING Group NH, NH0). A scratch project from
# Revit's metric architectural template, Revit 2024, SAVED - never a working
# model:
#   - in the floor plan "Level 1", one straight MODEL LINE "L1" drawn 5000 mm
#     long (type 5000 while drawing). A model line, not a wall: its two ends
#     are the only things an endpoint snap can land on
#   - a schedule "Wall Schedule" (View, Schedules, Schedule/Quantities, Walls)
#   - the default 3D view "{3D}", with no work plane set in it
#   - Revit's Endpoints snap ON (Manage, Snaps) - the card takes Revit's own
#     snaps
# Where the model differs, the job file changes - never the card. Nothing
# here keeps anything: the card opens no transaction.
#
# ONE CLICK PER CALL (Q-86, FRAGMENT-ISSUES row 5b-1507). Every case but the
# one marked SLOW is answered at once, well inside the add-in's wait for one
# job.

positive:
  - given: >
      "Level 1" in front (OPEN_VIEW). When Revit's status bar reads "Heron:
      click the point - Esc to cancel", click one end of L1 on its endpoint
      snap
    expect: >
      clicked 1; pointMm holds one point, "x, y, z", with z 0 - Level 1's
      height, the view's work plane; cancelled false; refused empty; viewName
      "Level 1"; findings "One point clicked in "Level 1" (FloorPlan) ..."
      and the work plane's name; waitedSeconds about the time the click took.
      Nothing in the model changed and nothing is selected that was not
      before

  - given: the same again, and the OTHER end of L1 clicked
    expect: >
      a different point, 5000 mm from the first along L1 - the answer follows
      the click, and is not the first call's point handed back again

  - given: >
      THE HANDOVER. The two points, joined with "; " as D-67 writes several,
      typed into PLACE_FAMILY_INSTANCES as `points`, with a loaded furniture
      type and level "Level 1", rolled back
    expect: >
      taken as typed - two instances, one on each end of L1 - with no number
      re-keyed. This is the reason the point comes back as D-67 writes one

negative:
  - given: >
      THE WRONG KIND OF VIEW - a different arrangement, not an empty one.
      "Wall Schedule" in front (OPEN_VIEW)
    expect: >
      Revit never enters pick mode - the status bar shows no prompt and there
      is nothing to press Esc on. clicked 0; pointMm EMPTY; cancelled false;
      refused names "Wall Schedule" as a Schedule and says to bring a plan,
      section, elevation or 3D view to the front. Not a point from the run
      before it

  - given: >
      ESC. "Level 1" in front. When the prompt appears, press Esc without
      clicking
    expect: >
      a normal answer, not a failure: clicked 0; pointMm EMPTY; cancelled
      true; refused empty; findings "The modeller cancelled the pick ...".
      The chat reports it plainly and does not ask Revit again by itself

  - given: >
      A VIEW WITH NO WORK PLANE. "{3D}" in front with no work plane set
    expect: >
      Revit's own refusal, in `refused` with its words, and - because the
      view showed no work plane before the pick - the advice to set one or
      use a plan; clicked 0; pointMm empty. No work plane is set by this
      card: that would be a change to the model. IF REVIT TAKES THE CLICK
      INSTEAD, that is the thing this case learns: record the plane findings
      names

  - given: >
      TWO MODELS OPEN, and the call aimed at the one that is NOT in front
    expect: >
      refused "This model is not the one in front in Revit ..."; nothing
      asked; clicked 0

  - given: >
      SLOW (Q-86). "Level 1" in front. Let the prompt sit until the add-in's
      wait for one job has passed (revit.operationTimeoutSeconds, about a
      minute as installed), then click
    expect: >
      READ FROM THE CODE, NOT YET SEEN: before the click, the chat is told
      Revit is still working on the request and not to repeat it; Revit stays
      in pick mode until the click or Esc; the click's point reaches nobody
      and no answer follows. Record what the chat was told, word for word,
      what it then said to the modeller, and what Revit did. This is the
      limit the card is DRAFT behind, not a pass or a fail of the card

  - given: >
      SLOW, BUT INSIDE THE WAIT. The same, clicking about 55 seconds after
      the request was sent - past the run clock's budget as installed, inside
      the add-in's wait
    expect: >
      the point comes back as in the first case, with waitedSeconds saying
      how long it took. The card has no loop, so nothing asks the run clock
      after the click. If the chat is told the job ran out of time instead,
      record its words - the card's reading of the add-in is then wrong

second_route:
  - REPORT_LOCATION on L1 (selected) - the two ends it reports, against the two points clicked on them in two calls
  - Revit's own Measure Between Two References between the same two ends reads 5000, the distance between the two points handed back

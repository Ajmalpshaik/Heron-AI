id: FRG-SEL-040
semantic-identity: "ask the modeller to click a point in the open Revit view and hand it back in millimetres"

# WHY IT EXISTS - a comment, not `purpose`, because `purpose` is searched.
# 2026-11-11: the owner wants to work by chat with very few clicks in Revit,
# and nothing in the library let the modeller CLICK to answer the chat. No
# card and no add-in file called Revit's pick at all, so a point had to be
# typed as three millimetre numbers (D-67). Searched that day with
# brain/heron_retrieve.py on a scratch store, Revit 2024: "put it here where I
# click" reached ADD_FAMILY_FLIP_CONTROL and PLACE_FAMILY_INSTANCES, "pick a
# point in the view" DRAW_FAMILY_POINT_CURVES, "ask me to pick the element in
# Revit" READ_SELECTION. heron_duplicates and heron_matcher over the whole
# library: nothing shares this capability or contract.
#
# WHY A CARD OF ITS OWN, AND NOT READ_SELECTION OR SET_SELECTION WIDENED.
# READ_SELECTION reads what the modeller picked BEFORE asking and never
# waits; SET_SELECTION puts elements on screen. Both are PROVEN, neither
# deals in points, and this card's whole job is the one thing neither does:
# wait for a click and say where it landed.
#
# A POINT ONLY, AND WHY (FRAGMENT-ISSUES row 5b-1507):
#   an ELEMENT - READ_SELECTION already answers it: the modeller selects it
#       in Revit and says so. Nothing here repeats that.
#   a FACE - Revit's pick for one needs a kind of pick named from a namespace
#       a fragment is not given (HeronFragmentImports and the compile gate
#       hold one list), and no card takes a face reference as an input
#       (D-72). Adding the namespace is the add-in's promise to make, not
#       this card's to smuggle in. Owed, with Q-86.
#
# ONE CLICK PER CALL, AND WHY (Q-86). Several clicks need a loop, and the run
# clock (D-129) is asked at the head of each pass of one: a modeller slower
# than its budget over the first click would have the job stopped at the
# second pass, reported as "a loop that never ends" with the point they
# clicked dropped - untrue of a person. With no loop there is no second
# pass. Several points are several calls until Q-86 is decided.
#
# THE WAIT IS A PERSON'S, AND THE ADD-IN DOES NOT KNOW THAT YET (Q-86).
# Read from the code on 2026-11-11, not yet seen in Revit: the dispatcher
# waits revit.operationTimeoutSeconds (60 as installed) for a job it has
# started, then answers that Revit is still working and stops listening - a
# click after that reaches nobody and no answer follows. Its longer wait for
# a Keep or Discard box (revit.askTimeoutSeconds) cannot be asked for from a
# fragment. The card does not work round it: `purpose` says it to the chat,
# and `waitedSeconds` says how long Revit waited.
#
# WHAT IT REFUSES, NOTHING ASKED IN REVIT: a model that is not the one in
# front; a schedule, report or browser in front. A view with no work plane
# is Revit's to refuse, and its words come back in `refused`.
#
# ESC IS AN ANSWER: `cancelled` true, no point. Revit reports a switched
# view or a closed model the same way.
#
# RISK EXECUTE, which revit_show runs: it takes over the Revit session until
# the click or Esc, and changes nothing in the model and nothing in the
# selection. Opens no transaction.
kind: action
domain: revit.selection
capability: PICK_ON_SCREEN
version: 1
source: OFFICIAL
risk: EXECUTE

purpose: >
  Waits for the modeller to click one point in the Revit view in front and
  hands it back in millimetres, written the way a point is typed everywhere
  else in this library, so the next step can take it as it is. Esc cancels.
  Changes nothing in the model. One point for each time it is asked. The
  modeller has to click within about a minute of being asked: a later click
  is lost and no answer comes back, so when Revit is reported as still
  working on this, tell the modeller the click was not received and ask
  again once they are ready at Revit.

contract:
  needs:
    - name: uidoc
      type: UIDocument
  provides:
    - name: pointMm
      # "x, y, z" in millimetres from the model's internal origin - D-67's
      # own form for one point. Empty when nothing was clicked.
      role: result
      type: string
    - name: clicked
      # 1 when a point was clicked, 0 when not.
      role: result
      type: int
    - name: cancelled
      # true when the modeller cancelled the pick - Esc, or a switched view
      # or a closed model, which Revit reports the same way. What happened
      # to the asking, never a thing found (D-52).
      role: accounting
      type: bool
    - name: refused
      # Why no click could be asked for - Revit's own words when it was
      # Revit that said no (D-52).
      role: accounting
      type: string
    - name: viewName
      # The view the click was made in.
      role: accounting
      type: string
    - name: waitedSeconds
      # How long Revit waited for the modeller.
      role: accounting
      type: double
    - name: findings
      role: accounting
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Selection.PickPoint(string)`,
  `UIDocument.ActiveView`, `View.ViewType`, `View.SketchPlane` and
  `Element.Name` are declared the same 2020 to 2027 - read with
  `tools/api-surface --members` on 2026-11-11 against all eight releases'
  reference assemblies. The view type is tested by its NAME, never by a
  member: the pressure loss report's member was re-spelled at Revit 2027.
  The cancel is matched by the exception's type name, as
  TRANSFER_PROJECT_STANDARDS does. Each release's own remarks on PickPoint
  say it throws when the view has no work plane, and when the modeller
  cancels, switches view or closes the model - read in all eight reference
  packages' own XML that day. No ElementId is read.

  NOT KNOWN UNTIL IT RUNS IN REVIT: whether a pick started from Heron's
  external event behaves as one started from a ribbon command does; whether
  a 3D view nobody has set a work plane in takes a click; what the chat is
  told when the click comes after the add-in's wait (Group NH).

# ROUTING - repeated in READ_SELECTION.
#
#   "ask me to pick the element in Revit" -> READ_SELECTION. This card clicks
#                                    a POINT and cannot pick an element: the
#                                    modeller selects it in Revit, and
#                                    READ_SELECTION reads it
#   "use the ones I picked"       -> READ_SELECTION. What is ALREADY selected,
#                                    read at once - no waiting
#   "what did I select"           -> READ_SELECTION
#
# "PUT IT HERE" IS NOT DECLARED HERE, ON PURPOSE (review, 2026-11-11). As an
# utterance it took that sentence from the placement cards on every backend
# measured, and by identity the chat was shown no placement card at all.
# Whether it should mean "click, then place" is the owner's call - Q-86.

# ONE UTTERANCE, AND IT IS THE AUTHOR'S, NOT THE MODELLER'S. The card reader
# refuses a card with none, and nobody has yet said this job in their own
# words. It is replaced by the modeller's the first time he says one.
utterances:
  - I will click the point in Revit

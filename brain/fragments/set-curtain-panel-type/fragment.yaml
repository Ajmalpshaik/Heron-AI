compatibility-note: >
  ONE PATH FOR EVERY RELEASE, read rather than remembered. On 2026-10-28
  tools/api-surface read the reference assemblies of all eight releases, 2020
  through 2027, and every member this calls carries one signature on all
  eight: CurtainGrid's ChangePanelType(Element, ElementType) returning
  Element, GetPanelIds, GetUnlockedPanelIds, GetUGridLineIds and
  GetVGridLineIds; Panel.FindHostPanel; PanelType, deriving from FamilySymbol;
  Wall.CurtainGrid, Wall.Orientation and WallType.Kind; CurtainGridLine.FullCurve;
  Curve.Project, ComputeNormalizedParameter, Length and GetEndPoint;
  IntersectionResult.Parameter; Level.ProjectElevation; Element.Pinned and its
  bounding box; FamilyInstance.Host and CurtainSystem;
  WorksharingUtils.GetCheckoutStatus with its owner; Document.Regenerate; and
  Revit's own ArgumentException and InvalidOperationException, the two
  ChangePanelType's reference names - caught by their type's name, because
  only the add-in spells Revit's namespaces out. The reference text read is
  RevitAPI.xml in the Nice3point 2024 package: on a curtain wall the new type
  may be a PanelType or a WallType, and on a curtain system only a PanelType.
  Categories are compared through new ElementId(BuiltInCategory), on every
  release; no ElementId is built from a number and none is read as one.

# ROUTING - the same rows are in CHANGE_ELEMENT_TYPE, SET_CURTAIN_WALL_GRID,
# REPORT_CURTAIN_ELEMENTS and REPLACE_MATERIAL.
#
#   "change the bottom row of panels on this curtain wall to solid panels" -> here
#   "put spandrel panels on every floor line"   -> here, whichPanels floor lines
#   "change panel type in the second column"    -> here, whichPanels column 2
#   "make these curtain panels glazed"          -> CHANGE_ELEMENT_TYPE, with
#                                                  those panels selected: the
#                                                  selection already says which.
#                                                  Where a selected cell holds a
#                                                  basic wall, Revit's ChangeTypeId
#                                                  is not known to take a panel
#                                                  type - not measured; then here,
#                                                  by its row and column
#   "swap the curtain panel to a door panel"    -> CHANGE_ELEMENT_TYPE, with that
#                                                  one panel selected - the way the
#                                                  2026-10-13 house got its doors.
#                                                  MEASURED through find on
#                                                  2026-10-28: both sentences reach
#                                                  HERE, and are not declared on
#                                                  CHANGE_ELEMENT_TYPE - its card
#                                                  says why. Here a selection of
#                                                  panels is refused, naming that
#                                                  card, and nothing changes
#   "set the default curtain panel on the type" -> NOT HERE, and nothing does
#                                                  yet. This changes panels on one
#                                                  wall; the type's Curtain Panel
#                                                  is an element reference, which
#                                                  WRITE_ELEMENT_PARAMETERS refuses
#   "change the mullions on this curtain wall"  -> SET_CURTAIN_WALL_GRID, `mullions`. A
#                                                  mullion is on the type's grid
#                                                  lines; a panel fills a cell
#   "set the curtain wall grid spacing"         -> SET_CURTAIN_WALL_GRID. The grid
#                                                  makes the rows and columns this
#                                                  counts
#   "change the glass material in these panels" -> REPLACE_MATERIAL. A panel's
#                                                  glass is its TYPE's material, so
#                                                  every panel of that type changes
#                                                  with it; this swaps the panel
#   "which panel types are on this wall"        -> REPORT_CURTAIN_ELEMENTS - a
#                                                  question must not land on a
#                                                  write (D-86). It counts curtain
#                                                  panels and names the basic walls
#                                                  among them; it does not name the
#                                                  curtain panel types yet
#   "load a curtain wall door family"           -> LOAD_FAMILY, the modeller's
#                                                  call. Never done here
#   "draw a curtain wall"                       -> CREATE_WALL, with the points.
#                                                  A first wording of this card's
#                                                  purpose pulled the bare sentence
#                                                  HERE; with this one it reaches a
#                                                  reader, as it did before this
#                                                  card (check-routing, 2026-10-28).
#                                                  CREATE_WALL's card says why it
#                                                  has not declared it
#   "select all elements of type Curtain Wall"  -> NOT HERE. A first wording pulled
#                                                  it here, a write, and
#                                                  tests/test_routing_phrases.py
#                                                  failed (5b-329's guard); with
#                                                  this one it reaches
#                                                  REPORT_CURTAIN_WALL_TYPE again

utterances:
  - change the bottom row of panels on this curtain wall to solid panels
  - put spandrel panels on every floor line
  - change panel type in the second column

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. The wall join utilities and the
  structural framing ones are separate and both unchanged 2020 to 2027, and
  each has a matching question - is the join allowed at this end - which is
  what the read-back uses. Neither throws on a pinned element, which is why the
  pin is handled here rather than relied on to surface as an error.

# ROUTING - the same rows are in the fragments named here.
#
#   "the walls are joining where they    -> here
#    should not"
#   "disallow join on these"             -> here
#   "the beam end is eaten by the        -> here - structural framing uses its
#    column"                                own call, and this covers both
#   "join these two elements"            -> JOIN_GEOMETRY, which is geometry
#                                           joining between elements, NOT the
#                                           end cleanup of a wall
#   "unjoin these"                       -> UNJOIN_GEOMETRY
#   "the wrong one is cutting"           -> SWITCH_JOIN_ORDER
#   "put these walls on another level"   -> SET_WALL_CONSTRAINTS
#   "is the model clean"                 -> READ_MODEL_WARNINGS, which is
#                                           Revit's own list

utterances:
  - stop the walls joining at the corner
  - disallow join on these walls
  - the walls are cleaning up into each other
  - the beam is being eaten by the column
  - allow the joins again

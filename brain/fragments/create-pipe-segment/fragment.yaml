id: FRG-MEP-048
semantic-identity: "make a new pipe segment, copying an existing size table and relabelling it"
kind: action
domain: revit.mep
capability: CREATE_PIPE_SEGMENT
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Makes a new pipe segment - the thing that carries a pipe's MATERIAL and its
  SIZE TABLE - by copying the sizes of one that already exists, optionally
  relabelling every nominal size to its outside diameter, and optionally
  adding sizes the source did not have.

  **IT COPIES RATHER THAN INVENTS, AND THAT IS THE WHOLE DESIGN.** A wall
  thickness on a refrigerant line is a pressure rating. Typing one from memory
  into a size table is how a 40-bar line gets modelled as something thinner
  than it is, and nothing in Revit ever objects. The sizes here come off a
  segment a human already trusts, in Revit's own internal feet, never
  converted and never rounded on the way.

  **NOMINAL = OD IS A DECISION, NOT A DEFAULT.** Water tube is called by DN -
  a 15 mm tap connection on 12.7 mm pipe is correct and long-standing.
  Refrigerant tube is called by its OUTSIDE diameter - nobody orders "10 mm
  nominal", they order 3/8". A stock copper catalog carries imperial ODs under
  metric DN labels, so a half-inch refrigerant line tags as 15 mm. Passing
  nominalEqualsOd makes the label match the pipe; leaving it false keeps DN,
  and the answer says which was used because reading it off the result is the
  only way to be sure.

  **MATERIAL AND SCHEDULE ARE READ-ONLY ONCE CREATED.** `PipeSegment.Create`
  is the only place either can be set - there is no property to fix afterwards.
  A wrong material means deleting the segment and making it again, so the
  material is resolved BEFORE anything is created and a name that matches
  nothing stops the whole thing rather than creating a segment nobody wanted.

  **A SIZE NOT IN THE SIZE LISTS NEVER REACHES THE DROPDOWN.** The segment
  exists, the size table is full, and the pipe tool offers nothing. Every size
  is created usedInSizeLists AND usedInSizing, and the count of each is
  reported, because "created 17 sizes" and "17 sizes you can draw with" are
  different sentences.

  **REPLACE EXISTS BECAUSE A METRIC CATALOG SHARES NO SIZE WITH AN IMPERIAL
  ONE.** EN 12735 refrigerant tube is 6, 8, 10, 12, 15, 18, 22, 28 mm OD;
  the stock copper catalog is 6.35, 9.52, 12.7, 15.88 - imperial, under metric
  labels. Adding the metric sizes to that table makes a segment offering both,
  which is honestly neither and lets somebody draw a 12 and a 12.7 in the same
  run. With replaceSizes the table is built from addSizes alone - and the
  source is still needed, because a segment must belong to a pipe SCHEDULE and
  the source's is the only one that cannot be wrong for a project already
  using it.

  **THE NEW SEGMENT IS EMPTY OF OPINIONS ABOUT WHICH TYPE USES IT.** Making a
  segment changes no pipe type. SET_ROUTING_PREFERENCE is the separate,
  deliberate act of pointing a type at it.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: segmentName
      type: string
      source: request
    # The material the new segment carries, BY NAME. Read-only after creation.
    - name: materialName
      type: string
      source: request
    # The segment whose size table is copied. Sizes are never invented.
    - name: copyFrom
      type: string
      source: request
    # TRUE relabels every nominal to its outside diameter - the refrigerant
    # convention. FALSE keeps the source's nominal, which is right for water.
    - name: nominalEqualsOd
      type: bool
      source: request
    # TRUE discards the source's sizes and builds the table from addSizes
    # alone. A metric catalog shares no size with an imperial one, and a
    # segment offering both is honestly neither.
    - name: replaceSizes
      type: bool
      source: request
    # The pipe schedule the new segment belongs to. Revit keys a segment by
    # material AND schedule together and refuses a pair already in use, so a
    # SECOND copper segment needs its own. A name that does not exist is
    # created. Empty reuses the source's, which only works when the material
    # differs.
    - name: scheduleName
      type: string
      source: request
    # Roughness in millimetres. EMPTY COPIES THE SOURCE'S, which is the safe
    # default: Revit's own default is ZERO, and zero roughness is frictionless
    # pipe that nothing warns about.
    - name: roughness
      type: string
      source: request
    # Extra sizes the source lacked, as "OD x wall" in millimetres, comma
    # separated - e.g. "22.22x1.14, 28.58x1.27". Empty adds none.
    - name: addSizes
      type: string
      source: request
  provides:
    - name: createdId
      role: result
      type: ElementId
    - name: sizesCopied
      role: result
      type: int
    - name: sizesAdded
      role: result
      type: int
    - name: relabelled
      # How many nominals were changed to the OD. Reported separately from the
      # copy count because a catalog where nominal already equalled OD would
      # relabel nothing, and that is a different fact from copying nothing.
      role: result
      type: int
    - name: alreadyThere
      # A segment of that name already exists, so nothing was created. The
      # evidence it looked, never a thing it made (D-52).
      role: accounting
      type: IList<string>
    - name: nearMisses
      # Material or source names that nearly matched when one was not found.
      role: accounting
      type: IList<string>
    - name: roughnessSet
      # The roughness the new segment ended up with, and where it came from.
      # Revit's default is ZERO - frictionless pipe - so this is never left to
      # be assumed.
      role: result
      type: string
    - name: scheduleCreated
      # The pipe schedule this had to make, empty when an existing one was
      # used. A new schedule appears in Revit's own settings and outlives the
      # segment, so it must never be a silent side effect.
      role: accounting
      type: string
    - name: problem
      # Revit's own words when Create refused, empty when it did not. A
      # segment is identified by its material AND its schedule together, and
      # only the message says which was the clash - so it is a string, which
      # is not abbreviated on the way to a reader.
      role: accounting
      type: string
    - name: rejected
      # addSizes entries that could not be read as OD x wall, named with what
      # was wrong. Never silently skipped - a dropped size is a size nobody
      # can draw.
      role: accounting
      type: IList<string>
    - name: findings
      type: IList<string>


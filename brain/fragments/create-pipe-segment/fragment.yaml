compatibility-note: >
  One implementation for every release. `PipeSegment.Create(Document,
  ElementId, ElementId, ICollection<MEPSize>)`, the `MEPSize(double, double,
  double, bool, bool)` constructor, `Segment.GetSizes`, `Segment.MaterialId`
  and `PipeSegment.ScheduleTypeId` were confirmed by reflection on the 2020
  assembly and in the 2027 metadata on 2026-09-15.

  Copied sizes are never converted - they are read in internal feet and handed
  straight back in internal feet. Only `addSizes`, which arrives from a person
  in millimetres, is divided by 304.8, as plain arithmetic rather than a units
  call. That is what keeps this clear of the 2021 units move.

# ROUTING - repeated in SET_ROUTING_PREFERENCE and REPORT_PIPE_SEGMENTS.
#
#   "make a refrigerant copper segment"  -> here
#   "the nominal should say the OD"      -> here, nominalEqualsOd=true
#   "what segments do we have"           -> REPORT_PIPE_SEGMENTS
#   "use that segment on this type"      -> SET_ROUTING_PREFERENCE

utterances:
  - make a new pipe segment
  - create a copper segment for refrigerant
  - copy this segment and rename the sizes
  - the nominal size should be the OD
  - add a segment with these sizes

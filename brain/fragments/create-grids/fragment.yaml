compatibility-note: >
  One implementation for every release. `Grid.Create` and `Line.CreateBound` are
  unchanged 2020 through 2027 - read off the reference assemblies at both ends.
  `spacingsAcross` and `spacingsUp` arrive in millimetres and are divided by
  304.8 in the code (D-71); `origin` is a point, which the add-in converts at
  the boundary (D-67), so no units API is touched. (This note said "Every
  distance arrives in internal FEET", with the millimetres converted at the
  edge before this, until 2026-09-24, while the code and its own proof -
  spacings used as 19.69 and 24.61 feet, which is 6000 and 7500 divided by
  304.8 - said millimetres; the purpose said the same of the bay dimensions
  until that day.) Names are compared as text against the grids already in the
  document rather than trusted to Revit's own refusal, which throws.

# ROUTING - repeated in LIST_GRIDS, SNAP_TO_GRID and CREATE_LEVELS.
#
#   "make a grid series across the building" -> here
#   "set out the grid at 6000 bays"      -> here
#   "put in the whole column grid"       -> here
#   "draw a grid line here"              -> here, `gridLines` - ONE line
#                                           between two known points, which
#                                           CREATE_GRID did until version 2
#   "add a grid"                         -> here, `gridLines`
#   "space these out on a grid"          -> SNAP_TO_GRID, which means a LAYOUT
#                                           grid - an imaginary spacing for
#                                           placing diffusers - and not the
#                                           building's setting-out datum
#   "draw a detail line here"            -> DRAW_FAMILY_DETAIL_LINES - a line is not a
#                                           datum: no bubble, no name, no view
#                                           extents
#   "add a grid line at 1200 from the bottom of this curtain wall",
#   "divide this curtain wall into six panels" -> ADD_CURTAIN_GRID_LINES - a
#                                           CURTAIN grid line is the wall's
#                                           own, not a datum
#   "what grids are in this model"       -> LIST_GRIDS - a READ
#   "add four more floor levels"         -> CREATE_LEVELS - the same
#                                           one-versus-many pair, for levels


# ROUTING (2026-10-12, the gap fill)
#
#   "set out a radial grid"                 -> here since version 3, centreMm,
#                                              radiiMm, spokeAnglesDegrees (was
#                                              CREATE_RADIAL_GRIDS)
#   "arc grids at 6 and 12 m with spokes every 30 degrees" -> here, the same
utterances:
  - make a grid series across the building
  - set out the grid at 6000 bays
  - put in the whole column grid
  - set out the structural grid
  # MOVED 2026-11-01 from CREATE_GRID, merged into this card.
  - add a grid
  - create a grid line
  - put a grid here
  - add another column grid
  - I need a new grid line
  # ...and its semantic identity, which nothing else declares:
  - add a column grid line between these two points
  # MOVED 2026-11-01 from CREATE_RADIAL_GRIDS, merged into this card.
  - set out a radial grid about this centre
  - make arc grids at 6 m and 12 m with spokes every 30 degrees
  - set out the radial setting-out for the round building
  - create spoke grids from the centre at 0 30 60 and 90 degrees
  # ...and its semantic identity, which nothing else declares:
  - set out a radial grid of arcs and spokes about one centre

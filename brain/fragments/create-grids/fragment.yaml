risk: MODIFY

# VERSION 2 (2026-11-01) - CREATE_GRID WAS MERGED INTO THIS CARD on the
# owner's instruction ("make sure there is no duplicate tools"), and is
# DEPRECATED. The same job - straight column grids, named - and the only
# difference was the input: two points, or bay gaps. Both are here now.
# What CREATE_GRID had and this one lacked: grids between points given
# (`gridLines`, with `gridNames`); a line whose ends differ in height by more
# than a millimetre refused, naming the difference; two identical points
# refused; both ends forced onto one height within that millimetre. Its
# `created` (one id) is one entry of this card's `created`; its `refused` is
# a line of this card's `refused`.
#
# THE TWO CARDS' NAME RULES WERE OPPOSITE, AND THE SAFER ONE IS KEPT: a name
# already taken - by a grid in the project or twice in one call, ignoring
# capitals - is refused BEFORE ANYTHING IS MADE, as CREATE_GRID did and as
# CREATE_LEVELS version 2 does for levels. Version 1 of this card created a
# clashing grid anyway under Revit's own name, in the middle of somebody's
# setting-out, and reported it after. A grid Revit will not make, or a name
# it will not take, now undoes the whole call (Article 8) where version 1
# carried on without it.
#
# EVERY INPUT BUT A MODE'S OWN MAY BE LEFT OUT (`optional: true`, `absent:`).
# A spacing list left out reads "0", which is now none that way: version 1
# put one grid at the origin for an empty list and two on one line for "0"
# (seen while merging; the case "spacings in one direction only" below always
# said the other direction is left alone). A gap of 0 or less among real gaps
# is refused before anything is made.
#
# CREATE_RADIAL_GRIDS WAS JUDGED ON THE SAME RULE AND KEPT APART: it names no
# grid (Revit numbers them), so the name rule does not bear on it, and its
# inputs - a centre, radii, spoke angles and a sweep - share nothing with a
# straight grid's. (Reversed the same day - version 3, below.)
#
# Version 1's proof below no longer describes the code (impl/ changed) and is
# kept as the record; DRAFT until version 2 is proved on a real model (D-30).
#
# VERSION 3 (2026-11-01) - CREATE_RADIAL_GRIDS WAS MERGED INTO THIS CARD on
# the owner's instruction ("make sure there is no duplicate tools"; "check
# once more"), and is DEPRECATED. The same job - setting-out grids - and, as
# with CREATE_GRID, the difference was the input: a THIRD one, ARCS AND SPOKES
# ABOUT ONE CENTRE (`centreMm`, `radiiMm`, `spokeAnglesDegrees`, with the
# arcs' sweep `startDegrees` and `endDegrees`). All of its rules came with it:
# a full circle drawn just short of closed (a grid cannot be a closed
# circle); a spoke outside the arcs' sweep drawn and SAID; refused before
# anything is made - a centre that is not two or three numbers, a value that
# is not a number, neither radius nor spoke, a radius of 0 or less, spokes
# with no radius. Its outputs: made -> the count of `created`; gridIds ->
# `created` (the grids themselves); gridNames -> `namedAs`; refused and
# findings -> `refused`, which after a run says what was made.
#
# HOW RADIAL GRIDS ARE NAMED: BY REVIT, as they were on that card. Revit gives
# each new grid the next free name after the last grid made, so one can never
# take a name already held and the taken-name refusal has nothing to refuse;
# `gridNames` (which names the `gridLines` grids) is refused with a radial
# grid. The names are read back into `namedAs`.
#
# NOT CARRIED, AND WHY - THE OPPOSITE RULE: CREATE_RADIAL_GRIDS caught a grid
# Revit refused and KEPT THE REST, a partial setting-out under one undo
# entry. Here a grid Revit will not make undoes the whole call (Article 8),
# the safer rule. And its sweep: two required numbers there, two optional
# words here (left out "none") - so a straight grid need not send them - and
# a radial grid with no sweep is REFUSED rather than given one: 0 and 360 is
# typed for a full circle, never assumed.
#
# DRAFT until version 3 is proved on a real model (D-30).

purpose: >
  Sets out a whole column grid from a start point and a list of bay dimensions -
  both directions, named the way a drawing names them, in one pass. The
  setting-out job as it is actually described: *"6000, 6000, 7500, 6000 across;
  8000, 8000 up"*.

  **TWO INPUTS, ONE TOOL.** Two explicit points are right when the line is
  already known. For a bay layout they mean working out every coordinate by
  hand first, and for twelve grids in two directions that is where the
  mistakes come from - so the bay dimensions are the other input, which is how
  a drawing states one.

  **THEY ARE GAPS, NOT POSITIONS**, and both readings look sensible. Four of them
  make FIVE grids: the first sits at the start point and each gap steps to the
  next. Read as positions they give one grid too few and every line in the wrong
  place.

  **THE NAME HAS TO INCREMENT THE WAY A DRAWING DOES.** Letters run A to Z then
  AA, AB - not A to Z and stop, and not A1. Numbers run from whatever the start
  is.

  **VERSION 2 DRAWS GRIDS BETWEEN POINTS GIVEN AS WELL** - `gridLines`, named
  by `gridNames` - each line level, its ends forced onto one height, one whose
  ends differ in height refused. **A name already taken is refused before any
  grid is made**, ignoring capitals, and a grid Revit will not make undoes the
  whole call.

  **VERSION 3 ALSO SETS OUT A RADIAL GRID** - arcs about one centre over a
  sweep, and spokes out from it - named by Revit and read back.

  **The bay dimensions are MILLIMETRES, divided by 304.8 (D-71).** The start
  point is internal FEET, converted from millimetres by the add-in (D-67).

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # Version 2: each of the five below may be left out, so a call that draws
    # `gridLines` need not send them. Left out: the origin 0,0,0; no spacings
    # that way ("0" - none); A; 1.
    - name: origin
      type: XYZ
      source: request
      optional: true
      absent: 0,0,0
    - name: spacingsAcross
      type: IList<double>
      source: request
      optional: true
      absent: '0'
    - name: spacingsUp
      type: IList<double>
      source: request
      optional: true
      absent: '0'
    - name: firstLetter
      type: string
      source: request
      optional: true
      absent: A
    - name: firstNumber
      type: int
      source: request
      optional: true
      absent: '1'
    # VERSION 2, from CREATE_GRID. Grids between points: two points in
    # MILLIMETRES per grid, a semicolon between the two ends and a pipe
    # between grids - "0,0,0; 30000,0,0 | 0,8000,0; 30000,8000,0". Each line
    # level to a millimetre or refused. Left out ("none"): grids from the bay
    # spacings, as version 1. Given with spacings as well, refused.
    - name: gridLines
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 2. The names of the `gridLines` grids, in order, commas between
    # - one per line, a blank one for Revit's own. Left out ("none"): Revit's
    # own names. Refused with bay spacings, whose names run from firstLetter
    # and firstNumber.
    - name: gridNames
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 3, from CREATE_RADIAL_GRIDS - a RADIAL grid. Each left out
    # ("none") unless a radial grid is asked; given with gridLines or bay
    # spacings, refused. The centre, "x,y" or "x,y,z" in millimetres.
    - name: centreMm
      type: string
      source: request
      optional: true
      absent: none
    # Radii in millimetres, commas between - "6000, 12000"; an arc grid at
    # each, over the sweep.
    - name: radiiMm
      type: string
      source: request
      optional: true
      absent: none
    # Spoke angles in degrees, commas between - "0, 30, 60, 90"; a straight
    # grid from the centre to the largest radius at each.
    - name: spokeAnglesDegrees
      type: string
      source: request
      optional: true
      absent: none
    # The arcs' sweep, degrees anticlockwise from east, as Revit measures -
    # one number each. ASKED, never assumed: a radial grid with none is
    # refused. 0 and 360 is a full circle.
    - name: startDegrees
      type: string
      source: request
      optional: true
      absent: none
    - name: endDegrees
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: created
      role: result
      type: IList<Element>
    - name: namedAs
      role: result
      type: IList<string>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52). Since version 2 a refusal means
      # NOTHING was created; after a run it holds one line saying what was
      # made.
      role: accounting
      type: IList<string>


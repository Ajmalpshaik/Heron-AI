id: FRG-PAR-014
semantic-identity: "every parameter this element actually has, before you know any of their names"
kind: action
domain: revit.parameters
capability: REPORT_PARAMETER_INVENTORY
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Lists every parameter an element ACTUALLY carries - name, storage type,
  instance or type, whether it is built-in or shared, read-only or not, and its
  current value. The discovery step before any bulk read or write. It changes
  nothing.

  **IT ANSWERS THE QUESTION YOU HAVE BEFORE YOU KNOW THE NAMES.**
  `READ_ELEMENT_PARAMETERS` reads a parameter you can already name. This one
  answers *"what parameters does this duct even have"* - and the two get asked in
  that order. Guessing a plausible name and finding it absent is the commonest
  wasted round trip in this whole library, and it is avoidable by looking first.

  IT EXISTS BECAUSE THE QUESTION WAS GOING TO `REPORT_GLOBAL_PARAMETERS`.
  Measured before this batch, both *"list every parameter that exists on this
  element"* and *"what parameters can I filter on"* resolved there. **A global
  parameter is one value for the whole model**; this is the list of columns on
  one element. That fragment's own purpose already says they get mixed up and
  that mixing them up wastes a session.

  **THE PARAMETER GROUP IS DELIBERATELY NOT REPORTED**, and the reason is worth
  keeping: `Definition.ParameterGroup` is gone by Revit 2027 and its replacement
  `GetGroupTypeId` has never existed on 2020. Neither works at both ends, and
  every fragment here is one implementation for all eight releases. The group is
  a sorting convenience in a dialog; nothing about reading or writing a value
  needs it.

  **THREE KINDS, AND ONLY THREE CAN HONESTLY BE TOLD APART.** Built-in, Shared,
  and *"project or family - not shared"*. Revit's API carries no flag separating
  a parameter defined inside the Family Editor from one added through Project
  Parameters once both are on an element. Reporting a guess as a fact is worse
  than reporting the bucket, so the third is named as the bucket it is.

  **SAMPLING ONE ELEMENT IS THE DEFAULT AND THE UNION IS THE OPTION.** One
  element answers the question fast and is representative of its type. A mixed
  set of different families genuinely varies, and `sampleOnly` off is how that
  variation is found - at the cost of reading everything.

  **VERSION 2: EACH PARAMETER WITH ITS GUID, AND THE FULL RECORD.** Two
  parameters sharing a name are both listed, and sameNameTwice names them;
  fullRecord gives the whole record as one string. See the note above the
  contract.

# VERSION 2 - THE FULL RECORD, AND WHY IT IS A COMMENT. These paragraphs were the
# purpose's until check-routing measured them, 2026-10-12: the longer purpose
# dropped "list every parameter that exists on this element" and "what
# parameters does this duct have" from #1 to #2 here. With them here, two of
# this card's sentences that were not #1 anyway slip one place (#2 to #3, #5
# to #6) and nothing else in the library moves. A shorter purpose line lost
# "what parameters does this duct have" again.
# A comment is not searched. heron_method and heron_lookup print the purpose,
# so the purpose keeps the two sentences above.
#
# **THE FULL RECORD (version 2).** With fullRecord true, `record` is ONE
# string holding, for each element read: its id, category and type; its
# location (point and rotation, or curve ends) and bounding box in mm; which
# way a family instance faces and hands, and whether it is flipped or
# mirrored; EVERY instance parameter and, with includeTypeParameters, every
# type parameter once per type - name, storage, kind, read-only, the GUID of a
# shared one, and the value as Revit shows it; and with includeTags every tag
# on it - tag id, view, tag type, head position and leader. One string because
# a Heron reply cuts a list to three items of 60 characters. NOT CAPPED: give
# sampleOnly false only for the few elements whose record is wanted. This is
# the record a swap reads before anything changes and compares after.
#
# **A PARAMETER IS KNOWN BY WHAT IT IS, NEVER BY ITS NAME ALONE.** A project
# can carry two shared parameters with the same name. Seen 2026-10-12 on Revit
# 2020: two called "Equipment Tag", GUID e133774c... filled and GUID
# cb0704fc... empty; a by-name read showed the empty one. Version 1 kept one
# line per name and dropped the second without a word. Every line is now keyed
# by the parameter itself, a shared one carries its GUID, and `sameNameTwice`
# names every name an element or type carries more than once - read, copy and
# compare those by GUID.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: sampleOnly
      type: bool
      source: request
    - name: includeTypeParameters
      type: bool
      source: request
    # true fills `record` - every value with its GUID, the location, the
    # bounding box and the facing, as one string. Absent is false: the
    # inventory alone, exactly as version 1. `optional: true` is what lets it
    # be left out (HeronBindingNote.AbsentValue).
    - name: fullRecord
      type: bool
      source: request
      optional: true
    # true adds every tag on each element to `record` - one pass over every
    # tag in the model. Absent is false. Read only with fullRecord.
    - name: includeTags
      type: bool
      source: request
      optional: true
  provides:
    - name: findings
      type: IList<string>
    - name: parameterNames
      role: result
      type: IList<string>
    - name: instanceCount
      role: result
      type: int
    - name: typeCount
      role: result
      type: int
    - name: elementsRead
      # How many elements were inventoried. The size of the sweep, never a
      # parameter it found (D-52).
      role: accounting
      type: int
    - name: record
      # The full record as ONE string, a line per fact (see the purpose).
      # Empty unless fullRecord is true. A string because a collection reaches
      # the chat as its count and its first three items cut at 60 characters
      # (RevitFragment.Describe) - the cut part is where the GUIDs are.
      # Written in full whatever it finds, so accounting: a negative with no
      # pair and no tag still has a record (D-52).
      role: accounting
      type: string
    - name: sameNameTwice
      # Every name an element or type read carries more than once, with each
      # one's GUID - "instance id 123: 'Equipment Tag' x2 (e133..., cb07...)".
      # A thing it FOUND, so a result (D-52). Filled with or without the record.
      role: result
      type: IList<string>
    - name: tagsFound
      # How many tags were found on the elements recorded. 0 unless fullRecord
      # and includeTags are both true.
      role: result
      type: int


revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Element.Parameters`,
  `Parameter.Definition`, `Definition.Name`, `InternalDefinition.BuiltInParameter`,
  `Parameter.IsShared`, `StorageType`, `IsReadOnly`, `AsValueString` and
  `AsString` are present and unchanged 2020 through 2027.

  Version 2 adds `Parameter.GUID` (asked only when `IsShared`),
  `LocationPoint.Point` and `Rotation`, `LocationCurve.Curve`,
  `get_BoundingBox`, `FamilyInstance.FacingOrientation`, `HandOrientation`,
  `FacingFlipped`, `HandFlipped` and `Mirrored`, and `IndependentTag`'s
  `TagHeadPosition`, `HasLeader` and `OwnerViewId` - all on every release.
  **What a tag points at changed at 2022**: `GetTaggedLocalElementIds` and
  `GetLeaderEnd(Reference)` from 2022, `TaggedLocalElementId` and `LeaderEnd`
  on 2020 and 2021. Both are looked up by name at run time rather than by a
  `#if` (row 5b-181), as `COPY_TAGS_TO_REPLACEMENTS` does.

  Version 3 adds `Element.UniqueId`, `LevelId`, `OwnerViewId` and
  `WorksetId`, `Document.IsWorkshared`, `GetWorksetTable`,
  `WorksetTable.GetWorkset(WorksetId)`, `Workset.Name`, `Curve.Length`,
  `RevitLinkInstance.GetLinkDocument` and `GetTotalTransform`,
  `Transform.OfPoint`, `Parameter.AsDouble`, `AsInteger` and `AsElementId`,
  and `ElementIsElementTypeFilter` with `LogicalOrFilter` for the id walk -
  each read off the reference assemblies as the same on all eight releases
  with `tools/api-surface --members` (2026-10-17). A typed id is matched by
  `ElementId.ToString()`, never built with the constructor that became
  `long` at 2024, and no `IntegerValue` is read.

  **`Definition.ParameterGroup` is NOT named, and that is a version decision
  rather than an omission.** It exists on 2020 and is GONE by 2027; the
  replacement `Definition.GetGroupTypeId` does not exist on 2020. Naming either
  would split this fragment in two - checked against the reference assemblies for
  2020, 2024 and 2027.

  No units API is called. Values come back through `AsValueString`, which is
  Revit's own formatting in the project's units - the same reason
  `READ_SCHEDULE_CONTENTS` reads printed text. The raw value beside it is
  Revit's internal number, never converted; points, lengths and boxes are
  feet times 304.8, millimetres (D-20, D-71).

# ROUTING - the same rows are in the fragments named here.
#
#   "what parameters does this have"     -> here - the LIST, before you know the
#                                           names
#   "what parameters can I filter on"    -> here. A schedule or a view filter can
#                                           only use a parameter the element
#                                           carries, and this is that list
#   "what is the Mark on these"          -> READ_ELEMENT_PARAMETERS - a parameter
#                                           you can already NAME. Ask this
#                                           fragment first, that one second
#   "which of these are blank"           -> DESCRIBE_BLANK_PARAMETERS
#   "the global parameters"              -> REPORT_GLOBAL_PARAMETERS - ONE value
#                                           for the whole model, not a column on
#                                           an element. Both these sentences
#                                           resolved there until 2026-09-05
#   "add a project parameter"            -> ADD_PROJECT_PARAMETER - a write
#   "set the value"                      -> WRITE_ELEMENT_PARAMETERS
#   "what group is it in"                -> NOT ANSWERED HERE, on purpose. The
#                                           group member is gone by 2027 and its
#                                           replacement never existed on 2020
#   "which parameters can I build a      -> REPORT_FILTERABLE_PARAMETERS.
#    view filter on"                        Present on the element and
#                                           legal in a filter are different
#                                           questions
#   "describe these elements fully"      -> here, with fullRecord (version 3).
#                                           Every field of up to 50 elements.
#                                           NOT an utterance, measured
#                                           2026-10-17: declaring it, or any
#                                           other sentence, tipped "what
#                                           parameters does this duct have"
#                                           to READ_ELEMENT_PARAMETERS, which
#                                           declares that sentence too while
#                                           its own table gives it here. Owed
#                                           to the owner - rows 5b-473, 5b-489
#   "what is this" / "what family and    -> DESCRIBE_ELEMENTS - category,
#    type is this"                          family, type and id, nothing more.
#                                           Identity, not the full record
#   "the elements carrying these ids"    -> FILTER_ELEMENTS_BY_ID, which HANDS
#                                           them on to the next step. Typed ids
#                                           here are described, never handed on

utterances:
  - list every parameter that exists on this element
  - what parameters can I filter on
  - what parameters does this duct have
  - show me all the parameters on this
  - what fields are available on this category
  - what can I schedule on these
  - i do not know the parameter name

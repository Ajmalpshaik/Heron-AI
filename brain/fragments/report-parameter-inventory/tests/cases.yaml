positive:
  - given: one duct, sampleOnly true
    expect: >
      its instance parameters and its type parameters, each named, compared
      against Revit's own Properties palette and Edit Type dialog on that duct -
      nothing in the palette missing from the list

  - given: a duct's Size parameter
    expect: >
      "450x250" - Revit's own formatting through AsValueString, not a decimal
      number of feet. That is what makes the list usable without conversion

  - given: a mixed set of three different families, sampleOnly false
    expect: >
      the UNION across them, with parameters that only one family carries still
      listed. This is the case sampling misses, and the reason the option exists

  - given: a shared parameter on the element
    expect: reported as "shared", distinct from built-in, with its GUID

  - given: >
      an element whose type carries two shared parameters with the same name -
      on 4355-BHVD-3D-60A10-BL003A the exhaust fan type "TRG_FAN_EXHAUST FAN:
      AX45 (450mm Long)" carries two "Classification.Uniclass.Pr.Number"
    expect: >
      BOTH listed, each with its own GUID and value (8212e2e8... blank,
      ee217f5d... "Pr_65_67_29_05"), and the name in sameNameTwice. Version 1
      kept one line per name and dropped the other without a word - measured
      322 parameters on that fan against version 2's 329

  - given: one element, fullRecord true, includeTags true
    expect: >
      record holds its location and bounding box in mm, its facing and hand,
      every instance and type parameter with kind, read-only and GUID, and every
      tag on it with view, tag type, head in mm and leader - checked against the
      Properties palette, Edit Type and each view the tags are in

  # ---- VERSION 3 (NEEDS-CHECKING Group EJ) ----------------------------------
  # Run on a TEST COPY, never the central: a copy of Snowdon-scratch_ajmal.al
  # saved as "Heron Record WS.rvt". If Collaborate > Worksets says the copy is
  # not workshared, enable worksets on the copy. Read only - nothing changes.

  - given: >
      THE D-30 POSITIVE. On Heron Record WS.rvt, 50 MIXED elements typed in
      elementIds - 10 ducts in FloorPlan: M1, 10 pipes (10 more ducts if
      the model has no pipes), 10 walls, 10
      mechanical equipment, 5 duct tags, 4 air terminals and one placed
      Revit link - with fullRecord true, includeTypeParameters true,
      sampleOnly false, includeTags true and maxChars 1000000. The ids from
      Manage > IDs of Selection, nothing selected
    expect: >
      record headed "PARAMETER RECORD: 50 element(s)" and "from 50 id(s) typed,
      50 found", no RECORD CUT line, missing empty, and EVERY FIELD FILLED
      where it applies - on every block a unique id; a level (the walls "from
      LevelId", the ducts and pipes "from RBS_START_LEVEL_PARAM"); a workset
      name; the duct tags with their owner view by name, every model element
      "owner view: none"; the ducts, pipes and walls a curve length in mm that
      matches the Length in Properties; the link "link document" with the
      linked model's title. Parameters sorted by name ignoring case, each with
      its built-in name or "-" and a raw value - a duct's Width raw in FEET
      beside the value as shown, the two agreeing once converted by hand

  - given: >
      THE SAME 50 ids with maxChars left out, so the card's default applies
    expect: >
      the binding note says maxChars not given - "60000", the card's own
      default; record no longer than 60000 characters, ending in "RECORD CUT
      AT THE 60000-CHARACTER BUDGET" naming how many were written whole, which
      element was cut and every id not written; asked again with exactly those
      ids, they are described and nothing written before is repeated

  - given: >
      60 ids typed - the 50 above and 10 more ducts - maxChars 1000000
    expect: >
      "FIRST 50 OF 60" in the header with the 51st id named as the next; the
      first 50 recorded as in the positive; the inventory in findings still
      read from all 60

  - given: >
      the 50 ids again with parameterFilter "level, offset"
    expect: >
      every block's parameter heading reads "N kept of M", and every line kept
      has "level" or "offset" in its name or its built-in name - a duct's
      Reference Level kept, a wall's Base Constraint not (neither its name nor
      WALL_BASE_CONSTRAINT holds either word); the inventory in findings is
      unfiltered

  - given: >
      A LINKED MODEL. On Heron Record WS.rvt, three structural framing ids
      from INSIDE the placed Snowdon Towers Sample Structural link - read from
      the linked file itself, opened alone, with Manage > IDs of Selection -
      with linkName "Structural" and fullRecord true
    expect: >
      "read in 'Snowdon Towers Sample Structural...' through the link" with
      the link's id; three blocks of structural framing, each id the LINK's
      own, its level from the link, its location in the link's coordinates
      with "in this model's coordinates" beside it; "tags not read"; missing
      empty. Version 2 could not reach these at all

negative:
  - given: any element at all
    expect: >
      NO PARAMETER GROUP COLUMN ANYWHERE, and the summary saying why. THIS IS THE
      VERSION CASE. Definition.ParameterGroup is gone by 2027 and GetGroupTypeId
      never existed on 2020, so a version reporting the group compiles on some
      releases and breaks the rest

  - given: a family parameter and a project parameter on the same element
    expect: >
      BOTH as "project/family (not shared)" — not guessed into one or the other.
      Revit exposes no flag separating them, and a confident wrong label is worse
      than an honest bucket

  - given: a parameter that is present but empty
    expect: >
      "<blank>" — distinguishable from a parameter that is absent, which simply
      does not appear. Those are different situations with different fixes

  - given: a line or a group, which has no type
    expect: >
      "this element has no type" IN WORDS, and the instance parameters still
      listed. Silence there reads as a fragment that stopped

  - given: >
      an element with no same-name pair and no tag - on
      4355-BHVD-3D-60A10-BL003A the exhaust louvre "TCM_EAL_T001_ExhaustLouvre:
      Standard", same switches as the positive
    expect: >
      sameNameTwice 0 and tagsFound 0, the record still written in full. A pair
      of BUILT-IN parameters sharing a name (Revit's own two "Level"s) is not
      listed: it is Revit's, on every element, and is never carried across

  - given: fullRecord left out
    expect: >
      record empty and no tag read - the inventory alone, as version 1. The
      summary says how to ask for the record

  - given: an empty element list
    expect: >
      "no parameters could be read" with the note that it is not a normal state -
      not an empty success

  - given: nothing selected and no elementIds (version 3, elements optional)
    expect: >
      it RUNS and says "Nothing was handed in - nothing selected and no
      element ids typed", parameterNames 0 - never an empty success, and no
      longer a refusal before it runs

  # ---- VERSION 3 (NEEDS-CHECKING Group EJ) ----------------------------------

  - given: >
      THE D-30 NEGATIVE. On Heron Record WS.rvt, elementIds "<one real duct
      id>, 999999999, abc", fullRecord true
    expect: >
      missing holds 999999999 and "abc (not an id - digits only)"; the duct is
      still described in full; the record's header lists both under "IN missing";
      nothing about either is invented. The binder's own typed-id rule would
      have refused the whole call - this read describes the rest

  - given: elementIds of three ids that name nothing in the model
    expect: >
      missing 3, no ELEMENT block, parameterNames 0 and "None of the 3 id(s)
      typed named an element that could be read - see missing"

  - given: >
      the three linked framing ids of the link case WITHOUT linkName
    expect: >
      each id looked up in the HOST: in missing, or - if the host holds an
      element with the same number - a block naming a different category
      from structural framing. The case version 3's linkName exists for

  - given: linkName "ZZZNOTHINGHERE" with the three framing ids
    expect: >
      nothing looked up; all three in missing; the first finding "No placed
      link matches 'ZZZNOTHINGHERE'" naming every link the model places

  - given: the link case with that link unloaded in Manage Links
    expect: >
      "matches a link that is present but NOT LOADED"; all three in missing -
      never "nothing found in the link"

  - given: ten ducts selected AND two other ids typed in elementIds
    expect: >
      only the two typed are described; a finding says the 10 selected were
      NOT read because ids were typed

  - given: the positive's ids on a model that is not workshared
    expect: >
      no workset line on any block and the header "worksets not shown - not a
      workshared model" - never a blank or invented workset

  - given: maxChars 100
    expect: >
      raised to 5000, the header saying so; the record no longer than that
      with its RECORD CUT line

  - given: a parameter whose value throws when read
    expect: >
      "<unreadable>" for that one, every other parameter still listed. One bad
      value must not cost the inventory

second_route:
  - >
    Revit's own Properties palette for instance parameters and Edit Type for type
    parameters. Those two panels ARE this list, and are what it is checked against

  - >
    Manage - Project Parameters shows which are project parameters, which is the
    one distinction this fragment honestly cannot make on its own

  - >
    Version 3: Manage > Select by ID with each typed id - the element Revit
    selects is the one the block describes - and Properties' Workset, Level and
    Length for the same element. For a linked id, the linked file opened alone
    with Select by ID

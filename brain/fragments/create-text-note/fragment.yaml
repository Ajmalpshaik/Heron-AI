id: FRG-VIEW-022
semantic-identity: "put a text note on this view at this point"
kind: action
domain: revit.annotation
capability: CREATE_TEXT_NOTE
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Places a text note in one view, at a point, in a text style the project
  already has.

  **It is view-only annotation, and that is the fact people forget.** A text
  note lives on ONE view. Writing *"provide 300 mm clearance"* on the
  coordination plan puts nothing on the section, the ceiling plan or the sheet,
  and the note is not part of the model. That is not a limitation to work
  around - it is what a note IS - but it decides whether the person who needs
  to read it ever does.

  **The style comes from the project, never from a size.** Text height, font
  and arrowhead belong to a TextNoteType the project's template already
  carries, and a note created with the wrong one is a drawing that fails its
  own standard while reading correctly on screen.

# VERSION 2 (2026-10-17, FRAGMENT-ISSUES 5b-930) - PARAGRAPHS, AND A NUMBERED
# OR BULLETED LIST. Kept out of the purpose on purpose, as EDIT_TEXT_VALUES
# keeps its own: the purpose is searched, and list words there would pull
# QUESTIONS about a note ("is this note numbered") to a tool that makes one.
#
#   noteText         a paragraph break is typed \r, a soft line break
#                    (Shift+Enter) \v and a backslash \\ - the marks
#                    EDIT_TEXT_VALUES takes and READ_ELEMENT_PARAMETERS shows a
#                    note's wording in. A chat's values arrive one per line, so
#                    without them a new note could only be one paragraph. A
#                    backslash that is meant is typed \\ - "C:\revit" would
#                    become "C:", a paragraph break and "evit"
#   listType         one list for every paragraph, or one per paragraph with
#                    commas between, the last carrying on - "None,
#                    ArabicNumbers" keeps a GENERAL NOTES heading out of the
#                    numbering. Revit's words None, Bullet, ArabicNumbers,
#                    LowerCaseLetters, UpperCaseLetters, or the plain ones no
#                    list, bullets, numbers, lowercase letters, uppercase
#                    letters. Left out: None, which is version 1's note exactly
#   listStartNumber  the number the first numbered or lettered paragraph takes,
#                    3 for "3.", 2 for "b.". Left out: 1, Revit's own start
#
#   Both may be left out (`optional: true` with `absent:`, row 5b-488's
#   mechanism), so every caller of version 1 is bound as before.
#
#   REFUSED BEFORE THE NOTE IS MADE: a list word Revit has not got, more list
#   words than paragraphs, a start number that is not a whole number or is
#   outside GetMinimumListStartNumber..GetMaximumListStartNumber, a start number
#   other than 1 with nothing numbered or lettered, and two DIFFERENT lists on
#   paragraphs side by side - SetListType's remarks, every release: paragraphs
#   next to each other in lists at one indent are one list, and a type set on
#   one reaches all of them.
#
#   IT READS THE NOTE BACK: the wording, every paragraph's list type (over the
#   paragraph WITH its closing carriage return, the range EDIT_TEXT_VALUES
#   version 4 measured the getters need on Revit 2020) and the start number. A
#   note that reads back other than asked is in the drawing, so it goes in
#   `unverified`, never `created`, and `noteFormatting` names the paragraph.
#
#   NOT RUN IN REVIT. Compiled for all eight releases; the proof plan is in
#   tests/cases.yaml and NEEDS-CHECKING group HE. Version 1's proof below no
#   longer describes the code and is kept as a record; the card is DRAFT until
#   version 2's proof is signed.

contract:
  needs:
    - name: doc
      type: Document
    - name: view
      type: View
      source: request
    - name: at
      type: XYZ
      source: request
    - name: noteText
      type: string
      source: request
    - name: textTypeId
      type: ElementId
      source: request
    # VERSION 2. One list type for every paragraph, or one per paragraph with
    # commas between. Left out, "None" - version 1's note.
    - name: listType
      type: string
      source: request
      optional: true
      absent: None
    # VERSION 2. The number the first numbered or lettered paragraph takes.
    # Left out, 1 - Revit's own start.
    - name: listStartNumber
      type: string
      source: request
      optional: true
      absent: 1
  provides:
    - name: created
      role: result
      type: ElementId
    - name: unverified
      # Version 2. A note Revit made that reads back other than asked - its
      # wording, a paragraph's list or the start number. It is in the drawing
      # (Ctrl+Z takes it out), so it is never `created` (D-52).
      role: accounting
      type: ElementId
    - name: noteFormatting
      # Version 2. The note's paragraphs and each one's list as READ BACK -
      # "1 no list, 2-4 ArabicNumbers from 1" - or what reads back different.
      # A sentence about what was made, never a thing it found (D-52).
      role: accounting
      type: string
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string


compatibility-note: >
  One implementation for every release. Read off the shipped reference
  assemblies and RevitAPI.xml of 2020 through 2027 on 2026-10-20:
  View.SunAndShadowSettings; SunAndShadowSettings' SunAndShadowType,
  StartDateAndTime, EndDateAndTime (UTC out, local or UTC in), TimeInterval,
  IsTimeIntervalValid, SunriseToSunset, Azimuth and Altitude (radians),
  RelativeToView, UsesGroundPlane, GroundPlaneLevelId, IsGroundPlaneLevelValid,
  GetMatchingPreset, ProjectLocationName, Latitude, Longitude, TimeZone and
  UsesDST; SiteLocation.ConvertFromProjectTime and ConvertToProjectTime -
  present and alike on every release. SunStudyTimeInterval gains Seconds15,
  Seconds30, Seconds45 and Minute at 2024, so intervals are matched by name at
  run time and a release without one says so.

# ROUTING - the same rows are in the render, sun, display and camera cards.
#
#   "set the sun to 10 am on 21 June"          -> here
#   "make a shadow study for the whole day"    -> here
#   "use the summer solstice preset"           -> here
#   "set the project location to Doha"         -> SET_PROJECT_LOCATION, the
#                                                 site for the whole project
#   "set the sun intensity to 80"              -> SET_GRAPHIC_DISPLAY_OPTIONS,
#                                                 the view's display lighting
#   "set the render lighting to exterior sun"  -> SET_RENDER_SETTINGS
#   "what sun does this view use"              -> REPORT_RENDER_SETTINGS (D-86)
#   "make this view look good"                 -> APPLY_VISUAL_PRESET, a whole
#                                                 look in one call

utterances:
  - set the sun for this view to 21 June at 10 am
  - make a single day solar study from sunrise to sunset every hour
  - apply the summer solstice sun preset to this 3D view
  - put the shadow ground plane on level 1
  - set a lighting sun at azimuth 135 and altitude 35 degrees

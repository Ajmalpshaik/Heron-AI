# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# A HOOK TYPE IS AN ANGLE, AN EXTENSION AND A STYLE - all three from the
# spec, none defaulted (D-33):
#   angle      degrees, more than 0 and no more than 180 (Revit's limit, read
#              off RebarHookType.Create's remarks: 0 < angle <= pi)
#   extension  the straight length after the bend as a MULTIPLE OF THE BAR
#              DIAMETER - "12" for 12d - which is how Revit stores it
#              (StraightLineMultiplier, more than 0 and no more than 99). Not
#              millimetres: a hook length in millimetres is set per bar type,
#              which this does not do
#   style      "standard" for main bars or "stirrup/tie" for links. A placing
#              tool refuses a hook whose style does not match the bar it is put
#              on, because Revit does
# The name is the modeller's. A name already used is refused, naming that
# type's angle.
#
# READ BACK: the type's name, angle, extension and style after a regenerate.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Makes a new rebar hook type with the name, bend angle, extension and style
  the modeller gives - for standard bars or for stirrups and ties.

contract:
  needs:
    - name: doc
      type: Document
    - name: hookName
      type: string
      source: request
    # Degrees, more than 0 and no more than 180.
    - name: angle
      type: string
      source: request
    # A multiple of the bar diameter - "12" for 12d.
    - name: extension
      type: string
      source: request
    # "standard" or "stirrup/tie".
    - name: hookStyle
      type: string
      source: request
  provides:
    - name: created
      role: result
      type: IList<ElementId>
    - name: readBack
      # The new type as Revit now holds it (D-52).
      role: accounting
      type: string
    - name: refused
      role: accounting
      type: string
    - name: findings
      type: IList<string>


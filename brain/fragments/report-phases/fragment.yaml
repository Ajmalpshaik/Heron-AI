id: FRG-DOC-007
semantic-identity: "the project's phases, in order, with the exact names to use"
kind: action
domain: revit.document
capability: REPORT_PHASES
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Every phase in the project, in the order Revit holds them, with the exact
  name and id of each.

  **IT IS THE DISCOVERY STEP FOR EVERY PHASE JOB**, and without it those jobs
  are guesses. `SET_ELEMENT_PHASE` needs an exact existing phase name; so does
  anything that renames or deletes one. A near-miss - *"Existing"* against
  *"Existing Construction"* - fails or, worse, matches something else. Nothing
  in Revit's own UI hands over that list in a form anything can use.

  **THE ORDER IS INFORMATION, NOT PRESENTATION.** Phases are sequential and
  Revit keeps them so: *"the phase before this one"* and *"the last phase"* are
  real ideas that only the order can answer. It is returned as Revit holds it
  and never sorted by name, which would put *"Phase 10"* between *"Phase 1"* and
  *"Phase 2"*.

  **A MODEL WITH ONE PHASE IS THE COMMON CASE AND IS NOT A FINDING.** Most
  projects never leave the default, and reporting that as something to look at
  wastes the reader's attention on the majority of models.

contract:
  needs:
    - name: doc
      type: Document
      source: ambient
  provides:
    - name: phaseNames
      type: IList<string>
    - name: phaseIds
      type: IDictionary<string, ElementId>
    - name: phaseCount
      type: int

proof:
  date: "2026-09-07"
  by: "Claude Opus 5, at Ajmal PS's PC"
  model: >
    Revit 2024.3, session 29340. Positive on 'Project1 work_ajmal.al' (3,435
    elements, a workshared local) AFTER the owner added three phases to it
    during the session. Negative on 'Snowdon Towers Sample HVAC.rvt' (9,628
    elements), measured twice on the same build earlier the same day while both
    models were open at once.
  positive_case: >
    phaseCount 5, and the names came back IN PROJECT ORDER - Existing, Phase 1,
    Phase 2, Phase 3, New Construction. The order is the answer, not a
    detail: the three new phases sit BETWEEN the two the template ships with,
    which is where inserting after Existing puts them, and a phase list in any
    other order would be wrong even with the right names in it. phaseIds
    returned 5 entries, matching.
  negative_case: >
    Snowdon Towers: exactly 2, Existing and New Construction - the pair every
    Revit project starts with. That is the case that makes 5 mean something,
    and it is the reason this fragment could not be promoted before 2026-09-07:
    both models available until then had only the default pair, so a fragment
    that simply returned "Existing, New Construction" regardless would have
    passed. It was measured at 2 BEFORE the owner added any phase and at 5
    after, on one build, which ties the number to a known cause.
  second_route: >
    The same 5 names were reached by a DIFFERENT REVIT FILTER in the same run.
    This fragment walks `doc.Phases`, a PhaseArray; a
    FilteredElementCollector(doc).OfClass(typeof(Phase)) found 5 elements with
    exactly the same names. Two different mechanisms, one answer - and they can
    legitimately disagree, which is what makes agreeing worth something. Revit's
    own Manage > Phases dialog is the third: it is what the owner used to create
    them.
  fingerprint: "fe91601e84901793"

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Document.Phases` and `Phase.Name` are
  unchanged 2020 to 2027, and no units call is made. `Phases` is a `PhaseArray`
  rather than a generic collection, so it is walked with a plain index - which
  is also what preserves the order, since converting it to a set would lose the
  one thing the fragment exists to report.

# ROUTING - repeated in REPORT_DESIGN_OPTIONS.
#
#   "what phases are in this model"      -> here
#   "which design option am I working in" -> REPORT_DESIGN_OPTIONS - phases
#                                        and options BOTH change what "all the
#                                        ducts" means, and they are different
#                                        settings with different fixes
#   "create a new phase"                 -> NOTHING HERE CAN. Revit exposes no
#                                        create call for a phase on any release
#                                        - checked at both ends. Add it under
#                                        Manage, Phases
utterances:
  - what phases are in this project
  - list the phases
  - what is the phase called
  - which phase is the last one
  - show me the phase names

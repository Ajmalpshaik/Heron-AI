compatibility-note: >
  ONE implementation, and no member it calls changes between 2020 and 2027 -
  read off the reference assemblies for each release with `tools/api-surface
  --members`: `ParameterFilterElement.SetCategories(ICollection<ElementId>)`,
  `GetCategories`, `GetElementFilter`, `GetElementFilterParameters` and the
  static `ElementFilterIsAcceptableForParameterFilterElement(Document,
  ISet<ElementId>, ElementFilter)`; `ParameterFilterUtilities.
  GetAllFilterableCategories` and `GetFilterableParametersInCommon`;
  `FilterRule.GetRuleParameter`; `FilterStringRule.RuleString` and
  `GetEvaluator`; `ElementParameterFilter.GetRules`;
  `ElementLogicalFilter.GetFilters`;
  `ElementMulticategoryFilter(ICollection<ElementId>)`;
  `LabelUtils.GetLabelFor(BuiltInParameter)`; and the
  `ElementId(BuiltInCategory)` and `ElementId(BuiltInParameter)`
  constructors. No id is read as a number.

  Version 2's members, read the same way on 2026-10-15 and unchanged 2020
  through 2027: `ParameterFilterElement.SetElementFilter(ElementFilter)`
  (returns bool), `ClearRules()`, `FilterElement.IsNameUnique(Document,
  string)`, `Element.Name { get; set; }`, `NamingUtils.IsValidName`,
  `Document.Settings.Categories`, `Category.GetCategory(Document, ElementId)`
  `ElementParameterFilter(FilterRule)`, `LogicalOrFilter` and
  `ElementFilter.Inverted { get; }`; a text rule's `CaseSensitive` is read
  by reflection where a release has it. The text rule factories are
  reached BY REFLECTION exactly as CREATE_VIEW_FILTERS_BY_RULE version 2
  reaches them - CreateEqualsRule, CreateNotEqualsRule, CreateContainsRule,
  CreateNotContainsRule, CreateBeginsWithRule, CreateNotBeginsWithRule,
  CreateEndsWithRule and CreateNotEndsWithRule are (ElementId, string, bool)
  on 2020 to 2025 and (ElementId, string) on 2023 to 2027; the two-argument
  one is used where it exists, the three-argument one with `false`
  elsewhere. That code is a COPY - a fragment cannot call another's - and is
  kept in step with CREATE_VIEW_FILTERS_BY_RULE by hand: the operator words,
  their factory methods, the parameter matched by label or built-in name,
  and the read-back's rule words.

# ROUTING - the same rows are in CREATE_VIEW_FILTERS_BY_RULE.
#
#   "rename this view filter"                -> here, with newName. RENAME_ELEMENTS renames what a finder hands it, never a filter
#   "change the filter rule to does not contain TRG_MEC" -> here, with matchValue - the parameter kept
#   "add grids to this filter"               -> here, with the WHOLE list - the ones it has and Grids
#   "take the Duct Systems category off      -> here
#    these view filters"
#   "add duct insulation and lining to       -> here, with the WHOLE list -
#    those filters"                             what is not named is taken off
#   "create a supply air filter for ducts"   -> CREATE_VIEW_FILTERS_BY_RULE.
#                                               This never makes a filter
#   "put that filter on this view"           -> APPLY_VIEW_FILTER
#   "take that filter off the view"          -> REMOVE_VIEW_FILTER - the view
#                                               loses it; the filter keeps its
#                                               categories
#   "what filters already exist"             -> REPORT_VIEW_FILTERS
#   "which parameters can I filter duct      -> REPORT_FILTERABLE_PARAMETERS
#    insulation by"

utterances:
  - take the Duct Systems category off these view filters
  - change the categories of these view filters
  - add duct insulation and lining to those filters
  - set which categories the filter applies to
  - rename this view filter
  - rename this filter
  - change the filter rule to does not contain TRG_MEC
  - change the rule of this view filter
  - add grids to this filter

id: FRG-VIEW-112
semantic-identity: "rename existing view filters, change their rule, and tick and untick their categories"
kind: action
domain: revit.views
capability: SET_VIEW_FILTER_CATEGORIES
# VERSION 2 (2026-10-15, FRAGMENT-ISSUES 5b-481): the filter's NAME and RULE
# can be changed too - `newName`, `parameterName` and `matchValue` - and
# `categories` may be blank. A blank keeps what the filter has, so version 1's
# calls, which give categories and nothing else, mean what they meant. On a
# live model that day a rename and a re-rule took six undo steps and left a
# filter behind, because no tool could edit either. DRAFT until version 2 is
# run in Revit: NEEDS-CHECKING Group EE.
version: 2
source: OFFICIAL
risk: MODIFY
# A settings change: after it runs from the chat, the Companion page offers its values
# as a table the modeller can edit and apply again (docs/40 section 21.1).
companion: settings
companion-subject: filterNames

purpose: >
  Edits rule-based view filters already in the project - renames one, changes
  its rule, changes which categories it applies to, or all three in one undo
  step - keeping every view it is on and its overrides there. *"Rename it
  OUTSEL_TRG_MECH_Level_Grid, add Grids, and make the rule Type Name does not
  contain TRG_MEC."*

  **A BLANK KEEPS WHAT THE FILTER HAS** - the name, the rule or the categories.

  **THE CATEGORIES GIVEN REPLACE THE ONES IT HAD.** One it had that the request
  leaves out is taken off, which is how "not Duct Systems" is said; adding one
  means giving the ones it has and the new one.

  **THE RULE IS WRITTEN WITH ITS OPERATOR IN FRONT** - "does not contain
  TRG_MEC", "begins with M_"; none means equals. A parameter left blank keeps
  the one the rule tests now.

  **A CATEGORY THE RULE CANNOT APPLY TO IS LEFT OUT, NAMED WITH THE REASON, AND
  THE REST ARE STILL SET.** Each is asked whether it may be filtered by every
  parameter the rule tests, then put to Revit's own acceptability test for that
  rule, and the survivors are tested together once more before anything is
  set. One that no given category survives for keeps what it had - never
  emptied. A new rule with the categories kept must fit all of them.

  **A NEW NAME OR RULE IS ALL OR NOTHING.** A name another filter has, or a rule
  one filter cannot take, changes nothing.

  **A SECOND RUN CHANGES NOTHING.** What it already holds is reported as already
  so and not written again.

  **AFTERWARDS EACH ONE IS READ BACK FROM REVIT** - its name, categories, rule,
  and how many elements that rule catches today.

  ASSUMES AN OPEN TRANSACTION (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: filterNames
      # Names of filters already in the project, as Manage, Filters lists them.
      type: IList<string>
      source: request
    - name: categories
      # The WHOLE new list - it replaces what each filter holds - or BLANK to
      # keep the categories each filter has. TEXT since version 2, read into
      # categories by the fragment in the add-in binder's order (OST_ name,
      # the name Visibility/Graphics shows, the OST_ name without its prefix):
      # the binder refuses a blank IList<BuiltInCategory> before the fragment
      # runs, so a typed list could not be left blank. Callers type exactly
      # what they typed before.
      type: IList<string>
      source: request
    - name: newName
      # The filter's new name, or BLANK to keep it. One filter only; a name
      # another filter has is refused by name.
      type: string
      source: request
    - name: parameterName
      # The parameter the new rule tests, as Revit shows it ("Type Name") or by
      # its built-in name, or BLANK to keep the one the rule tests now.
      type: string
      source: request
    - name: matchValue
      # The new rule's value with its operator in front, as
      # CREATE_VIEW_FILTERS_BY_RULE version 2 takes it: equals, does not
      # equal, contains, does not contain, begins with, does not begin with,
      # ends with, does not end with ("does not contain TRG_MEC"). None means
      # equals. BLANK keeps the rule as it is.
      # The new rule REPLACES every condition the filter had, AND or OR. With
      # parameterName blank the filter's rule must be one condition on one
      # parameter, else the parameter has to be named. A name in filterNames
      # that is no rule-based filter stops a new rule or name for all of them.
      type: string
      source: request
  provides:
    - name: changed
      role: result
      type: IList<Element>
    - name: readBack
      # Each named filter as Revit holds it afterwards - changed, already so,
      # or left as it was: its categories, its rule, and the elements it
      # catches today. ONE STRING, because a list reaches the chat as three
      # entries cut at sixty characters and the rule is at the end of each.
      # ACCOUNTING, not a result (2026-10-15): it describes every named filter
      # whether or not anything changed, so it is filled in the negative too
      # and a proof read it as content there. `changed` is the result.
      role: accounting
      type: string
    - name: alreadySet
      # Filters that already held exactly what was asked - name, categories
      # and rule - and were not written. The prior state, never a change it
      # made (D-52).
      role: accounting
      type: IList<string>
    - name: leftOut
      # Categories given that a filter's rule cannot apply to, each with the
      # reason - left out of what was set. Given and unusable (D-52).
      role: accounting
      type: IList<string>
    - name: notFound
      # Names that are no rule-based filter in this project - absent, or a
      # selection filter. The evidence it looked (D-52).
      role: accounting
      type: IList<string>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string


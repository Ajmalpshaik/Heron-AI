id: FRG-QA-032
semantic-identity: "the lines that are too short to be real, that nobody can see or select"
kind: filter
domain: revit.quality
capability: FIND_DEGENERATE_LINES
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Finds lines and other curve-driven elements that are shorter than a stated
  length - the accidental double-click leftovers nobody can see, select or
  delete by hand.

  **`FIND_OVERLAPPING_LINES` IS A DIFFERENT DEFECT.** That one finds lines drawn
  ON TOP of each other, which are each perfectly real and visible. A degenerate
  line is one with almost no length at all: it prints as nothing, it cannot be
  picked without a crossing window, and it sits in the model inflating counts and
  tripping up anything that walks geometry. Nothing looked for them.

  **THE THRESHOLD IS THE CALLER'S AND THERE IS NO SENSIBLE DEFAULT.** Revit's own
  short-curve tolerance is about 0.8 mm; a detail line of 2 mm is equally
  certainly a mistake and a 50 mm one might be deliberate. A number invented here
  would become a number quietly relied on, so it is asked for (D-33).

  **IT REPORTS AND DELETES NOTHING.** This is a READ. `DELETE_ELEMENTS` is the
  other half and it reports the true blast radius first, which matters: deleting
  a line can take a dimension with it.

  ASSUMES NOTHING ABOUT TRANSACTIONS - it opens none and needs none.

contract:
  needs:
    - name: doc
      type: Document
    - name: categories
      type: IList<BuiltInCategory>
      source: request
    - name: shorterThanMm
      type: double
      source: request
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: shortestMm
      # THE SHORTEST THING SCANNED, NOT THE SHORTEST THING FOUND - so it is
      # non-zero whatever the threshold does, exactly like `examined` below.
      # Measured 2026-09-19 against Project1 work_ajmal.al: asked for lines
      # under 0.001 mm it correctly returned NO elements and still reported
      # `shortestMm 2000.00000000002` - the shortest of the 18 ducts scanned.
      # The runner read that as a negative case returning content and called
      # the whole proof NEG NOT EMPTY, which was the contract's fault and not
      # the fragment's: it did precisely the right thing.
      role: accounting
      type: double
    - name: examined
      # How many curve-driven elements were looked at, so an empty answer can be
      # told from an empty scan. Evidence it looked (D-52).
      role: accounting
      type: int
    - name: findings
      type: IList<string>


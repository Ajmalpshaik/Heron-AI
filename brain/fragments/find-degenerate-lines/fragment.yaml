    0 item(s), examined 6, findings 1 item(s) [0 of 6 curve-driven element(s) are shorter
    than 0.0 mm. The ...], shorterThanMm 0.001, shortestMm 2000, skippedCurves 0. inputs came
    categories as given (1); shorterThanMm as given. on Night Rig 1124
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  built_on:
    revit_release: '2024'
    revit_build: 24.3.60.12
    addin_version: 0.3.0.0
    addin_hash: b5c1b9426090689f
  fingerprint: 148ac72131530fec
revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  `LocationCurve`, `Curve.Length` and `ElementMulticategoryFilter` are present
  2020 through 2027 - read off the reference assemblies at both ends. Lengths are
  internal FEET inside Revit and the threshold arrives in millimetres, so 304.8
  appears once, converting the threshold in (D-20).

# ROUTING - repeated in FIND_OVERLAPPING_LINES and FIND_DUPLICATE_ELEMENTS.
#
#   "find the tiny leftover lines"   -> here
#   "lines drawn on top of each other" -> FIND_OVERLAPPING_LINES - a different
#                                      defect, and both of those lines are real
#   "the same thing placed twice"    -> FIND_DUPLICATE_ELEMENTS
#   "now get rid of them"            -> DELETE_ELEMENTS, which reports what ELSE
#                                      goes - a line can take a dimension with it

utterances:
  - find degenerate lines
  - find zero length lines
  - detect tiny lines nobody can select
  - find the leftover line fragments

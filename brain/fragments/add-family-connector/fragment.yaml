compatibility-note: >
  `ConnectorElement.CreateDuctConnector(document, DuctSystemType,
  ConnectorProfileType, planarFace)`, `CreatePipeConnector(document,
  PipeSystemType, planarFace)`, `CreateElectricalConnector(document,
  ElectricalSystemType, planarFace)`, `FamilyManager
  .AssociateElementParameterToFamilyParameter` and the built-in parameters
  CONNECTOR_WIDTH, CONNECTOR_HEIGHT and CONNECTOR_DIAMETER read the same 2020
  through 2027 (api-surface, read 2026-09-24). Global = 29 and Fitting = 28 are
  in DuctSystemType and PipeSystemType 2020 through 2027, and
  `new ElementId(BuiltInCategory)` is on every release (api-surface,
  2026-10-04). The three system enums are read
  by name at run time, so a system added in a later release is offered there
  without a change here. Version 3 also reads
  a `GeomCombination`'s geometry and `Reference.ElementId`, present in every
  reference assembly 2020 through 2027 (RevitAPI.xml, read 2026-10-11).

# ROUTING - see SET_FAMILY_CATEGORY for the whole family-building table.
#
#   "put a supply air connector on the neck"     -> here
#   "link the connector flow to a parameter"     -> LINK_FAMILY_PARAMETER - a
#                                                   connector ALREADY in the
#                                                   family, any linkable
#                                                   parameter
#   "which connectors does this family have"     -> REPORT_FAMILY_CONNECTORS
#   "set this connector to Global", "flip it"    -> SET_FAMILY_CONNECTOR_ROLES,
#                                                   a connector already made
#   "add an electrical connector to the family"  -> here; its voltage, poles,
#                                                   load and power factor are
#   "make the connector 3 phase 400 V"           -> SET_FAMILY_CONNECTOR_ROLES
#                                                   after it is made (v3). By
#                                                   one ranking route alone the
#                                                   first sentence reaches that
#                                                   card; the served answer is
#                                                   this one (measured
#                                                   2026-10-12, Revit 2020)
#   "connect these ducts to the terminal"        -> CONNECT_AIR_TERMINALS, in a
#                                                   project
#   "report connector sizes in the model"        -> REPORT_CONNECTORS
#   "delete the connector I just added"          -> REMOVE_FAMILY_CONNECTOR -
#                                                   one already made, deleted

utterances:
  - put a supply air duct connector on the neck top
  - add a connector to this family sized by Neck Width and Neck Depth
  - add a domestic cold water pipe connector on this face
  - add an electrical connector to the family
  - add a fire protection wet pipe connector to the sprinkler family
  - put a supply air connector on the neck

id: FRG-MEP-053
semantic-identity: "put a duct, pipe or electrical connector on this face of the family - or on a flange ring's face, sized by its opening - sized by its parameters"
kind: action
domain: revit.families
capability: ADD_FAMILY_CONNECTOR
version: 9
source: OFFICIAL
risk: MODIFY

# VERSION 9 (2026-11-26) - A PORT THAT WILL NOT FIT IS REFUSED, NOT THROWN.
# Row 5b-2051, seen on Revit 2020 running NEEDS-CHECKING Group QP check QP2
# on a scratch copy of the owner's AHU family: a 215 x 205 port on a ring
# whose opening is 209 x 209 came back with the right words but as
# fragment_threw, so the negative could not count and version 8 was not
# signed. The fit is measured on the connector once it is made, so the
# making and the fit check now run in a SubTransaction: a port that fits is
# committed and tied as before; one that does not is rolled back and the same
# words come back through refused, nothing kept. The same refusal covers a
# whole face whose port is not the face's own size. Compiled for 2020 to 2027,
# never run in Revit; DRAFT until Group QP is run again (D-30).
#
# VERSION 8 (2026-11-24) - DUCT SIZE AND PIPE SIZE PARAMETERS SIZE A
# CONNECTOR, AND A PORT MAY BE SMALLER THAN A RING'S OPENING. Rows 5b-2031 and
# 5b-2032, seen on Revit 2020 building an air handling unit family: shared
# parameters of spec Duct Size ("Supply_Air_Width") and Pipe Size
# ("Condensate_Drain_Diameter") were refused as "not a length", though Revit's
# Associate Family Parameter takes them for a duct connector's width and
# height and a pipe connector's diameter; and a 205 x 205 port on a flange ring
# whose opening is 209 x 209 was refused as "would not fit". Now a Duct Size
# parameter sizes a duct connector and a Pipe Size one a pipe connector (Length
# still sizes any; a Duct Size on a pipe connector is refused by name), and on
# a ring face a port up to the opening's size is taken, either way round, with
# the clearance said. WHY A RING AND NOT A WHOLE FACE: a ring's opening is a
# bore, and a real flange is bored a little over its duct - the port must fit
# inside it, centred, not equal it. On a whole face the face IS the port - a
# neck's end - so a port of another size there means the wrong parameters were
# given, and it is still refused. A port larger than the opening is refused as
# before. Version 7 was PROVEN (the proof block below, kept as the record of
# what it proved); its C# moved, so it is DRAFT again until NEEDS-CHECKING
# Group QP is run (D-30).
#
# VERSION 7 (2026-11-21) - ONLY A FACE THAT FACES OUT, AND AT THE POINT
# GIVEN, COUNTS. Issue Ajmalpshaik/Heron-AI#1029 again: version 6 narrowed the
# count only when form= or facing= was given, so with both left out the
# issue's two refusals came back exactly as before. Now (1) a face that faces
# into another solid all over - the raised face's underside sitting on the
# flange top - is left out, counted and said, whatever was given: points spread
# over the face, out to 4% from its edges, are stepped 0.5 to 1.5 mm out along
# its normal, and only when
# every one lands inside a solid of the family is the face inside the body;
# (2) `at`, optional, the connector's centre "X, Y, Z" in mm - only a face whose
# centre (the one a refusal lists) lies within 1 mm of it counts, so the lid
# screws 1 m away drop out; a point more than 1 mm off the plane is refused;
# (3) the connector is never put inside the body: where another solid covers
# the chosen face at its own centre on the side it points - a flange top under
# its raised face, a box top under its neck; for a ring, at the opening's edge -
# nothing is made and that solid is named. An independent review the same day
# found three faults in the first draft, all fixed before merge: two points
# alone judged a rectangle, at= refused the refusal's own "X 0, Y 0, Z 884 mm",
# and a bored ring's cover went unseen. Left out, `at` binds "none". The card was DRAFT at version 6, never
# proved; it stays DRAFT at version 7 until NEEDS-CHECKING Group PO is run.
#
# VERSION 6 (2026-11-20) - form= AND facing= PICK THE FACE, and back to DRAFT.
# Issue Ajmalpshaik/Heron-AI#1029, seen 2026-11-19 on Revit 2020 in a fixed
# pump family: the discharge flange's raised face was refused twice - on its
# top plane (Z 884) "2 solid faces lie on "Discharge Face" (facing up, up)",
# the second the top of four terminal-box lid screws about 1 m away at the
# same Z; on the flange top (Z 882) "(facing up, down)", the second the raised
# face's own underside - and the workaround was a 1 mm ring hidden inside the
# raised face on a new plane. Version 5 counts every solid face on the plane,
# anywhere in the family. Two optional inputs now narrow that: `form`, the
# unique id(s) of the form(s) whose face takes the connector - only their own
# faces count, and of joined or cut geometry only a combination one of them is
# in; an id that is not a solid form of this family is refused by name - and
# `facing`, the way the face points, in this card's own words (up, down,
# left, right, front, back, or +Z, -Z, -X, +X, -Y, +Y). A refusal for more
# than one face now lists each with its form's id, the way it faces and its
# centre in mm, and says to give form= or facing=, so one more call settles
# it. Left out, both bind "none" and every face counts exactly as in version
# 5; version 5's rules - joined and cut faces, a face with no reference, the
# sizes - are unchanged. Version 5 was PROVEN (the proof block below, kept as
# the record of what it proved); its C# moved, so it is DRAFT again until
# NEEDS-CHECKING Group OT is run (D-30) - on the owner's word that a
# fragment found wrong may be changed even though it is proven.

purpose: >
  Puts one MEP CONNECTOR on a face of the family open in the Family Editor -
  the face lying on a named reference plane, "Neck Top" - for the system named,
  and ties its size to the family's own parameters: a rectangular duct port to
  Neck Width and Neck Depth, a round duct or a pipe to one diameter. The
  connector sits at the centre of that face and points out of it.

  **A NEW CONNECTOR DOES NOT TAKE ITS FACE'S SIZE.** It comes out at a generic
  one foot, whatever face it is on - reported from an earlier family build, on
  a 200 x 200 face and again on a 45 mm pipe stub. So a duct or pipe connector
  is refused without the parameters that size it, and those are ASSOCIATED to
  the connector's own width, height or diameter - so the port follows the
  neck when the family is resized, instead of being right once. An electrical
  connector has no size and takes none.

  **CABLE TRAY AND CONDUIT** (version 4, 2026-10-13, the gap fill): a tray
  port sized by width then height, a conduit port by its diameter.

  **THE FACE IS NAMED BY THE PLANE IT LIES ON.** A face cannot be typed, but
  every face of a box built by EXTRUDE_BETWEEN_PLANES lies on a named plane.
  Exactly one solid face must lie on the plane named; none, or more than one,
  is refused with the count, because a connector on the wrong face points the
  wrong way and nothing about it looks wrong in plan.

  **ONLY A FACE THAT FACES OUT, AT THE POINT GIVEN (version 7, issue #1029).**
  A plane is infinite, so on a real family more than one face lies on it - in
  the issue's pump, the raised face's top and four lid screws a metre away at
  the same height, and on the plane below, the flange top and the raised
  face's own underside. A face that faces into another solid all over is
  inside the body and never counts: it is left out and said. `at`, the
  connector's centre in mm, leaves out every face whose centre is not within
  1 mm of it; `form` and `facing` narrow it the same way. And where the face
  chosen is covered at its own centre on the side it points - the flange top
  under its raised face - nothing is made and the form covering it is named,
  because a connector there would sit inside that form.

  **A JOINED OR CUT FORM'S FACE IS FOUND TOO (version 3, row 5b-410).** Once a
  form is joined or cut by COMBINE_FAMILY_FORMS - a flange cut by a bore void -
  Revit keeps its faces in the combination's geometry and the form's own reads
  empty, so a flange face exactly on its plane came back "no solid face". Every
  combination's faces are now searched when no form's own face lies on the
  plane, under the same rule: exactly one, or refused with the count. A form's
  own face is still used first, so a thin solid joined to nothing, laid on a
  cut face, takes the connector wherever Revit will not take it on the joined
  face - and where a form's own face wins with joined faces on the same plane
  too, the result says how many. What Revit's reference to a joined face names,
  and whether Revit takes a connector on it, is reported as Revit answers; a
  refusal names that way round.

  **THE SYSTEM DECIDES THE KIND.** "Supply Air" makes a duct connector,
  "Domestic Cold Water" a pipe one, "Power Balanced" an electrical one - matched
  to Revit's own system names, spaces ignored, never guessed. The name Revit's
  System Classification list shows is taken too where it differs from the API's
  - "Fire Protection Wet", "Fire Protection Pre-Action", "Hydronic Supply" - so
  what the modeller reads in Revit is what they can type (row 5b-297). A bare
  "Other" is not taken: a duct has Other Air and a pipe Other Pipe. Revit has no
  steam system; a steam connection is Other Pipe.

  **GLOBAL AND FITTING ARE TAKEN TOO** - a valve body's two connectors are
  Global so a system passes through it. Both are a duct and a pipe system, so
  the domain comes from the words, "Global pipe", or else from the family's
  category: Global on a Pipe Accessories family is a pipe connector. Where
  Revit refuses one, its words are reported and nothing is kept.

  **WHICH WAY ROUND IS MEASURED, NOT ASSUMED.** Revit takes a connector's own
  width direction from the face, not from the family's X, so a parameter named
  "Neck Width" can come out driving the port's height. The face is measured
  along the connector's own axes and the two parameters are tied the way round
  the face is built - a 400 x 300 neck gets a 400 x 300 port - and the report
  says when they were turned. Parameters that fit the face neither way round
  are refused: that port would not fit the face it sits on.

  **DUCT SIZE AND PIPE SIZE PARAMETERS SIZE IT TOO (version 8, row
  5b-2031).** A shared parameter of spec Duct Size sizes a duct connector's
  width and height, and one of spec Pipe Size a pipe connector's diameter, as
  Revit's own Associate Family Parameter allows; a Length parameter sizes any
  connector. A Duct Size parameter given for a pipe connector, or the other
  way, is refused by name.

  **IN A RING'S OPENING, A PORT UP TO ITS SIZE (version 8, row 5b-2032).** A
  flange is bored a little over its duct - a 205 x 205 duct in a 209 x 209
  opening - so on a ring face the port must fit INSIDE the opening, centred,
  either way round, and the answer says the clearance each side. On a whole
  face the face is the port, and it is still matched exactly. A port larger
  than the opening is refused.

  **THE SIZE IS READ BACK, AND A MISMATCH IS NOT KEPT.** After the ties the
  connector's width and height are read against the face, or its diameter
  against its parameter; one that differs fails the call. Flow direction,
  description and electrical load are left at Revit's defaults;
  SET_FAMILY_CONNECTOR_ROLES changes them, and the system, afterwards.

  **ALL OR NOTHING.** A connector that cannot be tied to its size is not left
  behind at one foot: the call fails and nothing is kept.

  **A FLANGE RING'S FACE IS MEASURED BY ITS OPENING (version 5, 2026-10-24,
  row 5b-1334).** A duct accessory's port belongs on its flange: a ring round
  the duct opening, 600 x 400 inside and 640 x 440 outside. Version 4 measured
  the whole outline and refused the ring - "a port sized by them would not fit
  the face it sits on". Now, when one inner loop of the face holds the
  connector's centre, that loop - the opening - is measured, and the
  connector must sit at its centre or nothing is kept; a face of one loop is
  measured whole, exactly as before. Two openings round the centre are
  refused. Measured first on Revit 2020 (rolled back, in the owner's volume
  control damper): a ring sketched on the end plane took the connector at its
  centre and moved with that plane when Length changed. A REFERENCE PLANE
  ALONE TAKES NO CONNECTOR through the API - "oEdgeLoopRef.ptr() is NULL", and
  a sketch plane made from it "is not a planar face" - and a nested family's
  face took one off-centre that stayed put when the frame moved; the ring is
  the way round both.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The reference plane or level the face lies on - "Neck Top".
    - name: facePlane
      type: string
      source: request
    # The system, as Revit names it - "Supply Air", "Return Air", "Domestic
    # Cold Water", "Sanitary", "Fire Protection Wet", "Fire Protection Other",
    # "Other Pipe", "Power Balanced", "Global" ("Global pipe" where the
    # category does not say). A bare "Other" is refused - "Other Pipe" for a
    # pipe, "Other Air" for a duct (row 5b-433).
    - name: system
      type: string
      source: request
    # The parameters that size it, comma separated: two for a rectangular
    # duct port (width first, then height), one for a round duct or a pipe
    # (the diameter), none for an electrical connector. Each is a Length, or
    # (version 8) a Duct Size for a duct connector or a Pipe Size for a pipe
    # connector.
    - name: sizeParameters
      type: string
      source: request
    # VERSION 6 (#1029). The unique id(s) of the form(s) whose face takes the
    # connector, as the form tools give them back, commas between. Only those
    # forms' own faces on `facePlane` count, and of joined or cut geometry
    # only a combination one of them is in. An id that is not a solid form of
    # this family is refused by name. Left out ("none"): every solid form's
    # face counts, version 5 exactly.
    - name: form
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 6 (#1029). The way the face points out of its solid - up, down,
    # left, right, front or back, or +Z, -Z, -X, +X, -Y, +Y, the words
    # `connector` gives back. Only a face pointing that way counts. Left out
    # ("none"): a face pointing any way counts, version 5 exactly.
    - name: facing
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 7 (#1029). The connector's centre, "X, Y, Z" in millimetres -
    # the centre a refusal lists for each face, taken as it prints it ("X 0,
    # Y 0, Z 884 mm") or as three bare numbers. Only a face whose centre lies
    # within 1 mm of it counts; a point more than 1 mm off `facePlane` is
    # refused. Left out ("none"): a face anywhere on the plane counts.
    - name: at
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: connector
      # The connector as made, read back: its kind, system, shape and size,
      # and which way it points.
      role: result
      type: string
    - name: sizedBy
      # Each tie made: the connector's own dimension and the parameter that now
      # drives it.
      role: result
      type: IList<string>
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing was made, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


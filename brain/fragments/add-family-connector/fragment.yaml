id: FRG-MEP-053
semantic-identity: "put a duct, pipe or electrical connector on this face of the family - or on a flange ring's face, sized by its opening - sized by its parameters"
kind: action
domain: revit.families
capability: ADD_FAMILY_CONNECTOR
version: 5
source: OFFICIAL
risk: MODIFY

purpose: >
  Puts one MEP CONNECTOR on a face of the family open in the Family Editor -
  the face lying on a named reference plane, "Neck Top" - for the system named,
  and ties its size to the family's own parameters: a rectangular duct port to
  Neck Width and Neck Depth, a round duct or a pipe to one diameter. The
  connector sits at the centre of that face and points out of it.

  **A NEW CONNECTOR DOES NOT TAKE ITS FACE'S SIZE.** It comes out at a generic
  one foot, whatever face it is on - reported from an earlier family build, on
  a 200 x 200 face and again on a 45 mm pipe stub. So a duct or pipe connector
  is refused without the parameters that size it, and those are ASSOCIATED to
  the connector's own width, height or diameter - so the port follows the
  neck when the family is resized, instead of being right once. An electrical
  connector has no size and takes none.

  **CABLE TRAY AND CONDUIT** (version 4, 2026-10-13, the gap fill): a tray
  port sized by width then height, a conduit port by its diameter.

  **THE FACE IS NAMED BY THE PLANE IT LIES ON.** A face cannot be typed, but
  every face of a box built by EXTRUDE_BETWEEN_PLANES lies on a named plane.
  Exactly one solid face must lie on the plane named; none, or more than one,
  is refused with the count, because a connector on the wrong face points the
  wrong way and nothing about it looks wrong in plan.

  **A JOINED OR CUT FORM'S FACE IS FOUND TOO (version 3, row 5b-410).** Once a
  form is joined or cut by COMBINE_FAMILY_FORMS - a flange cut by a bore void -
  Revit keeps its faces in the combination's geometry and the form's own reads
  empty, so a flange face exactly on its plane came back "no solid face". Every
  combination's faces are now searched when no form's own face lies on the
  plane, under the same rule: exactly one, or refused with the count. A form's
  own face is still used first, so a thin solid joined to nothing, laid on a
  cut face, takes the connector wherever Revit will not take it on the joined
  face - and where a form's own face wins with joined faces on the same plane
  too, the result says how many. What Revit's reference to a joined face names,
  and whether Revit takes a connector on it, is reported as Revit answers; a
  refusal names that way round.

  **THE SYSTEM DECIDES THE KIND.** "Supply Air" makes a duct connector,
  "Domestic Cold Water" a pipe one, "Power Balanced" an electrical one - matched
  to Revit's own system names, spaces ignored, never guessed. The name Revit's
  System Classification list shows is taken too where it differs from the API's
  - "Fire Protection Wet", "Fire Protection Pre-Action", "Hydronic Supply" - so
  what the modeller reads in Revit is what they can type (row 5b-297). A bare
  "Other" is not taken: a duct has Other Air and a pipe Other Pipe. Revit has no
  steam system; a steam connection is Other Pipe.

  **GLOBAL AND FITTING ARE TAKEN TOO** - a valve body's two connectors are
  Global so a system passes through it. Both are a duct and a pipe system, so
  the domain comes from the words, "Global pipe", or else from the family's
  category: Global on a Pipe Accessories family is a pipe connector. Where
  Revit refuses one, its words are reported and nothing is kept.

  **WHICH WAY ROUND IS MEASURED, NOT ASSUMED.** Revit takes a connector's own
  width direction from the face, not from the family's X, so a parameter named
  "Neck Width" can come out driving the port's height. The face is measured
  along the connector's own axes and the two parameters are tied the way round
  the face is built - a 400 x 300 neck gets a 400 x 300 port - and the report
  says when they were turned. Parameters that fit the face neither way round
  are refused: that port would not fit the face it sits on.

  **THE SIZE IS READ BACK, AND A MISMATCH IS NOT KEPT.** After the ties the
  connector's width and height are read against the face, or its diameter
  against its parameter; one that differs fails the call. Flow direction,
  description and electrical load are left at Revit's defaults;
  SET_FAMILY_CONNECTOR_ROLES changes them, and the system, afterwards.

  **ALL OR NOTHING.** A connector that cannot be tied to its size is not left
  behind at one foot: the call fails and nothing is kept.

  **A FLANGE RING'S FACE IS MEASURED BY ITS OPENING (version 5, 2026-10-24,
  row 5b-1334).** A duct accessory's port belongs on its flange: a ring round
  the duct opening, 600 x 400 inside and 640 x 440 outside. Version 4 measured
  the whole outline and refused the ring - "a port sized by them would not fit
  the face it sits on". Now, when one inner loop of the face holds the
  connector's centre, that loop - the opening - is measured, and the
  connector must sit at its centre or nothing is kept; a face of one loop is
  measured whole, exactly as before. Two openings round the centre are
  refused. Measured first on Revit 2020 (rolled back, in the owner's volume
  control damper): a ring sketched on the end plane took the connector at its
  centre and moved with that plane when Length changed. A REFERENCE PLANE
  ALONE TAKES NO CONNECTOR through the API - "oEdgeLoopRef.ptr() is NULL", and
  a sketch plane made from it "is not a planar face" - and a nested family's
  face took one off-centre that stayed put when the frame moved; the ring is
  the way round both. Version 4's proof no longer describes the code and is
  kept below as a record; the card is DRAFT until NEEDS-CHECKING Group JA is
  signed.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The reference plane or level the face lies on - "Neck Top".
    - name: facePlane
      type: string
      source: request
    # The system, as Revit names it - "Supply Air", "Return Air", "Domestic
    # Cold Water", "Sanitary", "Fire Protection Wet", "Fire Protection Other",
    # "Other Pipe", "Power Balanced", "Global" ("Global pipe" where the
    # category does not say). A bare "Other" is refused - "Other Pipe" for a
    # pipe, "Other Air" for a duct (row 5b-433).
    - name: system
      type: string
      source: request
    # The length parameters that size it, comma separated: two for a
    # rectangular duct port (width first, then height), one for a round duct
    # or a pipe (the diameter), none for an electrical connector.
    - name: sizeParameters
      type: string
      source: request
  provides:
    - name: connector
      # The connector as made, read back: its kind, system, shape and size,
      # and which way it points.
      role: result
      type: string
    - name: sizedBy
      # Each tie made: the connector's own dimension and the parameter that now
      # drives it.
      role: result
      type: IList<string>
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing was made, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


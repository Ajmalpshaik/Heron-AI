positive:
  - given: >
      a Pipe Accessories valve family, facePlane "Port Left", system "Global",
      sizeParameters "Nominal Diameter"
    expect: >
      a pipe connector reading Global, the pipe domain taken from the
      category and said so. MEASURED 2026-10-04, Revit 2024, rolled back in
      TRG_PLMB_VLV_PPR Gate Valve_GV_R0

  - given: >
      an Air Terminals family with a NON-SQUARE 400 x 300 neck locked between
      planes, its top on Neck Top; facePlane "Neck Top", system "Supply Air",
      sizeParameters "Neck Width, Neck Depth" holding 400 and 300
    expect: >
      a rectangular Supply Air duct connector whose width and height lie along
      the neck's 400 and 300 sides, pointing up, at the neck top's centre -
      LOOKED AT in the Family Editor by selecting the connector and reading its
      Properties, and the report saying whether the two parameters were turned
      to fit. Then Neck Width changed to 500 in Family Types and the connector
      read again along the same side. A square neck cannot show a swap, which
      is why this case is not square

  - given: >
      a stub on a Mechanical Equipment family, its end on the plane Drain End,
      system "Sanitary", sizeParameters "Drain Size" holding 50
    expect: a pipe connector of 50 mm diameter, pointing out of the stub

  - given: >
      a Sprinklers family with a pipe stub, its end on the plane Inlet End,
      system "Fire Protection Wet" - the name Revit's System Classification
      list shows, not the API's FireProtectWet - sizeParameters "Inlet Size"
      holding 25
    expect: >
      a pipe connector of 25 mm diameter whose System Classification reads
      Fire Protection Wet in Properties, and the report naming it Fire
      Protection Wet (row 5b-297)

  - given: >
      VERSION 3, row 5b-410. A scratch Metric Generic Model: boxes A (rect
      -150,-50 -50,50) and B (rect 50,-50 150,50), both Ref. Level 0 to 100,
      and a void cylinder (circle 0,50 20 on Center (Left/Right), X -160 to
      160) through both, all three combined by COMBINE_FAMILY_FORMS into one
      combination. facePlane "Port Left" (X -150), system "Domestic Cold
      Water", sizeParameters "Port Dia" holding 40
    expect: >
      a pipe connector, round 40 mm, at X -150, Y 0, Z 50, pointing left
      (-X), sizedBy "connector diameter <- Port Dia", and `connector` saying
      the face is one of joined or cut forms, naming the combination and WHAT
      REVIT'S REFERENCE TO THE FACE NAMES - record that. Before version 3 the
      same call refused "No solid face lies on "Port Left"". IF REVIT REFUSES
      the connector on the joined face instead, the refusal must carry
      Revit's own words, what the reference names and the way round (a thin
      solid joined to nothing) - record it, and the card says so in place of
      this case

  - given: >
      the same scratch family with a ring joined to nothing on box B's right
      face - circle 0,50 35 | circle 0,50 20 on Center (Left/Right), X 149 to
      150, solid - and facePlane "Port Right", system "Domestic Cold Water",
      sizeParameters "Port Dia"
    expect: >
      the connector on the RING's face, as before version 3 - a form's own
      face is used before a joined one - pointing right (+X) at X 150, and
      `connector` ending "1 face(s) of joined or cut forms lie on the same
      plane too". This is the way round row 5b-410 used, kept working

  - given: >
      a Cable Tray Fittings family with a 300 x 100 end face on "End Left";
      facePlane "End Left", system "Cable Tray", sizeParameters "Tray Width, Tray Height"
    expect: >
      a cable tray connector, rectangular 300 x 100 mm, tied to both
      parameters and read back (version 4)

  - given: >
      VERSION 5, row 5b-1334. A Duct Accessories family whose duct runs along
      X: a 3 mm ring extrusion sketched on the end plane Casing Right (X 150),
      outer 640 x 440 and opening 600 x 400 (Width x Height), its faces locked
      to the ring and duct planes; nothing else lies on Casing Right.
      facePlane "Casing Right", system "Supply Air", sizeParameters "Width,
      Height" holding 600 and 400
    expect: >
      a rectangular Supply Air duct connector 600 x 400 mm at X 150, Y 0, Z 0,
      pointing right (+X), `connector` saying it is centred in the ring face's
      opening and sized by it. Then Length, Width and Height flexed and the
      connector read again: it stays at the ring's centre on Casing Right and
      reads the new Width and Height

negative:
  - given: system "Global" in a Generic Models family
    expect: refused - Global is a duct and a pipe system both; "Global pipe" or "Global duct" asked for

  - given: system "Globl" (misspelt)
    expect: refused, nothing made. MEASURED 2026-10-04

  - given: system "Supply Air" and sizeParameters empty
    expect: >
      refused, nothing made - a duct connector with no size parameter would
      stay at Revit's one-foot placeholder. Checked: no connector in the family

  - given: facePlane "Box Top", where the body's top AND the neck's bottom both lie
    expect: >
      refused with the count of faces and which way each faces. Not a
      connector put on whichever came first

  - given: system "Suply Air" (misspelt)
    expect: refused with close system names offered, nothing made

  - given: system "Fire Protection Wett" (misspelt) on the Sprinklers family
    expect: >
      refused with Fire Protection Wet offered as close, nothing made. Checked:
      no connector in the family

  - given: system "Other"
    expect: >
      refused, nothing made, with Other Air (duct) and Other Pipe (pipe)
      offered - both read as "Other" in Revit's lists, so the kind is not
      picked for the modeller

  - given: >
      sizeParameters holding 600 and 600 on a 400 x 300 neck face
    expect: >
      refused with both sizes named - a port that does not fit its face - and
      no connector in the family

  - given: a facePlane that no solid face lies on
    expect: refused naming EXTRUDE_BETWEEN_PLANES, nothing made

  - given: a project in front
    expect: notAFamily true and nothing made

  - given: >
      VERSION 3, row 5b-410, the scratch family of the joined-face positive:
      facePlane "Box Top" (Z 100), where the tops of boxes A and B both lie -
      two faces of ONE combination, neither a form's own
    expect: >
      refused, "2 faces of joined or cut forms lie on "Box Top" (facing up,
      up)", sizedBy empty, and no connector in the family

  - given: >
      VERSION 5, the ring family of the positive, sizeParameters "Width,
      Height" holding 640 and 440 - the ring's OUTER size, not its opening
    expect: >
      refused, "The opening of the ring face on "Casing Right" is 600 x 400
      mm ...", nothing made - the port is the opening, never the flange

second_route:
  - >
      Create, Duct Connector by hand on the same face in a copy of the family,
      its width and height associated to the same parameters in Properties,
      and the two connectors' readings compared

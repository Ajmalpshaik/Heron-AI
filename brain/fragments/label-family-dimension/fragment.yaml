compatibility-note: >
  `ItemFactoryBase.NewDimension(view, line, references)`, `Dimension.FamilyLabel
  { get; set; }`, `Dimension.AreSegmentsEqual { get; set; }`, `Dimension.Value`,
  `ReferencePlane.GetReference()` and `new Reference(Element)` read the same 2020
  through 2027 (api-surface, read 2026-09-24). A parameter's kind is read by
  reflection, because it moved at 2022 - `Definition.ParameterType` before,
  `Definition.GetDataType()` from. Version 2 adds `Element.Pinned`,
  `Dimension.IsLocked`, `Dimension.References` and
  `BuiltInParameter.DATUM_PLANE_DEFINES_ORIGIN`, each in RevitAPI.xml for
  2020 and 2027 alike (read 2026-10-22). Whether Revit counts a locked
  alignment as a `Dimension` with `IsLocked` in every release, and which end
  it moves when both are held, is what NEEDS-CHECKING Group IU has to show.


compatibility-note: >
  `ItemFactoryBase.NewDimension(view, line, references)`, `Dimension.FamilyLabel
  { get; set; }`, `Dimension.AreSegmentsEqual { get; set; }`, `Dimension.Value`,
  `ReferencePlane.GetReference()` and `new Reference(Element)` read the same 2020
  through 2027 (api-surface, read 2026-09-24). A parameter's kind is read by
  reflection, because it moved at 2022 - `Definition.ParameterType` before,
  `Definition.GetDataType()` from. Version 2 adds `Element.Pinned`,
  `Dimension.IsLocked`, `Dimension.References` and
  `BuiltInParameter.DATUM_PLANE_DEFINES_ORIGIN`, each in RevitAPI.xml for
  2020 and 2027 alike (read 2026-10-22). Whether Revit counts a locked
  alignment as a `Dimension` with `IsLocked` in every release, and which end
  it moves when both are held, is what NEEDS-CHECKING Group IU has to show.
  Version 3: `FamilyItemFactory.NewAngularDimension(View, Arc, Reference,
  Reference)`, `Arc.Create(XYZ, double, double, double, XYZ, XYZ)`,
  `ReferencePlane.BubbleEnd` / `FreeEnd` / `Normal` and `Dimension.Value`
  (radians for an angle) read the same 2020 through 2027 (api-surface, read
  2026-11-11). An angle's kind moved at 2022 like a length's -
  `ParameterType.Angle` before, `SpecTypeId.Angle` through
  `Definition.GetDataType()` from - so it is read by reflection, newest first,
  as SET_FAMILY_TYPE_VALUES reads it. Which plane Revit turns when an angle
  label is flexed is what Group NE has to show.

# ROUTING - see SET_FAMILY_SETTINGS for the whole family-building table.
#
#   "label the width with the Width parameter"   -> here
#   "keep it centred as it resizes"               -> here, with a centre plane
#   "label the angle between these planes with Arrow Angle"
#                                                 -> here, version 3, an angle
#                                                    parameter between two
#                                                    planes that meet
#   "dimension the angle between these grids"     -> CREATE_ANGULAR_DIMENSION -
#                                                    a project annotation,
#                                                    no label
#   "dimension these ducts"                       -> CREATE_DIMENSION - a
#                                                    project annotation
#   "dimension the grids and levels"              -> CREATE_LINEAR_DIMENSION, version 5
#                                                    (CREATE_DIMENSION's version 4
#                                                    until 2026-11-01)
#   "delete this parameter even though it labels a dimension"
#                                                 -> DELETE_FAMILY_PARAMETERS
#                                                    with unlabelFirst; this
#                                                    card only ever ADDS a label

utterances:
  - label the width dimension with the Width parameter
  - make the width between these reference planes parametric
  - drive the height from Ref Level to Box Top by Height
  - add an EQ and label the depth with Depth
  - label the width with the Width parameter
  - keep it centred as it resizes
  # VERSION 3 (2026-11-11): an angle.
  - label the angle between these planes with Arrow Angle

id: FRG-GEO-035
semantic-identity: "tie the distance between two family planes to a parameter, kept centred if asked"
kind: action
domain: revit.families
capability: LABEL_FAMILY_DIMENSION
# Version 2 (2026-10-22, row 5b-1326) changed impl/: which end a flex would
# move is read BEFORE the label is made and said. Seen on Revit 2020 (session
# 78736): "Trap Depth" labelled from a new, unpinned, unreferenced plane
# "Floor Top" to "Trap Top" (two labelled dimensions on it) read back fine, and
# the next SET_FAMILY_TYPE_VALUES 300 -> 400 moved Floor Top up 100 mm and left
# Trap Top where it was - twice - until Floor Top was pinned. Each end is now
# read (a level, pinned, defines the origin, or referenced by a labelled
# dimension, an EQ or a lock = held; none of those = FREE); a free end is named
# in `freeEnd` and the findings with the pin route, and `pinFreeEnd` may pin it
# on the modeller's word, read back. The zero-distance refusal names the same
# route. Version 1's proof below no longer describes the code: DRAFT until
# NEEDS-CHECKING Group IU proves version 2 (D-30).
# Still version 2, never signed: on 2026-10-24 Group IU's IU10 measured on
# Revit 2020 that a level nobody pinned is MOVED by a flex when the other end
# is pinned (Height P 250 -> 400 moved Ref. Level down 150 mm), so "a level is
# held fast" was wrong there; the findings now say so (row 5b-1332).
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Dimensions two parallel reference planes of the family open in the Family
  Editor and LABELS that dimension with a family parameter, so the parameter
  drives how far apart they are - "Box Left to Box Right is Width". With a
  centre plane named as well, it also adds the EQ dimension across the three,
  so the two planes move equally either side of the centre instead of one
  edge doing all the moving. This is the step that makes a family parametric.

  **THE PARAMETER MUST ALREADY HOLD THE DISTANCE THE PLANES ARE APART.** The
  moment a dimension is labelled, Revit moves the planes to the parameter's
  value. A new length reads zero, so labelling first collapses the planes onto
  each other and the skeleton is gone - reported from an earlier family build.
  So the distance is measured and compared with the parameter first, and a
  difference of more than half a millimetre refuses the call with both numbers,
  naming SET_FAMILY_TYPE_VALUES.

  **ONE LABEL PER PARAMETER, AND PER PAIR OF PLANES.** A parameter that already
  labels a dimension is refused a second one, and so is a pair of planes that a
  labelled dimension already measures: two dimensions driving one parameter fight as soon as
  anything moves - reported from an earlier family build, where a rebuild left
  the old plane-to-plane dimension behind beside its replacement.

  **THE EQ NEEDS THE CENTRE PLANE MIDWAY.** An EQ dimension moves the planes
  until both sides are equal, so a centre plane that is not already midway is
  refused rather than quietly shifting the geometry. Both plan axes are usually
  centred - the family's insertion point then sits in the middle of the box -
  and the base-to-top height usually is not.

  **A LEVEL COUNTS AS A PLANE**, so a height is labelled from Ref. Level to a
  top plane. Left-right and front-back dimensions are drawn in the floor plan,
  heights in an elevation, placed outside the planes so they stay readable.

  **ALL OR NOTHING, READ BACK AFTER REVIT REGENERATES.** The label, the EQ, the
  distance the dimension reads and where every plane now sits are read after
  the regeneration; a plane that moved or a reading that differs fails the
  call, and nothing is kept.

  **WHICH END A FLEX WOULD MOVE IS SAID FIRST** (version 2). When the
  parameter changes, Revit moves whichever end of the labelled dimension is
  least held. Each end is read before the label is made, in three grades: a
  level, a pinned plane or one that defines the origin is held FAST - a
  flex never moves it, except a level nobody pinned, which a flex moves when
  the other end is pinned (5b-1332); a plane that a labelled dimension drives from
  elsewhere, or that an EQ or a lock ties to another plane or level, is
  held SOFTLY - a flex moves it only through that chain; a plane none of
  those touch is FREE, Revit's first choice to move. Seen on Revit 2020: a
  height labelled from a new, free plane to a plane carrying two other
  labels moved the FREE plane when flexed, and did until that plane was
  pinned. So a free end beside a softly held one, or two free ends, is
  named in `freeEnd` and the findings as the end a flex may move - *pin it
  (SET_PIN_STATE) or dimension it to a level*. A free end beside one held
  fast is the ordinary height from Ref. Level: the free end is the only one
  a flex can move, so the findings say so and nothing is warned of. Two
  ends held fast have nothing a flex can move, and the findings say that -
  unless one is a level nobody pinned: then the findings say the flex moves
  the level, and every form on it, and to unpin the other end.
  With a centre plane the EQ moves both ends equally, so no end is free on
  its own. The label is still made in every case: a free end is a warning,
  not a refusal. Nothing is pinned unasked (Article 7); `pinFreeEnd=true`
  pins the free end - the first named, when both are - before the label
  and reads the pin back, and pins nothing, saying why, where a pin would
  leave the flex nothing to move or fight the EQ. Two planes in the same
  place are refused as before, and that refusal names the same route. A
  lock or an EQ to geometry ties the geometry to the plane, not the plane
  to anything, and does not count; a lock or EQ running between the two
  ends is named as what the label will fight; a plain dimension holds
  nothing.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # One end: a reference plane or a level, by name - "Box Left", "Ref. Level".
    - name: fromPlane
      type: string
      source: request
    # The other end, parallel to the first.
    - name: toPlane
      type: string
      source: request
    # The length parameter that will drive the distance - "Width".
    - name: parameterName
      type: string
      source: request
    # A plane midway between the two to keep them equal about - "Center
    # (Left/Right)". Empty for a one-sided size such as a height.
    - name: centrePlane
      type: string
      source: request
    # Version 2. true pins a FREE end - one held by nothing - before the label
    # goes on, so a flex moves the other end; left out, nothing is pinned and
    # the free end is only named (Article 7). With both ends free, the
    # fromPlane is the one pinned. Nothing is pinned, and the findings say
    # why, when the other end is a level, pinned or the origin (the free end
    # is then the only one a flex can move) or a centre plane's EQ is asked.
    - name: pinFreeEnd
      type: bool
      source: request
      optional: true
  provides:
    - name: labelled
      # The dimension made, read back: which parameter now drives which two
      # planes, and the distance it reads.
      role: result
      type: string
    - name: freeEnd
      # Version 2. The warning, whole: which plane is held by nothing, what
      # holds the other, and the pin route. Empty when which end moves is
      # settled - both ends held, one end held fast and the other free (the
      # ordinary height), or an EQ across a centre plane - the negative case.
      role: result
      type: string
    - name: pinnedEnd
      # Version 2. The plane pinned on pinFreeEnd=true, read back pinned.
      # Empty when nothing was pinned.
      role: result
      type: string
    - name: equalised
      role: result
      type: bool
    - name: distanceMm
      # The distance between the planes, read off the labelled dimension after
      # the write.
      role: result
      type: double
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing was made, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


positive:
  - given: >
      a family with Box Left at X -300 and Box Right at X 300, a type where the
      length Width holds 600; fromPlane "Box Left", toPlane "Box Right",
      parameterName "Width", centrePlane "Center (Left/Right)"
    expect: >
      labelled reading 600 mm and equalised true - and in the floor plan a
      dimension showing "Width = 600" with an EQ dimension beside it. Then
      Width typed as 800 in Family Types moves BOTH planes 100 mm outward,
      measured, with the centre plane still midway

  - given: >
      fromPlane "Ref. Level", toPlane "Box Top" at Z 250, parameterName
      "Height" holding 250, centrePlane empty
    expect: >
      a height dimension labelled Height in an elevation, reading 250 mm, and
      equalised false

  - given: >
      VERSION 2 - the case of 2026-10-22. A NEW plane "Floor Top" at Z 0
      (unpinned, no dimension or lock on it) and "Trap Top" at Z 300 carrying
      two other labelled dimensions; "Trap Depth" holding 300; fromPlane
      "Floor Top", toPlane "Trap Top", pinFreeEnd left out
    expect: >
      labelled reading 300 mm, AND `freeEnd` naming "Floor Top" as held by
      nothing, "Trap Top" as held by the two labelled dimensions, and the pin
      route (SET_PIN_STATE, or dimension it to a level). Nothing pinned:
      `pinnedEnd` empty, Floor Top still unpinned in Properties. Then Trap
      Depth typed as 400 moves FLOOR TOP, as the warning said

  - given: the same, with pinFreeEnd=true
    expect: >
      `pinnedEnd` says "Floor Top" was pinned first and reads back pinned;
      Floor Top shows the pin in Revit; Trap Depth typed as 400 now moves TRAP
      TOP to Z 400 and Floor Top stays at 0

  # VERSION 3 (2026-11-11, row 5b-1498). The first case re-proves version 2's
  # length path on the Group NE scratch family; the rest FAIL on version 2,
  # which took only a length between parallel planes.
  - given: >
      version 3, the scratch family of NEEDS-CHECKING Group NE (a metric
      Generic Model family saved under %TEMP%\heron-work\link-angle):
      "Box Left" at X -300 and "Box Right" at X 300, the length "Width"
      holding 600; fromPlane "Box Left", toPlane "Box Right", parameterName
      "Width", centrePlane "Center (Left/Right)"
    expect: >
      version 2's answer exactly - labelled reading 600 mm, equalised true,
      angleDegrees 0; Group NE, NE4

  - given: >
      version 3, the same family with an upright reference plane "Arrow
      Slope" drawn by hand in Ref. Level through the family's centre, 30
      degrees from "Center (Front/Back)", not pinned, and an Angle parameter
      "Arrow Angle" holding 30; fromPlane "Center (Front/Back)", toPlane
      "Arrow Slope", parameterName "Arrow Angle", centrePlane empty
    expect: >
      labelled "Arrow Angle drives the angle between ...", angleDegrees 30, an
      angular dimension in Ref. Level showing "Arrow Angle = 30" with its arc
      centred where the planes cross; neither plane moved; a finding that
      "Center (Front/Back)" defines the origin, so a flex is expected to turn
      "Arrow Slope". Then, KEPT, Arrow Angle typed as 45 in Family Types turns
      ONE plane - record which, and about what point; Group NE, NE5 and NE7

  - given: version 3, the same planes and an Angle parameter "Arrow Back Angle" holding 150 (the other side of the crossing)
    expect: >
      labelled reading 150, the arc on the obtuse side - the parameter's
      value chooses the side; Group NE, NE6

negative:
  - given: >
      VERSION 2 - the ordinary height. fromPlane "Ref. Level" (a level),
      toPlane "Box Top" held by nothing, Height holding the distance,
      pinFreeEnd left out; then again with pinFreeEnd=true
    expect: >
      labelled as before and NO free-end warning: `freeEnd` empty, a finding
      saying "Ref. Level" is a level and "Box Top" is held by nothing, so a
      flex moves "Box Top" - the ordinary case. With pinFreeEnd=true NOTHING
      is pinned and the finding says why - pinned, the flex would have
      nothing to move. This is the negative case: the end a flex moves is
      settled, so nothing is warned of and nothing is pinned

  - given: >
      VERSION 2. fromPlane "Ref. Level" (a level), toPlane "Box Top" PINNED,
      Height holding the distance
    expect: >
      labelled, `freeEnd` empty, and a finding that both ends are held fast
      so a flex of Height has nothing it can move - unpin the one meant to
      move. Nothing pinned. Then Height typed as 400 in Family Types: record
      what Revit does - a refusal, or no movement

  - given: >
      VERSION 2. fromPlane "Box Left", toPlane "Box Right", centrePlane
      "Center (Left/Right)" (defines the origin), both ends held by nothing,
      pinFreeEnd=true
    expect: >
      labelled with the EQ as version 1 did, `freeEnd` empty, a finding that
      the EQ moves both ends equally about the centre so no end is free on
      its own, and NOTHING pinned - the finding says a pinned end would fight
      the EQ

  - given: >
      VERSION 2. Two planes at the same Z, "Trap Depth" holding 300
    expect: >
      refused as in the same place, and the refusal names the route - pin the
      one that must stay (SET_PIN_STATE), move the other, SET_FAMILY_TYPE_VALUES
      to the distance, then label. Nothing made, nothing pinned

  - given: >
      the same planes 600 apart and Width still holding 0 (never written)
    expect: >
      refused with both numbers - 600 mm apart, Width holds 0 - naming
      SET_FAMILY_TYPE_VALUES. And the planes NOT collapsed: measured still
      600 apart. This is the guard the fragment exists around

  - given: Width already labelling a dimension, asked again
    expect: refused, one label per parameter, and no second dimension made

  - given: centrePlane "Center (Left/Right)" with Box Left at -200, Box Right at 400
    expect: >
      refused as not midway, and neither plane moved - an EQ would have
      shifted them

  - given: fromPlane "Box Left" and toPlane "Box Top"
    expect: refused as not parallel, nothing made

  - given: a project in front
    expect: notAFamily true and nothing made

  # VERSION 3 (2026-11-11, row 5b-1498).
  - given: >
      version 3, the Group NE family, a length "Wrong Width" holding 450
      between Box Left and Box Right 600 apart - version 2's guard, re-proved
    expect: >
      refused with both numbers, 600 mm and 450, naming SET_FAMILY_TYPE_VALUES;
      the planes still 600 apart; Group NE, NE4's negative

  - given: >
      version 3, "Center (Front/Back)" and "Arrow Slope" 30 degrees apart and
      an Angle parameter "Wrong Angle" holding 45
    expect: >
      refused before anything is made - "meet at 30 degrees (150 on the other
      side) and Wrong Angle holds 45" - naming SET_FAMILY_TYPE_VALUES; no
      dimension made and neither plane turned; Group NE, NE5's negative

  - given: version 3, "Arrow Angle" between "Box Left" and "Box Right" (parallel)
    expect: refused as parallel, making no angle, a LENGTH labelling them; nothing made; Group NE, NE6's negative

  - given: version 3, "Arrow Angle" with centrePlane "Center (Left/Right)"
    expect: refused - an EQ is for a distance - and nothing made

  - given: version 3, "Arrow Angle" already labelling the angle, asked again
    expect: refused, one label per parameter, no second dimension; Group NE, NE7

  - given: version 3, fromPlane "Ref. Level" with an Angle parameter
    expect: refused - a level is not taken for an angle; draw a reference plane on it - nothing made

second_route:
  - >
      Annotate, Aligned dimension between the same two planes by hand in a copy
      of the family, labelled with the same parameter from the ribbon, and the
      two dimensions' readings compared
  - >
      Version 3: in Ref. Level select the angular dimension made and read its
      label and value on the ribbon and in Properties; then Annotate, Angular
      between the same two planes by hand in a copy of the family, labelled
      Arrow Angle, and the two readings compared

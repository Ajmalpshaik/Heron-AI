positive:
  - given: >
      a family with Box Left at X -300 and Box Right at X 300, a type where the
      length Width holds 600; fromPlane "Box Left", toPlane "Box Right",
      parameterName "Width", centrePlane "Center (Left/Right)"
    expect: >
      labelled reading 600 mm and equalised true - and in the floor plan a
      dimension showing "Width = 600" with an EQ dimension beside it. Then
      Width typed as 800 in Family Types moves BOTH planes 100 mm outward,
      measured, with the centre plane still midway

  - given: >
      fromPlane "Ref. Level", toPlane "Box Top" at Z 250, parameterName
      "Height" holding 250, centrePlane empty
    expect: >
      a height dimension labelled Height in an elevation, reading 250 mm, and
      equalised false

  - given: >
      VERSION 2 - the case of 2026-10-22. A NEW plane "Floor Top" at Z 0
      (unpinned, no dimension or lock on it) and "Trap Top" at Z 300 carrying
      two other labelled dimensions; "Trap Depth" holding 300; fromPlane
      "Floor Top", toPlane "Trap Top", pinFreeEnd left out
    expect: >
      labelled reading 300 mm, AND `freeEnd` naming "Floor Top" as held by
      nothing, "Trap Top" as held by the two labelled dimensions, and the pin
      route (SET_PIN_STATE, or dimension it to a level). Nothing pinned:
      `pinnedEnd` empty, Floor Top still unpinned in Properties. Then Trap
      Depth typed as 400 moves FLOOR TOP, as the warning said

  - given: the same, with pinFreeEnd=true
    expect: >
      `pinnedEnd` says "Floor Top" was pinned first and reads back pinned;
      Floor Top shows the pin in Revit; Trap Depth typed as 400 now moves TRAP
      TOP to Z 400 and Floor Top stays at 0

negative:
  - given: >
      VERSION 2. fromPlane "Ref. Level" (a level), toPlane "Box Top" PINNED,
      Height holding the distance, pinFreeEnd left out
    expect: >
      labelled as before and NO free-end warning: `freeEnd` empty, the
      findings say each end is held ("Ref. Level" is a level; "Box Top" is
      pinned), nothing pinned. This is the negative case - a label whose ends
      are both held says nothing about a free end

  - given: >
      VERSION 2. Two planes at the same Z, "Trap Depth" holding 300
    expect: >
      refused as in the same place, and the refusal names the route - pin the
      one that must stay (SET_PIN_STATE), move the other, SET_FAMILY_TYPE_VALUES
      to the distance, then label. Nothing made, nothing pinned

  - given: >
      the same planes 600 apart and Width still holding 0 (never written)
    expect: >
      refused with both numbers - 600 mm apart, Width holds 0 - naming
      SET_FAMILY_TYPE_VALUES. And the planes NOT collapsed: measured still
      600 apart. This is the guard the fragment exists around

  - given: Width already labelling a dimension, asked again
    expect: refused, one label per parameter, and no second dimension made

  - given: centrePlane "Center (Left/Right)" with Box Left at -200, Box Right at 400
    expect: >
      refused as not midway, and neither plane moved - an EQ would have
      shifted them

  - given: fromPlane "Box Left" and toPlane "Box Top"
    expect: refused as not parallel, nothing made

  - given: a project in front
    expect: notAFamily true and nothing made

second_route:
  - >
      Annotate, Aligned dimension between the same two planes by hand in a copy
      of the family, labelled with the same parameter from the ribbon, and the
      two dimensions' readings compared

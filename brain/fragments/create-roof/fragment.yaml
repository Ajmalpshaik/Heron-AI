capability: CREATE_ROOF
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Creates a footprint roof from a closed boundary on one level.

  **FLOOR AND CEILING WERE BOTH HERE AND ROOF WAS NOT.** `CREATE_FLOOR` makes the
  slab and `CREATE_CEILING` makes the ceiling; the third member of that family
  was missing, so a building could be given every storey and no lid.

  **THE FOOTPRINT ROOF IS FLAT UNTIL SOMEBODY SLOPES IT.** This makes the roof
  and does NOT set a slope on any edge. Revit hands back the boundary's model
  curves so a slope can be defined per edge afterwards, and that is a separate
  decision about the design - a default pitch invented here would become a pitch
  quietly relied on.

  **THE BASE HEIGHT IS THE LEVEL'S PROJECT ELEVATION.** Every XYZ the API takes
  is project-internal, while `Elevation` is measured from whatever the level
  type's Elevation Base says. On a model set out to a survey datum the two
  differ, and the wrong one puts the roof metres out with no error at all - the
  same trap `CREATE_FLOOR` documents.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: level
      type: Level
      source: request
    - name: roofType
      type: RoofType
      source: request
    - name: boundary
      type: IList<XYZ>
      source: request
  provides:
    - name: created
      role: result
      type: ElementId
    - name: edges
      # The boundary's model curves, handed back so a slope can be set per edge
      # afterwards. A thing it MADE, so a result (D-52).
      role: result
      type: int
    - name: measuredMm
      # WHAT REVIT SAYS IS THERE, read back off the new element, in the units
      # the caller typed. A STRING and not a list entry, because a reply
      # truncates a list item at sixty characters and this sentence is the
      # evidence - "5000 x 4000 mm on plan, base at 4000 mm" arrived as
      # "5000 x 4000 mm on plan, base at 40...", which is not a measurement
      # anybody can quote.
      #
      # ACCOUNTING, NOT A RESULT (D-52). `created` is the thing it made; this
      # describes that thing. It must not count toward "did this come back
      # empty" - on the negative leg nothing is made and there is correctly
      # nothing to measure.
      role: accounting
      type: string
    - name: findings
      type: IList<string>

# HELD ON PURPOSE, NOT FORGOTTEN. Signed on real evidence - the roof was read
# back off Revit at 5000 x 4000 mm, base 4000 mm, on a level sitting at
# 4000 mm - and NOT promoted, because `tests/cases.yaml` declares a second
# route and nobody has run it: build the same footprint through Revit's own
# Architecture > Roof by Footprint and compare the two IN A SECTION.
#
# THAT IS A PERSON'S JOB AND CANNOT BE DONE FROM HERE - it is Revit's user
# interface, not an API call. Named by review on PR #198, which was right:
# D-30 asks for a second route "where one exists", and this fragment's own
# case file says one does.

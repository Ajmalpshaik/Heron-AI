id: FRG-ELE-036
semantic-identity: "draw plain model or detail lines between points"
kind: action
domain: revit.elements
capability: CREATE_LINE
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Draws plain straight lines between pairs of points - either DETAIL lines,
  which live in one view and print with it, or MODEL lines, which exist in the
  model and appear in every view that sees them.

  **WHICH OF THE TWO IS THE DECISION, AND IT IS NOT A DETAIL.** A detail line is
  drawing, not building: it shows on that one sheet and nowhere else. A model
  line is a real object in space that turns up in every plan, section and the
  3D. Somebody who wanted a setting-out line on one plan and got model lines
  finds them on twenty other drawings, and somebody who wanted a reference line
  in the model and got detail lines cannot see it anywhere else. There is no
  safe default, so the caller says which.

  **A MODEL LINE NEEDS A PLANE TO LIVE ON, AND A DETAIL LINE NEEDS A VIEW.**
  That is the asymmetry that makes one call fail where the other works. Model
  lines here are drawn on a horizontal plane through their own height, which
  covers a setting-out or reference line and is not meant for an arbitrary line
  leaning through space.

  **A LINE SHORTER THAN REVIT'S OWN TOLERANCE CANNOT EXIST**, and two points
  typed the same by accident is the common way to ask for one. Those pairs are
  counted and reported rather than throwing partway through a batch that has
  already drawn twenty.

  Points arrive in internal FEET. The mm the person spoke is converted at the
  edge, before this.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: pointPairs
      type: IList<IList<XYZ>>
      source: request
    - name: asDetail
      type: bool
      source: request
    - name: view
      type: View
      source: request
      optional: true
  provides:
    - name: created
      role: result
      type: IList<Element>
    - name: tooShort
      # Point pairs closer together than Revit's own tolerance - A LINE
      # SHORTER THAN REVIT'S OWN TOLERANCE CANNOT EXIST, and two points typed
      # the same is the common way to ask for one. Never a line it drew
      # (D-52).
      role: accounting
      type: int
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<string>


compatibility-note: >
  One implementation for every release. `NewDetailCurve` and `NewModelCurve` sit
  on the creation factory reached through `Document.Create` and are unchanged
  2020 through 2027, as are `Plane.CreateByNormalAndOrigin`, `SketchPlane.Create`
  and `Line.CreateBound` - read off the reference assemblies at both ends. The
  short-curve limit is taken from the application itself rather than typed as a
  number, because it is a property of the installation and not a constant.

# ROUTING - repeated in FIND_OVERLAPPING_LINES, CREATE_GRID and
# CREATE_FILLED_REGION.
#
#   "draw a detail line here"            -> here
#   "draw a line between these points"   -> here
#   "put a setting out line on this plan" -> here, asDetail true
#   "the lines are drawn twice on top of each other" -> FIND_OVERLAPPING_LINES -
#                                          a READ over lines that already exist
#   "draw a grid line"                   -> CREATE_GRID - a grid is a DATUM with
#                                           a bubble and a name, on every view;
#                                           a line is not
#   "hatch this area"                    -> CREATE_FILLED_REGION - a filled
#                                           region has a boundary AND a fill

utterances:
  - draw a detail line here
  - draw a line between these points
  - put a setting out line on this plan
  - add a model line
  - draw some reference lines

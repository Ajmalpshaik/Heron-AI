id: FRG-VIEW-006
semantic-identity: "override whole categories' graphics in one view"
kind: action
domain: revit.views
capability: SET_CATEGORY_GRAPHICS
# Version 2 (2026-10-13, FRAGMENT-ISSUES 5b-453): every category is READ BACK
# after the Set and counted only when what was asked for is what Revit holds.
# Version 1 counted the call, so Rooms on Revit 2020 came back "overridden 1"
# with nothing stored. One that reads back empty is in `refused` in a
# sentence; one that kept part of it is in the new `notKept`, each setting
# named. The inputs and the other outputs mean what they meant. The proof below
# was then version 2's, signed by Ajmal PS on 2026-10-13 (Group DV, DV6).
#
# Version 3 (2026-11-01): SET_CATEGORY_SOLID_FILL was merged into this card on
# the owner's instruction, and is DEPRECATED. Its job is one optional switch
# here, `solidFill`, off unless asked: on, the model's solid fill is stamped on
# the surface and, where the category is cut, the cut (`notCuttable` names the
# rest), `solidPattern` names the fill, and a model with none is refused with
# nothing written. Off, everything is exactly version 2. Version 2's proof
# below no longer described the code and was kept as the record; the card was
# DRAFT at the time, until it is proved again.
version: 3
source: OFFICIAL
risk: MODIFY
# A settings change: after it runs from the chat, the Companion page offers its values
# as a table the modeller can edit and apply again (docs/40 section 21.1).
companion: settings
companion-subject: view, categories

purpose: >
  Applies a graphic override to entire CATEGORIES in one view rather than to a
  list of elements - the grey background of a grayout, done as two or three
  settings instead of as an override on every wall in the building.

  **This is what the background half of a grayout should use.** Overriding
  elements one by one gives the same picture today and a different one tomorrow:
  a wall drawn after the grayout ran keeps its normal graphics, because nothing
  ever touched it. A category override covers everything in that category, now
  and later.

  Pass an empty settings object to clear a category's override - the same trick
  the per-element reset uses, and the reason there is no separate clear here.

  **A solid colour wash, when it is asked for** (version 3, `solidFill`). A
  surface colour on its own tints the pattern a material already carries, and
  where it carries none the colour is stored and prints nothing. With the
  switch on, Revit's solid fill is stamped onto the surface - and onto the cut
  where the category is ever cut - so the category reads as a colour on paper.
  Off, nothing is stamped, so a grey background never becomes solid blocks. On
  with an empty settings object, the fill alone is stamped: the switch is the
  ask. A model with no solid fill is refused and nothing is written.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: view
      type: View
      source: request
    # Top-level categories only: a sub-category's name is refused. Revit
    # 2020 takes an override on a sub-category and reads back nothing
    # (measured 2026-10-13, FRAGMENT-ISSUES 5b-453). Version 1 counted the
    # call, so it would have reported a change that is not there; version 2
    # reads it back and would refuse it in words, but the binder still hands
    # this card top-level categories only - whether a later release keeps a
    # sub-category's override is NEEDS-CHECKING DV4. SET_CATEGORY_VISIBILITY
    # takes sub-categories; it reads its change back.
    - name: categories
      type: IList<Category>
      source: request
    - name: overrides
      type: OverrideGraphicSettings
      source: request
    # Version 3, from SET_CATEGORY_SOLID_FILL. true stamps Revit's solid fill
    # on the surface, and on the cut where the category is ever cut, so the
    # colours read as a wash on paper. Not given means off - version 2's
    # behaviour exactly: a surface colour ALONE never stamps a fill. On with
    # an empty `overrides` stamps the fill alone, because the switch is an
    # explicit ask.
    - name: solidFill
      type: bool
      source: request
      optional: true
  provides:
    - name: overridden
      # Categories whose read-back holds every setting asked for. Not the
      # calls made: version 1 counted those (5b-453).
      role: result
      type: int
    - name: notKept
      # Categories that read back with PART of what was asked for, each
      # setting that did not land named with what came back - "Ducts: not
      # kept - surface colour asked 255,0,0, read back none". Something was
      # written, so this is not a refusal; not all of it, so not counted.
      role: accounting
      type: IList<string>
    - name: notControllable
      # Categories this view will not let be overridden. The evidence it
      # looked and could not, never a thing it did (D-52).
      role: accounting
      type: IList<string>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52). A category name alone is a view
      # template that refused the Set; "Revit took the override and stored
      # nothing for Rooms" is a Set that raised nothing and read back empty.
      # With `solidFill` on in a model with no solid fill, one sentence saying
      # so, and nothing written on any category.
      role: accounting
      type: IList<string>
    - name: solidPattern
      # Version 3. WHICH solid fill was stamped, by name - "<Solid fill>" - or
      # "none found", when the model has none and nothing was written. Empty
      # when `solidFill` was off. The evidence the wash will paint, which
      # "overridden 1" cannot say alone (D-52).
      role: accounting
      type: string
    - name: notCuttable
      # Version 3, with `solidFill` on. Categories whose CUT half was left
      # alone because Revit never cuts them. NOT a refusal and NOT a skip -
      # they ARE overridden and DO count in `overridden` when the surface half
      # reads back. A note on what landed (D-52).
      role: accounting
      type: IList<string>


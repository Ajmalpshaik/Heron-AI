id: FRG-VIEW-006
semantic-identity: "override whole categories' graphics in one view"
kind: action
domain: revit.views
capability: SET_CATEGORY_GRAPHICS
# Version 2 (2026-10-13, FRAGMENT-ISSUES 5b-453): every category is READ BACK
# after the Set and counted only when what was asked for is what Revit holds.
# Version 1 counted the call, so Rooms on Revit 2020 came back "overridden 1"
# with nothing stored. One that reads back empty is in `refused` in a
# sentence; one that kept part of it is in the new `notKept`, each setting
# named. The inputs and the other outputs mean what they meant. The proof below
# is version 1's, signed before this change - DRAFT until re-proved.
version: 2
source: OFFICIAL
risk: MODIFY
# A settings change: after it runs from the chat, the Companion page offers its values
# as a table the modeller can edit and apply again (docs/40 section 21.1).
companion: settings
companion-subject: view, categories

purpose: >
  Applies a graphic override to entire CATEGORIES in one view rather than to a
  list of elements - the grey background of a grayout, done as two or three
  settings instead of as an override on every wall in the building.

  **This is what the background half of a grayout should use.** Overriding
  elements one by one gives the same picture today and a different one tomorrow:
  a wall drawn after the grayout ran keeps its normal graphics, because nothing
  ever touched it. A category override covers everything in that category, now
  and later.

  Pass an empty settings object to clear a category's override - the same trick
  the per-element reset uses, and the reason there is no separate clear here.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: view
      type: View
      source: request
    # Top-level categories only: a sub-category's name is refused. Revit
    # 2020 takes an override on a sub-category and reads back nothing
    # (measured 2026-10-13, FRAGMENT-ISSUES 5b-453). Version 1 counted the
    # call, so it would have reported a change that is not there; version 2
    # reads it back and would refuse it in words, but the binder still hands
    # this card top-level categories only - whether a later release keeps a
    # sub-category's override is NEEDS-CHECKING DV4. SET_CATEGORY_VISIBILITY
    # takes sub-categories; it reads its change back.
    - name: categories
      type: IList<Category>
      source: request
    - name: overrides
      type: OverrideGraphicSettings
      source: request
  provides:
    - name: overridden
      # Categories whose read-back holds every setting asked for. Not the
      # calls made: version 1 counted those (5b-453).
      role: result
      type: int
    - name: notKept
      # Categories that read back with PART of what was asked for, each
      # setting that did not land named with what came back - "Ducts: not
      # kept - surface colour asked 255,0,0, read back none". Something was
      # written, so this is not a refusal; not all of it, so not counted.
      role: accounting
      type: IList<string>
    - name: notControllable
      # Categories this view will not let be overridden. The evidence it
      # looked and could not, never a thing it did (D-52).
      role: accounting
      type: IList<string>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52). A category name alone is a view
      # template that refused the Set; "Revit took the override and stored
      # nothing for Rooms" is a Set that raised nothing and read back empty.
      role: accounting
      type: IList<string>

proof:
  date: '2026-09-15'
  by: Ajmal PS
  model: Snowdon-scratch_ajmal.al (9,638 elements), Revit 2024, session 28236
  positive_case: run as it would normally be run - run inside a transaction, and Revit reported
    the transaction group ROLLED BACK afterwards. returned notControllable 0 item(s), overridden
    1, refused 0 item(s). inputs came view as given; categories as given (1); overrides as
    given. on Snowdon-scratch_ajmal.al
  negative_case: 'run with categories=Ducts, categoryName=Ducts, inViewOnly=FloorPlan: M1,
    overrides=halftone=true; projection-line-colour=255,0,0, view=FloorPlan: M1 instead -
    chosen because it should not contain what this fragment reports - run inside a transaction,
    and Revit reported the transaction group ROLLED BACK afterwards. returned notControllable
    0 item(s), overridden 0, refused 1 item(s) [Ducts]. inputs came view as given; categories
    as given (1); overrides as given. on Snowdon-scratch_ajmal.al'
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: 4e408c779f7ba5f4

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release, for the same reason
  OVERRIDE_GRAPHICS_IN_VIEW is: the settings object arrives already built, so
  the setters that were renamed across releases are the caller's problem and
  not this fragment's. `View.SetCategoryOverrides` and
  `Category.get_AllowsVisibilityControl` are unchanged 2020 to 2027. The
  read-back (version 2) calls `View.GetCategoryOverrides` and the
  OverrideGraphicSettings getters of the foreground/background pattern names
  Revit 2019 introduced, so 2020 is past that rename too;
  tools/check-api-surface.py finds every one on 2020 to 2027.

# ROUTING - repeated in CREATE_VIEW_FILTER and OVERRIDE_GRAPHICS_IN_VIEW.
#
#   "grey the architecture back" -> here - a whole CATEGORY, no test involved
#   "turn the ceilings off"      -> SET_CATEGORY_VISIBILITY
#   "colour by system"           -> CREATE_VIEW_FILTER - it tests a PARAMETER,
#                                   so work drawn next week is coloured too
#   "make these red"             -> OVERRIDE_GRAPHICS_IN_VIEW - stuck to the ids
#                                   you found, blind to anything added after
#
# ROWS ADDED 2026-09-06. The same rows are in SET_LINK_GRAPHICS and
# RESET_VIEW_GRAPHICS.
#
#   "grey the architecture back"  -> HERE, and it is declared here. TWO TABLES
#                                   claimed this sentence and this one keeps it.
#                                   It cannot be split by wording, because the
#                                   words do not say whether those walls are in
#                                   this model or in a LINK - and that is the
#                                   whole difference
#   "grey the architecture back, and it is a LINK"
#                                -> SET_LINK_GRAPHICS. THIS FRAGMENT REACHES
#                                   INSIDE A LINK NOT AT ALL: on a linked job it
#                                   greys nothing, reports success, and leaves
#                                   the view untouched, because the host
#                                   genuinely has no walls. That is the quietest
#                                   failure in this whole cluster
#   "put this view back to normal" -> RESET_VIEW_GRAPHICS, which sweeps every
#                                   overridable category without being handed
#                                   the list. This fragment already clears ONE
#                                   category with an empty override; that one is
#                                   for when nobody knows which were written

# SENTENCES ADDED 2026-09-01 BECAUSE THE ROUTING TABLE ABOVE ALREADY CLAIMED
# THEM. A routing table is a COMMENT and comments are not indexed - the search
# reads semantic-identity, the utterances, the capability, the domain and the
# purpose, and nothing else. So a table saying "-> here" recorded a decision
# that retrieval could not act on, and these resolved elsewhere.

#   "change all the old line styles to the new ones" -> REMAP_LINE_STYLES - a
#                                        line style is what a line IS. This is a
#                                        view override and changes no line
#   "what category overrides are on this view" -> REPORT_CATEGORY_OVERRIDES -
#                                        the READ half; this one only sets
#   "put the categories back to normal in this view" -> here, with an EMPTY
#                                        settings object. There is no separate
#                                        clear because that IS the clear
#   "everything in these categories"     -> SELECT_BY_CATEGORIES, which
#                                           collects them. This one changes
#                                           how a category draws

utterances:
  - grey the whole background
  - make all the architecture faint
  - halftone the structure
  - override the category colour
  - flatten everything except the services
  - grey the architecture back
  - put the categories back to normal in this view

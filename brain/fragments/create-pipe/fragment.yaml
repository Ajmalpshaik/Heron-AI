compatibility-note: >
  One implementation for every release. `Pipe.Create` taking a piping system
  type, a pipe type, a level and two points is present 2020 through 2027 - read
  off the reference assemblies at both ends rather than remembered. This
  fragment touches no units API and constructs no ElementId, which are the two
  things that moved across the range.

# ROUTING - repeated in CREATE_DUCT, SET_MEP_SIZE and CONNECT_OPEN_ENDS.
#
#   "run a pipe from here to there" -> here
#   "draw the pipe"                 -> here
#   "add a drain line"              -> here - it is still a pipe
#   "draw a duct from here"         -> CREATE_DUCT. Same job, other domain
#   "make it 100 mm"                -> SET_MEP_SIZE - the pipe already exists,
#                                      and that is where Revit's SNAP to the
#                                      nearest allowed size is caught
#   "give it a fall of 1 in 100"    -> SET_MEP_SLOPE - drawn flat, then sloped
#   "join these two"                -> PLACE_MEP_FITTING - a fitting between two
#                                      runs is not a new run
#   "they are touching but not
#    connected"                     -> CONNECT_OPEN_ENDS
#   "draw a cable tray"              -> CREATE_ELECTRICAL_RUN
#   "draw a conduit"                 -> CREATE_ELECTRICAL_RUN

utterances:
  - run a pipe from here to there
  - draw a pipe between these points
  - draw the pipe run
  - add a pipe
  - put a drain line in
  - add a drain line
  - draw the chilled water pipe

heron-agent: HERON-REVIT-ELE-010
heron-step: 17
heron-status: PROVEN
heron-since: 0.1.0
heron-layer: brain

id: FRG-ELE-089
semantic-identity: "the structural analytical model - members, panels and the physical elements they belong to"
kind: action
domain: revit.elements
capability: REPORT_ANALYTICAL_MODEL
version: 1
source: OFFICIAL
risk: READ

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# Every analytical member with its end points in millimetres and its physical
# element; every panel with its physical element; and analytical elements tied
# to none - drawn on their own, or left behind by a deleted physical element.
#
# REVIT 2023 made the analytical model separate elements with an association
# manager, so the card declares 2023 on.
#
# READ ONLY - opens no transaction.
purpose: >
  Reads the structural analytical model for handing to analysis - each
  analytical member's end points and physical element, each panel's physical
  element, and those tied to none.

contract:
  needs:
    - name: doc
      type: Document
  provides:
    - name: analytical
      # ONE STRING, a line per member and panel.
      role: result
      type: string
    - name: memberCount
      role: result
      type: int
    - name: panelCount
      role: result
      type: int
    - name: unassociated
      # Analytical elements tied to no physical element (D-52).
      role: accounting
      type: IList<ElementId>
    - name: findings
      type: IList<string>

proof:
  date: '2026-11-16'
  by: Ajmal PS
  model: night-scratch (3,203 elements), Revit 2024, session 8292
  positive_case: run as it would normally be run - the arrangement was re-made first by running
    create-analytical-elements with this phase's own values - run inside a transaction, and
    Revit reported the transaction group ROLLED BACK afterwards. returned MmPerFoot 304.8,
    analytical member 352514 | 0,0,4000 to 6000,0,4000 mm | NO PHYSICAL ELEMENT, findings
    1 item(s) [1 analytical member(s), 0 analytical panel(s); 1 tied to no ...], lines 1 item(s)
    [member 352514 | 0,0,4000 to 6000,0,4000 mm | NO PHYSICAL ELE...], manager AnalyticalToPhysicalAssociationManager,
    memberCount 1, mm Func`2, panelCount 0, physical Func`2, unassociated 1 item(s) [352514].
    on night-scratch
  negative_case: run with kind=member, level=Level 9, points=0,0,0; 6000,0,0 instead - chosen
    because it should not contain what this fragment reports - the arrangement was re-made
    first by running create-analytical-elements with this phase's own values - run inside
    a transaction, and Revit reported the transaction group ROLLED BACK afterwards. returned
    MmPerFoot 304.8, analytical , findings 1 item(s) [0 analytical member(s), 0 analytical
    panel(s); 0 tied to no ...], lines 0 item(s), manager AnalyticalToPhysicalAssociationManager,
    memberCount 0, mm Func`2, panelCount 0, physical Func`2, unassociated 0 item(s). on night-scratch
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  built_on:
    revit_release: '2024'
    revit_build: 24.3.60.12
    addin_version: 0.2.0.0
    addin_hash: 80819edd3983a0d5
  fingerprint: fcf96e492ebaf1d6

revit: ["2023", "2024", "2025", "2026", "2027"]
runtime: [net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  AnalyticalMember, AnalyticalPanel, AnalyticalElement.GetCurve and
  AnalyticalToPhysicalAssociationManager.GetAnalyticalToPhysicalAssociationManager
  and GetAssociatedElementId are present from 2023 and absent in 2020 to 2022
  in this form - read off RevitAPI.xml in the Nice3point reference packages for
  all eight releases on 2026-10-12 - so the card declares 2023 to 2027 only.

# ROUTING - the same rows are in the fragments named here.
#
#   "export the analytical model"             -> here, as text
#   "which analytical members have no beam"   -> here
#   "add an analytical member between these two points"
#                                             -> CREATE_ANALYTICAL_ELEMENTS
#   "move the analytical line of this beam 200 mm down"
#                                             -> ADJUST_ANALYTICAL_ELEMENTS
#   "associate this analytical member with that beam"
#                                             -> ASSOCIATE_ANALYTICAL_ELEMENTS
#
# 2026-11-02: "export the analytical model" is declared below because
# CREATE_ANALYTICAL_ELEMENTS took it on the hybrid route once it landed - a
# write answering a read (FRAGMENT-ISSUES row 5b-1434).

utterances:
  - export the analytical model
  - read the structural analytical model
  - list the analytical members and their beams
  - which analytical elements have no physical element
  - give me the analytical model for the structural engineer

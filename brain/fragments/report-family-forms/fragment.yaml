compatibility-note: >
  `GenericForm` with `IsSolid`, `Subcategory`, `GetVisibility()` and
  `CombinableElement.Combinations`; `Extrusion.Sketch`, `Revolution.Sketch`,
  `Blend.BottomSketch`, `Sweep.PathSketch` and `SweptBlend.PathSketch`;
  `Sketch.SketchPlane` and `GeomCombination.AllMembers` read the same 2020
  through 2027 (the RevitAPI reference assemblies, read 2026-10-01).
  Version 5 adds `DetailCurve`, `SymbolicCurve.GetVisibility`,
  `CurveElement.GeometryCurve` / `LineStyle` / `SketchPlane`,
  `FilledRegion.IsMasking` / `GetBoundaries`,
  `Element.GetDependentElements(ElementFilter)`, `Element.OwnerViewId`,
  `Dimension.References` / `FamilyLabel` / `IsLocked` / `AreSegmentsEqual` /
  `NumberOfSegments`, `FamilyManager.GetAssociatedFamilyParameter`,
  `LocationPoint.Rotation` and `FamilyInstance.Mirrored`, the same 2020
  through 2027 (read 2026-11-11). One implementation, no #if.

# ROUTING - see SET_FAMILY_SETTINGS for the whole family-building table.
#
#   "what forms are in this family"              -> here
#   "list the voids in this family with their ids" -> here
#   "what parameters does this family have"      -> REPORT_FAMILY_PARAMETERS
#   "what is inside this family"                 -> REPORT_NESTED_FAMILIES,
#                                                   the families nested in it
#   "select the void forms"                      -> here, which=void, then
#                                                   SET_SELECTION with its
#                                                   `elements`
#   "select the forms with these ids"            -> here, then SET_SELECTION
#   "delete these forms"                         -> here when their ids are
#                                                   given, then DELETE_ELEMENTS
#                                                   - the method delete-by-id
#   "delete the ones I selected"                 -> DELETE_ELEMENTS - the
#                                                   selection is already there
#   "which forms are made of steel"              -> SELECT_BY_MATERIAL
#   "what is locked to the planes in this family" -> here (version 5), the
#                                                   2D side with its locks
#   "list the symbolic lines in this family"     -> here, which="symbolic line"
#   "what is the nested arrow linked to"         -> here, which="nested"
#   "what labels are in this family"             -> REPORT_FAMILY_LABELS
#   "what is locked to this" - elements given    -> REPORT_CONSTRAINTS
#   "lock the arrow's lines to the planes"       -> LOCK_FAMILY_LINES_TO_PLANES,
#                                                   a change; this only reads
#   MEASURED 2026-11-11 (scratch store, check-routing): four version 5
#   sentences are not yet won here - "what is locked to the reference planes
#   in this family" and "which lines in this family are not locked" reach
#   LOCK_FAMILY_LINES_TO_PLANES, a change, first; "what is the nested arrow
#   family linked to" and "read back the plan symbol of this family" reach
#   other read cards. Recorded in row 5b-1496, not reworded to buy a rank.
#
# 2026-11-01 - SELECT_FAMILY_FORMS WAS MERGED INTO THIS CARD (version 4) on the
# owner's instruction ("make sure there is no duplicate tools"), and is
# DEPRECATED. The same job: the forms of the family in the Family Editor, by
# the ids the form tools gave back or by kind and side, read the same way. Its
# outputs now: `elements` and `refused` by the same names, `formList` and
# `scanned` by the same names; its `forms` input is `which`. An action card's
# `elements` feeds SET_SELECTION and DELETE_ELEMENTS as a filter card's does:
# the add-in keeps every element a run leaves on the chain whatever the kind,
# and composition is read from the contracts.

utterances:
  - what forms are in this family
  - list the voids in this family with their ids
  - show me the extrusions in this family
  - which solids and voids is this family made of
  # MOVED 2026-11-01 from SELECT_FAMILY_FORMS, merged into this card.
  - select these forms
  - select the forms with these ids
  - select the void forms
  - get the forms with these ids
  - delete one form from the family by its id
  # VERSION 5 (2026-11-11) - the family's 2D side.
  - what is locked to the reference planes in this family
  - list the symbolic lines and filled regions in this family
  - show me the 2D lines in this family with their ends
  - what is the nested arrow family linked to
  - which lines in this family are not locked
  - read back the plan symbol of this family

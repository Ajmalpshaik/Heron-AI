id: FRG-GEO-046
semantic-identity: "what forms this open family is modelled from, with their ids, sizes and settings - and those forms picked by id or kind, ready to select or delete"
kind: action
domain: revit.families
capability: REPORT_FAMILY_FORMS
# Version 2 (2026-10-16, row 5b-488) changed the CARD, not the code: `which`
# may be left out. impl/ is byte for byte what the 2026-10-03 proof sealed, so
# its fingerprint and that proof still stand (D-30 seals impl/ alone) - and the
# code already read a missing `which` as every form. What is NOT proved is the
# add-in filling in the card's default: NEEDS-CHECKING EI3, after the add-in is
# rebuilt and Revit restarted.
#
# Version 3 (2026-10-22, row 5b-1312) changed impl/: `which` also takes the
# ids the form tools give back - the long UniqueId, commas between - so one
# form's extents are read after a flex without listing the rest. Given form
# UniqueIds, version 2 answered "Nothing was read" and named them as unknown
# words. Ids are read the way SELECT_FAMILY_FORMS reads them: a part that is
# not a kind or side is an id, ids and words are not mixed, and one id that is
# not a form of this family refuses the call before anything is read. Words
# alone, "all" or nothing answer exactly as version 2. Version 2's proof below
# no longer describes the code: DRAFT until NEEDS-CHECKING Group IO proves
# version 3 (D-30).
#
# Version 4 (2026-11-01) changed impl/: SELECT_FAMILY_FORMS was merged into
# this card and is DEPRECATED. The forms read are handed on as `elements`, for
# SET_SELECTION and DELETE_ELEMENTS; `refused` says why nothing was read;
# "freeform" is a kind. `which` left out now binds "not named" - every form
# read, none handed on. DRAFT until proved on a real model (D-30); version 3's
# proof below is the record.
#
# Version 5 (2026-11-11, row 5b-1496) changed impl/: THE FAMILY'S 2D SIDE, on
# the owner's word ("no duplicate tools, same kind of work 2 tools no need") -
# a 2D read-back was first written as a card of its own, REPORT_FAMILY_2D_ELEMENTS,
# and folded in here before it was ever merged. Detail lines, symbolic lines,
# filled and masking regions and nested families are read into `twoDList` with
# their locks, labels and links; `which` takes 2D kinds and ids. A call naming
# only form words, and every form row, answer as version 4 did; "all" now reads
# the 2D too but hands on forms alone. DRAFT until NEEDS-CHECKING Group ND
# proves version 5 (D-30); a READ card, so revit_read still runs it meanwhile.
version: 5
source: OFFICIAL
risk: READ

purpose: >
  Lists the FORMS a family is made of - every extrusion, revolve, blend, sweep
  and swept blend in the family open in the Family Editor, solid or void, with
  its id, its plane, its extent in millimetres, a solid's volume, its
  subcategory, where it shows, and the cut or join it is in. Read before
  locking, labelling, cutting or hiding forms.

  **THE ONLY WAY TO NAME A FORM MADE BY HAND** - the form tools give back their
  forms' ids, and one drawn by hand has none until this reads it.

  **ONE LINE**, as REPORT_FAMILY_PARAMETERS answers: a list is cut to three
  entries before anyone reads it.

  **`which` NARROWS IT** - "all", or kinds and sides with commas between:
  "void", "solid, revolve", "swept blend", "freeform" - or the ids the form
  tools gave back, commas between, to read just those forms, one form's
  extents after a flex. Ids and words are not mixed; an id that is not a form
  of this family is refused by name and nothing is read.

  **AND IT HANDS THEM ON (version 4, 2026-11-01).** SELECT_FAMILY_FORMS, which
  picked forms by the same ids and kinds, was merged into this card and is
  DEPRECATED. The forms read are left as `elements`, in the order their ids
  were named: SET_SELECTION highlights them, DELETE_ELEMENTS deletes them, and
  any tool that takes elements works on them. One id that is not a form here
  refuses the whole call and hands NOTHING on, so a delete after it can never
  reach part of a list. Left out, `which` reads every form and hands none on -
  a delete needs the forms named, or "all" said.

  **AND THE FAMILY'S 2D SIDE (version 5, 2026-11-11)** - every DETAIL LINE,
  SYMBOLIC LINE, FILLED and MASKING REGION and NESTED FAMILY, in `twoDList`:
  its view or plane, ends in millimetres (an arc's centre and radius), line
  style or region type, a symbolic line's detail levels and kinds of view,
  its Visible and what that is linked to, a nested family's type, point,
  rotation, mirror and linked parameters - and WHAT HOLDS EACH ONE, every
  dimension and alignment referencing it in words: "locked along Head Top",
  "locked at an end to Tip", "labelled Length to ...", "EQ with ...". A
  region's sketch edges are counted under it, never listed as loose lines.
  `which` takes "2d", "detail line", "symbolic line", "line", "filled
  region", "masking region", "region" or "nested", and the 2D tools' ids
  among the forms'. Form words alone read no 2D; 2D words alone read no
  form. A 2D element is handed on as `elements` only when named by a 2D kind
  or by id - "all" hands on forms alone, so a delete chained after it never
  reaches a line. A region's edge named by id is refused, naming the region:
  its edges are read under it, never handed on alone. Revit giving no edges
  for a region, or a dimension that cannot be read, is said in a finding.

  It reads only; nothing is changed.

contract:
  needs:
    - name: doc
      type: Document
    # "all", or kinds and sides with commas between - "void", "solid, revolve".
    # VERSION 3 (row 5b-1312): or the forms' ids, the long UniqueIds the form
    # tools give back, commas between - never mixed with kinds and sides.
    # VERSION 2 (row 5b-488): may be left out, and is then read as "all" -
    # every form. `optional: true` with `absent: all` is what lets it be left
    # out (HeronBindingNote.DeclaredAbsent); the add-in reads the card's
    # default exactly as a typed "all", and the binding note says "which not
    # given - "all", the card's own default (optional)". Every call of a
    # fixed-family build had typed which=all.
    #
    # VERSION 4 (2026-11-01): left out it binds "not named" - every form READ,
    # as "all" reads, and NONE handed on as `elements`. SELECT_FAMILY_FORMS
    # refused a call naming no form, so that a delete could never reach forms
    # nobody named; this card read them all (row 5b-488). The safer rule is
    # kept for what is handed on, and the read stays as the owner had it.
    # "all" typed names every form and hands every one on.
    #
    # VERSION 5 (2026-11-11): also the 2D kinds - "2d", "detail line",
    # "symbolic line", "line", "filled region", "masking region", "region",
    # "nested" - and 2D elements' UniqueIds among the forms' ids.
    - name: which
      type: string
      source: request
      optional: true
      absent: not named
  provides:
    - name: formCount
      # How many forms matched `which`.
      role: result
      type: int
    - name: formList
      # Every matching form on ONE line: solid or void, kind, id, plane,
      # extent, volume, subcategory, visibility, and its join or cut. Given
      # ids, just those forms.
      role: result
      type: string
    - name: combinationList
      # Every join or cut in the family, with its members, on one line.
      role: result
      type: string
    - name: scanned
      # How many forms the family holds before `which` narrowed them. Work done,
      # never a thing found (D-52): 0 when the call was refused and nothing read.
      role: accounting
      type: int
    - name: notAFamily
      # That the document in front is a project, not a family being edited.
      role: accounting
      type: bool
    - name: elements
      # VERSION 4, from SELECT_FAMILY_FORMS: the forms read, handed on - in the
      # order their ids were named, each once - for SET_SELECTION,
      # DELETE_ELEMENTS or any tool that takes elements. EMPTY when the call
      # refused, all or nothing, and when `which` was left out. To DELETE
      # them, they go on to DELETE_ELEMENTS through revit_change with
      # expect_from="report-family-forms where which=<the same ids>", once the
      # modeller has said yes to that delete (Article 7) - the method
      # delete-by-id has the steps.
      role: result
      type: IList<Element>
    - name: refused
      # VERSION 4, from SELECT_FAMILY_FORMS: why nothing was read, every bad id
      # named - a project in front, ids and words mixed, an id that is not a
      # form here. Empty when the call ran; a kind that matched nothing is an
      # answer, not a refusal.
      role: accounting
      type: string
    - name: twoDCount
      # VERSION 5: how many detail lines, symbolic lines, regions and nested
      # families matched `which`. 0 when only form words were named.
      role: result
      type: int
    - name: twoDList
      # VERSION 5: every matching 2D element on ONE line, rows "  ||  " apart:
      # kind, id, view or plane, ends or extent or point, style or type,
      # visibility, Visible and its link, parameter links, and every lock,
      # label and EQ on it.
      role: result
      type: string
    - name: findings
      type: IList<string>


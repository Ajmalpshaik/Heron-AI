positive:
  - given: >
      a family with one solid extrusion "circle 0,0 150" on Ref. Level from 0
      to 500 and one void extrusion "circle 0,0 50" from -10 to 510, both made
      by create-family-forms; which "all"
    expect: >
      formCount 2; formList names the solid extrusion with the same id
      create-family-forms gave back, "on Level : Ref. Level" or Revit's own
      name for that sketch plane, X and Y -150 to 150, Z 0 to 500 mm, 35.343 L,
      and the void beside it; scanned 2

  - given: the same family, which "void"
    expect: formCount 1, the void alone, and scanned still 2

  - given: the same family, which LEFT OUT (version 2; version 4's default)
    expect: >
      the same READ as which "all" - formCount 2, scanned 2 - and the binding
      note reads `which not given - "not named", the card's own default
      (optional)`; never refused for a missing value. Since version 4,
      `elements` EMPTY and a finding saying no form was named, so none is
      handed on (version 2's note said "all")

  - given: >
      the same family, which = the void's id exactly as create-family-forms
      gave it back (VERSION 3, row 5b-1312)
    expect: >
      formCount 1, the void alone with that same id, X and Y -50 to 50 mm, Z
      -10 to 510 mm; scanned 2; the finding ends "1 form(s) of 2 in the family,
      by id"

  - given: which = both forms' ids, commas between, the solid's typed twice
    expect: formCount 2, each form once; scanned 2

  # VERSION 4 (2026-11-01), from SELECT_FAMILY_FORMS. Each FAILS on version 3,
  # which left no `elements` and no `refused`.
  - given: >
      a scratch family holding a solid extrusion, a void extrusion and a solid
      revolve, each made by its form tool; which "<the revolve's id>, <the
      solid extrusion's id>"
    expect: >
      elements 2, the revolve FIRST and the extrusion second - the order named;
      formCount 2, scanned 3, refused empty

  - given: >
      the first case's two forms carried into SET_SELECTION (expect_from
      "report-family-forms where which=<the same ids>"), then READ_SELECTION
    expect: >
      the family's window shows exactly those two highlighted, and
      READ_SELECTION reads back the same two ids - SELECT_FAMILY_FORMS' job,
      done from this card

  - given: the same family, which "void"
    expect: elements 1, the void extrusion alone, handed on

  - given: a family holding a freeform made by CREATE_FAMILY_FREEFORM_SOLID, which "freeform"
    expect: formCount 1 and elements 1, the freeform - version 3 knew no "freeform" and read it as an id


  # VERSION 5 (2026-11-11, row 5b-1496) - the family's 2D side. Each FAILS on
  # version 4, which leaves no twoDList and refuses every 2D word as an id.
  - given: >
      the SAVED scratch metric Detail Item family "Heron 2D Read Test" under
      %TEMP%\heron-work\2d-read (never one of the owner's families), arranged
      as NEEDS-CHECKING ND0: planes Tip (X 600) and Head Top (Y 80); a detail
      line "path 0,0; 300,0" locked along Center (Front/Back); a filled region
      "polygon 300,80 600,0 300,-80", its tip corner locked to Tip by hand; a
      CONTROL detail line "path 0,-200; 300,-200", never locked; which "2d"
    expect: >
      twoDCount 3, formCount 0: the shaft "from 0,0,0 to 300,0,0 mm, 300 long",
      style named, "locked along Center (Front/Back)"; the CONTROL "nothing
      holds it"; the region with its type, "1 loop(s), X 300 to 600, Y -80 to
      80 mm", "3 sketch edge(s)" and "locked at an end to Tip" - its three
      edges NOT listed as lines. elements 3

  - given: the same family, which "all"
    expect: >
      the same three 2D rows in twoDList beside formCount 0 - and elements 0:
      "all" hands on forms alone, never a line

  - given: >
      a scratch metric Generic Model family with one solid extrusion, a
      symbolic line "path 0,0; 500,0" on Ref. Level for coarse only, and a
      nested detail item placed in the view Ref. Level with its Visible linked
      to a Yes/No "Show Arrow"; which "symbolic line, nested"
    expect: >
      formCount 0; the symbolic line "shows in coarse | plan"; the nested row
      names its family and type, "in view Ref. Level", its point, "turned 0
      deg", and "Visible yes (linked to Show Arrow)"

  - given: the same family, which "solid"
    expect: formCount 1, twoDCount 0 and twoDList empty - form words read no 2D, as version 4

  - given: the same family, which = the extrusion's id and the symbolic line's id
    expect: formCount 1 and twoDCount 1, elements 2 in the order named

  - given: the Generic Model family, which "all"
    expect: >
      formCount 1, the symbolic line and the nested detail item in twoDList -
      and elements 1, the extrusion ONLY: "all" never hands on a line, so a
      DELETE_ELEMENTS chained after it cannot reach one

  - given: >
      the Generic Model family with a nested 3D family (a Work Plane-Based
      generic model) placed beside the nested detail item; which "2d"
      (Codex review, PR #843)
    expect: >
      the symbolic line and the nested DETAIL ITEM only - the nested 3D family
      is neither listed nor handed on; which "nested" lists both

  - given: the Generic Model family, which LEFT OUT
    expect: the same reads as "all" - and elements 0, as version 4 handed on nothing when nothing was named

  - given: the Generic Model family, which = the extrusion's id alone
    expect: formCount 1, twoDCount 0, no 2D finding - the findings read exactly as version 4's
negative:
  - given: which "revolve" on the same family, which holds no revolve
    expect: formCount 0, formList empty, scanned 2 - the forms were looked at and none matched

  - given: which "cylinder"
    expect: refused by name as not a kind or a side, nothing read, formCount 0

  - given: a project in front
    expect: notAFamily true and nothing read

  - given: a project in front, which = the solid's id copied from the family (VERSION 3)
    expect: notAFamily true and nothing read - the id is never looked up in the project

  - given: >
      which = the solid's id with its FIRST character changed, so it is the
      shape of a form id and names no element of this family (VERSION 3) -
      never the last: the last eight characters are the element's number, and
      changed they can name another element
    expect: >
      refused by name - "is not an id in this family" - nothing read,
      formCount 0, formList empty, scanned 0

  - given: which = the solid's id and a reference plane's UniqueId (VERSION 3)
    expect: >
      refused naming the reference plane "..., not a form"; the solid is not
      read either - all or nothing, formCount 0

  - given: which = "void, <the solid's id>" (VERSION 3)
    expect: refused - ids and words are not mixed in one call - nothing read, formCount 0

  - given: which = the solid's element number as Select by ID shows it, digits only (VERSION 3)
    expect: refused - "that is an element number; give the long id the form tools gave back"

  # VERSION 4 (2026-11-01), from SELECT_FAMILY_FORMS.
  - given: >
      the same family, which "<the solid extrusion's id>, <the UniqueId of the
      reference plane Center (Left/Right)>"
    expect: >
      refused naming the reference plane as not a form; elements 0 - the good
      id is NOT handed on either, all or nothing

  - given: which "cylinder"
    expect: refused as neither an id in this family nor a kind or side; elements 0

  - given: a project in front, which "all"
    expect: notAFamily true, refused saying so, elements 0


  # VERSION 5 (2026-11-11).
  - given: >
      the Detail Item family, which = the shaft's id with its FIRST character
      changed - the shape of an id that names no element here
    expect: refused by name, "is not an id in this family", nothing read, twoDCount 0, elements 0

  - given: the Detail Item family, which = the shaft's id and the UniqueId of the plane Tip
    expect: refused naming Tip as not a form, a line, a region or a nested family; the shaft not read either

  - given: the Detail Item family, which "region, <the shaft's id>"
    expect: refused - ids and kinds are not mixed - nothing read

  - given: which "nested" on the Detail Item family, which holds no nested family
    expect: twoDCount 0, twoDList empty - looked at, none matched; not a refusal

  - given: >
      the Detail Item family, which = the id of one EDGE of the filled region
      (read with Select by ID from Edit Boundary, or from LOCK_FAMILY_LINES_TO_PLANES'
      answer)
    expect: >
      refused naming the region - "is an edge of the filled region ... name
      the region"; nothing read, elements 0 - an edge is never handed on alone
second_route:
  - >
      In the Family Editor, select each form and read its Properties and its
      Visibility Settings by hand; the extents measured with a dimension in a
      plan and an elevation
  - >
      VERSION 5: in the Family Editor, select each line, region and nested
      family and read its Properties, its Visibility Settings, its padlocks and
      the dimension it is labelled with by hand; the ends measured with Measure

# D-30: the negative case is what catches "succeeded and did nothing".
# Rows are id|uniqueId|parameter|was|new, each field percent-encoded, joined by ';'.

positive:
  - given: two fan coil units' Comments, each row's "was" equal to what Revit holds now, new values "A" and "B"
    expect: >
      written 2; resultJson applied true; readBack shows A and B; one entry in
      Revit's undo list, and one Ctrl+Z puts both back

  - given: a Yes/No instance parameter, new value "Yes"
    expect: written 1 and the tick box ticked in the Properties palette

negative:
  - given: >
      the same two rows, after one unit's Comments was changed by hand in Revit
      (so its "was" no longer matches)
    expect: >
      written 0; resultJson applied false; stale names that unit and says it
      was changed in Revit since the table was read; the OTHER unit is not
      written either - all or nothing

  - given: a row whose UniqueId names an element that was deleted
    expect: written 0, stale "it is no longer in the model", nothing written

# Version 2, BY KEY (5b-459): a first row key=<parameter>|in=<categories>,
# then <key value>|<parameter>=<value> per element. A row is refused on its own.
positive_by_key:
  - given: >
      key=Number|in=Rooms;1|Name=Lift Lobby;2|Name=Staircase 1;...;13|Name=Lift 10,
      on a model where rooms 1 to 13 each hold a different Number
    expect: >
      written 13 in ONE call; resultJson format 2, applied true, refused []; each
      readBack entry's value equals its asked name; one entry in Revit's undo list
  - given: the same with Level=Level 1 on the first row, on a model whose rooms are all on Level 1
    expect: the same - the narrowing keeps every room that holds that level

negative_by_key:
  - given: >
      key=Name|in=Rooms;Room|Comments=x, where several rooms are still named
      "Room"
    expect: >
      written 0; applied false; refused names "Room" and says how many rooms
      hold it, with their ids; no room's Comments changed (read back)
  - given: >
      key=Number|in=Rooms;5|Name=A;99|Name=B, where one room is 5 and none is 99
    expect: written 1 (room 5 reads A); refused names 99 - no element holds it
  - given: key=Number|in=Room;1|Name=A (a category name that does not exist)
    expect: written 0; findings says the model has no category called 'Room'
  - given: id rows exactly as version 1 (no key row)
    expect: >
      the version 1 answer unchanged - resultJson format 1, stale as before,
      refused empty

# Version 3, KEEP A FACE (5b-610): an optional keepFace - outside, or left,
# right, top, bottom, near or far of a named view. Arranged on a NEW scratch
# project, never a working model (NEEDS-CHECKING Group FE): a 250 mm exterior
# wall on Level 1, a structural floor inside it only, and a Generic Model box
# in the wall whose instance length "Wall Width" sets its depth symmetrically
# about its origin, set to 255.5 while Length units round to 10 mm (so Revit
# SHOWS 260). Mark BOX-OUT. A second box, BOX-MID, in an interior wall with
# the floor on both sides.
positive_keep_face:
  - given: >
      key=Mark|in=Generic Models;BOX-OUT|Wall Width=100 with keepFace=outside
    expect: >
      written 1; readBack Wall Width 100 and a face entry with side outside,
      writeMovedItMm -77.75 (inward: half of 155.5, from the stored value, not
      the 80 the shown 260 would give), movedBackMm 77.75, offByMm 0; signs.slab names the
      floor on the inside; the box's outside face measured by hand (a
      dimension to it from a grid) the same before and after; ONE entry in
      Revit's undo list, and one Ctrl+Z puts the value and the position back
  - given: >
      the same box, id row id|uniqueId|Wall Width|260|100 (the SHOWN value),
      keepFace=outside
    expect: >
      the same answer - "was 260" passes the stale check as before (the check
      is unchanged, by decision), and the move comes from the measured face
  - given: a box's Height changed with keepFace=bottom of South (an elevation)
    expect: written 1; the box's bottom face where it was; its top moved by the whole change

negative_keep_face:
  - given: >
      key=Mark|in=Generic Models;BOX-MID|Wall Width=100 with keepFace=outside,
      BOX-MID in an interior wall with the structural floor on both sides
    expect: >
      written 0; refused names BOX-MID and says none of the three signs of the
      outside applies - slab on both sides, no thin linked wall, no duct - and
      BOX-MID's Wall Width and position unchanged (read back)
  - given: keepFace=left (no view named)
    expect: written 0; findings says left needs a view and how to name one; nothing written
  - given: keepFace=left of No Such View
    expect: written 0; findings says no view is called that; nothing written
  - given: BOX-OUT pinned, keepFace=outside, by id
    expect: written 0; stale names it - pinned, keeping a face means moving it; nothing written
  - given: >
      id rows exactly as version 2, keepFace left out
    expect: >
      the version 2 answer unchanged - resultJson has no keepFace key, BOX-OUT
      shrinks about its LocationPoint (its outside face moves 77.75 mm in), no
      element is moved

# Version 4 (5b-1259, 5b-1260): types=yes on the key row reaches TYPES, and an
# element reference takes a NAME. NEEDS-CHECKING Group HZ.
positive_types:
  - given: key=Type Name|in=Columns|types=yes;305mm Diameter|Material=<a material's exact name>
    expect: >
      written 1; resultJson format 2 with "types": true; readBack's value the
      material's name and raw its id; both columns of that type show the material
negative_types:
  - given: the same row with no types=yes
    expect: >
      written 0; refused names 305mm Diameter and says a type holds it - add
      types=yes - nothing written
  - given: key=Type Name|in=Columns|types=yes;305mm Diameter|Material=No Such Material
    expect: written 0; refused says no material in this model is called that; the type keeps its Material
  - given: key=Type Name|in=Columns|types=maybe;305mm Diameter|Material=x
    expect: written 0; findings says types='maybe' is not yes or no; nothing written

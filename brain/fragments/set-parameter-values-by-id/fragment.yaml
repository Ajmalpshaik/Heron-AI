compatibility-note: >
  One implementation for every release: GetElement by UniqueId, GetParameters,
  AsValueString, AsString, SetValueString, Set(string), Set(int), Regenerate,
  Uri.UnescapeDataString - all present from 2020 to 2027. A Yes/No is found by
  its display string reading Yes or No on an integer parameter, which needs no
  version-specific type API. Version 2 adds Settings.Categories, Category.Name,
  FilteredElementCollector.OfCategoryId, WhereElementIsNotElementType and
  SubTransaction - all present from 2020 to 2027 - and still never builds an
  ElementId from a number: a key is matched as the text a parameter shows.

  Since row 5b-1259 an element reference takes a name. `Parameter.Set(ElementId)`,
  `AsElementId`, `ElementType.FamilyName`, `FilteredElementCollector.OfClass`
  and `WhereElementIsElementType` are unchanged 2020 to 2027. What a reference
  holding <By Category> may name is read by reflection, like the Yes/No:
  `SpecTypeId.Reference.Material` from 2022 (read in the 2023 reference
  assembly), `ParameterType.Material` and `ParameterType.FamilyType` on 2020
  and 2021 (read in the 2020 one). No `ElementId` is built from a number.

  Since row 5b-1344 a parameter may be named by GUID: `Element.get_Parameter(Guid)`
  and `Definition.Name` are unchanged 2020 to 2027, and `Guid.TryParse` is the
  .NET Framework 4 call every runtime here carries.

# IMPORT_PARAMETER_VALUES WAS MERGED INTO THIS CARD on 2026-11-01, on the
# owner's instruction ("make sure there is no duplicate tools"; "in every
# conflict keep the safer rule"), and is DEPRECATED. The same job: a different
# value per element, matched by id, written and read back. Where its inputs and
# outputs are now: csvPath and blankCells the same names; valuesWritten ->
# written; rowsMatched, rowsUnmatched,
# valuesRejected, blankCellsSkipped, cellsCleared, rowFindings the same names;
# findings the same. Its Yes/No words, its element reference by name, its
# GUID-less shared-name refusal and its one regeneration before the read-back
# were this card's already.
#
# THE SAFER RULE WHERE THEY DIFFERED:
#   ALL OR NOTHING. The import wrote every row it could and named the rest -
#   an unmatched id was skipped, the other rows written. Here one row that
#   cannot be used and NOTHING is written.
#   NEVER WIDENED PAST THE ROWS. The import was "scoped to the selection": a
#   row whose id was not among the elements handed in was skipped. This card
#   takes NO elements and no selection - one made after the table was read
#   would be written onto (D-108; tests/test_companion.py holds it) - so the
#   import's `elements` is NOT carried, as an opposite rule: the rows alone
#   name the elements and nothing outside them is ever touched; each id must
#   name one element here or nothing is written; and a UniqueId column, when
#   the file has one, must agree - the check that catches another model's
#   file, which the selection scope caught. A file from another model whose

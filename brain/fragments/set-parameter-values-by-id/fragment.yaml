compatibility-note: >
  One implementation for every release: GetElement by UniqueId, GetParameters,
  AsValueString, AsString, SetValueString, Set(string), Set(int), Regenerate,
  Uri.UnescapeDataString - all present from 2020 to 2027. A Yes/No is found by
  its display string reading Yes or No on an integer parameter, which needs no
  version-specific type API. Version 2 adds Settings.Categories, Category.Name,
  FilteredElementCollector.OfCategoryId, WhereElementIsNotElementType and
  SubTransaction - all present from 2020 to 2027 - and still never builds an
  ElementId from a number: a key is matched as the text a parameter shows.

  Since row 5b-1221 an element reference takes a name. `Parameter.Set(ElementId)`,
  `AsElementId`, `ElementType.FamilyName`, `FilteredElementCollector.OfClass`
  and `WhereElementIsElementType` are unchanged 2020 to 2027. What a reference
  holding <By Category> may name is read by reflection, like the Yes/No:
  `SpecTypeId.Reference.Material` from 2022 (read in the 2023 reference
  assembly), `ParameterType.Material` and `ParameterType.FamilyType` on 2020
  and 2021 (read in the 2020 one). No `ElementId` is built from a number.

utterances:
  - apply the values edited in the Companion table
  - write these edited parameter values back to the elements
  - give each room its own name, matched by its room number
  - set a different value on each element found by its Mark
  # ADDED 2026-10-17, 5b-610 - version 3's keepFace. On main that day both
  # reached other cards on all four backends (DIMENSION_ROOMS,
  # ADD_FAMILY_MODEL_TEXT, CREATE_WALL_ELEVATION, CREATE_OPENING) and this card
  # was in the top 20 for neither. Declared, both reach it on all four and no
  # other declared sentence moved. Paraphrases do not reliably reach it - the
  # purpose was left as it was so that nothing else moves (5b-610).
  - set the wall width to 100 and keep the outside face
  - change the opening depth keeping its outer face

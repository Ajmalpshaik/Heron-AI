id: FRG-PAR-027
semantic-identity: "a different value for each named element, only if nothing moved since it was read"
kind: action
domain: revit.parameters
capability: SET_PARAMETER_VALUES_BY_ID
# Version 2 (2026-10-13, FRAGMENT-ISSUES 5b-459): an element may also be named
# by a value one of its parameters holds - a room's Number, a sheet's Sheet
# Number, a Mark - so giving 13 rooms 13 names is one call, not 26. The id rows
# of version 1 are read and written exactly as before. The semantic-identity
# line is version 1's on purpose: it is searched, and a new word in it moves
# other cards' answers (the routing measured for 5b-459).
#
# VERSION 3 (2026-10-17, FRAGMENT-ISSUES 5b-610): an optional `keepFace` keeps
# ONE face of every element written where it is - its outside face, or the
# left, right, top, bottom, near or far face in a named view. Kept out of the
# purpose on purpose, as version 2 kept the identity line: the purpose is
# searched, and the routing for 5b-610 was measured with it unchanged.
#
#   WHY. On 2026-10-15/17 the owner set the instance Wall Width of 18 openings
#   (TRG_GEN_CutOut_Rectangular_HVAC : 12.5mm Cutout Buffer, a real project in
#   Revit 2020) from 255.5 or 260 to 100 and kept the outside face where it
#   was. Wall Width was measured to shrink symmetrically about the
#   LocationPoint, so by hand it took this tool once and MOVE_ELEMENTS five
#   times - six entries in Revit's undo list. And 13 of the 18 really held
#   255.5 while Revit SHOWED 260 (the project rounds lengths to 10 mm), so a
#   move worked out from the shown value was 2.25 mm wrong.
#
#   WHAT IT DOES. Before anything is written the face is measured off each
#   element's geometry - its outermost point in that direction. After the
#   write and one regeneration it is measured again, the element is moved back
#   by exactly the difference, and after a second regeneration it is measured a
#   third time. All in the transaction the write is in: ONE undo entry. A face
#   not back within 0.1 mm throws, and every row is taken back. readBack gives
#   each element's face before, how far the write moved it, the move, where it
#   is now and how far off; resultJson gains `keepFace` with what was asked.
#   Nothing about the move is worked out from a value, so the rounding trap
#   above cannot reach it.
#
#   OUTSIDE is the face looking out of the building, found from the wall the
#   element sits in (this model or a loaded link) and three signs, each
#   measured on all 18 openings and agreeing every time: (1) no STRUCTURAL
#   floor 1 m and 3 m out on that side at the element's level, in this model or
#   a loaded link, and one on the other side; (2) a thin linked wall - at most
#   half as thick as the wall the element sits in - beside it on that side
#   only; (3) this model's ducts and duct accessories within 3 m sit on the
#   other side, the inside. A sign with nothing to go on does not vote. None
#   voting, or two voting different ways, refuses the element - by id rows the
#   whole run, by key that row - naming what each sign found. Never a guess.
#   A duct counts by its point nearest the element, never its ends; the slab
#   is looked for 1 m and 3 m out from the wall's face; and a WALL written
#   itself is the wall it sits in.
#
#   A VIEW SIDE is the view's own direction: left and right along its right
#   direction, top and bottom along its up direction, near toward the viewer
#   and far away. A template, a sheet, a schedule, a legend or a drafting view
#   has no side in the model and is refused by name.
#
#   REFUSED BEFORE ANYTHING IS WRITTEN: a pinned element (keeping a face means
#   moving it), a member of a model group (it cannot move alone), an element
#   with no geometry to measure, and a keepFace that names no face Heron knows
#   or a view that is not there.
#
#   ABSENT IS VERSION 2, STATEMENT FOR STATEMENT. Left out, keepFace reads
#   "none" (`absent:`, PR #545's rule, HeronBindingNote.DeclaredAbsent), the
#   one new top-level name `faceKeeper` is null, and every line that asks it
#   steps aside - resultJson, written, stale, refused and findings are what
#   version 2 gave. The reply's list of what the fragment left behind gains
#   one line, `faceKeeper (null)`, because every top-level name is printed.
#
#   THE STALE CHECK IS UNCHANGED, AND THAT IS A DECISION (5b-610). On the
#   first job "was 260" passed for a cell holding 255.5, because a number is
#   compared by the text Revit SHOWS. Comparing the stored value instead was
#   weighed and not taken: an id row's `was` is, by contract, what the table
#   SHOWED, and turning "260" back into 260 mm and comparing would refuse
#   every row whose stored value the project's rounding hides - for ever,
#   since the caller has only the shown text to send. A caller that HAS the
#   stored value sends it as the optional sixth field, and that is compared
#   exactly (Codex review of #362). keepFace never reads the value to decide a
#   move, so the trap that cost 2.25 mm cannot reach it.
#
#   Version 2's proof below no longer describes the code and is kept as a
#   record; the card is DRAFT until the version 3 proof is signed (NEEDS-CHECKING
#   Group FE).
#
# VERSION 4 (2026-10-19, FRAGMENT-ISSUES 5b-1259 and 5b-1260). Measured that
# day on Revit 2020, the owner's Kerala house: two M_Round Column instances
# (ids 346587, 346588, Material <By Category>) could not be given a material.
# "key=Type Name|in=Columns;305mm Diameter|Material=..." answered "no element
# in Columns has Type Name ..." - a key reached elements placed in the model,
# never their types - and an id row or a key row naming a parameter that holds
# another element was refused as "cannot be typed as text".
#
#   TYPES (5b-1260). `types=yes` on the key row looks among the TYPES in those
#   categories instead of the elements, so that row writes the column type's
#   Material once. Folded into the text, as `in=` is: no new input, and left
#   out it is no - version 3's search. A key that names no element but names a
#   type is refused saying to add types=yes. types=yes with keepFace is
#   refused (a type is not placed anywhere); any word but yes or no for it
#   refuses the run. An id row already reached a type by its UniqueId.
#
#   NAMES (5b-1259). A parameter holding another element takes a NAME, by id
#   row or by key: a material or a level by its Name, a family type as
#   "Family: Type", matched exactly, the kind narrowed by what it holds or its
#   definition. None, or two, is refused with the reason - by id rows the whole
#   run, as a stale row; by key that row. After the regeneration the id Revit
#   holds must be the one the name named, or findings says what it reads back.
#   readBack's raw for a reference is the id Revit prints.
#
#   Version 3's proof below no longer describes the code and is kept as a
#   record; the card is DRAFT until NEEDS-CHECKING Group HZ proves version 4.
#
# VERSION 5 (2026-10-19, FRAGMENT-ISSUES 5b-1221, D-145): an optional
# `renameViews` answers the one question Revit asks when a LEVEL's name is
# written - "Would you like to rename corresponding views?", dialog id
# TaskDialog_Confirm_Level_Rename. Measured 2026-10-19 on Revit 2020, model
# 'Kerala house design': rows "key=Name|in=Levels;Level 1|Name=Ground Floor"
# were rolled back, because the add-in declines every dialog in a job
# (HeronDialogWatch). Changing a level's Elevation the same way was kept.
#
#   yes - the level is renamed and Revit renames the plan and ceiling views
#         that carry its name; no - the level alone. The add-in answers that
#         ONE dialog id with that answer for this one job, from the need's
#         `dialog:` line; every other dialog is still declined (D-145).
#   left out ("none") - a level's name is refused before anything is written,
#         naming renameViews: by id the whole run, by key that row. Every other
#         parameter and element is version 4's run, statement for statement.
#
#   Version 3's proof below no longer describes the code and is kept as a
#   record; the card is DRAFT until versions 4 and 5 are proved in Revit
#   (NEEDS-CHECKING Groups HZ and HP). Kept out of the purpose and the identity line
#   for the reason version 3 gives: both are searched.
#
# VERSION 6 (2026-10-28, FRAGMENT-ISSUES 5b-1344): a parameter may be named by
# its GUID, as "Equipment Tag {e133774c-3f62-45f1-a0c6-7e6c6238380b}" - by id
# row, as a key row's parameter=value, as the key or as a narrowing. Measured
# that day on Revit 2020, a real project (4355-BHVD-3D-50S20-BL001A): six
# volume control dampers each carry TWO writable shared parameters called
# "Equipment Tag" (GUIDs e133774c-... holding VCD001-VCD041 on the others, and
# cb0704fc-... blank on all), so "key=Mark|in=Duct Accessories;MOD070|Equipment
# Tag=VCD042" refused all six rows - rightly, since which one was meant would be
# a guess - and no Heron tool could write either.
#
#   WHAT IT DOES. A name is looked for as it is spelt first, so every name that
#   worked before reaches exactly what it reached. Only when nothing on the
#   element is called that, and the name ends in a GUID in braces, is the one
#   parameter with that GUID taken - and only while it is still called what
#   comes before the braces (left empty, the GUID alone). A GUID the element
#   does not carry, or one under another name, finds nothing: "it has no
#   parameter called ...". The refusal for two writable parameters of one name
#   now says to name the one meant that way. REPORT_PARAMETER_INVENTORY prints
#   every parameter's GUID.
#
#   The proof below no longer describes the code and is kept as a record; the
#   card is DRAFT until NEEDS-CHECKING Group JF proves version 6. Kept out of
#   the purpose and the identity line, for the reason version 3 gives.
#
# VERSION 7 (2026-11-01) - IMPORT_PARAMETER_VALUES MERGED IN: rows read from a
# CSV, `blankCells`, rows matched by id as text - see the purpose's last
# paragraph and the comment above `utterances`. The proof below is version
# 6's, kept as the record; DRAFT until version 7 is proved on a real model.
version: 7
source: OFFICIAL
risk: MODIFY

purpose: >
  Writes a DIFFERENT value into a named instance parameter on each of several
  elements, each element named by its id and UniqueId - the write half of the
  Heron Companion's editable table (D-108, docs/40 section 8.4). Every row
  carries the value the table SHOWED, and nothing is written unless every row
  still holds exactly that.

  **All or nothing, before anything is written (Article 12c, Golden Rule 21).**
  The first pass only checks: the element is still there and is the same
  element, the parameter is there once, it is not read-only, and it still
  holds the value the table showed. One row failing any of that and the whole
  run changes NOTHING and says which rows and why - the owner's choice on
  2026-09-29, question 2 of docs/40 section 18. The page shows them and the
  modeller presses Apply again.

  **The elements come from the rows, never from the selection.** Applied
  minutes after the table was read, a fragment that took the selection would
  write onto whatever is selected then. So there is no `elements` input.

  **Values are written the way write-element-parameters writes them**: text
  as text; a number through SetValueString, in the document's own units, so
  "300 mm" and "300" mean what the modeller sees; a Yes/No as 1 or 0 from Yes,
  No, True, False, On, Off, 1 or 0. After ONE regeneration every row is read
  back and `resultJson` carries what Revit now holds, not what was asked.

  **Rows cross as text**: `id|uniqueId|parameter|was|new`, each field
  percent-encoded so a value may hold a bar or a semicolon, rows separated by
  semicolons.

  **Or by a value each element holds** (version 2): a first row of the key
  parameter and the categories to look in, then rows of a key value and the
  values to write. A key matching no element, or more than one, is refused for
  that row alone; the other rows are written and read back.

  ASSUMES AN OPEN TRANSACTION and does not open one - the operation's
  TransactionGroup makes the whole Apply one entry in Revit's undo list
  (Golden Rule 16).

  **Or from a spreadsheet** (version 7, when IMPORT_PARAMETER_VALUES was merged
  in): `csvPath` names a CSV whose first column is each element's id and whose
  other columns are parameter names - a different value per element, from a
  table edited outside Revit, the client's equipment tags sent back. Each cell
  is an id row, so all or nothing holds for the file: an id naming no element
  here, a missing parameter or a value Revit will not take, and nothing is
  written. `blankCells` - skip or clear - says what an empty cell means; it is
  asked, never assumed. The rows alone name the elements, as for every row.

contract:
  needs:
    - name: doc
      type: Document
    # TWO SHAPES; the first row says which. BY ID (the Companion's table):
    # id|uniqueId|parameter|was|new per row. BY ANY PARAMETER VALUE: first row
    # key=<parameter>|in=<categories>, then <key value>|<parameter>=<value>
    # per element, any number of parameter=value after the key - e.g.
    # key=Number|in=Rooms;1|Name=Lift Lobby;2|Name=Staircase 1. Categories as
    # Visibility/Graphics names them, comma-separated; any other name=value on
    # the first row narrows the search (Level=Level 14). Rows are separated by
    # ; and a ; | = or % inside a value is percent-encoded. A key matching no
    # element or several is refused for that row; the others are written.
    # VERSION 4: types=yes on the first row looks among the TYPES in those
    # categories - key=Type Name|in=Columns|types=yes;305mm Diameter|Material=
    # Teak - and a parameter holding another element takes a material or a
    # level by name, or a family type as Family: Type. VERSION 6: two shared
    # parameters with one name are told apart by GUID - Equipment Tag
    # {e133774c-3f62-45f1-a0c6-7e6c6238380b} - as REPORT_PARAMETER_INVENTORY
    # prints it.
    - name: rows
      type: string
      source: request
      # Version 7: left out it reads "none", no rows - for a run from csvPath.
      optional: true
      absent: none
    # VERSION 7, from IMPORT_PARAMETER_VALUES: a CSV to read the rows from -
    # first column the element's id as Revit prints it (EXPORT_PARAMETERS_TO_CSV
    # writes it as ElementId), then one column per parameter; a UniqueId column,
    # if the file has one, must name the same element. Left out: "none", rows
    # only. Given with rows, refused. A CSV goes in the session's scratch
    # folder, never beside Heron or the model.
    - name: csvPath
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 7, from IMPORT_PARAMETER_VALUES: "skip" or "clear" - what an
    # EMPTY cell of the CSV means. ASKED, NO DEFAULT: one of the two deletes
    # what somebody typed, so Heron never picks. Left out ("none") with a CSV,
    # the run is refused before the file is read.
    - name: blankCells
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 3 (5b-610). The ONE face of every element written that stays
    # where it is: outside - the face looking out of the building - or left,
    # right, top, bottom, near or far of a named view, as "left of Section 3".
    # The face is measured off the element before the write and after it, and
    # the element is moved back by exactly the difference in the same undo
    # entry; readBack says how far for each. Left out: "none" - version 2's run,
    # unchanged. Any element, any parameter whose change moves a face.
    - name: keepFace
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 5 (5b-1221, D-145). Only for a LEVEL's name: yes renames the
    # level and the plan and ceiling views that carry its name, no the level
    # alone. `dialog:` names the one Revit dialog this answers, for this job
    # only - HeronDialogRule.CallerAnswer holds which dialogs a caller may
    # answer and with which words; anything else is refused before the run.
    # Left out: "none", and a level's name is refused, naming this input.
    - name: renameViews
      type: string
      source: request
      optional: true
      absent: none
      dialog: TaskDialog_Confirm_Level_Rename
  provides:
    # Rows written AND read back.
    - name: written
      role: result
      type: int
    # The whole answer as one JSON string, format 1 - applied or not, the stale
    # rows with why, and the value Revit holds for each written row. By key it
    # is format 2: applied means at least one row was written, `refused` names
    # each row turned down with why, and every readBack entry carries its key,
    # the value asked and the value Revit holds now.
    # ACCOUNTING, NOT RESULT (version 2): it is written on every run, nothing
    # written included, so as a result no negative case could ever read empty
    # - `written` is the count that says whether anything landed (D-51; the
    # fragment-proving skill's rule for a sentence the fragment always writes).
    - name: resultJson
      role: accounting
      type: string
    # Rows that stopped the run - changed in Revit, gone, read-only. Nothing
    # was written when this is not empty. Turned down, never found (D-52).
    # Id rows only; always empty by key.
    - name: stale
      role: accounting
      type: IList<string>
    # By key only: each row not written, as "<key>: why" - no element or
    # several hold that key, the key is given twice, the parameter cannot be
    # written, or Revit would not take the value. The other rows were written.
    # Always empty for id rows. Turned down, never found (D-52).
    - name: refused
      role: accounting
      type: IList<string>
    # A sentence per thing turned down, in the modeller's words.
    - name: findings
      role: accounting
      type: IList<string>
    # VERSION 7, from IMPORT_PARAMETER_VALUES - for a CSV.
    - name: rowsMatched
      # CSV rows whose id named an element here. What it could act on, never
      # a value written (D-52).
      role: accounting
      type: int
    - name: rowsUnmatched
      # CSV rows whose id named nothing here, or whose UniqueId was another
      # element's. One is enough for nothing to be written (D-52).
      role: accounting
      type: int
    - name: blankCellsSkipped
      # Empty cells left alone because blankCells was skip. Deliberately not
      # used - never a value written (D-52).
      role: accounting
      type: int
    - name: cellsCleared
      # Text values emptied because their cell was blank and blankCells was
      # clear - also in `written`. Zero when nothing was written.
      role: result
      type: int
    - name: valuesRejected
      # Values Revit took and then read back different, after the one
      # regeneration - text exactly, a tick box by its 1 or 0, a reference by
      # its id; never counted in `written`. On every route since version 7
      # (D-52).
      role: accounting
      type: int
    - name: rowFindings
      # Every stale and refused row as ONE string joined by " | ", shown whole
      # where a list is cut to three items (IMPORT_PARAMETER_VALUES' 5b-439).
      # Empty on a clean run (D-52).
      role: accounting
      type: string


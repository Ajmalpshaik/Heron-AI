id: FRG-GEO-010
semantic-identity: "turn these family instances round using their own flip controls"
kind: action
domain: revit.elements
capability: FLIP_ELEMENTS
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Flips the hand or facing of family instances - a door swinging the wrong way,
  a diffuser or a piece of equipment pointing the wrong direction. It is
  Revit's own flip arrows, done to many elements at once.

  This is NOT rotation. A flip uses the family's own built-in controls and
  respects how the family was authored; rotating 180 degrees moves geometry and
  can leave a hosted element wrong against its host. When somebody says *"it is
  the wrong way round"* about a door or a diffuser, this is usually what they
  mean.

  Not every family can flip, and the ones that cannot are reported rather than
  attempted - a family author decides whether a flip control exists at all.

  **VERSION 2: A FLIPPED DOOR'S FROM AND TO ROOM FOLLOW ITS SWING.** Revit
  leaves From Room and To Room as they were when a door's facing is flipped, so
  the door schedule reads backwards. After a facing flip the door's To Room is
  swapped to the room it now swings into - only where the rooms either side
  say so - and each door is named. `fromToRoomOnly` fixes the From and To Room
  of doors already wrong, and flips nothing.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).


  **"THE ARROWS ARE WRONG" MEANS TWO DIFFERENT JOBS AND ONE OF THEM CHANGES THE
  MODEL:**

  | What you meant | Use |
  |---|---|
  | "is the flow going the right way", "are the arrows pointing the right way" - to check | `CHECK_FLOW_DIRECTION`, read-only |
  | "the diffuser is the wrong way round", "turn it around" - to change | `FLIP_ELEMENTS`, which flips real elements |

  A question about direction must never flip anything. Both fragments carry this
  table - written one way it only routes whoever lands on the newer file.

# VERSION 2 - FRAGMENT-ISSUES 5b-1242. Seen 2026-10-19 on Revit 2020, the
# owner's 'Kerala house design': five M_Single-Flush doors (345958, 345961,
# 345964, 345968, 345970) placed by PLACE_HOSTED_FAMILY before any room
# existed, then flipped with flipFacing=true to swing into their rooms. Read
# back: FacingFlipped True and the room on the facing side right, but
# get_ToRoom still the hall - REPORT_DOOR_ROOM_LINKS gave 5 disagreements.
# Revit does not swap From and To on a facing flip. So after a facing flip
# each DOOR is read on the last phase and FlipFromToRoom is called only when
# the room a short way out along its facing (wall half-width + 300 mm, a foot
# above it) is its From Room AND the room behind is its To Room; read back and
# named in `roomsSwapped`. Already right, no room either side, no point
# location, or rooms that a swap would not make agree: left and named in
# `roomsLeft`. A window is left and named - its To Room is not tied to its
# facing (PLACE_HOSTED_FAMILY sets it to the inside room while it faces out).
# `fromToRoomOnly` (optional, absent = false) does the same check on every
# door handed in and flips nothing. Absent, version 1's behaviour is
# unchanged for everything that is not a door flipped on its facing. The
# words above are kept short on purpose - a purpose's words move routing.
contract:
  needs:
    - name: elements
      type: IList<Element>
    - name: flipHand
      type: bool
      source: request
    - name: flipFacing
      type: bool
      source: request
    - name: fromToRoomOnly
      # VERSION 2. Set: flip nothing, and set the From and To Room of every
      # door handed in to the rooms either side of its swing. Absent binds
      # false (HeronBindingNote.AbsentValue, row 5b-227), version 1's run.
      type: bool
      source: request
      optional: true
  provides:
    - name: flipped
      role: result
      type: int
    - name: cannotFlip
      # Instances whose family carries no flip control to use. Given and
      # unusable, never a flip it made - and a run that flipped nothing must
      # not read as work because of it (D-52).
      role: accounting
      type: IList<ElementId>
    - name: notFamilyInstance
      # Handed in but not family instances, so there was nothing here to act
      # on. A count of what it was GIVEN and could not use, never a thing it
      # found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: roomsSwapped
      # VERSION 2. One line per door whose From and To Room were swapped to
      # match its swing, read back after the swap.
      role: result
      type: IList<string>
    - name: roomsLeft
      # VERSION 2. One line per door or window checked and NOT swapped, with
      # why - already right, no room either side, the rooms do not settle it,
      # a window. Never work it did (D-52).
      role: accounting
      type: IList<string>


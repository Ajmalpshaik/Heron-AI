# READ ON A PHASE IT STANDS IN, AND THAT PHASE IS NAMED; back to DRAFT.
# Versions 2 and 3 read every door's From and To Room on the model's LAST
# phase only. Seen 2026-11-20 on Revit 2020 (House Scratch 1042, a copy of
# rac_basic_sample_project.rvt): its rooms are on 'Working Drawings' and its

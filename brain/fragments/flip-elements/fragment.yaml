id: FRG-GEO-010
semantic-identity: "turn these family instances round using their own flip controls"
kind: action
domain: revit.elements
capability: FLIP_ELEMENTS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Flips the hand or facing of family instances - a door swinging the wrong way,
  a diffuser or a piece of equipment pointing the wrong direction. It is
  Revit's own flip arrows, done to many elements at once.

  This is NOT rotation. A flip uses the family's own built-in controls and
  respects how the family was authored; rotating 180 degrees moves geometry and
  can leave a hosted element wrong against its host. When somebody says *"it is
  the wrong way round"* about a door or a diffuser, this is usually what they
  mean.

  Not every family can flip, and the ones that cannot are reported rather than
  attempted - a family author decides whether a flip control exists at all.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).


  **"THE ARROWS ARE WRONG" MEANS TWO DIFFERENT JOBS AND ONE OF THEM CHANGES THE
  MODEL:**

  | What you meant | Use |
  |---|---|
  | "is the flow going the right way", "are the arrows pointing the right way" - to check | `CHECK_FLOW_DIRECTION`, read-only |
  | "the diffuser is the wrong way round", "turn it around" - to change | `FLIP_ELEMENTS`, which flips real elements |

  A question about direction must never flip anything. Both fragments carry this
  table - written one way it only routes whoever lands on the newer file.

contract:
  needs:
    - name: elements
      type: IList<Element>
    - name: flipHand
      type: bool
      source: request
    - name: flipFacing
      type: bool
      source: request
  provides:
    - name: flipped
      role: result
      type: int
    - name: cannotFlip
      # Instances whose family carries no flip control to use. Given and
      # unusable, never a flip it made - and a run that flipped nothing must
      # not read as work because of it (D-52).
      role: accounting
      type: IList<ElementId>
    - name: notFamilyInstance
      # Handed in but not family instances, so there was nothing here to act
      # on. A count of what it was GIVEN and could not use, never a thing it
      # found (D-52).
      role: accounting
      type: IList<ElementId>


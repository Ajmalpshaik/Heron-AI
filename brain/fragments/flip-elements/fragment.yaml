compatibility-note: >
  One implementation for every release. `FamilyInstance.CanFlipHand`,
  `CanFlipFacing`, `flipHand()` and `flipFacing()` are unchanged 2020 to 2027.
  No geometry is computed here, so there is nothing for a units change to reach.
  Version 2 adds `FlipFromToRoom()`, `get_FromRoom(Phase)`, `get_ToRoom(Phase)`,
  `FacingOrientation`, `Wall.Width` and `Document.GetRoomAtPoint(XYZ, Phase)`,
  all present and unchanged 2020 to 2027. The 300 mm reach is divided by 304.8
  - plain arithmetic, no units API.

# ROUTING - the same rows are in the fragments named here. Added 2026-10-04
# (docs/45).
#
#   "flip the door" / "the handing is
#    wrong, fix it"                       -> here. It CHANGES the model
#   "which doors are flipped" / "is this
#    door mirrored"                       -> REPORT_MIRRORED_INSTANCES. It
#                                            only reads, and keeps mirrored
#                                            apart from flipped
#   "mirror these to the other room"      -> MIRROR_ELEMENTS
#   "the door schedule rooms read
#    backwards, fix them"                 -> here with fromToRoomOnly. Version
#                                            2. REPORT_DOOR_ROOM_LINKS only
#                                            names which ones

utterances:
  - the door opens the wrong way
  - flip the diffuser round
  - it is facing backwards
  - turn the equipment the other way
  - the handing is wrong
  - flip them
  - fix the from and to room on these doors

# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: 4 doors, flipHand true
    expect: >
      flipped = 4 and every door SWINGS the other way on the plan. Look at one -
      a count is what the broken version returns too

  - given: air terminals with a facing control, flipFacing true
    expect: they point the other way, and their host relationship is unchanged

  - given: >
      version 2 - a door with a room on both sides, flipFacing true (Group HT1)
    expect: >
      it swings into the other room, and get_ToRoom read back afterwards names
      the room it now swings into. Its line in `roomsSwapped` names the From ->
      To before and after. The door schedule's From Room and To Room agree, and
      REPORT_DOOR_ROOM_LINKS finds no disagreement for it

  - given: >
      version 2 - doors already flipped whose To Room still names the room they
      used to swing into, fromToRoomOnly true (Group HT3)
    expect: >
      flipped = 0 and no door moves on the plan; each door's line in
      `roomsSwapped`, and REPORT_DOOR_ROOM_LINKS finds no disagreement after

negative:
  - given: a family instance whose author gave it NO flip control
    expect: >
      its id in `cannotFlip`, nothing attempted, no exception. This is a family
      that would have to be edited - not a failure of the request

  - given: a wall or a duct in the list
    expect: >
      its id in `notFamilyInstance`. Kept apart from `cannotFlip` because one is
      the wrong selection and the other is a family limitation, and they need
      different answers

  - given: both flipHand and flipFacing false
    expect: >
      flipped = 0 and everything in `cannotFlip` - asking for no flip at all
      changes nothing, and must not report success

  - given: >
      version 2 - a door with no room on either side, flipFacing true (Group HT2)
    expect: >
      it flips (flipped = 1), nothing is swapped - `roomsSwapped` empty - and its
      line in `roomsLeft` says no room on either side, so nothing was swapped

  - given: >
      version 2 - a window flipped on its facing
    expect: >
      it flips, its From and To Room are not touched, and `roomsLeft` names it as
      a window

second_route:
  - the element's own flip arrows in Revit, clicked once by hand on one instance
  - one Ctrl+Z puts the whole batch back (Golden Rule 16)

id: FRG-VIEW-005
semantic-identity: "clear the per-element graphic overrides on these, in this view"
kind: action
domain: revit.views
capability: RESET_GRAPHIC_OVERRIDES
version: 2
source: OFFICIAL
risk: MODIFY

# VERSION 2 (2026-11-13) - EVERY OVERRIDE COUNTS AS ONE, and back to DRAFT.
# FRAGMENT-ISSUES row 5b-1630: version 1 asked only halftone, transparency,
# the two line colours and the two line weights whether an element had an
# override, so on Revit 2024 (2026-11-13, "Heron Reads Test") three walls
# overridden only by a detail level, a projection line pattern and a surface
# pattern switched off were cleared and answered "cleared 0". Version 2 asks
# every setting the Override Graphics box holds - the list READ_GRAPHIC_
# OVERRIDES reads since its row 5b-154 - so the split between `cleared` and
# `hadNothing` says what it is for. The clear itself is unchanged. Version 1
# was PROVEN on 2026-09-10 (the proof block below, kept as the record of what
# it proved); its C# moved, so it is DRAFT again until NEEDS-CHECKING Group
# NX is run (D-30) - on the owner's word of 2026-11-11 that a fragment found
# wrong may be changed even though it is proven.

purpose: >
  Clears the per-element colour, fill, halftone and line overrides on the given
  elements in one view - the other half of OVERRIDE_GRAPHICS_IN_VIEW, and the
  answer to *"put it back how it was"*.

  Without it, a grayout is a one-way door: something applied it and nothing
  could take it off short of resetting the whole view by hand.

  **It clears the PER-ELEMENT override only.** A category-level override in the
  same view is a different setting and survives this untouched - which is
  usually right, and is confusing the first time somebody clears an element and
  watches it stay grey because the whole category was overridden too.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: view
      type: View
      source: request
    - name: elements
      type: IList<Element>
  provides:
    - name: cleared
      role: result
      type: int
    - name: hadNothing
      # Elements that carried no override to clear. The evidence it looked,
      # never a clear it made (D-52).
      role: accounting
      type: int
    - name: viewRefused
      # The view declined the change - a template owns the slot, or the view
      # cannot take it at all. The evidence it looked and said no, never a
      # change it made (D-52).
      role: accounting
      type: bool

proof:
  date: '2026-09-10'
  by: Ajmal PS
  model: Project1 work_ajmal.al (3,471 elements), Revit 2024, session 24688
  positive_case: run as it would normally be run - the arrangement was re-made first by running
    select-by-category-name, set-selection with this phase's own values - run inside a transaction,
    and Revit reported the transaction group ROLLED BACK afterwards. returned cleared 2, hadNothing
    0, viewRefused false. inputs came view as given; elements from the selection (2). on Project1
    work_ajmal.al
  negative_case: run with categoryName=Walls, inViewOnly=1 - Mech, view=1 - Mech instead -
    chosen because it should not contain what this fragment reports - the arrangement was
    re-made first by running select-by-category-name, set-selection with this phase's own
    values - run inside a transaction, and Revit reported the transaction group ROLLED BACK
    afterwards. returned cleared 0, hadNothing 4, viewRefused false. inputs came view as given;
    elements from the selection (4). on Project1 work_ajmal.al
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: 33e60f73bb393acb

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. An empty `OverrideGraphicSettings` IS
  the cleared state - there is no separate clear call - and both it and
  `GetElementOverrides` are unchanged 2020 to 2027.

# ROUTING - the same rows are in the fragments named here.
#
#   "put the colours back"           -> here
#   "colour code by system"          -> COLOR_BY_PARAMETER - what this undoes
#   "make these red"                 -> OVERRIDE_GRAPHICS_IN_VIEW
#   "do the grayout"                 -> HIGHLIGHT_VS_REST - what this undoes

#   "what colour is this one overridden to" -> READ_GRAPHIC_OVERRIDES - this
#                                        one only clears
#
# ROWS ADDED 2026-09-06. The same rows are in RESET_VIEW_GRAPHICS.
#
#   "put this view back to normal"   -> RESET_VIEW_GRAPHICS, which sweeps every
#                                       CATEGORY override in the view without
#                                       being told which ones were written -
#                                       the case where nobody has the list
#   "reset ALL the graphic overrides in this view"
#                                    -> NOT ONE FRAGMENT. Three separate things
#                                       colour a view - categories, elements and
#                                       filters - and no single call clears all
#                                       three. It is RESET_VIEW_GRAPHICS then
#                                       this one, and a sentence naming two
#                                       capabilities belongs to a SKILL (D-47).
#                                       This fragment wins that sentence on
#                                       wording, does the element half, and
#                                       reports success with the categories
#                                       still coloured
utterances:
  - put it back how it was
  - clear the overrides
  - undo the grayout
  - remove the colours
  - reset the graphics on these
  - put the colours back

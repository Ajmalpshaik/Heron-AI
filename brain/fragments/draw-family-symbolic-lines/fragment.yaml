compatibility-note: >
  `FamilyItemFactory.NewSymbolicCurve(Curve, SketchPlane)`,
  `SymbolicCurve.SetVisibility` and `GetVisibility`,
  `FamilyElementVisibilityType.ViewSpecific` and `Model`,
  `Categories.NewSubcategory` and `SketchPlane.Create(Document, ElementId)` read
  the same 2020 through 2027 (the RevitAPI reference assemblies and their XML
  remarks, read 2026-10-01). `SymbolicCurve.Subcategory` is a LINE STYLE, a
  `GraphicsStyle`, on every release - the first compile said so - so the
  subcategory's projection style (`Category.GetGraphicsStyle`) is what is set,
  and its `GraphicsStyleCategory` what is read back. Which visibility kind a
  symbolic line takes is not in the remarks; both are tried and the setting
  read back (NEEDS-CHECKING BQ2).

# ROUTING - see SET_FAMILY_CATEGORY for the whole family-building table.
#
#   "draw the valve symbol in plan"               -> here
#   "draw a circle and a cross as the plan symbol" -> here
#   "hide the body in plan views in the family"   -> SET_FAMILY_FORM_VISIBILITY
#   "draw detail lines in this view"              -> CREATE_LINE, a project
#                                                    view's lines

utterances:
  - draw the valve symbol in plan
  - draw a circle and a cross as the plan symbol
  - add symbolic lines to this family
  - draw the fan symbol for coarse plans

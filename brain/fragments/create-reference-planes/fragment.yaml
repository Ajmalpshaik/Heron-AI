compatibility-note: >
  `ItemFactoryBase.NewReferencePlane(bubbleEnd, freeEnd, cutVec, view)`,
  `ReferencePlane.Normal / GetPlane() / Name` and `View.ViewDirection /
  RightDirection` read the same 2020 through 2027 (api-surface, read
  2026-09-24). The third argument of NewReferencePlane is a DIRECTION, and the
  plane's normal comes out as (freeEnd - bubbleEnd) crossed with it.


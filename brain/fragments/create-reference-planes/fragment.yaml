compatibility-note: >
  `ItemFactoryBase.NewReferencePlane(bubbleEnd, freeEnd, cutVec, view)`,
  `ReferencePlane.Normal / GetPlane() / Name` and `View.ViewDirection /
  RightDirection` read the same 2020 through 2027 (api-surface, read
  2026-09-24). The third argument of NewReferencePlane is a DIRECTION, and the
  plane's normal comes out as (freeEnd - bubbleEnd) crossed with it.
  Version 2 (2026-11-12) uses the same call and `XYZ.IsZeroLength`, both on
  every release; one implementation, no #if.

# ROUTING - see SET_FAMILY_SETTINGS for the whole family-building table.
#
#   "add reference planes at 300 each side"   -> here
#   "add a reference plane at 30 degrees"     -> here, version 2, axis angle
#   "label the angle between those planes"    -> LABEL_FAMILY_DIMENSION, an Angle parameter
#   "label the width between those planes"    -> LABEL_FAMILY_DIMENSION
#   "draw a detail line"                      -> DRAW_FAMILY_DETAIL_LINES - a line, not a plane
#   "set the grid or level extents"           -> SET_DATUM_EXTENT_TYPE


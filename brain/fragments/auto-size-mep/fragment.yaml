compatibility-note: >
  One implementation for every release. `BuiltInParameter.RBS_DUCT_FLOW_PARAM`,
  `RBS_CURVE_DIAMETER_PARAM`, `RBS_CURVE_WIDTH_PARAM` and
  `RBS_CURVE_HEIGHT_PARAM` are present 2020 through 2027 - read off the
  reference assemblies at both ends rather than remembered. No units API is
  touched: every conversion here is plain arithmetic, which is what keeps it
  working across the 2021 units change.

# THE UNIT ASSUMPTION IS PRINTED, SO A WRONG ONE CANNOT HIDE.
#
# Revit's internal airflow unit is taken to be CUBIC FEET PER SECOND, converted
# at 0.028316846592 m3 per ft3 - which is exact arithmetic (1 ft = 0.3048 m by
# definition) IF the internal unit is what it is assumed to be. Reflection over
# an assembly shows a property type, never a unit.
#
# So the first row of the report prints the RAW internal value beside Revit's
# own display string for the same duct. If the assumption were wrong those two
# would disagree obviously, on the very first run, before a single size is
# written. Read that line before trusting anything below it.

# TRAP - OBSERVED ELSEWHERE, NOT YET PROVEN HERE. Added 2026-09-23.
#
# Another tool, on real models and mostly on Revit 2020, resized a connected
# PIPE run and Revit left the fittings at the old size and added transitions:
# 22 pipes became 41 elements, and unions became two transitions back to back
# with connectors left open. Every pipe still read its new size - and this
# fragment reads back exactly that, the size parameter, so `sized` would be
# right while the run is broken. It was seen on pipe; whether a duct run does
# the same is not known. Nothing in this repository has reproduced either.
#
# A NOTE ONLY. This fragment is PROVEN, and a change to its code would make
# the proof stale. AUTO_SIZE_PIPE, which was DRAFT, now counts the open
# connectors before and after a resize; nothing here does yet. Until it does,
# look at the joints of a CONNECTED run after sizing it. NEEDS-CHECKING AJ2.

# ROUTING - repeated in SET_MEP_SIZE, MEASURE_MEP_VELOCITY and TRACE_CONNECTIVITY.
#
#   "size the ducts from the flow"   -> here
#   "auto size these ducts"          -> here
#   "make it 400x250"                -> SET_MEP_SIZE - a size you have decided;
#                                       this one works it out from the air
#   "what velocity is in this duct"  -> MEASURE_MEP_VELOCITY - a READ
#   "the flow is zero everywhere"    -> TRACE_CONNECTIVITY. Nothing here can
#                                       size a run Revit thinks carries no air
#   "how many kilos is that ductwork"    -> REPORT_DUCT_WEIGHT - the metal
#                                           once the size is settled. This
#                                           decides the size itself
#   "size the ductwork"                  -> here, not REPORT_DUCT_WEIGHT

utterances:
  - size the ducts from the flow
  - auto size these ducts
  - size this system for 5 m/s
  - work out the duct sizes from the airflow
  - size the ductwork

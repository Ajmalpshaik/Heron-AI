id: FRG-MEP-033
semantic-identity: "which runs have a loose end, and which are fully joined"
kind: filter
domain: revit.mep
capability: SELECT_BY_CONNECTION_STATUS
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Splits a duct, pipe or fitting category into what has at least one OPEN end
  and what is joined at every end - the cheap sweep behind "find the loose
  ends", run before a system is trusted.

  **It is a local check, not a trace.** It asks each element about its own
  connectors and walks nothing. A run whose every piece is joined to its
  neighbour passes here and can still lead nowhere - it can be a closed loop
  connected to no plant at all. FIND_SYSTEM_ISLANDS and TRACE_CONNECTIVITY
  follow the chain; this is the question that costs one pass and catches the
  commonest defect.

  **ASKING A CONNECTOR WHETHER IT IS CONNECTED CAN THROW, and that is not
  hypothetical.** A panelboard's connectors include surface ones, and reading
  connection status on those raises rather than returning false - measured on a
  panelboard with six connectors. So only END connectors are asked, which is
  also the only kind the question means: a surface connector has no end to
  leave open. Every read is guarded even so.

  **An element with NO connectors is neither open nor joined, and is counted
  separately.** A duct accessory modelled without connectors cannot answer the
  question at all, and putting it in either list would be an invention. A large
  count there usually means the category is wrong rather than the model.

  **A fitting is included and that is deliberate.** A run is only as connected
  as its fittings, and the elbow nobody joined is exactly what this is looking
  for.

contract:
  needs:
    - name: doc
      type: Document
    - name: categories
      type: IList<BuiltInCategory>
      source: request
    - name: wantOpenEnds
      type: bool
      source: request
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: withoutConnectors
      # Elements that cannot answer the question at all. The purpose notes a
      # large count here usually means the CATEGORY is wrong - evidence about
      # the arrangement, never a finding about the model (D-52).
      role: accounting
      type: int
    - name: findings
      type: IList<string>


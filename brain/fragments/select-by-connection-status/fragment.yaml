compatibility-note: >
  One implementation for every release. `MEPCurve.ConnectorManager`,
  `FamilyInstance.MEPModel.ConnectorManager`, `Connector.ConnectorType` and
  `Connector.IsConnected` are present 2020 through 2027, compiled at both ends.
  `IsConnected` is only read on End connectors and is guarded regardless -
  reading it on a surface connector throws rather than returning false.

# ROUTING - repeated in CONNECT_OPEN_ENDS, TRACE_CONNECTIVITY and
# FIND_SYSTEM_ISLANDS.
#
#   "find the loose ends"            -> here, wantOpenEnds true
#   "which ducts are not joined up"  -> here
#   "join those open ends"           -> CONNECT_OPEN_ENDS - this one only
#                                       reads, and is what to run first
#   "what connects to what"          -> TRACE_CONNECTIVITY - it WALKS the
#                                       chain. This asks each element about
#                                       itself and walks nothing
#   "which bits are orphaned"        -> FIND_SYSTEM_ISLANDS. A run can pass
#                                       this check at every joint and still
#                                       reach no plant - that is what an island
#                                       is, and this cannot see it
#   "are the fixtures plumbed"       -> CHECK_FIXTURE_CONNECTIVITY, which knows
#                                       what services a fixture needs
#   "show me the connectors on these"    -> REPORT_CONNECTORS - the
#                                           inventory per element. This
#                                           one narrows a set to act on
#   "report the connectors"              -> REPORT_CONNECTORS

utterances:
  - find the loose ends
  - which ducts are not joined up
  - show me the open pipe ends
  - select elements with an unconnected end
  - which runs are fully connected

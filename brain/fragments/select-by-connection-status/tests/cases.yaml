positive:
  - given: >
      a duct run of six pieces where one elbow was never joined, ducts and duct
      fittings, wantOpenEnds true
    expect: >
      the elbow and its two neighbours. Click the elbow in Revit - the open
      connector shows as a warning symbol at that end

  - given: the same run with the elbow joined, re-run
    expect: >
      that set empty. Joining the elbow must change the answer, or the check is
      reading something other than the connection

  - given: wantOpenEnds false over the same category
    expect: >
      the fully joined pieces, and the two answers plus withoutConnectors adding
      up to the scanned count

  # D-59, added 2026-09-28 with version 2. NOT RUN.
  - given: >
      Ducts, wantOpenEnds false, includeLinks true, on
      a model with a loaded MEP link
    expect: >
      `elements` unchanged from the host-only run,
      and each link's count in `linkedMatches`

negative:
  - given: a panelboard, or any family with surface connectors, in the category
    expect: >
      no exception, and the element answered or counted as unreadable. THIS IS
      THE FIRST CASE TO RUN. Reading connection status on a surface connector
      RAISES rather than returning false - measured on a panelboard with six
      connectors - so an unguarded sweep dies part way through and reports
      whatever it had reached as if it were the answer

  - given: a category of elements modelled without connectors
    expect: >
      all of them in withoutConnectors and none in either list, with the
      wrong-category sentence shown. Calling them all open would be an invention

  - given: a closed loop of pipe joined at every joint and reaching no plant
    expect: >
      reported as fully connected - which is TRUE and not the whole truth. The
      report has to say this walked nothing, or a clean answer here reads as a
      working system

  - given: an empty category list
    expect: >
      the whole model swept and a very large withoutConnectors count, with the
      sentence saying the category is probably wrong

  # D-59, added 2026-09-28 with version 2. NONE OF THESE HAS BEEN RUN.
  - given: includeLinks ABSENT, on a model that HAS loaded links
    expect: >
      the same answer as version 1's proof, and linksSearched 0 with the first
      line of linkedMatches reading "Host model only - links not read". The
      switch left out must bind false, not refuse - if the run refuses with
      needs_request_values, the add-in in Revit is older than this change

  - given: includeLinks true on a model with NO links, or with every link unloaded
    expect: >
      linksSearched 0 and "Links asked for, NONE loaded - host only". It must
      NOT read like the absent case: one means there was nothing else to read,
      the other means reload them in Manage Links and ask again

  - given: one linked file placed TWICE, with includeLinks true
    expect: >
      linksSearched 1, not 2 - it counts files, not placements

second_route: >
  Revit's own disconnect warnings, and clicking a suspect element to see the
  open-connector symbol at its end - the symbol is the definition this fragment
  is claiming to match

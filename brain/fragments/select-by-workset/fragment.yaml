revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Document.IsWorkshared`,
  `FilteredWorksetCollector`, `WorksetKind.UserWorkset` and `Element.WorksetId`
  are unchanged 2020 through 2027. `ElementMulticategoryFilter` is handed
  BuiltInCategory values directly rather than ElementIds built from them, so
  2024's move to 64-bit ids cannot reach this code.

# ROUTING - repeated in READ_ELEMENT_OWNERSHIP, LIST_WORKSETS and
# SET_ELEMENT_WORKSET.
#
#   "what is on the linked models workset"   -> here
#   "select everything on the mep workset"   -> here, then SET_SELECTION
#   "what worksets does this
#    model have"                     -> LIST_WORKSETS - the names, not the
#                                       contents
#   "who has this checked out"       -> READ_ELEMENT_OWNERSHIP - ownership is
#                                       not the same fact as workset
#   "move these onto the MEP
#    workset"                        -> SET_ELEMENT_WORKSET - this one only
#                                       reads
#   "put everything on level 2 on
#    its own workset"                -> a composition: this filter cannot do
#                                       the level half. FILTER_ELEMENTS_BY_
#                                       CATEGORY takes a level, and a SKILL
#                                       joins the two

utterances:
  - what is on the linked models workset
  - select everything on the mep workset
  - show me the elements in this workset
  - find elements on workset
  - which elements belong to the structural workset

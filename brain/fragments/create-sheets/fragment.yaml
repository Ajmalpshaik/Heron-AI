compatibility-note: >
  One implementation for every release, no version branch. `ViewSheet.Create`,
  `ViewSheet.SheetNumber` and `ViewSheet.Name` are unchanged 2020 to 2027, and
  no units call is made. The title block is found by name among
  `OST_TitleBlocks` element types rather than by id, because a name is what a
  project standard is written in and an id is not portable between models.
  Version 4 (CREATE_SHEETS_FROM_TABLE merged in) - read with tools/api-surface
  --members on 2026-11-21, present with these signatures 2020 through 2027:
  ViewSheet.Create(Document, ElementId), ViewSheet.SheetNumber { get; set; }
  and IsPlaceholder, View.IsTemplate, Element.Name { get; set; },
  Element.GetParameters(string), Element.GetTypeId(), Element.OwnerViewId,
  ElementType.FamilyName, Document.GetElement(ElementId), Document.Regenerate()
  and Document.Title, FilteredElementCollector.FirstElement(),
  Parameter.IsReadOnly, StorageType, Definition, Set(string), Set(int),
  SetValueString(string), AsString(), AsInteger() and AsValueString(), and
  SubTransaction(Document) with Start, Commit, RollBack, HasStarted and
  HasEnded. A tick box is recognised as SET_PARAMETER_VALUES_BY_ID recognises
  one: Definition.GetDataType against SpecTypeId.Boolean.YesNo on 2022 and
  later, Definition.ParameterType == YesNo on 2020 and 2021, both read by
  reflection so one source compiles on every release - ParameterType is gone
  from 2023 and ForgeTypeId begins at 2021. No unit API is called: a number
  goes through SetValueString, Revit's own reading in the project's units. No
  ElementId is built from or read as a number, so 2024's 64-bit ids do not
  reach this code.

# VERSION 2 (2026-11-01) - CREATE_SHEET WAS MERGED INTO THIS CARD on the
# owner's instruction ("now merge the other duplicates also"), and is
# DEPRECATED. The same job - a numbered, named sheet on a title block, the
# number checked before anything is made - and this card already made many and
# read the number and the name back apart. What CREATE_SHEET had and this card
# lacked is here now: the clash check ignores capitals and names the sheet
# holding the number, an empty number is refused, Revit's own words are passed
# on when ViewSheet.Create throws (in notCreated, no longer counted as a taken
# number), and a title block is matched as Family: Type so two families with
# the same type name are told apart.
#
# ONE RULE WAS OPPOSITE, AND THE SAFER ONE IS KEPT (the owner's answer, 2026-11-01:
# in every conflict keep the safer rule). CREATE_SHEET made a sheet with no
# title block whenever none came and flagged it; this card refused. Here a
# sheet with no title block is made ONLY when the caller says none outright,
# flagged noTitleblock; a title block that is not found refuses, as before.
#
# WHERE CREATE_SHEET'S OUTPUTS ARE NOW: created (one id) -> created, a list;
# refused (a sentence) -> notCreated and titleBlockProblem; noTitleblock ->
# noTitleblock. Its sentences moved here.
#
# ROUTING - repeated in FIND_SHEETS and PLACE_VIEW_ON_SHEET.
#
#   "make a new sheet"          -> here
#   "create a sheet"            -> here
#   "list the sheets"           -> FIND_SHEETS - a QUESTION
#   "put this view on a sheet"  -> PLACE_VIEW_ON_SHEET, which needs a sheet to
#                                  exist first and does not make one
#   "renumber the sheets"       -> EDIT_TEXT_VALUES on the number parameter;
#                                  nothing here changes an existing sheet
#   "make a sheet list schedule" -> CREATE_SCHEDULE, listKind sheets - the
#                                  index OF the sheets, including placeholders
#                                  (CREATE_SHEET_LIST until it was merged
#                                  there, 2026-11-01)

# VERSION 3 (2026-11-01) - DUPLICATE_SHEETS WAS MERGED INTO THIS CARD on the
# owner's instruction ("make sure there is no duplicate tools"), and is
# DEPRECATED. The same job - new sheets in the register, every number checked
# BEFORE a sheet exists so no orphan is left under a number Revit picked -
# from source sheets instead of typed numbers. What it had and this card
# lacked is here now: copies of the sheets handed in (`elements`), each on the
# source's OWN title block, numbered source + `numberSuffix`, named
# `namePrefix` + the source's name; a placeholder or a sheet with no title
# block not copied; in-batch clashes caught; `notDuplicated`. NEITHER copies
# the views on a sheet - it never did, on purpose.
#
# THE SAFER RULE IN EACH CONFLICT IS KEPT. That card took an empty suffix and
# reported every copy as a clash; here no suffix refuses the copy job outright
# - and copying runs only when no numbers are given, so a selection can never
# turn "make a new sheet" into copies. That card reported a copy whose number
# did not take as not duplicated and said nothing of the sheet; here that
# sheet is in `created`, `refused` and numberedAs, because it exists. A name
# prefix keeps its trailing space here, where that card trimmed it.
#
# WHERE ITS OUTPUTS ARE NOW: newSheetIds -> created, notDuplicated ->
# notDuplicated, collidedNumbers -> numberTaken. Its sentences moved here.

# VERSION 4 (2026-11-21) - CREATE_SHEETS_FROM_TABLE WAS MERGED INTO THIS CARD
# on the owner's "merge: yes" (issue #1080, 2026-11-21), and is DEPRECATED - the
# merge FRAGMENT-ISSUES rows 5b-1486 and 5b-1875 planned. The same job - new
# numbered, named sheets on a title block, every number checked before a sheet
# exists - from a table of rows instead of typed lists. What it had and this
# card lacked is here now, its code moved whole: the `sheets` table (rows ";",
# cells "|", every %XX decoded), a title block per row, every other column
# filled into the sheet's own parameter or its title block instance's - never
# the title block TYPE's - with the version-safe Yes/No test, the per-row
# SubTransaction, previewOnly, the read-back after one regeneration,
# valuesSet, preview, columnsMatched, columnsUnmatched, columnsNotWritten,
# valuesNotSet and findings, and the 1,000-row ceiling. D-183's four choices
# hold as they did: an empty cell writes nothing, an Excel date arrives as an
# ISO date, a value Revit refuses is listed while its sheet is kept, at most
# 1,000 rows.
#
# THE THREE RULES THE TWO CARDS HELD OPPOSITE, chosen 2026-11-21 on the
# owner's word "remaining all the things you can choose what is the best" and
# recorded as D-193 - in each the table card's, the safer, for BOTH routes:
#   1. a sheet number or name Revit refuses TAKES THAT SHEET BACK, listed in
#      notCreated with Revit's own words. This card kept it (in `refused` when
#      its number did not take, and silently when only its name did not -
#      FRAGMENT-ISSUES row 5b-1893, fixed here);
#   2. the same number twice in one request makes NEITHER, each listed. This
#      card made the first;
#   3. at most 1,000 sheets in one call, typed numbers too.
# The copy job (version 3) keeps its own rules; whether rule 1 reaches it too
# is FRAGMENT-ISSUES row 5b-1935, the owner's. previewOnly is refused with it.
#
# WHERE ITS OUTPUTS ARE NOW: created, numberedAs, namedAs, numberTaken,
# notCreated, titleBlockNotFound, noTitleblock, titleBlockProblem, valuesSet,
# preview, columnsMatched, columnsUnmatched, columnsNotWritten, valuesNotSet
# and findings under the same names. Its `refused` (a SENTENCE - why nothing
# was made) is a line in notCreated here, or titleBlockProblem for a title
# block, and the first of `findings` either way; this card's `refused` stays a
# list of sheet ids. Its sentences moved here.
#
# NOT CARRIED: nothing it did. A table and typed numbers given together
# refuse the call (new - which list is meant is the caller's to say).
#
# ROUTING (2026-11-09, CREATE_SHEETS_FROM_TABLE's rows, moved here with it).
# The cards named were not edited.
#
#   "Sheets from Excel"                               -> here, through the
#   "read the sheet list from a spreadsheet,              sheets-from-excel
#    preview, create"                                     method, which reads
#   "make the sheets from this Excel"                     the file first
#   "import the parameter values from this csv" /     -> SET_PARAMETER_VALUES_BY_ID

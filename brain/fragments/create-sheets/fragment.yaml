id: FRG-SHT-010
semantic-identity: "add new sheets to the drawing register"
kind: action
domain: revit.sheets
capability: CREATE_SHEETS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Creates sheets with the numbers and names given, on a chosen title block.

  **A SHEET NUMBER MUST BE UNIQUE AND REVIT ENFORCES IT AFTER THE SHEET
  EXISTS.** `ViewSheet.Create` makes the sheet with a number Revit picks;
  setting the wanted number is a second step that can be refused. So a clash
  leaves a **real sheet in the register under the wrong number** - and a count
  reports the job as done. This is the same shape as `DUPLICATE_SHEETS`, where
  the fragment being re-authored reported *"Duplicated 0 of 1"* while the sheet
  count went 2 to 3.

  **SO THE NUMBER IS CHECKED BEFORE ANYTHING IS CREATED.** A number already in
  the register is reported in `numberTaken` and no sheet is made for it. That
  removes the failure rather than cleaning up after it, and it means a re-run of
  the same job creates nothing instead of a second set of misnumbered sheets.

  **THE TITLE BLOCK IS A REQUEST INPUT WITH NO DEFAULT.** Revit will happily
  create a sheet with no title block at all, and a drawing register full of
  blank-bordered sheets is discovered at issue. Which title block a project uses
  is a project decision, not something this fragment may guess.

  **IT READS BACK BOTH THE NUMBER AND THE NAME**, because they fail
  independently: the number can be refused for a clash while the name is
  accepted, and the result looks correct in a list that shows only one of them.

  **IT DOES NOT PLACE ANYTHING ON THEM.** `PLACE_VIEWS_ON_SHEET` does that, and
  keeping them apart is what lets a register be built before the drawings exist.

contract:
  needs:
    - name: doc
      type: Document
    - name: numbers
      type: IList<string>
      source: request
    - name: names
      type: IList<string>
      source: request
    - name: titleBlockName
      type: string
      source: request
  provides:
    - name: created
      role: result
      type: IList<ElementId>
    - name: numberedAs
      role: result
      type: IDictionary<ElementId, string>
    - name: namedAs
      role: result
      type: IDictionary<ElementId, string>
    - name: numberTaken
      # Numbers already in the register, checked BEFORE anything is created so
      # no sheet is made for them. Given and unusable, never a sheet it made
      # (D-52).
      role: accounting
      type: IList<string>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>
    - name: titleBlockNotFound
      # That the title block asked for is not loaded. A refusal, never a sheet
      # it made (D-52).
      role: accounting
      type: bool


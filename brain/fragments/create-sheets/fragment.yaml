compatibility-note: >
  One implementation for every release. `ViewSheet.Create`,
  `ViewSheet.SheetNumber` and `ViewSheet.Name` are unchanged 2020 to 2027, and
  no units call is made. The title block is found by name among
  `OST_TitleBlocks` element types rather than by id, because a name is what a
  project standard is written in and an id is not portable between models.

# VERSION 2 (2026-11-01) - CREATE_SHEET WAS MERGED INTO THIS CARD on the
# owner's instruction ("now merge the other duplicates also"), and is
# DEPRECATED. The same job - a numbered, named sheet on a title block, the
# number checked before anything is made - and this card already made many and
# read the number and the name back apart. What CREATE_SHEET had and this card
# lacked is here now: the clash check ignores capitals and names the sheet
# holding the number, an empty number is refused, Revit's own words are passed
# on when ViewSheet.Create throws (in notCreated, no longer counted as a taken
# number), and a title block is matched as Family: Type so two families with
# the same type name are told apart.
#
# ONE RULE WAS OPPOSITE, AND THE SAFER ONE IS KEPT (the owner's answer, 2026-11-01:
# in every conflict keep the safer rule). CREATE_SHEET made a sheet with no
# title block whenever none came and flagged it; this card refused. Here a
# sheet with no title block is made ONLY when the caller says none outright,
# flagged noTitleblock; a title block that is not found refuses, as before.
#
# WHERE CREATE_SHEET'S OUTPUTS ARE NOW: created (one id) -> created, a list;
# refused (a sentence) -> notCreated and titleBlockProblem; noTitleblock ->
# noTitleblock. Its sentences moved here.
#
# ROUTING - repeated in FIND_SHEETS and PLACE_VIEW_ON_SHEET.
#
#   "make a new sheet"          -> here
#   "create a sheet"            -> here
#   "list the sheets"           -> FIND_SHEETS - a QUESTION
#   "put this view on a sheet"  -> PLACE_VIEW_ON_SHEET, which needs a sheet to
#                                  exist first and does not make one
#   "renumber the sheets"       -> EDIT_TEXT_VALUES on the number parameter;
#                                  nothing here changes an existing sheet
#   "make a sheet list schedule" -> CREATE_SCHEDULE, listKind sheets - the
#                                  index OF the sheets, including placeholders
#                                  (CREATE_SHEET_LIST until it was merged
#                                  there, 2026-11-01)

# VERSION 3 (2026-11-01) - DUPLICATE_SHEETS WAS MERGED INTO THIS CARD on the
# owner's instruction ("make sure there is no duplicate tools"), and is
# DEPRECATED. The same job - new sheets in the register, every number checked
# BEFORE a sheet exists so no orphan is left under a number Revit picked -
# from source sheets instead of typed numbers. What it had and this card
# lacked is here now: copies of the sheets handed in (`elements`), each on the
# source's OWN title block, numbered source + `numberSuffix`, named
# `namePrefix` + the source's name; a placeholder or a sheet with no title
# block not copied; in-batch clashes caught; `notDuplicated`. NEITHER copies
# the views on a sheet - it never did, on purpose.
#
# THE SAFER RULE IN EACH CONFLICT IS KEPT. That card took an empty suffix and
# reported every copy as a clash; here no suffix refuses the copy job outright
# - and copying runs only when no numbers are given, so a selection can never
# turn "make a new sheet" into copies. That card reported a copy whose number
# did not take as not duplicated and said nothing of the sheet; here that
# sheet is in `created`, `refused` and numberedAs, because it exists. A name
# prefix keeps its trailing space here, where that card trimmed it.
#
# WHERE ITS OUTPUTS ARE NOW: newSheetIds -> created, notDuplicated ->
# notDuplicated, collidedNumbers -> numberTaken. Its sentences moved here.


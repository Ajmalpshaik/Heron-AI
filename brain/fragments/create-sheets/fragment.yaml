id: FRG-SHT-010
semantic-identity: "add new sheets to the drawing register"
kind: action
domain: revit.sheets
capability: CREATE_SHEETS
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Creates sheets with the numbers and names given, on a chosen title block.

  **A SHEET NUMBER MUST BE UNIQUE AND REVIT ENFORCES IT AFTER THE SHEET
  EXISTS.** `ViewSheet.Create` makes the sheet with a number Revit picks;
  setting the wanted number is a second step that can be refused. So a clash
  leaves a **real sheet in the register under the wrong number** - and a count
  reports the job as done. This is the same shape as `DUPLICATE_SHEETS`, where
  the fragment being re-authored reported *"Duplicated 0 of 1"* while the sheet
  count went 2 to 3.

  **SO THE NUMBER IS CHECKED BEFORE ANYTHING IS CREATED.** A number already in
  the register is reported in `numberTaken` and no sheet is made for it. That
  removes the failure rather than cleaning up after it, and it means a re-run of
  the same job creates nothing instead of a second set of misnumbered sheets.

  **THE TITLE BLOCK IS A REQUEST INPUT WITH NO DEFAULT.** Revit will happily
  create a sheet with no title block at all, and a drawing register full of
  blank-bordered sheets is discovered at issue. Which title block a project uses
  is a project decision, not something this fragment may guess.

  **IT READS BACK BOTH THE NUMBER AND THE NAME**, because they fail
  independently: the number can be refused for a clash while the name is
  accepted, and the result looks correct in a list that shows only one of them.

  **IT DOES NOT PLACE ANYTHING ON THEM.** `PLACE_VIEW_ON_SHEET` does that, and
  keeping them apart is what lets a register be built before the drawings exist.

  **VERSION 2 makes one sheet as well as many.** A number already used is
  refused whatever its capitals, naming the sheet that holds it; an empty
  number is refused; a sheet Revit will not create is said with Revit's own
  words, in `notCreated`. A title block may be named `Family: Type`, and a type
  name two families share is refused rather than guessed. Saying `none` makes
  sheets with no title block, flagged in `noTitleblock`. Version 1's proof no
  longer describes the code and is kept as a record; the card is DRAFT until it
  is proved again.

contract:
  needs:
    - name: doc
      type: Document
    - name: numbers
      type: IList<string>
      source: request
    - name: names
      type: IList<string>
      source: request
    - name: titleBlockName
      # Version 2: the type name, or "Family: Type" when two title block
      # families share a type name - a shared name is refused, never guessed.
      # The word none, said outright, makes sheets with NO title block and sets
      # noTitleblock; a name not found still refuses and creates nothing.
      type: string
      source: request
  provides:
    - name: created
      role: result
      type: IList<ElementId>
    - name: numberedAs
      role: result
      type: IDictionary<ElementId, string>
    - name: namedAs
      role: result
      type: IDictionary<ElementId, string>
    - name: numberTaken
      # Numbers already in the register, checked BEFORE anything is created so
      # no sheet is made for them. Given and unusable, never a sheet it made
      # (D-52).
      role: accounting
      type: IList<string>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>
    - name: titleBlockNotFound
      # That the title block asked for is not loaded - or, version 2, that its
      # type name is in two families and does not say which. A refusal, never
      # a sheet it made (D-52).
      role: accounting
      type: bool
    - name: noTitleblock
      # Version 2, from CREATE_SHEET. True when the caller said none and the
      # sheets were made with no title block. They print bare, so it is said.
      # What it was told, never a sheet it made (D-52).
      role: accounting
      type: bool
    - name: titleBlockProblem
      # Version 2. Why the title block named could not be used - not loaded,
      # or a type name two families share, naming both. Empty when one was
      # found or none was asked for. A refusal (D-52).
      role: accounting
      type: string
    - name: notCreated
      # Version 2, from CREATE_SHEET. One line per number no sheet was made
      # for, and why: blank, already used (naming the sheet that holds it,
      # capitals ignored), or Revit declining ViewSheet.Create in its own
      # words. A failed create is HERE, not in numberTaken - version 1 put it
      # there. The evidence it looked and said no (D-52).
      role: accounting
      type: IList<string>


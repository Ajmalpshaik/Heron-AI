id: FRG-SHT-010
semantic-identity: "add new sheets to the drawing register"
kind: action
domain: revit.sheets
capability: CREATE_SHEETS
# VERSION 5 (2026-11-21, work-note item WN-6, issue #1005): with typed numbers,
# `titleBlockName` placeholder makes PLACEHOLDER sheets
# (ViewSheet.CreatePlaceholder) - a number and a name for the sheet list, no
# title block and no views. Nothing else changes. Still DRAFT: version 4's
# Group OZ and this version's NEEDS-CHECKING Group PE (D-30).
version: 5
source: OFFICIAL
risk: MODIFY

purpose: >
  Creates sheets with the numbers and names given, on a chosen title block.

  **A SHEET NUMBER MUST BE UNIQUE AND REVIT ENFORCES IT AFTER THE SHEET
  EXISTS.** `ViewSheet.Create` makes the sheet with a number Revit picks;
  setting the wanted number is a second step that can be refused. So a clash
  leaves a **real sheet in the register under the wrong number** - and a count
  reports the job as done. This is the same shape as `DUPLICATE_SHEETS`, where
  the fragment being re-authored reported *"Duplicated 0 of 1"* while the sheet
  count went 2 to 3.

  **SO THE NUMBER IS CHECKED BEFORE ANYTHING IS CREATED.** A number already in
  the register is reported in `numberTaken` and no sheet is made for it. That
  removes the failure rather than cleaning up after it, and it means a re-run of
  the same job creates nothing instead of a second set of misnumbered sheets.

  **THE TITLE BLOCK IS A REQUEST INPUT WITH NO DEFAULT.** Revit will happily
  create a sheet with no title block at all, and a drawing register full of
  blank-bordered sheets is discovered at issue. Which title block a project uses
  is a project decision, not something this fragment may guess.

  **IT READS BACK BOTH THE NUMBER AND THE NAME**, because they fail
  independently: the number can be refused for a clash while the name is
  accepted, and the result looks correct in a list that shows only one of them.

  **IT DOES NOT PLACE ANYTHING ON THEM.** `PLACE_VIEW_ON_SHEET` does that, and
  keeping them apart is what lets a register be built before the drawings exist.

  **VERSION 2 makes one sheet as well as many.** A number already used is
  refused whatever its capitals, naming the sheet that holds it; an empty
  number is refused; a sheet Revit will not create is said with Revit's own
  words, in `notCreated`. A title block may be named `Family: Type`, and a type
  name two families share is refused rather than guessed. Saying `none` makes
  sheets with no title block, flagged in `noTitleblock`.

  **VERSION 3 also makes copies of sheets handed in** (DUPLICATE_SHEETS merged
  in): each copy on its source's own title block, numbered as the source plus
  `numberSuffix`, named `namePrefix` plus the source's name, every number
  checked before anything is made. A placeholder or a sheet with no title
  block is not copied. **Neither job copies the views on a sheet** - the new
  sheets are empty; DUPLICATE_VIEWS and PLACE_VIEW_ON_SHEET do that.

  **VERSION 4 also makes new drawings from rows handed in as one value**
  (CREATE_SHEETS_FROM_TABLE merged in) - written by heron_sheet_list from the
  modeller's own file - in one call and one undo. The first row names the
  fields: Sheet Number is required, Sheet Name and Title Block optional, and
  each other field is filled into the new drawing's own parameter of that
  name, or else into its title block instance; never into a title block TYPE
  parameter. An empty field writes nothing, and a value Revit will not take is
  given back while its drawing is kept. For the rows and for numbers typed
  alike: each drawing is made in its own sub-transaction, and one whose number
  or name Revit refuses is taken back and given back with Revit's words; one
  number given twice makes neither; at most 1,000 in one call. previewOnly
  does the whole job and takes it back.

contract:
  needs:
    - name: doc
      type: Document
    - name: numbers
      # The new sheets' numbers. Version 3: optional, and left out it is
      # "none" - then the sheets handed in are copied instead, when a
      # numberSuffix is given. Given, the copy job does not run.
      # Version 4 (D-193): more than 1,000 refuses the call, nothing made; a
      # number given twice, capitals ignored, makes NEITHER sheet. Given with
      # a `sheets` table, nothing is made. A list crosses as one
      # comma-separated value that drops empty entries (RevitFragment.Parts),
      # so a name with a comma in it, or a blank one, belongs in `sheets`.
      type: IList<string>
      source: request
      optional: true
      absent: none
    - name: names
      # The new sheets' names, in the order of `numbers`. Version 3: optional,
      # left out "none" - Revit names them, reported in namedAs.
      type: IList<string>
      source: request
      optional: true
      absent: none
    - name: titleBlockName
      # Version 2: the type name, or "Family: Type" when two title block
      # families share a type name - a shared name is refused, never guessed.
      # The word none, said outright, makes sheets with NO title block and sets
      # noTitleblock; a name not found still refuses and creates nothing.
      # Version 3: optional, and left out it is "from the source sheets" - the
      # copy job's own rule. With numbers given and no title block named,
      # NOTHING is created: the title block still has no default.
      # Version 4: with a `sheets` table, the title block of every row whose
      # Title Block cell is empty; left out, every row must name its own, and
      # one that does not refuses the whole call. Any name not found, in the
      # table or here, refuses the whole call: nothing is made.
      # Version 5: with typed numbers, the word placeholder, said outright,
      # makes placeholder sheets - a number and a name, no title block, no
      # views (ViewSheet.CreatePlaceholder). Not read in a table's Title Block
      # cell, where it is a title block name like any other.
      type: string
      source: request
      optional: true
      absent: from the source sheets
    - name: elements
      # Version 3, from DUPLICATE_SHEETS. The SOURCE sheets to copy - a
      # selection or FIND_SHEETS' answer. Read ONLY when no numbers are given;
      # binds empty when nothing fills it (HeronBindingNote.EmptyWhenAbsent).
      type: IList<Element>
      optional: true
    - name: numberSuffix
      # Version 3. Added to each source's number - "-COPY" makes M-101-COPY.
      # Left out it is "none", and copying is REFUSED: a copy numbered like
      # its source clashes with it, and sheets selected while "make a new
      # sheet" is said must never be copied.
      type: string
      source: request
      optional: true
      absent: none
    - name: namePrefix
      # Version 3. Put before each source's name - "DRAFT " - kept with its
      # space. Left out it is "none": the copy takes the source's name.
      type: string
      source: request
      optional: true
      absent: none
    - name: sheets
      # Version 4, from CREATE_SHEETS_FROM_TABLE. THE TABLE, ONE VALUE. Rows
      # separated by ";", cells by "|"; a ";", "|" or "%" inside a cell
      # written %3B, %7C, %25 (any %XX is decoded, so a double quote may be
      # %22). First row the headers:
      #   Sheet Number|Sheet Name|Title Block|Drawn By|Checked By;M-101|Level 1
      #   Plan||AP|JS;M-102|Level 2 Plan||AP|JS
      # Sheet Number (or Number) is required; Sheet Name (or Name) and Title
      # Block are optional; every other header names a parameter. An empty
      # cell writes nothing - it does not clear a value (D-183). A row's empty
      # Title Block cell takes titleBlockName; a row with neither refuses the
      # whole call - THE TITLE BLOCK HAS NO DEFAULT. heron_sheet_list writes
      # this value from the modeller's spreadsheet. Left out it is "none".
      # Given with `numbers`, NOTHING is made - which list is meant is the
      # caller's to say. Given, `numbers`, `names` and `elements` are not read.
      type: string
      source: request
      optional: true
      absent: none
    - name: previewOnly
      # Version 4, from CREATE_SHEETS_FROM_TABLE. true: a table or typed
      # numbers - every sheet is made in its own sub-transaction and TAKEN
      # BACK after its read-back; nothing is kept, and `preview` lists every
      # one as it would be made or not, with its title block and (a table)
      # the values it would get. Refused with the copy job, which cannot take
      # its copies back one by one: nothing is made. Absent binds false.
      type: bool
      source: request
      optional: true
  provides:
    - name: created
      # The sheets made and kept. Version 4: empty on a preview, and a sheet
      # whose number or name Revit refused is never here - it was taken back.
      role: result
      type: IList<ElementId>
    - name: numberedAs
      role: result
      type: IDictionary<ElementId, string>
    - name: namedAs
      role: result
      type: IDictionary<ElementId, string>
    - name: valuesSet
      # Version 4, from CREATE_SHEETS_FROM_TABLE. A table's parameter values
      # written AND read back as asked after one regeneration (a number counts
      # when Revit took it - its reading is in the project's units). 0 on a
      # preview, and on every other route.
      role: result
      type: int
    - name: preview
      # Version 4, from CREATE_SHEETS_FROM_TABLE. previewOnly only: ONE
      # string, a line per row or number - made or not and why, its title
      # block, and (a table) every value it would get. Empty otherwise.
      role: result
      type: string
    - name: numberTaken
      # Numbers already in the register, checked BEFORE anything is created so
      # no sheet is made for them. Given and unusable, never a sheet it made
      # (D-52). Version 3: in the copy job too - a source's number plus the
      # suffix already used, including by a copy made earlier in the same
      # batch (DUPLICATE_SHEETS' collidedNumbers). Version 4: a table's rows
      # too (placeholders count, capitals ignored). A number given twice in
      # one request is NOT here - it is in notCreated, neither made.
      role: accounting
      type: IList<string>
    - name: notDuplicated
      # Version 3, from DUPLICATE_SHEETS. Sources no copy came back for - not
      # a sheet, a placeholder or a sheet with no title block to copy, a
      # number already used, Revit declining, or a copy whose number did not
      # take (that copy is in `created` and `refused`, with its real number in
      # numberedAs). Each reason is a line in notCreated. Never a sheet it
      # made (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52). Version 4: only the copy job fills
      # it - a copy whose number did not take, which exists. A table's rows
      # and typed numbers take such a sheet back instead (D-193), so it is a
      # line in notCreated. CREATE_SHEETS_FROM_TABLE's own `refused` was a
      # SENTENCE - why nothing was made; that sentence is a line in
      # notCreated here (titleBlockProblem for a title block), and the first
      # of `findings`.
      role: accounting
      type: IList<ElementId>
    - name: titleBlockNotFound
      # That the title block asked for is not loaded - or, version 2, that its
      # type name is in two families and does not say which. A refusal, never
      # a sheet it made (D-52). Version 4: any title block a table names - in
      # titleBlockName or a Title Block cell - and a row to be made with
      # neither; nothing was made.
      role: accounting
      type: bool
    - name: noTitleblock
      # Version 2, from CREATE_SHEET. True when the caller said none and the
      # sheets were made with no title block. They print bare, so it is said.
      # What it was told, never a sheet it made (D-52). Version 4: a table
      # row whose Title Block cell, or titleBlockName, said none.
      role: accounting
      type: bool
    - name: titleBlockProblem
      # Version 2. Why the title block named could not be used - not loaded,
      # or a type name two families share, naming both. Empty when one was
      # found or none was asked for. A refusal (D-52). Version 4, a table:
      # every bad name, and the rows that asked for it.
      role: accounting
      type: string
    - name: notCreated
      # Version 2, from CREATE_SHEET. One line per number no sheet was made
      # for, and why: blank, already used (naming the sheet that holds it,
      # capitals ignored), or Revit declining ViewSheet.Create in its own
      # words. A failed create is HERE, not in numberTaken - version 1 put it
      # there. The evidence it looked and said no (D-52). Version 4 (D-193):
      # also a sheet whose number or name Revit refused, TAKEN BACK and given
      # Revit's words; a number given twice, a line for each entry, neither
      # made; and a refusal of the whole call - more than 1,000, a table that
      # cannot be read safely, a table and numbers both given, previewOnly
      # with the copy job.
      role: accounting
      type: IList<string>
    - name: columnsMatched
      # Version 4, from CREATE_SHEETS_FROM_TABLE. One line per parameter
      # column: where it was written - the sheet's own parameter or the title
      # block instance's - its kind, and on how many sheets. Evidence it
      # looked, never a value written (D-52).
      role: accounting
      type: IList<string>
    - name: columnsUnmatched
      # Version 4, from CREATE_SHEETS_FROM_TABLE. Columns no sheet made has a
      # parameter for - not written. Usually a project parameter not bound to
      # Sheets, or a header worded unlike the parameter. Asked of the
      # modeller, never guessed (D-52).
      role: accounting
      type: IList<string>
    - name: columnsNotWritten
      # Version 4, from CREATE_SHEETS_FROM_TABLE. Columns that name a
      # parameter this card will not write, and why: read-only, on the title
      # block TYPE, two parameters sharing the name, or one holding another
      # element (D-52).
      role: accounting
      type: IList<string>
    - name: valuesNotSet
      # Version 4, from CREATE_SHEETS_FROM_TABLE. One line per cell not
      # written or not read back as asked: the sheet, the column, the value
      # and why - a tick box given a word that is not yes or no, a number
      # Revit would not read. The sheet itself is KEPT (D-183) (D-52).
      role: accounting
      type: IList<string>
    - name: findings
      # Version 4, from CREATE_SHEETS_FROM_TABLE. A table: what was made, or
      # why nothing was, first; then notes - sheets with no title block, a
      # title block found only after a regeneration. Typed numbers: the
      # PREVIEW line on a preview, else empty.
      type: IList<string>


# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: three free sheet numbers and a title block that exists
    expect: >
      three sheets in the Project Browser under exactly those numbers, each
      with the title block drawn on it. Look at one - a sheet with no border is
      the failure this fragment guards against

  # VERSION 6 (2026-11-26, row 5b-1935, issue #1156). The copy job's control
  # for the two negatives below: it holds on version 5 too, and shows the
  # SubTransaction each copy is now made in keeps a good copy.
  - given: >
      VERSION 6, THE COPY JOB. Two sheets with title blocks selected, numbers
      left out, numberSuffix "-RC", namePrefix "COPY "
    expect: >
      created two ids, numberedAs "<original>-RC" for each, namedAs "COPY " +
      each source's name, each copy on its source's title block; notCreated,
      notDuplicated, numberTaken and refused empty; the sheet count up by
      exactly two

negative:
  - given: A NUMBER THAT IS ALREADY IN THE REGISTER
    expect: >
      that number in `numberTaken` and NO SHEET CREATED for it. The check runs
      BEFORE creation, so nothing is left behind - the earlier version of this
      job reported "Duplicated 0 of 1" while the sheet count went 2 to 3 and an
      orphan stayed in the model

  - given: THE SAME JOB RUN TWICE
    expect: >
      the second run creates nothing. Without the pre-check a re-run produces a
      second set of sheets carrying whatever numbers Revit picked

  - given: a title block name that does not exist in the project
    expect: >
      titleBlockNotFound true and NOTHING created. Revit will happily make a
      sheet with no title block, and a register full of blank-bordered sheets is
      discovered at issue

  - given: a number refused for any other reason
    expect: >
      VERSION 4 (D-193 rule 1): NO SHEET for it - the sheet is taken back in
      its own SubTransaction, and a line in notCreated says "Revit refused
      the number, so the sheet was taken back" with Revit's own words;
      `refused` empty. Versions 1 to 3 kept the sheet under the number Revit
      picked and named it in `refused`. NOT KNOWN HOW TO PROVOKE IT with a
      number that is free (the clash is checked before anything is made) -
      recorded so a run that meets one is read correctly

  - given: fewer names than numbers
    expect: >
      the extra sheets created and named by Revit, reported in namedAs. Number
      and name are read back separately because they fail independently

  # VERSION 2 (2026-11-01, CREATE_SHEET merged in). Each of these FAILS on
  # version 1.
  - given: VERSION 2. Number "m-101" when a sheet "M-101" titled "Level 1 Plan" already exists
    expect: >
      no sheet created; "m-101" in numberTaken and a line in notCreated naming
      "Level 1 Plan". Version 1 compared with capitals and made the sheet, and
      Revit then refused the number - an orphan under the number Revit picked

  - given: VERSION 2. An empty number among three, e.g. "M-201", "", "M-203"
    expect: >
      two sheets created; notCreated says entry 2 is blank and that Revit has
      no unnumbered sheets. Version 1 created a sheet for it and left it under
      the number Revit picked, reported in refused

  - given: >
      VERSION 2. Two title block families, each with a type "A1" - load a copy
      of the A1 title block family under another name. titleBlockName "A1"
    expect: >
      titleBlockNotFound true, NOTHING created, and titleBlockProblem naming
      both as Family: Type. Version 1 took whichever came first

  - given: >
      VERSION 2. The same two families, titleBlockName "Family B: A1" (the
      copy's name)
    expect: >
      the sheets created with that family's title block on them - select the
      title block on a sheet and read its family in Properties

  - given: VERSION 2. titleBlockName none
    expect: >
      the sheets created with NO title block, noTitleblock true,
      titleBlockNotFound false. Version 1 looked for a title block called
      "none" and refused

  - given: >
      VERSION 2. ViewSheet.Create throwing. NOT KNOWN HOW TO PROVOKE IT: the
      title block here is always one of the OST_TitleBlocks types, so the throw
      CREATE_SHEET met (a Detail Item type handed in) cannot reach this card.
      Recorded so a run that meets one is read correctly
    expect: >
      the number in notCreated with "Revit said:" and Revit's sentence, and NOT
      in numberTaken. Version 1 put a failed create in numberTaken, sending the
      reader to look for a clash that was not there

  # VERSION 3 (2026-11-01, DUPLICATE_SHEETS merged in). Each FAILS on version
  # 2, which has no copy job and needs numbers.
  - given: >
      VERSION 3. Three sheets selected, numbers left out, numberSuffix
      "-COPY", namePrefix left out
    expect: >
      three new sheets in created, each numbered "<original>-COPY", each on
      its PARENT'S title block (select it on the sheet and read its type),
      each named as its parent, and NO VIEWS on any of them. notDuplicated and
      numberTaken empty

  - given: VERSION 3. The same three, namePrefix "DRAFT "
    expect: every new sheet's NAME is "DRAFT " + the parent's, with the space kept

  - given: >
      VERSION 3. A sheet whose "-COPY" number ALREADY EXISTS - the case
      DUPLICATE_SHEETS was built around
    expect: >
      that number in numberTaken, the source in notDuplicated, a line in
      notCreated naming the sheet that holds it, and THE SHEET COUNT
      UNCHANGED for it - count the sheets in the Project Browser before and
      after. Nothing may be created and left under Revit's own number

  - given: VERSION 3. Two source sheets whose suffixed numbers would be identical
    expect: >
      the first is made, the second's number in numberTaken - a clash between
      two sheets neither of which existed when the batch started

  - given: VERSION 3. A PLACEHOLDER sheet among the sources
    expect: its id in notDuplicated and nothing created for it - it has no title block to copy

  - given: VERSION 3. A floor plan among the sources
    expect: its id in notDuplicated, no exception, the real sheets still copied

  - given: >
      VERSION 3. Sheets selected, numbers AND numberSuffix left out - "make a
      new sheet" said with sheets selected
    expect: >
      NOTHING created; every selected id in notDuplicated and notCreated
      asking for the numbers or a suffix. DUPLICATE_SHEETS took an empty
      suffix and only failed by clashing; a selection must never become copies

  - given: >
      VERSION 3. Numbers "M-301" given, a title block named, and two sheets
      selected
    expect: >
      ONE sheet, M-301, on the title block named - the selection is not read
      and nothing is copied

  - given: VERSION 3. Numbers "M-301" given and no title block named
    expect: >
      NOTHING created, titleBlockNotFound true and titleBlockProblem saying no
      title block was named - the title block still has no default

  # VERSION 4 (2026-11-21, CREATE_SHEETS_FROM_TABLE merged in, D-193). Each
  # FAILS on version 3 - which has no `sheets` or `previewOnly`, makes the
  # first of a number given twice, takes any count of numbers, and keeps a
  # sheet whose name Revit refused. NEEDS-CHECKING Group OZ runs them.
  - given: >
      VERSION 4, D-193 rule 1. numbers "OZ-201,OZ-202,OZ-203", names "HERON
      GOOD 1,HERON BAD:NAME,HERON GOOD 3" (a ":" Revit does not allow in a
      name; "{" if ":" is taken), a title block that exists
    expect: >
      created two ids, OZ-201 and OZ-203; a line in notCreated "OZ-202: Revit
      refused the name "HERON BAD:NAME", so the sheet was taken back. Revit
      said: ..." with Revit's sentence; and NO sheet OZ-202 in the Project
      Browser - not under the number, not under a name Revit chose. Version 3
      kept OZ-202 under Revit's own name and said nothing (row 5b-1893)

  - given: VERSION 4, D-193 rule 2. numbers "OZ-301,oz-301,OZ-302", a title block that exists
    expect: >
      ONE sheet, OZ-302. Two lines in notCreated, "OZ-301: entries 1 and 2 of
      the numbers given both give this number - neither was made" and the
      same for "oz-301"; numberTaken empty. Version 3 made OZ-301 and refused
      oz-301 as already used by it

  - given: >
      VERSION 4, D-193 rule 3. 1,001 numbers, OZ-0001 to OZ-1001 (the group
      file prints the PowerShell that makes them), a title block that exists
    expect: >
      NOTHING created - notCreated one line "1001 sheet numbers were given;
      one call makes at most 1000 sheets. Split the list. Nothing was
      created."; the sheet count unchanged. Version 3 made all 1,001

  - given: >
      VERSION 4. numbers "OZ-401,OZ-402", a title block that exists,
      previewOnly true
    expect: >
      NOTHING kept - created empty, the sheet count unchanged; preview two
      lines, each the number, its name and "on" the title block as Family:
      Type, then "would be made"; findings opening "PREVIEW - nothing was
      kept. 2 of 2 number(s) would be made". Version 3 has no previewOnly and
      makes both

  - given: >
      VERSION 4, THE TABLE. sheets "Sheet Number|Sheet Name|Drawn By|Checked
      By|Discipline;OZ-501|HERON TEST PLAN 1|AP|JS|Mechanical;OZ-502|HERON
      TEST PLAN 2|AP|JS|Mechanical;OZ-503|HERON TEST PLAN 3|AP||Mechanical",
      a title block that exists, on a model with a text project parameter
      "Discipline" bound to Sheets
    expect: >
      three sheets, each on the title block, valuesSet 8 (Checked By is empty
      on OZ-503 and writes nothing - D-183), columnsMatched naming Drawn By,
      Checked By and Discipline as "the sheet's own parameter (text) on 3
      sheet(s)", findings opening "Made 3 of 3 row(s) as sheets and set 8
      value(s)". Read Drawn By and Discipline in each sheet's Properties.
      Version 3 has no `sheets`, so it is refused as nothing to create

  - given: THE TABLE above, titleBlockName "NoSuchTitleBlockAnywhere" - THE TABLE'S D-30 NEGATIVE
    expect: >
      titleBlockNotFound true; titleBlockProblem saying no title block type
      called "NoSuchTitleBlockAnywhere" is loaded, asked by OZ-501, OZ-502,
      OZ-503, and that nothing was made; created empty, valuesSet 0 - the
      sheet count unchanged

  - given: THE TABLE above with titleBlockName left out (it has no Title Block column)
    expect: >
      NOTHING made, titleBlockNotFound true, titleBlockProblem saying no title
      block was named for OZ-501, OZ-502, OZ-503 - the title block has no
      default, in the table as for typed numbers

  - given: VERSION 4. THE TABLE with two rows numbered OZ-601 and oz-601, and one OZ-602
    expect: >
      ONE sheet, OZ-602; a line in notCreated for each of the two rows, each
      naming entries 1 and 2 and "neither was made"

  - given: VERSION 4. THE TABLE with a row whose Sheet Name has a ":" in it
    expect: >
      that row in notCreated "Revit refused it, so this row was taken back -"
      with Revit's own words, NO sheet for it, the other rows made

  - given: VERSION 4. THE TABLE and numbers "OZ-701" both given
    expect: >
      NOTHING created; notCreated "Both a table of sheets (sheets) and typed
      sheet numbers (numbers) were given ... Nothing was created."

  - given: VERSION 4. THE TABLE and names "Typed Name" both given, no numbers
    expect: >
      NOTHING created; notCreated "Both a table of sheets (sheets) and typed
      names (names) were given ... Nothing was created." - the names are not
      silently ignored. The same for numberSuffix or namePrefix beside a table

  - given: >
      VERSION 4. One sheet selected, numbers left out, numberSuffix "-COPY",
      previewOnly true
    expect: >
      NOTHING created; the source in notDuplicated and a line in notCreated
      saying a copy run is not previewed. The same without previewOnly makes
      the copy, exactly as version 3

  - given: >
      VERSION 4, THE TABLE. A column naming a title block TYPE parameter, one
      naming a read-only parameter ("Current Revision"), one misspelt
      ("Discipln") and a Yes/No project parameter bound to Sheets holding
      "Yes", "no" and "maybe" on three rows
    expect: >
      the type column in columnsNotWritten and the type's value in Edit Type
      UNCHANGED; "Current Revision" in columnsNotWritten as read-only;
      "Discipln" in columnsUnmatched, nothing written from it; two sheets
      ticked and unticked as asked and "maybe" in valuesNotSet "a tick box
      takes Yes or No" - that sheet still made (D-183)

  - given: >
      VERSION 5. numbers "PH-101, PH-102", names "Plumbing Ground, Plumbing
      First", titleBlockName placeholder
    expect: >
      two sheets made and read back as PH-101 and PH-102 with their names; each
      is a placeholder (ViewSheet.IsPlaceholder true) with no title block on it;
      findings says they were made as PLACEHOLDER sheets; noTitleblock false

  - given: >
      VERSION 5, NEGATIVE. titleBlockName placeholder with numbers "PH-101",
      where PH-101 is already a placeholder in the register
    expect: >
      nothing made; numberTaken names PH-101 - a placeholder holds its number

  # VERSION 6 (2026-11-26, row 5b-1935 - the owner's "Take the bad copy
  # back"). D-193 rule 1 on the copy job. Each FAILS on version 5, which
  # made its copies in the call's own transaction and kept them.
  - given: >
      VERSION 6, THE COPY JOB, A REFUSED NAME. The same two sheets selected,
      numberSuffix "-RC", namePrefix "BAD:" (a ":" Revit does not allow in a
      sheet name; "{" if ":" is taken)
    expect: >
      NO COPY KEPT - created empty, both sources in notDuplicated, and two
      lines in notCreated "<original>-RC: Revit refused the name "BAD:...", so
      the sheet was taken back. Revit said: ..." with Revit's sentence; refused
      empty; the sheet count UNCHANGED, and no "<original>-RC" in the Project
      Browser under any name. Version 5 kept both copies under the names Revit
      gave them and said nothing

  - given: >
      VERSION 6, THE COPY JOB, A REFUSED NUMBER. The same two sheets
      selected, numberSuffix "-RC:1" (a ":" Revit does not allow in a sheet
      number; "{" if ":" is taken), namePrefix left out
    expect: >
      NO COPY KEPT - created empty, refused EMPTY, both sources in
      notDuplicated, and two lines in notCreated "<original>-RC:1: Revit
      refused the number, so the sheet was taken back. Revit said: ..." (or
      "Revit kept the number as ..."); the sheet count UNCHANGED. Version 5
      kept both copies under the numbers Revit picked, in created and refused.
      RECORD what Revit said: if it takes the ":" after all, the run says
      which character it does refuse, and this case is re-run with that one

second_route:
  - >
    open the Sheets branch of the Project Browser and read the numbers - that
    list is the drawing register, and it is what gets issued
  - >
    version 3: COUNT THE SHEETS before and after a copy run - the rise must
    equal the length of created - and one Ctrl+Z removes every copy
  - >
    version 4: a sheet list schedule (CREATE_SCHEDULE, listKind sheets) with
    Sheet Number, Sheet Name, Drawn By, Checked By and Discipline as fields
    shows every value a table wrote, row by row against the spreadsheet; and
    COUNT THE SHEETS before and after a run with a refused name - the rise
    must equal the length of created, never one more
  - >
    version 6: the same count for a COPY run with a refused name or number -
    the rise equals the length of created, zero when every copy was refused,
    and one Ctrl+Z removes every copy kept

id: FRG-ELE-034
semantic-identity: "make a new material with this colour"
kind: action
domain: revit.elements
capability: CREATE_MATERIAL
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Creates materials with a name, a colour and a transparency. The thing
  REPLACE_MATERIAL needs to exist before it can swap anything onto it, and the
  thing a takeoff counts by.

  **A name already in use is reported, never duplicated.** Revit refuses a
  second material of one name, and a batch that threw on the third of five would
  leave two made and three not, with nothing saying which.

  **It sets the shading colour, and nothing else.** A real material has an
  appearance asset, a physical asset, a cut pattern and a surface pattern, and
  none of those are touched. What comes out is a working material for
  scheduling, colouring and takeoffs - not a rendering-ready one, and saying so
  is better than letting somebody discover it in a render.

  **Transparency is a percentage, 0 to 100**, and is clamped rather than
  refused: Revit rejects anything outside that and a clamp is what the caller
  meant.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: materialNames
      type: IList<string>
      source: request
    - name: colours
      type: IList<Color>
      source: request
    - name: transparencies
      type: IList<int>
      source: request
  provides:
    - name: created
      role: result
      type: IList<ElementId>
    - name: alreadyThere
      # Elements that were ALREADY in the state asked for, so there was
      # nothing to do. The evidence it looked, never a change it made
      # (D-52).
      role: accounting
      type: IList<string>
    - name: findings
      type: IList<string>


compatibility-note: >
  One implementation for every release. `LocationPoint`, `LocationCurve`,
  `Curve.GetEndPoint` and `Element.get_BoundingBox` are present 2020 through
  2027, compiled at both ends. Feet become millimetres by multiplying by 304.8
  as plain arithmetic - no units API, which is what changed shape at 2021.

# ROUTING - repeated in MEASURE_DISTANCE, REPORT_BOUNDING_BOX and
# ADD_SPOT_ELEVATIONS.
#
#   "where exactly is this"          -> here
#   "what are the coordinates"       -> here
#   "where does this duct run from and to" -> here - both ends, because a run
#                                       has no single position
#   "how far apart are these"        -> MEASURE_DISTANCE, which answers with a
#                                       gap rather than two positions
#   "how big is this"                -> REPORT_BOUNDING_BOX - the extents, not
#                                       the position
#   "put the level on the drawing"   -> ADD_SPOT_ELEVATIONS, which annotates
#                                       instead of reporting
#   "unload this link"                   -> UNLOAD_LINKS. A link's position
#                                           is what this reports; unloading
#                                           keeps it and drops the geometry

utterances:
  - where exactly are these
  - what are the coordinates of this
  - where does this duct run from and to
  - report the location of these elements
  - what position is this at

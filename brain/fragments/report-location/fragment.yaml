id: FRG-GEO-025
semantic-identity: "where exactly are these"
kind: action
domain: revit.geometry
capability: REPORT_LOCATION
version: 3
source: OFFICIAL
risk: READ

purpose: >
  Reports where each element actually is, in millimetres - a point for the
  things that have one, both ends for the things that run somewhere, and the
  centre of the bounding box for everything else.

  **AN ELEMENT HAS ONE OF THREE KINDS OF POSITION AND THE REPORT SAYS WHICH.** A
  piece of equipment is at a point. A duct runs from one place to another and
  has no single position at all. A wall assembly, a group, an in-place element
  may have neither. Reporting all three as "the location" and printing one set
  of coordinates makes the second kind a lie - the midpoint of a thirty-metre
  run is a place the duct passes through, not where it is.

  **The bounding-box centre is named as a fallback every time it is used**, and
  never dressed up as a location. It is the centre of a box around the thing,
  which for anything L-shaped or sloped is a point in fresh air.

  **Coordinates are Revit's internal ones, converted to millimetres.** They are
  measured from the project's internal origin, which is not necessarily the
  survey point or the project base point - so these numbers are for comparing
  elements with each other, and a coordinate to hand to a surveyor is a
  different question.

  **A POINT-PLACED ELEMENT ALSO REPORTS WHICH WAY IT IS TURNED (version 2).**
  Its rotation in degrees, and the facing direction of a family instance.
  Two units at the same point facing opposite ways are not the same
  placement, and copying a layout from one room to the next needs both
  halves. Measured 2026-09-28 on "heron ai bulding": an FCU the modeller had
  turned by hand read "turned 180 degrees", and one left alone read 0. This
  is version 2; version 1's proof no longer describes the code, and the
  fragment is DRAFT until it is proved again.

  **SHARED COORDINATES, TRUE NORTH AND THE TWO SITE POINTS (version 3).**
  Version 2's paragraph above calling a surveyor's coordinate "a different
  question" is kept as the record of what it did; it is no longer the
  answer. The internal origin stays the DEFAULT, and every reply says
  which coordinates it gives. With `sharedCoordinates` set, every position
  is ALSO given as east / north / elevation in the model's shared
  coordinates, through the active project location, and a facing direction
  in true north beside project north. Which way the location's transform
  runs is not assumed: it is tried both ways against the project base point
  and the survey point, whose own internal and shared positions Revit
  reports, and used only if one direction reproduces both - otherwise the
  reply says shared coordinates could not be given, and why. Every reply
  now also names the angle from project north to true north, where the
  project base point and the survey point are (internal and shared), and
  how far the farthest reported position is from the internal origin, in
  metres. That distance is a number, not a verdict: it is flagged only
  beyond the 20 miles (about 32 km) Revit's own help gives as the limit for
  geometry from the internal origin. A facing direction without the switch
  is said to be in project north, which v2 printed without saying. This is
  version 3; version 2 was never proved, version 1's proof does not
  describe this code, and the fragment is DRAFT until it is proved again.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: sharedCoordinates
      # Version 3. ABSENT MEANS INTERNAL ONLY - what versions 1 and 2 did, and
      # what the reply says it gave. Set, each position is given in shared
      # coordinates as well. `optional: true` on a bool is what lets it be
      # left out: the add-in binds it false (HeronBindingNote.AbsentValue,
      # FRAGMENT-ISSUES row 5b-252). A string choice of internal / shared /
      # both would be refused whenever it was left out (row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: locations
      role: result
      type: IList<string>
    - name: withoutLocation
      # Elements with none of the three kinds of position. A count of what
      # it was GIVEN and could not report on (D-52).
      role: accounting
      type: int
    - name: findings
      type: IList<string>


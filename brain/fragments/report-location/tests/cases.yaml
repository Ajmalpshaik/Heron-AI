positive:
  - given: a piece of equipment placed at a point
    expect: >
      one set of coordinates, reported as AT. Check it against the element's own
      Properties in Revit

  - given: a duct running between two places
    expect: >
      BOTH ends reported, and the word RUNS. Not a midpoint - a run has no
      single position

  - given: a mixed set of equipment, ducts and an in-place element
    expect: the three kinds counted separately in the summary

  # Version 3, added 2026-10-04. NONE OF THE VERSION 3 CASES HAS BEEN RUN.
  - given: >
      the same equipment and one duct, sharedCoordinates true, on a model whose
      survey point is moved and turned away from the internal origin
    expect: >
      each position given twice - internal millimetres, then "shared E, N,
      elev" - and the shared pair for one element matching what a Spot
      Coordinate placed on it in Revit reads (set to Survey Point). Facing
      given in project north AND true north. The site lines name the angle to
      true north, and the base point and survey point, internal and shared,
      matching Manage > Coordinates > Report Shared Coordinates

  - given: the same selection with sharedCoordinates left out
    expect: >
      the positions exactly as version 2 gave them, the reply saying they are
      from the INTERNAL origin and that facing is in project north, and the
      site lines still present

  # Version 4, added 2026-10-06.
  - given: NOTHING selected, on a scratch project (the add-in from version 4's change)
    expect: >
      `locations` empty, `findings` saying no element was selected, and
      `site` naming the project location, place name, latitude and
      longitude, time zone, daylight saving, weather station and True North
      East or West of project north - what Manage > Location shows

  - given: >
      nothing selected, with SET_PROJECT_LOCATION as a rolled-back setup
      writing city=Doha, Qatar; true north=30 East
    expect: >
      `site` reading Doha, Qatar, about 25.3 N 51.5 E, UTC+03:00, and "true
      north 30 East of project north", with the angle Revit stores beside it

negative:
  # Version 4. TRACKING (D-53): the site cannot come back empty, so it must
  # follow the model when the model is changed under it.
  - given: >
      the same setup writing a different city and true north=12 West, then
      the same run with no setup
    expect: >
      `site` following each exactly - the second city, "12 West", then the
      template's own site again. A reader repeating a remembered site, or the
      template's, could not follow all three

  - given: nothing selected, on an add-in OLDER than version 4's change
    expect: >
      refused as before, "elements was never supplied" - never an empty
      answer dressed as a site
  - given: a thirty-metre duct reported as a single coordinate
    expect: >
      that NOT happening. THIS IS THE FIRST CASE TO RUN. The midpoint of a long
      run is a plausible set of numbers naming a place the duct merely passes
      through, and nothing about the answer would say so

  - given: an L-shaped element with no location of its own
    expect: >
      the bounding-box centre NAMED as a fallback. That point is outside the
      element, and reporting it as "the location" is a wrong answer with three
      decimal places on it

  - given: coordinates taken to be survey coordinates
    expect: >
      the report having said they are from the internal origin. Handing these
      to a surveyor without that sentence is how a building gets set out in the
      wrong place

  - given: an element with neither a location nor a bounding box
    expect: counted and named, not silently absent

  # Version 3.
  - given: >
      sharedCoordinates true on a model whose survey point sits ON the internal
      origin, unturned (a fresh model from the default template)
    expect: >
      the shared numbers EQUAL to the internal ones, and the angle to true
      north 0 - NOT shifted by the other model's offset or by an assumed one.
      This is what makes the moved model's different numbers mean something

  - given: >
      the same selection on the moved model, sharedCoordinates true, compared
      element by element with the same run with it left out
    expect: >
      the internal numbers identical in both runs - asking for shared
      coordinates must not move the internal ones

  - given: a selection nowhere near 20 miles from the internal origin
    expect: >
      the farthest distance given in metres and NO warning beside it - the
      only limit named is Revit's own, and nothing nearer is called far

second_route:
  - >
    Revit's own Properties palette for a point-based element, and the tape measure
    from the project base point for a coordinate that has to mean something
    outside the model
  - >
    Version 3: a Spot Coordinate on the same element, set to report from the
    Survey Point, and Manage > Coordinates > Report Shared Coordinates on it -
    Revit's own two routes to the shared numbers

compatibility-note: >
  One implementation for every release. `Workset.Create`,
  `FilteredWorksetCollector`, `WorksetKind.UserWorkset` and
  `Document.IsWorkshared` are present 2020 through 2027 - read off the reference
  assemblies at both ends rather than remembered.

# ROUTING - repeated in LIST_WORKSETS and SET_ELEMENT_WORKSET.
#
#   "add a new workset"              -> here
#   "make a workset for the ducts"   -> here, then SET_ELEMENT_WORKSET to put
#                                       them on it
#   "what worksets are there"        -> LIST_WORKSETS - a READ, and it must not
#                                       answer a request to make one
#   "put these on the MEP workset"   -> SET_ELEMENT_WORKSET - the workset
#                                       already exists
#   "who owns this element"          -> READ_ELEMENT_OWNERSHIP

#   "rename this workset"                -> RENAME_WORKSET
utterances:
  - add a new workset
  - create a workset
  - make a workset for the ducts
  - set up the worksets for this model
  - i need another workset

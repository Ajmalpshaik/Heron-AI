id: FRG-DOC-012
semantic-identity: "add a new workset to this model"
kind: action
domain: revit.document
capability: CREATE_WORKSET
version: 1
source: OFFICIAL
risk: ADMIN

purpose: >
  Creates user worksets on a workshared model - the thing SET_ELEMENT_WORKSET
  needs to exist before it can put anything on one.

  **ADMIN risk, not MODIFY, and the reason is worth stating.** A workset is
  project structure that everybody on the job sees and works inside. It is
  named in the client's BIM execution plan, it decides what people can check
  out, and a stray one called "New Workset" is visible to the whole team until
  somebody notices.

  **A workset is not an element**, and this fragment is the reason to say so:
  it has no ElementId, so nothing downstream can be handed "the worksets that
  were made". What comes back is the names and whether each was created or
  already there.

  **A name that already exists is reported, never duplicated.** Revit refuses a
  duplicate workset name, and a batch that threw on the third of five would
  leave two made and three not, with nothing saying which.

  **On a model that is not workshared it does nothing and says so.** That is
  the common case for a small job, and enabling worksharing is a decision with
  consequences - a central file, local copies, a different way of working - so
  it is never done as a side effect of asking for a workset.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: worksetNames
      type: IList<string>
      source: request
  provides:
    - name: createdNames
      role: result
      type: IList<string>
    - name: alreadyThere
      # Elements that were ALREADY in the state asked for, so there was
      # nothing to do. The evidence it looked, never a change it made
      # (D-52).
      role: accounting
      type: IList<string>
    - name: findings
      type: IList<string>


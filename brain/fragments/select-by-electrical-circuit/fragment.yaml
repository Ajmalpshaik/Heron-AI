heron-step: 17
heron-status: DRAFT
heron-since: 0.1.0
heron-layer: brain

id: FRG-MEP-032
semantic-identity: "everything wired onto one circuit, or onto every circuit of a kind"
kind: filter
domain: revit.mep
capability: SELECT_BY_ELECTRICAL_CIRCUIT
version: 3
source: OFFICIAL
risk: READ

purpose: >
  Gathers the elements on electrical circuits, matched by the circuit's kind -
  power, lighting, data - or by its name, or both. With the kind "none" it
  gathers the opposite: the devices and fixtures with an electrical connector
  that no circuit carries (version 3).

  **This is a separate fragment from SELECT_BY_MEP_SYSTEM on purpose.** A duct
  or pipe system type is a document element with a name a project can change; an
  electrical circuit's type is a fixed enumeration in the API. They look like
  the same question in a modeller's words and they are read in genuinely
  different ways, so folding them together would mean one of the two reading
  through a mechanism that does not exist for it.

  **A CIRCUIT'S ELEMENTS ARE ITS LOADS, AND THE PANEL IS NOT AMONG THEM.** This
  was measured: a circuit plainly involving a receptacle and a panelboard
  reported ONE element. That is Revit being correct and easy to misread -
  everything downstream of the panel is on the circuit, the panel FEEDS it. So
  the panels are reported separately rather than left as an apparent omission,
  because "1 element on a circuit between two pieces of equipment" reads as a
  broken filter.

  **Kind and name both narrow, and asking for neither is refused.** Every
  circuit in a model is a legitimate answer to no filter at all, and it is
  almost never the question - a refusal costs one more sentence and saves
  reading a list of everything.

  **The kind is matched as text against the enumeration's own name**, so
  "power" finds `PowerCircuit`. That is what a modeller types, and the
  alternative is asking them to know the API's spelling.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as
  version 1 did. With it set, every loaded link's circuits are matched the
  same way, and `linkedMatches` gives each link's loads, circuits and the
  panels that feed them - the electrical model is often a link in the
  mechanical one. `linksSearched` says how many links were read: set and 0
  means "you asked, and none are loaded". **NOTHING FROM A LINK IS EVER
  SELECTED OR CARRIED** - `elements` and `panels` stay this model's own;
  the chain revives ids against this model, and a linked id that happens
  to be in use here binds an unrelated element (FRAGMENT-ISSUES row 75).
  Only model elements are read from a link, never its views or sheets.
  Links nested inside a link are not read, and are counted in the answer.
  This is version 2, and DRAFT until proved.

# "none" SELECTS WHAT NO CIRCUIT CARRIES (version 3) - a comment, not
# `purpose`, because `purpose` is searched, and this paragraph there took
# "circuit these sockets" - a claimed command - from CREATE_ELECTRICAL_CIRCUIT
# (measured 2026-10-14). "put these lights on a circuit" still tied here once
# "which lights are not on a circuit" was declared below, so it is declared on
# CREATE_ELECTRICAL_CIRCUIT (row 5b-478). Every circuit's own loads
# are gathered first, and each element with an electrical connector that is
# among none of them is selected, counted by category. Electrical equipment
# is counted apart and not selected: a panel feeds circuits, and one with no
# supply of its own is often the main board, not a fault. With links, each
# link's count is given and nothing from it is selected.
contract:
  needs:
    - name: doc
      type: Document
    - name: circuitKind
      # power, lighting, data and the rest, matched as text against the
      # enumeration's name - or "none" (or "unassigned"), version 3: what no
      # circuit carries.
      type: string
      source: request
    - name: circuitName
      type: string
      source: request
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: panels
      # The panels the circuits feed from, REPORTED SEPARATELY RATHER THAN
      # LEFT AS AN APPARENT OMISSION - a circuit's elements are its loads and
      # the panel is not among them, so "1 element on a circuit between two
      # pieces of equipment" would read as a broken filter.
      role: result
      type: IList<string>
    - name: findings
      type: IList<string>
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then the links' own lines. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75).
      role: accounting
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `ElectricalSystem`, its `SystemType`,
  `Elements` and `PanelName` are present 2020 through 2027, compiled at both
  ends. The circuit kind is compared as text against the enumeration's own
  name, so a release adding a kind is matched rather than needing a new case.
  Version 3's "none" reads circuit membership from each circuit's own
  `Elements`, never `MEPModel.ElectricalSystems` (2020-2021, obsolete in 2021)
  or `GetElectricalSystems()` (2021 on), neither of which compiles on all
  eight - read with tools/api-surface on 2026-10-14. `MEPModel.ConnectorManager`,
  `Connector.Domain` and `Domain.DomainElectrical` are present 2020 to 2027.

# ROUTING - repeated in SELECT_BY_MEP_SYSTEM, REPORT_CONNECTOR_LOADS and
# CREATE_ELECTRICAL_RUN.
#
#   "what is on this circuit"        -> here
#   "select all the lighting circuits" -> here, matching the kind
#   "what is wired to panel A"       -> here, matching the name - and read the
#                                       panels list, because the panel itself
#                                       is never among the elements
#   "all the supply air"             -> SELECT_BY_MEP_SYSTEM. A duct system
#                                       type is a document element; a circuit
#                                       type is a fixed enumeration, and they
#                                       are read differently
#   "how much load is on it"         -> REPORT_CONNECTOR_LOADS - the numbers,
#                                       once the elements are chosen
#   "draw the containment"           -> CREATE_ELECTRICAL_RUN. Tray and conduit
#                                       are the physical route; a circuit is
#                                       the electrical one, and a model can
#                                       have either without the other

utterances:
  - what is on this circuit
  - select all the lighting circuits
  - what is wired to panel A
  - find elements on a power circuit
  - show me everything on this electrical circuit
  # Version 3, 2026-10-14 (FRAGMENT-ISSUES row 5b-478): "which lights are not
  # on a circuit" reached CREATE_ELECTRICAL_CIRCUIT, a write, on the trained
  # model; nothing found what no circuit carries.
  # Declared, not ranked: with "none" built it still ranked to the write.
  - which lights are not on a circuit

id: FRG-QA-018
semantic-identity: "can these valves and dampers actually be reached and operated"
kind: filter
domain: revit.qa
capability: CHECK_VALVE_ACCESSIBILITY
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Checks that valves, dampers and other in-line accessories can actually be
  reached and turned - room round the handle, an access panel where one is
  needed, and within reach from the floor. The commissioning question, asked
  while it is still cheap to move things. Read-only.

  **IT ASKS THREE QUESTIONS AND ANSWERS EACH SEPARATELY, BECAUSE EACH HAS A
  DIFFERENT FIX.** *Room* - something modelled inside the operating envelope,
  fixed by moving the obstruction. *Above a ceiling* - fixed with an access
  panel, which is a drawing item and the thing most often forgotten. *Height* -
  fixed with a platform, a chain wheel, or relocating. A valve can pass one and
  fail another, so all three are reported per valve rather than one pass or fail
  that hides which problem it is.

  **ABOVE A CEILING IS NOT A FAULT, AND THIS DOES NOT PRETEND IT IS.** Most
  valves live in the ceiling void. The finding is that each one NEEDS AN ACCESS
  PANEL, and the list is what goes to the architect. A check that cries wolf
  about every valve in the building gets switched off by lunchtime.

  **THIS IS NOT CHECK_EQUIPMENT_CLEARANCE WITH SMALLER NUMBERS.** That builds a
  directional zone from a family's facing direction, which is right for plant
  and meaningless for a valve in a pipe. This asks the two questions plant does
  not have - is there a ceiling over it, and can a person reach it.

  **THE OPERATING ENVELOPE IS A PLAIN BOX, AND THAT IS STATED RATHER THAN
  DRESSED UP.** It is not a swept volume of a hand and a lever. It is an
  indication, and the figure should be the space a fitter actually needs -
  roughly the lever length plus a fist.

  **CEILINGS AND STRUCTURE IN LINKS ARE NOT SEEN UNLESS ASKED FOR.** If the architecture is
  linked, the ceiling question returns nothing and the room question misses the
  walls. That is reported on the summary line, because it looks exactly like a
  clean result.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, the ROOM and CEILING questions are asked of
  every loaded link too - the operating envelope carried into each
  placement and tested against the link's elements (rooms, spaces and areas
  are not obstructions), and the upward ray cast again with Revit's own
  FindReferencesInRevitLinks - and each accessory the links answer for gets
  a line in `linkedMatches` naming the linked obstruction or ceiling with
  its type, id IN THE LINK and Fire Rating. That is the access-panel list
  the architect actually needs, since the ceilings are theirs. **The ray
  sees a link only where the 3D view shows it.** `linksSearched` says how
  many links are loaded: set and 0 means "you asked, and none are loaded".
  **NOTHING FROM A LINK IS CARRIED** - `obstructed`, `needAccessPanel` and
  `outOfReach` stay this model's answer (FRAGMENT-ISSUES row 75). Only
  model elements are read from a link, never its views or sheets. Links
  nested inside a link are not read, and are counted in the answer. This
  is version 2; version 1's proof no longer describes the code, and the
  fragment is DRAFT until it is proved again.

# A NAME TWO PARAMETERS SHARE IS NEVER READ: a linked element whose Fire Rating
# two parameters carry - a shared or project "Fire Rating" bound beside the
# built-in one, on the element or on the type the lookup falls through to -
# reads "Fire Rating NOT READ - N parameters share that name" in
# `linkedMatches`, never either value (D-54 s3, FRAGMENT-ISSUES 5b-203; added
# 2026-10-09). Written here and not in `purpose`, as on check-sleeve-size's
# card: the purpose is embedded for routing, and on that card's change a
# purpose sentence about this moved other cards' utterances in check-routing,
# measured against d9b27f03 (row 5b-203's 2026-10-09 note). Not measured for
# this card.
contract:
  needs:
    - name: doc
      type: Document
    - name: accessories
      type: IList<Element>
    - name: envelope
      type: double
      source: request
    - name: maxReachHeight
      type: double
      source: request
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: findings
      type: IList<string>
    - name: obstructed
      role: result
      type: IList<ElementId>
    - name: needAccessPanel
      role: result
      type: IList<ElementId>
    - name: outOfReach
      role: result
      type: IList<ElementId>
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then the links' own lines. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75). Since 2026-10-09 a Fire
      # Rating two parameters share reads NOT READ there, never either
      # value (D-54 s3, FRAGMENT-ISSUES 5b-203).
      role: accounting
      type: IList<string>


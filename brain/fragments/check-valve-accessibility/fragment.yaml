compatibility-note: >
  One implementation for every release. `ReferenceIntersector`, `View3D`,
  `ElementIntersectsSolidFilter` and
  `GeometryCreationUtilities.CreateExtrusionGeometry` are unchanged 2020 through
  2027 - read off the reference assemblies at both ends. `envelope` and
  `maxReachHeight` arrive in millimetres and are divided by 304.8 in the code
  (D-71) - no units API is touched. (This note said they "arrive in internal
  FEET" until 2026-09-24, while the code and its own proof - 1 and 100000 in,
  0.0033 and 328.08 feet used - said millimetres.) The height is measured
  above the accessory's own level using `ProjectElevation`, never `Elevation`:
  a level has two heights and only one is in the same space as a point in the
  model.

# ROUTING - repeated in CHECK_EQUIPMENT_CLEARANCE and CHECK_OBSTRUCTIONS.
#
#   "can we reach the valve to operate it" -> here
#   "are the dampers accessible"         -> here
#   "which valves need an access panel"  -> here
#   "is there enough space in front of the panel to open the door" ->
#                                        CHECK_EQUIPMENT_CLEARANCE - a
#                                        DIRECTIONAL zone off a family's facing
#                                        direction, which plant has and a valve
#                                        in a pipe does not
#   "is anything above this point"       -> CHECK_OBSTRUCTIONS - one ray, one
#                                        point, no ceiling or reach question
#   "add a valve to the pipe"            -> PLACE_ACCESSORY_ON_RUN. This one
#                                           asks whether an existing one can
#                                           be reached

utterances:
  - can we reach the valve to operate it
  - are the dampers accessible
  - which valves need an access panel
  - check the valves can be operated
  - are the valves too high to reach

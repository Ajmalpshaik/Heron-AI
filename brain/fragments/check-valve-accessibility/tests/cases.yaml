positive:
  - given: a valve in a ceiling void, clear all round, 2200 mm above the level
    expect: >
      ROOM clear, CEILING needing a panel, HEIGHT reachable - all three on one
      row. CHECKED against a section, because the value here is that one valve
      can pass two questions and fail the third

  - given: a valve at 3400 mm with maxReachHeight 2000 mm
    expect: OUT OF REACH, with the height and the level named

  - given: a damper with a cable tray running 100 mm from its handle
    expect: ROOM BLOCKED, naming the tray

  # D-59, added 2026-09-28 with version 2. NOT RUN.
  - given: >
      valves in this MEP model above a ceiling that is only in the
      architectural link, envelope 300, includeLinks true
    expect: >
      `needAccessPanel` unchanged from the host-only run; each valve's line
      in `linkedMatches` reads "CEILING: N mm above it ... NEEDS AN ACCESS
      PANEL" and names the linked ceiling - checked with one in a section

negative:
  - given: a valve sitting in its own pipe, nothing else near it
    expect: >
      ROOM clear. THIS IS THE FIRST CASE TO RUN. The pipe the valve sits in
      necessarily occupies the space at its connectors, and a version that counts
      it reports every valve in the building as blocked - which is how a check
      gets ignored

  - given: a model where the ceilings are all in a LINK
    expect: >
      the summary saying so, and the no-ceilings-in-host warning. Every valve
      will read as not needing a panel, and that is indistinguishable from a
      building with no ceilings

  - given: a model with no 3D view at all
    expect: >
      the ceiling question reported as NOT ASKED, per valve and on the summary.
      A ray cast needs a real 3D view, and returning zero findings instead would
      read as every valve being in the open

  - given: a valve with no level associated
    expect: HEIGHT not measured, said as such, and the other two questions still answered

  - given: an accessory with no readable geometry
    expect: named and skipped, and the rest of the list completing

  # D-59, added 2026-09-28 with version 2. NONE OF THESE HAS BEEN RUN.
  - given: includeLinks ABSENT, on a model that HAS loaded links
    expect: >
      the same answer as version 1, and linksSearched 0 with the first
      line of linkedMatches reading "Host model only - links not read". The
      switch left out must bind false, not refuse - if the run refuses with
      needs_request_values, the add-in in Revit is older than this change

  - given: includeLinks true on a model with NO links, or with every link unloaded
    expect: >
      linksSearched 0 and "Links asked for, NONE loaded - host only". It must
      NOT read like the absent case: one means there was nothing else to read,
      the other means reload them in Manage Links and ask again

  - given: one linked file placed TWICE, with includeLinks true
    expect: >
      linksSearched 1, not 2 - it counts files, not placements

  - given: a valve whose envelope overlaps only a linked ROOM, includeLinks true
    expect: >
      no ROOM line for it from the link - a room is space, not an obstruction

second_route:
  - Cut a section at one valve and measure to the ceiling and the floor by hand

compatibility-note: >
  AreaReinforcement.Create(Document, Element, XYZ, ElementId, ElementId,
  ElementId) - the host-boundary form - GetRebarInSystemIds,
  AreaReinforcementType.CreateDefaultAreaReinforcementType and every
  REBAR_SYSTEM_* parameter used here, the _GENERIC ones included, are one
  signature and one value on every release 2020-2027 (read off the shipped
  assemblies 2026-10-19). BarDiameter on 2020-2021, BarNominalDiameter from
  2022, for matching a diameter.

# ROUTING - the same rows are in every rebar card.
#
#   "T12 at 200 both ways in this slab"         -> here
#   "reinforce the raft top and bottom"         -> here
#   "T10 at 150 both faces of these walls"      -> here
#   "lay a mesh sheet in this slab"             -> PLACE_FABRIC_REINFORCEMENT
#   "bars along this slab edge"                 -> PLACE_PATH_REINFORCEMENT
#   "bottom mesh in these pad footings"         -> PLACE_FOOTING_REBAR
utterances:
  - put T12 at 200 both ways top and bottom in this slab
  - reinforce these walls with T10 at 150 each face
  - add area reinforcement to the raft
  - place slab rebar bottom both ways

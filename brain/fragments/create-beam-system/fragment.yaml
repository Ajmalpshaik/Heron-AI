id: FRG-ELE-088
semantic-identity: "fill this bay with a beam system at this spacing"
kind: action
domain: revit.elements
capability: CREATE_BEAM_SYSTEM
version: 1
source: OFFICIAL
risk: MODIFY

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# The bay's corners in millimetres ("x,y; x,y; ..."), closed automatically;
# beams at a fixed spacing centred in the bay, parallel to the edge numbered
# directionEdge (0 is first corner to second). Revit lays the beams; the count
# is read back off the system.
#
# PLACE_STRUCTURAL_FAMILY places single structural members; this lays a whole
# bay.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Creates a beam system filling one bay - the bay's corners in millimetres,
  beams of one type at a fixed spacing, parallel to a chosen edge - on a
  level.

contract:
  needs:
    - name: doc
      type: Document
    # "x,y; x,y; x,y; x,y" in millimetres.
    - name: boundaryMm
      type: string
      source: request
    - name: level
      type: Level
      source: request
    # A structural framing type, "Family: Type".
    - name: beamType
      type: FamilySymbol
      source: request
    - name: spacingMm
      type: double
      source: request
    # Which edge the beams run along; 0 is the first corner to the second.
    - name: directionEdge
      type: int
      source: request
  provides:
    - name: beamSystem
      role: result
      type: BeamSystem
    - name: beamCount
      # Beams Revit laid, read off the system.
      role: result
      type: int
    - name: refused
      # Why NOTHING WAS MADE, as one sentence; null otherwise (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>

proof:
  date: '2026-10-18'
  by: Ajmal PS
  model: Project1 (3,047 elements), Revit 2020, session 2648
  positive_case: run as it would normally be run - run inside a transaction, and Revit reported
    the transaction group ROLLED BACK afterwards. returned MmPerFoot 304.8, beamCount 3, beamSystem
    BeamSystem, corners 4 item(s) [(0.000000000, 0.000000000, 13.123359580), (32.808398950,
    0.000000000, 13.123359580), (32.808398950, 19.685039370, 13.123359580), ...], culture
    CultureInfo, directionEdge 0, findings 1 item(s) [Made a beam system of 3 "UB305x165x40"
    beam(s) at 1500 mm on...], numberStyle NumberStyles, refused (null), spacingMm 1500. inputs
    came boundaryMm as given; level as given; beamType as given; spacingMm as given; directionEdge
    as given. on Project1
  negative_case: 'run with beamType=UB-Universal Beams: UB305x165x40, boundaryMm=0,0; 10000,0,
    categoryName=Text Notes, directionEdge=0, inViewOnly=FloorPlan: Level 1, level=Level 2,
    spacingMm=1500 instead - chosen because it should not contain what this fragment reports
    - run inside a transaction, and Revit reported the transaction group ROLLED BACK afterwards.
    returned MmPerFoot 304.8, beamCount 0, beamSystem (null), corners 2 item(s) [(0.000000000,
    0.000000000, 13.123359580), (32.808398950, 0.000000000, 13.123359580)], culture CultureInfo,
    directionEdge 0, findings 1 item(s) [A bay needs at least three corners. NOTHING WAS MADE.],
    numberStyle NumberStyles, refused A bay needs at least three corners. NOTHING WAS MADE.,
    spacingMm 1500. inputs came boundaryMm as given; level as given; beamType as given; spacingMm
    as given; directionEdge as given. on Project1'
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: a5a6e953d5a162c7

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. BeamSystem.Create(Document,
  IList<Curve>, Level, int, bool), BeamType, LayoutRule, GetBeamIds and
  LayoutRuleFixedDistance(double, BeamSystemJustifyType) are present 2020
  through 2027 - read off RevitAPI.xml in the Nice3point reference packages for
  all eight releases on 2026-10-12.

# ROUTING - the same rows are in the fragments named here.
#
#   "fill this bay with joists at 600"        -> here
#   "place a beam between these columns"      -> PLACE_STRUCTURAL_FAMILY

utterances:
  - fill this bay with a beam system at 1200 mm
  - lay joists across this bay at 600 centres
  - create a beam system between these grid lines
  - put secondary beams in this bay

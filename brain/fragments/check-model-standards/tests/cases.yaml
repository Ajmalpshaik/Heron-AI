positive:
  - given: a view pattern of "MEP-*" and twelve views called "Copy of Copy of Level 1"
    expect: >
      all twelve reported, each named, with the pattern quoted beside it. Quoting
      the rule in the finding is what lets somebody disagree with the rule rather
      than with the tool

  - given: a sheet pattern of "M-*" over a mixed architectural and MEP sheet set
    expect: >
      the non-MEP sheets reported as not matching. That is the correct answer for
      the rule given - the rule, not the model, is the thing to argue with

  - given: a view pattern of "Level 1" with no wildcard, over a view called "Level 1"
    expect: >
      it passes. A pattern carrying no "*" is a whole-name rule and the name is
      the whole name, so there is nothing to report

  - given: a view pattern of "Level 1*" over a view called "Level 1 - OLD"
    expect: >
      it passes. The wildcard is what licenses the suffix, and it still does

  - given: the suspect list containing "copy of" and no pattern at all
    expect: >
      the copies found, AND the section saying no pattern was given so a
      correctly-shaped wrong name passes. A partial check announced as partial is
      useful; announced as complete it is worse than nothing

  - given: a workshared model and a workset pattern
    expect: >
      the user worksets checked by name, with NO ids attached to those findings -
      a workset id is not an element id and would resolve to nothing

  # ---- version 2 ----
  - given: >
      requiredOn Ducts, namePatterns "type=*: TRG*", over duct types
      "Rectangular Duct: TRG-Supply" and "Rectangular Duct: Default"
    expect: >
      the Default type reported as "Rectangular Duct: Default", with its id and
      the pattern quoted; the TRG type passes. The name is written "Family:
      Type" with no space before the colon

  - given: requiredOn Mechanical Equipment, requiredParameters "Comments",
      namePatterns "placeholder=TBD, XXX", one unit with Comments "TBD", one
      with "XXX", one with "AHU-01"
    expect: >
      two BLANK (2 of them holding a placeholder), one filled. The "TBD" row
      says it holds a placeholder the request named

  - given: requiredOn Mechanical Equipment, requiredParameters "Mark",
      namePatterns "value:Mark=AHU-*", one unit marked "AHU-01" and one "unit 2"
    expect: >
      1 filled and matching, 1 filled but NOT matching, 0 blank - the wrong
      value is NOT counted as blank, and "unit 2" is quoted beside the pattern

  - given: namePatterns "room=Office*" over rooms named "Office 01" and "Store"
    expect: >
      only Store reported. The name is the room's Name parameter, not its
      element name, which carries the number too

negative:
  - given: a rule set naming no pattern for sheets and no suspect names
    expect: >
      "NOT CHECKED" FOR SHEETS, with the number present, and the section counted
      as not checked. THIS IS THE CASE THAT MATTERS. A zero here would read as
      every sheet passing when nobody looked at one

  - given: a pattern of "Supply Diffuser" with no wildcard, over a type called
      "Supply Diffuser OLD"
    expect: >
      REPORTED AS BREAKING THE RULE. THIS IS THE CASE THAT MATTERS, and until
      2026-09-08 it did not: with no "*" in the pattern the matcher checked only
      that the name STARTED with it and then returned true, so every rule written
      without a wildcard silently behaved as a prefix rule. A standards check that
      passes the exact thing it was written to catch is worse than no check,
      because somebody stops looking. An exact rule is now an equality test

  - given: a required parameter that is not on the category at all
    expect: >
      counted as NOT PRESENT and described as project setup - separately from
      BLANK, which is data entry. Combining them sends the work to the wrong
      person, which is the whole reason they are counted apart

  - given: a model that is not workshared
    expect: >
      worksets NOT CHECKED, said as a fact about the model rather than a pass

  - given: an MEP model with duct and pipe systems
    expect: >
      the systems collected and NO EXCEPTION. Collecting them through
      OfClass(typeof(MEPSystem)) throws at runtime because that class is
      abstract, and it would take the whole sweep down on exactly the model this
      is for

  - given: view templates present and skipViewTemplates true
    expect: >
      none of them reported. A project's templates rarely follow the sheet naming
      convention and flagging them buries the findings

  - given: any run at all
    expect: >
      NOTHING RENAMED AND NOTHING SET. This reports; RENAME_ELEMENTS and
      EDIT_TEXT_VALUES are what fix it

  # ---- version 2 ----
  - given: the same Mechanical Equipment with Comments "TBD", and NO
      placeholder key
    expect: >
      "TBD" counted as FILLED and the line saying placeholders were NOT
      CHECKED. No placeholder is ever assumed

  - given: namePatterns "value:Mark=AHU-*", requiredOn Ducts and requiredParameters Mark, over ducts
      whose Mark is blank
    expect: >
      the blank ducts counted BLANK only, never also as not matching - a value
      pattern is applied to a filled value, so blank and wrong form stay apart

  # Row 5b-203. NOT RUN - it needs a model that carries a duplicated name,
  # and none has been arranged yet (NEEDS-CHECKING Group AP).
  - given: >
      requiredOn Walls, a curtain wall type, requiredParameters
      "Interior Type" (shown twice on the type, under Vertical and Horizontal
      Mullions)
    expect: >
      that wall counted NOT READ because two parameters share the name, not
      filled and not blank (row 5b-203)

  - given: >
      namePatterns "type=*: TRG*" and NO requiredOn
    expect: >
      TYPE NAMES NOT CHECKED, saying the type pattern was given and could not
      be applied. Never a zero

  - given: namePatterns "views=MEP-*" (a misspelt key)
    expect: >
      "views" listed under RULES NOT UNDERSTOOD, and the views NOT CHECKED

second_route:
  - >
    Revit's own Project Browser sorted by name, and the Sheet List schedule. The
    badly named views and the wrong sheet numbers are visible there by eye, which
    is how a first run should be checked before anybody trusts the counts

  - >
    The project's BIM execution plan or naming standard document. The patterns
    handed in should be traceable to a written rule, and a finding nobody can
    trace to one is a finding nobody will act on

  - >
    Version 2: a type schedule of the required categories with Family and Type
    fields, and a schedule of the required parameter filtered "equals TBD" -
    the counts here should match the rows there

id: FRG-GEO-019
semantic-identity: "the box each element occupies, and the box the whole set occupies"
kind: action
domain: revit.geometry
capability: REPORT_BOUNDING_BOX
version: 1
source: OFFICIAL
risk: READ

purpose: >
  The extent each element occupies - its size and its lowest corner, in mm -
  plus the single box that contains the whole set. It changes nothing.

  IT EXISTS BECAUSE *"what is the bounding box of this duct"* RESOLVED TO
  `FILTER_ELEMENTS_IN_ROOM`, and *"how big is the box around these elements"* to
  `SET_VIEW_SECTION_BOX` - a filter and a view setting, for a measurement.

  **THE BOX IS ALIGNED TO PROJECT X AND Y, AND THAT IS THE ONE THING TO KNOW
  BEFORE USING THE NUMBER.** It is not the element's own size. For anything
  running square to the project it is the same thing; for anything at an angle
  it is bigger than the object, in a shape the object does not have.

  | Asking about | Use |
  |---|---|
  | A duct, a pipe, a piece of equipment - **how much space does it take** | here |
  | A **room** - how big is it | `MEASURE_ROOM_DIMENSIONS`, which measures on the room's own axes |
  | **How much material** is in it | `MEASURE_ELEMENT_VOLUME` - solid volume and surface area |

  `MEASURE_ROOM_DIMENSIONS` carries this same table and states the case in
  numbers: turn an 8000 x 4000 room thirty degrees and its box becomes roughly
  8900 x 7500. **This fragment is the right answer to "what space does it
  occupy" and the wrong answer to "how big is it".**

  **THE COMBINED BOX IS THE USEFUL HALF FOR COORDINATION.** *"Will this plant
  fit through that opening"*, *"how deep is the services zone"*, *"where do I
  put the section box"* are all one question about a set, not a list of boxes.
  It is reported whether or not the per-element list is truncated.

  **AN ELEMENT WITH NO BOX IS REPORTED, NOT SKIPPED.** A view-specific element,
  an empty group or a purely annotation element has none. Skipping them silently
  makes the combined box look like it covers everything asked about.


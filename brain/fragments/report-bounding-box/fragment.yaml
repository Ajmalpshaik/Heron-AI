compatibility-note: >
  One implementation for every release. `Element.get_BoundingBox(View)`,
  `BoundingBoxXYZ.Min` and `Max`, and `XYZ` are present and unchanged 2020
  through 2027.

  `null` is passed as the view deliberately, which asks for the MODEL box rather
  than the box in one view - a view's box is cropped by that view and is not the
  element's extent.

  **No units API is called.** Internal feet are multiplied by 304.8 to
  millimetres, plain arithmetic at the edge - which is what D-20 requires and
  what keeps this working across the 2021 units break.

# ROUTING - the same rows are in the fragments named here.
#
#   "what is the bounding box of this"  -> here
#   "how much space does this take up"  -> here
#   "will this fit through the opening" -> here, the COMBINED box
#   "how big is this room"              -> MEASURE_ROOM_DIMENSIONS. A rotated
#                                          room's box is much bigger than the
#                                          room, so the box is the WRONG answer
#                                          to that sentence. That fragment
#                                          carries this same row
#   "how much material is in it"        -> MEASURE_ELEMENT_VOLUME - solid volume
#                                          and surface area, not extent
#   "how long is this duct run"         -> MEASURE_ELEMENT_LENGTHS
#   "set the section box round these"   -> SET_VIEW_SECTION_BOX - which CHANGES
#                                          a view, and is what this question used
#                                          to reach
#   "what is the overall size of this    -> here
#    set"
#   "dimension the rooms"                -> DIMENSION_ROOMS, which draws it
#                                           on the plan instead of reporting
#   "what are the extents of this        -> here. A datum extent is a
#    equipment"                             different thing entirely -
#                                           MAXIMIZE_DATUM_EXTENTS


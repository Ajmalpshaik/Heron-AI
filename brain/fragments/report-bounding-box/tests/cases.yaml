positive:
  - given: one 400 x 250 duct running along project X
    expect: >
      a box roughly 250 mm deep and 400 wide plus insulation - measured against
      the duct's own size in Revit's properties, not accepted from the return

  - given: a plant room of equipment
    expect: >
      a COMBINED box whose height answers "how deep is the services zone" -
      checked against a section through the room

  - given: 200 elements with maxRows 50
    expect: >
      50 rows listed AND the combined box covering all 200, with the truncation
      said. THIS IS THE CASE A CAP GETS WRONG: capping the combined figure
      silently answers about a subset, and "will it fit" is then wrong in the
      dangerous direction

  # Row 5b-352, added 2026-11-11 with version 2. NOT RUN - NEEDS-CHECKING
  # Group NK, NK6 (and Group CP, CP3, which asks what the box covers).
  - given: >
      a family holding two bodies far apart, each with Visible linked to its
      own Yes/No, nested in a host family with one switched off; the nested
      instance handed in
    expect: >
      its box as Revit gives it, AND a finding naming it: "1 of the 1 family
      instance(s) compared have a box LARGER than the geometry they show",
      with Revit's box and the smaller size of the body that shows. If no such
      finding comes, record on NK6 the box and what shows - Revit's default
      geometry and its box then agree, and row 5b-352 is not closed

negative:
  # Row 5b-352, added 2026-11-11 with version 2. NOT RUN - Group NK, NK6.
  - given: >
      the same nested instance with BOTH bodies switched on, and a second
      family instance of an ordinary one-body family
    expect: >
      every figure as version 1 gave it and NO finding about a box larger
      than what shows - an instance whose box and geometry agree carries no
      caveat

  - given: ducts, pipes or walls only - nothing handed in is a family instance
    expect: >
      every figure as version 1 gave it and no such finding - nothing was
      compared

  - given: a duct rotated 30 degrees to project north
    expect: >
      a box LARGER than the duct, and the reply saying so. THIS IS THE FIRST CASE
      TO RUN. The number is correct as an extent and wrong as a size, and nothing
      about it looks wrong

  - given: a room asked about here rather than through REPORT_ROOM_SPACE_DATA
    expect: >
      a box that overstates a rotated room by half again. The routing table is the
      fix, not the code - this fragment must not start measuring room axes

  - given: a set containing a text note and a view-specific detail line
    expect: >
      those named in noBoundingBox, counted, and EXCLUDED from the combined
      figure with that exclusion stated. A silent skip makes the combined box look
      like it covered everything asked about

  - given: an empty element list
    expect: >
      "nothing has a bounding box" IN WORDS, not a zero-sized box. A 0 x 0 x 0
      result reads as a measurement

  - given: an element Revit refuses a box for
    expect: that one named and the rest still measured

second_route:
  - >
    Select the elements in Revit and read the section box extents, or measure with
    a dimension in a section. That is what the combined figure is checked against

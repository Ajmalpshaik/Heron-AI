compatibility-note: >
  One implementation for every release. `ReferenceIntersector`,
  `FindReferenceTarget`, `ReferenceWithContext.Proximity` and `View3D` are
  unchanged 2020 through 2027 - read off the reference assemblies at both ends.
  `tolerance` arrives in millimetres and is divided by 304.8 in the code
  (D-71) - no units API is touched. (This note said it "arrives in internal
  FEET", with the millimetres converted at the edge before this, until
  2026-09-24, while the code and its own proof - 100000 in, 328.08 feet used -
  said millimetres.)

# ROUTING - repeated in READ_CEILING_GRID, SNAP_TO_GRID and
# MEASURE_CEILING_HEIGHT.
#
#   "are the light fittings sitting properly in the ceiling tiles" -> here
#   "are the diffusers in the ceiling"   -> here
#   "check the devices before the RCP goes out" -> here
#   "line these up with the ceiling grid" -> SNAP_TO_GRID - it MOVES things.
#                                           This one only measures, and a
#                                           question about the model must not be
#                                           answered by something that changes it
#   "where are the ceiling tile lines"   -> READ_CEILING_GRID
#   "how high is the ceiling"            -> MEASURE_CEILING_HEIGHT - floor to
#                                           ceiling, per room, not device to
#                                           ceiling

utterances:
  - are the light fittings sitting properly in the ceiling tiles
  - are the diffusers in the ceiling
  - check the devices before the RCP goes out
  - is anything floating above the ceiling
  - check the ceiling devices

id: FRG-QA-022
semantic-identity: "are the ceiling devices actually sitting in the ceiling"
kind: filter
domain: revit.qa
capability: CHECK_CEILING_COORDINATION
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Checks ceiling-mounted devices against the ceiling they are supposed to be in
  - is there a ceiling above each one at all, and is the device sitting AT it or
  floating above or hanging below. The sweep before a reflected ceiling plan is
  issued. Read-only.

  **THE FAULT THIS CATCHES IS INVISIBLE IN PLAN.** A diffuser 40 mm above the
  ceiling and a diffuser exactly in it look identical from above and both look
  fine in the browser. It shows up as a site query, or on a section nobody cut.
  Every device's own height is compared against the ceiling actually over it and
  the difference is reported in millimetres.

  **BEFORE THIS, THE QUESTION RESOLVED TO `SNAP_TO_GRID` - which MOVES things.**
  A question about whether the model is right, answered by something that
  changes it.

  **THE CEILING IS FOUND BY CASTING A RAY UPWARD, and that is the technique that
  works.** A device placed unhosted is not "hosted by" the ceiling in any
  readable way, and a room cannot tell you its own ceiling. The ray needs a real
  3D view; if the project has none, that is REPORTED rather than returned as
  zero findings.

  **"NO CEILING ABOVE" IS A FINDING, NOT AN ERROR.** A device in an open-soffit
  area is fine; a device that should be in a ceiling and has none is either in
  the wrong place or the ceiling is missing from the model. Counted separately,
  because those two cases look identical in every other check.

  **THE RAY GOES UP FROM THE INSERTION POINT**, and for a family whose insertion
  point is off its own centre - some linear diffusers, some light fittings - it
  can miss the ceiling beside it. A large NO CEILING count in an area known to
  have one is usually that, and the report says so rather than letting it read
  as a hundred real faults.

  **CEILINGS IN LINKS ARE NOT HIT UNLESS ASKED FOR.** Architecture is normally linked, so a host
  model with no ceilings reports everything as uncovered - said on the summary
  line, because it looks exactly like a real finding.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, a second ray is cast with Revit's own
  FindReferencesInRevitLinks, and every device whose nearest ceiling above
  is a LINKED one gets a line in `linkedMatches`: the gap, the verdict
  against the same tolerance, and the ceiling's type and id IN THE LINK -
  on an MEP model the ceilings are the architect's, so this is the answer
  the host-only run warns it cannot give. **The ray sees a link only where
  the 3D view shows it**, and the answer names that view. `linksSearched`
  says how many links are loaded: set and 0 means "you asked, and none are
  loaded". **NOTHING FROM A LINK IS CARRIED** - `outOfPlane` and
  `noCeilingAbove` stay this model's answer (FRAGMENT-ISSUES row 75). Only
  model elements are read from a link, never its views or sheets. Links
  nested inside a link are not read, and are counted in the answer. This
  is version 2; version 1's proof no longer describes the code, and the
  fragment is DRAFT until it is proved again.

contract:
  needs:
    - name: doc
      type: Document
    - name: devices
      type: IList<Element>
    - name: tolerance
      type: double
      source: request
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: findings
      type: IList<string>
    - name: outOfPlane
      role: result
      type: IList<ElementId>
    - name: noCeilingAbove
      # Devices with no ceiling over them at all. THE FIRST OF THE TWO
      # QUESTIONS THIS FRAGMENT ASKS - *is there a ceiling above each one at
      # all*, then is it sitting at it. A `no*` name, and the finding.
      role: result
      type: IList<ElementId>
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then the links' own lines. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75).
      role: accounting
      type: IList<string>


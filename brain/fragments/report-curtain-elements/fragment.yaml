revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Wall.CurtainGrid`,
  `CurtainGrid.GetPanelIds`, `GetMullionIds`, `GetUGridLineIds`,
  `GetVGridLineIds`, and the `Panel` and `Mullion` types are present and
  unchanged 2020 through 2027.

  Every id is an `ElementId` resolved with `doc.GetElement`; nothing reads an id
  as a number, so 2024's 64-bit change does not reach this code. No units call is
  made.

# ROUTING - the same rows are in the fragments named here.
#
#   "what is in this curtain wall"      -> here
#   "how many panels and mullions"      -> here
#   "how much glass is in this facade"  -> here for the COUNT, and note the
#                                          panels that are basic walls are named
#                                          separately - they are not glass
#   "what is this wall made of"         -> REPORT_COMPOUND_STRUCTURE for a normal
#                                          wall. A curtain wall has NO layer
#                                          build-up, and that fragment says so
#                                          and points here
#   "build me a curtain wall"           -> CREATE_WALL. One reads, one makes -
#                                          and this question resolved to that
#                                          fragment until 2026-09-05
#   "what area is the glazing"          -> MEASURE_ELEMENT_VOLUME on the panels,
#                                          which reports surface area

utterances:
  - what panels and mullions are in this curtain wall
  - what is in this curtain wall
  - how many curtain panels are there
  - list the mullions on this facade
  - how many grid lines in this curtain wall
  - break down this curtain wall
  - what is this facade made of

# VERSION 2 (2026-10-29, the owner's word that day - "build the three widenings
# too" - for the row doc 45 section 6 and the facade plan recorded as waiting):
# the panels are also grouped by SIZE - width x height in millimetres, as Revit
# gives each panel, within a tolerance (5 mm unless the modeller gives one), per
# wall and across every wall handed in - so "how many different panel sizes does
# this facade have" is answered. Only ADDED: every line version 1 wrote is still
# written, in its words and its order, and every name it left behind is still
# left. A size Revit does not give is named in sizesNotRead, never guessed.
# Version 1's proof below no longer describes the code and is kept as a record;
# the card is DRAFT until NEEDS-CHECKING Group JR proves version 2 and the owner
# signs.
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Reads what a curtain wall is built from - its panels, its mullions by type,
  and how many grid lines run each way. It changes nothing.

  **IT EXISTS BECAUSE THE QUESTION WAS BEING ANSWERED BY `CREATE_WALL`.**
  Measured before this batch, *"what panels and mullions are in this curtain
  wall"* resolved to the fragment that BUILDS A WALL - a question about an
  existing element answered by making a new one.

  **A CURTAIN WALL IS THE ONE WALL WITH NO LAYERS, AND THIS IS ITS OTHER HALF.**
  `REPORT_COMPOUND_STRUCTURE` correctly reports that a curtain wall has no
  build-up. That is a true answer and an unhelpful one on its own: the wall IS
  made of something, and it is panels and mullions. The two fragments carry each
  other's row for that reason.

  **A PANEL IS NOT ALWAYS A `Panel`.** A curtain grid cell can hold a basic wall
  instead of a curtain panel family - that is how a solid infill or a spandrel
  is normally modelled - and it comes back in `GetPanelIds` like any other cell.
  Counting only `Panel` elements under-reports the wall and makes a glazing
  takeoff look short. Both kinds are counted, and the wall-as-panel ones are
  named separately because they are the ones a glass order must not include.

  **AN EMPTY CELL IS A REAL STATE.** A grid cell whose panel has been deleted
  returns an id that resolves to nothing. It is a hole in the elevation, and it
  is reported as one rather than skipped - a skipped null and a solid wall look
  identical in a count.

  **MULLIONS ARE GROUPED BY TYPE, WHICH IS WHAT GETS ORDERED.** Forty mullions
  is not a purchase order; twelve of one profile and twenty-eight of another is.

  **PANEL SIZES (version 2).** Each panel's Width and Height, read off Revit,
  grouped within a tolerance - per wall, and across every wall handed in. A
  panel whose size Revit does not give is named, never guessed.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # VERSION 2. How far apart, in millimetres, two panels' widths - and their
    # heights - may be and still be one size: "within 3 mm", "to the nearest
    # 10 mm". Left out, 5 mm. 0 is exact. Never negative.
    - name: toleranceMm
      type: double
      source: request
      optional: true
      absent: 5
  provides:
    - name: findings
      type: IList<string>
    - name: curtainWallsFound
      # How many curtain walls were read. The size of the sweep, never a panel
      # or mullion it found (D-52).
      role: accounting
      type: int
    - name: panelCount
      role: result
      type: int
    - name: mullionCount
      role: result
      type: int
    - name: emptyCells
      # AN EMPTY CELL IS A REAL STATE - a grid cell whose panel has been
      # deleted returns an id that resolves to nothing, and it looks like
      # nothing at all on the drawing.
      role: result
      type: int
    - name: notCurtain
      # Handed in but not curtain walls, so there was nothing here to act on.
      # A count of what it was GIVEN and could not use, never a thing it found
      # (D-52).
      role: accounting
      type: IList<string>
    - name: differentPanelSizes
      # VERSION 2. How many different panel sizes - width x height within the
      # tolerance - across EVERY curtain wall handed in. A size two walls share
      # is one size. Each wall's own count is on its line in findings.
      role: result
      type: int
    - name: panelSizes
      # VERSION 2. One line per size across every wall, "6 at 1500 x 3000 mm",
      # a range where the members differ, and "(1 of them a door)" for a cell
      # that is not a curtain panel.
      role: result
      type: IList<string>
    - name: sizesNotRead
      # VERSION 2. Each panel whose Width or Height Revit did not give, with the
      # wall, the cell and the reason - in no size, never guessed (D-52). An
      # EMPTY cell is not here: it is counted in emptyCells.
      role: accounting
      type: IList<string>


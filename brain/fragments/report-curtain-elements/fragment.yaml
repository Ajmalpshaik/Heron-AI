compatibility-note: >
  One implementation for every release. `Wall.CurtainGrid`,
  `CurtainGrid.GetPanelIds`, `GetMullionIds`, `GetUGridLineIds`,
  `GetVGridLineIds`, and the `Panel` and `Mullion` types are present and
  unchanged 2020 through 2027.

  Every id is an `ElementId` resolved with `doc.GetElement`; nothing reads an id
  as a number, so 2024's 64-bit change does not reach this code. No units call is
  made.

  Version 2 reads each panel's size with `Element.get_Parameter(BuiltInParameter)`
  for `CURTAIN_WALL_PANELS_WIDTH` and `CURTAIN_WALL_PANELS_HEIGHT`, then
  `Parameter.HasValue`, `StorageType` and `AsDouble` - feet, times 304.8 for
  millimetres - and tells a door from a curtain panel by comparing `Category.Id`
  with `new ElementId(BuiltInCategory.OST_Doors)` and `OST_CurtainWallPanels`.
  Read with `tools/api-surface --members` on all eight releases on 2026-10-29:
  each is present with one signature 2020 to 2027. No units call is made:
  internal units are feet on every release.


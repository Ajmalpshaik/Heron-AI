#                                          panels that are basic walls are named
#                                          separately - they are not glass
#   "what is this wall made of"         -> REPORT_COMPOUND_STRUCTURE for a normal
#                                          wall. A curtain wall has NO layer
#                                          build-up, and that fragment says so
#                                          and points here
#   "build me a curtain wall"           -> CREATE_WALL. One reads, one makes -
#                                          and this question resolved to that
#                                          fragment until 2026-09-05
#   "what area is the glazing"          -> MEASURE_ELEMENT_VOLUME on the panels,
#                                          which reports surface area
#   "set the curtain wall grid spacing" -> SET_CURTAIN_WALL_GRID. This one READS
#                                          a curtain wall; that one changes its
#                                          TYPE's grid, and so every wall of the
#                                          type. Asked through heron_lookup on

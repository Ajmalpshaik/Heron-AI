  negative_case: "CANNOT COME BACK EMPTY, so proved by TRACKING instead (D-53). report-element-ownership\
    \ describes whatever it is given, so no arrangement makes its answer empty. What D-30's\
    \ negative case exists to catch - a fragment that succeeds while doing nothing, or answers\
    \ about a set it was not given - is caught here by the answer following the input exactly\
    \ across 5 different inputs:\n\n      22 ducts in M1 -> owners 22 entry(ies)\n      air\
    \ terminals in M1 -> owners 10 entry(ies)\n      mechanical equipment in L3 -> owners\
    \ 10 entry(ies)\n      duct tags in M1 -> owners 6 entry(ies)\n      spaces in L3 -> owners\
    \ 17 entry(ies)\n\n    Different inputs, exact matches every time. A fragment falling\
    \ back to the active view, the whole model, or a previous run could not do that."
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as

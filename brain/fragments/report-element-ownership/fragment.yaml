# VERSION 3 (2026-11-20, WN-5 - work note earlier-brain/02-work-packages.md
# C8.2, GitHub issue #1005) - "CHANGED IN CENTRAL?" BESIDE WHO OWNS IT. Each
# element's WorksharingUtils.GetModelUpdatesStatus - CurrentWithCentral,
# UpdatedInCentral, DeletedInCentral or NotYetInCentral, what Revit's
# Worksharing Display "Model Updates" shows - in `centralStatus`, and the
# elements updated or deleted in central since this model last reloaded in
# `changedInCentral`: those need a Reload Latest before they can be changed
# here. Autodesk's own words: the value is cached locally, as of the last time
# this model talked to central, never a fresh look - said in the code and
# below, never read as a guarantee. Not workshared: both empty. Every version 2
# answer is unchanged. The card was DRAFT already; NEEDS-CHECKING Group OU.

purpose: >
  On a workshared model, who owns each element right now, who created it and who
  changed it last - asked before a bulk edit rather than discovered halfway
  through one.

  **A BATCH IS ONE UNDO ENTRY, WHICH IS WHY THIS IS ASKED FIRST.** Golden Rule
  16 means every fragment in a batch runs inside one transaction. Hitting an
  element owned by somebody else partway through does not stop at that element -
  it takes the whole batch with it. Knowing beforehand which elements are not
  editable turns that into a decision rather than a failure.

  **"NOT OWNED" MEANS "PROBABLY FREE", NEVER "GUARANTEED FREE", AND THIS IS
  STATED RATHER THAN IMPLIED.** Checkout status reflects the last sync.
  Somebody may have borrowed an element since, and nothing local can see that.
  The fresh-reads rule applies to people as well as to geometry, and a report
  that reads as a guarantee here would be believed.

  **A MODEL THAT IS NOT WORKSHARED IS ANSWERED, NOT REFUSED.** `notWorkshared`
  says so plainly, because "everything is editable" is the correct answer to
  the question and an empty result would read as "nothing is editable" - the
  opposite of the truth, on the more common kind of model.

  **CREATOR, OWNER AND LAST CHANGED BY ARE THREE DIFFERENT PEOPLE** and are
  returned separately. Who to ask for a relinquish is the owner. Who to ask
  about an odd piece of modelling is the last person to change it. Collapsing
  them sends the question to the wrong desk.

  **AN ELEMENT WHOSE STATUS CANNOT BE READ IS HELD, NEVER FREE AND NEVER
  DROPPED** (version 2). It goes in `ownedByOthers` with owner "unknown", so
  the editable and held lists always add up to what was handed in. This is
  version 2; version 1's proof no longer describes the code and is kept as a
  record, and the fragment is DRAFT until it is proved again.

contract:
  needs:
    - name: elements
      type: IList<Element>
    - name: doc
      type: Document
      source: ambient
  provides:
    - name: owners
      role: result
      type: IDictionary<ElementId, string>
    - name: creators
      role: result
      type: IDictionary<ElementId, string>
    - name: lastChangedBy
      role: result
      type: IDictionary<ElementId, string>
    - name: ownedByOthers
      role: result
      type: IList<ElementId>
    - name: editable
      # Elements nobody has checked out. NOT OWNED MEANS PROBABLY FREE, NEVER
      # GUARANTEED FREE, because checkout status reflects the last sync - the
      # evidence it looked, and `ownedByOthers` is the finding (D-52).
      role: accounting
      type: IList<ElementId>
    - name: notWorkshared
      # Reported when the model is not workshared at all, so there is no
      # ownership to read. The evidence it looked, never a thing it found
      # (D-52).
      role: accounting
      type: bool
    # VERSION 3 (WN-5). Elements central has moved on from - UpdatedInCentral
    # (a Reload Latest is needed before they can be changed here) or
    # DeletedInCentral - as of the last time this model talked to central.
    # The finding; empty on a model that is not workshared.
    - name: changedInCentral
      role: result
      type: IList<ElementId>
    # VERSION 3 (WN-5). Every element's Model Updates word, as Revit caches it
    # locally: CurrentWithCentral, UpdatedInCentral, DeletedInCentral,
    # NotYetInCentral, or "unknown" when it cannot be read - never "current"
    # for that. The evidence it looked (D-52); empty when not workshared.
    - name: centralStatus
      role: accounting
      type: IDictionary<ElementId, string>


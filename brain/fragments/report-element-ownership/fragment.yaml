compatibility-note: >
  One implementation for every release. `WorksharingUtils.GetCheckoutStatus`,
  `GetWorksharingTooltipInfo` and `Document.IsWorkshared` are unchanged 2020 to
  2027 and were confirmed clean on 2020 and 2024 during the earlier
  cross-version pass. The tooltip call is guarded per element rather than once
  around the loop, because an element deleted by another user since the last
  sync throws on that call alone and would otherwise lose the whole report.

# VERSION 2 (2026-11-01) - READ_ELEMENT_OWNERSHIP WAS MERGED INTO THIS CARD on
# the owner's instruction, and is DEPRECATED. The same check - which of these can
# be edited on a workshared model, and who holds the rest - and this card already
# gave more: owner, creator and last changed by. Its one rule this card lacked is
# now here: an element whose checkout status cannot be read is HELD by an unknown
# owner, not dropped from both lists. Its `workshared` is this card's
# `notWorkshared` turned round; its owner names are `owners`. Its sentences moved
# here, and so did its routing rows: "who owns this" and "why can I not change
# this" are answered here, then SET_PIN_STATE when it is pinned rather than owned.
# PINNED AND OWNED LOOK IDENTICAL TO A USER and have opposite fixes.
#
# ROUTING - repeated in LIST_WORKSETS and SET_ELEMENT_WORKSET.
#
#   "who owns this"                      -> here
#   "why can I not edit this"            -> here FIRST, then SET_PIN_STATE
#   "pin these" / "unpin"                -> SET_PIN_STATE
#   "list the worksets"                  -> LIST_WORKSETS
#   "put these on the MEP workset"       -> SET_ELEMENT_WORKSET
#   "make my workset editable"           -> SET_WORKSHARING_OWNERSHIP - the
#                                           PUBLISH change; this only reads


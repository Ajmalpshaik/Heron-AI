# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: a workshared model, elements the current user has borrowed
    expect: >
      those in `editable`, with the owner naming the current user. Compare
      against Revit's own Worksharing Display for one element by eye

  - given: elements borrowed by a colleague
    expect: >
      those in `ownedByOthers` with that person's name. This is the list that
      decides whether a bulk edit can run at all - Golden Rule 16 means a batch
      is one transaction, so one owned element takes the whole batch down

  - given: an element created by one person and last changed by another
    expect: >
      the two names DIFFERENT and in their own dictionaries. The owner is who
      to ask for a relinquish and the last changer is who to ask about the
      modelling; collapsing them sends the question to the wrong desk

  # VERSION 3 (WN-5) - NOT RUN. Two local copies of one scratch central.
  - given: >
      VERSION 3 - a scratch workshared central and two local files of it (two
      user names, Options > General > Username). In local B move one wall and
      Synchronize with Central; in local A (no Reload Latest yet) hand in that
      wall and one untouched wall
    expect: >
      the moved wall in `changedInCentral` and `centralStatus` UpdatedInCentral;
      the untouched wall CurrentWithCentral and not in `changedInCentral` -
      matching Revit's Worksharing Display > Model Updates in local A. After a
      Reload Latest in A, the same call reads both CurrentWithCentral

  - given: VERSION 3 - in local A, a wall drawn now and not yet synchronised
    expect: >
      `centralStatus` NotYetInCentral, not in `changedInCentral`

negative:
  - given: A MODEL THAT IS NOT WORKSHARED AT ALL
    expect: >
      notWorkshared TRUE and EVERY element in `editable`. Empty lists would read
      as "nothing is editable" - the exact opposite of the truth, on the more
      common kind of model, and a caller would act on it

  - given: >
      an element another user DELETED since the last sync, still in the passed
      list
    expect: >
      the rest of the report intact. The tooltip call throws on that id alone,
      and a guard around the loop rather than around the call would lose the
      whole report over one stale element

  - given: >
      VERSION 2. An element whose checkout status Revit cannot read - deleted by
      another user since the last sync, on a workshared model
    expect: >
      it is in `ownedByOthers`, with "unknown" as its owner when no name came
      back - NEVER in neither list and never in `editable`. Version 1 dropped
      it, so the two lists added up to fewer than the elements given. The sum
      of `editable` and `ownedByOthers` equals the elements handed in, every
      time, on a workshared model

  - given: VERSION 2. The same element handed in twice
    expect: >
      it is counted once. A held count larger than the elements there are is
      a report nobody can reconcile

  - given: an element reported as not owned, which a colleague borrows a moment later
    expect: >
      it appears editable, AND THAT IS THE STATED LIMIT rather than a defect.
      Checkout status reflects the last sync; nothing local can see a borrow
      since. This must never be presented as a guarantee, because a guarantee
      is what gets acted on

  - given: >
      VERSION 3 - a model that is not workshared, any walls handed in (the
      negative for the new answer)
    expect: >
      `changedInCentral` EMPTY and `centralStatus` EMPTY, notWorkshared TRUE,
      every wall in `editable` as version 2 answered. Any word in
      `centralStatus` here is the failure

second_route:
  - >
    VERSION 3: Worksharing Display > Model Updates in the view, against
    `centralStatus`
  - >
    turn on Worksharing Display > Owners in the Revit view and compare the
    colours against this list
  - >
    try the edit on one element Revit says belongs to somebody else and read
    the dialog it raises

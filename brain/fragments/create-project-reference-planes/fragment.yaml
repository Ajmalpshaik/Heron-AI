# WHY IT EXISTS - a comment, not `purpose`, because `purpose` is searched.
# 2026-11-02: asked for in the modeller's words "draw a reference plane along
# grid B in this plan", "add a reference plane named Ceiling Datum 2700 above
# Level 1" and "add reference planes at 600 centres here" - Revit's
# Architecture > Work Plane > Ref Plane, in a project. No card drew one: a
# grep of every fragment's C# that day for NewReferencePlane found it only in
# family cards, and brain/heron_retrieve.py on the sentences (a scratch store,
# model backend) answered DRAW_FAMILY_DETAIL_LINES, MEASURE_CEILING_HEIGHT and
# SET_FAMILY_PLANE_REFERENCE.
#
# LOOK-ALIKES, NOT DUPLICATES (heron-duplicate-checker's method, 2026-11-02).
# CREATE_REFERENCE_PLANES (PROVEN) makes named planes in the FAMILY being
# edited, measured from the family origin, and refuses a project in its own
# C# - its proof's negative case is that refusal on Project1. This one is the
# project's: measured from a grid or a level, and it refuses a family the
# same way, naming that card. SET_REFERENCE_PLANE_LENGTH sets the length of
# planes already there and makes none. CREATE_GRIDS and CREATE_LEVELS make
# datums that show on sheets; a reference plane does not.
#
# THE DATUM IS NEVER GUESSED (D-33). A grid or a level by its name; with none
# named, or a name nothing has, nothing is made and the grids and levels are
# listed. "Here" in "at 600 centres here" is the modeller's to name.
#
# SKIPPED, NEVER MADE TWICE, NEVER MOVED. A name already used, a name given
# twice, or a place a plane already lies is named in `skipped`; the rest are
# made. Nothing deletes, so Article 7's confirmation does not arise.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
kind: action
domain: revit.elements
capability: CREATE_PROJECT_REFERENCE_PLANES
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Draws reference planes in a project, set out from one grid or level named
  by the modeller - never guessed. Along a straight grid, or parallel to it at
  distances in millimetres east or north of it, drawn in a plan; or
  horizontal, at heights above or below a level, drawn in a section or
  elevation. Each may be named; a spacing and a count give a row of planes at
  equal centres. A name already in the project, or a place a plane already
  lies, is skipped and named. Each plane is read back.

contract:
  needs:
    - name: doc
      type: Document
    # The view to draw in, by name - "Level 1", "Section 1". Left out, it
    # binds null and the view in front is used. A plan for a grid, a section
    # or elevation for a level; any other kind, and any template, is refused
    # by name.
    - name: view
      type: View
      source: request
      optional: true
    # The grid or level the distances are measured from, by its name - "B",
    # "Level 1". Left out, nothing is made and the grids and levels are
    # listed.
    - name: datum
      type: string
      source: request
      optional: true
      absent: ""
    # "name=mm" entries with ";" between - "Ceiling Datum=2700; 0" - in
    # MILLIMETRES from the datum: east or north of a grid, above a level
    # (negative the other way). An entry with no "=" is an unnamed plane at
    # that distance; "0" with a grid is a plane along it.
    - name: planes
      type: string
      source: request
      optional: true
      absent: ""
    # Equal centres: `count` unnamed planes at this spacing from the datum,
    # in MILLIMETRES - 600 and 5 give 600, 1200 ... 3000. Both or neither.
    - name: spacingMm
      type: double
      source: request
      optional: true
      absent: '0'
    - name: count
      type: int
      source: request
      optional: true
      absent: '0'
  provides:
    - name: created
      # The reference planes made, each read back before it was kept.
      role: result
      type: IList<ElementId>
    - name: skipped
      # Each plane asked for and not made, with why - a name already used,
      # a name given twice, a plane already lying there. Evidence it looked,
      # never a thing it made (D-52).
      role: accounting
      type: IList<string>
    - name: report
      # ONE STRING: how many made of how many asked, in which view, from
      # which datum, then each plane's name and where it was read back -
      # "\"Ceiling Datum\" 2700 mm above level \"Level 1\" (elevation 2700
      # mm)" - joined by " || ", SKIPPED rows last.
      role: accounting
      type: string
    - name: refused
      # Why NOTHING was made, in the modeller's words - with the grids and
      # levels listed when the datum was not clear. Null when it ran (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>


# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: one door schedule and fieldNames ["Comments"]
    expect: >
      added = 1, alreadyPresent = 0, unknownField empty. Then OPEN THE SCHEDULE
      in Revit - a Comments column, with the real values in it. A count says
      nothing about whether the column carries data

  - given: the SAME call run a second time
    expect: >
      added = 0 and alreadyPresent = 1, and the schedule still has exactly ONE
      Comments column. Two identical columns look plausible on screen and are
      wrong on the sheet

  - given: several schedules of different categories in one call
    expect: >
      each gets the field if its category has it, and availableFields holds the
      union of what those categories offer

negative:
  - given: a field name misspelled, e.g. "Coments"
    expect: >
      it in unknownField, added = 0 for it, AND availableFields listing the real
      names. This is the case the fragment exists for - the version it was
      re-authored from put a spelling mistake, an already-present column and a
      not-addable field into ONE counter, and its own comment said so

  - given: >
      a field name that is real for another category but not this one, e.g. a
      duct-only field asked of a door schedule
    expect: >
      it in unknownField and the real names for THIS category in
      availableFields. Schedulable fields are category-specific and are not free
      text, which is exactly what this makes visible

  - given: an element that is not a schedule, e.g. a floor plan
    expect: it is skipped, no exception, the real schedules still processed

  - given: an empty fieldNames list
    expect: nothing added, reported as nothing to do

  # VERSION 2 (2026-11-01, ADD_SCHEDULE_COMBINED_FIELD merged in). Each FAILS on
  # version 1, which has no columnName, partFields, editExisting or position.
  - given: >
      VERSION 2. A door schedule, fieldNames left out, columnName "Type Mark",
      partFields Type, Mark, partSeparators "-"
    expect: >
      added 1, one new column reading Type-Mark on every row; columnNow naming
      it '[Type]-[Mark]'. Change a mark in the model and watch the column
      follow - a field, never typed text

  - given: VERSION 2. Three parts and two separators
    expect: >
      all three joined in order, the first separator between parts 1 and 2,
      the second between 2 and 3, nothing after the third

  - given: VERSION 2. Two parts and two separators
    expect: >
      refused in refusedWhy - two parts take one separator - and nothing
      changed; the schedule in refusedSchedules

  - given: VERSION 2. A part name not schedulable for that schedule's category
    expect: >
      the schedule in partMissing and NO column added to it - half a column is
      missing a value on every row

  - given: VERSION 2. Two schedules of different categories, one lacking a part
    expect: the other still gets the column

  - given: >
      VERSION 2, the owner's job. 'DUCT HEATER SCHEDULE (ROOF FLOOR)' on
      4355-BHVD-3D-21S10-BL001A (Revit 2020), editExisting true, columnName
      Size, partFields Duct_Accessory_Width, Duct_Accessory_Height,
      partSeparators x
    expect: >
      edited 1, added 0; the Size column in the same place with the same
      heading; a row reading 2000x1300 - never 20001300x

  - given: >
      VERSION 2. editExisting true, columnName Size, position "after Equipment
      Tag", partFields and partSeparators left out
    expect: >
      the column moved there and nothing else changed; columnNow ends "moved"

  - given: VERSION 2. editExisting true on a PLAIN column, Mark, with new parts
    expect: >
      refused, refusedWhy saying it is a plain column with no parts to
      replace; Mark exactly as it was

  - given: VERSION 2. editExisting true and a heading two columns share
    expect: refused, refusedWhy naming both column numbers; neither changed

  - given: VERSION 2. position "after Equipment Tag" with no columnName
    expect: >
      refused whole, nothing added or changed - there is no column to place

  - given: VERSION 2. fieldNames ["Comments"] AND a combined column in one call
    expect: >
      both added - added 2 - the plain one first, the combined one after it

  - given: VERSION 2. A sheet in the set beside the schedules
    expect: its id in notASchedule, the schedules still done

second_route:
  - open the schedule and look at the columns, not the count
  - run twice and confirm no schedule gains a duplicate column
  - one Ctrl+Z removes every added column in a single step (Golden Rule 16)
  - for a combined column, check it against the two parameters it was built from on a row you can read, then change one and see the column follow

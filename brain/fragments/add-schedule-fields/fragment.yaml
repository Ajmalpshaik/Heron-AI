id: FRG-VIEW-034
semantic-identity: "add columns to these schedules, and say which ones could not be added and why"
kind: action
domain: revit.views
capability: ADD_SCHEDULE_FIELDS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Adds named columns to every schedule handed in, and separates THREE OUTCOMES
  the version this was re-authored from ran together under one counter.

  Its own comment admitted the conflation - *"already present, or not addable to
  this schedule type"* - both landing in the same `notFound` tally as a genuine
  spelling mistake. Those are three different situations needing three different
  responses:

  | Outcome | What it means | What you do |
  |---|---|---|
  | `added` | the column is now there | nothing |
  | `alreadyPresent` | it was there before | nothing — **and this is not a failure** |
  | `notSchedulable` | that field cannot go on this schedule | pick a different field |
  | `unknownField` | no field of that name exists for this category | check the spelling — the real names come back |

  WHEN A NAME IS NOT FOUND, THE REAL NAMES ARE HANDED BACK. Schedulable fields
  are **category-specific and are not free text** - a name that works on a door
  schedule may not exist on a duct one. Nearly every miss is a spelling or a
  wrong-category assumption, and the list of what IS available is the answer to
  the question the caller is about to ask.

  A COLUMN IS NEVER ADDED TWICE. Two identical columns in a schedule is the
  same failure as two tags on one element: it looks plausible on screen and is
  wrong on the sheet.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16), so a batch
  of columns across several schedules is one undo entry.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: fieldNames
      type: IList<string>
      source: request
  provides:
    - name: added
      role: result
      type: int
    - name: alreadyPresent
      # Elements that were ALREADY in the state asked for, so there was
      # nothing to do. The evidence it looked, never a change it made
      # (D-52).
      role: accounting
      type: int
    - name: unknownField
      # Field names the category does not have. Given and unusable, never a
      # column it added (D-52).
      role: accounting
      type: IList<string>
    - name: availableFields
      # The fields that ARE schedulable here - the answer to the question the
      # caller is about to ask, and reference data rather than a finding. It
      # is filled in whether anything was added or not, so it must never read
      # as work (D-52).
      role: accounting
      type: IList<string>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string


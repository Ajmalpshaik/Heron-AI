revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `ViewSchedule.Definition`,
  `GetSchedulableFields`, `SchedulableField.GetName(Document)`,
  `ScheduleDefinition.AddField`, `GetFieldOrder` and `GetField` are unchanged
  2020 to 2027 and no units call is made.

  Version 2 adds the calls ADD_SCHEDULE_COMBINED_FIELD made, PROVEN on Revit
  2020: `TableCellCombinedParameterData`, `InsertCombinedParameterField`,
  `ScheduleField.IsCombinedParameterField`, `GetCombinedParameters`,
  `SetCombinedParameters`, `ScheduleDefinition.IsValidCombinedParameters`,
  `GetFieldIndex` and `SetFieldOrder` - each read off the shipped assemblies
  for 2020 to 2027 on 2026-10-21 and unchanged on all eight. Formula-based
  calculated values are NOT used: they have no public API on the older
  releases in this range.

# ROUTING - the same rows are in the fragments named here.
#
#   "make a key schedule"            -> CREATE_SCHEDULE, listKind key (CREATE_
#                                       KEY_SCHEDULE until it was merged there,
#                                       2026-11-01) - and this is how
#                                       its columns get added afterwards
#   "remove a column"                -> REMOVE_SCHEDULE_FIELDS. THE OPPOSITE
#                                       OPERATION, and until it was built every
#                                       "take the level column out" resolved to
#                                       HERE and would have put the column back
#   "hide a column but keep the field"
#                                    -> REMOVE_SCHEDULE_FIELDS with hideOnly
#   "what columns are there"         -> REPORT_SCHEDULE_DEFINITION - a QUESTION,
#                                       and it must not be answered by this
#                                       fragment, which writes
#   "rename the column heading"      -> SET_SCHEDULE_APPEARANCE. The heading is
#                                       what PRINTS; the field keeps its name
#   "sort or group the schedule"     -> SET_SCHEDULE_SORT_GROUP
#   "filter the schedule"            -> SET_SCHEDULE_FILTERS
#   "add a formula / calculated column"
#                                    -> NOT HERE AND NOWHERE IN THIS LIBRARY.
#                                       A calculated field's formula CANNOT BE
#                                       WRITTEN through the API: ScheduleField
#                                       carries no formula member on any release
#                                       2020 to 2027, checked against the
#                                       reference assemblies. Revit's route:
#                                       the schedule's Fields tab, the fx
#                                       "Calculated Value" button
#   "add a column for the mark"          -> here, for a plain parameter
#   "one column with two parameters in   -> here, VERSION 2, columnName and
#    it"                                    partFields - since
#                                           ADD_SCHEDULE_COMBINED_FIELD was
#                                           merged in, 2026-11-01
#   "edit the size column to use width   -> here, VERSION 2, editExisting
#    x height"
#   "move this column after Equipment    -> here, VERSION 2, editExisting
#    Tag"                                   with position and no parts. No
#                                           other tool reorders columns
#   "what is the size column made of"    -> REPORT_SCHEDULE_DEFINITION - a
#                                           question, never this write

# VERSION 2 (2026-11-01) - ADD_SCHEDULE_COMBINED_FIELD WAS MERGED INTO THIS
# CARD on the owner's instruction ("make sure there is no duplicate tools";
# "merge means ... all area need to be covered"), and is DEPRECATED. The same
# job - put a column on a schedule, read it back. What that card had and this
# one lacked is here now, its code carried whole: combined columns (parts
# with separators BETWEEN them, row 5b-1292; one unresolved part stops that
# column on that schedule, partMissing); editExisting, a column rebuilt in
# place with its heading, sort, filter and width kept; position, the one
# place a column is moved; columnNow read back; refusedWhy; notASchedule.
# Called with fieldNames alone, version 1 runs unchanged.
#
# THE SAFER RULE IN EACH CONFLICT IS KEPT. A position with no columnName, or
# a combined column with no heading, is refused whole before anything is
# written - that card's columnName was required, so it could not arise there.
#
# NOT CARRIED: nothing; no rule of that card is the opposite of one here.
# Its `refused` (schedule ids) is `refusedSchedules` here, because this
# card's `refused` is the sentence that stops the call.
#
# WHERE ITS OUTPUTS ARE NOW: added -> added (plain and combined together),
# edited -> edited, columnNow -> columnNow, partMissing -> partMissing,
# notASchedule -> notASchedule, refused -> refusedSchedules, refusedWhy ->
# refusedWhy. Its sentences moved here.

utterances:
  - add a column to the schedule
  - put comments in the schedule
  - add these fields to the schedule
  - i need another column
  - add a column for the mark
  - show that parameter in the schedule
  # MOVED 2026-11-01 from ADD_SCHEDULE_COMBINED_FIELD, merged into this card.
  - one column with the type and the mark together
  - join two parameters into one column
  - combine these fields in the schedule
  - add a combined parameter column
  - join these two columns
  - edit the size column to use width x height
  - change what the combined column is made of
  - move this column after Equipment Tag

# VERSION 2 (2026-11-01) - ADD_SCHEDULE_COMBINED_FIELD WAS MERGED INTO THIS
# CARD on the owner's instruction ("make sure there is no duplicate tools";
# "merge means ... all area need to be covered"), and is DEPRECATED. The same
# job - put a column on a schedule, read it back. What that card had and this
# one lacked is here now, its code carried whole: combined columns (parts
# with separators BETWEEN them, row 5b-1292; one unresolved part stops that
# column on that schedule, partMissing); editExisting, a column rebuilt in
# place with its heading, sort, filter and width kept; position, the one
# place a column is moved; columnNow read back; refusedWhy; notASchedule.
# Called with fieldNames alone, version 1 runs unchanged.
#
# THE SAFER RULE IN EACH CONFLICT IS KEPT. A position with no columnName, or
# a combined column with no heading, is refused whole before anything is
# written - that card's columnName was required, so it could not arise there.
#
# NOT CARRIED: nothing; no rule of that card is the opposite of one here.
# Its `refused` (schedule ids) is `refusedSchedules` here, because this
# card's `refused` is the sentence that stops the call.
#
# WHERE ITS OUTPUTS ARE NOW: added -> added (plain and combined together),
# edited -> edited, columnNow -> columnNow, partMissing -> partMissing,
# notASchedule -> notASchedule, refused -> refusedSchedules, refusedWhy ->
# refusedWhy. Its sentences moved here.


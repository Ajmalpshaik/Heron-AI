id: FRG-VIEW-034
semantic-identity: "add columns to these schedules, and say which ones could not be added and why"
kind: action
domain: revit.views
capability: ADD_SCHEDULE_FIELDS
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Adds named columns to every schedule handed in, and separates THREE OUTCOMES
  the version this was re-authored from ran together under one counter.

  Its own comment admitted the conflation - *"already present, or not addable to
  this schedule type"* - both landing in the same `notFound` tally as a genuine
  spelling mistake. Those are three different situations needing three different
  responses:

  | Outcome | What it means | What you do |
  |---|---|---|
  | `added` | the column is now there | nothing |
  | `alreadyPresent` | it was there before | nothing — **and this is not a failure** |
  | `notSchedulable` | that field cannot go on this schedule | pick a different field |
  | `unknownField` | no field of that name exists for this category | check the spelling — the real names come back |

  WHEN A NAME IS NOT FOUND, THE REAL NAMES ARE HANDED BACK. Schedulable fields
  are **category-specific and are not free text** - a name that works on a door
  schedule may not exist on a duct one. Nearly every miss is a spelling or a
  wrong-category assumption, and the list of what IS available is the answer to
  the question the caller is about to ask.

  A COLUMN IS NEVER ADDED TWICE. Two identical columns in a schedule is the
  same failure as two tags on one element: it looks plausible on screen and is
  wrong on the sheet.

  **VERSION 2 ADDS COMBINED COLUMNS, AND EDITS OR MOVES A COLUMN**
  (ADD_SCHEDULE_COMBINED_FIELD merged in): one column joining several
  parameters with a separator between each two - *"Type - Mark"* - a real
  field that follows the model; a part that does not resolve stops that
  column. With editExisting the column named is rebuilt where it stands, and
  position puts a column first, last, after or before another.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16), so a batch
  of columns across several schedules is one undo entry.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # The plain columns to add. VERSION 2: may be left out ("none") when a
    # combined column, an edit or a move is asked for instead.
    - name: fieldNames
      type: IList<string>
      source: request
      optional: true
      absent: none
    # VERSION 2, from ADD_SCHEDULE_COMBINED_FIELD. A combined column's heading
    # - or, with editExisting, the heading of the column already on the
    # schedule to edit or move (its field name when no heading matches). Left
    # out ("none"), no combined column, edit or move is made.
    - name: columnName
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 2. The parameters to join, in order, by the names the schedule
    # offers. Left out ("keep"), an edited column keeps its parts; a new
    # combined column needs them, and is refused without.
    - name: partFields
      type: IList<string>
      source: request
      optional: true
      absent: keep
    # VERSION 2. What goes BETWEEN the parts - the first entry between parts 1
    # and 2, the next between 2 and 3. N parts take N - 1 at most; fewer leave
    # nothing in the rest; more is refused. Nothing ever follows the last
    # part (row 5b-1292). Left out ("keep"): none on a new column, the old ones
    # on an edited one.
    - name: partSeparators
      type: IList<string>
      source: request
      optional: true
      absent: keep
    # VERSION 2. True: edit the column columnName names in place instead of
    # adding one. Absent binds false (row 5b-227).
    - name: editExisting
      type: bool
      source: request
      optional: true
    # VERSION 2. first | last | after <column> | before <column> | a column
    # number from 1, for the column columnName names. Left out ("keep"): a new
    # combined column last, an edited one where it is. With editExisting and
    # neither parts nor separators, the column is MOVED and nothing else
    # changes. Given with no columnName, refused.
    - name: position
      type: string
      source: request
      optional: true
      absent: keep
  provides:
    - name: added
      role: result
      type: int
    - name: alreadyPresent
      # Elements that were ALREADY in the state asked for, so there was
      # nothing to do. The evidence it looked, never a change it made
      # (D-52).
      role: accounting
      type: int
    - name: unknownField
      # Field names the category does not have. Given and unusable, never a
      # column it added (D-52).
      role: accounting
      type: IList<string>
    - name: availableFields
      # The fields that ARE schedulable here - the answer to the question the
      # caller is about to ask, and reference data rather than a finding. It
      # is filled in whether anything was added or not, so it must never read
      # as work (D-52).
      role: accounting
      type: IList<string>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string
    - name: edited
      # VERSION 2. Columns already on a schedule that were edited or moved,
      # each read back.
      role: result
      type: int
    - name: columnNow
      # VERSION 2. One line per combined column added or column edited: the
      # schedule, the heading, its place, and how Revit will draw it -
      # '[Width]x[Height]' - with what it was before an edit. Read back after
      # the change. ONE string, lines joined by "  ||  " (row 5b-1290).
      role: result
      type: string
    - name: partMissing
      # VERSION 2. Schedules where a part of the combined column did not
      # resolve to a parameter it can show - A PART THAT DOES NOT RESOLVE
      # STOPS THE WHOLE COLUMN, so nothing was added there. Given and
      # unusable (D-52).
      role: accounting
      type: IList<ElementId>
    - name: notASchedule
      # VERSION 2. Handed in but not a schedule, nor a schedule placed on a
      # sheet. A count of what it was GIVEN and could not use (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refusedSchedules
      # VERSION 2. Schedules the combined column, edit or move was refused
      # on, nothing changed there - ADD_SCHEDULE_COMBINED_FIELD's `refused`,
      # renamed because this card's `refused` is the sentence (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refusedWhy
      # VERSION 2. Those refusals, and a part that did not resolve, as
      # sentences: which schedule, why, and that nothing was changed on it.
      # One string, joined by "  ||  ". Never a thing it found (D-52).
      role: accounting
      type: string


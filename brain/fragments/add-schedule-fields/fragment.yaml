#                                           column moved
#   "add Length as the second column of the schedule"
#                                        -> here, VERSION 3: position 2 with no
#                                           columnName. SET_SCHEDULE_APPEARANCE
#                                           ranked first for it by nearness on
#                                           the n-gram backend (2026-11-01);
#                                           declared here, identity keeps it
#   "add the comments column after size" -> here, VERSION 3: position after Size
#   "put the schedule columns in this order Mark Size Length"
#                                        -> SET_SCHEDULE_FIELD_ORDER - a whole
#                                           or partial ORDER in one call. One
#                                           column moved stays here
#   "what is the size column made of"    -> REPORT_SCHEDULE_DEFINITION - a

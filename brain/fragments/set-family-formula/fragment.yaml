# VERSION 3 (2026-11-24) - REVIT'S REFUSAL COMES BACK AS `refused`, still
# DRAFT. Proving version 2 on Revit 2020 (session 29500, scratch family PX
# Box), "Neck Top + 10 mm" on Neck Top itself ended `fragment_threw` - the
# right words, leaving as an exception, which is how a crash looks - so the
# loop negative of NEEDS-CHECKING Group PX row PX5 failed. The formula and the
# regenerate now run in a SubTransaction rolled back on Revit's refusal, and
# the same words come back through `refused` and `findings`, nothing kept.
# FRAGMENT-ISSUES row 5b-2010. Nothing else changed.
#
# VERSION 4 (2026-11-24) - THE SET PATH HAS A COUNT, `formulaSet`, still
# DRAFT. Setting a formula, the card's main job, could not be signed: its only
# count result was `cleared`, false whenever a formula is set, and beside a
# count `heron_validate accept` does not count the sentences `formulaNow` and
# `valueNow` (D-51) - "POSITIVE EMPTY - every declared result came back zero

positive:
  - given: >
      a family with a type, the lengths Height = 250 and Neck Depth = 100, and a
      length Neck Top; parameterName "Neck Top", formula "Height + Neck Depth"
    expect: >
      formulaNow "Height + Neck Depth" and valueNow 350 mm - LOOKED AT in the
      Formula column of Family Types, with Neck Top greyed out there

  - given: the same family, parameterName "Neck Top", formula empty
    expect: >
      cleared true, the Formula column empty in Family Types, and Neck Top
      still reading 350 mm and editable again

  # VERSION 2 (row 5b-2001): an Integer and a Yes/No read back.
  - given: >
      the same family with an INSTANCE Integer parameter Blade Count and
      Height 250; parameterName "Blade Count", formula
      "rounddown((Height - 36 mm) / 45 mm)"
    expect: >
      valueNow "4" - a whole number, never empty - and the finding saying
      "it gives 4"; Family Types shows 4 for Blade Count

  - given: >
      an INSTANCE Yes/No parameter Show Blades; parameterName "Show Blades",
      formula "Height > 200 mm"
    expect: >
      valueNow "Yes" (Height is 250); then the formula "Height > 300 mm" gives
      "No" - Family Types showing the tick box ticked, then clear

negative:
  - given: formula 'Height + "Neck Depth"' (the name in quotes)
    expect: >
      refused naming "Neck Depth" and saying names are written bare - before
      Revit is asked, and the Formula column unchanged

  - given: a new family with the parameters added and NO type yet
    expect: >
      refused naming SET_FAMILY_TYPE_VALUES. Not Revit's bare "no valid family
      type", and nothing else in the family disturbed

  - given: formula "Neck Top + 10 mm" on Neck Top itself
    expect: >
      refused with Revit's own words about the loop - "Revit refused the
      formula ... a formula cannot use the parameter it sets" - as the card's
      `refused` output, NEVER fragment_threw (version 3); nothing kept, and
      formulaNow and valueNow what Neck Top held before the call

  - given: a project in front
    expect: notAFamily true and no formula set anywhere

  - given: >
      after the Blade Count case, formula 'rounddown(("Height" - 36 mm) / 45
      mm)' on Blade Count (a name in quotes)
    expect: >
      refused before Revit is asked, nothing changed, and on that refusal
      formulaNow still the first formula and valueNow still "4" - Blade
      Count's whole number read back, not empty (version 2)

second_route:
  - >
      Family Types, the same formula typed into the Formula column by hand in a
      copy of the family, and the value it gives compared with `valueNow`

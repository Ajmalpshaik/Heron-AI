semantic-identity: "change the revision description or date"

# VERSION 2, BACK TO DRAFT ON 2026-09-28, AND THE PROOF BLOCK IS KEPT.
# Version 1 found its revision by a `sequenceNumber` it was typed. Version 2 is
# handed ONE revision by the find before it (SELECT_BY_PARAMETER_VALUE on the
# Revisions category - by `Revision Sequence` when the number is what is
# known), so a stale number can no longer edit whichever revision now holds
# it, and a chat never leans on Revit's selection while other chats share the
# same Revit. It also gained show and numbering, `alreadyThat`, and a refusal
# that names an issued revision instead of trying and failing. The 2026-09-09
# proof's arrangement is still the one to re-prove from; its fingerprint no
# longer matches.
#
# VERSION 3, 2026-10-10, STILL DRAFT: SEVERAL REVISIONS IN ONE CALL. Seven
# "IFI - Issued for Information" revisions on a Revit 2020 job were issued,
# then un-issued and renumbered, through version 2 - a find and an edit per
# revision, fourteen calls a pass and seven undo entries - and the owner asked
# why it went one by one. Now the find hands in the set, `confirmCount` must
# equal the number it found, and the call is one undo entry, all or nothing,
# with the writes ordered so one revision's state cannot refuse another's
# (FRAGMENT-ISSUES row 5b-409). Version 2's unsigned Revit 2020 proof draft
# (fingerprint b928479162dc855d, 2026-10-10) is of the code this replaces.
kind: action
domain: revit.sheets
capability: EDIT_REVISION
version: 3
source: OFFICIAL
risk: MODIFY

purpose: >
  Changes one existing project revision - its description, date, issued to,
  issued by, show (cloud and tag, tag or none), numbering sequence, and the
  issued tick - every column of its row in Sheet Issues/Revisions.

  **ONE REVISION, HANDED IN BY A FIND.** Find it by Revision Sequence, the
  number the dialog shows, or by description; a find that brings back two is
  refused with both named, because descriptions repeat across a job - unless
  `confirmCount` says how many were found, and then every one changes in one
  call.

  **AN ISSUED REVISION IS LOCKED, AND THE REFUSAL NAMES IT.** Revit locks the
  description, date, issued to, issued by and numbering of an issued revision,
  so asking for any of them changes nothing and names the revision and the
  fields. `issueState=unissue` in the same call un-issues it first; show stays
  open, as it does in Revit. A numbering change that would renumber a later
  issued revision is refused the same way.

  **THE ISSUED TICK MOVES ONLY WHEN `issueState` SAYS SO** - "issue" after
  every other column, "unissue" before them.

  **EMPTY LEAVES A FIELD ALONE; <blank> WRITES AN EMPTY ONE.**

  **COMPARED FIRST, READ BACK AFTER.** A field already holding the value is
  named in `alreadyThat` and not written, so a repeat changes nothing and
  says so. A write that does not read back after another has gone in throws,
  and the whole call is rolled back.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # THE revisions, from the find before this - one, or several with
    # `confirmCount`.
    - name: elements
      type: IList<Element>
    # How many revisions the find brought back, typed to say every one is
    # meant. Blank is fine for ONE; for several it must equal the number found,
    # or nothing changes - so a find that catches twenty when seven were meant
    # edits none. SEND IT, BLANK OR NOT: the add-in refuses a request need
    # that arrives with no value, `optional` or not (FRAGMENT-ISSUES 5b-227).
    - name: confirmCount
      type: string
      source: request
    - name: description
      type: string
      source: request
    - name: revisionDate
      type: string
      source: request
    - name: issuedBy
      type: string
      source: request
    - name: issuedTo
      type: string
      source: request
    # The dialog's Show column: "cloud and tag", "tag" or "none".
    - name: show
      type: string
      source: request
    # 2022 on, a numbering sequence's name ("Numeric", "Custom"); 2020 and
    # 2021, "numeric", "alphanumeric" or "none".
    - name: numbering
      type: string
      source: request
    # "issue" | "unissue" | "" to leave alone.
    - name: issueState
      type: string
      source: request
  provides:
    - name: changed
      # Each column that moved, before -> after as READ BACK. A string, so
      # the reply prints every one. With several revisions, each one's line
      # starts "Seq. N 'description':" and the lines are apart by " || ".
      role: result
      type: string
    - name: alreadyThat
      # Columns that already held the value asked for, and were not written.
      # What a second identical run answers - the prior state, never a change
      # (D-52). Per revision, as `changed`.
      role: accounting
      type: string
    - name: nowIssued
      # Whether the revision is issued after the call - with several, whether
      # EVERY one is. State, not work.
      role: accounting
      type: bool
    - name: revisionName
      # Which revision was edited, "Seq. N 'description'" as it stood; with
      # several, "N revisions: " and each of them.
      role: accounting
      type: string
    - name: findings
      # The whole row of every revision READ BACK after the call, apart by
      # " || ".
      type: string
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string


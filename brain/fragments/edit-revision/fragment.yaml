semantic-identity: "change the revision description or date"

# VERSION 2, BACK TO DRAFT ON 2026-09-28, AND THE PROOF BLOCK IS KEPT.
# Version 1 found its revision by a `sequenceNumber` it was typed. Version 2 is
# handed ONE revision by the find before it (SELECT_BY_PARAMETER_VALUE on the
# Revisions category - by `Revision Sequence` when the number is what is
# known), so a stale number can no longer edit whichever revision now holds
# it, and a chat never leans on Revit's selection while other chats share the
# same Revit. It also gained show and numbering, `alreadyThat`, and a refusal
# that names an issued revision instead of trying and failing. The 2026-09-09
# proof's arrangement is still the one to re-prove from; its fingerprint no
# longer matches.
kind: action
domain: revit.sheets
capability: EDIT_REVISION
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Changes one existing project revision - its description, date, issued to,
  issued by, show (cloud and tag, tag or none), numbering sequence, and the
  issued tick - every column of its row in Sheet Issues/Revisions.

  **ONE REVISION, HANDED IN BY A FIND.** Find it by Revision Sequence, the
  number the dialog shows, or by description; a find that brings back two is
  refused with both named, because descriptions repeat across a job.

  **AN ISSUED REVISION IS LOCKED, AND THE REFUSAL NAMES IT.** Revit locks the
  description, date, issued to, issued by and numbering of an issued revision,
  so asking for any of them changes nothing and names the revision and the
  fields. `issueState=unissue` in the same call un-issues it first; show stays
  open, as it does in Revit.

  **THE ISSUED TICK MOVES ONLY WHEN `issueState` SAYS SO** - "issue" after
  every other column, "unissue" before them.

  **EMPTY LEAVES A FIELD ALONE; <blank> WRITES AN EMPTY ONE.**

  **COMPARED FIRST, READ BACK AFTER.** A field already holding the value is
  named in `alreadyThat` and not written, so a repeat changes nothing and
  says so. A write that does not read back after another has gone in throws,
  and the whole call is rolled back.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # THE revision, from the find before this - exactly one.
    - name: elements
      type: IList<Element>
    - name: description
      type: string
      source: request
    - name: revisionDate
      type: string
      source: request
    - name: issuedBy
      type: string
      source: request
    - name: issuedTo
      type: string
      source: request
    # The dialog's Show column: "cloud and tag", "tag" or "none".
    - name: show
      type: string
      source: request
    # 2022 on, a numbering sequence's name ("Numeric", "Custom"); 2020 and
    # 2021, "numeric", "alphanumeric" or "none".
    - name: numbering
      type: string
      source: request
    # "issue" | "unissue" | "" to leave alone.
    - name: issueState
      type: string
      source: request
  provides:
    - name: changed
      # Each column that moved, before -> after as READ BACK. A string, so
      # the reply prints every one.
      role: result
      type: string
    - name: alreadyThat
      # Columns that already held the value asked for, and were not written.
      # What a second identical run answers - the prior state, never a change
      # (D-52).
      role: accounting
      type: string
    - name: nowIssued
      # Whether the revision is issued after the call. State, not work.
      role: accounting
      type: bool
    - name: revisionName
      # Which revision was edited, "Seq. N 'description'" as it stood.
      role: accounting
      type: string
    - name: findings
      # The whole row READ BACK after the call.
      type: string
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string


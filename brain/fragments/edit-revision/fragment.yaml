runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. A revision's description, date, issued
  by and to, issued flag, show (`Visibility`) and sequence number are unchanged
  2020 to 2027 - read with tools/api-surface --members on each release. The
  date is a plain string on the revision, not a date type - Revit stores
  whatever the office writes, which is why nothing here parses it.

  THE NUMBERING PARTS AT 2022: `Revision.RevisionNumberingSequenceId` from
  2022, `Revision.NumberType` 2020 to 2022 and gone from 2023. Both are reached
  by name, because the add-in compiles fragments with no release symbol
  defined. Only the 2022+ route has met a model.

# ROUTING - the same rows are in the fragments named here.
#
#   "change the revision date"           -> here
#   "mark that revision as issued"       -> here
#   "set issued to"                      -> here, fed by
#                                           SELECT_BY_PARAMETER_VALUE on the
#                                           Revisions category
#   "tick issued"                        -> here, issueState=issue; unissue
#                                           takes the tick off
#   "show only the tag for revision 2"   -> here, show=tag
#   "move revision 2 up"                 -> REORDER_REVISION
#   "merge revision 2 down"              -> MERGE_REVISION
#   "make a new revision"                -> CREATE_REVISION
#   "list the revisions"                 -> LIST_REVISIONS, which is where the
#                                           sequence number comes from
#   "delete that revision"               -> DELETE_REVISION, which renumbers
#                                           every later one and needs confirm
#   "put that revision on these sheets"  -> SET_SHEET_REVISIONS
#   "cloud this change"                  -> ADD_REVISION_CLOUD

utterances:
  - change the revision description
  - fix the revision date
  - mark the revision as issued
  - update who the revision was issued by
  - change the revision date
  - set issued to
  - tick issued
  - show only the tag for revision 2

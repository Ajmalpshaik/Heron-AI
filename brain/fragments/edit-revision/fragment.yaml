id: FRG-SHT-016
semantic-identity: "change the revision description or date"
kind: action
domain: revit.sheets
capability: EDIT_REVISION
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Changes an existing project revision - its description, date, who it was
  issued by and to, whether it is issued, and how its clouds and tags show.

  **IT IS FOUND BY SEQUENCE NUMBER, NOT BY DESCRIPTION.** The sequence number
  is what Revit shows in its own revision dialog and what every sheet's
  revision schedule sorts on. Descriptions repeat across a job - two issues
  called "For Construction" is normal - so matching on one would edit whichever
  came first.

  **ISSUING A REVISION LOCKS IT.** Once issued, Revit stops most edits to it
  and to the clouds that carry it. Setting that flag is therefore the one field
  here that changes what can be done next, and it is reported separately for
  that reason.

  **ANY FIELD LEFT EMPTY IS NOT TOUCHED.** One call fixes a date without
  rewriting a description somebody worded carefully.

  **EVERY FIELD IS READ BACK.** A revision that refuses an edit - usually
  because it is issued - returns from the call and keeps its old value.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: sequenceNumber
      type: int
      source: request
    - name: description
      type: string
      source: request
    - name: revisionDate
      type: string
      source: request
    - name: issuedBy
      type: string
      source: request
    - name: issuedTo
      type: string
      source: request
    # "issue" | "unissue" | "" to leave alone.
    - name: issueState
      type: string
      source: request
  provides:
    - name: changed
      type: IList<string>
    - name: nowIssued
      type: bool
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string


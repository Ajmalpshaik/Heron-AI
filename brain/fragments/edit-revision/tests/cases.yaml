# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: >
      "heron ai bulding", 2026-09-28 - Seq. 2 found by SELECT_BY_PARAMETER_VALUE
      (Revision Description equals Issued for Review, exactly 1), issuedTo
      "Ajmal PS", every other value empty
    expect: >
      `changed` "issued to (blank) -> 'Ajmal PS'", and a SECOND identical run
      `changed` empty with `alreadyThat` "issued to 'Ajmal PS'". Kept on the
      working model at the owner's request

  - given: revision 3 with a wrong date, a new date given
    expect: >
      the date changed and "date" in `changed`. Open Manage - Sheet Issues and
      Revisions in Revit; that dialog is what the sheets read from

  - given: a description and a date together
    expect: >
      both changed and both listed

  - given: issueState "issue"
    expect: >
      `nowIssued` true and "issued" listed. That is a decision rather than a
      correction, which is why it is reported on its own

  - given: only a description given
    expect: >
      the date, issued-by and issued-to untouched

negative:
  - given: a find by description that brought back two revisions both described "For Construction"
    expect: >
      `refused` naming both by sequence number and NOTHING edited. Editing
      whichever came first would be silent, on a document about to go out

  - given: a revision that is already ISSUED, issuedTo given
    expect: >
      `refused` naming the revision and the locked field, `changed` empty,
      nothing attempted. With issueState=unissue in the same call it is
      un-issued first and then edited; show alone is allowed, as in Revit

  - given: >
      numbering=Custom on an unissued Seq. 1 while an ISSUED Seq. 2 is on the
      same sequence (tools/jobs/sheet-issues-revisions-renumber-2026-09-28.yaml)
    expect: >
      `refused` naming Seq. 2, whose printed number the move would change;
      nothing changed. With Seq. 2 unissued the same call is `changed`

  - given: a find that brought back no revision
    expect: >
      `refused` saying so and nothing changed

  - given: every field empty
    expect: >
      nothing changed and `refused` saying nothing was asked for - not a silent
      success

second_route:
  - >
    open Manage - Sheet Issues and Revisions in Revit and read the row, then
    look at a sheet's revision schedule - that is what the drawing prints

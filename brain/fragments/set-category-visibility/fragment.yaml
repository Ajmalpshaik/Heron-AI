heron-agent: HERON-REVIT-VIE-013
heron-step: 14
heron-status: DRAFT
heron-since: 0.1.0
heron-layer: brain

id: FRG-VIEW-004
semantic-identity: "turn whole categories on or off in one view"
kind: action
domain: revit.views
capability: SET_CATEGORY_VISIBILITY
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Turns entire categories on or off in one view - the visibility column in
  Visibility/Graphics, not a per-element hide.

  **This is a different job from hiding elements, and confusing the two is the
  mistake worth guarding against.** Hiding elements affects the ones handed to
  it and nothing else. This affects the CATEGORY: every instance in that view,
  including everything modelled after today. It is a saved view setting, it
  survives closing the model, and it shows on the printed sheet.

  It is what a grayout actually needs - rebar off, links quietened - and it is
  the reason that job is a view setting rather than hundreds of element hides.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: view
      type: View
      source: request
    - name: categories
      type: IList<Category>
      source: request
    - name: visible
      type: bool
      source: request
  provides:
    - name: changed
      role: result
      type: int
    - name: notControllable
      # Categories this view will not let be switched. The evidence it looked
      # and could not, never a thing it did (D-52).
      role: accounting
      type: IList<string>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Category.get_AllowsVisibilityControl`
  and `View.SetCategoryHidden` are unchanged 2020 to 2027. Categories arrive as
  objects rather than as ids or integers, so nothing here builds an `ElementId`
  from an int.

# ROUTING - repeated in SET_VIEW_WORKSET_VISIBILITY and HIDE_ELEMENTS.
#
#   "turn off the ceilings in this view"  -> here - a CATEGORY, which is what
#                                           a thing IS
#   "turn off this workset in this view"  -> SET_VIEW_WORKSET_VISIBILITY - a
#                                           workset is who OWNS it: everything
#                                           one team modelled, whatever
#                                           category it happens to be
#   "hide these three ducts"              -> HIDE_ELEMENTS - the ones handed
#                                           in, and nothing modelled tomorrow
#   "which categories are turned off in this view" ->
#                                        REPORT_CATEGORY_VISIBILITY - a READ.
#                                        A question about a drawing must not
#                                        be answered by the fragment that
#                                        switches things off
utterances:
  - turn off the rebar in this view
  - switch the ceilings off
  - I do not want to see furniture here
  - hide the whole category
  - turn the structure back on

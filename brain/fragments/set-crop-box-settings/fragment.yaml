id: FRG-VIEW-055
semantic-identity: "switch crop, crop line and annotation crop on or off across views"
kind: action
domain: revit.views
capability: SET_CROP_BOX_SETTINGS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Switches three crop flags across many views at once - cropping on or off, the
  crop boundary LINE shown or hidden, and the ANNOTATION crop on or off. Flags
  only; it never resizes anything.

  **THE ANNOTATION CROP IS THE HALF NOTHING ELSE HERE COVERS, AND IT IS THE ONE
  THAT SPOILS SHEETS.** The model crop trims geometry. Tags, dimensions and text
  keep printing outside it until the annotation crop is on too - which is why a
  neatly cropped plan still arrives on the sheet with a tag hanging over the
  title block.

  **IT IS NOT `SET_VIEW_CROP`, and the two compose rather than compete.** That
  one SIZES a crop around a set of elements, in one view. This one flips flags,
  across a whole drawing set. Turn cropping on here, size it there.

  **THE ANNOTATION CROP DOES NOTHING WHILE CROPPING IS OFF.** Revit ignores it.
  It is still set if asked - refusing would be worse - but the report says so,
  because otherwise it reads as the call having failed.

  **EACH FLAG IS OPTIONAL AND UNSET MEANS LEAVE ALONE.** A batch that forces
  three settings when somebody asked about one is how a drawing set loses its
  crop boundaries overnight.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: views
      type: IList<View>
      source: request
    - name: cropActive
      type: string
      source: request
    - name: cropVisible
      type: string
      source: request
    - name: annotationCrop
      type: string
      source: request
  provides:
    - name: changed
      role: result
      type: int
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<string>

proof:
  date: '2026-09-13'
  by: Ajmal PS
  model: test projject (3,490 elements), Revit 2024, session 40932
  positive_case: run as it would normally be run - run inside a transaction, and Revit reported
    the transaction group ROLLED BACK afterwards. returned changed 2, refused 0 item(s), wantAnnotation
    0, wantCrop 1, wantLine 1, wanted Func`2. inputs came views as given (2); cropActive as
    given; cropVisible as given; annotationCrop as given. on test projject
  negative_case: run with views=1 - Mech, 2 - Mech, cropActive=, cropVisible=, annotationCrop=
    instead - chosen because it should not contain what this fragment reports - run inside
    a transaction, and Revit reported the transaction group ROLLED BACK afterwards. returned
    changed 0, refused 1 item(s) [all three flags were left empty - nothing to change], wantAnnotation
    -1, wantCrop -1, wantLine -1, wanted Func`2. inputs came views as given (2); cropActive
    as given; cropVisible as given; annotationCrop as given. on test projject
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  caveat: >-
    THE CASE ITS OWN FILE CALLS FIRST WAS RUN SEPARATELY AND HELD. tests/cases.yaml asks for
    annotationCrop 'on' on a view where cropping is OFF, and expects the flag SET and a line
    saying Revit ignores it until cropping is on - because 'silence here reads as the call
    having failed, and somebody then sets it again and again'. Measured 2026-09-13 on '1 -
    Plumbing' with cropActive off and annotationCrop on: changed 1, and refused carrying "'1 -
    Plumbing': the annotation crop was set, but cropping is...". Both halves. It is not an
    emptiness case, so it cannot be a D-30 leg; the leg used is all three flags left empty,

compatibility-note: >
  One implementation for every release. `View.CropBoxActive`,
  `View.CropBoxVisible` and `BuiltInParameter.VIEWER_ANNOTATION_CROP_ACTIVE` are
  present 2020 through 2027 - read off the reference assemblies at both ends.
  Each flag arrives as TEXT - "on", "off" or empty for leave-alone - rather than
  as a nullable boolean, because a tri-state that a caller can omit is exactly
  what a batch of this shape needs and text says what it means at the edge.

# ROUTING - repeated in SET_VIEW_CROP and SET_VIEW_CROP_TO_SHAPE.
#
#   "turn the crop on for all these views" -> here
#   "the tags are printing outside the crop" -> here - the ANNOTATION crop, which
#                                           is a separate flag and is the usual
#                                           cause
#   "hide the crop boundary lines"       -> here
#   "just show me this part of the plan" -> SET_VIEW_CROP - it SIZES the crop
#                                           round some elements, one view
#   "crop the view to follow the room shape" -> SET_VIEW_CROP_TO_SHAPE

utterances:
  - turn the crop on for all these views
  - the tags are printing outside the crop
  - hide the crop boundary lines
  - switch the annotation crop on
  - turn cropping off on these views

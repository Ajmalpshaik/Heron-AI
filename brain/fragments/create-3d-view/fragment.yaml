compatibility-note: >
  One implementation for every release. `View3D.CreateIsometric` and
  `View.Name` are unchanged 2020 to 2027, and the view family type arrives as
  an ElementId object taken from a live element.

# ROUTING - repeated in DUPLICATE_VIEW and SET_VIEW_SECTION_BOX.
#
#   "make a new 3d view"          -> here
#   "duplicate this view"         -> DUPLICATE_VIEW - keeps the settings
#   "make one like that one"      -> DUPLICATE_VIEW, not here
#   "box it round the clash"      -> SET_VIEW_SECTION_BOX, on the view this made
#
# CREATE AND DUPLICATE ARE ASKED FOR IN ONE SENTENCE. A new view carries the
# type's defaults and nothing of the view somebody was looking at, which is a
# surprise if they meant "like that one".

utterances:
  - make a new 3d view
  - create a 3d view
  - I need a fresh 3d view
  - give me a coordination view
  - new isometric view

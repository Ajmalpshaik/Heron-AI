id: FRG-VIEW-099
semantic-identity: "put the Level 2 ceiling plan on screen"
kind: action
domain: revit.views
capability: OPEN_VIEW
version: 2
source: OFFICIAL
risk: EXECUTE

purpose: >
  Opens an EXISTING view in the active project and makes it the one on screen.
  It changes nothing in the model and it creates nothing.

  **IT OPENS, IT NEVER CREATES.** A view name that does not exist is a refusal,
  not an invitation to make one. Creating a view because the name was mistyped
  would leave a stray view in somebody's project for every typo, and CREATE_PLAN_VIEW
  and its siblings are how a view is meant to come into being.

  **THE CHANGE IS REQUESTED, NOT CONFIRMED, AND THIS FRAGMENT WILL NOT PRETEND
  OTHERWISE.** `UIDocument.RequestViewChange` is a request: Revit performs it when
  the current API context ends, which is after this fragment has finished. Reading
  `ActiveView` back here would report the view from BEFORE the change and call it
  proof. What is on screen afterwards is checked afterwards.

  **A VIEW TEMPLATE IS NOT A VIEW YOU CAN OPEN**, and it is refused by name rather
  than by failing obscurely. Templates appear in the same list and are the most
  likely wrong answer to *"open the ceiling plan"*.

  **ALREADY BEING THERE IS A SUCCESS.** Asking for the view already on screen
  returns success having moved nothing.

  **FINDING IS A DIFFERENT JOB.** This takes a name and opens it. FIND_VIEWS is
  what answers *"which views are there"*, and it is what to run first when the
  name is not already known.

  Opens no transaction and needs none: it acts on the session, not the building.
  That is why it is EXECUTE rather than MODIFY.

  **VERSION 2: IT RUNS WITH NO TRANSACTION OPEN, BECAUSE REVIT CHANGES NO VIEW
  INSIDE ONE.** Every write fragment runs inside a transaction, and Revit
  refuses `RequestViewChange` there: *"Cannot change the active view of a
  modifiable document (with a transaction curently open)"* (Revit's spelling).
  So version 1 was refused for EVERY view through revit_change - on 2026-10-13
  a sheet in Project2 and a 3D view in Project1 - and only its "already on
  screen" answer ever worked there. Measured 2026-10-13 on Project1, Revit
  2020 (FRAGMENT-ISSUES 5b-455): with no transaction open the same call opens
  the view, a TransactionGroup alone included. This card declares the ambient
  `editScopeFailures` need, and the add-in runs it inside the job's group with
  no transaction open (D-112, widened by D-115). Revit's own words now come
  FIRST in a refusal, because a finding is shown cut short.

  **TWO VIEWS SHARING A NAME ARE TOLD APART THE LIBRARY'S WAY** -
  "FloorPlan: Level 1", "DrawingSheet: Ground Floor Plan", the spelling every
  fragment taking a view accepts. The plain name is tried first and wins when
  it names one openable view; the refusal for two lists the spellings to use.

contract:
  needs:
    - name: uidoc
      type: UIDocument
    - name: doc
      type: Document
    - name: editScopeFailures
      # NEVER USED BY THE CODE. Declaring it is the switch that has the add-in
      # run this inside the job's TransactionGroup with NO transaction open
      # (D-112, D-115) - Revit refuses a view change inside one (5b-455). It
      # also refuses this fragment on the read path, which revit_read already
      # does for anything declared EXECUTE.
      type: IFailuresPreprocessor
      source: ambient
    - name: viewName
      # The view's name as the Project Browser shows it, or "Kind: name" when
      # two views share it - "FloorPlan: Level 1", "DrawingSheet: Level 1".
      type: string
      source: request
  provides:
    - name: opened
      role: result
      type: bool
    - name: viewBefore
      # Which view was in front BEFORE this ran, so the answer can say what
      # changed. Filled in identically whether anything opened or not.
      role: accounting
      type: string
    - name: requestedView
      # The name that was asked for, echoed back. The caller's own words, not
      # a thing this fragment found.
      role: accounting
      type: string
    - name: matches
      # Everything the name matched, carried so a refusal can say WHY -
      # "[view template, cannot be opened]". It is filled in identically
      # whether the view opened or not, so it is the evidence it looked
      # rather than the answer (D-52).
      role: accounting
      type: IList<string>
    - name: findings
      type: IList<string>

# THIS PROOF IS OF VERSION 1, kept for the record. Its positive case was the

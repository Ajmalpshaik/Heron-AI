tests: tests/

compatibility-note: >
  One implementation for every release. Revit 2020 measured on 2026-10-13
  refusing RequestViewChange inside a transaction and accepting it with none
  open; the other releases are not measured. `UIDocument.RequestViewChange(View)`,
  `UIDocument.ActiveView`, `View.IsTemplate`, `View.ViewType` and
  `FilteredElementCollector` are unchanged 2020 to 2027 - checked by compiling
  this fragment against the reference assemblies for all eight.

# ROUTING - cross-referenced in FIND_VIEWS, SWITCH_ACTIVE_PROJECT and ZOOM_TO_ELEMENTS.
#
#   "open the Level 2 ceiling plan"    -> here
#   "go to the section"                -> here
#   "show me that sheet"               -> here, when a SHEET is named. A sheet is
#                                         a view and opens the same way - by
#                                         its name, or "DrawingSheet: <name>"
#                                         when a view shares it. Not by its
#                                         number, nor as "Sheet: A101 - name".
#                                         Version 1 was refused by Revit for
#                                         EVERY view through revit_change, a
#                                         sheet included (5b-456)
#   "which views are there"            -> FIND_VIEWS. Run it first when the exact
#                                         name is not known - this one needs the
#                                         name
#   "switch to the other project"      -> SWITCH_ACTIVE_PROJECT. This one moves
#                                         inside the project already active
#   "take me to these elements"        -> ZOOM_TO_ELEMENTS, which lets Revit pick
#                                         a view that can SEE them rather than
#                                         opening one you named
#   "make a new plan view"             -> CREATE_PLAN_VIEW. This one never creates

utterances:
  - open the Level 2 ceiling plan
  - go to that view
  - switch to the section view
  - put the sheet on screen
  - open view by name
  # ADDED 2026-10-09, row 5b-387. The routing table above claims these
  # sentences, and a comment is not indexed, so ranking decided: "go to the
  # section": CREATE_SECTION_VIEW answered it on both backends; "show me that
  # sheet": LIST_SHEETS answered it on both backends.
  - go to the section
  - show me that sheet

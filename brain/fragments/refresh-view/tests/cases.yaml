positive:
  - given: >
      a plan on screen, a parameter changed on a visible element through another
      fragment, and the tag still showing the old value, on Revit 2024
    expect: >
      the tag showing the NEW value after this runs - watched on screen, which is
      the only place this fragment's effect exists. Both flags true

negative:
  - given: a run with no UI document
    expect: >
      `regenerated` true, `redrawn` FALSE, and a finding saying there is no
      screen. Reporting both as true here would claim something that did not
      happen

  - given: a run with a transaction left open
    expect: >
      Revit refuses the regenerate and the finding says what that usually means.
      Worth arranging because it is the real-world cause

  - given: a model where nothing has changed
    expect: >
      both true and nothing visibly different. Harmless, and worth confirming it
      is harmless rather than assuming

second_route:
  - >
      the same change made and the view flicked away from and back to by hand,
      which forces Revit's own redraw, and the two screens compared

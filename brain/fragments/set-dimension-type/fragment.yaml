compatibility-note: >
  One implementation for every release, no #if. DimensionType, StyleType,
  GetUnitsFormatOptions and SetUnitsFormatOptions(FormatOptions),
  ElementType.Duplicate(string) and FamilyName, the FormatOptions(FormatOptions)
  copy constructor, UseDefault, Accuracy and IsValidAccuracy(double),
  Parameter.Set(double / int / string / ElementId), IsReadOnly and
  Definition.Name, and the parameters REPORT_DIMENSION_TYPES reads plus
  ARROW_TYPE are present 2020 through 2027 - read off the shipped RevitAPI.dll
  for all eight with tools/api-surface --members on 2026-11-02. The units
  format's unit and symbol go by reflection, as SET_PROJECT_UNITS crosses the
  2021 units change: GetSpecTypeId, UnitUtils.GetValidUnits(ForgeTypeId),
  FormatOptions.GetValidSymbols(ForgeTypeId), SetUnitTypeId and
  SetSymbolTypeId where DimensionType.GetSpecTypeId exists (2021 to 2027);
  the UnitType property, UnitUtils.GetValidDisplayUnits(UnitType),
  FormatOptions.GetValidUnitSymbols(DisplayUnitType) and the DisplayUnits and
  UnitSymbol setters on 2020. Sizes are written in Revit's internal feet from
  millimetres by 304.8 (D-20).

# ROUTING - rows for these sentences are in REPORT_DIMENSION_TYPES too.
#
#   "make a new linear dimension type called 2.5mm Arial from Linear - 3mm
#    Arial"                                -> here, duplicateAs 2.5mm Arial
#   "set the text size of dimension type X to 2.5 mm"
#                                          -> here, changes Text Size=2.5
#   "change the tick mark of dimension type X to Diagonal 3mm"
#                                          -> here, Tick Mark=Diagonal 3mm
#   "set dimension type X units to millimetres with no decimals"
#                                          -> here, Units Format=Millimeters,
#                                             0 decimal places
#   "what dimension types are in this project"
#                                          -> REPORT_DIMENSION_TYPES, the read
#   "change the label text height to 5 mm" -> SET_TEXT_TYPE - a text type
#   "add a dimension between these"        -> CREATE_DIMENSION - draws a
#                                             dimension; the type is not edited
#   "swap them to a different type"        -> CHANGE_ELEMENT_TYPE - dimensions
#                                             onto a type that exists already
#   "set the project length units to millimeters"
#                                          -> SET_PROJECT_UNITS - the
#                                             project's, not a type's

# The modeller's words, 2026-11-02, with X as he wrote it.
utterances:
  - make a new linear dimension type called 2.5mm Arial from Linear - 3mm Arial
  - set the text size of dimension type X to 2.5 mm
  - change the tick mark of dimension type X to Diagonal 3mm
  - set dimension type X units to millimetres with no decimals

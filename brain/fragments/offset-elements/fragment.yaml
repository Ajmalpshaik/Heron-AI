compatibility-note: >
  One implementation for every release. `Curve.CreateOffset` and assigning a
  `LocationCurve.Curve` are unchanged 2020 to 2027, and the distance arrives in
  internal feet with no units call.

# TRAP - OBSERVED ELSEWHERE, NOT YET PROVEN HERE. Added 2026-09-23.
#
# Two things another tool saw on real models, mostly on Revit 2020:
#
#   1. Rewriting a run's curve DELETED the takeoffs on it and left their
#      branches orphaned - while the terminal at the end of each branch still
#      read as connected, because it is joined to its own branch and the
#      branch no longer reaches the main. This fragment rewrites the curve.
#      Its purpose already says the run comes apart at its joints; a takeoff
#      deleted part way along is worse, because nothing is left to rejoin.
#   2. Two pieces reconnected PLAIN - connector to connector, nothing between
#      - later MERGED into one duct. A UNION FITTING between them kept them
#      two. That matters to the "reconnect afterwards" this card advises.
#
# Neither has been reproduced here. A NOTE ONLY - the fragment is PROVEN, and
# a change to its code would make the proof stale. After offsetting a run that
# carries takeoffs, look at each one, and do not take a terminal reading
# "connected" as the answer. NEEDS-CHECKING AJ3.

# ROUTING - repeated in SPLIT_MEP_RUN and MOVE_ELEMENTS.
#
#   "move it 200 across"        -> here - a shift perpendicular to the run
#   "offset these ducts"        -> here
#   "split this duct"           -> SPLIT_MEP_RUN. Cutting a run in two, not
#                                  shifting it sideways. Before SPLIT_MEP_RUN
#                                  existed, "split this duct at the wall"
#                                  resolved HERE - a confident answer that
#                                  moves the duct instead of cutting it
#   "move these up 200"         -> MOVE_ELEMENTS - a named direction

# SENTENCES ADDED 2026-09-01 BECAUSE THE ROUTING TABLE ABOVE ALREADY CLAIMED
# THEM. A routing table is a COMMENT and comments are not indexed - the search
# reads semantic-identity, the utterances, the capability, the domain and the
# purpose, and nothing else. So a table saying "-> here" recorded a decision
# that retrieval could not act on, and these resolved elsewhere.

utterances:
  - offset these ducts
  - run another duct parallel to this
  - move the pipe over 300
  - offset it sideways
  - shift the run off the wall
  - put it parallel
  - move it 200 across

id: FRG-GEO-011
semantic-identity: "shift each linear run sideways by a perpendicular distance"
kind: action
domain: revit.geometry
capability: OFFSET_ELEMENTS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Moves each linear run sideways by a perpendicular distance, in plan - a
  parallel duct beside an existing one, a pipe moved clear of a wall. Unlike a
  plain move it follows the run: an already-curved run stays parallel to itself
  rather than being translated.

  **Offsetting a connected MEP run breaks its connections.** The geometry moves
  and the fittings do not follow, so the run comes apart at every joint. That is
  Revit's behaviour rather than this fragment's, and the answer is to reconnect
  afterwards or to offset the whole run including its fittings.

  In place only. A parallel COPY is COPY_ELEMENTS followed by this - which is
  the composition working, and is why there is no copy mode here.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: elements
      type: IList<Element>
    - name: distance
      type: double
      source: request
  provides:
    - name: offset
      type: int
    - name: notLinear
      # Handed in but not linear runs, so there was nothing here to act on. A
      # count of what it was GIVEN and could not use, never a thing it found
      # (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>


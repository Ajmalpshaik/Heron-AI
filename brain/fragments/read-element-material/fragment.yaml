    materials 0 entry(ies), noMaterial 28 item(s) [1383647, 1383653, 1384651, ...], volumeM3
    0 entry(ies). inputs came elements from the selection (28). on Snowdon Towers Sample HVAC
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: ee294a3180973a28

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Element.GetMaterialIds(bool)` and
  `Element.GetMaterialVolume(ElementId)` are unchanged 2020 to 2027. Cubic feet
  to cubic metres is arithmetic (D-20).

# ROUTING - repeated in DESCRIBE_ELEMENTS and MEASURE_ELEMENT_VOLUME.
#
#   "what material is this"        -> here
#   "what is this wall made of"    -> REPORT_COMPOUND_STRUCTURE - the LAYERS
#                                     of the type, which is where a wall's
#                                     materials and thicknesses actually live
#   "what is this element"         -> DESCRIBE_ELEMENTS - category and type
#   "what is the volume"           -> MEASURE_ELEMENT_VOLUME - the whole solid,
#                                     regardless of what it is made of
#   "how much concrete"            -> here, which splits it BY MATERIAL
#
# THE WHOLE VOLUME AND THE VOLUME PER MATERIAL ARE DIFFERENT TAKEOFFS. A wall's
# total volume is one number; its concrete, insulation and board are three.
#   "change the material on these"   -> REPLACE_MATERIAL - a write, and this
#                                       one only reads
#   "make a new material"            -> CREATE_MATERIAL

# SENTENCES ADDED 2026-09-01 BECAUSE THE ROUTING TABLE ABOVE ALREADY CLAIMED
# THEM. A routing table is a COMMENT and comments are not indexed - the search
# reads semantic-identity, the utterances, the capability, the domain and the
# purpose, and nothing else. So a table saying "-> here" recorded a decision
# that retrieval could not act on, and these resolved elsewhere.

utterances:
  - what material is this
  - what is it made of
  - how much concrete is there
  - what are these made of
  - material takeoff for these
  - how much concrete

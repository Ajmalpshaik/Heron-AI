compatibility-note: >
  One implementation for every release. `Element.LookupParameter`,
  `Parameter.StorageType`, `AsString`, `AsValueString`, `AsInteger` and
  `AsElementId` are unchanged 2020 through 2027. Nothing here constructs an
  ElementId or touches a units API.

# THE PARAMETER IS LOOKED UP BY THE NAME ON SCREEN, which is what the user says.
# An element that simply does not carry that parameter is NOT a blank - it is a
# different answer, and it is reported separately. Mixing the two would let
# "none of these have a Mark parameter at all" read as "none of them are
# duplicated", which is a clean bill of health for a question never asked.

# ROUTING - repeated in FIND_DUPLICATE_ELEMENTS and RENUMBER_SEQUENTIAL.
#
#   "two doors have the same mark"    -> here
#   "check for duplicate numbers"     -> here
#   "are any room numbers repeated"   -> here
#   "duplicate marks"                 -> here
#   "there are two elements on top of
#    each other"                      -> FIND_DUPLICATE_ELEMENTS - duplicate
#                                       GEOMETRY, a different defect entirely
#   "delete the duplicates"           -> FIND_DUPLICATE_ELEMENTS finds them;
#                                       DELETE_ELEMENTS removes them. NOTHING
#                                       here deletes anything
#   "renumber them in order"          -> RENUMBER_SEQUENTIAL - the fix, once
#                                       this has said which ones clash

utterances:
  - two doors have the same mark
  - check for duplicate marks
  - are any room numbers repeated
  - find duplicate numbers
  - the same tag is used twice
  - check the marks are unique

# VERSION 2 (2026-11-11) - A NAME TWO PARAMETERS SHARE IS NEVER READ, and back
# to DRAFT. Version 1 was PROVEN on 2026-09-08 (the proof block below, kept as
# the record of what it proved). Its C# moved, so it is DRAFT again until
# NEEDS-CHECKING Group NK, NK8, is run (D-30). D-54 s3 and FRAGMENT-ISSUES row
# 5b-203: version 1 took `LookupParameter`'s first match, which Autodesk's
# reference calls random when two parameters on one element share the name. An
# element carrying the name twice is now counted in `ambiguous` and named in
# findings - never read, never compared, never called unique. Every other
# element answers exactly as version 1 answered. Written here and not in
# `purpose`: the purpose is routing text. A read: it still answers through
# revit_read while DRAFT, and says DRAFT (D-117 item 4).

purpose: >
  Finds elements that share the SAME value in one named parameter - two doors
  both marked D-101, two rooms numbered 05, two pieces of equipment with the
  same tag. Read-only; it moves nothing and renumbers nothing.

  **This is duplicate DATA, and FIND_DUPLICATE_ELEMENTS is duplicate GEOMETRY.**
  Two elements stacked in the same place is a modelling accident. Two elements
  in different rooms with the same mark is a scheduling error that survives
  every visual check and comes out on the drawing. The two questions share the
  word "duplicate" and nothing else, so both fragments carry the same routing
  table.

  **A blank is not a duplicate**, and that decision is the difference between a
  usable report and 400 rows. On a real model most elements have no Mark at all;
  grouping them together would report the whole model as one enormous clash.
  Blanks are counted and named as a separate figure, because "180 of these have
  no mark" is its own finding and often the more useful one.

  **Values are compared as Revit renders them.** A number parameter reading
  "150 mm" is compared as "150 mm", because that is what a schedule prints and
  what somebody reads on a drawing. Comparing the raw internal double would
  report two elements as different over a rounding difference nobody can see.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: parameterName
      type: string
      source: request
  provides:
    - name: findings
      type: IList<string>
    - name: duplicated
      role: result
      type: IList<ElementId>
    - name: blank
      # A BLANK IS NOT A DUPLICATE, and blanks are named as a separate figure
      # because "180 of these have no mark" is its own finding and often the
      # more useful one.
      role: result
      type: IList<ElementId>
    - name: noSuchParameter
      # Elements not carrying that parameter, so it could not be compared. The
      # evidence it looked, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: ambiguous
      # VERSION 2. Elements carrying TWO OR MORE parameters by this name,
      # where Revit's lookup would pick one at random. Not read and never
      # compared: which one was meant is the modeller's to say (D-54 s3,
      # FRAGMENT-ISSUES 5b-203). Turned down, never found (D-52).
      role: accounting
      type: IList<ElementId>


compatibility-note: >
  One implementation for every release. It uses LookupParameter,
  GetParameters, AsValueString, AsString, StorageType, IsReadOnly,
  ElementId.ToString and UniqueId, all present from 2020 to 2027, and never
  ElementId.IntegerValue, which 2026 removed.


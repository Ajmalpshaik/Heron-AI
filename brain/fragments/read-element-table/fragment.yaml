id: FRG-PAR-026
semantic-identity: "these elements and the named parameters, as rows the Companion can edit"
kind: action
domain: revit.parameters
capability: READ_ELEMENT_TABLE
# Version 2 (2026-11-07, FRAGMENT-ISSUES 5b-1466, issue #799 item 4): an
# optional `compact` - values only, one short row per element, format 2 - for
# a table READ in a chat. 53 walls x 6 parameters came back 59,018 characters
# on Villa 1, Revit 2024, every cell carrying its raw value, its edit flags and
# the reason. Left out it is false, and the table is format 1 as before - what
# the Companion's editable table is built from.
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Reads the named parameters of the given elements into ONE table, for the
  Heron Companion page (D-108, docs/40 section 8.2): one row per element -
  its id, UniqueId, category, family and type - and for each parameter the
  value as the modeller sees it, and whether that cell can be edited, with the
  reason when it cannot.

  **It is the table a chat opens with revit_edit_table, and the chat is told
  only how many rows it holds.** The rows go to the page; that is what keeps a
  schedule of ninety units from costing the chat ninety rows of tokens.

  **Why one string.** A fragment's list output reaches the caller as its first
  three names (FRAGMENT-ISSUES 5b-195), and a table needs every row. So the
  table crosses as one JSON string, `tableJson`, format 1 - the workaround
  report-category-overrides already uses - until a central reply fix lands.

  **Editable means an INSTANCE parameter this element carries once**, which
  is not read-only and holds text, a number or a Yes/No. A TYPE parameter is
  shown and marked not editable here: changing it changes every element of
  that type, which is a different question from editing a row. A name two
  parameters share is marked not editable, never guessed between (D-54 s3,
  FRAGMENT-ISSUES 5b-203). An element reference cannot be typed as text.

  **Values are read the way read-element-parameters reads them**: the display
  string first, in the project's own units, then the raw text. That display
  string is also what the write half compares against before it writes
  anything (set-parameter-values-by-id, Article 12c).

  Caps at maxRows rows (2,000 when not given) and says so in `truncated`.

contract:
  needs:
    - name: elements
      type: IList<Element>
    - name: parameterNames
      type: string
      source: request
    - name: maxRows
      type: int
      source: request
    - name: compact
      # Version 2. true: format 2 - "columns" once, then each row its id and
      # its values in column order, nothing else; what a chat reads. Absent is
      # false: format 1, every cell with its raw value, edit flags and reason -
      # what revit_edit_table opens. A compact table cannot be edited.
      type: bool
      source: request
      optional: true
  provides:
    # The whole table as one JSON string, format 1 - the rows the page shows.
    - name: tableJson
      role: result
      type: string
    # How many rows are in it. What the chat is told.
    - name: rowCount
      role: result
      type: int
    # Elements past maxRows, left out and counted - never silently dropped.
    - name: truncated
      role: accounting
      type: int
    # A sentence per thing turned down - a blank name list, say.
    - name: findings
      role: accounting
      type: IList<string>


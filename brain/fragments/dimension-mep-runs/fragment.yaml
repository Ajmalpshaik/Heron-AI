compatibility-note: >
  One implementation for every release. `Options.IncludeNonVisibleObjects`,
  `Options.ComputeReferences`, `Element.get_Geometry`, `Curve.Reference`,
  `Document.Create.NewDimension` and `ReferenceArray` are unchanged 2020 to
  2027. Millimetres become internal feet by dividing by 304.8 - plain
  arithmetic, exact on every release, and deliberately not a units API call.

utterances:

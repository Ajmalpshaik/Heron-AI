id: FRG-VIEW-032
semantic-identity: "put a dimension between these ducts or pipes, showing how far apart the services are"
kind: action
domain: revit.views
capability: DIMENSION_MEP_RUNS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Draws one dimension string between MEP runs - ducts, pipes, conduit, cable
  tray - so the spacing between services reads on the drawing.

  IT EXISTS BECAUSE THE FAMILY-INSTANCE ROUTE RETURNS NOTHING FOR A RUN, and
  that fact was measured before it was understood. Duct fittings and accessories
  publish no built-in references at all, and the first conclusion was *"MEP
  cannot be dimensioned"*. That was too broad. A run's CENTRELINE is a
  **non-visible object**, so it is reachable - but only if the geometry is asked
  for with non-visible objects INCLUDED and references computed. Ask for
  geometry the ordinary way and a duct genuinely offers nothing to dimension to.

  | What you are dimensioning | Use |
  |---|---|
  | Ducts, pipes, conduit, cable tray | **this fragment** |
  | Air terminals, fixtures, equipment — any family instance | `DIMENSION_FAMILY_INSTANCES` — built-in centre references, which a run does not have |

  BOTH FRAGMENTS CARRY THIS TABLE, deliberately and identically. A
  cross-reference written one way only routes whoever happens to land on the
  newer file, and which one a search returns is not something either can choose.

  FEWER THAN TWO REFERENCES CREATES NOTHING, and elements that yielded none are
  reported by id. A one-reference dimension is degenerate: Revit may accept it
  and drop it at commit, which looks like success until the sheet is opened.

  THE READ-BACK MUST NOT USE `Dimension.Curve` - it throws *"The input curve is
  not bound"* on a dimension just created. `NumberOfSegments` and `References`
  are read instead.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: view
      type: View
      source: request
    - name: axis
      type: string
      source: request
    - name: offsetMm
      type: double
      source: request
  provides:
    - name: dimensionId
      role: result
      type: ElementId
    - name: dimensionedCount
      role: result
      type: int
    - name: noReference
      # Runs whose centreline could not be reached as a reference, so there
      # was nothing to dimension TO. Given and unusable (D-52).
      role: accounting
      type: IList<ElementId>
    - name: problem
      # The sentence saying what stopped it. The evidence it looked and could
      # not, never a dimension it made (D-52).
      role: accounting
      type: string


id: FRG-VIEW-074
semantic-identity: "set or change the scale, detail, visual style, phase or view range on these views"
kind: action
domain: revit.views
capability: SET_VIEW_PROPERTIES
# Version 2 (2026-10-13, FRAGMENT-ISSUES 5b-457): the visual style is taken in
# the words Revit's View Control Bar shows - Wireframe, Hidden Line, Shaded,
# Consistent Colors, Realistic, and Textures where the running release has it
# (2024 on) - as well as Revit's own names, which version 1 matched alone.
# Version 1 refused "Shaded" (the API says Shading) on Revit 2020.2 in Project1
# while "Realistic" worked. "Shaded" leaves Show Edges as the view has it;
# "Realistic" keeps version 1's meaning, no edges, so a word still takes edges
# off a realistic view. Ray Trace is refused with Revit's reason: Revit 2020's
# API will not set it, and 2021 on has no value for it. An unknown word is
# refused once, listing every word this Revit takes, and that refusal and the
# style each view reads back are left whole in the new `visualStyleNote`.
# Scale and detail level are unchanged. The proof below is the re-run on the
# fixed build, signed by Ajmal PS on 2026-10-14. The first, signed 2026-10-13
# (fingerprint 49da3f00afa98157), went stale with a review's fixes (Realistic's
# edges, a template's refusal in the note). Version 1's (2026-09-08, Snowdon,
# fingerprint a49cc089d5151844) recorded a scale set and no visual style word
# tried.
#
# Version 3 (2026-11-01): SET_VIEW_SCALE was merged into this card on the
# owner's instruction, and is DEPRECATED. Its outputs came with it - each
# view's old scale (`wasScale`), a view already at the scale asked neither
# written nor counted as changed (`alreadyThatScale`; version 2 counted it),
# the ids of the views that refused (`refused`) - and a view named twice is
# handled once. Its read mode did not: reading a scale is READ_VIEW_SCALE's.
# Version 2's proof below no longer describes the code and is kept as the
# record; the card is DRAFT until it is proved again. Review fix of the same
# day: the detail level and the visual style are read first too - a view
# already so is neither written nor counted as changed, and is counted in
# `alreadyThatDetailLevel` or `alreadyThatVisualStyle`.
#
# Version 4 (2026-11-01): SET_VIEW_PHASE and SET_VIEW_RANGE were merged into
# this card on the owner's instruction ("make sure there is no duplicate
# tools"), and are DEPRECATED. From SET_VIEW_PHASE: `phaseId` and
# `phaseFilterId`, each id checked to be a Phase or a Phase Filter BEFORE
# anything is written, each property set and read back on its own, with
# `phaseSet`, `phaseFilterSet`, `alreadySet`, `templateControlled` and
# `unsupported`. From SET_VIEW_RANGE: `topMm`, `cutMm` and `bottomMm` on a
# plan, the range READ BEFORE it is changed (`wasViewRange`, and `wasTopMm`,
# `wasCutMm`, `wasBottomMm` for the first plan), a view that is not a plan
# refused by name, and the range read back. An offset left out is not
# touched, where SET_VIEW_RANGE wrote all three - this card's safer rule.
# scale, detailLevel and visualStyle are optional now, so a phase or a view
# range can be asked for alone. Version 2's proof below is still the record;
# the card is DRAFT until version 4 is proved.
version: 4
source: OFFICIAL
risk: MODIFY

purpose: >
  Sets or changes the scale, detail level, visual style, phase, phase filter and a plan's
  view range across many views at once - the
  light version of what a view template does, for the case where a template is
  not wanted or does not exist yet.

  Each property is set on its own and read back; anything not given is not
  touched; a view under a template that holds a property is refused for it,
  with the reason. A view already as asked is not counted as changed, and
  each view's old scale and view range come back so they can be put back.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

# THE RULES IN FULL, kept as comments so the purpose stays short enough
# for the words route (2026-11-01: after four cards merged into this one the
# purpose had grown to 500 words and a read outranked this card for its own
# sentence "change the visual style of these views" - tests/test_read_view_scale.py
# section c; the row 5b-1293 precedent):
#
# **EACH PROPERTY IS SET ON ITS OWN, AND ONE REFUSAL DOES NOT STOP THE OTHERS.**
# Not every view type carries every property: a schedule has no scale and no
# visual style, and a view under a template refuses the properties that template
# controls. Setting them as one block means a single unsupported property leaves
# the other two unset on that view and nothing saying so.
#
# **A view controlled by a template will refuse, and that is reported as a
# reason rather than a failure.** It is the commonest thing to hit here and the
# answer is not to try harder - it is REPORT_VIEW_TEMPLATE_CONTROL to see what
# the template holds, and then either change the template or release the
# property.
#
# **Anything not given is not touched.** A fragment that wrote a default into
# every property somebody left out would quietly restyle a whole drawing set.
#
# **Every value is read back after writing.** A view property that refuses can
# return without raising, and a count that assumed success would report twelve
# views set where nine were.
#
# **Changing the view scale changes every tag and dimension on the drawing**
# (version 3, from SET_VIEW_SCALE, merged into this card). Annotation is sized
# in paper units, so a view taken from 1:100 to 1:50 keeps its geometry and
# halves the apparent size of everything annotated on it. On a view already on
# a sheet that is a visible change to an issued drawing, not a display setting.
#
# **A view already at the scale asked is left alone and not counted as
# changed** (version 3), and each view's old scale comes back, so a batch of
# view scales can be put back by a caller that kept it. The ids of the views
# that refused anything come back too, and a view named twice is handled once.
#
# **The phase and the phase filter change what the drawing shows, not the
# building** (version 4, from SET_VIEW_PHASE) - what makes a view a
# demolition plan or an existing plan. SET_ELEMENT_PHASE moves elements; this
# moves nothing. An id that is not a phase, or not a phase filter, is refused
# before anything is written, and each of the two is set and read back on its
# own: a schedule has a phase and no phase filter, a drafting view neither.
#
# **A plan's view range is read before it is changed** (version 4, from
# SET_VIEW_RANGE) - top, cut plane and bottom, in millimetres from the level
# each is measured from - and the old offsets come back so it can be put
# back. The view range is the commonest reason MEP does not appear on a plan.
# A section, an elevation and a 3D view have none, and are refused by name.

contract:
  needs:
    - name: doc
      type: Document
    - name: views
      type: IList<View>
      source: request
    # 1 : N as the number N. Optional since version 4: left out it is 0,
    # which asks for no scale and touches none.
    - name: scale
      type: int
      source: request
      optional: true
      absent: 0
    # Coarse, Medium or Fine. Optional since version 4: left out it reads
    # `keep`, and the detail level is not touched.
    - name: detailLevel
      type: string
      source: request
      optional: true
      absent: keep
    # A View Control Bar word - Wireframe, Hidden Line, Shaded, Shaded with
    # Edges, Consistent Colors, Realistic, Realistic with Edges, and Textures
    # (2024 on) - or Revit's own name for a style, such as HLR or FlatColors.
    # Spaces and capitals do not matter. Not Ray Trace: Revit will not let a
    # tool set it.
    # Optional since version 4: left out it reads `keep`, untouched.
    - name: visualStyle
      type: string
      source: request
      optional: true
      absent: keep
    # VERSION 4, from SET_VIEW_PHASE. The phase each view shows, by its name
    # - "New Construction" - resolved to the Phase. One that is not a Phase
    # in this model is refused before anything is written. Left out it reads
    # `none`, InvalidElementId: the phase is not touched.
    - name: phaseId
      type: ElementId
      source: request
      optional: true
      absent: none
    # VERSION 4, from SET_VIEW_PHASE. The phase filter - "Show Complete" -
    # checked to be a Phase Filter the same way. Left out: untouched.
    - name: phaseFilterId
      type: ElementId
      source: request
      optional: true
      absent: none
    # VERSION 4, from SET_VIEW_RANGE. A plan's top, cut plane and bottom
    # offsets in millimetres from the level each plane is measured from -
    # "2300". Each left out reads `keep`, and that plane is not touched. Text,
    # because the binder has no way to leave a number out.
    - name: topMm
      type: string
      source: request
      optional: true
      absent: keep
    - name: cutMm
      type: string
      source: request
      optional: true
      absent: keep
    - name: bottomMm
      type: string
      source: request
      optional: true
      absent: keep
  provides:
    - name: changed
      role: result
      type: int
    - name: findings
      type: IList<string>
    - name: visualStyleNote
      # The visual style's outcome in one whole sentence: the style each view
      # reads back ("Shaded on 1" or "Shaded with Edges on 2") and Revit's words
      # for any view that refused it, or, for a word this Revit does not know,
      # the refusal listing every word it takes. A
      # finding is cut to sixty characters on its way back and this is not.
      # Empty when no visual style was asked for. Evidence, never the count.
      role: accounting
      type: string
    - name: wasScale
      # Version 3, from SET_VIEW_SCALE. What each view's scale WAS before this
      # ran, read before any write - so a caller that keeps it can put a batch
      # back. Filled only when a scale was asked for. The evidence it looked,
      # never a change it made (D-52).
      role: accounting
      type: IDictionary<ElementId, int>
    - name: alreadyThatScale
      # Version 3, from SET_VIEW_SCALE. Views ALREADY at the scale asked, so
      # there was nothing to do: not written and not counted in `changed`.
      # Version 2 wrote the same number back and counted the view. The
      # evidence it looked, never a change it made (D-52).
      role: accounting
      type: int
    - name: alreadyThatDetailLevel
      # Version 3 review fix (2026-11-01). Views ALREADY at the detail level
      # asked: not written and not counted in `changed` - the miscount
      # alreadyThatScale fixed for scale, fixed here for detail level. A count
      # of its own rather than alreadyThatScale widened, so that one still
      # means scale. The evidence it looked, never a change it made (D-52).
      role: accounting
      type: int
    - name: alreadyThatVisualStyle
      # Version 3 review fix (2026-11-01). Views ALREADY in the visual style
      # asked - for "Shaded", in the style that keeps the view's own edges:
      # not written and not counted in `changed`, and said in visualStyleNote.
      # The evidence it looked, never a change it made (D-52).
      role: accounting
      type: int
    - name: refused
      # Version 3, from SET_VIEW_SCALE. The views that refused anything asked
      # - a template, a property Revit would not take - each once; the
      # sentences saying why are in `findings`. The evidence it looked and
      # was told no, never a thing it FOUND, so it must not count toward "did
      # this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>
    - name: phaseSet
      # VERSION 4, from SET_VIEW_PHASE. Views whose phase READ BACK as asked.
      role: result
      type: IList<ElementId>
    - name: phaseFilterSet
      # VERSION 4, from SET_VIEW_PHASE. Views whose phase filter read back as
      # asked.
      role: result
      type: IList<ElementId>
    - name: alreadySet
      # VERSION 4, from SET_VIEW_PHASE. Views ALREADY at the phase or phase
      # filter asked, so there was nothing to do. The evidence it looked,
      # never a change it made (D-52).
      role: accounting
      type: IList<ElementId>
    - name: templateControlled
      # VERSION 4, from SET_VIEW_PHASE. Views that refused the phase or the
      # phase filter - read-only, or written and read back unchanged. A VIEW
      # TEMPLATE holding it is much the commonest reason, never the only one.
      # A reason rather than a failure, never a view it changed (D-52).
      role: accounting
      type: IList<ElementId>
    - name: unsupported
      # VERSION 4, from SET_VIEW_PHASE. Views that carry no view phase at all
      # - a drafting view, a legend, a sheet. Given and unusable (D-52).
      role: accounting
      type: IList<ElementId>
    - name: wasViewRange
      # VERSION 4, from SET_VIEW_RANGE. Every plan's top, cut plane and bottom
      # BEFORE this ran, in millimetres, read before any write - so a caller
      # can say what it was and put it back. Empty when no range was asked.
      # The evidence it looked, never a change it made (D-52).
      role: accounting
      type: string
    - name: wasTopMm
      # VERSION 4, SET_VIEW_RANGE's three: the FIRST plan's offsets before
      # this ran. 0 when no range was asked. Evidence, never a change (D-52).
      role: accounting
      type: double
    - name: wasCutMm
      role: accounting
      type: double
    - name: wasBottomMm
      role: accounting
      type: double
    - name: viewRangeSet
      # VERSION 4. Plans whose view range read back as asked.
      role: result
      type: int
    - name: alreadyThatViewRange
      # VERSION 4. Plans already at the offsets asked: not written and not
      # counted in `changed`. The evidence it looked (D-52).
      role: accounting
      type: int


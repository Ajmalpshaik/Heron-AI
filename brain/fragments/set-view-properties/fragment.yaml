compatibility-note: >
  One implementation for every release. `View.Scale`, `View.DetailLevel`,
  `View.DisplayStyle`, `ViewDetailLevel` and `DisplayStyle` are present 2020
  through 2027, compiled at both ends. The detail level and visual style are
  matched against the enumeration names as text, so a release adding a style is
  matched rather than needing a new case.

# ROUTING - repeated in APPLY_VIEW_TEMPLATE, SET_VIEW_SCALE and
# REPORT_VIEW_TEMPLATE_CONTROL.
#
#   "set these views to 1 to 100"    -> here
#   "make these views fine detail"   -> here
#   "put these views on shaded"      -> here
#   "apply the template to these"    -> APPLY_VIEW_TEMPLATE, which sets
#                                       everything the template holds at once
#                                       and is the right answer when one exists
#   "change the scale of this view"  -> SET_VIEW_SCALE for one property on one
#                                       view; this is the batch across several
#   "why will it not change"         -> REPORT_VIEW_TEMPLATE_CONTROL. A view
#                                       under a template refuses the properties
#                                       that template controls, and that is the
#                                       commonest reason a set here does nothing

utterances:
  - set these views to 1 to 100
  - make these views fine detail
  - put these views on shaded
  - set the scale and detail on these
  - change the visual style of these views

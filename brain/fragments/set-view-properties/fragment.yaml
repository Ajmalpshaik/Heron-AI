compatibility-note: >
  One implementation for every release. `View.Scale`, `View.DetailLevel`,
  `View.DisplayStyle`, `ViewDetailLevel` and `DisplayStyle` are present 2020
  through 2027, compiled at both ends. The visual style is matched by NAME at
  run time, never by a typed member: `DisplayStyle` value 9 is `Raytrace` on
  2020, absent from 2021 to 2023, and `Textures` from 2024 (read off each
  release's reference assembly on its own on 2026-10-13), so either name typed
  would fail to compile somewhere in the range. A word whose name the running release lacks is
  not offered, and a release adding a style is matched by its own name.
  `Raytrace` is never offered: Revit 2020 throws on setting it - "it is not
  permitted to directly assign the display style to this value" - measured
  2026-10-13. Version 4 adds what SET_VIEW_PHASE and SET_VIEW_RANGE were
  proved with, unchanged 2020 to 2027: BuiltInParameter VIEW_PHASE and
  VIEW_PHASE_FILTER, `Parameter.IsReadOnly`, `Set(ElementId)` and
  `AsElementId`, `Phase`, `PhaseFilter`; `ViewPlan.GetViewRange`,
  `SetViewRange`, `PlanViewRange.GetOffset` and `SetOffset` and
  `PlanViewPlane`. Ids are compared as ElementId, never read as a number.
  Millimetres to feet is arithmetic (D-20).

# ROUTING - repeated in APPLY_VIEW_TEMPLATE and REPORT_VIEW_TEMPLATE_CONTROL.
#
#   "set these views to 1 to 100"    -> here
#   "make these views fine detail"   -> here
#   "put these views on shaded"      -> here
#   "apply the template to these"    -> APPLY_VIEW_TEMPLATE, which sets
#                                       everything the template holds at once
#                                       and is the right answer when one exists
#   "change the scale of this view"  -> here since version 3. SET_VIEW_SCALE,
#                                       which answered it for one property, was
#                                       merged into this card on 2026-11-01
#   "set the phase on these views"   -> here since version 4 (was
#                                       SET_VIEW_PHASE)
#   "make this a demolition plan"    -> here - the phase filter is what makes
#                                       it one
#   "move these walls to the new phase" -> SET_ELEMENT_PHASE. That changes the
#                                       BUILDING; this changes what the drawing
#                                       looks from
#   "what phases are in this model"  -> REPORT_PHASES
#   "make a phase filter called As-Built" -> CREATE_PHASE_FILTER - that makes
#                                       the filter; this puts one on views
#   "what phase filters are there"   -> REPORT_PHASE_FILTERS
#   "set the view range"             -> here since version 4 (was
#                                       SET_VIEW_RANGE)
#   "what is the view range"         -> REPORT_VIEW_SETTINGS, a READ. A
#                                       question about a drawing never reaches
#                                       this write (D-86); SET_VIEW_RANGE
#                                       declared it for its read mode, which
#                                       did not come here
#   "why can I not see my ducts"     -> DIAGNOSE_VISIBILITY first
#   "crop the view"                  -> SET_VIEW_CROP - a different limit, in
#                                       the view's plane rather than in height
#   "show me the floor below"        -> SET_VIEW_UNDERLAY - the ghosted level
#                                       behind this one, a different setting
#   "why will it not change"         -> REPORT_VIEW_TEMPLATE_CONTROL. A view
#                                       under a template refuses the properties
#                                       that template controls, and that is the
#                                       commonest reason a set here does nothing
#   "make this view look good"       -> APPLY_VISUAL_PRESET, a whole look in
#                                       one call; this card is the style alone

# VERSION 3 (2026-11-01) - SET_VIEW_SCALE WAS MERGED INTO THIS CARD on the
# owner's instruction, and is DEPRECATED. Both set a view's scale across a
# batch, refused a template and read the value back; this card also sets the
# detail level and the visual style. What SET_VIEW_SCALE had that this lacked
# is here now: `wasScale`, `alreadyThatScale`, `refused` by id, a view named
# twice handled once. Its `apply` false READ mode did not come: "what scale is
# this view" is a question, and READ_VIEW_SCALE answers it - by ranking, on
# both backends; declaring it there took 8 of 10 scale change requests from
# this card on the trained model, so it is declared nowhere (READ_VIEW_SCALE's
# ROUTING says so). SET_VIEW_SCALE's routing rows now
# read here: "set the scale" -> here, "the text is too small" -> here,
# "why can I not change the scale on this view" -> REPORT_VIEW_TEMPLATE_CONTROL,
# "let this view set its own scale" -> SET_VIEW_TEMPLATE_CONTROL, "what is the
# scale of this view" -> REPORT_VIEW_SETTINGS (READ_VIEW_SCALE until it was
# merged there, 2026-11-01).
#
# SCALE IS OFTEN OWNED BY THE TEMPLATE, as SET_VIEW_SCALE said: a refusal on a
# batch is almost always why, and the fix is in the template, not the view.
# CHANGING SCALE CHANGES EVERY TAG AND DIMENSION'S SIZE on the paper -
# annotation is sized in paper units - so on a view already on an issued sheet
# it is a visible change to the drawing, not a display setting.


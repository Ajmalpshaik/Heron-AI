positive:
  - given: twelve plan views set to scale 100
    expect: >
      all twelve reading 1:100 in Revit's own view properties, and the count
      saying twelve. Read one by hand

  - given: the same views set to Fine detail and Shaded, with no scale given
    expect: >
      detail and style changed and THE SCALE UNTOUCHED. Anything not asked for
      must not move, or a batch quietly restyles a drawing set

  - given: a schedule among the views
    expect: >
      the properties it does not have refused and named, and the ones it does
      still set

  - given: visual style "Shaded" on a 3D view in Hidden Line
    expect: >
      it reads back as Revit's Shading, and visualStyleNote says so in full.
      THIS IS 5b-457: version 1 refused the word because the API calls it
      Shading
  - given: the other View Control Bar words, in any capitals and spacing - Hidden
      Line, Wireframe, Consistent Colors (or Colours), Realistic, Shaded with
      Edges, Realistic with Edges, and Textures on 2024 or later
    expect: each read back as the style the View Control Bar shows by that name
  - given: Revit's own names - HLR, Shading, FlatColors, RealisticWithEdges
    expect: they still work. Every word version 1 took is still taken
  - given: the word "Shaded" on a view already showing edges
    expect: >
      it stays Shaded with Edges. Show Edges is its own tick box in Revit, and
      the word did not ask to turn it off
  - given: the word "Realistic" on a view already showing edges
    expect: >
      plain Realistic, no edges - what version 1 gave it. "Realistic" is also
      the API's own name, and without this no word takes edges off a realistic
      view

  - given: VERSION 3. 12 plans at 1:100, scale 50
    expect: >
      changed 12, wasScale reading 100 for each of the twelve, and the tags on
      each view doubling in apparent size on the sheet - annotation is sized in
      paper units. Version 2 had no wasScale, so this FAILS on it

negative:
  - given: >
      a view controlled by a view template that locks the scale, set to a new
      scale
    expect: >
      the refusal reported AND pointed at REPORT_VIEW_TEMPLATE_CONTROL. THIS IS
      THE FIRST CASE TO RUN. It is the commonest thing to hit, the property
      silently stays as it was, and a count that assumed success reports the
      view as changed

  - given: all three properties given, one of them unsupported on a view
    expect: >
      the other two still set on that view. Setting them as one block means one
      refusal loses the other two and nothing says so

  - given: a detail level of "Very Fine"
    expect: >
      refused by name - Coarse, Medium and Fine are the three, and a silent
      fallback to Medium would be an invention

  - given: nothing asked for at all
    expect: refused, with the reason - not a run that touched nothing and reported success

  - given: a visual style word Revit has no style for, such as "Shadded"
    expect: >
      refused ONCE, not once per view, nothing changed, and visualStyleNote
      lists every word this Revit takes - whole, because a finding is cut to
      sixty characters on its way back
  - given: visual style "Ray Trace"
    expect: >
      refused with Revit's reason and nothing changed. Revit 2020 throws on
      setting it and 2021 on has no value for it, so it is never offered

  - given: VERSION 3. 12 views already at 1:50, scale 50, nothing else asked
    expect: >
      alreadyThatScale 12, changed 0, scale set on 0, and a finding saying the
      twelve were already at 1:50 - not changed 12. Version 2 wrote 50 back and
      counted all twelve as changed, so this FAILS on it (SET_VIEW_SCALE's case)

  - given: VERSION 3. 12 views of which 9 follow a TEMPLATE that locks scale, scale 50
    expect: >
      the 9 ids in `refused`, each once, their sentences in findings pointing
      at REPORT_VIEW_TEMPLATE_CONTROL, and the other 3 changed. Version 2 named
      them only in sentences, so a caller could not act on WHICH by id

  - given: VERSION 3. the same plan named twice in views, scale 50
    expect: >
      set once, changed 1, one wasScale entry, and "1 of 1 view(s)" in the
      findings. Version 2 set it twice and said "2 of 2 view(s) changed"

second_route: >
  Revit's own Properties palette on one of the views, read before and after -
  and for the template case, the padlock shown beside a controlled property is
  the answer the refusal is pointing at

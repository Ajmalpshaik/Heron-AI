positive:
  - given: a 400 x 250 duct crossing one wall, allowance 50 mm
    expect: >
      one proposal of 500 x 350 mm, the host named, and the thickness it passes
      through stated. Allowance is applied all round, so 50 adds 100 to each
      dimension

  - given: a duct crossing a wall at 45 degrees
    expect: >
      the through-thickness reported LONGER than the wall's own thickness. THIS
      IS WHAT THE SOLID INTERSECTION BUYS - a bounding box would be right only
      for a perpendicular crossing, and an oblique hole cut to the wrong length
      is one that gets found on site

  - given: a single pipe passing through two separate walls
    expect: >
      TWO proposals, one per host. That is how many holes have to be cut

  - given: 200 services against 50 walls in a real model
    expect: >
      it COMPLETES in a reasonable time. Host geometry is extracted once per
      host, not once per service - the first version asked Revit for the same 50
      solids 200 times over, and geometry extraction is among the most expensive
      calls in the API. That is not a slow fragment, it is one that looks like a
      hang and gets abandoned

  - given: a round pipe of 150 diameter with 25 allowance
    expect: >
      200 x 200 mm proposed, and the squaring-off said out loud so nobody thinks
      a round core was specified

  # D-59, added 2026-09-28 with version 2. NOT RUN.
  - given: >
      pipes in this MEP model crossing a wall of the architectural link,
      hosts EMPTY, allowanceMm 25, includeLinks true
    expect: >
      `proposals`, `hostIds` and `runIds` empty - nothing in this model was
      given as a host - and each crossing proposed in `linkedMatches` with the
      linked wall's type, id in the link, Fire Rating, hole size and a centre
      that lands on the wall in a section of THIS model

  # VERSION 3, added 2026-11-26 - row 5b-1879 item 2, issue #1088, D-208. NOT
  # RUN - NEEDS-CHECKING Group QY. Each FAILS on version 2, which had no
  # insulation term.
  - given: >
      a 150 mm pipe carrying 25 mm of pipe insulation, crossing one wall,
      allowanceMm 25
    expect: >
      one proposal of 250 x 250 mm - 150 + 2 x 25 insulation + 2 x 25 - its line
      saying "+ 25 mm insulation". Version 2 proposed 200 x 200. Then
      CHECK_SLEEVE_SIZE on a sleeve that size, annularClearance 25, reads "ok"
      for the jacket rather than UNDERSIZED by 50 (row 5b-1879 item 2) - any
      gap left is the nominal against outside diameter, row 5b-2055

  - given: >
      a 400 x 250 duct carrying 50 mm of duct insulation, crossing one wall,
      allowanceMm 50
    expect: >
      one proposal of 600 x 450 mm, "+ 50 mm insulation" on its line, and the
      findings line counting 1 service with insulation. Ducts are asked the
      same way as pipes - the owner's "duct also"

negative:
  - given: a model where no service crosses any host
    expect: >
      zero proposals and it said plainly, not an error. Nothing needing a hole is
      a real and good answer

  - given: an element that is not a duct, pipe, tray or conduit
    expect: >
      counted in `unmeasured` and NOT silently skipped. THIS IS THE CASE THAT
      MATTERS. A hole schedule that quietly omits what it could not read is one
      that gets built from, and the missing hole is discovered on site

  - given: a service whose size cannot be read
    expect: >
      the same - reported apart, no proposal invented for it

  - given: a negative allowance
    expect: >
      refused, nothing proposed. A hole smaller than the duct is not a project
      decision, it is a typo

  - given: any run at all
    expect: >
      NOTHING CREATED, NO OPENING CUT, NO TRANSACTION. This proposes. Creating is
      a separate operation somebody has to approve

  # D-59, added 2026-09-28 with version 2. NONE OF THESE HAS BEEN RUN.
  - given: includeLinks ABSENT, on a model that HAS loaded links
    expect: >
      the same answer as version 1, and linksSearched 0 with the first
      line of linkedMatches reading "Host model only - links not read". The
      switch left out must bind false, not refuse - if the run refuses with
      needs_request_values, the add-in in Revit is older than this change

  - given: includeLinks true on a model with NO links, or with every link unloaded
    expect: >
      linksSearched 0 and "Links asked for, NONE loaded - host only". It must
      NOT read like the absent case: one means there was nothing else to read,
      the other means reload them in Manage Links and ask again

  - given: one linked file placed TWICE, with includeLinks true
    expect: >
      linksSearched 1, not 2 - it counts files, not placements

  - given: hosts EMPTY and includeLinks ABSENT
    expect: >
      the version-1 refusal - "Both services and hosts are needed" and
      nothing proposed. Only reading the links lifts it

  - given: a pipe running alongside a linked wall without crossing it, includeLinks true
    expect: >
      no line for that pipe - the test is the centre line through the solid,
      not the two boxes touching

  # Row 5b-203, added 2026-10-09. NOT RUN - it needs a model that carries a
  # duplicated name, and none has been arranged yet.
  - given: >
      pipes in this MEP model crossing a wall of the architectural link whose
      type carries two parameters named Fire Rating - a shared "Fire Rating"
      bound to Walls beside the built-in one - hosts EMPTY, allowanceMm 25,
      includeLinks true
    expect: >
      each crossing proposed in `linkedMatches` with "Fire Rating NOT READ - 2
      parameters share that name", never either rating - fire-stopping chosen
      from a rating Revit picked at random is what this case guards (row
      5b-203)

  # VERSION 3, added 2026-11-26 (D-208). NOT RUN - Group QY.
  - given: >
      the 400 x 250 duct of the first positive case, NO insulation on it and
      a 50 mm lining inside it, allowanceMm 50
    expect: >
      500 x 350 mm exactly as version 2, its line saying "(no insulation)",
      and the findings line counting 0 services with insulation. Nothing is
      added for a run that carries none, and lining is not insulation. THE
      FIRST VERSION 3 CASE TO RUN

  - given: a cable tray crossing a wall beside an insulated pipe
    expect: >
      the tray's proposal says "(no insulation)" and completes - asking a tray
      for insulation throws, and that throw IS the answer none; it must not
      end the run or lose the pipe's proposal

second_route:
  - >
    FIND_CLASHES over the same services and hosts. Every proposal here should
    correspond to a clash there - a proposal with no clash means the intersection
    found something that is not really a penetration

  - >
    A tape measure on one oblique crossing in a section view, against the
    reported through-thickness. That single check is what proves the solid
    intersection is doing what a bounding box could not

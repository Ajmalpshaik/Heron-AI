semantic-identity: "where the services go through, and how big the hole needs to be"
kind: action
domain: revit.qa
capability: PROPOSE_MEP_OPENINGS
# VERSION 3 (2026-11-26): row 5b-1879 item 2, issue #1088, D-208 - each pipe
# and duct is asked whether it carries insulation, and only when it does is
# twice its thickest wrap added to the hole before the allowance. Version 2's
# proof below - PROVEN 2026-10-18 on Project2 - is kept as the record; its C#
# moved, so the card is DRAFT until version 3 is proved on a real model
# (D-30), NEEDS-CHECKING Group QY.
version: 3
source: OFFICIAL
risk: READ

purpose: >
  Finds where MEP runs pass through walls and floors, and PROPOSES an opening at
  each one - position, size and the host it belongs to. **It creates nothing.**

  **PROPOSING AND CREATING ARE DELIBERATELY TWO OPERATIONS.** Cutting holes in
  somebody's structure is not a thing to do as a side effect of looking for them.
  The list this produces is meant to be read, argued with, and only then acted
  on - by a separate write that somebody approved. That split is the plan's own
  recommendation and it is the right way round: an audit that quietly modifies is
  not an audit.

  **AUDIT_MEP_OPENINGS AND CHECK_SLEEVE_SIZE INSPECT WHAT EXISTS. THIS PROPOSES
  WHAT DOES NOT.** They answer *"are the openings there right"*; this answers
  *"where do openings need to be"*. On a model with no openings drawn yet, they
  have nothing to report and this has everything.

  **THE ALLOWANCE IS REQUIRED, NOT ASSUMED.** How much bigger than the duct a
  hole must be is a project decision - it varies by trade, by fire rating and by
  who is paying for the sleeve. Assuming a number would produce a schedule of
  holes that look authoritative and match nobody's specification.

  **IT MEASURES THE REAL INTERSECTION, NOT A BOUNDING BOX.** A duct crossing a
  wall at an angle needs a bigger hole than its own width, and a bounding-box
  answer would be right only for a perpendicular crossing. The solid is
  intersected with the run's centre line, so an oblique penetration reports the
  length it really cuts.

  **A RUN THROUGH TWO WALLS IS TWO OPENINGS.** Each intersected segment is
  reported separately, with its own host, because that is how many holes have to
  be cut.

  Reads only. Opens no transaction and needs none.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, each service's centre line is carried into
  every placement of every loaded link and intersected with that link's
  walls, floors, roofs, ceilings and structural members - the same real
  intersection, never a box - and `linkedMatches` proposes every crossing:
  the linked host's type, its id IN THE LINK and its **Fire Rating**, the
  hole size, the depth through it and its centre in THIS model's
  coordinates. That is the owner's case: *"my pipe crosses a linked wall and
  I need to create something there - is it a 2-hour wall?"* With links read,
  an empty `hosts` is not refused, because the hosts are expected to be in
  the links. `linksSearched` says how many links were read: set and 0 means
  "you asked, and none are loaded". **NOTHING FROM A LINK IS EVER SELECTED
  OR CARRIED** - `proposals`, `hostIds` and `runIds` stay this model's own;
  `hostIds` feeds the step that cuts, and a hole in a linked wall is cut in
  that model by whoever owns it (FRAGMENT-ISSUES row 75). Only model
  elements are read from a link, never its views or sheets. Links nested
  inside a link are not read, and are counted in the answer.

  **INSULATION ONLY WHERE THERE IS SOME (version 3).** Each pipe and duct is
  first asked whether it carries insulation. When it does, the hole is the
  service plus twice the thickest wrap plus the allowance all round, and the
  proposal names the thickness; when it does not, nothing is added and it
  says "(no insulation)" - the same reading CHECK_SLEEVE_SIZE makes, so the
  two no longer disagree over the jacket. Lining is not counted. Version 3
  is DRAFT until proved.

# A NAME TWO PARAMETERS SHARE IS NEVER READ: a linked element whose Fire Rating
# two parameters carry - a shared or project "Fire Rating" bound beside the
# built-in one, on the element or on the type the lookup falls through to -
# reads "Fire Rating NOT READ - N parameters share that name" in
# `linkedMatches`, never either value (D-54 s3, FRAGMENT-ISSUES 5b-203; added
# 2026-10-09). Written here and not in `purpose`, as on check-sleeve-size's
# card: the purpose is embedded for routing, and on that card's change a
# purpose sentence about this moved other cards' utterances in check-routing,
# measured against d9b27f03 (row 5b-203's 2026-10-09 note). Not measured for
# this card.
contract:
  needs:
    - name: doc
      type: Document
    # The services. MEP curves - duct, pipe, tray, conduit.
    - name: elements
      type: IList<Element>
    # The things they pass through - walls, floors, roofs. A REQUEST input, the
    # same shape FIND_CLASHES uses for its second set: the structure to check
    # against is named by the caller, not produced by an earlier fragment. Left
    # host-sourced it made this an orphan, because nothing in the library
    # provides a name called `hosts` and so no workflow could ever reach it.
    - name: hosts
      type: IList<Element>
      source: request
    # Millimetres added to each side of the service size. A project decision.
    - name: allowanceMm
      type: double
      source: request
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: proposals
      role: result
      type: IList<string>
    - name: hostIds
      role: result
      type: IList<ElementId>
    - name: runIds
      role: result
      type: IList<ElementId>
    - name: unmeasured
      # Penetrations whose size could not be worked out. Given and unusable,
      # never an opening it proposed (D-52).
      role: accounting
      type: IList<string>
    - name: findings
      type: IList<string>
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then the links' own lines. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75). Since 2026-10-09 a Fire
      # Rating two parameters share reads NOT READ there, never either
      # value (D-54 s3, FRAGMENT-ISSUES 5b-203).
      role: accounting
      type: IList<string>


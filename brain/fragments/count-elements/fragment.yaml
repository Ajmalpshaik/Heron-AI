id: FRG-ELE-002
semantic-identity: "how many elements a filter found"
kind: action
domain: revit.reporting
capability: COUNT_ELEMENTS
version: 1
source: OFFICIAL
risk: READ

purpose: >
  How many elements a filter found.
  Trivial arithmetic, and a separate fragment on purpose: every count question in
  the library ends here, so the one place a count can go wrong is one place.

contract:
  needs:
    - name: elements
      type: IList<Element>
  provides:
    - name: count
      role: result
      type: int
    - name: countedNothing
      # That the filter matched nothing - an honest zero said out loud. The
      # evidence it ran, never a count of anything (D-52).
      role: accounting
      type: bool

proof:
  date: '2026-09-07'
  by: Ajmal PS
  model: Snowdon Towers Sample HVAC (9,641 elements), Revit 2024, session 42676
  positive_case: 37 mechanical equipment items selected in Snowdon Towers Sample HVAC - run
    as it would normally be run. returned count 37, countedNothing false. inputs came elements
    from the selection (37). on Snowdon Towers Sample HVAC
  negative_case: "CANNOT COME BACK EMPTY, so proved by TRACKING instead (D-53). count-elements\
    \ describes whatever it is given, so no arrangement makes its answer empty. What D-30's\
    \ negative case exists to catch - a fragment that succeeds while doing nothing, or answers\
    \ about a set it was not given - is caught here by the answer following the input exactly\
    \ across 5 different selections:\n\n      28 (28 duct taps) selected -> count 28\n   \
    \   16 (16 spaces) selected -> count 16\n      4 (4 walls) selected -> count 4\n     \
    \ 12 (12 sheets) selected -> count 12\n      37 (37 mechanical equipment items) selected\
    \ -> count 37\n\n    Different inputs, exact matches every time. A fragment falling back\
    \ to the active view, the whole model, or a previous run could not do that."
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: 2f675c8a9e45d556

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

# CLAIMED ON 2026-09-17 SO THE IDENTITY ROUTE ANSWERS THESE, and it is
# not a rank being bought. An undeclared sentence never reaches
# short_circuit at all: it falls through to the fused ranking, and
# tools/check-risk-crossings.py measured where that lands. Each line
# below was answered by a MODIFY before it was claimed here.
#   "how many pipes are there"  -> CAP_OPEN_PIPE_ENDS (MODIFY)
#   "count the air terminals"   -> CONNECT_AIR_TERMINALS (MODIFY)
# A count answered by capping open pipe ends is the worst shape in the
# library: nobody re-reads a model after asking how many there are.
utterances:
  - how many pipes are there
  - count the air terminals
  - how many are there
  - count them
  - give me the number
  # ADDED 2026-09-19 because the SKILL `count-elements` declares these two and
  # NOTHING ELSE DID, so neither reached the identity route and both were
  # ranked instead. Measured through heron_lookup with a model open:
  #   "how many sprinklers on level 2"    -> PLACE_FAMILY_INSTANCES (MODIFY)
  #   "give me the number of fire dampers" -> READ_MODEL_WARNINGS
  # A question that would PLACE sprinklers, and a count answered with
  # warnings. The risk warning fired correctly on the first, so nothing could
  # have happened unasked - but a modeller should not need warning off "how
  # many".
  #
  # "give me the number" was ALREADY declared here and did not help: the
  # identity table matches a whole normalised sentence, so a trailing "of fire
  # dampers" makes it a different phrase entirely. Declaring the general form
  # does not cover the specific one.
  #
  # THIS FIXES TWO SENTENCES AND NOT THE SHAPE. "how many sprinklers on level
  # 3" would still be ranked. The general repair is to index a SKILL's
  # utterances the way a fragment's are - see NEEDS-CHECKING group V.
  - how many sprinklers on level 2
  - give me the number of fire dampers

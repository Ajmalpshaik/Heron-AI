revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  A compile-time split at 2021 for the enabled/disabled switch, which Revit
  2020 does not have at all: on that release the check is SKIPPED and said to
  be skipped, never reported as passed. Everything else - the filter list,
  visibility, the overrides, category visibility and the template-controlled
  parameter ids - is unchanged 2020 to 2027. A view that cannot carry graphic
  overrides at all, such as a schedule or a sheet, is reported as such rather
  than as a view with no filters.

  Version 2 adds, read off the reference assemblies of all eight releases on
  2026-10-15: `View.GetOrderedFilters` (2021 to 2027, ABSENT from 2020) and
  `View.GetIsFilterEnabled` (the same), both reached BY NAME at run time as
  REPORT_VIEW_FILTERS does, never under a version #if; and, on every release,
  `ParameterFilterElement.GetElementFilter`, `ElementLogicalFilter.GetFilters`,
  `ElementParameterFilter.GetRules`, `ElementFilter.Inverted`,
  `FilterRule.GetRuleParameter`, `FilterInverseRule.GetInnerRule`,
  `FilterCategoryRule`, `HasValueFilterRule`, `HasNoValueFilterRule`, the
  string and numeric rule getters, `SelectionFilterElement.GetElementIds`,
  `LabelUtils.GetLabelFor(BuiltInParameter)` and the `ElementId(BuiltInParameter)`
  constructor. No `ElementId` number is read - it changes type at 2024 and loses
  `IntegerValue` at 2026 - so a built-in parameter is matched by `ElementId`.

# ROUTING - the same rows are in the fragments named here.
#
#   "the filter is on the view and       -> here
#    nothing is coloured"
#   "why can I not see my ducts"         -> DIAGNOSE_VISIBILITY, which asks
#                                           about ONE ELEMENT and every reason
#                                           it might be invisible. This asks
#                                           about the FILTERS on a view
#   "what filters exist in the project"  -> REPORT_VIEW_FILTERS
#   "which parameters can I filter on"   -> REPORT_FILTERABLE_PARAMETERS, asked
#                                           before a filter is built
#   "does this filter catch this         -> TEST_VIEW_FILTER_MATCH
#    element"
#   "put a filter on this view"          -> APPLY_VIEW_FILTER, which is also
#                                           where a disabled one is switched
#                                           back on - this fragment only reads
#   "take the filter off"                -> REMOVE_VIEW_FILTER
#   "the colours are not showing on      -> here when a filter is applied
#    this drawing"                          and nothing draws;
#                                           COLOR_BY_PARAMETER when nothing
#                                           has been coloured yet
#
# VERSION 2 - with everyFilter true. A QUESTION ABOUT A FILTER'S RULE GOES TO A
# READ: on 2026-10-15 "what are the filter rules on this view" reached
# CREATE_VIEW_FILTER, a write, on both search backends.
#
#   "what are the filter rules on this view" -> here
#   "list every filter on this view in order with its rules" -> here
#   "what are the filter settings on this view" -> REPORT_VIEW_FILTERS - the
#                                        Filters-tab cells of the views NAMED,
#                                        several at once; here is ONE view, its
#                                        filters in priority order with their
#                                        rules and catches
#   "show me the full visibility graphics of this view" ->
#                                        REPORT_CATEGORY_OVERRIDES with
#                                        allCategories true - the categories,
#                                        sub-categories and per-element
#                                        overrides; this card is the filters

utterances:
  - the filter is on the view but nothing is coloured
  - why is my view filter not working
  - check the filters on this view
  - is this filter switched off
  - my filter change did not save
  - the colours are not showing on this drawing
  # VERSION 2 - answered with everyFilter true.
  - list every filter on this view in order with its rules

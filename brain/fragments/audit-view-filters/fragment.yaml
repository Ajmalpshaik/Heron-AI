id: FRG-VIEW-078
semantic-identity: "the filter is on the view so why is nothing coloured"
kind: action
domain: revit.views
capability: AUDIT_VIEW_FILTERS
# VERSION 2 (2026-10-15, FRAGMENT-ISSUES 5b-480): `everyFilter` leaves
# `filterList`, every filter on the view in priority order with its rule, its
# categories, how many host elements in the view it catches and its whole
# override, as one string. Version 1 answered in counts and in lists a reply
# cuts to three items of sixty characters; on a real HVAC project on Revit 2020
# with 21 filters, no read printed a filter's rule at all. Left out it is false
# and the audit answers exactly as version 1. DRAFT until version 2 is run in
# Revit: NEEDS-CHECKING Group ED.
version: 2
source: OFFICIAL
risk: ANALYZE

purpose: >
  Reads every filter applied to a view and reports the separate states that all
  have to be right before a filter draws anything, naming the one that is
  wrong. Read-only.

  **A FILTER CAN BE PRESENT AND DO NOTHING IN FOUR DIFFERENT WAYS, AND REVIT
  REPORTS NONE OF THEM AS AN ERROR.** It can be applied but switched OFF, and
  it still sits in the list looking applied. Its visibility can be off, which
  HIDES everything it matches instead of colouring it - a different switch from
  the overrides, on the same list. Its categories can be switched off in this
  view, so the filter is correct and has nothing to act on. Or its override can
  be EMPTY, which is what adding a filter without setting one leaves behind:
  present, enabled, matching, and visually identical to having no filter at
  all. Each is an afternoon, and the filter is visibly there the whole time.

  **A VIEW TEMPLATE MAY OWN THE FILTERS, WHICH IS THE ANSWER TO "MY CHANGE DID
  NOT SAVE".** When the template controls the filters slot, anything set on the
  view is discarded the moment the template reasserts. It is reported once, at
  the top, because it explains every other row at the same time.

  **IT DOES NOT REPAIR ANYTHING, AND THAT IS A DECISION.** Switching disabled
  filters back on is a write, and a write hidden inside an audit is how a
  diagnosis becomes a change nobody asked for. Turn them on with the fragment
  that owns that job, once the audit has said which ones.

  ASSUMES NOTHING ABOUT TRANSACTIONS - it opens none and needs none.

  **With `everyFilter`, every filter on the view in priority order** - its
  rules, categories, what it catches here and its override.

contract:
  needs:
    - name: doc
      type: Document
    - name: view
      type: View
      source: request
    # true lists every filter on the view in full in `filterList`. Absent is
    # false: `filterList` stays empty and the audit is version 1's, unchanged.
    # `optional: true` is what lets it be left out (HeronBindingNote.AbsentValue).
    - name: everyFilter
      type: bool
      source: request
      optional: true
  provides:
    - name: findings
      type: IList<string>
    - name: disabled
      role: result
      type: IList<ElementId>
    - name: hidden
      role: result
      type: IList<ElementId>
    - name: blankOverride
      role: result
      type: IList<ElementId>
    - name: nothingToActOn
      # ONE OF THE FOUR WAYS a filter can be present and do nothing - its
      # categories are switched off in this view. Telling those four apart
      # is the whole fragment, so this is the ANSWER, however much the name
      # reads like bookkeeping.
      role: result
      type: IList<ElementId>
    - name: templateOwned
      # THE ANSWER TO "MY CHANGE DID NOT SAVE" - reported once at the top
      # because it explains every other row at the same time.
      role: result
      type: bool
    - name: filterCount
      # How many filters are on the view at all. The size of what it examined,
      # never a fault it found (D-52).
      role: accounting
      type: int
    - name: filterList
      # VERSION 2, empty unless `everyFilter` is true. ONE STRING - a heading
      # line, then one row per filter in priority order: "1. 'Supply Air'
      # (rule) - Enable Filter ON | Visibility ON | categories (2): Ducts, Duct
      # Fittings | rule: System Type equals 'SA' | catches 214 host element(s)
      # drawn here | override: projection lines colour 0,0,255, weight 3".
      # The override cells read as REPORT_CATEGORY_OVERRIDES' allCategories
      # rows do. Empty when the view carries no filter.
      role: result
      type: string


compatibility-note: >
  One implementation for every release. `FamilyInstance.SuperComponent` and
  `GetSubComponentIds` are unchanged 2020 to 2027, and the insulation and
  lining relationships are reached through the shared wrap base type, which
  covers duct insulation, duct lining and pipe insulation with one branch
  rather than three.

# ROUTING - the same rows are in the fragments named here.
#
#   "how many AHUs are there really"    -> here. The unit count, not the
#                                          instance count
#   "count the elements"                -> COUNT_ELEMENTS, which counts
#                                          instances - correct, and a
#                                          different question
#   "count them by type"                -> GROUP_AND_COUNT
#   "what is inside this family"        -> SELECT_SUBCOMPONENTS, the DOWN walk
#                                          alone, when the parts themselves are
#                                          what the next step acts on
#   "which elements are in this group"  -> SELECT_GROUP_MEMBERS. A group is
#                                          not a nested family and behaves
#                                          differently
#   "what is in this assembly"          -> GROUP_BY_ASSEMBLY


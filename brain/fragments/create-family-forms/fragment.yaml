id: FRG-GEO-060
semantic-identity: "build extrusions, revolves, blends, sweeps and swept blends in the family - one form or a whole list in one call, solid or void, as one undo"
kind: action
domain: revit.families
capability: CREATE_FAMILY_FORMS
version: 3
source: OFFICIAL
risk: MODIFY

purpose: >
  Builds FORMS in the family open in the Family Editor - one extrusion or one
  revolve, or a list of them, one row per form, solid or void - and gives back
  every form's id in the order listed. A family of dozens of parts is one call
  and ONE entry in the undo list.

  **ONE FORM IS A LIST OF ONE ROW (version 2, 2026-11-01).**
  CREATE_FAMILY_EXTRUSION and CREATE_FAMILY_REVOLUTION, which built one form a
  call, were merged into this card and are DEPRECATED: "extrude a circle 300
  diameter 500 high" is the row `kind=extrusion workPlane=Ref. Level
  profile=circle 0,0 150 startMm=0 endMm=500 solid=true`. `formId` gives back
  the first form's id alone, beside `formIds`, so a step written for those
  tools' `formId` binds unchanged. The read-back says what theirs said: an
  extrusion's loops - how many are outlines and how many holes inside them,
  by where they lie - a revolve's angles and its axis, the plane's facing,
  and a part-turn's warning to look at which way it swept.

  **BLENDS, SWEEPS AND SWEPT BLENDS TOO (version 3, 2026-11-01).**
  CREATE_FAMILY_BLEND, CREATE_FAMILY_SWEEP and CREATE_FAMILY_SWEPT_BLEND were
  merged into this card and are DEPRECATED. `kind=blend` takes workPlane,
  baseProfile, topProfile (one loop each), topMm and solid - a square-to-round
  transition, a hopper; Revit decides which way a blend runs from the way its
  loops go round, so up to four ways are built and each READ BACK, a wrong one
  deleted. `kind=sweep` takes workPlane, path - open corners and arcs, the
  first corner written again for a closed ring - profile, drawn about its own
  origin, and solid: a handrail, a tube with its bends; the profile's area and
  the path's length are said beside its volume. `kind=swept blend` takes
  workPlane, path - ONE straight piece or ONE arc - bottomProfile and
  topProfile, one loop each, and solid: a reducing elbow. A sweep's id from
  `formIds` is what SET_FAMILY_SWEEP_PROFILE takes.

  **EACH ROW STARTS WITH ITS `kind=`** - extrusion, revolve, blend, sweep or
  swept blend - and carries the
  single-form tools' own fields: `workPlane`, `profile` and `solid`, then
  `startMm` and `endMm` for an extrusion, or `axisLine`, `startDegrees` and
  `endDegrees` for a revolve - written exactly as those tools take them. A
  row may add `material` (a family material parameter, a material in the
  family, or "by category"), and `detailLevels` and `views` as
  SET_FAMILY_FORM_VISIBILITY takes them.

  **THE LIST IS GIVEN IN THE VALUE, OR AS A FILE** - the full path of a text
  file in the temporary folder, one row per line, lines starting # ignored.
  A long list is written to the file once, under %TEMP%\heron-work, rather
  than typed into every call. That folder is read even where Revit keeps
  its own temporary folder in a sub-folder of the user's (5b-430).

  **ALL OR NOTHING.** Every row is checked before anything is built, each
  problem named with its row. Each form is then read back as the single-form
  tools read theirs - its extent, a solid's volume, a material and where it
  shows - and one row Revit refuses or that reads back wrong keeps nothing
  of the whole list.

  **A VOID CUTS NOTHING BY BEING MADE** - COMBINE_FAMILY_FORMS cuts it into
  a solid, by the ids given back.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The forms, ONE ROW EACH, each row starting kind=extrusion, kind=revolve,
    # kind=blend, kind=sweep or kind=swept blend and running to the next kind=;
    # fields are name=value, each running to the next field's name. An
    # extrusion: workPlane=, profile=, startMm=, endMm=, solid=. A revolve:
    # workPlane=, profile=, axisLine=, startDegrees=, endDegrees=, solid=.
    # VERSION 3 - a blend: workPlane=, baseProfile=, topProfile= (one loop
    # each), topMm=, solid=; a sweep: workPlane=, path= (open corners and arcs
    # "X,Y; X,Y; arc MX,MY X,Y"), profile= (about its own origin), solid=; a
    # swept blend: workPlane=, path= (one piece), bottomProfile=, topProfile=,
    # solid= - CREATE_FAMILY_BLEND's, CREATE_FAMILY_SWEEP's and
    # CREATE_FAMILY_SWEPT_BLEND's own fields. Any row may add material=,
    # detailLevels= and views=. Written as the single-form tools take them -
    # profile loops with | between ("circle CX,CY R", "rect X1,Y1 X2,Y2",
    # "polygon CX,CY R N", corners "X,Y; X,Y; arc MX,MY X,Y"), millimetres in
    # the plane's own two model coordinates; solid true or false. E.g.
    # "kind=extrusion workPlane=Ref. Level profile=circle 0,0 150 startMm=0
    # endMm=500 solid=true kind=revolve workPlane=Center (Front/Back)
    # profile=0,0; 40,0; 40,80; 0,80 axisLine=0,0 0,100 startDegrees=0
    # endDegrees=360 solid=false". WHICH WAY A PLANE RUNS, measured 2026-10-11
    # on Revit 2024 (row 5b-432): on "Center (Front/Back)" a profile is X,Z
    # and startMm/endMm run along Y toward +Y; on "Center (Left/Right)" a
    # profile is Y,Z and they run along X toward +X; on a named left-right
    # plane at X=a a revolve's profile is Y,Z in the model's own Y. Both
    # Center planes lie at 0 - on a plane elsewhere startMm/endMm count from
    # that plane by the code, not yet measured. OR the full path of a text file in the
    # temporary folder (%TEMP%\heron-work\...) holding the rows, one per line,
    # lines starting # ignored - write a long list there once.
    - name: forms
      type: string
      source: request
  provides:
    - name: formIds
      # Every new form's unique id, in the order the rows were listed, commas
      # between - what the lock, link, cut, material and visibility tools take.
      role: result
      type: string
    - name: formId
      # VERSION 2, from CREATE_FAMILY_EXTRUSION and CREATE_FAMILY_REVOLUTION:
      # the FIRST form's unique id alone - the whole answer for a list of one
      # row - so every method step and chain written for those tools'
      # `formId` binds unchanged - and, since version 3, CREATE_FAMILY_BLEND's,
      # CREATE_FAMILY_SWEEP's and CREATE_FAMILY_SWEPT_BLEND's. Empty when
      # nothing was built.
      role: result
      type: string
    - name: formCount
      # How many forms were built - every row, or none.
      role: result
      type: int
    - name: built
      # Each form as Revit now holds it, one entry per row with || between:
      # solid or void, kind, plane and its facing, an extrusion's loops -
      # outlines and holes inside them - and start and end, a revolve's angles
      # and axis (version 2); a blend's top and which way Revit took its
      # profiles, a sweep's path pieces and length and its profile's loops, a
      # swept blend's path kind and length (version 3); its extent on all
      # three axes in millimetres, a solid's volume, and any material or
      # visibility set.
      role: result
      type: string
    - name: notAFamily
      # That the document in front is a project, not a family being edited.
      role: accounting
      type: bool
    - name: refused
      # Why nothing was built, every problem named with its row. Empty when
      # the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


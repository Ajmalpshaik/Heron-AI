compatibility-note: >
  The calls CREATE_FAMILY_EXTRUSION and CREATE_FAMILY_REVOLUTION made until
  they were merged in, and LINK_FAMILY_PARAMETER and SET_FAMILY_FORM_VISIBILITY
  make, on
  every release 2020 to 2027 - `FamilyItemFactory.NewExtrusion` and
  `NewRevolution`, `SketchPlane.Create(Document, ElementId)`,
  `Extrusion.StartOffset`, `Application.ShortCurveTolerance`,
  `FamilyManager.AssociateElementParameterToFamilyParameter`,
  `GenericForm.SetVisibility` and `Element.UniqueId` - with the material
  parameter's kind read by reflection as LINK_FAMILY_PARAMETER reads it,
  because its type moved in 2022 and 2023. `System.IO.Path.GetTempPath`,
  `Guid.TryParse` and `File.ReadAllText` are the framework's own (.NET 4.0
  and later). Compiles on every release
  (tools/check-fragments-compile.py, 2026-10-11); how it behaves has not yet
  been run in Revit. Version 3 adds the calls CREATE_FAMILY_BLEND,
  CREATE_FAMILY_SWEEP and CREATE_FAMILY_SWEPT_BLEND made, unchanged 2020 to
  2027 (their own cards, read 2026-10-01 and 2026-10-08):
  `FamilyItemFactory.NewBlend(isSolid, profile1, profile2, sketchPlane)`,
  `NewSweep(isSolid, path, pathPlane, profile, index, ProfilePlaneLocation)`,
  `NewSweptBlend(isSolid, path, pathPlane, bottomProfile, topProfile)`,
  `Application.NewCurveLoopsProfile`, `Document.Delete(ElementId)`,
  `Element.IsValidObject`, `PlanarFace.FaceNormal` and `Origin`,
  `Face.EdgeLoops` and `Edge.Tessellate`. Built on all eight releases on
  2026-11-01 (tools/check-fragments-compile.py).

# 2026-11-01 - CREATE_FAMILY_EXTRUSION AND CREATE_FAMILY_REVOLUTION WERE MERGED
# INTO THIS CARD (version 2) on the owner's instruction ("make sure there is no
# duplicate tools"), and are DEPRECATED. The same building: a closed profile
# sketched on a named plane, extruded from a start to an end or turned about
# an axis, solid or void, read back all or nothing. Their inputs are a row's
# fields by the same names - workPlane, profile, startMm, endMm, solid;
# axisLine, startDegrees, endDegrees - written exactly as they took them; their
# `formId` is `formId` here, the first form's; their `built` is the row's entry
# in `built`, saying what theirs said; notAFamily, refused and findings by the
# same names. Added in version 2: `formId`, and the loops, angles, axis and
# facing in `built`. NOTHING WAS OPPOSITE: this card was written from theirs,
# with the same reader, the same checks and the same read-back.

# VERSION 3, 2026-11-01 - CREATE_FAMILY_BLEND, CREATE_FAMILY_SWEEP AND
# CREATE_FAMILY_SWEPT_BLEND WERE MERGED INTO THIS CARD on the owner's
# instruction ("make sure there is no duplicate tools", "merge means ... all
# area need to be covered", every conflict to keep the safer rule), and are
# DEPRECATED. Where each one's inputs and outputs are now:
#
#   CREATE_FAMILY_BLEND        a row kind=blend
#     workPlane, baseProfile,  the row's fields by the same names, read as it
#     topProfile, topMm, solid read them: one loop each, no holes, a height
#                              of at least Revit's shortest line
#     the four ways round      built and read back the same way, a wrong one
#                              deleted - the findings say which was taken and
#                              which turned down (5b-369)
#   CREATE_FAMILY_SWEEP        a row kind=sweep
#     workPlane, path,         the row's fields by the same names - the path
#     profile, solid           open, closed only by its own last corner; a
#                              loop a hole by where it lies (5b-276)
#     area x length finding    a finding per sweep row
#   CREATE_FAMILY_SWEPT_BLEND  a row kind=swept blend
#     workPlane, path,         the row's fields by the same names - the path
#     bottomProfile,           ONE piece, refused otherwise naming kind=sweep
#     topProfile, solid
#   formId, built, notAFamily, formId (the first row's), the row's entry in
#   refused, findings          built, and the same names
#
# What a row here adds to theirs: material=, detailLevels= and views=, and
# many forms in one undo. NOTHING WAS OPPOSITE - each reader, check and read-
# back is theirs, moved. SET_FAMILY_SWEEP_PROFILE takes a sweep's id from
# `formIds` as it took CREATE_FAMILY_SWEEP's `formId`. FREEFORM SOLIDS
# (CREATE_FAMILY_FREEFORM_SOLID) and CONCEPTUAL FORMS stay their own cards.
# Version 2's proof below no longer describes the code (impl/ changed) and is
# kept as the record; the card is DRAFT until version 3 is proved (D-30).

# ROUTING - see SET_FAMILY_SETTINGS for the whole family-building table.
#
#   "build all these forms in one go"            -> here, a list of rows
#   "make these ten extrusions and revolves"     -> here
#   "extrude a circle 300 diameter 500 high"     -> here, a list of one row
#                                                   (CREATE_FAMILY_EXTRUSION
#                                                   until 2026-11-01)
#   "make a void extrusion"                      -> here, solid=false
#   "revolve this profile into a cone"           -> here, one kind=revolve row
#                                                   (CREATE_FAMILY_REVOLUTION
#                                                   until 2026-11-01)
#   "make a box between these planes"            -> EXTRUDE_BETWEEN_PLANES,
#                                                   a box locked to four planes
#   "make an opening in this wall"               -> CREATE_OPENING, a project
#                                                   wall or floor, not a family
#   "array these round a circle"                 -> COPY_ELEMENTS, sweepDegrees -
#                                                   copies, not a turned form
#                                                   (ARRAY_ELEMENTS_RADIAL until
#                                                   2026-11-01)
#   "blend a rectangle into a circle"            -> here, one kind=blend row
#                                                   (CREATE_FAMILY_BLEND until
#                                                   2026-11-01)
#   "sweep a profile along a path"               -> here, one kind=sweep row
#                                                   (CREATE_FAMILY_SWEEP until
#                                                   2026-11-01)
#   "make a reducing elbow in the family"        -> here, one kind=swept blend
#                                                   row (CREATE_FAMILY_SWEPT_
#                                                   BLEND until 2026-11-01)
#   "make a spring as one smooth sweep along a helix" -> CREATE_FAMILY_FREEFORM_SOLID -
#                                                   a path that leaves the plane
#   "use a profile family for this sweep"        -> SET_FAMILY_SWEEP_PROFILE,
#                                                   by the sweep's id here
#   "draw a duct along this route"               -> CREATE_DUCT_RUNS, a project
#                                                   duct, not a family form
#   "cut the solid with the void"                -> COMBINE_FAMILY_FORMS, by
#                                                   the ids given back here

utterances:
  - build all these forms in one go
  - make these extrusions and revolves in one call
  - create the family's forms from this list
  - build every part of the family at once
  # MOVED 2026-11-01 from CREATE_FAMILY_EXTRUSION, merged into this card.
  - extrude a circle 300 diameter 500 high in the family
  - make a cylinder on the ref level
  - extrude this shape on the reference plane
  - make an extrusion with this profile
  - create a void extrusion in the family
  - extrude a hexagon 20 mm thick
  - make an L shaped extrusion
  - extrude a circle 300 diameter 500 high
  - make a void extrusion
  # MOVED 2026-11-01 from CREATE_FAMILY_REVOLUTION, merged into this card.
  - make a revolve in the family
  - revolve this profile around the axis
  - make a cone with a revolve
  - create a revolved dome in the family
  - make a void revolve
  - turn this half section into a round body
  # MOVED 2026-11-01 from CREATE_FAMILY_BLEND, merged into this card.
  - blend a rectangle into a circle
  - make a blend in the family
  - make a square to round transition in the family
  - create a tapered blend from this base to this top
  - make a void blend
  # MOVED 2026-11-01 from CREATE_FAMILY_SWEEP, merged into this card.
  - sweep a profile along a path
  - make a sweep in the family
  - make a handrail sweep in the family
  - sweep a circle along this path
  - create a void sweep
  - make a ring with a sweep
  # MOVED 2026-11-01 from CREATE_FAMILY_SWEPT_BLEND, merged into this card.
  - sweep one shape into another along a path
  - make a swept blend in the family
  - make a reducing elbow in the family
  - make a rectangular to round bend with a swept blend
  - create a void swept blend
  # ...and CREATE_FAMILY_BLEND's semantic identity, which nothing else declares:
  - blend one closed shape into another parallel to it on a family plane, solid or void
  # ...and CREATE_FAMILY_SWEEP's semantic identity, which nothing else declares:
  - sweep a closed shape along a path drawn on a family plane, solid or void
  # ...and CREATE_FAMILY_SWEPT_BLEND's semantic identity, which nothing else declares:
  - sweep one closed shape into another along one path piece on a family plane, solid or void

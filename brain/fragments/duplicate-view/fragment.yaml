id: FRG-VIEW-012
semantic-identity: "make a copy of this view"
kind: action
domain: revit.views
capability: DUPLICATE_VIEW
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Duplicates views. The first step of almost every drawing job — a coordination
  view, a services-only plan, a view to mark something up on without touching
  the issued one.

  **The three duplicate options are different jobs and Revit's names for them
  do not say so.**

  - `Duplicate` — geometry only. No annotation, no tags, no dimensions.
  - `WithDetailing` — geometry plus the annotation, copied and independent.
  - `AsDependent` — a child that follows the parent. Crop and scope box are
    its own; everything else stays tied, forever.

  The third is not "a copy" in the sense anybody means when they say copy, and
  choosing it by accident produces a view that mysteriously will not accept
  changes. **So the option is a stated input with no default** — D-33.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: views
      type: IList<View>
      source: request
    - name: option
      type: ViewDuplicateOption
      source: request
  provides:
    - name: created
      role: result
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>

proof:
  date: '2026-09-13'
  by: Ajmal PS
  model: test projject (3,432 elements), Revit 2024, session 40932
  positive_case: run as it would normally be run - run inside a transaction, and Revit reported
    the transaction group ROLLED BACK afterwards. returned created 1 item(s) [925806], option
    ViewDuplicateOption, refused 0 item(s). inputs came views as given (1); option as given.
    on test projject
  negative_case: run with views={3D}, option=AsDependent instead - chosen because it should
    not contain what this fragment reports - run inside a transaction, and Revit reported
    the transaction group ROLLED BACK afterwards. returned created 0 item(s), option ViewDuplicateOption,
    refused 1 item(s) [142554]. inputs came views as given (1); option as given. on test projject
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  caveat: >-
    AsDependent WAS USED AS THE REFUSAL AND NEVER AS A SUCCESS. The negative is honest - Revit
    answered CanViewBeDuplicated(AsDependent) with no for the 3D view {3D}, so created came
    back empty and refused named it. But tests/cases.yaml also expects AsDependent to produce a
    CHILD view on a view that accepts one, whose crop and scope box are its own and everything
    else stays tied to the parent forever. That path has not been run, and it is the option the
    file calls the one picked by accident. Only Duplicate is proved to create.
  fingerprint: d39eb734eaf0852e

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `View.Duplicate(ViewDuplicateOption)`
  and `View.CanViewBeDuplicated` are unchanged 2020 to 2027, and the returned
  ElementId is used as an object rather than as a number.

# ROUTING - repeated in APPLY_VIEW_TEMPLATE.
#
#   "duplicate this view"          -> here
#   "make a copy of this plan"     -> here
#   "make a new 3d view"           -> NOT here. Duplicating an existing view
#                                     and creating one from scratch are
#                                     different jobs and this does only the
#                                     first
#   "copy these to the other floors" -> COPY_ELEMENTS - elements, not views
#
# "COPY" MEANS ELEMENTS OR VIEWS DEPENDING ON THE SENTENCE, and the two
# fragments do completely different things.
#   "make another legend like this one" -> CREATE_LEGEND_VIEW. Revit can make
#                                       no legend from nothing on any release,
#                                       so copying one is the only route

utterances:
  - duplicate this view
  - make a copy of this view
  - duplicate with detailing
  - make a dependent view
  - copy this plan for coordination

positive:
  - given: >
      a new family from the metric Mass template with a box made by
      create-conceptual-form - a 6000 x 3000 profile pushed 9000 mm up; form
      its id, face "front", uGrid "6", vGrid "3000 mm", pattern ""
    expect: >
      the front face divided - U by Number 6, V 3000 mm apart - with the
      gridline counts Revit made, read back; RECORD whether Number 6 gave six
      cells or six lines (BV21); LOOKED AT in the Family Editor

  - given: >
      the same mass with "Heron Pattern Panel Test" (BV1's pattern-based
      panel) loaded; form the same, face "back", uGrid "4", vGrid "4",
      pattern "Heron Pattern Panel Test : Heron Pattern Panel Test"
    expect: >
      the back face divided and filled with the panel family, its type read
      back; each cell holds a panel

  - given: >
      VERSION 2 (row 5b-303). A new family from the metric Mass template with
      a 3000 x 2000 x 2500 mm box made by create-conceptual-form; face "top",
      uGrid "20", vGrid "4", pattern ""
    expect: >
      divided reads "U rule: Number 20; V rule: Number 4; Revit counts N
      U-gridlines and M V-gridlines" - each rule as asked, and Revit's two
      counts after them under its own names, beside no rule - and a finding
      names NEEDS-CHECKING BV21 as what settles which rule makes which lines.
      LOOKED AT in the Family Editor: RECORD which rule's lines each count
      counted (BV21)

negative:
  - given: >
      VERSION 2 (row 5b-303). The same mass, face "front", uGrid "3", vGrid
      "1000 mm"
    expect: >
      no gridline count printed beside a rule - never "U number 3, 6
      gridline(s)" - only "U rule: Number 3; V rule: 1000 mm apart" and the
      counts in their own "Revit counts ..." part. A rule that does not read
      back as asked still fails the whole call, naming what it read and what
      was asked, and nothing is kept

  - given: face "front" again on the same form
    expect: refused - that face is already divided, naming its surface - nothing changed

  - given: >
      VERSION 3 (row 5b-1989). The same mass, a face not yet divided, uGrid
      "4", vGrid "4", pattern "Not A Pattern"
    expect: >
      refused, not failed: `refused` reads "Nothing was divided. No pattern or
      panel called "Not A Pattern" is offered for this surface - Revit offers
      ..." naming the patterns and panels Revit offers, `surfaceId` and
      `divided` empty, and NO divided surface left on that face - the call
      itself succeeds. LOOKED AT in the Family Editor: the face is not divided,
      and dividing it next with a real pattern is not refused as "already
      divided"

  - given: a plain Generic Model family with an extrusion's id
    expect: refused - not a mass, adaptive or pattern-based family - nothing made

  - given: a project in front
    expect: notAFamily true and nothing divided

second_route:
  - >
      In the Family Editor, select the divided surface: Properties shows its
      U Grid and V Grid layout, number or distance, and the Type Selector its
      pattern or panel

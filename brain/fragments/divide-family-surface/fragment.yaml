compatibility-note: >
  `DividedSurface.Create`, `CanBeDivided`, `GetDividedSurfaceForReference`,
  `USpacingRule`, `VSpacingRule`, `NumberOfUGridlines`, `NumberOfVGridlines`
  and `Host`, and `SpacingRule.SetLayoutFixedNumber` and
  `SetLayoutFixedDistance` - whose remarks say a layout's number or distance,
  justification, rotation and offset are set together - read the same 2020
  through 2027 (the RevitAPI XML and reference assemblies, read 2026-10-02).
  `SpacingRuleJustification` is Center, Beginning or End on every release.
  The pattern is the element's type, from `GetValidTypes` and `ChangeTypeId`.

# ROUTING - see SET_FAMILY_CATEGORY for the whole family-building table.
#
#   "divide the surface of this mass into panels" -> here
#   "make a surface from these lines"             -> CREATE_CONCEPTUAL_FORM -
#                                                    the form to divide

utterances:
  - divide the surface of this mass into panels
  - divide the top face into a 10 by 8 grid
  - apply the glass panel family to the divided surface
  - set the divided surface spacing to 1500 mm

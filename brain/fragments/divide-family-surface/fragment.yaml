# VERSION 3 (2026-11-23) - A PATTERN REVIT DOES NOT OFFER IS REFUSED, NOT
# THROWN, and back to DRAFT. FRAGMENT-ISSUES row 5b-1989, found by reading,
# not run: the pattern can be checked only against the surface's own
# GetValidTypes, so version 2 looked it up after DividedSurface.Create and an
# unknown name THREW - the whole call failed and was rolled back, which is a
# failure, not D-30's refusal, so Group OT's Revit 2024 negative (pattern "Not
# A Pattern", expected refused) could not pass as written. Now the division is
# made inside a SubTransaction, the pattern is looked up the moment the surface
# exists, and a name Revit does not offer - or one naming two types - rolls the
# SubTransaction back and comes back as `refused`: "Nothing was divided. No
# pattern or panel called ... - Revit offers ...". Everything else is version
# 2's, in the same order. Version 2 was PROVEN on Revit 2020 (the proof block
# below, kept as the record of what it proved); its C# moved, so it is DRAFT
# again until NEEDS-CHECKING Group PY is run (D-30).

# VERSION 2 (2026-11-20) - EACH RULE AS ASKED, REVIT'S GRIDLINE COUNTS UNDER
# ITS OWN NAMES, and back to DRAFT. FRAGMENT-ISSUES row 5b-303: on a Revit
# 2024 Mass family, a 3000 x 2000 x 2500 mm form, the top face with uGrid=20
# vGrid=4 read "U number 20, 7 gridline(s); V number 4, 23 gridline(s)", and
# the front face with uGrid=3 vGrid=1000 mm and uGrid=6 vGrid=500 mm read 6
# and 6, 9 and 9 - each count moving with the OTHER rule's value. Version 1
# paired USpacingRule with NumberOfUGridlines and VSpacingRule with
# NumberOfVGridlines, so "U number 20, 7 gridlines" told the modeller
# something false. The impl was checked first: uGrid is written to
# USpacingRule and vGrid to VSpacingRule, not crossed, so the words were the
# defect. `divided` now reads "U rule: Number 20; V rule: Number 4; Revit
# counts 7 U-gridlines and 23 V-gridlines" - each rule as asked, the counts
# under Revit's own names and beside no rule - and a finding says which rule
# makes which lines is NEEDS-CHECKING BV21's to settle by eye. A rule that
# does not read back as asked still fails the call, its words now naming
# what it read and what was asked. Version 1 was PROVEN (the proof block
# below, kept as the record of what it proved); its C# moved, so it is DRAFT
# again until NEEDS-CHECKING Group OT is run (D-30) - on the owner's word
# that a fragment found wrong may be changed even though it is proven.

purpose: >
  DIVIDES A SURFACE in a mass, an adaptive component or a pattern-based panel
  open in the Family Editor - the conceptual Family Editor's Divide Surface:
  a U and a V grid laid on one face of a form, so a pattern-based panel family
  can fill every cell - a facade's panels, a canopy's glazing.

  **THE FORM BY ITS ID, THE FACE BY WHICH WAY IT FACES.** The form is the id
  CREATE_CONCEPTUAL_FORM gave back; the face is top, bottom, front, back, left
  or right, or "largest" when not said - chosen only from the faces Revit's own
  CanBeDivided accepts. A face already divided is refused with its surface's id.

  **EACH GRID A NUMBER OR A DISTANCE.** "10" is Revit's Number for that
  direction, "1500 mm" a fixed distance; empty leaves Revit's default layout.
  Both centred, unrotated, with no offset. Whether Number counts the cells or
  the lines between them is not promised: the gridline count Revit made is
  reported, and BV21 records it.

  **THE PATTERN OR PANEL, OPTIONAL**: a tile pattern by name - Rectangle,
  Hexagon - or a loaded pattern-based panel family's type, "Panel : Glass",
  chosen only from the types Revit lists as valid for this surface. A name
  Revit does not offer is refused, naming what it does offer, and nothing is
  kept (version 3).

  **READ BACK, ALL OR NOTHING**: the surface's host, each grid's layout and
  value, its gridline counts and its type are read again; one that does not
  read as asked fails the call. The surface's id comes back.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The form's unique id, from CREATE_CONCEPTUAL_FORM or REPORT_FAMILY_FORMS.
    - name: form
      type: string
      source: request
    # top, bottom, front, back, left, right - or empty for the largest face.
    - name: face
      type: string
      source: request
    # "10" (Revit's Number) or "1500 mm" (a fixed distance). Empty: Revit's default.
    - name: uGrid
      type: string
      source: request
    - name: vGrid
      type: string
      source: request
    # A tile pattern - "Rectangle" - or a loaded panel family's "Family : Type".
    # Empty leaves Revit's default.
    - name: pattern
      type: string
      source: request
  provides:
    - name: surfaceId
      # The divided surface's unique id.
      role: result
      type: string
    - name: divided
      # The face, each rule's layout and value as asked, Revit's U- and
      # V-gridline counts under its own names and beside no rule (version 2,
      # BV21), and the pattern - read back, on ONE line.
      role: result
      type: string
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing was divided, in plain words - a pattern Revit does not
      # offer among them, naming what it offers (version 3). Empty when the
      # call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


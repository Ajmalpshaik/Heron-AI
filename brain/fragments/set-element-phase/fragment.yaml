id: FRG-PAR-007
semantic-identity: "put these elements on a different phase"
kind: action
domain: revit.phases
capability: SET_ELEMENT_PHASE
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Moves elements onto a different created-phase, or sets when they are
  demolished.

  **Before this, *"set the phase"* resolved to SET_ELEMENT_WORKSET** - a write,
  to the wrong property, that looks like it worked. A workset and a phase are
  both invisible groupings that decide what a view shows, and confusing them
  silently moves work into another team's ownership while leaving it in the
  wrong phase.

  **Changing a phase changes what every view shows, not just this one.** A
  view has a phase and a phase filter; an element on the wrong phase vanishes
  from some views, appears as demolished in others, and comes out of the wrong
  schedule. That is the whole point of phases and it is why this is a bulk
  change worth confirming before running.

  **Demolishing is a separate field from creating**, and setting the wrong one
  is how existing work disappears. Which one is being set is required, never
  inferred from the phase's name.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: phaseId
      type: ElementId
      source: request
    - name: whichPhase
      type: string
      source: request
  provides:
    - name: changed
      role: result
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>
    - name: readOnly
      # Elements whose phase parameter will not take a write. Given and
      # unusable, never a change it made (D-52).
      role: accounting
      type: IList<ElementId>
    - name: alreadySet
      # Elements that were ALREADY in the state asked for, so there was
      # nothing to do. The evidence it looked, never a change it made
      # (D-52).
      role: accounting
      type: IList<ElementId>


heron-agent: HERON-REVIT-PAR-030
heron-step: 14
heron-status: DRAFT
heron-since: 0.1.0
heron-layer: brain

id: FRG-PAR-008
semantic-identity: "put these elements on a phase, or mark them demolished on one"
kind: action
domain: revit.parameters
capability: SET_ELEMENT_PHASE
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Sets an element's **Phase Created**, its **Phase Demolished**, or both.

  **`WRITE_ELEMENT_PARAMETERS` CANNOT DO THIS AT ALL.** Both phase parameters
  store an `ElementId`, not text - so a fragment that writes a value cannot set
  one, and the phase name is not the thing being stored. The name has to be
  resolved to the phase element first, which is why `REPORT_PHASES` is the step
  before this one.

  **CREATED AND DEMOLISHED ARE INDEPENDENT AND BOTH ARE OPTIONAL.** Setting only
  one is the normal case - *"put these on New Construction"* touches Created and
  must not clear Demolished. An empty name for either means *leave it alone*,
  which is a different instruction from *clear it*.

  **A PHASE NAME THAT DOES NOT EXIST STOPS THE JOB BEFORE ANYTHING IS
  WRITTEN.** Half a set on one phase and half untouched is worse than nothing
  done, because the model then looks partly correct and the failure is invisible
  in a plan. `phaseNotFound` says which name, and nothing is written.

  **DEMOLISHING BEFORE CREATING IS REFUSED BY REVIT AND IS REPORTED, NOT
  SWALLOWED.** An element demolished on a phase earlier than the one it was
  created on is not a thing, and Revit rejects the write. That is a real
  modelling error worth seeing rather than a count that quietly comes up short.

  **IT READS BACK.** Every element reported as set was re-read afterwards.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: createdPhase
      type: string
      source: request
    - name: demolishedPhase
      type: string
      source: request
  provides:
    - name: created
      type: IList<ElementId>
    - name: demolished
      type: IList<ElementId>
    - name: refused
      type: IList<ElementId>
    - name: absent
      type: IList<ElementId>
    - name: unverified
      type: IList<ElementId>
    - name: phaseNotFound
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `PHASE_CREATED`, `PHASE_DEMOLISHED`,
  `Document.Phases` and `Parameter.Set(ElementId)` are unchanged 2020 to 2027.
  The phase is carried as an `ElementId` throughout and never as a number, which
  keeps this clear of the 2024 64-bit change, and no units API is touched.

utterances:
  - put these on the new construction phase
  - set the phase on these elements
  - mark these as demolished
  - which phase are these on - change it
  - move these to the existing phase

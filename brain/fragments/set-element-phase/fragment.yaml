revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  `BuiltInParameter.PHASE_CREATED` and `PHASE_DEMOLISHED` are unchanged 2020 to
  2027, and both are `ElementId` parameters set with `Parameter.Set(ElementId)`.
  No ElementId is built from an int, so 2024's 64-bit ids do not reach this
  code.

# ROUTING - repeated in READ_ELEMENT_PHASE and SET_ELEMENT_WORKSET.
#
#   "set the phase"              -> here
#   "move these to New Construction" -> here
#   "mark these as demolished"   -> here, with the demolished field asked for
#   "which phase is this on"     -> READ_ELEMENT_PHASE - a QUESTION
#   "put these on the MEP workset" -> SET_ELEMENT_WORKSET. A WORKSET is who
#                                     owns the work; a PHASE is when it exists.
#                                     Both are invisible groupings that change
#                                     what a view shows, and "set the phase"
#                                     resolved to the workset fragment until
#                                     2026-09-02 - a write, to the wrong
#                                     property, that looks like it worked

utterances:
  - set the phase
  - move these to New Construction
  - change the phase on these
  - mark these as demolished
  - these are on the wrong phase
  - put these in the existing phase

compatibility-note: >
  One implementation for every release. `ElementIntersectsSolidFilter`,
  `GeometryCreationUtilities.CreateExtrusionGeometry`, `CurveLoop.Create` and
  `FamilyInstance.GetTransform` are unchanged 2020 through 2027 - read off the
  reference assemblies at both ends. All four clearances arrive in internal
  FEET; the millimetres the person spoke are converted at the edge, before this.

# ROUTING - repeated in CHECK_MINIMUM_CLEARANCE, CHECK_VALVE_ACCESSIBILITY and
# CHECK_OBSTRUCTIONS.
#
#   "is there enough space in front of the panel to open the door" -> here
#   "can this unit be serviced"          -> here
#   "check the maintenance space round the plant" -> here
#   "can we reach the valve to operate it" -> CHECK_VALVE_ACCESSIBILITY - that
#                                        asks three questions this does not:
#                                        room, an access panel above a ceiling,
#                                        and whether it is within reach
#   "what is too close to what"          -> CHECK_MINIMUM_CLEARANCE - a gap in
#                                        ANY direction between two sets. This
#                                        one is a zone with a front and a back
#   "is anything above this point"       -> CHECK_OBSTRUCTIONS - one ray from
#                                        one point
#   "what is around this equipment"      -> PROBE_AROUND_ELEMENTS, for what
#                                           is actually there rather than
#                                           whether a stated clearance holds

utterances:
  - is there enough space in front of the panel to open the door
  - can this unit be serviced
  - check the maintenance space round the plant
  - is the access clear round this equipment
  - what is blocking the front of this unit

id: FRG-QA-017
semantic-identity: "is the maintenance space round this equipment clear"
kind: filter
domain: revit.qa
capability: CHECK_EQUIPMENT_CLEARANCE
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Checks the maintenance and access zone around each piece of equipment - the
  space in front for pulling a coil or opening a panel door, at the sides, above
  for the valves - and reports everything modelled inside it. *"Can this be
  serviced once the building is up"*, answered from the model instead of on
  site. Read-only.

  **THE ZONE IS DIRECTIONAL, AND THAT IS THE WHOLE POINT.** A plain *"keep a
  metre clear all round"* is not how equipment is serviced: an air handling unit
  needs a metre and a half in FRONT for coil withdrawal and 200 mm behind. A
  check that cannot tell those apart either passes real obstructions or fails on
  the wall the unit is meant to stand against - and both make it useless. Each
  face carries its own figure.

  **"FRONT" IS THE FAMILY'S OWN FACING DIRECTION, AND IT IS WORTH CHECKING
  ONCE.** The zone is built on the instance's transform, so it rotates with the
  unit. If a family was authored facing the wrong way its front zone points into
  the wall and the check is confidently wrong, which is why every unit's facing
  direction is REPORTED rather than assumed correct.

  **THE EQUIPMENT'S OWN SERVICES ARE NOT OBSTRUCTIONS.** The duct plugged into
  the unit necessarily fills the space at its connector. Anything connected to
  it, and its own sub-components, are excluded - otherwise every unit reports
  its own pipework as blocking it and the check gets switched off.

  **WITHOUT `includeLinks` LINKED MODELS ARE NOT SCANNED, AND A CLEAN RESULT
  MAY THEREFORE HAVE CHECKED NOTHING.** Structure and architecture usually arrive as links and are
  exactly what blocks access. The count of host-model candidates is reported for
  that reason.

  **EVERY FIGURE IS A PER-REQUEST INPUT (D-33).** Manufacturers' clearances
  differ per unit; there is no default here, because a number nobody chose
  applied to a plant room is the failure this rule exists for.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, each unit's access zone is carried into
  every placement of every loaded link and tested with the same solid
  test; rooms, spaces and areas are not obstructions. Every unit something
  in a link blocks gets a line in `linkedMatches` naming the linked walls,
  columns or beams with their type, id IN THE LINK and **Fire Rating** -
  structure and architecture are exactly what blocks access, and they are
  usually links. `linksSearched` says how many links were read: set and 0
  means "you asked, and none are loaded". **NOTHING FROM A LINK IS
  CARRIED** - `blocked` stays this model's answer (FRAGMENT-ISSUES row 75).
  Only model elements are read from a link, never its views or sheets.
  Links nested inside a link are not read, and are counted in the answer.
  This is version 2; version 1's proof no longer describes the code, and
  the fragment is DRAFT until it is proved again.

# A NAME TWO PARAMETERS SHARE IS NEVER READ: a linked element whose Fire Rating
# two parameters carry - a shared or project "Fire Rating" bound beside the
# built-in one, on the element or on the type the lookup falls through to -
# reads "Fire Rating NOT READ - N parameters share that name" in
# `linkedMatches`, never either value (D-54 s3, FRAGMENT-ISSUES 5b-203; added
# 2026-10-09). Written here and not in `purpose`, as on check-sleeve-size's
# card: the purpose is embedded for routing, and on that card's change a
# purpose sentence about this moved other cards' utterances in check-routing,
# measured against d9b27f03 (row 5b-203's 2026-10-09 note). Not measured for
# this card.
contract:
  needs:
    - name: doc
      type: Document
    - name: equipment
      type: IList<Element>
    - name: frontClearance
      type: double
      source: request
    - name: sideClearance
      type: double
      source: request
    - name: backClearance
      type: double
      source: request
    - name: topClearance
      type: double
      source: request
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: findings
      type: IList<string>
    - name: blocked
      role: result
      type: IList<ElementId>
    - name: unreadable
      # What it was handed and could NOT read. The evidence it tried,
      # never a thing it found (D-52).
      role: accounting
      type: int
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then the links' own lines. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75). Since 2026-10-09 a Fire
      # Rating two parameters share reads NOT READ there, never either
      # value (D-54 s3, FRAGMENT-ISSUES 5b-203).
      role: accounting
      type: IList<string>


compatibility-note: >
  `Document.CombineElements(CombinableElementArray)` returning a
  `GeomCombination`, `CombinableElement.Combinations`, `GenericForm.IsSolid`,
  `Selection.GetElementIds` and `Document.GetElement(string)` read the same
  2020 through 2027 (the RevitAPI reference assemblies and their own XML
  remarks, read 2026-10-01). The same remarks are the evidence that
  `SolidSolidCutUtils.AddCutBetweenSolids` and `JoinGeometryUtils.JoinGeometry`
  refuse an ordinary family document on every release. The read-back added
  for 5b-405 - `SubTransaction`, `SolidUtils.Clone`, `Solid.IntersectWithCurve`,
  `Face.Triangulate`, `Face.Project` and `Face.ComputeNormal` - compiles on
  every release 2020 to 2027 (tools/check-fragments-compile.py, 2026-10-08);
  how it behaves was measured on Revit 2024 only. The spare directions a ray
  Revit cannot cast is replaced by (5b-1001) compile on every release too
  (the same tool, 2026-10-17); measured on Revit 2024 only. Version 3's
  `Group.GetMemberIds` and `Element.GroupId` read the same 2020 through 2027
  (`tools/api-surface --members`, 2026-11-20).


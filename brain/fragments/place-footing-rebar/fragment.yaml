# ROUTING - the same rows are in every rebar card.
#
#   "bottom mesh in these pad footings"         -> here
#   "T16 at 150 both ways in the pile caps"     -> here
#   "T12 at 200 both ways in this slab"         -> PLACE_AREA_REINFORCEMENT
#   "reinforce the raft"                        -> PLACE_AREA_REINFORCEMENT
utterances:
  - put T16 at 150 both ways bottom in these pad footings, 75 cover
  - reinforce these footings with a bottom and top mesh
  - add rebar to the pile caps
  - place footing bars both ways

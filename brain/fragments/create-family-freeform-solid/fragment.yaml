compatibility-note: >
  `FreeFormElement.Create(Document, Solid)`,
  `GeometryCreationUtilities.CreateLoftGeometry(IList<CurveLoop>,
  SolidOptions)`, `CreateSweptGeometry(CurveLoop, int, double,
  IList<CurveLoop>)`, `HermiteSpline.Create(IList<XYZ>, bool,
  HermiteSplineTangents)`, `Ellipse.CreateCurve`, `GenericForm.IsSolid` (read
  only) and `SolidOptions(ElementId, ElementId)` read the same 2020 through
  2027 (tools/api-surface, read 2026-10-07). What Revit DOES with them was
  measured on Revit 2024 only, on a scratch Generic Model family, rolled back,
  2026-10-07: a freeform form is accepted in an ordinary family; its
  Solid/Void field (`ELEMENT_IS_CUTTING`) is writable and makes it a void that
  `Document.CombineElements` cuts a solid with; `CylindricalHelix` is refused
  for a sweep ("a helical curve ... not supported"); a closed spline cut in two
  is refused by the loft, two open splines with matching ends are not; a loft
  takes tilted and warped sections; a sweep along a path that crosses itself
  is built without complaint. Earlier releases are NEEDS-CHECKING CV.

# ROUTING - see SET_FAMILY_CATEGORY for the whole family-building table.
#
#   "make a spring as one smooth sweep along a helix" -> here
#   "loft a smooth body through elliptical sections"  -> here
#   "sweep a profile along a path"               -> CREATE_FAMILY_SWEEP - a
#                                                   path in one plane, and it
#                                                   stays parametric
#   "sweep one shape into another along a path"  -> CREATE_FAMILY_SWEPT_BLEND
#   "blend a rectangle into a circle"            -> CREATE_FAMILY_BLEND - two
#                                                   parallel shapes, parametric
#   "loft a form through these two profiles"     -> CREATE_CONCEPTUAL_FORM - in
#                                                   an adaptive or mass family
#   "link the body material to Body Material"    -> SET_FAMILY_FORM_MATERIAL
#   "cut the solid with the void"                -> COMBINE_FAMILY_FORMS

utterances:
  - make a spring as one smooth sweep along a helix
  - sweep a circle along a helix
  - sweep a profile along a 3D path
  - loft a smooth body through elliptical sections
  - loft through these sections in the family
  - make a freeform solid in the family
  - make one smooth form instead of many small pieces
  - create a freeform void

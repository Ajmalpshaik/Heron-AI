compatibility-note: >
  One implementation for every release. `View.GetCategoryOverrides`,
  `Document.Settings.Categories` and the `OverrideGraphicSettings` GETTERS are
  present 2020 through 2027 - read off the reference assemblies at both ends.
  The getters are the half of that class that did NOT move; its setters were
  renamed, which is why `OVERRIDE_GRAPHICS_IN_VIEW` refuses to build the object
  and this can freely read one. The CUT half of the fill,
  `CutForegroundPatternId` and `CutForegroundPatternColor`, read since
  2026-09-22, is two more getters on the same class - compiled on all eight
  releases by tools/check-fragments-compile.py the day they were added.

# ROUTING - repeated in READ_GRAPHIC_OVERRIDES, SET_CATEGORY_GRAPHICS and
# DIAGNOSE_VISIBILITY.
#
#   "what category overrides are on this view" -> here
#   "why is this whole category grey" -> here
#   "which categories are overridden" -> here
#   "what colour is this one overridden to" -> READ_GRAPHIC_OVERRIDES - the
#                                        PER-ELEMENT override. It cannot see a
#                                        category override and says so
#   "grey the background"            -> SET_CATEGORY_GRAPHICS - the WRITE
#   "why is this element not visible" -> DIAGNOSE_VISIBILITY - visibility is a
#                                        different setting from an override

#   "which categories are turned off in this view" ->
#                                        REPORT_CATEGORY_VISIBILITY - OFF is
#                                        not the same as OVERRIDDEN, and that
#                                        one deliberately does NOT scope to the
#                                        view: a hidden category has nothing in
#                                        a view-scoped collector to find
utterances:
  - what category overrides are on this view
  - why is this whole category grey
  - which categories are overridden
  - read the category overrides
  - what has been overridden in this view

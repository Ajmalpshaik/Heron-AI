id: FRG-VIEW-051
semantic-identity: "which categories are overridden in this view"
kind: filter
domain: revit.views
capability: REPORT_CATEGORY_OVERRIDES
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Lists which CATEGORIES carry a graphic override in one view - the reverse
  lookup for `SET_CATEGORY_GRAPHICS`, which only ever sets. Read-only.

  **`READ_GRAPHIC_OVERRIDES` CANNOT ANSWER THIS, AND SAYS SO IN ITS OWN
  PURPOSE** - it reads the PER-ELEMENT override only. Yet *"what category
  overrides are on this view"* was resolving to it, which is a question answered
  by a fragment that structurally cannot answer it: the worst kind of near-miss,
  because the reply comes back empty and reads as *"nothing is overridden"*.

  **THE VISIBILITY FLAG IS NOT THE SIGNAL, AND THIS IS THE TRAP.** A pattern's
  own "is visible" property reads TRUE on a category with nothing overridden at
  all, so a check built on it reports every category in the model as overridden.
  The real signal is a VALID COLOUR or a REAL PATTERN ID - something that was
  actually set.

  **IT LOOKS AT THE CATEGORIES PRESENT IN THE VIEW, not at every category in the
  document.** A model has hundreds; a drawing shows a few dozen. Scanning them
  all produces a report nobody reads, and the ones absent from the view cannot
  be why it looks wrong.

  **THIS IS THE OTHER HALF OF THE GRAYOUT QUESTION.** An element that is grey
  with no per-element override is grey because its CATEGORY is - and until this
  existed, nothing in the library could say that.

contract:
  needs:
    - name: doc
      type: Document
    - name: view
      type: View
      source: request
  provides:
    - name: findings
      type: IList<string>
    - name: overriddenCategories
      role: result
      type: IList<ElementId>
    - name: overrideList
      # EVERY OVERRIDDEN CATEGORY, EACH LINE IN FULL, JOINED - the answer this
      # fragment exists to give, and the one to read when this is the read
      # half of SET_CATEGORY_GRAPHICS or SET_CATEGORY_SOLID_FILL. A STRING
      # because a reply shows a list as its first three entries, each cut to
      # sixty characters, and a category's fill starts past the sixtieth once
      # its line colours are set: measured 2026-09-22, the Walls line after a
      # solid fill arrived as "Walls: line RGB(0,255,0), cut line
      # RGB(0,255,0), surface RGB..." and so did the same colours with no
      # pattern at all. `findings` carries the same lines and is kept - it is
      # the prose every proof record quotes. Empty when nothing is overridden.
      role: result
      type: string


compatibility-note: >
  One implementation for every release. `View.GetCategoryOverrides`,
  `Document.Settings.Categories` and the `OverrideGraphicSettings` GETTERS are
  present 2020 through 2027 - read off the reference assemblies at both ends.
  The getters are the half of that class that did NOT move; its setters were
  renamed, which is why `OVERRIDE_GRAPHICS_IN_VIEW` refuses to build the object
  and this can freely read one. The CUT half of the fill,
  `CutForegroundPatternId` and `CutForegroundPatternColor`, read since
  2026-09-22, is two more getters on the same class - compiled on all eight
  releases by tools/check-fragments-compile.py the day they were added.

  Version 2 adds, read off the reference assemblies of all eight releases on
  2026-10-15: `Category.AllowsVisibilityControl(View)` - an INDEXED property on
  every release, so the call is `get_AllowsVisibilityControl(view)`, the trap
  the 2026-10-15 probe hit on Revit 2020; `View.GetCategoryHidden`,
  `View.GetElementOverrides`, `Category.SubCategories`, `CategoryType`,
  `LineColor`, `GetLineWeight`, `GetLinePatternId` and `IsCuttable`; the
  background-pattern and Visible-tick getters of `OverrideGraphicSettings`; and
  `BuiltInParameter.VIS_GRAPHICS_MODEL` / `VIS_GRAPHICS_ANNOTATION`. No
  `ElementId` number is read - it changes type at 2024 and loses
  `IntegerValue` at 2026 - so categories are keyed by `ElementId` itself.

# ROUTING - repeated in READ_GRAPHIC_OVERRIDES, SET_CATEGORY_GRAPHICS and
# DIAGNOSE_VISIBILITY.
#
#   "what category overrides are on this view" -> here
#   "why is this whole category grey" -> here
#   "which categories are overridden" -> here
#   "what colour is this one overridden to" -> READ_GRAPHIC_OVERRIDES - the
#                                        PER-ELEMENT override. It cannot see a
#                                        category override and says so
#   "grey the background"            -> SET_CATEGORY_GRAPHICS - the WRITE
#   "why is this element not visible" -> DIAGNOSE_VISIBILITY - visibility is a
#                                        different setting from an override

#   "which categories are turned off in this view" ->
#                                        REPORT_CATEGORY_VISIBILITY - OFF is
#                                        not the same as OVERRIDDEN, and that
#                                        one deliberately does NOT scope to the
#                                        view: a hidden category has nothing in
#                                        a view-scoped collector to find
#
# VERSION 2 - with allCategories true. A QUESTION ABOUT THE DIALOG GOES TO A
# READ: SET_CATEGORY_VISIBILITY, SET_CATEGORY_GRAPHICS, SET_CATEGORY_SOLID_FILL
# and APPLY_VIEW_FILTER change the view, and on 2026-10-15 the first of these
# sentences reached SET_CATEGORY_VISIBILITY.
#
#   "show me the full visibility graphics of this view" -> here
#   "what colours, line weights and patterns does this view use" -> here
#   "which categories are greyed out in this view" -> here
#   "which sub-categories are overridden in this view" -> here
#   "which elements have their own override in this view" -> here, the whole
#                                        view; READ_GRAPHIC_OVERRIDES reads the
#                                        elements chosen
#   "what are the filter rules on this view" -> AUDIT_VIEW_FILTERS, with
#                                        everyFilter true
#
# The document's own Object Styles, with no view in the question, are
# LIST_CATEGORIES version 2's; this card prints them only BESIDE the view's
# override, because the comparison is the answer.
utterances:
  - what category overrides are on this view
  - why is this whole category grey
  - which categories are overridden
  - read the category overrides
  - what has been overridden in this view
  # VERSION 2 - the three sentences the 2026-10-15 study asked, answered with
  # allCategories true. The first reached SET_CATEGORY_VISIBILITY, a write.
  - show me the full visibility graphics of this view
  - what colours, line weights and patterns does this view use
  - which categories are greyed out in this view

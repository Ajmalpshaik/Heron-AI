id: FRG-VIEW-051
semantic-identity: "which categories are overridden in this view"
kind: filter
domain: revit.views
capability: REPORT_CATEGORY_OVERRIDES
# VERSION 2 (2026-10-15, FRAGMENT-ISSUES 5b-480): `allCategories` reads the
# view's WHOLE Visibility/Graphics - every model category hidden, overridden or
# drawn, sub-categories, annotation categories and per-element overrides, each
# section one string. Version 1 scanned only the categories the HOST draws in
# the view, so on a real HVAC project on Revit 2020 it said "7 of 16" while the
# view overrode 77 of 85 model categories for the LINKED architecture. Left out
# it is false and every version 1 output is computed exactly as before. DRAFT
# until version 2 is run in Revit: NEEDS-CHECKING Group ED.
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Lists which CATEGORIES carry a graphic override in one view - the reverse
  lookup for `SET_CATEGORY_GRAPHICS`, which only ever sets. Read-only.

  **`READ_GRAPHIC_OVERRIDES` CANNOT ANSWER THIS, AND SAYS SO IN ITS OWN
  PURPOSE** - it reads the PER-ELEMENT override only. Yet *"what category
  overrides are on this view"* was resolving to it, which is a question answered
  by a fragment that structurally cannot answer it: the worst kind of near-miss,
  because the reply comes back empty and reads as *"nothing is overridden"*.

  **THE VISIBILITY FLAG IS NOT THE SIGNAL, AND THIS IS THE TRAP.** A pattern's
  own "is visible" property reads TRUE on a category with nothing overridden at
  all, so a check built on it reports every category in the model as overridden.
  The real signal is a VALID COLOUR or a REAL PATTERN ID - something that was
  actually set.

  **IT LOOKS AT THE CATEGORIES PRESENT IN THE VIEW, not at every category in the
  document.** A model has hundreds; a drawing shows a few dozen. Scanning them
  all produces a report nobody reads, and the ones absent from the view cannot
  be why it looks wrong.

  **THIS IS THE OTHER HALF OF THE GRAYOUT QUESTION.** An element that is grey
  with no per-element override is grey because its CATEGORY is - and until this
  existed, nothing in the library could say that.

  **The whole Visibility/Graphics of the view, with `allCategories`.** Every
  category hidden, overridden or drawn - linked models included, since an
  override acts on them too - with each override's colours, line weights and
  patterns beside its Object Styles; the sub-categories and annotation
  categories hidden or overridden; and the elements that carry their own
  override. The view filters are AUDIT_VIEW_FILTERS'.

contract:
  needs:
    - name: doc
      type: Document
    - name: view
      type: View
      source: request
    # true reads the view's WHOLE Visibility/Graphics into the four strings
    # below - every category the document has, not only those the host draws
    # here. Absent is false: the four stay empty and findings,
    # overriddenCategories and overrideList are version 1's, unchanged.
    # `optional: true` is what lets it be left out (HeronBindingNote.AbsentValue).
    - name: allCategories
      type: bool
      source: request
      optional: true
  provides:
    - name: findings
      type: IList<string>
    - name: overriddenCategories
      role: result
      type: IList<ElementId>
    - name: overrideList
      # EVERY OVERRIDDEN CATEGORY, EACH LINE IN FULL, JOINED - the answer this
      # fragment exists to give, and the one to read when this is the read
      # half of SET_CATEGORY_GRAPHICS or SET_CATEGORY_SOLID_FILL. A STRING
      # because a reply shows a list as its first three entries, each cut to
      # sixty characters, and a category's fill starts past the sixtieth once
      # its line colours are set: measured 2026-09-22, the Walls line after a
      # solid fill arrived as "Walls: line RGB(0,255,0), cut line
      # RGB(0,255,0), surface RGB..." and so did the same colours with no
      # pattern at all. `findings` carries the same lines and is kept - it is
      # the prose every proof record quotes. Empty when nothing is overridden.
      role: result
      type: string
    # VERSION 2 - the four below are empty unless `allCategories` is true. Each
    # is ONE STRING, a heading line and then one row per line, because a reply
    # cuts a list to three items of sixty characters and a dictionary to a
    # count, and on the view that found this the rows numbered in the hundreds.
    - name: modelCategoryList
      # Every MODEL category hidden, overridden or with host elements in the
      # view: "Walls [shown, 12 in view] V/G: projection lines colour
      # 128,128,128, weight 1; halftone | Object Styles: colour 0,0,0,
      # projection weight 1, cut weight 3, pattern Solid". A category with
      # nothing in the host is still listed when it is hidden or overridden -
      # that override acts on the linked models.
      role: result
      type: string
    - name: subCategoryList
      # Every sub-category hidden or overridden, "category > sub-category",
      # with its own Object Styles beside it.
      role: result
      type: string
    - name: annotationCategoryList
      # Every annotation category hidden or overridden.
      role: result
      type: string
    - name: elementOverrideList
      # Override Graphics in View > By Element: the elements in the view that
      # carry their own override, grouped by category and identical override,
      # each group's count and its first five ids.
      role: result
      type: string


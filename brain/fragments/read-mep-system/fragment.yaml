id: FRG-MEP-008
semantic-identity: "what system are these on - name, type and abbreviation"
kind: action
domain: revit.mep
capability: READ_MEP_SYSTEM
version: 1
source: OFFICIAL
risk: READ

purpose: >
  The system each element belongs to: the system name, the system type, and the
  abbreviation that ends up on the tag.

  **The system NAME and the system TYPE are different things and a modeller
  says "system" for both.** The type is Supply Air or Domestic Cold Water — the
  classification. The name is `SA 1` — the particular run. Two ducts can share
  a type and be on entirely separate systems, which is exactly the case
  somebody is checking when they ask.

  **An element with no system is a finding, not a blank.** A duct on no system
  is usually a duct that is not actually connected — which is the same defect
  `TRACE_CONNECTIVITY` exists for, arrived at from the data side rather than
  the geometry side. It is named, never left out.

contract:
  needs:
    - name: elements
      type: IList<Element>
  provides:
    - name: systemName
      type: IDictionary<ElementId, string>
    - name: systemType
      type: IDictionary<ElementId, string>
    - name: noSystem
      type: IList<ElementId>


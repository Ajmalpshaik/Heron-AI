  fingerprint: 901ac76e21d935c5

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `RBS_SYSTEM_NAME_PARAM`,
  `RBS_SYSTEM_CLASSIFICATION_PARAM` and `RBS_DUCT_SYSTEM_TYPE_PARAM` are
  unchanged 2020 to 2027, and the values are read as STRINGS through
  `AsValueString` where they are not stored as text - which avoids reaching
  for an ElementId and keeps this clear of 2024's 64-bit change.

# ROUTING - repeated in TRACE_CONNECTIVITY and READ_ELEMENT_PARAMETERS.
#
#   "what system is this on"          -> here
#   "what connects to what"           -> TRACE_CONNECTIVITY - the geometry
#   "is the ductwork still connected" -> TRACE_CONNECTIVITY
#   "what size is it"                 -> READ_ELEMENT_PARAMETERS
#
# THE SYSTEM DATA AND THE PHYSICAL CONNECTION ARE TWO DIFFERENT ANSWERS TO
# "IS THIS CONNECTED", and this repository has already been caught out by
# trusting the first: the CRAC pairing was wrong in the names and in the
# connector flags, and only the geometry told the truth. Read this one as
# what the model SAYS, not as what is physically joined.

#   "make a duct system type"            -> CREATE_MEP_SYSTEM_TYPE - a WRITE
utterances:
  - what system is this on
  - which system are these
  - what is the system name
  - are these all on the same system
  - what system type is this

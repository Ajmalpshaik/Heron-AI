compatibility-note: >
  One implementation for every release, no #if. DimensionType, StyleType,
  GetUnitsFormatOptions, ElementType.FamilyName, Dimension, FormatOptions
  UseDefault and Accuracy, Units, and the parameters TEXT_SIZE, TEXT_FONT,
  TEXT_WIDTH_SCALE, TEXT_STYLE_BOLD, TEXT_STYLE_ITALIC, TEXT_STYLE_UNDERLINE,
  DIM_TEXT_BACKGROUND, TEXT_BACKGROUND, TEXT_DIST_TO_LINE,
  DIM_LEADER_ARROWHEAD, LINE_PEN, TICK_MARK_PEN, LINE_COLOR,
  DIM_LINE_EXTENSION, DIM_WITNS_LINE_CNTRL, WITNS_LINE_GAP_TO_ELT and
  WITNS_LINE_EXTENSION are present 2020 through 2027 - read off the shipped
  RevitAPI.dll for all eight with tools/api-surface --members on 2026-11-02.
  The units format's unit and symbol are read by reflection: GetSpecTypeId,
  GetUnitTypeId, GetSymbolTypeId, LabelUtils.GetLabelForUnit and
  GetLabelForSymbol and Units.GetFormatOptions(ForgeTypeId) where
  DimensionType.GetSpecTypeId exists (2021 to 2027); the UnitType property,
  DisplayUnits, UnitSymbol, LabelUtils.GetLabelFor(DisplayUnitType /
  UnitSymbolType) and Units.GetFormatOptions(UnitType) on 2020 - the 2021
  units change, as SET_PROJECT_UNITS crosses it. Lengths are read in Revit's
  internal feet and turned into millimetres by 304.8 (D-20). Dimensions are
  counted by OfClass(Dimension), as SELECT_DIMENSIONS_BY_VALUE collects them,
  so the 2025 subclasses are counted with no #if.

# ROUTING - rows for these sentences are in SET_DIMENSION_TYPE too.
#
#   "what dimension types are in this project"  -> here
#   "set the text size of dimension type X to 2.5 mm"
#                                                -> SET_DIMENSION_TYPE
#   "which text types are there"                 -> REPORT_TEXT_TYPES - labels
#                                                   and text notes
#   "list the dimensions in this view"           -> REPORT_SPOT_DIMENSIONS -
#                                                   the placed dimensions
#   "what units is this project in"              -> REPORT_PROJECT_UNITS


compatibility-note: >
  One implementation for every release.
  `FamilySizeTableManager.GetFamilySizeTableManager`,
  `CreateFamilySizeTableManager`, `ImportSizeTable`, `GetAllSizeTableNames`,
  `GetSizeTable` and the `FamilySizeTableErrorInfo` properties
  `FamilySizeTableErrorType`, `InvalidRowIndex`, `InvalidColumnIndex` and
  `InvalidHeaderText` were confirmed present on the 2020 assembly on
  2026-09-15. Units are named inside the CSV header, so nothing is converted
  here and the 2021 units move cannot reach it.

# ROUTING - repeated in REPORT_FAMILY_SIZE_TABLE.
#
#   "add these sizes to the lookup table"  -> here
#   "the fitting will not appear at my size" -> REPORT_FAMILY_SIZE_TABLE first,
#                                              to see which rows are absent
#   "what sizes does the segment have"     -> REPORT_PIPE_SEGMENTS

utterances:
  - import this lookup table
  - add these sizes to the family table
  - replace the size table from a csv
  - fix the lookup table
  - write the size table back

id: FRG-ELE-057
semantic-identity: "replace this family's lookup table with one from a CSV"
kind: action
domain: revit.families
capability: WRITE_FAMILY_SIZE_TABLE
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Imports a CSV over a family's lookup table - adding the sizes it was missing,
  or correcting the dimensions it had. The write twin of
  REPORT_FAMILY_SIZE_TABLE, which could read a table and say which sizes were
  absent but never put one right.

  **A SIZE MISSING FROM THE TABLE IS WHY A FITTING DOES NOT APPEAR**, and it
  says nothing when it fails. Give a segment new sizes and the family's table
  is left behind: half the run gets elbows and half gets a bare corner, with
  no error anywhere. This is how the table catches up.

  **IT REPLACES, IT DOES NOT MERGE.** Revit's import overwrites the whole
  table of that name - a CSV holding five rows leaves a table of five rows,
  not twenty-four. So the CSV must carry EVERY row that is to survive, and the
  honest way to build one is to export the existing table first and edit that.
  Reporting `rowsBefore` beside `rowsAfter` is what makes an accidental
  replacement visible instead of silent.

  **THE HEADER FORMAT IS REVIT'S, NOT A CONVENTION.** Each column reads
  `Name##type##unit` - "DN##length##millimeters" - and the first column is the
  key and is unnamed. A header Revit cannot parse is refused with the column
  and the text that failed, which is reported rather than swallowed: an import
  that quietly does nothing looks exactly like one that worked.

  **IT NEEDS THE FAMILY OPEN FOR EDITING.** A lookup table belongs to the
  family document. Run it with a project in front and it says so.

  **A FAMILY WITH NO TABLE MANAGER GETS ONE.** Importing into a family that
  never had a lookup table is a legitimate first import, so the manager is
  created rather than refused - and the answer says that is what happened,
  because gaining a table is a bigger change than gaining a row.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The CSV to import. Its first column is the unnamed key; the rest read
    # `Name##type##unit`. Export the existing table first and edit that.
    - name: csvPath
      type: string
      source: request
    # Which table the CSV replaces. Empty takes the name from the CSV file's
    # own filename, which is what Revit does.
    - name: tableName
      type: string
      source: request
  provides:
    - name: imported
      role: result
      type: bool
    - name: rowsBefore
      # How many rows the table held before. Reported beside `rowsAfter`
      # because the import REPLACES, and a table that shrank is the failure
      # worth seeing.
      role: result
      type: int
    - name: rowsAfter
      role: result
      type: int
    - name: tableCreated
      # That the family had no lookup table at all and gained one. A bigger
      # change than gaining a row, so it is never silent.
      role: result
      type: bool
    - name: problem
      # Revit's own words when the import refused, with the row, column and
      # header text that failed - empty when it did not. A string, because a
      # list entry is abbreviated before a reader sees it.
      role: accounting
      type: string
    - name: notAFamily
      # That the document in front is a project, not a family being edited.
      # The evidence it looked in the wrong place (D-52).
      role: accounting
      type: bool
    - name: findings
      type: IList<string>


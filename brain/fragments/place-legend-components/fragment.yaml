revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release, no #if. ViewType.Legend,
  BuiltInCategory.OST_LegendComponents, BuiltInParameter.LEGEND_COMPONENT and
  LEGEND_COMPONENT_VIEW, ElementTransformUtils.CopyElement / MoveElement,
  Parameter.Set(ElementId) / AsElementId, ElementType.FamilyName,
  Document.GetDefaultElementTypeId(ElementTypeGroup.TextNoteType) and
  TextNote.Create(Document, ElementId, XYZ, string, ElementId) - compiled
  against the reference assemblies of 2020 to 2027 with
  tools/check-fragments-compile.py on 2026-11-15. Not seen in Revit: that a
  copy's Component takes a type of another category than the one placed by
  hand is Group NZ's NZ3.

# ROUTING
#
#   "make a symbol legend of the doors and windows"  -> here
#   "add the plumbing fixtures to the legend"        -> here
#   "make a keynote legend"                          -> CREATE_SCHEDULE,
#                                                       listKind keynote legend
#   "duplicate the legend"                           -> DUPLICATE_VIEWS
#   "place this family"                              -> PLACE_FAMILY_INSTANCES

utterances:
  - make a symbol legend of the doors and windows
  - add the plumbing fixtures to the legend

# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: >
      a TEST COPY of a pipe fitting family with one lookup table and a Text
      parameter 'Lookup Table Name' driving its size_lookup formulas, where
      one type's 'Lookup Table Name' is changed to a name that is not imported
    expect: >
      a MISSING TABLE line naming that type and that table name, and no such
      line for the types left alone. problemCount at least 1, lookupsChecked
      equal to the number of size_lookup calls in the Family Types dialog

  - given: the same copy with one formula's column name changed to one the table has not got
    expect: >
      a MISSING COLUMN line naming the formula's parameter and listing the
      table's real columns - compare them with Manage Lookup Tables

  - given: >
      version 2 - a TEST COPY of a Generic Model family whose lookup is keyed
      on a TYPE length parameter 'Size', with one type's 'Size' set to a
      value no row of the table holds
    expect: >
      a NO ROW line naming that type, the table and 'Size' in the column's
      own unit, and every formula it leaves at its default - and none for
      the types whose size is in the table. rowSearches equal to types x
      lookups keyed on 'Size'

negative:
  - given: the same family, unchanged, with every lookup correct
    expect: >
      problemCount 0 with lookupsChecked NON-ZERO. The value-driven negative -
      a clean answer that still proves it read the formulas

  - given: >
      version 2 - the same Generic Model copy with every type's 'Size' in the
      table
    expect: >
      no NO ROW line, rowSearches NON-ZERO - a clean answer that still proves
      it searched the rows

  - given: >
      a pipe fitting whose lookups are keyed on the instance parameter
      'Nominal Diameter'
    expect: >
      a ROWS NOT CHECKED note naming it as an instance parameter, and no NO
      ROW line - its sizes are set where it is placed, never judged here

  - given: a project in front instead of a family
    expect: >
      notAFamily true and problemCount 0 - never a clean report about the
      wrong document

second_route:
  - >
    open Manage Lookup Tables and the Family Types dialog by hand, and check
    each reported table and column name against what is there
  - >
    flex the broken type in Family Types and see the dimension fall to the
    formula's default, which is what MISSING TABLE says will happen

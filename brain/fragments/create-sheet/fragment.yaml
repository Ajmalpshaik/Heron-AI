id: FRG-SHT-003
semantic-identity: "make a new drawing sheet with this number and this name"
kind: action
domain: revit.sheets
capability: CREATE_SHEET
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Creates one sheet, numbered and named, with a titleblock.

  **The sheet number is checked for a clash BEFORE anything is created.** Revit
  refuses a duplicate number by throwing, and a throw part-way through leaves
  the sheet made and unnumbered - a blank row in the register that somebody has
  to find. So the number is looked up first and the whole thing is
  refused if it is taken.

  **It was the missing link in producing a set.** Before it, *"make a new
  sheet"* resolved to a fragment that creates something else entirely.

contract:
  needs:
    - name: doc
      type: Document
    - name: sheetNumber
      type: string
      source: request
    - name: sheetName
      type: string
      source: request
    - name: titleblockTypeId
      type: ElementId
      source: request
  provides:
    - name: created
      role: result
      type: ElementId
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string
    - name: noTitleblock
      # That no title block could be placed. The evidence it looked and could
      # not, never a thing it did (D-52).
      role: accounting
      type: bool


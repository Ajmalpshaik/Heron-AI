# DEPRECATED 2026-11-01 - MERGED INTO CREATE_SHEETS (create-sheets), on the owner's instruction
# in conversation: "now merge the other duplicates also". Constitution
# Article 1: kept, never deleted, so its record and its proof stay readable
# and it can be brought back. Nothing offers it now - retrieval leaves
# DEPRECATED out, and its sentences claim nothing in the identity table
# (heron_search RETIRED_FRAGMENTS). Its sentences moved to CREATE_SHEETS. The proof
# below is the record of what this card's code did, not a claim about today.
deprecated:
  date: '2026-11-01'
  by: Ajmal PS
  superseded-by: CREATE_SHEETS
  why: >
    The same job: a numbered, named sheet on a title block, the number checked
    for a clash before anything is made. CREATE_SHEETS makes one or many and
    reads the number and the name back apart. Its version 2 took every rule of
    this card's it lacked: the clash check ignores capitals and names the sheet
    holding the number, an empty number is refused, Revit's own words are passed
    on when ViewSheet.Create throws, and the title block is matched as Family:
    Type. One rule was opposite and the safer was kept: a sheet with no title
    block is made there only when the caller says none outright, flagged
    noTitleblock, where this card made one whenever no title block came.

purpose: >
  Creates one sheet, numbered and named, with a titleblock.

  **The sheet number is checked for a clash BEFORE anything is created.** Revit
  refuses a duplicate number by throwing, and a throw part-way through leaves
  the sheet made and unnumbered - a blank row in the register that somebody has
  to find. So the number is looked up first and the whole thing is
  refused if it is taken.

  **It was the missing link in producing a set.** Before it, *"make a new
  sheet"* resolved to a fragment that creates something else entirely.

contract:
  needs:
    - name: doc
      type: Document
    - name: sheetNumber
      type: string
      source: request
    - name: sheetName
      type: string
      source: request
    - name: titleblockTypeId
      type: ElementId
      source: request
  provides:
    - name: created
      role: result
      type: ElementId
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string
    - name: noTitleblock
      # That no title block could be placed. The evidence it looked and could
      # not, never a thing it did (D-52).
      role: accounting
      type: bool


compatibility-note: >
  `ViewSheet.Create(Document, ElementId)` is unchanged 2020 to 2027, and so are
  `SheetNumber` and `Name`. The titleblock type arrives as an `ElementId` taken
  from a live element, so nothing here builds an ElementId from an int and
  2024's move to 64-bit ids does not reach this code.

# THE CHAIN THIS COMPLETES, in a comment rather than in `purpose` because
# `purpose` is indexed and naming the neighbouring capabilities there took
# "add the view to the drawing sheet" off PLACE_VIEW_ON_SHEET, whose sentence
# it is:
#
#   CREATE_SECTION_VIEW  makes the drawing
#   CREATE_SHEET         makes the sheet          <- here
#   PLACE_VIEW_ON_SHEET  puts one on the other
#   LIST_SHEETS          reads the result back

# ROUTING - repeated in LIST_SHEETS and PLACE_VIEW_ON_SHEET.
#
#   "make a new sheet"          -> here
#   "create a sheet"            -> here
#   "list the sheets"           -> LIST_SHEETS - a QUESTION
#   "put this view on a sheet"  -> PLACE_VIEW_ON_SHEET, which needs a sheet to
#                                  exist first and does not make one
#   "renumber the sheets"       -> RENAME_ELEMENTS on the number parameter;
#                                  nothing here changes an existing sheet

#   "make a sheet list schedule"       -> CREATE_SHEET_LIST - the index OF the
#                                        sheets, including placeholders
utterances:
  - make a new sheet
  - create a sheet
  - add a sheet to the project
  - I need a new sheet
  - set up a sheet for this
  - open up a new sheet

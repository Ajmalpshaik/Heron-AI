compatibility-note: >
  ONE implementation. The text rule factory is reached BY REFLECTION:
  `ParameterFilterRuleFactory.CreateEqualsRule(ElementId, string, bool)` is on
  2020 to 2025 and `CreateEqualsRule(ElementId, string)` on 2023 to 2027, read
  off the reference assemblies for each release with `tools/api-surface
  --members`. The two-argument one is used where it exists, the three-argument
  one with `false` elsewhere - the same choice CREATE_VIEW_FILTERS_BY_VALUE
  makes. Version 2's seven other text rules - CreateNotEqualsRule,
  CreateContainsRule, CreateNotContainsRule, CreateBeginsWithRule,
  CreateNotBeginsWithRule, CreateEndsWithRule, CreateNotEndsWithRule - have
  exactly the same two spellings on the same releases, read with
  `tools/api-surface --members ParameterFilterRuleFactory` on 2026-10-15, and
  are reached the same way. `FilterInverseRule.GetInnerRule`, which the
  read-back uses to say "does not", is on 2020 to 2027 unchanged.

  Unchanged 2020 through 2027, read the same way:
  `ParameterFilterUtilities.GetAllFilterableCategories` and
  `GetFilterableParametersInCommon`; `ParameterFilterElement.Create` with an
  element filter, `GetCategories`, `GetElementFilter` and the static
  `ElementFilterIsAcceptableForParameterFilterElement(Document,
  ISet<ElementId>, ElementFilter)`; `FilterRule.GetRuleParameter`;
  `FilterStringRule.RuleString` and `GetEvaluator`;
  `ElementParameterFilter.GetRules`; `ElementLogicalFilter.GetFilters`;
  `ElementMulticategoryFilter(ICollection<ElementId>)`;
  `NamingUtils.IsValidName`; `LabelUtils.GetLabelFor(BuiltInParameter)`; and
  the `ElementId(BuiltInCategory)` and `ElementId(BuiltInParameter)`
  constructors. No id is read as a number anywhere, so the 2024 widening of
  ElementId does not reach it.

# ROUTING - the same rows are in CREATE_VIEW_FILTER and
# CREATE_VIEW_FILTERS_BY_VALUE.
#
#   "create a supply air filter for ducts"  -> here. A named filter, a rule
#                                              you already know, on no view
#   "make filters for supply return and     -> here. Three names, three
#    exhaust air"                              values, one category list
#   "make a filter for each of these values" -> here. The values come from the
#                                              request, so one nothing
#                                              carries yet still gets a filter
#   "make a filter for every different      -> CREATE_VIEW_FILTERS_BY_VALUE.
#    system type"                              The values come from the model,
#                                              and each filter is put on a view
#                                              with a colour
#   "make the supply ducts blue"            -> CREATE_VIEW_FILTER - one filter,
#                                              applied to a view with a colour
#                                              in the same call
#   "put that filter on this view"          -> APPLY_VIEW_FILTER. This puts
#                                              the new filters on no view
#   "take the Duct Systems category off     -> SET_VIEW_FILTER_CATEGORIES.
#    these view filters"                       This never edits a filter that
#                                              exists - it skips the name
#   "what filters already exist"            -> REPORT_VIEW_FILTERS, before
#                                              making a near-duplicate
#   "which parameters can I filter ducts    -> REPORT_FILTERABLE_PARAMETERS.
#    by"                                       What to ask BEFORE this, when
#                                              the parameter's name is not
#                                              known

utterances:
  - create a supply air filter for ducts
  - make filters for supply return and exhaust air
  - create view filters on system classification
  - make a filter for each of these values
  - set up supply and return filters for the ductwork
  - make a view filter for return air
  - make a view filter for exhaust air
  - create a filter for levels whose name does not contain trg
  - make a view filter where the type name begins with

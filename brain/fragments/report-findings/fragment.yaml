id: FRG-QA-001
semantic-identity: "turns a list of findings into the reply a modeller reads"
kind: action
domain: revit.qa
capability: REPORT_FINDINGS
version: 1
source: OFFICIAL
risk: SUGGEST

purpose: >
  Turns a list of findings into the reply a modeller reads: what was checked,
  what was found, and - said out loud - when nothing was found at all.

contract:
  needs:
    - name: findings
      type: IList<string>
    # NOT `checked`, which is what this was called until 2026-08-29. `checked`
    # is a RESERVED C# KEYWORD, so the fragment could never compile - and
    # nothing had ever compiled a fragment, so it read as fine for as long as
    # it was only ever read. tools/check-fragments-compile.py found it on its
    # first run, and heron_fragment.py now refuses the whole class.
    - name: checkedCount
      type: int
      source: request
    - name: whatWasChecked
      type: string
      source: request
  provides:
    - name: report
      role: result
      type: string

proof:
  date: '2026-11-02'
  by: Ajmal PS
  model: Project2 (5,854 elements), Revit 2024, session 57392
  positive_case: "run with category=Sheets - the first of 3 tracked inputs - the arrangement\
    \ was re-made first by running filter-elements-by-category with this phase's own values.\
    \ returned checkedCount 1, report Checked 1 the elements of one category. 1 to look at:\r\
    \n  - 22 element(s), within Sheets\r\n, sb StringBuilder. inputs came findings from filter-elements-by-category\
    \ (1); checkedCount as given; whatWasChecked as given. on Project2"
  negative_case: "CANNOT COME BACK EMPTY, so proved by TRACKING instead (D-53). report-findings\
    \ describes whatever it is given, so no arrangement makes its answer empty. What D-30's\
    \ negative case exists to catch - a fragment that succeeds while doing nothing, or answers\
    \ about a set it was not given - is caught here by the answer following the input exactly\
    \ across 3 different inputs:\n\n      category=Sheets -> report Checked 1 the elements\
    \ of one category. 1 to look at:\r\n  - 22 element(s), within Sheets\r\n\n      category=Cameras\
    \ -> report Checked 1 the elements of one category. 1 to look at:\r\n  - 0 element(s),\
    \ within Cameras\r\n\n      category=Views -> report Checked 1 the elements of one category.\
    \ 1 to look at:\r\n  - 68 element(s), within Views\r\n\n\n    Different inputs, exact\
    \ matches every time. A fragment falling back to the active view, the whole model, or\
    \ a previous run could not do that."
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: 32c3e1eb75c824de

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

# ROUTING - repeated in READ_MODEL_WARNINGS.
#
#   "write that up"              -> here - it formats findings already made
#   "give me the report"         -> here
#   "list the warnings"          -> READ_MODEL_WARNINGS, which PRODUCES the
#                                   findings this fragment formats. The two
#                                   compose; neither replaces the other
#   "list the linked models"     -> LIST_LINKED_MODELS, same relationship

# SENTENCES ADDED 2026-09-01 BECAUSE THE ROUTING TABLE ABOVE ALREADY CLAIMED
# THEM. A routing table is a COMMENT and comments are not indexed - the search
# reads semantic-identity, the utterances, the capability, the domain and the
# purpose, and nothing else. So a table saying "-> here" recorded a decision
# that retrieval could not act on, and these resolved elsewhere.

utterances:
  - report what you found
  - tell me what is wrong
  - give me the results
  - what did the check say
  - write that up

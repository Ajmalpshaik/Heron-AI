compatibility-note: >
  One implementation for every release. `RoutingPreferenceManager.GetRule`,
  `GetNumberOfRules`, `RemoveRule` and `AddRule`, the
  `RoutingPreferenceRule(ElementId, string)` constructor, `AddCriterion`,
  `PrimarySizeCriterion(double, double)` and `Segment` were all confirmed
  present by reflection on the 2020 assembly and in the 2027 metadata on
  2026-09-15, and `tools/api-surface/changes.json` records no change to the
  routing API across the eight releases.

  Sizes stay in Revit's internal feet the whole way - a criterion is read off
  the old rule and handed straight back - so no units call is made and the
  2021 units move is never touched. `Segment` is a concrete class in
  `Autodesk.Revit.DB`, which the executor imports, so no type is named that
  compiles green and fails at the PC.

# ROUTING - repeated in REPORT_ROUTING_PREFERENCES.
#
#   "make this pipe type copper"         -> here, group=Segments
#   "which fitting will this type place" -> REPORT_ROUTING_PREFERENCES. That
#                                           reads; this writes
#   "change these pipes to another type" -> CHANGE_ELEMENT_TYPE. That swaps the
#                                           TYPE on an element; this changes
#                                           what the type is made of
#   "rename this type"                   -> RENAME_ELEMENTS

utterances:
  - make this pipe type copper
  - change the segment this type uses
  - point this type at a different segment
  - set the routing preference
  - which elbow this type inserts, change it
  - make this duct type use a different elbow

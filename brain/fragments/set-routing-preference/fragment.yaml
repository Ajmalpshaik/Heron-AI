id: FRG-MEP-046
semantic-identity: "point this pipe or duct type's routing rule at a different segment or fitting"
kind: action
domain: revit.mep
capability: SET_ROUTING_PREFERENCE
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Points one routing preference rule at a different part - the segment a pipe
  type is made of, or the elbow, tee, cross, transition, union, joint or cap it
  inserts. The write twin of REPORT_ROUTING_PREFERENCES, which could say what a
  type would place but never change it.

  **A PIPE TYPE'S MATERIAL IS NOT A PARAMETER ON THE TYPE**, and that is the
  job this exists for. `Material` is absent from a PipeType - measured on
  Project1, 2026-09-15 - because the material comes from the SEGMENT the
  Segments rule points at. "Make this type copper" is therefore this fragment
  with partName=the copper segment, and is reachable no other way.

  **THERE IS NO SetRule ON ANY RELEASE, AND MEPPartId IS READ-ONLY.** Changing
  which part a rule points at is RemoveRule then AddRule at the same index, so
  the rule is REBUILT rather than edited - and whatever is not copied across is
  silently gone.

  **THE SIZE WINDOW IS WHAT GETS LOST, AND LOSING IT IS WORSE THAN IT SOUNDS.**
  A rule carries its criteria separately from its part, so a rebuilt rule with
  no criterion covers every size. Where the old rule covered 15 to 50 mm that
  is not a smaller mistake than naming the wrong segment: a size outside every
  rule's range gets NO fitting at all, with no error and no warning - which is
  the exact gap REPORT_ROUTING_PREFERENCES was written to find. Every criterion
  is read off the old rule before it is removed and put back on the new one,
  and the count carried across is reported.

  **READ BACK, NEVER TRUST THE CALL.** AddRule returns nothing and throws
  nothing when the part is wrong for the group, so the part id is read off the
  rule again afterwards and compared. That comparison is what separates a
  change from a clean return - the argument MOVE_ELEMENTS makes about a group
  member, applied to a rule.

  **A PART NAMED BUT NOT FOUND RETURNS THE NEAR MISSES.** "Copper" and
  "Copper - K" are different segments, and picking one for the caller is a
  confident wrong answer wearing a right one's clothes. SELECT_BY_CATEGORY_NAME
  refuses that guess for a category; this refuses it for a part.

  **EDITING A TYPE CHANGES EVERY ELEMENT OF THAT TYPE**, not only the ones
  handed in. Two pipes of one type are ONE type. That is Revit working
  correctly and it still surprises people, so types touched are counted
  separately from the elements given.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16), so
  changing several types is one undo entry.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # The group's plain name - "Segments", "Elbows". Empty means Segments,
    # which is the material question and the overwhelming majority of asks.
    - name: group
      type: string
      source: request
    # The part to point at, BY NAME. A caller says "Copper", not an element id.
    - name: partName
      type: string
      source: request
    # Which rule in the group, counting from 0. A group may hold several rules
    # covering different size bands, and changing the wrong one is silent.
    - name: ruleIndex
      type: int
      source: request
  provides:
    - name: rulesChanged
      role: result
      type: int
    - name: typesTouched
      # Types whose rule was examined. Counted apart from `rulesChanged`
      # because editing ONE type changes every element of it, and because a
      # type that was already correct is touched without being changed.
      role: result
      type: int
    - name: alreadyCorrect
      # Rules already pointing at the part asked for, so there was nothing to
      # do. The evidence it looked, never a change it made (D-52).
      role: accounting
      type: IList<string>
    - name: nearMisses
      # Part names that nearly matched when the one named was not found. What
      # turns a dead end into one more sentence, and never a thing it changed.
      role: accounting
      type: IList<string>
    - name: notRoutable
      # Things handed in that are not a pipe or duct type, or have no routing
      # preference manager. The evidence it looked (D-52).
      role: accounting
      type: IList<string>
    - name: unverified
      # Rules that could not be read back as changed. Never counted as
      # changed - a thing that cannot be checked must not be reported as
      # checked.
      role: accounting
      type: IList<string>
    - name: findings
      type: IList<string>


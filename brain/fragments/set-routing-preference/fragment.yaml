# VERSION 2 (2026-11-11) - A FITTING IS NAMED "Family: Type", A REFUSED SWAP IS
# PUT BACK, and back to DRAFT. Version 1 was PROVEN on 2026-09-15 (the proof
# block below, kept as the record of what it proved - a SEGMENT swapped by
# name); its C# moved, so it is DRAFT again until NEEDS-CHECKING Group NL is
# run (D-30, D-117). Two defects, both in the change it makes:
#   - FRAGMENT-ISSUES row 5b-1120, measured 2026-10-18 on Revit 2020: a fitting
#     was found by its TYPE NAME alone, so "Standard" - the type name of a
#     mitred elbow and of a balancing damper in one project - bound whichever
#     the collector met first, and "Family: Type" was refused as no part.
#   - FRAGMENT-ISSUES row 5b-1549, read in the code 2026-11-11, never seen in
#     Revit: the rule is removed BEFORE the new one is added, and a refusal
#     after that left the type with its rule removed while the run answered
#     only `unverified`.
# The name rule is tested with no Revit (tests/test_binding_note.py compiles
# the fragment's own lines beside the binder's rule). Nothing of version 2 has
# run in Revit.
#
# AFTER A REVIEW OF THAT CHANGE (2026-11-12), still version 2, still not run:
#   - A SWAP IS KEPT ON THE PART AND THE COUNT. The read-back asked only which
#     part the rule at the index pointed at; where AddRule added nothing and
#     the next rule already pointed there, that read as asked with one rule
#     deleted. The group must now hold as many rules as before as well. That
#     rule is in the tested lines too.
#   - "PUT BACK" IS READ. After a swap is rolled back the rule is read again -
#     how many rules, which part, how many criteria - before it is called put
#     back; if it does not read as before the card THROWS and the add-in rolls
#     the whole job back.
#   - SEVERAL TYPES ARE NOT ALL-OR-NOTHING. Each type's swap is its own, as
#     each column is in ATTACH_COLUMNS: a type that is refused is put back and
#     named in `unverified`, and the types already changed stay changed - one
#     Undo entry, and the answer says so in as many words.
#   - A NAME THAT FITS MANY IS LISTED SHORT: twelve at most, duct and pipe
#     fittings first, and how many more there were.
#   - WHETHER AddRule THROWS for a part that is wrong for its group was never
#     measured. The card said it does not; Revit's reference says it does
#     (ArgumentException, 2020 to 2027). Both are handled alike.

purpose: >
  Points one routing preference rule at a different part - the segment a pipe
  type is made of, or the elbow, tee, cross, transition, union, joint or cap it
  inserts. The write twin of REPORT_ROUTING_PREFERENCES, which could say what a
  type would place but never change it.

  **A PIPE TYPE'S MATERIAL IS NOT A PARAMETER ON THE TYPE**, and that is the
  job this exists for. `Material` is absent from a PipeType - measured on
  Project1, 2026-09-15 - because the material comes from the SEGMENT the
  Segments rule points at. "Make this type copper" is therefore this fragment
  with partName=the copper segment, and is reachable no other way.

  **THERE IS NO SetRule ON ANY RELEASE, AND MEPPartId IS READ-ONLY.** Changing
  which part a rule points at is RemoveRule then AddRule at the same index, so
  the rule is REBUILT rather than edited - and whatever is not copied across is
  silently gone.

  **THE SIZE WINDOW IS WHAT GETS LOST, AND LOSING IT IS WORSE THAN IT SOUNDS.**
  A rule carries its criteria separately from its part, so a rebuilt rule with
  no criterion covers every size. Where the old rule covered 15 to 50 mm that
  is not a smaller mistake than naming the wrong segment: a size outside every
  rule's range gets NO fitting at all, with no error and no warning - which is
  the exact gap REPORT_ROUTING_PREFERENCES was written to find. Every criterion
  is read off the old rule before it is removed and put back on the new one,
  and the count carried across is reported.

  **READ BACK, NEVER TRUST THE CALL.** AddRule returns nothing, and whether
  it throws when the part is wrong for the group is not measured, so the part
  id and the number of rules are read again afterwards and compared. That
  comparison is what separates a change from a clean return - the argument
  MOVE_ELEMENTS makes about a group member, applied to a rule.

  **A PART NAMED BUT NOT FOUND RETURNS THE NEAR MISSES.** "Copper" and
  "Copper - K" are different segments, and picking one for the caller is a
  confident wrong answer wearing a right one's clothes. FILTER_ELEMENTS_BY_CATEGORY
  refuses that guess for a category; this refuses it for a part.

  **EDITING A TYPE CHANGES EVERY ELEMENT OF THAT TYPE**, not only the ones
  handed in. Two pipes of one type are ONE type. That is Revit working
  correctly and it still surprises people, so types touched are counted
  separately from the elements given.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16), so
  changing several types is one undo entry.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # The group's plain name - "Segments", "Elbows". Empty means Segments,
    # which is the material question and the overwhelming majority of asks.
    - name: group
      type: string
      source: request
    # The part to point at, BY NAME. A caller says "Copper", not an element id.
    # A fitting is named "Family: Type" - "M_Rectangular Elbow - Mitered:
    # Standard" - or by its type name alone when one loaded family has it
    # (version 2).
    - name: partName
      type: string
      source: request
    # Which rule in the group, counting from 0. A group may hold several rules
    # covering different size bands, and changing the wrong one is silent.
    - name: ruleIndex
      type: int
      source: request
  provides:
    - name: rulesChanged
      # Rules that read back as asked AND left their group with as many rules
      # as it had. With several types handed in this is NOT all-or-nothing:
      # these stay changed when another type is named in `unverified`.
      role: result
      type: int
    - name: typesTouched
      # Types whose rule was examined. Counted apart from `rulesChanged`
      # because editing ONE type changes every element of it, and because a
      # type that was already correct is touched without being changed.
      role: result
      type: int
    - name: alreadyCorrect
      # Rules already pointing at the part asked for, so there was nothing to
      # do. The evidence it looked, never a change it made (D-52).
      role: accounting
      type: IList<string>
    - name: nearMisses
      # Part names that nearly matched when the one named was not found - and,
      # version 2, every part a name FITS when it fits more than one, each
      # written "Family: Type" - twelve at most, duct and pipe fittings first;
      # `findings` says how many more there were. What turns a dead end into
      # one more sentence, and never a thing it changed.
      role: accounting
      type: IList<string>
    - name: notRoutable
      # Things handed in that are not a pipe or duct type, or have no routing
      # preference manager. The evidence it looked (D-52).
      role: accounting
      type: IList<string>
    - name: unverified
      # Rules that could not be read back as changed. Never counted as
      # changed - a thing that cannot be checked must not be reported as
      # checked. Version 2: each one's swap is rolled back and the rule READ
      # again first, so a rule named here read as it did before the run - the
      # card throws, and the whole job is rolled back, if it did not.
      role: accounting
      type: IList<string>
    - name: findings
      type: IList<string>


id: FRG-DOC-015
semantic-identity: "what design options exist and what is inside them"
kind: filter
domain: revit.document
capability: REPORT_DESIGN_OPTIONS
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Lists every design option set and every option in it, which option is primary,
  which is currently active, and how many elements sit inside each one.
  Read-only.

  **A DESIGN OPTION CHANGES WHAT "ALL THE DUCTS" EVEN MEANS, and that is why
  this exists.** Elements inside a non-active option are excluded from most
  views and from schedules. A count that disagrees with what somebody sees on
  screen, a schedule that is short, an element that will not delete - all three
  have the same cause and none of them says so.

  **THE ACTIVE OPTION CANNOT BE CHANGED FROM CODE ON ANY RELEASE HERE**, and
  that is worth knowing before a job is planned around it. There is a getter for
  the active option and no setter, checked against the reference assemblies at
  both ends. `Element.DesignOption` is read-only too, so an element cannot be
  moved into an option from here either - the Revit interface is the only route,
  and this fragment says so rather than leaving somebody to discover it.

  **AN EMPTY MODEL AND A MODEL WITH NO OPTIONS ARE THE SAME OUTPUT unless it is
  said.** So a project with none reports that in words rather than as an empty
  list.

contract:
  needs:
    - name: doc
      type: Document
  provides:
    - name: findings
      type: IList<string>
    - name: optionCount
      type: int
    - name: activeOption
      type: string

proof:
  date: "2026-09-07"
  by: "Claude Opus 5, at Ajmal PS's PC"
  model: >
    Revit 2024.3, session 29340. Positive on 'Project1 work_ajmal.al' (3,435
    elements, a workshared local) AFTER the owner created a design option in it
    during the session. Negative on 'Snowdon Towers Sample HVAC.rvt' (9,628
    elements), measured twice on the same build earlier the same day while both
    models were open at once.
  positive_case: >
    optionCount 1, reported as 'Option Set 1 / Option 1  <primary> [primary] -
    0 element(s)'. Four separate things are right in that one line: the option
    is named under its SET rather than on its own, it is marked primary, it
    holds no elements - which is true of an option just created and nothing
    moved into - and activeOption is 'Main Model', because creating an option
    does not start editing it. A count alone would not have shown any of that.
  negative_case: >
    Snowdon Towers: optionCount 0, and the finding says 'this project has NO
    design options. Everything is in the Main Model' rather than returning a
    bare zero. That distinction is the whole point - a project with no options
    and a project whose options could not be read give the same 0, and only one
    of them means somebody should go looking. Measured at 0 BEFORE the owner
    created one and at 1 after, on one build, which ties the number to a known
    cause.
  second_route: >
    The same answer was reached by a DIFFERENT REVIT FILTER in the same run.
    This fragment collects OfCategory(BuiltInCategory.OST_DesignOptions); a
    FilteredElementCollector(doc).OfClass(typeof(DesignOption)) found 1 element
    with the same name, 'Option 1  <primary>'. A class filter and a category
    filter are different mechanisms that can legitimately disagree. Revit's own
    Manage > Design Options dialog is the third, and it is what the owner used.

    NOT YET SEEN: MORE THAN ONE OPTION, AND MORE THAN ONE OPTION SET. Everything
    above holds for a single set holding a single primary option. A secondary
    option, and a second set, are the cases where naming an option under its set
    stops being decoration and starts being the only way to tell two options
    called 'Option 1' apart.
  fingerprint: "398cb31fcdc01331"

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `DesignOption`,
  `DesignOption.GetActiveDesignOptionId`, `DesignOption.IsPrimary` and
  `Element.DesignOption` are present 2020 through 2027 - read off the reference
  assemblies at both ends, which is also where the absence of any SETTER was
  confirmed. The option set is read from the option's own parameter rather than
  from a typed property, because that parameter is stable across the release
  where parameter identity changed.

# ROUTING - repeated in REPORT_PHASES and COUNT_ELEMENTS.
#
#   "which design option am I working in" -> here
#   "what design options are in this model" -> here
#   "why is my schedule missing things"  -> here is one of the two causes; the
#                                           other is REPORT_PHASES
#   "what phase is this"                 -> REPORT_PHASES - phases and options
#                                           both change what "all the ducts"
#                                           means, and they are different
#                                           settings
#   "make this option active"            -> NOTHING HERE CAN. There is a getter
#                                           for the active option and no setter,
#                                           on every release. Use the status bar
#                                           in Revit

utterances:
  - which design option am I working in
  - what design options are in this model
  - why is my schedule missing things
  - list the design options
  - what is inside each design option

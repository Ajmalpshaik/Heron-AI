# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: a template project open alongside with five shared project parameters, and the shared parameter file that defines them
    expect: >
      those five bound here afterwards, in `bound`, to the SAME categories and
      as instance or type exactly as they were. Open Manage > Project
      Parameters and compare the two lists side by side

  - given: nameContains "AJ_"
    expect: >
      only the parameters whose names contain AJ_, and no other binding touched

  - given: >
      version 2 - Manage > Shared Parameters pointing at a file of the
      modeller's own (note its path first), and the transfer run with a
      DIFFERENT shared parameter file that defines the template's parameters
    expect: >
      the template's shared parameters bound here, sharedParameterFileRestored
      true, and Manage > Shared Parameters afterwards showing the modeller's
      own file again - read in Revit's dialog. Version 1 left it pointing at the
      file given (5b-316)

negative:
  - given: >
      version 2 - the source project NOT open, with Manage > Shared Parameters
      pointing at the modeller's own file
    expect: >
      `refused` naming what is open, nothing bound, and Manage > Shared
      Parameters still showing the modeller's own file - the setting is never
      changed when nothing is attempted

  - given: a NON-SHARED project parameter in the source
    expect: >
      it named in `skipped` saying it cannot be carried - NOT quietly left out.
      It exists only inside that file and the API cannot recreate one here. A
      transfer that silently drops three of ten is worse than one that refuses

  - given: a shared parameter in the source whose definition is NOT in the file given
    expect: >
      it in `skipped` naming the file, and nothing bound. Matching by name
      instead would happily bind a DIFFERENT parameter that shares a word, and
      the project would look correct while sharing nothing with anybody

  - given: a parameter already bound in this project, to fewer categories than the source binds it to
    expect: >
      that name in `clashed` and THIS project's binding untouched. Re-binding
      is how a category quietly loses a parameter along with every value
      anybody typed into it

  - given: the run on Revit 2027, where Definition.ParameterGroup no longer exists
    expect: >
      the parameters still bound, filed under Data, and every one of them named
      in `regrouped`. A parameter that landed in a different part of the
      properties palette is something to be TOLD, not something to find

  - given: no shared parameter file given, or a path that will not open
    expect: >
      `refused` saying the definition lives in that file and nothing attempted.
      Inventing a file under a temporary folder is the failure
      ADD_PROJECT_PARAMETER already records

  - given: the source project NOT open
    expect: >
      `refused` naming what IS open, and nothing attempted

second_route:
  - >
    open Manage > Project Parameters here and in the source and read the two
    lists against each other - name, discipline, type of parameter, and the
    category list behind each one. A name appearing in this project is not
    proof: select an element of a bound category and check the parameter is
    actually on it, in the group you expected

  - >
    Version 2: open Manage > Shared Parameters after the run and read the path
    in its box - it must be the one noted before the run, whatever the report
    says

runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `RevitLinkInstance`, `RevitLinkType`,
  `Element.GetTypeId()`, `View.SetElementOverrides`,
  `View.GetElementOverrides`, `View.AreGraphicsOverridesAllowed()` and the
  `Halftone` and `Transparency` properties on `OverrideGraphicSettings` are
  present and unchanged 2020 through 2027, read off the reference assemblies at
  both ends.

  **Two things this deliberately does NOT name.**
  `FilteredElementCollector(Document, ElementId, ElementId)` - the collector
  that reaches inside a link - is absent on Revit 2020, and naming it would stop
  this compiling there; a try/catch does not help, because the code never gets
  to run. `RevitLinkGraphicsSettings` is absent from the Revit 2020 assembly
  entirely and carries no halftone or transparency on the releases that do have
  it.

  A link is identified by its TYPE name, which is the file name a person
  recognises. Two placements of one file share that name and are reported
  separately, because each carries its own override.

# ROUTING - the same rows are in SET_CATEGORY_GRAPHICS and HIGHLIGHT_VS_REST.
#
#   "grey the architecture back"        -> SET_CATEGORY_GRAPHICS OWNS THE BARE
#                                          SENTENCE and declares it. It cannot
#                                          be split by wording, because the
#                                          words do not say whether those walls
#                                          are in this model or in a link - and
#                                          that is the whole difference. Two
#                                          tables claimed it and the same row is
#                                          now in both. Come here when the
#                                          sentence names a LINK
#   "halftone the walls"                -> OVERRIDE_GRAPHICS_IN_VIEW for named
#                                          host walls, SET_CATEGORY_GRAPHICS for
#                                          the whole category. Here ONLY if
#                                          those walls are inside a link. This
#                                          fragment ranks high on it because it
#                                          declares the sentence somebody types
#                                          when a greyout did nothing, and that
#                                          sentence has the word walls in it
#   "fade the structural link"          -> here
#   "halftone the linked model"         -> here
#   "put the link back to normal"       -> here, with an empty
#                                          OverrideGraphicSettings. An unset
#                                          override IS Revit's cleared state
#   "grey their walls but keep the grid black"
#                                       -> NOT HERE AND NOWHERE IN THIS LIBRARY.
#                                          Overriding categories INSIDE a link
#                                          needs a collector Revit 2020 does not
#                                          have. Revit's route: Visibility /
#                                          Graphics, the Revit Links tab, that
#                                          link's row, Custom, then the Model
#                                          Categories tab inside it
#   "which links are loaded"            -> LIST_LINKED_MODELS, which is what
#                                          feeds this
#   "grey everything except these"      -> HIGHLIGHT_VS_REST, on host elements

utterances:
  - grey out the linked model in this view
  - halftone the architectural link
  - fade the structure link back
  - push the linked model into the background
  - make the link lighter in this view
  - put the link graphics back to normal
  - the greyout did nothing because the walls are in a link

id: FRG-VIEW-068
semantic-identity: "grey or fade a whole linked model in one view"
kind: action
domain: revit.views
capability: SET_LINK_GRAPHICS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Applies one graphic override to a whole linked model in one view - the way an
  architectural or structural link is pushed into the background behind the MEP
  work.

  IT EXISTS BECAUSE A CATEGORY OVERRIDE IN THE HOST DOES NOT REACH INSIDE A
  LINK, AND SAYS NOTHING WHEN IT DOESN'T. On a real coordination job the walls
  and floors arrive as a LINK. `SET_CATEGORY_GRAPHICS` on the host document then
  greys nothing, reports success, and leaves the view looking untouched -
  because nothing was wrong. The host genuinely has no walls. That is the
  quietest failure in the whole graphics story, and it is why this is a separate
  fragment rather than a flag on that one.

  **ONE OVERRIDE ON THE LINK COVERS EVERYTHING INSIDE IT.** A link instance is a
  single element in the host document, so this is one call per link however many
  thousand elements are in the file. Halftone, transparency, line colour and
  line weight all work through it.

  **IT CANNOT KEEP THE ARCHITECT'S GRID BLACK WHILE THEIR WALLS GO GREY, AND
  THAT REFUSAL IS THE FINDING.** Overriding categories individually INSIDE a
  link needs the collector that takes a document, a view and a link instance,
  and that constructor DOES NOT EXIST ON REVIT 2020 - read off the reference
  assemblies, where 2020 has three `FilteredElementCollector` constructors and
  2027 has four. Every fragment in this library is one implementation for all
  eight releases, so the split is not made. Revit's own route is named in the
  routing table. The earlier library built that path and capped it at five
  thousand elements per link, which quietly does a partial job on exactly the
  large link that needs it.

  **THE CLASS THAT LOOKS LIKE THE RIGHT ANSWER IS NOT ONE.**
  `RevitLinkGraphicsSettings` sets a link's display MODE, and it carries no
  halftone and no transparency on any release - and it does not exist AT ALL on
  Revit 2020, checked in the shipped assembly at both ends of the range. The
  override route above is the one that works.

  **THE OVERRIDE ARRIVES ALREADY BUILT**, exactly as it does for
  `SET_CATEGORY_GRAPHICS` and `OVERRIDE_GRAPHICS_IN_VIEW` - so the setters that
  were renamed across releases stay the caller's problem, and clearing a link's
  override needs no separate call: an empty `OverrideGraphicSettings` IS the
  cleared state.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: view
      type: View
      source: request
    - name: elements
      type: IList<Element>
    - name: overrides
      type: OverrideGraphicSettings
      source: request
  provides:
    - name: overridden
      role: result
      type: int
    - name: notALink
      # Handed in but not a linked model, so there was nothing here to act on.
      # A count of what it was GIVEN and could not use, never a thing it found
      # (D-52).
      role: accounting
      type: int
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<string>
    - name: appliedTo
      role: result
      type: IList<string>


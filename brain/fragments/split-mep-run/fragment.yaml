id: FRG-MEP-009
semantic-identity: "cut this duct or pipe in two at a measured distance along it"
kind: action
domain: revit.mep
capability: SPLIT_MEP_RUN
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Breaks a duct or a pipe into two at a distance measured from the start of the
  run, leaving both halves in place and connected to whatever they were
  connected to.

  **Named for what it can actually do.** *"Split this at the wall"* is asked of
  walls, floors and ducts alike, and only the MEP case has an API behind it -
  Revit exposes a break for ducts and for pipes and for nothing else. Calling
  this SPLIT_ELEMENT would promise a wall split that no release can perform, so
  a modeller would ask for it, get a refusal, and have no idea why.

  **The distance is measured from the element's own start, which is not always
  the end a person is looking at.** A duct's start is whichever end it was
  modelled from, and right-to-left is as normal as left-to-right. So a distance
  that lands outside the length is refused with the length reported, giving the
  number needed to correct it rather than just "no".

  **VERSION 2 ASKS WHETHER THE TWO HALVES CAME BACK JOINED TO EACH OTHER, AND
  JOINS THEM WHEN THEY DID NOT.** Version 1 broke the run and said nothing
  about the joint: the far ends keep their connections, which is what the
  sentence above describes, and the new joint in the middle is a different
  question. The earlier library measured the break leaving that joint OPEN and
  had to close it by hand - unverified here, which is why this reports what it
  found rather than asserting it. A run split into two pieces that nothing
  bridges looks perfect on screen and traces as two systems.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: distanceMm
      type: double
      source: request
  provides:
    - name: created
      type: IList<ElementId>
    # VERSION 2: whether the two halves came back joined TO EACH OTHER.
    - name: halvesJoined
      type: IList<ElementId>
    - name: halvesLeftOpen
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>
    - name: notMepCurve
      type: IList<ElementId>


runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Connector.Shape`, `Radius`, `Width`,
  `Height`, `Domain`, `IsConnected`, `AllRefs` and `ConnectorProfileType` are
  unchanged 2020 through 2027 - read off the reference assemblies at both ends.
  `Domain.DomainStructuralAnalytical` is deliberately NOT named: it arrives at a
  later release and naming it would break the 2020 build for a domain no duct or
  pipe ever carries. `sizeTolerance` arrives in internal FEET.

# ROUTING - repeated in TRACE_CONNECTIVITY, CONNECT_OPEN_ENDS and
# REPORT_CONNECTOR_LOADS.
#
#   "are the equipment connectors the right size for the duct" -> here
#   "check the spigots on this AHU"      -> here
#   "which connectors on this unit are not used" -> here
#   "what connects to what"              -> TRACE_CONNECTIVITY - it walks the
#                                           network; this compares one joint
#   "join these open ends up"            -> CONNECT_OPEN_ENDS - a WRITE
#   "what flow does this connector carry" -> REPORT_CONNECTOR_LOADS - the
#                                           number on it, not whether it matches
#   "what connectors does this AHU have" -> REPORT_CONNECTORS - it
#                                           DESCRIBES every connector,
#                                           size, direction and partner.
#                                           This one GRADES what is joined
#   "which spigots are open"             -> REPORT_CONNECTORS
#   "what size is the spigot"            -> REPORT_CONNECTORS

utterances:
  - are the equipment connectors the right size for the duct
  - check the spigots on this AHU
  - which connectors on this unit are not used
  - does the duct match the equipment connection
  - check the equipment connectors

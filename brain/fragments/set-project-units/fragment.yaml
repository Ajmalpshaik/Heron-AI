revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  ONE IMPLEMENTATION ACROSS THE 2021 UNITS CHANGE, BY REFLECTION - the
  measurement is REPORT_PROJECT_UNITS', the read half. Writing adds, on the
  ForgeTypeId route (2021 to 2027): `Units.SetFormatOptions(ForgeTypeId,
  FormatOptions)`, `FormatOptions.SetUnitTypeId` and `SetSymbolTypeId`, the
  static `FormatOptions.GetValidSymbols(ForgeTypeId)`,
  `UnitUtils.GetValidUnits(ForgeTypeId)` and the `FormatOptions(ForgeTypeId)`
  constructor; on the enum route (2020 and 2021): `SetFormatOptions(UnitType,
  FormatOptions)`, the `DisplayUnits` and `UnitSymbol` setters, the static
  `GetValidUnitSymbols(DisplayUnitType)`, `UnitUtils.GetValidDisplayUnits
  (UnitType)` and the `FormatOptions(DisplayUnitType)` constructor - each read
  with tools/api-surface --members on all eight reference assemblies on
  2026-10-06. Called directly because they are the same on all eight:
  `Document.GetUnits` and `SetUnits`, the `FormatOptions(FormatOptions)` copy
  constructor, `Accuracy`, `IsValidAccuracy(double)`, the four suppress and
  plus-sign properties with their `Can...()` checks, and `Units.DecimalSymbol`,
  `DigitGroupingSymbol` and `DigitGroupingAmount` with their enums.

# ROUTING - the same rows are in REPORT_PROJECT_UNITS, SET_PROJECT_LOCATION
# and REPORT_LOCATION.
#
#   "set cooling load to Btu/h"             -> here
#   "change the project units to imperial"  -> here, one unit type at a time;
#                                              there is no "imperial" switch
#                                              in Revit to set
#   "show airflow in CFM"                   -> here
#   "round lengths to 5 mm"                 -> here, "Length=Millimeters,
#                                              rounding 5" - a rounding is
#                                              in the units' own numbers
#   "what units is this project in"         -> REPORT_PROJECT_UNITS. A
#                                              question never reaches this
#                                              write (D-86)
#   "convert 500 L/s to CFM"                -> NOT HERE - that is arithmetic
#                                              on one number; this changes
#                                              how the project prints them all
#   "set the project location"              -> SET_PROJECT_LOCATION
#   "change a dimension style's units"      -> NOT HERE - a dimension type
#                                              can override the project's
#                                              units; this sets the project's

utterances:
  - set cooling load units to btu/h
  - change the project units for air flow to cfm
  - set the project length units to millimeters
  - change project units
  - display areas in square feet
  # ADDED 2026-10-09, row 5b-387. The routing table above claims this
  # sentence, and a comment is not indexed, so ranking decided: "round lengths
  # to 5 mm": MEASURE_ELEMENT_LENGTHS answered it on both backends.
  - round lengths to 5 mm

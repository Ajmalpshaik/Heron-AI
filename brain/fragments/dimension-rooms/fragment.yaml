compatibility-note: >
  One implementation for every release. Boundary segments, the side-face
  references, the dimension creation call and the dimension's own value are
  unchanged 2020 to 2027. A dimension's value is a NULLABLE double in feet on
  every release - a multi-segment string returns nothing there, which is not an
  error and is why the read-back tests for a value before comparing.

# ROUTING - the same rows are in the fragments named here.
#
#   "dimension the rooms"                -> here
#   "put the room sizes on the plan"     -> here, as live dimensions
#   "how big is this room"               -> MEASURE_ROOM_DIMENSIONS. It reads
#                                           the size and draws nothing, which
#                                           is what a question wants
#   "list the rooms and their areas"     -> REPORT_ROOM_SPACE_DATA
#   "dimension these ducts"              -> DIMENSION_MEP_RUNS
#   "dimension between these"            -> CREATE_DIMENSION, the general one
#   "dimension the equipment"            -> DIMENSION_FAMILY_INSTANCES
#   "what is the overall size of this    -> REPORT_BOUNDING_BOX
#    set"


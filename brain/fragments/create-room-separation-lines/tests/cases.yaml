# D-30: the negative case is what catches "succeeded and did nothing" - and,
# for this fragment, "drew the wrong kind of line and called it done".
#
# Arranged per .claude/skills/fragment-proving/SKILL.md: a TEST COPY of the
# model, a floor plan that has a level, and two rooms' worth of floor joined by
# an opening with no wall across it - the case row 5b-289 was found on.

positive:
  - given: >
      a floor plan, and two points across an open archway between two areas
      that Revit currently reads as ONE room, lineKind room (version 1, asSpace not given)
    expect: >
      one line in `created`, read back as Room Separation Lines, its ends in
      the findings matching the two points to the millimetre, lying on the
      plan's level. Then, by eye: Revit's room boundary now stops at the line -
      the existing room shrinks to its own side or warns, and the other side is
      left with no room until PLACE_ROOMS places one at a point. Record which

  - given: the same two points with lineKind space (version 1, asSpace true), in a plan where Spaces are placed
    expect: >
      one line read back as Space Separation Lines - NOT Room Separation. The
      category in the findings is the evidence; the two look alike on screen

  - given: five points with the last repeating the first
    expect: >
      four lines, one per consecutive pair, a closed loop. Not five

negative:
  - given: >
      the SAME two points, but the view named is a 3D view or a section - a
      view with no level of its own
    expect: >
      refused naming the view and saying it has no level; `created` empty, and
      the model's count of room separation lines unchanged. THIS IS THE FIRST
      CASE TO RUN - a version that drew on some default plane anyway would put
      a line where no plan shows it

  - given: >
      lineKind space (version 1, asSpace true) across an opening between two ROOMS
    expect: >
      the line read back as Space Separation Lines, and the rooms NOT split -
      the room schedule unchanged. A space separation line bounds spaces only,
      and a fragment that drew the room kind instead would split the
      architect's rooms while reporting success

  - given: two points at the same coordinates
    expect: >
      `tooShort` 1, nothing drawn, and the reason in `refused`. Not a throw

  - given: a run of three points where the middle pair is the same point twice
    expect: >
      the two good lines still drawn and `tooShort` 1 - one bad pair does not
      lose the run

  - given: a family document open
    expect: refused before anything is made - the lines belong to a project

  # VERSION 2 (2026-11-01) - CREATE_AREA_BOUNDARY_LINES merged in. Each FAILS
  # on version 1, which has no lineKind and no area kind. NOT RUN. Arranged as
  # that card's proof was: CREATE_AREA_PLAN first, on a TEST COPY.
  - given: >
      lineKind area, areaPlanName an area plan on Level 1 over four straight
      exterior walls (wall type Function Exterior), traceWalls outside, no
      view, no points
    expect: >
      four lines in `created`, each read back as Area Boundary lines (the
      category in the findings), each along the OUTSIDE face of its wall -
      measured against the wall in the plan; then PLACE_ROOMS placeKind area
      at a point inside gives an area with a size
  - given: the same, traceWalls inside, then traceWalls centre
    expect: four lines each time, at the inside face and on the centreline
  - given: lineKind area, loopsMm "0,0; 6000,0; 6000,4000; 0,4000 | 8000,0; 9000,0"
    expect: >
      four lines (the first loop, closed automatically) and `refused` naming
      the loop of two points as left out
  - given: lineKind area, loopsMm with "abc,0" among the points
    expect: refused naming the point - nothing drawn, not even the good loop
  - given: lineKind area, areaPlanName of a FLOOR plan
    expect: refused - no area plan of that name - nothing drawn
  - given: lineKind area, an area plan, no traceWalls, no loopsMm, no points
    expect: refused - neither walls, loops nor points - nothing drawn
  - given: lineKind area over a level with an arc exterior wall among straight ones, traceWalls outside
    expect: the straight ones traced, the arc wall named in `refused` and left
  - given: lineKind area on a level whose walls are all interior, traceWalls outside
    expect: nothing drawn and `refused` saying no exterior wall was traced
  - given: two points in a floor plan with lineKind LEFT OUT
    expect: >
      refused before anything is drawn, asking room, space or area - version
      1 drew a room separation line here
  - given: lineKind room with traceWalls outside
    expect: refused - tracing walls is for area lines - nothing drawn

second_route:
  - >
    Architecture tab, Room Separator (Analyze tab, Space Separator for the
    space kind), drawn by hand across the same opening on a second test copy:
    the line's category in Properties, its length, and the rooms either side
    in a room schedule compared with what this fragment's line gave
  - for area lines, the area plan read by eye, each line on the wall face measured, and one Ctrl+Z removing them all

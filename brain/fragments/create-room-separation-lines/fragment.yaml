# VERSION 2 (2026-11-01) - CREATE_AREA_BOUNDARY_LINES WAS MERGED INTO THIS CARD
# on the owner's instruction ("ok go ahead merge all", after "make sure there
# is no duplicate tools" and "in every conflict keep the safer rule"), and is
# DEPRECATED. The same job - lines drawn on a plan's level that bound a
# spatial element where there is no wall - for the third spatial element.
# What that card had and this one lacked, all of it here: lineKind `area`,
# drawn with NewAreaBoundaryLine in an AREA PLAN CHOSEN BY NAME
# (`areaPlanName` - an area plan only, never a floor plan of that name);
# `traceWalls` inside, outside or centre - a line along every straight
# exterior wall on the plan's level (wall type Function Exterior) at that
# face, an arc wall named and left, no exterior wall said; `loopsMm`, closed
# loops of points in millimetres, each closed automatically, a loop of fewer
# than three points named and left out, a point that is not one refusing the
# call with nothing drawn; a line Revit refuses named and the rest drawn;
# every line read back by its id.
#
# THE OPPOSITE RULE, AND THE SAFER ONE KEPT: version 1 drew ROOM separation
# lines when the kind was not said ("not said means room"). The kind is now
# REQUIRED - lineKind room, space or area - and never inferred: a room line
# where a space line was meant splits the architect's rooms and leaves the
# heating load as it was, and the three look alike on a plan. `asSpace` is
# gone; asSpace true is lineKind space. Tracing walls, loops and an area plan
# are the area kind's, and refused - not ignored - for room or space lines.
# The lines lie on the sketch plane Revit makes on the level, this card's
# rule; that card used the level's Elevation, which a survey-datum model puts
# elsewhere.
#
# WHERE ITS OUTPUTS ARE NOW: `lineIds` -> `created` (the lines themselves,
# read back with their category); `made` -> how many are in `created`;
# `report` -> `refused`; `findings` -> `findings`. Its sentences moved here.
#
# Version 1's proof below no longer described the code (impl/ changed) and
# was kept as the record; DRAFT at the time, until version 2 is proved on a
# real model (D-30).

purpose: >
  Draws room separation lines - or space separation lines, when asked - along
  a run of points in one plan view. The line Revit's own Room Separator draws:
  it bounds a room where there is no wall, so a kitchen and a living room
  joined by an open archway become two rooms instead of one.

  **NOTHING COULD DRAW ONE BEFORE THIS.** Found 2026-10-02 drawing a
  shop-and-flat plan in Project2 (Revit 2024): the kitchen and the living room
  were joined by a 900 mm opening, PLACE_ROOM_AT_POINT made one room of both
  because nothing bounded the gap, and no fragment called the API that makes a
  separation line (FRAGMENT-ISSUES row 5b-289). A plain line from DRAW_FAMILY_DETAIL_LINES
  does not bound a room - it is a drawing or reference line, a different
  category Revit's room boundary never reads.

  **ROOM OR SPACE IS THE CALLER'S WORD, AND IT MUST BE SAID.** A room
  separation line bounds rooms and a space separation line bounds MEP spaces,
  and neither bounds the other: a kitchen split for the architect is still one
  space for the heating load. `lineKind` space draws the space kind. The two look
  alike on a plan, so every line made is read back and its category reported.

  **A RUN OF POINTS, like CREATE_WALL.** Consecutive points make the lines:
  two points is one line across an opening, and a run whose last point repeats
  the first is a closed loop. Points are millimetres when typed; Heron
  converts them to internal feet at the boundary (D-67), so no length is
  converted a second time.

  **THE LINES LIE ON THE VIEW'S OWN LEVEL.** Only the plan position of each
  point is used. The height is the plane of the level the plan belongs to, read
  off the sketch plane Revit makes on that level rather than worked out by
  hand - where levels are measured to a survey datum, a level's two heights
  differ (ProjectElevation is the one the API draws at), and the wrong one puts
  the lines where no room is.

  **REFUSED, WITH THE REASON, RATHER THAN THROWN:** a family document (a
  family has no rooms to bound), a view template, a view with no level of its own
  (a section, a 3D view, a sheet), and fewer than two points. A
  pair closer together than Revit's own shortest line is counted in `tooShort`
  and the rest of the run is still drawn; a pair Revit itself refuses is named
  in `refused` and the rest still drawn.

  **READ BACK, NOT ASSUMED.** Every line is fetched again by its id after it is
  made, and what is reported is what came back: how many, which category Revit
  filed each one under, their ends in millimetres and their total length.

  **IT PLACES NO ROOM AND JOINS NOTHING.** Splitting a room that already exists
  is two steps: this line, then PLACE_ROOMS at a point for the half that has
  no room. What Revit does to the existing room when the line cuts it, and the
  warning it gives for a line lying on a wall or on another separation line,
  are Revit's, and are recorded by the proof rather than claimed.

  **VERSION 2 DRAWS AREA BOUNDARY LINES TOO** - lineKind area, in the area
  plan named, along a run of points, round the exterior walls at a face, or
  along closed loops. The kind - room, space or area - is always said.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The plan the lines are drawn in. Its level decides their height, so a
    # view with no level of its own is refused. Version 2: left out for AREA
    # lines, which go in the area plan named; a room or space line with no
    # view is refused, as before.
    - name: view
      type: View
      source: request
      optional: true
    # A run: consecutive points make the lines. Plan position only - the
    # view's level decides the height. Millimetres as typed, internal feet
    # once the add-in has converted them (D-67). Version 2: may be left out
    # for area lines traced or looped; a room or space line still needs two.
    - name: points
      type: IList<XYZ>
      source: request
      optional: true
    # VERSION 2, REQUIRED: room, space or area. Room separation lines bound
    # rooms, space separation lines MEP spaces, area boundary lines areas;
    # never inferred (version 1's asSpace, absent meaning room, is gone).
    - name: lineKind
      type: string
      source: request
    # VERSION 2, from CREATE_AREA_BOUNDARY_LINES. AREA LINES ONLY: the area
    # plan they go in, as the Project Browser names it.
    - name: areaPlanName
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 2, from CREATE_AREA_BOUNDARY_LINES. AREA LINES ONLY: "inside",
    # "outside" or "centre" - a line along every straight exterior wall on
    # the plan's level at that face. Left out traces no walls.
    - name: traceWalls
      type: string
      source: request
      optional: true
      absent: none
    # VERSION 2, from CREATE_AREA_BOUNDARY_LINES. AREA LINES ONLY: closed
    # loops, "x,y; x,y; x,y | x,y; ..." in MILLIMETRES, each closed
    # automatically. Left out draws no loops.
    - name: loopsMm
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: created
      # The separation lines Revit made, each fetched again by its id after
      # it was made - never the count that was asked for.
      role: result
      type: IList<Element>
    - name: tooShort
      # Consecutive points closer together than Revit's own shortest line, so
      # no line could exist there - version 2, a traced wall or a loop's side
      # too. Given and unusable, never a line it drew (D-52).
      role: accounting
      type: int
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<string>
    - name: findings
      type: IList<string>


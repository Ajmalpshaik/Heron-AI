positive:
  - given: a model with a Gross Building scheme and a Rentable scheme over the same floors
    expect: >
      TWO scheme totals, each on its own, and NO combined figure. Each total
      checked against Revit's own area schedule for that scheme before it is
      quoted

  - given: a four-storey building in one scheme
    expect: a sub-total per level, and the level sub-totals summing to the scheme total

  - given: schemeNameContains "Rent"
    expect: only the rentable scheme reported, the others left out

  - given: listEachArea true
    expect: one line per area with its number, level and m2

  # D-59, added 2026-09-16 with the contract. NONE OF THESE HAS BEEN RUN.
  - given: >
      a federated job - the areas in a loaded ARCHITECTURAL LINK and none in
      the host - with includeLinks true
    expect: >
      the link's areas reported and linksSearched 1. This is the case the
      decision exists for: the same model with includeLinks absent comes back
      saying the host has no areas at all, which is true and useless

  - given: one linked file placed TWICE, with includeLinks true
    expect: >
      linksSearched 1, NOT 2, and each area counted once. A wing linked in
      twice is one model placed twice - count placements and a job with four
      links reports nine, with every area in the totals twice

  - given: >
      a host and a link that BOTH have a scheme called "Gross Building", with
      includeLinks true
    expect: >
      TWO rows, each under its own model name, and no merged total. This is the
      fragment's own no-grand-total rule one level up: merged, a link's floor
      plate is added to the host's and the number belongs to no building

negative:
  - given: any model with two overlapping schemes
    expect: >
      NO GRAND TOTAL ANYWHERE IN THE OUTPUT, and the reason stated. THIS IS THE
      FIRST CASE TO RUN AND THE REASON THE FRAGMENT EXISTS. Both schemes' Area
      elements sit in OST_Areas at once, so a plain sum is roughly double the
      building — a number that looks like a floor area and is not one

  - given: an area created in the schedule but never placed
    expect: >
      listed as UNPLACED with its own count, not as a 0 m2 row beside the real
      areas. It sits nowhere in the model and the fix is to place it or delete it

  - given: an area placed with a gap in its boundary lines
    expect: >
      listed as UNBOUNDED, SEPARATELY from unplaced. Both read as zero in a
      schedule and the two fixes are completely different, which is why they are
      not one category

  - given: a model with rooms but no areas
    expect: >
      "no Area elements at all" IN WORDS, with the note that areas are not rooms.
      A bare zero here reads as "this building has no floor area", and sends
      somebody looking for a fault that is not there

  - given: an area whose scheme cannot be read
    expect: grouped under "<no scheme>" rather than dropped

  # D-59's own worked example of a case that must not read like another.
  - given: includeLinks true on a model whose links are ALL UNLOADED
    expect: >
      linksSearched 0 AND A FINDING SAYING the links were asked for and none
      are loaded. It must NOT read the same as host-only: one means "there was
      nothing else to read", the other means "reload them in Manage Links and
      ask again", and both otherwise return the host's number

  - given: includeLinks absent, on a model that HAS loaded links
    expect: >
      the host's areas only, unchanged from before this input existed, and a
      finding saying so. Absent means host only - that is what every recorded
      proof of this fragment measured

second_route:
  - >
    Revit's own area schedule, one per scheme, with a Grand Total row. That is
    what each scheme total is checked against - and doing it scheme by scheme is
    exactly the point this fragment is making

id: FRG-QA-027
semantic-identity: "these are modelled in the wrong category"
kind: filter
domain: revit.qa
capability: CHECK_CATEGORY_MISMATCH
version: 2
source: OFFICIAL
risk: ANALYZE

purpose: >
  Finds elements that ARE one thing but were MODELLED as another: the family or
  type name says louvre, damper or fan, and the element sits in a category that
  does not match. Hands the mismatches on as the set to look at, and changes
  nothing.

  **A WRONG CATEGORY IS INVISIBLE UNTIL IT MATTERS, AND THEN IT IS EVERYWHERE
  AT ONCE.** The element looks right on screen. It is the schedule that misses
  it, the view filter that does not catch it, the export that files it under
  the wrong discipline, and the clash test that ignores it. By the time one of
  those is noticed the model has been built on for weeks.

  **IT IS FOUND BY NAME BECAUSE THAT IS WHAT CARRIES THE INTENT.** Somebody
  named the family for what it is; the category is what they picked from a
  list, sometimes wrongly, sometimes because the right one was not available
  when the family was made. So the keywords are the caller's - the words this
  office uses for the thing - and no list is built in, because every job names
  its kit differently.

  **IT REPORTS WHERE THEY ACTUALLY ARE.** Knowing that eleven elements are in
  the wrong category is half an answer; knowing that seven are in generic
  models and four in casework says whether it was one mistake or several.

  **IT DOES NOT RE-CATEGORISE ANYTHING.** Changing a family's category is done
  in the family editor and it reloads through every instance in the project -
  it is a real piece of work with real consequences, not a repair to slip into
  a check.

  ASSUMES NOTHING ABOUT TRANSACTIONS - it opens none and needs none.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, every loaded link is walked the same way and
  `linkedMatches` gives each link's line: how many are named like the thing
  but in the wrong category, where they actually are, and how many were
  right - a door built as a generic model in the architect's link breaks a
  door schedule as surely as one here. `linksSearched` says how many links
  were read: set and 0 means "you asked, and none are loaded". **NOTHING
  FROM A LINK IS EVER SELECTED OR CARRIED** - `elements`, `foundIn` and the
  two counts stay this model's own; the chain revives ids against this
  model, and a linked id that happens to be in use here binds an unrelated
  element (FRAGMENT-ISSUES row 75). Only model elements are read from a
  link, never its views or sheets. Links nested inside a link are not read,
  and are counted in the answer. This is version 2; version 1's proof no
  longer describes the code, and the fragment is DRAFT until it is proved
  again.

contract:
  needs:
    - name: doc
      type: Document
    # The words this office uses for the thing, matched against the family AND
    # type name. No list is built in: every job names its kit differently.
    - name: nameKeywords
      type: IList<string>
      source: request
    - name: expectedCategory
      type: BuiltInCategory
      source: request
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: foundIn
      # IT REPORTS WHERE THEY ACTUALLY ARE - knowing eleven are miscategorised
      # is half an answer, knowing seven are generic models and four are
      # casework is the other half.
      role: result
      type: IDictionary<string, int>
    - name: correctlyCategorised
      # How many were in the right category after all. The evidence it looked,
      # never a mismatch it found (D-52).
      role: accounting
      type: int
    - name: scanned
      # How many elements were examined. A count of work DONE, not of things
      # found - the evidence it ran, which is the opposite of a reason to
      # doubt it (D-52).
      role: accounting
      type: int
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then the links' own lines. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75).
      role: accounting
      type: IList<string>


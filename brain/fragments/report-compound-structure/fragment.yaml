id: FRG-ELE-038
semantic-identity: "what this wall, floor or roof is actually made of, layer by layer"
kind: action
domain: revit.reporting
capability: REPORT_COMPOUND_STRUCTURE
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Reads the layer build-up of a wall, floor, roof or ceiling TYPE - each layer's
  function, material and thickness, where the core starts and stops, and the
  total. The *"what is this wall made of"* answer. It changes nothing.

  **IT EXISTS BECAUSE THE QUESTION WAS BEING ANSWERED BY `CREATE_WALL`.**
  Measured before this batch, *"what is the wall build up"* resolved to the
  fragment that BUILDS A WALL. A question about an existing type, answered by
  making a new element - the worst shape of mis-route in this library, and the
  same one `CHECK_FAMILY_STANDARDS` and `REPORT_VIEW_FILTERS` were built to
  close.

  **IT REPORTS TYPES, NOT INSTANCES, AND DEDUPES.** Nine walls of one type are
  one build-up, and listing it nine times buries the one thing being asked. An
  instance is resolved to its type; a type handed in directly is used as it is,
  so this works downstream of a category filter or a type filter equally.

  **THE CORE IS MARKED, BECAUSE IT IS WHAT DIMENSIONS AND ROOMS MEASURE TO.**
  Revit's core boundary decides where a wall's location line can sit, what a
  room boundary follows, and what a dimension to "wall face" actually hits. A
  layer list without the core marked reads as a plain stack and hides the one
  line that changes measurements.

  **A CURTAIN WALL AND AN IN-PLACE ELEMENT HAVE NO COMPOUND STRUCTURE, AND THAT
  IS AN ANSWER.** It is not an error and not an empty result. A curtain wall is
  made of panels and mullions instead - `REPORT_CURTAIN_ELEMENTS` is that
  question, and this fragment names it rather than returning nothing.

contract:
  needs:
    - name: doc

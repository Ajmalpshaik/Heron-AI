revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `HostObjAttributes.GetCompoundStructure`,
  `CompoundStructure.GetLayers`, `GetFirstCoreLayerIndex`,
  `GetLastCoreLayerIndex`, and `CompoundStructureLayer.Function`, `Width` and
  `MaterialId` are present and unchanged 2020 through 2027.

  **No units API is called.** Layer widths are Revit internal feet and are
  multiplied by 304.8 to millimetres, plain arithmetic at the edge - which is
  what D-20 requires and what keeps this working across the 2021 units break.

  The material arrives as an `ElementId` and is resolved with `doc.GetElement`;
  nothing here reads an id as a number, so 2024's 64-bit change does not reach
  this code.

# ROUTING - the same rows are in the fragments named here.
#
#   "what is this wall made of"        -> here
#   "what is the wall build up"        -> here. It resolved to CREATE_WALL, which
#                                         MAKES A WALL, until 2026-09-05
#   "what layers are in this floor"    -> here
#   "how thick is this wall"           -> here - the total is reported per type
#   "build me a wall"                  -> CREATE_WALL. One reads a type, one puts
#                                         an element in the model
#   "what material is this"            -> READ_ELEMENT_MATERIAL - the materials
#                                         ON an element. This reports the LAYERS
#                                         of its type, which is where a wall's
#                                         materials actually live
#   "how much of each material"        -> REPORT_MATERIAL_TAKEOFF - quantities
#   "what is in this curtain wall"     -> REPORT_CURTAIN_ELEMENTS. A curtain wall
#                                         has NO compound structure; panels and
#                                         mullions are what it is made of

utterances:
  - what is this wall made of
  - what is the wall build up
  - what layers are in this wall
  - show me the wall construction
  - how thick is this wall type
  - what is the floor build up
  - list the layers of this roof

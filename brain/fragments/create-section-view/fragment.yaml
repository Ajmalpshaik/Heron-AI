tests: tests/

compatibility-note: >
  `ViewSection.CreateSection(Document, ElementId, BoundingBoxXYZ)` is unchanged
  2020 to 2027, as is `BoundingBoxXYZ.Transform`. No ElementId is built from an
  int, so 2024's 64-bit ids do not reach this code.

  The margin arrives in millimetres and is divided by 304.8 - arithmetic, per
  D-20, because `UnitUtils` was rewritten in 2021 and the call that worked on
  2020 does not exist on 2022.

# ROUTING - repeated in SET_VIEW_SECTION_BOX.
#
#   "create a section through this"  -> here. A NEW DRAWING
#   "make a section here"            -> here
#   "cut a section through this"     -> here
#   "section it and put it on a sheet" -> here, then PLACE_VIEW_ON_SHEET
#   "cut the pipe here"              -> SPLIT_MEP_RUN. Both sentences say
#                                       CUT and they are opposite jobs: one
#                                       makes a drawing, the other divides
#                                       an element. Measured 2026-09-01 -
#                                       this fragment took "cut the pipe
#                                       here" off SPLIT_MEP_RUN until its
#                                       prose stopped naming pipes
#   "crop the 3D view to this area"  -> SET_VIEW_SECTION_BOX. Hides part of a
#                                       view that already exists; makes nothing
#   "just show this bit in 3D"       -> SET_VIEW_SECTION_BOX
#   "crop the plan"                  -> SET_VIEW_CROP
#   "make a drafting view"           -> CREATE_DRAFTING_VIEW - shows NO model
#                                       and never changes; this follows the
#                                       model
#   "create a callout"               -> CREATE_CALLOUT - enlarges part of a
#                                       view that already exists

#   "make elevations inside each room"   -> CREATE_ROOM_ELEVATIONS - a marker
#                                        with four slots looking outward. A
#                                        section cannot make that symbol
#   "what view does this section open"   -> REPORT_VIEW_REFERENCES, the read
#                                           side. This one creates a section

utterances:
  - create a section through this
  - make a section here
  - cut a section through this
  - I need a section of this
  - give me a cross section
  - section this run
  - add a section view
  - section it and put it on a sheet

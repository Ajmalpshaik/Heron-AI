heron-agent: HERON-REVIT-WRN-016
heron-step: 14
heron-status: DRAFT
heron-since: 0.1.0
heron-layer: brain

id: FRG-QA-004
semantic-identity: "what warnings is this model carrying, and which elements cause them"
kind: filter
domain: revit.quality
capability: READ_MODEL_WARNINGS
# VERSION 2 (2026-11-01): SELECT_WITH_WARNINGS was merged into this card on the
# owner's instruction - "make sure there is no duplicate tools" - and is
# DEPRECATED; see the merge block above `utterances`. Version 1's proof below
# is kept as the record; it no longer describes the code, so the card is DRAFT
# until version 2 is proved on a real model (D-30).
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Reads the model's warning list, groups it by what the warning actually says,
  and hands on the elements causing them.

  **The elements are the point, not the count.** *"How many warnings"* got
  answered by COUNT_ELEMENTS before this existed - a number about something
  else entirely. But a warning count on its own is a number nobody can act on;
  what a modeller needs next is to SEE the elements, and because this fragment
  provides `elements`, *"show me what is causing the warnings"* composes
  straight into ISOLATE_ELEMENTS or SET_SELECTION.

  **Grouped by message, because that is how warnings actually arrive.** A model
  with 800 warnings usually has six kinds of problem, and one of them is 600
  rows of the same duplicate-instance message. A flat list of 800 is unreadable
  and hides the five that matter.

  **ERRORS ONLY, OR ONE KIND OF WARNING (version 2).** `errorsOnly` keeps the
  Error severity; `descriptionContains` the warnings whose text holds a phrase.
  An empty answer is not a clean model. Version 2 is DRAFT until proved.

contract:
  needs:
    - name: doc
      type: Document
    - name: errorsOnly
      # VERSION 2, from SELECT_WITH_WARNINGS: only the warnings Revit raises at
      # Error severity. Left out it binds false - every warning, as version 1.
      type: bool
      source: request
      optional: true
    - name: descriptionContains
      # VERSION 2, from SELECT_WITH_WARNINGS: only the warnings whose text holds
      # this phrase, capitals ignored - "duplicate", "off axis". Left out it
      # binds `none`, no phrase.
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: findings
      type: IList<string>
    - name: warningCount
      # How many warnings there are. THE ELEMENTS ARE THE POINT, NOT THE COUNT
      # - a number was what COUNT_ELEMENTS already answered, about something
      # else entirely (D-52).
      role: accounting
      type: int
    - name: notInThisModel
      # Warning elements that do not resolve in this document. Given and
      # unusable, never a warning it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: matched
      # VERSION 2: how many warnings passed `errorsOnly` and
      # `descriptionContains` - all of them with neither. `warningCount` stays
      # the model's whole total. About the list, never an element (D-52).
      role: accounting
      type: int
    - name: unresolved
      # VERSION 2, from SELECT_WITH_WARNINGS: how many ids in those warnings
      # resolve to no element here - the count of `notInThisModel`. A large
      # figure means the warning list is stale. Never an element it found
      # (D-52).
      role: accounting
      type: int

proof:
  date: '2026-09-13'
  by: Ajmal PS
  model: >
    Snowdon Towers Sample HVAC.rvt (9,628 elements) and Project1 (3,410 elements, unsaved default template), both open at once in Revit 2024.3
  positive_case: >
    Snowdon Towers: 145 warnings over 87 elements, grouped into 5 kinds, worst first - 'x111 The calculation was run with the Pressure Drop set to 0'. The grouping is the answer; 145 individual rows would not be.
  negative_case: >
    Project1: 0 warnings, 0 elements, 0 kinds. A clean model returns nothing rather than a spurious finding, with both documents open.
  second_route: >
    Revit's own Manage > Warnings dialog lists the same set and the same total.
  fingerprint: "9b6bb49afca0cf5e"

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  `Document.GetWarnings()`, `FailureMessage.GetDescriptionText()`,
  `GetFailingElements()` and `GetSeverity()` are unchanged 2020 to 2027. No
  ElementId is built from an int, so 2024's 64-bit ids do not reach this code.

# WHAT THIS CANNOT SEE, and it matters more than what it can.
#
# GetWarnings() reports what Revit recorded at the last regeneration. It does
# not re-audit the model, so it is a record rather than a fresh check - and it
# is still the same list the Review Warnings dialog shows, which is what
# anybody means by "the warnings".
#
# It reports THIS document only. Warnings inside a linked model belong to that
# model and are invisible here, so a clean result never means the federated
# model is clean.

# ROUTING - repeated in REPORT_FINDINGS.
#
#   "how many warnings"          -> here
#   "list the warnings"          -> here
#   "show me what is causing the warnings" -> here, then ISOLATE_ELEMENTS
#   "is the model healthy"       -> here is the first half of that
#   "how many ducts are there"   -> COUNT_ELEMENTS. A count of elements, not of
#                                   complaints about them
#   "which parameters are blank" -> DESCRIBE_BLANK_PARAMETERS - a different
#                                   audit, and one Revit raises no warning for
#   "is the model clean"                 -> here. Revit's own warnings are
#                                           the first answer to that
#   "select everything with a warning"   -> here since version 2 - it was
#                                           SELECT_WITH_WARNINGS', merged in
#   "isolate the error level warnings"   -> here with errorsOnly, then
#                                           ISOLATE_ELEMENTS
#   "fix the slightly off axis warnings" -> STRAIGHTEN_OFF_AXIS_LINES, after
#                                           this selects them with
#                                           descriptionContains
#   "show me the duplicate instances"    -> FIND_DUPLICATE_ELEMENTS - the check
#                                           built for it, which does not depend
#                                           on Revit having noticed
#   "what clashes"                       -> FIND_CLASHES. A clash is not a
#                                           Revit warning
#
# VERSION 2 (2026-11-01) - SELECT_WITH_WARNINGS WAS MERGED INTO THIS CARD on
# the owner's instruction in conversation: "make sure there is no duplicate
# tools", every conflict to keep the SAFER rule. It is DEPRECATED. The same
# job - the elements Revit's warnings name, each once, handed on - and this
# card already provided `elements` for ISOLATE_ELEMENTS and SET_SELECTION.
# Where each retired output is now:
#
#   SELECT_WITH_WARNINGS                here
#     errorsOnly, descriptionContains   the same, both optional now
#     elements                          elements - each element once
#     unresolved                        unresolved, beside notInThisModel's
#                                       ids
#     findings                          findings - its first line, "N
#                                       element(s) named by M of the model's
#                                       warnings", "no warning matched that
#                                       filter", and that these are Revit's
#                                       own warnings, never a clash or a
#                                       standard - followed by this card's
#                                       rows, grouped by message, worst first
#
# THE SAFER RULE WHERE THEY DIFFERED. Version 1 here answered a clean model
# with NO findings; SELECT_WITH_WARNINGS said "This model has no warnings at
# all" and that an empty answer is not a clean model. Saying it is kept: an
# unexplained empty set reads as a clean federated model, and this document's
# warnings are all GetWarnings() reads.

utterances:
  - how many warnings
  - list the warnings
  - what warnings does the model have
  - show me the warnings
  - is the model clean
  - review the warnings
  - what is causing the warnings
  - are there any errors in the model
  - is the model healthy
  # MOVED 2026-11-01 from SELECT_WITH_WARNINGS, merged into this card.
  - select everything with a warning
  - show me the elements revit is warning about
  - isolate the error level warnings
  - find elements with duplicate instances warning
  - which elements have warnings

runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `ScheduleDefinition.GetFilters`,
  `SetFilters`, `ClearFilters`, `GetFilterCount`, `CanFilterByValue`,
  `CanFilterByValuePresence`, every `ScheduleFilter` constructor (no value,
  string, int, double, ElementId), its `FilterType` setter and five value
  getters, `ScheduleFieldId`'s `==`, and every `ScheduleFilterType` member are
  present and unchanged 2020 through 2027, with the same argument counts - read
  off the shipped assemblies with `tools/api-surface --members` on 2026-10-21.
  `FilteredElementCollector.OfClass` finds the element a changed element rule
  names, on every release.

  Field identity is `ScheduleFieldId`, not an `ElementId`. **No units call is
  made anywhere**, which is why the value is text - see the purpose.

# ROUTING - the same rows are in the fragments named here.
#
#   "filter the schedule to level 2 only" -> here. A TABLE changes; no element
#                                            is touched
#   "show only the supply ducts in it"    -> here
#   "change the schedule filter from MFD  -> here, VERSION 2, filterAction
#    to EDH"                                 change. The rule is picked by its
#                                            column; REPORT_SCHEDULE_DEFINITION
#                                            first, when which column holds MFD
#                                            is not known
#   "change the level filter of this      -> here, change - the level rule
#    schedule to the roof"                   takes the roof level by name
#   "remove the level filter from the     -> here, remove - one RULE goes.
#    schedule"                               REMOVE_SCHEDULE_FIELDS takes a
#                                            COLUMN out, and was what this
#                                            sentence reached before version 2
#   "what filters does this schedule      -> REPORT_SCHEDULE_DEFINITION, a
#    have"                                   read - its version 2 lists every
#                                            rule, numbered as ruleNumber counts
#   "move these ducts to level 2"         -> SET_ELEMENT_LEVEL - which is what
#                                            the FIRST sentence used to return.
#                                            One changes a table, one changes
#                                            the building
#   "sort the schedule by level"          -> SET_SCHEDULE_SORT_GROUP. Filtering
#                                            picks WHICH rows, sorting picks
#                                            their ORDER, and "by level" is said
#                                            for both
#   "what is it filtered on now"          -> REPORT_SCHEDULE_DEFINITION
#   "show me only these in the VIEW"      -> ISOLATE_ELEMENTS or
#                                            APPLY_VIEW_FILTER. A schedule
#                                            filter is not a view filter and
#                                            neither one affects the other
#   "add a prefix to the mark"           -> EDIT_PARAMETER_TEXT, which
#                                           changes the VALUES. This one
#                                           changes what the schedule shows
#   "why is this missing from the        -> CHECK_CATEGORY_MISMATCH first: a
#    schedule"                              wrong category is the usual
#                                           reason a real element is absent
#                                           and on screen

utterances:
  - show only the supply ducts in it
  - filter the schedule to level 2 only
  - show only the supply ducts in the schedule
  - the schedule should only show this system
  - filter out the ones with no mark
  - limit the schedule to this level
  - only show these rows in the schedule
  - remove the other levels from the schedule
  # ADDED 2026-10-21 (row 5b-1289), the modeller's own words on project
  # 4355-BHVD-3D-22S10-BL001A, and the two jobs that request carried.
  - change the schedule filter from MFD to EDH
  - change the level filter of this schedule to the roof

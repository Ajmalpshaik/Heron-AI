compatibility-note: >
  One implementation for every release. MassInstanceUtils.GetMassLevelDataIds,
  MassLevelData.StrUsage (get and set), Element.LevelId and
  Level.ProjectElevation are present 2020 through 2027 - read with
  tools/api-surface on 2026-10-28. MassLevelData is marked obsolete on 2023
  alone, and not on 2024 to 2027.

# ROUTING - the same rows are in the fragments named here.
#
#   "set the usage of the mass floors"          -> here
#   "make level 1 retail and the rest office"   -> here
#   "add mass floors at every level"            -> CREATE_MASS_FLOORS
#   "how much area does each use get"           -> REPORT_MASSES


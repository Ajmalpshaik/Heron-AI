positive:
  - given: 40 ducts checked against the structural beams, 3 genuinely passing through a beam
    expect: clashes has those 3 with the beam ids they hit, clashing is 3, clear is 37

  - given: the same run against Revit's own Interference Check on the same two categories
    expect: the same element pairs - the second route, and the one that says whether this fragment is right at all

  # D-59, added 2026-09-28 with version 2. NOT RUN.
  - given: >
      ducts in this model, one of them passing through a linked beam, against
      EMPTY, includeLinks true
    expect: >
      the host part says nothing was given to check against; the link's line
      reads "1 of N element(s) clash" and names the duct and the beam's type,
      id in the link and Fire Rating - checked in a section with the link shown

  # VERSION 3, added 2026-10-17 (row 5b-540, NEEDS-CHECKING Group FC). NONE
  # OF THESE HAS BEEN RUN. The models are the job file's -
  # tools/jobs/find-clashes-v3-link-2026-10-17.yaml.
  - given: >
      two generic-model boxes 600 x 400 mm and 255 mm deep in this model, each
      with an instance length "Wall Width" of 255, standing in a 200 mm linked
      wall; against EMPTY, includeLinks true, categories Walls,
      compareParameter Wall Width
    expect: >
      passedThrough names both, each through "Walls 'Basic Wall: ...' (id N
      in the link), wall 200 mm thick, centre 0 mm off the element's
      centre"; comparison reads 2 differ and names each "Wall Width 255 mm -
      55 mm MORE than ... wall 200 mm thick"; mismatched holds the two boxes'
      ids, this model's own

  - given: >
      the same, one box moved so the wall's centreline sits 100 mm behind the
      box's centre, and the link's 30 mm wall at another box
    expect: >
      that box's line says "wall 200 mm thick, only 127 (or 128) mm of it
      inside the element, centre 100 mm behind the element's centre, to the
      wall's ... side" - the WALL's centre, not the overlap's; the 30 mm wall
      reads "wall 30 mm thick", and a Wall Width of 255 there reads 225 mm
      MORE - the first-use case

  - given: >
      a box through a linked Air Terminal 305 mm deep along the box's facing,
      categories all
    expect: >
      "Air Terminals '...' (id N in the link), 305 mm deep along the
      element's facing", and with Wall Width 255 "50 mm LESS than" it. With
      categories building it is not looked for at all

  - given: >
      a duct in this model through a 200 mm wall in this model (not a
      link), includeHost true, categories Walls, compareParameter Width, the
      duct 200 mm wide
    expect: >
      "this model: Walls '...' (id N), wall 200 mm thick" and comparison
      1 agree, 0 differ - the host searched with the elements handed in left
      out, and `clashes` empty because `against` was

negative:
  - given: a DIAGONAL duct running past a beam without touching it
    expect: >
      it is CLEAR. A bounding-box check would report it as clashing, because the
      box around a diagonal element overlaps everything in the rectangle it
      spans - which is how a clash report grows to hundreds of rows nobody reads

  - given: the same element present in BOTH sets
    expect: >
      it does not clash with itself. An overlapping request is normal - checking
      services against services - and self-hits would put an unactionable row in
      every report

  - given: a batch containing an element whose geometry cannot be read
    expect: >
      the batch runs to the END, that element is in `notChecked` with Revit's
      reason in the findings - NOT in clear - and clashing + clear +
      notChecked equals the number of elements handed in. Not an exception
      that abandons the rest, not a silent drop, and not a "clear" for an
      element that was never tested. Until 2026-09-23 this case said "counted
      in clear", which is the trap another tool's clash check fell into

  - given: an empty set to check against
    expect: >
      nothing counted clear and nothing clashing, and a finding saying nothing
      was checked. A report of forty clear elements that were tested against
      nothing reads as a clean model

  # D-59, added 2026-09-28 with version 2. NONE OF THESE HAS BEEN RUN.
  - given: includeLinks ABSENT, on a model that HAS loaded links
    expect: >
      the same answer as version 1, and linksSearched 0 with the first
      line of linkedMatches reading "Host model only - links not read". The
      switch left out must bind false, not refuse - if the run refuses with
      needs_request_values, the add-in in Revit is older than this change

  - given: includeLinks true on a model with NO links, or with every link unloaded
    expect: >
      linksSearched 0 and "Links asked for, NONE loaded - host only". It must
      NOT read like the absent case: one means there was nothing else to read,
      the other means reload them in Manage Links and ask again

  - given: one linked file placed TWICE, with includeLinks true
    expect: >
      linksSearched 1, not 2 - it counts files, not placements

  - given: ducts clear of every linked element, includeLinks true
    expect: >
      each link's line reads "0 of N element(s) clash" - with N the number of
      ducts, so the zero is visibly a checked zero

  # Row 5b-203, added 2026-10-09. NOT RUN - it needs a model that carries a
  # duplicated name, and none has been arranged yet.
  - given: >
      a duct in this model passing through a linked beam, the beam's type
      carrying two parameters named Fire Rating - a shared or project one
      bound to Structural Framing beside another of that name - against EMPTY,
      includeLinks true
    expect: >
      the link's line names the duct and the beam with "Fire Rating NOT READ -
      2 parameters share that name", never either rating (row 5b-203)

second_route:
  - Revit's own Interference Check, run on the same two selections

  # VERSION 3, added 2026-10-17 (row 5b-540). NONE OF THESE HAS BEEN RUN.
  - given: >
      the two boxes, each with Wall Width set to 200, in the 200 mm linked
      wall, compareParameter Wall Width
    expect: >
      comparison reads 0 differ, 2 agree; mismatched EMPTY. The negative
      leg of the proof: the same arrangement, the parameter right

  - given: >
      a box clear of every linked element, compareParameter Wall Width
    expect: >
      passedThrough lists it under "through nothing"; comparison counts it
      under "pass through nothing it could be compared with" - NOT under
      agree, and not in mismatched

  - given: categories "Wals, Air Terminals", includeLinks true
    expect: >
      linkedMatches' first line and passedThrough's read "NOTHING WAS LOOKED
      FOR, in the links or here - 'Wals' is not a category this model
      knows"; linksSearched 0; nothing compared. Never a half-read answer
      for the one name it knew

  - given: compareParameter "Comments" (text) or a Number parameter holding 255
    expect: >
      comparison names "'Comments' not a length on N element(s)" and
      compares none - a number with no unit is not 255 mm

  - given: >
      a box whose INSTANCE carries two parameters named "Wall Width" (a
      shared one beside a family one)
    expect: >
      "'Wall Width' NOT READ - 2 parameters share that name on 1
      element(s)", never either value (D-54 s3, 5b-203). One on the instance
      and one on its type is not this case: the instance's is read, as the
      lookup lands there first

  - given: >
      a void-only opening family with no solid of its own, includeLinks true
    expect: >
      either its hits are marked "(box)" and linkedMatches says it was tested
      by its bounding box, or - if Revit gives it no box either - it is NOT
      tested and named so. Never counted through nothing

  - given: categories, includeHost and compareParameter all LEFT OUT
    expect: >
      clashes, clashing, clear, notChecked, findings and linkedMatches exactly
      as version 2 gave them, comparison "No parameter named - nothing
      compared", mismatched empty. A caller that never heard of version 3
      gets version 2

  - check the cut-out wall width against the walls
  - what does each opening cut through in the links
  - check all the cut-out wall width
  # MOVED 2026-11-01 from SELECT_TOUCHING, merged into this card.
  - what is clashing with this
  - what is touching this element
  - what runs through this wall
  - find everything overlapping this
  - what is in the same place as this
  - what is touching this beam
  - what penetrates this wall

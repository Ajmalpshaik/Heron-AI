id: FRG-QA-003
semantic-identity: "which of these actually intersect those"
kind: action
domain: revit.qa
capability: FIND_CLASHES
# VERSION 4 (2026-11-01) - SELECT_TOUCHING WAS MERGED INTO THIS CARD on the
# owner's instruction ("make sure there is no duplicate tools"; "merge means
# ... all area need to be covered"), and is DEPRECATED. Its job - ONE element
# against the model, "what is clashing with this", "what runs through this
# wall" - was already half here: includeHost and `categories` search this
# model for what each element passes through. What it had that this lacked:
#   - NO SECOND SET TO TYPE. `against` may be left out (absent "none", an
#     empty set), and with no `against` and no link asked for THIS MODEL is
#     searched, as includeHost asks. Version 3 answered that call "NOTHING WAS
#     LOOKED IN".
#   - THE HITS HANDED ON AS `elements`, so SET_SELECTION or ISOLATE_ELEMENTS
#     can act on what is touching - this model's own elements only, never a
#     linked one (FRAGMENT-ISSUES row 75), each once, the handed-in elements
#     never among them (never "touching itself").
#   - "OVERLAPPING IS NOT MEETING" said when nothing overlaps: a duct joined at
#     a connector shares no volume, and TRACE_CONNECTIVITY answers "what is
#     connected to this".
# Where each of SELECT_TOUCHING's outputs is now: elements -> elements;
# findings -> findings and passedThrough; linksSearched and linkedMatches the
# same (up to 50 a link here, where it named 20). Its `target` is the one
# element handed in as `elements`; its `categories` list is `categories` -
# names, or `all` (left out, the building list; SELECT_TOUCHING's list could
# not be left blank either - the binder refuses a blank category list).
# NOT CARRIED: nothing. The proof below was version 3's and no longer
# described the code; DRAFT at the time, until version 4 is proved on a real
# model (D-30).
version: 4
source: OFFICIAL
risk: READ

purpose: >
  Element-against-element clash: which members of one set physically intersect
  members of another. Ducts against beams, pipes against structure, services
  against each other.

  **This is NOT `PROBE_AROUND_ELEMENTS`, and the two get asked for in the same
  words.** That one casts a ray from a POINT and asks what is within a distance
  of it — the sprinkler-under-a-beam question, answered before anything is
  modelled. This one takes two sets of REAL ELEMENTS and asks whose solids
  overlap. A layout check and a coordination check.

  **Solids, not bounding boxes.** A bounding box says a diagonal duct clashes
  with everything in the rectangle around it, which is how a clash report grows
  to four hundred rows nobody reads. Revit's own intersection filter tests the
  real geometry.

  **Touching is not clashing, and Revit does not draw that line for you.** A
  duct sitting exactly on a beam soffit reports as intersecting. That is correct
  geometrically and is not a defect on site, so it is reported like any other
  hit and the caller decides — this fragment does not invent a tolerance,
  because a tolerance invented here is one quietly relied on.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as
  version 1 did. With it set, each element's solids are carried into every
  placement of every loaded link and tested against that link's walls,
  floors, roofs, ceilings, columns, beams, foundations and stairs - the
  building, not another trade's MEP - and `linkedMatches` gives each link's
  count, then names each clashing element with the linked element's type,
  id IN THE LINK and **Fire Rating**, up to fifty a link. An element with no
  solid is counted as not tested against the links, never as clear.
  `linksSearched` says how many links were read: set and 0 means "you
  asked, and none are loaded". **NOTHING FROM A LINK IS EVER SELECTED OR
  CARRIED** - `clashes`, `clashing`, `clear` and `notChecked` stay this
  model's own (FRAGMENT-ISSUES row 75). Only model elements are read from a
  link, never its views or sheets. Links nested inside a link are not read,
  and are counted in the answer.

  **WHAT EACH ONE PASSES THROUGH, AND A PARAMETER AGAINST IT (version 3).**
  `passedThrough` names, element by element, everything its solid passes
  through - in the links, in `against`, and with `includeHost` in this
  model - with the category, 'Family: Type', its thickness (a wall's width,
  a floor's layers, anything else its depth along the element's facing or
  run) and which side of the element's centre it sits. `categories` says
  what is looked for: left out, the building list above; `all`, any model
  category; or names. `compareParameter` names a length on the element, and
  `comparison` lists every element whose value differs from the thickness
  it passes through - `mismatched` holds them, this model's own. An element
  with no solid is tested by its bounding box, and says so. Version 3, and
  DRAFT until proved.

# A NAME TWO PARAMETERS SHARE IS NEVER READ: a linked element whose Fire Rating
# two parameters carry - a shared or project "Fire Rating" bound beside the
# built-in one, on the element or on the type the lookup falls through to -
# reads "Fire Rating NOT READ - N parameters share that name" in
# `linkedMatches`, never either value (D-54 s3, FRAGMENT-ISSUES 5b-203; added
# 2026-10-09). Written here and not in `purpose`, as on check-sleeve-size's
# card: the purpose is embedded for routing, and on that card's change a
# purpose sentence about this moved other cards' utterances in check-routing,
# measured against d9b27f03 (row 5b-203's 2026-10-09 note). Not measured for
# this card.
contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: against
      # VERSION 4: MAY BE LEFT OUT - "none", an empty set. With no `against`
      # and includeLinks not set, THIS MODEL is searched (as includeHost),
      # which is SELECT_TOUCHING's one-element-against-the-model job.
      type: ICollection<ElementId>
      source: request
      optional: true
      absent: none
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
    # VERSION 3. What is looked for in the links and, with includeHost, in
    # this model. Left out: "building" - version 2's walls, floors, roofs,
    # ceilings, columns, beams, foundations and stairs. "all" is every model
    # category but rooms, spaces, areas and link instances. Or names as
    # Visibility/Graphics shows them, or API names - "Walls, Air Terminals",
    # OST_Walls - comma separated. One name this model does not know reads
    # NOTHING and says which. A STRING ON PURPOSE: the binder refuses a blank
    # IList<BuiltInCategory> and has no word for "all" (row 5b-481's reason).
    - name: categories
      type: string
      source: request
      optional: true
      absent: building
    # VERSION 3. true also searches THIS model, with `categories` and the
    # same solid test, the elements handed in left out. Lines only, in
    # passedThrough and comparison - `clashes` stays `against`'s. Absent is
    # false. It exists because `against` takes the selection or nothing.
    - name: includeHost
      type: bool
      source: request
      optional: true
    # VERSION 3. A LENGTH parameter on each element - instance first, then its
    # type; a Length, or one Revit shows in a length unit, as a duct's Width
    # (a Duct Size) - compared with the thickness of everything it passes
    # through.
    # Left out: "none" - nothing compared. Two parameters by the name read
    # NOT READ (D-54 s3, 5b-203); one that is not a length is named, never
    # compared.
    - name: compareParameter
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: clashes
      role: result
      type: IDictionary<ElementId, ICollection<ElementId>>
    - name: clashing
      role: result
      type: int
    - name: clear
      # How many were TESTED and did not intersect anything. The evidence it
      # looked; `clashes` is what it found (D-52). An element Revit's test
      # refused is not in here - see `notChecked`.
      role: accounting
      type: int
    - name: notChecked
      # Elements Revit's intersection test refused, so they were NOT TESTED -
      # neither clear nor clashing. Until 2026-09-23 these were counted clear,
      # which a clash report must never do (D-52).
      role: accounting
      type: IList<ElementId>
    - name: findings
      type: IList<string>
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then the links' own lines. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75). Since 2026-10-09 a Fire
      # Rating two parameters share reads NOT READ there, never either
      # value (D-54 s3, FRAGMENT-ISSUES 5b-203).
      role: accounting
      type: IList<string>
    - name: passedThrough
      # VERSION 3. The first line says where it looked and for what, then one
      # line per element that passes through something: each hit's place (a
      # link by its title, or this model), category, 'Family: Type', id,
      # thickness and side. Then the elements through nothing and the ones NOT
      # tested. Text: a linked id is never carried (row 75).
      role: accounting
      type: IList<string>
    - name: mismatched
      # VERSION 3. This model's elements whose compareParameter differs from
      # the thickness of something they pass through, by more than Revit's
      # vertex tolerance. Their own ids, so selecting them is safe. Empty
      # when no parameter is named.
      role: result
      type: IList<ElementId>
    - name: comparison
      # VERSION 3. The first line counts differ, agree, nothing to compare
      # with, not read and NOT tested; then one line per difference - the
      # element, its value, by how much, and what it passes through.
      role: accounting
      type: IList<string>
    - name: elements
      # VERSION 4, from SELECT_TOUCHING. THIS MODEL's elements that overlap
      # the ones handed in - from `against` and from this model's search -
      # each once, the handed-in ones never among them. Handed on so SELECT
      # or ISOLATE can act on them. Never a linked element (row 75).
      role: result
      type: IList<Element>


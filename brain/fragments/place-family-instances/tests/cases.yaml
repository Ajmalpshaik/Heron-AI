# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: a loaded, ALREADY-USED air terminal type and 6 points inside a room
    expect: 6 ids in `placed`, failed 0, and six terminals VISIBLE on the plan

  - given: >
      a family type loaded but NEVER PLACED in this document, so its symbol is
      inactive - the same 6 points
    expect: >
      still 6 placed. This is the row the fragment exists for: without
      Activate() and Regenerate() this case places nothing, and it is the
      normal state of a family the moment it is loaded

  # VERSION 2, 2026-10-06 - FRAGMENT-ISSUES 5b-334. RUN in Project2 (scratch,
  # Revit 2024), every leg rolled back.
  # A POINT'S Z IS ITS HEIGHT IN THE MODEL: Level 1 is at 0 mm and Level 2 at
  # 4000 mm in Project2, so "...,6700" on Level 2 is 2700 mm above it.
  - given: >
      a work plane-based family that carries Offset from Host - M_Supply
      Diffuser - Hosted - at three points z 3000 on Level 1, and at one point
      z 6700 on Level 2
    expect: >
      placed 3, then 1; readBack "work plane-based, on 'Level 1''s own plane,
      standing 3000 mm above it - Host 'Level 1', Level 'Level 1', Schedule
      Level 'Level 1', Offset from Host 3000 mm", and 2700 mm above Level 2.
      RAN: exactly that

  - given: >
      a level-based family - M_Fan Coil Unit - Horizontal Basic Concealed - at
      z 2700 on Level 1 and z 6700 on Level 2. Revit's own call reads the Z as
      the height above the level, so on Level 2 it first stands at 10700
    expect: >
      readBack "level-based, on 'Level 1', standing 2700 mm above it - Level
      'Level 1', Elevation from Level 2700 mm", and on Level 2 also 2700 mm
      above it, written back by version 2. RAN: exactly that

  # VERSION 3, 2026-10-17 - FRAGMENT-ISSUES 5b-590. RUN in scratch Project1,
  # Revit 2020, every leg rolled back. Level 2 is at 4000 mm.
  - given: >
      TRG_GEN_CutOut_Rectangular_HVAC: 25mm Cutout Buffer - level-based, with
      "Defines Origin" ticked on the plane at the BOTTOM of its opening - at
      z 6152 and z 6127 on Level 2: the shape of the real refusal of
      2026-10-15, 2152 and 2127 mm above the level
    expect: >
      placed 2; readBack "level-based, on 'Level 2', standing 2152 mm above it
      - Level 'Level 2', Elevation from Level 2152 mm, its insertion point
      150 mm below that", and the same at 2127. Version 2 refused it "2002 mm
      above 'Level 2' ... where it was asked 2152 mm above" and kept nothing.
      RAN: exactly that, tracked across 1, 2, 3 and 5 points

  - given: >
      the same family, 50mm Cutout Buffer, at z 0 on Level 1 - the level's
      own height
    expect: >
      placed 1, standing 0 mm above 'Level 1', its insertion point 300 mm
      below that. Version 2 refused it "-300 mm above". RAN: exactly that

  - given: >
      every version 2 case above - the fan coil unit at 2700 on Level 1 and
      6700 on Level 2, the hosted diffuser three times at 3000 and once at
      6700, the ceiling-mounted diffuser at its level's own height - run by
      version 2 and version 3 side by side on the same placements
    expect: >
      word for word the same `placed`, `failed` and `readBack` from both: each
      of those families' insertion point is its own level. RAN: the same, twice

  - given: the same three hosted diffusers, tracked across 1, 2, 3 and 5 points
    expect: >
      placed 1, 2, 3 and 5, each read back at 3000 mm on Level 1's plane - the
      D-53 tracking the version 2 draft records

  # VERSION 4 (2026-11-01) - PLACE_STRUCTURAL_FAMILY merged in. Each FAILS on
  # version 3, which had no structuralType and placed everything
  # NonStructural. NOT RUN.
  - given: >
      four points at grid intersections on Level 1 (at 0 mm, z 0), a loaded
      Structural Columns type, structuralType "column"
    expect: >
      four columns, EVERY ONE READING AS STRUCTURAL in the structural column
      schedule (Structural Usage), standing on Level 1
  - given: the same points with a Structural Foundations type and structuralType "footing"
    expect: footings, reading as footings in the schedule
  - given: >
      Level 2 above Level 1, two points z 0 on Level 1, a column type,
      structuralType "column", topLevelName "Level 2", topOffset "-150"
    expect: >
      two columns reading Top Level "Level 2" and Top Offset -150 in
      Properties, `tops` reading the same elevation asked and read
  - given: the same with topLevelName and topOffset left out
    expect: two columns, and a finding that every top was left as Revit placed it
  - given: a Structural Columns type with structuralType LEFT OUT
    expect: >
      REFUSED, asking column or non-structural - nothing placed. Version 3
      placed it non-structurally without a word
  - given: a column type at z 3000 on Level 1 (at 0)
    expect: >
      the column's base 3000 mm above Level 1 - Base Offset 3000 - or the
      layout refused naming Base Offset, nothing kept. NEEDS REAL REVIT: which
      of the two Revit's call gives
  - given: >
      a point-based family with NO SOLID of its own at two points,
      structuralType "non-structural"
    expect: >
      the whole layout undone, naming both points, the Generic Models count
      the same as before. PLACE_STRUCTURAL_FAMILY removed both and said
      failed 2; the merge kept the safer rule

negative:
  - given: an empty point list
    expect: >
      `placed` EMPTY and failed 0, reported as nothing to do rather than as a
      successful placement of nothing

  - given: points outside the level's extents, or where the family has no host
    expect: >
      RECORD WHICH HAPPENS, because it decides an open question. If Revit
      returns null, the point is counted in `failed` and the rest are placed.
      If it THROWS, the exception propagates and the operation's
      TransactionGroup rolls the whole layout back - which is Golden Rule 16
      being obeyed, and may or may not be what a modeller wants from a layout.
      Ask before making it partial: hiding the exception here would leave 37
      placed, 3 missing and no transaction aware anything went wrong

  - given: a point list containing a null
    expect: counted in failed, everything else placed

  # VERSION 2 - the family 5b-334 was found with.
  - given: >
      M_Supply Diffuser - Circular - Round Neck - Ceiling Mounted, work plane-
      based and carrying NO Offset from Host on a level's plane, asked at
      3000 mm above Level 1
    expect: >
      the layout refused and nothing kept: "carries no Offset from Host on a
      level's plane, so it cannot stand 3000 mm above 'Level 1'", naming Place
      on Face, a hosted version of the family, or the level's own height as
      the ways out. Version 1 put these at 0 mm with no host and said placed 3.
      RAN: exactly that

  - given: the same family at z 4000 on Level 2 - the level's own height
    expect: >
      placed 1 on Level 2's own plane - Host 'Level 2', Schedule Level
      'Level 2' - and read back on that level by FILTER_ELEMENTS_BY_CATEGORY's
      rule. RAN: placed and read back as said; the filter itself was run on the
      hosted diffusers, not on this one

  # VERSION 3 - the refusal is unchanged.
  - given: >
      M_Supply Diffuser - Circular - Round Neck - Ceiling Mounted asked at
      3000 mm above Level 1, run by version 2 and version 3 side by side
    expect: >
      both refuse with the same words and keep nothing - reading the height
      where the family's own level stands does not let a family that cannot
      be lifted through. RAN: the same, twice (Revit 2020, rolled back)

  # VERSION 4 - each refused BEFORE anything is placed.
  - given: a Structural Columns type with structuralType "beam" (row 128)
    expect: nothing placed, a finding naming it a Structural Columns family and saying to ask for it as a column
  - given: a Structural Framing type, structuralType "beam", three points (5b-1201)
    expect: >
      nothing placed, the Structural Framing count unchanged, the finding
      naming PLACE_LINE_BASED_FAMILY and its `curves` form
  - given: the same Structural Framing type with structuralType "column"
    expect: refused the same way - a framing family never goes in at a point
  - given: a family of no structural category asked as "brace"
    expect: refused, "A brace is placed along a line between its two ends"
  - given: structuralType "sprinkler"
    expect: refused by name with the list of what Revit knows - never a fall back to NonStructural
  - given: topLevelName "Level 1" - the base level itself
    expect: refused, "is not above the base level"
  - given: topLevelName "Level 9", a name no level carries
    expect: refused, "No level is named 'Level 9' exactly" - never the nearest
  - given: structuralType "footing" with topLevelName "Level 2"
    expect: refused - a top level is set only on columns
  - given: topOffset "300" with topLevelName left out
    expect: refused - which level the offset is measured from is not guessed
  - given: >
      a column type whose family has no settable Top Level, with a top asked
    expect: >
      the whole layout undone, naming the column. PLACE_STRUCTURAL_FAMILY
      removed that one and kept the rest

second_route:
  - a schedule of that family, counted against the number asked for
  - one Ctrl+Z removes the whole layout in a single step (Golden Rule 16)
  - in a section through a placed cut-out, its centre on the height asked, and Elevation from Level in Properties the same number (version 3)

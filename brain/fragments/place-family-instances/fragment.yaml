id: FRG-ELE-004
semantic-identity: "place instances of one family type at these points"
kind: action
domain: revit.elements
capability: PLACE_FAMILY_INSTANCES
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Places one family type at a list of points on a level, and reports every
  point it could not place at. It is the last step of every layout job - air
  terminals, sprinkler heads, detectors - after something else has worked out
  WHERE they go.

  It activates the symbol first, which is the step that makes this fragment
  worth having: an unactivated type places nothing and says nothing.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16), so
  twenty-four sprinklers are one undo entry rather than twenty-four.

contract:
  needs:
    - name: doc
      type: Document
    - name: symbol
      type: FamilySymbol
      source: request
    - name: points
      type: IList<XYZ>
      source: request
    - name: level
      type: Level
      source: request
  provides:
    - name: placed
      role: result
      type: IList<ElementId>
    - name: failed
      # Points nothing could be placed at. Never an instance it placed (D-52).
      role: accounting
      type: int

proof:
  date: '2026-09-13'
  by: Ajmal PS
  model: test projject (3,530 elements), Revit 2024, session 40932
  positive_case: run as it would normally be run - run inside a transaction, and Revit reported
    the transaction group ROLLED BACK afterwards. returned failed 0, placed 5 item(s) [926491,
    926492, 926493, ...]. inputs came symbol as given; points as given (5); level as given.
    on test projject
  negative_case: "CANNOT COME BACK EMPTY, so proved by TRACKING instead (D-53). place-family-instances\
    \ describes whatever it is given, so no arrangement makes its answer empty. What D-30's\
    \ negative case exists to catch - a fragment that succeeds while doing nothing, or answers\
    \ about a set it was not given - is caught here by the answer following the input exactly\
    \ across 4 different inputs:\n\n      1 point -> placed 1\n      2 points -> placed 2\n\
    \      3 points -> placed 3\n      5 points -> placed 5\n\n    Different inputs, exact\
    \ matches every time. A fragment falling back to the active view, the whole model, or\
    \ a previous run could not do that."
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: 89b1fb020ba75d9a

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. The `NewFamilyInstance(XYZ, FamilySymbol,
  Level, StructuralType)` overload and `FamilySymbol.Activate()` are unchanged
  2020 to 2027. Points arrive in Revit's internal feet - this fragment does no
  unit arithmetic at all, which is what keeps it clear of the 2021 units move.

# TRAP - OBSERVED ELSEWHERE, NOT YET PROVEN HERE. Added 2026-09-23.
#
# Another tool, on a real model and mostly on Revit 2020, placed 18 units
# through the API and all 18 landed at level 0: the family's DEFAULT
# ELEVATION - the height Revit uses when a person places the same family by
# hand - was ignored. This fragment places at the points it is given, on the
# level it is given, and never reads that parameter. So a list of plan points
# with no height can put ceiling-mounted units on the floor, and `placed`
# still counts every one of them.
#
# The same shape was MEASURED HERE on 2026-09-22 with a door: placed, counted,
# and unhosted (FRAGMENT-ISSUES, "A drawing set and a house plan", item 1).
# A count of what was placed is not a check of where it went.
#
# Not reproduced here for the elevation. A NOTE ONLY - the fragment is PROVEN.
# The height has to arrive in the points, and it is asked for, never taken
# from a default (D-33); the skills that place terminals and sprinklers are to
# carry this as a precondition. After a placement, read the elevation back
# rather than trusting `placed`. NEEDS-CHECKING AD4.

# ROUTING - repeated in LOAD_FAMILY and CHANGE_ELEMENT_TYPE.
#
#   "place a diffuser"           -> here
#   "put a damper here"          -> here
#   "load a family"              -> LOAD_FAMILY. The family has to be IN the
#                                   project before anything can be placed from
#                                   it, and this fragment does not load one
#   "change these to the 300"    -> CHANGE_ELEMENT_TYPE - swaps the type on
#                                   elements that already exist

# SENTENCES ADDED 2026-09-01 BECAUSE THE ROUTING TABLE ABOVE ALREADY CLAIMED
# THEM. A routing table is a COMMENT and comments are not indexed - the search
# reads semantic-identity, the utterances, the capability, the domain and the
# purpose, and nothing else. So a table saying "-> here" recorded a decision
# that retrieval could not act on, and these resolved elsewhere.
#   "put a damper here"                  -> PLACE_ACCESSORY_ON_RUN when it
#                                           goes INTO a duct or pipe: the run
#                                           has to be broken and rejoined, and
#                                           placing one here leaves it loose

utterances:
  - place the air terminals
  - put the sprinklers in
  - add the diffusers
  - place them on the grid
  - drop a detector at each point
  - insert the family at these locations
  - place a diffuser
  - put a damper here

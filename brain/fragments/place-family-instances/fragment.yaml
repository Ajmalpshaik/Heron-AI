id: FRG-ELE-004
semantic-identity: "place instances of one family type at these points"
kind: action
domain: revit.elements
capability: PLACE_FAMILY_INSTANCES
# VERSION 2 (2026-10-06, FRAGMENT-ISSUES 5b-334): a work plane-based family
# goes on the level's own plane at the height asked, or is refused when it
# cannot be lifted off it; every placement is read back. Version 1's proof
# no longer described the code; version 2's tracking run in Project2 was signed
# by Ajmal PS on 2026-10-06.
#
# VERSION 3 (2026-10-17, FRAGMENT-ISSUES 5b-590): a family's height is read
# where its own level stands - what Elevation from Level and Offset from Host
# measure to - and no longer at its insertion point. See "VERSION 3" below.
# Version 3's tracking run in Project1, Revit 2020, was signed by Ajmal PS on
# 2026-10-17 and replaced version 2's proof.
version: 3
source: OFFICIAL
risk: MODIFY

purpose: >
  Places one family type at a list of points on a level, and reports every
  point it could not place at. It is the last step of every layout job - air
  terminals, sprinkler heads, detectors - after something else has worked out
  WHERE they go.

  It activates the symbol first, which is the step that makes this fragment
  worth having: an unactivated type places nothing and says nothing.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16), so
  twenty-four sprinklers are one undo entry rather than twenty-four.

# VERSION 2, AND WHY IT IS WRITTEN HERE AND NOT IN THE PURPOSE ABOVE.
#
# A POINT'S Z IS ITS HEIGHT IN THE MODEL, in millimetres, like every point
# Heron is handed - "2000,2000,6700" on a level at 4000 mm stands 2700 mm above
# it. Revit's own call reads a level-based family's Z as its height above the
# level and counts the level twice (a fan coil unit asked at 6700 there came
# in at 10700, measured 2026-10-06); version 2 puts it right and reads it back.
# This is the contract the sprinkler layout (docs/47) sends: "the heads'
# elevation in the model's coordinates".
#
# EACH KIND GOES WHERE REVIT WOULD PUT IT BY HAND, AND IS READ BACK
# (FRAGMENT-ISSUES 5b-334). A work plane-based family goes on the level's own
# plane - Host the level, Schedule Level the level - with its height as its
# Offset from Host. Version 1 left three ceiling diffusers asked at 3000 mm on
# no level, at 0 mm, and said `placed 3`. One that carries no Offset from Host
# there - M_Supply Diffuser - Circular - Round Neck - Ceiling Mounted, made for
# a ceiling's face - cannot be lifted, so asked above the level's own height
# the layout is refused and nothing is kept. A level-based family keeps its Level and Elevation from
# Level. Each one is read back after the rebuild - where it stands, and its
# level by FILTER_ELEMENTS_BY_CATEGORY's rule - and one that does not read back
# where it was asked rolls the whole layout back. `readBack` says how each kind
# ended up, in the Properties palette's names.
#
# VERSION 3 - WHERE A FAMILY STANDS IS WHERE ITS OWN LEVEL STANDS, NOT ITS
# INSERTION POINT (FRAGMENT-ISSUES 5b-590). On 2026-10-15, on a real project
# in Revit 2020, two cut-outs asked 2152 mm above 'PLAN AT EL. +106.832' were
# refused - "Revit put ... 2014.5 mm above ... where it was asked 2152 mm
# above" - and nothing was kept, with each one's centre, its Elevation from
# Level, exactly where it was wanted. TRG_GEN_CutOut_Rectangular_HVAC, a
# level-based Generic Model, ticks "Defines Origin" on the reference plane at
# the BOTTOM of its opening, so its insertion point (LocationPoint) stands half
# the opening's height below its own level, and moves with Object Height.
# Version 2 compared the insertion point. Version 3 compares where the
# instance's transform puts the family's own level - the height Elevation from
# Level and Offset from Host hold, and the one Revit's own call uses when it
# is given no level. Plan is still read off the insertion point, and
# `readBack` adds "its insertion point N mm below that" only where the two
# heights differ.
#
# MEASURED 2026-10-17, Revit 2020, scratch Project1, every run rolled back:
# the cut-out with Elevation from Level 2152 had its centre at 2152 and its
# insertion point at 2002, 1827 and 1627 for Object Height 250, 600 and 1000.
# Version 2 and version 3 run side by side on the same placements: version 2
# refused the cut-out ("2002 mm above 'Level 2' ... asked 2152", the shape
# of the real refusal) and refused it even at the level's own height ("-300
# mm"); version 3 placed both. On the fan coil unit at 2700 on Level 1 and
# 6700 on Level 2, the hosted diffuser three times at 3000 and once at 6700,
# the ceiling-mounted diffuser refused at 3000 and placed at its level's own
# height, and an empty list, the two answered word for word the same. Each of
# those families' insertion point IS its own level, so nothing reads
# differently for them.
#
# THE TYPE'S "Default Elevation" PLAYS NO PART HERE: the cut-out's is 2500
# and Revit's call wrote Elevation from Level from the point, as it does for
# every level-based family (measured the same day).

# THE PURPOSE IS VERSION 1'S, WORD FOR WORD, ON PURPOSE - and every sentence of
# it is still true. Measured 2026-10-06 on private stores, these two paragraphs
# written into the purpose sent "what level is this diffuser on" here on both
# search backends, and "which level are these terminals on" here on the
# spelling one - questions answered by a change (D-86) - and "place sprinklers
# at these points" to COUNT_ELEMENTS. Nobody calling this reads the purpose:
# heron_resolve prints only the values to type, and the reply's readBack says
# "standing 3000 mm above 'Level 1'" by itself.

contract:
  needs:
    - name: doc
      type: Document
    - name: symbol
      type: FamilySymbol
      source: request
    - name: points
      type: IList<XYZ>
      source: request
    - name: level
      type: Level
      source: request
  provides:
    - name: placed
      role: result
      type: IList<ElementId>
    - name: failed
      # Points nothing could be placed at. Never an instance it placed (D-52).
      role: accounting
      type: int
    - name: readBack
      # VERSION 2. How each kind ended up, read off Revit after the rebuild and
      # grouped - "3 x work plane-based, on 'Level 1''s own plane, standing
      # 3000 mm above it - Host 'Level 1', Level 'Level 1', Schedule Level
      # 'Level 1', Offset from Host 3000 mm". VERSION 3 adds ", its insertion
      # point 150 mm below that" where a family's insertion point is not its
      # own level. A STRING, because a reply cuts a
      # list to three items. Accounting: it describes what `placed` counts.
      role: accounting
      type: string


compatibility-note: >
  `UnitUtils.GetTypeCatalogStringForSpec` and `GetTypeCatalogStringForUnit`
  with `Units.GetFormatOptions(ForgeTypeId)` from 2021, and
  `UnitUtils.GetTypeCatalogString(UnitType)` and `(DisplayUnitType)` with
  `FormatOptions.DisplayUnits` in 2020 and 2021 - the RevitAPI reference
  assemblies and XML remarks, read 2026-10-01 - are picked by signature, so
  2020 takes the older path. Revit has no call that writes or reads a type
  catalog; how it reads Yes/No and integer cells, quoted cells and the file's
  encoding are NEEDS-CHECKING BV10.


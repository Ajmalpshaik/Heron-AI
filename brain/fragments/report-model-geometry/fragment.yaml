semantic-identity: "the model's 3D geometry as triangles in metres, for drawing it in the Companion - the active 3D view or the whole model"
kind: action
domain: revit.geometry
capability: REPORT_MODEL_GEOMETRY
# Version 2 (2026-11-01, the owner's answer "Yes, stop at ~40 s"): it watches
# its own time. An optional `timeLimitSeconds` - 40 left out, 5 to 55 - stops
# the reading as the triangle budget does, and geometryJson gains `stopped`:
# "triangles", "time" or null. Still DRAFT and never proved, so no proof went
# stale. Left out, the answer is version 1's plus that key and a "Read in"
# line in findings, so "format" stays 1.
version: 2
source: OFFICIAL
risk: READ

# WHY IT EXISTS - a comment, not `purpose`, because `purpose` is searched.
# Asked for by the owner, Ajmal PS, on 2026-11-01: a 3D view of the model in
# the Heron Companion's Model Dashboard (docs/40 s21.10-21.12; the plan,
# docs/work-notes/plans/companion-model-dashboard-2026-11-01.md, phase 6),
# drawn by Heron's own WebGL renderer from what brain/heron_model_view.py
# makes of this fragment's geometryJson. Nothing in the library handed back
# geometry a renderer can draw (heron_retrieve for "model geometry for the
# dashboard", "show the model in 3D" and "3D view of the model in the
# companion", and the Matcher, that day):
#
#   REPORT_ELEMENT_GEOMETRY      the shape of SELECTED elements in numbers -
#                                faces, edges, areas, volume, in millimetres.
#                                The walk through GeometryInstance and the
#                                skipping of empty solids are its, re-used
#   REPORT_GEOMETRY_COMPLEXITY   triangles COUNTED per family type, at three
#                                detail levels, to rank what is heavy.
#                                Face.Triangulate() is its, re-used, so a
#                                triangle here is the triangle it counts
#   REPORT_BOUNDING_BOX          the box only
#
# A NEW READ, NOT A WIDENING OF ANY OF THEM. Each answers about a selection
# with a list a next step can use, and two are PROVEN; this answers about a
# scope - a view or the model - with a scene for a panel. Widening one to
# carry triangles would change a proven contract for a job it was not proved
# on, and make its proof stale.
#
# THE ELEMENTS ARE REPORT_MODEL_DASHBOARD's PLACED MODEL ELEMENTS - not a
# type, a MODEL category, not view-specific, with an extent, not a Level -
# less five kinds this leaves out on purpose, each counted:
#   * a Revit link placement - another model; named in notRead with how many
#   * a CAD import or link - named in notRead with how many
#   * rooms, spaces and areas - volumes Revit does not draw in 3D; named in
#     notRead with how many
#   * a model group and an assembly - their members are elements of their
#     own and are drawn as themselves, so the group is not drawn twice
#
# THE SCOPE. Left out, wholeModel is false (HeronBindingNote.AbsentValue):
# with a 3D view active, only what that view can show is read -
# FilteredElementCollector(doc, view) and Options.View, so its hidden
# categories, hidden elements, filters, phase and design options are the
# view's - and anything wholly outside its section box is left out by this
# fragment as well, because Revit's own collector may pass it (its API notes
# say so of a crop). The view's OWN detail level is used: Revit refuses an
# Options with both View and DetailLevel set (RevitAPI.xml, both members).
# With no 3D view active, or wholeModel true, the whole model is read at
# Coarse; the first case says so in notRead.
#
# A PIPE OR DUCT AT COARSE IS A LINE, SO IT IS READ AGAIN AT FINE. Revit draws
# a pipe as one line at Coarse and Medium, and a duct at Coarse, and the
# geometry handed back at that level is expected to be that line - nothing to
# triangulate (not measured here; the NEEDS-CHECKING group's positive row
# shows it either way). An element whose geometry at the first detail level
# is only lines is read once more at Fine and drawn as its solid; findings
# counts them. An element with no lines and no surfaces at the first level is
# not read again - it is simply not shown at that level.
#
# TWO LIMITS STOP THE READING, AND BOTH THE SAME WAY. Elements are read
# largest first, by the diagonal of their extent, so a cut answer still shows
# the building's big pieces. The first element that would carry the total past
# maxTriangles is left out, and every element after it is left out WITHOUT
# being read - leftOut counts them, capped says so, and `stopped` is
# "triangles".
#
# THE CLOCK (version 2). The add-in stops a fragment at
# revit.operationTimeoutSeconds and a stopped read hands back NOTHING, so this
# stops itself first: once timeLimitSeconds has passed since it began, the
# element being read and every one after it are left out as the budget leaves
# them, the JSON is written with what was drawn, `stopped` is "time" and
# capped says "time: stopped at N s; ...". The clock is looked at before each
# element and after it - an element whose read carried the time past the
# limit is left out, never counted as drawn or empty.
#
# ENVIRONMENT.TICKCOUNT, NOT STOPWATCH. A fragment is compiled against
# mscorlib, System.Core, the add-in and the Revit API only
# (HeronFragmentReferences - the script options REPLACE Roslyn's defaults).
# On the .NET Framework Revits, 2020 to 2024, Stopwatch is in System.dll and
# not mscorlib (read off the 4.8 reference assemblies, 2026-11-01). TickCount
# is in mscorlib there and in System.Private.CoreLib on 2025 to 2027 - steady
# milliseconds since the PC started, read as an unchecked difference so its
# wrap cannot matter. No fragment timed itself before this one; three take
# DateTime.Now for a timestamp, which a clock change would move.
#
# WHAT THE CLOCK CANNOT CUT SHORT: the pass that reads every element's extent
# to sort them, and writing the JSON. Both count in the time. With the default
# 60-second timeout the add-in's own stop comes at 50 s (a sixth kept for the
# rollback - HeronRunClock.BudgetFor), so the default 40 leaves about ten
# seconds to write the answer. A limit above about 45 is for a raised timeout:
# the fragment cannot read the setting, and 55 is the most it accepts.
#
# REFUSED BEFORE ANYTHING IS READ, as SELECT_BY_PARAMETER_VALUE refuses a mode
# it does not know: a category name that is not a BuiltInCategory this
# release has (named, with how to spell one), maxTriangles above 500000 or
# below 1, and timeLimitSeconds below 5 or above 55 (the limits named). A model category asked for that the scope
# holds none of is not refused: findings says so.
#
# ONE STRING, BECAUSE A LIST CROSSES AS ITS FIRST THREE ITEMS (FRAGMENT-ISSUES
# 5b-195), as REPORT_MODEL_DASHBOARD's dashboardJson.
purpose: >
  Reads the model's 3D geometry and hands it back as triangles in metres, for
  the Heron Companion to draw: what the active 3D view shows - its section
  box, hidden categories and hidden elements honoured - or the whole model.
  Each element is its own entry with its category, so the drawing can be
  coloured and picked by category. A triangle budget keeps the answer small
  and a time limit keeps it inside Revit's wait; the largest elements are
  drawn first and what either limit left out is counted.

  **It changes nothing.** Linked models, CAD files, rooms and spaces are not
  drawn, and the answer says how many were left out and why.

# THE SHAPE OF geometryJson, FORMAT 1 - read by brain/heron_model_view.py,
# which is the other half of this contract. Element ids are digit strings.
#
#   format        1
#   scope         "active 3D view '<name>'" or "whole model" - as the modeller
#                 reads it
#   units         "m"
#   offset        [x, y, z] in metres, to the millimetre: the centre of the
#                 box round every vertex drawn, already SUBTRACTED from every
#                 vertex so the numbers stay small. [0, 0, 0] when nothing is
#                 drawn. Add it back for project coordinates (internal origin)
#   categories    [name] - each category with an element drawn, as Revit
#                 shows its name (localised), sorted by name
#   elements      [{id, c, v, t}] - one per element drawn. id: the element id,
#                 digits. c: its index in categories. v: x,y,z, x,y,z, ... in
#                 metres after offset, to 0.001 - each point once per element
#                 (shared at the millimetre). t: i,j,k, ... indexes into v's
#                 POINTS (point n is v[3n..3n+2]); a triangle collapsed to a
#                 line at the millimetre is dropped. [] when nothing is drawn
#                 - never null
#   triangles     the sum of t's lengths / 3 - the `triangles` result too
#   elementsRead  the model elements in scope. Each is drawn, or counted in
#                 noGeometry, or counted in leftOut:
#                 len(elements) + noGeometry + leftOut = elementsRead
#   noGeometry    looked at, nothing to draw - no surface at either detail
#                 level, or its geometry would not read (then also a
#                 "geometry:" line in notRead)
#   leftOut       not drawn because a limit stopped the read - the triangle
#                 budget (the first that would not fit and every one after
#                 it, not read) or the time limit (the element being read
#                 when it passed and every one after it)
#   stopped       VERSION 2. "triangles" or "time" - which limit stopped the
#                 read - or null when everything in scope was read. leftOut
#                 is above 0 exactly when this is not null
#   notRead       ["<part>: <why>"] - what was not read and why: "active
#                 view:", "links:", "CAD:", "rooms and spaces:", "section
#                 box:", "categories:", "geometry:", "faces:". [] when nothing
#   capped        ["triangles: the budget of N was reached; M element(s) left
#                 out - the largest were drawn first"], or, from version 2,
#                 ["time: stopped at N s; M element(s) left out - the largest
#                 were drawn first"] (N the limit), or []
contract:
  needs:
    - name: doc
      type: Document
    # BuiltInCategory names, comma separated - "OST_Walls, OST_DuctCurves".
    # Capitals are forgiven. A name this release does not have REFUSES the
    # whole call, naming it - nothing is read. Left out it is "all" (`absent:
    # all`, HeronBindingNote.DeclaredAbsent): every model category. An empty
    # value is the same (EmptyMeansAbsent).
    - name: categories
      type: string
      source: request
      optional: true
      absent: all
    # The most triangles to hand back. Left out it is 150000 (`absent:
    # 150000`); above 500000, or below 1, REFUSES the call naming the limit.
    - name: maxTriangles
      type: int
      source: request
      optional: true
      absent: 150000
    # true reads the whole model at Coarse whatever view is active. Left out
    # it is false (HeronBindingNote.AbsentValue): the active view when it is a
    # 3D view, else the whole model with a notRead line saying so.
    - name: wholeModel
      type: bool
      source: request
      optional: true
    # VERSION 2. How long the read may take, in seconds, before it stops and
    # hands back what it has drawn. Left out it is 40 (`absent: 40`); below 5
    # or above 55 REFUSES the call naming the limits - the add-in's own stop
    # (60 s by default) must come after it.
    - name: timeLimitSeconds
      type: int
      source: request
      optional: true
      absent: 40
  provides:
    # The scene, format 1. ACCOUNTING, not a result, for the reason
    # REPORT_MODEL_DASHBOARD's dashboardJson is: it is written whatever was
    # found - an empty section box still gets the format, the scope and
    # elements [] - so as a result it could never come back empty and the
    # negative case could never be judged (heron_validate.looks_empty).
    # `triangles` is the evidence.
    - name: geometryJson
      role: accounting
      type: string
    # How many triangles were handed back - the JSON's triangles. 0 when the
    # scope holds nothing to draw: that is the negative case.
    - name: triangles
      role: result
      type: int
    # A line for the scope and its counts, how long the read took against its
    # limit, then what was read again at Fine, left outside the section box,
    # not read and cut. A string, not a list: a
    # list crosses as its first three.
    - name: findings
      role: accounting
      type: string


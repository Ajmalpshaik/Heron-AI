compatibility-note: >
  One implementation for every release. Read off the shipped assemblies of
  all eight releases on 2026-11-01 (tools/api-surface --members), each with
  one signature 2020 to 2027: Document.ActiveView; View3D.IsSectionBoxActive,
  GetSectionBox and IsPerspective; View.IsTemplate; BoundingBoxXYZ.Min, Max
  and Transform; Transform.OfPoint; FilteredElementCollector(Document) and
  (Document, ElementId view), WhereElementIsNotElementType, WherePasses and
  OfClass; ElementMulticategoryFilter(ICollection<BuiltInCategory>);
  Category.GetCategory(Document, BuiltInCategory), Id, Name and
  CategoryType; Element.get_Geometry, get_BoundingBox, ViewSpecific and
  Category; Options.View, DetailLevel and ComputeReferences (and Revit's
  note that View and DetailLevel are never both set); GeometryInstance.
  GetInstanceGeometry(); Solid.Faces; FaceArray.Size; Face.Triangulate();
  Mesh.Vertices, NumTriangles and get_Triangle; MeshTriangle.get_Index (a
  uint); PolyLine; and the classes RevitLinkInstance, ImportInstance,
  SpatialElement, Group and AssemblyInstance. No ElementId is read as a
  number - each is written with ToString() - and no units API is touched:
  feet become metres by * 0.3048, exact by definition, at the edge (D-20),
  so the answer is the same on every release. Version 2 adds no Revit
  member: its clock is Environment.TickCount, in mscorlib on the .NET
  Framework releases and System.Private.CoreLib on the .NET ones, which every
  fragment script references.

# WHAT IT COSTS, AND WHAT BOUNDS IT - read 2026-11-01, NOT YET MEASURED.
#
# TIME IS THE LIMIT. The add-in stops a fragment at
# revit.operationTimeoutSeconds (60 s by default, less a sixth for the
# rollback - HeronRunClock), and a stopped read hands back nothing - which is
# why version 2 stops itself at timeLimitSeconds (40) first. The work
# is one geometry read per element in scope (two for a pipe or duct at
# Coarse), one triangulation per face, and one pass to write the JSON. The
# budget stops the reading once it is reached, so it bounds the triangulation;
# the scope bounds how many elements are looked at, and every element in
# scope has its extent read to sort them. The first collector on a view may
# also make Revit rebuild that view's graphics (its API notes), once.
#
# SO THE ACTIVE 3D VIEW IS THE WAY TO KEEP IT SMALL: a section box round the
# part of the building wanted, or categories hidden, reads only that. The
# whole model reads every element - several hundred thousand on a large
# project - and is the case to time first (the NEEDS-CHECKING group has the
# row); findings says how long the read took. If it stops at the time limit,
# narrow by categories or by a section box; if it is the add-in that stops
# it, the extent pass or the JSON took the rest - raise the timeout.
#
# THE ANSWER'S SIZE. Every vertex is three numbers of up to a dozen
# characters and every triangle three indexes: about 30 to 40 bytes a
# triangle, so the default budget is a string of roughly 5 MB and 500000
# roughly 17 MB - estimated, not measured. A provided string has no size
# limit on the way back (RevitFragment.Describe, BridgeServer, the bridge
# client - REPORT_MODEL_DASHBOARD's notes). ASKED THROUGH revit_read, ALL OF
# IT IS PRINTED INTO THE CHAT: this is for the Companion's model view, which
# keeps it for the page, and a chat should ask for a small budget if at all.

# WHAT IT CANNOT SEE.
#   * Linked models - a link is another model, and its walls, floors and
#     rooms are its own. On a services model whose building is linked, only
#     the services are drawn; notRead says how many links were in scope.
#   * The whole model draws every phase and every design option's elements -
#     demolished and proposed alike. The active 3D view draws what it shows.
#   * An element crossing the section box is drawn WHOLE: its geometry is
#     read, not cut. Whether Revit cuts geometry read through Options.View at
#     the box is not known here (the NEEDS-CHECKING group asks).
#   * Temporary hide and isolate: whether the view collector honours them is
#     not known here either (the same group asks).
#   * Colour, material and transparency - categories only.
#   * A pipe or duct drawn as a line at the view's detail is drawn as its
#     solid, so the Companion shows tubes where a Coarse view shows lines.

# ROUTING - the Companion's own words, and the readers of one element's shape.
# A sentence about ONE element's shape goes to that element's reader, which
# answers in numbers; this card hands back a scene to draw.
#
#   "show the model in 3D"                 -> here. CREATE_3D_VIEW answered it
#                                             until 2026-11-01 and makes a NEW
#                                             Revit view, a MODIFY; the owner
#                                             asked for these words for the
#                                             Companion's model view. That
#                                             fragment carries this row
#   "make a new 3d view"                   -> CREATE_3D_VIEW - a Revit view
#   "3D view of the model in the companion" -> here
#   "model geometry for the dashboard"     -> here, by identity and on the
#                                             hybrid route; on the keyword
#                                             route alone REPORT_MODEL_DASHBOARD
#                                             ranks first (check-routing,
#                                             2026-11-01). That fragment
#                                             carries this row
#   "model dashboard"                      -> REPORT_MODEL_DASHBOARD - counts,
#                                             not geometry
#
# PARAPHRASES THIS CARD TOOK, measured with heron_retrieve.find against a
# store built without it and one with it, 2026-11-01. Each moved from a
# fragment that answered it worse, and none onto a write:
#   "view the model in 3d"      was CREATE_3D_VIEW (MODIFY) -> here
#   "show the building in 3d"   was REPORT_SPACE_ENVELOPE    -> here
#   "show the 3d view"          was OPEN_RENDER_DIALOG       -> here. In
#                               Revit words it may mean "open the {3D}
#                               view" - OPEN_VIEW's job, which reached it
#                               neither before nor after; a question for
#                               the owner, not settled here
#   "open the 3d view"          stays CREATE_3D_VIEW, as before
#   "what is this element's geometry"      -> MEASURE_ELEMENT_VOLUME
#   "list the edges of this beam"          -> MEASURE_ELEMENT_VOLUME
#   "how complex is this family"           -> REPORT_GEOMETRY_COMPLEXITY
#   "how much geometry does this family carry" -> REPORT_GEOMETRY_COMPLEXITY -
#                                             triangles counted per type, not
#                                             handed back
#   "what is the bounding box of this duct" -> REPORT_BOUNDING_BOX
#   "export the model to fbx"              -> EXPORT_VIEWS_TO_FBX - a file,
#                                             PUBLISH
utterances:
  - show the model in 3D
  - 3D view of the model in the companion
  - model geometry for the dashboard

positive:
  - given: a plan view and 6 elements in one room, marginMm 500
    expect: applied true, enclosed 6, and the drawing shows that room with about 500 mm of context around it

  # VERSION 2 - from SET_VIEW_CROP_TO_SHAPE. Each FAILS on version 1, which
  # took no loop.
  - given: VERSION 2. six detail lines drawn as an L round a wing, handed in as boundary
    expect: >
      the view cropping to the L, and the crop VISIBLE - CHECKED by looking at
      the view; Edit Crop shows the L Revit holds

  - given: VERSION 2. the same curves handed in out of drawing order
    expect: the same L - chained head to tail, not trusted in order

  - given: VERSION 2. a room's boundary curves from READ_ROOM_GEOMETRY
    expect: the crop following the room, worstGap effectively zero

negative:
  - given: VERSION 2. an L whose corner lines miss each other by half a millimetre
    expect: >
      the crop APPLIED and the bridged gap REPORTED in mm in `refused`. THE
      FIRST SHAPE CASE TO RUN - repairing silently is how a crop that follows
      a shape nobody drew reaches a sheet

  - given: VERSION 2. a boundary with one line left far from the rest
    expect: refused with the distance in mm, NOTHING written

  - given: VERSION 2. a loop taken from a plan and applied to a section
    expect: refused as rejected by Revit, the two remaining causes named

  - given: VERSION 2. a SHEET as the view, with a loop
    expect: >
      refused BEFORE the crop is switched on - forcing it on flips CanHaveShape
      true and SetCropShape then reports success while nothing changes

  - given: VERSION 2. two curves only
    expect: refused before any work - two curves cannot close a shape

  - given: VERSION 2. neither elements nor a loop
    expect: refused in words - nothing to crop to
  - given: a view whose crop was previously OFF
    expect: >
      the region is set AND the crop switched on. Setting without activating
      leaves the view looking identical, which reads as the call having done
      nothing

  - given: a batch where 2 elements are hidden or outside the view range
    expect: >
      those 2 are in noGeometry and the region is built from the rest. A null
      folded into the min/max stretches the crop to the project origin and
      encloses the whole drawing - which looks exactly like the request being
      ignored

  - given: this view already placed on an ISSUED sheet
    expect: >
      whatever falls outside the new crop is GONE from that sheet, and nobody
      reviewing it can tell it was ever there. This is the risk that separates
      a crop from an isolate, and it is why the two must not be confused

second_route:
  - Look at the sheet, not the view. The crop is what the drawing shows

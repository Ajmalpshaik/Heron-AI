compatibility-note: >
  One implementation for every release. `View.CropBox`, `View.CropBoxActive`,
  `View.CropBoxVisible` and `Element.get_BoundingBox(View)` are unchanged 2020
  to 2027. Millimetres to feet is arithmetic (D-20). Version 2 adds what
  SET_VIEW_CROP_TO_SHAPE was proved with: `View.GetCropRegionShapeManager`,
  `ViewCropRegionShapeManager.SetCropShape`, `CanHaveShape` and
  `IsCropRegionShapeValid`, `CurveLoop.Create`, `Curve.CreateReversed` and
  BuiltInParameter VIEWER_CROP_REGION and VIEWER_CROP_REGION_VISIBLE, present
  2020 through 2027.

# ROUTING - repeated in SET_VIEW_SECTION_BOX and ISOLATE_ELEMENTS.
#
#   "crop the view to this"        -> here
#   "just show me this bit"        -> ASK WHICH of the three. It is genuinely
#                                     ambiguous and they do different things
#   "section box around this"      -> SET_VIEW_SECTION_BOX
#   "show me only these"           -> ISOLATE_ELEMENTS
#
# ONLY THE CROP CHANGES WHAT PRINTS. Isolating is temporary by default and a
# section box is a 3D cut; a crop on a view that is on a sheet silently
# removes work from an issued drawing.

#   "crop the view to follow the room shape" -> here since version 2, with
#                                        boundary (was SET_VIEW_CROP_TO_SHAPE).
#                                        The crop BOX can only be a rectangle;
#                                        a stepped or L-shaped crop goes
#                                        through the shape manager
#   "make an L-shaped crop on this plan"     -> here, boundary
#   "cut the 3D down to this area"           -> SET_VIEW_SECTION_BOX
#   "set the scope box on these views" -> ASSIGN_SCOPE_BOX_TO_VIEW - a NAMED,
#                                        shared extent many views obey at once
#   "the tags are printing outside the crop" -> SET_CROP_BOX_SETTINGS - the
#                                        ANNOTATION crop is a separate flag,
#                                        and it is the usual cause. This one
#                                        SIZES a crop and does not touch it
utterances:
  - crop the view to this
  - crop the view around these
  - set the crop region
  - trim the view to this area
  - tighten the crop
  # MOVED 2026-11-01 from SET_VIEW_CROP_TO_SHAPE, merged into this card.
  - crop the view to follow the room shape
  - make an L-shaped crop on this plan
  - crop along the match line
  - give this view a shaped crop region
  - crop this view to the lines I drew

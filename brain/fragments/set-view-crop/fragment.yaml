id: FRG-VIEW-014
semantic-identity: "crop this view around these elements, or to a shaped loop"
kind: action
domain: revit.views
capability: SET_VIEW_CROP
# VERSION 2 (2026-11-01): SET_VIEW_CROP_TO_SHAPE was merged into this card on
# the owner's instruction ("make sure there is no duplicate tools"), and is
# DEPRECATED. A crop is a crop: the rectangle round elements, or - with
# `boundary`, a closed loop of curves - a SHAPED one, an L round a wing, a
# stepped match line, a room's outline. Its rules came with it: the curves
# chained head to tail and a gap within `joinToleranceMm` bridged and REPORTED
# (`worstGap`), a sheet refused before the crop is switched on, the crop
# switched on before Revit is asked whether it can be shaped, and its
# visibility on afterwards. `refused` says why, in words, on either road.
# `elements` and `marginMm` are optional now, for a shaped crop. The binder
# binds an optional curve list empty (HeronBindingNote.EmptyWhenAbsent,
# mirrored in heron_fragment.EMPTY_WHEN_ABSENT) - the case added for this card.
# The proof below is version 1's and no longer describes the code; DRAFT until
# version 2 is proved.
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Sets a view's crop region to enclose the given elements, with a margin, and
  switches the crop on.

  **A crop is not a section box and not an isolate, and all three are asked for
  with "just show me this part".**

  - **Crop** — trims what the drawing shows, in the view's own plane. This.
  - **Section box** — cuts the model in 3D. `SET_VIEW_SECTION_BOX`.
  - **Isolate** — hides other elements, whole view. `ISOLATE_ELEMENTS`.

  A crop changes what prints. That is its point and its risk: a view on a sheet
  cropped tighter loses whatever fell outside, and nobody reviewing the sheet
  can tell it was ever there.

  **Setting the crop without switching it on leaves the view looking identical**,
  which reads as the call having done nothing — so both happen here.

  **Or a shaped crop, from a closed loop** (version 2, from
  SET_VIEW_CROP_TO_SHAPE) - an L round a wing, a stepped boundary along a
  match line, the outline of a room. The crop box can only ever be a
  rectangle; a shape goes through the view's crop-region shape manager. Revit
  requires the loop to be closed, flat in the view's own plane and not
  crossing itself, and gives the same unhelpful error for all three: the
  curves are chained here, a small gap bridged and the worst gap REPORTED,
  and a gap past the tolerance refused in millimetres. One view only.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: view
      type: View
      source: request
    # The elements to crop round. Optional since version 2, for a shaped
    # crop; left out it binds an empty list (HeronBindingNote.EmptyWhenAbsent).
    - name: elements
      type: IList<Element>
      optional: true
    # Millimetres round the elements. Optional since version 2: left out it
    # is 0, the elements' own box. A shaped crop does not read it.
    - name: marginMm
      type: double
      source: request
      optional: true
      absent: 0
    # VERSION 2, from SET_VIEW_CROP_TO_SHAPE. A closed loop of curves in the
    # view's own plane - handed on from READ_ROOM_GEOMETRY, or typed as point
    # pairs - for a SHAPED crop. Optional: left out it binds an empty list
    # (HeronBindingNote.EmptyWhenAbsent), and the rectangle road runs.
    - name: boundary
      type: IList<Curve>
      optional: true
    # VERSION 2, from SET_VIEW_CROP_TO_SHAPE. The largest gap between curve
    # ends, in MILLIMETRES, that is bridged to close the loop. Left out it is
    # 1, the tolerance SET_VIEW_CROP_TO_SHAPE was proved with.
    - name: joinToleranceMm
      type: string
      source: request
      optional: true
      absent: 1
  provides:
    - name: applied
      role: result
      type: bool
    - name: enclosed
      role: result
      type: int
    - name: noGeometry
      # Elements with no geometry to crop around, so it could not be enclosed.
      # The evidence it looked, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: viewRefused
      # The view declined the change - a template owns the slot, or the view
      # cannot take it at all. The evidence it looked and said no, never a
      # change it made (D-52).
      role: accounting
      type: bool
    - name: worstGap
      # VERSION 2, from SET_VIEW_CROP_TO_SHAPE. The largest gap bridged to
      # close the loop, in internal FEET - REPORTED SO A SHAPE THAT WAS NEVER
      # REALLY CLOSED DOES NOT PASS AS ONE THAT WAS; `refused` says it in mm.
      role: result
      type: double
    - name: refused
      # VERSION 2. Why it declined, in the user's words, on either road - and
      # a repaired shape's bridged gap. The evidence it looked and said no,
      # never a thing it FOUND (D-52).
      role: accounting
      type: IList<string>


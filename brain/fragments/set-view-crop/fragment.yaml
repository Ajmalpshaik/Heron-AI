id: FRG-VIEW-014
semantic-identity: "crop this view around these elements"
kind: action
domain: revit.views
capability: SET_VIEW_CROP
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Sets a view's crop region to enclose the given elements, with a margin, and
  switches the crop on.

  **A crop is not a section box and not an isolate, and all three are asked for
  with "just show me this part".**

  - **Crop** — trims what the drawing shows, in the view's own plane. This.
  - **Section box** — cuts the model in 3D. `SET_VIEW_SECTION_BOX`.
  - **Isolate** — hides other elements, whole view. `ISOLATE_ELEMENTS`.

  A crop changes what prints. That is its point and its risk: a view on a sheet
  cropped tighter loses whatever fell outside, and nobody reviewing the sheet
  can tell it was ever there.

  **Setting the crop without switching it on leaves the view looking identical**,
  which reads as the call having done nothing — so both happen here.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: view
      type: View
      source: request
    - name: elements
      type: IList<Element>
    - name: marginMm
      type: double
      source: request
  provides:
    - name: applied
      role: result
      type: bool
    - name: enclosed
      role: result
      type: int
    - name: noGeometry
      # Elements with no geometry to crop around, so it could not be enclosed.
      # The evidence it looked, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: viewRefused
      # The view declined the change - a template owns the slot, or the view
      # cannot take it at all. The evidence it looked and said no, never a
      # change it made (D-52).
      role: accounting
      type: bool


semantic-identity: "set Is Reference, Defines Origin and Subcategory on the reference planes of the family being edited"
kind: action
domain: revit.families
capability: SET_FAMILY_PLANE_REFERENCE
# VERSION 2 (2026-11-17, FRAGMENT-ISSUES 5b-1849) - THE SUBCATEGORY ROW.
# The owner's standing rule, 2026-11-17: in every family the outline and centre
# planes stay on Reference Planes (green by default) and every other plane goes
# on a gray subcategory - "Secondary References", 128,128,128. No tool set a
# plane's Subcategory. `subcategories` now sets it per plane, and
# `otherPlanesSubcategory` puts every plane that is not an outline or centre
# plane on one subcategory; the subcategory is made, with its colour, by
# CREATE_LINE_STYLE version 3 with parentCategory "Reference Planes". `planes`
# became optional (an empty table) so a call may set only subcategories. The
# identity gained "Subcategory". Back to DRAFT: version 1 was PROVEN on
# 2026-10-03 (the proof block below, kept as the record of what it proved);
# its C# moved, so it is DRAFT until NEEDS-CHECKING Group OK is run (D-30).
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Sets IS REFERENCE and DEFINES ORIGIN on named reference planes in the family
  open in the Family Editor - the two rows of a plane's Properties that decide
  how the family behaves once placed: which of its planes a project can
  dimension and snap to, and which planes fix its insertion point, the point
  it is placed by.

  **WHAT EACH PLANE IS GIVEN** - Left, Right, Front, Back, Top, Bottom or one of
  the three centres, each held by one plane at a time; Strong or Weak
  Reference for any other plane a project should reach; Not a Reference for a
  plane only the build needs. Sides and centres go on planes that face their
  way - Left on a plane facing left or right, Top on a horizontal one.

  **ONE ALREADY HELD IS REFUSED**, naming the plane that holds it: what that
  plane becomes is said in the same call, never decided here.

  **"origin" MOVES THE ORIGIN** onto a plane, from the one facing the same way
  that had it, and both are reported. A project's units already placed take
  the new origin when the family is loaded into it again.

  **NONE OF REVIT'S NUMBERS IS ASSUMED.** Each value is written and read back
  in Revit's own words, and one whose words never come back fails the call.
  Every other plane is read before and after, and anything the call did not
  ask that moved is put back.

  **SUBCATEGORY** - which subcategory of Reference Planes a plane is drawn in,
  and so its colour - is set per plane, or for every plane that is not an
  outline or centre plane at once. The subcategory must already exist.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # Plane name = what it becomes, SEMICOLONS between - "Box Left=Left;
    # Box Right=Right; Insert=Strong Reference, origin". Short forms: strong,
    # weak, none. "origin" alone moves the origin and leaves Is Reference.
    # Version 2: optional - left out it is an empty table (";"), and then
    # subcategories or otherPlanesSubcategory must ask something.
    - name: planes
      type: IDictionary<string, string>
      source: request
      optional: true
      absent: ';'
    # VERSION 2. Plane name = the subcategory of Reference Planes it goes on,
    # SEMICOLONS between - "Insert=Secondary References; Box Left=Reference
    # Planes". "Reference Planes", or "none", is the category itself. The
    # subcategory must exist (CREATE_LINE_STYLE, parentCategory Reference
    # Planes). Left out (";", an empty table) no plane is named here.
    - name: subcategories
      type: IDictionary<string, string>
      source: request
      optional: true
      absent: ';'
    # VERSION 2. One subcategory of Reference Planes for EVERY plane that is
    # not an outline or centre plane - one named, or whose Is Reference reads,
    # Left, Right, Front, Back, Top, Bottom, Center (Left/Right) or Center
    # (Front/Back) - and is not named in subcategories. Outline and centre
    # planes are never moved by it. "none", or not said, moves none.
    - name: otherPlanesSubcategory
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: planeReport
      # Every plane that changed, before and after, on ONE line - a list is cut
      # to three entries before anyone reads it.
      role: result
      type: string
    - name: changed
      # Planes that read differently after the call, the plane that gave up
      # the origin among them.
      role: result
      type: int
    - name: alreadySet
      # Settings asked for and already so: looked at, nothing done (D-52).
      role: accounting
      type: int
    - name: onSubcategory
      # Version 2: planes whose Subcategory read differently after the call.
      role: result
      type: int
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing changed, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


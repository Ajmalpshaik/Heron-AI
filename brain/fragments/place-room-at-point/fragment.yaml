revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. Placing a room or a space at a point on
  a level is unchanged 2020 to 2027, and both are read back through the shared
  spatial base type - which is also why one fragment covers both.

# ROUTING - the same rows are in the fragments named here.
#
#   "put a room here"                    -> here
#   "add a space in that area"           -> here, with asSpace true
#   "place rooms everywhere"             -> PLACE_ROOMS, which fills every
#                                           enclosed region on a level in one
#                                           pass. Right for a finished floor
#                                           plate, wrong for one named spot
#   "which rooms are not enclosed"       -> SELECT_UNENCLOSED_ROOMS, which
#                                           sweeps the model for the state this
#                                           fragment reports for what it placed
#   "list the rooms and their areas"     -> REPORT_ROOM_SPACE_DATA
#   "how big is this room"               -> MEASURE_ROOM_DIMENSIONS

utterances:
  - put a room here
  - add a space at this point
  - place a room in that area
  - i need a space for the load calculation

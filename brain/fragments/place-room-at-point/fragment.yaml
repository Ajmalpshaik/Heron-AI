    \ 2\n      3 points -> created 3\n      5 points -> created 5\n\n    Different inputs,\
    \ exact matches every time. A fragment falling back to the active view, the whole model,\
    \ or a previous run could not do that."
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as

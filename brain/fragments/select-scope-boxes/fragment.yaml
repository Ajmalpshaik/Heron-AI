id: FRG-SEL-029
semantic-identity: "give me the scope boxes themselves as a set I can act on"
kind: filter
domain: revit.selection
capability: SELECT_SCOPE_BOXES
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Returns the Scope Boxes in the model as elements, narrowed by name - and,
  for one box, its corners.

  **EVERYTHING ELSE HERE TAKES A SCOPE BOX BY NAME, AND THAT IS THE GAP.**
  ASSIGN_SCOPE_BOX_TO_VIEW puts a named one onto views, and until version 2
  READ_SCOPE_BOX_EXTENT found one by name and handed back its corners. Neither
  could answer *"what scope boxes are there"*, and neither could hand a set to
  a rename, a report or a delete. A scope box is an ordinary element and nothing here could
  reach it as one. This is the same shape as the gap SELECT_VIEW_TEMPLATES
  filled, found the same way.

  **A SCOPE BOX CANNOT BE CREATED FROM CODE, WHICH MAKES REACHING THE EXISTING
  ONES MORE USEFUL, NOT LESS.** Revit exposes no create call on any release
  here - every box is drawn once by hand - so the ones in the model are all
  there will ever be, and renaming or auditing them is the only automation
  available. Resizing one is out too: the delete-and-recreate route needs the
  create call that does not exist.

  **IT IS FOUND BY CATEGORY, NOT BY CLASS.** A scope box has no dedicated API
  class - it is an ordinary element in the Volume of Interest category, which is
  why a class-based query finds nothing and why the earlier library reached it
  by category as well. A search for a Scope Box type is the most likely wrong
  turn here.

  **VERSION 2 ALSO SAYS HOW BIG ONE BOX IS, AND WHERE** (READ_SCOPE_BOX_EXTENT
  merged in): with one box matching, its two corners in millimetres - minMm
  and maxMm, the names SELECT_IN_REGION takes, so *"what is inside the podium
  scope box"* composes with nothing in between - and its id. Asked for an
  extent with two boxes matching, it refuses rather than picking one: they
  are usually different halves of a building.

  ASSUMES NOTHING ABOUT TRANSACTIONS - it opens none and needs none.

contract:
  needs:
    - name: doc
      type: Document
    - name: nameContains
      type: string
      source: request
    # VERSION 2, from READ_SCOPE_BOX_EXTENT. true is "how big is it, where is
    # it": two or more boxes matching are REFUSED - no corners, no id, no
    # elements - and named in findings. Absent binds false (row 5b-227): every
    # match is listed, and corners come only when one box matches.
    - name: extent
      type: bool
      source: request
      optional: true
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: matchedNames
      role: result
      type: IList<string>
    - name: scanned
      # How many were walked. THE NAME THAT EXPOSED THE DEAD HEURISTICS on
      # 2026-09-08: this fragment's negative case had every result at zero and
      # `scanned: 5`, and the judge read the 5 as a finding. Work done (D-52).
      role: accounting
      type: int
    - name: found
      role: result
      type: int
    # VERSION 2, from READ_SCOPE_BOX_EXTENT. One box's corners, in
    # MILLIMETRES - the unit and the names SELECT_IN_REGION takes at its own
    # edge. Null unless exactly one box matches and its extent reads.
    - name: minMm
      role: result
      type: XYZ
    - name: maxMm
      role: result
      type: XYZ
    - name: scopeBoxId
      # VERSION 2. The one box matched; InvalidElementId otherwise. The same
      # box as `elements` holds, never another (D-52).
      role: accounting
      type: ElementId
    - name: findings
      # VERSION 2. The one box's size, or why there is none: no box, no
      # match, two matching, no readable extent.
      role: accounting
      type: IList<string>


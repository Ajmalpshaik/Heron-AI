tests: tests/

compatibility-note: >
  One implementation for every release. `BuiltInCategory.OST_VolumeOfInterest`
  and `FilteredElementCollector.OfCategory` are unchanged 2020 to 2027, and no
  id is read as a number. Version 2 reads the box's extent from
  `Element.get_BoundingBox(null)`, as READ_SCOPE_BOX_EXTENT did (PROVEN on
  Revit 2024), unchanged 2020 to 2027.

# ROUTING - repeated in ASSIGN_SCOPE_BOX_TO_VIEW and SELECT_IN_REGION.
#
#   "what scope boxes are there"          -> here
#   "list the scope boxes"                -> here
#   "rename the scope boxes"              -> here, then EDIT_TEXT_VALUES field Name
#   "delete that scope box"               -> here, then DELETE_ELEMENTS - a
#                                            scope box is an ordinary element,
#                                            so no dedicated delete is needed
#   "how big is the podium scope box"     -> here, extent true, since
#                                            READ_SCOPE_BOX_EXTENT was merged in
#                                            (version 2) - one box's corners in
#                                            millimetres, which feed
#                                            SELECT_IN_REGION
#   "what is inside the podium scope box" -> here, extent true, then
#                                            SELECT_IN_REGION with the corners
#   "how big is this element"             -> REPORT_BOUNDING_BOX
#   "put the podium scope box on these
#    views"                               -> ASSIGN_SCOPE_BOX_TO_VIEW
#   "make a scope box"                    -> NOT POSSIBLE. Revit exposes no
#                                            create call on any release here;
#                                            the box is drawn by hand once
#   "resize that scope box"               -> NOT POSSIBLE either, and for the
#                                            same reason - delete and recreate
#                                            needs the create call

# VERSION 2 (2026-11-01) - READ_SCOPE_BOX_EXTENT WAS MERGED INTO THIS CARD on
# the owner's instruction ("make sure there is no duplicate tools"; "merge
# means ... all area need to be covered"), and is DEPRECATED. Both found scope
# boxes by name, by the Volume of Interest category. What that card had and
# this one lacked is here now: one box's corners as minMm and maxMm in
# millimetres, the names SELECT_IN_REGION takes; scopeBoxId; the size, or why
# there is none, in findings; no box, no match and no readable extent each
# said apart.
#
# THE SAFER RULE IN EACH CONFLICT IS KEPT. Corners are published only when
# exactly one box matches, so a list of several never hands on one box's
# extent as if it were all of them; asked for an extent, two matches are
# refused and the elements withheld too, as that card refused them.
#
# NOT CARRIED, AS OPPOSITE: refusing two matches when no extent is asked -
# listing every match is this card's answer, and nothing about one box is
# claimed for them.
#
# WHERE ITS OUTPUTS ARE NOW: minMm, maxMm, scopeBoxId, findings -> the same
# names; its `scopeBoxName` is this card's `nameContains`, with `extent`
# true. Its sentences moved here.

utterances:
  - give me the scope boxes
  - list the scope boxes in this model
  - what scope boxes are there
  - find the scope box by name
  - select the scope boxes
  - the scope boxes themselves not the views
  # MOVED 2026-11-01 from READ_SCOPE_BOX_EXTENT, merged into this card.
  - how big is that scope box
  - what is inside the scope box
  - the extent of the podium scope box
  - select everything in this scope box

revit: ["2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  2022 TO 2027, AND 2020 AND 2021 ARE LEFT OUT ON PURPOSE. `RevisionNumberingSequence`
  - `CreateNumericSequence`, `CreateAlphanumericSequence`,
  `GetAllRevisionNumberingSequences`, `SequenceName`, `NumberType`,
  `Get/SetNumericRevisionSettings` and `Get/SetAlphanumericRevisionSettings` -
  and `NumericRevisionSettings.MinimumDigits` exist from 2022, read with
  tools/api-surface --members on every release's RevitAPI.dll. Revit 2020 and
  2021 have no named sequences at all: a project has ONE numeric and ONE
  alphanumeric scheme, held on `RevisionSettings`, so there is nothing to
  create or duplicate there. Their two schemes are read by LIST_REVISIONS; a
  tool to edit them on those releases is not built.

# ROUTING - the same rows are in the fragments named here.
#
#   "make an alphabetic sequence"        -> here, numberType=alphanumeric
#   "create a new revision numbering sequence" -> here
#   "duplicate the numbering sequence"   -> here, copyFrom=<its name>
#   "rename the numbering"               -> EDIT_REVISION_NUMBERING_SEQUENCE
#   "delete the numbering sequence"      -> DELETE_REVISION_NUMBERING_SEQUENCE
#   "use the Custom numbering on revision 2"
#                                        -> EDIT_REVISION, numbering=Custom
#   "number revisions per sheet"         -> SET_REVISION_SETTINGS

utterances:
  - make an alphabetic sequence
  - create a new revision numbering sequence
  - duplicate the numbering sequence
  - add a numeric revision numbering with prefix R

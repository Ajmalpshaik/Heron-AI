# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: five revisions on a TEST COPY, number 3 found by SELECT_BY_PARAMETER_VALUE (Revision Sequence equals 3), confirm=3, none of them clouded
    expect: >
      `deleted` true and `renumbered` showing four revisions numbered 1 to 4 -
      the old 4 and 5 having moved down. Check the numbers against what an
      email or a drawing says before relying on either

  - given: the last revision deleted
    expect: >
      nothing renumbered, and the remaining ones unchanged

negative:
  - given: the revision found, and NO confirm - or confirm=yes, or the number of another revision
    expect: >
      `deleted` false and `refused` naming the value to pass, the clouds it
      carries and the sheets it is on. Nothing deleted - Article 7

  - given: an ISSUED revision, confirm given
    expect: >
      `refused` naming it; nothing deleted

  - given: the project's only revision, or one a cloud still uses
    expect: >
      `deleted` false and `refused` quoting REVIT'S OWN reason - never a
      reason guessed here. `cloudsTouched` and `sheetsTouched` say what it
      carries

  - given: some releases refusing WITHOUT throwing
    expect: >
      the outcome established by looking for the revision afterwards. A call
      that returns is not evidence that anything was deleted

  - given: a find that brought back two revisions, or none
    expect: >
      `refused` naming them, or saying none came in; nothing deleted

  - given: revision 3 of 5 deleted
    expect: >
      the renumbering REPORTED, not left silent. Every note that said
      "revision 4" now names a different issue and nothing else records it

second_route:
  - >
    open Manage - Sheet Issues and Revisions and read the sequence column, then
    open a sheet whose revision schedule listed the old numbers

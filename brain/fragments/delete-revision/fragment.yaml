revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. A revision is an ordinary element to
  delete, and its sequence number, description and issued flag, the
  `RevisionCloud.RevisionId` and `ViewSheet.GetAllRevisionIds` /
  `GetAdditionalRevisionIds` it is looked up by, are unchanged 2020 to 2027 -
  read with tools/api-surface --members on each release. (`ViewSheet.
  GetAllRevisionCloudIds` would be shorter and is NOT used: it arrives in
  2023.) Revit's refusal may come back as a failed delete rather than a thrown
  error, so the result is established by looking for the revision afterwards.

# ROUTING - the same rows are in the fragments named here.
#
#   "delete that revision"               -> here, and everything after it
#                                           renumbers. Needs confirm
#   "delete revision 1"                  -> here, fed by
#                                           SELECT_BY_PARAMETER_VALUE,
#                                           parameterName=Revision Sequence,
#                                           matchText=1
#   "merge revision 2 into revision 1"   -> MERGE_REVISION, which keeps the
#                                           clouds by moving them first
#   "delete the numbering sequence"      -> DELETE_REVISION_NUMBERING_SEQUENCE
#   "change the revision"                -> EDIT_REVISION, when the fix is a
#                                           wrong date or description rather
#                                           than a revision that should not
#                                           exist
#   "take that revision off the sheets"  -> SET_SHEET_REVISIONS, which leaves
#                                           the revision itself alone
#   "list the revisions"                 -> LIST_REVISIONS
#   "delete these elements"              -> DELETE_ELEMENTS, the general one
#   "take that revision off the sheets"  -> SET_SHEET_REVISIONS, which leaves
#                                           the revision itself in place

utterances:
  - delete that revision
  - remove the revision from the project
  - get rid of revision 3
  - delete revision 1

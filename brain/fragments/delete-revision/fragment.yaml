id: FRG-SHT-017
semantic-identity: "delete that revision from the project"

# VERSION 2, BACK TO DRAFT ON 2026-09-28, AND THE PROOF BLOCK IS KEPT.
# Version 1 deleted whichever revision held the `sequenceNumber` it was typed,
# with no confirmation at all - Article 7 lived only in the chat's good
# manners. Version 2 is handed ONE revision by a find and refuses unless
# `confirm` names that same revision; it refuses an issued one by name, reports
# the clouds and sheets it touched and Revit's own reason when Revit says no.
# Version 1's refusal wording "a revision cloud still uses it" was a guess
# (section 2 of FRAGMENT-ISSUES quotes it) - on a one-revision model the reason
# may equally have been that it was the last revision.
kind: action
domain: revit.sheets
capability: DELETE_REVISION
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Deletes one project revision - the Delete button of the revisions dialog -
  and only with `confirm` naming that revision: its element id, or Revit's
  own "Seq. N - description" - never a bare number, which a renumber moves.
  The caller passes it only after the owner has said yes for that revision.
  An issued revision is refused by name, and so is a delete that would
  renumber a later issued one.

  **DELETING ONE RENUMBERS EVERY LATER REVISION, AND THAT IS THE PART THAT
  CATCHES PEOPLE.** Delete revision 3 of 5 and the old 4 and 5 become 3 and 4.
  Every note, every email and every drawing that referred to "revision 4" now
  points at a different issue - and nothing in the model records that it moved.
  The numbers after the deletion are read back and reported for exactly that
  reason.

  **WHAT IT TOUCHED IS REPORTED**: the clouds that carried it, the sheets that
  showed it, what Revit deleted along with it, and every revision that was
  renumbered. When Revit refuses - the project's last revision, or one still
  in use - Revit's own reason is reported, never a guessed one.

  **ONE REVISION, HANDED IN BY A FIND** - by Revision Sequence, the number the
  dialog shows, or by description; two found is refused with both named.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16), so one
  undo puts the revision and its numbering back.

contract:
  needs:
    - name: doc
      type: Document
    # THE revision, from the find before this - exactly one.
    - name: elements
      type: IList<Element>
    # The owner's yes for THIS revision: its element id ("929474") or
    # "Seq. 2 - Issued for Review". A bare number or anything else refuses.
    - name: confirm
      type: string
      source: request
  provides:
    - name: deleted
      role: result
      type: bool
    - name: renumbered
      # DELETING ONE RENUMBERS EVERY LATER REVISION, AND THAT IS THE PART THAT
      # CATCHES PEOPLE - every note and every drawing referring to the old
      # numbers is now wrong. Each revision that moved, old number to new,
      # then the whole list as it now stands. A string, so all of it prints.
      role: result
      type: string
    - name: revisionName
      # Which revision, "Seq. N 'description'" as it stood before.
      role: accounting
      type: string
    - name: cloudsTouched
      # The revision clouds that carried it, by id, and after a delete what
      # became of each. Counted whether or not anything was deleted (D-52).
      role: accounting
      type: string
    - name: sheetsTouched
      # The sheets that showed it, and whether from a cloud or ticked by hand
      # (D-52).
      role: accounting
      type: string
    - name: alsoDeleted
      # Whatever Revit removed along with the revision - its clouds and tags,
      # if it takes them. Revit's own list from the delete (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string


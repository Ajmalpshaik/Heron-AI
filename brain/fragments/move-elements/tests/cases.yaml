# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: 4 free-standing ducts, offset 200 mm up
    expect: >
      moved = 4, and MEASURE ONE IN REVIT. A count of 4 is what the broken
      version returns too - the only thing that separates them is a tape measure
      on one duct reading 200 mm and not 200 feet

  - given: the same 4, offset 0
    expect: moved = 4 and nothing reported blocked - asking for nothing is not a failure

  # VERSION 3 (2026-11-16) - row 5b-1733. FAILS on version 2. NOT RUN.
  - given: one door tag (IndependentTag) and one room tag in a plan, offset 1000,0,0
    expect: >
      moved 2, movedIds both, `unverified` empty - each tag's head read
      before and after. Version 2 answered "0 moved the whole offset ... 2
      could not be read back" (row 5b-1733)

  # VERSION 4 (2026-11-26) - row 5b-2046. The first FAILS on version 3; the
  # locked one fails on it by `notModelElements`; the lines case counts only
  # where a line reads Category null (see its expect). NOT RUN.
  # Arranged in a SCRATCH family on Revit 2020 (NEEDS-CHECKING Group QS) - a
  # new family from Metric Generic Model.rft, never the owner's fan family.
  - given: >
      a scratch family with two UNCONSTRAINED extrusions (not locked to any
      reference plane, no labelled dimension), their ids from
      REPORT_FAMILY_FORMS which=solid, offset 0,0,100
    expect: >
      moved 2, movedIds both, `notModelElements` empty, `unverified` empty.
      THEN READ THE EXTENTS BACK with REPORT_FAMILY_FORMS: each form 100 mm
      higher than before, X and Y unchanged - the count alone is not the
      proof. Version 3 answered NOTHING CHANGED with both in
      `notModelElements`. If the forms land in `unverified`, the model box
      does not read back in a family and the probe needs widening - a row,
      not a pass
  - given: >
      one extrusion whose top and bottom are LOCKED to reference planes (or
      held by a labelled dimension), offset 0,0,100 - the state the owner's
      fan body is most likely in
    expect: >
      `notModelElements` EMPTY (version 3 refused it there), and write down
      which it came back as - `blocked`, `partly`, or Revit refusing for the
      constraint - and that it is NOT in `movedIds`. Either is an honest
      answer; a clean `moved` with the extrusion where it was is the defect
  - given: >
      two extrusions locked to ONE shared reference plane, both handed in in
      one call, offset 0,0,100 - the field case was 31 forms in one call
    expect: >
      write down what each did. If moving the first carried the second, the
      second is in `unverified` with the FAMILY finding ("carried by a
      constraint ... move the reference plane"), never the tag advice and
      never counted in `movedIds`
  - given: one free extrusion with toPoint 0,0,1000, offset left out
    expect: >
      in `noLocationPoint`, not moved, and the finding says it has no
      location point - "a family form" - not that it is positioned by a curve
  - given: >
      one model line (offset 0,0,100) and one symbolic line in a plan view
      (offset 100,0,0) in the scratch family
    expect: >
      both moved, not refused. Write down what Category reads on each - only
      forms were seen refused in the field. The case says something about
      version 4 ONLY where a line reads Category null; where it reads a
      category, version 3 moved it too, and the CurveElement half of the rule
      stays unexercised - say so

negative:
  # VERSION 4 (2026-11-26) - row 5b-2046. NOT RUN. Load any small family into
  # the scratch family first (Insert > Load Family) so a FamilySymbol exists
  # to hand in; the scratch family has none of its own.
  - given: >
      one extrusion's id AND the loaded family's FamilySymbol (type) id in one
      call, offset 0,0,100
    expect: >
      REFUSED before anything moves - moved 0, the symbol's id alone in
      `notModelElements`, and the extrusion's extents unchanged when read
      back. The version 4 widening is for forms and lines in a family, never
      for types. The version 3 wall-and-wall-type case below still holds in a
      project, where the family exception does not apply
  - given: >
      in the scratch family, one free extrusion and an element with NO
      category that is neither a form nor a line (the prover picks one - a
      sketch or sketch plane of a form is the likely one - and writes down
      what it was and what its Category read), offset 0,0,100
    expect: >
      REFUSED before anything moves, the other element's id alone in
      `notModelElements`. This is the case that reaches version 4's changed
      line: a version that let every no-category element through in a
      family would move both
  - given: in the scratch family, one extrusion and the LOADED family's own Family id, offset 0,0,100
    expect: refused, the Family id in `notModelElements`, nothing moved
  - given: >
      in a PROJECT, a no-category element that is not a type - id 398 on
      Heron OC Tags, the version 3 proof's own negative; read first that it
      is not a type, and pick another if it is - with one wall,
      offset 1000,0,0
    expect: >
      refused as in version 3, 398 in `notModelElements` - the family
      exception does not reach a project

  - given: >
      2 of the 4 ducts put inside a REVIT GROUP, the same 200 mm up
    expect: >
      moved = 2, and the 2 group members in `blocked` BY ID. This is the case
      the fragment exists for: Revit moves nothing and reports no error, so a
      version that trusted the call would say "moved 4" with two ducts exactly
      where they started. They are NOT pinned, so a pinned-check does not catch
      them

  - given: an element attached to something that limits how far it can go
    expect: >
      counted in `partly`, not in `moved` and not in `blocked` - it did move,
      just not the whole way, and that is legitimate rather than a fault

  - given: an element with no readable location
    expect: >
      its id in `unverified`. Never counted as moved. A thing that cannot be
      checked must not be reported as checked

  - given: an empty element list
    expect: all four outputs empty or zero, reported as nothing to do

  # VERSION 2 (2026-11-01) - MOVE_ELEMENTS_TO_POINT merged in. Each FAILS on
  # version 1, which had no `toPoint`. NOT RUN.
  - given: one free-standing family instance and toPoint 5 m from where it is, offset left out
    expect: >
      moved 1, movedIds its id, and the element AT that coordinate - checked
      with REPORT_LOCATION and a dimension in Revit, not read off the count
  - given: a wall handed in with toPoint
    expect: in `noLocationPoint`, NOT moved - a wall is positioned by a curve
  - given: an element constrained to a grid, toPoint off that grid
    expect: in `notAtPoint`, not in movedIds
  - given: an element already at the point
    expect: counted as moved, nothing attempted, no error
  - given: two family instances and one toPoint, stackOnOnePoint left out
    expect: >
      REFUSED, nothing moved - two elements on one point is a stacked
      duplicate. MOVE_ELEMENTS_TO_POINT moved both there without a word
  - given: the same two with stackOnOnePoint true
    expect: both moved there, both in movedIds
  - given: toPoint and a non-zero offset together
    expect: refused - two answers to where - nothing moved

  # VERSION 3 (2026-11-16) - rows 5b-1707 and 5b-1733. Each FAILS on version 2.
  # NOT RUN. Arranged on Heron's own scratch project (NEEDS-CHECKING Group OC).
  - given: >
      one wall and the id of a wall TYPE (or a family, or any element with no
      category), typed as ids, offset 1000,0,0
    expect: >
      REFUSED before anything moves - moved 0, the type's id in
      `notModelElements`, and the wall still where it was. Version 2 moved the
      wall and put the type in `unverified` (row 5b-1707)
  - given: the same wall alone, offset 1000,0,0
    expect: >
      moved 1, `notModelElements` empty - the refusal is for the wrong id,
      not for typed ids as such
  - given: a door and its own tag in one call, offset 1000,0,0
    expect: >
      the door moved 1; the tag, if Revit carried it with the door as well,
      in `unverified` with a finding that it moved FURTHER than the offset -
      never counted in `partly`. Version 2 hid it as could-not-be-read-back
  - given: an elevation marker by id, offset 1000,0,0
    expect: >
      moved, not refused - if it is refused as having no category, the
      no-category rule is too wide: write down what its Category reads

second_route:
  - a tape measure in Revit on ONE element, which is the only check that catches feet-for-millimetres
  - one Ctrl+Z puts the whole move back in a single step (Golden Rule 16)
  - select the ids reported as blocked and look at what they belong to

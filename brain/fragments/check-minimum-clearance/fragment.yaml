id: FRG-QA-011
semantic-identity: "every pair of things closer together than they are allowed to be"
kind: action
domain: revit.qa
capability: CHECK_MINIMUM_CLEARANCE
# VERSION 3 (2026-11-01): CHECK_INSULATION_CLEARANCE was merged into this card
# on the owner's instruction - "make sure there is no duplicate tools" - and is
# DEPRECATED; see the merge block above `utterances`. Version 2's proof below
# was kept as the record; it no longer described the code, so the card was
# DRAFT at the time, until version 3 is proved on a real model (D-30).
# VERSION 4 (2026-11-20): row 5b-1400 - seven sheets handed in on Revit 2020
# were measured as 21 pairs too close. Only an element of a model category is
# measured now; a sheet, a view, a type or annotation is skipped and counted
# with the elements that have no extent, and said. Version 3's proof below is
# kept as the record; its C# moved, so it is DRAFT until re-proved (D-30).
# VERSION 5 (2026-11-26): CHECK_VERTICAL_CLEARANCE was merged into this card
# on the owner's answer to row 5b-1878 (A), issue #1088 - "Yes, one tool" - and
# is DEPRECATED; see the second merge block above `utterances`. `stackedOnly`,
# `overlapAs` (D-208), `clashing`, `overlapsMm` and `slopedOrVertical` are new.
# Version 4's proof below - PROVEN 2026-11-24 on Night Rig 1124 - is kept as
# the record; its C# moved, so the card is DRAFT until version 5 is proved on
# a real model (D-30), NEEDS-CHECKING Group QY.
version: 5
source: OFFICIAL
risk: READ

purpose: >
  Measures the real gap between two sets of elements and reports **every pair**
  closer than the clearance required - not the nearest one, all of them.

  **IT IS NOT `FIND_NEAREST_ELEMENTS` WITH A THRESHOLD.** That answers *"which
  one is closest to each"* and returns one per element. This answers *"what is
  too close"* and returns every offending pair, because a duct with four
  services inside its clearance zone has four problems and a report naming one
  of them closes none of them.

  **INSULATION IS OPTIONAL AND IT CHANGES THE ANSWER ON EVERY REAL MEP JOB.** A
  50 mm jacket on both services eats 100 mm of the gap, so a pair reading 120 mm
  clear on the bare geometry has 20 mm in reality and cannot be built. The
  earlier library kept this as a **second fragment**; here it is a flag, because
  it is the same sweep with each element's box grown by its own insulation, and
  two fragments that differ by one measurement drift apart the moment one is
  fixed.

  **A DIFFERENT CLEARANCE PER CATEGORY IS THE NORMAL CASE**, not the advanced
  one - 50 mm to structure, 150 mm to electrical, 300 mm to a flue is one rule
  set, not three runs. `rules` carries it; `defaultClearance` catches whatever
  the table does not name, and every pair reports which rule judged it so a
  wrong threshold is visible rather than buried.

  **THE GAP IS MEASURED BETWEEN BOUNDING BOXES AND IS THEREFORE OPTIMISTIC ON A
  ROTATED ELEMENT** - the box is bigger than the element, so two of them read
  closer than they are. That direction is the safe one for a clearance check: it
  over-reports rather than missing a clash. It still must not be quoted as a
  certified figure.

  **IT REPORTS AND CHANGES NOTHING.** Deciding what to move is a person's job,
  and a clearance sweep that also moved things would make the report unreadable
  by changing what it was reporting on.

  **MILLIMETRES IN AND MILLIMETRES OUT.** `defaultClearance` and every number in
  `rules` are millimetres (D-71); the gap comes back in millimetres too. Both
  halves were wrong and in opposite directions. `rules` was used **raw against a
  measurement in feet**, so `Walls=150` demanded 150 FEET and condemned every
  pair a rule judged while the default-judged pairs stayed right - and the rule
  column beside them read as the explanation rather than the fault. `gaps` then
  came back in feet, so the one fragment answered in two units at once.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, every element is also measured against the
  linked walls, floors, roofs, ceilings, columns, beams, foundations and
  stairs near it - the same box gap, in this model's space, judged by the
  same rules against the linked element's category name - and each pair too
  close is a line in `linkedMatches` with the gap, the clearance asked for
  and the linked element's type, id IN THE LINK and Fire Rating. Only the
  element's own insulation comes off a linked gap. `linksSearched` says how
  many links were read: set and 0 means "you asked, and none are loaded".
  **NOTHING FROM A LINK IS CARRIED** - `tooClose`, `gapsMm`, `judgedBy` and
  `pairsChecked` stay this model's own (FRAGMENT-ISSUES row 75). Only model
  elements are read from a link, never its views or sheets. Links nested
  inside a link are not read, and are counted in the answer. This is
  version 2; version 1's proof no longer describes the code, and the
  fragment is DRAFT until it is proved again.

  **NO INSULATION MODELLED IS SAID FIRST (version 3).** With insulation
  counted, the insulated and bare elements are counted and a warning leads
  when some carry none; `assumeThicknessMm` lags them on paper, said on every
  row. Each pair is measured once. Version 3 is DRAFT until proved.

  **STACKED ONLY, AND HOW AN OVERLAP READS (version 5).** With `stackedOnly`
  only pairs one above the other are measured, and the gap is the vertical
  room between them - what a hanger and a jacket need - with every pair
  side by side left out, and each row says which one is on top. Sloped and vertical runs are counted, because
  their box is the whole rise. Where two overlap, `overlapAs` decides: CLASH
  with the depth (the default), or 0 mm. Version 5 is DRAFT until proved.

# A NAME TWO PARAMETERS SHARE IS NEVER READ: a linked element whose Fire Rating
# two parameters carry - a shared or project "Fire Rating" bound beside the
# built-in one, on the element or on the type the lookup falls through to -
# reads "Fire Rating NOT READ - N parameters share that name" in
# `linkedMatches`, never either value (D-54 s3, FRAGMENT-ISSUES 5b-203; added
# 2026-10-09). Written here and not in `purpose`, as on check-sleeve-size's
# card: the purpose is embedded for routing, and on that card's change a
# purpose sentence about this moved other cards' utterances in check-routing,
# measured against d9b27f03 (row 5b-203's 2026-10-09 note). Not measured for
# this card.
contract:
  needs:
    - name: elements
      type: IList<Element>
    - name: targets
      type: IList<Element>
      binds: elements
    - name: defaultClearance
      type: double
      source: request
    - name: rules
      type: IDictionary<string, double>
      source: request
    - name: includeInsulation
      type: bool
      source: request
    - name: assumeThicknessMm
      # VERSION 3, from CHECK_INSULATION_CLEARANCE: millimetres of lagging
      # assumed on every element that carries NO insulation in the model - how
      # a run is checked against what it is GOING to be lagged with. Every row
      # it touches says ASSUMED. Above 0 it counts insulation even with
      # includeInsulation false, and says so. Left out it binds 0: none.
      type: double
      source: request
      optional: true
      absent: 0
    - name: ignoreConnected
      # VERSION 3, from CHECK_INSULATION_CLEARANCE: pass over a pair joined by
      # a connector - a duct and the fitting on its end are at zero clearance
      # by construction. Left out it binds false.
      type: bool
      source: request
      optional: true
    - name: maxRows
      # VERSION 3, from CHECK_INSULATION_CLEARANCE: how many pair rows
      # `findings` lists; the counts are complete whatever this is. Left out
      # it binds 50.
      type: int
      source: request
      optional: true
      absent: 50
    - name: doc
      type: Document
      source: ambient
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
    - name: stackedOnly
      # VERSION 5, from CHECK_VERTICAL_CLEARANCE: only pairs one above the
      # other in plan, and only the vertical gap between them - the bottom of
      # the upper box to the top of the lower. Each row says which is on top.
      # Left out it binds false: every pair, the straight-line gap.
      type: bool
      source: request
      optional: true
    - name: overlapAs
      # VERSION 5, D-208 - how a pair that OVERLAPS is reported, the owner's
      # choice: "clash" (or "depth") - CLASH with the depth of the overlap in
      # `overlapsMm`, too close whatever clearance was asked; "zero" (or "0")
      # - a 0 mm gap judged against the clearance, as version 4 did. Left out
      # it binds "clash". Any other word measures nothing and says so.
      type: string
      source: request
      optional: true
      absent: clash
  provides:
    - name: tooClose
      role: result
      type: IList<string>
    - name: gapsMm
      role: result
      type: IDictionary<string, double>
    - name: judgedBy
      # Which rule judged each pair, reported so a wrong threshold is visible
      # rather than buried. Filled in for compliant pairs too, so it must
      # never read as a finding (D-52).
      role: accounting
      type: IDictionary<string, string>
    - name: pairsChecked
      # How many pairs were examined. A count of work DONE, not of things
      # found - the evidence it ran, which is the opposite of a reason to
      # doubt it (D-52).
      role: accounting
      type: int
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then the links' own lines. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75). Since 2026-10-09 a Fire
      # Rating two parameters share reads NOT READ there, never either
      # value (D-54 s3, FRAGMENT-ISSUES 5b-203).
      role: accounting
      type: IList<string>
    - name: tooCloseIds
      # VERSION 3, from CHECK_INSULATION_CLEARANCE's `tooClose`: every element
      # in a pair too close, once, so the next step can select or isolate them.
      # This model's own - nothing from a link.
      role: result
      type: IList<ElementId>
    - name: violations
      # VERSION 3, from CHECK_INSULATION_CLEARANCE: how many pairs are too
      # close - each pair once.
      role: result
      type: int
    - name: insulatedCount
      # VERSION 3, from CHECK_INSULATION_CLEARANCE: how many measurable
      # elements carry insulation in the model. The size of what it measured,
      # never a clearance it failed (D-52).
      role: accounting
      type: int
    - name: bareCount
      # VERSION 3, from CHECK_INSULATION_CLEARANCE: how many carry NONE - the
      # silent problem, said first when insulation is counted. About the
      # model, never a pair it failed (D-52).
      role: accounting
      type: int
    - name: clashing
      # VERSION 5, from CHECK_VERTICAL_CLEARANCE's `clashing`: how many pairs
      # OVERLAP - boxes and jackets together - whichever way `overlapAs`
      # reports them, and whatever clearance was asked: an overlap is a fact
      # about the model, not about the number typed.
      role: result
      type: int
    - name: overlapsMm
      # VERSION 5, D-208: with `overlapAs` clash, how deep each overlapping
      # pair's overlap is, in millimetres, keyed as `tooClose` is - the
      # smallest of the three axis overlaps, or with `stackedOnly` the height
      # overlap, jackets included. Empty with `overlapAs` zero.
      role: result
      type: IDictionary<string, double>
    - name: slopedOrVertical
      # VERSION 5, from CHECK_VERTICAL_CLEARANCE: with `stackedOnly`, how many
      # elements are sloped or vertical, whose box is the whole rise, so a
      # vertical gap to them is smaller than the truth. The evidence it
      # looked, never a pair it failed (D-52). 0 without `stackedOnly`.
      role: accounting
      type: int
    - name: findings
      # VERSION 3: the warning when some carry no insulation, the insulated /
      # bare split, the pair rows up to maxRows with bare gap, jackets and real
      # gap, and what was skipped for want of an extent. VERSION 5: the
      # overlaps and how they were reported, the pairs `stackedOnly` passed
      # over, the sloped or vertical warning, and CLASH or ABOVE on a row.
      type: IList<string>


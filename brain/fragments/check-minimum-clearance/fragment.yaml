compatibility-note: >
  One implementation for every release. `get_BoundingBox(null)`,
  `InsulationLiningBase.GetInsulationIds` and `Category.Name` are unchanged 2020
  to 2027. Every comparison is done in Revit's internal feet; millimetres cross
  in and out by 304.8 as plain arithmetic - no units API is touched, which is
  what keeps this clear of the 2021 move and what D-20 is actually about. A pair
  is keyed by the two ids rendered as text rather than by any numeric id, so the
  2024 64-bit change cannot reach it.

# ROUTING - repeated in CHECK_VERTICAL_CLEARANCE, CHECK_EQUIPMENT_CLEARANCE and
# CHECK_SLEEVE_SIZE.
#
#   "what is too close to what"          -> here - every offending pair, in
#                                          any direction
#   "how much room is there between the duct and the pipe above it" ->
#                                        CHECK_VERTICAL_CLEARANCE - the Z gap
#                                        only. Two services 200 mm apart
#                                        diagonally pass HERE and may have
#                                        40 mm of vertical room, which is what
#                                        a hanger and a jacket need
#   "is there enough space in front of the panel to open the door" ->
#                                        CHECK_EQUIPMENT_CLEARANCE - a zone
#                                        with a front and a back, off the
#                                        family facing direction
#   "are the sleeves big enough for the pipes going through" ->
#                                        CHECK_SLEEVE_SIZE - a sleeve and its
#                                        pipe MUST touch; this measures things
#                                        that must not
#   "clearance with the lagging on"    -> here since version 3, includeInsulation
#                                        or assumeThicknessMm - it was
#                                        CHECK_INSULATION_CLEARANCE's, merged in
#   "these read clear but both pipes are insulated" -> here, the same
#   "do these overlap"                 -> FIND_CLASHES - yes or no, no distance
#   "insulate these"                   -> SET_MEP_INSULATION, which PUTS THE
#                                        LAGGING ON. This only measures
#
# VERSION 3 (2026-11-01) - CHECK_INSULATION_CLEARANCE WAS MERGED INTO THIS
# CARD on the owner's instruction in conversation: "make sure there is no
# duplicate tools", every conflict to keep the SAFER rule. It is DEPRECATED.
# Its own purpose called itself "the same clearance sweep as
# CHECK_MINIMUM_CLEARANCE" with the jackets taken off, and this card has had
# that as `includeInsulation` since version 1. Where each retired input and
# output is now:
#
#   CHECK_INSULATION_CLEARANCE          here
#     elements (one set)                elements, with targets the same set -
#                                       each pair now measured once
#     requiredClearanceMm               defaultClearance, the same mm
#     assumeThicknessMm                 assumeThicknessMm, ASSUMED on each row
#     ignoreConnected, maxRows          the same
#     tooClose (element ids)            tooCloseIds
#     violations                        violations
#     insulatedCount, bareCount         the same, and the warning first
#     findings                          findings - rows with bare gap, both
#                                       jackets and real gap; elements with no
#                                       extent said; lining not counted
#
# THE SAFER RULE WHERE THEY DIFFERED. That card counted insulation always;
# here it is still `includeInsulation`, and an assumed thickness turns it on
# rather than being ignored. That card skipped any pair whose bare gap was
# beyond the clearance plus twice the thickest jacket - a shortcut that cannot
# change an answer; every pair is measured here. That card's per-category
# rules did not exist; `rules` is kept. Nothing of it was an opposite rule.
utterances:
  - is anything too close to the ducts
  - check the clearance between services
  - what is within 100 mm of these
  - clearance check
  - are the services too close together
  - check the gap to the structure
  - what is too close to what
  # MOVED 2026-11-01 from CHECK_INSULATION_CLEARANCE, merged into this card.
  - check the clearance with the insulation on
  - is there enough room once these are lagged
  - clearance to the outside of the insulation
  - these read clear but both pipes are insulated
  - will these fit with 50mm lagging
  - insulation aware clearance check
  - the gap is not big enough once it is insulated

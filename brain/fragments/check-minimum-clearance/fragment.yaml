id: FRG-QA-011
semantic-identity: "every pair of things closer together than they are allowed to be"
kind: action
domain: revit.qa
capability: CHECK_MINIMUM_CLEARANCE
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Measures the real gap between two sets of elements and reports **every pair**
  closer than the clearance required - not the nearest one, all of them.

  **IT IS NOT `FIND_NEAREST_ELEMENTS` WITH A THRESHOLD.** That answers *"which
  one is closest to each"* and returns one per element. This answers *"what is
  too close"* and returns every offending pair, because a duct with four
  services inside its clearance zone has four problems and a report naming one
  of them closes none of them.

  **INSULATION IS OPTIONAL AND IT CHANGES THE ANSWER ON EVERY REAL MEP JOB.** A
  50 mm jacket on both services eats 100 mm of the gap, so a pair reading 120 mm
  clear on the bare geometry has 20 mm in reality and cannot be built. The
  earlier library kept this as a **second fragment**; here it is a flag, because
  it is the same sweep with each element's box grown by its own insulation, and
  two fragments that differ by one measurement drift apart the moment one is
  fixed.

  **A DIFFERENT CLEARANCE PER CATEGORY IS THE NORMAL CASE**, not the advanced
  one - 50 mm to structure, 150 mm to electrical, 300 mm to a flue is one rule
  set, not three runs. `rules` carries it; `defaultClearance` catches whatever
  the table does not name, and every pair reports which rule judged it so a
  wrong threshold is visible rather than buried.

  **THE GAP IS MEASURED BETWEEN BOUNDING BOXES AND IS THEREFORE OPTIMISTIC ON A
  ROTATED ELEMENT** - the box is bigger than the element, so two of them read
  closer than they are. That direction is the safe one for a clearance check: it
  over-reports rather than missing a clash. It still must not be quoted as a
  certified figure.

  **IT REPORTS AND CHANGES NOTHING.** Deciding what to move is a person's job,
  and a clearance sweep that also moved things would make the report unreadable
  by changing what it was reporting on.

  **MILLIMETRES IN AND MILLIMETRES OUT.** `defaultClearance` and every number in
  `rules` are millimetres (D-71); the gap comes back in millimetres too. Both
  halves were wrong and in opposite directions. `rules` was used **raw against a
  measurement in feet**, so `Walls=150` demanded 150 FEET and condemned every
  pair a rule judged while the default-judged pairs stayed right - and the rule
  column beside them read as the explanation rather than the fault. `gaps` then
  came back in feet, so the one fragment answered in two units at once.

contract:
  needs:
    - name: elements
      type: IList<Element>
    - name: targets
      type: IList<Element>
      binds: elements
    - name: defaultClearance
      type: double
      source: request
    - name: rules
      type: IDictionary<string, double>
      source: request
    - name: includeInsulation
      type: bool
      source: request
    - name: doc
      type: Document
      source: ambient
  provides:
    - name: tooClose
      role: result
      type: IList<string>
    - name: gapsMm
      role: result
      type: IDictionary<string, double>
    - name: judgedBy
      # Which rule judged each pair, reported so a wrong threshold is visible
      # rather than buried. Filled in for compliant pairs too, so it must
      # never read as a finding (D-52).
      role: accounting
      type: IDictionary<string, string>
    - name: pairsChecked
      # How many pairs were examined. A count of work DONE, not of things
      # found - the evidence it ran, which is the opposite of a reason to
      # doubt it (D-52).
      role: accounting
      type: int


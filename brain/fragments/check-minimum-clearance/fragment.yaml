compatibility-note: >
  One implementation for every release. `get_BoundingBox(null)`,
  `InsulationLiningBase.GetInsulationIds` and `Category.Name` are unchanged 2020
  to 2027. Every comparison is done in Revit's internal feet; millimetres cross
  in and out by 304.8 as plain arithmetic - no units API is touched, which is
  what keeps this clear of the 2021 move and what D-20 is actually about. A pair
  is keyed by the two ids rendered as text rather than by any numeric id, so the
  2024 64-bit change cannot reach it.

# ROUTING - repeated in CHECK_EQUIPMENT_CLEARANCE, CHECK_SLEEVE_SIZE,
# ALIGN_ELEMENTS and MEASURE_CEILING_HEIGHT.
#
#   "what is too close to what"          -> here - every offending pair, in
#                                          any direction
#   "how much room is there between the duct and the pipe above it" ->
#                                        here since version 5, stackedOnly -
#                                        only pairs one above the other, the
#                                        vertical gap, and which is on top. It
#                                        was CHECK_VERTICAL_CLEARANCE's, merged in
#   "which services are stacked too close together" -> here, the same
#   "put all these at the same height"   -> ALIGN_ELEMENTS, by an edge - the FIX once
#                                          this has found the problem
#   "how high is the ceiling"            -> MEASURE_CEILING_HEIGHT - how much
#                                          void there is to work in at all
#   "what is above this duct"            -> PROBE_AROUND_ELEMENTS, which
#                                           NAMES what it hits and how far.
#                                           This one judges a clearance
#                                           against a number you give
#   "is there enough space in front of the panel to open the door" ->
#                                        CHECK_EQUIPMENT_CLEARANCE - a zone
#                                        with a front and a back, off the
#                                        family facing direction
#   "are the sleeves big enough for the pipes going through" ->
#                                        CHECK_SLEEVE_SIZE - a sleeve and its
#                                        pipe MUST touch; this measures things
#                                        that must not
#   "clearance with the lagging on"    -> here since version 3, includeInsulation
#                                        or assumeThicknessMm - it was
#                                        CHECK_INSULATION_CLEARANCE's, merged in
#   "these read clear but both pipes are insulated" -> here, the same
#   "do these overlap"                 -> FIND_CLASHES - yes or no, no distance
#   "insulate these"                   -> SET_MEP_INSULATION, which PUTS THE
#                                        LAGGING ON. This only measures
#
# VERSION 3 (2026-11-01) - CHECK_INSULATION_CLEARANCE WAS MERGED INTO THIS
# CARD on the owner's instruction in conversation: "make sure there is no
# duplicate tools", every conflict to keep the SAFER rule. It is DEPRECATED.
# Its own purpose called itself "the same clearance sweep as
# CHECK_MINIMUM_CLEARANCE" with the jackets taken off, and this card has had
# that as `includeInsulation` since version 1. Where each retired input and
# output is now:
#
#   CHECK_INSULATION_CLEARANCE          here
#     elements (one set)                elements, with targets the same set -
#                                       each pair now measured once
#     requiredClearanceMm               defaultClearance, the same mm
#     assumeThicknessMm                 assumeThicknessMm, ASSUMED on each row
#     ignoreConnected, maxRows          the same
#     tooClose (element ids)            tooCloseIds
#     violations                        violations
#     insulatedCount, bareCount         the same, and the warning first
#     findings                          findings - rows with bare gap, both
#                                       jackets and real gap; elements with no
#                                       extent said; lining not counted
#
# THE SAFER RULE WHERE THEY DIFFERED. That card counted insulation always;
# here it is still `includeInsulation`, and an assumed thickness turns it on
# rather than being ignored. That card skipped any pair whose bare gap was
# beyond the clearance plus twice the thickest jacket - a shortcut that cannot
# change an answer; every pair is measured here. That card's per-category
# rules did not exist; `rules` is kept. Nothing of it was an opposite rule.
#
# VERSION 5 (2026-11-26) - CHECK_VERTICAL_CLEARANCE WAS MERGED INTO THIS CARD
# on the owner's answer to row 5b-1878 (A), issue #1088: "Yes, one tool". It is
# DEPRECATED. For a pair whose plan boxes overlap - the only pairs it measured -
# this card's box gap already was the Z gap; `stackedOnly` measures those pairs
# alone and says which is on top. Where each retired input and output is now:
#
#   CHECK_VERTICAL_CLEARANCE            here
#     services (one set)                elements, with targets the same set -
#                                       each pair measured once
#     requiredGap                       defaultClearance, the same mm - and
#                                       `rules` per category beside it
#     (pairs above one another only)    stackedOnly
#     findings TIGHT, "A is above B"    findings - each row names the upper one
#                                       first, "is ABOVE", and how far short
#     findings CLASH, the Z overlap     findings CLASH with the depth, and
#                                       overlapsMm (overlapAs clash, the default)
#     tooClose (tight pairs, int)       violations less clashing
#     clashing                          clashing
#     slopedOrVertical                  slopedOrVertical, and its warning
#     no geometry counted               withoutBox, said in findings
#
# AND WHAT THE RETIRED CARD GAINS HERE: insulation (includeInsulation,
# assumeThicknessMm), linked structure (includeLinks, each line saying ABOVE or
# BELOW with stackedOnly), per-category rules, ignoreConnected, and
# selectable ids (tooCloseIds).
#
# THE ONE OPPOSITE RULE, AND WHO SETTLED IT. Where two boxes overlap, version 4
# reported 0 mm and the vertical card reported CLASH with the depth. The owner,
# 2026-11-26: "depending on the user it will be ask depth or just 0, both
# option maybe needed" - so both are kept, as `overlapAs` (D-208). The default
# is CLASH with the depth, the vertical card's rule and the safer one: 0 mm
# reads as two things just touching, and hides how far one has to move; a
# CLASH is reported whatever clearance was asked, so an overlap can never pass.
# "zero" gives version 4's answer exactly. Nothing else was opposite.
#
# NOT CARRIED, AND WHY. The vertical card's purpose said two services 200 mm
# apart diagonally "may have only 40 mm of VERTICAL room" that a straight-line
# gap would pass. Measured on boxes, as both cards measure, that cannot happen:
# a pair whose plan boxes overlap has a box gap that already IS the vertical
# gap (row 5b-1878's own reading), and a pair whose plan boxes do not overlap
# is not stacked. The claim compared centre lines, which neither card reads, so
# it is not repeated here. What `stackedOnly` really adds is leaving out every
# pair side by side, naming the upper one, and the sloped warning.
# The vertical card's sloped test used its requiredGap;
# here it uses defaultClearance, the same number - a per-category rule does
# not change which runs are sloped.
utterances:
  - is anything too close to the ducts
  - check the clearance between services
  - what is within 100 mm of these
  - clearance check
  - are the services too close together
  - check the gap to the structure
  - what is too close to what
  # MOVED 2026-11-01 from CHECK_INSULATION_CLEARANCE, merged into this card.
  - check the clearance with the insulation on
  - is there enough room once these are lagged
  - clearance to the outside of the insulation
  - these read clear but both pipes are insulated
  - will these fit with 50mm lagging
  - insulation aware clearance check
  - the gap is not big enough once it is insulated
  # MOVED 2026-11-26 from CHECK_VERTICAL_CLEARANCE, merged into this card.
  - how much room is there between the duct and the pipe above it
  - which services are stacked too close together
  - is there enough vertical space between the services
  - check the vertical clearance between the services
  - will the hangers fit between these two

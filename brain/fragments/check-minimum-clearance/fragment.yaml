id: FRG-QA-011
semantic-identity: "every pair of things closer together than they are allowed to be"
kind: action
domain: revit.qa
capability: CHECK_MINIMUM_CLEARANCE
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Measures the real gap between two sets of elements and reports **every pair**
  closer than the clearance required - not the nearest one, all of them.

  **IT IS NOT `FIND_NEAREST_ELEMENTS` WITH A THRESHOLD.** That answers *"which
  one is closest to each"* and returns one per element. This answers *"what is
  too close"* and returns every offending pair, because a duct with four
  services inside its clearance zone has four problems and a report naming one
  of them closes none of them.

  **INSULATION IS OPTIONAL AND IT CHANGES THE ANSWER ON EVERY REAL MEP JOB.** A
  50 mm jacket on both services eats 100 mm of the gap, so a pair reading 120 mm
  clear on the bare geometry has 20 mm in reality and cannot be built. The
  earlier library kept this as a **second fragment**; here it is a flag, because
  it is the same sweep with each element's box grown by its own insulation, and
  two fragments that differ by one measurement drift apart the moment one is
  fixed.

  **A DIFFERENT CLEARANCE PER CATEGORY IS THE NORMAL CASE**, not the advanced
  one - 50 mm to structure, 150 mm to electrical, 300 mm to a flue is one rule
  set, not three runs. `rules` carries it; `defaultClearance` catches whatever
  the table does not name, and every pair reports which rule judged it so a
  wrong threshold is visible rather than buried.

  **THE GAP IS MEASURED BETWEEN BOUNDING BOXES AND IS THEREFORE OPTIMISTIC ON A
  ROTATED ELEMENT** - the box is bigger than the element, so two of them read
  closer than they are. That direction is the safe one for a clearance check: it
  over-reports rather than missing a clash. It still must not be quoted as a
  certified figure.

  **IT REPORTS AND CHANGES NOTHING.** Deciding what to move is a person's job,
  and a clearance sweep that also moved things would make the report unreadable
  by changing what it was reporting on.

  **MILLIMETRES IN AND MILLIMETRES OUT.** `defaultClearance` and every number in
  `rules` are millimetres (D-71); the gap comes back in millimetres too. Both
  halves were wrong and in opposite directions. `rules` was used **raw against a
  measurement in feet**, so `Walls=150` demanded 150 FEET and condemned every
  pair a rule judged while the default-judged pairs stayed right - and the rule
  column beside them read as the explanation rather than the fault. `gaps` then
  came back in feet, so the one fragment answered in two units at once.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, every element is also measured against the
  linked walls, floors, roofs, ceilings, columns, beams, foundations and
  stairs near it - the same box gap, in this model's space, judged by the
  same rules against the linked element's category name - and each pair too
  close is a line in `linkedMatches` with the gap, the clearance asked for
  and the linked element's type, id IN THE LINK and Fire Rating. Only the
  element's own insulation comes off a linked gap. `linksSearched` says how
  many links were read: set and 0 means "you asked, and none are loaded".
  **NOTHING FROM A LINK IS CARRIED** - `tooClose`, `gapsMm`, `judgedBy` and
  `pairsChecked` stay this model's own (FRAGMENT-ISSUES row 75). Only model
  elements are read from a link, never its views or sheets. Links nested
  inside a link are not read, and are counted in the answer. This is
  version 2; version 1's proof no longer describes the code, and the
  fragment is DRAFT until it is proved again.

# A NAME TWO PARAMETERS SHARE IS NEVER READ: a linked element whose Fire Rating
# two parameters carry - a shared or project "Fire Rating" bound beside the
# built-in one, on the element or on the type the lookup falls through to -
# reads "Fire Rating NOT READ - N parameters share that name" in
# `linkedMatches`, never either value (D-54 s3, FRAGMENT-ISSUES 5b-203; added
# 2026-10-09). Written here and not in `purpose`, as on check-sleeve-size's
# card: the purpose is embedded for routing, and on that card's change a
# purpose sentence about this moved other cards' utterances in check-routing,
# measured against d9b27f03 (row 5b-203's 2026-10-09 note). Not measured for
# this card.
contract:
  needs:
    - name: elements
      type: IList<Element>
    - name: targets
      type: IList<Element>
      binds: elements
    - name: defaultClearance
      type: double
      source: request
    - name: rules
      type: IDictionary<string, double>
      source: request
    - name: includeInsulation
      type: bool
      source: request
    - name: doc
      type: Document
      source: ambient
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: tooClose
      role: result
      type: IList<string>
    - name: gapsMm
      role: result
      type: IDictionary<string, double>
    - name: judgedBy
      # Which rule judged each pair, reported so a wrong threshold is visible
      # rather than buried. Filled in for compliant pairs too, so it must
      # never read as a finding (D-52).
      role: accounting
      type: IDictionary<string, string>
    - name: pairsChecked
      # How many pairs were examined. A count of work DONE, not of things
      # found - the evidence it ran, which is the opposite of a reason to
      # doubt it (D-52).
      role: accounting
      type: int
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then the links' own lines. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75). Since 2026-10-09 a Fire
      # Rating two parameters share reads NOT READ there, never either
      # value (D-54 s3, FRAGMENT-ISSUES 5b-203).
      role: accounting
      type: IList<string>


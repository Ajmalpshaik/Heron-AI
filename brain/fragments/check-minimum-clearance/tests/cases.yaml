# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: >
      a duct with FOUR services inside its clearance zone, defaultClearance
      100 mm
    expect: >
      FOUR pairs reported, not one. This is the whole difference from a nearest
      search - a report naming the closest of four problems closes none of them

  - given: a rules table naming a tighter clearance for one category
    expect: >
      pairs in that category judged by it, and judgedBy naming the rule. Check
      one pair's gap against the Measure tool in Revit

  # D-59, added 2026-09-28 with version 2. NOT RUN.
  - given: >
      a duct 30 mm from a wall of the architectural link, defaultClearance
      50, rules "Walls=100", includeLinks true
    expect: >
      `tooClose` unchanged from the host-only run; the duct's line in
      `linkedMatches` reads about 30 mm, needs 100 mm (Walls), naming the
      linked wall - checked with a dimension in section

  # VERSION 3, added 2026-11-01 with the merge of CHECK_INSULATION_CLEARANCE.
  # NONE OF THESE HAS BEEN RUN.
  - given: >
      two bare pipes 120 mm apart with NO insulation modelled, defaultClearance
      100, assumeThicknessMm 50, includeInsulation false
    expect: >
      reported TOO CLOSE at 20 mm, the row saying "[ASSUMED lagging - not
      modelled]", bareCount 2, insulatedCount 0, and the finding that the
      assumed thickness turned insulation on. Version 2 took no assumed
      thickness and passed the pair at 120 mm

  - given: >
      one set of 10 ducts handed in as both elements and targets,
      defaultClearance 100
    expect: >
      each pair too close ONCE - `violations` and `tooClose` count A to B, never
      B to A as well - and `pairsChecked` 45, not 90. Version 2 measured and
      reported every pair twice

  - given: a run with 120 pairs too close, maxRows 20
    expect: >
      20 rows in `findings` and "... 100 further pair(s) not listed - the count
      above is complete", `violations` 120

  # VERSION 5, added 2026-11-26 with the merge of CHECK_VERTICAL_CLEARANCE (row
  # 5b-1878 (A), issue #1088) and D-208. NONE OF THESE HAS BEEN RUN - NEEDS-CHECKING
  # Group QY. Each FAILS on version 4, which had no stackedOnly and no overlapAs.
  - given: >
      a duct with a sprinkler main 90 mm below it in section, the two
      overlapping in plan, defaultClearance 150, stackedOnly true
    expect: >
      one row naming the duct first, "is ABOVE" the main, bare vertical gap
      about 90 mm, "60 mm short" - CHECKED against a section, because which
      one is on top is half the answer. Version 4 has no row that says which
      is on top

  - given: >
      one duct with a pipe 40 mm under it and a second pipe beside it 60 mm
      off in plan at the same height as the first, defaultClearance 100, run
      once with stackedOnly false and once true
    expect: >
      false: both pipes reported against the duct, the side one at about 60 mm.
      true: ONE row, the pipe under it, REAL GAP about 40 mm against 100,
      the duct named as above it; the side pipe passed over and counted. The
      same vertical gap both ways - for a stacked pair the box gap already is
      the vertical gap - and only stackedOnly leaves the side pair out

  - given: >
      two ducts whose boxes interpenetrate by 30 mm in height, defaultClearance
      0, overlapAs left out
    expect: >
      reported TOO CLOSE as "CLASH: ... overlap by 30 mm", `clashing` 1,
      `overlapsMm` 30 for that pair, `gapsMm` 0 - never a negative number - and
      the findings line saying it was reported as CLASH with the depth. Version
      4 passed the pair: 0 mm against a clearance of 0

  - given: the same two ducts, defaultClearance 100, overlapAs zero
    expect: >
      the version 4 row exactly - "REAL GAP 0 mm against 100 required" - with
      `overlapsMm` empty, `clashing` 1, and the findings line saying overlaps
      were reported as a 0 mm gap, as asked

  - given: >
      a drainage pipe modelled above the duct it has to cross under,
      stackedOnly true, includeLinks true with a linked beam above both
    expect: >
      the host row says the drainage pipe "is ABOVE" the duct; the duct's
      `linkedMatches` line ends ", this one BELOW it" for the beam. The wrong
      order reads as a fact, not as two elevations to compare

negative:
  - given: >
      version 4, Revit 2020 - the seven sheets of P1102 MEP, defaultClearance
      5000 (row 5b-1400)
    expect: >
      tooClose 0, and findings saying 7 elements were skipped, all 7 with no
      model geometry - not checked, never passed. Version 3 reported 21 pairs

  - given: >
      TWO SERVICES 120 mm APART, EACH WITH A 50 mm JACKET, includeInsulation
      true, clearance 100 mm
    expect: >
      reported TOO CLOSE at 20 mm. With includeInsulation false the same pair
      passes at 120 mm. This is the case that decides whether the answer is
      buildable - and both answers are correct for what they measured, which is
      why the flag exists

  # VERSION 5 (D-208): `gapsMm` still reads 0 here, never negative, in both
  # modes; with overlapAs clash - the default - the pair is ALSO said CLASH
  # with the depth in `overlapsMm`, and with overlapAs zero it reads exactly as
  # below.
  - given: two elements whose insulation already OVERLAPS
    expect: >
      a gap of 0, not a negative number. "They are touching" is the finding; a
      negative gap reads as a depth and would be sorted as though it were the
      largest clearance in the report

  - given: an element present in BOTH sets
    expect: >
      it is never paired with itself. A gap of zero against itself would be the
      tightest pair in every report and is meaningless

  - given: two sets with NOTHING closer than the clearance
    expect: >
      tooClose EMPTY and pairsChecked well above zero. An empty result alone
      cannot separate "checked them and they are fine" from "checked nothing" -
      which is why the count is returned

  - given: >
      a ROTATED pair whose boxes overlap while the elements do not
    expect: >
      reported too close, AND THAT IS THE STATED LIMIT. Boxes are axis-aligned,
      so the error is toward over-reporting - the safe direction for a clearance
      check, and still not a certified figure

  # D-59, added 2026-09-28 with version 2. NONE OF THESE HAS BEEN RUN.
  - given: includeLinks ABSENT, on a model that HAS loaded links
    expect: >
      the same answer as version 1, and linksSearched 0 with the first
      line of linkedMatches reading "Host model only - links not read". The
      switch left out must bind false, not refuse - if the run refuses with
      needs_request_values, the add-in in Revit is older than this change

  - given: includeLinks true on a model with NO links, or with every link unloaded
    expect: >
      linksSearched 0 and "Links asked for, NONE loaded - host only". It must
      NOT read like the absent case: one means there was nothing else to read,
      the other means reload them in Manage Links and ask again

  - given: one linked file placed TWICE, with includeLinks true
    expect: >
      linksSearched 1, not 2 - it counts files, not placements

  - given: a duct 500 mm clear of every linked element, defaultClearance 50, includeLinks true
    expect: >
      each link's line reads "0 pair(s) too close" with a checked count
      beside it - a zero that was looked for

  # Row 5b-203, added 2026-10-09. NOT RUN - it needs a model that carries a
  # duplicated name, and none has been arranged yet.
  - given: >
      a duct 30 mm from a wall of the architectural link whose type carries
      two parameters named Fire Rating - a shared "Fire Rating" bound to Walls
      beside the built-in one - defaultClearance 50, rules "Walls=100",
      includeLinks true
    expect: >
      the duct's line in `linkedMatches` names the wall with "Fire Rating NOT
      READ - 2 parameters share that name", never either rating, and
      `tooClose` is unchanged from the host-only run (row 5b-203)

  # VERSION 3, added 2026-11-01. NONE OF THESE HAS BEEN RUN.
  - given: >
      includeInsulation true over pipes NONE of which carries insulation in
      the model, assumeThicknessMm left out
    expect: >
      the FIRST findings line a WARNING that those give exactly the
      bare-geometry answer, and bareCount equal to the measurable count.
      THE CASE THAT MUST NOT PASS SILENTLY - version 2 read exactly like a
      clean lagged run

  - given: a duct and the fitting on its end, ignoreConnected true
    expect: >
      no pair between them. With ignoreConnected false the pair is reported
      at 0 mm - version 2 always reported it

  - given: an element with no bounding box among those handed in
    expect: >
      "had NO readable extent and were skipped ... not the same as passing"
      in `findings` - version 2 skipped it without a word

  - given: one element handed in as both sets
    expect: >
      "Fewer than two measurable elements, so no pair could be compared" -
      never read as every pair passing

  # VERSION 5, added 2026-11-26 (row 5b-1878 (A), D-208). NOT RUN - Group QY.
  - given: >
      two services that overlap in height but pass at different plan
      positions, stackedOnly true, defaultClearance 5000
    expect: >
      NOT reported - violations 0, clashing 0, and "1 pair(s) passed over: not
      one above the other in plan". THE FIRST stackedOnly CASE TO RUN. A
      version that judges every pair buries the stacked ones in a report
      nobody reads; with stackedOnly false the same pair IS reported

  - given: a vertical riser among the services, stackedOnly true
    expect: >
      `slopedOrVertical` counts it once and the warning says any vertical gap
      to it is smaller than the truth - never a TIGHT row left unexplained.
      With stackedOnly false `slopedOrVertical` is 0

  - given: overlapAs "deep" - a word it does not read
    expect: >
      NOTHING WAS MEASURED, the first findings line naming the word and the
      two it reads; `tooClose`, `overlapsMm` and `clashing` empty or 0;
      `linkedMatches` "Links NOT read". Never a guess at clash or zero

  - given: >
      the seven sheets of P1102 MEP again, stackedOnly true, overlapAs clash
      (the default), defaultClearance 5000
    expect: >
      tooClose 0, clashing 0, overlapsMm empty - an overlap cannot be made of
      elements with no model geometry. The negative that empties every result
      together (tools/jobs/defect-finders.yaml: a gentler clearance leaves
      `clashing` behind, because an overlap is an overlap whatever is asked)

second_route:
  - >
    measure the pair in Revit with the Measure tool, then check the insulation
    thickness in the type properties and subtract both jackets by hand

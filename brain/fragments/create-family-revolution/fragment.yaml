id: FRG-GEO-039
semantic-identity: "revolve a closed shape about an axis on a family plane, solid or void"
kind: action
domain: revit.families
capability: CREATE_FAMILY_REVOLUTION
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Builds a REVOLVE in the family open in the Family Editor - a closed shape
  turned about an axis that lies on the same plane: a cone, a dome, a knob, a
  flange, a round pipe bend, a ring. Create, Revolve in the Family Editor, with
  the boundary and the axis typed rather than drawn, as a SOLID or a VOID.

  **THE PROFILE IS HALF THE SECTION**, drawn from the axis outwards and wholly
  on one side of it. A profile that crosses its axis, or lies on it, is
  refused here by name - Revit refuses it too, in words nobody can place.

  **THE PROFILE AND THE AXIS ARE WRITTEN THE SAME WAY**, in the plane's own
  two model coordinates, millimetres from the family origin: X,Y on a level or
  a horizontal plane, X,Z on a plane facing front or back, Y,Z on a plane
  facing left or right. Loops `|` between - `circle CX,CY R`,
  `rect X1,Y1 X2,Y2`, `polygon CX,CY R N`, or corners `X,Y; X,Y; arc MX,MY X,Y`
  closed back to the first. The axis is two points, `X1,Y1 X2,Y2`: a vertical
  axis through the family origin, on "Center (Front/Back)", turns the profile
  into a body standing up.

  **THE ANGLES ARE REVIT'S START AND END ANGLE**, in degrees, a full turn
  being 360. Which way a part-turn sweeps is Revit's rule for the plane's
  normal; it is read back in the extent and reported, never predicted.

  **SKETCHED ON THE PLANE ITSELF**, from its element id, so it moves with it.
  Nothing else ties it to the family's planes or parameters.

  **A VOID CUTS NOTHING BY BEING MADE.** Through the API a void in an ordinary
  family cuts a solid only once the two are combined - Revit's Cut Geometry -
  so a void is built and said to cut nothing yet.

  **READ BACK, ALL OR NOTHING.** A full turn about an axis that lies along a
  model axis has a predictable extent - the profile's span along the axis, and
  its furthest reach either side - and the form must read it; a solid must
  hold a volume. Anything else, or any refusal from Revit, fails the call and
  nothing is kept.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # The reference plane or level the profile and the axis are drawn on, by
    # name - usually a vertical one, "Center (Front/Back)".
    - name: workPlane
      type: string
      source: request
    # The half-section, as loops with `|` between - "0,0; 150,0; 150,300;
    # 0,300" beside a vertical axis is a cylinder 300 across. Millimetres, in
    # the plane's two model coordinates.
    - name: profile
      type: string
      source: request
    # The axis it turns about, two points in the same coordinates -
    # "0,0 0,1000".
    - name: axisLine
      type: string
      source: request
    # Start Angle in degrees - 0 for a full turn.
    - name: startDegrees
      type: double
      source: request
    # End Angle in degrees - 360 for a full turn.
    - name: endDegrees
      type: double
      source: request
    # true for a solid, false for a void.
    - name: solid
      type: bool
      source: request
  provides:
    - name: formId
      # The new form's unique id - what a later step names it by.
      role: result
      type: string
    - name: built
      # The form as Revit now holds it: solid or void, the plane, the angles,
      # the axis, its extent on all three axes in millimetres and a solid's
      # volume.
      role: result
      type: string
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing was built, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  `FamilyItemFactory.NewRevolution(isSolid, profile, sketchPlane, axis,
  startAngle, endAngle)` - angles in radians, the axis a Line lying in the
  profile's plane - with `SketchPlane.Create(Document, ElementId)`,
  `Line.CreateBound`, `Arc.Create(end0, end1, pointOnArc)` and
  `Element.UniqueId`, reads the same 2020 through 2027 (the RevitAPI reference
  assemblies and their own XML remarks, read 2026-10-01).

# ROUTING - see SET_FAMILY_CATEGORY for the whole family-building table.
#
#   "make a revolve in the family"               -> here
#   "revolve this profile around the axis"       -> here
#   "array these round a circle"                 -> ARRAY_ELEMENTS_RADIAL,
#                                                   copies, not a turned form

utterances:
  - make a revolve in the family
  - revolve this profile around the axis
  - make a cone with a revolve
  - create a revolved dome in the family
  - make a void revolve
  - turn this half section into a round body

positive:
  - given: >
      a new family from the metric Generic Model template, open in front;
      workPlane "Center (Front/Back)", profile "0,0; 150,0; 150,300; 0,300",
      axisLine "0,0 0,1000", startDegrees 0, endDegrees 360, solid true
    expect: >
      a solid cylinder read back as X -150 to 150, Y -150 to 150, Z 0 to 300
      mm, volume about 21.206 L (pi x 0.15 x 0.15 x 0.3 m) - LOOKED AT in 3D
      as one round body standing on Ref. Level

  - given: >
      the same plane, profile "0,0; 200,0; 0,400" (a triangle against the
      axis), axisLine "0,0 0,1000", 0 to 360, solid true
    expect: >
      a cone 400 across and 400 high, X and Y -200 to 200, Z 0 to 400 mm,
      volume about 16.755 L (pi x 0.2 x 0.2 x 0.4 / 3 m)

  - given: >
      the same plane, profile "1180,748; arc 1212,780 1180,812" (a half-disc
      of radius 32 against the axis), axisLine "1180,0 1180,2000", 0 to 360,
      solid true - the small sphere that was refused on 2026-10-02 because
      the read-back took Revit's tessellated bounding box (5b-277)
    expect: >
      a sphere of radius 32 kept, read back as X 1148 to 1212, Y -32 to 32,
      Z 748 to 812 mm each within 0.56 mm, volume about 0.137 L
      (4/3 x pi x 0.032^3 m) - NOT refused with X 1149.57 to 1210.43

  - given: >
      a plane facing left or right, the tilted axis "-900.0,3100.0
      -2775.0,6347.6" and the turret profile "-900,3100; -696.5,3217.5;
      -1096.5,3910.3; -1035.9,3945.3; -1055.9,3979.9; -1320,3827.4", whose
      last corner is 0.034 mm across the axis (5b-318), 0 to 360, solid true
    expect: >
      built, with a finding that 1 corner was put on the axis, volume about
      150.49 L (pi x (0.305^2 x 0.04 + 0.235^2 x 0.8) m) - NOT refused as
      "has no extent to read back"

negative:
  - given: profile "-100,0; 100,0; 100,300; -100,300" with axisLine "0,0 0,1000"
    expect: refused as crossing its axis, and no form made

  - given: the turret profile above with its last corner 5 mm across the axis,
      "-1324.33,3824.96" - more than the shortest line, so not put on it
    expect: refused as crossing its axis, and no form made

  - given: startDegrees 90 and endDegrees 45
    expect: refused as the end angle not past the start, and no form made

  - given: axisLine "0,0 0,0"
    expect: refused as an axis with no direction, and no form made

  - given: a project in front
    expect: notAFamily true and nothing built anywhere

second_route:
  - >
      Create, Revolve in the Family Editor by hand on the same work plane, with
      the same boundary and axis line and the same angles; the two forms'
      extents and volumes read side by side

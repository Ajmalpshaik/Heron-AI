id: FRG-PAR-016
semantic-identity: "how many of these are in each room, when the elements carry no room parameter to group by"
kind: action
domain: revit.reporting
capability: COUNT_BY_SPATIAL_CONTAINER
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Counts the elements handed in, broken down by which room, MEP space or HVAC
  zone physically CONTAINS each one - decided by testing the element's point
  against the container's own boundary, not by reading a parameter. It changes
  nothing.

  **`GROUP_AND_COUNT` CANNOT DO THIS, AND THE REASON IS NOT A LIMITATION OF THAT
  FRAGMENT.** It groups on a parameter value, which is the right mechanism for
  almost everything. **Most MEP elements have no Room or Space parameter at
  all** - a duct, a fitting or a valve does not know which room
  or space it sits in, and nothing writes it there. Counting the fittings per
  space is this fragment's job for that reason, and not the ductwork measuring
  fragments'. Asking for *"how many diffusers per room"* through a parameter
  lookup returns one enormous group of blanks and looks like an answer.

  **PHASE IS NOT ONE OF THESE, AND IT IS WORTH SAYING WHY NOT.** *"Count by
  phase created"* looks like the same question and is not: phase IS an ordinary
  parameter, so `GROUP_AND_COUNT` already does it, faster and exactly. Only room,
  space and zone need the geometric test, and only those three are offered here.

  **THE ZONE IS ONE HOP FURTHER THAN THE SPACE, AND SAYS SO WHEN IT FAILS.** A
  zone is not tested against directly: the containing space is found first, and
  the zone is the one that space belongs to. So an element can miss for two
  distinct reasons - no space contains it, or the space that does has not been
  put in a zone - and those are reported as two different groups, because they
  are two different jobs for two different people. **Counting these by HVAC zone
  is a READ and it never makes a zone**: a sentence asking how many elements are
  in each hvac zone belongs here, not with the fragment that creates one.

  **THE TEST POINT IS TAKEN AT THE CONTAINER'S OWN HEIGHT, WHICH IS THE WHOLE
  TRICK.** A room's containment test is answered at the room's own level, and a
  diffuser sits at ceiling height - so testing the element's own Z reports
  everything as being in no room. The element's X and Y are used with the
  container's Z. This is the same correction the room and space filters already
  make, reused rather than rediscovered.

  **AN UNPLACED OR UNENCLOSED ROOM IS SKIPPED, NOT ASKED.** A room with no area
  is either not placed or not bounded; its containment test cannot mean
  anything, and asking it anyway is how an element gets filed under a room that
  does not exist on the drawing. The count of those skipped is reported, because
  a model full of them is the real finding.

  **IT IS AN ELEMENT-BY-CONTAINER SWEEP AND THAT COST IS STATED.** Every element
  is tested against every container until one matches. On a large floor with
  many rooms that is real work, and it is the price of an answer no parameter
  carries.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # "room", "space" or "zone". Anything else is refused by name rather than
    # quietly treated as one of them.
    - name: containerKind
      type: string
      source: request
  provides:
    - name: findings
      type: IList<string>
    - name: groupNames
      role: result
      type: IList<string>
    - name: groupCounts
      role: result
      type: IList<int>
    - name: placed
      role: result
      type: int
    - name: unplaced
      # Containers that are unplaced or unbounded. *SKIPPED, NOT ASKED* - a
      # room with no area cannot answer a containment test, and asking anyway
      # is how an element gets filed under a room that is not on the drawing
      # (D-52).
      role: accounting
      type: int


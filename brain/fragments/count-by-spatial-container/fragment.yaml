revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Room.IsPointInRoom`,
  `Space.IsPointInSpace`, `Space.Zone`, `Zone.Name`, `SpatialElement.Area`,
  `Element.get_BoundingBox` and `LocationPoint.Point` are present and unchanged
  2020 through 2027.

  `Room` comes from the architecture namespace and `Space` and `Zone` from the
  mechanical one; the fragment harness imports both. **`Area` is declared on
  `SpatialElement`, not on `Room` or `Space`**, which is why a check that stops
  at the declared type reports it as absent - it is inherited and it is there.

  Containers are found by CATEGORY and then cast, never by `OfClass`, so an
  element type or a room tag cannot arrive where a room is expected.

  No units API is called. The one number compared to zero is an area in Revit's
  internal units, and the comparison is to zero, which needs no conversion.

  No `ElementId` is read as a number.

# TRAP - OBSERVED ELSEWHERE, NOT YET PROVEN HERE. Added 2026-09-23.
#
# "Is it in the room" is a VOLUME test in Revit. Another tool, on real models
# and mostly on Revit 2020, found a device in the ceiling void to be OUTSIDE
# its room's volume. This fragment does not ask the volume question: it tests
# the element's X and Y at the CONTAINER'S OWN HEIGHT (see the purpose), so a
# diffuser in the ceiling void is counted IN the room below it.
#
# Two other fragments ask the volume question, and the three DISAGREE about
# exactly that diffuser: CHECK_ROOM_MEP_COMPLETENESS and FILTER_ELEMENTS_IN_ROOM
# test the element's own point against the room's volume, so where the room
# stops at the ceiling they leave it out. Which answer a job wants is a
# question about the job, and the three are to be settled with evidence, one
# at a time - NOT by picking one here. FRAGMENT-ISSUES 5b-163 records the
# disagreement; NEEDS-CHECKING AD5 is the check on a real model. A note only:
# this fragment is PROVEN and its code is unchanged.

# ROUTING - the same rows are in the fragments named here.
#
#   "how many diffusers in each room"    -> here. The element carries no room
#                                           parameter, so this is a GEOMETRIC
#                                           test, not a lookup
#   "count these by space"               -> here
#   "count these by zone"                -> here. Via the containing space - a
#                                           zone is not tested against directly
#   "count these by system name"         -> GROUP_AND_COUNT. That IS a parameter,
#                                           and the lookup is faster and exact
#   "count these by phase created"       -> GROUP_AND_COUNT. Phase is an ordinary
#                                           parameter and does NOT need this
#   "which of these are in this room"    -> FILTER_ELEMENTS_IN_ROOM - the SET,
#                                           for one room. This gives the counts
#                                           for all of them
#   "how many are there"                 -> COUNT_ELEMENTS
#   "total the length per group"         -> SUM_BY_GROUP - a measured quantity
#                                           rather than a count
#   "which rooms are missing services"   -> CHECK_ROOM_MEP_COMPLETENESS
#   "how many diffusers in here"         -> FILTER_ELEMENTS_IN_ROOM. "IN HERE"
#                                           NAMES ONE ROOM; this fragment answers
#                                           the same question for every room at
#                                           once. Ranking put this one first on
#                                           2026-09-06 and that is the wrong way
#                                           round
#   "count these by hvac zone"           -> here. Ranked SECOND on 2026-09-06
#                                           behind CREATE_HVAC_ZONE, which MAKES
#                                           a zone. A counting sentence must not
#                                           reach a fragment that creates one

# MEASURED AND FIXED 2026-09-06. The two collisions recorded above were still
# live, and two more were found with them. Ranks are the fragment's own position
# for that sentence, before -> after:
#
#   "count the fittings per space"        6 -> 1  (lost to MEASURE_FITTING_AREA,
#                                                  which weighs sheet metal, and
#                                                  to PLACE_ROOMS, which CREATES
#                                                  rooms - a write for a count)
#   "how many fittings are in each room"  2 -> 1
#   "count these by hvac zone"            2 -> 1  (lost to CREATE_HVAC_ZONE)
#   "how many fittings in here"          99 -> 1  in FILTER_ELEMENTS_IN_ROOM,
#                                                  where it belongs - "in here"
#                                                  names ONE room
#
# THE NOUN WAS DOING THE ROUTING, NOT THE VERB. "fittings" appears in three of
# MEASURE_FITTING_AREA's utterances, so any sentence carrying it was pulled into
# the ductwork cluster and the counting verb could not pull it back.
#
# Fixed by ADDING utterances here and one true sentence to the purpose - nothing
# was taken away from MEASURE_FITTING_AREA or CREATE_HVAC_ZONE, whose own
# sentences were re-measured and still win. Weakening a competitor's utterance to
# buy back a rank is never the answer; see brain/retrieval-history.md.
#
# Two rounds had to be UNDONE on the way, and both failed the same way: text
# added here that carried the other fragment's words ("per room", "in this room")
# stole its sentences. A fragment must be strengthened on its OWN ground.

utterances:
  - how many diffusers are in each room
  - count these elements by room
  - count these by space
  - count these by hvac zone
  - break this count down per room
  - how many of these per space
  - which room is each of these in, as a count
  - count the fittings per space
  - how many fittings are in each room
  - how many of these in each hvac zone
  - count the elements in each zone

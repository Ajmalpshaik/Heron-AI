    [Not Displayed, leave, leave, ...], created 0, existing 8 item(s) [Show Previous Phase,
    Show Previous + New, Show Previous + Demo, ...], findings 2 item(s) [NOTHING WAS MADE:
    A phase filter named "Show Complete" is al..., The phase filters in this project: "Show
    Previous Phase", "S...], lines 0 item(s), name Show Complete, phaseFilterId (null), problems
    1 item(s) [A phase filter named "Show Complete" is already in this proj...], squash Func`2,

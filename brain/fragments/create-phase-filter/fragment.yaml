    Demolished, ...], statusReport , wanted 4 item(s) [DontShow, (null), (null), ...], word
    Func`2. inputs came filterName as given; newDisplay as given; existingDisplay not given
    - "leave", the card''s own default (optional); demolishedDisplay not given - "leave",
    the card''s own default (optional); temporaryDisplay not given - "leave", the card''s
    own default (optional). on P1102 MEP'
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: ded1855527ff33f2

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. PhaseFilter.Create(Document, string),
  PhaseFilter.SetPhaseStatusPresentation and GetPhaseStatusPresentation,
  ElementOnPhaseStatus (New, Existing, Demolished, Temporary) and
  PhaseStatusPresentation (DontShow, ShowByCategory, ShowOverriden - Revit's
  own spelling) and NamingUtils.IsValidName are present and unchanged 2020
  through 2027 - read with tools/api-surface on 2026-10-31. Ids are carried as
  ElementId and never read as numbers.

# ROUTING - repeated in REPORT_PHASE_FILTERS and SET_VIEW_PROPERTIES.
#
#   "create a phase filter called As-Built"     -> here
#   "what phase filters are there"              -> REPORT_PHASE_FILTERS
#   "put the As-Built filter on these views"    -> SET_VIEW_PROPERTIES - this one
#                                                  makes the filter, that one
#                                                  puts it on views
#   "create a new phase"                        -> NOTHING HERE CAN - no API
#                                                  makes a phase (REPORT_PHASES'
#                                                  card). Manage, Phases
#   "set the phase graphic overrides"           -> NOTHING HERE CAN, on any
#                                                  release - the Graphic
#                                                  Overrides tab of Manage,
#                                                  Phasing (lines, patterns,
#                                                  halftone, material per
#                                                  status) has no API. Set it
#                                                  by hand. Row 5b-1350
#   "make a view filter for the fire dampers"   -> CREATE_VIEW_FILTER
#   "what is the phase called"                  -> REPORT_PHASES - a question,
#                                                  never this write. This card
#                                                  ranked next to it on the
#                                                  model backend, 2026-10-31;
#                                                  REPORT_PHASES declares it,
#                                                  so it resolves there

utterances:
  - create a phase filter called As-Built
  - make a new phase filter
  - add a phase filter that hides demolished
  - new phase filter showing existing by category and new overridden

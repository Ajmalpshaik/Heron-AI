revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `LocationCurve`, `Line.CreateBound`,
  `Line.Direction` and `Curve.GetEndPoint` are present 2020 through 2027,
  compiled at both ends. The corner is plain arithmetic on XYZ - no units API,
  no geometry service, nothing that changed shape at 2021.

# TRAP - OBSERVED ELSEWHERE, NOT YET PROVEN HERE. Added 2026-09-23.
#
# Another tool, on real models and mostly on Revit 2020, saw a rewritten run
# curve DELETE the takeoffs on that run and leave their branches orphaned -
# while the terminal at the end of each branch still read as connected,
# because it is joined to its own branch and the branch no longer reaches the
# main. This fragment rewrites the curve of both elements it is given. Its
# report already says a connection at a MOVED END is broken; a takeoff part
# way along a trimmed run is a different thing, and the report does not look
# for it.
#
# Not reproduced here. A NOTE ONLY - the fragment is PROVEN, and a change to
# its code would make the proof stale. After squaring off a run that carries
# takeoffs, look at each takeoff before trusting the report, and do not take a
# terminal reading "connected" as the answer. NEEDS-CHECKING AD3.

# ROUTING - repeated in PLACE_MEP_FITTING, MOVE_ELEMENTS and FILLET_LINES.
#
#   "make these two meet"            -> here
#   "trim these back to the corner"  -> here
#   "extend this until it hits
#    that one"                       -> here
#   "put an elbow in"                -> PLACE_MEP_FITTING. Run this FIRST so
#                                       the two ends coincide - a fitting needs
#                                       connectors close enough to bridge
#   "round that corner off"          -> FILLET_LINES for drafting lines,
#                                       PLACE_MEP_FITTING for a duct or pipe.
#                                       An MEP corner is rounded by a real
#                                       fitting, not by an arc
#   "move this duct 200 across"      -> MOVE_ELEMENTS - a whole element, not
#                                       one of its ends

utterances:
  - make these two lines meet
  - make these two meet
  - trim these back to the corner
  - extend this line until it meets that one
  - square off these two ducts
  - trim and extend to a corner

    and Revit reported the transaction group ROLLED BACK afterwards. returned corner XYZ,
    findings 2 item(s) [Corner solved at (19.685, 39.37) in feet. 2 of 2 element(s) ..., Any
    MEP connection at a moved end is now broken - Revit does...], moved 2. inputs came elements
    from the selection (2). on test projject
  negative_case: run with minMm=2000,-1000,-1000, maxMm=6000,7000,4000, exact=false, categories=Walls

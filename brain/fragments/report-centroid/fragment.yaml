id: FRG-GEO-033
semantic-identity: "where is the middle of this, by volume rather than by its box"
kind: filter
domain: revit.geometry
capability: REPORT_CENTROID
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Reports each element's centroid - the centre of its actual volume - and the
  combined centroid of the whole set.

  **`REPORT_BOUNDING_BOX` GIVES THE BOX AND THAT IS A DIFFERENT NUMBER.** The
  centre of an axis-aligned box is not the centre of the thing inside it, and for
  anything L-shaped, sloped or rotated the two are far apart - the box's centre
  can sit in fresh air outside the element entirely. Measured 2026-09-18, the only
  centroid in the whole library is computed inside `CENTER_ROOM_TAGS` for tag
  placement and never handed back.

  **THE COMBINED CENTROID IS WEIGHTED BY VOLUME, NOT BY COUNT.** Averaging the
  centroids treats a bolt and a beam as equals and gives an answer that is not the
  centre of anything. Weighting by volume is what makes it a centre of mass for a
  set of the same material - and because it is only that when the material is the
  same, the finding says so rather than letting somebody read it as one.

  **AN ELEMENT WITH NO SOLID IS COUNTED, NOT GUESSED AT.** Annotation, most
  analytical elements and an unplaced room have no volume, so they have no
  centroid; giving them their bounding box centre instead would quietly mix two
  different measurements in one answer.

  ASSUMES NOTHING ABOUT TRANSACTIONS - it opens none and needs none.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
  provides:
    - name: centroidOf
      role: result
      type: IDictionary<ElementId, XYZ>
    - name: combined
      role: result
      type: XYZ
    - name: noSolid
      # No solid geometry, so no centroid exists. Given and unusable, never a
      # thing it measured (D-52).
      role: accounting
      type: IList<ElementId>
    - name: findings
      type: IList<string>


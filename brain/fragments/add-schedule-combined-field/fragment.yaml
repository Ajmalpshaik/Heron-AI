tests: tests/

compatibility-note: >
  One implementation for every release. The schedulable-field list, the
  combined-parameter data and the insert call are unchanged 2020 to 2027.
  Version 2 adds `ScheduleField.IsCombinedParameterField`,
  `GetCombinedParameters`, `SetCombinedParameters`,
  `ScheduleDefinition.IsValidCombinedParameters`, `GetFieldIndex` and
  `SetFieldOrder` - each read off the shipped assemblies for 2020 to 2027 on
  2026-10-21 (`tools/api-surface --members`) and present and unchanged on all
  eight, so no release is refused and no `#if` is needed.
  Formula-based calculated values are NOT used here: they have no public API on
  the older releases in this range, and a fragment that worked on half of them
  would be a version-shaped hole that reads as green.

# ROUTING - the same rows are in the fragments named here.
#
#   "one column with the type and the    -> here
#    mark together"
#   "join these two columns"             -> here
#   "a column that calculates something" -> NOT here. A combined field joins
#                                           text; arithmetic is a calculated
#                                           value, a different mechanism with
#                                           no public API across this whole
#                                           release range
#   "edit the size column to use width   -> here, VERSION 2, with
#    x height"                              editExisting - the column is
#                                           rebuilt where it stands
#   "change what the combined column is  -> here, VERSION 2, editExisting
#    made of"
#   "move this column after Equipment    -> here, VERSION 2, editExisting
#    Tag"                                   with position and no parts. No
#                                           other tool reorders columns
#   "what is the size column made of"    -> REPORT_SCHEDULE_DEFINITION - a
#                                           question, never this write
#   "add a column"                       -> ADD_SCHEDULE_FIELDS, for a plain
#                                           parameter
#   "rename the heading"                 -> SET_SCHEDULE_APPEARANCE
#   "what fields does this schedule      -> REPORT_SCHEDULE_DEFINITION, which
#    have"                                  is where the exact names come from

utterances:
  - one column with the type and the mark together
  - join two parameters into one column
  - combine these fields in the schedule
  - add a combined parameter column
  - join these two columns
  - edit the size column to use width x height
  - change what the combined column is made of
  - move this column after Equipment Tag

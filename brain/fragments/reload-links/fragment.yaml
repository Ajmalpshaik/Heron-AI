id: FRG-DOC-013
semantic-identity: "reload the links so i have the latest from the other team"
kind: action
domain: revit.document
capability: RELOAD_LINKS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Reloads - or unloads - the linked models behind the link instances handed in.
  Reloading pulls in whatever the other discipline last saved, which is the
  first thing anybody does before coordinating.

  **It never REMOVES a link.** Unload drops it from memory and from every view,
  and it comes back with one click. Removing deletes it from the project along
  with anything hosted on it, and that belongs behind a deliberate delete, not
  behind a word that sounds similar.

  **One file shared by three instances reloads once.** The work is on the link
  TYPE, so the instances are reduced to their distinct types first - otherwise
  the same file is read from disk three times and the report says three.

  **It reads from the path Revit already has**, which is what makes it safe: it
  cannot point a link at a different file. Repathing a link is a different job
  and a bigger decision.

  **Revit's own result code is reported for every link, raw.** Which code comes
  back for a link that was already current is NOT settled here - the earlier
  library recorded that honestly and it stays honest. Printing what Revit
  actually returns is how the first real run answers it, instead of a guess
  hardening into a fact.

  **This is document management, not a model edit**, and whether Revit permits
  it inside an open transaction is UNPROVEN. It opens none itself (Golden Rule
  16). If the host's write path wraps it in one and Revit refuses, that is the
  finding, and it is the first thing to check against a real model.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # false reloads, true unloads. Asked for, because they are opposite
    # intentions and one of them makes the drawing go blank.
    - name: unload
      type: bool
      source: request
  provides:
    - name: findings
      type: IList<string>
    - name: done
      role: result
      type: int
    - name: notLinks
      # Handed in but not linked models, so there was nothing here to act on.
      # A count of what it was GIVEN and could not use, never a thing it found
      # (D-52).
      role: accounting
      type: IList<ElementId>


compatibility-note: >
  One implementation for every release. `RevitLinkType.Reload()` takes no
  arguments and `Unload()` takes one - a monitor, which may be null - on 2020 and
  on 2027 alike, read off the reference assemblies at both ends rather than
  remembered. `LinkLoadResultType` carries the same thirteen values across the
  range; `LinkNotNeeded` is NOT one of them and never was, which is what stopped
  the earlier library's version compiling at all.

# ROUTING - repeated in LIST_LINKED_MODELS and REPORT_EXTERNAL_REFERENCES.
#
#   "reload the links"               -> here
#   "get the latest architecture"    -> here
#   "unload this link"               -> here, with unload asked for
#   "what links are in this model"   -> LIST_LINKED_MODELS - a READ
#   "what does this model depend on" -> REPORT_EXTERNAL_REFERENCES
#   "delete this link"               -> NOTHING HERE DOES THAT. Removing a link
#                                       deletes anything hosted on it and is a
#                                       deliberate delete, not an unload
#   "copy these out of the link"     -> COPY_ELEMENTS_BETWEEN_DOCUMENTS, fromLink=true
#                                       - and the copies it
#                                       makes do NOT update when this reloads
#   "unload this link"                   -> here, unload true - it was
#                                           UNLOAD_LINKS' too, merged in
#   "the model is slow with the links    -> here, unload true
#    in"
#   "remove the link completely"         -> DELETE_ELEMENTS on the link type.
#                                           Removing loses its position and
#                                           anything hosted on it
#
# VERSION 2 (2026-11-01) - UNLOAD_LINKS WAS MERGED INTO THIS CARD on the
# owner's instruction in conversation: "make sure there is no duplicate
# tools", every conflict to keep the SAFER rule. It is DEPRECATED. The same
# job - this card already unloaded with `unload` true, on link types, never
# removing - and the one other cards and the client already point at. Where
# each retired output is now:
#
#   UNLOAD_LINKS                        here, unload true
#     elements                          elements - instances or types
#     unloaded                          unloaded, read back through IsLoaded
#     alreadyUnloaded                   alreadyUnloaded - skipped, said
#     notALink                          notLinks
#     refused                           refused - and a reload Revit threw on
#
# THE SAFER RULE WHERE THEY DIFFERED. UNLOAD_LINKS unloaded with no switch;
# here `unload` is still ASKED FOR, never assumed, because reloading and
# unloading are opposite intentions and one of them makes the drawing go
# blank. Version 1's unload here counted the call returning as done;
# UNLOAD_LINKS' read-back is kept.


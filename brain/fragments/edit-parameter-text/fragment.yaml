revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. The parameter is found by name through
  the ordinary lookup, and only text-storage parameters are touched - a number
  has no meaningful prefix, and forcing one through the string setter is how a
  numeric parameter ends up unreadable. Nothing here depends on a units API,
  which is what breaks at 2021.

# ROUTING - the same rows are in the fragments named here.
#
#   "put AJ_ in front of the mark"      -> here
#   "change SUP to SUPPLY in the        -> here
#    comments"
#   "set the comments to X on all of    -> WRITE_ELEMENT_PARAMETERS - one
#    them"                                 fixed value for every element, which
#                                          overwrites what is there
#   "rename these elements"             -> RENAME_ELEMENTS. An element's NAME
#                                          is not a parameter write and maps to
#                                          different things per category
#   "rename the family"                 -> RENAME_FAMILY
#   "number them 1, 2, 3 along the run" -> RENUMBER_SEQUENTIAL
#   "clear the parameter"               -> REMOVE_PARAMETER_VALUE
#   "copy this parameter into that one" -> COPY_PARAMETER_VALUE
#   "change the text in a text note"    -> EDIT_TEXT_VALUES, which is
#                                          annotation, not a parameter
#   "filter out the ones with no mark"   -> SET_SCHEDULE_FILTERS to change
#                                           what a schedule shows, or
#                                           DESCRIBE_BLANK_PARAMETERS to find
#                                           them. Neither is a text edit

utterances:
  - add a prefix to the mark
  - put AJ in front of every comment
  - change SUP to SUPPLY in the parameter
  - add a suffix to the type mark
  - find and replace inside the comments
  - edit the text in this parameter without retyping it

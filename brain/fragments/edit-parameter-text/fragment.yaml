id: FRG-PAR-018
semantic-identity: "put a prefix on the mark, or change a word inside it, without retyping the whole value"
kind: action
domain: revit.parameters
capability: EDIT_PARAMETER_TEXT
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Edits the text ALREADY IN a named parameter across a set of elements - adds a
  prefix, adds a suffix, or replaces a piece of text inside it - rather than
  overwriting it with one fixed value.

  **THAT IS THE SHAPE THE JOB ALMOST ALWAYS TAKES.** *"Put AJ_ in front of the
  mark on all of them"* and *"change SUP to SUPPLY in the comments"* keep the
  value that is already there and change part of it. A fragment that only wrote
  a whole value would set forty elements to one identical string, which is a
  different job - `WRITE_ELEMENT_PARAMETERS` - and destroys what was there.

  **RE-RUNNING IT MUST NOT STACK.** A prefix already on the value is not added
  again, so running the same edit twice leaves `AJ_M-01` rather than
  `AJ_AJ_M-01`. Batch jobs get re-run - after an undo, after a filter is
  widened, after somebody is not sure whether it took - and stacking is the
  failure that makes the second run worse than the first.

  **A TYPE PARAMETER REACHES BEYOND THE SET IT WAS GIVEN, AND THAT IS
  REPORTED.** Where the name is not an instance parameter, the element's TYPE
  is asked - which is where Type Mark, Manufacturer and Model live. Editing it
  changes every instance of that type in the project, including ones nobody
  selected. Each type is edited once however many instances resolved to it, and
  the types touched are named, so the reach is visible rather than discovered
  later.

  **IT REPORTS WHAT LANDED, NOT WHAT WAS ASKED FOR.** Every value is read back
  after writing and compared with what was intended; anything that did not take
  is refused rather than counted. A parameter can be read-only, driven by a
  formula, or owned by somebody else on a workshared model, and each of those
  accepts the call and keeps its old value.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16), so a
  batch is one undo entry.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: parameterName
      type: string
      source: request
    # Empty means "not this one". All three can be asked for at once; the
    # replace happens first, then the prefix, then the suffix.
    - name: find
      type: string
      source: request
    - name: replaceWith
      type: string
      source: request
    - name: prefix
      type: string
      source: request
    - name: suffix
      type: string
      source: request
  provides:
    - name: edited
      role: result
      type: int
    - name: typesEdited
      role: result
      type: IList<ElementId>
    - name: unchanged
      # Elements whose value did not move - already carrying the prefix, or
      # the write did not take. Never an edit it made (D-52).
      role: accounting
      type: IList<ElementId>
    - name: absent
      # Elements not carrying the parameter on the instance or the type. Given
      # and unusable, never an edit it made (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>


compatibility-note: >
  One implementation for every release. Asking an end which extent type it uses
  in a view, and setting it back to the shared one, are both on the shared
  datum type and unchanged 2020 to 2027 - and neither needs the datum's curve,
  which only a grid has.

# ROUTING - the same rows are in the fragments named here.
#
#   "the grid is short in this view      -> here
#    only"
#   "someone dragged the grid ends"      -> here
#   "the grids only go half way"         -> MAXIMIZE_DATUM_EXTENTS, which
#                                           lengthens the SHARED extent. Run
#                                           this first where a view overrides
#                                           it, or that fix shows nothing there
#   "the bubbles are on the wrong side"  -> SET_DATUM_BUBBLES, which is per
#                                           view and per end and is a different
#                                           property entirely
#   "list the grids"                     -> LIST_GRIDS


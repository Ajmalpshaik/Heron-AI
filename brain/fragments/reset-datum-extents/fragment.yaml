id: FRG-ELE-049
semantic-identity: "somebody dragged a grid end and now it is short in this view only"
kind: action
domain: revit.datums
capability: RESET_DATUM_EXTENTS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Puts grids and levels back on their shared 3D extent in the views given,
  throwing away the per-view override somebody made by dragging an end.

  **IT IS THE OTHER HALF OF MAXIMIZING THE EXTENTS.** A datum end that was
  dragged short in a view keeps its own extent there, and it OVERRIDES the
  shared one - so maximizing the grids changes nothing in exactly the view
  somebody is looking at, and the fix reads as broken. This clears the override
  so the shared length comes through.

  **IT LOOKS LIKE A PER-VIEW CHANGE AND IT IS NOT ONLY THAT.** Handing an end
  back to the shared extent means the line moves in the view being looked at
  AND stops being independent there ever after. That is the point of it, and it
  is why this is a bulk change worth stating in numbers - how many datums, in
  how many views - before it is run.

  **AN END ALREADY ON THE SHARED EXTENT IS NOT A CHANGE.** Counting those would
  report every grid reset on a set where nothing was overridden, and the count
  is what somebody checks the drawings against.

  Both ends are handled separately, because only one is usually dragged.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: views
      type: IList<View>
      source: request
  provides:
    - name: endsReset
      role: result
      type: int
    - name: datumsChanged
      role: result
      type: IList<ElementId>
    - name: alreadyShared
      # Elements that were ALREADY in the state asked for, so there was
      # nothing to do. The evidence it looked, never a change it made
      # (D-52).
      role: accounting
      type: IList<ElementId>
    - name: notADatum
      # Handed in but not a grid or a level, so there was nothing here to act
      # on. A count of what it was GIVEN and could not use, never a thing it
      # found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>


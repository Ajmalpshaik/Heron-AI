positive:
  - given: three plan views exported at 1920 px into an empty folder
    expect: >
      three PNG files in it, each 1920 px wide. Open one - the width is the
      setting working, and the content is the view

  - given: a sheet exported
    expect: >
      the whole sheet including its title block, not just the viewport. A sheet
      is a view and it exports as one

  - given: the same export run twice into the same folder
    expect: >
      Revit's own overwrite behaviour, whatever it is, and the folder reported
      both times. This fragment does not manage the files it wrote

  - given: >
      version 2 - one 3D view exported with fileType JPG and dpi 300 and no
      pixelWidth, into an empty scratch folder
    expect: >
      exported 1, filesWritten 1, and fileReport naming one .jpg with its pixel
      size - Revit's Zoom to 100% at 300 DPI. Open it: a JPEG
  - given: version 2 - the same view with fileType TIFF, pixelWidth 1200
    expect: filesWritten 1, a .tif 1200 px wide (its size is not read from the header)

negative:
  - given: a view template among the views
    expect: >
      it NAMED as not exportable, and the other views still exported. THIS IS
      THE FIRST CASE TO RUN. A folder with two files where three views were
      asked for, and nothing saying which is missing, is the failure - and it
      looks exactly like success

  - given: a folder path that cannot be written to
    expect: >
      the failure reported with the path, and no claim that anything was
      written

  - given: nothing exportable at all
    expect: >
      said in words, with the unexportable views named. Not a silent zero

  - given: the exact filenames predicted from the prefix
    expect: >
      no such prediction in the report. Revit builds the names; version 2 lists
      only what it read off the folder after the export

  - given: version 2 - fileType "webp"
    expect: >
      exported 0, filesWritten 0, a finding naming PNG, JPG, TIFF, BMP and TGA,
      and nothing in the folder
  - given: version 2 - dpi 400
    expect: exported 0, the finding naming 72, 150, 300 and 600, nothing written

second_route: >
  Open the folder and count the files, then open one and check its pixel width
  in any image viewer. The count against the view list is the check that catches
  a silently dropped view

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `ImageExportOptions`, `ExportRange`,
  `ImageFileType`, `ZoomFitType`, `FitDirectionType`, `View.CanBePrinted` and
  `Document.ExportImage` are present 2020 through 2027, compiled at both ends.
  Version 2 adds `ImageExportOptions.ImageResolution` and `Zoom`, `ImageResolution`
  (DPI_72, DPI_150, DPI_300, DPI_600) and `ImageFileType`'s BMP, JPEGLossless,
  JPEGMedium, JPEGSmallest, TARGA and TIFF - read off the shipped reference
  assemblies of 2020 through 2027 on 2026-10-20, alike on every release. The
  files are read back with System.IO alone.

# ROUTING - repeated in EXPORT_SHEETS_TO_PDF and EXPORT_VIEWS_TO_DWG.
#
#   "save these views as pictures"   -> here
#   "export a png of this sheet"     -> here
#   "send them an image of the plan" -> here
#   "save this view as a jpg at 300 dpi" -> here, version 2
#   "render this view"               -> OPEN_RENDER_DIALOG. An export is the
#                                       view as Revit draws it on screen; a
#                                       render is the Raytracer's, and no API
#                                       runs that
#   "export these sheets to pdf"     -> EXPORT_SHEETS_TO_PDF - the format
#                                       somebody issues drawings in
#   "export to dwg"                  -> EXPORT_VIEWS_TO_DWG - the format
#                                       somebody else opens in CAD
#   "print these"                    -> not a fragment. Printing is a machine
#                                       and a queue, and neither belongs here

utterances:
  - save these views as pictures
  - export a png of this sheet
  - send them an image of the plan
  - export view images
  - save this view as an image
  - export this sheet as a jpeg at 300 dpi
  - save these views as tiff images

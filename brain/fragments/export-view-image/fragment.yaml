id: FRG-VIEW-073
semantic-identity: "save these views out as pictures"
kind: action
domain: revit.export
capability: EXPORT_VIEW_IMAGE
version: 2
source: OFFICIAL
risk: PUBLISH

# VERSION 2 (2026-10-20) - the rendering tools' widening, on the owner's word
# ("for the rendering ... all the part should be covered"). Three OPTIONAL
# inputs, so a version 1 call runs exactly as before: `fileType` (PNG as
# before, JPG - JPEG lossless, or JPEG Medium / Smallest - TIFF, BMP or TGA),
# `dpi` (72, 150, 300 or 600 - Revit's ImageResolution), and `pixelWidth` is
# now optional: with a DPI and no width the image is Revit's "Zoom to 100%" at
# that DPI. And the files are READ BACK: what carries the prefix and was
# written by this run is listed from the folder - name, pixel size out of the
# file's own header, size - in `fileReport`, counted in `filesWritten`.
# Version 1's proof no longer describes the code, so it is kept below as a
# record and the card is DRAFT until it is proved again (D-30) - D-117 refuses
# a kept export from it until then.

purpose: >
  Writes views and sheets out as PNG, JPG, TIFF, BMP or TGA images at a chosen
  width or DPI - the "send them a picture of this" job, done at a real
  resolution instead of a screenshot of whatever the screen happened to show.

  **It writes files onto a disk, which is why it is PUBLISH and not MODIFY.**
  An export leaves the model alone and puts something where other people can
  find it, and that is a higher bar than changing a duct. The folder is reported
  back because somebody has to be told where their drawings went.

  **Revit names the files itself and this does not pretend otherwise.** The
  prefix given is a stem; Revit appends the view type and the view name to it.
  So the filenames are never predicted: the folder is read afterwards and the
  files this run wrote are listed from it, with their pixel sizes.

  **A view that cannot be printed is not exported, and is named.** Templates,
  and some view types, cannot go to an image at all. Silently dropping them
  gives a folder with fewer files than views and nothing saying which are
  missing.

  **No transaction, and that is not an oversight.** An export reads the model
  and writes a file; it changes nothing to undo.

contract:
  needs:
    - name: doc
      type: Document
    - name: views
      type: IList<View>
      source: request
    - name: folder
      type: string
      source: request
    - name: filePrefix
      type: string
      source: request
    # Pixels across; left out, 1920 - or, with a DPI, Revit's Zoom to 100%.
    - name: pixelWidth
      type: int
      source: request
      optional: true
      absent: 0
    # PNG, JPG, JPEG Medium, JPEG Smallest, TIFF, BMP or TGA. Version 2.
    - name: fileType
      type: string
      source: request
      optional: true
      absent: png
    # 72, 150, 300 or 600 dots per inch. Version 2.
    - name: dpi
      type: string
      source: request
      optional: true
      absent: keep
  provides:
    - name: exported
      # Views sent to Revit's export - version 1's count, unchanged.
      role: result
      type: int
    - name: filesWritten
      # Files carrying the prefix that this run wrote, read off the folder
      # afterwards. Version 2.
      role: result
      type: int
    - name: fileReport
      # Each file read back - name, pixel size, size - joined by "  ||  ".
      # Evidence beside the counts.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


compatibility-note: >
  One implementation for every release. `ImageExportOptions`, `ExportRange`,
  `ImageFileType`, `ZoomFitType`, `FitDirectionType`, `View.CanBePrinted` and
  `Document.ExportImage` are present 2020 through 2027, compiled at both ends.

# ROUTING - repeated in EXPORT_SHEETS_TO_PDF and EXPORT_VIEWS_TO_DWG.
#
#   "save these views as pictures"   -> here
#   "export a png of this sheet"     -> here
#   "send them an image of the plan" -> here
#   "export these sheets to pdf"     -> EXPORT_SHEETS_TO_PDF - the format
#                                       somebody issues drawings in
#   "export to dwg"                  -> EXPORT_VIEWS_TO_DWG - the format
#                                       somebody else opens in CAD
#   "print these"                    -> not a fragment. Printing is a machine
#                                       and a queue, and neither belongs here

utterances:
  - save these views as pictures
  - export a png of this sheet
  - send them an image of the plan
  - export view images
  - save this view as an image

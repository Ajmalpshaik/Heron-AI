compatibility-note: >
  One implementation for every release. `Opening.BoundaryRect`,
  `Opening.BoundaryCurves`, `Opening.Host` and `Element.get_BoundingBox` are
  present 2020 through 2027 - read off the reference assemblies at both ends.
  `Opening.SketchId` is NOT used: it arrives at 2024 and naming it would break
  the 2020 build for something this audit does not need.

# ROUTING - repeated in CHECK_SLEEVE_SIZE and FIND_CLASHES.
#
#   "which of my openings are wrong now the ducts have moved" -> here
#   "check the openings against the services" -> here
#   "are any of the holes not needed any more" -> here
#   "are the sleeves big enough for the pipes going through" -> CHECK_SLEEVE_SIZE
#                                        - that asks about SIZE; this asks
#                                          whether the hole is still in the
#                                          right place and still needed
#   "what is clashing"                   -> FIND_CLASHES - services against each
#                                          other, not openings against services

utterances:
  - which of my openings are wrong now the ducts have moved
  - check the openings against the services
  - are any of the holes not needed any more
  - audit the mep openings
  - which openings have nothing going through them

id: FRG-QA-020
semantic-identity: "which of the openings already cut are now wrong"
kind: filter
domain: revit.qa
capability: AUDIT_MEP_OPENINGS
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Audits the openings already in the model against the MEP that is in it now.
  Answers the question a revision actually asks - *"the ducts moved, which of my
  openings are wrong?"* - with a status per opening: STALE (nothing runs through
  it any more), COMBINED (more than one service through one hole), UNHOSTED (not
  inside anything), or OK. Read-only.

  **THE TWO KINDS OF "OPENING" ARE NOT THE SAME KIND OF ELEMENT, AND THAT IS THE
  TRAP THIS FRAGMENT IS BUILT AROUND.** A cut void is a Revit `Opening`, which
  has NO SOLID at all - only a boundary and a host. A placed sleeve is a family
  instance, which does. The obvious way to gather openings returns mostly the
  first kind, so an audit written for the second reports "no geometry" for every
  one of them: no crash, no error, and an audit that audited nothing. Both kinds
  are handled, and each row SAYS WHICH ROUTE was used.

  **AN OPENING'S EXTENT IS TAKEN FROM ITS BOUNDARY AND ITS BOUNDING BOX, AND THE
  TWO ARE CROSS-CHECKED.** Where they disagree badly the row reads SUSPECT rather
  than being audited on geometry that may be in the wrong place. The
  documentation for the boundary does not state its coordinate space, so it is
  verified rather than assumed.

  **IT IS NOT CHECK_SLEEVE_SIZE.** That asks whether a hole is the right SIZE for
  what goes through it. This asks whether the hole is still in the right PLACE
  and still needed at all - the two questions a revision separates, and the
  reason creation and checking are different jobs.

  **STRUCTURE IN A LINK IS NOT SCANNED UNLESS ASKED FOR**, so without
  `includeLinks` the hosting question is answered against the host model only
  and says so. On a normal coordination job the walls and slabs are a link,
  which means a clean UNHOSTED count there has checked nothing.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, each opening's centre is looked for inside
  the walls, floors, roofs, ceilings and structural members of every loaded
  link, in each placement's own coordinates, and `linkedMatches` names what
  it sits in - the link, the type, the element's id IN THE LINK and its
  **Fire Rating**, which is what a penetration through the architect's wall
  actually has to answer. `linksSearched` says how many links were read:
  set and 0 means "you asked, and none are loaded". "Sits inside" is a box
  test, so a hole near a corner can name both walls - every candidate is
  listed. **NOTHING FROM A LINK IS EVER SELECTED OR CARRIED** - `stale`,
  `combined` and `unhosted` stay this model's own; the chain revives ids
  against this model, and a linked id that happens to be in use here binds
  an unrelated element (FRAGMENT-ISSUES row 75). Only model elements are
  read from a link, never its views or sheets. Links nested inside a link
  are not read, and are counted in the answer. This is version 2; version
  1's proof no longer describes the code, and the fragment is DRAFT until
  it is proved again.

# A NAME TWO PARAMETERS SHARE IS NEVER READ: a linked element whose Fire Rating
# two parameters carry - a shared or project "Fire Rating" bound beside the
# built-in one, on the element or on the type the lookup falls through to -
# reads "Fire Rating NOT READ - N parameters share that name" in
# `linkedMatches`, never either value (D-54 s3, FRAGMENT-ISSUES 5b-203; added
# 2026-10-09). Written here and not in `purpose`, as on check-sleeve-size's
# card: the purpose is embedded for routing, and on that card's change a
# purpose sentence about this moved other cards' utterances in check-routing,
# measured against d9b27f03 (row 5b-203's 2026-10-09 note). Not measured for
# this card.
contract:
  needs:
    - name: doc
      type: Document
    - name: openings
      type: IList<Element>
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: findings
      type: IList<string>
    - name: stale
      role: result
      type: IList<ElementId>
    - name: combined
      role: result
      type: IList<ElementId>
    - name: unhosted
      role: result
      type: IList<ElementId>
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then the links' own lines. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75). Since 2026-10-09 a Fire
      # Rating two parameters share reads NOT READ there, never either
      # value (D-54 s3, FRAGMENT-ISSUES 5b-203).
      role: accounting
      type: IList<string>


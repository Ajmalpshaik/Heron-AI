positive:
  - given: fifty openings cut for ducts, after the ducts were re-routed
    expect: >
      the moved ones listed STALE and the rest OK - CHECKED by opening one
      reported STALE in a section and confirming the hole is empty, because a
      whole-model verdict is only as good as one row you looked at

  - given: two pipes running through one opening
    expect: >
      COMBINED, naming both. Sometimes intended, so it is a row to confirm with
      the structural engineer rather than a failure

  - given: a mix of cut voids and placed sleeve families
    expect: both audited, each row saying which route was used

  # D-59, added 2026-09-28 with version 2. NOT RUN.
  - given: >
      openings in this MEP model cut through walls that are in the
      architectural link, one of them a 2-hour wall, includeLinks true
    expect: >
      `stale`, `combined` and `unhosted` unchanged from the host-only run;
      each opening's line in `linkedMatches` names the linked wall's type, its
      id in the link and "Fire Rating 2 hr" (or however that link writes it),
      checked by picking the wall in the link with Tab

negative:
  - given: openings gathered by the usual route, which returns mostly cut VOIDS
    expect: >
      every one of them audited. THIS IS THE FIRST CASE TO RUN. A cut void has
      no solid at all, so a version written for family instances reports "no
      geometry" for the whole set - no crash, no error, and an audit that
      audited nothing while looking complete

  - given: a project where the walls and slabs are all in a LINK
    expect: >
      the summary saying structure in links was not scanned, and each unhosted
      row saying the question was not really asked. Otherwise every opening
      reads UNHOSTED and the report is noise

  - given: an opening whose boundary and bounding box disagree by an order of magnitude
    expect: >
      SUSPECT GEOMETRY, and the rest of its row marked untrustworthy. The
      boundary's coordinate space is not documented, so it is verified rather
      than assumed

  - given: an opening with no readable extent at all
    expect: named and skipped, with the rest of the audit completing

  - given: a model with no services at all
    expect: >
      every opening STALE and the service count of zero on the summary line, so
      the cause is visible rather than looking like fifty real faults

  # D-59, added 2026-09-28 with version 2. NONE OF THESE HAS BEEN RUN.
  - given: includeLinks ABSENT, on a model that HAS loaded links
    expect: >
      the same answer as version 1, and linksSearched 0 with the first
      line of linkedMatches reading "Host model only - links not read". The
      switch left out must bind false, not refuse - if the run refuses with
      needs_request_values, the add-in in Revit is older than this change

  - given: includeLinks true on a model with NO links, or with every link unloaded
    expect: >
      linksSearched 0 and "Links asked for, NONE loaded - host only". It must
      NOT read like the absent case: one means there was nothing else to read,
      the other means reload them in Manage Links and ask again

  - given: one linked file placed TWICE, with includeLinks true
    expect: >
      linksSearched 1, not 2 - it counts files, not placements

  - given: an opening in open space, well clear of any linked wall or slab, includeLinks true
    expect: >
      its line reads "inside nothing in any link" - never a wall picked
      because it was the nearest

second_route:
  - Open a 3D view, isolate the openings and the services, and look at one reported STALE hole

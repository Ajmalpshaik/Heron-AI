tests: tests/

compatibility-note: >
  One implementation for every release. `ConnectorManager`, `Connector.Domain`
  and the assigned-value properties are unchanged 2020 to 2027. Values are
  handed on in Revit's internal units without touching a units API, which is
  what keeps this clear of the 2021 units move - and `MEPModel.ConnectorManager`
  is reached through the family instance rather than through any of the
  domain-specific model classes, so one code path serves ducts, pipes and
  electrical alike.

# ROUTING - repeated in CHECK_EQUIPMENT_CONNECTORS.
#
#   "what flow does this connector carry" -> here
#   "are the equipment connectors the right size for the duct" ->
#                                        CHECK_EQUIPMENT_CONNECTORS - whether
#                                        it MATCHES, not what it carries
utterances:
  - what flow is set on these
  - is the airflow filled in
  - check the K factor on the sprinklers
  - which terminals have no flow assigned
  - are the demands set
  - why is the system flow zero

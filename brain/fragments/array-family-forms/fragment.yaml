purpose: >
  REPEATS ONE FORM IN A ROW in the family open in the Family Editor - a
  grille's blades, a radiator's fins, a louvre's slots, a rack's shelves - as a
  linear array: the Family Editor's Array, with its count LABELLED to an
  Integer family parameter when the types must choose how many.

  **A LINKED REVIT ARRAY, the kind COPY_ELEMENTS leaves out on purpose** -
  that tool's loose copies cannot follow a count a type chooses.

  **ONE FORM PER ARRAY** - a second form takes a second call, and both may
  follow one count. Every member becomes a model group, the original included,
  even for one form (measured 2026-10-07, row 5b-358), and `members` names
  those groups.

  **OR ONE NESTED FAMILY** (version 2, 2026-10-07) - a coil spring's turns
  arrayed up. Measured on a scratch family: a level-based nested family
  moved up, its Bottom locked to a plane, arrayed to its LAST member, and that
  copy's Top locked to a second plane - the row re-spaced when the planes
  moved and grew from 3 to 5 with its count. The copies come back IN ORDER
  ALONG THE ROW, the last one last, for LOCK_NESTED_FAMILY_TO_PLANES.
  Proved again 2026-10-07 on scratch SpringProof, signed by Ajmal PS.

  **OR A DETAIL ITEM IN ITS VIEW** (version 4, 2026-11-11) - a view-based
  nested family, such as a diffuser's flow arrow placed in the Ref. Level plan
  by PLACE_DETAIL_COMPONENTS, is arrayed in that view, the one it is drawn in,
  as Array is used on it by hand; where each copy sits is read from its
  insertion point, since Revit gives it no extent outside its view. Its row
  stays in the view's plane: a step out of the view is refused by name.

  **THE COUNT** is a whole number, or an Integer family parameter's name -
  its value in the current type is the count, and the label lets every type
  choose. Revit labels an array only with an Integer parameter; a Yes/No is
  refused by its kind.

  **THE STEP** is an axis and a distance in millimetres: each member that far
  on from the one before - or, ending "last", the last member that far from
  the first and the rest spread evenly between, the one to lock to a plane so
  the spacing follows a length.

  **READ BACK, ALL OR NOTHING**: the count, the label and every copy's place
  are read again. The array's id and the copies' ids come back; copies of a
  void cut nothing until COMBINE_FAMILY_FORMS combines them.

  **A DETAIL ITEM WITH NO VIEW** (row 5b-1574, measured 2026-11-12 on Revit
  2020): nested in a family, Revit places a detail item on a plane and gives it
  no Owner View; arrayed in a 3D view it failed with "An internal error has
  occurred". It is arrayed in the floor plan of the level it stands on, read by
  its insertion point - four arrows 200 mm apart in Ref. Level, read back.

  **A FORM ON A PLANE A PARAMETER MOVES** (version 5, row 5b-1261) is arrayed
  as before, and a finding names the plane and its parameter - and, after the
  array, any form in the row whose work plane now reads not associated - with
  FLEX_FAMILY as the next step. `memberForms` gives each copy's own form.

  **A FORM ALREADY IN AN ARRAY** (version 6, row 5b-1998) is refused before
  anything is tried - every member of an array is a group, so it is read by
  its group: the array that holds it is named with its count, its label and
  its original, and the way on is that array's count, or a form in no array
  or group. A form in a plain model group is refused naming the group.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: uidoc
      type: UIDocument
    # ONE form or ONE nested family, by the id its tool gave back - or
    # `selected`, with it selected alone. Version 4: a nested detail item or
    # annotation too, by the instanceId PLACE_DETAIL_COMPONENTS gave back.
    - name: form
      type: string
      source: request
    # A whole number 2 to 200, or an Integer family parameter's name -
    # "Blade Count".
    - name: count
      type: string
      source: request
    # An axis and millimetres - "X 150", or "X 900 last". A row whose copies
    # cannot leave the plane the form is sketched on - a reference plane or
    # level facing that axis - is refused before anything is kept, measured by
    # a rolled-back trial row (5b-357). Version 3: the trial row is THREE, so
    # a middle copy is measured - a form whose face is locked along the row,
    # or whose top is locked to a plane, leaves the middle copies behind while
    # the last one moves - and a refusal lists the form's own locks and the
    # way round (5b-374).
    - name: step
      type: string
      source: request
  provides:
    - name: arrayId
      # The array's unique id.
      role: result
      type: string
    - name: members
      # The copies' model GROUPS' unique ids - each copy is a group, even
      # for one form (row 5b-358) - commas between, in order along the row;
      # the last is the far end. The original is not one of them.
      role: result
      type: string
    - name: memberForms
      # Version 5 (row 5b-358): the FORM inside each group `members` names -
      # or the nested family, for a row of one - its unique id, commas
      # between, in the same order, so a later tool can be given the form
      # itself: COMBINE_FAMILY_FORMS a void copy. The original keeps the id
      # it was given by. Empty when nothing was arrayed.
      role: result
      type: string
    - name: labelled
      # True when the count follows a family parameter. ACCOUNTING, not a
      # result: it says HOW the count was given, not whether anything was
      # arrayed - a row of a typed count is labelled false and still made.
      # Declared a result, this flag outranked arrayId and members (D-51) and
      # the 2026-10-18 proof's positive - two copies made - read as empty.
      role: accounting
      type: bool
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing was arrayed, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


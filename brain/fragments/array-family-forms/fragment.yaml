compatibility-note: >
  `LinearArray.Create(Document, View, ElementId, int, XYZ, ArrayAnchorMember)`
  - "between 0 and 200 in family documents" - and `BaseArray.Label`,
  `NumMembers` and `GetCopiedMemberIds` read the same 2020 through 2027 (the
  RevitAPI reference assemblies and their XML remarks, read 2026-10-01). The
  label's own remark: only in a family, and only an Integer parameter. That
  kind is read by reflection: `SpecTypeId.Int.Integer` from 2022,
  `ParameterType.Integer` before, gone from 2023. The trial row runs in a
  `SubTransaction` (`Start`, `HasStarted`, `HasEnded`, `RollBack`), and the
  plane it names is read from `Extrusion.Sketch`, `Revolution.Sketch` or
  `Blend.BottomSketch`, then `Sketch.SketchPlane` and `SketchPlane.GetPlane` -
  all ten in every reference assembly 2020 through 2027, read 2026-10-07.
  None says what a sketch plane is hosted on, which is why the trial measures.


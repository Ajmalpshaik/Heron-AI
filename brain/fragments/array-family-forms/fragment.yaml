id: FRG-GEO-048
semantic-identity: "repeat one form or one nested family in a row - a linear array - in the family being edited, its count driven by a parameter"
kind: action
domain: revit.families
capability: ARRAY_FAMILY_FORMS
version: 3
source: OFFICIAL
risk: MODIFY

purpose: >
  REPEATS ONE FORM IN A ROW in the family open in the Family Editor - a
  grille's blades, a radiator's fins, a louvre's slots, a rack's shelves - as a
  linear array: the Family Editor's Array, with its count LABELLED to an
  Integer family parameter when the types must choose how many.

  **A LINKED REVIT ARRAY, the kind ARRAY_ELEMENTS leaves out on purpose** -
  that tool's loose copies cannot follow a count a type chooses.

  **ONE FORM PER ARRAY.** Several at once would make every member a group;
  a second form takes a second call, and both may follow one count.

  **OR ONE NESTED FAMILY** (version 2, 2026-10-07) - a coil spring's turns
  arrayed up. Measured on a scratch family: a level-based nested family
  moved up, its Bottom locked to a plane, arrayed to its LAST member, and that
  copy's Top locked to a second plane - the row re-spaced when the planes
  moved and grew from 3 to 5 with its count. The copies come back IN ORDER
  ALONG THE ROW, the last one last, for LOCK_NESTED_FAMILY_TO_PLANES.
  Proved again 2026-10-07 on scratch SpringProof, signed by Ajmal PS.

  **THE COUNT** is a whole number, or an Integer family parameter's name -
  its value in the current type is the count, and the label lets every type
  choose. Revit labels an array only with an Integer parameter; a Yes/No is
  refused by its kind.

  **THE STEP** is an axis and a distance in millimetres: each member that far
  on from the one before - or, ending "last", the last member that far from
  the first and the rest spread evenly between, the one to lock to a plane so
  the spacing follows a length.

  **READ BACK, ALL OR NOTHING**: the count, the label and every copy's place
  are read again. The array's id and the copies' ids come back; copies of a
  void cut nothing until COMBINE_FAMILY_FORMS combines them.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: uidoc
      type: UIDocument
    # ONE form or ONE nested family, by the id its tool gave back - or
    # `selected`, with it selected alone.
    - name: form
      type: string
      source: request
    # A whole number 2 to 200, or an Integer family parameter's name -
    # "Blade Count".
    - name: count
      type: string
      source: request
    # An axis and millimetres - "X 150", or "X 900 last". A row whose copies
    # cannot leave the plane the form is sketched on - a reference plane or
    # level facing that axis - is refused before anything is kept, measured by
    # a rolled-back trial row (5b-357). Version 3: the trial row is THREE, so
    # a middle copy is measured - a form whose face is locked along the row,
    # or whose top is locked to a plane, leaves the middle copies behind while
    # the last one moves - and a refusal lists the form's own locks and the
    # way round (5b-374).
    - name: step
      type: string
      source: request
  provides:
    - name: arrayId
      # The array's unique id.
      role: result
      type: string
    - name: members
      # The copies' unique ids, commas between, in order along the row - the
      # last is the far end. The original is not one of them.
      role: result
      type: string
    - name: labelled
      # True when the count follows a family parameter.
      role: result
      type: bool
    - name: notAFamily
      role: accounting
      type: bool
    - name: refused
      # Why nothing was arrayed, in plain words. Empty when the call ran.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


compatibility-note: >
  `LinearArray.Create(Document, View, ElementId, int, XYZ, ArrayAnchorMember)`
  - "between 0 and 200 in family documents" - and `BaseArray.Label`,
  `NumMembers` and `GetCopiedMemberIds` read the same 2020 through 2027 (the
  RevitAPI reference assemblies and their XML remarks, read 2026-10-01). The
  label's own remark: only in a family, and only an Integer parameter. That
  kind is read by reflection: `SpecTypeId.Int.Integer` from 2022,
  `ParameterType.Integer` before, gone from 2023. The trial row runs in a
  `SubTransaction` (`Start`, `HasStarted`, `HasEnded`, `RollBack`), and the
  plane it names is read from `Extrusion.Sketch`, `Revolution.Sketch` or
  `Blend.BottomSketch`, then `Sketch.SketchPlane` and `SketchPlane.GetPlane` -
  all ten in every reference assembly 2020 through 2027, read 2026-10-07.
  None says what a sketch plane is hosted on, which is why the trial measures.
  Version 3 lists what holds a form with `Dimension.References`, `IsLocked`
  and `FamilyLabel`, `Element.GetGeometryObjectFromReference`,
  `PlanarFace.FaceNormal` and `FamilyInstance.GetReferenceName` - every one
  in the reference assemblies 2020 through 2027, read 2026-10-08. Version
  4's `Element.OwnerViewId`, `ElementId.InvalidElementId`,
  `View.ViewDirection`, `View.IsTemplate`, `Group.GetMemberIds`,
  `LocationPoint.Point` and `LinearArray.Create` with its `View` read the
  same 2020 through 2027 (`tools/api-surface --members --inherited`,
  2026-11-11). Version 5's `ReferencePlane.GetPlane`, `SketchPlane.GetPlane`,
  `Group.GetMemberIds` and `BaseArray.GetCopiedMemberIds` read the same 2020
  through 2027 (`tools/api-surface --members`, 2026-11-20). Version 6's
  `Element.GroupId`, `BaseArray.GetOriginalMemberIds`, `GetCopiedMemberIds`,
  `NumMembers` and `Label` compile on every release 2020 through 2027
  (`tools/check-fragments-compile.py`, 2026-11-23).


positive:
  - given: >
      a new family from the metric Generic Model template with an Integer type
      parameter "Blade Count" holding 5, and one solid extrusion made by
      create-family-extrusion, rect -300,-10 300,10 on Ref. Level from 0 to
      50; form = its id, count "Blade Count", step "Y 100"
    expect: >
      labelled true; members four ids; five blades 100 mm apart along +Y in the
      Ref. Level plan; selecting the array shows its count labelled Blade Count

  - given: Blade Count set to 8 in Family Types (FLEX_FAMILY)
    expect: eight blades, the copies' ids different from before

  - given: the same form, count "3", step "Y 400 last"
    expect: >
      labelled false; three blades, the last 400 mm from the first, 200 mm
      apart

  - given: >
      a vane sketched on a FREE plane (not associated, normal +X), X -301 to
      -299; count "5", step "X 40" - along the axis its plane faces
    expect: >
      arrayed - the trial copy moves, so nothing is refused; four copies 40,
      80, 120 and 160 mm along +X, every one read back

  - given: >
      version 2, a NESTED FAMILY. A host family with planes "Pitch" at 30 and
      "Top Turn Start" at 120; a level-based Generic Model family loaded,
      placed at 0,0,0 on Ref. Level by PLACE_NESTED_FAMILY, moved up 30 by
      MOVE_ELEMENTS, its Bottom locked to "Pitch"; form = its id, count "3",
      step "Z 60 last"
    expect: >
      three in all, 30 mm apart up +Z, every copy read back; members two group
      ids, the last the far one - LOCK_NESTED_FAMILY_TO_PLANES then locked its
      Top to "Top Turn Start". Ran 2026-10-07, scratch SpringMainProbe, kept

  - given: >
      in TRG_Spring_Compression Spring, the one-turn spring family nested,
      count "Active Coils" (4), step "Z 73.5 last"
    expect: >
      labelled true; FLEX through Active Coils 4, 5 and 8 re-made the copies,
      each one Pitch apart, the last ending at Top Turn Start. Ran 2026-10-07

negative:
  - given: >
      a vane sketched on Center (Left/Right), X -401 to -399 (5b-357); count
      "21", step "X 40" - or "X 800 last"
    expect: >
      refused before anything is kept - the plane named, the trial copy
      moved 0 mm of the 40 mm asked, rows along Y or Z stay in that plane, and
      the two ways round it; arrayId and members empty

  - given: count "Show_Handle", a Yes/No parameter
    expect: refused - not an Integer parameter - and nothing arrayed

  - given: count "1"
    expect: refused - not an array - and nothing arrayed

  - given: two forms' ids, commas between
    expect: refused - one form per array - and nothing arrayed

  - given: a project in front
    expect: notAFamily true and nothing arrayed anywhere

  - given: a reference plane's id as the form
    expect: refused as neither a form nor a nested family, and nothing arrayed

second_route:
  - >
      The Ref. Level plan and the 3D view in the Family Editor: count the
      blades and dimension two neighbours by hand; select the array and read
      its label; flex Blade Count in Family Types and count again

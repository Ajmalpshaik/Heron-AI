compatibility-note: >
  ONE PATH FOR EVERY RELEASE, read rather than remembered. On 2026-10-28
  tools/api-surface read the reference assemblies of all eight releases, 2020
  through 2027, and found one signature on every one for each member this
  calls: `CurtainGrid.AddGridLine(bool isUGridLine, XYZ position, bool
  oneSegmentOnly)`, `GetCurtainCells`, `GetUGridLineIds`, `GetVGridLineIds`,
  `GetMullionIds` and `GetPanelIds`; `CurtainCell.CurveLoops`
  (a CurveArrArray); `CurtainGridLine.FullCurve`, `ExistingSegmentCurves`
  and `AddMullions(Curve segment, MullionType mullionType, bool
  oneSegmentOnly)` returning an ElementSet; `Mullion.LocationCurve`;
  `MullionType` deriving from FamilySymbol; `Wall.CurtainGrid`,
  `Wall.WallType`, `WallType.Kind`, `Line.Direction`, the XYZ operators,
  `CurveArray.get_Item` and `Size` (its indexer is listed, but C# will not
  read it as `[]` - the fragment compile said so on all eight), `ElementSet.Size`,
  `WorksharingUtils.GetCheckoutStatus` with its owner, `Document.Regenerate`
  and the application's `AngleTolerance`. Revit's reference names a grid's
  two families of lines U and V and never says which is vertical on a wall,
  which is why each new line is measured. No ElementId is constructed and
  none is read as a number.

# ROUTING - repeated in SET_CURTAIN_WALL_GRID, REPORT_CURTAIN_ELEMENTS and
# CREATE_GRIDS.
#
#   "divide this curtain wall into six panels" -> here, direction vertical,
#                                                positions "equal 6"
#   "split this curtain wall into 4 equal bays with mullions" -> here,
#                                                vertical, "equal 4", with
#                                                the mullion type named
#   "add a grid line at 1200 from the bottom of this curtain wall" -> here,
#                                                horizontal, 1200
#   "add vertical grid lines at 900 and 2700 on just this wall" -> here,
#                                                vertical, "900, 2700"
#   "add a transom at 1100"                   -> here, horizontal, 1100 - with
#                                                a mullion type when one is
#                                                named; without one, the grid
#                                                line alone
#   "set the curtain wall grid spacing",
#   "make the vertical grid fixed distance
#    1500"                                    -> SET_CURTAIN_WALL_GRID. The
#                                                TYPE's layout and spacing,
#                                                every wall built from it. This
#                                                adds lines to ONE wall
#   "change the mullions on this curtain
#    wall"                                    -> SET_CURTAIN_WALL_GRID, `mullions` - the
#                                                type's six mullion positions.
#                                                This puts mullions on the
#                                                lines it adds, and only there.
#                                                Measured 2026-10-28 through
#                                                find, the sentence reached
#                                                REPORT_CURTAIN_ELEMENTS, as
#                                                that card's own table records
#   "change this one mullion"                 -> CHANGE_ELEMENT_TYPE, with that
#                                                mullion selected
#   "add a grid", "add a grid line", "put a
#    grid line here"                          -> CREATE_GRIDS - a building grid,
#                                                the setting-out datum. Without
#                                                "curtain" in the sentence, a
#                                                grid is a column grid. Measured
#                                                2026-10-28 on a scratch store:
#                                                "add a grid line" reaches it
#   "how many grid lines are in this curtain
#    wall", "what is in this curtain wall"    -> REPORT_CURTAIN_ELEMENTS. A
#                                                question must not land on a
#                                                write (D-86)
#   "what is the grid spacing on this curtain
#    wall"                                    -> REPORT_CURTAIN_WALL_TYPE
#   "remove a grid line from this curtain
#    wall", "add a grid line to one panel
#    only"                                    -> NOT HERE, and nothing does yet.
#                                                Every line this adds runs the
#                                                whole wall; Revit's Add/Remove
#                                                Segments does the rest by hand

utterances:
  - divide this curtain wall into six panels
  - add a grid line at 1200 from the bottom of this curtain wall
  - add vertical grid lines at 900 and 2700 on just this wall
  - split this curtain wall into 4 equal bays with mullions
  - add a transom at 1100

tests: tests/

compatibility-note: >
  One implementation for every release. `Category.GetLineWeight`,
  `SetLineWeight`, `LineColor`, `GetLinePatternId`, `SetLinePatternId`,
  `Material`, `SubCategories`, `CanAddSubcategory`, `IsCuttable` and `Parent`
  were read off the SHIPPED 2020 and 2024 assemblies and are identical at both
  ends. Cut weight is only read and written where `IsCuttable` says the
  category can be cut - asking elsewhere returns nothing useful on any release.
  Categories are matched by NAME rather than by turning an ElementId into a
  BuiltInCategory, which would mean an int, and that value changed width at
  2024.

# ROUTING - the same rows are in the fragments named here.
#
#   "bring the object styles over from     -> here. PROJECT-WIDE, Manage >
#    the template"                            Object Styles
#   "make walls grey in THIS view"         -> SET_CATEGORY_GRAPHICS, a view
#                                             override, not a project setting
#   "bring the line styles over"           -> TRANSFER_LINE_STYLES_BETWEEN_DOCUMENTS,
#                                             the Lines category only
#   "bring the materials over"             -> TRANSFER_MATERIALS_BETWEEN_DOCUMENTS,
#                                             and run it BEFORE this one
#   "what overrides are on this view"      -> REPORT_CATEGORY_OVERRIDES
#   "turn this category off"               -> SET_CATEGORY_VISIBILITY

utterances:
  - bring the object styles over from the template
  - copy the object styles from the other project
  - set the line weights up like the other job
  - transfer the object styles from that model

id: FRG-VIEW-017
semantic-identity: "read or set the view range on this plan"
kind: action
domain: revit.views
capability: SET_VIEW_RANGE
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Reads a plan's view range and sets its cut plane, top and bottom offsets.

  **The view range is the commonest reason MEP does not appear on a plan.** A
  duct at 3200 above a level whose top offset is 2300 is simply outside the
  view, and nothing about the element is wrong — which is why people spend an
  hour on the element.

  **It reports the range BEFORE changing it, always.** Setting a view range
  blind is how a coordinated drawing quietly starts showing the floor above.
  The previous offsets come back so a caller can say what it was and put it
  back.

  **A plan only.** A section, an elevation and a 3D view have no view range,
  and are refused by name rather than silently doing nothing.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: view
      type: View
      source: request
    - name: topMm
      type: double
      source: request
    - name: cutMm
      type: double
      source: request
    - name: bottomMm
      type: double
      source: request
    - name: apply
      type: bool
      source: request
  provides:
    - name: wasTopMm
      # What it was BEFORE this ran. Filled in identically whether the
      # change was applied or not, so it is the evidence it looked -
      # never a change it made (D-52).
      role: accounting
      type: double
    - name: wasCutMm
      # What it was BEFORE this ran. Filled in identically whether the
      # change was applied or not, so it is the evidence it looked -
      # never a change it made (D-52).
      role: accounting
      type: double
    - name: wasBottomMm
      # What it was BEFORE this ran. Filled in identically whether the
      # change was applied or not, so it is the evidence it looked -
      # never a change it made (D-52).
      role: accounting
      type: double
    - name: applied
      type: bool
    - name: viewRefused
      # The view declined the change - a template owns the slot, or the view
      # cannot take it at all. The evidence it looked and said no, never a
      # change it made (D-52).
      role: accounting
      type: bool


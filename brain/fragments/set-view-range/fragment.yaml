compatibility-note: >
  One implementation for every release. `ViewPlan.GetViewRange`,
  `ViewPlan.SetViewRange`, `PlanViewRange.GetOffset`, `SetOffset` and the
  `PlanViewPlane` enum are unchanged 2020 to 2027. Millimetres to feet is
  arithmetic (D-20).

# ROUTING - repeated in DIAGNOSE_VISIBILITY and SET_VIEW_CROP.
#
#   "why can I not see my ducts"     -> DIAGNOSE_VISIBILITY first
#   "set the view range"             -> here
#   "the plan is cutting too low"    -> here
#   "crop the view"                  -> SET_VIEW_CROP - a different limit, in
#                                       the view's plane rather than in height
#
# THE VIEW RANGE AND THE CROP BOTH "CUT THE VIEW" and are said the same way.
# One is a height band, the other a rectangle on the sheet.
#   "show me the floor below"        -> SET_VIEW_UNDERLAY - the GHOSTED
#                                       level behind this one, constantly
#                                       confused with the view range and a
#                                       different setting entirely

utterances:
  - set the view range
  - what is the view range
  - the plan is cutting too low
  - raise the cut plane
  - I cannot see the high level ducts

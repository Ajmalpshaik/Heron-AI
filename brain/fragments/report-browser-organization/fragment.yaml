id: FRG-VIEW-131
semantic-identity: "how is the project browser organised, and which views does its filter hide"
kind: action
domain: revit.views
capability: REPORT_BROWSER_ORGANIZATION
version: 1
source: OFFICIAL
risk: READ

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# THE GROUPING IS READ OFF REAL ITEMS: the API gives no list of an
# organisation's rules, only the folders one view or sheet sits in. So every
# item's folder path is read, and each level named from the item's own
# parameters, matched by id - never built from a number.
#
# A VIEW THE FILTER HIDES is the finding: it exists, may be on a sheet, and
# nobody can find it in the browser.
#
# READ ONLY - opens no transaction.
purpose: >
  Reports how the Project Browser is organised for views and for sheets - the
  organisation in use, the parameters its folders group by, its sorting - and
  how many views and sheets its filter hides.

contract:
  needs:
    - name: doc
      type: Document
  provides:
    - name: organization
      # ONE STRING, a line for views and one for sheets.
      role: result
      type: string
    - name: hiddenByFilter
      # Views and sheets the organisation's filter keeps out of the browser
      # (D-52).
      role: accounting
      type: int
    - name: findings
      type: IList<string>

proof:
  date: '2026-11-16'
  by: Ajmal PS
  model: night-scratch (3,213 elements), Revit 2024, session 8292
  positive_case: 'run with numbers=HZ-T1 - the first of 3 tracked inputs - the arrangement
    was re-made first by running create-sheets with this phase''s own values - run inside
    a transaction, and Revit reported the transaction group ROLLED BACK afterwards. returned
    describe Action`3, findings 1 item(s) [Every view and sheet shows in the Project Browser.],
    forSheets BrowserOrganization, forViews BrowserOrganization, hiddenByFilter 0, lines 2
    item(s) [Views: organised by "all" | folders Family and Type | sorted..., Sheets: organised
    by "all" | folders (none - a flat list) | ...], organization Views: organised by "all"
    | folders Family and Type | sorted by View Name Ascending | 0 hidden by its filter, 10
    shown

    Sheets: organised by "all" | folders (none - a flat list) | sorted by Sheet Number Ascending
    | 0 hidden by its filter, 1 shown, parameterName Func`3, sheets 1 item(s) [ViewSheet],
    views 10 item(s) [Level 1, Level 1, Level 2, ...]. on night-scratch'
  negative_case: "CANNOT COME BACK EMPTY, so proved by TRACKING instead (D-53). report-browser-organization\
    \ describes whatever it is given, so no arrangement makes its answer empty. What D-30's\
    \ negative case exists to catch - a fragment that succeeds while doing nothing, or answers\
    \ about a set it was not given - is caught here by the answer following the input exactly\
    \ across 3 different inputs:\n\n      numbers=HZ-T1 -> organization Views: organised by\
    \ \"all\" | folders Family and Type | sorted by View Name Ascending | 0 hidden by its\
    \ filter, 10 shown\nSheets: organised by \"all\" | folders (none - a flat list) | sorted\
    \ by Sheet Number Ascending | 0 hidden by its filter, 1 shown\n      numbers=HZ-T1,HZ-T2\
    \ -> organization Views: organised by \"all\" | folders Family and Type | sorted by View\
    \ Name Ascending | 0 hidden by its filter, 10 shown\nSheets: organised by \"all\" | folders\
    \ (none - a flat list) | sorted by Sheet Number Ascending | 0 hidden by its filter, 2\
    \ shown\n      numbers=HZ-T1,HZ-T2,HZ-T3 -> organization Views: organised by \"all\" |\
    \ folders Family and Type | sorted by View Name Ascending | 0 hidden by its filter, 10\
    \ shown\nSheets: organised by \"all\" | folders (none - a flat list) | sorted by Sheet\
    \ Number Ascending | 0 hidden by its filter, 3 shown\n\n    Different inputs, exact matches\
    \ every time. A fragment falling back to the active view, the whole model, or a previous\
    \ run could not do that."
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  built_on:
    revit_release: '2024'
    revit_build: 24.3.60.12
    addin_version: 0.2.0.0
    addin_hash: 80819edd3983a0d5
  fingerprint: ea110d666d92692f

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. BrowserOrganization
  .GetCurrentBrowserOrganizationForViews and ForSheets, GetFolderItems,
  AreFiltersSatisfied, SortingParameterId and SortingOrder, and FolderItemInfo
  .ElementId and Name are present 2020 through 2027 - read off RevitAPI.xml in
  the Nice3point reference packages for all eight releases on 2026-10-12.

# ROUTING - the same rows are in the fragments named here.
#
#   "how is the project browser organised"    -> here
#   "why can't I find this view in the browser" -> here
#   "which views are not on a sheet"          -> FIND_VIEWS, placement unplaced
#   "which views have no template"            -> FIND_VIEWS, withoutTemplate true

utterances:
  - how is the project browser organised
  - what does the project browser group the views by
  - which views are hidden from the project browser
  - why can't I find this view in the project browser
  - why can't I find this view in the browser

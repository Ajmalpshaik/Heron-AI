id: FRG-PAR-005
# THE IDENTITY NAMES VIEWS, SHEETS AND THE REST (2026-10-16, FRAGMENT-ISSUES 5b-510).
# It said only "find and replace part of these elements' names", and the
# re-ranker reads a card's identity, capability and domain and nothing else -
# so on the live backend "rename the plan", "rename these sheets" and "rename
# the schedule" went to RENAME_FAMILY and EDIT_REVISION_NUMBERING_SEQUENCE,
# neither of which renames a view or a sheet; 5b-485's declared sentences
# reached here and no paraphrase did. Chosen from sixty-nine wordings scored
# against the re-ranker, then on four backends. It keeps "replacing part of their
# names" - the job is still find and replace. "plans and other views" rather
# than "views" alone: "views ... sheets" took "rename the view title on the
# sheet" from SET_VIEWPORT_TITLE_LINE. Without "types", "which views have SUP in
# the name" (a question) reached this write on the model alone. Without
# "templates", five template renames stayed on other tools. "a filter is not"
# pulled every filter rename here - a re-ranker reads a negation as the word.
# The cost, on the spelling backend only: a longer identity is quieter on
# words, so the bare "change SUP to SUPPLY" in the routing table below now goes
# to LINK_FAMILY_PARAMETER there (with a re-ranker it went wrong before and
# after). Declaring it pulled "which views have SUP in the name" - a question -
# here on the model, so it is recorded in the row, not declared.
semantic-identity: "rename these elements by replacing part of their names - plans and other views, sheets, schedules, templates and types are elements too"
kind: action
domain: revit.parameters
capability: RENAME_ELEMENTS
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Renames elements by replacing a piece of text inside the existing name, rather
  than by writing a whole new one. That is the shape the job almost always
  takes - *"change SUP to SUPPLY on all of them"* - and a fragment that only set
  a whole name would rename forty elements to one identical string.

  **A rename is not a parameter write.** `Element.Name` maps to different
  underlying parameters for different kinds of element, and on a TYPE it renames
  the type **everywhere it is used in the model**, not just on the instances
  handed in. That is the one thing about this fragment that surprises people.

  **Duplicate names are refused, not warned about.** Revit throws on a duplicate
  type name and quietly accepts duplicate instance names; neither is what
  somebody wants halfway through a batch, so intended names are checked against
  each other first and a clash stops the whole batch.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: elements
      type: IList<Element>
    - name: find
      type: string
      source: request
    - name: replaceWith
      type: string
      source: request
  provides:
    - name: renamed
      role: result
      type: int
    - name: notMatched
      # Elements whose name did not contain the search term, which is the
      # normal case across a mixed set. Never a rename it made (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>
    - name: collisions
      # Intended names that clash with each other or with a name already in
      # use, CHECKED FIRST so a clash stops the whole batch rather than
      # leaving it half done. Never a rename it made (D-52).
      role: accounting
      type: IList<string>


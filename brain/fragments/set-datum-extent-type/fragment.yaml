compatibility-note: >
  `DatumPlane.SetDatumExtentType(DatumEnds, View, DatumExtentType)` and
  `DatumPlane.GetDatumExtentTypeInView(DatumEnds, View)` are present 2020 through
  2027, and `DatumExtentType` has exactly two values - `Model` and `ViewSpecific`
  - on every release. Read off the reference assemblies at both ends on
  2026-09-18.

# ROUTING - repeated in MAXIMIZE_DATUM_EXTENTS and SET_DATUM_BUBBLES.
#
#   "make this grid 2d here"        -> here, viewSpecific true
#   "is this grid 2d or 3d"         -> here - it reports before it changes
#   "put the dragged ends back"     -> here, viewSpecific false, with every view
#                                      in `views` - RESET_DATUM_EXTENTS's job
#                                      since version 2
#   "the grid is short in this view only" -> here, viewSpecific false
#   "the grids only go half way"    -> MAXIMIZE_DATUM_EXTENTS, which lengthens
#                                      the SHARED extent. Run this first where
#                                      a view overrides it, or that fix shows
#                                      nothing there
#   "list the grids"                -> LIST_GRIDS
#   "the grids stop in different places" -> MAXIMIZE_DATUM_EXTENTS
#   "the bubbles are on the wrong side"  -> SET_DATUM_BUBBLES - per VIEW, which
#                                      the model extent is not


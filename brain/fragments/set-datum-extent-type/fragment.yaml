id: FRG-VIEW-104
semantic-identity: "make this grid 2d in this view, or put it back to 3d, and say which it was"
kind: action
domain: revit.datums
capability: SET_DATUM_EXTENT_TYPE
version: 2
source: OFFICIAL
risk: MODIFY

# VERSION 2 (2026-11-01) - RESET_DATUM_EXTENTS WAS MERGED INTO THIS CARD on the
# owner's instruction ("make sure there is no duplicate tools"), and is
# DEPRECATED. That card was this one's write in one direction - every dragged,
# view-specific end back to the shared 3D extent - over many views; here it is
# viewSpecific false. What it had and this one lacked: MANY VIEWS (`views`
# beside `view`); a datum not shown in a view skipped there without a refusal;
# REFUSALS PER DATUM in `refused`; ends counted (`endsChanged`); the datums
# already as asked (`alreadyAsAsked`); and grids and levels only.
#
# A DEFECT OF VERSION 1, FIXED IN THE MERGE: a SetDatumExtentType that threw,
# or read back on the other extent type, was stepped over without a word - the
# failed write vanished and the datum was simply not in `changed`. Now it puts
# the datum in `refused`, as RESET_DATUM_EXTENTS did. Where that card's
# outputs are now: `endsReset` -> `endsChanged`; `datumsChanged` -> `changed`;
# `alreadyShared` -> `alreadyAsAsked`; `notADatum` and `refused` -> the same
# names. Its `views` is `views`.
#
# Version 1's proof below no longer described the code (impl/ changed) and
# was kept as the record; DRAFT at the time, until version 2 is proved on a
# real model (D-30).

purpose: >
  Reads whether each grid or level end is on its shared 3D extent or on a
  view-specific 2D one, and sets it either way.

  **ONLY ONE DIRECTION EXISTED.** `RESET_DATUM_EXTENTS` writes
  `DatumExtentType.Model`, which is 2D to 3D - it throws away the per-view
  override somebody made by dragging an end. Measured 2026-09-18,
  `SetDatumExtentType` appears exactly ONCE in the whole library, at
  `reset-datum-extents/impl/any/fragment.cs:60`, and the value is always `Model`.
  So a modeller could be handed back the shared extent and could never be given a
  view-specific one - which is the ordinary drafting job of shortening one grid
  in one view without touching the other twenty.

  **AND THE STATE COULD NOT BE ASKED FOR.** `MAXIMIZE_DATUM_EXTENTS` calls
  `GetDatumExtentTypeInView` and reports which ends are view-specific, but only as
  accounting while it stretches things. Nothing answered *"is this grid 2D or 3D
  in this view"* without modifying the model to find out. So this reads first and
  reports what it found BEFORE changing it, the way `SET_VIEW_PROPERTIES` and
  `SET_VIEW_PROPERTIES` both read and set.

  **EXTENTS ARE SHARED AND BUBBLES ARE NOT, AND CONFUSING THEM CHANGES TWENTY
  VIEWS.** `SET_DATUM_BUBBLES` states it plainly: bubbles are per end and per
  view; the MODEL extent is shared across every view. Setting an end back to
  `Model` here therefore reaches every view that shows it, not just this one.
  That is the point of the call and it is said out loud rather than discovered.

  **BOTH ENDS ARE HANDLED SEPARATELY**, because only one is usually dragged.

  Version 2 takes many views at once - `views` - and names every datum an end
  of which Revit would not change, in `refused`.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # Version 2: `view`, `views`, or both - every view named, each once. One
    # of them must name a view.
    - name: view
      type: View
      source: request
      optional: true
    # VERSION 2, from RESET_DATUM_EXTENTS. More views, every end of every datum
    # set in each. Left out: an empty list - `view` alone, as version 1.
    - name: views
      type: IList<View>
      source: request
      optional: true
    - name: elements
      type: IList<Element>
    - name: viewSpecific
      type: bool
      source: request
  provides:
    - name: changed
      role: result
      type: IList<ElementId>
    - name: wasAlready
      # Ends already on the extent type asked for, so there was nothing to do.
      # Evidence it looked, never a change it made (D-52).
      role: accounting
      type: int
    - name: notADatum
      # Handed in but not a grid or a level. Given and unusable (D-52).
      role: accounting
      type: IList<ElementId>
    - name: findings
      type: IList<string>
    - name: endsChanged
      # VERSION 2, from RESET_DATUM_EXTENTS. Ends now on the extent type asked,
      # read back - one datum can change at both ends in three views.
      role: result
      type: int
    - name: alreadyAsAsked
      # VERSION 2. Datums every shown end of which was ALREADY as asked, so
      # there was nothing to do. Evidence it looked (D-52).
      role: accounting
      type: IList<ElementId>
    - name: refused
      # VERSION 2. Datums with an end Revit would not change - the set threw,
      # or read back on the other type. Version 1 dropped these without a word
      # (D-52).
      role: accounting
      type: IList<ElementId>


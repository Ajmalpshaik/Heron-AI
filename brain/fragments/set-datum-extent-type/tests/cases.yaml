positive:
  - given: >
      a grid on a floor plan whose ends are on the shared 3D extent, with
      viewSpecific true, on Revit 2024
    expect: >
      that grid now 2D IN THIS VIEW ONLY - checked by shortening it here and
      confirming it is unchanged on another plan. The report must also say what
      it found before it changed anything

  - given: the same grid, with viewSpecific false
    expect: >
      back on the shared extent, AND the finding warning that a 3D extent reaches
      every view. Checked on a second plan

negative:
  - given: a wall handed in with the grids
    expect: >
      counted in `notADatum`, nothing attempted on it, and the grids still done

  - given: a grid whose ends are ALREADY view-specific, with viewSpecific true
    expect: >
      counted in `wasAlready`, `changed` empty. A fragment that counted these as
      changes would report success for doing nothing, which is the shape D-30's
      negative leg exists to catch

  - given: no view
    expect: refused by name

  # VERSION 2 (2026-11-01) - RESET_DATUM_EXTENTS merged in. Each FAILS on
  # version 1. NOT RUN.
  - given: >
      a grid dragged short in two plans, both in `views`, viewSpecific false,
      `view` left out
    expect: >
      the grid at its full shared length in BOTH plans, endsChanged counting
      ends (1 to 4), changed its id. Version 1 took one view only
  - given: a datum already on the shared extent in every view named
    expect: its id in `alreadyAsAsked`, endsChanged 0 - nothing counted as reset
  - given: a datum not shown in one of the views
    expect: that view skipped for it without a refusal, the other views still done
  - given: an end whose set Revit refuses, or that reads back on the other type
    expect: >
      the datum's id in `refused` and named in findings. Version 1 dropped the
      failed write without a word
  - given: a reference plane handed in with the grids
    expect: in `notADatum` - grids and levels only
  - given: neither `view` nor `views`
    expect: refused by name, nothing changed

second_route:
  - >
      the 3D/2D toggle clicked by hand on the same grid end in Revit, and the two
      compared - including on a second view, which is where the shared-extent
      warning is either true or wrong

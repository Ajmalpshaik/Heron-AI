tests: tests/

compatibility-note: >
  Selection.SetElementIds takes an ICollection<ElementId> on every release from
  2020 to 2027. No ElementId is built from an int, so 2024's move to 64-bit ids
  does not reach this code.

  Version 2 adds `UIDocument.ShowElements(ICollection<ElementId>)` and
  `UIDocument.ActiveView`, the calls ZOOM_TO_ELEMENTS made, PROVEN on Revit
  2024 and unchanged 2020 to 2027. `UIDocument` comes from the Revit UI
  namespace the fragment wrapper already imports.

# ROUTING - repeated in READ_SELECTION, SHOW_ELEMENTS, HIDE_ELEMENTS and
# ZOOM_TO_LINKED_ELEMENTS.
#
#   "select these"             -> here. A CHANGE to the selection
#   "highlight what you found" -> here
#   "where is it"              -> here, show and keepSelection - the camera
#                                 only, since ZOOM_TO_ELEMENTS was merged in
#                                 (version 2)
#   "zoom to these"            -> here, show and keepSelection
#   "select and show me these" -> here, show
#   "show me these"            -> HERE, with show, when they are hidden BY
#                                 DISTANCE - off screen, on another level, in
#                                 another view. SHOW_ELEMENTS when a VIEW
#                                 SETTING hides them: it unhides, and moves no
#                                 camera. The sentence does not say which, so
#                                 both tables carry both
#   "zoom to the beams in the structural link" -> ZOOM_TO_LINKED_ELEMENTS. Show
#                                 takes host ids, and a linked element's id
#                                 means nothing in the host
#   "what did I select"        -> READ_SELECTION. A QUESTION about the
#                                 selection, and it must not be answered by the
#                                 fragment that overwrites it
#   "how many did I select"    -> READ_SELECTION
#   "move what I picked up 200"-> READ_SELECTION, then MOVE_ELEMENTS
#   "how many ducts are there" -> COUNT_ELEMENTS. Nothing to do with what is
#                                 picked on screen
#   "select these forms" (by id)     -> REPORT_FAMILY_FORMS first, in a
#                                       family; its forms then come here
#                                       with expect_from report-family-forms
#   "make a selection set"           -> UPDATE_SAVED_SET, mode "create" - a SAVED
#                                       set that survives the model closing.
#                                       This highlight is gone at the next
#                                       click

# VERSION 2 (2026-11-01) - ZOOM_TO_ELEMENTS WAS MERGED INTO THIS CARD on the
# owner's instruction ("make sure there is no duplicate tools"; "merge means
# ... all area need to be covered"), and is DEPRECATED. SET_SELECTION keeps
# its name: a great many cards and jobs name it (grep says how many). The same job - put what was found
# in front of the modeller, changing nothing in the model. What that card had
# and this one lacked is here now: Revit's Show (`show`), which may change the
# active view, reported in `viewAfter`; the camera only, selection left alone
# (`keepSelection`); `missing`, dead ids left out before Show is asked; Show
# never attempted with nothing left; `findings`.
#
# THE SAFER RULE IN EACH CONFLICT IS KEPT. Version 1 handed dead ids to the
# selection; they are left out of it now as well. An empty set still clears
# the selection, as version 1 - unless keepSelection asked for it to be left
# alone. keepSelection without show is refused, nothing touched.
#
# NOT CARRIED, AS OPPOSITE: ZOOM_TO_ELEMENTS's `alsoSelect`, false meaning
# "do not select" - here leaving out a switch never stops the selection that
# version 1 always made, so the camera-only mode is asked for by
# keepSelection=true. Its alsoSelect=true is show=true; its alsoSelect=false
# is show=true with keepSelection=true. Its viewAfter was counted as a
# result; here it is accounting - where the screen is, not a thing found.
#
# WHERE ITS OUTPUTS ARE NOW: shown, missing, viewAfter, findings -> the same
# names. Its sentences moved here. Risk stays EXECUTE, which revit_show runs:
# Show acts on the session, not the building.

# risk is EXECUTE and not MODIFY on purpose: changing what is highlighted is
# not a change to the model, survives no transaction and needs no undo. The
# gate that matters for this fragment is the one that lets it run at all with
# write.enabled false - C5 in NEEDS-CHECKING.md is that exact test.

utterances:
  - select these
  - highlight them on screen
  - show me the ones you found
  - put them in the selection
  - clear the selection
  # MOVED 2026-11-01 from ZOOM_TO_ELEMENTS, merged into this card.
  - take me to these on screen
  - where is it
  - zoom to these
  - zoom in on what you found
  - take me to that element
  - select and show me these

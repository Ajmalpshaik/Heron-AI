id: FRG-SEL-001
semantic-identity: "put these elements in the current selection"
kind: action
domain: revit.selection
capability: SET_SELECTION
version: 1
source: OFFICIAL
risk: EXECUTE

purpose: >
  Answers "what to do to them" for the commonest read-only job there is: show
  the user what was found, on screen, where they can see it. Pairs with any
  filter - that is the point of it being a separate fragment rather than part
  of a "select ducts" whole.

contract:
  needs:
    - name: uidoc
      type: UIDocument
    - name: elements
      type: IList<Element>
  provides:
    - name: selectedCount
      type: int

proof:
  date: '2026-09-09'
  by: Ajmal PS
  model: Snowdon-scratch_ajmal.al (9,638 elements), Revit 2024, session 17356
  positive_case: run as it would normally be run - the arrangement was re-made first by running
    select-by-category-name with this phase's own values - run inside a transaction and ROLLED
    BACK, so the model was left exactly as it was. returned ids 9 item(s) [1491217, 1491220,
    1491225, ...], selectedCount 9. inputs came elements from the selection (9). on Snowdon-scratch_ajmal.al
  negative_case: "CANNOT COME BACK EMPTY, so proved by TRACKING instead (D-53). set-selection\
    \ describes whatever it is given, so no arrangement makes its answer empty. What D-30's\
    \ negative case exists to catch - a fragment that succeeds while doing nothing, or answers\
    \ about a set it was not given - is caught here by the answer following the input exactly\
    \ across 5 different inputs:\n\n      22 ducts in M1 -> selectedCount 22\n      the duct\
    \ tags in M1 -> selectedCount 9\n      the air terminals in M1 -> selectedCount 10\n \
    \     the mechanical equipment in L3 -> selectedCount 10\n      the ducts in L3 -> selectedCount\
    \ 307\n\n    Different inputs, exact matches every time. A fragment falling back to the\
    \ active view, the whole model, or a previous run could not do that."
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: 6ba8ea08aad3b693

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  Selection.SetElementIds takes an ICollection<ElementId> on every release from
  2020 to 2027. No ElementId is built from an int, so 2024's move to 64-bit ids
  does not reach this code.

# ROUTING - repeated in READ_SELECTION.
#
#   "select these"             -> here. A CHANGE to the selection
#   "highlight what you found" -> here
#   "what did I select"        -> READ_SELECTION. A QUESTION about the
#                                 selection, and it must not be answered by the
#                                 fragment that overwrites it
#   "how many did I select"    -> READ_SELECTION
#   "move what I picked up 200"-> READ_SELECTION, then MOVE_ELEMENTS
#   "how many ducts are there" -> COUNT_ELEMENTS. Nothing to do with what is
#                                 picked on screen
#   "make a selection set"           -> CREATE_SELECTION_FILTER - a SAVED
#                                       set that survives the model closing.
#                                       This highlight is gone at the next
#                                       click

# risk is EXECUTE and not MODIFY on purpose: changing what is highlighted is
# not a change to the model, survives no transaction and needs no undo. The
# gate that matters for this fragment is the one that lets it run at all with
# write.enabled false - C5 in NEEDS-CHECKING.md is that exact test.

utterances:
  - select these
  - highlight them on screen
  - show me the ones you found
  - put them in the selection
  - clear the selection

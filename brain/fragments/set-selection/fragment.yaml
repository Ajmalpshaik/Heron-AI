heron-step: 7
heron-status: PROVEN
heron-since: 0.1.0
heron-layer: brain

id: FRG-SEL-001
semantic-identity: "put these elements in the current selection"
kind: action
domain: revit.selection
capability: SET_SELECTION
version: 2
source: OFFICIAL
risk: EXECUTE

purpose: >
  Answers "what to do to them" for the commonest read-only job there is: show
  the user what was found, on screen, where they can see it. Pairs with any
  filter - that is the point of it being a separate fragment rather than part
  of a "select ducts" whole.

  **VERSION 2 ALSO TAKES YOU TO THEM** (ZOOM_TO_ELEMENTS merged in). Selecting
  is not showing: with show, Revit's own Show moves the screen to the
  elements - and may change the active view, so the view it landed on comes
  back in viewAfter. With keepSelection too, the camera moves and the
  selection is left alone - "where is it". Ids that no longer exist are left
  out and named in missing.

contract:
  needs:
    - name: uidoc
      type: UIDocument
    - name: elements
      type: IList<Element>
    # VERSION 2, from ZOOM_TO_ELEMENTS. true also runs Revit's own Show - the
    # screen moves to the elements, and Revit may open another view to do it.
    # Absent binds false (row 5b-227), version 1 exactly.
    - name: show
      type: bool
      source: request
      optional: true
    # VERSION 2. true with show: the camera only, the selection left as it
    # was - ZOOM_TO_ELEMENTS's alsoSelect=false. Without show it is refused,
    # nothing touched. Absent binds false: the selection is set, as version 1.
    - name: keepSelection
      type: bool
      source: request
      optional: true
  provides:
    - name: selectedCount
      role: result
      type: int
    - name: shown
      # VERSION 2. How many the screen was moved to; 0 without show.
      role: result
      type: int
    - name: missing
      # VERSION 2. Ids handed in that resolve to nothing, left out of the
      # selection and the Show. What it was GIVEN and could not use, never
      # something it selected (D-52).
      role: accounting
      type: IList<ElementId>
    - name: viewAfter
      # VERSION 2. The view Show LANDED ON, which may not be the one that was
      # on screen - so the jump is explainable. Empty without show. Where the
      # screen is, not a thing it selected (D-52).
      role: accounting
      type: string
    - name: findings
      # VERSION 2. What it did to the screen and the selection, and what it
      # left out.
      role: accounting
      type: IList<string>


# VERSION 2 (2026-11-11) - THE FILL IS READ TOO, and back to DRAFT. Version 1
# was PROVEN on 2026-09-10 (the proof block below, kept as the record of what
# it proved - two fittings overridden by a line colour). Its C# moved, so it is
# DRAFT again until NEEDS-CHECKING Group NK, NK7, is run (D-30).
# FRAGMENT-ISSUES row 5b-154: version 1 read no pattern at all, so an element
# overridden ONLY by a surface fill pattern, or only by a cut pattern or cut
# colour, was reported "NO per-element override in this view". The surface
# pattern, the cut pattern and the cut pattern's colour are read now, the way
# REPORT_CATEGORY_OVERRIDES reads them (row 173), and `overrideList` carries
# every overridden element's line in full as one string. The same change
# reads the rest of what the Override Graphics in View box holds, each of
# which alone had read as "NO override" too: the detail level (which the
# purpose below has always claimed), the projection and cut line patterns,
# the cut line weight, the background patterns and their colours, and a
# pattern switched off for the element. The `overrides`
# object handed on is unchanged - it was always Revit's own. A read: it still
# answers through revit_read while DRAFT, and says DRAFT (D-117 item 4).

purpose: >
  Reads back the graphic overrides ALREADY on elements in one view - line
  colour, surface pattern and its colour, transparency, halftone, detail level -
  and hands the settings object on. Read-only.

  **IT IS THE HALF THAT WAS MISSING, AND ITS ABSENCE HAD A MEASURED COST.**
  `OVERRIDE_GRAPHICS_IN_VIEW` takes settings ALREADY BUILT, which is what makes
  one implementation work on eight releases. Nothing could produce those
  settings from an element that already looked right, so *"make this pipe look
  the same as that one"* - a normal sentence on any drawing - had no answer in
  this library at all and was resolving to `CREATE_PIPE`.

  **MATCHING IS THIS FRAGMENT PLUS THE WRITER, and that is the point of the
  split.** Read the source element's look here, hand the object to
  `OVERRIDE_GRAPHICS_IN_VIEW`, and every element handed to it matches. Neither
  half has to know what colour anything is.

  **AN ELEMENT WITH NO OVERRIDE STILL RETURNS A SETTINGS OBJECT**, and it is the
  empty one. That is not a failure and it is not nothing: applying it to
  something else CLEARS that thing's override, which is a real use. The report
  says which elements carried an override and which did not, because "matched to
  something with no override" and "the call did nothing" look identical
  afterwards.

  **What it reads is the PER-ELEMENT override only.** A category override or a
  filter override in the same view is a different setting, is not read here, and
  survives untouched - which is why an element can be grey in the view and come
  back with nothing on it.

contract:
  needs:
    - name: doc
      type: Document
    - name: view
      type: View
      source: request
    - name: elements
      type: IList<Element>
  provides:
    - name: overrides
      role: result
      type: OverrideGraphicSettings
    - name: findings
      type: IList<string>
    - name: withOverride
      role: result
      type: int
    - name: overrideList
      # VERSION 2 (row 5b-154). EVERY ELEMENT THAT CARRIES AN OVERRIDE, ITS
      # LINE IN FULL, JOINED - line colours, patterns and weights, the surface
      # and cut patterns and their colours, foreground and background, a
      # pattern switched off, transparency, halftone, detail level. A STRING, as
      # REPORT_CATEGORY_OVERRIDES' is: a list reaches a reply as its first
      # three entries, each cut at sixty characters, and a fill starts past
      # the sixtieth once the line colours are set. Empty when no element
      # handed in carries a per-element override.
      role: result
      type: string


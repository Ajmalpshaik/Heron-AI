compatibility-note: >
  One implementation for every release. `TextNote.Text` (inherited from
  `TextElement`), `Element.OwnerViewId`, `ViewSheet.SheetNumber`,
  `ViewSheet.IsPlaceholder`, `View.IsTemplate`, `ElementId.InvalidElementId`
  and `FilteredElementCollector.OfClass` are documented in the RevitAPI.xml
  of every release 2020 to 2027 (read 2026-10-10 from the reference
  packages the compile uses; tools/api-surface could not run on that PC).
  The same members are in FIND_DATES_IN_VIEWS and LIST_SHEETS, both PROVEN.

  **No ElementId is ever read as a number** - ids are dictionary keys and
  compared to `InvalidElementId` - so 2024's 64-bit ids do not reach this,
  and nothing calls `IntegerValue`, deprecated at 2024 and gone by 2026. The
  date reading is plain string work with no Revit type in it.

# ROUTING - the dates-on-sheets rows are repeated in EXTRACT_DATES_FROM_TEXT
# and FIND_DATES_IN_VIEWS.
#
#   "take the dates in that text from      -> here - every sheet, nothing
#    all sheets"                              selected, each date once
#   "what dates are on these sheets"       -> EXTRACT_DATES_FROM_TEXT - the
#                                             sheets SELECTED, per sheet, the
#                                             answer SET_SHEET_REVISIONS reads
#   "which sheets carry this date"         -> EXTRACT_DATES_FROM_TEXT
#   "where is this date typed"             -> FIND_DATES_IN_VIEWS - every view,
#                                             plans and sections included
#   "find every typed date in the model"   -> FIND_DATES_IN_VIEWS
#   "read the sheet issue date"            -> READ_ELEMENT_PARAMETERS - a date
#                                             that IS a parameter
#   "list the sheets"                      -> LIST_SHEETS
#   "change the text in a note"            -> EDIT_TEXT_VALUES
#   "create revisions for the dates on the sheets" -> CREATE_REVISIONS_FROM_SHEET_DATES -
#                                         makes the revisions this card only lists,
#                                         each on the sheets carrying its date

# WHERE THE SENTENCE CAME FROM. The modeller's own, typed 2026-10-10 in Revit
# 2020 with model 4355-BHVD-3D-50C10-BL001A open. Nothing else is declared.

utterances:
  - check all sheets, take all the text on the sheets, take the dates in that text from all sheets, and keep only unique dates

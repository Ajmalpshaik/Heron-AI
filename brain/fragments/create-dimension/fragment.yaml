compatibility-note: >
  `Document.Create.NewDimension(View, Line, ReferenceArray)`,
  `Options.ComputeReferences`, `Options.IncludeNonVisibleObjects` and
  `GeometryObject.Reference` are unchanged 2020 to 2027. No ElementId is built
  from an int, so 2024's 64-bit ids do not reach this code.

  The offset arrives in millimetres and is divided by 304.8 - arithmetic, per
  D-20.

  Version 3 adds `FamilyInstance.GetReferences` and the
  `FamilyInstanceReferenceType` members CenterLeftRight, CenterFrontBack and
  StrongReference, unchanged 2020 to 2027 - the calls DIMENSION_FAMILY_INSTANCES
  made, PROVEN on Revit 2024. `SpatialElement` is the room, space and area
  base class on every release.

  Version 4 adds `Grid.Curve`, `Level.ProjectElevation`, the
  `Reference(Element)` constructor, `View.Origin` and the view-scoped
  `FilteredElementCollector(Document, ElementId)` - the calls
  DIMENSION_GRIDS_AND_LEVELS made, PROVEN on Revit 2020, and unchanged 2020 to
  2027 (`Level.ProjectElevation` read off the reference assemblies on
  2026-09-23).

# WHAT WOULD DISPROVE THIS FRAGMENT, since nothing here has met a real model.
# The centreline-reference technique is the part to distrust: if
# `IncludeNonVisibleObjects` does not surface a referenceable centreline for a
# duct on some release, every element lands in `refused` and NOTHING IS DRAWN.
# That is the designed failure - a refusal that says so, rather than a
# dimension attached to the wrong thing - but it is a failure, and the first
# run against a real model is what settles it.

# ROUTING - repeated in MEASURE_RUN_QUANTITIES and TAG_ELEMENTS_IN_VIEW.
#
#   "add a dimension between these"  -> here
#   "dimension the duct spacing"     -> here, since DIMENSION_MEP_RUNS was
#                                       merged in (version 2, 2026-11-01)
#   "dimension between these risers" -> here, axis x or y
#   "dimension these air terminals"  -> here, axis x or y, since
#                                       DIMENSION_FAMILY_INSTANCES was merged in
#                                       (version 3) - built-in centre
#                                       references, which a run has not
#   "dimension the grids"            -> here, axis left out, since
#                                       DIMENSION_GRIDS_AND_LEVELS was merged in
#                                       (version 4) - each grid referenced as
#                                       the whole element
#   "dimension between the levels"   -> here, in a section or elevation
#   "dimension this opening from the level and the grid" -> CREATE_LINEAR_DIMENSION
#                                       (5b-482) - a datum to an element's own
#                                       face, not datum to datum
#   "put the levels on the drawing"  -> ADD_SPOT_ELEVATIONS, which puts level
#                                       VALUES on; this measures BETWEEN levels
#   "dimension the layers of this wall" -> DIMENSION_ELEMENT_FACES
#   "dimension the rooms"            -> DIMENSION_ROOMS. Not here: a room's
#                                       boundary offers no reference this holds
#   "how far apart are they"         -> MEASURE_DISTANCE reports it as a
#                                       NUMBER and draws nothing. This fragment
#                                       puts it on the drawing. Asking a
#                                       question must not annotate the model
#   "how long is this duct"          -> MEASURE_RUN_QUANTITIES
#   "tag these"                      -> TAG_ELEMENTS_IN_VIEW - a tag reads a parameter,
#                                       a dimension measures a distance

# VERSION 2 (2026-11-01) - DIMENSION_MEP_RUNS WAS MERGED INTO THIS CARD on the
# owner's instruction, and is DEPRECATED. The same job - one dimension string
# between the centrelines of MEP runs, reached through the non-visible geometry
# with references computed. This card's geometry was kept: across the runs at
# any angle, out-of-parallel and collinear runs refused. What that card had and
# this one lacked is here now: an axis that can be named (x or y, which reaches
# risers end-on in a plan), the read-back of the references the dimension holds,
# a refusal by Revit caught rather than let out, and `problem` saying why. Its
# `dimensionId` is this card's `created`, its `noReference` is `refused`, and
# what it ordered along the axis Revit orders along the line itself.
#
# NOT CARRIED, ON PURPOSE: that card took any location curve - an arc, a flex
# run - and, with an axis named, runs out of parallel. Here a run must be
# straight (`notLinear` otherwise) and parallel to the first (`refused`
# otherwise), axis or not: the gap between two runs that are not parallel
# depends on where along them you look, and is not one number to draw.

# VERSION 3 (2026-11-01) - DIMENSION_FAMILY_INSTANCES WAS MERGED INTO THIS
# CARD on the owner's instruction ("make sure there is no duplicate tools"),
# and is DEPRECATED. The same job - one dimension string through a set, read
# back, never via Dimension.Curve - by the other route: the built-in centre
# references of family instances, which a run does not have. What it had and
# this card lacked is here now: the family-instance route along an axis (x
# asks CenterLeftRight first, y CenterFrontBack, then the strong reference;
# sorted along the axis; offset square to it), `noReference`, and "cannot
# dimension a room" said in `problem` - a room, space or area handed in is
# never dimensioned, and DIMENSION_ROOMS is named, which did not exist when
# that card wrote "nothing here does that yet".
#
# THE SAFER RULE IN EACH CONFLICT IS KEPT (the owner: "in every conflict keep
# the safer rule"). That card left a dimension holding fewer than two
# references in the caller's transaction and said so; here it is deleted
# again on both routes. That card had no check for an axis pointing out of
# the view; here it is refused on both. A set holding both runs and family
# instances - which each card would have half-done, dimensioning its own kind
# and naming the rest unusable - is refused whole, nothing drawn, with the
# count of each: one string, one kind. NOT CARRIED, as opposite: its
# `dimensionId` was InvalidElementId when nothing was drawn; `created` here is
# null then, as versions 1 and 2.
#
# WHERE ITS OUTPUTS ARE NOW: dimensionId -> created, dimensionedCount ->
# dimensionedCount, noReference -> noReference, problem -> problem. An element
# that is not a family instance went to its noReference; here it is in
# notLinear. Its sentences moved here.

# VERSION 4 (2026-11-01) - DIMENSION_GRIDS_AND_LEVELS WAS MERGED INTO THIS
# CARD on the owner's instruction ("make sure there is no duplicate tools";
# "merge means ... all area need to be covered"), and is DEPRECATED. The same
# job - one dimension string through a set on a view - by a third route: a
# grid or a level referenced as the whole element. What it had and this card
# lacked is here now: grids measured across the plan and levels up the
# elevation; `notVisibleInView`, checked against the view before anything is
# drawn and said in `problem`; an arc grid and a grid out of parallel refused
# by id; levels refused in a plan with the reason; grids and levels never one
# string; one datum, or datums at one position, drawing nothing with the
# reason; a level placed by ProjectElevation (row 5b-179); reference planes
# left out on purpose.
#
# THE SAFER RULE IN EACH CONFLICT IS KEPT (the owner: "in every conflict keep
# the safer rule"). That card dimensioned the grids and set a wall or duct
# handed in with them aside in `notADatum`; here a wall or a duct is a run,
# and runs with grids is two kinds, so the whole set is refused, naming each
# kind - a string through part of what was handed in reads as the job done.
# That card let a NewDimension refusal out, which aborts the caller's
# transaction, and kept a dimension holding fewer than two references; here
# the refusal is caught and said, and the dimension is read back and taken
# out again. NEW, for the merge: an axis named with datums is refused - their
# direction is worked out from them.
#
# NOT CARRIED, AS OPPOSITE: dimensioning the grids out of a set that also held
# other dimensionable kinds (above).
#
# THE DETAIL IS KEPT OUT OF THE PURPOSE ON PURPOSE. The purpose is searched:
# a version 4 paragraph there (notVisibleInView, the kinds refused together)
# sent the owner's question #44, "Make the dimension in room 4.", from
# DIMENSION_ROOMS to this card on the lexical and the trained backend,
# measured 2026-11-01 (tools/score-routing.py). Two lines and a table row
# moved nothing, so the purpose carries those and this comment the rest.
#
# WHERE ITS OUTPUTS ARE NOW: created -> created, refused -> refused,
# notVisibleInView -> notVisibleInView, notADatum -> notLinear (what is
# neither a run, an instance, a grid nor a level), findings -> problem (one
# sentence, the datum sentence appended). Its sentences moved here.


id: FRG-VIEW-021
semantic-identity: "put one dimension string through these on this view - parallel runs, fixtures, grids or levels"
kind: action
domain: revit.annotation
capability: CREATE_DIMENSION
version: 4
source: OFFICIAL
risk: MODIFY

purpose: >
  Draws one linear dimension across a set of parallel linear elements in a
  view, measuring centre to centre - and, since version 4, across grids or
  levels.

  **This is the duct-spacing dimension, and the setting-out one.** It
  dimensions between the CENTRELINES of linear elements - ducts, pipes,
  conduit, cable tray - which is how MEP spacing is dimensioned and checked,
  and across grids or levels, each referenced as the whole element. It does
  not dimension to wall faces, or between two points the user names. Those
  are real jobs and each needs a different kind of reference.

  **A reference has to be asked for before it exists.** Revit only hands back
  referenceable geometry when the geometry is read with `ComputeReferences`
  turned on, and an MEP centreline additionally only appears when non-visible
  objects are included. Read the geometry the ordinary way and every element
  yields nothing, with no error - the dimension simply never gets made.

  **AN AXIS MAY BE NAMED, AND IT READS BACK** (version 2, when
  DIMENSION_MEP_RUNS was merged in). Left empty, the string is measured
  across the runs at whatever angle they sit. `x` or `y` measures along that
  axis of the model - the way to dimension between risers, vertical pipes seen
  end-on in a plan, which have no direction across them on the view. The
  dimension Revit made is read back: `dimensionedCount` is the references it
  holds, and fewer than two will not survive a commit. `problem` says in one
  sentence why nothing was drawn. This is version 2; version 1's proof no
  longer describes the code and is kept as a record, and the fragment is DRAFT
  until it is proved again.

  **VERSION 3 DIMENSIONS FAMILY INSTANCES TOO** (DIMENSION_FAMILY_INSTANCES
  merged in). An air terminal, fixture or piece of equipment has no
  centreline; its built-in centre references are used instead, along the axis
  named - x or y, which it needs. One that publishes none is named in
  `noReference`. Runs and instances handed in together are refused, nothing
  drawn: one string is one kind. **IT CANNOT DIMENSION A ROOM** - a room's
  boundary offers none of these references - and says so.

  | What you are dimensioning | Use |
  |---|---|
  | Ducts, pipes, conduit, cable tray | **this fragment** - their centrelines |
  | Grids, or levels in a section or elevation | **this fragment**, axis left out |
  | Air terminals, fixtures, equipment - any family instance | **this fragment**, axis x or y - built-in centre references, which a run does not have |
  | Rooms - "dimension the rooms", "put the room sizes on the plan" | `DIMENSION_ROOMS`; to know them, `MEASURE_ROOM_DIMENSIONS` |

contract:
  needs:
    - name: doc
      type: Document
    - name: view
      type: View
      source: request
    - name: elements
      type: IList<Element>
    # Leave out to measure across the runs, at any angle. x or y measures
    # along that axis of the model - for risers seen end-on in a plan.
    # Version 3: family instances NEED x or y - "across" is worked out from
    # runs, and an instance has none; left out with instances, it is refused.
    # Version 4: grids and levels need it LEFT OUT - they are measured across
    # themselves; named with them, it is refused.
    - name: axis
      type: string
      source: request
      optional: true
      absent: across
    - name: offsetMm
      type: double
      source: request
  provides:
    - name: created
      role: result
      type: ElementId
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<ElementId>
    - name: notLinear
      # Handed in but neither a straight run nor a family instance - and,
      # version 3, every room, space or area handed in, which cannot be
      # dimensioned here; version 4, every reference plane, which is left out
      # on purpose (usually invisible on the sheet). A count of what it was GIVEN and could not use,
      # never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: notVisibleInView
      # Version 4, from DIMENSION_GRIDS_AND_LEVELS. Grids and levels handed in
      # that the view is not showing, set aside BEFORE anything is drawn -
      # Revit throws when asked to dimension to one, and the throw takes the
      # whole string down. Given and unusable, never a dimension it made
      # (D-52).
      role: accounting
      type: IList<ElementId>
    - name: noReference
      # Version 3, from DIMENSION_FAMILY_INSTANCES. Family instances that
      # publish no centre reference and no strong reference - duct fittings
      # and accessories among them - so there was nothing to dimension TO.
      # Given and unusable, never a dimension it made (D-52).
      role: accounting
      type: IList<ElementId>
    - name: dimensionedCount
      # Version 2. The references the dimension Revit made actually holds, READ
      # BACK - never through Dimension.Curve, which throws on a dimension this
      # new. Zero when nothing was drawn.
      role: result
      type: int
    - name: problem
      # Version 2. The sentence saying what stopped it, empty when nothing did.
      # The evidence it looked and could not, never a dimension it made (D-52).
      role: accounting
      type: string


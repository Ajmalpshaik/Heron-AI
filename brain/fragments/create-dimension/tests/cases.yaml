positive:
  - given: three parallel ducts running east-west on a plan view, offset 500 mm
    expect: >
      one dimension string across all three, measuring centre to centre, sitting
      500 mm along the run clear of the ducts

  - given: two parallel pipes at 45 degrees to the world axes
    expect: >
      the string is still square to the RUNS. The measuring axis is the view's
      normal crossed with the run direction, which is across the pipes whatever
      angle they sit at in the world

negative:
  - given: two ducts crossing at right angles
    expect: >
      the second is REFUSED and no string joins them. The distance between two
      non-parallel runs depends on where along them you look - a number that
      changes with nothing changing, and it must not be put on a drawing

  - given: ducts seen end-on in a section, so the run points at the viewer
    expect: >
      everything is refused and nothing is drawn. There is no direction across
      the runs that can be drawn on that view, and picking an arbitrary one
      would produce a dimension that measures something else

  - given: an air terminal, which has no location curve
    expect: >
      it goes to `notLinear`, kept separate from `refused`. It is a different
      job needing a face reference, not a failure of this one

  - given: geometry read without ComputeReferences and IncludeNonVisibleObjects
    expect: >
      every element yields a null Reference and NOTHING is drawn, with no error
      raised. That is why the refusals are counted and returned - this exact
      silence is what would otherwise read as success

  # VERSION 2 - DIMENSION_MEP_RUNS merged in.
  - given: three vertical pipe RISERS on a floor plan, axis empty
    expect: >
      nothing drawn, all three in `refused`, and `problem` saying they point at
      the viewer and to name the axis. Version 1 refused them with no sentence

  - given: the same three risers, axis x, offset 500 mm
    expect: >
      ONE dimension string along the model's X axis between their centrelines,
      `dimensionedCount` 3, `problem` empty. What version 1 could not draw at
      all

  - given: three ducts running east-west, axis x - an axis ALONG the runs
    expect: >
      nothing drawn, and `problem` saying the axis runs along them. A dimension
      measured along parallel runs has nothing to measure between them

  - given: axis left OUT entirely, three parallel ducts on a plan
    expect: >
      it runs - bound as "across", the same as version 1 - and draws one string
      across the ducts. Refused for a missing value would break every call
      version 1 took

  - given: axis y in a section looking north - the axis points out of the view
    expect: >
      nothing drawn, and `problem` saying the axis points out of this view - not
      Revit's own exception text

  - given: a dimension Revit makes holding fewer than two references
    expect: >
      it is DELETED again, `created` null, `dimensionedCount` 0 - never left in
      the transaction while the runs are reported refused

  - given: axis "diagonal"
    expect: >
      nothing looked at, nothing drawn, `problem` naming x, y or empty. A
      guessed axis measures the wrong direction and still looks plausible

  - given: two air terminals and nothing else
    expect: >
      both in `notLinear`, nothing drawn, and `problem` naming
      DIMENSION_FAMILY_INSTANCES as the route for family instances

second_route:
  - Revit's own Aligned Dimension tool snapped to the same two centrelines, compared for the value it reports

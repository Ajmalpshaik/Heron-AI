# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: styleName "Heron Setout", colour "0,0,255", weight 3, patternName "Dash"
    expect: >
      madeNew true and readBack "colour 0,0,255, weight 3, pattern Dash".
      Manage > Additional Settings > Line Styles lists it so

  # Version 2. A Generic Annotation family whose lines DRAW_FAMILY_DETAIL_LINES
  # drew on the subcategory "Signature".
  - given: >
      in that family, styleName "Signature", colour "0,0,255", weight 1,
      patternName "Solid", updateExisting true, familyCategory true
    expect: >
      madeNew false and readBack "colour 0,0,255, weight 1, pattern Solid";
      Manage > Object Styles > Annotation Objects shows Generic Annotations >
      Signature blue, and the signature's lines are blue in the family's view

  # Version 3. A new Generic Model family from the metric template, which has
  # no subcategory of Reference Planes yet.
  - given: >
      styleName "Secondary References", colour "128,128,128", weight 0,
      patternName "", parentCategory "Reference Planes"
    expect: >
      madeNew true and readBack "colour 128,128,128, ..." with the weight and
      pattern Revit gave it; Manage > Object Styles > Annotation Objects shows
      Reference Planes > Secondary References gray

  # Version 3: left out, the call is version 2's - the first positive case
  # above, run again with parentCategory not said, makes a line style.

  # Version 4 (row 5b-2047). The version 3 case with colour given and weight
  # and patternName NOT SAID - the call the owner's chat sent on 2026-11-26.
  - given: >
      styleName "Secondary References", colour "128,128,128", parentCategory
      "Reference Planes", updateExisting true, weight and patternName left out
    expect: >
      it runs - the reply's inputs line reads weight not given - "0" and
      patternName not given - "" - and readBack "colour 128,128,128, weight 1,
      pattern Solid", the same as the version 3 case that passed weight 0 and
      patternName ""

negative:
  - given: styleName "Heron Setout" again straight after, updateExisting not said
    expect: >
      refused - the style exists - and its graphics unchanged

  - given: patternName "No Such Pattern"
    expect: >
      refused before anything is made: no line pattern of that name

  # Version 2: the subcategory exists, and updateExisting was not said.
  - given: >
      the same family straight after, styleName "Signature", colour "255,0,0",
      weight 1, patternName "", familyCategory true, updateExisting not said
    expect: >
      refused - the family's category already has a subcategory named
      "Signature" - and its colour, weight and pattern unchanged

  # Version 2: familyCategory in a project, where there is no family category.
  - given: >
      a project in front, styleName "Heron Signature Test", colour "0,0,255",
      weight 1, patternName "", familyCategory true
    expect: >
      refused - the document is a project, not a family - and no line style
      or subcategory of that name made

  # Version 3: a category that does not exist.
  - given: >
      styleName "Secondary References", colour "128,128,128", parentCategory
      "No Such Category"
    expect: >
      refused - this family has no category of that name - and nothing made

  # Version 3: both ways of saying where it goes.
  - given: >
      styleName "Secondary References", parentCategory "Reference Planes",
      familyCategory true
    expect: refused - only one may say where the subcategory goes - and nothing made

  # Version 3: it exists now, and updateExisting was not said.
  - given: >
      the first version 3 case straight after, colour "255,0,0", updateExisting
      not said
    expect: >
      refused - Reference Planes already has a subcategory named "Secondary
      References" - and it is still gray

second_route:
  - Manage > Additional Settings > Line Styles, the row read by eye
  - in a family, Manage > Object Styles, the subcategory's row read by eye
  - in a family, Manage > Object Styles > Annotation Objects, Reference Planes > Secondary References read by eye
  - one Ctrl+Z removes it in a single step (Golden Rule 16)

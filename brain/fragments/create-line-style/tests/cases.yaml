# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: styleName "Heron Setout", colour "0,0,255", weight 3, patternName "Dash"
    expect: >
      madeNew true and readBack "colour 0,0,255, weight 3, pattern Dash".
      Manage > Additional Settings > Line Styles lists it so

  # Version 2. A Generic Annotation family whose lines DRAW_FAMILY_DETAIL_LINES
  # drew on the subcategory "Signature".
  - given: >
      in that family, styleName "Signature", colour "0,0,255", weight 1,
      patternName "", updateExisting true, familyCategory true
    expect: >
      madeNew false and readBack "colour 0,0,255, weight 1, pattern Solid";
      Manage > Object Styles > Annotation Objects shows Generic Annotations >
      Signature blue, and the signature's lines are blue in the family's view

negative:
  - given: styleName "Heron Setout" again straight after, updateExisting not said
    expect: >
      refused - the style exists - and its graphics unchanged

  - given: patternName "No Such Pattern"
    expect: >
      refused before anything is made: no line pattern of that name

  # Version 2: the subcategory exists, and updateExisting was not said.
  - given: >
      the same family straight after, styleName "Signature", colour "255,0,0",
      weight 1, patternName "", familyCategory true, updateExisting not said
    expect: >
      refused - the family's category already has a subcategory named
      "Signature" - and the signature still blue

  # Version 2: familyCategory in a project, where there is no family category.
  - given: >
      a project in front, styleName "Heron Signature Test", colour "0,0,255",
      weight 1, patternName "", familyCategory true
    expect: >
      refused - the document is a project, not a family - and no line style
      or subcategory of that name made

second_route:
  - Manage > Additional Settings > Line Styles, the row read by eye
  - in a family, Manage > Object Styles, the subcategory's row read by eye
  - one Ctrl+Z removes it in a single step (Golden Rule 16)

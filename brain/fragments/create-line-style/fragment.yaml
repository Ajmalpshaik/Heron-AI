compatibility-note: >
  One implementation for every release. Categories.NewSubcategory,
  Category.SubCategories, LineColor, SetLineWeight, GetLineWeight,
  SetLinePatternId, GetLinePatternId and GetGraphicsStyle,
  LinePatternElement.GetSolidPatternId and GetLinePatternElementByName are
  present 2020 through 2027 - read off RevitAPI.xml in the Nice3point
  reference packages for all eight releases on 2026-10-12. Version 2 adds
  Document.IsFamilyDocument, Document.OwnerFamily, Family.FamilyCategory and
  Category.CanAddSubcategory, read off tools/api-surface for 2020, 2024 and
  2027 on 2026-10-14 and compiled for all eight - the same members
  DRAW_FAMILY_DETAIL_LINES and SET_FAMILY_FORM_SUBCATEGORY already call.

# ROUTING - the same rows are in the fragments named here.
#
#   "make a red dashed line style"            -> here
#   "change the hidden lines style to blue"   -> here, updateExisting
#   "make the signature lines blue in this family" -> here, familyCategory and
#                                                updateExisting - the lines are on it
#   "change the colour of a subcategory in the family" -> here, familyCategory
#   "put this extrusion on the Hidden Lines subcategory" -> SET_FAMILY_FORM_SUBCATEGORY
#   "draw the lines of this detail item family" -> DRAW_FAMILY_DETAIL_LINES
#   "bring the object styles over from the template" -> TRANSFER_OBJECT_STYLES_BETWEEN_DOCUMENTS
#   "move these lines to the thin lines style" -> REMAP_LINE_STYLES
#   "bring the line styles from that model"   -> TRANSFER_LINE_STYLES_BETWEEN_DOCUMENTS
#   "make a dash dot pattern"                 -> CREATE_LINE_PATTERN
#   "what colour is the signature subcategory" -> LIST_CATEGORIES - a question goes to the read
#   "what colours, line weights and patterns does this view use" -> REPORT_CATEGORY_OVERRIDES -
#                                                a question goes to the read; it reached
#                                                here on the trained search (5b-480)


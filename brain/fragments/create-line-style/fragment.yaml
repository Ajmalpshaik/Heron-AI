id: FRG-VIEW-126
semantic-identity: "make a line style with this colour, weight and pattern, or change one - in a family, its own subcategory in Object Styles; or make a new Object Styles subcategory of any category, Reference Planes too"
kind: action
domain: revit.views
capability: CREATE_LINE_STYLE
# Version 2 (2026-10-14, FRAGMENT-ISSUES 5b-463): an optional `familyCategory`
# makes or changes a subcategory of the FAMILY'S OWN category - Object Styles
# in the Family Editor - with the same colour, weight and pattern. Left out it
# is false: a line style under Lines as version 1, which only gains a NOT KEPT
# finding when Revit does not hold a value that was asked for. The identity
# gained "- in a family, its own subcategory in Object Styles": the re-ranker
# reads only identity, capability and domain, and without those words 8 of 10
# unseen ways of asking for a subcategory's colour or weight reached
# SET_FAMILY_FORM_SUBCATEGORY on the trained backend (measured in row 5b-463).
#
# VERSION 4 (2026-11-26, FRAGMENT-ISSUES 5b-2047) - `colour`, `weight` and
# `patternName` may be LEFT OUT. The card always said each is optional by
# value (colour "" keeps black or the existing colour, weight 0 keeps 1 or the
# existing weight, pattern "" keeps Solid or the existing pattern), but the
# three needs were not marked optional, so a call that left out weight and
# patternName - the owner's Reference Planes > Secondary References recolour in
# a fixed axial-fan family, Revit 2020 - was refused as "values the CALLER
# supplies". Each is now `optional: true` with `absent:` the very value the C#
# already reads as "keep" ("", "0", ""), so the binder hands the fragment what
# the caller would have typed (HeronBindingNote.DeclaredAbsent, row 5b-488).
# The card only: impl/ is not touched, so the proof's fingerprint stands.
#
# VERSION 3 (2026-11-17, FRAGMENT-ISSUES 5b-1849) - an optional
# `parentCategory` makes or changes a subcategory under ANY category that takes
# one, in a project or a family - Reference Planes above all, so the owner's
# standing rule can be kept: in every family the outline and centre planes stay
# on Reference Planes and every other plane goes on a gray subcategory
# ("Secondary References", 128,128,128), which SET_FAMILY_PLANE_REFERENCE
# version 2 puts them on. Left out it is "none" and the call is version 2's to
# the letter. Back to DRAFT: version 2 was PROVEN on 2026-10-18 (the proof
# block below, kept as the record of what it proved); its C# moved, so it is
# DRAFT until NEEDS-CHECKING Group OK is run (D-30).
version: 4
source: OFFICIAL
risk: MODIFY

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# A LINE STYLE IS A SUBCATEGORY OF LINES, so it is made with NewSubcategory
# under Lines and given a colour, projection weight and pattern.
#
# EACH IS OPTIONAL BY VALUE: colour "" keeps black or the existing colour,
# weight 0 keeps 1 or the existing weight, pattern "" keeps Solid or the
# existing pattern. A pattern is found by name, never invented.
#
# AN EXISTING STYLE IS REFUSED unless updateExisting is true, and then its
# graphics change in place - every line drawn in it changes with it.
#
# A FAMILY'S OWN SUBCATEGORY (version 2): familyCategory true, in a family
# open in the Family Editor, works on the family category's subcategories -
# Object Styles, Annotation Objects or Model Objects tab - instead of Lines:
# Generic Annotations > Signature, the subcategory DRAW_FAMILY_DETAIL_LINES
# drew a signature on. The category's own name, or "none", is the category
# itself. A project is refused by name. It is a bool, not a category name,
# because only an optional bool may be left out (HeronBindingNote.AbsentValue)
# and a required input would break every caller; a project's Object Styles
# subcategory of another category (Walls > ...) is therefore not reached -
# recorded in row 5b-463. Version 3 reaches it: parentCategory is a string
# marked optional with `absent: none`, which the binder reads as typed
# (HeronBindingNote.DeclaredAbsent), so no caller has a new required input.
#
# ANY CATEGORY THAT TAKES A SUBCATEGORY (version 3): parentCategory is the
# category's name as Object Styles shows it - "Reference Planes", "Ducts" - or
# Revit's own OST_ name; Reference Planes is also found by its BuiltInCategory
# in any spelling, so it never hangs on whether the category list offers it. A
# category Revit lets take no subcategory (CanAddSubcategory false) is refused
# by name. Named together with familyCategory true it is refused: only one may
# say where the subcategory goes. Its own name, or "none", is the category
# itself, as for familyCategory. Changing an EXISTING project subcategory's
# graphics is SET_OBJECT_STYLE's job too; this card is the one that MAKES one.
#
# READ BACK: colour, weight and pattern off the style after one regeneration;
# a value asked for that Revit does not hold is named NOT KEPT.
#
# IT COVERS A RECOLOUR, SO A CHAT NEED NOT READ AGAIN AFTER ONE (checked
# 2026-10-17, row 5b-630). With familyCategory and updateExisting - "make the
# signature lines blue in this family" - readBack is Generic Annotations >
# Signature's own colour, weight and pattern as Revit holds them after the
# change, and the finding reads "Updated subcategory "Signature" of Generic
# Annotations: colour 0,0,255, weight 2, pattern Solid (read back)."; a value
# Revit did not keep is named NOT KEPT beside it. readBack is a declared string
# result, so revit_change prints it whole - unless the last reply of this
# capability in the same batch showed the same readBack word for word, when it
# is counted and kept in the run record (row 5b-407). So LIST_CATEGORIES after
# the change repeats this line and is not needed. What readBack does NOT say is the value
# BEFORE the change - for that, LIST_CATEGORIES with categories "Generic
# Annotations > Signature" is one row (version 3) where version 2 was every
# Object Styles row. Not yet run in Revit when this was written.
#
# REMAP_LINE_STYLES moves lines from one style to another; this makes or
# changes a style.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Creates a line style - Manage > Additional Settings > Line Styles - with a
  colour, line weight and line pattern, or changes the graphics of an existing
  one. In a family it does the same to a subcategory of the family's own
  category, in Object Styles - or of any category that takes one, Reference
  Planes above all.

contract:
  needs:
    - name: doc
      type: Document
    - name: styleName
      type: string
      source: request
    # "R,G,B" each 0 to 255; an EMPTY value, or left out (version 4), keeps
    # black, or the existing colour.
    - name: colour
      type: string
      source: request
      optional: true
      absent: ""
    # 1 to 16; 0, or left out (version 4), keeps 1, or the existing weight.
    - name: weight
      type: int
      source: request
      optional: true
      absent: "0"
    # A line pattern by name, or "Solid"; an EMPTY value, or left out
    # (version 4), keeps Solid, or the existing pattern.
    - name: patternName
      type: string
      source: request
      optional: true
      absent: ""
    # true changes an existing style of that name; false, or not said,
    # refuses it.
    - name: updateExisting
      type: bool
      source: request
      optional: true
    # true works on a subcategory of the open FAMILY's own category - Object
    # Styles in the Family Editor - instead of a line style under Lines; its
    # own name, or "none", is the category itself. false, or not said, is a
    # line style, as version 1. A subcategory the lines are already on exists,
    # so recolouring it needs updateExisting too.
    - name: familyCategory
      type: bool
      source: request
      optional: true
    # VERSION 3. The category the subcategory goes under, as Object Styles
    # shows it - "Reference Planes" - or its OST_ name, in a project or a
    # family; it must take subcategories. "none", or not said, is version 2: a
    # line style under Lines, or familyCategory's. Not with familyCategory.
    - name: parentCategory
      type: string
      source: request
      optional: true
      absent: none
  provides:
    - name: style
      role: result
      type: GraphicsStyle
    - name: madeNew
      role: result
      type: bool
    - name: readBack
      # The style's colour, weight and pattern, read off it afterwards.
      role: result
      type: string
    - name: refused
      # Why NOTHING WAS CHANGED, as one sentence; null otherwise (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>


compatibility-note: >
  ONE PATH FOR EVERY RELEASE, read rather than remembered. On 2026-09-24
  tools/api-surface read the reference assemblies of all eight releases, 2020
  through 2027: `WallType.Kind`, `Wall.CurtainGrid`, CurtainGrid's
  `GetUGridLineIds`, `GetVGridLineIds` and `GetMullionIds` (each an
  ICollection of ElementId), `CurtainGridLine.FullCurve`,
  `Mullion.LocationCurve`, the four `Parameter.Set` overloads (ElementId,
  double, int, string), `Parameter.AsValueString()` and the application's
  `AngleTolerance` carry one signature on every release. `SpacingRuleLayout`
  has the same five values on all eight - None 0, FixedDistance 1,
  FixedNumber 2, MaximumSpacing 3, MinimumSpacing 5 - and the values are cast
  from the enum, never typed. The API reference text of all eight releases
  (2020 to 2026 from the reference packages, 2027 from its own RevitAPI.xml)
  lists SPACING_LAYOUT_VERT and _HORIZ ("Layout"), SPACING_LENGTH_VERT and
  _HORIZ ("Spacing") and the per-wall ids this measures, with the same display
  names; it says nothing about which of them sit on the type and which on the
  wall, and nothing tying U or V to vertical, which is why both are measured.
  No ElementId is constructed and none is read as a number.
  VERSION 3, read the same way on 2026-10-29, all eight releases:
  CurtainSystemType derives from HostObjAttributes, as WallType does, and
  declares nothing of its own; CurtainSystem.CurtainGrids (a CurtainGridSet,
  enumerable, null when it holds none) and GetTypeId; BuiltInCategory
  OST_CurtaSystem; ElementType.Name and FamilyName; Document.Title. The
  BuiltInParameter ids SPACING_LAYOUT_1 and _2 ("Layout"), SPACING_LENGTH_1
  and _2 ("Spacing"), SPACING_NUM_DIVISIONS_1 and _2 ("Number"),
  SPACING_JUSTIFICATION_1 and _2, CURTAINGRID_ANGLE_1 and _2,
  CURTAINGRID_ORIGIN_1 and _2, and the SPACING_LAYOUT_U, _V and plain
  SPACING_LAYOUT it probes, are on all eight. The reference text of all eight
  gives each id only its display name - the same names as the _VERT/_HORIZ
  ids - and nothing about which element carries it, so the curtain system
  type's ids are an assumption the code checks and the proof settles. It calls
  CurtainGrid.Grid1Angle "the U grid line pattern" and Grid2Angle the V one,
  and says nothing of which way either runs on a face.


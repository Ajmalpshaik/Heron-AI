id: FRG-SHT-004
semantic-identity: "add a new revision to the project's revision schedule"

# BACK TO DRAFT ON 2026-09-28, AND THE PROOF BLOCK BELOW IS KEPT ON PURPOSE.
# Widened so Add fills every column of the Sheet Issues/Revisions row - issued
# to, show, numbering and the issued tick joined description, date and issued
# by - so the 2026-09-08 fingerprint no longer matches the code. The refusal of
# an empty description it recorded is unchanged, and is the negative to
# re-prove with.
kind: action
domain: revit.sheets
capability: CREATE_REVISION
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Creates a revision in the project and fills in its description, date,
  issued by, issued to, show (cloud and tag, tag or none) and numbering
  sequence - every column Add fills in Sheet Issues/Revisions. An empty
  value leaves Revit's default; the word <blank> writes an empty one.

  **It is the input ADD_REVISION_CLOUD could not get.** That fragment needs a
  `revisionId` and deliberately refuses to invent one - picking "the latest"
  automatically is wrong often enough to matter. Nothing in the library could
  produce one, so the whole revision job stopped at the first step.

  **A new revision is NOT issued unless `issueState` says `issue`.** Issuing
  locks the description, date, issued to, issued by and numbering, and no new
  cloud can go on it - right for recording an issue that has already gone out,
  wrong by default. It is never implied by another value, and it is set last.

  **Everything is checked before anything is made, and every column is read
  back.** A value that does not read back after the revision exists throws,
  and the add-in rolls the whole call back - never a half-filled row.

contract:
  needs:
    - name: doc
      type: Document
    - name: description
      type: string
      source: request
    - name: revisionDate
      type: string
      source: request
    - name: issuedBy
      type: string
      source: request
    - name: issuedTo
      type: string
      source: request
    # The dialog's Show column: "cloud and tag", "tag" or "none". Empty
    # leaves Revit's default.
    - name: show
      type: string
      source: request
    # 2022 on, a numbering sequence's name ("Numeric", "Custom"). 2020 and
    # 2021 have no named sequences: "numeric", "alphanumeric" or "none".
    # Empty leaves Revit's default.
    - name: numbering
      type: string
      source: request
    # "issue" issues it after every other column is written. Empty does not.
    - name: issueState
      type: string
      source: request
  provides:
    - name: created
      role: result
      type: ElementId
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string
    - name: sequence
      role: result
      type: int
    - name: findings
      # The new row READ BACK from Revit - every column. A string, so the
      # reply prints all of it.
      type: string


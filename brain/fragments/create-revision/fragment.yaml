id: FRG-SHT-004
semantic-identity: "add a new revision to the project's revision schedule"
kind: action
domain: revit.sheets
capability: CREATE_REVISION
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Creates a revision in the project and fills in its description, date and
  issued-by.

  **It is the input ADD_REVISION_CLOUD could not get.** That fragment needs a
  `revisionId` and deliberately refuses to invent one - picking "the latest"
  automatically is wrong often enough to matter. Nothing in the library could
  produce one, so the whole revision job stopped at the first step.

  **A new revision is NOT issued, and that is deliberate.** `Issued` is a
  one-way gate in Revit: once set, the revision's description and date are
  locked and clouds can no longer be added to it. Creating one already issued
  would produce a revision nobody can cloud, which is the exact opposite of why
  it was made.

contract:
  needs:
    - name: doc
      type: Document
    - name: description
      type: string
      source: request
    - name: revisionDate
      type: string
      source: request
    - name: issuedBy
      type: string
      source: request
  provides:
    - name: created
      role: result
      type: ElementId
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: string
    - name: sequence
      role: result
      type: int


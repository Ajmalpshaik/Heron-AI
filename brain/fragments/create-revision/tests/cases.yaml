positive:
  - given: description "Coordination comments", date "02/09/26", issued by "AP"
    expect: a revision in the project, third in the sequence say, with `sequence` reporting 3

  - given: >
      every column at once on a TEST COPY - issuedTo "Client", show "tag",
      numbering "Custom" (2022 on) or "alphanumeric" (2020, 2021)
    expect: >
      each read back in `findings`; the new row in Sheet Issues/Revisions
      shows all of them

  - given: issueState "issue"
    expect: >
      issued, and set LAST - every other column went in first, because
      issuing locks them

  - given: the new revision handed straight to ADD_REVISION_CLOUD
    expect: >
      the clouds are drawn against it and appear on the titleblock's revision
      schedule. That composition had no first step before this fragment existed

negative:
  - given: an empty description
    expect: >
      refused. Revit allows an unlabelled revision; a drawing office does not,
      and it appears as a blank row in the schedule on a signed drawing

  - given: a date written "2 Sep 2026" rather than "02/09/26"
    expect: >
      stored exactly as given. RevisionDate is free text and goes straight onto
      the titleblock, so the project's convention wins - reformatting it would
      change what a signed drawing says

  - given: the revision checked for its Issued flag, issueState empty
    expect: >
      NOT issued. Issuing locks the description, date, issued to, issued by
      and numbering and refuses any new cloud, so it happens only when
      issueState says "issue"

  - given: show "sideways", or numbering naming a sequence the project lacks
    expect: >
      refused with the words it takes or the sequences there are, and NOTHING
      created - every value is checked before the revision is made

second_route:
  - Revit's own View > Revisions dialog, and a sheet's revision schedule, read for the same row

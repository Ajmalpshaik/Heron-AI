revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release, no #if. Read with tools/api-surface
  off the reference assemblies of all eight releases, 2020 to 2027, on
  2026-10-28, one signature on every one: Creation.Document.NewCurtainSystem2
  (ReferenceArray, CurtainSystemType) returning ICollection of ElementId;
  CurtainSystem.CurtainGrids and .CurtainSystemType; CurtainGridSet (Size,
  enumerable); CurtainGrid.GetUGridLineIds, GetVGridLineIds, GetPanelIds and
  GetMullionIds; CurtainSystemType (a HostObjAttributes) and
  ElementType.FamilyName; GeometryInstance.GetSymbolGeometry() and
  .Transform; Transform.OfVector, Multiply and Identity; Face.Reference,
  .Area, .GetBoundingBox and .ComputeNormal(UV); PlanarFace.FaceNormal;
  Options.ComputeReferences; ReferenceArray and Append; ElementCategoryFilter,
  LogicalOrFilter, FilteredElementCollector.WherePasses, OfCategory and
  ToElementIds; Document.GetElement(string); BuiltInCategory OST_Mass,
  OST_GenericModel and OST_CurtaSystem, BuiltInParameter ALL_MODEL_MARK and
  the ElementId(BuiltInCategory) constructor. The remarks quoted in the
  comments above are RevitAPI.xml's, read off the 2024 reference package. An
  id is matched by its own ToString() and never built from a number, so
  2024's 64-bit change does not reach this code.

# ROUTING - the same rows, the other way round, are in CREATE_WALL and
# DIVIDE_FAMILY_SURFACE.
#
#   "put a curtain system on the faces of
#    this mass"                              -> here
#   "curtain system by face on the side
#    faces of mass Tower A"                  -> here, host "Tower A"
#   "make a facade on the mass faces"        -> here
#   "draw a curtain wall between these
#    points"                                 -> CREATE_WALL, with a curtain wall
#                                               type. A curtain WALL is drawn
#                                               along a line; a curtain SYSTEM
#                                               sits on a mass's faces and has
#                                               no line of its own
#   "divide the surface of this mass into
#    panels"                                 -> DIVIDE_FAMILY_SURFACE - a
#                                               divided surface on a form INSIDE
#                                               the mass family, in the Family
#                                               Editor. This one works on a
#                                               mass PLACED in the project and
#                                               makes a project curtain system
#   "how many panels are on this curtain
#    system"                                 -> NOT HERE - a question never lands
#                                               on a write (D-86). Nothing reads
#                                               a curtain system yet:
#                                               REPORT_CURTAIN_ELEMENTS reads a
#                                               curtain WALL and calls anything
#                                               else "not a wall". This card's
#                                               readBack counts them only for
#                                               what it has just made. Measured
#                                               2026-10-28 on the trained
#                                               backend: it reaches
#                                               REPORT_CURTAIN_ELEMENTS
#   "what is this facade made of", "how
#    much glass is in this facade"           -> REPORT_CURTAIN_ELEMENTS, never
#                                               here (D-86). Measured 2026-10-28:
#                                               once "make a facade on the mass
#                                               faces" was declared here, the
#                                               second one ranked HERE, so it is
#                                               declared on that card now; the
#                                               first is that card's own
#   "add mass floors to this mass"           -> CREATE_MASS_FLOORS
#   "set the curtain wall grid spacing"      -> SET_CURTAIN_WALL_GRID - a curtain
#                                               WALL type
#   "set the curtain system grid spacing
#    to 1500"                                -> SET_CURTAIN_WALL_GRID, on the
#                                               curtain SYSTEM type this lays
#                                               out - its Grid 1 and Grid 2
#                                               (version 3, 2026-10-29; DRAFT
#                                               until NEEDS-CHECKING Group JP).
#                                               This makes the curtain system;
#                                               that sets the type it is of
#   "put mullions on the curtain system
#    type"                                   -> SET_CURTAIN_WALL_MULLIONS, the
#                                               same way - Grid 1 and Grid 2
#                                               Mullions (version 2, DRAFT until
#                                               Group JP)
#   "put this family on the face of the
#    mass"                                   -> PLACE_FAMILY_ON_FACE

utterances:
  - put a curtain system on the faces of this mass
  - make a facade on the mass faces
  - curtain system by face on the side faces of mass Tower A

compatibility-note: >
  One implementation for every release, and almost none of it is Revit. The
  only API touched is reading a location - `Element.Location` as `LocationPoint`
  or `LocationCurve`, then `Element.get_BoundingBox(null)` as the fallback - and
  all three are unchanged 2020 to 2027.

  Lengths come out of Revit in feet and are converted to millimetres by
  multiplying by 304.8 (D-20). No units API is touched, so nothing here meets
  the 2021 move to ForgeTypeId.

# ROUTING - repeated in CREATE_ELECTRICAL_RUN, RENUMBER_SEQUENTIAL and
# MEASURE_ELEMENT_LENGTHS.
#
#   "what order do I connect these in"    -> here
#   "which order should these be wired"   -> here
#   "how much cable to connect these"     -> here, as an ESTIMATE. Not a cable
#                                            schedule
#   "chain these off that unit"           -> here with mode chain
#   "draw the run"                        -> NOT here. This computes an order
#                                            and draws nothing. The drawing is
#                                            CREATE_ELECTRICAL_RUN, and it
#                                            consumes a sequence rather than
#                                            computing one - so the two COMPOSE,
#                                            this one first
#   "renumber these in order"             -> RENUMBER_SEQUENTIAL, which says
#                                            outright that it does not choose
#                                            the order. Same composition: this
#                                            one supplies the order it needs
#
# THE TWO ROWS ABOVE USED TO READ "-> here first, then X" AND THAT WAS AN
# OVERCLAIM. A sentence naming the WRITE is answered by the writer; what this
# fragment supplies is the input it was always missing. Written the other way,
# the table claimed two sentences the index correctly refused it.
#   "how long is this duct"               -> MEASURE_ELEMENT_LENGTHS - the
#                                            length of things that EXIST. This
#                                            one estimates the length of a run
#                                            that does not exist yet
#
# THE TWO CONSUMERS ARE THE REASON THIS EXISTS. Both were built needing a
# sequence and neither could produce one, so both quietly required a human to
# supply it.


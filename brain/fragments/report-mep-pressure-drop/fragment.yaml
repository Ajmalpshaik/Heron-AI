id: FRG-MEP-028
semantic-identity: "Revit's own pressure loss per section, and which sections are the index run"
kind: action
domain: revit.mep
capability: REPORT_MEP_PRESSURE_DROP
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Reads the pressure loss Revit has ALREADY CALCULATED for each duct or pipe
  system - section by section, with flow, velocity and friction - and marks the
  **critical path**, the index run that sizes the fan or the pump. It changes
  nothing.

  **REVIT ALREADY COMPUTES THIS AND NOTHING HERE WAS READING IT.** Once a system
  is connected and sized, Revit divides it into sections and works out the
  hydraulics for each. Every pressure question in this library was being answered
  from first principles while the model already knew. Measured before this batch,
  *"what is the pressure drop in this duct run"* resolved to `SET_MEP_SLOPE` -
  a **write**, for a question.

  **THE CRITICAL PATH IS THE POINT OF THE REPORT.** Total loss along the critical
  path is what the fan or pump has to overcome; the rest of the system is not the
  constraint. Sizing off the whole-system total instead over-specifies the plant.
  Those sections are marked, summed separately, and reported first.

  **A SYSTEM THAT IS NOT FULLY CONNECTED REPORTS ZERO, NOT AN ERROR, AND THAT IS
  THE TRAP.** Revit only computes hydraulics for a complete, sized, connected
  system. A run with an open end, an unconnected terminal or an unsized segment
  gives a section count of 0 - which reads as *"no pressure loss"* when it means
  *"not calculable"*. Those systems are listed **separately and named
  UNCALCULATED**, never folded into the table as zeros. `FIND_DEAD_ENDS` and
  `CONNECT_OPEN_ENDS` are what fix the cause.

  **SECTION INDEX AND SECTION NUMBER ARE NOT THE SAME THING.** `SectionsCount`
  bounds the INDEX; the number is a property of the section and is not guaranteed
  to run 1..N without gaps. Looping over numbers reads some sections twice and
  misses others - and being a report, it looks plausible either way. **This
  iterates by index and reads `.Number` off each section.**

  **PRESSURE AND FRICTION STAY IN REVIT'S INTERNAL UNITS AND ARE SAID TO BE.**
  Converting them needs the units API, which is the call that breaks at Revit
  2021. A number converted by a guessed rule looks finished and is wrong; the
  raw value with its caveat does not. Compare against Revit's own system
  properties, where the same numbers appear formatted.

contract:
  needs:
    - name: doc
      type: Document
    - name: systemNameContains
      type: string
      source: request
  provides:
    - name: findings
      type: IList<string>
    - name: systemsCalculated
      # How many systems carried a calculation to read. The size of the sweep,
      # never a pressure it found (D-52).
      role: accounting
      type: int
    - name: uncalculated
      # Systems Revit has never calculated, LISTED SEPARATELY AND NAMED
      # UNCALCULATED, NEVER FOLDED INTO THE TABLE AS ZEROS - a zero pressure
      # drop and an uncalculated system look identical and are not.
      role: result
      type: IList<string>
    - name: criticalPathTotals
      role: result
      type: IList<string>


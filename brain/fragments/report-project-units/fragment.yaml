id: FRG-DOC-040
semantic-identity: "which units, symbols and rounding does this project use"

# WHY IT EXISTS - a comment, not `purpose`, because `purpose` is searched.
# Nothing in the library read Manage > Project Units (a search for GetUnits
# found two fragments, both reading one value's format, neither the
# project's settings). The building loads write Watts or Btu/h and L/s or CFM
# depending on what the project is set to (NEEDS-CHECKING CC12), and the
# owner asked on 2026-10-06 for the setup a loads run needs to be readable
# and settable, each half in its own tool: this is the read half of
# SET_PROJECT_UNITS.
kind: action
domain: revit.document
capability: REPORT_PROJECT_UNITS
version: 1
source: OFFICIAL
risk: READ

# HOW IT ANSWERS - a comment, not `purpose`, because `purpose` is searched, and
# naming units here pulled CHANGES like "show the loads in Btu/h" to this read
# (measured 2026-10-06).
#
# **THE WORDS ARE REVIT'S.** Every unit type, unit and symbol name is asked
# of Revit's own labels at run time - "Cooling Load", "British thermal units
# per hour", "Btu/h" - so a symbol SET_PROJECT_UNITS or the building loads
# must match is printed exactly as the model holds it, never retyped.
#
# **A UNIT TYPE IS NAMED WITH ITS DISCIPLINE** - "HVAC: Temperature",
# "Piping: Temperature" - because several disciplines have one of the same
# name and the dialog keeps them apart by its Discipline list.
#
# **THE WHOLE TABLE IS ONE STRING**, rows joined, because a list reaches the
# chat cut to three entries and the table is the answer.
purpose: >
  Answers which units this project uses - metric or imperial, and for every
  unit type, discipline by discipline (length, area, volume, cooling load,
  heating load, air flow, temperature and the rest), which units, which
  symbol and how many decimals - by reading Manage > Project Units, in
  Revit's own words, with the decimal symbol / digit grouping. Nothing needs
  to be selected and nothing changes.

contract:
  needs:
    - name: doc
      type: Document
  provides:
    - name: unitsTable
      # Every unit type, one row each: "HVAC: Cooling Load = Watts (W), 0
      # decimal places", the decimal symbol / digit grouping first.
      role: result
      type: string
    - name: unitTypes
      # How many unit types were read - a count of what it FOUND.
      role: result
      type: int
    - name: findings
      # How many in which disciplines, which of Revit's two units APIs was
      # used, and any unit type that could not be read, named.
      type: string

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  ONE IMPLEMENTATION ACROSS THE 2021 UNITS CHANGE, BY REFLECTION. Measured
  with tools/api-surface --members on the reference assemblies of all eight
  releases on 2026-10-06. Revit 2020 has only `Units.GetModifiableUnitTypes`,
  `GetFormatOptions(UnitType)`, `FormatOptions.DisplayUnits` and
  `UnitSymbol`, `UnitUtils.GetUnitGroup(UnitType)` and `LabelUtils.GetLabelFor`
  for the three enums. 2021 has both those and the ForgeTypeId set -
  `Units.GetModifiableSpecs`, `GetFormatOptions(ForgeTypeId)`,
  `FormatOptions.GetUnitTypeId` and `GetSymbolTypeId`, and
  `LabelUtils.GetLabelForSpec`, `GetLabelForUnit` and `GetLabelForSymbol` -
  and its discipline only through `UnitUtils.GetUnitGroup(ForgeTypeId)`.
  2022 to 2027 have only the ForgeTypeId set, with `UnitUtils.GetDiscipline`
  and `LabelUtils.GetLabelForDiscipline` from 2022. Naming either set fails to
  compile on the releases without it, and the add-in compiles a fragment with
  no release symbols (FRAGMENT-ISSUES 5b-181), so both are reached by
  reflection and the ForgeTypeId route is taken wherever it exists - on 2021
  as well, where the enums still work but are obsolete. `Units.DecimalSymbol`,
  `DigitGroupingSymbol`, `DigitGroupingAmount` and `FormatOptions.Accuracy`
  are present and unchanged on all eight and are called directly.

# ROUTING - the same rows are in SET_PROJECT_UNITS, REPORT_LOCATION and
# SET_PROJECT_LOCATION.
#
#   "what units is this project in"         -> here
#   "is cooling load in watts or Btu/h"      -> here
#   "what symbol does air flow show"         -> here
#   "set cooling load to Btu/h"              -> SET_PROJECT_UNITS. A question
#                                               never reaches that write (D-86)
#   "where is this project"                  -> REPORT_LOCATION - the site,
#                                               not how it is measured
#   "what is this duct's flow"               -> a parameter read; this reads
#                                               how numbers are SHOWN, not any
#                                               element's value

utterances:
  - what units is this project in
  - show the project units
  - is cooling load in watts or btu/h
  - what symbol does air flow use

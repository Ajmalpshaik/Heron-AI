id: FRG-QA-008
semantic-identity: "what is actually different between these two elements"
kind: action
domain: revit.qa
capability: COMPARE_ELEMENTS
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Given two or more elements, reports only the parameters whose values DIFFER
  between them, and which value each one holds. The answer to "why is this duct
  behaving differently from that one" - a question that a full parameter dump
  cannot answer, because the difference is three rows hidden among fifty
  identical ones.

  **THE SUPPRESSION IS THE FEATURE.** A real element carries fifty to eighty
  parameters and on two elements of the same type nearly all of them match.
  Printing all of them and leaving a person to spot the difference is the same
  work they came here to avoid. `differing` holds only what actually differs;
  `identicalCount` says how many were checked and matched, so "they are the
  same" is a stated finding rather than an empty result that might be a failure.

  **VALUES ARE COMPARED AS REVIT DISPLAYS THEM, NOT AS DOUBLES.** Two ducts both
  drawn at 2500 mm can hold internal feet that differ in the twelfth decimal
  place. Compared as numbers they differ; compared as the text Revit shows,
  they match - and matching is the true answer, because nothing in the model
  behaves differently because of that noise. The cost is that a real difference
  smaller than the project's display rounding is invisible here, which is
  stated rather than hidden.

  **A PARAMETER MISSING FROM ONE ELEMENT IS A DIFFERENCE, AND THE MOST USEFUL
  ONE.** Comparing a wall against a duct, most parameters exist on only one
  side. Those are reported as differences with the absent side marked, rather
  than skipped for not being comparable - "this one has no System Name at all"
  is usually the answer being looked for.

  **TYPE PARAMETERS ARE INCLUDED AND MARKED.** If two elements differ only in
  their type, every difference lives on the type, and a comparison of instance
  parameters alone reports them as identical - a confident wrong answer to
  exactly the question asked.

contract:
  needs:
    - name: elements
      type: IList<Element>
    - name: doc
      type: Document
      source: ambient
  provides:
    - name: differing
      role: result
      type: IDictionary<string, IList<string>>
    - name: identicalCount
      # How many parameters were checked and matched. A count of what was
      # LOOKED AT - `differing` is what finding something looks like, and this
      # is named in tools/jobs/example.yaml as the reason that job file says
      # `expect: differing` (D-52).
      role: accounting
      type: int
    - name: comparedCount
      # How many parameters were compared at all. A count of what was LOOKED
      # AT, never a difference it found (D-52).
      role: accounting
      type: int
    - name: tooFewToCompare
      # That fewer than two elements arrived, so there was nothing to compare.
      # The evidence it looked and declined (D-52).
      role: accounting
      type: bool


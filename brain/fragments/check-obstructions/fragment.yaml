    none
  caveat: >-
    THE NEGATIVE HERE IS NOT A FAULT AND MUST NOT BE READ AS ONE. Both legs used the SAME
    point, the SAME direction and the SAME distance in the SAME model; the only difference is
    that Walls are switched off in Visibility/Graphics in 'HERON NO WALLS'. blocked 1 became
    clear 1. That is ReferenceIntersector doing exactly what it documents - it sees what the
    view sees - and it is the case tests/cases.yaml calls "the fragment behaving correctly
    while giving a dangerous answer". A clearance check run in a view with a category hidden

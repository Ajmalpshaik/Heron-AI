    notChecked 0. inputs came view3d as given; points as given (1); direction as given; maxDistance
    as given. on test projject
  negative_case: run with view3d=HERON NO WALLS, points=4000,3000,1500, direction=1,0,0, maxDistance=6000
    instead - chosen because it should not contain what this fragment reports. returned MillimetresPerFoot
    304.8, blocked 0 item(s), clear 1 item(s) [(13.123359580, 9.842519685, 4.921259843)],
    maxDistance 19.6850393700787, notChecked 0. inputs came view3d as given; points as given
    (1); direction as given; maxDistance as given. on test projject
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';

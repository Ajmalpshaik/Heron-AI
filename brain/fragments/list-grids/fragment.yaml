heron-agent: HERON-REVIT-LVL-027
heron-step: 16
heron-status: DRAFT
heron-since: 0.1.0
heron-layer: brain

id: FRG-ELE-023
semantic-identity: "every column grid line in the project, in the order a drawing reads them"
kind: filter
domain: revit.datums
capability: LIST_GRIDS
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Collects the project's column grids and reports each one's name and which way
  it runs.

  **Grid names are not sortable as text, and this is the case that proves it.**
  A normal grid runs 1 to 12 one way and A to N the other. Sorted as strings,
  "10" comes before "2" - so the list reads 1, 10, 11, 12, 2, 3, and a modeller
  scanning for grid 3 finds it in the wrong half. The numbers are compared as
  numbers and the letters as letters, which is how the drawing reads.

  **Which way each grid runs is on the row**, because that is what somebody
  actually wants: *"which grid is nearest"* and *"is this on grid 5"* both
  depend on knowing whether 5 is a north-south line or an east-west one, and no
  name says.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, every loaded link is read too and
  `linksSearched` says how many were: set and 0 means "you asked, and none
  are loaded", which is a different answer from host-only. Each link's grids are listed in `linkedMatches`,
  in the same order, with their direction turned into this model's terms
  when the link is placed rotated.
  **NOTHING FROM A LINK IS EVER SELECTED OR CARRIED** - `elements` and `notLinear` stay this model's own; the chain
  revives ids against this model, and a linked id that happens to be in
  use here binds an unrelated element (FRAGMENT-ISSUES row 75). Links
  nested inside a link are not read, and are counted in the answer. This
  is version 2; version 1's proof no longer describes the code, and the
  fragment is DRAFT until it is proved again.

contract:
  needs:
    - name: doc
      type: Document
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: elements
      role: result
      type: IList<Element>
    - name: findings
      type: IList<string>
    - name: notLinear
      # Handed in but not linear grids, so there was nothing here to act on. A
      # count of what it was GIVEN and could not use, never a thing it found
      # (D-52).
      role: accounting
      type: IList<ElementId>
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then one line per link. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75).
      role: accounting
      type: IList<string>

proof:
  date: '2026-09-13'
  by: Ajmal PS
  model: >
    Snowdon Towers Sample HVAC.rvt (9,628 elements) and Project1 (3,410 elements, unsaved default template), both open at once in Revit 2024.3
  positive_case: >
    Snowdon Towers: 15 grids, each reported with its direction - '1 - runs north-south'. Countable against the plan.
  negative_case: >
    Project1: 0 grids, and notLinear 0. An empty model returns an empty list rather than inventing one, and it does NOT return Snowdon's 15 - both documents were open at the same time.
  second_route: >
    Revit's own Project Browser and any plan view show the 15 grid bubbles; the count is checkable by eye.
  fingerprint: "2f076288055d1e1a"

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  `Grid`, `Grid.Curve` and `Grid.Name` are unchanged 2020 to 2027. No ElementId
  is built from an int, so 2024's 64-bit ids do not reach this code.

# ROUTING - repeated in CREATE_GRID and SNAP_TO_GRID.
#
#   "list the grids"            -> here
#   "how many grids"            -> here
#   "which grids do we have"    -> here
#   "add a grid"                -> CREATE_GRID
#   "space these out on a grid" -> SNAP_TO_GRID. THE WORD "GRID" MEANS TWO
#                                  DIFFERENT THINGS and this is the collision
#                                  worth knowing: a COLUMN grid is the
#                                  building's setting-out datum; a LAYOUT grid
#                                  is an imaginary spacing for placing
#                                  diffusers. SNAP_TO_GRID means the second and
#                                  every fragment here means the first
#   "list the levels"           -> LIST_LEVELS
#   "the grid bubbles are on the wrong side" -> SET_DATUM_BUBBLES

#   "make a grid series across the building" -> CREATE_GRIDS - a WRITE
utterances:
  - list the grids
  - how many grids
  - what grids do we have
  - show me the grid lines
  - which column grids are there
  - grid names

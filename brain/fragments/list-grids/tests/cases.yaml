positive:
  - given: grids 1 to 12 and A to N
    expect: >
      1, 2, 3 … 12 then A … N - the order the drawing reads. Sorted as text it
      would be 1, 10, 11, 12, 2, 3, and somebody looking for grid 3 finds it
      sixth

  - given: mixed names like A1, B10, CG-2
    expect: grouped by their letters, then numerically within each - which is how a real project numbers them

  - given: "which grid is nearest"
    expect: >
      every row carries which way the grid runs. The name never says, and both
      conventions - numbers north-south and numbers east-west - exist in the
      same building

  # D-59, added 2026-09-28 with version 2. NOT RUN.
  - given: >
      includeLinks true on Snowdon-scratch_ajmal.al
    expect: >
      `elements` unchanged, and each link's grids in the same
      order with a direction; on a rotated link, directions in this model's
      terms

negative:
  - given: a radial grid in a curved facade
    expect: >
      it is LISTED and reported as curved, with no direction. A curve's
      direction is only true at one point on it, and printing one would be a
      confident wrong answer

  - given: a grid two degrees off true north
    expect: >
      still reported north-south. The threshold is generous on purpose - it is
      a north-south grid to everybody who works on the drawing

  # D-59, added 2026-09-28 with version 2. NONE OF THESE HAS BEEN RUN.
  - given: includeLinks ABSENT, on a model that HAS loaded links
    expect: >
      the same answer as version 1's proof, and linksSearched 0 with the first
      line of linkedMatches reading "Host model only - links not read". The
      switch left out must bind false, not refuse - if the run refuses with
      needs_request_values, the add-in in Revit is older than this change

  - given: includeLinks true on a model with NO links, or with every link unloaded
    expect: >
      linksSearched 0 and "Links asked for, NONE loaded - host only". It must
      NOT read like the absent case: one means there was nothing else to read,
      the other means reload them in Manage Links and ask again

  - given: one linked file placed TWICE, with includeLinks true
    expect: >
      linksSearched 1, not 2 - it counts files, not placements

second_route:
  - Revit's own Project Browser or a grid schedule, compared for the names and the order

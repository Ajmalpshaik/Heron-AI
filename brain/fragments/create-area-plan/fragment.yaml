revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `ViewPlan.CreateAreaPlan`,
  `ViewPlan.AreaScheme`, `View.GenLevel` and `AreaScheme` are present 2020
  through 2027, read with tools/api-surface on 2026-10-14. Ids are compared as
  ElementIds, never as numbers.

# ROUTING - the same rows are in PLACE_AREAS and CREATE_PLAN_VIEW.
#
#   "make the gross area plan for level 1"  -> here
#   "add a rentable area plan"              -> here
#   "make the plan for this level"          -> CREATE_PLAN_VIEW - a floor or
#                                              ceiling plan, not an area plan
#   "draw the area boundaries"              -> CREATE_AREA_BOUNDARY_LINES, in
#                                              the plan made here
#   "place the areas in the GIA plan"       -> PLACE_AREAS, after both

utterances:
  - make the gross building area plan for level 1
  - create an area plan for this level
  - add a rentable area plan for level 2
  - make area plans for the upper floors

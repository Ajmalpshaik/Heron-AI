heron-agent: HERON-REVIT-VIE-013
heron-step: 17
heron-status: DRAFT
heron-since: 0.1.0
heron-layer: brain

id: FRG-VIEW-137
semantic-identity: "make a new area plan view for this level, to place areas in"
kind: action
domain: revit.views
capability: CREATE_AREA_PLAN
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Creates an area plan view for one level - the Gross Building or the
  Rentable plan that areas are placed and boundaries drawn in.

  **IT CLOSES A HOLE PLACE_AREAS LEFT OPEN.** Areas can only be placed in an
  area plan, and CREATE_PLAN_VIEW makes floor and ceiling plans only - so
  PLACE_AREAS and CREATE_AREA_BOUNDARY_LINES had nowhere to work in a project
  that had no area plan yet.

  **WHICH KIND IS NAMED, NEVER GUESSED.** Gross Building and Rentable are
  measured to different faces of a wall and give different totals; the
  kinds this model holds are listed when the name matches none.

  **ONE AREA PLAN PER LEVEL AND KIND IS MADE, NOT A SECOND.** An area plan
  that already exists for that level and kind is reported by name and nothing
  is made - two of one kind invite areas placed twice.

  **IT MAKES THE VIEW AND DRAWS NO BOUNDARY.** Revit's own dialog offers to
  draw boundary lines round the exterior walls; this does not, and says so.
  CREATE_AREA_BOUNDARY_LINES is that step.

  ASSUMES AN OPEN TRANSACTION (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: level
      type: Level
      source: request
    # The area scheme's name exactly as Area and Volume Computations shows it.
    - name: areaSchemeName
      type: string
      source: request
    # The new view's name. Empty - Revit's own name.
    - name: viewName
      type: string
      source: request
  provides:
    - name: created
      role: result
      type: View
    - name: existing
      # The area plan that was already there for this level and scheme, by
      # name - empty when there was none. The evidence it looked (D-52).
      role: accounting
      type: string
    - name: refused
      role: accounting
      type: IList<string>
    - name: findings
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `ViewPlan.CreateAreaPlan`,
  `ViewPlan.AreaScheme`, `View.GenLevel` and `AreaScheme` are present 2020
  through 2027, read with tools/api-surface on 2026-10-14. Ids are compared as
  ElementIds, never as numbers.

# ROUTING - the same rows are in PLACE_AREAS and CREATE_PLAN_VIEW.
#
#   "make the gross area plan for level 1"  -> here
#   "add a rentable area plan"              -> here
#   "make the plan for this level"          -> CREATE_PLAN_VIEW - a floor or
#                                              ceiling plan, not an area plan
#   "draw the area boundaries"              -> CREATE_AREA_BOUNDARY_LINES, in
#                                              the plan made here
#   "place the areas in the GIA plan"       -> PLACE_AREAS, after both

utterances:
  - make the gross building area plan for level 1
  - create an area plan for this level
  - add a rentable area plan for level 2
  - make the rentable area plans for the upper floors

compatibility-note: >
  One implementation, one #if. Read off the shipped assemblies 2020 to 2027 on
  2026-10-19 with tools/api-surface: RebarBarType.BarDiameter exists 2020-2022
  (obsolete at 2022) and BarNominalDiameter / BarModelDiameter from 2022, so
  2020 and 2021 read BarDiameter and 2022 on read the two. StandardBendDiameter,
  StandardHookBendDiameter, StirrupTieBendDiameter, RebarHookType.HookAngle,
  StraightLineMultiplier and Style, RebarCoverType.CoverDistance,
  RebarShape.RebarStyle, ReinforcementSettings.RebarShapeDefinesHooks and the
  Area/Path/Fabric type classes are present on all eight.
  ReinforcementSettings.GetReinforcementSettings renamed its parameter at 2022
  and kept its signature.

# ROUTING - the same rows are in every rebar card.
#
#   "what bar types are loaded"                 -> here
#   "do we have a T16 bar type"                 -> here
#   "what rebar is in these columns"            -> REPORT_HOST_REBAR
#   "make a 16 mm bar type"                     -> CREATE_REBAR_BAR_TYPE
#   "put 4 T16 and T8 links at 150 in these columns" -> PLACE_COLUMN_REBAR
utterances:
  - what rebar bar types are loaded
  - list the rebar types in this model
  - which bar sizes do we have
  - do we have a T16 bar type
  - what hook types and cover types are there
  - show me the rebar shapes loaded

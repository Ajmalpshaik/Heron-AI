capability: LIST_REBAR_TYPES
version: 1
source: OFFICIAL
risk: READ

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# THE FIRST STEP OF EVERY REBAR JOB (brain/skills/reinforce-concrete.yaml). A
# structural spec says "T16" or "H12" or "16M"; whether the model has a bar
# type of that name, or of that diameter, is a question only the model can
# answer - so this read answers it before anything is placed. Every placing
# tool takes a bar type by its EXACT name, or a diameter in millimetres
# (D-71), and refuses anything else with the list this read gives. A word like
# "T16" is never turned into a diameter by Heron: it is the modeller's word,
# looked up here or asked (D-33, D-34).
#
# WHAT IT READS, every release 2020-2027:
#   Rebar Bar Types   name, nominal diameter, model diameter (2022 and later
#                     carry two; 2020 and 2021 one - read by #if, never a
#                     parameter name), and the three bend diameters
#   Rebar Hook Types  name, angle, extension (a multiple of the bar diameter)
#                     and whether it is for standard bars or stirrups/ties
#   Rebar Cover Types name and distance
#   Rebar Shapes      how many, by style, and their names
#   Area / Path Reinforcement Types, Fabric Sheet Types, Fabric Area Types
#   the model's own setting "rebar shape defines hooks"
#
# Millimetres, rounded to 0.1 mm. Angles in degrees.
#
# READ ONLY. Opens no transaction and needs none.
purpose: >
  Lists the rebar bar types loaded in the model with their diameters and bend
  diameters, the hook types, the cover types with their distances, the rebar
  shapes, and the area, path and fabric reinforcement types - what a bar size,
  hook or cover from a structural spec can be matched to.

contract:
  needs:
    - name: doc
      type: Document
  provides:
    - name: barTypes
      # Rebar Bar Types found. Something the read FOUND.
      role: result
      type: int
    - name: hookTypes
      role: result
      type: int
    - name: coverTypes
      # ACCOUNTING, NOT A RESULT (row 5b-1330). Revit keeps a Rebar Cover
      # Type in every document, whether or not rebar was ever loaded - read
      # 'Rebar Cover 1' 25 mm in a furniture family (Revit 2020, 2026-10-21),
      # and a string scan of rme_basic_sample_project finds the same name.
      # So this count is never 0, says the read looked rather than that the
      # model holds rebar content, and as a result left no document a D-30
      # negative. Still counted, and every cover named in `listing`.
      role: accounting
      type: int
    - name: shapes
      role: result
      type: int
    - name: systemTypes
      # Area, path and fabric reinforcement types, and fabric sheet types.
      # Stays a result: it read 0 in the same family (2026-10-21), so it does
      # not stop a family negative, and it must be 0 there too.
      role: result
      type: int
    - name: listing
      # EVERY TYPE READ, in words, one section per kind. A STRING, because a
      # reply cuts a list to three items and this is the answer. Accounting:
      # it is what the counts above count.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


# D-30: the negative case is what catches "succeeded and did nothing".

positive:
  - given: the parts of one floor crossing grids A and B, cutterNames "A, B"
    expect: >
      divided equal to the parts handed in, partCountAfter higher than before,
      read back

  # VERSION 2, added 2026-11-11 (row 5b-1418). NEITHER HAS BEEN RUN. Each was
  # REFUSED on version 1 on Revit 2024 - "The element id should refer to a
  # valid SketchPlane" - so each FAILS there.
  - given: >
      Revit 2024: parts made from walls standing on one level, a level
      "HERON MID" kept 1500 mm up them; those parts handed in, cutterNames
      "HERON MID"
    expect: >
      no refusal; divided equal to the parts handed in and partCountAfter
      higher than the parts handed in, read back; findings saying one unnamed
      horizontal work plane was added with the division; in a section with
      Show Parts each wall's parts meet at the level
  - given: >
      the same walls' parts, a grid "HERON CUT" kept across two walls square
      to it and one wall SKEW to it, about 30 degrees; cutterNames "HERON CUT"
    expect: >
      no refusal; partCountAfter higher than the parts handed in
  - given: the same, KEPT once on the owner's yes, in a plan with Show Parts
    expect: >
      on the SKEW wall the new seam lies ON the grid line - along the grid,
      across the wall at the angle the grid crosses it - as on the square
      walls. A seam square to the skew wall, or off the grid line, means the
      sketch plane was read by Revit after all: a defect, recorded with what
      was seen. One Ctrl+Z takes back the division and its work plane together

negative:
  - given: cutterNames "Z9", a name no datum has
    expect: >
      refused naming it, nothing divided

  # VERSION 2, added 2026-11-11. NOT RUN. What Revit answers here is NOT KNOWN
  # and is recorded as it comes - it decides row 5b-1515.
  - given: >
      the same parts, cutterNames a level kept far above every wall, crossing
      none of them
    expect: >
      either refused - "Revit divided none of these parts" - with
      partCountAfter as before, or Revit's own refusal quoted; never divided
      above 0 beside a partCountAfter that did not move

  # VERSION 2, added 2026-11-11. NOT RUN. A refusal leaves no sketch plane
  # behind: the card looks for the plane it made after taking the step back.
  # It is the card's own read-back - Revit lists no unnamed work planes, so
  # there is no second route for it.
  - given: any call above that Revit refuses AFTER the sketch plane was made
    expect: >
      the refusal ends "NOTHING WAS DIVIDED." and does NOT go on to say the
      work plane "could not be taken back and is still in the model"

second_route:
  - a plan with Show Parts, the new seams on the grid lines
  - >
      version 2: Revit's own Divide Parts on the same parts with the same level
      or grid ticked under Intersecting References, in a second scratch copy -
      the same part count
  - one Ctrl+Z undoes the division in a single step (Golden Rule 16)

version: 2
source: OFFICIAL
risk: MODIFY

# WHY IT IS BUILT THIS WAY - comments, not `purpose`, because `purpose` is
# searched and long text pulls other sentences here.
#
# Divide Parts with Intersecting References: cutterNames names grids, levels
# or reference planes, each finding exactly one. Parts Revit will not divide
# are refused with the reason. READ BACK: the parts on the original elements
# counted again.
#
# VERSION 2, 2026-11-11 (row 5b-1418). Version 1 passed Revit an empty sketch
# plane and Revit 2024 refused every division, by a level and by a grid alike:
# "The element id should refer to a valid SketchPlane". Revit keeps a sketch
# with every division, also one cut by datums alone. Version 2 makes a
# HORIZONTAL sketch plane through the origin for the call and draws nothing
# on it: Revit's API reference calls that argument the sketch plane "for the
# curves that divide the elements", and no curve is handed in. One plane for
# every part, never one taken from a part. It is taken back with the rest
# when Revit refuses or divides nothing, and looked for again, so a refusal
# leaves no work plane behind or says so. A division that is made keeps it -
# Revit holds one with every division - and the answer says a work plane was
# added. A division Revit answers with nothing is now refused, never counted.
# COMPILED ON EVERY RELEASE, NOT RUN IN ANY REVIT: that Revit takes this
# plane, and that a wall skew to a grid is cut on the grid line, is what the
# next run measures (NEEDS-CHECKING Group DQ, DQ3a to DQ3d). The evidence for
# the plane is on row 5b-1418.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Divides parts along named grids, levels or reference planes, as Revit's
  Divide Parts does with chosen references.

contract:
  needs:
    - name: doc
      type: Document
    # The parts.
    - name: elements
      type: IList<Element>
    # Grid, level or reference plane names separated by commas.
    - name: cutterNames
      type: string
      source: request
  provides:
    - name: divided
      role: result
      type: int
    - name: partCountAfter
      # Parts now on the original elements, read back.
      role: result
      type: int
    - name: report
      # ONE STRING with every refusal (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. PartUtils.DivideParts(Document,
  ICollection<ElementId>, ICollection<ElementId>, IList<Curve>, ElementId),
  ArePartsValidForDivide and GetAssociatedParts, Part.GetSourceElementIds and
  LinkElementId.HostElementId are present 2020 through 2027 - read off
  RevitAPI.xml in the Nice3point reference packages for all eight releases on
  2026-10-12.
  Version 2 adds SketchPlane.Create(Document, Plane),
  Plane.CreateByNormalAndOrigin and SubTransaction (Start, Commit, RollBack,
  HasStarted, HasEnded) - each read with tools/api-surface --members on all
  eight releases on 2026-11-11, and the card compiled for each. NOT RUN in
  any Revit.

# ROUTING - the same rows are in the fragments named here.
#
#   "make parts from these walls"             -> CREATE_PARTS
#   "divide the parts at the grids"           -> DIVIDE_PARTS
#   "merge these parts"                       -> MERGE_PARTS
#   "exclude these parts"                     -> SET_PARTS_EXCLUDED
#   "offset the top of these parts"           -> OFFSET_PART_FACES

utterances:
  - divide these parts at the grids
  - cut the floor parts at grid lines A and B
  - split the wall parts at level 2
  - divide the parts along these reference planes

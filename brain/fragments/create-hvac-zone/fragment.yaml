id: FRG-MEP-024
semantic-identity: "make an HVAC zone and put spaces in it"
kind: action
domain: revit.mep
capability: CREATE_HVAC_ZONE
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Creates an HVAC Zone on a level and adds existing MEP Spaces to it - the
  grouping layer above Spaces that the load and airflow work depends on.

  **REVIT 2027 REMOVES THIS FROM THE API ALTOGETHER, AND THE FRAGMENT SAYS SO
  RATHER THAN FAILING TO COMPILE.** Both the zone-creation call and
  `Zone.AddSpaces` are gone from 2027's own assembly - checked there, not
  assumed. So both are reached BY NAME, which keeps ONE source compiling on all
  eight releases, working on 2020 through 2026, and reporting a plain reason on
  2027 where the only route left is the Revit interface. Naming either call
  directly would break the 2027 build, and a try/catch does not help: it never
  gets to run.

  **A SPACE CAN BELONG TO ONLY ONE ZONE, AND REVIT MOVES IT WITHOUT ASKING.** A
  space already in another zone silently LEAVES that zone when added here. That
  is reported per space, because the damage is to a zone nobody was looking at.

  **THE ZONE AND ITS SPACES MUST SHARE A PHASE.** A mismatch is the usual reason
  a space is rejected, and it reads as the space being wrong rather than the
  phase.

  **A NEW ZONE REPORTS ZERO AREA, AND THAT NUMBER MUST NOT BE PASSED ON.** Revit
  computes it later. The space inside already knows its own area while the zone
  still says nothing - so the read-back here reports what was ADDED, never the
  zone's area, and anything wanting the area must ask again in a later call.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: zoneName
      type: string
      source: request
    - name: level
      type: Level
      source: request
    - name: phase
      type: Phase
      source: request
    - name: elements
      type: IList<Element>
  provides:
    - name: zone
      role: result
      type: Element
    - name: added
      role: result
      type: int
    - name: movedFromAnotherZone
      # A SPACE CAN BELONG TO ONLY ONE ZONE, AND REVIT MOVES IT WITHOUT ASKING
      # - these spaces silently LEFT another zone when they were added here. A
      # consequence of what it did, which the caller has to know.
      role: result
      type: IList<string>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<string>


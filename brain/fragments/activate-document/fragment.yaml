id: FRG-DOC-030
# THE IDENTITY NAMES OPENING THE FILE since 2026-11-21 (row 5b-1943) - what
# OpenAndActivateDocument does when the document is not open - so a request
# to open a project or family file by its path finds this card. All three
# routes read the identity; measured with tools/score-routing.py --sentences.
semantic-identity: "make a document on disk the window in front, opening its file if it is not open, project or family alike"
kind: action
domain: revit.document
capability: ACTIVATE_DOCUMENT
version: 3
source: OFFICIAL
risk: EXECUTE

# VERSION 3 (2026-11-18) - THE DOCUMENT LEFT BEHIND IS READ BEFORE AND AFTER,
# and back to DRAFT. FRAGMENT-ISSUES row 5b-1851: on Revit 2020, on
# 2026-11-18, the document in front was written to its file within about a
# second of this card bringing another document forward, with no save asked -
# 3 times out of 3 when the document brought forward ALREADY HAD A WINDOW, 0
# out of 1 when it was opened from its file. This card calls no save, and the
# trace found nothing of Heron's that saves around it: the write points at
# Revit's own OpenAndActivateDocument on a document already open, which is not
# proved. By the owner's rule for a cause that is Revit's, no behaviour
# changes. What changes is the answer: whether the document left
# behind has unsaved changes, and its file's time, are read before the call
# and again after it, and `leftBehindWritten` and a finding say when it was
# written - or a finding says it still has unsaved changes, with a caution
# when the document brought forward was already open in a window. Reads only.
# Version 2 was PROVEN on 2026-10-07 (the proof block below, kept as the
# record of what it proved); its C# moved, so it is DRAFT again until
# NEEDS-CHECKING Group OL is run (D-30). revit_show runs a DRAFT and says so.

purpose: >
  Makes the document at a given path the window in front in Revit - a project
  or a family, already open or not.

  **IT EXISTS BECAUSE THERE WAS NO WAY BACK OUT OF A FAMILY.**
  SWITCH_ACTIVE_PROJECT moves between open PROJECTS and refuses from inside a
  family document: "Changing the active view is not applicable to inactive
  documents." So opening a family left every following fragment stuck in it -
  and a fragment that looks for loaded families found none, because a family
  document contains none. Measured 2026-09-16: five families were "opened",
  all five failed, and five size tables were written into the one family that
  happened to be in front.

  **THE PATH IS THE HANDLE, NOT THE TITLE.** `OpenAndActivateDocument` takes a
  file path and works whether or not the document is already open, which is
  what makes it usable as a way back: the project is always on disk, and its
  path is a fact the caller already has.

  **IT REPORTS WHAT IS IN FRONT AFTERWARDS, ALWAYS.** The whole purpose is
  which window is active, and the failure that matters is believing it moved
  when it did not - that is precisely how five tables landed in the wrong
  family. `activeAfter` is read back from Revit, never assumed from the
  argument.

  **IT CANNOT RUN INSIDE A TRANSACTION**, which is why it is EXECUTE.
  Activating a document while the current one is modifiable is refused.

  It changes no element in any document.

contract:
  needs:
    - name: doc
      type: Document
    - name: uidoc
      type: UIDocument
    # Full path to the .rvt or .rfa to bring to the front.
    - name: documentPath
      type: string
      source: request
  provides:
    - name: activated
      role: result
      type: bool
    - name: activeAfter
      # Read back from Revit once it finished, never assumed from the path.
      # Believing a switch happened when it did not is the failure this exists
      # to prevent.
      role: result
      type: string
    - name: wasAlready
      # It was already the document in front, so nothing moved. The evidence
      # it looked, never a change it made (D-52).
      role: accounting
      type: bool
    - name: leftBehindWritten
      # VERSION 3 (row 5b-1851). The document that was in front was written
      # to its file during the switch: its file's time moved - or, only where
      # that time cannot be read, its unsaved changes are gone. Read before
      # and after, never assumed. False when nothing was switched, when
      # nothing showed a write, and when neither could be read - which a
      # finding then says. A write a moment AFTER the job is not seen here;
      # the finding cautions where that has been seen. Heron never asks for
      # this save - it is reported because it happened (D-52).
      role: accounting
      type: bool
    - name: problem
      # Revit's own words when it refused, empty when it did not.
      role: accounting
      type: string
    - name: findings
      type: IList<string>


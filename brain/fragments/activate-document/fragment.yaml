heron-agent: HERON-REVIT-DOC-004
heron-step: 14
heron-status: DRAFT
heron-since: 0.1.0
heron-layer: brain

id: FRG-DOC-030
semantic-identity: "make a document on disk the window in front, project or family alike"
kind: action
domain: revit.document
capability: ACTIVATE_DOCUMENT
version: 2
source: OFFICIAL
risk: EXECUTE

purpose: >
  Makes the document at a given path the window in front in Revit - a project
  or a family, already open or not.

  **IT EXISTS BECAUSE THERE WAS NO WAY BACK OUT OF A FAMILY.**
  SWITCH_ACTIVE_PROJECT moves between open PROJECTS and refuses from inside a
  family document: "Changing the active view is not applicable to inactive
  documents." So opening a family left every following fragment stuck in it -
  and a fragment that looks for loaded families found none, because a family
  document contains none. Measured 2026-09-16: five families were "opened",
  all five failed, and five size tables were written into the one family that
  happened to be in front.

  **THE PATH IS THE HANDLE, NOT THE TITLE.** `OpenAndActivateDocument` takes a
  file path and works whether or not the document is already open, which is
  what makes it usable as a way back: the project is always on disk, and its
  path is a fact the caller already has.

  **IT REPORTS WHAT IS IN FRONT AFTERWARDS, ALWAYS.** The whole purpose is
  which window is active, and the failure that matters is believing it moved
  when it did not - that is precisely how five tables landed in the wrong
  family. `activeAfter` is read back from Revit, never assumed from the
  argument.

  **IT CANNOT RUN INSIDE A TRANSACTION**, which is why it is EXECUTE.
  Activating a document while the current one is modifiable is refused.

  It changes no element in any document.

contract:
  needs:
    - name: doc
      type: Document
    - name: uidoc
      type: UIDocument
    # Full path to the .rvt or .rfa to bring to the front.
    - name: documentPath
      type: string
      source: request
  provides:
    - name: activated
      role: result
      type: bool
    - name: activeAfter
      # Read back from Revit once it finished, never assumed from the path.
      # Believing a switch happened when it did not is the failure this exists
      # to prevent.
      role: result
      type: string
    - name: wasAlready
      # It was already the document in front, so nothing moved. The evidence
      # it looked, never a change it made (D-52).
      role: accounting
      type: bool
    - name: problem
      # Revit's own words when it refused, empty when it did not.
      role: accounting
      type: string
    - name: findings
      type: IList<string>

# NO PROOF FOR VERSION 2. Version 1 was PROVEN on 2026-09-16 by Ajmal PS on PIPE
# (3,332 elements), Revit 2020 - the record is in git history. Version 2 changes
# impl/ (row 5b-359: "already in front" judged by the window in front, by its
# file), so it is DRAFT until proved again - NEEDS-CHECKING group CS.

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `UIDocument.Application` and
  `UIApplication.OpenAndActivateDocument(string)` are present 2020 through
  2027, confirmed by reflection on the 2020 assemblies on 2026-09-16. No unit
  is read, so the 2021 units move cannot reach it.

# ROUTING - repeated in OPEN_FAMILY_FOR_EDITING.
#
#   "go back to the project"      -> here, with the project's path
#   "open that family for editing" -> OPEN_FAMILY_FOR_EDITING, which needs the
#                                     PROJECT in front to find the family
#   "which document is in front"   -> REPORT_OPEN_DOCUMENTS

utterances:
  - make that document the active one
  - go back to the project
  - bring this file to the front
  - activate the project window

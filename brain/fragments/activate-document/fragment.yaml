  fingerprint: 1bd0f9d1ce575d92

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `UIDocument.Application` and
  `UIApplication.OpenAndActivateDocument(string)` are present 2020 through
  2027, confirmed by reflection on the 2020 assemblies on 2026-09-16. No unit
  is read, so the 2021 units move cannot reach it.

# ROUTING - repeated in OPEN_FAMILY_FOR_EDITING.
#
#   "go back to the project"      -> here, with the project's path
#   "open that family for editing" -> OPEN_FAMILY_FOR_EDITING, which needs the
#                                     PROJECT in front to find the family
#   "which document is in front"   -> REPORT_OPEN_DOCUMENTS

utterances:
  - make that document the active one
  - go back to the project
  - bring this file to the front
  - activate the project window

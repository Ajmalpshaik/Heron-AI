id: FRG-GEO-016
semantic-identity: "how big each room is, measured along the room's own walls"
kind: action
domain: revit.geometry
capability: MEASURE_ROOM_DIMENSIONS
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Length and width of each room measured on THE ROOM'S OWN AXES, plus how far
  it is rotated and whether a single length x width honestly describes it.

  **A ROTATED ROOM HAS NO USEFUL BOUNDING BOX, AND THAT IS THE WHOLE POINT.**
  `get_BoundingBox` is aligned to project X and Y. Turn an 8000 x 4000 room
  thirty degrees and its box becomes roughly 8900 x 7500 - half as big again,
  in a shape the room does not have. On a site that is not square to true
  north, which is most of them, that is every room in the model. Answer "how
  big is this room" from the box and the number is wrong on a rectangle that a
  tape measure would get right.

  **HOW THE ROOM'S OWN AXIS IS FOUND:** the longest segment of the outer
  boundary loop. That is the dominant wall, and on anything roughly rectangular
  it is the axis a person would lay out along. The boundary points are then
  rotated by minus that angle IN MEMORY and the extents taken. Nothing moves and
  nothing is created - the rotation is arithmetic on a list of points.

  **THE OUTER LOOP IS THE ONE WITH THE LARGEST AREA, NOT LOOP ZERO.** Revit
  returns a room's boundary as several loops with the outer edge and the holes -
  a core, a column, a shaft - mixed together. Loop zero is usually the outer
  one, and "usually" is not something to measure a room with.

  **LENGTH IS ALWAYS THE LONGER SIDE**, fixed rather than assigned to an axis.
  Rotating past forty-five degrees swaps which project axis each lands on, and a
  table that does not fix the order silently swaps its own columns halfway down.

  **IT REPORTS WHEN A RECTANGLE IS A LIE.** An L-shaped or U-shaped room has no
  honest length x width. `irregular` is the gap between the room's own rectangle
  and its real area - large here means genuinely not rectangular, and that room
  needs splitting rather than quoting.

  **THIS ANSWERS A QUESTION AND DRAWS NOTHING**, and the sentence that reaches
  it is ambiguous in a way that matters:

  | What you meant | What happens |
  |---|---|
  | "how big is room 4", "what are the room sizes" - to know | **this fragment**, read-only |
  | "dimension the rooms", "put the sizes on the plan" - to annotate | **nothing here does that yet** |

  Asking a question must never place dimensions in the model, so if the request
  was to annotate a drawing, this is the wrong fragment and the right one does
  not exist. `DIMENSION_FAMILY_INSTANCES` draws a dimension string through
  family instances - air terminals, fixtures - and cannot dimension a room; it
  carries the same note so that a search landing there says so rather than
  dimensioning the nearest thing it can reach.

  **VERSION 2 ADDS AREA AND VOLUME, AND THE ONE THING THAT MAKES VOLUME A
  TRAP.** A Room's volume is only computed when *Area and Volume Computations*
  is switched to volumes in the project - and when it is not, every Room reports
  a volume of **zero**. That is a plausible number, it is the same number an
  unbounded room gives, and nothing about it says "this project does not compute
  volumes". `volumeComputationOff` is reported once for the whole run so a table
  of zeros is explained rather than believed. Spaces compute volume regardless,
  which is why a model can show sensible Space volumes and zero Room volumes at
  the same time.

  **IT IS NOT THE ONE THAT FEEDS A LAYOUT.** `READ_ROOM_GEOMETRY` hands back the
  outline itself, which is what "how many fit in here" needs; this returns
  measurements, which is what a person asking the size needs. Both those
  sentences used to reach that fragment, and it carries the same table.

contract:
  needs:
    - name: elements
      type: IList<Element>
    - name: doc
      type: Document
      source: ambient
  provides:
    - name: lengths
      role: result
      type: IDictionary<ElementId, double>
    - name: widths
      role: result
      type: IDictionary<ElementId, double>
    - name: rotations
      role: result
      type: IDictionary<ElementId, double>
    - name: irregular
      # The gap between the room's own rectangle and its real area - large
      # here means genuinely not rectangular, and that room needs splitting
      # rather than quoting.
      role: result
      type: IDictionary<ElementId, double>
    - name: areas
      role: result
      type: IDictionary<ElementId, double>
    - name: volumes
      role: result
      type: IDictionary<ElementId, double>
    - name: volumeComputationOff
      # That Area and Volume Computations is not set to volumes, WHICH MAKES
      # EVERY ROOM REPORT ZERO - a plausible number, and the same one an
      # unbounded room gives. It explains every volume in the answer at once.
      role: result
      type: bool
    - name: unplaced
      # Rooms never placed in the model, so it could not be measured. The
      # evidence it looked, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>
    - name: unmeasurable
      # Rooms whose own axes could not be established, so it could not be
      # measured. The evidence it looked, never a thing it found (D-52).
      role: accounting
      type: IList<ElementId>


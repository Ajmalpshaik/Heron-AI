compatibility-note: >
  One implementation for every release. `SpatialElement` is the shared base of
  Room and Space so one fragment serves both, and `GetBoundarySegments` with
  `SpatialElementBoundaryOptions` is unchanged 2020 to 2027. Volume is read
  through `ROOM_VOLUME` rather than a `Volume` property, because
  `SpatialElement` has no such property - that was found by a compile failure on
  a real release, not from documentation. Room and Space are told apart by
  CATEGORY rather than by type test. **`Room` is the only one of the two that
  cannot be named here** - it lives in the Architecture namespace, which the
  wrapper does not import, and the compile gate refused `element is Room` on all
  eight releases. `Space` CAN be named: Mechanical, Plumbing, Electrical and
  Structure are all imported, measured by compiling a throwaway probe on
  2026-08-31 rather than assumed. The category test is used for both anyway, so
  one idiom covers the pair. Lengths are handed
  on in Revit's internal feet and rotations in degrees; D-20 keeps the
  millimetre conversion at the edge where the user is. No units API is touched,
  which is what keeps this clear of the 2021 units move.

# ROUTING - the same rows are in the fragments named here.
#
#   "how big is this room"           -> here - measured on the ROOM'S OWN
#                                       AXES, which is why it is not the
#                                       bounding box
#   "what is the bounding box of this"
#                                    -> REPORT_BOUNDING_BOX - the extent in
#                                       PROJECT X and Y. Right for a duct or a
#                                       piece of plant; WRONG for a room, and
#                                       the numbers above say by how much. That
#                                       fragment carries this same table
#   "report the areas"               -> REPORT_AREAS. An AREA is a third
#                                       spatial element, not a room
#   "what is in this room"           -> FILTER_ELEMENTS_IN_ROOM
#   "place the rooms"                -> PLACE_ROOMS - a write
#   "what are the room sizes"            -> here. It MEASURES and draws
#                                           nothing - a question must not be
#                                           answered by something that marks
#                                           the drawing
#   "put the room sizes on the plan"     -> DIMENSION_ROOMS, which creates
#                                           real dimensions

utterances:
  - how big is this room
  - what are the room sizes
  - what size is room 4
  - give me the room dimensions
  - how wide is that room
  - length and width of each room

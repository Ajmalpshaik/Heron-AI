id: FRG-VIEW-062
semantic-identity: "write these schedules out as text files, and check the file is really there"
kind: action
domain: revit.schedules
capability: EXPORT_SCHEDULE_TO_CSV
version: 1
source: OFFICIAL
risk: PUBLISH

purpose: >
  Writes schedules out as delimited text - the file that opens in Excel - and
  reports the paths that ACTUALLY EXIST ON DISK afterwards, the same read-back
  `EXPORT_SHEETS_TO_PDF` and `EXPORT_VIEWS_TO_DWG` use and for the same reason.

  IT EXISTS BECAUSE `FIND_SCHEDULES` ALREADY SAID IT DID. That fragment's own
  purpose names *"adding columns, exporting to CSV, placing on a sheet"* as the
  things it hands schedules to, and two of the three had never been built.
  `CREATE_SCHEDULE` carried a routing row reading *"nothing in the library
  exports anything yet"*, written when that was true and left standing after
  four export fragments landed. Measured before this batch, *"export this
  schedule to excel"* returned `FIND_SCHEDULES`, which finds the schedule and
  stops.

  **RISK IS PUBLISH, NOT MODIFY.** Nothing in the model changes. A file is
  written that gets emailed to a quantity surveyor, and one Ctrl+Z does not
  un-send it. That is a higher risk than editing the model, not a lower one.

  **IT WRITES WHAT THE SCHEDULE PRINTS, INCLUDING ITS FILTERS.** A schedule
  filtered to Level 2 exports Level 2. That is correct and it is the commonest
  misunderstanding in the whole cluster - somebody exporting "the duct schedule"
  and getting a third of the ducts has a filtered schedule, not a broken export.
  So the row count written is REPORTED, and `REPORT_SCHEDULE_DEFINITION` is
  named as the fragment that says why it is what it is.

  **THE DELIMITER IS A STATED INPUT.** A comma is the default and is wrong in
  every region whose decimal separator is a comma - the file opens as one
  column. Tab is the safe answer when that is in doubt, and it is the caller's
  call rather than a silent default that produces a plausible, useless file.

  **NO TRANSACTION, AND NONE IS NEEDED** - export is document I/O, not a model
  edit.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    - name: exportFolder
      type: string
      source: request
    - name: fieldDelimiter
      type: string
      source: request
  provides:
    - name: written
      role: result
      type: IList<string>
    - name: missingAfterExport
      # Paths that were not on disk when it read back - a file it failed to
      # deliver. `written` is what it wrote (D-52).
      role: accounting
      type: IList<string>
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: IList<string>
    - name: rowsWritten
      # How many rows the file actually holds. IT WRITES WHAT THE SCHEDULE
      # PRINTS, INCLUDING ITS FILTERS, so this is what tells somebody
      # exporting the duct schedule why they got a third of the ducts.
      role: result
      type: int


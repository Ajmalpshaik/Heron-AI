tests: tests/

compatibility-note: >
  One implementation for every release. `ViewSchedule.Export(string, string,
  ViewScheduleExportOptions)` and the options' `FieldDelimiter`,
  `TextQualifier`, `Title`, `ColumnHeaders` and `HeadersFootersBlanks` are
  present and unchanged 2020 through 2027, with the same argument counts.

  The row count comes from `GetTableData().GetSectionData(SectionType.Body)`,
  which is the same stable route `READ_SCHEDULE_CONTENTS` uses. No units call is
  made - Revit writes the cells already formatted in the project's own units,
  which is what makes the exported file readable without conversion.

# ROUTING - the same rows are in the fragments named here.
#
#   "export this schedule to excel"   -> here. A .txt/.csv Excel opens; Revit
#                                        writes no .xlsx and this fragment does
#                                        not pretend to
#   "give me the schedule as a csv"   -> here
#   "read me what is in the schedule" -> READ_SCHEDULE_CONTENTS - the rows in
#                                        the REPLY, no file, no risk
#   "why are there only 40 rows"      -> REPORT_SCHEDULE_DEFINITION. An export
#                                        writes what the schedule PRINTS,
#                                        filters included, and that is correct
#   "export the sheets"               -> EXPORT_SHEETS_TO_PDF
#   "export the views"                -> EXPORT_VIEWS_TO_DWG
#   "which schedules are there"       -> FIND_SCHEDULES, which is what hands the
#                                        schedules to here


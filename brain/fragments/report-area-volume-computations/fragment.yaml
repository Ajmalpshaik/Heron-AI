compatibility-note: >
  One implementation for every release. `AreaVolumeSettings.GetAreaVolumeSettings`,
  `ComputeVolumes` and `GetSpatialElementBoundaryLocation`, the
  `SpatialElementType` values Room and Space, the four
  `SpatialElementBoundaryLocation` values, `AreaScheme.IsGrossBuildingArea`,
  `Area.AreaScheme` and `ViewPlan.AreaScheme` are present and unchanged 2020
  through 2027 - looked up in every release's reference assembly with
  tools/api-surface on 2026-10-06. `SpatialElementType` gained a fourth value
  at 2022 (LoadArea, renamed ElectricalLoadArea at 2023); only Room and Space
  are asked for. The volume is read through `BuiltInParameter.ROOM_VOLUME`,
  as REPORT_ROOM_SPACE_DATA reads it, which carries the not-computed state.
  Rooms and spaces are collected by category, never by `OfClass(typeof(Room))`,
  which Revit refuses for a type that is not native.

# ROUTING - the same rows are in the fragments named here.
#
#   "is volume computation on"           -> here. A question; it never reaches
#                                           SET_AREA_VOLUME_COMPUTATIONS (D-86)
#   "what are the area and volume computation settings" -> here
#   "is room area measured at wall finish or wall center" -> here
#   "list the area schemes"              -> here, every scheme including one
#                                           with no areas. Moved from
#                                           REPORT_AREAS on 2026-10-06, which
#                                           reaches a scheme only through its
#                                           Areas and so cannot name an empty one
#   "why do the spaces have no volume"   -> here first - the switch, and how
#                                           many rooms and spaces have a volume
#   "turn on volume computation"         -> SET_AREA_VOLUME_COMPUTATIONS - the
#                                           change, behind the Admin switch
#   "create an area scheme" / "rename an area scheme" -> SET_AREA_VOLUME_COMPUTATIONS
#   "delete an area scheme"              -> nothing in Heron. It deletes the
#                                           scheme's area plans and areas too
#                                           (Article 7); done in the dialog
#   "report the areas" / "what is the gross area per level" -> REPORT_AREAS -
#                                           the Areas inside each scheme
#   "list the rooms with their volumes"  -> REPORT_ROOM_SPACE_DATA - room by
#                                           room, naming which have no volume


# THE OPENING NAMES THE WALL FACES (FRAGMENT-ISSUES 5b-337, 2026-10-09). It
# said only "how its room areas are measured", and questions about where - the
# wall finish, the centre, the core - went to PLACE_ROOM_AT_POINT and
# DIMENSION_ROOMS, both changes. The faces are spelled as the dialog spells
# them, "center": "centre" here, measured, pulled "switch room area
# measurement to wall centre" - a change - from SET_AREA_VOLUME_COMPUTATIONS
# to this read. Volume stays first: an opening that led with the faces sent
# "turn volume calculation on" to SET_SCHEDULE_FIELD_TOTALS, a change to
# something else. Repaired by these words, never by declaring the sentences
# that failed.
purpose: >
  Answers whether this project computes volumes - Revit's volume calculation
  for rooms and spaces - where its room areas are measured, the room boundary
  taken at the wall finish, the wall center, the core layer or the core
  center, and which area schemes it has, read from Revit's Area and Volume
  Computations dialog (Architecture > Room & Area), both tabs, in the words
  the dialog shows. COMPUTATIONS: Volume Computations - Areas only or Areas
  and Volumes - and Room Area Computation - At wall finish, At wall center,
  At wall core layer or At wall core center. AREA SCHEMES: every scheme, with
  its description, whether it is the Gross Building one, and how many areas
  and area plans it holds. It changes nothing and asks for nothing.

  **"IS VOLUME COMPUTATION ON?" IS ANSWERED HERE (D-86).** A question about
  these settings needs nothing changed, so it is read, never written. Built
  on 2026-10-06 after a lookup found no tool: the model "Heron loads test"
  had no Space volumes while Revit computed areas only (FRAGMENT-ISSUES row
  5b-327).

  **A VOLUME OF ZERO IS USUALLY THIS SETTING, NOT THE ROOM.** With Areas only,
  Revit computes no volume and a schedule reads as a building with none. So
  beside the setting the answer counts the placed, bounded rooms and spaces
  and how many of them have a volume right now - the switch and what it does
  to this model, read together.

  **SPACES ARE ASKED ABOUT, NOT ASSUMED.** The dialog shows one Room Area
  Computation; Revit's API takes the kind of spatial element as an argument.
  What Revit answers for Spaces is reported as Revit's answer, and said
  plainly if it differs from rooms.

  **AN AREA SCHEME WITH NO AREAS IS STILL LISTED.** REPORT_AREAS reaches a
  scheme only through the Areas placed in it, so a scheme nobody has used yet
  is invisible there. The counts beside each scheme are what deleting it in
  the dialog would take with it - its area plans and their areas - which is
  why Heron offers no delete (Constitution Article 7).

  In a family document it says the settings belong to a project, and reports
  nothing else.

contract:
  needs:
    - name: doc
      type: Document
  provides:
    - name: volumeComputation
      # The dialog's words: "Areas only" or "Areas and Volumes". Empty in a
      # family document, where there is no such setting.
      role: result
      type: string
    - name: roomAreaComputation
      # "At wall finish", "At wall center", "At wall core layer" or "At wall
      # core center" - the room setting the dialog shows.
      role: result
      type: string
    - name: areaSchemes
      # One line per scheme: name, Gross Building or not, description, and its
      # areas and area plans - the Area Schemes tab, including schemes with
      # no areas yet.
      role: result
      type: IList<string>
    - name: placedRooms
      # Rooms placed and bounded - the ones a volume could exist for. Context
      # for the volume setting, never a thing it found (D-52).
      role: accounting
      type: int
    - name: roomsWithVolume
      # Of those, how many Revit holds a volume for right now. The evidence of
      # what the volume setting does in this model.
      role: accounting
      type: int
    - name: placedSpaces
      # The same for MEP Spaces.
      role: accounting
      type: int
    - name: spacesWithVolume
      role: accounting
      type: int
    - name: notAProject
      # True when the document in front is a family: the dialog belongs to a
      # project, so nothing was read.
      role: accounting
      type: bool
    - name: findings
      type: IList<string>


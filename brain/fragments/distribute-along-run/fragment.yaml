id: FRG-GEO-024
semantic-identity: "put one of these every so many metres along that run"
kind: action
domain: revit.geometry
capability: DISTRIBUTE_ALONG_RUN
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Places instances of one family at a fixed spacing along a linear element -
  hangers and supports down a duct run, brackets along a tray, sprinklers off a
  branch.

  **Asking for this used to reach ARRAY_ELEMENTS**, which repeats elements that
  already exist along a direction somebody gives. This takes the direction from
  the run itself and creates what is not there yet, which is how the request
  actually arrives: nobody places the first hanger and then arrays it.

  **THE SPACING IS NOT STRETCHED TO FIT, AND THE REMAINDER IS REPORTED.** A run
  of 7.3 m at 2 m centres takes three, with 1.3 m left over. Quietly using
  1.825 m to come out even is a different instruction from the one given, and
  it is the kind of helpfulness that puts a support somewhere a drawing says it
  is not. The leftover is stated so the decision stays with whoever asked.

  **What is placed is NOT hosted on the run.** These are point-placed instances
  standing where the run is today. Move the duct and they stay behind. Revit's
  own hanger families work the same way and it surprises people every time, so
  it is said in the read-back rather than discovered later.

  **An end offset keeps the first and last off the joints.** A hanger exactly on
  a fitting is not buildable, and starting flush with the end is almost never
  what anybody means.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16), so a run
  full of hangers is one undo.

contract:
  needs:
    - name: doc
      type: Document
    - name: run
      type: Element
      source: request
    - name: symbol
      type: FamilySymbol
      source: request
    - name: spacingMm
      type: double
      source: request
    - name: startOffsetMm
      type: double
      source: request
  provides:
    - name: placed
      role: result
      type: IList<ElementId>
    - name: leftoverMm
      # The length left over at the end of the run, stated so the decision
      # stays with whoever asked. It is the WHOLE run length when nothing
      # could be placed, so it must never read as work (D-52).
      role: accounting
      type: double
    - name: findings
      type: IList<string>

proof:
  date: '2026-09-14'
  by: Ajmal PS
  model: Snowdon-scratch_ajmal.al (9,638 elements), Revit 2024, session 29048
  positive_case: run as it would normally be run - the arrangement was re-made first by running
    select-in-region, set-selection with this phase's own values - run inside a transaction,
    and Revit reported the transaction group ROLLED BACK afterwards. returned MillimetresPerFoot
    304.8, curve Line, findings 2 item(s) [9 of 9 placed at 1000 mm centres along a 8839 mm
    run, starti..., These are NOT hosted on the run. They stand where it is toda...], leftoverMm
    839.200000000001, location LocationCurve, placed 9 item(s) [1544271, 1544272, 1544273,
    ...], spacingMm 1000, startOffsetMm 0. inputs came run as given; symbol as given; spacingMm
    as given; startOffsetMm as given. on Snowdon-scratch_ajmal.al
  negative_case: "CANNOT COME BACK EMPTY, so proved by TRACKING instead (D-53). distribute-along-run\
    \ describes whatever it is given, so no arrangement makes its answer empty. What D-30's\
    \ negative case exists to catch - a fragment that succeeds while doing nothing, or answers\
    \ about a set it was not given - is caught here by the answer following the input exactly\
    \ across 4 different inputs:\n\n      spacing 1000 mm -> placed 9\n      spacing 1500\
    \ mm -> placed 6\n      spacing 3000 mm -> placed 3\n      spacing 999999 mm - longer\

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `LocationCurve`, `Curve.Evaluate`,
  `FamilySymbol.Activate` and
  `Document.Create.NewFamilyInstance(XYZ, FamilySymbol, StructuralType)` are
  present 2020 through 2027, compiled at both ends. Millimetres become feet by
  dividing by 304.8 as plain arithmetic - no units API.

# ROUTING - repeated in ARRAY_ELEMENTS, PLACE_FAMILY_INSTANCES and
# MEASURE_ELEMENT_LENGTHS.
#
#   "add hangers along this duct run at 2 metre centres" -> here
#   "set these out evenly along the run" -> here
#   "put a bracket every 1500 along this" -> here
#   "copy these across at 600
#    centres"                        -> ARRAY_ELEMENTS - it repeats elements
#                                       that EXIST, along a direction given to
#                                       it. This creates new ones and takes the
#                                       direction from the run
#   "place twelve of these"          -> PLACE_FAMILY_INSTANCES - at points
#                                       somebody chooses, with no run involved
#   "how long is this run"           -> MEASURE_ELEMENT_LENGTHS, which is what
#                                       tells you how many will fit

utterances:
  - add hangers along this duct run at 2 metre centres
  - set these out evenly along the run
  - put a bracket every 1500 along this
  - space these along the pipe
  - distribute these along the run

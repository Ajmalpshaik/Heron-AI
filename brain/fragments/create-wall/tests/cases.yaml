positive:
  - given: five points around a room, one level, 3000 mm height
    expect: >
      FOUR walls, not five - one per consecutive pair. Read the endpoints back
      and check they are the points handed in

  - given: two points 4 m apart
    expect: one wall of that length, standing 3000 mm above the level

  - given: >
      a curtain wall type and "0,0,0; arc 5000,5000 10000,0" - a half circle of
      radius 5000 mm (version 2, 5b-1216)
    expect: >
      ONE curtain wall whose location line is an arc: its Length in Properties
      reads 15708 mm (pi x 5000), not the 10000 mm chord, and the findings say 1
      of them follows an arc. How its panels sit on the arc is recorded as seen

  - given: a basic wall type and "5000,0,0; arc 0,5000 -5000,0; arc 0,-5000 5000,0"
    expect: >
      TWO walls, each a half circle - a closed round wall of radius 5000 mm,
      lengths 15708 mm each

  - given: the version 1 run again - five points around a room, no arc in them
    expect: >
      exactly what version 1 built: four straight walls, endpoints as typed, and
      the same findings sentence word for word

  - given: >
      "0,80000,0; 6000,80000,0", 3000 mm high, baseOffset 1500 on a level at
      elevation 0 (version 3, 5b-1345)
    expect: >
      ONE wall whose Base Offset reads 1500 in Properties and Unconnected Height
      3000. Its bounding box runs from 1500 to 4500 mm in Z - the height measured
      from the base, not from the level. The findings say "Base Offset +1500 mm
      ... from +1500 to +4500 mm" and "Read back off the walls: 1 of 1 as asked"

  - given: the same run with baseOffset -300
    expect: >
      the wall starts 300 mm below the level: Base Offset -300, Z from -300 to
      2700 mm

negative:
  - given: a model set out to a survey datum, where Elevation and ProjectElevation differ
    expect: >
      the walls at the height Revit shows for that level, NOT off by the survey
      offset. THIS IS THE FIRST CASE TO RUN - no error, no warning, walls metres
      from where they belong, and only a section reveals it

  - given: the walls built, then looked at in a corner
    expect: >
      whatever Revit really did about joining, recorded as fact. This fragment
      claims no join, and two walls that LOOK joined and are not will show a line
      through the corner on the printed plan

  - given: two points at the same coordinates
    expect: "`tooShort` counts it and no wall is created"

  - given: '"0,0,0; arc 5000,0 10000,0" - an arc whose three points are in a line'
    expect: >
      refused before anything is built - `created` empty, `refused` 1, and the
      findings name the arc from 0,0 through 5000,0 to 10000,0 as not an arc.
      Also "0,0,0; arc 5000,5000 0,0", which ends where it starts

  - given: '"0,0,0; 6000,0,0; arc 9000,3000 6000,6000; arc 1,1 1,1" - one good arc, then a bad one'
    expect: >
      NOTHING built, not the straight wall and the good arc - the whole run is
      refused, because the walls after a bad arc would start in the wrong place

  - given: a wall type Revit refuses for this level
    expect: >
      counted in `refused`, the rest of the run still built. Not an exception
      that loses the walls that worked

  - given: >
      the same two points with baseOffset LEFT OUT, and again with baseOffset 0
      (version 3, 5b-1345)
    expect: >
      version 2's wall exactly: Base Offset 0, Z from 0 to 3000 mm, and the
      findings version 2 gave word for word - no "Base Offset" line. A base
      at 1500, or any offset not typed, is a FAIL

  - given: baseOffset 200000000 - 200 km, past Revit's own limit of 30000 feet
    expect: >
      refused before anything is built - `created` empty, `refused` 1, and the
      findings say a base offset is millimetres above the level, that Revit
      takes none past 9144000, and "Nothing was built"

  - given: the wall's top asked to reach the level above
    expect: >
      NOT what this does. The height is unconnected, and attaching it is a
      separate parameter change - a wall that looks right in plan and stops short
      in section is the failure this note exists for

second_route:
  - For a base offset, the wall's Base Offset and Unconnected Height in Properties, and READ_ELEMENT_LEVEL's offsetMm and REPORT_BOUNDING_BOX's lowest corner on the same wall
  - Revit's own Architecture then Wall between the same two points, and the two compared in a section
  - For an arc, Revit's own Wall with Start-End-Radius Arc through the same three points, and the two Lengths compared

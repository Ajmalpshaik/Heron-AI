compatibility-note: >
  One implementation for every release. `Wall.Create` taking a curve, a type, a
  level, a height, an offset, a flip and a structural flag is present 2020
  through 2027 - read off the reference assemblies at both ends rather than
  remembered, where the same eight-argument overload appears on both. Unlike
  the floor and the ceiling, the wall creation call did NOT move at 2022, so no
  run-time lookup is needed here.

# ROUTING - repeated in CREATE_FLOOR, JOIN_GEOMETRY and SPLIT_MEP_RUN.
#
#   "build a wall between these points" -> here
#   "put a wall here"                   -> here
#   "make a floor slab over this area"  -> CREATE_FLOOR
#   "join these walls together"         -> JOIN_GEOMETRY - nothing here joins
#                                          anything
#   "what is this wall made of"         -> REPORT_COMPOUND_STRUCTURE - the layer
#                                          build-up of a type. A QUESTION, and
#                                          "what is the wall build up" resolved
#                                          HERE, to a fragment that builds a
#                                          wall, until 2026-09-05
#   "what is in this curtain wall"      -> REPORT_CURTAIN_ELEMENTS - panels and
#                                          mullions, which is what a curtain
#                                          wall is made of instead of layers.
#                                          That sentence also resolved here
#   "split this wall"                   -> NOTHING CAN. Revit exposes a break
#                                          for ducts and pipes and for nothing
#                                          else - SPLIT_MEP_RUN is named for
#                                          what it can actually do, and says so
#   "draw a curtain wall between these points" -> here, with a curtain wall
#                                          type as wallType. Declared
#                                          2026-09-24, once check-routing showed
#                                          it landing here with no other
#                                          fragment's sentence moving. Nothing in
#                                          this one is particular to a kind of
#                                          wall type, and its own proof drew a
#                                          BASIC wall - whether it builds a
#                                          curtain one is shown by the first run
#                                          of set-curtain-wall-grid's job file,
#                                          whose setup draws a curtain wall with
#                                          this fragment before anything else
#   "draw a curtain wall"               -> here, and NOT REACHED. Measured
#                                          through find on 2026-09-24, before and
#                                          after the sentence above was declared:
#                                          it reaches REPORT_CURTAIN_ELEMENTS, and
#                                          so do "build me a curtain wall" and
#                                          "make a curtain wall" - a read, so
#                                          nothing is built and nothing changes.
#                                          Only the sentence with the points a
#                                          wall needs is declared here
#   "set the curtain wall grid", "set   -> SET_CURTAIN_WALL_GRID and
#    the mullions"                         SET_CURTAIN_WALL_MULLIONS. A curtain
#                                          wall's grid and mullions come from
#                                          its TYPE, never from here
#   "what is this curtain wall type set
#    to"                                -> REPORT_CURTAIN_WALL_TYPE

utterances:
  - build a wall between these points
  - put a wall here
  - draw the walls for this room
  - make a wall
  - add a partition here
  - draw a curtain wall between these points

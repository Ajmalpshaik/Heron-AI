id: FRG-ELE-033
semantic-identity: "build a wall between these two points, straight or along an arc"
kind: action
domain: revit.elements
capability: CREATE_WALL
version: 2
source: OFFICIAL
risk: MODIFY

purpose: >
  Creates walls between consecutive points on one level, at a given height -
  straight, or along an arc where one is written. The plain "put a wall here" -
  the thing rooms are bounded by and MEP has to pass through.

  **Written as a run of points, like CREATE_DUCT and CREATE_PIPE.** Two points
  is the single-wall case. A room needs four walls and a corridor needs two, so
  making the run the general form saves the caller a loop and keeps the whole
  library one shape.

  **AN ARC IS WRITTEN IN THE RUN (version 2, row 5b-1216).** `arc MX,MY X,Y`
  after a point makes the next wall an arc: through MX,MY, ending at X,Y - the
  writing CREATE_FAMILY_EXTRUSION's loops take, so one writing works for a
  family and a project. A full circle is two arcs. Basic and curtain walls
  alike; how a curtain wall's panels sit on the arc is Revit's, and is recorded
  by the first run (NEEDS-CHECKING Group HM), not claimed here. A run with no
  `arc` in it builds exactly what version 1 built. An arc whose three points
  are in a line, or two in one place, refuses the whole run: nothing is built,
  because the next wall would start where the bad one ends.

  **The base height is the level's PROJECT elevation.** Every XYZ the API takes
  is project-internal, while `Elevation` is measured from whatever the level
  type's Elevation Base says. On a model set out to a survey datum the two
  differ, and the wrong one builds the wall at the wrong height with no error.

  **The height is unconnected.** The wall stands at the height given and is not
  attached to the level above. Attaching it is a separate parameter change and
  is not done here, because "up to the slab" and "3 m tall" are different
  instructions.

  **Nothing is joined.** Walls meeting at a corner are not joined to each other
  by this, and whether Revit joins them itself is not claimed. JOIN_GEOMETRY is
  what makes two elements agree about which cuts which.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: level
      type: Level
      source: request
    - name: wallType
      type: WallType
      source: request
    # Millimetres, as typed: corners "X,Y,Z" with semicolons between - the Z
    # is taken from the level - and, between two corners, an arc "arc MX,MY
    # X,Y": a point the wall passes through, then where it ends. A full circle
    # is "R,0,0; arc 0,R -R,0; arc 0,-R R,0". TEXT SINCE VERSION 2, read in the
    # fragment exactly as the add-in read an IList<XYZ> before - the same
    # numbers, refusals, bound and division by 304.8 - so a run without an arc
    # is unchanged (5b-1216).
    - name: points
      type: string
      source: request
    - name: height
      type: double
      source: request
    - name: structural
      type: bool
      source: request
  provides:
    - name: created
      role: result
      type: IList<Element>
    - name: tooShort
      # Point pairs closer together than Revit's own tolerance, so no wall
      # could exist there. Given and unusable, never a wall it built (D-52).
      role: accounting
      type: int
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: int
    - name: findings
      type: IList<string>


id: FRG-ELE-033
semantic-identity: "build a straight wall between these two points"
kind: action
domain: revit.elements
capability: CREATE_WALL
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Creates straight walls between consecutive points on one level, at a given
  height. The plain "put a wall here" - the thing rooms are bounded by and MEP
  has to pass through.

  **Written as a run of points, like CREATE_DUCT and CREATE_PIPE.** Two points
  is the single-wall case. A room needs four walls and a corridor needs two, so
  making the run the general form saves the caller a loop and keeps the whole
  library one shape.

  **The base height is the level's PROJECT elevation.** Every XYZ the API takes
  is project-internal, while `Elevation` is measured from whatever the level
  type's Elevation Base says. On a model set out to a survey datum the two
  differ, and the wrong one builds the wall at the wrong height with no error.

  **The height is unconnected.** The wall stands at the height given and is not
  attached to the level above. Attaching it is a separate parameter change and
  is not done here, because "up to the slab" and "3 m tall" are different
  instructions.

  **Nothing is joined.** Walls meeting at a corner are not joined to each other
  by this, and whether Revit joins them itself is not claimed. JOIN_GEOMETRY is
  what makes two elements agree about which cuts which.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: level
      type: Level
      source: request
    - name: wallType
      type: WallType
      source: request
    # Internal units. Plan points; the Z is taken from the level.
    - name: points
      type: IList<XYZ>
      source: request
    - name: height
      type: double
      source: request
    - name: structural
      type: bool
      source: request
  provides:
    - name: created
      role: result
      type: IList<Element>
    - name: tooShort
      # Point pairs closer together than Revit's own tolerance, so no wall
      # could exist there. Given and unusable, never a wall it built (D-52).
      role: accounting
      type: int
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: int
    - name: findings
      type: IList<string>


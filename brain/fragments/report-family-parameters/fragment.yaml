runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Document.FamilyManager`,
  `FamilyManager.GetParameters`, `CurrentType`, `FamilyParameter.Definition`,
  `StorageType`, `IsInstance`, `Formula` and the `FamilyType.AsString`,
  `AsValueString`, `AsElementId` readers were confirmed present on the 2020
  assembly on 2026-09-15.

  `FamilyParameter.DisplayUnitType` is DELIBERATELY NOT READ. It is the
  property that became ForgeTypeId at 2021, and touching it is what makes one
  implementation impossible. Values cross as Revit's own strings instead, so
  no unit is named here at all.

# ROUTING - repeated in REPORT_FAMILY_SIZE_TABLE.
#
#   "where does this family get its material" -> here
#   "what parameters does this family have"   -> here
#   "what sizes does the lookup table hold"   -> REPORT_FAMILY_SIZE_TABLE
#   "what material is this element"           -> READ_ELEMENT_MATERIAL, in a project

utterances:
  - what parameters does this family have
  - where does this family get its material
  - list the family parameters
  - does this family have a material parameter
  - what does the current type set

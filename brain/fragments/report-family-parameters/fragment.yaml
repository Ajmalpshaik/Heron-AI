id: FRG-ELE-058
semantic-identity: "what parameters this open family has, and what the current type sets them to"
kind: action
domain: revit.families
capability: REPORT_FAMILY_PARAMETERS
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Lists the parameters of the family open for editing - name, storage type,
  whether it is an instance or a type parameter, any formula, and what the
  current type sets it to. The question asked before changing anything inside
  a family.

  **IT IS THE ANSWER TO "WHERE DOES THIS FAMILY GET ITS MATERIAL".** A fitting
  family usually carries a MATERIAL PARAMETER, and its geometry is tied to
  that rather than to a material directly - so the project can drive it per
  type. Painting a material onto the geometry instead hard-codes it, and the
  family can then never be anything else. Which of the two a family does is
  not visible from outside it, and getting it wrong is not a small mistake, so
  it is read before it is changed.

  **A FORMULA MEANS THE VALUE IS NOT YOURS TO SET.** A parameter driven by a
  formula refuses a written value, and the refusal reads like a failure of the
  write rather than a fact about the parameter. So the formula is reported
  beside the value.

  **EVERY PARAMETER COMES BACK AS ONE STRING.** A list is abbreviated to its
  first three entries before a reader sees it, and a family with forty
  parameters then reads as though it had three.

  **IT NEEDS THE FAMILY OPEN FOR EDITING.** Parameters belong to the family
  document. Run it with a project in front and it says so rather than
  reporting nothing, because "no parameters" and "you are looking at the wrong
  document" are different answers.

  Changes nothing and opens no transaction.

contract:
  needs:
    - name: doc
      type: Document
    # Narrows to parameters whose NAME contains this. Empty reports them all.
    - name: nameContains
      type: string
      source: request
  provides:
    - name: parameterCount
      role: result
      type: int
    - name: parameterList
      # Every matching parameter on ONE line - name, storage type, instance or
      # type, value, formula. A string, for the reason in the purpose.
      role: result
      type: string
    - name: materialParameters
      # The parameters that hold a MATERIAL, named. The ones that decide what
      # the family is made of, which is the usual reason for asking.
      role: result
      type: string
    - name: currentTypeName
      # Which family type the reported values belong to. Values without a type
      # beside them are values from nowhere in particular.
      role: result
      type: string
    - name: scanned
      # How many parameters were examined before narrowing. Work DONE, never a
      # thing found (D-52).
      role: accounting
      type: int
    - name: notAFamily
      # That the document in front is a project, not a family being edited.
      role: accounting
      type: bool
    - name: findings
      type: IList<string>


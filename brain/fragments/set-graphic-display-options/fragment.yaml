    - name: view
      type: View
      source: request
    - name: sunIntensity
      type: string
      source: request
      optional: true
      absent: keep
    - name: shadowIntensity
      type: string
      source: request
      optional: true
      absent: keep
    - name: silhouettes
      type: string
      source: request
      optional: true
      absent: keep
    - name: smoothLines
      type: string
      source: request
      optional: true
      absent: keep
    - name: transparency
      type: string
      source: request
      optional: true
      absent: keep
    - name: hiddenLines
      type: string
      source: request
      optional: true
      absent: keep
    - name: sketchyLines
      type: string
      source: request
      optional: true
      absent: keep
    - name: depthCueing
      type: string
      source: request
      optional: true
      absent: keep
    - name: background
      type: string
      source: request
      optional: true
      absent: keep
    - name: backgroundImage
      type: string
      source: request
      optional: true
      absent: keep
    # The four below have no member in Revit's API; asking for one is
    # answered, in words, as the modeller's to tick by hand.
    - name: castShadows
      type: string
      source: request
      optional: true
      absent: keep
    - name: ambientShadows
      type: string
      source: request
      optional: true
      absent: keep
    - name: ambientLight
      type: string
      source: request
      optional: true
      absent: keep
    - name: photographicExposure
      type: string
      source: request
      optional: true
      absent: keep
  provides:
    - name: changed
      # Display settings that read back as asked.
      role: result
      type: int
    - name: readBack
      # The dialog as the view holds it afterwards - filled on every run that
      # reached the view, so evidence, never the count.
      role: accounting
      type: string
    - name: refused
      # Why NOTHING WAS CHANGED, as one sentence; null otherwise (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>


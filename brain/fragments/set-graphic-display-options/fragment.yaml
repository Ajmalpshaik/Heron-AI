tests: tests/

compatibility-note: >
  One implementation for every release. Read off the shipped reference
  assemblies and RevitAPI.xml of 2020 through 2027 on 2026-10-20:
  View.SunlightIntensity and ShadowIntensity (0-100), HasDisplayStyle,
  CanUseDepthCueing, Get/SetViewDisplayModel, Get/SetSketchyLines,
  Get/SetDepthCueing and Get/SetBackground; ViewDisplayModel's
  EnableSilhouettes, SilhouetteEdgesGStyleId, SmoothEdges (anti-aliasing),
  Transparency and ShowHiddenLines; ViewDisplaySketchyLines (jitter and
  extension 0-10); ViewDisplayDepthCueing (SetStartEndPercentages, FadeTo);
  ViewDisplayBackground.CreateSky, CreateGradient and CreateImage and its
  ViewDisplayBackgroundImageFlags - present and alike on every release. No
  member for Cast Shadows, Ambient Shadows, Ambient Light or Photographic
  Exposure exists on any of them: the GRAPHIC_DISPLAY_OPTIONS_* parameters are
  the dialog's own buttons, not values.

# ROUTING - the same rows are in the render, sun, display and camera cards.
#
#   "turn on sketchy lines"                  -> here
#   "sun intensity 80, shadows 40"           -> here
#   "silhouette edges in wide lines"         -> here
#   "put this view on realistic"             -> SET_VIEW_PROPERTIES, the
#                                               visual style
#   "set the render background to sky"       -> SET_RENDER_SETTINGS, the
#                                               rendered image's background
#   "set the sun to 10 am"                   -> SET_SUN_SETTINGS
#   "what are this view's display options"   -> REPORT_RENDER_SETTINGS (D-86)
#   "make this view look good"               -> APPLY_VISUAL_PRESET, a whole look
#                                               in one call

utterances:
  - switch on sketchy lines with a jitter of 5 in this view
  - turn the sun intensity up to 80 and the shadow intensity to 40 in this view
  - show silhouette edges in the 3D view
  - use smooth lines with anti-aliasing in this view
  - give this 3D view a gradient background

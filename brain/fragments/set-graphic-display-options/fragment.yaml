id: FRG-VIEW-144
semantic-identity: "set a view's graphic display options - sun intensity, shadow intensity, silhouette edges, anti-aliasing, transparency, sketchy lines, depth cueing and a gradient or image background"
kind: action
domain: revit.views
capability: SET_GRAPHIC_DISPLAY_OPTIONS
version: 3
# VERSION 3, 2026-10-20 - row 5b-1283. A view that takes no depth cueing was
# refused "Revit offers it in elevations and sections" - on an elevation.
# Measured on Revit 2020: the elevations of the Systems template, Mechanical
# or Electrical, take it once their View Discipline is Architectural; the
# refusal now names the discipline. Version 2's proof below no longer
# describes the code: DRAFT until it is proved again.
# VERSION 2, 2026-10-20 - row 5b-1279, found running Group IB's IB5 on Revit
# 2020. On a perspective camera view, version 1's read-back called
# GetDepthCueing whatever was asked, and Revit threw "This view cannot use
# Depth Cueing" - the sun, shadow and line changes rolled back with it. Depth
# cueing is now read only where CanUseDepthCueing says the view offers it.
# And on that view, silhouette line style id -1, SetViewDisplayModel refused
# smooth lines ("not a valid line style"); a view with none is now given Wide
# Lines first, silhouettes left as they were.
source: OFFICIAL
risk: MODIFY

# WHY IT EXISTS - a comment, not `purpose`, because `purpose` is searched.
# 2026-10-20: the owner asked for every part of rendering and the realistic
# view, and the Graphic Display Options dialog had no tool - only the visual
# style itself, which SET_VIEW_PROPERTIES sets and keeps.
#
# HOW IT BEHAVES - comments, not `purpose`.
#
# **WHAT THE DIALOG HOLDS FOR ONE VIEW**, each a word or keep:
#   sunIntensity, shadowIntensity   whole numbers 0 to 100 (Lighting)
#   silhouettes        on, off, or a line style's name - on in that style
#   smoothLines        yes or no - Smooth lines with anti-aliasing
#   transparency       0 to 100
#   hiddenLines        None, By Discipline or All
#   sketchyLines       on, off, or "jitter=5; extension=3" (0 to 10 each)
#   depthCueing        on, off, or "start=0; end=100; fade=50" - elevations
#                      and sections, where Revit offers it
#   background         Sky, "gradient sky=R,G,B; horizon=R,G,B; ground=R,G,B"
#                      or "image <file>", with backgroundImage "fit to screen;
#                      fixed aspect ratio; tile; offset=0,0; scale=1,1"
#
# **WHERE REVIT'S API STOPS**, read off the API reference of every release
# 2020 to 2027 on 2026-10-20: Cast Shadows, Show Ambient Shadows, Ambient
# Light and Photographic Exposure have NO member - they are inputs so that
# asking for one is answered plainly, never dropped: the answer names each as
# the modeller's to tick in the dialog. A background cannot be set back to
# None - Revit makes a sky, a gradient or an image and nothing else. Show Edges
# and the style itself are the visual style: SET_VIEW_PROPERTIES. Ray Trace is
# no tool's on any release (SET_VIEW_PROPERTIES' card has the measurement).
#
# **EVERY WORD IS READ FIRST**; one this cannot read refuses the call and names
# the words it takes. **READ BACK:** every setting asked is read again, and
# only one that reads as asked counts.
#
# ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).
purpose: >
  Sets the Graphic Display Options of a view - sun and shadow intensity,
  silhouette edges, smooth lines with anti-aliasing, transparency, hidden
  lines, sketchy lines, depth cueing and the background - to new values.


id: FRG-DOC-050
semantic-identity: "make the linked model room bounding, so rooms and spaces see its walls"
kind: action
domain: revit.document
capability: SET_LINK_ROOM_BOUNDING
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Switches Room Bounding on or off for one Revit link or every link - the
  link type's own setting that lets this model's rooms and MEP spaces stop at
  the linked model's walls, floors and ceilings.

  **IT IS THE REASON SPACES WILL NOT PLACE IN AN MEP MODEL.** An MEP model
  draws no walls of its own; its spaces are bounded by the architect's link,
  and only when that link is Room Bounding. PLACE_ROOMS and
  SYNC_SPACES_WITH_LINKED_ROOMS both find unbounded spaces when it is off, and
  until this fragment nothing could switch it.

  **IT IS A TYPE SETTING**, so every placed copy of that link changes with it,
  and each link type is read back after the change, never assumed.

  ASSUMES AN OPEN TRANSACTION (Golden Rule 16). One call is one undo entry.

contract:
  needs:
    - name: doc
      type: Document
    # One link by its name or the start of it; EMPTY is every Revit link.
    - name: linkName
      type: string
      source: request
    # true - Room Bounding on; false - off.
    - name: roomBounding
      type: bool
      source: request
  provides:
    - name: changed
      role: result
      type: int
    - name: alreadyThat
      # Link types already set that way. The evidence it looked (D-52).
      role: accounting
      type: int
    - name: refused
      role: accounting
      type: IList<string>
    - name: findings
      type: IList<string>


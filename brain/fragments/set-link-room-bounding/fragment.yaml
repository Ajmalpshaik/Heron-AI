compatibility-note: >
  One implementation for every release. `RevitLinkType` and
  `WALL_ATTR_ROOM_BOUNDING` are present 2020 through 2027, read with
  tools/api-surface on 2026-10-14. THAT THE LINK TYPE CARRIES ITS ROOM BOUNDING
  ON THAT PARAMETER IS NOT YET SEEN ON A MODEL: the type parameter named
  "Room Bounding" is asked for by name when the built-in one is absent, and a
  type carrying neither is refused by name. The read-back is the check.

# ROUTING - the same rows are in SYNC_SPACES_WITH_LINKED_ROOMS and PLACE_ROOMS.
#
#   "make the architecture link room bounding" -> here
#   "the spaces will not place"                -> PLACE_ROOMS, which reports what
#                                                 will not bound - and this card
#                                                 first when the link is not
#                                                 Room Bounding
#   "make the links relative"                  -> SET_LINK_PATH_TYPE
#   "make spaces from the linked rooms"        -> SYNC_SPACES_WITH_LINKED_ROOMS

utterances:
  - make the architecture link room bounding
  - turn on room bounding for the linked model
  - the spaces will not place because the link is not room bounding
  - switch room bounding off for this link

# VERSION 2 (2026-11-01) - SET_LINK_PATH_TYPE WAS MERGED INTO THIS CARD on the
# owner's instruction ("make sure there is no duplicate tools", then "ok go
# ahead merge all"), and is DEPRECATED. One tool for a Revit link TYPE's own
# settings: the same links found the same way (`linkName`, the start of a
# name, empty for every link), each setting read before it is written and a
# link already as asked never written again, every change read back. What that
# card had and this one lacked is `pathType` - relative or absolute, a Revit
# Server or cloud link named and left alone because Revit forbids switching to
# or from Server, the model regenerated before the read-back - and its
# `report`, one string with every link left alone and why. BOTH INPUTS ARE NOW
# OPTIONAL AND AT LEAST ONE IS REQUIRED: `roomBounding` is TEXT since version 2
# ("true" or "false", "on" or "off"), because a yes/no left out reads false and
# could not be told from "off"; left out it reads "unchanged". `changed` counts
# link types changed in either setting, `alreadyThat` those already as asked in
# every setting asked. Nothing of that card is left out, and no rule of the two
# was opposite. Version 1's proof below no longer described the code and was
# kept as the record; DRAFT at the time, until version 2 is proved on a real
# model (D-30).

purpose: >
  Switches Room Bounding on or off for one Revit link or every link - the
  link type's own setting that lets this model's rooms and MEP spaces stop at
  the linked model's walls, floors and ceilings.

  **AND HOW EACH LINK STORES ITS PATH** (version 2) - Relative or Absolute, as
  Manage Links' Path Type column does; a Revit Server or cloud link is named
  and left alone. Either setting, or both, in one call.

  **IT IS THE REASON SPACES WILL NOT PLACE IN AN MEP MODEL.** An MEP model
  draws no walls of its own; its spaces are bounded by the architect's link,
  and only when that link is Room Bounding. PLACE_ROOMS and
  SYNC_SPACES_WITH_LINKED_ROOMS both find unbounded spaces when it is off, and
  until this fragment nothing could switch it.

  **IT IS A TYPE SETTING**, so every placed copy of that link changes with it,
  and each link type is read back after the change, never assumed.

  ASSUMES AN OPEN TRANSACTION (Golden Rule 16). One call is one undo entry.

contract:
  needs:
    - name: doc
      type: Document
    # One link by its name or the start of it; EMPTY is every Revit link.
    - name: linkName
      type: string
      source: request
    # true - Room Bounding on; false - off. TEXT since version 2 ("true",
    # "false", "on", "off"), so it can be left out: left out it reads
    # "unchanged" and Room Bounding is not touched.
    - name: roomBounding
      type: string
      source: request
      optional: true
      absent: unchanged
    # VERSION 2, from SET_LINK_PATH_TYPE. "relative" or "absolute". Left out
    # it reads "unchanged" and no path is touched. roomBounding and pathType
    # both left out is refused.
    - name: pathType
      type: string
      source: request
      optional: true
      absent: unchanged
  provides:
    - name: changed
      role: result
      type: int
    - name: alreadyThat
      # Link types already set that way - in every setting asked, since
      # version 2. The evidence it looked (D-52).
      role: accounting
      type: int
    - name: refused
      role: accounting
      type: IList<string>
    - name: report
      # VERSION 2, from SET_LINK_PATH_TYPE. ONE STRING with every link left
      # alone and why - a Server or cloud link, a path that did not read back,
      # and every reason in `refused` (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>


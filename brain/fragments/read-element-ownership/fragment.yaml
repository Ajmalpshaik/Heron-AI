id: FRG-ELE-010
semantic-identity: "who owns these on a workshared model, and which can I edit"
kind: action
domain: revit.elements
capability: READ_ELEMENT_OWNERSHIP
version: 1
source: OFFICIAL
risk: READ

purpose: >
  On a workshared model, which of these elements are free to edit and which
  belong to somebody else right now.

  **This is the check that stops a batch failing halfway.** An element owned by
  another user cannot be changed, and Revit reports that at the moment of the
  write - so a move of two hundred ducts stops at the eleventh with ten already
  moved. Asked first, it becomes a sentence: *"189 can be moved, 11 are held by
  someone else."*

  **It is also the E8 case in the register**, written down there as something to
  test at the PC and unbuildable until now for want of a fragment that reads
  ownership at all.

  **A model that is NOT workshared is a distinct answer, not "everything is
  free".** Both allow the edit, and treating them the same means a caller cannot
  tell "checked, all clear" from "there was nothing to check" - which is the
  distinction that matters the day a single-user model gets workshared.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
  provides:
    - name: editable
      role: result
      type: IList<ElementId>
    - name: ownedByOthers
      role: result
      type: IDictionary<ElementId, string>
    - name: workshared
      # A MODEL THAT IS NOT WORKSHARED IS A DISTINCT ANSWER, NOT "EVERYTHING
      # IS FREE" - without it a caller cannot tell "checked, all clear" from
      # "there was nothing to check".
      role: result
      type: bool

proof:
  date: '2026-09-07'
  by: Ajmal PS
  model: Snowdon Towers Sample HVAC (9,641 elements), Revit 2024, session 42676
  positive_case: 37 mechanical equipment items selected in Snowdon Towers Sample HVAC - run
    as it would normally be run. returned editable 37 item(s) [1365188, 1366142, 1366299,
    ...], ownedByOthers 0 entry(ies), workshared false. inputs came elements from the selection
    (37). on Snowdon Towers Sample HVAC
  negative_case: "CANNOT COME BACK EMPTY, so proved by TRACKING instead (D-53). read-element-ownership\
    \ describes whatever it is given, so no arrangement makes its answer empty. What D-30's\
    \ negative case exists to catch - a fragment that succeeds while doing nothing, or answers\
    \ about a set it was not given - is caught here by the answer following the input exactly\
    \ across 5 different selections:\n\n      28 (28 duct taps) selected -> editable 28 item(s)\
    \ [1383647, 1383653, 1384651, ...]\n      16 (16 spaces) selected -> editable 16 item(s)\
    \ [1410865, 1410870, 1410963, ...]\n      4 (4 walls) selected -> editable 4 item(s) [1543126,\
    \ 1543148, 1543192, ...]\n      12 (12 sheets) selected -> editable 12 item(s) [1363532,\
    \ 1363547, 1363562, ...]\n      37 (37 mechanical equipment items) selected -> editable\
    \ 37 item(s) [1365188, 1366142, 1366299, ...]\n\n    Different inputs, exact matches every\
    \ time. A fragment falling back to the active view, the whole model, or a previous run\
    \ could not do that."
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: 457c7217f54b7ace

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Document.IsWorkshared`,
  `WorksharingUtils.GetCheckoutStatus` and `GetWorksharingTooltipInfo` are
  unchanged 2020 to 2027, and no ElementId is built from an integer.

# ROUTING - repeated in SET_PIN_STATE, because "locked" is said of both.
#
#   "who owns this"                      -> here
#   "why can I not edit this"            -> here FIRST, then SET_PIN_STATE
#   "pin these" / "unpin"                -> SET_PIN_STATE
#   "is it pinned"                       -> SET_PIN_STATE
#
# PINNED AND OWNED LOOK IDENTICAL TO A USER and have opposite fixes. Unpinning
# an element owned by somebody else does nothing at all; asking them to
# relinquish does nothing to a pinned one. Reporting the wrong cause sends
# somebody to the wrong person.

# ROUTING - repeated in LIST_WORKSETS and SET_ELEMENT_WORKSET.
#
#   "who owns this"                -> here
#   "can I edit this"              -> here
#   "list the worksets"            -> LIST_WORKSETS - the model's worksets
#                                     and which are open, rather than one
#                                     element's owner
#   "put these on the MEP workset" -> SET_ELEMENT_WORKSET

utterances:
  - who owns this
  - is this owned by someone else
  - can I edit these
  - why can I not change this
  - is anyone else working on these

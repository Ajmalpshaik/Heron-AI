id: FRG-QA-016
semantic-identity: "are the sleeves the right size for what passes through them"
kind: filter
domain: revit.qa
capability: CHECK_SLEEVE_SIZE
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Checks every sleeve against the service that actually passes through it - is
  the hole big enough for the pipe plus its insulation plus the annular gap the
  specification asks for, and is it not so oversized that fire-stopping becomes
  the problem instead. Read-only.

  **IT CHECKS SLEEVES THAT ALREADY EXIST. IT PLACES NOTHING AND CUTS NOTHING.**
  *"Put the sleeves in"* and *"cut the holes for the ducts"* are a different job
  with nothing yet in the model for this to read.

  **THE SERVICE IS FOUND BY GEOMETRY, NOT BY A PARAMETER.** A sleeve family
  almost never records what goes through it - that link is stored nowhere. So
  the pairing is made by asking which service actually occupies the same space.

  **A SLEEVE WITH NOTHING THROUGH IT IS A FINDING, NOT A BLANK ROW.** It is
  either an orphan left behind when a run moved, or the run moved and the hole
  did not. Both are real and both look like "no data" in a report that omits
  them.

  **THE REQUIRED SIZE IS ARITHMETIC AND EVERY TERM IS EXPLICIT**: the service's
  outside size, plus twice its insulation, plus twice the annular clearance -
  which is a per-request number and never a default (D-33). Insulation is read
  from the real insulation element rather than assumed, because a 50 mm jacket
  turns a comfortable sleeve into a tight one.

  **OVERSIZE IS REPORTED AS WELL AS UNDERSIZE**, and that is not fussiness. A
  hole far bigger than the service costs fire-stopping, weakens what it is cut
  through, and gets queried on site.

  **SLEEVE SIZE IS READ BY PARAMETER NAME AND FAMILIES DO NOT AGREE ON NAMES.**
  A list of the usual ones is tried and the one that answered is REPORTED per
  row, so a sleeve whose family calls it something else shows up as unreadable
  rather than as passing.

  **LINKED MODELS ARE READ ONLY WHEN ASKED FOR (version 2, D-59).** With
  `includeLinks` absent this answers for this model alone, exactly as the
  proof measured. With it set, each sleeve's centre is looked for inside the
  walls, floors, roofs, ceilings and structural members of every loaded
  link, in each placement's own coordinates, and `linkedMatches` names what
  it passes through - the link, the type, the element's id IN THE LINK and
  its **Fire Rating**. That is the other half of this check: an oversized
  sleeve through a 2-hour wall is a fire-stopping problem, and the wall is
  usually the architect's. `linksSearched` says how many links were read:
  set and 0 means "you asked, and none are loaded". "Passes through" is a
  box test, so a sleeve near a corner can name both walls - every candidate
  is listed. **NOTHING FROM A LINK IS EVER SELECTED OR CARRIED** -
  `undersized` and `orphaned` stay this model's own; the chain revives ids
  against this model, and a linked id that happens to be in use here binds
  an unrelated element (FRAGMENT-ISSUES row 75). Only model elements are
  read from a link, never its views or sheets. Links nested inside a link
  are not read, and are counted in the answer. This is version 2; version
  1's proof no longer describes the code, and the fragment is DRAFT until
  it is proved again.

# A NAME TWO PARAMETERS SHARE IS NEVER READ: a sleeve whose size name, or whose
# service's, is carried twice is `unreadable` with the name said - never read
# from the next name in the list instead - and a linked wall's Fire Rating
# carried twice reads NOT READ in `linkedMatches` (D-54 s3, FRAGMENT-ISSUES
# 5b-203; added 2026-10-09). Written here and not in `purpose` on purpose: the
# purpose is embedded for routing, and a sentence about this in it moved other
# cards' utterances in check-routing, measured against the base commit.
contract:
  needs:
    - name: doc
      type: Document
    - name: sleeves
      type: IList<Element>
    - name: annularClearance
      type: double
      source: request
    - name: maxOversize
      type: double
      source: request
    - name: includeLinks
      # D-59. THE MODELLER DECIDES, JOB BY JOB, and absent means host only -
      # which is what this fragment did before and what its proof measured.
      # `optional: true` is what lets it be left out: the binder refuses an
      # absent request need unless it is a bool marked optional, which binds
      # false (HeronBindingNote.AbsentValue, FRAGMENT-ISSUES row 5b-227).
      type: bool
      source: request
      optional: true
  provides:
    - name: findings
      type: IList<string>
    - name: undersized
      role: result
      type: IList<ElementId>
    - name: orphaned
      role: result
      type: IList<ElementId>
    - name: unreadable
      # What it was handed and could NOT read. The evidence it tried,
      # never a thing it found (D-52). Since 2026-10-09 it also holds the
      # sleeves whose size name, or whose service's, two parameters share -
      # read by name, either would be Revit's random pick (D-54 s3,
      # FRAGMENT-ISSUES 5b-203).
      role: accounting
      type: int
    - name: linksSearched
      # D-59's second field, and the one that does the work: how many
      # linked DOCUMENTS were actually read - a file placed twice is one.
      # `includeLinks` set and this at 0 means "asked, and none are
      # loaded", which must not read the same as host-only.
      role: accounting
      type: int
    - name: linkedMatches
      # What was found in the links, as TEXT - the first line says which of
      # D-59's three cases this is, then the links' own lines. Text on
      # purpose: a linked element or id carried to the next step is looked
      # up in THIS model (FRAGMENT-ISSUES row 75).
      role: accounting
      type: IList<string>


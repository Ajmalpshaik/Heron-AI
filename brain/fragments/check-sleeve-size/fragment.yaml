id: FRG-QA-016
semantic-identity: "are the sleeves the right size for what passes through them"
kind: filter
domain: revit.qa
capability: CHECK_SLEEVE_SIZE
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Checks every sleeve against the service that actually passes through it - is
  the hole big enough for the pipe plus its insulation plus the annular gap the
  specification asks for, and is it not so oversized that fire-stopping becomes
  the problem instead. Read-only.

  **IT CHECKS SLEEVES THAT ALREADY EXIST. IT PLACES NOTHING AND CUTS NOTHING.**
  *"Put the sleeves in"* and *"cut the holes for the ducts"* are a different job
  with nothing yet in the model for this to read.

  **THE SERVICE IS FOUND BY GEOMETRY, NOT BY A PARAMETER.** A sleeve family
  almost never records what goes through it - that link is stored nowhere. So
  the pairing is made by asking which service actually occupies the same space.

  **A SLEEVE WITH NOTHING THROUGH IT IS A FINDING, NOT A BLANK ROW.** It is
  either an orphan left behind when a run moved, or the run moved and the hole
  did not. Both are real and both look like "no data" in a report that omits
  them.

  **THE REQUIRED SIZE IS ARITHMETIC AND EVERY TERM IS EXPLICIT**: the service's
  outside size, plus twice its insulation, plus twice the annular clearance -
  which is a per-request number and never a default (D-33). Insulation is read
  from the real insulation element rather than assumed, because a 50 mm jacket
  turns a comfortable sleeve into a tight one.

  **OVERSIZE IS REPORTED AS WELL AS UNDERSIZE**, and that is not fussiness. A
  hole far bigger than the service costs fire-stopping, weakens what it is cut
  through, and gets queried on site.

  **SLEEVE SIZE IS READ BY PARAMETER NAME AND FAMILIES DO NOT AGREE ON NAMES.**
  A list of the usual ones is tried and the one that answered is REPORTED per
  row, so a sleeve whose family calls it something else shows up as unreadable
  rather than as passing.

contract:
  needs:
    - name: doc
      type: Document
    - name: sleeves
      type: IList<Element>
    - name: annularClearance
      type: double
      source: request
    - name: maxOversize
      type: double
      source: request
  provides:
    - name: findings
      type: IList<string>
    - name: undersized
      role: result
      type: IList<ElementId>
    - name: orphaned
      role: result
      type: IList<ElementId>
    - name: unreadable
      # What it was handed and could NOT read. The evidence it tried,
      # never a thing it found (D-52).
      role: accounting
      type: int


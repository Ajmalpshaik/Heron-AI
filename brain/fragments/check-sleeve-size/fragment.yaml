compatibility-note: >
  One implementation for every release. `InsulationLiningBase.GetInsulationIds`,
  `BoundingBoxXYZ` and the geometry options are unchanged 2020 through 2027 -
  read off the reference assemblies at both ends. `annularClearance` and
  `maxOversize` arrive in internal FEET; the millimetres the person spoke are
  converted at the edge, before this (D-20).

# ROUTING - repeated in CHECK_MINIMUM_CLEARANCE and AUDIT_MEP_OPENINGS.
#
#   "are the sleeves big enough for the pipes going through" -> here
#   "check the sleeves against what goes through them"       -> here
#   "is the hole the right size for that duct"               -> here
#   "which of my openings are wrong now the ducts have moved" -> AUDIT_MEP_OPENINGS
#                                        - that asks whether each opening is
#                                          still in the right PLACE and still
#                                          needed; this asks whether it is the
#                                          right SIZE
#   "what is too close to what"          -> CHECK_MINIMUM_CLEARANCE - a gap
#                                          between two things that must NOT
#                                          touch; a sleeve and its pipe must

utterances:
  - are the sleeves big enough for the pipes going through
  - check the sleeves against what goes through them
  - is the hole the right size for that duct
  - check the sleeve sizes
  - are my sleeves oversized

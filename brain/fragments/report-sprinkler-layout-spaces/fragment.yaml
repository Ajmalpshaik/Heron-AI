compatibility-note: >
  One implementation for every release. SpatialElement.GetBoundarySegments,
  BoundarySegment.GetCurve, Curve.Tessellate, Level.Elevation and
  ProjectElevation, Element.get_BoundingBox, CEILING_HEIGHTABOVELEVEL_PARAM,
  INSTANCE_ELEVATION_PARAM, FAMILY_LEVEL_PARAM and Family.FamilyPlacementType
  are present 2020 to 2027. The placement type is read with ToString(), so no
  enum member a release lacks is named. Lengths are internal feet, converted
  here; no units API is touched (the 2021 move). No ElementId is read as a
  number - each is written with ToString().

# ROUTING - take-off wording only. "Place sprinklers in these rooms" is the
# revit_sprinkler_layout TOOL's, which reads this, lays the rooms out and opens
# the Companion; PLACE_FAMILY_INSTANCES keeps "put the sprinklers in" (the
# plan's review, R13; D-01).
#
#   "read the rooms for a sprinkler layout"      -> here
#   "the shape, area and height of one room"     -> READ_ROOM_GEOMETRY
#   "put the sprinklers in"                      -> PLACE_FAMILY_INSTANCES
utterances:
  - read the rooms for a sprinkler layout
  - sprinkler layout take-off of these spaces
  - the outlines, ceilings and existing sprinklers of these rooms for laying sprinklers out

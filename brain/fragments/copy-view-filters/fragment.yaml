revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `GetFilters`, `AddFilter`,
  `GetFilterOverrides`, `SetFilterOverrides`, `GetFilterVisibility` and
  `SetFilterVisibility` are all present on `View` from 2020 through 2027 - read
  off the reference assemblies at both ends. `GetOrderedFilters` and
  `SetIsFilterEnabled` are deliberately NOT used: both arrived at 2024, and
  naming either would break the 2020 build for an ordering and an enable flag
  this copy does not need.

# ROUTING - repeated in APPLY_VIEW_FILTER and REPORT_VIEW_FILTERS.
#
#   "copy the view filters from this view to the other views" -> here
#   "put the same filters on the rest of the plans"           -> here
#   "match the filter settings on these views"                -> here
#   "put that filter on this view"       -> APPLY_VIEW_FILTER - ONE filter,
#                                           with an override the caller built
#   "what filters are on this view"      -> REPORT_VIEW_FILTERS - a READ
#   "make a filter for supply air"       -> CREATE_VIEW_FILTER

utterances:
  - copy the view filters from this view to the other views
  - put the same filters on the rest of the plans
  - match the filter settings on these views
  - copy the filter overrides to these views
  - give these views the same filters as this one

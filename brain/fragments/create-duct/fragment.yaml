heron-agent: HERON-REVIT-SYS-030
heron-step: 14
heron-status: DRAFT
heron-since: 0.1.0
heron-layer: brain

id: FRG-MEP-003
semantic-identity: "draw straight duct segments along these points"
kind: action
domain: revit.mep
capability: CREATE_DUCT
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Draws straight duct between consecutive points - one segment per pair, so two
  points give one duct and five points give four. The plain "draw a duct from
  here to there", not a system build.

  **It does NOT connect anything, and that is the sentence to read twice.**
  Segments come out as bare duct. Whether two that share an endpoint arrive
  joined is not claimed here and must be checked with TRACE_CONNECTIVITY - a run
  that LOOKS right on screen and has open ends everywhere is the failure this
  warning exists for. Fittings, taps and transitions are not this fragment's
  job either.

  It creates at the duct type's own size. Sizing is SET_MEP_SIZE, deliberately
  kept separate: that capability also has to serve "change these ducts to
  400x250" on duct that already exists, and Revit's habit of snapping a size to
  the nearest one its type allows needs checking in exactly one place.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    # RESOLVED OBJECTS, never ids. A fragment taking an integer id would have to
    # build an ElementId from it, and that constructor is exactly what breaks in
    # Revit 2024 (D-05). Taking the object makes the trap unreachable.
    - name: systemType
      type: MechanicalSystemType
      source: request
    - name: ductType
      type: DuctType
      source: request
    - name: level
      type: Level
      source: request
    # Internal units, like every other geometric fragment here. Millimetres are
    # converted by whoever read the user's sentence, once, upstream.
    - name: points
      type: IList<XYZ>
      source: request
  provides:
    - name: created
      role: result
      type: IList<Element>
    - name: tooShort
      # Point pairs closer together than Revit's own tolerance, so no segment
      # could exist there. Given and unusable, never a duct it drew (D-52).
      role: accounting
      type: int
    - name: refused
      # Why it declined, in the user's words - the evidence it looked and
      # said no. Never a thing it FOUND, so it must not count toward
      # "did this come back empty" (D-52).
      role: accounting
      type: int

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `Duct.Create` taking a system type, a
  duct type, a level and two points is unchanged 2020 to 2027, and this fragment
  touches no units API and constructs no ElementId - the two things that moved.

# ROUTING - repeated in SPLIT_MEP_RUN.
#
#   "draw a duct from here to there" -> here
#   "add a duct"                     -> here
#   "split this duct"                -> SPLIT_MEP_RUN - the run already exists
#   "join these two"                 -> PLACE_MEP_FITTING. Connecting two
#                                       existing runs is not drawing a new one
#   "connect these two ducts"        -> PLACE_MEP_FITTING
#   "put an elbow here"              -> PLACE_MEP_FITTING - the fitting is
#                                       CHOSEN from the geometry, not named
#   "add a dimension between these"  -> CREATE_DIMENSION. It shares no words
#                                       with this fragment and used to resolve
#                                       here anyway, which is what a crowded
#                                       area does to retrieval
#   "run a pipe from here to there" -> CREATE_PIPE - the same job, other
#                                      domain, and written to the same shape
#   "put a drain line in"            -> CREATE_PIPE
#   "give it a fall of 1 in 100"     -> SET_MEP_SLOPE - drawn flat, then sloped
#   "they are touching but not connected" -> CONNECT_OPEN_ENDS
#   "draw a cable tray"              -> CREATE_ELECTRICAL_RUN
#   "draw a conduit"                 -> CREATE_ELECTRICAL_RUN - one fragment
#                                       serves both, and which is wanted is
#                                       asked for rather than guessed

# SENTENCES ADDED 2026-09-01 BECAUSE THE ROUTING TABLE ABOVE ALREADY CLAIMED
# THEM. A routing table is a COMMENT and comments are not indexed - the search
# reads semantic-identity, the utterances, the capability, the domain and the
# purpose, and nothing else. So a table saying "-> here" recorded a decision
# that retrieval could not act on, and these resolved elsewhere.

utterances:
  - draw a duct from here to there
  - run a duct across the room
  - add a duct between these points
  - draw the duct run
  - put a supply duct in
  - add a duct

compatibility-note: >
  PathReinforcement.Create(Document, Element, IList<Curve>, bool, ElementId,
  ElementId, ElementId, ElementId), PathReinforcementType.
  CreateDefaultPathReinforcementType and the PATH_REIN_* parameters used here
  are one signature and one value on every release 2020-2027 (read off the
  shipped assemblies 2026-10-19). BarDiameter on 2020-2021,
  BarNominalDiameter from 2022, for matching a diameter.

# ROUTING - the same rows are in every rebar card.
#
#   "bars along this slab edge"                 -> here
#   "extra top bars over this beam line"        -> here
#   "T12 at 200 both ways in this slab"         -> PLACE_AREA_REINFORCEMENT
utterances:
  - lay T12 at 200 bars 1200 long along this slab edge, top face
  - add path reinforcement along this line
  - put edge bars along the top of this wall
  - extra top bars over this beam line

runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. Document.Create.NewOpening(Level,
  Level, CurveArray), Opening.BoundaryCurves, Level.ProjectElevation and
  Name, BuiltInParameter WALL_BASE_CONSTRAINT, WALL_HEIGHT_TYPE and
  HOST_VOLUME_COMPUTED and Parameter.AsElementId read the same 2020 through
  2027 with tools/api-surface --members on 2026-11-02.
  Whether a shaft carries its levels in WALL_BASE_CONSTRAINT and
  WALL_HEIGHT_TYPE is NOT KNOWN from here - when either is missing the
  findings say its levels were not read back. Not seen in Revit.

# ROUTING (2026-11-02) - the same rows are in CREATE_OPENING and
# SELECT_OPENINGS.
#
#   "cut a shaft opening from Level 1 to Roof through all the slabs here"
#                                  -> here, the two levels and the corners
#   "add a shaft for the riser at these corners, base Level 0 top Level 6"
#                                  -> here
#   "put a 1200 x 800 opening in this wall at 900 above the floor"
#                                  -> CREATE_OPENING, `wallOpening` - one host
#   "make the hole through the slab", "cut the penetrations"
#                                  -> CREATE_OPENING - one slab it is given
#   "cut an opening in this slab"  -> CREATE_OPENING, declared there - by
#                                     identity. Ranking alone puts this card
#                                     first on it (check-routing, scratch
#                                     store, 2026-11-02; FRAGMENT-ISSUES row
#                                     5b-1393)
#   "where are the shafts"         -> SELECT_OPENINGS - a READ; it makes none
#   "where do the holes need to be"-> PROPOSE_MEP_OPENINGS - it creates nothing
#   "make the stair and its opening"
#                                  -> CREATE_STAIRS with cutOpening=true - the
#                                     top slab's own opening, not a shaft

utterances:
  - cut a shaft opening from Level 1 to Roof through all the slabs here
  - add a shaft for the riser at these corners, base Level 0 top Level 6

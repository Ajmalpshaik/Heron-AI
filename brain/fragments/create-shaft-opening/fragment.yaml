# WHY IT EXISTS - a comment, not `purpose`, because `purpose` is searched.
# 2026-11-02: asked for in the modeller's words "cut a shaft opening from
# Level 1 to Roof through all the slabs here" and "add a shaft for the riser
# at these corners, base Level 0 top Level 6" - Revit's Architecture >
# Opening > Shaft. No card cut one: a grep of every fragment's C# that day for
# NewOpening found the host-element, framing and wall calls in CREATE_OPENING
# and the host-element call in CREATE_STAIRS, never the one that takes two
# levels. brain/heron_retrieve.py on the sentences (a scratch store) answered
# SELECT_OPENINGS, a read, and CREATE_STAIRS.
#
# A DIFFERENT CONTRACT, NOT A SECOND TOOL FOR ONE (heron-duplicate-checker's
# method, 2026-11-02). CREATE_OPENING cuts ONE host it is given - a wall, a
# floor, a roof, a ceiling, a beam - with a boundary in that host's plane.
# A shaft has no host: two levels and a plan outline, and Revit cuts every
# floor, roof and ceiling between. Its third API call takes `Level, Level,
# CurveArray`. SELECT_OPENINGS finds shafts already there and makes none;
# CREATE_STAIRS cuts the top slab's own opening over a stair and measured a
# shaft doing nothing there (2026-10-03). Look-alikes, not duplicates.
#
# THE LEVELS ARE NEVER GUESSED (D-33): each by its exact name; a name nothing
# has makes nothing and lists every level with its elevation. A top level not
# above the base is refused naming both.

kind: action
domain: revit.elements
capability: CREATE_SHAFT_OPENING
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Cuts a shaft opening from a base level up to a top level, through every
  floor, roof and ceiling between, from its corners in plan in millimetres -
  three or more, closed back to the first. Both levels by name, never guessed:
  a name no level has makes nothing and lists the levels. A top level that is
  not above the base, two corners in one place and an outline that crosses
  itself are refused by name. Read back: the outline's extent to a millimetre
  and both levels, all or nothing; the slabs it cut, by the volume each lost.

contract:
  needs:
    - name: doc
      type: Document
    # The level the shaft starts at, by its exact name - "Level 1". A NAME,
    # not a bound Level, so a name nothing has can list every level here.
    - name: baseLevel
      type: string
      source: request
    # The level it runs up to - "Roof". Must be above the base.
    - name: topLevel
      type: string
      source: request
    # The outline's corners in plan, in millimetres - "0,0,0; 1200,0,0;
    # 1200,800,0; 0,800,0" - at least three, in order round the shaft; closed
    # back to the first by itself. Their heights are not used: the outline is
    # drawn on the base level.
    - name: corners
      type: IList<XYZ>
      source: request
  provides:
    - name: created
      role: result
      type: ElementId
    - name: openingId
      # The shaft's unique id.
      role: result
      type: string
    - name: built
      # Its levels, height, corners and outline extent - read back.
      role: result
      type: string
    - name: slabsCut
      # The floors, roofs and ceilings whose volume the shaft took out of.
      role: result
      type: IList<ElementId>
    - name: refused
      # Why nothing was cut, in plain words. Empty when a shaft was made (D-52).
      role: accounting
      type: string
    - name: findings
      type: IList<string>


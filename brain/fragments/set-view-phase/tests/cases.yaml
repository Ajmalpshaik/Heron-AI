positive:
  - given: >
      12 floor plans, a valid phaseId for the New Construction phase and a
      valid phaseFilterId for a filter showing previous plus new
    expect: >
      phaseSet holds 12 ids and phaseFilterSet holds 12. Both counts come from
      reading the parameter back after writing, never from having called Set

  - given: the same 12 views run a second time with the same two ids
    expect: >
      alreadySet holds them and phaseSet is empty. Nothing changed because
      nothing needed to, and reporting 12 set on a second run would be
      reporting work that did not happen

  - given: a phaseFilterId given and phaseId left as InvalidElementId
    expect: >
      only the phase filter is written. The phase is not touched and no default
      is invented for it - a default written into the omitted property
      re-phases a whole drawing set

  - given: >
      a mixed selection of 8 plans, 2 schedules and 1 drafting view, both ids
      valid
    expect: >
      the plans take both properties; the schedules take the phase and are not
      counted as refusing a phase filter they never carried; the drafting view
      goes to unsupported. This is the case the two properties are set
      separately for

negative:
  - given: views whose view template controls the Phase Filter
    expect: >
      they appear in templateControlled with a finding naming the fix, and NOT
      in a failure count. The parameter either reads read-only, or the write is
      accepted and reads back unchanged - both are caught, because only the
      read-back catches the second

  - given: a phaseId that is actually the id of a level
    expect: >
      nothing is written at all and a finding says so. Some views accept an
      element id of the wrong kind, and a view pointing at something that is
      not a phase is worse than a view left alone

  - given: >
      somebody who meant "move these walls onto the existing phase" and reached
      this instead, passing views
    expect: >
      the drawings change what they show and NOT ONE WALL MOVES. The model is
      untouched. SET_ELEMENT_PHASE is the other half of that sentence, and
      which one is meant turns on whether "these" are elements or views

  - given: both ids left invalid
    expect: >
      nothing is changed and a finding says nothing was given. Not an error,
      and not a silent success reported as views set

second_route: >
  The Phase and Phase Filter properties on the Properties palette, set one view
  at a time - or applied to many views at once through a view template, which
  is the route that makes this fragment refuse.

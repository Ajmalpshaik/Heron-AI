id: FRG-VIEW-095
semantic-identity: "set the phase and phase filter on these views"
kind: action
domain: revit.views
capability: SET_VIEW_PHASE
version: 1
source: OFFICIAL
risk: MODIFY

purpose: >
  Sets the Phase and the Phase Filter on many views at once - what makes a view
  a demolition plan, an existing plan or a new-work plan.

  **THIS CHANGES WHAT THE DRAWING SHOWS, NOT WHAT THE MODEL CONTAINS, AND THE
  TWO GET CONFUSED CONSTANTLY.** SET_ELEMENT_PHASE moves an element from one
  phase to another - it changes the building. This changes which phase a VIEW
  is looking from, so walls demolished later appear or disappear and nothing in
  the model has moved. Reaching for the wrong one of these is how a request to
  fix a drawing rewrites the construction sequence.

  **THE TWO PROPERTIES ARE SET SEPARATELY BECAUSE THEY FAIL SEPARATELY.** A
  schedule carries a phase and no phase filter; a drafting view and a legend
  carry neither; a view under a template that controls them refuses both. Set
  as one block, a single refusal leaves the other property unset with nothing
  saying which. Each is set on its own and each is counted on its own.

  **A VIEW CONTROLLED BY A TEMPLATE WILL REFUSE, AND THAT IS A REASON RATHER
  THAN A FAILURE.** It is the commonest thing to hit here. The answer is not to
  try harder - it is REPORT_VIEW_TEMPLATE_CONTROL to see what the template
  holds, then change the template or release the property. Those views are
  named in `templateControlled` rather than folded into a failure count.

  **EVERY VALUE IS READ BACK AFTER WRITING.** A view parameter can refuse
  without raising anything, so a count taken from "we called Set" reports views
  changed that were not. The counts here are of values that came back reading
  as asked.

  **AN ID THAT IS NOT A PHASE IS REFUSED BEFORE ANYTHING IS WRITTEN.** Setting
  an element id parameter to an id of the wrong kind is accepted by some views
  and produces a view pointing at nonsense. Both ids are resolved and checked
  first, and if one is wrong nothing is attempted with it.

  **NOTHING GIVEN IS NOTHING TOUCHED.** An invalid id for either property means
  leave that property alone. A fragment that wrote a default into whichever
  property was omitted would re-phase a whole drawing set.

  ASSUMES AN OPEN TRANSACTION and does not open one (Golden Rule 16).

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
    # InvalidElementId means leave that property alone. Resolved ids, never
    # names - matching a phase name is its own job and belongs upstream.
    - name: phaseId
      type: ElementId
      source: request
    - name: phaseFilterId
      type: ElementId
      source: request
  provides:
    - name: phaseSet
      role: result
      type: IList<ElementId>
    - name: phaseFilterSet
      role: result
      type: IList<ElementId>
    - name: alreadySet
      # Elements that were ALREADY in the state asked for, so there was
      # nothing to do. The evidence it looked, never a change it made
      # (D-52).
      role: accounting
      type: IList<ElementId>
    - name: templateControlled
      # Views whose template holds the phase, so they refuse - A REASON RATHER
      # THAN A FAILURE, and the commonest one. Never a view it changed (D-52).
      role: accounting
      type: IList<ElementId>
    - name: unsupported
      # Views that carry no phase or no phase filter at all - a drafting view,
      # a legend. Given and unusable (D-52).
      role: accounting
      type: IList<ElementId>
    - name: findings
      type: IList<string>

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `BuiltInParameter.VIEW_PHASE` and
  `BuiltInParameter.VIEW_PHASE_FILTER`, `Element.get_Parameter(BuiltInParameter)`,
  `Parameter.IsReadOnly`, `Parameter.Set(ElementId)` and
  `Parameter.AsElementId()` are unchanged 2020 to 2027.

  Every id is carried and compared as `ElementId` and none is read as a number,
  so nothing here meets the 2024 widening to 64-bit or the removal of
  `IntegerValue` by 2026.

# ROUTING - repeated in SET_ELEMENT_PHASE, SET_VIEW_PROPERTIES and
# REPORT_VIEW_TEMPLATE_CONTROL.
#
#   "set the phase on these views"        -> here
#   "make this a demolition plan"         -> here - the phase filter is what
#                                            makes it one
#   "show existing only on this view"     -> here
#   "move these walls to the new phase"   -> SET_ELEMENT_PHASE. That one
#                                            changes the BUILDING; this one
#                                            changes what the drawing looks
#                                            from. The sentence "put these on
#                                            the existing phase" means either,
#                                            and the difference is whether
#                                            "these" are elements or views
#   "set the scale on these views"        -> SET_VIEW_PROPERTIES - scale,
#                                            detail level and visual style,
#                                            deliberately not phase
#   "it will not let me change the phase" -> REPORT_VIEW_TEMPLATE_CONTROL
#   "what phases are in this model"       -> REPORT_PHASES

utterances:
  - set the phase on these views
  - change the phase filter on these views
  - make this a demolition plan
  - show existing construction only on this view
  # DECLARED BECAUSE THE TABLE ABOVE ALREADY CLAIMED IT, 2026-09-06. The shorter
  # phrasing resolved to READ_ELEMENT_PHASE, which reads an ELEMENT's phase and
  # changes nothing.
  - show existing only on this view
  - put these views on the new construction phase
  - set the view phase in bulk

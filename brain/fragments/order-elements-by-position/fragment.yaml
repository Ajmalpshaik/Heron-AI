compatibility-note: >
  One implementation for every release. Viewport.GetBoxCenter, LocationPoint,
  LocationCurve, CurveElement.GeometryCurve, Curve.Project and
  IntersectionResult.Parameter, Element.LevelId and Level.Elevation are
  present 2020 through 2027 - read off RevitAPI.xml in the Nice3point
  reference packages for all eight releases on 2026-10-13.


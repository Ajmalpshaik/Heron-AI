#   "number the doors left to right"              -> here, then RENUMBER_SEQUENTIAL
#   "put the viewports in reading order"          -> here, reading
#   "order the rooms clockwise round the core"    -> here, clockwise
#   "number these in the order I picked them"     -> RENUMBER_SEQUENTIAL


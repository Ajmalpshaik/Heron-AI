id: FRG-MEP-015
semantic-identity: "how many separate pieces this system is really in, and which pieces feed from nothing"
kind: action
domain: revit.mep
capability: FIND_SYSTEM_ISLANDS
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Walks a whole set through its connectors and reports how many **separate**
  networks it is actually in - and, the part that matters, which of those
  networks contain no source.

  **A SYSTEM THAT LOOKS LIKE ONE NETWORK ON SCREEN IS VERY OFTEN THREE:** the
  main run, a branch that was copied and never rejoined, and a spur that lost
  its fitting. On the drawing all three read as one system. The air only arrives
  in one of them.

  **IT IS NOT `TRACE_CONNECTIVITY`.** That walks outward from **one** element
  and answers *"what does this reach"*. This partitions the **whole set** and
  answers *"how many pieces is this in"* - a question no single walk can answer,
  because a walk that starts inside the main run never learns the orphaned
  branch exists.

  **AN ISLAND WITH NO SOURCE IS THE FINDING, NOT THE ISLAND COUNT.** Two
  networks is perfectly normal - supply and return are two. A network containing
  no piece of equipment at all is a run connected to nothing that can feed it,
  and that is a defect every time. `sourceless` names them.

  **SIZE IS REPORTED PER ISLAND BECAUSE IT SORTS THE PROBLEM.** A sourceless
  island of two elements is a leftover to delete. A sourceless island of ninety
  is a main run that lost its connection to the plant, and it is the more urgent
  of the two by a wide margin.

  **CONNECTOR JOINS ARE TRUSTED HERE, AND THAT IS A STATED LIMIT.** Revit's own
  `IsConnected` describes intent and has been proven wrong on a real model - two
  ducts can touch perfectly and be joined to nothing. This reports the network
  as Revit believes it, which is exactly right for *"why is the flow not
  calculating"* and wrong for *"is it physically joined"*. For the second
  question the geometry has to be walked instead.

contract:
  needs:
    - name: elements
      type: IList<Element>
    - name: doc
      type: Document
      source: ambient
  provides:
    - name: islandOf
      type: IDictionary<ElementId, int>
    - name: islandSizes
      type: IDictionary<int, int>
    - name: sourceless
      type: IList<int>
    - name: islandCount
      type: int

proof:
  date: '2026-09-07'
  by: Ajmal PS
  model: Snowdon Towers Sample HVAC (9,641 elements), Revit 2024, session 42676
  positive_case: 37 mechanical equipment items selected in Snowdon Towers Sample HVAC - run
    as it would normally be run. returned connectorsOf Func`2, inSet HashSet`1, isSource Func`2,
    islandCount 37, islandOf 37 entry(ies), islandSizes 37 entry(ies), nextIsland 37, sourceCategories
    3 item(s) [OST_MechanicalEquipment, OST_ElectricalEquipment, OST_PlumbingFixtures], sourceless
    0 item(s). inputs came elements from the selection (37). on Snowdon Towers Sample HVAC
  negative_case: "CANNOT COME BACK EMPTY, so proved by TRACKING instead (D-53). find-system-islands\
    \ describes whatever it is given, so no arrangement makes its answer empty. What D-30's\
    \ negative case exists to catch - a fragment that succeeds while doing nothing, or answers\
    \ about a set it was not given - is caught here by the answer following the input exactly\
    \ across 5 different selections:\n\n      28 (28 duct taps) selected -> islandOf 28 entry(ies)\n\
    \      16 (16 spaces) selected -> islandOf 16 entry(ies)\n      4 (4 walls) selected ->\
    \ islandOf 4 entry(ies)\n      12 (12 sheets) selected -> islandOf 12 entry(ies)\n   \
    \   37 (37 mechanical equipment items) selected -> islandOf 37 entry(ies)\n\n    Different\
    \ inputs, exact matches every time. A fragment falling back to the active view, the whole\
    \ model, or a previous run could not do that."
  second_route: NOT ESTABLISHED - no second route was run. D-30 asks for one 'where one exists';
    whether one exists here has not been settled, and a declared absence is not the same as
    none
  fingerprint: 3ee987e2b8f4fc82

revit: ["2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027"]
runtime: [net472, net48, net8.0-windows, net10.0-windows]
tests: tests/

compatibility-note: >
  One implementation for every release. `ConnectorManager`,
  `Connector.AllRefs` and `Connector.IsConnected` are unchanged 2020 to 2027,
  and no units call is made. Equipment is recognised by CATEGORY rather than by
  a type test, because "a source" is three different categories and no single
  class covers them - not because the classes are out of reach. Mechanical,
  Plumbing, Electrical and Structure are all imported by the wrapper, measured
  on 2026-08-31 rather than assumed; only Architecture is not.
#   "put a damper in this duct"          -> PLACE_ACCESSORY_ON_RUN, which
#                                           breaks and rejoins a run on
#                                           purpose. This one finds breaks
#                                           nobody meant

utterances:
  - is this system all connected
  - how many separate pieces is this in
  - which branch is not connected to anything
  - why is the flow not calculating
  - find the disconnected run
  - is there a break in this system

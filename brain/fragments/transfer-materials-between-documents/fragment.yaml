compatibility-note: >
  One implementation for every release. `Material.AppearanceAssetId`,
  `ThermalAssetId`, `StructuralAssetId`, `SurfaceForegroundPatternId`,
  `SurfaceBackgroundPatternId`, `CutForegroundPatternId`,
  `CutBackgroundPatternId`, `Color` and `Transparency` were read off the
  SHIPPED 2020 and 2024 assemblies and are identical at both ends. **The
  pre-2019 spelling `SurfacePatternId` is absent from BOTH** - it was checked
  for rather than assumed gone, because a property that vanished before the
  supported range still gets written from memory. No ElementId is turned into
  an int anywhere; ids are compared with `ElementId.InvalidElementId`.

# ROUTING - the same rows are in the fragments named here.
#
#   "bring the materials over from the     -> here
#    template"
#   "make a material called X"             -> CREATE_MATERIAL, made rather
#                                             than moved
#   "swap this material for that one"      -> REPLACE_MATERIAL, inside ONE
#                                             project
#   "what material is this"                -> READ_ELEMENT_MATERIAL
#   "which materials are unused"           -> FIND_UNUSED_MATERIALS
#   "bring the line styles over"           -> TRANSFER_LINE_STYLES_BETWEEN_DOCUMENTS
#   "bring the view filters over"          -> TRANSFER_VIEW_FILTERS_BETWEEN_DOCUMENTS

utterances:
  - bring the materials over from the template
  - copy the materials from the other project
  - transfer the materials from that model
  - get the materials from last job

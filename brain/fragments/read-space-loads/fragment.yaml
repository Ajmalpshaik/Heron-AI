id: FRG-MEP-011
semantic-identity: "the heating and cooling load and the airflow on these spaces - typed, calculated and actual, and which have no design figure"
kind: filter
domain: revit.mep
capability: READ_SPACE_LOADS
version: 2
source: OFFICIAL
risk: READ

purpose: >
  Reports each MEP Space's heating load, cooling load and supply airflow, and
  says for each figure whether Revit CALCULATED it or somebody typed it in.

  **Design and calculated are different numbers and Revit keeps both.** The
  calculated one comes from the heating and cooling analysis; the design one is
  what a person entered, and it overrides. A space where they disagree is
  either a deliberate design decision or an analysis nobody re-ran, and telling
  them apart is the whole value of reading this rather than reading one
  parameter.

  **A zero is not an answer, it is a question.** A space with no load usually
  means the analysis has never been run, or the space is unbounded and has no
  volume to load. Reporting `0 W` as a result would put a real number-shaped
  answer in front of somebody sizing equipment from it.

  **Typed, calculated and actual airflow, apart (version 2, 2026-11-01).**
  REPORT_SPACE_AIRFLOW was merged into this card and is DEPRECATED. Each space
  now also gives its SPECIFIED supply, return and exhaust airflow - what was
  typed - and its ACTUAL supply, return and exhaust, the sum Revit gives of
  what the space's terminals carry, in litres per second. `noDesignFigure`
  names the spaces with no typed airflow of any kind: zero against zero reads
  as balanced, and those are the rooms nobody has designed yet. A calculated
  supply is reported as calculated, in `calculatedSupplyLs`, and is never
  counted as the design target. `unplaced` names a space with no area - in
  the schedule, not in the model - and nothing is read from it.

  **It reads Spaces, not Rooms.** A Room carries no load - loads are the MEP
  half, and a model with rooms and no spaces answers nothing here. PLACE_ROOMS
  is what fixes that.

contract:
  needs:
    - name: doc
      type: Document
    - name: elements
      type: IList<Element>
  provides:
    - name: findings
      type: IList<string>
    - name: heatingW
      role: result
      type: IDictionary<ElementId, double>
    - name: coolingW
      role: result
      type: IDictionary<ElementId, double>
    - name: airflowLs
      role: result
      type: IDictionary<ElementId, double>
    - name: notSpaces
      # Rooms handed in where Spaces were needed. *A Room carries no load -
      # loads are the MEP half*, so these could not be asked at all. Given and
      # unusable.
      role: accounting
      type: IList<ElementId>
    - name: noLoad
      # *A ZERO IS NOT AN ANSWER, IT IS A QUESTION* - a space with no load
      # usually means the analysis was never run. The finding somebody has to
      # act on, and the reason reporting the three figures alone would
      # mislead.
      #
      # ALL OF WHICH IS TRUE, AND STILL MAKES IT ACCOUNTING. It counts spaces
      # this fragment COULD NOT READ, and D-52 is about exactly that: a refusal
      # count is never evidence something was found. `accounting` does not mean
      # unimportant - `notSpaces` beside it is equally worth acting on and has
      # always carried it; it means the judge may not read it as work done.
      #
      # Measured 2026-09-13, and it was one signature away from mattering: the
      # draft's positive case read 5 spaces and returned `heatingW 0`,
      # `coolingW 0`, `airflowLs 0` - nothing at all - while `noLoad 5` carried
      # it past every check and left it READY TO SIGN. Proving the fragment
      # works needs a model whose spaces have been analysed; Snowdon's have not.
      role: accounting
      type: IList<ElementId>
    # VERSION 2 (2026-11-01), from REPORT_SPACE_AIRFLOW. Every airflow in
    # litres per second, keyed by the space - the exact ft3 to L conversion.
    - name: specifiedSupplyLs
      # The TYPED design supply airflow - Specified Supply Airflow. Never a
      # calculated figure.
      role: result
      type: IDictionary<ElementId, double>
    - name: calculatedSupplyLs
      # The supply airflow the heating and cooling analysis gave. Reported
      # apart, never as the design target.
      role: result
      type: IDictionary<ElementId, double>
    - name: specifiedReturnLs
      role: result
      type: IDictionary<ElementId, double>
    - name: specifiedExhaustLs
      role: result
      type: IDictionary<ElementId, double>
    - name: actualSupplyLs
      # What the terminals connected to the space carry - Revit's own Actual
      # Supply Airflow, read, never recomputed.
      role: result
      type: IDictionary<ElementId, double>
    - name: actualReturnLs
      role: result
      type: IDictionary<ElementId, double>
    - name: actualExhaustLs
      role: result
      type: IDictionary<ElementId, double>
    - name: noDesignFigure
      # Spaces with no TYPED airflow of any kind - supply, return and exhaust
      # all zero. A space nobody has designed reads as balanced because zero
      # matches zero; this is the list a coordinator acts on. A result, as
      # REPORT_SPACE_AIRFLOW declared it.
      role: result
      type: IList<ElementId>
    - name: unplaced
      # Spaces with no area - in the schedule, not in the model. Named, and
      # nothing read from them. A fault in the model, so a result, as
      # REPORT_SPACE_AIRFLOW declared it.
      role: result
      type: IList<ElementId>


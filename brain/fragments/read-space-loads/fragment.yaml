compatibility-note: >
  `Space.DesignHeatingLoad`, `CalculatedHeatingLoad`, `DesignCoolingLoad`,
  `CalculatedCoolingLoad`, `DesignSupplyAirflow` and `CalculatedSupplyAirflow`
  are unchanged 2020 to 2027 - read off the reference assemblies at both ends
  rather than remembered. `Space` lives in `Autodesk.Revit.DB.Mechanical`, which
  the wrapper already carries.

# THE UNITS ARE NOT THE SAME KIND OF CERTAIN, AND THE DIFFERENCE MATTERS.
#
#   AIRFLOW  is exact arithmetic and provable on paper. Revit stores cubic feet
#            per second; 1 ft = 0.3048 m EXACTLY by the definition of the
#            international inch, so 1 ft3 = 28.316846592 L exactly. That is the
#            same class of conversion as D-20's 304.8 and needs no model.
#
#   LOAD     is NOT. Revit's internal unit for an HVAC load is a power, and
#            which power unit it is has to be established against a real Revit -
#            the factor used here assumes British thermal units per second and
#            converts at 1055.05585262 W, which is the IT definition. If that
#            assumption is wrong every load is out by a constant factor, which
#            is the most dangerous shape of error: every number looks plausible
#            and every comparison between them still works.
#
# SO THE FIRST THING TO CHECK AGAINST A REAL MODEL IS ONE KNOWN LOAD, against
# what Revit shows on screen for the same space. It is written into the test
# cases as the first negative, not asserted here as if it were settled.

# 2026-11-01 - REPORT_SPACE_AIRFLOW WAS MERGED INTO THIS CARD (version 2) on
# the owner's instruction ("make sure there is no duplicate tools"), and is
# DEPRECATED. The same reading: an MEP Space's airflow, design against what is
# there. Where its outputs are now, in L/s here where it kept Revit's internal
# ft3/s: designSupply -> specifiedSupplyLs, designReturn -> specifiedReturnLs,
# designExhaust -> specifiedExhaustLs, actualSupply -> actualSupplyLs,
# actualReturn -> actualReturnLs, actualExhaust -> actualExhaustLs;
# noDesignFigure and unplaced by the same names. Added in version 2:
# calculatedSupplyLs, beside the typed figure rather than in place of it.
#
# THE CONFLICT, AND THE SAFER RULE KEPT: this card's `airflowLs` takes the
# calculated supply where nothing was typed; REPORT_SPACE_AIRFLOW's design
# figure was the typed one only. Both stand, apart: `airflowLs` as version 1
# gave it, saying "entered" or "calculated" in the finding, and the design
# target - `specifiedSupplyLs`, `noDesignFigure` - from typed figures alone,
# so a calculated figure is never counted as the target silently. Its Rooms
# were skipped with no row; here they are named in notSpaces, as before.

# ROUTING - repeated in PLACE_ROOMS, READ_ROOM_GEOMETRY and CREATE_HVAC_ZONE.
#
#   "what is the heating load"       -> here
#   "which spaces have no design airflow" -> here, noDesignFigure
#   "is the supply air balanced"     -> here - specified against actual
#   "what is the cooling load"       -> here
#   "how much air does this space need" -> here
#   "what is the total airflow"      -> here
#   "how big is this room"           -> READ_ROOM_GEOMETRY - area and volume,
#                                       no load involved
#   "the spaces are missing"         -> PLACE_ROOMS. Nothing here can report a
#                                       load on a space that does not exist
#   "what is the cooling load of this space", "what are the loads on these
#   spaces"                          -> here - a question, read from what the
#                                       spaces hold; nothing is run. On the
#                                       keyword route alone
#                                       RUN_HEATING_COOLING_LOADS ranks first
#                                       for these, and for "what is the
#                                       heating load" and "what is the cooling
#                                       load"; identity answers all four here
#   "run the heating and cooling loads", "calculate the HVAC loads for this
#   model", "run the loads analysis and show the cooling load per space"
#                                    -> RUN_HEATING_COOLING_LOADS (2027
#                                       only) - runs Revit's analysis, then
#                                       reads the calculated loads back


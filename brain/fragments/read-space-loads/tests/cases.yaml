positive:
  - given: 12 spaces with the heating and cooling analysis run
    expect: >
      12 rows, each naming the load and the airflow AND whether Revit calculated
      the figure or somebody typed it. A design figure that disagrees with the
      calculated one is either a decision or a stale analysis, and the row has to
      let somebody tell which

  - given: a space where the design airflow was entered by hand at 250 L/s
    expect: 250 L/s reported and marked "entered", not the calculated figure it overrides

  # VERSION 2 (2026-11-01), from REPORT_SPACE_AIRFLOW. Each FAILS on version
  # 1, which read no specified return or exhaust and no actual figure.
  - given: spaces with design supply, return and exhaust airflows typed, served by air terminals with flows
    expect: >
      specifiedSupplyLs, specifiedReturnLs and specifiedExhaustLs matching the
      Specified airflows in the Properties palette, and actualSupplyLs,
      actualReturnLs and actualExhaustLs matching Revit's Actual airflows, all
      in L/s - one space checked by eye against a Space schedule

  - given: a space with no supply typed but a calculated supply from the analysis
    expect: >
      airflowLs the calculated figure, marked "calculated"; calculatedSupplyLs
      the same; specifiedSupplyLs 0 - the calculated figure is NOT taken as the
      design target, and if return and exhaust are also untyped the space is
      in noDesignFigure

  # Row 5b-323, added 2026-11-11 with version 3. NOT RUN - NEEDS-CHECKING
  # Group NK, NK3. Version 2 answered "NO LOAD READABLE" here.
  - given: >
      a placed, bounded Space whose Design Heating Load, Design Cooling Load
      and Specified Supply Airflow were typed, in a model where Revit's own
      Heating and Cooling Loads analysis has never run
    expect: >
      heatingW, coolingW and airflowLs each hold the typed figure for it,
      marked "entered" - the same numbers the Properties palette shows; it is
      NOT in noLoad; no entry in calculatedSupplyLs; and its finding names the
      calculated figures Revit refused

  - given: >
      the same model, a Space with ONLY a Design Cooling Load typed
    expect: >
      coolingW holds it, "entered"; heating and supply read NOT COMPUTED with
      no entry in heatingW or airflowLs - a refused figure is never a zero

negative:
  # Row 5b-323, added 2026-11-11 with version 3. NOT RUN - Group NK, NK3.
  - given: >
      the same model, a Space with NO load or airflow typed
    expect: >
      its id in noLoad, "NO LOAD READABLE" or "NO LOAD", and no entry in
      heatingW, coolingW or airflowLs - guarding each figure on its own must
      not turn a space with nothing to report into a row of zeros

  - given: ANY space with a known load, checked against what Revit shows on screen
    expect: >
      THE SAME NUMBER - and this is the FIRST case to run against a real model.
      The airflow conversion is exact arithmetic and provable on paper. THE LOAD
      CONVERSION IS ASSUMED: Revit's internal HVAC power unit is taken to be
      BTU/s and converted at 1055.05585262 W, and reflection over the assembly
      shows a property type, never a unit. If that is wrong every load is out by
      a constant factor - each number looks plausible, every comparison between
      spaces still works, and only somebody sizing a real chiller finds out

  - given: a space with nothing run against it
    expect: >
      reported as NO LOAD, not as "0 W". A zero here means the analysis has
      never run or the space is unbounded, and a number-shaped non-answer in
      front of somebody sizing equipment is worse than no answer

  - given: Rooms handed in instead of Spaces
    expect: >
      they go to `notSpaces` and nothing is reported. A Room carries no load;
      PLACE_ROOMS is what puts Spaces in the model

  # VERSION 2 (2026-11-01), from REPORT_SPACE_AIRFLOW.
  - given: A SPACE WITH NO TYPED AIRFLOW AT ALL, and no terminals in it
    expect: >
      its id in noDesignFigure, and its finding saying no design airflow was
      typed. Zero against zero would pass a balance check - the case
      REPORT_SPACE_AIRFLOW existed for

  - given: a RETURN-ONLY space, a typed return and no typed supply
    expect: NOT in noDesignFigure - a zero supply is correct for it

  - given: an UNPLACED space, in the schedule but not in the model
    expect: >
      its id in unplaced, a finding saying so, and NO entry in any figure -
      not in noLoad either. Version 1 sent it to noLoad as "no load readable"

second_route:
  - Revit's own Space properties, or a Space schedule with load and airflow columns, read for the same space

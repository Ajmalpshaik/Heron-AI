id: FRG-DOC-018
semantic-identity: "which families are making this model slow, measured rather than guessed"
kind: action
domain: revit.document
capability: REPORT_GEOMETRY_COMPLEXITY
version: 1
source: OFFICIAL
risk: READ

purpose: >
  Measures how much geometry each family TYPE actually carries - as a triangle
  count, at every detail level - and ranks the types by what they cost the model
  once their instances are counted. The answer to *"the model has got heavy and
  nobody knows why"*, and the check to run on a downloaded manufacturer family
  before it enters the library. It changes nothing.

  **TRIANGLES, NOT FILE SIZE, BECAUSE DRAWING IS WHAT COSTS.** A family's file
  size says what it weighs on disk. What slows Revit down is what it has to
  DRAW: every face of every solid, tessellated into triangles, for every
  instance in every open view. `Face.Triangulate().NumTriangles` is that number
  directly. A cast-in sleeve with a modelled thread can carry more triangles
  than an air handling unit, and neither its name nor its size hints at it.

  **MEASURED PER TYPE AND MULTIPLIED BY THE INSTANCES, WHICH IS THE WHOLE
  POINT.** Geometry belongs to the type, so four hundred instances of a
  twelve-thousand-triangle family is 4.8 million triangles from ONE library
  choice. The type's own count is not what hurts; the product is, and the
  ranking is on the product.

  **ALL THREE DETAIL LEVELS ARE MEASURED, BECAUSE THE COMPARISON IS THE
  ACTIONABLE PART.** A family reading 40 triangles coarse and 40,000 fine is
  BEHAVING - it has proper detail-level control and costs nothing on a working
  plan. A family with the same large number at all three has none, and pays full
  price in every view. That gap says whether to fix the family or replace it,
  and one number alone says neither.

  **IT IS A COMPARISON, NOT A SCORE, AND THE READ-BACK SAYS SO.** Revit's
  tessellation is what it decides at the moment of asking, not a stored
  property. The numbers rank families against each other honestly and mean
  nothing as absolutes, so no threshold is built in and none should be read into
  them.

  **A TYPE THAT COULD NOT BE MEASURED IS NAMED, NEVER SCORED ZERO.** A family
  whose geometry does not come back - a face-hosted void, a corrupt type, a
  category whose geometry is view-specific - is listed as unmeasured. Reporting
  it as zero would put the heaviest thing in the model at the bottom of the
  ranking and read as good news.

  **THE COST OF ASKING IS REAL AND IS CAPPED.** Reading geometry three times per
  distinct type is genuine work, so `maxTypes` stops a whole-model run running
  away, and the summary says how many types were left unmeasured by the cap
  rather than quietly truncating the ranking.


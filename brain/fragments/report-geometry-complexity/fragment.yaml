compatibility-note: >
  One implementation for every release. `Options`, `Options.DetailLevel`,
  `ViewDetailLevel`, `Element.get_Geometry`, `GeometryElement`,
  `GeometryInstance.GetInstanceGeometry`, `Solid.Faces`, `Face.Triangulate` and
  `Mesh.NumTriangles` are present and unchanged 2020 through 2027.

  `ElementId` is used only as a dictionary key and compared to other
  `ElementId`s - never read as a number, so the 2024 widening to 64-bit does not
  reach this fragment.

  No units API is called: a triangle count is a count, and the one length here
  is never converted.

  `Options.ComputeReferences` is left off deliberately. References cost time and
  this fragment measures rather than picks.

# ROUTING - the same rows are in the fragments named here.
#
#   "why has this model got so heavy"    -> here, for the GEOMETRY half of that
#                                           question. Warnings, links and
#                                           purge-able types are the other half
#   "which family is the heavy one"      -> here. Ranked on triangles x
#                                           instances, not on file size
#   "is this downloaded family any good" -> here, before it goes in the library.
#                                           The coarse-to-fine gap is the answer
#   "what warnings is this model carrying"-> READ_MODEL_WARNINGS
#   "which families are not used"        -> FIND_UNUSED_FAMILIES - a different
#                                           kind of weight, and cheaper to fix
#   "how big is this element"            -> REPORT_BOUNDING_BOX for its extent,
#                                           MEASURE_ELEMENT_VOLUME for its
#                                           volume. Neither says what it costs
#                                           to draw
#   "how many of these are there"        -> COUNT_ELEMENTS
#   "check this family before i load it" -> here, and READ THIS ROW. Ranked on
#                                           2026-09-06 that sentence resolves to
#                                           LOAD_FAMILY, which is a MODIFY - the
#                                           fragment that DOES the thing the
#                                           sentence asks to check first. The
#                                           exact phrasing is served here by
#                                           identity; a paraphrase of it is not,
#                                           and that is the dangerous direction

utterances:
  - which families are making this model slow
  - why has this model got so heavy
  - find the heaviest families in the model
  - how much geometry does this family carry
  - is this manufacturer family too detailed
  - which family should i replace to speed this up
  - check this family before i load it

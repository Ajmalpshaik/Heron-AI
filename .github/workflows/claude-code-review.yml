name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
# One review per pull request at a time. Without this, two pushes a few
# seconds apart started two full reviews of the same PR (2026-11-11, two runs
# on report-family-2d-elements at 09:34), each spending the owner's Claude
# allowance. A newer push cancels the review of the older one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    # A draft is still being written: it is reviewed when it is marked ready
    # (ready_for_review above). Dependabot's pull requests get no secrets, so
    # a review there could only fail.
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The code-review command reads the PR with gh, runs helper agents
          # (Task) and posts its summary with `gh pr comment` - all must be
          # allowed, or it stops in seconds with nothing posted (2026-11-11,
          # PR #842). The list follows the action's own pr-review example.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Task,Read,Glob,Grep"'

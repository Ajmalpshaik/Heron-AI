name: Fragment or skill proposal
description: Propose a reusable capability for the Heron knowledge base
labels: ["fragment", "knowledge"]
body:
  - type: markdown
    attributes:
      value: |
        Read [docs/09-skills-and-fragments.md](../../docs/09-skills-and-fragments.md) first.

        **Skill** = what the user can ask for, in BIM language.
        **Fragment** = how it is done — a reusable implementation unit shared across many skills.

        **Search existing fragments before proposing.** Golden Rule 3: reuse proven knowledge before creating new.

  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - "Skill — a capability the user asks for"
        - "Fragment — a reusable implementation unit"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: Proposed name
      placeholder: "e.g. Select Elements By Category"
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: One or two sentences. What it does, and why it is worth having.
    validations:
      required: true

  - type: textarea
    id: io
    attributes:
      label: Inputs and expected output
      value: |
        **Inputs:**

        **Expected output:**
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Revit versions it supports
      description: Only list versions you have actually tested. Declared-but-untested is not accepted.
      placeholder: "e.g. tested on 2022 and 2025"
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      options:
        - "READ — observes only"
        - "ANALYZE — computes over what it read"
        - "SUGGEST — proposes a change without applying it"
        - "EXECUTE — non-destructive action (selection, view)"
        - "MODIFY — changes the model"
    validations:
      required: true

  - type: textarea
    id: existing
    attributes:
      label: Existing fragments you checked
      description: Which ones you searched for and why they did not fit.
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: This contains no client data, no real project models, and no credentials
          required: true
        - label: I have tested this on the Revit versions listed above
          required: true

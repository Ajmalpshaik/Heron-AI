# PLAIN QUESTIONS A MODELLER ASKS, FROZEN - AND THE READ EACH ONE SHOULD REACH.
#
# Read by tools/score-routing.py, which asks every question through the same
# function heron_lookup uses - beside the owner's own questions in
# owner-questions.yaml - and says whether the answer READS the model or
# CHANGES it. Held honest by tests/test_score_routing.py.
#
# WHERE THE QUESTIONS CAME FROM. FRAGMENT-ISSUES rows 5b-477 and 5b-478
# (docs/fragment-issues/section-5b-rows-401-425.md), "The 60, frozen:" in
# each. The gap-pass session wrote them on 2026-10-14 BEFORE it read any
# card, and asked them through heron_retrieve.find on private stores, on the
# trained backend. Until 2026-10-17 they lived only inside that row text,
# which no tool reads. They were copied here by a script that splits the row
# text on its separator - never retyped - in the rows' order: n 1-60 are row
# 477's, n 61-120 are row 478's.
#
# n 121 ON ARE ROW 5b-1005's, "The four, frozen:" in it. Ajmal PS listed them
# on 2026-10-17 as sentences measured on 2026-10-14 with the Revit 2020
# filter, and asked for these four - the questions among eight - to join this
# set. For #124 row 5b-465 records that he asked "how many sets are there" and
# this is the wording heron_lookup was given; for the other three the record
# does not say who worded them. They are not in owner-questions.yaml.
#
# THEY ARE A SESSION'S WORDS, NOT THE OWNER'S. owner-questions.yaml is his;
# this is not, and its numbers are never mixed with his.
#
# EVERY ONE IS A QUESTION, so the headline is not a judgement call: a question
# answered by something at or above the write line - read from the operation
# registry, never typed here - is D-86's harm, whatever else is true.
#
# WHERE AN ANSWER IS NAMED, it is the read the row itself names, and nothing
# else. Rows that name none carry no `answer` and are scored on read against
# write alone. `named` says how the row put it:
#   declared     the row declared the sentence on that read (PRs #534, #535)
#   ranked       the row says that read answers it by ranking, undeclared
#   owners-call  "a PROVEN read answers it, so declaring there is the
#                owner's call" - the read is named. He ruled on 2026-10-17:
#                23 of the 24 are declared on their reads; "which elements
#                are on the wrong workset" is not, because no tool judges
#                "wrong". `corrections` lists the answers his word changed
#   no-read      "no read was found that answers it" - no answer is named, and
#                none may be: the rows forbid declaring a sentence on a read
#                that does not answer it
# An answer is a LIST where the row names more than one read; any of them
# counts.
#
# WHAT MAY NEVER HAPPEN TO THIS FILE (FRAGMENT-ISSUES row 113, D-34, D-86):
#   * a question reworded to suit the search
#   * an answer changed to match what the search returns
#   * an utterance added to a fragment, or weakened, to win a row
# An answer is added or changed only on the owner's word, or because the row
# it came from changed, with the day it happened. The scorer fingerprints the
# questions and answers together, so a run after any change says it is not
# comparable with the runs before it.


# ROUTING SENTENCES FROZEN 2026-11-26, BEFORE ANY CARD WAS EDITED - row 5b-1878 (A),
# issue #1088. Read by tools/score-routing.py --sentences, main against the branch.
# Never reworded to buy back a rank: a sentence here is the instrument.
# Every utterance and routing-row sentence of CHECK_VERTICAL_CLEARANCE and
# CHECK_MINIMUM_CLEARANCE, each wanting the keeper; and the sleeve and opening
# cards' own words, which this change also edits (v3 of each).
groups:
  - group: vertical clearance (retired into the keeper)
    expect: want CHECK_MINIMUM_CLEARANCE
    sentences:
      - how much room is there between the duct and the pipe above it
      - which services are stacked too close together
      - is there enough vertical space between the services
      - check the vertical clearance between the services
      - will the hangers fit between these two
      - how much room above that duct
  - group: minimum clearance (the keeper)
    expect: want CHECK_MINIMUM_CLEARANCE
    sentences:
      - is anything too close to the ducts
      - check the clearance between services
      - what is within 100 mm of these
      - clearance check
      - are the services too close together
      - check the gap to the structure
      - what is too close to what
      - check the clearance with the insulation on
      - is there enough room once these are lagged
      - clearance to the outside of the insulation
      - these read clear but both pipes are insulated
      - will these fit with 50mm lagging
      - insulation aware clearance check
      - the gap is not big enough once it is insulated
  - group: sleeve size
    expect: want CHECK_SLEEVE_SIZE
    sentences:
      - are the sleeves big enough for the pipes going through
      - check the sleeves against what goes through them
      - is the hole the right size for that duct
      - check the sleeve sizes
      - are my sleeves oversized
  - group: propose openings
    expect: want PROPOSE_MEP_OPENINGS
    sentences:
      - where do the services need holes
      - propose openings for these ducts
      - what penetrates these walls and how big
      - list the sleeves needed
      - propose the sleeves
      - propose openings for the ducts
      - where do I need holes
  - group: neighbours that must stay where they are
    sentences:
      - say: put all these at the same height
        expect: want ALIGN_ELEMENTS
      - say: how high is the ceiling
        expect: want MEASURE_CEILING_HEIGHT
      - say: what is above this duct
        expect: want PROBE_AROUND_ELEMENTS
      - say: do these overlap
        expect: want FIND_CLASHES
      - say: which of my openings are wrong now the ducts have moved
        expect: want AUDIT_MEP_OPENINGS
      - say: is there enough space in front of the panel to open the door
        expect: want CHECK_EQUIPMENT_CLEARANCE

# ROUTING SENTENCES FROZEN 2026-11-21, BEFORE ANY CARD WAS EDITED - the
# sentences of the rows still open in GitHub issues #954, #955, #956, #958 and
# #1127 (rows 176, 158, 5b-477, 5b-478, 5b-396, 5b-224, 5b-246, 5b-321, 5b-337,
# 5b-346, 5b-496, 5b-1882, 5b-1924), with held-out paraphrases written the
# same day, before any card was read for wording, and guards for the writes
# next to them.
#
# Read by tools/score-routing.py --sentences. Measured in a cloud container,
# origin/main against the branch. OWED ON THE OWNER'S PC, which ranks
# model since D-201 removed the re-ranker
# (2026-11-26; it was model+rerank when this was frozen):
#
#   python tools/score-routing.py --sentences tests/data/routing-sentences-2026-11-21-round4.yaml \
#       --backend model
#
# Each row's own sentence is quoted from its row; a group marked HELD OUT is
# this session's words, never declared on a card. A sentence of
# tests/test_routing_phrases.py is that suite's, and is never declared word for
# word (the suite refuses it). Never reworded to buy back a rank.
